{\"A\":\"Three separate jobs, because Spark launches one job per action, and each job is then broken into stages and tasks that run on the executors.\",\"B\":\"One job, because Spark batches every action in a script into a single job that only starts once the driver reaches the end of the file.\",\"C\":\"Three jobs, but only the two write actions actually launch tasks on executors; `count()` is resolved entirely inside the driver's JVM.\",\"D\":\"Two jobs, because `collect()` and `count()` are lazy aggregation calls that Spark merges into the job triggered by the `write.parquet` action.\",\"E\":\"One job per unique DataFrame lineage, so `df1`, `df2`, and `df3` each contribute to the same job since they share the same SparkSession.\"},\"correct\":\"A\",\"explanation\":\"A. Correct. Each action triggers Spark's lazy-evaluated transformations to actually execute, and the driver submits a distinct job per action, which is then split into stages and tasks.B. Incorrect. Spark does not defer job submission to the end of the script; each action independently triggers its own job as soon as it is called.C. Incorrect. `count()` still requires reading and aggregating the underlying partitions across executors; it is not resolved purely inside the driver without executor work.D. Incorrect. Each action produces its own job in the Spark UI; `collect()` and `count()` are not merged into a job triggered by an unrelated `write.parquet` call on a different DataFrame.E. Incorrect. Job counting is tied to actions, not to shared lineage or a shared SparkSession; three actions on three DataFrames still produce three jobs even under one session.\"},{\"id\":\"2\",\"question\":\"A platform team submits a long-running Spark application to a YARN cluster using `spark-submit`. They want the driver process itself to run on a node inside the cluster so that the application keeps running even if the machine that issued the submit command disconnects. Which deploy mode should they specify?\",\"options\":{\"A\":\"Standalone mode\",\"B\":\"Interactive mode\",\"C\":\"Client mode\",\"D\":\"Cluster mode\",\"E\":\"Local mode\"},\"correct\":\"D\",\"explanation\":\"A. This is incorrect because this term refers to Spark's built-in cluster manager, not to a deploy mode that controls where the driver process runs.B. This is incorrect because this is not a recognized Spark deploy mode; the deploy mode options control driver placement, not an interactive session type.C. This is incorrect because in this mode the driver runs on the machine that issued the submit command, so the application would stop if that machine disconnected.D. This is correct because this deploy mode launches the driver process on a node inside the cluster itself, so the application continues running independently of the machine that originally issued the submit command.E. This is incorrect because this mode runs the driver and executors within a single JVM on one machine and is not used for submitting a job to a YARN cluster.\"},{\"id\":\"3\",\"question\":\"A developer is reviewing this notebook cell to understand which lines actually trigger a Spark job:\\n```python\\ndf1 = spark.read.parquet(\\\"/data/raw\\\")\\ndf2 = df1.withColumn(\\\"year\\\", F.year(\\\"event_time\\\"))\\ndf3 = df2.filter(df2.year == 2026)\\ntotal = df3.count()\\ndf3.write.mode(\\\"overwrite\\\").parquet(\\\"/data/2026\\\")\\n```\\nChoose 2 answers: which two lines trigger the execution of a Spark job?(Select 2)\",\"options\":{\"A\":\"`df2 = df1.withColumn(\\\"year\\\", F.year(\\\"event_time\\\"))`, because adding a derived column requires Spark to immediately materialize the new column's values.\",\"B\":\"`df3 = df2.filter(df2.year == 2026)`, because filtering rows is treated as an action in Spark and therefore executes a job as soon as the line runs.\",\"C\":\"`total = df3.count()`, because `count()` is an action that forces Spark to execute the accumulated transformations and return a value to the driver.\",\"D\":\"`df3.write.mode(\\\"overwrite\\\").parquet(\\\"/data/2026\\\")`, because writing output is an action that forces Spark to execute the transformation chain and materialize files.\",\"E\":\"`df1 = spark.read.parquet(\\\"/data/raw\\\")`, because reading a file eagerly loads all of its records straight into the driver's memory before any transformation can even be defined.\"},\"explanation\":\"A. `withColumn()` is a transformation, not an action; it lazily extends the logical plan with a new column expression without materializing any values at this point.B. `filter()` is a transformation, not an action; row filtering is recorded in the plan and only executes once a downstream action like `count()` or `write()` runs.C. This is correct: `count()` is a classic action that returns a value to the driver, forcing Spark to execute the read, column addition, and filter that precede it in the lazy plan.D. This is also correct: writing to storage is an action, so this line triggers its own job that executes the full transformation chain again to produce and persist the output files.E. `spark.read.parquet()` only builds a logical plan describing the source; it does not eagerly load records into driver memory, so this line alone does not trigger a job.\",\"multi\":true,\"correctAnswers\":[\"C\",\"D\"],\"multiSelect\":true},{\"id\":\"4\",\"question\":\"Which two statements about `coalesce()` are correct? (Choose 2 answers)(Select 2)\",\"options\":{\"A\":\"`coalesce()` can only decrease a DataFrame's partition count and can never raise it beyond however many partitions already exist.\",\"B\":\"`coalesce()` avoids a full shuffle by combining existing partitions on the same executor, moving less data than `repartition()`.\",\"C\":\"`coalesce()` always redistributes rows evenly across the resulting partitions, matching the guarantees that `repartition()` provides.\",\"D\":\"`coalesce()` triggers a full shuffle across the cluster identical to calling `repartition()` with the same target partition count.\",\"E\":\"`coalesce()` recalculates the DataFrame's schema, dropping any columns that a subsequent action does not reference anywhere downstream.\"},\"explanation\":\"$e\",\"multi\":true,\"correctAnswers\":[\"A\",\"B\"],\"multiSelect\":true},{\"id\":\"5\",\"question\":\"A retail company runs separate Hadoop MapReduce jobs for nightly ETL, a dedicated SQL engine for analyst reporting, and a standalone cluster for demand-forecasting models, and wants to consolidate onto one platform without losing performance. Which advantage of Apache Spark most directly supports this consolidation?\",\"options\":{\"A\":\"Spark rewrites every submitted job into a MapReduce-compatible execution plan, so the existing Hadoop tooling keeps running unmodified while it still gains in-memory execution speed.\",\"B\":\"Spark enforces schema-on-write for every file format it reads, which removes the analyst reporting layer because raw files become query-ready without any engine.\",\"C\":\"Spark bundles a built-in charting dashboard that replaces the reporting tool entirely, so analysts no longer need a separate SQL engine to produce reports.\",\"D\":\"Spark's cluster manager provisions a dedicated GPU pool automatically whenever a machine learning job is submitted, replacing the standalone forecasting cluster.\",\"E\":\"Spark exposes a unified engine where Spark SQL, DataFrames, Structured Streaming, and MLlib share the same execution model, so ETL, reporting, and forecasting run on one cluster.\"},\"correct\":\"E\",\"explanation\":\"$f\"},{\"id\":\"6\",\"question\":\"A data engineer runs the following code in a Databricks notebook cell:\\n```python\\ndf = spark.read.parquet(\\\"/mnt/sales/transactions\\\")\\nfiltered = df.filter(df.amount \u003e 1000)\\ngrouped = filtered.groupBy(\\\"region\\\").sum(\\\"amount\\\")\\n```\\nNo further code is executed in this cell. What happens when this cell finishes running?\",\"options\":{\"A\":\"Spark raises a runtime error when the cell finishes executing because `grouped` was never assigned to an action, leaving the driver unable to resolve an incomplete DataFrame plan.\",\"B\":\"Spark reads the Parquet file's footer statistics to execute the filter eagerly, but defers only the final `groupBy` aggregation until an action is later called.\",\"C\":\"No Spark job is submitted to the cluster; Spark only records `filtered` and `grouped` as logical plans built on top of `df`, since every call in the cell is a transformation.\",\"D\":\"Spark submits one job that reads the Parquet files and applies the filter, then submits a second job later to compute the grouped sum once that first job finishes.\",\"E\":\"Spark submits a single job immediately because `groupBy` is a wide transformation that always forces materialization of its parent DataFrame to build shuffle partitions.\"},\"correct\":\"C\",\"explanation\":\"$10\"},{\"id\":\"7\",\"question\":\"A developer wants to chain a `StringIndexer` that encodes a categorical `category` column and a `LogisticRegression` estimator into a single reusable workflow that can be fit on training data and later applied consistently to new data:\\n```python\\nindexer = StringIndexer(inputCol=\\\"category\\\", outputCol=\\\"categoryIndex\\\")\\nlr = LogisticRegression(featuresCol=\\\"features\\\", labelCol=\\\"label\\\")\\n```\\nWhich snippet correctly builds and fits that workflow?\",\"options\":{\"A\":\"`model = Pipeline(indexer, lr).fit(train_df)`, which passes the stages as separate positional arguments instead of the required `stages` keyword list, so this raises a `TypeError`.\",\"B\":\"`pipeline = Pipeline(stages=[indexer, lr])`\\n`model = pipeline.fit(train_df)`, which chains both stages in order and trains them together with one `fit()` call.\",\"C\":\"`model = lr.fit(indexer.fit(train_df))`, which passes a fitted `StringIndexerModel` object into `lr.fit()` instead of the transformed DataFrame of features that estimator expects.\",\"D\":\"`model = [indexer, lr].fit(train_df)`, which calls `.fit()` on a plain Python list, and a list has no such method, so this raises an `AttributeError`.\",\"E\":\"`model = lr.fit(train_df, transformers=[indexer])`, which passes a `transformers` keyword that `LogisticRegression.fit()` does not accept, so this raises a `TypeError`.\"},\"correct\":\"B\",\"explanation\":\"A. `Pipeline` expects its stages to be passed as a `stages` keyword argument holding a list, not as separate positional arguments, so constructing it this way raises a `TypeError` before fitting begins.B. `Pipeline` accepts an ordered list of stages, and a single `fit()` call runs each stage's transformation or training in sequence, which is exactly the reusable, chained workflow the developer wants.C. `indexer.fit(train_df)` produces a fitted `StringIndexerModel`, not a transformed DataFrame; `lr.fit()` needs an actual DataFrame of features and labels, so feeding it a model object is a type mismatch.D. A Python list is not a Spark ML construct and has no `.fit()` method, so this line fails immediately rather than chaining the indexer and the classifier.E. `LogisticRegression.fit()` only accepts a DataFrame (and optional params), not a `transformers` argument, so this call does not exist as written and raises a `TypeError`.\"},{\"id\":\"8\",\"question\":\"A streaming ingestion job writes a fresh batch of transactions every hour to a Delta table and must add each batch alongside all previously written data, never replacing it. Which write call implements this correctly?\",\"options\":{\"A\":\"`batch_df.write.format(\\\"delta\\\").mode(\\\"overwrite\\\").save(path)`, which commits each hour's rows as the sole contents of the table, replacing everything written before it\",\"B\":\"`batch_df.write.format(\\\"delta\\\").mode(\\\"errorifexists\\\").save(path)`, which raises an exception on every run after the first because the target path already contains data\",\"C\":\"`batch_df.write.format(\\\"delta\\\").save(path)` with no mode specified, which defaults to merging incoming rows with existing rows by matching primary key values\",\"D\":\"`batch_df.write.format(\\\"delta\\\").mode(\\\"ignore\\\").save(path)`, which silently discards every hourly batch after the first because the target path already has data in it\",\"E\":\"`batch_df.write.format(\\\"delta\\\").mode(\\\"append\\\").save(path)`, which commits the new rows as an additional atomic transaction on top of the existing table history\"},\"correct\":\"E\",\"explanation\":\"A. Overwrite mode replaces the entire table contents with the new batch, so each hourly run would erase every transaction written in earlier runs rather than accumulating them.B. Errorifexists mode is the default guard against accidentally clobbering an existing table and raises an exception once the path already holds data, so it cannot support repeated hourly writes at all.C. Spark's DataFrameWriter has no automatic key-based merge behavior triggered by omitting the mode; without an explicit mode it falls back to `errorifexists`, which would fail after the first successful write.D. Ignore mode is designed to silently skip a write only when the target already contains data, so it would drop every batch after the first hour instead of accumulating the streaming transactions.E. Append mode commits each new batch as an additional atomic transaction without touching existing rows, so every hour's transactions accumulate on top of the prior history exactly as the job requires.\"},{\"id\":\"9\",\"question\":\"What is the key difference between `DataFrame.createTempView(name)` and `DataFrame.createOrReplaceTempView(name)` in Spark SQL?\",\"options\":{\"A\":\"`createTempView` persists the view to the metastore across cluster restarts, while `createOrReplaceTempView` keeps the view in memory only.\",\"B\":\"`createTempView` requires the DataFrame to be cached first, while `createOrReplaceTempView` can register an uncached DataFrame directly.\",\"C\":\"`createTempView` accepts a SQL query string as its argument, while `createOrReplaceTempView` accepts only a list of column names.\",\"D\":\"`createTempView` raises an exception if a temporary view with that name already exists, while `createOrReplaceTempView` silently overwrites it.\",\"E\":\"`createTempView` registers the view in the `global_temp` database, while `createOrReplaceTempView` registers it in the session's default database.\"},\"correct\":\"D\",\"explanation\":\"A. Neither method writes anything to the metastore; both create purely in-memory, session-scoped catalog entries that are lost when the session ends.B. Neither method requires the DataFrame to be cached beforehand; registering a view only binds a name to the DataFrame's logical plan, independent of caching.C. Both methods take only the view name string as their argument; neither accepts a SQL query string or a column list.D. This is the documented behavioral distinction: the non-replacing method fails with an already-exists error on a duplicate name, while the replacing method overwrites the prior registration without error.E. Both methods register a session-scoped temporary view in the session's default namespace; neither one uses the `global_temp` database, which is reserved for the separate global temp view methods.\"},{\"id\":\"10\",\"question\":\"Two notebooks are attached to the same cluster and run in separate Spark sessions. A developer in the first notebook wants a DataFrame to be queryable by name from the second notebook without writing it to storage. Which two statements are true about achieving this? Choose 2 answers.(Select 2)\",\"options\":{\"A\":\"Global temp views persist to disk under a `global_temp` directory, so the second notebook can still read them even after the cluster restarts and the original session ends.\",\"B\":\"Calling `df.createOrReplaceTempView(\\\"orders\\\")` in the first notebook will not make `orders` visible to a query in the second notebook, because a plain temp view is scoped to the session that created it.\",\"C\":\"Calling `df.createOrReplaceGlobalTempView(\\\"orders\\\")` in the first notebook makes the view visible from the second one too, because global temp views are shared across sessions in the same Spark application.\",\"D\":\"The second notebook must query the view as `SELECT * FROM orders`, because the `global_temp` prefix is only required when calling `spark.sql` from Python, not from a SQL cell.\",\"E\":\"Calling `df.createOrReplaceTempView(\\\"orders\\\")` in the first notebook automatically registers `orders` as a permanent, shared entry in the metastore, so the second notebook can query it like any managed table.\"},\"explanation\":\"A. Incorrect — global temp views live only in memory for the lifetime of the Spark application; they are not persisted to disk and disappear once the application (and its cluster) stops.B. Correct — a session-scoped temp view created with `createOrReplaceTempView` only exists for the Spark session that created it, so a different session's queries cannot see it by name.C. Correct — a global temp view is tied to the `global_temp` system database, which is shared by every session running in the same Spark application, so other sessions can query it.D. Incorrect — the `global_temp.` prefix is required for every session accessing a global temp view, regardless of whether the query runs from a SQL cell, `spark.sql`, or another language.E. Incorrect — a plain temp view is an in-memory, session-local logical plan; it is never written to the metastore, so no other session or later job can discover it as a table.\",\"multi\":true,\"correctAnswers\":[\"B\",\"C\"],\"multiSelect\":true},{\"id\":\"11\",\"question\":\"A data engineer needs to persist a large `transactions_df` DataFrame as a managed table so that later queries filtering on `transaction_date` can skip irrelevant files entirely, with no bucketing or sorting required. Which code correctly persists the table with this optimization?\",\"options\":{\"A\":\"transactions_df.write.mode(\\\"overwrite\\\").orderBy(\\\"transaction_date\\\").saveAsTable(\\\"transactions\\\")\",\"B\":\"transactions_df.repartition(\\\"transaction_date\\\").write.mode(\\\"overwrite\\\").saveAsTable(\\\"transactions\\\")\",\"C\":\"transactions_df.write.mode(\\\"overwrite\\\").partitionBy(\\\"transaction_date\\\").saveAsTable(\\\"transactions\\\")\",\"D\":\"transactions_df.write.mode(\\\"overwrite\\\").bucketBy(50, \\\"transaction_date\\\").saveAsTable(\\\"transactions\\\")\",\"E\":\"transactions_df.write.mode(\\\"overwrite\\\").sortBy(\\\"transaction_date\\\").saveAsTable(\\\"transactions\\\")\"},\"correct\":\"C\",\"explanation\":\"$11\"},{\"id\":\"12\",\"question\":\"An analyst has a DataFrame `orders` with columns `order_id`, `amount`, and `region`. They need to add a new column `amount_tier` that labels rows as `\\\"high\\\"` when `amount` is greater than 1000 and `\\\"standard\\\"` otherwise, without mutating the original DataFrame:\\n\\n```python\\norders_tiered = orders.____(\\n\\\"amount_tier\\\",\\nwhen(col(\\\"amount\\\") \u003e 1000, \\\"high\\\").otherwise(\\\"standard\\\")\\n)\\n```\\n\\nWhich method correctly completes this task?\",\"options\":{\"A\":\"filter\",\"B\":\"withColumnsRenamed\",\"C\":\"select\",\"D\":\"withColumnRenamed\",\"E\":\"withColumn\"},\"correct\":\"E\",\"explanation\":\"A. filter restricts which rows are kept based on a boolean condition; it does not add or compute a new column, so it does not fit this signature.B. withColumnsRenamed takes a dictionary mapping existing names to new names for bulk renaming, not a name plus a computed expression, so it does not match this call.C. select projects a set of column expressions but does not take a target column name and a value expression as two positional arguments the way this call is written, so this signature does not fit.D. withColumnRenamed only accepts an existing column name and a new name string; it cannot evaluate a when/otherwise expression, so it cannot produce a computed column.E. withColumn takes a target column name and a Column expression, adding the result as a new column while returning a new DataFrame, which matches this call exactly.\"},{\"id\":\"13\",\"question\":\"A `sensor_df` DataFrame has a `reading` column of type double. Some rows contain Python `None` (missing sensor data) and others contain the result of `0.0/0.0` (an invalid calculation), which Spark stores as `NaN`. You need to identify only the rows with the invalid `NaN` calculation, not the rows with missing sensor data. Which filter should you use?\",\"options\":{\"A\":\"sensor_df.filter(F.isnan(\\\"reading\\\"))\",\"B\":\"sensor_df.filter(F.col(\\\"reading\\\").isNull())\",\"C\":\"sensor_df.filter(F.col(\\\"reading\\\").isNotNull())\",\"D\":\"sensor_df.na.drop(subset=[\\\"reading\\\"])\",\"E\":\"sensor_df.filter(F.isnull(\\\"reading\\\"))\"},\"correct\":\"A\",\"explanation\":\"A. isnan() specifically flags Spark's floating-point NaN marker used for invalid numeric results, distinguishing it from a genuinely missing None value.B. isNull() matches rows where the value is Python None/SQL NULL, which is exactly the missing-data case this scenario wants to exclude, not the invalid calculation.C. Filtering with isNotNull() returns both valid numeric readings and NaN rows together, since NaN is a defined floating-point value rather than a null, so it fails to isolate the invalid rows.D. na.drop(subset=[\\\"reading\\\"]) removes rows with null values and returns everything else, which keeps the NaN rows mixed in with valid readings rather than isolating them.E. isnull() is functionally the same null check as isNull(), so it identifies missing-data rows rather than the NaN rows produced by the invalid calculation.\"},{\"id\":\"14\",\"question\":\"A data engineer wants a single-row report showing the total row count and the average `order_total` for the entire `orders` DataFrame, with no grouping. Which line of code produces this correctly?\",\"options\":{\"A\":\"`orders.agg(F.count(\\\"*\\\").alias(\\\"total_orders\\\"), F.avg(\\\"order_total\\\").alias(\\\"avg_total\\\"))`, which applies both aggregate expressions across the whole DataFrame and returns one row labeled by the given aliases.\",\"B\":\"`orders.count(), orders.select(F.avg(\\\"order_total\\\"))`, which evaluates two independent expressions rather than a single line of code, so the result is a Python tuple, not a DataFrame.\",\"C\":\"`orders.avg(\\\"order_total\\\").withColumn(\\\"total_orders\\\", F.count(\\\"*\\\"))`, which fails because `DataFrame` has no `.avg()` method and `F.count()` cannot be added as a column outside an aggregate context.\",\"D\":\"`orders.select(F.count(\\\"*\\\"), F.avg(\\\"order_total\\\")).groupBy(\\\"order_total\\\")`, which regroups the already-aggregated single row by `order_total`, producing one row per distinct total rather than a single summary row.\",\"E\":\"`orders.groupBy().count().alias(\\\"avg_total\\\")`, which returns the row count as a DataFrame and then renames the entire DataFrame object rather than adding an average column.\"},\"correct\":\"A\",\"explanation\":\"$12\"},{\"id\":\"15\",\"question\":\"```python\\norders = spark.createDataFrame(\\n[(101, \\\"widget\\\", 3), (102, \\\"gadget\\\", 1), (103, \\\"gizmo\\\", 5)],\\n[\\\"order_id\\\", \\\"item\\\", \\\"qty\\\"]\\n)\\npromotions = spark.createDataFrame(\\n[(101, \\\"SAVE10\\\"), (103, \\\"SAVE20\\\")],\\n[\\\"order_id\\\", \\\"code\\\"]\\n)\\nresult = orders.join(promotions, on=\\\"order_id\\\", how=\\\"left\\\")\\n```\\nWhat value appears in the `code` column for order `102` after this left join?\",\"options\":{\"A\":\"The row for order `102` is removed entirely, because left joins drop rows that lack a match on either side.\",\"B\":\"`null`, because `promotions` has no row with `order_id` = 102, so the left join keeps the order row with a null for the unmatched column.\",\"C\":\"`\\\"SAVE10\\\"`, because Spark falls back to the first available promotion code when no exact match is found.\",\"D\":\"The literal value `\\\"gadget\\\"`, because Spark reuses the closest matching column value when no promotion code exists.\",\"E\":\"An empty string `\\\"\\\"`, because Spark fills missing right-side string columns with empty strings rather than nulls.\"},\"correct\":\"B\",\"explanation\":\"A. A left join keeps every row from the left DataFrame no matter what, filling right-side columns with null when there is no match, rather than dropping the row.B. This is correct. A left join preserves all rows from `orders`, and since `promotions` has no row for `order_id` 102, the `code` column for that row is populated with `null`.C. Spark does not borrow a value from an unrelated matched row; there is no fallback to reuse `\\\"SAVE10\\\"` for an order that has no corresponding promotion row.D. Spark never copies a value from a different column, such as `item`, into an unrelated output column; a missing match produces a null, not a reused string from elsewhere in the row.E. Spark does not substitute empty strings for missing values produced by a join; unmatched right-side columns are populated with `null`, not `\\\"\\\"`.\"},{\"id\":\"16\",\"question\":\"A dashboard computes \\\"days since signup\\\" for each user from a `DateType` column `signup_date`. The developer writes:\\n```python\\ndf.withColumn(\\\"days_since_signup\\\", datediff(col(\\\"signup_date\\\"), current_date()))\\n```\\nand the resulting values are negative for every existing user. What should change, and why?\",\"options\":{\"A\":\"Cast `signup_date` to `TimestampType` before calling `datediff()`, because `datediff()` returns negative numbers whenever it receives a `DateType` argument instead of a `TimestampType`.\",\"B\":\"Wrap the result in `abs()`, because `datediff()` always returns a negative value whenever its first argument is chronologically earlier than the true current date being compared.\",\"C\":\"Use `months_between(col(\\\"signup_date\\\"), current_date())` instead, because `months_between()` returns whole day counts while `datediff()` is limited to whole calendar months.\",\"D\":\"Swap the arguments to `datediff(current_date(), col(\\\"signup_date\\\"))`; `datediff(end, start)` returns `end` minus `start` in days, so the earlier date first yields a negative count.\",\"E\":\"Replace `datediff()` with `date_add(col(\\\"signup_date\\\"), -1)`, because `date_add()` measures elapsed days between two columns while `datediff()` only shifts a single date forward or backward.\"},\"correct\":\"D\",\"explanation\":\"A. `datediff()` works correctly with `DateType` arguments and the column's data type is not the source of the negative sign; the cause is the order in which the two dates are passed.B. Wrapping the result in `abs()` hides the sign without fixing the underlying argument order, and the claim that `datediff()` always returns a negative value for an earlier first argument describes exactly the bug rather than a real universal rule to rely on.C. `months_between()` returns a number of months, not days, and `datediff()` returns days, not months, so this option reverses what each function actually measures.D. `datediff()` computes its first argument minus its second argument in days, so passing the earlier `signup_date` as the first argument and today as the second produces a negative number; swapping the order fixes the sign.E. `date_add()` shifts a single date by a fixed number of days and does not compute the elapsed days between two columns at all, so it cannot replace `datediff()` for this calculation.\"},{\"id\":\"17\",\"question\":\"A data engineer reads a daily CSV extract with no header row. The `order_id` column must be read as a long (not the int Spark would infer) to avoid downstream overflow, and schema inference is too slow on the multi-gigabyte file. Which line fills the blank so the file is read with the required types without triggering an inference scan?\\n\\n```python\\nfrom pyspark.sql.types import StructType, StructField, LongType, StringType\\n\\norder_schema = StructType([\\nStructField(\\\"order_id\\\", LongType(), True),\\nStructField(\\\"customer\\\", StringType(), True)\\n])\\n\\ndf = spark.read.____.csv(\\\"/mnt/raw/orders/\\\")\\n```\",\"options\":{\"A\":\"format(\\\"csv\\\").load()\",\"B\":\"option(\\\"inferSchema\\\", \\\"true\\\")\",\"C\":\"schema(order_schema)\",\"D\":\"option(\\\"header\\\", \\\"true\\\")\"},\"correct\":\"C\",\"explanation\":\"A. Chaining `format` and `load` is just an alternate way to specify the CSV source path and does not attach a schema, so the file would still fall back to default typing behavior.B. Turning on `inferSchema` makes Spark scan the file to guess column types, which is exactly the slow, unreliable path the engineer needs to avoid, and it would not guarantee `order_id` comes back as a long.C. Passing the `StructType` directly forces every row to be parsed according to the declared field names and types, so `order_id` is read as a `LongType` with no inference scan required.D. Declaring a header only tells Spark to treat the first line as column names; it says nothing about column types and does nothing to prevent inference from running.\"},{\"id\":\"18\",\"question\":\"Given:\\n```python\\ndf = spark.createDataFrame([(1, \\\"a\\\"), (3, \\\"c\\\"), (2, \\\"b\\\")], [\\\"id\\\", \\\"val\\\"])\\nresult = df.orderBy(\\\"id\\\", ascending=False).select(\\\"id\\\").collect()\\n```\\nWhat are the `id` values in `result`, in order?\",\"options\":{\"A\":\"1, 2, 3\",\"B\":\"1, 3, 2 (the original insertion order is preserved)\",\"C\":\"A `TypeError` is raised because `ascending` must be a list matching the number of sort columns\",\"D\":\"3, 1, 2\",\"E\":\"3, 2, 1\"},\"correct\":\"E\",\"explanation\":\"A. This would be the result of an ascending sort, but `ascending=False` explicitly requests descending order, so the lowest-to-highest sequence 1, 2, 3 is not what this call produces.B. `orderBy()` always reshuffles rows into the requested sort order; a `DataFrame` has no guaranteed row ordering to preserve in the first place, so the output reflects the sort, not the construction order.C. `ascending` accepts a single boolean when sorting by one column; a list is only required when sorting by multiple columns and specifying a direction per column, so a bare `False` here is valid and does not raise an error.D. This sequence matches neither a full ascending nor a full descending sort on `id`, so it does not correspond to any ordering that `orderBy(\\\"id\\\", ascending=False)` would produce.E. `ascending=False` reverses the sort direction for the single `id` column, so rows are ordered from the highest value to the lowest, producing 3, then 2, then 1.\"},{\"id\":\"19\",\"question\":\"A Spark job automatically uses a broadcast hash join for a small dimension table with no explicit hint applied anywhere in the code. Which configuration property controls this automatic behavior, and what does its default value represent?\",\"options\":{\"A\":\"`spark.sql.autoBroadcastJoinThreshold` sets the largest estimated table size Spark broadcasts automatically, defaulting to 10 MB unless the session overrides it.\",\"B\":\"Setting `spark.sql.shuffle.partitions` controls how many post-shuffle partitions Spark creates, and it defaults to 200 regardless of any table's estimated size.\",\"C\":\"The property `spark.sql.broadcastTimeout` controls how many seconds Spark waits for a broadcast to complete, defaulting to 300 seconds rather than a size limit.\",\"D\":\"Increasing `spark.driver.maxResultSize` raises the largest table Spark will broadcast automatically, since broadcast tables are collected through the driver's result buffer.\",\"E\":\"Only `spark.sql.adaptive.enabled` determines whether Spark can choose a broadcast join at runtime, with automatic size-based broadcasting disabled until AQE is turned on.\"},\"correct\":\"A\",\"explanation\":\"$13\"},{\"id\":\"20\",\"question\":\"A data engineer has a small Python dictionary `country_codes` (well under 1 MB) that maps ISO codes to country names, and needs to look it up inside a PySpark UDF applied to a 500 million row DataFrame. To avoid Spark serializing and shipping a fresh copy of `country_codes` with every task, which change should the engineer make to the following code?\\n\\n```python\\ndef lookup_country(code):\\nreturn country_codes.get(code, \\\"Unknown\\\")\\n\\nlookup_udf = udf(lookup_country, StringType())\\ndf = df.withColumn(\\\"country_name\\\", lookup_udf(col(\\\"iso_code\\\")))\\n```\",\"options\":{\"A\":\"Register `country_codes` as a Spark accumulator with `sc.accumulator(country_codes)` so tasks can read and update the shared mapping while the batch job keeps running.\",\"B\":\"Raise `spark.sql.autoBroadcastJoinThreshold` so Spark automatically distributes the dictionary as part of query planning for this specific UDF call in the job.\",\"C\":\"Wrap `country_codes` with `spark.sparkContext.broadcast(country_codes)` and reference `bc.value.get(code, \\\"Unknown\\\")`, so every executor keeps one cached copy.\",\"D\":\"Move the dictionary definition inside `lookup_country` itself, rebuilding `country_codes` on every call so each task always works with its own freshly built local copy of the mapping.\",\"E\":\"Convert `country_codes` into a Spark DataFrame and perform a `join` against the 500 million row DataFrame on the ISO code column before applying any further transformations.\"},\"correct\":\"C\",\"explanation\":\"A. Accumulators are write-only aggregators whose running total only the driver can read; they are not a mechanism for distributing an arbitrary read-only mapping for executors to look values up in.B. `spark.sql.autoBroadcastJoinThreshold` only influences whether Catalyst chooses a broadcast join strategy for DataFrame joins, and has no effect on a plain Python closure referenced inside a UDF.C. Broadcasting caches a single read-only copy of the dictionary on each executor, and referencing `.value` inside the UDF avoids re-serializing and re-sending the dictionary with every task.D. Rebuilding the dictionary inside the function makes the problem worse: Spark still ships whatever data built it, and the work of constructing the mapping now repeats on every single row.E. A join is a valid pattern for larger reference tables, but for a small in-memory dictionary it adds an unnecessary shuffle and does not fix the serialization behavior of the existing UDF code.\"},{\"id\":\"21\",\"question\":\"Which `timeoutConf` value should be passed to `applyInPandasWithState` so a group's state expires after a fixed amount of wall-clock time has elapsed since it last received data, independent of any event-time watermark in the incoming records?\",\"options\":{\"A\":\"GroupStateTimeout.WatermarkTimeout()\",\"B\":\"GroupStateTimeout.NoTimeout()\",\"C\":\"GroupStateTimeout.EventTimeTimeout()\",\"D\":\"GroupStateTimeout.ProcessingTimeTimeout()\"},\"correct\":\"D\",\"explanation\":\"A. `GroupStateTimeout` has no member with this name; the only valid timeout configurations are `NoTimeout()`, `ProcessingTimeTimeout()`, and `EventTimeTimeout()`.B. This disables automatic expiration entirely, so state for a group is retained indefinitely until the per-group function itself calls `state.remove()`, which does not satisfy a fixed wall-clock expiration requirement.C. This ties expiration to the watermark computed from an event-time column in the data, so how quickly state expires depends on data arrival patterns rather than a fixed span of processing time.D. This measures elapsed wall-clock time against the duration set with `state.setTimeoutDuration()`, independent of any event-time column or watermark, which is exactly the behavior described.\"},{\"id\":\"22\",\"question\":\"A team reviews an `applyInPandasWithState` implementation that declares `stateStructType = StructType([StructField(\\\"count\\\", LongType()), StructField(\\\"last_seen\\\", TimestampType())])` and passes `GroupStateTimeout.NoTimeout()` as the `timeoutConf`. Which two statements about this setup are correct? (Choose 2 answers)(Select 2)\",\"options\":{\"A\":\"`state.setTimeoutDuration()` can still be called safely to expire idle keys even though `timeoutConf` is `GroupStateTimeout.NoTimeout()`, since the timeout configuration only affects `EventTimeTimeout()`.\",\"B\":\"State declared with `stateStructType` is scoped to the entire streaming query rather than per grouping key, so two different `device_id` values processed by the same function share one combined state object.\",\"C\":\"Every call to `state.update()` inside the per-group function must pass a two-element tuple whose values line up with `count` and `last_seen`, since the value is validated against `stateStructType`.\",\"D\":\"Because `timeoutConf` is `GroupStateTimeout.NoTimeout()`, `state.hasTimedOut` will always evaluate to `False` inside the function, so no branch of the function will ever run purely due to a timeout.\"},\"explanation\":\"A. Calling `state.setTimeoutDuration()` while `timeoutConf` is `NoTimeout()` raises an error at runtime, since duration-based timeouts are only valid when `ProcessingTimeTimeout()` is the configured timeout type.B. State declared with `stateStructType` is maintained independently per grouping key produced by `groupBy()`; each distinct key gets its own isolated state entry, not one shared object across keys.C. `state.update()` validates its argument against the declared `stateStructType`, so passing a tuple of the wrong arity or incompatible types raises an error; here that means a two-element tuple matching `count` and `last_seen`.D. Timeout callbacks only fire when `timeoutConf` enables them; with `NoTimeout()` selected, Spark never invokes the function purely because time has elapsed, so this property stays `False` on every call.\",\"multi\":true,\"correctAnswers\":[\"C\",\"D\"],\"multiSelect\":true},{\"id\":\"23\",\"question\":\"A DataFrame with 1000 partitions is filtered down to a small result set. An engineer wants the final write to produce exactly 8 output files while spending as little execution time as possible on the operation itself:\\n\\n```python\\nresult = spark.read.table(\\\"sales.transactions\\\").filter(col(\\\"region\\\") == \\\"EMEA\\\")\\nresult.write.mode(\\\"overwrite\\\").parquet(\\\"/mnt/output/emea_sales\\\")\\n```\\n\\nWhich change achieves this most efficiently?\",\"options\":{\"A\":\"Insert `result = result.repartition(8)` before the write, since renumbering partition metadata this way never triggers a network shuffle of the underlying rows.\",\"B\":\"Set `spark.conf.set(\\\"spark.sql.shuffle.partitions\\\", 8)` right before the write call, since that setting fixes the output partition count for any write operation.\",\"C\":\"Insert `result = result.repartition(8, \\\"region\\\")` before the write, since hashing on the filter column guarantees exactly 8 evenly sized output files here.\",\"D\":\"Call `result.persist()` immediately before the write, since caching a DataFrame in memory automatically collapses its partition count to match the write target.\",\"E\":\"Insert `result = result.coalesce(8)` before the write, since it merges existing partitions on the same executors and avoids a full shuffle across the cluster.\"},\"correct\":\"E\",\"explanation\":\"$14\"},{\"id\":\"24\",\"question\":\"A data engineer wants Spark to pick the number of shuffle partitions automatically for each job rather than always using a fixed count, letting AQE's coalescing feature size the partitions itself. Which setting achieves this on a Databricks cluster with AQE enabled?\",\"options\":{\"A\":\"`spark.conf.set(\\\"spark.sql.files.maxPartitionBytes\\\", \\\"auto\\\")` lets Spark size the input read partitions dynamically, which also determines the partition count for every downstream shuffle.\",\"B\":\"`spark.conf.set(\\\"spark.sql.shuffle.partitions\\\", \\\"auto\\\")` starts each shuffle with a large partition count and lets AQE coalesce it down toward the advisory partition size.\",\"C\":\"`spark.conf.set(\\\"spark.sql.adaptive.coalescePartitions.enabled\\\", \\\"auto\\\")` switches partition coalescing between on and off automatically depending on the size of the input DataFrame.\",\"D\":\"`spark.conf.set(\\\"spark.sql.shuffle.partitions\\\", \\\"0\\\")` tells Spark to compute the shuffle partition count from the number of executor cores available at job submission time.\",\"E\":\"`spark.conf.set(\\\"spark.databricks.adaptive.autoOptimizeShuffle.enabled\\\", \\\"false\\\")` forces Spark back onto a manually specified partition count for every shuffle stage in the job.\"},\"correct\":\"B\",\"explanation\":\"A. This is incorrect because this setting controls input file read partitioning, not the number of partitions used for shuffles triggered later by joins or aggregations in the query.B. This is correct because setting the shuffle partition count to `\\\"auto\\\"` on Databricks starts with a large initial partition count and delegates the final sizing to AQE's coalescing logic based on actual shuffled data volume.C. This is incorrect because the coalescing enabled flag is a plain boolean; it does not accept an `\\\"auto\\\"` value that conditionally toggles behavior by input size.D. This is incorrect because setting the partition count to zero is not a supported way to derive partitions from executor core count; it does not enable automatic AQE-driven sizing.E. This is incorrect because disabling this Databricks-specific auto-optimization flag does the opposite of what is requested, forcing a fixed manual partition count instead of automatic sizing.\"},{\"id\":\"25\",\"question\":\"A join between a 2 TB fact table and what the engineer believed was a small dimension table causes repeated executor `OutOfMemoryError` failures:\\n```python\\nfact = spark.read.format(\\\"delta\\\").load(\\\"/mnt/gold/fact_sales\\\")\\ndim = spark.read.format(\\\"delta\\\").load(\\\"/mnt/gold/dim_store\\\")\\nresult = fact.join(broadcast(dim), \\\"store_id\\\")\\n```\\nInvestigation shows `dim_store` has grown to 12 GB over time and `spark.sql.autoBroadcastJoinThreshold` is set to `-1` in the cluster's Spark config. Which two actions would most directly resolve the OutOfMemoryError? (Choose 2 answers.)(Select 2)\",\"options\":{\"A\":\"Remove the explicit `broadcast(dim)` hint so the join falls back to a standard sort-merge join, since forcing a 12 GB table to be broadcast to every executor is what is overwhelming executor memory regardless of the threshold setting.\",\"B\":\"Reduce `dim_store` to only the columns and rows the join actually needs before the join executes, and confirm the filtered DataFrame is genuinely small so the existing `broadcast(dim)` hint can safely execute without overwhelming any executor.\",\"C\":\"Increase `spark.sql.shuffle.partitions` to a much higher value so the sort-merge join that `broadcast(dim)` supposedly triggers under the hood can process the 12 GB dimension table across more, smaller shuffle partitions instead.\",\"D\":\"Persist `dim_store` with `StorageLevel.DISK_ONLY` before the join, since caching a DataFrame to disk exempts it from the broadcast join threshold check and allows the explicit `broadcast()` hint to succeed without exceeding executor memory.\",\"E\":\"Rewrite the join as `fact.crossJoin(dim).filter(fact.store_id == dim.store_id)`, since a cross join followed by a filter processes the two tables independently on each executor and avoids ever broadcasting `dim_store` in full.\"},\"explanation\":\"$15\",\"multi\":true,\"correctAnswers\":[\"A\",\"B\"],\"multiSelect\":true},{\"id\":\"26\",\"question\":\"A data engineer starts the following streaming query without specifying a `.trigger(...)` clause:\\n```python\\nquery = (streamingDF.writeStream\\n.format(\\\"console\\\")\\n.outputMode(\\\"append\\\")\\n.start())\\n```\\nWhich best describes how Spark schedules micro-batches for this query?\",\"options\":{\"A\":\"Spark waits indefinitely for an explicit trigger interval to be configured, and the query remains idle until one is set\",\"B\":\"Spark processes exactly one micro-batch containing all currently available data, then stops the query automatically after that batch\",\"C\":\"Spark uses the default micro-batch trigger, immediately starting the next micro-batch as soon as the previous one finishes processing\",\"D\":\"Spark falls back to continuous processing mode automatically, executing records with millisecond-level latency instead of batching them\"},\"correct\":\"C\",\"explanation\":\"A. This is incorrect because the absence of a trigger clause does not pause the query; Spark falls back to its default trigger behavior rather than waiting for configuration.B. This is incorrect because processing a single batch and stopping is the behavior of a one-time trigger such as `Trigger.Once()`, not the default trigger that is used when no trigger is specified.C. This is correct: when no trigger is specified, Spark uses the default micro-batch trigger, which starts a new batch as soon as the prior one finishes, giving the lowest latency the micro-batch engine can offer without explicit tuning.D. This is incorrect because continuous processing is an experimental, opt-in execution mode requiring `.trigger(continuous=...)`; omitting a trigger does not switch the engine into that mode.\"},{\"id\":\"27\",\"question\":\"Which statement accurately distinguishes Spark's default micro-batch processing model from its continuous processing mode?\",\"options\":{\"A\":\"Micro-batch mode guarantees at-most-once delivery semantics, while continuous processing is the only Spark mode capable of exactly-once guarantees\",\"B\":\"Micro-batch mode polls the source and batches accumulated data, while continuous processing runs long tasks that handle records as they arrive for lower latency\",\"C\":\"Micro-batch mode requires a fixed cluster size that cannot ever autoscale, while continuous processing dynamically adds new executors for every single incoming record\",\"D\":\"Micro-batch mode only supports file-based sinks, while continuous processing is required whenever the sink is a Delta table or a JDBC connection\"},\"correct\":\"B\",\"explanation\":\"A. This is incorrect because micro-batch mode is the execution model that provides Structured Streaming's well-supported exactly-once guarantees, while continuous processing offers weaker, at-least-once guarantees for its supported operations.B. This is correct: micro-batch execution repeatedly polls the source and processes whatever has accumulated in discrete batches, while continuous processing keeps long-running tasks reading and processing records individually to achieve much lower latency.C. This is incorrect because cluster autoscaling behavior is independent of which streaming execution mode is chosen; neither mode inherently fixes or dynamically resizes the cluster per record.D. This is incorrect because micro-batch mode supports a wide range of sinks including Delta tables and JDBC, not only files; sink support is not the distinguishing factor between the two modes.\"},{\"id\":\"28\",\"question\":\"A team processes streaming user activity events and wants to group consecutive events from the same `userId` into a single session that closes automatically whenever there is at least a 5-minute gap of inactivity, rather than using a fixed calendar window. Which construct should they use?\",\"options\":{\"A\":\"`window()` with a 5-minute duration and no slide duration approximates session grouping, since a short tumbling window mirrors typical gaps between a user's events.\",\"B\":\"`groupBy(\\\"userId\\\").agg(max(\\\"event_time\\\"))` combined with a watermark tracks each user's latest event, which is treated as equivalent to a session boundary in practice.\",\"C\":\"`window()` with a 5-minute slide and a 10-minute duration merges adjacent events through overlapping windows, approximating the session boundaries the team wants.\",\"D\":\"`dropDuplicatesWithinWatermark(\\\"userId\\\")` applied before the aggregation removes repeat events per user, which approximates grouping a user's activity into one session.\",\"E\":\"`session_window()` builds one window per group that keeps extending while new events arrive within the gap duration, and finalizes once that inactivity gap has elapsed.\"},\"correct\":\"E\",\"explanation\":\"$16\"},{\"id\":\"29\",\"question\":\"A developer joins two streaming DataFrames and writes the result:\\n```python\\njoined = orders_stream.join(shipments_stream, \\\"order_id\\\")\\n\\nquery = joined.writeStream.outputMode(______).format(\\\"console\\\").start()\\n```\\nWhich two output modes are **not** valid for this streaming-to-streaming join and will raise an `AnalysisException` when passed to `.outputMode()`? (Choose 2 answers)(Select 2)\",\"options\":{\"A\":\"`once`\",\"B\":\"`default`\",\"C\":\"`append`\",\"D\":\"`update`\",\"E\":\"`complete`\"},\"explanation\":\"A. `once` is a trigger setting, not an output mode string, so it is not a candidate answer to this question about `.outputMode()` values.B. `default` is not a recognized output mode identifier in Structured Streaming; the valid mode names are `append`, `update`, and `complete`.C. Stream-to-stream joins are only supported with the `append` output mode, so this mode is valid and does not raise an exception.D. `update` mode is not yet supported for stream-to-stream joins; passing it to `.outputMode()` for a join query raises an `AnalysisException`.E. `complete` mode is not supported for stream-to-stream joins either, since the join does not produce a bounded result table that can be rewritten in full each trigger.\",\"multi\":true,\"correctAnswers\":[\"D\",\"E\"],\"multiSelect\":true},{\"id\":\"30\",\"question\":\"A sensor telemetry stream has columns `device_id`, `reading_time`, and `temperature`. The team writes:\\n```python\\ncleaned = sensor_df \\\\\\n.withWatermark(\\\"reading_time\\\", \\\"15 minutes\\\") \\\\\\n.dropDuplicates([\\\"device_id\\\", \\\"reading_time\\\"])\\n```\\nA record for `device_id=\\\"A1\\\"` with `reading_time=\\\"10:00:00\\\"` arrives, is processed, and the watermark subsequently advances to `10:20:00`. A duplicate record for the same `device_id` and `reading_time=\\\"10:00:00\\\"` then arrives. What happens to this late duplicate?\",\"options\":{\"A\":\"The record is buffered by the engine until the next checkpoint interval, at which point it is compared against a stored snapshot of every key deleted so far before being emitted.\",\"B\":\"The state for that key was already evicted once the watermark passed 10:00:00 by more than the 15-minute delay, so the engine can no longer recognize the duplicate and the record passes through as new.\",\"C\":\"The engine always retains a permanent record of every key it has ever emitted, kept in a separate index outside the bounded state store, so the duplicate is correctly filtered out no matter how late it arrives.\",\"D\":\"The query throws a runtime exception because the incoming event time is now older than the current watermark, which Structured Streaming treats as an unrecoverable error in the input data.\",\"E\":\"The engine automatically extends the watermark delay backward to accommodate the late arrival, silently widening the effective lateness bound to keep the original key's state alive longer.\"},\"correct\":\"B\",\"explanation\":\"$17\"},{\"id\":\"31\",\"question\":\"Which statement about setting the watermark delay threshold for streaming deduplication is accurate?\",\"options\":{\"A\":\"The threshold is measured in a count of records rather than a time duration, so it should be set to the expected number of duplicate retries observed per key.\",\"B\":\"The threshold only affects the aggregation operators present in a query, and has no bearing on how streaming deduplication state is retained or expired over time.\",\"C\":\"The threshold should exceed the maximum expected gap between an event and its latest duplicate, so genuine duplicates are not mistaken for new records once the watermark passes.\",\"D\":\"The threshold has no effect on correctness at all, and only changes how frequently the Spark UI refreshes the numbers shown on its streaming query statistics panel.\",\"E\":\"The threshold must always be set to exactly equal the micro-batch trigger interval, since Spark derives all watermark expiry decisions directly from the configured trigger duration.\"},\"correct\":\"C\",\"explanation\":\"$18\"},{\"id\":\"32\",\"question\":\"A platform team upgrades the Spark version running on their Spark Connect server to pick up performance improvements, while client applications keep running unmodified PySpark scripts such as:\\n```python\\ndf = spark.read.table(\\\"events\\\").groupBy(\\\"user_id\\\").count()\\n```\\nWhich two statements correctly explain why this server upgrade does not require the client applications to be rebuilt or redeployed? (Choose 2 answers)(Select 2)\",\"options\":{\"A\":\"The client and server exchange a shared JVM classpath at connection time, so any server-side JAR upgrade is automatically mirrored onto the client machine.\",\"B\":\"The server converts the client's compiled Java bytecode into an updated intermediate representation, which removes any dependency on the original Spark version.\",\"C\":\"Client applications never actually run against the upgraded server, because Spark Connect automatically pins each client to the exact server version it was originally built against.\",\"D\":\"The thin client library only encodes DataFrame operations into unresolved logical plans; it does not depend on the internal execution engine version running on the server.\",\"E\":\"Spark Connect's gRPC protocol maintains compatibility across versions, so an older client library can keep issuing requests to a newer server without a matching client-side upgrade.\"},\"explanation\":\"$19\",\"multi\":true,\"correctAnswers\":[\"D\",\"E\"],\"multiSelect\":true},{\"id\":\"33\",\"question\":\"A data scientist installs Databricks Connect in a local IDE and writes PySpark DataFrame code that references a table in Unity Catalog, then runs the script. Which description matches how Databricks Connect executes this code?\",\"options\":{\"A\":\"Databricks Connect copies the entire Databricks Runtime onto the local IDE's machine, so all DataFrame operations execute locally before results sync back to Unity Catalog.\",\"B\":\"Databricks Connect requires the script to be uploaded as a notebook first, since local IDEs cannot submit Spark Connect requests directly to a remote cluster.\",\"C\":\"Databricks Connect runs the driver locally and the executors locally as well, only contacting Unity Catalog at the very end to write the final output table to storage.\",\"D\":\"Databricks Connect converts every DataFrame call into a SQL warehouse query behind the scenes, bypassing the Spark execution engine on the remote cluster entirely.\",\"E\":\"Databricks Connect acts as a Spark Connect client: DataFrame operations build a logical plan locally and send it over gRPC to the remote cluster for execution.\"},\"correct\":\"E\",\"explanation\":\"$1a\"},{\"id\":\"34\",\"question\":\"Which statement accurately describes the relationship between `pyspark.pandas` and the native `pyspark.sql.DataFrame` API?\",\"options\":{\"A\":\"`pyspark.pandas` is a pandas-compatible layer built on top of Spark DataFrames, so operations written with its API are translated into the same distributed Spark execution plan that native PySpark DataFrames use.\",\"B\":\"`pyspark.pandas` is a completely separate execution engine from Spark SQL, so DataFrames created with it run on a dedicated single-node process that exists outside of the Spark cluster entirely.\",\"C\":\"`pyspark.pandas` replaces `pyspark.sql.DataFrame` starting from Spark 3.2, meaning the native DataFrame API is deprecated and all new PySpark code should use pandas-on-Spark DataFrames exclusively from that version onward.\",\"D\":\"`pyspark.pandas` only works when Spark is running in local mode, so any pandas-on-Spark code submitted to a multi-node cluster automatically falls back to a native PySpark DataFrame instead.\",\"E\":\"`pyspark.pandas` is a client-side charting library that renders pandas-style plots from query results, and it does not provide any DataFrame transformation or aggregation methods of its own.\"},\"correct\":\"A\",\"explanation\":\"$1b\"},{\"id\":\"35\",\"question\":\"A pipeline needs to filter out rows where `amount` is negative and add a `processed_at` timestamp column, operating on arbitrary batches of the whole DataFrame rather than per group. Which call correctly uses `mapInPandas` to do this?\",\"options\":{\"A\":\"```python\\ndef clean_batch(iterator):\\nfor pdf in iterator:\\npdf = pdf[pdf[\\\"amount\\\"] \u003e= 0].copy()\\npdf[\\\"processed_at\\\"] = pd.Timestamp.now()\\nyield pdf\\n\\ndf.mapInPandas(clean_batch)\\n```, omitting the `schema` argument since mapInPandas can infer it from the yielded DataFrame.\",\"B\":\"```python\\ndef clean_batch(iterator):\\nfor pdf in iterator:\\npdf = pdf[pdf[\\\"amount\\\"] \u003e= 0].copy()\\npdf[\\\"processed_at\\\"] = pd.Timestamp.now()\\nyield pdf\\n\\ndf.mapInPandas(clean_batch, schema=new_schema)\\n```, applied directly on the ungrouped DataFrame.\",\"C\":\"The same `clean_batch` function, but called as `df.groupby(\\\"amount\\\").mapInPandas(clean_batch, schema=new_schema)` so each batch is scoped to one distinct `amount` value.\",\"D\":\"```python\\n@pandas_udf(new_schema)\\ndef clean_batch(pdf: pd.DataFrame) -\u003e pd.DataFrame:\\npdf = pdf[pdf[\\\"amount\\\"] \u003e= 0].copy()\\npdf[\\\"processed_at\\\"] = pd.Timestamp.now()\\nreturn pdf\\n\\ndf.mapInPandas(clean_batch)\\n```, decorating the function with `pandas_udf` before passing it to `mapInPandas`.\",\"E\":\"```python\\ndef clean_batch(pdf):\\npdf = pdf[pdf[\\\"amount\\\"] \u003e= 0].copy()\\npdf[\\\"processed_at\\\"] = pd.Timestamp.now()\\nreturn pdf\\n\\ndf.mapInPandas(clean_batch, schema=new_schema)\\n```, where the function takes and returns a single pandas DataFrame instead of an iterator.\"},\"correct\":\"B\",\"explanation\":\"$1c\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
