istoria coherente: sobreajuste real con evaluación honesta (train≠test, test≈producción), frente a un salto casi perfecto e inexplicado, que es el síntoma típico de una feature que contiene la respuesta.\n\nPor qué fallan las demás:\n(A) La suposición errónea: comparar números sin leer el contexto. Un 99,6% en un problema donde nada había pasado del 70% es una alerta de fuga hasta demostrar lo contrario, no una virtud.\n(C) La suposición errónea: culpar al examen. Que test baje respecto a train es el comportamiento NORMAL del sobreajuste; y producción (67%) coincide con test (68%): la métrica predice la realidad.\n(D) La suposición errónea: el azar como explicación de patrones tan distintos. Más épocas no arreglan una fuga (la feature filtrada sigue ahí), y el sobreajuste del A se ataca con regularización, más datos o early stopping, no con más pasos.\n\nPista de examen: Un resultado casi perfecto e inexplicado se audita antes de creerlo; un test que predice a producción valida la métrica, aunque duela el número."])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"quiz\":{\"id\":\"ruta-ml-desde-cero-es\",\"title\":\"Examen: Machine Learning desde 0\",\"questions\":[{\"id\":\"1\",\"question\":\"Tu empresa quiere predecir si un cliente pagará su próxima factura. Existe el histórico de 500.000 facturas pasadas etiquetadas pagó o no pagó, pero ningún experto sabe enunciar la regla exacta. ¿Qué falta para usar ML aquí?\",\"options\":{\"A\":\"Nada: hay ejemplos etiquetados en cantidad y la regla es incognoscible — es el caso ideal de un modelo supervisado\",\"B\":\"Falta que un auditor enuncie primero la regla exacta de pago; sin regla no hay nada que entrenar\",\"C\":\"Con 500.000 ejemplos el ML no sirve: es demasiado poco; se necesita al menos un millón\",\"D\":\"Debes cambiar el problema a no supervisado: agrupar las facturas por similitud e ignorar las etiquetas\"},\"correct\":\"A\",\"explanation\":\"Gana porque junta las DOS condiciones del modelo mental: regla incognoscible (por eso no se codifica a mano) y ejemplos resueltos en cantidad (por eso hay señal de la cual aprender).\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: que escribir la regla es siempre posible y necesario. Es justo lo que el ML evita: los ejemplos sustituyen a la regla.\\n(C) La suposición errónea: inventar un umbral mágico. La señal de 500.000 facturas basta para un clasificador tabular; el tamaño exacto depende de la complejidad del patrón, no de un número redondo.\\n(D) La suposición errónea: que las etiquetas sobran. Ignorarlas tiraría la señal más valiosa: para predecir pago, el aprendizaje es supervisado por definición.\\n\\nPista de examen: El ML necesita dos cosas a la vez: ejemplos con su respuesta correcta y una regla que nadie sabe escribir.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-ck1\"},{\"id\":\"2\",\"question\":\"Te contratan para «aplicar IA» y te topas con tres proyectos: (1) calcular la nómina bajo la ley vigente, (2) predecir el consumo eléctrico de una fábrica mañana con 3 años de mediciones horarias, (3) decidir si una solicitud está completa según un checklist del regulador. ¿Cuáles merecen un modelo de ML?\",\"options\":{\"A\":\"Los tres: con suficiente ML cualquier problema se resuelve\",\"B\":\"Ninguno: si la empresa ya tiene procesos, nunca conviene entrenar\",\"C\":\"Solo el (2): nómina y checklist son reglas exactas y estables (lógica directa); el consumo no tiene fórmula pero sí tres años de mediciones reales\",\"D\":\"(2) y (3): el consumo por sus datos y el checklist por su complejidad burocrática\"},\"correct\":\"C\",\"explanation\":\"Gana porque separa los tres casos con las mismas DOS piezas del modelo mental: ¿existe la fórmula? ¿existen ejemplos? Nómina y checklist tienen fórmula; el consumo no la tiene pero sí datos.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: el ML como llave universal. Para nómina y checklist la regla es EXACTA y ESTABLE; un modelo solo metería error en un cálculo determinista y auditable legalmente.\\n(B) La suposición errónea: el extremo opuesto. El consumo eléctrico depende de temperatura, turnos y calendario sin fórmula cerrada, y HAY 3 años de mediciones: ejemplos abundantes, regla incognoscible.\\n(D) La suposición errónea: complejidad ≠ incognoscibilidad. «Complejo pero escrito» sigue siendo una regla: al checklist se le aplica tal cual, y un modelo sería menos fiable que su propia definición.\\n\\nPista de examen: La pregunta nunca es «¿puede ML con esto?» sino «¿existe la fórmula? Si no, ¿abundan los ejemplos?».\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck2\"},{\"id\":\"3\",\"question\":\"Entrenaste un filtro de spam con datos históricos y quieres una métrica honesta de su desempeño con correo nuevo. ¿Cuál de estas NO es una forma válida de obtener la parte de datos «que el modelo nunca vio»?\",\"options\":{\"A\":\"Separar 20% de los correos ANTES de entrenar y reservarlos sin tocarlos hasta la evaluación final\",\"B\":\"Validación cruzada de k partes: cada correo sirve de test en una de las k repeticiones\",\"C\":\"Guardar el último mes de correos reales (jamás tocados) y evaluar solo al final del proyecto\",\"D\":\"Entrenar varias épocas más y medir el accuracy sobre los MISMOS correos usados en el entrenamiento\"},\"correct\":\"D\",\"explanation\":\"Gana porque es exactamente el vicio del lab s1: esos correos ya moldearon los parámetros; ningún número sobre ellos cuenta como «parte que nunca vio».\\n\\nPor qué fallan las demás:\\n(A) Sí es válida: es el método estándar (train/test split). Los reservados jamás tocan el ajuste, así que sí son «nunca vistos».\\n(B) Sí es válida: en cada ronda la parte de test no entrenó ese modelo concreto. Es válida y muy útil cuando los datos escasean.\\n(C) Sí es válida: es un split temporal, de hecho la evaluación más realista cuando los datos tienen tendencia temporal.\\n\\nPista de examen: «Nunca visto» significa que esos datos no participaron del ajuste en ningún momento, no que el modelo los procesó después.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck3\"},{\"id\":\"4\",\"question\":\"Equipo A entrena un modelo de fraude y separa 20% para test: 89% en train, 68% en test; la primera semana en producción cae a 67%. Equipo B, en el mismo notebook y con los mismos datos, reporta 99,8% en train y 99,6% en test, cuando ningún modelo anterior había pasado del 70%. ¿Qué lectura das de cada caso?\",\"options\":{\"A\":\"El modelo B es mejor por su métrica más alta y estable: se despliega primero y el de 68% se investiga después\",\"B\":\"El A sufre sobreajuste (memoria \u003e generalización), pero su 67% en producción CONFIRMA que su test es honesto; el 99,6% de B, muy por encima de todo lo anterior, huele a fuga y hay que auditar sus features antes de creerlo\",\"C\":\"El examen del A está mal hecho: que train y test difieran tanto prueba que la separación se barrió mal\",\"D\":\"Ambos están bien; las diferencias son azar del split y se corrigen entrenando más épocas\"},\"correct\":\"B\",\"explanation\":\"$f\",\"difficulty\":\"advanced\",\"flowItem\":\"s1-ck4\"},{\"id\":\"5\",\"question\":\"Una ONG digitaliza 40.000 encuestas de bienestar. Antes de entrenar un modelo de riesgo de deserción escolar, la analista dice: «las columnas ingreso y zona definen el contexto de cada hogar; el resto son detalles». ¿Qué papel desempeñan ingreso y zona?\",\"options\":{\"A\":\"Son etiquetas: lo que el modelo debe predecir\",\"B\":\"Son features (variables de entrada): columnas que alimentan la predicción del modelo\",\"C\":\"Son hiperparámetros: ajustan la intensidad del entrenamiento\",\"D\":\"Son metadatos que conviene retirar: contaminarían el entrenamiento\"},\"correct\":\"B\",\"explanation\":\"Gana porque es exactamente su papel: en la función aprendida, cada feature influye en la salida; la etiqueta (deserción) es a lo que se quiere acertar.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: confundir insumo con producto. La etiqueta es deserción; ingreso y zona acompañan al ejemplo, no son su respuesta.\\n(C) La suposición errónea: un hiperparámetro es una decisión del entrenamiento (tasa de aprendizaje, profundidad), nunca una columna de datos.\\n(D) La suposición errónea: metadato ≠ feature inútil. Con contexto real y señal predictiva, retirarlas solo empobrecería al modelo.\\n\\nPista de examen: Feature = columna de entrada; label = columna a predecir; hiperparámetro = decisión del entrenamiento, sin columna.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-ck5\"},{\"id\":\"6\",\"question\":\"Un modelo de fraude sobre 50.000 transacciones con 0.4% de fraude reporta accuracy 99.7%. El equipo celebra y pide firmar el despliegue. ¿Qué le dices antes de firmar?\",\"options\":{\"A\":\"99.7% demuestra que el modelo está listo: ningún modelo anterior logró tanto\",\"B\":\"El accuracy casi no informa con 0.4% de fraude: exige precision, recall al umbral de decisión y el costo de cada tipo de error antes de firmar\",\"C\":\"El accuracy está bien pero hay que reportarlo con más decimales para que se vea creíble\",\"D\":\"Con desbalance extremo el accuracy ES la mejor métrica\"},\"correct\":\"B\",\"explanation\":\"Gana porque reemplaza la métrica por las que sí separan el modelo del truco y anclan la decisión al costo del negocio (bloquear compras legítimas vs. dejar pasar fraude).\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: un número alto como prueba de calidad sin fijar su piso. El «modelo tonto» que dice «no es fraude» a todo hace 99.6%: el margen real del modelo es el 0.1%.\\n(C) La suposición errónea: un problema de cosmética. Más decimales no cambian lo que el número mide.\\n(D) La suposición errónea: la lógica invertida. Cuanto más rara la clase, MENOS informa el accuracy: el piso del modelo tonto sube hacia 100%.\\n\\nPista de examen: Con clases raras el accuracy mide el desbalance, no el modelo: exige precision, recall y costos.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck1\"},{\"id\":\"7\",\"question\":\"Filtro de spam: 5.000 correos, 2% de spam. Cada falso positivo (legítimo a spam) puede perder un cliente; cada falso negativo (spam a bandeja) solo molesta. ¿Qué perfil de umbral y métrica priorizas?\",\"options\":{\"A\":\"Maximizar recall: atrapar todo el spam; los errores contra legítimos son tolerables\",\"B\":\"El accuracy es suficiente: con 98% no-spam, cualquier filtro supera ese piso\",\"C\":\"Equilibrar precision y recall a 50/50 porque es la configuración por defecto\",\"D\":\"Priorizar precision alta aunque el recall sea modesto: subir el umbral para marcar spam solo con casi-certeza\"},\"correct\":\"D\",\"explanation\":\"Gana porque alinea la métrica con el costo dominante (FP carísimo = pierde clientes; FN barato = molestia): umbral alto, vigilar precision, medir el recall como restricción.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: maximizar la métrica que NO cuesta dinero. Recall alto implica precision baja: correos legítimos a la basura, justo lo que pierde clientes.\\n(B) La suposición errónea: accuracy como árbitro final. El modelo tonto ya hace 98% sin hacer NADA; la métrica debe separar al modelo del truco.\\n(C) La suposición errónea: el equilibrio por ritual. El balance correcto depende de los costos del negocio, y aquí son claramente asimétricos.\\n\\nPista de examen: El umbral se elige con la matriz de costos: precision alta cuando un falso positivo duele más que un caso perdido.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck2\"},{\"id\":\"8\",\"question\":\"Modelo de renovación de contratos: validación 91%. En producción predice renovación casi siempre. El equipo descubre que entre las features entró «fecha_de_baja_solicitada» (la fecha en que el cliente pidió la baja; vacía si renueva). ¿Qué pasó y qué haces?\",\"options\":{\"A\":\"El modelo funciona bien: el patrón es genuino y el desempeño subirá con más datos\",\"B\":\"Es fuga del objetivo: esa fecha (vacía = renueva, llena = no renueva) prácticamente ES la etiqueta, de ahí el 91%; se elimina la columna, se reentrena y se revalida\",\"C\":\"Es un problema de demasiadas features; con reducción de dimensionalidad se arregla sin quitar la columna\",\"D\":\"Es drift de datos: los clientes cambian y hay que reentrenar semanalmente\"},\"correct\":\"B\",\"explanation\":\"Gana porque identifica la fuga de etiqueta (una columna que solo existe después del evento a predecir) y da el remedio completo: eliminar, reentrenar y volver a validación honesta.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: ignorar el contenido de la feature. La columna se llena DESPUÉS del evento: es la respuesta escrita en el insumo.\\n(C) La suposición errónea: la cantidad como causa. PCA puede hasta AMPLIFICAR la fuga al mezclar la columna contaminante con las sanas en sus componentes.\\n(D) La suposición errónea: drift como explicación por defecto. Drift no explica validación 91% con producción desastrosa; una columna-fuga sí.\\n\\nPista de examen: Pregunta en qué MOMENTO existen los datos de cada columna: si se llenan después del evento, son la respuesta, no la señal.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-ck3\"},{\"id\":\"9\",\"question\":\"La matriz de confusión de tu filtro de spam da: TP=90, FN=10 (spam real no detectado), FP=25 (legítimos parados), TN=9875. Un compañero reporta precisión 78% y recall 90%. ¿Es consistente?\",\"options\":{\"A\":\"Sí: precision = 90/(90+25) = 78.3% y recall = 90/(90+10) = 90% — coincide con las casillas\",\"B\":\"No: están intercambiadas; los verdaderos valores son precision 90% y recall 78%\",\"C\":\"No puede saberse con esas casillas: hay que reentrenar\",\"D\":\"Casi: la precision real es 98.7% porque los TN participan de su fórmula\"},\"correct\":\"A\",\"explanation\":\"Gana porque aplica las fórmulas con los denominadores correctos: precision sobre lo PREDICHO como positivo (TP+FP); recall sobre lo REAL positivo (TP+FN).\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: recordar el par de métricas, no su denominador. El denominador de precision incluye los FP (predichos positivos); el de recall el total de reales positivos.\\n(C) La suposición errónea: la matriz como dato insuficiente. La matriz confusión es EXACTAMENTE lo que se necesita para computar ambas métricas.\\n(D) La suposición errónea: meter los TN en la precision. Los TN no aparecen en precision ni en recall; 98.7% es el ACCURACY ((TP+TN)/total).\\n\\nPista de examen: Precision = sobre lo que PREDIJISTE positivo; recall = sobre lo que REALMENTE es positivo; los TN no participan de ninguna de las dos.\",\"difficulty\":\"basic\",\"flowItem\":\"s2-ck4\"},{\"id\":\"10\",\"question\":\"Tu compañero corre model.fit() y, a la pregunta «¿cuántas épocas?», contesta: «las que hagan falta hasta que la loss de train sea cero». ¿Qué le devuelves?\",\"options\":{\"A\":\"Exacto: la loss en cero garantiza el mejor modelo\",\"B\":\"Mejor fijar SIEMPRE 100 épocas: es el estándar de la industria\",\"C\":\"La loss a vigilar es la de VALIDACIÓN, con early stopping cuando deja de bajar: la de train puede seguir bajando mientras el modelo empeora\",\"D\":\"La loss de train es lo único relevante; validación solo al final\"},\"correct\":\"C\",\"explanation\":\"Gana porque define el objetivo real (generalizar) y la palanca de control (parar sobre la métrica honesta, no sobre la memorizada).\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: confundir memorizar con aprender. Loss≈0 en train es el retrato clásico del sobreajuste.\\n(B) La suposición errónea: ritual en lugar de criterio. El número depende de datos y modelo; fijo y sin vigilancia es receta de sobre- o sub-ajuste.\\n(D) La suposición errónea: la brújula al final del viaje. Sin vigilancia durante el entrenamiento no hay dónde parar; al final ya es tarde.\\n\\nPista de examen: La loss que manda es la de datos NUNCA vistos; loss de train en cero es la definición de memorizar.\",\"difficulty\":\"basic\",\"flowItem\":\"s2-ck5\"},{\"id\":\"11\",\"question\":\"Una financiera pequeña debe aprobar créditos con 8.000 solicitudes históricas (pagó/no pagó) y 15 columnas. El regulador exige explicar a cada cliente qué factores pesaron en la decisión, y necesitas un primer modelo esta semana. ¿Cuál eliges?\",\"options\":{\"A\":\"Una red neuronal profunda, porque suele dar la mejor precisión\",\"B\":\"k-means con 2 grupos, uno para «paga» y otro para «no paga»\",\"C\":\"Una regresión lineal que prediga 0 o 1 y redondear\",\"D\":\"Una regresión logística como baseline: da una probabilidad y coeficientes que dicen qué factor sube o baja el riesgo\"},\"correct\":\"D\",\"explanation\":\"Gana porque es un clasificador rápido de entrenar, con pesos interpretables por feature y salida probabilística; además sirve de referencia para probar después un boosting.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que más complejo siempre gana. Con 8.000 filas tabulares rara vez supera a modelos simples, y es difícil de explicar al regulador.\\n(B) La suposición errónea: ignorar que hay etiqueta. k-means agrupa por parecido, y sus grupos no tienen por qué coincidir con pagar o no pagar.\\n(C) La suposición errónea: tratar una clase como un número. Puede dar valores fuera de 0–1 y no está pensada para clasificar; la logística resuelve justo eso.\\n\\nPista de examen: Tabla, etiqueta binaria y obligación de explicar: la logística es el primer paso natural.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-q1\"},{\"id\":\"12\",\"question\":\"Tu Random Forest de abandono da 0.86 de AUC en validación, con 200.000 clientes y 60 columnas. Tienes dos semanas y alguien con experiencia ajustando hiperparámetros. ¿Qué pruebas a continuación para intentar mejorar?\",\"options\":{\"A\":\"Gradient boosting (LightGBM o XGBoost) con early stopping en validación\",\"B\":\"Un único árbol de decisión profundo, más fácil de explicar\",\"C\":\"Subir el Random Forest de 500 a 5.000 árboles\",\"D\":\"k-NN con k = 5 sobre las 60 columnas\"},\"correct\":\"A\",\"explanation\":\"Gana porque el boosting encadena árboles que corrigen los errores del conjunto y, bien ajustado, suele superar al bosque en tablas; early stopping evita que sobreajuste.\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: que explicar más equivale a predecir mejor. Un árbol solo tiene más varianza que el bosque y casi seguro empeora el AUC.\\n(C) La suposición errónea: que más árboles siempre suman. Pasado cierto número, el bosque se estabiliza y apenas mejora; cuesta más cómputo sin cambiar lo que puede aprender.\\n(D) La suposición errónea: que un modelo de distancia es intercambiable. Con 200.000 filas predecir es lento, exige escalar y elegir bien la distancia, y en tablas mixtas no suele ganar a los árboles.\\n\\nPista de examen: Bosque = robusto sin ajustar; boosting = el siguiente paso cuando tienes tiempo para ajustarlo.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-q2\"},{\"id\":\"13\",\"question\":\"Entrenas un Random Forest con y sin StandardScaler, con las mismas features y la misma semilla, y obtienes las mismas predicciones. Tu compañero cree que el pipeline tiene un bug. ¿Qué le dices?\",\"options\":{\"A\":\"Es un bug: escalar siempre cambia las predicciones de cualquier modelo\",\"B\":\"El scaler no se aplicó: hay que llamar a fit_transform también sobre test\",\"C\":\"Es lo esperado: los árboles cortan cada feature por umbrales, y escalar no cambia el orden de los valores, así que los cortes equivalen\",\"D\":\"Es casualidad de esta semilla; con otra semilla saldrían distintas\"},\"correct\":\"C\",\"explanation\":\"Gana porque StandardScaler aplica a cada columna una transformación que conserva el orden, y los árboles solo dependen de ese orden: obtienen las mismas particiones.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que todos los modelos usan distancias o gradientes. Los árboles no.\\n(B) La suposición errónea: arreglarlo con otra fuga. Hacer fit sobre test contamina la evaluación, y el bosque daría lo mismo igualmente.\\n(D) La suposición errónea: atribuirlo al azar. Es una propiedad de los árboles: no les afecta una transformación por columna que conserva el orden.\\n\\nPista de examen: Los árboles dependen del orden de los valores, no de su escala.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-ck1\"},{\"id\":\"14\",\"question\":\"Predices el consumo eléctrico diario de un edificio con la temperatura exterior: sube con el frío (calefacción) y con el calor (aire acondicionado). Una regresión lineal con la temperatura tal cual da un error alto en train y en validación. ¿Qué haces?\",\"options\":{\"A\":\"Captar la forma de U: añadir temperatura² (o «grados de frío» y «grados de calor») a la lineal, o probar un árbol o boosting\",\"B\":\"Añadir regularización L2 fuerte\",\"C\":\"Entrenar más épocas con una learning rate mayor\",\"D\":\"Escalar la temperatura entre 0 y 1\"},\"correct\":\"A\",\"explanation\":\"Gana porque una U no es una recta: con features que la representen, o con un modelo no lineal, el patrón se puede aprender.\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: tratar un subajuste como sobreajuste. El modelo ya falla en train; regularizar lo simplifica aún más.\\n(C) La suposición errónea: que es falta de entrenamiento. La regresión lineal ya encuentra su mejor recta; más pasos no la convierten en curva.\\n(D) La suposición errónea: que la escala cambia la forma. Escalar cambia las unidades; sigue siendo una recta sobre una U.\\n\\nPista de examen: Error alto ya en train: falta capacidad o features; una recta no dibuja una U.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-ck2\"},{\"id\":\"15\",\"question\":\"Tu Random Forest de precios de vivienda se entrenó con casas de 40 a 200 m². Ahora llegan casas de 350–400 m² y su precio predicho es casi el mismo que el de las de 200 m². Los usuarios se quejan. ¿Qué explica el comportamiento?\",\"options\":{\"A\":\"El bosque tiene pocos árboles; con 2.000 árboles predeciría precios más altos\",\"B\":\"Hay fuga de datos en el entrenamiento\",\"C\":\"Falta escalar la superficie\",\"D\":\"Un Random Forest predice promediando precios vistos en sus hojas, así que no puede extrapolar más allá del máximo del entrenamiento\"},\"correct\":\"D\",\"explanation\":\"Gana porque cada hoja guarda valores del train: por grande que sea la casa, cae en las hojas del extremo y recibe su promedio.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que más árboles crean valores nuevos. Más árboles promedian los mismos precios vistos en train.\\n(B) La suposición errónea: confundir síntomas. La fuga infla la evaluación; no explica un techo en las predicciones.\\n(C) La suposición errónea: que la escala importa a los árboles. Sus cortes no dependen de ella.\\n\\nPista de examen: Los árboles interpolan; para extrapolar, cambia de modelo o consigue datos de ese rango.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-ck3\"},{\"id\":\"16\",\"question\":\"Tu LightGBM con 5.000 árboles, learning rate 0.3 y árboles muy profundos da AUC 0.99 en train y 0.78 en validación, con 20.000 filas. Tienes una semana y no puedes conseguir más datos. ¿Qué ajustas primero?\",\"options\":{\"A\":\"Duplicar el número de árboles para que el modelo «termine de aprender»\",\"B\":\"Cambiar a una red neuronal profunda\",\"C\":\"Bajar la learning rate, limitar la complejidad de cada árbol (profundidad, mínimo de ejemplos por hoja) y dejar que early stopping en validación elija cuántos árboles usar\",\"D\":\"Quitar el conjunto de validación y entrenar con todo para tener más datos\"},\"correct\":\"C\",\"explanation\":\"Gana porque pasos más pequeños y árboles más simples reducen la varianza, y early stopping corta cuando la validación deja de mejorar.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que falta entrenamiento. El boosting sigue corrigiendo errores en serie; más árboles ajustan más ruido y agrandan la brecha.\\n(B) La suposición errónea: que cambiar de familia arregla el sobreajuste. No ataca la causa, y en tablas de este tamaño una red rara vez gana a un boosting bien ajustado.\\n(D) La suposición errónea: que medir sobra. Te quedas sin forma de detectar el sobreajuste; la brecha seguiría ahí, solo que invisible.\\n\\nPista de examen: En boosting, learning rate y número de árboles se ajustan juntos, con early stopping como árbitro.\",\"difficulty\":\"advanced\",\"flowItem\":\"s3-ck4\"},{\"id\":\"17\",\"question\":\"Tienes 1.000 pacientes y solo 30 tienen la enfermedad. Con un split 80/20 al azar, el test quedó con 2 positivos y el recall salta entre 0%, 50% y 100% según la semilla. Debes reportar un número estable al comité. ¿Qué cambias primero?\",\"options\":{\"A\":\"Duplicar los positivos en todo el dataset antes de dividir\",\"B\":\"Usar accuracy, que es más estable\",\"C\":\"Un split estratificado (y mejor, validación cruzada estratificada), para que cada parte conserve el 3% de positivos\",\"D\":\"Subir el test al 50% de los datos\"},\"correct\":\"C\",\"explanation\":\"Gana porque stratify mantiene la proporción en cada parte, y la CV estratificada usa los 30 positivos para evaluar, dando un recall promedio con su desviación.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que más positivos en cualquier sitio ayudan. Remuestrear antes del split mete copias del mismo paciente en train y test (fuga) y falsea la proporción real del test.\\n(B) La suposición errónea: estable = útil. Con 3% de positivos, decir siempre «sano» ya da 97%: estable, pero no dice nada de lo que importa.\\n(D) La suposición errónea: que el tamaño basta. Deja menos ejemplos para entrenar y, sin estratificar, cuántos positivos caen en test sigue dependiendo del azar.\\n\\nPista de examen: Con pocos positivos, estratifica y promedia folds antes de creerte un recall.\",\"difficulty\":\"basic\",\"flowItem\":\"s4-q1\"},{\"id\":\"18\",\"question\":\"Un equipo antifraude de 3 personas puede revisar 100 alertas al día entre 200.000 transacciones diarias. Te piden comparar dos modelos y elegir uno para ese equipo. ¿Qué métrica refleja mejor el valor real para ellos?\",\"options\":{\"A\":\"La precision en las 100 transacciones con mayor puntuación de cada día (precision@100)\",\"B\":\"La accuracy global sobre las 200.000 transacciones\",\"C\":\"El recall con el umbral 0.5 por defecto\",\"D\":\"La ROC-AUC, porque no depende del umbral\"},\"correct\":\"A\",\"explanation\":\"Gana porque mide exactamente lo que el equipo usará: cuántos fraudes reales hay entre los 100 casos que podrá revisar.\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: que un número global sirve para todo. La dominan las transacciones legítimas; dos modelos muy distintos pueden empatar.\\n(C) La suposición errónea: que 0.5 tiene algo que ver con la capacidad del equipo. Ese umbral puede generar 5 o 5.000 alertas al día.\\n(D) La suposición errónea: que resumir todos los umbrales es mejor. Incluye umbrales que nunca usarás; dos modelos con la misma ROC-AUC pueden diferir mucho en el top 100.\\n\\nPista de examen: Elige la métrica que imita la decisión real: si se revisan k casos, mide la precisión en esos k.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-q2\"},{\"id\":\"19\",\"question\":\"Comparas dos modelos de abandono en el mismo test: el modelo X tiene ROC-AUC 0.50 y el modelo Y 0.85. Tu jefe pregunta qué significa ese 0.50. ¿Qué respondes?\",\"options\":{\"A\":\"Que X acierta la mitad de las veces, igual que Y acierta el 85%\",\"B\":\"Que X está perfectamente calibrado\",\"C\":\"Que X solo es inútil con el umbral 0.5; con otro umbral puede ser excelente\",\"D\":\"Que X ordena igual que el azar: la probabilidad de que puntúe más alto a un cliente que abandona que a uno que se queda es 0.5\"},\"correct\":\"D\",\"explanation\":\"Gana porque esa es la interpretación de la ROC-AUC; Y, con 0.85, ordena bastante mejor que el azar.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: leerla como porcentaje de aciertos. La ROC-AUC mide orden, no aciertos.\\n(B) La suposición errónea: que mide calibración. La ROC-AUC solo depende del orden de las puntuaciones.\\n(C) La suposición errónea: que depende de un umbral. La ROC-AUC ya resume todos; 0.5 significa que ninguno ayuda.\\n\\nPista de examen: ROC-AUC = probabilidad de ordenar bien un par positivo-negativo; 0.5 es azar.\",\"difficulty\":\"basic\",\"flowItem\":\"s4-ck1\"},{\"id\":\"20\",\"question\":\"Un modelo de fraude (0,1% de fraude) tiene ROC-AUC 0.97, pero el equipo de revisión dice que casi todas sus alertas son falsas. Te piden una métrica para seguirlo mes a mes que refleje ese problema. ¿Cuál?\",\"options\":{\"A\":\"La especificidad, porque mira los legítimos bien clasificados\",\"B\":\"La PR-AUC (average precision) y la precision en el umbral de operación\",\"C\":\"La accuracy mensual\",\"D\":\"Seguir con la ROC-AUC, pero con más decimales\"},\"correct\":\"B\",\"explanation\":\"Gana porque la precision compara falsas alarmas con fraudes detectados, no con el enorme número de legítimos, así que refleja que las alertas son mayormente falsas.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que mirar negativos ayuda aquí. Con millones de legítimos la especificidad sale altísima aunque haya muchas falsas alarmas.\\n(C) La suposición errónea: que un número alto es un buen número. La dominan los legítimos y subiría aunque las alertas empeoren.\\n(D) La suposición errónea: que falta resolución. El problema es lo que mide: la tasa de falsos positivos se mantiene baja porque divide por millones de negativos.\\n\\nPista de examen: Con clases rarísimas, sigue la PR-AUC y la precision de las alertas, no solo la ROC-AUC.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-ck2\"},{\"id\":\"21\",\"question\":\"Cada alerta de fraude la revisa una persona por 5 € (sea fraude o no) y cada fraude que se escapa cuesta 500 €. El modelo da probabilidades bien calibradas. ¿Desde qué probabilidad conviene alertar?\",\"options\":{\"A\":\"Desde 0.5, el valor por defecto\",\"B\":\"Desde 0.99, para que casi todas las alertas sean fraude\",\"C\":\"Desde 0.01: alertar compensa cuando la pérdida esperada que evitas (p × 500 €) supera los 5 € de revisar\",\"D\":\"Desde el umbral que maximiza la F1 en el test\"},\"correct\":\"C\",\"explanation\":\"Gana porque p × 500 \u003e 5 equivale a p \u003e 0.01; con probabilidades calibradas esa es la regla de mínimo costo esperado, que luego se confirma en validación.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que 0.5 es neutral. Solo es óptimo si los dos errores cuestan lo mismo; aquí perder un fraude cuesta 100 veces más que revisar.\\n(B) La suposición errónea: maximizar precision a toda costa. Deja escapar casi todos los fraudes, que son el costo grande.\\n(D) La suposición errónea: que F1 refleja el negocio. F1 no usa los costos de 5 € y 500 €, y elegir el umbral en test lo contamina.\\n\\nPista de examen: Con probabilidades calibradas, alerta cuando p supere costo de revisar / costo de perder el caso.\",\"difficulty\":\"advanced\",\"flowItem\":\"s4-ck3\"},{\"id\":\"22\",\"question\":\"Entrenaste una regresión logística de impago con class_weight=\\\"balanced\\\" (5% de impagos) para mejorar el recall. Ahora finanzas usa sus probabilidades directamente para fijar precios por riesgo, y nota que la probabilidad media predicha está muy por encima del 5% real, también en los datos de entrenamiento. ¿Qué pasa?\",\"options\":{\"A\":\"Los pesos de clase hicieron que el modelo aprendiera como si las clases estuvieran equilibradas: sus probabilidades ya no están calibradas; hay que recalibrarlas (por ejemplo con CalibratedClassifierCV) o entrenar sin pesos y mover el umbral\",\"B\":\"Hay fuga de datos en las features de impago\",\"C\":\"Es data drift: los clientes nuevos son más riesgosos\",\"D\":\"El modelo sobreajusta; hay que añadir regularización\"},\"correct\":\"A\",\"explanation\":\"Gana porque los pesos sirven para detectar mejor la clase rara, pero sesgan las probabilidades hacia ella; para usarlas como riesgo hay que calibrarlas.\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: confundir síntomas. La fuga inflaría la evaluación; aquí las probabilidades suben de forma sistemática por el peso que tú impusiste.\\n(C) La suposición errónea: culpar al mundo. El desajuste aparece también en los datos de entrenamiento, no solo en clientes nuevos.\\n(D) La suposición errónea: que todo error es sobreajuste. El sobreajuste no explica un sesgo sistemático hacia arriba en todas las probabilidades.\\n\\nPista de examen: Pesar clases mejora la detección, pero rompe la calibración: recalibra antes de usar probabilidades como riesgo.\",\"difficulty\":\"advanced\",\"flowItem\":\"s4-ck4\"},{\"id\":\"23\",\"question\":\"Para frenar un posible sobreajuste, un compañero puso alpha=1000 en una regresión Ridge de precios. Ahora el modelo da R² 0.21 en train y 0.20 en validación; antes daba 0.78 y 0.74. ¿Qué pasó?\",\"options\":{\"A\":\"Ahora generaliza perfecto: train y validación casi coinciden\",\"B\":\"Regularizó de más: el modelo quedó subajustado; hay que bajar alpha y elegirlo con validación cruzada\",\"C\":\"Hay fuga de datos en validación\",\"D\":\"Falta escalar el target\"},\"correct\":\"B\",\"explanation\":\"Gana porque una penalización enorme aplasta los coeficientes hacia cero; train y validación caen juntos, la firma del subajuste.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que una brecha pequeña basta. Los dos números son malos: el modelo dejó de aprender el patrón.\\n(C) La suposición errónea: confundir síntomas. La fuga inflaría la validación; aquí bajó.\\n(D) La suposición errónea: que la escala del target cambia el ajuste. Multiplicar el target por una constante no cambia el R² de Ridge; el problema es la penalización.\\n\\nPista de examen: Brecha pequeña con números malos es subajuste, no éxito.\",\"difficulty\":\"basic\",\"flowItem\":\"s5-q1\"},{\"id\":\"24\",\"question\":\"Con 5.000 filas tu modelo da 0.95 en train y 0.80 en validación; con 10.000 filas, 0.94 y 0.84. Etiquetar 10.000 filas más cuesta un mes. Tu jefe propone en cambio un modelo mucho más grande. ¿Qué recomiendas?\",\"options\":{\"A\":\"El modelo más grande: con más capacidad la validación subirá\",\"B\":\"Nada: 0.84 ya no va a mejorar\",\"C\":\"Quitar la validación y entrenar con las 10.000 filas\",\"D\":\"Conseguir más datos etiquetados: la validación sigue subiendo con más filas y la brecha con train se cierra\"},\"correct\":\"D\",\"explanation\":\"Gana porque esa es la lectura de una curva de aprendizaje: un modelo limitado por varianza mejora con más datos.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que falta capacidad. La brecha indica exceso de varianza, y más capacidad tiende a agrandarla.\\n(B) La suposición errónea: ver un techo donde no lo hay. La validación sigue subiendo al añadir datos.\\n(C) La suposición errónea: que medir sobra. Perderías la forma de saber si la decisión funcionó.\\n\\nPista de examen: Mide la curva de aprendizaje antes de decidir entre más datos o más modelo.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s5-q2\"},{\"id\":\"25\",\"question\":\"Pronosticas la demanda diaria de 40 tiendas con 3 años de historia. Un compañero valida con KFold(shuffle=True) y obtiene un error bajísimo; en producción el error se triplica. ¿Qué validación debió usar?\",\"options\":{\"A\":\"Una validación temporal: entrenar con fechas anteriores y validar con posteriores (por ejemplo, TimeSeriesSplit)\",\"B\":\"StratifiedKFold para mantener la proporción de días festivos\",\"C\":\"Más folds (k=20) para reducir la varianza\",\"D\":\"Mantener shuffle=True pero quitar las features de fecha\"},\"correct\":\"A\",\"explanation\":\"Gana porque imita producción, donde siempre se predice el futuro con el pasado.\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: que estratificar arregla el orden. El modelo seguiría viendo días futuros vecinos del que debe predecir.\\n(C) La suposición errónea: que es un problema de varianza. Más folds barajados repiten la misma fuga temporal.\\n(D) La suposición errónea: que la fuga está en la columna de fecha. Los días vecinos se parecen en ventas y clima; la fuga sigue aunque borres la fecha.\\n\\nPista de examen: Si en producción predices el futuro, valida con el futuro.\",\"difficulty\":\"basic\",\"flowItem\":\"s5-ck1\"},{\"id\":\"26\",\"question\":\"Tienes 12.000 radiografías de 900 pacientes (varias por paciente). Con un split aleatorio por imagen el modelo da 0.97 de AUC; con pacientes nuevos del mismo hospital, 0.81. ¿Qué cambias en la validación?\",\"options\":{\"A\":\"Estratificar por diagnóstico\",\"B\":\"Aumentar los datos con rotaciones y recortes\",\"C\":\"Dividir por paciente (GroupKFold o GroupShuffleSplit): todas las imágenes de un paciente en el mismo lado\",\"D\":\"Entrenar más épocas con early stopping\"},\"correct\":\"C\",\"explanation\":\"Gana porque así el test contiene solo pacientes nuevos, como en producción, y el modelo no puede apoyarse en reconocer a la persona.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que el problema es la proporción de enfermos. Estratificar la mantiene, pero sigue mezclando imágenes del mismo paciente en train y test.\\n(B) La suposición errónea: que es falta de variedad. La augmentation ayuda a generalizar, pero no arregla un test contaminado.\\n(D) La suposición errónea: que es un problema de entrenamiento. No cambia que el test comparta pacientes con train.\\n\\nPista de examen: Divide por la entidad que será nueva en producción.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s5-ck2\"},{\"id\":\"27\",\"question\":\"Probaste 300 combinaciones de hiperparámetros contra el mismo conjunto de validación de 500 filas. La mejor da 0.91 en validación y 0.85 en el test que no habías tocado. Tu jefe quiere reportar 0.91. ¿Qué haces?\",\"options\":{\"A\":\"Reportar 0.91: es el mejor resultado obtenido\",\"B\":\"Reportar el 0.85 del test y, la próxima vez, usar validación cruzada (o anidada) y menos combinaciones\",\"C\":\"Seguir ajustando hasta que el test también llegue a 0.91\",\"D\":\"Promediar 0.91 y 0.85 y reportar 0.88\"},\"correct\":\"B\",\"explanation\":\"Gana porque el test intacto es la estimación honesta; elegir entre muchas pruebas sobre pocas filas sobreajusta la validación.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que el máximo es representativo. Es el mejor de 300 mediciones ruidosas e incluye suerte.\\n(C) La suposición errónea: que el test es otro objetivo. Entonces se convierte en otra validación y ya no tienes medida honesta.\\n(D) La suposición errónea: que promediar corrige el sesgo. Mezclar una medida sesgada con una honesta sigue estando sesgado.\\n\\nPista de examen: La validación también se sobreajusta; el test intacto da el número a reportar.\",\"difficulty\":\"advanced\",\"flowItem\":\"s5-ck3\"},{\"id\":\"28\",\"question\":\"Al pasar de 20.000 a 80.000 filas, tu modelo lineal de demanda sigue dando 0.71 en train y 0.70 en validación. Te ofrecen comprar 200.000 filas más del mismo tipo. ¿Lo recomiendas?\",\"options\":{\"A\":\"Sí: más datos siempre mejoran el modelo\",\"B\":\"Sí, y además añadir regularización fuerte\",\"C\":\"No; mejor quitar features para simplificar\",\"D\":\"No por ahora: train y validación convergieron en un valor bajo (sesgo alto); conviene más capacidad o mejores features\"},\"correct\":\"D\",\"explanation\":\"Gana porque cuando ambas curvas se juntan abajo, el límite está en el modelo o en la información de las features, no en la cantidad de filas.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que los datos lo curan todo. Las curvas ya convergieron; más filas del mismo tipo no suben un techo que pone el modelo.\\n(B) La suposición errónea: tratarlo como sobreajuste. El modelo ya está subajustado; regularizar lo empeora.\\n(C) La suposición errónea: que simplificar ayuda siempre. Aumenta el sesgo, que es justo el problema.\\n\\nPista de examen: Curvas juntas y bajas: cambia el modelo o las features, no compres más filas.\",\"difficulty\":\"advanced\",\"flowItem\":\"s5-ck4\"},{\"id\":\"29\",\"question\":\"Una red debe clasificar fotos de productos en exactamente una de 12 categorías (cada foto pertenece a una sola). Estás definiendo la última capa y la pérdida. ¿Qué eliges?\",\"options\":{\"A\":\"12 neuronas con softmax y entropía cruzada categórica\",\"B\":\"1 neurona con sigmoide y entropía cruzada binaria\",\"C\":\"12 neuronas con una sigmoide cada una\",\"D\":\"1 neurona lineal con MSE que prediga el número de categoría (1–12)\"},\"correct\":\"A\",\"explanation\":\"Gana porque softmax da 12 probabilidades que suman 1 y compiten entre sí, y la entropía cruzada penaliza dar poca probabilidad a la clase correcta.\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: que una salida basta. Una sigmoide sirve para sí/no, no para elegir entre 12.\\n(C) La suposición errónea: confundir con multi-etiqueta. Esa salida no obliga a elegir una sola categoría.\\n(D) La suposición errónea: tratar categorías como números. Impone un orden y una distancia que no existen.\\n\\nPista de examen: Una clase de N → softmax + entropía cruzada; varias a la vez → una sigmoide por etiqueta.\",\"difficulty\":\"basic\",\"flowItem\":\"s6-q1\"},{\"id\":\"30\",\"question\":\"Un banco quiere un asistente que responda sobre 3.000 políticas internas que cambian cada semana, citando la política exacta. El presupuesto es limitado y no puede reentrenar modelos cada semana. ¿Qué arquitectura eliges?\",\"options\":{\"A\":\"Fine-tuning semanal de un LLM con las políticas\",\"B\":\"Pegar las 3.000 políticas en cada prompt\",\"C\":\"RAG: indexar las políticas, recuperar los fragmentos relevantes en cada pregunta y pedir al LLM que responda con ellos y los cite\",\"D\":\"Un LLM sin contexto con temperatura 0 para que no invente\"},\"correct\":\"C\",\"explanation\":\"Gana porque actualizar es reindexar, sin reentrenar, y la cita sale del fragmento recuperado, que se puede verificar.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que el fine-tuning es la forma de «enseñar» datos. Es caro de repetir cada semana y no garantiza recordar el texto exacto ni dar la fuente.\\n(B) La suposición errónea: que el contexto es gratis e infinito. Es muy caro por llamada y puede no caber en la ventana de contexto.\\n(D) La suposición errónea: que la temperatura aporta conocimiento. Una temperatura baja reduce la variedad, no le da al modelo políticas que nunca vio.\\n\\nPista de examen: Conocimiento propio y cambiante → recupéralo con RAG; fine-tuning es para estilo o tarea repetida.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s6-q2\"},{\"id\":\"31\",\"question\":\"Tienes 5.000 clientes con 25 columnas numéricas y categóricas para predecir abandono. Un compañero quiere empezar con una red profunda «porque es lo más moderno». Tienes una semana. ¿Por dónde empiezas?\",\"options\":{\"A\":\"Por la red profunda, y si va mal, más capas\",\"B\":\"Por un LLM al que le pasas cada fila como texto\",\"C\":\"Por k-means con 2 clusters\",\"D\":\"Por una baseline y una regresión logística, luego un gradient boosting; la red, solo si lo supera en validación\"},\"correct\":\"D\",\"explanation\":\"Gana porque en tablas medianas los árboles con boosting suelen ser lo más fuerte con menos ajuste; la red debe ganarse su lugar en validación.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: moderno = mejor. En tablas de este tamaño una red rara vez supera a un boosting y exige más ajuste.\\n(B) La suposición errónea: que un LLM sirve para todo. Es caro y lento, y no hay razón para esperar que prediga mejor que un modelo entrenado con la etiqueta.\\n(C) La suposición errónea: ignorar la etiqueta. Hay historial de abandono: es un problema supervisado.\\n\\nPista de examen: Tabla mediana: boosting primero; la red tiene que demostrar que gana.\",\"difficulty\":\"basic\",\"flowItem\":\"s6-ck1\"},{\"id\":\"32\",\"question\":\"Extraes con un LLM los campos de 10.000 facturas a JSON. A veces cambia el nombre de las claves o añade texto antes del JSON, y tu código falla. ¿Qué cambio es el más efectivo?\",\"options\":{\"A\":\"Subir la temperatura para que el modelo «piense» más\",\"B\":\"Temperatura baja, un esquema JSON explícito (salida estructurada si la API la ofrece) y validar cada respuesta con código\",\"C\":\"Pedirle «por favor, sé muy exacto» en mayúsculas\",\"D\":\"Cambiar a un LLM más grande y no validar\"},\"correct\":\"B\",\"explanation\":\"Gana porque fija el formato y detecta lo que falle para reintentarlo o revisarlo.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que la temperatura es esfuerzo. Más temperatura aumenta la variación de la salida y empeora el formato.\\n(C) La suposición errónea: que insistir es controlar. Ayuda poco y no garantiza nada; sin validación los errores siguen pasando.\\n(D) La suposición errónea: que un modelo mejor no falla. Reduce los errores, pero sin validación los que queden romperán el sistema.\\n\\nPista de examen: Formato fiable = esquema + validación, no buena voluntad del modelo.\",\"difficulty\":\"basic\",\"flowItem\":\"s6-ck2\"},{\"id\":\"33\",\"question\":\"Una red etiqueta fotos de viajes con «playa», «montaña», «perro» y «atardecer», y una foto puede tener varias a la vez. Con softmax, las fotos con playa y perro solo reciben una etiqueta alta. ¿Qué cambias?\",\"options\":{\"A\":\"Una sigmoide por etiqueta con entropía cruzada binaria, y un umbral por etiqueta\",\"B\":\"Subir la temperatura del softmax\",\"C\":\"Entrenar más épocas\",\"D\":\"Quedarse siempre con las 2 clases más probables del softmax\"},\"correct\":\"A\",\"explanation\":\"Gana porque cada sigmoide da una probabilidad independiente; no tienen que sumar 1, así que varias etiquetas pueden ser verdad a la vez.\\n\\nPor qué fallan las demás:\\n(B) La suposición errónea: que suavizar basta. Las probabilidades siguen sumando 1 y compitiendo entre sí.\\n(C) La suposición errónea: que es falta de entrenamiento. El problema es la capa de salida, no cuánto se entrena.\\n(D) La suposición errónea: que todas las fotos tienen dos etiquetas. Fuerza 2 aunque la foto tenga 1 o 3.\\n\\nPista de examen: Varias etiquetas a la vez → sigmoides independientes.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s6-ck3\"},{\"id\":\"34\",\"question\":\"Tu RAG responde mal 3 de cada 10 preguntas. Al revisar esos casos, los fragmentos recuperados no contienen la respuesta, aunque el documento correcto sí está indexado. Solo cabe un cambio este sprint. ¿Cuál?\",\"options\":{\"A\":\"Cambiar a un LLM más grande\",\"B\":\"Bajar la temperatura a 0\",\"C\":\"Atacar la recuperación: medir si el fragmento correcto está entre los k primeros y mejorar el troceado, la búsqueda (híbrida o con re-ranking) o k\",\"D\":\"Hacer fine-tuning del LLM con las preguntas que fallan\"},\"correct\":\"C\",\"explanation\":\"Gana porque el fallo está antes del generador, y medir la recuperación por separado dice qué arreglar.\\n\\nPor qué fallan las demás:\\n(A) La suposición errónea: que el generador es el cuello de botella. Si el fragmento correcto no llega al prompt, ningún modelo puede responder bien con él.\\n(B) La suposición errónea: que es un problema de muestreo. No cambia qué fragmentos se recuperan.\\n(D) La suposición errónea: que memorizar respuestas arregla la búsqueda. No cambia lo que se recupera y queda viejo cuando cambien los documentos.\\n\\nPista de examen: En RAG, evalúa por separado recuperación y generación.\",\"difficulty\":\"advanced\",\"flowItem\":\"s6-ck4\"}]}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
