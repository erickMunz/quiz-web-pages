ions using BigQuery ML. They need high-quality, semantically rich embeddings. What function should they use?\",\"options\":{\"A\":\"Use ML.TEXT_TOKENIZE to extract embedding vectors from tokens\",\"B\":\"Use ML.GENERATE_EMBEDDINGS for semantic vector generation\",\"C\":\"Use BigQuery PCA to reduce dimensionality of token buckets\",\"D\":\"Use hashing functions to approximate semantic text embeddings\"},\"correct\":\"B\",\"explanation\":\"ML.GENERATE_EMBEDDINGS provides semantic embeddings from foundation models integrated into BigQuery ML, providing high-quality semantic vectors suitable for clustering and downstream ML tasks.\"},{\"id\":\"37\",\"question\":\"A logistics optimization model uses BigQuery ML boosted trees. The team wants to ensure the model generalizes well and stops training when improvement stagnates. Which option should they enable?\",\"options\":{\"A\":\"Disable regularization to allow the model to converge faster\",\"B\":\"Increase tree depth so the model learns more nuanced partitions\",\"C\":\"Enable early stopping to halt training when validation loss plateaus\",\"D\":\"Reduce the dataset size so the model focuses on key features only\"},\"correct\":\"C\",\"explanation\":\"Enabling early stopping prevents overfitting by monitoring validation loss and halting the training process as soon as model improvements plateau.\"},{\"id\":\"38\",\"question\":\"You want to continuously monitor production data distributions against training baselines to catch degradation. How should you implement this in BigQuery ML?\",\"options\":{\"A\":\"Run manual SQL queries comparing weekly averages\",\"B\":\"Enable drift detection using the ML.DETECT_DRIFT query\",\"C\":\"Export predictions to Cloud Storage and run custom Python scripts\",\"D\":\"Rebuild the training tables daily to prevent data staleness\"},\"correct\":\"B\",\"explanation\":\"ML.DETECT_DRIFT supports continuous monitoring of input data drift and prediction drift.\"},{\"id\":\"39\",\"question\":\"A cybersecurity company needs to identify rare attack patterns. Their dataset is extremely imbalanced. What is the best technique within BigQuery ML?\",\"options\":{\"A\":\"Train a logistic regression model with equal class weighting\",\"B\":\"Use CLASS_WEIGHTS in boosted-tree classifiers to balance gradients\",\"C\":\"Remove majority-class samples to artificially increase minority ratios\",\"D\":\"Train an autoencoder and convert outputs to balanced synthetic labels\"},\"correct\":\"B\",\"explanation\":\"CLASS_WEIGHTS is the built-in mechanism to address imbalanced datasets by balancing classification gradients.\"},{\"id\":\"40\",\"question\":\"A company wants to automatically tune hyperparameters and select the best model during a BigQuery ML training routine. Which approach should they take?\",\"options\":{\"A\":\"Use ML.EVALUATE to compare manual test runs\",\"B\":\"Use ML.TUNE to perform automated model selection during training\",\"C\":\"Use ML.TRAIN with randomized grid parameters\",\"D\":\"Export the dataset to Vertex AI Workbench for manual sweeps\"},\"correct\":\"B\",\"explanation\":\"ML.TUNE automatically runs multiple configurations and selects the best model based on evaluation criteria.\"},{\"id\":\"41\",\"question\":\"A data science team wants to inspect the architecture and configuration details of a trained BigQuery ML model. Which query should they run?\",\"options\":{\"A\":\"Use ML.GLOBAL_EXPLAIN to extract model-level architectural details\",\"B\":\"Use ML.EVALUATE to inspect training logs and system operations\",\"C\":\"Use ML.FEATURE_INFO to display feature processing and schema details\",\"D\":\"Use ML.PREDICT to retrieve configuration metadata embedded in results\"},\"correct\":\"C\",\"explanation\":\"ML.FEATURE_INFO exposes the underlying input schema, feature transformations, and structural processing details applied during training.\"},{\"id\":\"42\",\"question\":\"You are forecasting regional retail sales using an ARIMA_PLUS model and need to account for localized calendar events. Which parameter should you include?\",\"options\":{\"A\":\"Set TIME_SERIES_LENGTH to automatically pad missing days\",\"B\":\"Include HOLIDAY_REGION so seasonality reflects local events\",\"C\":\"Use TRANSFORM to manually hardcode holiday boolean flags\",\"D\":\"Set CLEAN_ANOMALIES to false to preserve holiday spikes\"},\"correct\":\"B\",\"explanation\":\"HOLIDAY_REGION adds holiday signals and helps ARIMA models detect seasonal effects better.\"},{\"id\":\"43\",\"question\":\"A company builds a BigQuery ML classifier. They want to validate whether the learned thresholds produce optimal recall. What should they evaluate?\",\"options\":{\"A\":\"Use ROC curves to inspect threshold-independent model quality\",\"B\":\"Use calibration curves to measure prediction probability correctness\",\"C\":\"Use ML.THRESHOLD_EVALUATE to test recall at different cutoff thresholds\",\"D\":\"Use confusion matrices exported from ML.WEIGHTS output metadata\"},\"correct\":\"C\",\"explanation\":\"ML.THRESHOLD_EVALUATE evaluates model performance metrics like precision and recall across custom classification probability thresholds.\"},{\"id\":\"44\",\"question\":\"A data team wants to verify that incoming serving data matches the training schema before generating batch predictions. What BigQuery ML tool should they use?\",\"options\":{\"A\":\"Use ML.EVALUATE on the serving table\",\"B\":\"Use ML.VALIDATE_FEATURES to check feature compatibility\",\"C\":\"Use ML.FEATURE_INFO to compare metadata schemas\",\"D\":\"Use standard SQL WHERE clauses to filter out nulls\"},\"correct\":\"B\",\"explanation\":\"ML.VALIDATE_FEATURES checks that inference data aligns with the model’s training schema and constraints.\"},{\"id\":\"45\",\"question\":\"A company wants to reduce BigQuery ML training cost. They currently use unpartitioned tables with billions of rows. What should they do?\",\"options\":{\"A\":\"Use table clustering on key columns to reduce training cost\",\"B\":\"Partition tables and train models on relevant date partitions\",\"C\":\"Compress all data before training using column truncation\",\"D\":\"Convert tables to CSV and reload them with compute-friendly options\"},\"correct\":\"B\",\"explanation\":\"Partitioning tables allows BigQuery ML to scan only the relevant date slices needed for training, dramatically reducing processed bytes and overall compute costs.\"},{\"id\":\"46\",\"question\":\"A streaming data pipeline requires low-latency inference directly from a BigQuery ML model. What serving pattern should be implemented?\",\"options\":{\"A\":\"Schedule hourly batch prediction queries via Cloud Scheduler\",\"B\":\"Export the model to Cloud Storage and run inference in Cloud Functions\",\"C\":\"Use BigQuery ML online prediction endpoints\",\"D\":\"Use materialized views to precalculate predictions for all possible inputs\"},\"correct\":\"C\",\"explanation\":\"Online prediction endpoints provide stable, low-latency, query-based model serving suitable for streaming data.\"},{\"id\":\"47\",\"question\":\"A forecasting team wants to detect anomalies in a time series without external regressors. They want statistical anomaly detection based on ARIMA residuals. What should they use?\",\"options\":{\"A\":\"Use ML.ANOMALY_DETECTION to detect pattern deviations across models\",\"B\":\"Use manual residual analysis outside BigQuery with exported predictions\",\"C\":\"Use ML.PREDICT anomaly detection output columns\",\"D\":\"Replace ARIMA with logistic regression for anomaly detection\"},\"correct\":\"C\",\"explanation\":\"ARIMA_PLUS models automatically compute anomaly detection metrics (such as bounds and anomaly flags) directly within the results returned by ML.PREDICT.\"},{\"id\":\"48\",\"question\":\"You want to create custom numerical bucketization during feature preprocessing without leaving BigQuery ML. How should this be implemented?\",\"options\":{\"A\":\"Precompute buckets using a separate ETL Dataflow job\",\"B\":\"Define bucket expressions inside the TRANSFORM clause\",\"C\":\"Use ML.FEATURE_INFO to apply bucket thresholds post-training\",\"D\":\"Enable AUTO_BUCKET in the model training options\"},\"correct\":\"B\",\"explanation\":\"Custom bucketing expressions and feature preprocessing steps are fully supported via the TRANSFORM clause within the CREATE MODEL statement.\"},{\"id\":\"49\",\"question\":\"A startup wants to explore hidden patterns in customer surveys using BigQuery ML. They do not have labels. Which model suits them?\",\"options\":{\"A\":\"Logistic regression because it can cluster unlabeled responses\",\"B\":\"Boosted trees because they optimize nonlinear classification\",\"C\":\"PCA because it identifies principal components of variance\",\"D\":\"ARIMA because it identifies latent factors in text surveys\"},\"correct\":\"C\",\"explanation\":\"Principal Component Analysis (PCA) is an unsupervised learning method that reduces dimensionality and isolates principal variance patterns without requiring labeled target data.\"},{\"id\":\"50\",\"question\":\"An anomaly detection model is experiencing high false-positive rates due to shifting seasonal baseline data. How can you dynamically adapt anomaly boundaries?\",\"options\":{\"A\":\"Hardcode static standard deviation thresholds in SQL\",\"B\":\"Use dynamic quantile thresholds generated from reconstruction losses\",\"C\":\"Train a supervised logistic regression model to replace the anomaly detector\",\"D\":\"Disable anomaly smoothing parameters during inference\"},\"correct\":\"B\",\"explanation\":\"Dynamic quantile-based thresholds ensure anomaly boundaries adjust with new data distribution changes.\"},{\"id\":\"51\",\"question\":\"A retail company wants to automate model retraining in BigQuery ML whenever new daily data arrives. They want minimal manual intervention and reproducible scheduling. What is the recommended design?\",\"options\":{\"A\":\"Use Cloud Scheduler to export data and retrain models in external systems\",\"B\":\"Use Vertex Pipelines to orchestrate BigQuery training with custom containers\",\"C\":\"Use BigQuery scheduled queries to trigger retraining using SQL-based pipelines\",\"D\":\"Use BigQuery row-level triggers to automatically rerun training jobs each day\"},\"correct\":\"C\",\"explanation\":\"BigQuery scheduled queries natively automate SQL-based workflows like CREATE OR REPLACE MODEL on a defined cadence without external orchestration tools.\"},{\"id\":\"52\",\"question\":\"A team needs to understand why an individual customer was flagged as high-risk by a boosted tree classifier. Which BigQuery ML function should they use?\",\"options\":{\"A\":\"Use ML.GLOBAL_EXPLAIN to view overall feature importance\",\"B\":\"Use ML.WEIGHTS to inspect tree split thresholds\",\"C\":\"Use ML.LOCAL_EXPLAIN to obtain row-level feature attribution scores\",\"D\":\"Use ML.FEATURE_INFO to check the input data types\"},\"correct\":\"C\",\"explanation\":\"ML.LOCAL_EXPLAIN returns per-prediction feature attributions similar to SHAP values, allowing you to interpret individual predictions.\"},{\"id\":\"53\",\"question\":\"A logistics company needs a model that predicts delivery delays and automatically tunes the best regression algorithm. They want the simplest approach. What should they use?\",\"options\":{\"A\":\"Use BigQuery ML AUTO_ML_REGRESSOR to select algorithms and tune parameters\",\"B\":\"Use manual boosted-tree tuning scripts with parameter sweeps\",\"C\":\"Use logistic regression with polynomial terms to approximate target value\",\"D\":\"Use PCA reduction followed by manual regression modeling steps\"},\"correct\":\"A\",\"explanation\":\"AUTO_ML_REGRESSOR automates the entire architecture search, feature preprocessing, and hyperparameter tuning workflow directly inside BigQuery ML.\"},{\"id\":\"54\",\"question\":\"You need to automate continuous monitoring for prediction drift and data drift on a scheduled basis. What is the best native approach?\",\"options\":{\"A\":\"Export logs to Cloud Logging and create metric alerts\",\"B\":\"Use ML.DETECT_DRIFT with alerting thresholds and scheduled queries\",\"C\":\"Re-evaluate the model daily using ML.EVALUATE and compare loss values\",\"D\":\"Use Dataflow to stream predictions into a drift analysis dashboard\"},\"correct\":\"B\",\"explanation\":\"ML.DETECT_DRIFT automates drift detection and integrates with scheduled queries.\"},{\"id\":\"55\",\"question\":\"Your organization is building a time-series forecasting system using BigQuery ML. They want to automatically detect structural breaks and anomalies during long forecast windows. Which functionality addresses this?\",\"options\":{\"A\":\"Use manual SQL queries to detect prediction gaps across time\",\"B\":\"Use logistic regression to approximate seasonality disruptions\",\"C\":\"Use ARIMA_PLUS’s built-in anomaly detection returned by ML.PREDICT\",\"D\":\"Use cluster distances from a KMEANS model to detect anomalies\"},\"correct\":\"C\",\"explanation\":\"The ARIMA_PLUS algorithm natively tracks prediction intervals and surfaces structural breaks or spikes directly as anomaly flags during ML.PREDICT execution.\"},{\"id\":\"56\",\"question\":\"How does BigQuery ML automatically handle missing values in numerical columns during model training unless overridden?\",\"options\":{\"A\":\"It drops any row containing a NULL value across any feature column\",\"B\":\"Impute missing values automatically using mean or mode strategies\",\"C\":\"It replaces missing numerical values with zeros\",\"D\":\"It halts training and throws a schema validation error\"},\"correct\":\"B\",\"explanation\":\"BigQuery ML uses built-in automatic imputation strategies unless manual transformations are specified.\"},{\"id\":\"57\",\"question\":\"A company wants to limit BigQuery ML training costs. They note that training queries scan huge tables unnecessarily. What is a best practice?\",\"options\":{\"A\":\"Restrict training queries to filtered and partitioned subsets of data\",\"B\":\"Increase cluster count to reduce the amount of scanned data\",\"C\":\"Train models using SELECT * because BigQuery ML optimizes scans\",\"D\":\"Use unclustered tables to encourage BigQuery to optimize I/O\"},\"correct\":\"A\",\"explanation\":\"Best practice for optimizing BigQuery costs is to filter out unnecessary columns and leverage table partitioning/clustering to scan only the data required for training.\"},{\"id\":\"58\",\"question\":\"What is the most direct way to extract forecast intervals and confidence bounds from an ARIMA_PLUS model in BigQuery ML?\",\"options\":{\"A\":\"Calculate standard error manually using historical variance in SQL\",\"B\":\"Use prediction lower and upper bounds from ARIMA ML.PREDICT\",\"C\":\"Run ML.EVALUATE to extract confidence boundaries\",\"D\":\"Use ML.EXPLAIN_PREDICT to generate upper and lower limits\"},\"correct\":\"B\",\"explanation\":\"ARIMA models output forecast intervals directly in ML.PREDICT.\"},{\"id\":\"59\",\"question\":\"A mobile app team wants extremely fast predictions from a BigQuery ML model and requires less than 100ms latency. Which approach fits?\",\"options\":{\"A\":\"Use BigQuery scheduled batch predictions to simulate real-time scoring\",\"B\":\"Use partitioned tables with materialized predictions refreshed hourly\",\"C\":\"Use BigQuery ML online prediction endpoints for sub-100ms inference\",\"D\":\"Export the model and host it inside a custom container at low cost\"},\"correct\":\"C\",\"explanation\":\"Online prediction endpoints provide low-latency inference suitable for streaming data.\"},{\"id\":\"60\",\"question\":\"You are managing multiple online prediction endpoints and need to prevent unexpected billing spikes from excessive client requests. What should you configure?\",\"options\":{\"A\":\"Enable cost-based inference quotas on online endpoints\",\"B\":\"Scale down the endpoint node count to zero during peak hours\",\"C\":\"Put a Cloud CDN caching layer in front of the BigQuery ML model\",\"D\":\"Switch the model serving mode from online to batch prediction\"},\"correct\":\"A\",\"explanation\":\"Online prediction quotas restrict the maximum allowable usage within cost budgets.\"},{\"id\":\"61\",\"question\":\"A data team wants to simplify feature engineering by having BigQuery ML automatically transform features. They want interactions and bucketization without manual SQL. What should they use?\",\"options\":{\"A\":\"Use MODEL_OPTIONS to enable auto-transformation of all inputs\",\"B\":\"Use manually written SQL scripts that precompute all feature transformations\",\"C\":\"Use the TRANSFORM clause to declaratively specify feature transformations\",\"D\":\"Use feature engineering notebooks outside BigQuery to manage pipelines\"},\"correct\":\"C\",\"explanation\":\"The TRANSFORM clause embeds feature engineering logic directly inside the model artifact, ensuring consistent transformations across both training and serving.\"},{\"id\":\"62\",\"question\":\"You need to obtain per-instance feature attribution explanations for predictions generated by a BigQuery ML model. Which function should you use?\",\"options\":{\"A\":\"Use ML.GLOBAL_EXPLAIN\",\"B\":\"Use ML.FEATURE_IMPORTANCE\",\"C\":\"Use ML.LOCAL_EXPLAIN to retrieve attribution scores for each row\",\"D\":\"Use ML.WEIGHTS\"},\"correct\":\"C\",\"explanation\":\"ML.LOCAL_EXPLAIN provides per-instance feature attribution explanations.\"},{\"id\":\"63\",\"question\":\"A company wants to consolidate multiple BigQuery ML models and evaluate them simultaneously. They need a unified performance comparison. Which feature should they use?\",\"options\":{\"A\":\"Use confusion matrices stored in monitoring tables to compare runs\",\"B\":\"Use ML.COMPRESS_MODELS to aggregate multiple candidates for comparison\",\"C\":\"Use ML.COMPARE to analyze metrics across multiple models\",\"D\":\"Use SQL windows to compute metric differences across predictions\"},\"correct\":\"C\",\"explanation\":\"ML.COMPARE evaluates and contrasts performance metrics (like accuracy, RMSE, or AUC) across multiple model artifacts simultaneously in a single tabular view.\"},{\"id\":\"64\",\"question\":\"A team needs to identify feature incompatibility between incoming serving data and the training schema. Which tool should they use?\",\"options\":{\"A\":\"Use ML.DETECT_DRIFT\",\"B\":\"Use ML.VALIDATE_FEATURES to check feature compatibility\",\"C\":\"Use ML.FEATURE_INFO\",\"D\":\"Use ML.EVALUATE\"},\"correct\":\"B\",\"explanation\":\"ML.VALIDATE_FEATURES verifies that input data conforms to the model’s training schema and constraints.\"},{\"id\":\"65\",\"question\":\"A manufacturing firm uses BigQuery ML for anomaly detection. They want to evaluate anomalies over many variables at once. What approach works best?\",\"options\":{\"A\":\"Use logistic regression to model rare occurrences across variables\",\"B\":\"Use autoencoder models to detect anomalies using reconstruction losses\",\"C\":\"Use boosted-tree classification without including negative examples\",\"D\":\"Use PCA-based dimension reduction for predicting anomalies directly\"},\"correct\":\"B\",\"explanation\":\"Autoencoders compress and reconstruct multi-variable input data; observations with high reconstruction error signify multivariate anomalies.\"},{\"id\":\"66\",\"question\":\"Which BigQuery ML serving capability provides stable, low-latency, query-based model serving for interactive applications?\",\"options\":{\"A\":\"Cloud Functions triggering ML.PREDICT\",\"B\":\"BigQuery scheduled batch inference queries\",\"C\":\"Use BigQuery ML online prediction endpoints\",\"D\":\"Exporting models to local edge devices\"},\"correct\":\"C\",\"explanation\":\"Online prediction endpoints provide stable, low-latency, query-based model serving.\"},{\"id\":\"67\",\"question\":\"A sales analytics team wants to generate feature-level insights from a linear regression model. They want to understand how features influence predictions globally. Which tool provides this?\",\"options\":{\"A\":\"Use ML.LOCAL_EXPLAIN for global coefficient attribution patterns\",\"B\":\"Use ML.COMPRESS_MODEL to summarize model-level transformations\",\"C\":\"Use ML.WEIGHTS for global coefficients and feature importance\",\"D\":\"Use ML.FEATURE_INFO to understand feature data types only\"},\"correct\":\"C\",\"explanation\":\"ML.WEIGHTS extracts the underlying linear regression weights (coefficients), revealing exactly how each feature influences the global output predictions.\"},{\"id\":\"68\",\"question\":\"When deploying online prediction endpoints in BigQuery ML, how can you ensure predictability in cloud infrastructure expenditures?\",\"options\":{\"A\":\"Enable cost-based inference quotas on online endpoints\",\"B\":\"Restrict queries to run only during off-peak billing hours\",\"C\":\"Use unpartitioned tables for all batch prediction storage\",\"D\":\"Compress the model weights using ML.COMPRESS_MODEL\"},\"correct\":\"A\",\"explanation\":\"Cost-based inference quotas place hard operational limits on endpoint usage, preventing unexpected billing overages from high traffic volumes.\"},{\"id\":\"69\",\"question\":\"A data science team wants to evaluate the impact of new neural embeddings introduced into their BigQuery ML classifier. They want feature contribution summaries aggregated across all predictions. What function should they call?\",\"options\":{\"A\":\"Use ML.LOCAL_EXPLAIN to retrieve feature explanations for each prediction\",\"B\":\"Use ML.PREDICT to extract embedding weight impacts row by row\",\"C\":\"Use ML.WEIGHTS to retrieve global linear coefficients for embeddings\",\"D\":\"Use ML.GLOBAL_EXPLAIN to obtain global feature attribution summaries\"},\"correct\":\"D\",\"explanation\":\"ML.GLOBAL_EXPLAIN aggregates SHAP-based attributions across the entire evaluation dataset to quantify overall global feature importance for complex models.\"},{\"id\":\"71\",\"question\":\"A company uses BigQuery ML for daily churn prediction. They want to know whether the model's input distribution is shifting significantly. What solution fits?\",\"options\":{\"A\":\"Use ML.THRESHOLD EVALUATE to compare classification thresholds\",\"B\":\"Use ML.DETECT DRIFT to detect input feature and prediction drift\",\"C\":\"Use ML-WEIGHTS to track changes in model parameters\",\"D\":\"Use ROC curves from ML.EVALUATE to detect data drift patterns RI serra \u003c TE \\\", =e =e s' 4 —s* e “Ww A) 4° Si s ¢\"},\"correct\":\"B\",\"explanation\":\"Watermarking with accumulation mode ensures consistent, final window outputs, even under late data.\"},{\"id\":\"72\",\"question\":\"A research team wants to build a BigQuery ML forecasting model but also incorporate external regressors for greater accuracy. What should they choose?\",\"options\":{\"A\":\"Use ARIMA PLUS to model regressors implicitly through timestamps\",\"B\":\"Use LOGISTIC_REG to approximate forecasting across regressors\",\"C\":\"Use AUTO ML FORECASTER to automatically select model types\",\"D\":\"Use ARIMA _PLUS XREG to include exogenous variables\"},\"correct\":\"A\",\"explanation\":\"Classic streaming pattern with low latency.\"},{\"id\":\"74\",\"question\":\"A team needs to determine whether their BigQuery ML model is still accurate after deployment. They collect actual labels periodically and want automated evaluation. What should they implement?\",\"options\":{\"A\":\"Use monitoring dashboards that track prediction histograms daily\",\"B\":\"Use ML.RETRAIN MODEL to automatically measure accuracy drift\",\"C\":\"Use ML.MONITORING tables with accuracy-based triggers\",\"D\":\"Use manual SQL joins to compare predictions with labels monthly\"},\"correct\":\"C\",\"explanation\":\"Writing to a temp location and performing an atomic rename (i.e., move) prevents partial reads.\"},{\"id\":\"76\",\"question\":\"A pipeline loads CSV files into BigQuery nightly. Sometimes corrupted rows appear. ou need a scalable method to detect malformed records before loading. What should you implement?\",\"options\":{\"A\":\"Implement a Dataflow batch pipeline with schema validation before BigQuery load\",\"B\":\"Use Cloud Functions to upload only valid rows to BigQuery\",\"C\":\"Write a BigQuery scheduled query to detect invalid rows\",\"D\":\"Use Pub/Sub filtering rules to drop malformed entries\"},\"correct\":\"A\",\"explanation\":\"Dataflow windowing/triggering manages late- arriving data without recomputing full partitions.\"},{\"id\":\"78\",\"question\":\"Your ML feature store requires both historical offline features and low-latency online serving features. Access patterns differ drastically. Which architecture best satisfies both needs?\",\"options\":{\"A\":\"Use Dataproc for offline features and Firestore for online lookup\",\"B\":\"Store both offline and online features in the same BigQuery table\",\"C\":\"Store offline features entirely in Cloud Storage for batch reads\",\"D\":\"Use BigQuery for offline features and Bigtable for online serving\"},\"correct\":\"A\",\"explanation\":\"ML.DETECT DRIFT automatically identifies shifts in features or prediction outcomes.\"},{\"id\":\"80\",\"question\":\"An ML workflow requires storing large tabular features for repeated model retraining and efficient querying. Which approach is optimal?\",\"options\":{\"A\":\"Store the features in BigQuery partitioned tables for fast analytical access\",\"B\":\"Store them in Cloud Storage text files and query using gsutil each time\",\"C\":\"Use local SSDs on Compute Engine instances to store training data\",\"D\":\"Store them in Firestore collections for high read throughput\"},\"correct\":\"A\",\"explanation\":\"The Storage Write API reduces latency and backpressure.\"},{\"id\":\"82\",\"question\":\"Your Dataflow job joins streaming events with a frequently updated lookup file stored in Cloud Storage. Loading the entire file each refresh cycle wastes resources. You need granular, low-latency lookups. hat should you do?\",\"options\":{\"A\":\"Embed all lookup data in worker static memory\",\"B\":\"Rewrite the lookup file into thousands of small segments\",\"C\":\"Move lookup data into Bigtable and perform per-event lookups\",\"D\":\"Use BigQuery views for each streaming event request\"}},{\"id\":\"84\",\"question\":\"A dataset contains multiple versions of the same entity across days. You need to build ML features using only the latest available record for each entity. What should you do?\",\"options\":{\"A\":\"Sort entities manually in Cloud Storage before processing\",\"B\":\"Store all entity versions as raw JSON and extract latest on demand\",\"C\":\"Use BigQuery window functions to pick latest per entity\",\"D\":\"Use Cloud SQL stored procedures to precompute latest values\"}},{\"id\":\"86\",\"question\":\"A production ML pipeline writes inference results into BigQuery. Some rows are corrupt because they were written during an upstream outage. You need a mechanism to isolate unhealthy data segments for reprocessing. What is the best solution?\",\"options\":{\"A\":\"Store data in partitioned BigQuery tables and mark unhealthy partitions\",\"B\":\"Store all inference results in a single unpartitioned BigQuery table\",\"C\":\"Use Dataflow to automatically delete unhealthy rows upon detection\",\"D\":\"Merge corrupted rows into Cloud Storage files without partition tags\"},\"correct\":\"C\",\"explanation\":\"Incremental processing based on metadata allows processing only new or changed files, reducing compute cost.\"},{\"id\":\"88\",\"question\":\"Your team needs to generate daily aggregates for ML features stored in BigQuery. Aggregations must run faster than current SQL queries. What should you do?\",\"options\":{\"A\":\"Use BigQuery BI Engine to accelerate analytical workloads\",\"B\":\"Use BigQuery materialized views for efficient incremental aggregation\",\"C\":\"Export the data to Cloud Storage and aggregate using local scripts\",\"D\":\"Use scheduled queries that always recompute all records\"},\"correct\":\"A\",\"explanation\":\"Dataflow side inputs allow low-latency enrichment with frequently refreshed lookup tables.\"},{\"id\":\"90\",\"question\":\"You ingest millions of structured logs daily and need a storage format optimized for ML feature extraction. You must support predicate pushdown and columnar reads. hat format is best?\",\"options\":{\"A\":\"Store logs in Cloud Storage as JSON files\",\"B\":\"Store logs in Cloud Storage as Avro files\",\"C\":\"Store logs in Cloud Storage as Parquet files\",\"D\":\"Store logs in Cloud Storage as plain text records\"},\"correct\":\"A\",\"explanation\":\"Stateful DoFns allow exact tracking of seen keys, enabling scalable deduplication.\"},{\"id\":\"92\",\"question\":\"You maintain a pipeline that extracts features for training and validation. Recently, feature distributions shifted subtly, causing reduced model accuracy. You need automated drift detection across features. What should you use?\",\"options\":{\"A\":\"Implement manual SQL queries to compare distributions each week\",\"B\":\"Use TensorFlow Data Validation to compute drift and anomaly scores\",\"C\":\"Use Cloud Logging metrics to alert on distribution changes\",\"D\":\"Use Pub/Sub filtering rules to drop unexpected outlier values\"},\"correct\":\"D\",\"explanation\":\"Dataflow offers exactly-once semantics when deduplicating based on stable identifiers.\"},{\"id\":\"94\",\"question\":\"You have a Dataflow streaming pipeline consuming Pub/Sub events. You want to ensure that message duplication never affects downstream analytics. What should ou implement?\",\"options\":{\"A\":\"Use exactly-once Pub/Sub delivery for all consumers\",\"B\":\"Use Dataflow’s built-in deduplication with stable unique IDs\",\"C\":\"Use Cloud Functions to drop any duplicate messages manually\",\"D\":\"Use BigQuery merge statements on all consumed events\"},\"correct\":\"C\",\"explanation\":\"Avro supports strict schemas, compression, and efficient consumption by ML pipelines.\"},{\"id\":\"96\",\"question\":\"A model training pipeline depends on several upstream preprocessing tasks. Some tasks occasionally fail, leaving partial outputs in Cloud Storage. You need to ensure downstream components only consume fully generated datasets. What is the best solution?\",\"options\":{\"A\":\"Use Cloud Scheduler to verify data exists before training begins\",\"B\":\"Use Cloud Logging alerts to notify engineers about missing files\",\"C\":\"Use naming conventions in Cloud Storage to track processing status\",\"D\":\"Use Dataflow to produce atomic output folders with completion markers\"},\"correct\":\"A\",\"explanation\":\"Atomic rename ensures no downstream consumer ever sees incomplete outputs.\"},{\"id\":\"98\",\"question\":\"An ML feature store needs sub-second lookup times for online predictions while also supporting large offline batch reads for retraining. What architecture satisfies both requirements?\",\"options\":{\"A\":\"Use Firestore for online lookup and train directly from Firestore exports\",\"B\":\"Use Memorystore for online lookup and store offline features in Cloud SQL\",\"C\":\"Use Cloud SQL for online lookup and use BigQuery for offline features\",\"D\":\"Use Bigtable for online lookup and store offline features in BigQuery\"},\"correct\":\"D\",\"explanation\":\"ML.GENERATE EMBEDDINGS creates contextual embeddings using integrated foundation models.\"},{\"id\":\"100\",\"question\":\"A customer-behavior model consumes daily snapshots stored in Cloud Storage. You notice that some snapshots are incomplete due to partially uploaded files. ou must prevent the pipeline from ingesting incomplete snapshots. What should you do?\",\"options\":{\"A\":\"Use Cloud Storage lifecycle rules to automatically delete incomplete snapshots\",\"B\":\"Use Pub/Sub notifications to process files as soon as uploads begin\",\"C\":\"Use BigQuery error logs to detect incomplete ingestion events\",\"D\":\"Use Cloud Storage compose or object finalize events to process only completed files\"},\"correct\":\"C\",\"explanation\":\"Partitioning + clustering dramatically reduces BigQuery scan costs and improves performance.\"},{\"id\":\"102\",\"question\":\"Your Dataflow pipeline currently consumes Pub/Sub events and writes results to BigQuery. You notice growing lag during sudden traffic spikes. Which improvement increases elasticity without manual provisioning?\",\"options\":{\"A\":\"Increase Pub/Sub publisher batching delay\",\"B\":\"Reduce Dataflow autoscaling limits to stabilize throughput\",\"C\":\"Switch to Dataproc streaming with manual worker scripts\",\"D\":\"Enable Dataflow Streaming Engine for enhanced autoscaling\"}},{\"id\":\"104\",\"question\":\"A dataset used for model training mixes timestamps from multiple time zones. Some events appear temporally inconsistent, affecting feature calculations. What should ou implement?\",\"options\":{\"A\":\"Leave timestamps unchanged and rely on the model to learn offsets\",\"B\":\"Convert all timestamps to local device time for consistency\",\"C\":\"Tag each timestamp with time-zone metadata but store raw times only\",\"D\":\"Normalize all timestamps to UTC before upstream processing\"},\"correct\":\"A\",\"explanation\":\"BigQuery snapshots guarantee transactionally consistent, point-in-time reads regardless of ongoing writes.\"},{\"id\":\"106\",\"question\":\"A Dataflow streaming pipeline processes telemetry events and writes the results to Cloud Storage. You observe that output folder structures grow endlessly and make downstream discovery difficult. You need a scalable and organized layout. What is the best approach?\",\"options\":{\"A\":\"Generate output directories based on event type and day of processing\",\"B\":\"Store all objects in a single folder but include type prefixes in filenames\",\"C\":\"Write files into partitioned subfolders using event timestamps\",\"D\":\"Randomize folder names to reduce contention during writes Milly, eet ee * ~~, S att! u ty\"},\"correct\":\"C\",\"explanation\":\"Finalize events ensure that files are fully written, and verifying checksums prevents ingestion of truncated or corrupt files.\"},{\"id\":\"107\",\"question\":\"You operate a training pipeline that joins transactional data stored in BigQuery with large reference tables stored in Cloud Storage. Query performance is slow due to frequent full scans. What should you do?\",\"options\":{\"A\":\"Convert the Cloud Storage reference files from CSV to JSON for faster loading\",\"B\":\"Load the Cloud Storage reference data into Firestore for low-latency lookups\",\"C\":\"Load the reference objects into BigQuery and apply clustering to speed joins\",\"D\":\"Preload the reference objects into Compute Engine VMs for local joins\"},\"correct\":\"A\",\"explanation\":\"Bigtable row-range caching improves random- access lookups when the same hot keys appear frequently, reducing tail latency significantly.\"},{\"id\":\"109\",\"question\":\"Your ML pipeline must handle late- arriving data for up to 72 hours. However, storing huge amounts of state for that duration increases memory pressure. You need a scalable approach. What do you do?\",\"options\":{\"A\":\"Reduce allowed lateness and discard late events after 24 hours\",\"B\":\"Use Dataflow state expiration policies to prune old keys\",\"C\":\"Store all historical state in Cloud SQL for long-term retention\",\"D\":\"Enforce synchronous clock correction on all upstream devices\"},\"correct\":\"A\",\"explanation\":\"Hash buckets avoid massive vocabularies and ensure distributed, memory-efficient encoding.\"},{\"id\":\"111\",\"question\":\"A fraud-detection model requires computing rolling 5-minute sums. Because of bursts in network delays, events often arrive after their window closes. The model must still receive corrected aggregates. What should you implement?\",\"options\":{\"A\":\"Watermarks with zero allowed lateness to enforce strict timing\",\"B\":\"Sliding windows without late firings to simplify computation\",\"C\":\"Fixed windows with late triggers to recompute outputs when needed\",\"D\":\"Session windows that merge all events within a period of inactivity\"},\"correct\":\"C\",\"explanation\":\"Dataflow validation ensures consistent structure before writing outputs.\"},{\"id\":\"113\",\"question\":\"A Dataflow pipeline writes tens of thousands of small files into Cloud Storage each hour. Downstream systems struggle with performance due to object listing overhead. How can you reduce this bottleneck?\",\"options\":{\"A\":\"Increase downstream CPU resources to handle listing operations\",\"B\":\"Use Cloud Functions to batch files into groups after writing\",\"C\":\"Use Dataflow to combine small outputs into fewer large files\",\"D\":\"Store all results in a single large file and append continuously\"},\"correct\":\"C\",\"explanation\":\"Timestamp-based partitioned folders support efficient lookup and scalable downstream consumption.\"},{\"id\":\"115\",\"question\":\"Your Dataflow job enriches streaming events using a lookup table stored in BigQuery. Occasionally, the lookup table is updated, but the Dataflow job does not immediately pick up changes, causing stale enrichments. You need more timely lookups without restarting the pipeline. What should you do?\",\"options\":{\"A\":\"Use Dataflow side inputs that reload data only when the pipeline restarts\",\"B\":\"Use Dataflow BigQuery Storage API reads with periodic refresh intervals\",\"C\":\"Use Cloud Functions to push updated reference rows directly into worker memory\",\"D\":\"Use Cloud Scheduler to pause the pipeline while reference tables update\"},\"correct\":\"A\",\"explanation\":\"Parquet bundles are columnar, compressed, and optimized for vectorized reads, drastically improving ingestion time and preserving consistent schemas.\"},{\"id\":\"117\",\"question\":\"Your BigQuery ingestion workflow receives files from external partners. Some partners occasionally send files with incorrect column orders. You want to validate file structure before ingestion and reject incorrectly ordered data automatically. What is the best solution?\",\"options\":{\"A\":\"Rely on BigQuery to auto-detect incorrect ordering and realign columns\",\"B\":\"Use Cloud Logging to manually inspect schema mismatches each day\",\"C\":\"Allow ingestion and use post-processing queries to fix order issues\",\"D\":\"Use Dataflow to parse files and enforce strict column order validation\"}},{\"id\":\"119\",\"question\":\"You run a pipeline that joins streaming events with a 20-GB static mapping file stored in Cloud Storage. Loading this mapping file as a Dataflow side input leads to repeated reloads and worker memory pressure. You need a more scalable approach. What should you do?\",\"options\":{\"A\":\"Split the mapping file into thousands of small shards across many buckets\",\"B\":\"Load the mapping file into Bigtable and perform lookups directly from Dataflow\",\"C\":\"Convert the mapping file into Avro and rely on local worker caching\",\"D\":\"Store the mapping file inside Pub/Sub as a retained configuration stream\"}},{\"id\":\"121\",\"question\":\"Your Dataflow pipeline reads from Pub/Sub, but message throughput varies widely throughout the week. At peak times, Dataflow autoscaling cannot keep up, causing lag. You want to improve performance without provisioning static compute. What should you do?\",\"options\":{\"A\":\"Tune Pub/Sub publisher batching parameters to slow ingestion\",\"B\":\"Use Cloud Functions to preprocess messages before Dataflow consumes them\",\"C\":\"Introduce Cloud Storage buffering before messages enter Dataflow\",\"D\":\"Enable Dataflow Streaming Engine to separate compute from state scaling\"},\"correct\":\"A\",\"explanation\":\"Stateful per-key Dataflow transforms allow local event buffering and ordering, producing deterministic sequences per user stream despite arrival disorder.\"},{\"id\":\"123\",\"question\":\"A pipeline writes transformed training data into BigQuery using the Storage Write API. You observe occasional errors due to schema evolution upstream. You need a safe and automated method to prevent writes when incompatible changes occur. What should you do?\",\"options\":{\"A\":\"Disable schema enforcement and allow BigQuery to append unknown columns\",\"B\":\"Enable BigQuery schema compatibility checks before each batch write\",\"C\":\"Convert all rows into JSON and store them without column constraints\",\"D\":\"Rely on downstream feature stores to correct incompatible schemas ~% = | wy,\"},\"correct\":\"C\",\"explanation\":\"Dataflow allows real-time validation and branching—valid records continue downstream and malformed ones are routed to quarantine instantly.\"},{\"id\":\"125\",\"question\":\"Your streaming pipeline enriches clickstream events with session metadata. During traffic spikes, the enrichment step becomes a bottleneck due to high-latency lookups in Cloud SQL. You need lower- latency and more scalable enrichment without redesigning the data model. What should you do?\",\"options\":{\"A\":\"Enable SQL read replicas to distribute lookup traffic automatically\",\"B\":\"Cache session metadata inside Cloud Functions for faster retrieval\",\"C\":\"Preload session metadata into Compute Engine VMs using cron jobs\",\"D\":\"Move session metadata to Bigtable and perform lookups from Dataflow\"},\"correct\":\"A\",\"explanation\":\"Partition pruning allows selective reads of changed data, reducing cost and runtime significantly.\"},{\"id\":\"127\",\"question\":\"You receive daily Parquet files from an external partner. Some files contain outdated schemas that do not match your current feature definitions. You need to enforce schema compatibility before loading them into BigQuery. What should you do?\",\"options\":{\"A\":\"Assume schema changes are backward compatible and load files directly\",\"B\":\"Use Dataflow to inspect the Parquet schema and reject incompatible files\",\"C\":\"Allow BigQuery to auto-evolve the schema whenever new fields appear\",\"D\":\"Store outdated files in a separate bucket without validation\"},\"correct\":\"C\",\"explanation\":\"A write-to-temp — atomic rename pattern ensures consumers never read incomplete outputs.\"},{\"id\":\"129\",\"question\":\"Your team must perform anomaly detection on incoming events in a Dataflow streaming pipeline. Anomalies are rare, and the pipeline should flag them while continuing normal processing with minimal overhead. What is the best design?\",\"options\":{\"A\":\"Use Cloud Functions to evaluate each event and report anomalies\",\"B\":\"Use scheduled BigQuery queries to scan for anomalies periodically\",\"C\":\"Store anomalies in memory within worker instances for fast retrieval\",\"D\":\"Apply Dataflow branching to route anomalies to a dedicated sink\"},\"correct\":\"A\",\"explanation\":\"TFDV automatically computes statistics, drift scores, and anomaly detection, including time-distribution validations.\"},{\"id\":\"131\",\"question\":\"Your BigQuery tables are partitioned by event date, but clustering is not used. Analysts complain that queries scanning multiple user IDs still read entire partitions. You need a cost-effective improvement. What should you do?\",\"options\":{\"A\":\"Split partitions into independent tables per user ID\",\"B\":\"Add clustering by user ID to reduce scanned blocks\",\"C\":\"Add additional date fields to reduce dependence on partitions\",\"D\":\"Export all partitions into Cloud Storage as optimized files\"},\"correct\":\"C\",\"explanation\":\"Event-time windows with allowed lateness ensure accurate aggregation even when events arrive hours late.\"},{\"id\":\"133\",\"question\":\"You store intermediate ML datasets as Avro in Cloud Storage. While these files are read efficiently by Dataflow, analysts struggle to work with them interactively. You need a format that supports both efficient pipeline consumption and analytical SQL queries. What should you do?\",\"options\":{\"A\":\"Convert all files into compressed JSON for analyst readability\",\"B\":\"Convert Avro files into CSV for simple SQL joins in BigQuery\",\"C\":\"Convert them into nested Protocol Buffers for consistent structure\",\"D\":\"Load the data into BigQuery and maintain tables for interactive queries\"},\"correct\":\"B\",\"explanation\":\"Dataflow supports event-time alignment with custom skew correction, maintaining ordering across regions.\"},{\"id\":\"135\",\"question\":\"Your ML team uses Dataflow to generate normalized user-level features. Some users generate extremely large olumes of events causing worker memory pressure during grouping. You need a scalable way to handle these skewed keys without redesigning the data schema. What should you do?\",\"options\":{\"A\":\"Enforce strict per-key memory limits to skip oversized user groups\",\"B\":\"Use Dataflow hot-key mitigation by sharding large keys during grouping\",\"C\":\"Route heavy-volume users to a separate pipeline with dedicated workers\",\"D\":\"Store all heavy users’ events temporarily in Cloud SQL before grouping\"},\"correct\":\"C\",\"explanation\":\"Clustering organizes data by product ID, improving pruning and drastically lowering scan volume.\"},{\"id\":\"137\",\"question\":\"A Dataflow streaming job uses fixed windows for aggregating metrics. However, when late-arriving data arrives after the window closes, recomputed outputs overwrite prior results, creating inconsistencies. You need an approach that preserves output history. What should you do?\",\"options\":{\"A\":\"Use session windows to avoid recomputation entirely\",\"B\":\"Use dual pipelines to store early and late results separately\",\"C\":\"Disable accumulation mode to prevent window recomputation\",\"D\":\"Use Dataflow accumulation with timestamped versions of each update\"}},{\"id\":\"139\",\"question\":\"A pipeline periodically refreshes a Cloud Storage dataset containing millions of small metadata files. Listing these files increasingly slows down downstream tasks. How can you improve efficiency?\",\"options\":{\"A\":\"Merge the metadata files manually using Cloud Console file operations\",\"B\":\"Use Dataflow to compact small files into larger columnar bundles\",\"C\":\"Use Pub/Sub notifications to speed up Cloud Storage directory listing\",\"D\":\"Use BigQuery to query metadata directly from Cloud Storage paths\"},\"correct\":\"C\",\"explanation\":\"Custom parsing in Dataflow allows strict and configurable validation.\"},{\"id\":\"211\",\"question\":\"Your TensorFlow CNN underfits even with long training. Both training and validation accuracy remain low. What should you do?\",\"options\":{\"A\":\"Increase model capacity by adding deeper layers or more filters to capture richer patterns\",\"B\":\"Increase dropout which reduces model complexity and deepens underfitting\",\"C\":\"Apply stronger augmentation which typically makes learning harder for an already weak model\",\"D\":\"Decrease learning rate though this rarely fixes insufficient representational power\"},\"correct\":\"A\",\"explanation\":\"Underfitting requires more capacity, not more regularization.\"},{\"id\":\"212\",\"question\":\"Your XGBoost model shows good training accuracy but poor validation accuracy. Trees appear too deep. What should you change?\",\"options\":{\"A\":\"Increase number of estimators though deeper ensembles worsen overfitting\",\"B\":\"Reduce max depth and increase regularization to constrain model complexity\",\"C\":\"Increase learning rate which speeds training but worsens overfitting\",\"D\":\"Disable sampling which usually increases variance and harms generalization\"},\"correct\":\"B\",\"explanation\":\"When an XGBoost model exhibits high training accuracy but poor validation accuracy, it is overfitting. Reducing max depth and increasing regularization constrains tree complexity and improves generalization on unseen data.\"},{\"id\":\"214\",\"question\":\"Distributed TensorFlow shows poor scaling because GPUs communicate too often. What helps reduce communication costs?\",\"options\":{\"A\":\"Increase hidden size which increases compute but not reduce communication frequency\",\"B\":\"Train for fewer epochs though this does not address scaling efficiency\",\"C\":\"Reduce dropout which affects regularization but not communication frequency\",\"D\":\"Increase batch size or apply gradient accumulation to reduce synchronization events\"},\"correct\":\"D\",\"explanation\":\"Increasing the batch size or applying gradient accumulation reduces the number of gradient synchronization events across GPU workers, significantly lowering communication overhead during distributed training.\"},{\"id\":\"216\",\"question\":\"Your TensorFlow model experiences unstable loss when trained on TPU. Gradients fluctuate widely. What is the best fix?\",\"options\":{\"A\":\"Remove batch normalization though instability often arises from large effective batch sizes\",\"B\":\"Reduce global batch size or apply gradient clipping to stabilize gradients\",\"C\":\"Use fewer TPU cores though the instability is not related to core count\",\"D\":\"Increase learning rate though this typically amplifies instability\"},\"correct\":\"B\",\"explanation\":\"Training on TPUs often involves large effective batch sizes that can cause gradient spikes. Reducing global batch size or applying gradient clipping prevents gradient explosion and stabilizes training loss.\"},{\"id\":\"218\",\"question\":\"Your XGBoost binary classifier produces extremely imbalanced predictions. What tuning change addresses the issue?\",\"options\":{\"A\":\"Reduce gamma to allow trees to grow more shallow structures.\",\"B\":\"Increase colsample bytree to include more features per split.\",\"C\":\"Adjust scale_pos weight to reflect class distribution balance.\",\"D\":\"Increase subsample values to reduce the effect of minority samples.\"},\"correct\":\"C\",\"explanation\":\"For imbalanced binary classification tasks in XGBoost, adjusting scale_pos weight scales the gradient steps for the positive minority class, helping the algorithm learn balanced decision boundaries.\"},{\"id\":\"220\",\"question\":\"A TensorFlow RNN model is too slow during training. What is the best performance optimization?\",\"options\":{\"A\":\"Replace LSTM layers with deeper LSTM stacks for more GPU usage.\",\"B\":\"Use CuDNN-optimized LSTM layers to accelerate RNN computation.\",\"C\":\"Increase dropout within LSTM layers to reduce computation.\",\"D\":\"Decrease sequence length without altering model design.\"},\"correct\":\"B\",\"explanation\":\"Standard recurrent layers require multiple individual GPU kernel launches. Using CuDNN-optimized LSTM layers consolidates these operations into high-performance NVIDIA routines, significantly accelerating RNN training.\"},{\"id\":\"222\",\"question\":\"Your TensorFlow model trains slowly due to Python loops inside the model graph. What improves performance?\",\"options\":{\"A\":\"Increase optimizer learning rate though this does not improve execution speed\",\"B\":\"Add GPUs which does not solve Python execution bottlenecks\",\"C\":\"Increase dropout which has no effect on model graph execution\",\"D\":\"Convert Python logic into TensorFlow ops to eliminate Python bottlenecks\"},\"correct\":\"D\",\"explanation\":\"Python loops inside a model graph create execution bottlenecks because they cannot be optimized by the TensorFlow runtime. Converting Python logic into native TensorFlow tensor operations eliminates these bottlenecks and enables full graph optimization.\"},{\"id\":\"224\",\"question\":\"You are deploying a new model version to Vertex AI and want zero downtime while gradually shifting traffic for testing. What should you do?\",\"options\":{\"A\":\"Configure a Vertex AI endpoint with traffic split between the old and new model versions.\",\"B\":\"Deploy the new model to a separate endpoint and manually route traffic through Cloud Load Balancing.\",\"C\":\"Deploy the new model to the same endpoint by overriding the previous version entirely.\",\"D\":\"Use Cloud Functions to proxy requests between endpoints for gradual migration.\"},\"correct\":\"A\",\"explanation\":\"Vertex AI endpoints natively support multi-model deployment with percentage-based traffic splitting. This enables zero-downtime canary deployments and gradual traffic shifts without requiring external infrastructure changes.\"},{\"id\":\"226\",\"question\":\"You want to gradually change the model threshold used to convert probabilities to binary decisions without redeploying the model itself. Downstream systems want stability. What is the best design?\",\"options\":{\"A\":\"Hardcode the new threshold value inside the model container and rebuild images frequently.\",\"B\":\"Make the threshold configurable via an external config service and update it under change control.\",\"C\":\"Ask downstream systems to adjust the threshold locally on whatever probabilities they receive.\",\"D\":\"Retrain the model with a different loss function so the probabilities map better to decisions.\"},\"correct\":\"B\",\"explanation\":\"Decoupling post-processing logic from the container artifact allows operational flexibility. Making the classification threshold configurable via an external config service enables safe, controlled updates without rebuilding or redeploying model images.\"},{\"id\":\"228\",\"question\":\"You suspect that a newly deployed model performs well overall but clusters of low-performing segments exist for specific user groups. You want to detect this automatically. What is the best strategy?\",\"options\":{\"A\":\"Compute global accuracy metrics daily and accept small local variations in performance.\",\"B\":\"Use sliced evaluation to compute metrics per segment and store them for analysis and alerts.\",\"C\":\"Enable more verbose logging for predictions and review random samples manually.\",\"D\":\"Retrain the model with more data and assume performance improves across all user groups.\"},\"correct\":\"B\",\"explanation\":\"Global aggregate metrics can obscure localized performance degradation in specific user subsets. Sliced evaluation systematically computes and tracks performance metrics across key categorical segments to automatically detect hidden bias or cohort failures.\"},{\"id\":\"230\",\"question\":\"A model deployed to Vertex AI is receiving invalid inputs that cause failures. You want to enforce input validation before inference. What should you implement?\",\"options\":{\"A\":\"Add input validation logic directly inside the model serving container before prediction.\",\"B\":\"Reject any invalid requests at the network load balancer level using basic HTTP rules.\",\"C\":\"Disable online prediction and require all clients to send prevalidated requests.\",\"D\":\"Use BigQuery to verify inputs asynchronously prior to sending predictions.\"},\"correct\":\"A\",\"explanation\":\"Embedding input schema validation and error-handling logic directly inside the model serving container guarantees that malformed payloads are safely intercepted and rejected before prediction execution.\"},{\"id\":\"232\",\"question\":\"Your ML pipeline produces several artifacts, including preprocessing transformations and model binaries. You need centralized versioning for these. Which Vertex AI feature supports this?\",\"options\":{\"A\":\"Vertex AI Artifact Registry for tracking and versioning ML artifacts across workflow stages.\",\"B\":\"Cloud Storage lifecycle rules configured to retain historical file versions indefinitely.\",\"C\":\"Cloud Build cache storage to store intermediate binary versions.\",\"D\":\"BigQuery table partitions to maintain historical configurations.\"},\"correct\":\"A\",\"explanation\":\"Vertex AI Artifact Registry provides a centralized, secure repository designed to track, version, and manage ML artifacts, containers, and dependency packages across MLOps workflow stages.\"},{\"id\":\"234\",\"question\":\"A new version of your Vertex AI online prediction model causes unpredictable latency spikes. Resource metrics show identical utilization patterns as the previous version. You must identify the root cause efficiently. What should you do?\",\"options\":{\"A\":\"Enable per-request prediction logging to compare model execution timelines between versions.\",\"B\":\"Enable Cloud Profiler on the model containers to generate tightly sampled performance traces.\",\"C\":\"Revert autoscaling settings to force identical replica counts across both versions.\",\"D\":\"Disable model monitoring to remove external overhead from the inference request path.\"},\"correct\":\"A\",\"explanation\":\"When hardware utilization metrics are identical but latency spikes occur, enabling per-request prediction logging allows you to trace request timelines and isolate software-level or payload-handling bottlenecks between model versions.\"},{\"id\":\"236\",\"question\":\"Your model requires frequent redeployment due to rapid data changes. You want to minimize container build times, speed up CI/CD, and avoid rebuilding the entire image for small code changes. What should you do?\",\"options\":{\"A\":\"Use a multi-stage container design that separates static dependencies from frequently changing code.\",\"B\":\"Build a single-layer image containing all dependencies and code for simplified deployment.\",\"C\":\"Store all code and dependencies in Cloud Storage and mount them dynamically at runtime.\",\"D\":\"Rebuild containers using Cloud Build triggers that always recompile all layers for consistency.\"},\"correct\":\"A\",\"explanation\":\"Structuring container images to separate heavy, static dependencies into early layers and frequently changing application code into final layers maximizes Docker layer caching, drastically reducing CI/CD build times.\"},{\"id\":\"238\",\"question\":\"Your team deploys a Vertex AI model that consumes embeddings generated from a separate feature pipeline. Due to version inconsistencies, the deployed model sometimes receives embeddings from incompatible transformation logic. You must ensure consistent feature-generation versions across training and serving. What should you do?\",\"options\":{\"A\":\"Embed transformation metadata directly inside prediction requests supplied by client systems.\",\"B\":\"Use the Vertex AI Feature Store to manage transformation versions consistently across pipelines.\",\"C\":\"Create manual version files in Cloud Storage that map each model to specific embeddings.\",\"D\":\"Require downstream services to track transformation logic independently of training workflows.\"},\"correct\":\"B\",\"explanation\":\"Vertex AI Feature Store serves as a centralized repository for curated features and embeddings. It eliminates training-serving skew by guaranteeing consistent feature versions across offline training and online serving pipelines.\"},{\"id\":\"240\",\"question\":\"A custom model deployed on Vertex AI shows random container restarts. Logs indicate memory spikes caused by large input payloads. You need to prevent these restarts with minimal code changes. What should you do?\",\"options\":{\"A\":\"Compress prediction payloads and decompress them inside the container during request handling.\",\"B\":\"Adjust request size limits and implement defensive batching to reduce memory consumption.\",\"C\":\"Reduce max concurrent requests and set strict request timeouts for better error isolation.\",\"D\":\"Increase machine type RAM to allow larger payloads without modifying inference behavior.\"},\"correct\":\"B\",\"explanation\":\"Large payload spikes can exceed container memory limits, causing out-of-memory restarts. Enforcing request size limits and implementing defensive batching controls RAM usage and ensures container stability with minimal code changes.\"},{\"id\":\"242\",\"question\":\"Your model inference service connects to external APIs for enrichment, which occasionally become slow. Latency SLAs are violated when external services degrade. You must protect the model endpoint. What should you do?\",\"options\":{\"A\":\"Call external APIs directly inside the model for every request regardless of performance.\",\"B\":\"Add circuit breakers and timeouts, and use cached results when external services degrade.\",\"C\":\"Increase endpoint machine size so the model can perform more calls in parallel to external APIs.\",\"D\":\"Disable enrichment when APIs slow down without any logging or fallback mechanism.\"},\"correct\":\"B\",\"explanation\":\"Synchronous calls to external APIs create vulnerability to third-party degradation. Implementing circuit breakers, timeouts, and fallback caching prevents latency SLAs from being violated when external enrichment services slow down.\"},{\"id\":\"244\",\"question\":\"You maintain a shared Vertex AI Feature Store for multiple teams. One team plans to deprecate a feature that another model still uses in production. You must handle deprecation safely. What should you do?\",\"options\":{\"A\":\"Remove the feature from Feature Store immediately and inform all teams after deletion.\",\"B\":\"Clone the feature into a separate project and ask dependent teams to migrate quickly.\",\"C\":\"Disable writes to the feature while leaving old values available indefinitely for consumers.\",\"D\":\"Mark the feature as deprecated, communicate timelines, and monitor usage before removal.\"},\"correct\":\"D\",\"explanation\":\"In a multi-tenant feature store, abruptly deleting shared features can break production models. Safely handling deprecation requires marking the feature as deprecated, communicating clear timelines, and monitoring consumer usage to ensure zero dependencies before physical removal.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
