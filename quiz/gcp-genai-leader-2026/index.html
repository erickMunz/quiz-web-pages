 summarize two-hour client workshops. Each recording includes audio, shared slides and whiteboard photos. Which kind of foundation model best fits this use case?\",\"options\":{\"A\":\"A small text-only model, after staff manually transcribe each workshop\",\"B\":\"A multimodal model with a long context window, such as Gemini, that can take the audio, slides and images in one request\",\"C\":\"An image diffusion model such as Imagen, because most of the content is visual\",\"D\":\"A new large language model trained from scratch on the firm's past workshops\"},\"correct\":\"B\",\"explanation\":\"Choosing a foundation model starts with modality and context window. The input mixes audio, slides and images and is two hours long, so the model must be multimodal and accept a long context. Gemini models do both natively.\\n\\nWhy the others fail: (A) manual transcription removes the automation benefit and loses the visual content. (C) diffusion models generate images; they do not summarize. (D) training an LLM from scratch is far too expensive and slow compared with using an existing foundation model.\\n\\nExam cue: match the model to modality, context window, cost and performance before considering any customization.\"},{\"id\":\"2\",\"question\":\"A retailer has two years of purchase history but no predefined customer categories. Marketing wants the data itself to reveal groups of customers with similar behaviour. Which machine learning approach fits?\",\"options\":{\"A\":\"Supervised learning, because the purchase history is the label\",\"B\":\"Reinforcement learning, because customers react to rewards such as discounts\",\"C\":\"Prompt tuning, because a language model can describe customers\",\"D\":\"Unsupervised learning, such as clustering, because there are no labels and the goal is to discover structure\"},\"correct\":\"D\",\"explanation\":\"Unsupervised learning finds patterns in unlabeled data. Clustering customers into segments is the textbook example: nobody tells the model what the groups are.\\n\\nWhy the others fail: (A) supervised learning needs a known target to predict (for example 'will churn: yes/no'); purchase history is input, not a label. (B) reinforcement learning trains an agent by trial, error and reward in an environment. (C) prompt tuning adapts a generative model's behaviour; it is not a segmentation method.\\n\\nExam cue: labels → supervised; no labels, find groups → unsupervised; learn by reward → reinforcement.\"},{\"id\":\"3\",\"question\":\"A gen AI shopping assistant gives contradictory answers about product sizes. Investigation shows the catalog stores the same measurement in centimetres in some records and inches in others, and some products appear twice with different values. Which data quality characteristic is the main problem?\",\"options\":{\"A\":\"Consistency\",\"B\":\"Availability\",\"C\":\"Relevance\",\"D\":\"Format\"},\"correct\":\"A\",\"explanation\":\"Consistency means the same fact is represented the same way everywhere. Mixed units and duplicate records with conflicting values are consistency failures, and a model grounded on that data will repeat the contradictions.\\n\\nWhy the others fail: (B) availability is about whether the data can be accessed when needed; here it can. (C) relevance is whether the data matters for the task; product sizes clearly do. (D) format is the file or data type (CSV, JSON, images); both units are stored in the same format, just inconsistently.\\n\\nExam cue: data quality dimensions are completeness, consistency, relevance, availability, cost and format. Gen AI output is only as good as the data behind it.\"},{\"id\":\"4\",\"question\":\"An insurer lists its data sources for a gen AI project. Which one is unstructured data?\",\"options\":{\"A\":\"A BigQuery table of policies with columns for policy ID, premium and start date\",\"B\":\"A spreadsheet of claims with one row per claim and fixed columns\",\"C\":\"Recorded phone calls between customers and claims agents\",\"D\":\"A relational table that links each policy to its customer ID\"},\"correct\":\"C\",\"explanation\":\"Unstructured data has no predefined schema of rows and columns: audio, video, images, free text, PDFs. Recorded calls are audio, so they are unstructured. Gen AI is especially useful here because multimodal models can transcribe, summarize and extract insights from it.\\n\\nWhy the others fail: (A), (B) and (D) are all tabular, with a fixed schema of typed columns, which is structured data.\\n\\nRelated: labeled data carries a known answer for each example (for example 'claim was fraudulent'); unlabeled data does not.\"},{\"id\":\"5\",\"question\":\"The gen AI landscape is often described in layers: infrastructure, models, platforms, agents and applications. Where does Gemini Enterprise Agent Platform (formerly Vertex AI), which provides tools to access, tune, evaluate, deploy and govern models and agents, sit?\",\"options\":{\"A\":\"Infrastructure, because it runs on TPUs and GPUs\",\"B\":\"Models, because it includes Gemini\",\"C\":\"Platforms, because it is the layer that lets teams build, deploy and manage models and agents\",\"D\":\"Applications, because end users chat with it directly\"},\"correct\":\"C\",\"explanation\":\"The platform layer sits between models and the things built with them. It gives developers managed tooling to discover, customize, evaluate, deploy and monitor models and agents, with enterprise security and governance. That is the role of Agent Platform.\\n\\nWhy the others fail: (A) infrastructure is the compute, storage and networking (TPUs, GPUs, AI Hypercomputer) that everything runs on. (B) models are Gemini, Gemma, Imagen and others; the platform gives access to them but is not the model. (D) applications are the end-user products, such as the Gemini app or Gemini for Google Workspace.\\n\\nExam cue: infrastructure → models → platforms → agents → applications; know one Google example for each layer.\"},{\"id\":\"6\",\"question\":\"A manufacturer wants a lightweight model it can download, fine-tune and run on its own servers and on edge devices on the factory floor, with full control over the weights. Which Google model family fits best?\",\"options\":{\"A\":\"Gemma, Google's family of open models\",\"B\":\"Gemini Pro, served only through the managed API\",\"C\":\"Imagen, Google's image generation model\",\"D\":\"Veo, Google's video generation model\"},\"correct\":\"A\",\"explanation\":\"Gemma is Google's family of lightweight open models, built from the same research as Gemini. You can download the weights, fine-tune them and run them wherever you want, including on-premises and on edge devices.\\n\\nWhy the others fail: (B) Gemini is consumed as a managed service; you do not get the weights to run on your own hardware. (C) Imagen generates and edits images. (D) Veo generates video.\\n\\nExam cue: open weights, self-hosting, edge or full control → Gemma; most capable multimodal reasoning as a managed service → Gemini; images → Imagen; video → Veo.\"},{\"id\":\"7\",\"question\":\"A marketing team wants to produce short, high-quality product video clips from text descriptions for social media campaigns. Which Google model is designed for this?\",\"options\":{\"A\":\"Gemma\",\"B\":\"Imagen\",\"C\":\"Chirp\",\"D\":\"Veo\"},\"correct\":\"D\",\"explanation\":\"Veo is Google's video generation model: it creates video clips from text or image prompts, which is exactly the campaign need.\\n\\nWhy the others fail: (A) Gemma is a family of open text models. (B) Imagen generates still images, not video. (C) Chirp is Google's speech model, used for speech recognition.\\n\\nBusiness note: generated media should still go through brand and responsible AI review before publishing; Google adds SynthID watermarks to content generated by these models.\"},{\"id\":\"8\",\"question\":\"A board member asks what Google Cloud's AI Hypercomputer is and why it matters for the company's gen AI plans. Which description is accurate?\",\"options\":{\"A\":\"A single giant server that the company can rent to train one model at a time\",\"B\":\"An integrated supercomputing architecture that combines AI-optimized hardware (TPUs and GPUs), storage and networking with open software and flexible consumption models\",\"C\":\"A consumer app that lets employees chat with Gemini\",\"D\":\"A pricing plan that makes all AI services free for the first year\"},\"correct\":\"B\",\"explanation\":\"AI Hypercomputer is Google Cloud's system-level approach to AI infrastructure. It co-designs performance-optimized hardware (Google's custom TPUs and NVIDIA GPUs), storage and networking with open software and frameworks (JAX, PyTorch, Kubernetes) and flexible consumption options. For the business this means efficient, scalable training and serving at lower cost per unit of work.\\n\\nWhy the others fail: (A) it is an architecture spanning many systems, not one rentable server. (C) that is the Gemini app, in the applications layer. (D) it is not a pricing plan.\\n\\nExam cue: Google's infrastructure strengths are custom TPUs, GPUs, data centers and AI Hypercomputer.\"},{\"id\":\"9\",\"question\":\"A sales organization already uses Gmail, Docs, Sheets and Meet. Leadership wants every employee to get AI help drafting emails, summarizing long threads and creating meeting notes, with no custom development. What should they adopt?\",\"options\":{\"A\":\"Gemini for Google Workspace\",\"B\":\"A custom agent built from scratch on Agent Platform\",\"C\":\"Imagen through the API\",\"D\":\"Google Cloud Contact Center as a Service\"},\"correct\":\"A\",\"explanation\":\"Gemini for Google Workspace brings Gemini into the apps employees already use: it drafts and refines emails in Gmail, summarizes threads and documents, helps build Sheets and takes notes in Meet. It is a prebuilt offering, so value comes quickly without development, under Workspace's enterprise data protections.\\n\\nWhy the others fail: (B) a custom agent is the right choice for bespoke processes, not for generic productivity already built in. (C) Imagen generates images. (D) Contact Center as a Service is for customer service operations.\\n\\nExam cue: productivity inside Gmail, Docs, Sheets and Meet → Gemini for Google Workspace.\"},{\"id\":\"10\",\"question\":\"Employees at a global company waste hours looking for information spread across Google Drive, Confluence, Jira and SharePoint. The CIO wants one place where staff can search all of it with natural language, respecting each user's existing permissions, and use or create agents for common tasks. Which offering fits?\",\"options\":{\"A\":\"The Gemini app with a personal Gem\",\"B\":\"Google Search with a custom search engine\",\"C\":\"Gemini Enterprise\",\"D\":\"Imagen with an internal style guide\"},\"correct\":\"C\",\"explanation\":\"Gemini Enterprise is Google Cloud's prebuilt platform for AI-powered work: it connects to enterprise data sources (Google and third-party, such as Confluence, Jira and SharePoint), offers multimodal search that respects source permissions, and lets employees use prebuilt agents or create their own without code.\\n\\nWhy the others fail: (A) a personal Gem does not connect to and index company-wide systems with access controls. (B) public Google Search does not see private internal content. (D) Imagen generates images.\\n\\nExam cue: 'search across company data sources plus agents for employees' → Gemini Enterprise.\"},{\"id\":\"11\",\"question\":\"A telecom company's human support agents handle complex calls. Managers want the agents to see real-time suggested answers, relevant knowledge articles and an automatic summary at the end of each call. Which Customer Engagement Suite capability provides this?\",\"options\":{\"A\":\"Conversational Agents, which replace the human agent with a virtual agent\",\"B\":\"Agent Assist\",\"C\":\"Conversational Insights\",\"D\":\"Grounding with Google Search\"},\"correct\":\"B\",\"explanation\":\"Agent Assist supports human agents during live conversations: it suggests responses and knowledge articles in real time and generates call summaries, which shortens handling time and improves consistency.\\n\\nWhy the others fail: (A) Conversational Agents are virtual agents that talk to customers directly (self-service), not helpers for human agents. (C) Conversational Insights analyzes conversations after the fact (topics, sentiment, trends) for managers. (D) grounding with Google Search connects a model to public web information; it is not a contact-center tool.\\n\\nExam cue: helping the human agent live → Agent Assist; self-service bot → Conversational Agents; analytics on calls → Conversational Insights; full contact-center platform → Contact Center as a Service.\"},{\"id\":\"12\",\"question\":\"A product team wants to compare Gemini, open models such as Gemma and Llama, and partner models side by side, then deploy the one that best fits cost and quality, all inside Google Cloud with enterprise controls. Which Agent Platform capability is built for this?\",\"options\":{\"A\":\"Google AI Studio\",\"B\":\"AutoML\",\"C\":\"Agent Search\",\"D\":\"Model Garden\"},\"correct\":\"D\",\"explanation\":\"Model Garden is Agent Platform's catalog of first-party (Gemini, Imagen, Veo), open (Gemma, Llama and others) and partner models. Teams can discover, test, tune and deploy them with Google Cloud's security, governance and billing.\\n\\nWhy the others fail: (A) Google AI Studio is a quick prototyping tool for Gemini models, mainly for individual developers, not the enterprise model catalog. (B) AutoML trains custom models on your own data with little code; it does not compare foundation models. (C) Agent Search (formerly Vertex AI Search) builds search and RAG over your content.\\n\\nExam cue: 'choose among many foundation models' → Model Garden.\"},{\"id\":\"13\",\"question\":\"A customer-service agent built on Gemini must tell customers the real-time status of their orders, which lives in the company's order database. What lets the agent do this?\",\"options\":{\"A\":\"Increasing the model's temperature so it guesses more confidently\",\"B\":\"Fine-tuning the model every night on the latest order data\",\"C\":\"Writing the order list into the system prompt once a week\",\"D\":\"Giving the agent a tool, such as a function or extension that calls an order-status API (for example a Cloud Run service), which the model can invoke when needed\"},\"correct\":\"D\",\"explanation\":\"Agents act on the outside world through tools: functions, extensions, data stores and plugins. The model decides when to call the order-status function, the application executes it against the live system and the result goes back to the model to answer. That keeps answers current and accurate.\\n\\nWhy the others fail: (A) temperature controls randomness; it cannot create data the model does not have. (B) fine-tuning changes behaviour and style, is costly and is stale minutes after it runs. (C) a weekly prompt snapshot is outdated and does not scale.\\n\\nExam cue: live or private data and actions → tools; Cloud Run, Cloud Run functions, databases and pre-built AI APIs are typical tool backends.\"},{\"id\":\"14\",\"question\":\"A developer prototyped a Gemini prompt in Google AI Studio using an API key. The bank now wants to put it in production with IAM, VPC Service Controls, data residency, audit logs and its existing Google Cloud billing. Where should the team build it?\",\"options\":{\"A\":\"Keep it in Google AI Studio and share the API key with the production team\",\"B\":\"Gemini Enterprise Agent Platform, using Agent Studio and the platform's enterprise controls\",\"C\":\"The Gemini consumer app, with a shared account for the team\",\"D\":\"A spreadsheet that stores the prompts and responses\"},\"correct\":\"B\",\"explanation\":\"Google AI Studio is ideal for fast experimentation by individual developers. When a solution needs enterprise controls (IAM, VPC Service Controls, CMEK, data residency, audit logging, SLAs and Google Cloud billing), it belongs on Agent Platform, where Agent Studio offers the same prompt design and agent building with governance.\\n\\nWhy the others fail: (A) a shared API key provides none of the required controls and is a security risk. (C) the consumer app is not a development platform. (D) a spreadsheet is not a runtime.\\n\\nExam cue: prototype quickly → Google AI Studio; enterprise production with governance → Agent Platform (Agent Studio).\"},{\"id\":\"15\",\"question\":\"An airline's gen AI chatbot sometimes invents baggage fees and refund rules that do not exist. What is the most effective Google-recommended way to reduce these hallucinations?\",\"options\":{\"A\":\"Ask users to rephrase their question when the answer looks wrong\",\"B\":\"Increase the maximum output length so the model can explain more\",\"C\":\"Ground the model on the airline's official policy documents, for example with retrieval-augmented generation through Agent Search\",\"D\":\"Retrain a foundation model from scratch on public travel websites\"},\"correct\":\"C\",\"explanation\":\"Hallucinations happen when a model fills gaps with plausible but unsupported text. Grounding connects the model to authoritative sources: with RAG, the system retrieves the relevant policy passages and the model answers from them, ideally with citations. Agent Search provides prebuilt RAG over your documents.\\n\\nWhy the others fail: (A) pushes the problem onto users. (B) longer outputs do not make them more factual and can add more invented detail. (D) training from scratch is extremely costly and public websites are not the airline's policy.\\n\\nExam cue: limitations such as knowledge cutoff, hallucinations and bias are addressed with grounding, RAG, prompt engineering, fine-tuning and human in the loop; for factual company answers, grounding comes first.\"},{\"id\":\"16\",\"question\":\"A team needs Gemini to classify incoming emails into exactly one of five categories and answer in a strict JSON format. Plain instructions alone give inconsistent formats. Which prompting technique most directly fixes this?\",\"options\":{\"A\":\"Few-shot prompting: include several example emails with their correct JSON output in the prompt\",\"B\":\"Zero-shot prompting with a shorter instruction\",\"C\":\"Raising the temperature to explore more formats\",\"D\":\"Prompt chaining that first translates each email into another language\"},\"correct\":\"A\",\"explanation\":\"Few-shot prompting shows the model a handful of input-output examples. The model then imitates both the reasoning and the exact output format, which is the most direct fix for inconsistent formatting. One-shot uses a single example; zero-shot uses none.\\n\\nWhy the others fail: (B) zero-shot is what is already failing. (C) higher temperature increases randomness, the opposite of what you want for a strict format. (D) translation adds a step without addressing the format.\\n\\nExam cue: zero-, one- and few-shot differ in the number of examples; role prompting sets a persona; prompt chaining splits a task into sequential prompts.\"},{\"id\":\"17\",\"question\":\"A travel agent built with Gemini must answer questions like 'Can I get from Madrid to Lisbon before 3 p.m. tomorrow and still make my connection?'. It has to reason step by step, look up live schedules, check the result and decide its next step. Which prompting approach is designed for this pattern?\",\"options\":{\"A\":\"Zero-shot prompting\",\"B\":\"Role prompting only\",\"C\":\"ReAct prompting, which interleaves reasoning with actions such as tool calls and observes their results\",\"D\":\"Lowering top-p so the answer is more focused\"},\"correct\":\"C\",\"explanation\":\"ReAct (Reason + Act) prompts the model to alternate thinking ('I need tomorrow's trains'), acting (calling a schedule tool) and observing the result before reasoning again. It is the basis of many agent loops.\\n\\nWhy the others fail: (A) zero-shot gives no structure for multi-step tool use. (B) a role sets tone and expertise but not a reason-act loop. (D) top-p is a sampling setting; it does not give the model access to live data.\\n\\nRelated: chain-of-thought asks the model to reason step by step without external actions. It helps with logic and math; ReAct adds tool use.\"},{\"id\":\"18\",\"question\":\"A compliance team uses Gemini to extract key clauses from contracts. They want answers that are as consistent and deterministic as possible between runs. Which setting change helps most?\",\"options\":{\"A\":\"Raise the temperature to 1.5\",\"B\":\"Raise top-p to 1.0 so all tokens are considered\",\"C\":\"Disable safety settings\",\"D\":\"Lower the temperature, close to 0\"},\"correct\":\"D\",\"explanation\":\"Temperature controls randomness in token sampling. A low temperature makes the model consistently pick the most likely tokens, giving focused, repeatable output, which suits extraction and factual tasks. High temperatures suit brainstorming and creative writing.\\n\\nWhy the others fail: (A) higher temperature increases variability. (B) top-p (nucleus sampling) at 1.0 widens the candidate pool, also adding variability. (C) safety settings filter harmful content; disabling them does not improve consistency and adds risk.\\n\\nOther controls: maximum output tokens caps response length and cost; top-p restricts sampling to the most probable tokens whose cumulative probability reaches p.\"},{\"id\":\"19\",\"question\":\"The CISO asks which Google framework gives a structured approach to securing AI systems across their lifecycle, covering risks such as prompt injection, data poisoning and model theft. What is it?\",\"options\":{\"A\":\"Google's Secure AI Framework (SAIF)\",\"B\":\"The Google Cloud Architecture Framework's cost optimization pillar\",\"C\":\"The ML lifecycle's data ingestion stage\",\"D\":\"Model Garden's model cards\"},\"correct\":\"A\",\"explanation\":\"SAIF (Secure AI Framework) is Google's conceptual framework for securing AI systems. It extends strong security foundations to AI, extends detection and response, automates defenses, harmonizes platform controls, adapts controls with feedback loops and puts AI risks in business context. It addresses AI-specific threats such as prompt injection, training data poisoning and model exfiltration.\\n\\nWhy the others fail: (B) cost optimization is not about AI security. (C) data ingestion is one lifecycle stage, not a security framework. (D) model cards document a model's capabilities and limits; they are transparency artifacts, not a security framework.\\n\\nRelated Google Cloud tools: secure-by-design infrastructure, IAM, Security Command Center (including AI protection) and workload monitoring.\"},{\"id\":\"20\",\"question\":\"A healthcare provider wants to use patient feedback to fine-tune a model that drafts replies. Legal requires that analysts and the model never see who wrote each message, but records from the same patient must still be linkable for analysis. Which technique fits this privacy requirement?\",\"options\":{\"A\":\"Publish the raw messages internally so everyone can check the model's work\",\"B\":\"Pseudonymize the data: replace direct identifiers with consistent tokens before training, for example with Sensitive Data Protection\",\"C\":\"Delete every message that mentions a medical condition\",\"D\":\"Increase the model's temperature so outputs do not resemble training data\"},\"correct\":\"B\",\"explanation\":\"Pseudonymization replaces identifiers (names, IDs, emails) with consistent surrogate tokens. Records stay linkable for analysis, but people are not directly identifiable. Anonymization goes further and removes linkability entirely. Sensitive Data Protection (formerly Cloud DLP) can find and de-identify such fields automatically.\\n\\nWhy the others fail: (A) exposing raw patient data violates privacy. (C) deleting all medical messages destroys the useful data instead of protecting it. (D) temperature does not protect training data privacy.\\n\\nResponsible AI also covers transparency, fairness and bias, accountability and explainability: keep humans accountable and be able to explain how outputs are produced.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
