de su unidad de negocio europea en regiones de la UE. Los proyectos de la unidad están bajo una carpeta llamada `eu`. Los desarrolladores tienen Editor en sus proyectos. ¿Cuál es el control más eficaz?\",\"options\":{\"A\":\"Quitar el rol Editor y dar a los desarrolladores solo Viewer\",\"B\":\"Establecer la política de organización `gcp.resourceLocations` en la carpeta `eu` para permitir solo ubicaciones de la UE\",\"C\":\"Crear una alerta de Cloud Monitoring que salte cuando se cree un recurso fuera de la UE\",\"D\":\"Pedir a los desarrolladores que siempre pasen `--region=europe-west1` en sus comandos gcloud\"},\"correct\":\"B\",\"explanation\":\"Las políticas de organización son preventivas y se heredan hacia abajo en la jerarquía de recursos. Fijar la restricción de ubicaciones (por ejemplo `in:eu-locations`) en la carpeta bloquea la creación de recursos con ubicación fuera de la UE en todos los proyectos que cuelgan de ella, tenga el rol IAM que tenga el desarrollador.\\n\\nPor qué fallan las demás: (A) IAM controla quién actúa, no dónde; con Viewer además no podrían trabajar. (C) una alerta detecta la infracción cuando ya ha ocurrido. (D) una convención no es un control.\\n\\nPista de examen: «nunca», «en todos los proyectos de una carpeta» → política de organización en la carpeta o en la organización.\"},{\"id\":\"2\",\"question\":\"Los empleados de tu empresa inician sesión con Microsoft Entra ID. Seguridad no quiere sincronizar las cuentas de usuario en Cloud Identity, pero los empleados necesitan acceso a la consola y a gcloud con su inicio de sesión corporativo. ¿Qué deberías configurar?\",\"options\":{\"A\":\"Crear una clave de cuenta de servicio para cada empleado\",\"B\":\"Crear una cuenta de Gmail personal para cada empleado y darle roles IAM\",\"C\":\"Configurar Google Cloud Directory Sync para copiar todos los usuarios a Cloud Identity\",\"D\":\"Workforce Identity Federation con un pool de workforce y un proveedor para Entra ID, y dar roles IAM a los principales del pool\"},\"correct\":\"D\",\"explanation\":\"Workforce Identity Federation permite que usuarios de un proveedor de identidad externo (Entra ID, Okta y otros OIDC o SAML) accedan a Google Cloud directamente con sus credenciales. No se sincronizan cuentas; das roles IAM a identificadores `principal://` o `principalSet://` del pool de workforce.\\n\\nPor qué fallan las demás: (A) las claves de cuenta de servicio son para cargas de trabajo, son secretos de larga duración y eliminan la responsabilidad individual. (B) las cuentas personales de Gmail quedan fuera del control corporativo. (C) Directory Sync es precisamente la sincronización que seguridad quiere evitar.\\n\\nRelacionado: Workload Identity Federation es lo equivalente para cargas de trabajo (CI/CD, otras nubes) en lugar de personas.\"},{\"id\":\"3\",\"question\":\"Finanzas quiere analizar los costes de Google Cloud por proyecto, servicio, SKU y etiquetas personalizadas con SQL, y crear paneles con más de un año de historia. ¿Qué deberías configurar?\",\"options\":{\"A\":\"La exportación de Cloud Billing a BigQuery (datos de coste de uso estándar o detallados)\",\"B\":\"Un presupuesto con alerta por correo al 90% del importe mensual\",\"C\":\"Descargar la factura mensual en PDF y copiar los totales en una hoja de cálculo\",\"D\":\"Un panel de Cloud Monitoring con el uso de CPU de todas las VM\"},\"correct\":\"A\",\"explanation\":\"La exportación de facturación a BigQuery escribe de forma continua registros detallados de coste y uso (proyecto, servicio, SKU, etiquetas, créditos) en un dataset tuyo. Finanzas puede consultarlo con SQL y conectar Looker Studio u otras herramientas de BI. Solo se exportan datos desde el momento en que la activas, así que conviene activarla pronto.\\n\\nPor qué fallan las demás: (B) los presupuestos avisan al cruzar umbrales pero no dan detalle analizable. (C) las facturas están agregadas y es un proceso manual. (D) el uso de CPU no es coste.\\n\\nPista de examen: «analizar costes con SQL», «por etiqueta» → exportación de facturación a BigQuery; «avisar cuando el gasto llegue a X» → presupuestos y alertas.\"},{\"id\":\"4\",\"question\":\"Un despliegue falla con un error que dice que se ha superado la cuota regional CPUS en `us-central1`. La carga necesita legítimamente más capacidad en esa región. ¿Qué deberías hacer?\",\"options\":{\"A\":\"Borrar el proyecto y crear uno nuevo, lo que reinicia las cuotas\",\"B\":\"Cambiar todas las VM a un tipo de máquina mayor para necesitar menos VM\",\"C\":\"Revisar la cuota en la página Quotas (Cloud Quotas) y solicitar un aumento para esa región\",\"D\":\"Abrir una regla de firewall para el rango de IP del despliegue\"},\"correct\":\"C\",\"explanation\":\"Las cuotas te protegen a ti y a la plataforma. Cuando una carga legítima necesita más, consultas el uso y los límites en la página Quotas de la consola (o con la API de Cloud Quotas o gcloud) y pides un aumento para esa cuota y región concretas. También puedes configurar alertas de cuota para enterarte antes de llegar al límite.\\n\\nPor qué fallan las demás: (A) un proyecto nuevo tiene cuotas por defecto, a menudo más bajas, y pierdes todo. (B) las máquinas más grandes consumen la misma cuota de vCPU. (D) las reglas de firewall no tienen relación con las cuotas.\\n\\nPista de examen: «quota exceeded» → revisar uso y pedir aumento; planifica las cuotas antes de lanzamientos grandes.\"},{\"id\":\"5\",\"question\":\"Un trabajo batch nocturno renderiza miles de imágenes independientes. Guarda puntos de control y puede reiniciarse en cualquier momento. Quieres el menor coste posible en Compute Engine. ¿Qué deberías usar?\",\"options\":{\"A\":\"Nodos sole-tenant con descuentos por compromiso de uso\",\"B\":\"VM estándar bajo demanda en una única instancia grande\",\"C\":\"Spot VMs en un grupo de instancias gestionado\",\"D\":\"Discos persistentes regionales conectados a cada VM\"},\"correct\":\"C\",\"explanation\":\"Las Spot VMs tienen grandes descuentos (a menudo entre el 60 y el 91%) a cambio de poder ser interrumpidas en cualquier momento. Un trabajo batch tolerante a fallos con puntos de control es la carga ideal, y un grupo de instancias gestionado recrea las VM interrumpidas cuando vuelve la capacidad.\\n\\nPor qué fallan las demás: (A) los nodos sole-tenant son para aislamiento o licencias y cuestan más. (B) bajo demanda es lo más caro y una sola VM no paraleliza el trabajo. (D) los discos regionales añaden coste por una alta disponibilidad que el trabajo no necesita.\\n\\nRelacionado: los tipos de máquina personalizados permiten elegir la proporción exacta de vCPU y memoria y no pagar por lo que no usas.\"},{\"id\":\"6\",\"question\":\"Un equipo pequeño quiere ejecutar microservicios en contenedores sobre Kubernetes, pero no quiere gestionar nodos, node pools, actualizaciones ni planificación de capacidad, y prefiere pagar por los recursos que piden sus Pods. ¿Qué opción encaja?\",\"options\":{\"A\":\"Un clúster GKE Autopilot\",\"B\":\"Un clúster GKE Standard zonal con node pools dimensionados a mano\",\"C\":\"VM de Compute Engine con Docker instalado\",\"D\":\"Un clúster de Kubernetes autogestionado con kubeadm sobre Compute Engine\"},\"correct\":\"A\",\"explanation\":\"GKE Autopilot es el modo en que Google gestiona los nodos, el escalado, el endurecimiento de seguridad y las actualizaciones. Tú despliegas cargas y pagas sobre todo por la CPU, memoria y almacenamiento que piden tus Pods. Mantiene la API completa de Kubernetes.\\n\\nPor qué fallan las demás: (B) el modo Standard te obliga a dimensionar y gestionar node pools. (C) VM con Docker renuncian a la orquestación de Kubernetes. (D) un clúster autogestionado es lo que más trabajo operativo da.\\n\\nPista de examen: «Kubernetes sin gestionar nodos», «pagar por Pod» → Autopilot; «configuración de nodo a medida o control de hardware» → Standard.\"},{\"id\":\"7\",\"question\":\"Cada vez que se sube un PDF a un bucket de Cloud Storage necesitas extraer su texto y guardar el resultado, sin servidores que gestionar y sin sondeos. ¿Qué deberías desplegar?\",\"options\":{\"A\":\"Una VM de Compute Engine que liste el bucket cada minuto\",\"B\":\"Un job de Cloud Scheduler que ejecute un script cada hora\",\"C\":\"Un Deployment de GKE que mantenga una conexión persistente con el bucket\",\"D\":\"Una Cloud Run function activada mediante Eventarc por el evento de objeto finalizado de Cloud Storage\"},\"correct\":\"D\",\"explanation\":\"Eventarc entrega eventos de Cloud Storage (como `google.cloud.storage.object.v1.finalized`) a servicios de Cloud Run o Cloud Run functions. La función solo se ejecuta cuando llega un archivo, escala automáticamente, incluso a cero, y no necesita servidores.\\n\\nPor qué fallan las demás: (A) una VM que sondea cuesta dinero aunque esté ociosa y reacciona tarde. (B) una programación horaria añade latencia y procesa por lotes. (C) un Deployment de GKE añade gestión de clúster a una tarea dirigida por eventos.\\n\\nPista de examen: «cuando se sube un archivo», «mensaje de Pub/Sub», «evento de audit log» → Eventarc o un trigger directo en Cloud Run functions.\"},{\"id\":\"8\",\"question\":\"Debes guardar informes trimestrales de cumplimiento. Cada uno se lee aproximadamente una vez cada tres meses para una auditoría y debe estar disponible en milisegundos cuando se pida. Quieres el menor coste de almacenamiento para este patrón. ¿Qué clase de Cloud Storage eliges?\",\"options\":{\"A\":\"Standard\",\"B\":\"Coldline\",\"C\":\"Archive\",\"D\":\"Nearline\"},\"correct\":\"B\",\"explanation\":\"Coldline está pensada para datos que se leen menos de una vez por trimestre, con una duración mínima de almacenamiento de 90 días. Su precio de almacenamiento es menor que el de Nearline, y todas las clases de Cloud Storage devuelven los datos con latencia de milisegundos.\\n\\nPor qué fallan las demás: (A) Standard es para datos de acceso frecuente y es la más cara de almacenar. (C) Archive es más barata de almacenar pero está pensada para datos que se leen menos de una vez al año, con mínimo de 365 días y recuperación más cara. (D) Nearline (mínimo 30 días) encaja con accesos aproximadamente mensuales; para accesos trimestrales Coldline sale más barata.\\n\\nRegla: Standard (caliente) → Nearline (~mensual) → Coldline (~trimestral) → Archive (~anual).\"},{\"id\":\"9\",\"question\":\"Seguridad quiere reglas de firewall que apunten a VM por un atributo que solo un rol IAM autorizado pueda asignar, para que un Editor del proyecto no pueda saltarse una regla simplemente añadiendo una etiqueta a una VM. ¿Qué deberías usar en las reglas de la política de Cloud NGFW?\",\"options\":{\"A\":\"Secure Tags (tags de Resource Manager gobernados por IAM) como origen y destino\",\"B\":\"Network tags, que cualquiera que pueda editar la VM puede asignar\",\"C\":\"Los nombres de las instancias en el campo de destino de la regla\",\"D\":\"Las IP externas de las VM\"},\"correct\":\"A\",\"explanation\":\"Los Secure Tags son tags de Resource Manager cuya asignación se controla con IAM (por ejemplo, el rol Tag User). Usados en políticas de firewall de red de Cloud NGFW, permiten a seguridad decidir quién puede vincular una VM a una regla, así que un Editor del proyecto no puede cambiar qué reglas se aplican a su VM.\\n\\nPor qué fallan las demás: (B) las network tags son cadenas libres que cualquiera con permiso para editar la instancia puede cambiar. (C) las reglas no apuntan por nombre de instancia. (D) las IP cambian y no expresan identidad.\\n\\nRelacionado: las reglas también pueden apuntar por cuenta de servicio; los atributos de una regla son acción, dirección (ingress o egress), origen, destino, objetivo, protocolos, puertos y prioridad.\"},{\"id\":\"10\",\"question\":\"Una aplicación web HTTPS pública corre en grupos de instancias gestionados en `us-east1` y `europe-west1`. Los usuarios de todo el mundo deben llegar al backend sano más cercano mediante una única IP, con TLS terminado en el edge. ¿Qué balanceador de carga eliges?\",\"options\":{\"A\":\"Un Network Load Balancer passthrough externo regional\",\"B\":\"Un Application Load Balancer interno\",\"C\":\"Un Application Load Balancer externo global\",\"D\":\"Un Network Load Balancer passthrough interno regional\"},\"correct\":\"C\",\"explanation\":\"El Application Load Balancer externo global (HTTP/HTTPS, capa 7) usa una única IP anycast, termina TLS en el edge de Google y envía a cada usuario al backend más cercano con capacidad y health checks correctos, entre regiones. Además admite Cloud CDN y Cloud Armor.\\n\\nPor qué fallan las demás: (A) un Network Load Balancer passthrough es regional y de capa 4, sin terminación TLS en el edge ni enrutamiento entre regiones. (B) y (D) los balanceadores internos son para tráfico dentro de la VPC, no para usuarios públicos.\\n\\nPista de examen: usuarios HTTP(S) globales → Application LB externo global; TCP/UDP conservando la IP del cliente → Network LB passthrough; tráfico privado → balanceadores internos. El balanceo global requiere el Network Service Tier Premium.\"},{\"id\":\"11\",\"question\":\"Los Pods de un clúster GKE Standard fallan con `ImagePullBackOff` al descargar una imagen de Artifact Registry de otro proyecto. Los nodos usan una cuenta de servicio personalizada. ¿Cuál es la solución más probable?\",\"options\":{\"A\":\"Hacer público en internet el repositorio de Artifact Registry\",\"B\":\"Dar a la cuenta de servicio de los nodos el rol Artifact Registry Reader (`roles/artifactregistry.reader`) en el repositorio o su proyecto\",\"C\":\"Dar a la cuenta de servicio de los nodos el rol Owner en ambos proyectos\",\"D\":\"Volver a crear el clúster como zonal\"},\"correct\":\"B\",\"explanation\":\"Los nodos de GKE descargan imágenes con la cuenta de servicio del node pool. Con una cuenta personalizada, o con un repositorio en otro proyecto, esa cuenta necesita `roles/artifactregistry.reader` en el repositorio (o el proyecto). Concederlo resuelve la descarga con mínimo privilegio.\\n\\nPor qué fallan las demás: (A) hacer las imágenes públicas las expone a todo el mundo. (C) Owner es un privilegio desmesurado. (D) el tipo de ubicación del clúster no tiene que ver con la autorización de imágenes.\\n\\nDiagnóstico: `kubectl describe pod` muestra el error de descarga; revisa la ruta de la imagen (`REGION-docker.pkg.dev/PROYECTO/REPO/IMAGEN:TAG`) y el IAM de la cuenta de servicio de los nodos.\"},{\"id\":\"12\",\"question\":\"Necesitas publicar una nueva versión de un servicio de Cloud Run con el mínimo riesgo: desplegarla sin enviarle usuarios, probarla, luego mover un 10% del tráfico y aumentarlo poco a poco. ¿Cómo lo haces?\",\"options\":{\"A\":\"Borrar el servicio y volver a desplegarlo con la nueva imagen\",\"B\":\"Desplegar la nueva imagen en un segundo servicio de Cloud Run aparte y cambiar el DNS a mano\",\"C\":\"Escalar a cero instancias la revisión actual mientras arranca la nueva\",\"D\":\"Desplegar una nueva revisión con `--no-traffic` (opcionalmente con un tag para tener URL de prueba) y usar `gcloud run services update-traffic` para pasar un 10% e ir aumentando\"},\"correct\":\"D\",\"explanation\":\"Cada despliegue de Cloud Run crea una revisión inmutable. Con `--no-traffic` la nueva revisión no recibe usuarios; un tag de revisión le da su propia URL para probarla. Después `update-traffic --to-revisions=NUEVA=10` hace un reparto canary, y puedes subir el porcentaje o volver al instante a la revisión anterior.\\n\\nPor qué fallan las demás: (A) borrar provoca caída del servicio y pierdes la vuelta atrás. (B) un servicio aparte con cambios de DNS es más lento y no reparte por porcentaje. (C) Cloud Run no te deja escalar a cero a mano una revisión que recibe tráfico, y seguiría siendo un cambio brusco.\\n\\nPista de examen: despliegue gradual o canary en Cloud Run → revisiones + reparto de tráfico.\"},{\"id\":\"13\",\"question\":\"Los logs de una aplicación se escriben en un bucket de Cloud Storage. Se leen a menudo durante 30 días, rara vez después, y deben borrarse al cabo de un año. ¿Cuál es la forma más sencilla de minimizar el coste automáticamente?\",\"options\":{\"A\":\"Ejecutar un script semanal que copie los objetos antiguos a otro bucket y borre los originales\",\"B\":\"Activar Object Versioning para conservar los logs viejos como versiones no actuales\",\"C\":\"Usar la clase Archive para todos los logs desde el principio\",\"D\":\"Configurar reglas de Object Lifecycle Management: `SetStorageClass` a Coldline a los 30 días de antigüedad y `Delete` a los 365 días\"},\"correct\":\"D\",\"explanation\":\"Object Lifecycle Management aplica reglas automáticamente a los objetos según condiciones como la antigüedad, la clase de almacenamiento o el número de versiones más nuevas. Las acciones incluyen `SetStorageClass` (pasar a una clase más fría) y `Delete`. Así los datos calientes siguen en Standard, pasan a una clase más barata cuando bajan los accesos y se borran según lo previsto, sin código.\\n\\nPor qué fallan las demás: (A) los scripts propios son trabajo operativo y copiar añade coste. (B) el versionado guarda más datos y sube el coste. (C) Archive para datos que se leen a menudo en los primeros 30 días genera cargos de recuperación y de borrado anticipado.\\n\\nRelacionado: Autoclass mueve objetos entre clases automáticamente según el acceso real, cuando los patrones son impredecibles.\"},{\"id\":\"14\",\"question\":\"Una subred con rango primario `10.0.1.0/24` se ha quedado sin IP para nuevas VM. La VPC no tiene rangos solapados cerca. ¿Cuál es la solución menos disruptiva?\",\"options\":{\"A\":\"Borrar la subred y recrearla como `10.0.0.0/22`\",\"B\":\"Ampliar el rango primario de la subred con `gcloud compute networks subnets expand-ip-range --prefix-length=23`\",\"C\":\"Reducir la subred a `/25` para liberar direcciones\",\"D\":\"Asignar IP externas a las nuevas VM en lugar de internas\"},\"correct\":\"B\",\"explanation\":\"Puedes ampliar el rango IPv4 primario de una subred sin recrearla (por ejemplo de /24 a /23) siempre que el nuevo rango no se solape con otros rangos de la VPC o de redes con peering. Las VM existentes conservan sus direcciones y no se interrumpe nada.\\n\\nPor qué fallan las demás: (A) para borrar una subred hay que eliminar antes todos sus recursos, lo que es disruptivo. (C) las subredes no se pueden reducir, y un rango menor tiene menos direcciones. (D) cada interfaz de VM sigue necesitando una IP interna de la subred.\\n\\nRecuerda: la ampliación es en un solo sentido; planifica los rangos pensando en crecer.\"},{\"id\":\"15\",\"question\":\"El equipo de seguridad quiere guardar en un solo sitio, durante dos años y consultables con SQL, todos los audit logs de Admin Activity de todos los proyectos de la organización. ¿Qué deberías configurar?\",\"options\":{\"A\":\"Aumentar a dos años la retención del log bucket `_Default` de cada proyecto y consultarlos uno a uno\",\"B\":\"Pedir a cada responsable de proyecto que descargue los logs en CSV cada mes\",\"C\":\"Un sink de logs agregado a nivel de organización que incluya los proyectos hijos y envíe los audit logs a un dataset de BigQuery (o a un log bucket con Log Analytics)\",\"D\":\"Crear un uptime check de Cloud Monitoring en cada proyecto\"},\"correct\":\"C\",\"explanation\":\"Los sinks de logs envían las entradas que cumplen un filtro a un destino: un bucket de Cloud Storage, un dataset de BigQuery, Pub/Sub o un log bucket de Cloud Logging. Un sink agregado a nivel de organización o carpeta con `--include-children` recoge los logs de todos los proyectos de forma centralizada. BigQuery, o un log bucket con Log Analytics, permite consultarlos con SQL, y tú controlas la retención.\\n\\nPor qué fallan las demás: (A) la retención por proyecto no centraliza nada. (B) las exportaciones manuales no son fiables. (D) los uptime checks comprueban disponibilidad; no recogen logs.\\n\\nRelacionado: envía a Pub/Sub para exportar logs a sistemas externos como un SIEM.\"},{\"id\":\"16\",\"question\":\"Una aplicación escribe una línea de log con `payment_failed` cada vez que falla un pago. La guardia quiere un aviso cuando haya más de 20 fallos en 5 minutos. La aplicación no exporta métricas. ¿Qué deberías hacer?\",\"options\":{\"A\":\"Crear una métrica basada en logs de tipo contador que coincida con `payment_failed` y una política de alertas de Cloud Monitoring sobre ella con umbral de 20 en 5 minutos\",\"B\":\"Pedir a la persona de guardia que busque en los logs cada 5 minutos\",\"C\":\"Crear un uptime check contra la página principal de la API de pagos\",\"D\":\"Exportar todos los logs a Cloud Storage y revisarlos a diario\"},\"correct\":\"A\",\"explanation\":\"Las métricas basadas en logs convierten las entradas que coinciden en series temporales de Cloud Monitoring (aquí un contador) sin cambiar el código. Una política de alertas sobre esa métrica con umbral y ventana de 5 minutos avisa al canal de guardia.\\n\\nPor qué fallan las demás: (B) buscar a mano no es fiable. (C) un uptime check prueba la disponibilidad de un endpoint, no los fallos de pago. (D) revisar a diario es demasiado lento para avisos.\\n\\nRelacionado: las aplicaciones también pueden escribir métricas personalizadas directamente (OpenTelemetry o la API de Monitoring), y el Ops Agent recoge métricas de sistema y de aplicación en las VM.\"},{\"id\":\"17\",\"question\":\"Los ingenieros de soporte necesitan iniciar, detener y reiniciar VM de Compute Engine, pero no deben crearlas, borrarlas ni cambiar su configuración. Ningún rol predefinido encaja exactamente. ¿Qué deberías hacer?\",\"options\":{\"A\":\"Dar Compute Admin, porque incluye iniciar y detener\",\"B\":\"Dar el rol básico Editor en el proyecto\",\"C\":\"Crear un rol personalizado con solo `compute.instances.start`, `compute.instances.stop`, `compute.instances.reset` y los permisos `get`/`list` necesarios, y asignarlo a un grupo\",\"D\":\"Compartir las credenciales del propietario del proyecto con el equipo de soporte\"},\"correct\":\"C\",\"explanation\":\"Los roles personalizados agrupan exactamente los permisos que necesita un puesto cuando los predefinidos son demasiado amplios. Asignar el rol a un grupo de Google en vez de a personas concretas simplifica la gestión. Se pueden definir a nivel de organización o de proyecto.\\n\\nPor qué fallan las demás: (A) Compute Admin incluye crear y borrar instancias. (B) los roles básicos como Editor son muy amplios y se desaconsejan en producción. (D) compartir credenciales elimina la trazabilidad.\\n\\nTipos de rol: básicos (Owner, Editor, Viewer; evitarlos), predefinidos (gestionados por Google, por servicio) y personalizados (los mantienes tú). Las políticas se heredan por la jerarquía, así que concede al nivel más bajo que funcione.\"},{\"id\":\"18\",\"question\":\"Un desarrollador necesita probar en local a qué puede acceder la cuenta de servicio de un pipeline de despliegue, sin crear ni descargar una clave de cuenta de servicio. ¿Qué deberías hacer?\",\"options\":{\"A\":\"Crear una clave JSON de la cuenta de servicio y enviársela por correo\",\"B\":\"Dar al desarrollador directamente los mismos roles que tiene la cuenta de servicio\",\"C\":\"Añadir la contraseña del desarrollador a Secret Manager\",\"D\":\"Dar al desarrollador el rol Service Account Token Creator sobre esa cuenta de servicio, para que ejecute gcloud con `--impersonate-service-account` y reciba credenciales de corta duración\"},\"correct\":\"D\",\"explanation\":\"La suplantación (impersonation) de cuentas de servicio permite a un usuario autorizado obtener tokens OAuth de corta duración de una cuenta de servicio. Con `roles/iam.serviceAccountTokenCreator` sobre ella, el desarrollador ejecuta comandos como esa cuenta (`--impersonate-service-account` o `gcloud config set auth/impersonate_service_account`). No se crea ninguna clave, los tokens caducan pronto y los audit logs registran ambas identidades.\\n\\nPor qué fallan las demás: (A) las claves descargadas son secretos de larga duración que se filtran con facilidad. (B) el desarrollador probaría su propio acceso, no el de la cuenta, y acumularía privilegios. (C) Secret Manager guarda secretos; no da acceso como cuenta de servicio.\\n\\nRelacionado: Service Account User (`roles/iam.serviceAccountUser`) permite asociar una cuenta de servicio a recursos como VM.\"},{\"id\":\"19\",\"question\":\"Una aplicación que corre en Pods de GKE debe leer objetos de un bucket de Cloud Storage. Quieres que cada carga tenga su propia identidad, sin claves de cuenta de servicio guardadas como Secrets de Kubernetes. ¿Cuál es el enfoque recomendado?\",\"options\":{\"A\":\"Activar Workload Identity Federation for GKE y dar el rol IAM al ServiceAccount de Kubernetes de la carga (directamente como principal o vinculándolo a una cuenta de servicio IAM)\",\"B\":\"Montar en cada Pod una clave JSON de cuenta de servicio como Secret de Kubernetes\",\"C\":\"Dar Storage Admin a la cuenta de servicio del node pool para que todos los Pods lo hereden\",\"D\":\"Hacer el bucket de lectura pública\"},\"correct\":\"A\",\"explanation\":\"Workload Identity Federation for GKE permite que los ServiceAccounts de Kubernetes actúen como principales de IAM. Das roles como `roles/storage.objectViewer` a la carga concreta, y los Pods obtienen credenciales de corta duración del servidor de metadatos de GKE automáticamente. No hay claves que filtrar y cada carga tiene el mínimo privilegio.\\n\\nPor qué fallan las demás: (B) las claves montadas son secretos de larga duración difíciles de rotar. (C) una identidad a nivel de nodo la comparten todos los Pods del nodo, y Storage Admin es demasiado amplio. (D) un bucket público expone los datos.\\n\\nPista de examen: «Pods de GKE acceden a APIs de Google Cloud de forma segura» → Workload Identity Federation for GKE.\"},{\"id\":\"20\",\"question\":\"Un equipo de plataforma ya gestiona todas sus aplicaciones con manifiestos de Kubernetes y GitOps. Quiere crear y gestionar de forma declarativa recursos de Google Cloud como instancias de Cloud SQL, temas de Pub/Sub y bindings de IAM, con las mismas herramientas de Kubernetes. ¿Qué herramienta encaja?\",\"options\":{\"A\":\"Charts de Helm que ejecuten comandos gcloud en init containers\",\"B\":\"Config Connector, que representa los recursos de Google Cloud como recursos personalizados de Kubernetes\",\"C\":\"Cambios manuales en la consola de Google Cloud documentados en una wiki\",\"D\":\"Scripts de Cloud Shell guardados en una carpeta compartida\"},\"correct\":\"B\",\"explanation\":\"Config Connector es un complemento de Kubernetes que añade recursos personalizados para los servicios de Google Cloud. Aplicas YAML (por ejemplo `SQLInstance` o `PubSubTopic`) y sus controladores crean y reconcilian continuamente los recursos reales, así que encaja de forma natural con GitOps.\\n\\nPor qué fallan las demás: (A) Helm empaqueta manifiestos de Kubernetes; ejecutar gcloud desde contenedores es imperativo y no corrige las desviaciones. (C) y (D) los cambios manuales y los scripts sueltos no son declarativos ni repetibles.\\n\\nOpciones de IaC en la guía: Terraform (y Fabric FAST, los blueprints de landing zone de Google en Terraform), Config Connector y Helm. Entre las opciones asistidas por IA: Gemini Cloud Assist, Gemini CLI y Application Design Center.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
