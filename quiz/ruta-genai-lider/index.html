isplay\":\"inline-block\"},\"children\":[\"$\",\"h2\",null,{\"style\":{\"fontSize\":14,\"fontWeight\":400,\"lineHeight\":\"49px\",\"margin\":0},\"children\":\"This page could not be found.\"}]}]]}]}]]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"$L5\",null,{}]]}]}]]}]]}],{\"children\":[\"quiz\",[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"ruta-genai-lider\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",null,[\"$\",\"$L7\",null,{\"children\":\"$L8\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"1u5wNSK-BHR8Pf4Mi96SK\",{\"children\":[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],null]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$d\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"e:I[9030,[\"206\",\"static/chunks/206-c60f02a9e73b4fab.js\",\"200\",\"static/chunks/app/quiz/%5Bid%5D/page-8500fbbb03871769.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"quiz\":{\"id\":\"ruta-genai-lider\",\"title\":\"Exam: Generative AI on Google Cloud\",\"questions\":[{\"id\":\"1\",\"question\":\"Friday's demo: the assistant answered catalog prices correctly at the booth; on Monday they are two weeks stale. Nobody touched anything. Most likely cause, and what do you ask the team for?\",\"options\":{\"A\":\"It is the browser's cache: clearing the seller's device cache fixes it\",\"B\":\"The model degrades on its own with use: retrain Gemini with the new prices\",\"C\":\"Friday was hallucination too: the prices were invented, hence they change\",\"D\":\"The answers came from a RAG indexed before the demo: without re-indexing, the live price never reaches the context; demand catalog re-indexing (or tools) before every deployment\"},\"correct\":\"D\",\"explanation\":\"It wins because it ties the symptom (stale, not hallucinated, information) to the mechanism: what enters the context governs the answer; a demo index is a snapshot.\\n\\nWhy the others fail:\\n(A) The wrong assumption: a client (browser) problem when the staleness sits in the server's index; clearing cache does not alter the context the model receives.\\n(B) The wrong assumption: the model as a mutable database. Nobody retrains a foundation model over prices; the staleness lives in the CONTEXT handed to it, not in the weights.\\n(C) The wrong assumption: every mismatch is hallucination. The booth prices MATCHED the catalog (someone verified them); on Monday the world moved and the index did not.\\n\\nExam cue: Context is a snapshot: without re-indexing or tools, the answer stays frozen at the index date.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck1\"},{\"id\":\"2\",\"question\":\"The pipeline classifies emails into 5 categories and must return strict JSON. Sometimes it works, sometimes it adds an unsolicited explanation. A teammate suggests raising temperature to 1.2 «so it explores new formats». What do you do?\",\"options\":{\"A\":\"Approve: with more temperature the model will invent the missing format\",\"B\":\"Set temperature 0.2 with 3–5 few-shot examples and the exact JSON schema in the prompt (or response_mime_type where the SDK offers it): format becomes deterministic\",\"C\":\"Keep the temperature and yell: «RETURN ONLY JSON, NO EXPLANATIONS»\",\"D\":\"Post-process: regex out the JSON from the answer, whatever it takes\"},\"correct\":\"B\",\"explanation\":\"It wins because it attacks BOTH mechanism pieces: low temperature reduces sampling variety, and few-shots pin the EXACT response pattern into the context.\\n\\nWhy the others fail:\\n(A) The wrong assumption: creativity as format fix. High temperature INCREASES variety (more different formats — the exact problem) and does not respect the schema.\\n(C) The wrong assumption: emphatic tone as technology. Without a schema example or sampling control, the model KNOWS the ask and still fails; caps are not a parameter.\\n(D) The wrong assumption: an output patch. Regex tolerates broken formats (nested lists, prose before the object), stays fragile, and teaches the model nothing; fixing the context is cheaper and sturdier.\\n\\nExam cue: Format = context + sampling: few-shots with the schema and low temperature make JSON deterministic.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck2\"},{\"id\":\"3\",\"question\":\"An insurer wants an internal assistant to review and classify 50,000 already-digitized policies a year. The data is sensitive: compliance requires it stay inside company infrastructure. Two paths: (A) Gemini with data residency + CMEK; (B) fine-tuned Gemma on their own servers. Both satisfy residency. How do you choose?\",\"options\":{\"A\":\"B always: own servers give full control and small models are cheaper\",\"B\":\"It is a cost-task-quality decision: if the task (classify policy text) is solved well by a fine-tuned Gemma and the volume justifies running it (50k/year → yes), pick B; if the task needed long reasoning or multimodality, A\",\"C\":\"A always: provider closed models always beat open ones on quality\",\"D\":\"Neither: with sensitive data, generative AI must never be used\"},\"correct\":\"B\",\"explanation\":\"It wins because it sets the decision's real axes: TASK quality, data volume (justifying self-hosting) and operating cost — beyond the model's label.\\n\\nWhy the others fail:\\n(A) The wrong assumption: control as the only axis. Running an LLM (inference, scaling, patching) burns team hours; the license saving dissolves in operating cost.\\n(C) The wrong assumption: brand as quality seal. For a narrow, tunable task, a small fine-tuned model can match or beat the generalist ON THAT TASK, at lower cost.\\n(D) The wrong assumption: sensitivity as a blanket veto. Both paths keep data in-house (residency/CMEK or on-prem): the requirement is met; there is no veto here.\\n\\nExam cue: Closed vs. open model is not faith: it is task, volume and operating cost — with residency covered in both cases.\",\"difficulty\":\"advanced\",\"flowItem\":\"s1-ck3\"},{\"id\":\"4\",\"question\":\"Your chat does well in English and degrades in Portuguese. Hypothesis: training data carries far more English. Which term best names the cause of the gap?\",\"options\":{\"A\":\"Base model over-specialization that demands a new architecture\",\"B\":\"The gap mirrors corpus distribution: the model learns to predict each language in proportion to how much it saw it; the fix is more weak-language examples (fine-tuning or in-prompt examples)\",\"C\":\"Hallucination: the model is inventing Portuguese, hence it fails\",\"D\":\"Prompt bias: if the system prompt is in English, the model answers better in English\"},\"correct\":\"B\",\"explanation\":\"It wins because it ties per-language quality to its real cause (training distribution) and the proportional fix (more weak-language examples).\\n\\nWhy the others fail:\\n(A) The wrong assumption: an invented term for the case. The language gap is data imbalance, not an architectural condition.\\n(C) The wrong assumption: hallucination as catch-all. Hallucinating is inventing facts; clumsy Portuguese is a data-coverage matter.\\n(D) The wrong assumption: the prompt language driving answer quality. It may nudge the REPLY's language, but it does not explain a broad per-language capability gap.\\n\\nExam cue: Quality per region or language reflects how much of it the model saw: improvement scales with the examples you add.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-ck4\"},{\"id\":\"5\",\"question\":\"Your assistant answers well with documents attached. Remove the attachments, ask the same thing, and it answers with invented but plausible facts. What does the experiment prove, and what does it imply for deployment?\",\"options\":{\"A\":\"That the model is over-trained and must be re-trained from scratch with more Portuguese\",\"B\":\"That the experiment's documents carried errors that polluted the model\",\"C\":\"That RAG should be turned off in production: the model is better without documents\",\"D\":\"The model depends on context: without it, it predicts plausible text, not truth — in production RAG is not optional, it is a requirement\"},\"correct\":\"D\",\"explanation\":\"It wins because the experiment CONTROLS the context variable (with vs. without attachments) and demonstrates the mechanism; the deployment implication is direct: ground it or don't ship it.\\n\\nWhy the others fail:\\n(A) The wrong assumption: retraining on reflex. The experiment shows context dependence, not a weights defect: retraining costs months and does not change the mechanism.\\n(B) The wrong assumption: blaming the data when the with/without-context contrast isolates the cause (the context is what flips quality).\\n(C) The wrong assumption: inverting the finding. Without documents the answers are INVENTED: RAG is what brings the real fact into context.\\n\\nExam cue: Without the fact in context, the LLM writes the most plausible thing; serious deployments ground by default.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-ck5\"},{\"id\":\"6\",\"question\":\"The CTO asks which landscape layer Gemini Enterprise Agent Platform (formerly Vertex AI) belongs to. What do you answer?\",\"options\":{\"A\":\"Infrastructure: the hardware everything runs on\",\"B\":\"Models: because it includes Gemini\",\"C\":\"Platforms: the layer to build, deploy and govern models and agents (access, tuning, evaluation, deployment, governance)\",\"D\":\"Applications: end users chat with it directly\"},\"correct\":\"C\",\"explanation\":\"It wins because it places the product by its FUNCTION (management), not its wrapper; the landscape's platform definition — and its former Vertex AI name.\\n\\nWhy the others fail:\\n(A) The wrong assumption: mixing the platform with the TPUs hosting it. AI Hypercomputer hardware sits BELOW; the platform LAYER MANAGES models and agents.\\n(B) The wrong assumption: the catalog as the layer. Gemini lives in the MODELS layer; the platform is its ACCESS/tuning/deployment/governance tooling.\\n(D) The wrong assumption: the chat's first impression. What a user touches is the APPLICATION (agent spaces like Workspace); the platform is what BEHIND builds and governs that agent.\\n\\nExam cue: Layer = product's function: hardware serves, models think, the platform manages, agents act, applications get touched.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck1\"},{\"id\":\"7\",\"question\":\"The factory wants a lightweight tunable model running OFFLINE on the production line (visual defect detection), and IT insists on keeping hardware under its control. What do you pick and why?\",\"options\":{\"A\":\"Gemini via API: the best quality always wins\",\"B\":\"A deterministic OpenCV pipeline: no generative AI needed at all\",\"C\":\"Fine-tune a Model Garden partner model with no further changes\",\"D\":\"Gemma: the open, lightweight, tunable model, downloadable to run on owned servers or edge devices in the factory\"},\"correct\":\"D\",\"explanation\":\"It wins because it meets the three requirements that actually govern the case: downloadable (offline), runnable on owned hardware, and tunable to the task (defect detection).\\n\\nWhy the others fail:\\n(A) The wrong assumption: top quality as a universal rule. The case demands OFFLINE and owned hardware: Gemini is a cloud service; outside the network requirement it is not even eligible.\\n(B) The wrong assumption: generativity as a defect. Visual defects VARY in ways rules cannot spell (shadow, angle, lens wear): precisely the case for a fine-tuned vision model.\\n(C) The wrong assumption: tunability as the finish line. Many partner models also run in the cloud only: the owned-hardware requirement remains unmet.\\n\\nExam cue: When they demand offline + owned hardware + tunable, the open-catalog answer is Gemma.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck2\"},{\"id\":\"8\",\"question\":\"The support agent answers «your order status is 3» when the client asks about their order. The team fine-tuned the model on 100k historical tickets and the error persists. Real diagnosis and fix?\",\"options\":{\"A\":\"Missing context: order status is LIVE data that cannot be learned into weights; the agent gets a TOOL querying the order system and drafts from its response\",\"B\":\"The fine-tuning was done poorly: with 500k better-curated tickets, the model would memorize the statuses\",\"C\":\"Injecting the status catalog into the system prompt suffices: «3 means in transit»\",\"D\":\"It is a temperature problem: at temperature 0, «3» would be the most probable, correct answer\"},\"correct\":\"A\",\"explanation\":\"It wins because it separates the two engines: weights store PATTERNS, not today's order state; the remedy is function calling on the live system, not more training data.\\n\\nWhy the others fail:\\n(B) The wrong assumption: curation as an approach fix. Even with millions of tickets, TODAY's order state never appeared in training data.\\n(C) The wrong assumption: the dictionary as data. Translating the code does not bring the CLIENT'S order state: the live query lives in the database, not in the instructions.\\n(D) The wrong assumption: deterministic as correct. Low temperature picks the most PLAUSIBLE word, and without the fact in context the plausible one can be wrong: the fact must be FETCHED, not the dice adjusted.\\n\\nExam cue: Weights = patterns; context = facts. The live is not trained: it is fetched with tools.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-ck3\"},{\"id\":\"9\",\"question\":\"The CISO asks for a structured security framework across the AI lifecycle (injection, poisoning, model theft). Which Google framework answers that?\",\"options\":{\"A\":\"Google's Secure AI Framework (SAIF): AI lifecycle coverage across prompt injection, data poisoning and model theft\",\"B\":\"The Architecture Framework's cost optimization pillar\",\"C\":\"The ML lifecycle's data ingestion stage\",\"D\":\"Model Garden's model cards: they document the model and its limits\"},\"correct\":\"A\",\"explanation\":\"It wins because that is precisely SAIF's scope: a structured security framework for AI systems across their lifecycle, with those risks as first-class citizens.\\n\\nWhy the others fail:\\n(B) The wrong assumption: an architecture pillar as a security framework. The Architecture Framework optimizes architectures; AI security has its own framework (SAIF).\\n(C) The wrong assumption: one lifecycle stage as the whole framework. Ingestion covers data entry; SAIF covers the FULL loop with AI attack vectors.\\n(D) The wrong assumption: documentation as framework. Model cards describe models; SAIF prescribes security CONTROLS per risk.\\n\\nExam cue: For AI systems security, Google's framework is SAIF; the other three are utilities, pillars, or documentation.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck4\"},{\"id\":\"10\",\"question\":\"The contract extractor must return EXACT clauses from legal policies, word-perfect: legal demands identical answers across queries of the same document. What configuration?\",\"options\":{\"A\":\"Random temperature: creativity helps paraphrase clauses more clearly\",\"B\":\"Temperature 0.8 so it explores text variants and picks the best\",\"C\":\"Fine-tuning the model on the company's contracts instead of prompt engineering\",\"D\":\"Temperature 0 + few-shot format prompt + require document citations in the reply\"},\"correct\":\"D\",\"explanation\":\"It wins because it stacks the three right levers: temperature 0 (deterministic: same input, same output), few-shots (stable format), and citations (verifiable against the handed document).\\n\\nWhy the others fail:\\n(A) The wrong assumption: paraphrasing as improvement. Legal asks for the EXACT clause, not a creative translation; paraphrasing is precisely the risk.\\n(B) The wrong assumption: variety as quality. In legal, every variation would introduce a discrepancy: DETERMINISM is required, and exploration destroys it.\\n(C) The wrong assumption: tuning what context solves. Contracts change per client: RAG + context hands over the document; fine-tuning generalizes style but does NOT guarantee the exact wording of TODAY's document.\\n\\nExam cue: Word-perfect accuracy demands: temperature 0, few-shot format, and auditable citations.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck5\"}]}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
