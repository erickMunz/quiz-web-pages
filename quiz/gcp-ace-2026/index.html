inside EU regions. The unit's projects live under a folder named `eu`. Developers have Editor on their projects. What is the most effective control?\",\"options\":{\"A\":\"Remove the Editor role and grant developers Viewer only\",\"B\":\"Set the `gcp.resourceLocations` organization policy on the `eu` folder to allow only EU locations\",\"C\":\"Create a Cloud Monitoring alert that fires when a resource is created outside the EU\",\"D\":\"Ask developers to always pass `--region=europe-west1` in their gcloud commands\"},\"correct\":\"B\",\"explanation\":\"Organization policies are preventive and inherited down the resource hierarchy. Setting the resource locations constraint (for example `in:eu-locations`) on the folder blocks creation of location-bound resources outside the EU for every project below it, whatever IAM role the developer has.\\n\\nWhy the others fail: (A) IAM controls who can act, not where; Viewer would also stop developers from working. (C) an alert detects violations after they happen. (D) a convention is not enforcement.\\n\\nExam cue: 'must never', 'across all projects in a folder' → organization policy at the folder or organization node.\"},{\"id\":\"2\",\"question\":\"Your company's employees sign in with Microsoft Entra ID. Security does not want to synchronize user accounts into Cloud Identity, but employees need console and gcloud access to Google Cloud with their existing corporate sign-in. What should you configure?\",\"options\":{\"A\":\"Create a service account key for each employee\",\"B\":\"Create a consumer Gmail account for each employee and grant it IAM roles\",\"C\":\"Set up Google Cloud Directory Sync to copy every user into Cloud Identity\",\"D\":\"Workforce Identity Federation with a workforce pool and provider for Entra ID, then grant IAM roles to the pool's principals\"},\"correct\":\"D\",\"explanation\":\"Workforce Identity Federation lets users from an external identity provider (Entra ID, Okta and other OIDC or SAML providers) access Google Cloud directly with their own credentials. No user accounts are synchronized; you grant IAM roles to `principal://` or `principalSet://` identifiers from the workforce pool.\\n\\nWhy the others fail: (A) service account keys are for workloads, are long-lived secrets and remove individual accountability. (B) personal Gmail accounts are outside corporate control. (C) Directory Sync is the synchronization approach security wants to avoid.\\n\\nRelated: Workload Identity Federation is the equivalent for workloads (CI/CD, other clouds) instead of people.\"},{\"id\":\"3\",\"question\":\"Finance wants to analyze Google Cloud costs by project, service, SKU and custom labels with SQL, and build dashboards that go back more than a year. What should you set up?\",\"options\":{\"A\":\"Cloud Billing export to BigQuery (standard or detailed usage cost data)\",\"B\":\"A budget with an email alert at 90% of the monthly amount\",\"C\":\"Downloading the monthly invoice PDF and copying totals into a spreadsheet\",\"D\":\"A Cloud Monitoring dashboard of CPU utilization for all VMs\"},\"correct\":\"A\",\"explanation\":\"Billing export to BigQuery continuously writes detailed cost and usage records (project, service, SKU, labels, credits) to a dataset you own. Finance can query it with SQL and connect Looker Studio or other BI tools. Data is only exported from the moment you enable it, so enable it early.\\n\\nWhy the others fail: (B) budgets alert on thresholds but do not provide analyzable detail. (C) invoices are aggregated and manual. (D) CPU utilization is not cost.\\n\\nExam cue: 'analyze costs with SQL', 'by label' → billing export to BigQuery; 'notify when spend reaches X' → budgets and alerts.\"},{\"id\":\"4\",\"question\":\"A deployment fails with an error saying the regional CPUS quota in `us-central1` is exceeded. The workload legitimately needs more capacity in that region. What should you do?\",\"options\":{\"A\":\"Delete the project and create a new one, which resets quotas\",\"B\":\"Switch every VM to a larger machine type so fewer VMs are needed\",\"C\":\"Review the quota on the Quotas page (Cloud Quotas) and request a quota increase for that region\",\"D\":\"Open a firewall rule for the deployment's IP range\"},\"correct\":\"C\",\"explanation\":\"Quotas protect both you and the platform. When a legitimate workload needs more, you view current usage and limits in the console's Quotas page (or with the Cloud Quotas API or gcloud) and submit an increase request for the specific quota and region. You can also set up quota alerts to know before hitting limits.\\n\\nWhy the others fail: (A) new projects get default quotas, often lower, and you lose everything. (B) larger machine types use the same vCPU quota. (D) firewall rules are unrelated to quotas.\\n\\nExam cue: 'quota exceeded' → check usage, request increase; plan quotas before large launches.\"},{\"id\":\"5\",\"question\":\"A nightly batch job renders thousands of independent images. It checkpoints its progress and can be restarted at any time. You want the lowest possible Compute Engine cost. What should you use?\",\"options\":{\"A\":\"Sole-tenant nodes with committed use discounts\",\"B\":\"Standard on-demand VMs in a single large instance\",\"C\":\"Spot VMs in a managed instance group\",\"D\":\"Regional persistent disks attached to every VM\"},\"correct\":\"C\",\"explanation\":\"Spot VMs offer deep discounts (often 60–91% off) in exchange for possible preemption at any time. A fault-tolerant, checkpointing batch job is the ideal workload, and a managed instance group recreates preempted VMs when capacity returns.\\n\\nWhy the others fail: (A) sole-tenant nodes are for isolation or licensing and cost more. (B) on-demand is the most expensive option and one VM does not parallelize the work. (D) regional disks add cost for high availability the job does not need.\\n\\nRelated: custom machine types let you pick the exact vCPU and memory ratio, avoiding paying for unused resources.\"},{\"id\":\"6\",\"question\":\"A small team wants to run containerized microservices on Kubernetes but does not want to manage nodes, node pools, upgrades or capacity planning, and prefers to pay for the resources their Pods request. Which option fits?\",\"options\":{\"A\":\"A GKE Autopilot cluster\",\"B\":\"A GKE Standard zonal cluster with manually sized node pools\",\"C\":\"Compute Engine VMs with Docker installed\",\"D\":\"A self-managed Kubernetes cluster built with kubeadm on Compute Engine\"},\"correct\":\"A\",\"explanation\":\"GKE Autopilot is the mode where Google manages the nodes, scaling, security hardening and upgrades. You deploy workloads and are billed mainly for the CPU, memory and storage your Pods request. It keeps the full Kubernetes API.\\n\\nWhy the others fail: (B) Standard mode makes you size and manage node pools. (C) plain VMs with Docker give up Kubernetes orchestration. (D) a self-managed cluster is the most operational work of all.\\n\\nExam cue: 'Kubernetes without managing nodes', 'pay per Pod' → Autopilot; 'need custom node configuration or specific hardware control' → Standard.\"},{\"id\":\"7\",\"question\":\"Each time a PDF is uploaded to a Cloud Storage bucket, you need to extract its text and store the result, with no servers to manage and no polling. What should you deploy?\",\"options\":{\"A\":\"A Compute Engine VM that lists the bucket every minute\",\"B\":\"A Cloud Scheduler job that runs a script every hour\",\"C\":\"A GKE Deployment that keeps a persistent connection to the bucket\",\"D\":\"A Cloud Run function triggered through Eventarc by the Cloud Storage object finalized event\"},\"correct\":\"D\",\"explanation\":\"Eventarc delivers Cloud Storage events (such as `google.cloud.storage.object.v1.finalized`) to Cloud Run services or Cloud Run functions. The function runs only when a file arrives, scales automatically, including to zero, and needs no servers.\\n\\nWhy the others fail: (A) a polling VM costs money while idle and reacts late. (B) an hourly schedule adds latency and processes files in batches. (C) a GKE Deployment adds cluster management for an event-driven task.\\n\\nExam cue: 'when a file is uploaded', 'Pub/Sub message', 'audit log event' → Eventarc or a direct trigger on Cloud Run functions.\"},{\"id\":\"8\",\"question\":\"You must store quarterly compliance reports. Each is read about once every three months for an audit and must remain available within milliseconds when requested. You want the lowest storage cost for this pattern. Which Cloud Storage class should you choose?\",\"options\":{\"A\":\"Standard\",\"B\":\"Coldline\",\"C\":\"Archive\",\"D\":\"Nearline\"},\"correct\":\"B\",\"explanation\":\"Coldline is designed for data accessed less than once a quarter, with a 90-day minimum storage duration. Its storage price is lower than Nearline's, and all Cloud Storage classes return data with millisecond latency.\\n\\nWhy the others fail: (A) Standard is for frequently accessed data and costs the most to store. (C) Archive is cheaper to store but targets data accessed less than once a year, with a 365-day minimum and higher retrieval costs. (D) Nearline (30-day minimum) suits roughly monthly access; for quarterly access Coldline is cheaper.\\n\\nRule of thumb: Standard (hot) → Nearline (~monthly) → Coldline (~quarterly) → Archive (~yearly).\"},{\"id\":\"9\",\"question\":\"Security wants firewall rules that target VMs by an attribute that only an authorized IAM role can attach, so that a project Editor cannot simply add a label to a VM to bypass a rule. What should you use in the Cloud NGFW policy rules?\",\"options\":{\"A\":\"Secure Tags (IAM-governed Resource Manager tags) as source and target\",\"B\":\"Network tags, which any user who can edit the VM can set\",\"C\":\"VM instance names in the rule's target field\",\"D\":\"The VM's external IP addresses\"},\"correct\":\"A\",\"explanation\":\"Secure Tags are Resource Manager tags whose attachment is controlled by IAM (for example the Tag User role). Used in Cloud NGFW network firewall policies, they let security define who can bind a VM to a rule, so a project Editor cannot change which rules apply to their VM.\\n\\nWhy the others fail: (B) network tags are free-form strings that anyone with permission to edit the instance can change. (C) firewall rules do not target by instance name. (D) IP addresses change and do not express identity.\\n\\nRelated: rules can also target by service account; firewall rule attributes include action, direction (ingress or egress), source, destination, target, protocols, ports and priority.\"},{\"id\":\"10\",\"question\":\"A public HTTPS web application runs on managed instance groups in `us-east1` and `europe-west1`. Users worldwide should reach the closest healthy backend through a single IP address, with TLS terminated at the edge. Which load balancer should you choose?\",\"options\":{\"A\":\"A regional external passthrough Network Load Balancer\",\"B\":\"An internal Application Load Balancer\",\"C\":\"A global external Application Load Balancer\",\"D\":\"A regional internal passthrough Network Load Balancer\"},\"correct\":\"C\",\"explanation\":\"The global external Application Load Balancer (HTTP/HTTPS, layer 7) uses a single anycast IP, terminates TLS at Google's edge and routes each user to the nearest backend with capacity and passing health checks, across regions. It also supports Cloud CDN and Cloud Armor.\\n\\nWhy the others fail: (A) a passthrough network load balancer is regional and layer 4, without TLS termination at the edge or cross-region routing. (B) and (D) internal load balancers are for traffic inside the VPC, not public users.\\n\\nExam cue: global HTTP(S) users → global external Application LB; TCP/UDP preserving client IP → passthrough Network LB; private traffic → internal LBs. Premium Network Service Tier is required for global load balancing.\"},{\"id\":\"11\",\"question\":\"Pods in a GKE Standard cluster fail with `ImagePullBackOff` when pulling an image from Artifact Registry in another project. The nodes use a custom service account. What is the most likely fix?\",\"options\":{\"A\":\"Make the Artifact Registry repository public on the internet\",\"B\":\"Grant the node service account the Artifact Registry Reader role (`roles/artifactregistry.reader`) on the repository or its project\",\"C\":\"Give the node service account the Owner role on both projects\",\"D\":\"Recreate the cluster as a zonal cluster\"},\"correct\":\"B\",\"explanation\":\"GKE nodes pull images using the node pool's service account. With a custom service account, or a repository in another project, that account needs `roles/artifactregistry.reader` on the repository (or project). Granting it fixes the pull with least privilege.\\n\\nWhy the others fail: (A) making images public exposes them to everyone. (C) Owner is grossly over-privileged. (D) the cluster's location type is unrelated to image authorization.\\n\\nTroubleshooting: `kubectl describe pod` shows the pull error; check the image path (`REGION-docker.pkg.dev/PROJECT/REPO/IMAGE:TAG`) and the node service account's IAM.\"},{\"id\":\"12\",\"question\":\"You need to release a new version of a Cloud Run service with minimal risk: deploy it without sending it any users, test it, then move 10% of traffic and increase gradually. How do you do this?\",\"options\":{\"A\":\"Delete the service and redeploy it with the new image\",\"B\":\"Deploy the new image to a second, separate Cloud Run service and change DNS manually\",\"C\":\"Scale the current revision to zero instances while the new one starts\",\"D\":\"Deploy a new revision with `--no-traffic` (optionally with a tag for a test URL), then use `gcloud run services update-traffic` to shift 10% and increase step by step\"},\"correct\":\"D\",\"explanation\":\"Each Cloud Run deployment creates an immutable revision. With `--no-traffic` the new revision receives no users; a revision tag gives it its own URL for testing. Then `update-traffic --to-revisions=NEW=10` performs a canary split, and you raise the percentage or roll back instantly to the previous revision.\\n\\nWhy the others fail: (A) deleting causes downtime and loses rollback. (B) a separate service with DNS changes is slower and has no percentage split. (C) Cloud Run does not let you scale a serving revision to zero manually while it receives traffic, and this would still cause an abrupt switch.\\n\\nExam cue: gradual rollout or canary on Cloud Run → revisions plus traffic splitting.\"},{\"id\":\"13\",\"question\":\"Application logs are written to a Cloud Storage bucket. They are read often for 30 days, rarely after that, and must be deleted after one year. What is the simplest way to minimize cost automatically?\",\"options\":{\"A\":\"Run a weekly script that copies old objects to a new bucket and deletes the originals\",\"B\":\"Enable Object Versioning so old logs are kept as noncurrent versions\",\"C\":\"Use Archive class for all logs from the start\",\"D\":\"Configure Object Lifecycle Management rules: `SetStorageClass` to Coldline when age reaches 30 days and `Delete` when age reaches 365 days\"},\"correct\":\"D\",\"explanation\":\"Object Lifecycle Management applies rules to objects automatically based on conditions such as age, storage class or number of newer versions. Actions include `SetStorageClass` (move to a colder class) and `Delete`. This keeps hot data in Standard, moves it to a cheaper class when access drops and deletes it on schedule, with no code.\\n\\nWhy the others fail: (A) custom scripts are operational work and copying adds cost. (B) versioning keeps more data and increases cost. (C) Archive for data read often in the first 30 days incurs retrieval charges and early-deletion fees.\\n\\nRelated: Autoclass can move objects between classes automatically based on actual access, when patterns are unpredictable.\"},{\"id\":\"14\",\"question\":\"A subnet with the primary range `10.0.1.0/24` has run out of IP addresses for new VMs. The VPC has no overlapping ranges nearby. What is the least disruptive fix?\",\"options\":{\"A\":\"Delete the subnet and recreate it as `10.0.0.0/22`\",\"B\":\"Expand the subnet's primary range with `gcloud compute networks subnets expand-ip-range --prefix-length=23`\",\"C\":\"Shrink the subnet to `/25` to free addresses\",\"D\":\"Assign external IPs to the new VMs instead of internal ones\"},\"correct\":\"B\",\"explanation\":\"You can expand a subnet's primary IPv4 range in place (for example from /24 to /23) as long as the new range does not overlap other ranges in the VPC or peered networks. Existing VMs keep their addresses and nothing is interrupted.\\n\\nWhy the others fail: (A) deleting a subnet requires removing all its resources first, which is disruptive. (C) subnets cannot be shrunk, and a smaller range has fewer addresses. (D) every VM interface still needs an internal IP from the subnet.\\n\\nRemember: expansion is one-way; plan ranges with growth in mind.\"},{\"id\":\"15\",\"question\":\"The security team wants all Admin Activity audit logs from every project in the organization stored in one place for two years and queryable with SQL. What should you configure?\",\"options\":{\"A\":\"Increase the retention of the `_Default` log bucket in each project to two years and query each one\",\"B\":\"Ask each project owner to download logs monthly as CSV\",\"C\":\"An aggregated log sink at the organization level that includes child projects and routes audit logs to a BigQuery dataset (or to a log bucket with Log Analytics)\",\"D\":\"Create a Cloud Monitoring uptime check for each project\"},\"correct\":\"C\",\"explanation\":\"Log sinks route log entries matching a filter to a destination: a Cloud Storage bucket, a BigQuery dataset, Pub/Sub, or a Cloud Logging log bucket. An aggregated sink at the organization or folder level with `--include-children` captures logs from every project centrally. BigQuery, or a log bucket upgraded to Log Analytics, lets you query them with SQL, and you control retention.\\n\\nWhy the others fail: (A) per-project retention does not centralize anything. (B) manual exports are unreliable. (D) uptime checks probe availability; they do not collect logs.\\n\\nRelated: send to Pub/Sub to export logs to external systems such as a SIEM.\"},{\"id\":\"16\",\"question\":\"An application writes a log line containing `payment_failed` each time a payment fails. The on-call team wants a page when there are more than 20 such failures in 5 minutes. The application exports no metrics. What should you do?\",\"options\":{\"A\":\"Create a log-based counter metric that matches `payment_failed`, then a Cloud Monitoring alerting policy on that metric with a threshold of 20 over 5 minutes\",\"B\":\"Ask the on-call engineer to search the logs every 5 minutes\",\"C\":\"Create an uptime check against the payment API's home page\",\"D\":\"Export all logs to Cloud Storage and review them daily\"},\"correct\":\"A\",\"explanation\":\"Log-based metrics turn matching log entries into Cloud Monitoring time series (a counter here) without changing application code. An alerting policy on that metric with a threshold and a 5-minute window notifies the on-call channel.\\n\\nWhy the others fail: (B) manual searching is unreliable. (C) an uptime check tests availability of an endpoint, not payment failures. (D) daily review is far too slow for paging.\\n\\nRelated: applications can also write custom metrics directly (OpenTelemetry or the Monitoring API), and the Ops Agent collects VM system and application metrics.\"},{\"id\":\"17\",\"question\":\"Support engineers need to start, stop and reset Compute Engine VMs, but must not create, delete or change their configuration. No predefined role matches exactly. What should you do?\",\"options\":{\"A\":\"Grant Compute Admin, because it includes start and stop\",\"B\":\"Grant the basic Editor role on the project\",\"C\":\"Create a custom role with only `compute.instances.start`, `compute.instances.stop`, `compute.instances.reset` and the needed `get`/`list` permissions, and grant it to a group\",\"D\":\"Share the project owner's credentials with the support team\"},\"correct\":\"C\",\"explanation\":\"Custom roles let you bundle exactly the permissions a job needs when predefined roles are too broad. Granting the role to a Google group rather than individuals keeps management simple. Custom roles can be defined at the organization or project level.\\n\\nWhy the others fail: (A) Compute Admin includes creating and deleting instances. (B) basic roles such as Editor are very broad and discouraged in production. (D) sharing credentials destroys accountability.\\n\\nRole types: basic (Owner, Editor, Viewer; avoid), predefined (managed by Google, per service), custom (yours to maintain). Policies are inherited down the hierarchy, so grant at the lowest level that works.\"},{\"id\":\"18\",\"question\":\"A developer needs to test locally what a deployment pipeline's service account can access, without creating or downloading a service account key. What should you do?\",\"options\":{\"A\":\"Create a JSON key for the service account and email it to the developer\",\"B\":\"Grant the developer the same roles as the service account directly\",\"C\":\"Add the developer's password to Secret Manager\",\"D\":\"Grant the developer the Service Account Token Creator role on that service account, so they can run gcloud with `--impersonate-service-account` and receive short-lived credentials\"},\"correct\":\"D\",\"explanation\":\"Service account impersonation lets an authorized user obtain short-lived OAuth tokens for a service account. With `roles/iam.serviceAccountTokenCreator` on that service account, the developer runs commands as it (`--impersonate-service-account` or `gcloud config set auth/impersonate_service_account`). No key is created, tokens expire quickly and audit logs record both identities.\\n\\nWhy the others fail: (A) downloaded keys are long-lived secrets that leak easily. (B) the developer would test their own access, not the service account's, and accumulate privileges. (C) Secret Manager stores secrets; it does not give service account access.\\n\\nRelated: Service Account User (`roles/iam.serviceAccountUser`) lets you attach a service account to resources such as VMs.\"},{\"id\":\"19\",\"question\":\"An application running in GKE Pods must read objects from a Cloud Storage bucket. You want each workload to have its own identity, with no service account keys stored as Kubernetes Secrets. What is the recommended approach?\",\"options\":{\"A\":\"Enable Workload Identity Federation for GKE and grant the IAM role to the workload's Kubernetes ServiceAccount (directly as a principal or by linking it to an IAM service account)\",\"B\":\"Mount a service account JSON key into each Pod as a Kubernetes Secret\",\"C\":\"Give the node pool's service account Storage Admin so every Pod inherits it\",\"D\":\"Make the bucket publicly readable\"},\"correct\":\"A\",\"explanation\":\"Workload Identity Federation for GKE lets Kubernetes ServiceAccounts act as IAM principals. You grant roles such as `roles/storage.objectViewer` to the specific workload, and Pods get short-lived credentials from the GKE metadata server automatically. No keys exist to leak, and each workload has least privilege.\\n\\nWhy the others fail: (B) mounted keys are long-lived secrets that are hard to rotate. (C) a node-level identity is shared by every Pod on the node, and Storage Admin is too broad. (D) public buckets expose the data.\\n\\nExam cue: 'GKE Pods access Google Cloud APIs securely' → Workload Identity Federation for GKE.\"},{\"id\":\"20\",\"question\":\"A platform team already manages all its applications with Kubernetes manifests and GitOps. They want to create and manage Google Cloud resources such as Cloud SQL instances, Pub/Sub topics and IAM bindings declaratively, with the same Kubernetes tooling. Which tool fits?\",\"options\":{\"A\":\"Helm charts that run gcloud commands in init containers\",\"B\":\"Config Connector, which represents Google Cloud resources as Kubernetes custom resources\",\"C\":\"Manual changes in the Google Cloud console, documented in a wiki\",\"D\":\"Cloud Shell scripts saved in a shared folder\"},\"correct\":\"B\",\"explanation\":\"Config Connector is a Kubernetes add-on that adds custom resources for Google Cloud services. You apply YAML (for example `SQLInstance` or `PubSubTopic`) and its controllers create and continuously reconcile the real resources, so it fits naturally into GitOps.\\n\\nWhy the others fail: (A) Helm packages Kubernetes manifests; running gcloud from containers is imperative and does not reconcile drift. (C) and (D) manual changes and ad hoc scripts are not declarative or repeatable.\\n\\nIaC options in the guide: Terraform (and Fabric FAST, Google's opinionated Terraform landing-zone blueprints), Config Connector and Helm. AI-assisted options include Gemini Cloud Assist, Gemini CLI and Application Design Center.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
