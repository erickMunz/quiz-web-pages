null,{\"style\":{\"display\":\"inline-block\"},\"children\":[\"$\",\"h2\",null,{\"style\":{\"fontSize\":14,\"fontWeight\":400,\"lineHeight\":\"49px\",\"margin\":0},\"children\":\"This page could not be found.\"}]}]]}]}]]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"$L5\",null,{}]]}]}]]}]]}],{\"children\":[\"quiz\",[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"ruta-databricks-plataforma\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",null,[\"$\",\"$L7\",null,{\"children\":\"$L8\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"gXkhz2wt3j936Y2mZs7rb\",{\"children\":[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],null]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$d\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"e:I[9030,[\"206\",\"static/chunks/206-c4310c4aac9e1a25.js\",\"200\",\"static/chunks/app/quiz/%5Bid%5D/page-8500fbbb03871769.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"quiz\":{\"id\":\"ruta-databricks-plataforma\",\"title\":\"Exam: Databricks — platform, ingestion and governance\",\"questions\":[{\"id\":\"1\",\"question\":\"The bank demands raw customer records NEVER leave its cloud account, yet wants Databricks to run notebooks, scheduling and clusters. What does the architecture do?\",\"options\":{\"A\":\"Everything is copied into Databricks' control plane to speed up cluster creation\",\"B\":\"Data locality is not guaranteed; a private link is the only way to contain data\",\"C\":\"The data plane stores notebooks and cluster definitions, and the control plane syncs storage\",\"D\":\"The control plane handles workspace, orchestration and metadata; raw data lives in the customer's bucket and the data-plane clusters (in the customer's account) are the only ones touching it\"},\"correct\":\"D\",\"explanation\":\"It wins because it separates what is shared (metadata, orchestration) from what never leaves (raw data) — the EXACT separation the bank demands and the architecture's real promise.\\n\\nWhy the others fail:\\n(A) The wrong assumption: the control plane as a store. The control plane keeps METADATA and orchestration; raw data stays in the customer's bucket, always.\\n(B) The wrong assumption: buying connectivity to cover a promise that already exists. Plane separation IS the guarantee; Private Link adds network confidentiality, not locality.\\n(C) The wrong assumption: the planes swapped. Notebooks and cluster definitions live in the CONTROL plane (managed service); the DATA plane runs in the customer's account.\\n\\nExam cue: Control plane = the brain (metadata, orchestration); data plane = the hands (clusters in your account); raw data never leaves your bucket.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck1\"},{\"id\":\"2\",\"question\":\"Thousands of JSON per day from the bucket into a Delta table, with continuous arrivals and occasional duplicate files. Each JSON must be processed at most once. Which tool, and why?\",\"options\":{\"A\":\"COPY INTO on a cron schedule: its idempotency avoids repeats\",\"B\":\"A streaming table with an AvailableNow trigger and post-hoc dedup\",\"C\":\"Auto Loader (cloudFiles): tracks the bucket incrementally, records every processed file in the checkpoint and never processes it twice — built for continuous, growing arrivals\",\"D\":\"A CREATE TABLE AS SELECT over the whole bucket, run hourly\"},\"correct\":\"C\",\"explanation\":\"It wins because Auto Loader was built EXACTLY for this pattern: exactly-once file semantics via checkpoint, scaling with growth, with no cron needed.\\n\\nWhy the others fail:\\n(A) The wrong assumption: idempotency as the final advantage. COPY INTO re-scans the bucket every run and does not scale to thousands per day; its niche is small one-off batches, not a continuous flow.\\n(B) The wrong assumption: duplicating features that already exist. Post-hoc dedup adds another full pass and cost; Auto Loader's checkpoint already guarantees once-only.\\n(D) The wrong assumption: re-reading the WHOLE bucket hourly. CTAS is not incremental: by hour 100 it would carry 100 full passes over a growing file set; no scale, no acceleration.\\n\\nExam cue: Continuous arrivals with duplicates = Auto Loader: Databricks' incremental default.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck2\"},{\"id\":\"3\",\"question\":\"A JSON Auto Loader ingestion fails when a field's type differs between files (string in some, float in others). The pipeline stops. What configuration avoids the hard stop without losing the bad rows?\",\"options\":{\"A\":\"Pin the schema by hand (schemaHints) and just run it\",\"B\":\"schemaEvolutionMode with merge of new fields + a rescuedDataColumn to capture ALL records with mismatched types into a raw JSON column, without stopping the pipeline\",\"C\":\"Switch the read format from JSON to CSV with a fixed schema in the files\",\"D\":\"Rewrite the pipeline in Python to catch the schema exception per file and continue\"},\"correct\":\"B\",\"explanation\":\"It wins because it pairs Auto Loader's TWO levers: schema evolution absorbs new fields, and the rescued column holds rows with impossible types for review, non-stop.\\n\\nWhy the others fail:\\n(A) The wrong assumption: pin it and pray. Hand-pinning a type makes rows of other types drop or lose the field; it does not address type variance safely.\\n(C) The wrong assumption: switching format to dodge the issue. The format is right: JSON IS flexible by design; the problem is how to HANDLE the deviation, not the mime type.\\n(D) The wrong assumption: writing more as improvement. try/except per file does not scale to thousands of concurrent files; Auto Loader already ships the official mechanism.\\n\\nExam cue: Auto Loader ships native escape valves: schema evolution + a rescued column — no stops and no losing trace of the weird ones.\",\"difficulty\":\"advanced\",\"flowItem\":\"s1-ck3\"},{\"id\":\"4\",\"question\":\"An analyst needs to query the inventory table AS IT WAS 30 days ago. The Delta table runs VACUUM with the default 30-day retention. Can they, and why?\",\"options\":{\"A\":\"Yes: time travel (VERSION/TIMESTAMP AS OF) works within the retention; with the default (30 days), a 29-day-old query works and a 31-day-old query may not\",\"B\":\"No: once VACUUM runs, all old versions vanish and time travel dies\",\"C\":\"Yes, unconditionally: Delta's time travel keeps versions forever regardless of VACUUM\",\"D\":\"Only with a manual dataset rebuild and a new pipeline: Delta does not support it\"},\"correct\":\"A\",\"explanation\":\"It wins because it joins the two real pieces: time travel exists and is one line, BUT it depends on VACUUM retention; past retention the old files are gone and the snapshot is unreconstructible.\\n\\nWhy the others fail:\\n(B) The wrong assumption: extending VACUUM beyond its retention. VACUUM only deletes the files OLDER than retention (30 days); the newest ones stay intact.\\n(C) The wrong assumption: time travel as an infinite archive. Delta promises it WITHIN retention; beyond it, files are physically gone and the snapshot is gone.\\n(D) The wrong assumption: manual rebuild as the only option. TIMESTAMP AS OF is a one-line query; the only truth is the retention window.\\n\\nExam cue: Time travel reaches as far as VACUUM retention: audit windows are set by retention, not hope.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-ck4\"},{\"id\":\"5\",\"question\":\"An online retailer's ERP exports the FULL product state nightly (new products, price changes, discontinued flagged) and the online catalog table must end up matching it. Which pattern and why?\",\"options\":{\"A\":\"Auto Loader for the nightly export files\",\"B\":\"A nightly job with a full MERGE (or streaming with replaceWhere over the day's window): the catalog table ends matching the ERP state at batch close\",\"C\":\"Idempotent nightly COPY INTO: it processes the day's repeated files without duplicating them\",\"D\":\"Daily VACUUM on the table and a pipeline restart: the old state is cleaned\"},\"correct\":\"B\",\"explanation\":\"It wins because the pattern is IDEMPOTENT full-state replace: MERGE (upsert) or replaceWhere over the export window makes the table match the snapshot and leaves Delta's auditable history.\\n\\nWhy the others fail:\\n(A) The wrong assumption: incremental ingestion for a full replace. The ERP file carries the WHOLE state, not deltas: Auto Loader would append duplicates instead of replacing anything.\\n(C) The wrong assumption: COPY INTO's idempotency as replacement. COPY INTO APPENDS: the table would grow with each night's full state instead of matching the latest.\\n(D) The wrong assumption: VACUUM as data wipe. VACUUM only removes orphan FILES per retention; it never changes the logical table or does any replace.\\n\\nExam cue: Full state nightly = MERGE or replaceWhere (idempotent); incremental arrivals = Auto Loader. They are not interchangeable.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck5\"},{\"id\":\"6\",\"question\":\"A declarative pipeline must guarantee NO order with a negative total reaches the gold table; invalid rows must be dropped and counted, without stopping the pipeline, with visible metrics. What gets defined?\",\"options\":{\"A\":\"A WHERE filter on the gold query, no metric: bad rows vanish silently\",\"B\":\"A notebook try/except writing errors to a log table\",\"C\":\"An expectation (CONSTRAINT … EXPECT DROP INVALID ROWS) on the dataset: drops invalid rows, counts them in metrics, and keeps the pipeline running\",\"D\":\"A job-level retry with failure notification\"},\"correct\":\"C\",\"explanation\":\"It wins because an expectation is the EXACT declarative tool for this: drop + count + no stop, one line, auditable in the pipeline's metrics.\\n\\nWhy the others fail:\\n(A) The wrong assumption: a SQL filter as quality control. Without an expectation there is NO COUNT: quality stays invisible and nobody knows how many orders the filter bit.\\n(B) The wrong assumption: handling it by hand. try/except is imperative, not declarative: it leaves no visible pipeline metrics and requires hand-maintained logging.\\n(D) The wrong assumption: alerting the disaster instead of controlling it. The rule is per-row QUALITY, not job recovery; a retry cleans nothing and repeats the failure.\\n\\nExam cue: Per-row quality in declarative pipelines = EXPECT … DROP INVALID ROWS: drop, count, healthy pipeline — one line.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck1\"},{\"id\":\"7\",\"question\":\"The security team demands: support may read customers but ONLY their own region's rows, and the email column ALWAYS hidden (only Compliance sees it in clear). What goes into Unity Catalog?\",\"options\":{\"A\":\"Two separate tables (one per region) and a view without the email column\",\"B\":\"SELECT grants on the allowed columns and a WHERE clause the agents hand-write\",\"C\":\"A dynamic view all agents query, with no grants to the table\",\"D\":\"A row filter function comparing the current user's region with the row's, plus a column mask on email that returns the value only to the Compliance group\"},\"correct\":\"D\",\"explanation\":\"It wins because those are Unity Catalog's two EXACT primitives for this: the row filter selects rows by identity, the mask rewrites the column by role; declared once, they apply to ALL queries.\\n\\nWhy the others fail:\\n(A) The wrong assumption: copying data per policy. A duplicated table = two sources of truth going stale at the first update; and a global view still exposes email if the join gets open.\\n(B) The wrong assumption: agent discipline as control. A hand-written WHERE gets forgotten at the first query; the policy must live in the CATALOG, not in custom.\\n(C) The wrong assumption: the view as a firewall. A view can compile the rule, but it is not the governance primitive: the native row filter/mask does the same with engine-level auditing and performance.\\n\\nExam cue: In Unity Catalog the policy lives in the CATALOG: row filter by identity, column mask by role — no duplicated tables and no trust in hand-written WHEREs.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-ck2\"},{\"id\":\"8\",\"question\":\"A job joining a 2 TB fact table with a 40 GB dimension runs for HOURS: most tasks finish fast, but a few drag on. Likely cause and the real fix?\",\"options\":{\"A\":\"The join is not balanced: a few keys concentrate millions of rows (skew). The classic fix broadcasts the dimension (40 GB fits each executor) or salts the hot keys\",\"B\":\"The cluster is undersized: add more workers so the job finishes faster\",\"C\":\"The read format is not Delta: converting to Delta speeds it up automatically\",\"D\":\"The dimension is heavily indexed: removing indexes speeds up the join\"},\"correct\":\"A\",\"explanation\":\"It wins because it names the pattern: a few slow tasks among thousands = key skew; broadcast join (the dimension fits memory) kills the shuffle on the heavy side, and salting spreads hot keys.\\n\\nWhy the others fail:\\n(B) The wrong assumption: more machines fixing skew. With skew, the hot task stays ONE no matter how many workers: the bottleneck is the partition, not the node count.\\n(C) The wrong assumption: format as the skew lever. Delta organizes files and transactions; join key skew is about DATA DISTRIBUTION, not file format.\\n(D) The wrong assumption: indexes as Spark's brake. Spark does NOT use B-tree indexes (there are none); its accelerators are Delta pruning and the join's broadcast.\\n\\nExam cue: A few slow tasks among thousands = key skew: broadcast the small dimension or salt the hot keys; more workers does not spread them.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-ck3\"},{\"id\":\"9\",\"question\":\"A nightly batch job and an analyst working INTERACTIVELY both need Spark. The team wants the lowest cost with the simplest operation. Which compute choice?\",\"options\":{\"A\":\"Two dedicated standard clusters, one for the job and one interactive, both auto-scaling\",\"B\":\"Serverless compute for both: the nightly job runs without a standby cluster (pay-per-use) and the analyst gets seconds-fast startup with zero infrastructure management\",\"C\":\"One shared classic cluster and a large SQL warehouse for the analyst\",\"D\":\"One GPU cluster for both: extra capacity avoids idle time\"},\"correct\":\"B\",\"explanation\":\"It wins because it serves BOTH needs: batch billed per use (no idle cluster) and instant analyst startup, with zero cluster admin — the cost and simplicity they asked for.\\n\\nWhy the others fail:\\n(A) The wrong assumption: dedicated clusters as simplification. Two standard clusters bill even unused and demand maintaining both; serverless exists for exactly this case.\\n(C) The wrong assumption: sharing as simplicity. A large SQL warehouse would bill steadily for the analyst, and a shared classic cluster would run batch and interactive against each other in queues.\\n(D) The wrong assumption: GPUs as a general accelerator. GPUs are for TRAINING or model inference; an ETL job and a SQL analyst never touch it and pay a prohibitive price.\\n\\nExam cue: Batch + interactive = serverless: pay-per-use, instant startup, zero infrastructure to manage.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck4\"},{\"id\":\"10\",\"question\":\"The operations team needs a daily report: which jobs failed, how long queries took, and who read which table. Which Unity Catalog (or Lakeflow) product surfaces all three at once?\",\"options\":{\"A\":\"Lineage + audit logs + query history: three tabs, three sources, assembled by a custom pipeline\",\"B\":\"Lakeflow/system tables of Unity Catalog (system.lakeflow, system.query.history, etc.): query-ready tables a daily job can export into the report\",\"C\":\"Model serving: endpoint monitoring covers the ask\",\"D\":\"A custom pipeline with try/except writing logs to a bucket\"},\"correct\":\"B\",\"explanation\":\"It wins because system tables are EXACTLY that: the structured record of jobs, query performance and access; the report is a daily SELECT, not a new pipeline.\\n\\nWhy the others fail:\\n(A) The wrong assumption: assembling the report by hand from three APIs. It works but is perpetual maintenance; the product already ships the monitoring surface.\\n(C) The wrong assumption: model monitoring as platform monitoring. Model serving watches ML endpoints; jobs, query history and data access live in system tables.\\n(D) The wrong assumption: writing the logs themselves. System tables already record everything with a stable schema; a logging pipeline duplicates work and adds failure points.\\n\\nExam cue: For platform observability, system tables are the SELECT already written: job runs, query history, and access audit.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck5\"}]}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\
