esita garantizar que los datos crudos de clientes nunca salgan de su propia cuenta cloud, pero quiere que Databricks siga gestionando los notebooks, la planificación de jobs y la configuración de clústeres. ¿Qué describe cómo la arquitectura de Databricks lo permite?\",\"options\":{\"A\":\"Todos los datos se copian al control plane de Databricks para que los clústeres arranquen más rápido\",\"B\":\"El control plane gestiona metadatos del workspace y la orquestación, mientras los datos se quedan en la cuenta cloud del cliente, en el data plane\",\"C\":\"El data plane guarda los notebooks y la definición de clústeres, y el control plane guarda las tablas Delta\",\"D\":\"La localización del dato no se puede garantizar, así que un private link es la única forma de mantenerlo en la cuenta\"},\"correct\":\"B\",\"explanation\":\"Databricks separa responsabilidades: el control plane (gestionado por Databricks) guarda los metadatos del workspace — notebooks, definiciones de jobs, configuración de clústeres, metadatos de Unity Catalog — y el data plane corre en la cuenta cloud del cliente, donde los clústeres leen y escriben los datos reales en el almacenamiento de esa nube. Por eso los datos crudos no tienen que salir de la cuenta.\\n\\nPor qué fallan las otras: (A) es el error clásico — copiar los datos al control plane rompería todo el modelo de seguridad y no funciona así. (C) invierte los dos planos. (D) el private link mejora el aislamiento de red, pero no es lo que garantiza la residencia del dato; lo hace la separación de planos.\\n\\nPista de examen: «los datos deben quedarse en nuestra cuenta» + «Databricks sigue orquestando» → separación control plane / data plane.\"},{\"id\":\"2\",\"question\":\"Un pipeline ingiere miles de ficheros JSON al día desde cloud storage a una tabla Delta. A veces los ficheros nuevos añaden campos y el pipeline no debe fallar cuando ocurre. ¿Qué enfoque de ingesta gestiona la evolución del esquema con el menor esfuerzo operativo?\",\"options\":{\"A\":\"COPY INTO con esquema fijo y un ALTER TABLE manual por cada campo nuevo\",\"B\":\"Un notebook programado que lee cada fichero con pandas y añade filas\",\"C\":\"Auto Loader (cloudFiles) con evolución de esquema activada y checkpoint en cada ejecución\",\"D\":\"Una query en streaming con esquema fijo que descarta las columnas desconocidas\"},\"correct\":\"C\",\"explanation\":\"Auto Loader (formato cloudFiles) es el camino gestionado de ingesta incremental: descubre ficheros nuevos sin reprocesar los antiguos y, con la evolución de esquema activada, añade las columnas nuevas a la tabla destino en vez de fallar el lote. El checkpoint registra qué ficheros ya se procesaron, así que un reinicio continúa de forma incremental.\\n\\nPor qué fallan las otras: (A) COPY INTO sí puede ingerir de forma incremental, pero esquema fijo más ALTER TABLE manual por campo es justo la carga operativa que el enunciado descarta. (B) pandas en un notebook no es incremental ni escalable y pierde las garantías de Delta. (D) fijar el esquema y descartar columnas tira datos en silencio.\\n\\nPista de examen: «campos nuevos» + «no debe fallar» + «mínimo esfuerzo operativo» → Auto Loader con evolución de esquema.\"},{\"id\":\"3\",\"question\":\"Un equipo ingiere unas 50 ficheros nuevos por hora en una tabla Delta y quiere el descubrimiento de ficheros de menor latencia y más escalable que ofrece Auto Loader. Su almacenamiento cloud puede publicar notificaciones de eventos. ¿Qué debe configurar?\",\"options\":{\"A\":\"Directory listing con un trigger cada 5 minutos\",\"B\":\"Un refresh completo de la tabla en cada ejecución\",\"C\":\"COPY INTO dentro de un bucle for-each sobre el prefijo del bucket\",\"D\":\"Modo de notificación de ficheros, con la cola y los permisos IAM necesarios creados por Databricks\"},\"correct\":\"D\",\"explanation\":\"Auto Loader tiene dos modos de descubrimiento. El modo de notificación se suscribe a los eventos del almacenamiento (S3 → SQS/SNS, ADLS → Event Grid, GCS → Pub/Sub) y reacciona a los ficheros nuevos según llegan; escala mejor y cuesta menos por fichero porque no lista el directorio una y otra vez. Databricks puede crear la cola y el rol IAM por ti al activarlo.\\n\\nPor qué fallan las otras: (A) el listado de directorio funciona y no necesita permisos extra, pero lista el prefijo en cada intervalo: detecta más tarde y es más caro cuanto más crece el número de ficheros. (B) un refresh completo reprocesa todo y anula la ingesta incremental. (C) lanzar COPY INTO por prefijo es orquestación manual y sigue dependiendo del listado.\\n\\nPista de examen: «menor latencia» + «el storage puede publicar eventos» → modo notificación; «sin permisos extra / lo más simple» → listado de directorio.\"},{\"id\":\"4\",\"question\":\"Un equipo debe cargar una vez 200 ficheros CSV en una tabla Delta y después ir añadiendo unos pocos ficheros al día. Quieren la opción más simple que siga siendo incremental tras la carga inicial. ¿Qué usan?\",\"options\":{\"A\":\"COPY INTO para la carga inicial, que además puede re-ejecutarse de forma incremental para recoger los ficheros nuevos\",\"B\":\"Auto Loader con evolución de esquema y una cola de notificaciones\",\"C\":\"Un CREATE TABLE AS SELECT puntual sobre toda la carpeta\",\"D\":\"Una tabla externa que lee los CSV en su sitio para siempre\"},\"correct\":\"A\",\"explanation\":\"COPY INTO es la vía SQL para cargar ficheros de forma idempotente en una tabla Delta: recuerda qué ficheros ya cargó, así que re-ejecutarlo solo ingiere los nuevos. Para una carga masiva puntual más unos pocos ficheros diarios es la menor maquinaria posible: sin gestionar checkpoints ni mantener viva una query en streaming.\\n\\nPor qué fallan las otras: (B) Auto Loader es la respuesta cuando los ficheros llegan de forma continua, en gran número, o necesitan evolución de esquema y baja latencia; aquí añade una cola y estado de streaming sin apenas beneficio. (C) CTAS es una foto fija: los ficheros nuevos no se recogerían nunca. (D) una tabla externa no ingiere: lee los ficheros en cada consulta y pierde rendimiento y features de Delta.\\n\\nPista de examen: «cargar una vez y luego pocos ficheros al día» + «lo más simple» → COPY INTO. «Miles de ficheros / continuo / evolución de esquema» → Auto Loader.\"},{\"id\":\"5\",\"question\":\"Al ingerir ficheros JSON con Auto Loader, algunos registros traen un campo cuyo tipo no coincide con el esquema inferido. El equipo no quiere que la carga falle, pero tampoco puede perder esos registros. ¿Qué ofrece Auto Loader para este caso?\",\"options\":{\"A\":\"Descarta los registros problemáticos en silencio y reporta el conteo en el checkpoint\",\"B\":\"Aborta el stream y exige un ALTER TABLE manual antes de reiniciar\",\"C\":\"Conserva el registro y guarda los campos no parseados o con tipo distinto en la columna `_rescued_data`\",\"D\":\"Convierte a STRING todos los valores que no encajan y sobrescribe la columna original\"},\"correct\":\"C\",\"explanation\":\"Auto Loader nunca tira un registro por un problema de tipo. Cuando un campo no se puede parsear al tipo esperado (o no está en el esquema), guarda el payload original de los campos rescatados en la columna `_rescued_data`, de modo que puedas inspeccionarlo, ponerlo en cuarentena o reprocesarlo después. Es el mecanismo de rescate integrado.\\n\\nPor qué fallan las otras: (A) Auto Loader no descarta registros — perder datos en silencio es justo lo que `_rescued_data` evita. (B) un desajuste de tipo no aborta el stream; solo lo haría un error irrecuperable. (D) no sobrescribe la columna con un cast: la columna parseada conserva su valor y el valor crudo queda al lado.\\n\\nPista de examen: «no debe fallar» + «no podemos perder registros» + Auto Loader → `_rescued_data`.\"},{\"id\":\"6\",\"question\":\"Un job de ingesta en streaming debe ejecutarse cada 10 minutos desde un job programado, procesar solo los ficheros que llegaron desde la ejecución anterior y luego parar, en vez de correr de forma continua. ¿Qué configuración de trigger usas?\",\"options\":{\"A\":\"Trigger.AvailableNow dentro de un job que corre de forma continua\",\"B\":\"Trigger.AvailableNow (o Once) con el job programado terminando al acabar el lote\",\"C\":\"Un clúster continuo con auto-scaling y sin trigger\",\"D\":\"Trigger.ProcessingTime(\\\"10 minutes\\\") sobre un clúster continuo\"},\"correct\":\"B\",\"explanation\":\"`Trigger.AvailableNow` procesa todos los datos disponibles en el momento en que arranca la query —como un batch acotado— y luego termina. Combinado con un job programado (cada 10 minutos) da procesamiento incremental sin pagar un clúster encendido 24/7. `Trigger.Once` es el equivalente antiguo para este patrón.\\n\\nPor qué fallan las otras: (A) AvailableNow dentro de un job continuo anula el propósito: la gracia es que la ejecución acabe. (C) un clúster continuo sin trigger es lo contrario: siempre encendido y siempre pagando. (D) ProcessingTime es para streaming continuo con micro-lotes; mantiene la query viva.\\n\\nPista de examen: «procesa solo los ficheros nuevos y luego para» + «job programado» → AvailableNow/Once, no un stream continuo.\"},{\"id\":\"7\",\"question\":\"Cada noche llega un lote con el estado completo y actual de los productos, incluyendo modificaciones y productos nuevos, pero sin borrados. La tabla Delta destino ya tiene las filas de ayer. ¿Qué sentencia carga el fichero de hoy correctamente sin duplicar los productos que ya existen?\",\"options\":{\"A\":\"INSERT INTO target SELECT * FROM staging\",\"B\":\"INSERT OVERWRITE target SELECT * FROM staging\",\"C\":\"MERGE INTO target USING staging ON target.id = staging.id WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *\",\"D\":\"DELETE FROM target y después INSERT INTO target SELECT * FROM staging\"},\"correct\":\"C\",\"explanation\":\"MERGE INTO es la primitiva de upsert en Delta Lake: la cláusula ON decide qué filas del staging coinciden con filas existentes, WHEN MATCHED las actualiza y WHEN NOT MATCHED inserta las nuevas. Una sola pasada, ACID, y sin duplicados para los productos que ya estaban.\\n\\nPor qué fallan las otras: (A) INSERT a secas añade todo, así que cada producto aparece dos veces. (B) INSERT OVERWRITE reemplaza la tabla entera por el fichero de hoy: solo sería correcto si el fichero es de verdad el estado completo y aceptas perder historial y particiones; no es un upsert y no es seguro con extracciones parciales. (D) borrar y luego insertar deja la tabla vacía para los lectores durante la operación y rompe la concurrencia.\\n\\nPista de examen: «estado completo con modificaciones y filas nuevas» + «sin duplicados» → MERGE INTO. «Solo filas nuevas, nunca vistas» → append/INSERT.\"},{\"id\":\"8\",\"question\":\"Una tabla Delta de 500 TB se filtra casi siempre por customer_id y por event_date. El equipo está cansado de elegir entre particionar y usar Z-ORDER y quiere que Databricks elija y mantenga el layout automáticamente, sin reescribir la tabla. ¿Qué activan?\",\"options\":{\"A\":\"Particionar por event_date y hacer Z-ORDER BY customer_id en cada escritura\",\"B\":\"Liquid clustering por customer_id y event_date\",\"C\":\"OPTIMIZE con Z-ORDER BY customer_id una vez a la semana y eliminar las particiones\",\"D\":\"Bucketing por customer_id con 200 buckets\"},\"correct\":\"B\",\"explanation\":\"Liquid clustering sustituye la decisión partición/Z-ORDER: declaras las claves de clustering en la tabla y Databricks organiza los datos de forma incremental, sin reescribir los ficheros existentes cuando cambian las claves. En una tabla enorme con dos columnas de filtro independientes evita el problema de sobre-particionar (millones de ficheros diminutos) que crea particionar por fecha.\\n\\nPor qué fallan las otras: (A) hacer Z-ORDER en cada escritura es caro y particionar por fecha puede multiplicar el número de ficheros. (C) el Z-ORDER semanal es un mantenimiento manual y quitar las particiones pierde el pruning por fecha. (D) el bucketing es una técnica de la época Hive que Delta no necesita y que hay que gestionar a mano.\\n\\nPista de examen: «quiere que Databricks elija y mantenga el layout» + «sin reescribir» → liquid clustering. «Tabla heredada, ajuste manual» → Z-ORDER.\"},{\"id\":\"9\",\"question\":\"Un auditor necesita consultar la tabla Delta tal como estaba hace 30 días. El equipo ejecuta VACUUM a diario con la configuración por defecto. ¿Qué pasa con ese requisito?\",\"options\":{\"A\":\"Falla: la retención por defecto es de 7 días, así que las versiones más antiguas se borran físicamente aunque el time travel siga funcionando dentro de esa ventana\",\"B\":\"Funciona, porque VACUUM solo elimina ficheros que ninguna query está leyendo en ese momento\",\"C\":\"Funciona, porque Delta guarda una copia completa de cada versión durante un año por defecto\",\"D\":\"Falla solo si la tabla se escribió con INSERT OVERWRITE\"},\"correct\":\"A\",\"explanation\":\"El time travel está limitado por la retención. VACUUM borra físicamente los ficheros que ya no referencia nadie, y el umbral de retención por defecto es de 7 días. Con un VACUUM diario y valores por defecto, cualquier versión de hace más de siete días ya no existe: `VERSION AS OF` / `TIMESTAMP AS OF` dará error porque los ficheros subyacentes no están. Para conservar 30 días hay que subir `delta.deletedFileRetentionDuration` (o la cláusula `RETAIN N HOURS`) por encima de la ventana de auditoría, y aceptar el coste de almacenamiento.\\n\\nPor qué fallan las otras: (B) VACUUM elimina ficheros no referenciados sin importar quién esté leyendo; su seguridad depende de la ventana de retención, no de queries vivas. (C) no existe una copia de un año por defecto — ese es justo el error que la pregunta quiere detectar. (D) el mecanismo es el mismo para cualquier escritura que deje versiones antiguas.\\n\\nPista de examen: «time travel de hace más de X días» + «VACUUM» → revisa la retención (7 días por defecto).\"},{\"id\":\"10\",\"question\":\"En un pipeline declarativo de Lakeflow, un dataset debe procesar de forma incremental solo las filas nuevas que llegan de una fuente en streaming, y otro debe recalcular una agregación completa sobre todo el historial en cada ejecución. ¿Qué combinación es correcta?\",\"options\":{\"A\":\"Los dos como vistas materializadas, porque siempre recalculan desde el origen\",\"B\":\"Los dos como tablas en streaming, porque el streaming siempre es más eficiente\",\"C\":\"El primero como vista materializada y el segundo como tabla en streaming\",\"D\":\"El primero como tabla en streaming y el segundo como vista materializada\"},\"correct\":\"D\",\"explanation\":\"Una tabla en streaming es incremental: consume cada fila una vez y solo procesa datos nuevos, que es lo que necesita una capa de ingesta. Una vista materializada reevalúa su consulta sobre todos los datos subyacentes en cada refresco, que es lo que necesita una agregación completa sobre el historial (y lo que la mantiene correcta cuando cambian filas antiguas).\\n\\nPor qué fallan las otras: (A) dos vistas materializadas reprocesarían todo el historial cada vez: caro e innecesario para el feed incremental. (B) las tablas en streaming no pueden recalcular una agregación completa de forma correcta cuando las filas de origen se actualizan o borran; están orientadas a append. (C) es exactamente lo contrario.\\n\\nPista de examen: «solo filas nuevas, incremental» → tabla en streaming; «agregación completa sobre todos los datos en cada ejecución» → vista materializada.\"},{\"id\":\"11\",\"question\":\"Un pipeline declarativo debe garantizar que ningún pedido con total negativo llega a la tabla gold. Las filas inválidas deben descartarse y contarse, pero el pipeline no debe detenerse y las métricas tienen que ser visibles. ¿Qué define el equipo?\",\"options\":{\"A\":\"Un filtro WHERE en la consulta gold, sin métrica alguna\",\"B\":\"Una expectation sobre el dataset que descarta las filas que la incumplen y registra las métricas de violación\",\"C\":\"Un try/except en un notebook que escribe los errores en una tabla de log\",\"D\":\"Un reintento a nivel de job con notificación en caso de fallo\"},\"correct\":\"B\",\"explanation\":\"Las expectations son el mecanismo declarativo de calidad de datos: asocias una regla a un dataset (`EXPECT ...`) y eliges el comportamiento ante la violación. Con acción DROP el pipeline sigue corriendo, descarta las filas infractoras y publica métricas por regla (pasadas/falladas/descartadas) que puedes monitorizar. Poner la acción en fail detendría el pipeline, que es lo contrario de lo que pide el enunciado.\\n\\nPor qué fallan las otras: (A) un filtro WHERE descarta filas pero no te da visibilidad de cuántas ni por qué. (C) el try/except manual es código imperativo que el pipeline no puede gobernar como regla de calidad y no produce las métricas estándar. (D) un reintento vuelve a procesar los mismos datos malos; nunca corrige la violación.\\n\\nPista de examen: «debe seguir corriendo» + «métricas visibles» → expectation con acción DROP (o warn), no fail.\"},{\"id\":\"12\",\"question\":\"Un equipo aguas abajo necesita leer solo las filas que cambiaron en una tabla Delta (inserts, updates y deletes) en vez de reescanear la tabla completa cada noche. ¿Qué hay que activar en la tabla origen?\",\"options\":{\"A\":\"Liquid clustering sobre la clave primaria\",\"B\":\"Una vista materializada que se refresca cada noche\",\"C\":\"Change Data Feed y leer con table_changes() / readChangeFeed\",\"D\":\"Time travel con VERSION AS OF entre las dos noches\"},\"correct\":\"C\",\"explanation\":\"Change Data Feed (CDF) registra los cambios a nivel de fila con un `_change_type` (insert, update_preimage, update_postimage, delete) y la versión del commit, así que los consumidores leen solo el delta entre dos versiones en lugar de la tabla entera. Se activa con `delta.enableChangeDataFeed = true` en la tabla.\\n\\nPor qué fallan las otras: (A) el clustering es un layout para rendimiento de consulta, no expone cambios. (B) una vista materializada recalcula y reescribe el resultado; no da un flujo de cambios. (D) el time travel puede comparar dos snapshots, pero te obliga a escanear las dos versiones completas y calcular la diferencia tú mismo; CDF es el mecanismo pensado para esto.\\n\\nPista de examen: «solo las filas que cambiaron» + «inserts, updates y deletes» → Change Data Feed.\"},{\"id\":\"13\",\"question\":\"Una query en streaming lee de una fuente que puede entregar el mismo evento dos veces y la tabla destino debe tener exactamente una fila por event_id. ¿Qué enfoque lo resuelve correctamente a lo largo del tiempo?\",\"options\":{\"A\":\"Deduplicar con un watermark sobre el timestamp del evento y dropDuplicates por event_id\",\"B\":\"Un SELECT DISTINCT sobre toda la tabla al final del pipeline\",\"C\":\"Un MERGE INTO en cada micro-lote sin condición de clave\",\"D\":\"OPTIMIZE con Z-ORDER por event_id después de cada lote\"},\"correct\":\"A\",\"explanation\":\"Los eventos duplicados llegan dentro de una ventana acotada de su event time, así que el patrón correcto en streaming es un watermark sobre el timestamp del evento más `dropDuplicates(\\\"event_id\\\")`: Spark mantiene estado solo para la ventana del watermark (memoria acotada) y descarta las repeticiones dentro de ella. Es el patrón estándar para fuentes con entrega at-least-once.\\n\\nPor qué fallan las otras: (B) DISTINCT esconde duplicados en esa consulta pero no hace nada por la tabla y no se puede mantener de forma incremental. (C) un MERGE sin condición de clave en el ON no es válido; con clave funcionaría, pero es mucho más caro por micro-lote que la deduplicación con estado. (D) Z-ORDER cambia el layout de ficheros, nunca la unicidad de filas.\\n\\nPista de examen: «duplicados» + «streaming» + «una fila por clave» → watermark + dropDuplicates por la clave.\"},{\"id\":\"14\",\"question\":\"Un job de Lakeflow tiene 12 tareas: ingesta, luego tres tareas de limpieza en paralelo, luego un join y por último publish. A mitad de ejecución solo falla publish por un error transitorio de permisos que ya está corregido. ¿Cuál es la forma más barata y correcta de terminar la ejecución?\",\"options\":{\"A\":\"Re-ejecutar el job completo para que todas las tareas empiecen de cero\",\"B\":\"Reparar la ejecución, que re-ejecuta solo la tarea fallida y sus dependencias aguas abajo\",\"C\":\"Crear un job puntual que contenga solo la tarea publish\",\"D\":\"Borrar la ejecución y volver a programarla para el día siguiente\"},\"correct\":\"B\",\"explanation\":\"Lakeflow Jobs guarda el estado de cada tarea por ejecución. «Repair run» re-ejecuta la tarea fallida y solo lo que depende de ella, reutilizando las salidas correctas del resto — tú eliges qué tareas reparar. Es el camino de recuperación diseñado para un DAG parcialmente fallido y el más barato en cómputo.\\n\\nPor qué fallan las otras: (A) una re-ejecución completa recalcula todas las tareas, incluida la ingesta cara, sin ningún beneficio. (C) un job puntual pierde el linaje y los parámetros de la ejecución original y duplica la lógica de orquestación. (D) borrar la ejecución destruye el historial y retrasa el resultado de negocio un día.\\n\\nPista de examen: «solo falló una tarea» + «lo más barato» → repair run, no re-run.\"},{\"id\":\"15\",\"question\":\"Un job nocturno y un analista que trabaja de forma interactiva necesitan cómputo Spark. El equipo quiere minimizar el coste y evitar que una carga deje sin recursos a la otra. ¿Qué elección de cómputo es la recomendada?\",\"options\":{\"A\":\"Un clúster all-purpose grande compartido por el job y el analista\",\"B\":\"Un único clúster all-purpose con autoscaling y sin aislamiento\",\"C\":\"Un job cluster para el job nocturno y otro all-purpose separado para el analista\",\"D\":\"Un SQL warehouse para ambos, porque siempre es más barato\"},\"correct\":\"C\",\"explanation\":\"Los job clusters se crean para la ejecución del job y se apagan al terminar, así que pagas solo la duración del job y la carga queda totalmente aislada. Los all-purpose clusters son para trabajo interactivo y siguen vivos (hasta el timeout de inactividad), que es el sitio correcto para un analista pero un desperdicio para un batch. Separarlos da control de coste y aislamiento.\\n\\nPor qué fallan las otras: (A) y (B) comparten clúster, así que el analista compite por recursos con el batch y el clúster tiene que estar encendido todo el día para un job de 40 minutos. (D) un SQL warehouse ejecuta SQL, no notebooks arbitrarios de Spark/Python, y no es siempre más barato.\\n\\nPista de examen: «minimizar coste» + «evitar que se estorben» + job programado → job cluster; trabajo interactivo → all-purpose.\"},{\"id\":\"16\",\"question\":\"Un equipo mantiene rutas de notebooks, IDs de clúster y nombres de catálogo hard-codeados por entorno, y cada promoción a producción es una edición manual. Quieren desplegar los mismos artefactos de forma idéntica en dev, staging y prod. ¿Qué deberían adoptar?\",\"options\":{\"A\":\"Exportar los notebooks como .ipynb y copiarlos a cada workspace a mano\",\"B\":\"Una rama de Git por entorno y recrear los jobs manualmente\",\"C\":\"Un script de shell que llama a la API REST con IDs hard-codeados\",\"D\":\"Declarative Automation Bundles (antes Databricks Asset Bundles), con variables por target y databricks bundle deploy -t \u003ctarget\u003e\"},\"correct\":\"D\",\"explanation\":\"Declarative Automation Bundles (DAB, antes Databricks Asset Bundles) describen jobs, pipelines, notebooks y su configuración en YAML versionado, con targets (dev/staging/prod) que aportan las variables específicas de entorno: host del workspace, catálogo o tamaño de clúster. `databricks bundle deploy -t prod` valida y despliega la misma definición, así que no se edita nada a mano entre entornos.\\n\\nPor qué fallan las otras: (A) copiar a mano es justo el problema de deriva que se quiere resolver. (B) las ramas por sí solas no parametrizan IDs ni catálogos y siguen exigiendo crear jobs a mano. (C) un script REST con IDs hard-codeados es la misma fragilidad en forma de código — sin validación, sin diff y sin idempotencia.\\n\\nPista de examen: «los mismos artefactos en todos los entornos» + «sin ediciones manuales» → Declarative Automation Bundles con targets.\"},{\"id\":\"17\",\"question\":\"Un analista nuevo debe poder leer un esquema de Unity Catalog y nada más del metastore. ¿Cuál es el grant correcto?\",\"options\":{\"A\":\"GRANT USE CATALOG ON CATALOG main TO `analysts`; GRANT USE SCHEMA ON SCHEMA main.sales TO `analysts`; GRANT SELECT ON SCHEMA main.sales TO `analysts`\",\"B\":\"GRANT ALL PRIVILEGES ON METASTORE TO `analysts`\",\"C\":\"Solo GRANT SELECT ON TABLE main.sales.orders TO `analysts`\",\"D\":\"Añadir al analista al grupo de workspace admins para que lo vea todo\"},\"correct\":\"A\",\"explanation\":\"Los privilegios de Unity Catalog son jerárquicos y hay que conceder cada nivel: USE CATALOG para ver el catálogo, USE SCHEMA para ver el esquema y después el privilegio de datos (SELECT) sobre el esquema o la tabla. Conceder USE + SELECT sobre el esquema da lectura a todas las tablas actuales y futuras de ese esquema sin exponer el resto del metastore.\\n\\nPor qué fallan las otras: (B) privilegios a nivel de metastore violan el mínimo privilegio y exponen todos los catálogos. (C) conceder sobre una sola tabla sirve solo para esa tabla — las tablas nuevas del esquema quedarían ilegibles, que no es lo que significa «leer el esquema». (D) workspace admin es un rol operativo que se salta el gobierno del dato; es lo contrario del mínimo privilegio.\\n\\nPista de examen: «leer un esquema y nada más» → USE CATALOG + USE SCHEMA + SELECT sobre ese esquema.\"},{\"id\":\"18\",\"question\":\"El equipo de seguridad exige que los agentes de soporte puedan consultar una tabla de clientes pero solo vean filas de su propia región, y que nunca vean la columna email en claro. ¿Qué hay que implementar en Unity Catalog?\",\"options\":{\"A\":\"Dos tablas separadas, una por región, y una vista sin la columna email\",\"B\":\"Una función de row filter que use la región del usuario actual, más un column mask sobre la columna email\",\"C\":\"Una vista dinámica que todos los agentes consulten en lugar de la tabla, sin grants sobre la tabla\",\"D\":\"Privilegios SELECT solo sobre un subconjunto de columnas y un WHERE que los agentes deben recordar\"},\"correct\":\"B\",\"explanation\":\"Unity Catalog soporta row filters y column masks de forma nativa, y se aplican a nivel de tabla, así que cubren todas las rutas de consulta: el row filter limita las filas visibles por principal y el column mask devuelve un valor enmascarado (un hash o `***`) a quien no tiene el privilegio de desenmascarar. Como las reglas viven en la tabla, también aplican a dashboards, notebooks y herramientas de BI, no solo al SQL escrito a mano.\\n\\nPor qué fallan las otras: (A) duplicar tablas por región genera deriva y no enmascara la columna. (C) una vista ayuda, pero depende de que todos la usen, y sin grants sobre la tabla es un diseño todo-o-nada en vez de seguridad a nivel de fila. (D) el SELECT por columna no filtra filas, y un WHERE que cada usuario debe recordar no es una imposición.\\n\\nPista de examen: «solo su propia región» + «nunca ver el email» → row filter + column mask.\"},{\"id\":\"19\",\"question\":\"Un job de Spark que hace join de una tabla de hechos de 2 TB con una dimensión de 40 GB tarda horas: la mayoría de las tareas acaban rápido y unas pocas no terminan nunca, y el Spark UI muestra una lectura de shuffle enorme en esas tareas. ¿Cuál es la causa más probable y el primer arreglo?\",\"options\":{\"A\":\"Faltan executors: subir el tamaño del clúster y añadir más cores\",\"B\":\"Hay que hacer VACUUM en la tabla Delta antes del join\",\"C\":\"Skew en la clave del join: inspeccionar la distribución de la clave y aplicar salting o broadcast según el caso\",\"D\":\"Photon está desactivado: activarlo y re-ejecutar\"},\"correct\":\"C\",\"explanation\":\"La firma es de manual: unas pocas tareas hacen lecturas de shuffle enormes mientras el resto acaba al instante. Unos pocos valores de la clave del join concentran casi todas las filas, así que esas particiones no se pueden repartir entre executors. El primer paso es medir la distribución de la clave (`GROUP BY clave ORDER BY COUNT(*) DESC`); después, hacer broadcast del lado pequeño si cabe, o aplicar salting a las claves calientes para repartir el trabajo.\\n\\nPor qué fallan las otras: (A) añadir executors no divide una partición caliente — las tareas largas siguen largas. (B) VACUUM es mantenimiento de ficheros antiguos y no afecta al shuffle. (D) Photon acelera la ejecución en general pero no redistribuye particiones sesgadas.\\n\\nPista de examen: «la mayoría acaba rápido, unas pocas tardan muchísimo» + «shuffle enorme» → skew.\"},{\"id\":\"20\",\"question\":\"Un equipo de operaciones necesita un informe diario de qué jobs fallaron, cuánto tardaron las queries y quién accedió a cada tabla, todo consultable con SQL y con retención más allá de la UI del workspace. ¿Cuál es la fuente correcta?\",\"options\":{\"A\":\"El Spark UI, abierto por clúster y capturado en un ticket\",\"B\":\"Los logs de clúster enviados a cloud storage y parseados con un script propio\",\"C\":\"La página de historial de ejecuciones del job en el workspace\",\"D\":\"Las system tables (query history, job runs, audit logs) consultadas con SQL\"},\"correct\":\"D\",\"explanation\":\"Las system tables exponen los metadatos operativos como tablas Delta que puedes unir y consultar con SQL, con retención más allá de la que guarda la UI: historial de queries, historial de ejecuciones de jobs y audit logs (quién accedió a qué objeto), entre otros. Eso permite dashboards, alertas y reporting entre workspaces sin exportar nada.\\n\\nPor qué fallan las otras: (A) el Spark UI es por clúster, efímero y no consultable — inútil para un informe diario. (B) el envío de logs sirve para diagnóstico (logs de driver/executor), no para auditar accesos, y te obliga a construir el parser. (C) la página de historial es una vista de UI con retención limitada y sin acceso SQL.\\n\\nPista de examen: «consultable con SQL» + «retención más allá de la UI» + «quién accedió a qué» → system tables.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
