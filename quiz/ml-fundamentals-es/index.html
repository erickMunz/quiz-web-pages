o que prediga el resultado de solicitudes nuevas. ¿Qué tipo de aprendizaje automático encaja con este problema?\",\"options\":{\"A\":\"Aprendizaje no supervisado, porque el modelo tiene que descubrir patrones por sí solo\",\"B\":\"Aprendizaje supervisado, porque cada ejemplo histórico tiene una etiqueta conocida\",\"C\":\"Aprendizaje por refuerzo, porque el modelo recibe una recompensa por cada préstamo acertado\",\"D\":\"Clustering, porque las solicitudes deben agruparse en pagadas e impagas\"},\"correct\":\"B\",\"explanation\":\"El aprendizaje supervisado aprende a relacionar entradas con un objetivo conocido usando ejemplos etiquetados. Aquí cada solicitud histórica tiene su etiqueta (pagado o impago), así que el modelo aprende de esas respuestas y predice la etiqueta de solicitudes nuevas.\"},{\"id\":\"2\",\"question\":\"Una inmobiliaria quiere predecir el precio de venta, en dólares, de casas a partir de su tamaño, ubicación y antigüedad. ¿Qué tipo de tarea supervisada es?\",\"options\":{\"A\":\"Clasificación binaria\",\"B\":\"Clasificación multiclase\",\"C\":\"Regresión\",\"D\":\"Clustering\"},\"correct\":\"C\",\"explanation\":\"La regresión predice un valor numérico continuo, como un precio en dólares. La clasificación predice una categoría discreta, como 'barata' o 'cara'. Como el objetivo es un número que puede tomar cualquier valor en un rango, es una tarea de regresión.\"},{\"id\":\"3\",\"question\":\"Un equipo construye un agente que aprende a jugar un videojuego. El agente prueba acciones, gana puntos cuando avanza y pierde puntos cuando falla, y poco a poco mejora su estrategia. ¿Qué paradigma de aprendizaje es?\",\"options\":{\"A\":\"Aprendizaje supervisado\",\"B\":\"Aprendizaje no supervisado\",\"C\":\"Aprendizaje semisupervisado\",\"D\":\"Aprendizaje por refuerzo\"},\"correct\":\"D\",\"explanation\":\"En el aprendizaje por refuerzo un agente interactúa con un entorno, toma acciones y recibe recompensas o penalizaciones. Aprende una política que maximiza la recompensa total a lo largo del tiempo. No hay un dataset etiquetado con las acciones correctas; la retroalimentación viene del entorno.\"},{\"id\":\"4\",\"question\":\"Un científico de datos divide un dataset en conjuntos de entrenamiento, validación y prueba (test). ¿Cuál es el propósito principal del conjunto de validación?\",\"options\":{\"A\":\"Comparar modelos y ajustar hiperparámetros sin tocar el conjunto de test\",\"B\":\"Añadir más datos al entrenamiento para mejorar la precisión\",\"C\":\"Reportar a los interesados el rendimiento final del modelo elegido\",\"D\":\"Guardar los ejemplos a los que les falta la etiqueta\"},\"correct\":\"A\",\"explanation\":\"El conjunto de validación se usa durante el desarrollo para comparar modelos y elegir hiperparámetros. El conjunto de test se aparta y se usa una sola vez al final para estimar cómo rendirá el modelo elegido con datos nuevos. Si ajustas usando el test, su puntuación se vuelve optimista y deja de reflejar el rendimiento real.\"},{\"id\":\"5\",\"question\":\"Un modelo que predice reingresos hospitalarios alcanza un 99% de exactitud en validación, pero rinde mal en producción. El equipo descubre que una feature, 'seguimiento_programado_al_alta', solo se rellena después de que el paciente ya reingresó. ¿Qué problema es este?\",\"options\":{\"A\":\"Underfitting (subajuste)\",\"B\":\"Desbalance de clases\",\"C\":\"Fuga de datos (data leakage)\",\"D\":\"Desvanecimiento del gradiente\"},\"correct\":\"C\",\"explanation\":\"La fuga de datos ocurre cuando los datos de entrenamiento contienen información que no estará disponible en el momento de predecir, a menudo derivada del propio objetivo. El modelo aprende a apoyarse en ese atajo, obtiene puntuaciones irreales en validación y falla en producción, donde esa feature falta o es distinta.\"},{\"id\":\"6\",\"question\":\"Un modelo tiene 98% de exactitud en entrenamiento y 71% en validación. Al añadir más épocas de entrenamiento, la exactitud de entrenamiento sube pero la de validación baja. ¿Cuál es el diagnóstico más probable?\",\"options\":{\"A\":\"Underfitting: el modelo es demasiado simple\",\"B\":\"Overfitting: el modelo memoriza los datos de entrenamiento en vez de generalizar\",\"C\":\"La tasa de aprendizaje es demasiado baja\",\"D\":\"El conjunto de validación es demasiado grande\"},\"correct\":\"B\",\"explanation\":\"Una brecha grande entre el rendimiento en entrenamiento y en validación, que crece al seguir entrenando, es la señal clásica de overfitting. El modelo se ajusta al ruido y a detalles propios de los datos de entrenamiento. Remedios típicos: más datos, regularización, un modelo más simple, dropout o early stopping.\"},{\"id\":\"7\",\"question\":\"Un modelo lineal entrenado para predecir el consumo de energía tiene un error alto tanto en entrenamiento como en validación, y ambos errores son muy parecidos. ¿Cuál es el problema más probable y su solución?\",\"options\":{\"A\":\"Underfitting; usar un modelo más expresivo o añadir features más informativas\",\"B\":\"Overfitting; añadir una regularización más fuerte\",\"C\":\"Fuga de datos; quitar las features que usan información futura\",\"D\":\"El conjunto de test es muy pequeño; recolectar más datos de test\"},\"correct\":\"A\",\"explanation\":\"Cuando el error de entrenamiento y el de validación son ambos altos y parecidos, el modelo es demasiado simple para capturar el patrón subyacente. Es underfitting, o sesgo alto. Añadir regularización lo empeoraría; en su lugar, usa un modelo más flexible, crea mejores features o entrena más tiempo.\"},{\"id\":\"8\",\"question\":\"¿Qué afirmación describe mejor el equilibrio sesgo–varianza (bias–variance tradeoff)?\",\"options\":{\"A\":\"Aumentar la complejidad del modelo siempre reduce tanto el sesgo como la varianza\",\"B\":\"El sesgo mide cuánto cambian las predicciones entre conjuntos de entrenamiento, y la varianza mide el error sistemático\",\"C\":\"El sesgo y la varianza se eliminan por completo con suficientes épocas\",\"D\":\"Los modelos simples tienden a tener sesgo alto y varianza baja, y los complejos sesgo bajo y varianza alta\"},\"correct\":\"D\",\"explanation\":\"El sesgo es el error por suposiciones demasiado simples: el modelo falla sistemáticamente el patrón real. La varianza es el error por sensibilidad a los datos de entrenamiento concretos: el modelo cambia mucho si se entrena con otra muestra. Aumentar la complejidad suele bajar el sesgo pero subir la varianza, así que el objetivo es un equilibrio que minimice el error total con datos nuevos.\"},{\"id\":\"9\",\"question\":\"Un modelo lineal se entrena con un dataset de 500 features, muchas de ellas probablemente irrelevantes. El equipo quiere que el modelo lleve automáticamente a exactamente cero los pesos de las features inútiles. ¿Qué regularización debe usar?\",\"options\":{\"A\":\"Regularización L2 (Ridge)\",\"B\":\"Regularización L1 (Lasso)\",\"C\":\"Aumentar la tasa de aprendizaje\",\"D\":\"Eliminar el término de sesgo (bias)\"},\"correct\":\"B\",\"explanation\":\"La regularización L1 suma a la pérdida el valor absoluto de los pesos. Su geometría empuja muchos pesos a exactamente cero, lo que produce un modelo disperso (sparse) que en la práctica selecciona features. La regularización L2 suma los pesos al cuadrado y los encoge hacia cero, pero rara vez los deja exactamente en cero.\"},{\"id\":\"10\",\"question\":\"Durante el entrenamiento de una red neuronal, una técnica pone a cero, al azar, la salida de una fracción de neuronas en cada paso, y usa todas las neuronas en inferencia. ¿Qué técnica es y para qué sirve?\",\"options\":{\"A\":\"Batch normalization, para acelerar la convergencia\",\"B\":\"Pruning (poda), para reducir el modelo antes de desplegarlo\",\"C\":\"Dropout, para reducir el overfitting evitando que las neuronas se coadapten\",\"D\":\"Gradient clipping, para evitar la explosión de gradientes\"},\"correct\":\"C\",\"explanation\":\"Dropout desactiva al azar una fracción de neuronas en cada paso de entrenamiento. La red no puede depender de ninguna neurona en particular, así que aprende representaciones más robustas y redundantes, lo que reduce el overfitting. En inferencia todas las neuronas están activas y las salidas se escalan para que los valores esperados coincidan con el entrenamiento.\"},{\"id\":\"11\",\"question\":\"Un equipo solo tiene 1.200 ejemplos etiquetados. Una única división 80/20 de entrenamiento/validación da puntuaciones muy distintas según la semilla aleatoria. ¿Qué técnica da una estimación más fiable del rendimiento del modelo?\",\"options\":{\"A\":\"Validación cruzada k-fold\",\"B\":\"Entrenar durante más épocas\",\"C\":\"Usar también el conjunto de test como validación\",\"D\":\"Aumentar el tamaño del batch\"},\"correct\":\"A\",\"explanation\":\"En la validación cruzada k-fold los datos se dividen en k partes (folds); el modelo se entrena k veces, cada vez validando con un fold distinto y entrenando con el resto. Se promedian las k puntuaciones, así que cada ejemplo se usa para validar exactamente una vez y la estimación depende mucho menos de una división con suerte o sin ella. Es especialmente valiosa con datasets pequeños.\"},{\"id\":\"12\",\"question\":\"Un dataset para detectar una enfermedad rara tiene un 2% de casos positivos. Tras una división aleatoria en entrenamiento/validación, un fold de validación casi no tiene ejemplos positivos. ¿Qué debería usar el equipo?\",\"options\":{\"A\":\"Una tasa de aprendizaje mayor\",\"B\":\"Una división temporal\",\"C\":\"Quitar los ejemplos positivos de la validación\",\"D\":\"Una división estratificada, para que cada subconjunto mantenga la proporción del 2%\"},\"correct\":\"D\",\"explanation\":\"La división estratificada conserva la proporción de clases en cada subconjunto. Con clases raras, una división puramente aleatoria puede dejar un fold con muy pocos positivos o ninguno, lo que vuelve inestables o indefinidas métricas como el recall. La validación cruzada k-fold estratificada aplica la misma idea a cada fold.\"},{\"id\":\"13\",\"question\":\"En un dataset de fraude, el 99,5% de las transacciones son legítimas. Un modelo que predice 'legítima' para todas las transacciones alcanza un 99,5% de exactitud. ¿Qué demuestra esto?\",\"options\":{\"A\":\"Que el modelo es excelente y está listo para producción\",\"B\":\"Que la exactitud engaña con datos desbalanceados; se necesitan métricas como precision, recall o PR AUC\",\"C\":\"Que el dataset necesita más transacciones legítimas\",\"D\":\"Que la exactitud debe sustituirse por el error cuadrático medio\"},\"correct\":\"B\",\"explanation\":\"Con datos muy desbalanceados, un modelo trivial que siempre predice la clase mayoritaria obtiene una exactitud altísima sin detectar ningún fraude. Es la llamada paradoja de la exactitud. Las métricas centradas en la clase minoritaria, como precision, recall, F1 o el área bajo la curva precision–recall, muestran la utilidad real del modelo.\"},{\"id\":\"14\",\"question\":\"Un filtro de spam mueve correos a la carpeta de spam. Los usuarios se quejan de que se pierden correos importantes en spam. ¿Qué métrica debe priorizar mejorar el equipo para la clase 'spam'?\",\"options\":{\"A\":\"Recall (exhaustividad)\",\"B\":\"La exactitud en el conjunto de entrenamiento\",\"C\":\"Precision (precisión)\",\"D\":\"El error absoluto medio\"},\"correct\":\"C\",\"explanation\":\"La precision mide, de todo lo que el modelo marcó como spam, cuánto era realmente spam: TP / (TP + FP). Los correos importantes enviados a spam son falsos positivos, así que mejorar la precision reduce directamente ese problema. El recall mide cuánto del spam real se detectó, que no es la queja en este caso.\"},{\"id\":\"15\",\"question\":\"Un modelo revisa imágenes médicas para detectar una enfermedad grave pero tratable. No detectar a un paciente enfermo es mucho más costoso que mandar a un paciente sano a una prueba adicional. ¿Qué métrica se debe priorizar?\",\"options\":{\"A\":\"Recall (sensibilidad)\",\"B\":\"Precision\",\"C\":\"Especificidad\",\"D\":\"Exactitud\"},\"correct\":\"A\",\"explanation\":\"El recall mide, de todos los pacientes realmente enfermos, cuántos detectó el modelo: TP / (TP + FN). Cuando los falsos negativos son el error más caro, como no detectar una enfermedad grave, se prioriza el recall, aceptando normalmente más falsos positivos que una prueba posterior puede descartar.\"},{\"id\":\"16\",\"question\":\"Un equipo necesita un único número que equilibre precision y recall en un problema de clasificación desbalanceado, y que sea bajo si cualquiera de los dos es bajo. ¿Qué métrica encaja?\",\"options\":{\"A\":\"Exactitud\",\"B\":\"F1 score\",\"C\":\"La media aritmética de precision y recall\",\"D\":\"R cuadrado\"},\"correct\":\"B\",\"explanation\":\"El F1 score es la media armónica de precision y recall: 2·P·R / (P + R). La media armónica está dominada por el valor más pequeño, así que un modelo con precision 1,0 y recall 0,1 obtiene un F1 de unos 0,18, mientras que una media simple daría 0,55. Por eso F1 es una buena métrica única cuando importan los dos tipos de error.\"},{\"id\":\"17\",\"question\":\"Dos clasificadores binarios devuelven probabilidades. El equipo quiere comparar qué tan bien ordena cada uno los ejemplos positivos por encima de los negativos en todos los umbrales posibles, antes de elegir un umbral. ¿Qué métrica está pensada para esto?\",\"options\":{\"A\":\"La exactitud con umbral 0,5\",\"B\":\"El error cuadrático medio de las probabilidades\",\"C\":\"El número de verdaderos positivos\",\"D\":\"El área bajo la curva ROC (ROC AUC)\"},\"correct\":\"D\",\"explanation\":\"La curva ROC representa la tasa de verdaderos positivos frente a la tasa de falsos positivos para cada umbral. El área bajo ella, ROC AUC, resume el rendimiento en todos los umbrales y equivale a la probabilidad de que el modelo puntúe un positivo al azar por encima de un negativo al azar. Un AUC de 0,5 equivale a adivinar al azar y 1,0 a un orden perfecto.\"},{\"id\":\"18\",\"question\":\"Un modelo de fraude se evalúa con datos en los que solo el 0,1% de las transacciones son fraude. Su ROC AUC es 0,97, pero en la práctica la mayoría de sus alertas son falsas alarmas. ¿Qué métrica reflejaría mejor el rendimiento en la clase rara?\",\"options\":{\"A\":\"Exactitud\",\"B\":\"Especificidad\",\"C\":\"El área bajo la curva precision–recall (PR AUC)\",\"D\":\"El número de verdaderos negativos\"},\"correct\":\"C\",\"explanation\":\"Con un desbalance extremo, la tasa de falsos positivos se mantiene muy baja aunque los falsos positivos superen a los verdaderos positivos, porque el número de negativos es enorme. Por eso el ROC AUC puede verse excelente mientras la precision es mala. La curva precision–recall se centra en la clase positiva, así que el PR AUC (también llamado average precision) deja ver el problema.\"},{\"id\":\"19\",\"question\":\"La matriz de confusión de un clasificador binario muestra: 80 verdaderos positivos, 20 falsos negativos, 30 falsos positivos y 870 verdaderos negativos. ¿Cuáles son su precision y su recall?\",\"options\":{\"A\":\"Precision 0,80, recall 0,73\",\"B\":\"Precision 0,73, recall 0,80\",\"C\":\"Precision 0,95, recall 0,80\",\"D\":\"Precision 0,80, recall 0,97\"},\"correct\":\"B\",\"explanation\":\"Precision = TP / (TP + FP) = 80 / (80 + 30) ≈ 0,73. Recall = TP / (TP + FN) = 80 / (80 + 20) = 0,80. Un error común es intercambiarlas: la precision se refiere a los positivos predichos, y el recall a los positivos reales.\"},{\"id\":\"20\",\"question\":\"Un modelo de tiempo de entrega se evalúa con dos métricas. El equipo ve que el RMSE es mucho mayor que el MAE. ¿Qué indica esto lo más probablemente?\",\"options\":{\"A\":\"Que algunas predicciones tienen errores muy grandes, que el RMSE penaliza más que el MAE\",\"B\":\"Que el modelo está perfectamente calibrado\",\"C\":\"Que el modelo tiene underfitting en todos los ejemplos por igual\",\"D\":\"Que el MAE siempre es mayor que el RMSE, así que las métricas están intercambiadas\"},\"correct\":\"A\",\"explanation\":\"El RMSE eleva los errores al cuadrado antes de promediar, así que los errores grandes pesan mucho más que los pequeños. El MAE promedia los errores absolutos y trata igual cada unidad de error. Cuando el RMSE es mucho mayor que el MAE, unas pocas predicciones tienen errores grandes, como outliers o casos raros que el modelo maneja mal. El RMSE siempre es mayor o igual que el MAE.\"},{\"id\":\"21\",\"question\":\"¿Qué función de pérdida es la elección estándar para entrenar un clasificador binario que devuelve una probabilidad, como la regresión logística?\",\"options\":{\"A\":\"Error cuadrático medio\",\"B\":\"Error absoluto medio\",\"C\":\"Entropía cruzada binaria (log loss)\",\"D\":\"Hinge loss calculada sobre las etiquetas predichas\"},\"correct\":\"C\",\"explanation\":\"La entropía cruzada binaria, también llamada log loss, mide cuán lejos está la probabilidad predicha de la etiqueta real: −[y·log(p) + (1−y)·log(1−p)]. Penaliza mucho las predicciones equivocadas hechas con mucha confianza, como predecir 0,99 cuando la etiqueta real es 0, y funciona bien con el entrenamiento por gradiente de clasificadores probabilísticos.\"},{\"id\":\"22\",\"question\":\"Al entrenar un modelo con descenso por gradiente, la pérdida sube y baja de forma descontrolada y a veces crece hasta infinito en lugar de bajar. ¿Cuál es la causa más probable?\",\"options\":{\"A\":\"El conjunto de entrenamiento es demasiado grande\",\"B\":\"El modelo tiene muy pocos parámetros\",\"C\":\"La tasa de aprendizaje es demasiado pequeña\",\"D\":\"La tasa de aprendizaje es demasiado grande\"},\"correct\":\"D\",\"explanation\":\"La tasa de aprendizaje controla el tamaño de cada paso en la dirección que reduce la pérdida. Si es demasiado grande, los pasos se pasan del mínimo, rebotan de un lado a otro y pueden divergir, haciendo crecer la pérdida. Si es demasiado pequeña, el entrenamiento es estable pero muy lento. Bajar la tasa de aprendizaje, o usar un calendario que la reduzca con el tiempo, suele resolver la divergencia.\"},{\"id\":\"23\",\"question\":\"Un dataset tiene 50 millones de filas. Calcular el gradiente sobre todo el dataset en cada actualización es demasiado lento. ¿Qué enfoque es el estándar para entrenar con datasets grandes?\",\"options\":{\"A\":\"Descenso por gradiente con mini-batches, calculando cada actualización sobre un pequeño subconjunto aleatorio de ejemplos\",\"B\":\"Descenso por gradiente con el lote completo y una tasa de aprendizaje mayor\",\"C\":\"Entrenar solo con las primeras 1.000 filas\",\"D\":\"Sustituir el descenso por gradiente por clustering k-means\"},\"correct\":\"A\",\"explanation\":\"El descenso por gradiente con mini-batches estima el gradiente con un pequeño lote aleatorio (por ejemplo, de 32 a 512 ejemplos) y actualiza los parámetros tras cada lote. Las actualizaciones son mucho más baratas y frecuentes, el ruido de la estimación puede ayudar a salir de regiones malas, y los lotes aprovechan bien el paralelismo de las GPU. Una pasada por todos los lotes se llama época.\"},{\"id\":\"24\",\"question\":\"Un modelo de k vecinos más cercanos (k-NN) usa dos features: ingreso anual (valores de unos 20.000 a 200.000) y número de hijos (valores de 0 a 5). Las predicciones dependen casi por completo del ingreso. ¿Qué paso de preprocesamiento lo arreglaría?\",\"options\":{\"A\":\"Aplicar one-hot encoding a las dos features\",\"B\":\"Escalar las features, por ejemplo con estandarización o normalización min-max\",\"C\":\"Eliminar la feature de número de hijos\",\"D\":\"Usar más vecinos (aumentar k)\"},\"correct\":\"B\",\"explanation\":\"Los modelos basados en distancias, como k-NN, y los entrenados con descenso por gradiente son sensibles a la escala de las features. Una diferencia de 10.000 en el ingreso eclipsa una diferencia de 3 hijos, así que el ingreso domina la distancia. La estandarización (restar la media y dividir entre la desviación estándar) o el escalado min-max ponen las features en rangos comparables. Los modelos basados en árboles casi no se ven afectados por la escala.\"},{\"id\":\"25\",\"question\":\"Una feature 'color' tiene los valores rojo, verde y azul. Un equipo la codifica como rojo = 1, verde = 2, azul = 3 y se la da a un modelo lineal. ¿Por qué es problemático y cuál es la alternativa habitual?\",\"options\":{\"A\":\"No es problemático; los códigos numéricos siempre son preferibles\",\"B\":\"Los modelos lineales no admiten features numéricas; hay que eliminar la columna\",\"C\":\"Los códigos implican un orden y una distancia que no existen; la alternativa habitual es one-hot encoding\",\"D\":\"Hay que ordenar los valores alfabéticamente antes de codificarlos\"},\"correct\":\"C\",\"explanation\":\"Los códigos enteros implican que azul es 'mayor' que rojo y que verde está justo a medio camino, un orden que el modelo intentará usar aunque no tenga sentido. El one-hot encoding crea una columna binaria por categoría (es_rojo, es_verde, es_azul), así que cada color recibe su propio peso independiente. La codificación con enteros sí es adecuada para categorías realmente ordinales, como pequeño, mediano y grande.\"},{\"id\":\"26\",\"question\":\"Un modelo de recomendación usa una feature 'id_producto' con 2 millones de valores distintos. El one-hot encoding crea una entrada enorme y dispersa, y el modelo no puede aprender que algunos productos se parecen. ¿Qué representación es la solución habitual?\",\"options\":{\"A\":\"Embeddings aprendidos: asignar a cada id_producto un vector denso de pocas dimensiones\",\"B\":\"Codificación con enteros ordenada por id_producto\",\"C\":\"Eliminar la feature\",\"D\":\"Escalado min-max de id_producto\"},\"correct\":\"A\",\"explanation\":\"Una capa de embeddings asigna a cada categoría un vector denso de, por ejemplo, 32 o 64 números que se aprenden durante el entrenamiento. Los productos que se comportan de forma parecida acaban con vectores parecidos, lo que permite al modelo compartir lo aprendido entre artículos relacionados. El truco de hashing de features es otra opción para limitar el tamaño de la entrada cuando no se necesita similitud.\"},{\"id\":\"27\",\"question\":\"Un dataset de clientes tiene un 15% de valores faltantes en la columna 'edad'. Eliminar esas filas quitaría demasiados datos. ¿Qué enfoque es un primer paso razonable?\",\"options\":{\"A\":\"Sustituir las edades faltantes por 0\",\"B\":\"Rellenar las edades faltantes con la media calculada sobre todo el dataset, incluido el test\",\"C\":\"Eliminar la columna 'edad' de todos los modelos\",\"D\":\"Imputar las edades faltantes con la mediana del conjunto de entrenamiento y, opcionalmente, añadir una feature binaria 'edad_faltante'\"},\"correct\":\"D\",\"explanation\":\"Imputar con un estadístico robusto como la mediana, calculado solo con el conjunto de entrenamiento, conserva las filas sin inventar valores extremos. Añadir una feature indicadora de valor faltante permite al modelo aprender si el hecho de que falte el dato es informativo en sí mismo. Rellenar con 0 crea edades falsas e imposibles, y calcular estadísticos con el test provoca fuga de datos.\"},{\"id\":\"28\",\"question\":\"Un dataset de abandono (churn) tiene un 95% de clientes que se quedan y un 5% que se van. El modelo casi nunca predice abandono. ¿Qué cambio hace directamente que el modelo preste más atención a la clase minoritaria durante el entrenamiento?\",\"options\":{\"A\":\"Quitar todos los clientes que abandonaron de los datos de entrenamiento\",\"B\":\"Usar pesos por clase para que los errores en la clase minoritaria cuesten más en la pérdida\",\"C\":\"Evaluar con exactitud en lugar de recall\",\"D\":\"Aplicar sobremuestreo a los conjuntos de validación y test\"},\"correct\":\"B\",\"explanation\":\"Los pesos por clase multiplican la pérdida de cada ejemplo por un peso que depende de su clase, así que los errores en los pocos clientes que abandonan cuestan más y el modelo se ve empujado a detectarlos. Remuestrear el conjunto de entrenamiento (sobremuestrear la clase minoritaria o submuestrear la mayoritaria) tiene un efecto parecido. El remuestreo solo se aplica a los datos de entrenamiento, nunca a validación ni a test, que deben reflejar la distribución real.\"},{\"id\":\"29\",\"question\":\"Un clasificador de impago devuelve probabilidades y, por defecto, un préstamo se marca como riesgoso si la probabilidad supera 0,5. El negocio dice que quiere detectar más préstamos riesgosos, aunque implique revisar más préstamos seguros. ¿Cuál es el cambio más simple, sin reentrenar?\",\"options\":{\"A\":\"Subir el umbral de decisión a 0,8\",\"B\":\"Cambiar la función de pérdida a error cuadrático medio\",\"C\":\"Bajar el umbral de decisión, por ejemplo a 0,3\",\"D\":\"Quitar la salida de probabilidad y usar solo las etiquetas predichas\"},\"correct\":\"C\",\"explanation\":\"El umbral de decisión convierte las probabilidades en etiquetas. Bajarlo marca más préstamos como riesgosos, lo que aumenta el recall a costa de la precision. El umbral es una decisión de negocio y debe elegirse con el conjunto de validación, por ejemplo con la curva precision–recall o el coste esperado de cada tipo de error. El valor por defecto de 0,5 no tiene nada de especial.\"},{\"id\":\"30\",\"question\":\"¿Cuál de los siguientes es un hiperparámetro y no un parámetro del modelo?\",\"options\":{\"A\":\"La profundidad máxima de un árbol de decisión\",\"B\":\"Los pesos de una regresión lineal\",\"C\":\"Los umbrales de corte que un árbol de decisión aprende en cada nodo\",\"D\":\"Los sesgos (biases) de las neuronas de una red neuronal\"},\"correct\":\"A\",\"explanation\":\"Los parámetros se aprenden de los datos durante el entrenamiento, como los pesos, los sesgos y los umbrales de corte de un árbol. Los hiperparámetros se fijan antes de entrenar y controlan cómo se aprende o cuán complejo puede ser el modelo, como la profundidad máxima del árbol, la tasa de aprendizaje, el número de capas o la fuerza de la regularización. Los hiperparámetros se eligen con un conjunto de validación o validación cruzada.\"},{\"id\":\"31\",\"question\":\"Cuando un árbol de decisión de clasificación elige con qué feature y umbral dividir un nodo, ¿qué intenta hacer normalmente?\",\"options\":{\"A\":\"Elegir la feature con el mayor rango numérico\",\"B\":\"Elegir la división que deje los nodos hijos lo más puros posible, por ejemplo minimizando la impureza de Gini o la entropía\",\"C\":\"Elegir una feature al azar en cada nodo\",\"D\":\"Elegir la división que ponga el mismo número de ejemplos en cada hijo\"},\"correct\":\"B\",\"explanation\":\"Un árbol de clasificación evalúa las divisiones candidatas y elige la que más reduce la impureza, medida con la impureza de Gini o la entropía (ganancia de información). Un nodo puro contiene ejemplos de una sola clase. Los árboles de regresión usan la misma idea, pero minimizan la varianza o el error cuadrático del objetivo en cada hijo.\"},{\"id\":\"32\",\"question\":\"Un random forest entrena muchos árboles de decisión y promedia sus predicciones. ¿Qué dos fuentes de aleatoriedad hacen que los árboles sean distintos entre sí?\",\"options\":{\"A\":\"Tasas de aprendizaje aleatorias y funciones de pérdida aleatorias\",\"B\":\"Etiquetas aleatorias y conjuntos de test aleatorios\",\"C\":\"Profundidades aleatorias y funciones de activación aleatorias\",\"D\":\"Cada árbol se entrena con una muestra bootstrap de las filas, y cada división considera solo un subconjunto aleatorio de features\"},\"correct\":\"D\",\"explanation\":\"Un random forest usa bagging (bootstrap aggregating): cada árbol se entrena con una muestra aleatoria de filas tomada con reemplazo. Además, cada división solo considera un subconjunto aleatorio de features, lo que reduce la correlación entre árboles. Promediar muchos árboles diversos y de alta varianza reduce mucho la varianza y, por tanto, el overfitting, manteniendo el sesgo bajo de los árboles profundos.\"},{\"id\":\"33\",\"question\":\"¿Cómo construye el gradient boosting (como en XGBoost o LightGBM) su conjunto de árboles?\",\"options\":{\"A\":\"En secuencia: cada nuevo árbol poco profundo se entrena para corregir los errores (residuos) de los árboles construidos hasta el momento\",\"B\":\"En paralelo: cada árbol se entrena de forma independiente con una muestra bootstrap y se promedian los resultados\",\"C\":\"Entrenando un único árbol muy profundo y podándolo\",\"D\":\"Agrupando los datos en clusters y entrenando un árbol por cluster\"},\"correct\":\"A\",\"explanation\":\"El gradient boosting añade árboles de uno en uno. Cada árbol nuevo, normalmente poco profundo, se ajusta a los errores que aún comete el conjunto actual (más exactamente, al gradiente negativo de la pérdida), y su aporte se escala con una tasa de aprendizaje. Esto reduce sobre todo el sesgo. Como sigue ajustando los errores, puede sobreajustar si se añaden demasiados árboles, por eso es habitual usar early stopping con un conjunto de validación.\"},{\"id\":\"34\",\"question\":\"Un clasificador de k vecinos más cercanos con k = 1 alcanza un 100% de exactitud en el conjunto de entrenamiento, pero rinde mal con datos nuevos. ¿Cuál es el cambio más adecuado?\",\"options\":{\"A\":\"Fijar k = 0\",\"B\":\"Quitar el escalado de features\",\"C\":\"Aumentar k y elegir su valor con validación cruzada\",\"D\":\"Entrenar el modelo durante más épocas\"},\"correct\":\"C\",\"explanation\":\"Con k = 1, cada punto de entrenamiento es su propio vecino más cercano, así que el modelo memoriza el conjunto de entrenamiento y su frontera de decisión sigue cada punto ruidoso: varianza alta. Valores de k mayores promedian más vecinos y dan fronteras más suaves, que suelen generalizar mejor, aunque un k demasiado grande provoca underfitting. k-NN no tiene épocas de entrenamiento; simplemente guarda los datos.\"},{\"id\":\"35\",\"question\":\"Un equipo de marketing quiere segmentar clientes en grupos según su comportamiento de compra, sin etiquetas predefinidas. Usan k-means pero no saben cuántos clusters elegir. ¿Qué enfoque ayuda a elegir k?\",\"options\":{\"A\":\"Usar la exactitud sobre un conjunto de test etiquetado\",\"B\":\"Graficar la suma de cuadrados dentro de los clusters para varios valores de k y buscar el 'codo', o comparar el coeficiente de silueta\",\"C\":\"Elegir siempre k igual al número de features\",\"D\":\"Elegir el k con la menor suma de cuadrados dentro de los clusters, aunque k sea igual al número de clientes\"},\"correct\":\"B\",\"explanation\":\"La suma de cuadrados dentro de los clusters (inercia) siempre baja al aumentar k y llega a cero cuando cada punto es su propio cluster, así que su mínimo no sirve. El método del codo busca el k a partir del cual añadir clusters aporta mejoras pequeñas. El coeficiente de silueta mide cuán bien encaja cada punto en su cluster comparado con el cluster vecino más cercano. La interpretabilidad para el negocio también importa.\"},{\"id\":\"36\",\"question\":\"Un dataset tiene 300 features numéricas muy correlacionadas. El equipo quiere reducirlo a unas pocas features nuevas que conserven la mayor parte de la variación de los datos, para visualizar y acelerar el entrenamiento. ¿Qué técnica encaja?\",\"options\":{\"A\":\"One-hot encoding\",\"B\":\"Clustering k-means\",\"C\":\"Regularización L2\",\"D\":\"Análisis de componentes principales (PCA)\"},\"correct\":\"D\",\"explanation\":\"El PCA encuentra nuevos ejes ortogonales, los componentes principales, ordenados según cuánta varianza de los datos capturan. Quedarse con los primeros componentes comprime muchas features correlacionadas en unas pocas no correlacionadas, conservando la mayor parte de la información. Los componentes son combinaciones lineales de las features originales, así que son más difíciles de interpretar, y conviene estandarizar las features antes.\"},{\"id\":\"37\",\"question\":\"Pese a su nombre, la regresión logística se usa para clasificación. ¿Cómo convierte una combinación lineal de features en una predicción?\",\"options\":{\"A\":\"Pasa la puntuación lineal por una función sigmoide, que produce una probabilidad entre 0 y 1, y luego la compara con un umbral\",\"B\":\"Redondea la puntuación lineal a la clase entera más cercana\",\"C\":\"Ajusta una recta distinta para cada clase y elige la más larga\",\"D\":\"Agrupa los datos en clusters y asigna la etiqueta del cluster más grande\"},\"correct\":\"A\",\"explanation\":\"La regresión logística calcula z = w·x + b y aplica la función sigmoide σ(z) = 1 / (1 + e^(−z)), que transforma cualquier número real en un valor entre 0 y 1 que se interpreta como la probabilidad de la clase positiva. Se entrena con log loss, y un umbral convierte la probabilidad en una clase. Sus pesos son interpretables: cada uno cambia el logaritmo de las probabilidades relativas (log-odds) de la clase positiva.\"},{\"id\":\"38\",\"question\":\"Se entrena una máquina de vectores de soporte (SVM) para un problema de clasificación binaria. ¿Qué afirmación describe la idea central de una SVM lineal?\",\"options\":{\"A\":\"Construye muchos árboles de decisión y los promedia\",\"B\":\"Asigna a cada ejemplo la etiqueta de su vecino más cercano\",\"C\":\"Encuentra la frontera de separación con el mayor margen hasta los puntos más cercanos de cada clase\",\"D\":\"Agrupa los ejemplos en k clusters antes de clasificar\"},\"correct\":\"C\",\"explanation\":\"Una SVM lineal busca el hiperplano que separa las clases con el margen más amplio posible, donde el margen es la distancia a los puntos de entrenamiento más cercanos, llamados vectores de soporte. Un margen amplio suele generalizar mejor. Un parámetro de margen suave C permite que algunos puntos violen el margen, y el truco del kernel permite a las SVM aprender fronteras no lineales.\"},{\"id\":\"39\",\"question\":\"Un equipo quiere saber de qué features depende más un modelo de gradient boosting ya entrenado, midiendo cuánto cae el rendimiento en validación cuando se barajan los valores de una feature. ¿Cómo se llama esta técnica?\",\"options\":{\"A\":\"One-hot encoding\",\"B\":\"Importancia de features por permutación\",\"C\":\"Análisis de componentes principales\",\"D\":\"Early stopping\"},\"correct\":\"B\",\"explanation\":\"La importancia por permutación baraja al azar los valores de una feature en el conjunto de validación, rompiendo su relación con el objetivo, y mide cuánto cae la puntuación del modelo. Una caída grande significa que el modelo depende mucho de esa feature. Funciona con cualquier modelo, pero las features correlacionadas pueden repartirse la importancia, y una importancia alta muestra lo que el modelo usa, no que la feature cause el resultado.\"},{\"id\":\"40\",\"question\":\"Un equipo necesita una línea base rápida y simple para clasificar mensajes de texto cortos como spam o no spam, usando conteos de palabras como features y suponiendo que las palabras son independientes entre sí dada la clase. ¿Qué algoritmo encaja con esta descripción?\",\"options\":{\"A\":\"k-means\",\"B\":\"Análisis de componentes principales\",\"C\":\"Gradient boosting\",\"D\":\"Naive Bayes\"},\"correct\":\"D\",\"explanation\":\"Naive Bayes aplica el teorema de Bayes con la suposición 'ingenua' de que las features son condicionalmente independientes dada la clase. Con conteos de palabras estima cuán probable es cada palabra en los mensajes de spam y en los que no lo son, y combina esas probabilidades. La suposición de independencia rara vez es cierta, pero el modelo es muy rápido, necesita pocos datos y funciona sorprendentemente bien como línea base de clasificación de texto.\"},{\"id\":\"41\",\"question\":\"Se construye una red neuronal apilando varias capas densas, pero sin funciones de activación entre ellas. ¿Por qué no puede aprender patrones no lineales complejos, por muchas capas que tenga?\",\"options\":{\"A\":\"Porque las capas densas no pueden tener más de 100 neuronas\",\"B\":\"Porque la red necesitaría un tamaño de batch mayor\",\"C\":\"Porque una composición de capas lineales sigue siendo una única función lineal\",\"D\":\"Porque sin activaciones la red no se puede entrenar con descenso por gradiente\"},\"correct\":\"C\",\"explanation\":\"Cada capa densa calcula una transformación lineal, y apilar transformaciones lineales produce otra transformación lineal, así que toda la red se reduce al equivalente de una sola capa lineal. Las funciones de activación no lineales entre capas, como ReLU, sigmoide o tanh, son las que permiten a las redes profundas representar fronteras de decisión curvas y funciones complejas. ReLU, max(0, x), es la opción por defecto más común en las capas ocultas.\"},{\"id\":\"42\",\"question\":\"Una red neuronal debe clasificar imágenes en una de 10 categorías mutuamente excluyentes. ¿Qué capa de salida y qué pérdida son la elección estándar?\",\"options\":{\"A\":\"10 unidades de salida con activación softmax, entrenadas con entropía cruzada categórica\",\"B\":\"1 unidad de salida con activación ReLU, entrenada con error cuadrático medio\",\"C\":\"10 unidades de salida sin activación, entrenadas con error absoluto medio\",\"D\":\"1 unidad de salida con activación sigmoide, entrenada con entropía cruzada binaria\"},\"correct\":\"A\",\"explanation\":\"La softmax convierte las 10 puntuaciones brutas (logits) en probabilidades positivas que suman 1, una por clase, y la clase predicha es la de mayor probabilidad. La entropía cruzada categórica penaliza entonces una probabilidad baja en la clase correcta. En problemas multietiqueta, donde varias clases pueden ser ciertas a la vez, se usan en cambio salidas sigmoide independientes con entropía cruzada binaria.\"},{\"id\":\"43\",\"question\":\"¿Qué calcula el algoritmo de retropropagación (backpropagation) durante el entrenamiento de una red neuronal?\",\"options\":{\"A\":\"La mejor arquitectura de red para el dataset\",\"B\":\"El gradiente de la pérdida respecto de cada peso, aplicando la regla de la cadena desde la capa de salida hacia la entrada\",\"C\":\"La tasa de aprendizaje óptima para cada época\",\"D\":\"Las predicciones de la red sobre el conjunto de test\"},\"correct\":\"B\",\"explanation\":\"La retropropagación hace una pasada hacia delante para calcular las predicciones y la pérdida, y luego aplica la regla de la cadena del cálculo hacia atrás, capa por capa, para calcular cuánto contribuyó cada peso al error. Esos gradientes los usa después un optimizador como SGD o Adam para actualizar los pesos. La retropropagación calcula los gradientes; el optimizador decide cómo usarlos.\"},{\"id\":\"44\",\"question\":\"En una red muy profunda con activaciones sigmoide, los pesos de las primeras capas apenas cambian durante el entrenamiento, mientras las últimas capas aprenden con normalidad. ¿Cuál es la causa más probable?\",\"options\":{\"A\":\"Explosión de gradientes por una tasa de aprendizaje demasiado pequeña\",\"B\":\"Fuga de datos en el conjunto de entrenamiento\",\"C\":\"El tamaño del batch es demasiado pequeño\",\"D\":\"Desvanecimiento del gradiente: multiplicar muchas derivadas pequeñas durante la retropropagación deja los gradientes de las primeras capas casi en cero\"},\"correct\":\"D\",\"explanation\":\"La derivada de la sigmoide es como máximo 0,25, y la retropropagación multiplica un factor así por cada capa, de modo que el gradiente que llega a las primeras capas se encoge exponencialmente con la profundidad. Esas capas aprenden entonces muy lentamente. Las soluciones habituales son activaciones de la familia ReLU, una inicialización cuidadosa de los pesos, batch normalization y conexiones residuales (skip connections), que dan a los gradientes un camino directo.\"},{\"id\":\"45\",\"question\":\"¿Por qué las redes neuronales convolucionales (CNN) se adaptan mejor a las imágenes que las redes totalmente conectadas?\",\"options\":{\"A\":\"Porque no necesitan datos de entrenamiento\",\"B\":\"Porque convierten las imágenes en texto antes de clasificarlas\",\"C\":\"Porque pequeños filtros recorren la imagen y comparten sus pesos, detectando patrones locales en cualquier posición con muchos menos parámetros\",\"D\":\"Porque procesan cada píxel de forma totalmente independiente de sus vecinos\"},\"correct\":\"C\",\"explanation\":\"Una capa convolucional aplica pequeños filtros aprendibles (por ejemplo, de 3×3) sobre toda la imagen. Cada filtro detecta un patrón local, como un borde o una textura, esté donde esté, porque los mismos pesos se reutilizan en cada posición. Este reparto de pesos necesita muchos menos parámetros que conectar cada píxel con cada neurona, y al apilar capas se pasa de bordes a formas y a objetos completos.\"},{\"id\":\"46\",\"question\":\"Los modelos transformer sustituyeron a las redes neuronales recurrentes (RNN) como arquitectura estándar para el lenguaje. ¿Qué mecanismo permite a un transformer relacionar cada palabra directamente con todas las demás de la secuencia y procesar la secuencia en paralelo?\",\"options\":{\"A\":\"La autoatención (self-attention)\",\"B\":\"El max pooling\",\"C\":\"El dropout\",\"D\":\"El bagging\"},\"correct\":\"A\",\"explanation\":\"La autoatención calcula, para cada token, una combinación ponderada de todos los tokens de la secuencia, con pesos que reflejan cuán relevante es cada uno. Así, palabras lejanas pueden influirse directamente, sin pasar la información paso a paso como hace una RNN. Como no hay dependencia secuencial entre posiciones, toda la secuencia se puede procesar en paralelo. Se añaden codificaciones posicionales para que el modelo siga conociendo el orden de las palabras.\"},{\"id\":\"47\",\"question\":\"Una startup necesita un clasificador de imágenes para 5 tipos de defectos de fabricación, pero solo tiene 800 imágenes etiquetadas. Entrenar una CNN grande desde cero provoca un overfitting fuerte. ¿Cuál es el enfoque más eficaz?\",\"options\":{\"A\":\"Entrenar desde cero una red todavía más grande durante más épocas\",\"B\":\"Transfer learning: partir de un modelo preentrenado con un gran dataset de imágenes y ajustarlo (fine-tuning) con las imágenes de defectos\",\"C\":\"Convertir las imágenes en texto y usar Naive Bayes\",\"D\":\"Usar k-means para agrupar las 800 imágenes en 5 grupos y tratarlos como etiquetas\"},\"correct\":\"B\",\"explanation\":\"El transfer learning reutiliza un modelo preentrenado con un gran dataset como ImageNet, cuyas primeras capas ya detectan rasgos visuales generales como bordes, texturas y formas. Se sustituye la última capa por una con tus 5 clases y se entrena, a menudo primero con las capas preentrenadas congeladas y después ajustando algunas de ellas con una tasa de aprendizaje pequeña. Esto requiere muchos menos datos y cómputo que entrenar desde cero.\"},{\"id\":\"48\",\"question\":\"Un modelo de previsión de demanda funcionó bien durante un año, pero su precisión cayó después de que la empresa abriera tiendas en una región nueva con clientes muy distintos. La relación entre las features y la demanda no ha cambiado, pero los datos de entrada ahora se ven distintos de los de entrenamiento. ¿Cómo se llama esto y cuál es la respuesta habitual?\",\"options\":{\"A\":\"Overfitting; añadir dropout\",\"B\":\"Fuga de datos; quitar la feature de región\",\"C\":\"Deriva de datos (data drift); monitorizar las distribuciones de entrada y reentrenar el modelo con datos recientes y representativos\",\"D\":\"Desvanecimiento del gradiente; cambiar a activaciones ReLU\"},\"correct\":\"C\",\"explanation\":\"La deriva de datos (data drift, o covariate shift) ocurre cuando la distribución de las entradas en producción cambia respecto a la de entrenamiento. La deriva de concepto (concept drift) es parecida pero distinta: cambia la propia relación entre las entradas y el objetivo. Ambas degradan los modelos con el tiempo, así que los modelos en producción necesitan monitorizar las distribuciones de entrada y el rendimiento, y reentrenarse periódicamente con datos recientes.\"},{\"id\":\"49\",\"question\":\"Un modelo rinde bien offline, pero justo después de desplegarse sus predicciones son mucho peores. El equipo descubre que en entrenamiento la feature 'dias_desde_registro' se calculaba en un proceso SQL por lotes, mientras que el servicio online la calcula en el código de la aplicación, que redondea distinto y usa otra zona horaria. ¿Cómo se llama este problema?\",\"options\":{\"A\":\"Deriva de concepto\",\"B\":\"Desbalance de clases\",\"C\":\"Underfitting\",\"D\":\"Desfase entre entrenamiento y servicio (training–serving skew)\"},\"correct\":\"D\",\"explanation\":\"El training–serving skew es una diferencia entre cómo se procesan los datos durante el entrenamiento y cómo se procesan al servir predicciones. Incluso pequeñas incoherencias en el cálculo de las features dan al modelo entradas que nunca vio al entrenar. Las soluciones habituales son compartir el mismo código o pipeline de transformación entre entrenamiento y servicio, usar un feature store y comparar las features registradas al servir con las de entrenamiento.\"},{\"id\":\"50\",\"question\":\"Un modelo de preselección de candidatos se entrenó con 10 años de decisiones de contratación pasadas. Una auditoría muestra que puntúa más bajo a candidatos igual de cualificados de un grupo concreto, reproduciendo patrones de las decisiones históricas. ¿Cuál es la causa de fondo y cuál es un primer paso adecuado?\",\"options\":{\"A\":\"El modelo tiene underfitting; añadir más capas\",\"B\":\"Las etiquetas de entrenamiento reflejan un sesgo histórico; auditar los datos y evaluar las métricas por grupo antes y después del despliegue\",\"C\":\"La tasa de aprendizaje es demasiado alta; bajarla\",\"D\":\"El conjunto de test es demasiado grande; reducirlo\"},\"correct\":\"B\",\"explanation\":\"Un modelo aprende los patrones que hay en sus etiquetas, incluidos los sesgos humanos de decisiones pasadas. Quitar el atributo sensible no suele bastar, porque otras features, como el código postal o la universidad, pueden actuar como sustitutos (proxies). Los pasos adecuados incluyen auditar los datos y las etiquetas, medir el rendimiento y las tasas de error por grupo, acordar criterios de equidad con los interesados y mantener supervisión humana en decisiones de alto impacto.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
