NFO-level logs to reduce billing charges\",\"D\":\"Delete logs older than 30 days for simplicity “iw\"},\"correct\":\"B\",\"explanation\":\"Exporting logs to Cloud Storage with versioning provides durability and traceability, fulfilling compliance and audit requirements.\"},{\"id\":\"267\",\"question\":\"What helps ensure configuration changes do not negatively impact production systems?\",\"options\":{\"A\":\"Disable alerting rules before deploying configuration files\",\"B\":\"Test all changes in staging environments before deploying\",\"C\":\"Apply changes directly in the production environment daily\",\"D\":\"Use unmanaged instances to avoid configuration conflicts % oe aS “11Ww* eet tilly — * BR TTI\"},\"correct\":\"B\",\"explanation\":\"Testing configuration updates in staging environments ensures stability before deployment, reducing the chance of failures in production.\"},{\"id\":\"268\",\"question\":\"What is the benefit of using Cloud Load Balancer health checks?\",\"options\":{\"A\":\"It removes failed backends from the traffic distribution list\",\"B\":\"It increases the number of virtual machine instances globally\",\"C\":\"It adds unused resources to minimize application traffic\",\"D\":\"It triggers auto-deployment based on custom DNS settings \\\"4 core\"},\"correct\":\"A\",\"explanation\":\"Health checks ensure only healthy backends serve traffic, improving availability and avoiding routing requests to unresponsive services.\"},{\"id\":\"269\",\"question\":\"How does using Terraform with GCP support lifecycle reliability?\",\"options\":{\"A\":\"It runs workloads faster than traditional GCP SDK commands\",\"B\":\"It allows multiple users to apply untracked configuration files ee -_ -\",\"C\":\"It maintains infrastructure as code with version control 47) sly oh\",\"D\":\"It requires fewer IAM roles and permissions per user A)\"},\"correct\":\"C\",\"explanation\":\"Terraform enables consistent, repeatable deployments by managing infrastructure as code, supporting change tracking and rollback.\"},{\"id\":\"270\",\"question\":\"Ateam needs to automate response actions after error thresholds are exceeded. What should they use?\",\"options\":{\"A\":\"Use Cloud NAT to reroute packets during incidents\",\"B\":\"Launch GCE instances from the monitoring dashboard\",\"C\":\"Use alerting policies with Cloud Functions for remediation “iw\",\"D\":\"Scale down workloads manually via Console after issues ‘\"},\"correct\":\"C\",\"explanation\":\"Cloud Monitoring alerts can trigger Cloud Functions that automatically execute remediation actions, reducing downtime and MTTR.\"},{\"id\":\"271\",\"question\":\"Acompany wants to recover critical app data after a disaster. What ensures this requirement?\",\"options\":{\"A\":\"Use zonal standard disks without replication settings enabled\",\"B\":\"Retain logs for 14 days and generate weekly summary reports\",\"C\":\"Create instance snapshots stored only in the current region\",\"D\":\"Use cross-region backups and test restore procedures\"},\"correct\":\"D\",\"explanation\":\"Cross-region backups provide durability during regional failures. Testing recovery procedures ensures data can be restored when needed.\"},{\"id\":\"272\",\"question\":\"What is the role of Cloud Profiler in supporting reliability?\",\"options\":{\"A\":\"It identifies inefficient code that impacts system latency\",\"B\":\"It predicts infrastructure billing cost for future quarters\",\"C\":\"It synchronizes logs across all availability zones globally\",\"D\":\"It validates IAM policy changes during CI/CD workflows G iG “Se 11.5 *s “@ rer “fk “11Ww* selly )\"},\"correct\":\"A\",\"explanation\":\"Cloud Profiler helps developers understand where latency or resource consumption occurs, improving performance and operational health.\"},{\"id\":\"273\",\"question\":\"How can Cloud Run services be made more resilient during sudden traffic increases?\",\"options\":{\"A\":\"Use manual instance provisioning to handle sudden changes\",\"B\":\"Enable concurrency and autoscaling in service settings\",\"C\":\"Configure GCS triggers to reroute request paths to buckets\",\"D\":\"Attach startup scripts that poll external monitoring tools\"},\"correct\":\"B\",\"explanation\":\"Cloud Monitoring’s uptime checks and alerting policies offer integrated and automated monitoring of App Engine services, with minimal manual effort.\"},{\"id\":\"274\",\"question\":\"How can teams identify early signs of service degradation?\",\"options\":{\"A\":\"Rely on bug reports submitted by end-users post-failure\",\"B\":\"Use SLO-based alerting with burn rate-based conditions\",\"C\":\"Wait until scheduled health reviews detect chronic failures\",\"D\":\"Disable detailed logging to prevent alerting on minor zz Sanne? oan “1iWw* sey Ss issues\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. With SLO-based alerts and burn-rate conditions (how fast the error budget is consumed).\\n\\nHow it works:\\n• Burn rate 1 = you exhaust the error budget exactly at the end of the SLO window; burn rate 10 = you would exhaust it 10× faster.\\n• Common practice: fast alert (high burn rate in a short window, e.g. 1 h) + slow alert (low burn rate in a long window, e.g. 24 h).\\n• Cloud Monitoring supports burn-rate alerting policies on service SLOs.\\n\\nExam tip: «early signs» + SLO → burn rate alerts.\\nDo not confuse with: waiting for user bug reports, scheduled health reviews, disabling detailed logging.\",\"explanationSource\":\"card-en\"},{\"id\":\"275\",\"question\":\"What helps detect anomalous behavior in application metrics?\",\"options\":{\"A\":\"Use regional static thresholds with default alert rules only\",\"B\":\"Collect logs without enabling metric analysis or filtering\",\"C\":\"Use Cloud Monitoring’s anomaly detection feature\",\"D\":\"Set warning notifications based on fixed calendar schedules % \u003cS se silly TT A) RS Ti\"},\"correct\":\"C\",\"explanation\":\"Cloud Monitoring supports anomaly detection to identify unexpected deviations in metric trends, enabling proactive responses.\"},{\"id\":\"276\",\"question\":\"What method helps optimize resources and prevent over-provisioning?\",\"options\":{\"A\":\"Set instance types with the highest CPU cores by default\",\"B\":\"Analyze metrics using Recommender for right-sizing VMs\",\"C\":\"Remove alert policies to avoid unnecessary scaling triggers ta, 42)\",\"D\":\"Disable autoscaling to maintain consistent performance eL// Saaet aS Te \\\\ SS\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Use the Recommender's right-sizing recommendations (machine type recommendations) based on historical usage metrics.\\n\\nHow it works:\\n• It analyzes the last ~8 days of CPU and memory (memory is more accurate with the Ops Agent) and suggests a smaller or larger machine type.\\n• Apply with a click or via API; there are also recommendations for MIGs.\\n\\nExam tip: «right-sizing» / «over-provisioning» → Recommender.\\nDo not confuse with: defaulting to the machine type with the most cores, deleting alert policies, disabling autoscaling.\",\"explanationSource\":\"card-en\"},{\"id\":\"279\",\"question\":\"What tool should you use to simulate failure in a production system for resilience testing?\",\"options\":{\"A\":\"Deploy legacy apps and monitor manual behavior\",\"B\":\"Use Chaos Engineering tools like Chaos Monkey or Litmus\",\"C\":\"Disable autoscaling and observe user complaints “nw\",\"D\":\"Create service accounts with reduced IAM roles only ‘Ss THA\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Chaos Engineering tools such as Chaos Monkey or LitmusChaos, which inject controlled failures (kill instances or pods, add latency, cut the network).\\n\\nHow it works:\\n• You define a steady-state hypothesis (SLIs), inject the failure with limited blast radius, and observe.\\n• Start in staging and with a small blast radius; have the abort mechanism ready.\\n• Reveals fragile dependencies, badly configured timeouts, and missing redundancy.\\n\\nExam tip: «simulate failure» / «resilience testing» → chaos engineering.\\nDo not confuse with: deploying legacy apps and watching by hand, disabling autoscaling and waiting for complaints, creating service accounts with fewer roles.\",\"explanationSource\":\"card-en\"},{\"id\":\"280\",\"question\":\"What is the purpose of GKE node auto- repair in supporting reliability?\",\"options\":{\"A\":\"It adds additional features to control network traffic logs\",\"B\":\"It automatically replaces unhealthy nodes in the cluster\",\"C\":\"It triggers new pod deployments every 24 hours by default om\",\"D\":\"It synchronizes data to all clusters across zones instantly \u0026 13: uit nite Miia\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. To automatically replace unhealthy nodes in the cluster.\\n\\nHow it works:\\n• GKE watches each node's state (e.g. NotReady or not reporting for a sustained time, or boot disk full) and repairs it: drains and recreates it.\\n• Enabled by default on Autopilot and on new Standard node pools.\\n• Pods managed by controllers are rescheduled onto other nodes.\\n\\nExam tip: «auto-repair» → automatic replacement of unhealthy nodes.\\nDo not confuse with: network traffic logs, automatic redeploys every 24 hours, instant data sync between clusters.\",\"explanationSource\":\"card-en\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
