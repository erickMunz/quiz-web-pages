tributes\",\"D\":\"Grant storage access to anonymous users\"},\"correct\":\"C\",\"explanation\":\"IAM Conditions allow access control based on attributes like IP address or request time, aligning with network-based policies.\"},{\"id\":\"129\",\"question\":\"To support internal audit, what logging feature should be enabled?\",\"options\":{\"A\":\"Disable logging to reduce log size\",\"B\":\"Enable Data Access audit logging\",\"C\":\"Allow logs to be stored on user devices\",\"D\":\"Configure firewall to collect log data\"},\"correct\":\"B\",\"explanation\":\"Data Access logs capture reads and writes to data resources, which is crucial for internal audits and compliance validation.\"},{\"id\":\"131\",\"question\":\"A customer needs to meet FedRAMP High compliance. What helps achieve this?\",\"options\":{\"A\":\"Use unmanaged public repositories for source\",\"B\":\"Deploy only to Google Cloud Assured Workloads\",\"C\":\"Rely on standard multi-tenant services\",\"D\":\"Create personal accounts for audit tracking\"},\"correct\":\"B\",\"explanation\":\"Assured Workloads enforces compliance with FedRAMP, CJIS, and other frameworks by restricting resources to compliant regions.\"},{\"id\":\"137\",\"question\":\"What setting helps enforce separation of duties in a GCP environment?\",\"options\":{\"A\":\"Assign Owner role to all engineers equally\",\"B\":\"Use IAM role boundaries with least privilege\",\"C\":\"Disable audit logs for performance tracking\",\"D\":\"Allow anonymous access for development\"},\"correct\":\"B\",\"explanation\":\"IAM role boundaries and least privilege access ensure that users only perform tasks aligned with their job responsibilities.\"},{\"id\":\"138\",\"question\":\"A customer wants to ensure secrets are not logged in GCP. What is the solution?\",\"options\":{\"A\":\"Allow unrestricted write access to Cloud Logs\",\"B\":\"Use Cloud DLP to scan and redact secrets\",\"C\":\"Export logs to unsecured local machines daily\",\"D\":\"Store plain text passwords in audit trails\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Sensitive Data Protection (Cloud DLP) to inspect and redact secrets/PII in the log pipeline, plus not logging them at the source.\\n\\nHow it works:\\n• InfoTypes for credentials, keys, passwords; de-identify before the sink.\\n• Log Router exclusion filters for known patterns.\\n• Secret Manager: the app does not print the value.\\n\\nExam tip: \\\"secrets are not logged\\\" → DLP redact.\\nDo not confuse with: Policy Controller/OPA (that was the original explanation, a different topic), logs to laptops, passwords in audit trails.\",\"explanationSource\":\"card-en\"},{\"id\":\"141\",\"question\":\"Which helps verify infrastructure complies with security standards?\",\"options\":{\"A\":\"Use NAT gateways to scan traffic content\",\"B\":\"Enable Security Health Analytics scans\",\"C\":\"Assign Editor role to cloud users always\",\"D\":\"Run unmanaged code on production clusters\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Security Health Analytics, a built-in Security Command Center service, continuously scans for misconfigurations (public buckets, open firewalls, missing MFA and similar) and maps findings to standards such as CIS, PCI DSS and NIST.\\n\\nWhy not the others: A) NAT gateways do not inspect content. C) broad Editor roles weaken compliance. D) unmanaged code in production is a risk, not a check.\",\"explanationSource\":\"written\"},{\"id\":\"142\",\"question\":\"What prevents external IP usage ina highly secure network?\",\"options\":{\"A\":\"Create default routes to all public IPs\",\"B\":\"Assign global access to VPC subnets\",\"C\":\"Use IAP to tunnel public services through\",\"D\":\"Apply org policy denying external IPs qull “1nw* WALL A)\"},\"correct\":\"D\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: D. The Organization Policy constraint compute.vmExternalIpAccess (set to deny all, or an allowlist) prevents VMs from getting external IPs. Outbound traffic can go through Cloud NAT, and admin access through IAP.\\n\\nWhy not the others: A) and B) default routes to public IPs and global subnet access increase exposure. C) IAP TCP forwarding is how you reach VMs without external IPs, but it does not prevent external IPs from being assigned.\",\"explanationSource\":\"written\"},{\"id\":\"143\",\"question\":\"How can you reduce the impact of leaked service account keys?\",\"options\":{\"A\":\"Never rotate service account keys after use\",\"B\":\"Enable full API access for all accounts\",\"C\":\"Use key expiration with limited duration\",\"D\":\"Store key backups in public Cloud Storage\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. If keys are unavoidable, the iam.serviceAccountKeyExpiryHours org policy (or regular rotation) limits key lifetime, so a leaked key soon stops working. Even better is to avoid keys entirely with Workload Identity Federation or impersonation.\\n\\nWhy not the others: A) never rotating keys leaves them valid indefinitely. B) full API access maximizes the blast radius. D) public buckets leak keys.\",\"explanationSource\":\"written\"},{\"id\":\"144\",\"question\":\"Which IAM practice is ideal for temporary project access?\",\"options\":{\"A\":\"Assign permanent roles without review cycles\",\"B\":\"Grant Editor at the organization level\",\"C\":\"Use IAM Conditions for time-bound grants\",\"D\":\"Add credentials to shared Google Sheets\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. An IAM Condition with an expiry time on the role binding grants temporary access that revokes itself. Privileged Access Manager adds just-in-time request and approval workflows on top.\\n\\nWhy not the others: A) permanent roles with no review drift into over-privilege. B) organization-level Editor is far too broad. D) credentials in shared sheets are a leak.\",\"explanationSource\":\"written\"},{\"id\":\"145\",\"question\":\"You want to monitor for unusual IAM activity. What helps?\",\"options\":{\"A\":\"Remove all logging to increase system speed\",\"B\":\"Disable role assignments for service accounts\",\"C\":\"Use Cloud Logging with alerts on anomalies\",\"D\":\"Use custom DNS to detect network attacks po siset’ “iw\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Cloud Logging (audit logs) + alerts: log-based metrics or alerting policies on `SetIamPolicy`, privileged roles, or anomalous spikes.\\n\\nHow it works:\\n• Filter: `protoPayload.methodName=\\\"SetIamPolicy\\\"` or `roles/owner`.\\n• Metric + threshold, or log sink to Pub/Sub / Chronicle / SCC ETD.\\n• Notification channels (PagerDuty, Slack) with high severity.\\n\\nExam tip: \\\"unusual IAM activity\\\" → Logging + alerts.\\nDo not confuse with: removing logs, custom DNS as IDS, blindly disabling SA roles.\",\"explanationSource\":\"card-en\"},{\"id\":\"146\",\"question\":\"To ensure sensitive logs are not publicly accessible, what is best?\",\"options\":{\"A\":\"Store logs in a bucket with public read set\",\"B\":\"Apply bucket-level IAM to restrict access\",\"C\":\"Use signed URLs shared via public domains\",\"D\":\"Allow Viewer access for all Google users\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. IAM at the bucket (or log bucket) level: only security/ops identities read; never `allUsers` or \\\"all Google users\\\".\\n\\nHow it works:\\n• Sink to a bucket or log bucket in the security project.\\n• Uniform bucket-level access + Public Access Prevention.\\n• Roles: `roles/storage.objectViewer` or `roles/logging.viewAccessor` to a group, not `roles/viewer` of the whole Google org.\\n\\nExam tip: restrict, do not widen to allGoogleUsers.\\nDo not confuse with: signed URLs on public domains, Viewer to all Google accounts.\",\"explanationSource\":\"card-en\"},{\"id\":\"149\",\"question\":\"Your organization is running a batch data processing job that consistently uses only 50% of the allocated vCPUs. What is the best way to optimize cost without impacting performance?\",\"options\":{\"A\":\"Migrate to a region with lower network egress costs\",\"B\":\"Replace VM instances with larger persistent disks\",\"C\":\"Resize the VM instances to smaller machine types\",\"D\":\"Add autoscaling to increase instance capacity during Ny is fe WL] 11; “Wwe A; aa execution\"},\"correct\":\"C\",\"explanation\":\"Resizing VM instances to smaller machine types helps reduce underutilized CPU resources, which directly reduces cost. Since only 50% of vCPUs are used, a smaller machine will meet processing needs efficiently without overprovisioning.\"},{\"id\":\"150\",\"question\":\"A service-level agreement (SLA) requires 99.99% uptime for an e-commerce platform. hich architecture design principle best supports this SLA?\",\"options\":{\"A\":\"Minimize logging for improved throughput\",\"B\":\"Use multiple zones with health checks for failover\",\"C\":\"Schedule periodic restarts of all VMs to refresh instances * 1\",\"D\":\"Centralize all components in a single availability zone \u0026 =. A,\\\" 4, Cs ae\"},\"correct\":\"B\",\"explanation\":\"Designing for high availability by using multiple zones ensures that if one zone fails, the system can continue operating from another. Combined with health checks, this strategy supports achieving the 99.99% SLA target.\"},{\"id\":\"151\",\"question\":\"Your finance department needs monthly reports on actual versus budgeted cloud spend. Which solution should you implement in GCP to provide this?\",\"options\":{\"A\":\"Enable Compute Engine resource quotas\",\"B\":\"Export Stackdriver logs to BigQuery\",\"C\":\"Use Pub/Sub to monitor budget usage\",\"D\":\"Set up Budget alerts and export billing data to BigQuery wey\"},\"correct\":\"D\",\"explanation\":\"Exporting billing data to BigQuery and setting up Budget alerts allows detailed cost analysis and forecasting. Finance teams can compare actual usage with budgeted values through scheduled queries and dashboards.\"},{\"id\":\"152\",\"question\":\"Acompany’s Cloud Storage usage is increasing rapidly due to frequent backups. hat can be done to reduce storage costs without losing data?\",\"options\":{\"A\":\"Use Nearline Storage for active transactional data\",\"B\":\"Enable object versioning on all buckets\",\"C\":\"Move older backups to Coldline or Archive Storage\",\"D\":\"Increase bucket size and enable faster replication Me\"},\"correct\":\"C\",\"explanation\":\"Coldline and Archive storage classes are ideal for infrequent access, such as backups. Migrating older data to these tiers significantly lowers storage costs while maintaining data availability when needed.\"},{\"id\":\"153\",\"question\":\"A performance monitoring tool shows high latency in one of your services. What is the most effective first step in identifying the bottleneck?\",\"options\":{\"A\":\"Analyze Cloud Trace to find slow requests\",\"B\":\"Restart the instances serving that service\",\"C\":\"Increase CPU quota for the project\",\"D\":\"Resize all VM instances to high-memory machines\"},\"correct\":\"A\",\"explanation\":\"Cloud Trace provides distributed tracing of requests, allowing you to pinpoint the exact function, microservice, or dependency that is causing latency. This diagnostic step should precede any resource changes.\"},{\"id\":\"154\",\"question\":\"Your organization wants to track KPIs related to customer logins per second and error rates. What is the best approach in GCP?\",\"options\":{\"A\":\"Use GCS logs and export to Pub/Sub\",\"B\":\"Set up Cloud Functions with Bigtable triggers\",\"C\":\"Use AI Platform to detect anomalies\",\"D\":\"Create custom metrics and dashboards in Cloud Monitoring x % - = = S “aw\"},\"correct\":\"D\",\"explanation\":\"Cloud Monitoring supports creating custom metrics, which are ideal for tracking business KPIs like logins and error rates. Dashboards help visualize trends, and alerting can be configured to detect issues early.\"},{\"id\":\"155\",\"question\":\"Your web app on GKE is showing periodic performance degradation during peak traffic. What should you implement to address this?\",\"options\":{\"A\":\"Enable horizontal pod autoscaling on the deployment\",\"B\":\"Increase node disk size for all worker nodes\",\"C\":\"Migrate the cluster to a different GCP region\",\"D\":\"Disable liveness and readiness probes temporarily\"},\"correct\":\"A\",\"explanation\":\"Horizontal Pod Autoscaling dynamically adjusts the number of pods based on CPU or custom metrics. This ensures sufficient capacity during traffic spikes, improving app responsiveness without overprovisioning.\"},{\"id\":\"156\",\"question\":\"Your team receives alerts daily for minor issues that don't require action. How can you reduce alert fatigue without ignoring important problems?\",\"options\":{\"A\":\"Disable all non-critical alerting policies\",\"B\":\"Set alert thresholds to trigger only on errors\",\"C\":\"Adjust severity levels and use notification filters\",\"D\":\"Remove logs from alert-generating services “aw “aw\"},\"correct\":\"C\",\"explanation\":\"Using severity levels and filters allows engineers to receive high-severity alerts while suppressing noise from non-actionable warnings. This optimizes operational efficiency and avoids alert desensitization.\"},{\"id\":\"157\",\"question\":\"Your client wants to lower costs associated with Compute Engine instances running during non-business hours. Which approach is best?\",\"options\":{\"A\":\"Use Cloud Scheduler with Cloud Functions to stop instances nightly\",\"B\":\"Apply autoscaling policies based on HTTP requests\",\"C\":\"Convert instances into preemptible VMs\",\"D\":\"Move workloads to a different region with lower costs\"},\"correct\":\"A\",\"explanation\":\"Using Cloud Scheduler and Functions enables automation to stop and restart instances based on defined schedules. This effectively reduces cost for non-critical resources outside business hours.\"},{\"id\":\"158\",\"question\":\"You've noticed inconsistent latency in our microservices architecture. What's the most effective way to gather detailed performance insights?\",\"options\":{\"A\":\"Enable GCS versioning for audit trail\",\"B\":\"Use Cloud Trace for distributed tracing\",\"C\":\"Scale up GKE cluster size\",\"D\":\"Move microservices to separate regions\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Cloud Trace (distributed tracing): a waterfall per request across the services.\\n\\nHow it works:\\n• Shared trace ID; each hop adds spans.\\n• You see p95, outliers, and which dependency (DB, API, another pod) is taking time.\\n• Do not scale the cluster \\\"just in case\\\" or version a bucket: that does not diagnose.\\n\\nExam tip: \\\"inconsistent latency\\\" + microservices → Cloud Trace.\\nDo not confuse with: org policy on external IPs (that was the original explanation, from another question).\",\"explanationSource\":\"card-en\"},{\"id\":\"159\",\"question\":\"You need to optimize the cost of a BigQuery workload that queries a large table multiple times per day. What is the best solution?\",\"options\":{\"A\":\"Partition the table by a non-queried column\",\"B\":\"Export the table to CSV for offline queries\",\"C\":\"Use table partitioning by frequently filtered field\",\"D\":\"Replicate the table in each region for faster access By\"},\"correct\":\"C\",\"explanation\":\"Partitioning BigQuery tables by frequently queried fields (like timestamp) helps scan less data, reducing cost and improving performance. Other options increase complexity or storage cost without performance gain.\"},{\"id\":\"160\",\"question\":\"A client wants near real-time insights from data ingestion without incurring high storage or compute costs. What is the most cost-effective design?\",\"options\":{\"A\":\"Load data into BigQuery every 30 minutes via Dataflow\",\"B\":\"Stream data into BigQuery and use scheduled queries\",\"C\":\"Use Cloud SQL to buffer incoming data\",\"D\":\"Store in Cloud Storage and process weekly using DataProc Say, %, LL _ ofa “aw Lao} z. % ) “ai\"},\"correct\":\"B\",\"explanation\":\"Streaming into BigQuery combined with scheduled queries allows real-time processing with cost- effective compute. Other options involve higher latency or complexity for near real-time use cases.\"},{\"id\":\"161\",\"question\":\"Your solution must ensure that the application does not exceed its budget and reacts to cost surges. Which approach meets the requirement?\",\"options\":{\"A\":\"Assign IAM policies to billing admin roles\",\"B\":\"Configure budget alerts and apply programmatic enforcement\",\"C\":\"Enable autoscaling for all services regardless of load Sees\",\"D\":\"Use service accounts to monitor resource creation\"},\"correct\":\"B\",\"explanation\":\"Setting up budget alerts and enforcing automated actions (via scripts or policy enforcement tools) allows for proactive budget management. IAM roles or autoscaling alone don’t address cost control.\"},{\"id\":\"162\",\"question\":\"A legacy app is deployed on Compute Engine with constant but low usage. How can ou reduce cost without modifying the app?\",\"options\":{\"A\":\"Replace instances with smaller machine types\",\"B\":\"Convert the app to use App Engine flexible environment\",\"C\":\"Use GPUs to offload processing\",\"D\":\"Move it to a separate VPC with reduced egress charges 12: “iw\"},\"correct\":\"A\",\"explanation\":\"Downsizing machine types maintains the same architecture while reducing compute cost. Other options require re-architecting or won't yield meaningful savings.\"},{\"id\":\"163\",\"question\":\"To meet a 99.9% uptime SLA, which design should you use for a web app?\",\"options\":{\"A\":\"Deploy in a single zone with startup probes\",\"B\":\"Use local SSDs to improve disk IOPS\",\"C\":\"Host static content on Cloud Storage only al as s\",\"D\":\"Use regional GKE clusters with multi-zone nodes Ef} Cy ret\"},\"correct\":\"D\",\"explanation\":\"Multi-zone regional deployments ensure high availability during zone failures. Startup probes, SSDs, or static hosting alone cannot guarantee SLA compliance across failures.\"},{\"id\":\"164\",\"question\":\"You need to measure business impact by tracking user conversion events. What GCP service best supports this need?\",\"options\":{\"A\":\"Pub/Sub for stream processing of requests\",\"B\":\"Cloud Monitoring with custom business metrics\",\"C\":\"Dataflow with sliding window transforms\",\"D\":\"VPC flow logs exported to BigQuery\"},\"correct\":\"B\",\"explanation\":\"Custom metrics in Cloud Monitoring allow you to track business KPIs like user conversion rates, login success, or purchase flows in near real-time with alerting and dashboards.\"},{\"id\":\"165\",\"question\":\"Your organization wants to reduce VM cost without sacrificing availability. Which recommendation helps achieve this?\",\"options\":{\"A\":\"Use preemptible VMs in a managed instance group\",\"B\":\"Disable autoscaling to reduce overuse\",\"C\":\"Consolidate to a single large VM instance\",\"D\":\"Schedule manual VM shutdowns daily \\\"a\"},\"correct\":\"A\",\"explanation\":\"Preemptible VMs are significantly cheaper and can be used in managed instance groups that automatically replace them upon eviction, maintaining availability with lower cost.\"},{\"id\":\"166\",\"question\":\"A system is experiencing increased latency due to request queuing. What is the most effective approach to improve performance?\",\"options\":{\"A\":\"Schedule requests to run outside peak hours\",\"B\":\"Use smaller instance types for better cost ratio\",\"C\":\"Deploy services in more regions\",\"D\":\"Increase instance capacity with autoscaling enabled Oy £10. 2 4 Fe\"},\"correct\":\"D\",\"explanation\":\"Autoscaling adds instances when demand increases, reducing queuing and improving latency. Scheduling or smaller instances don’t address the capacity issue.\"},{\"id\":\"167\",\"question\":\"A GCP workload intermittently exceeds expected CPU usage, affecting other services. How should you monitor this proactively?\",\"options\":{\"A\":\"Enable billing export to BigQuery\",\"B\":\"Create Cloud Monitoring alerting policies for CPU thresholds\",\"C\":\"Use Cloud Armor to rate-limit the API %, Be\",\"D\":\"Schedule daily reports using BigQuery A) %\"},\"correct\":\"B\",\"explanation\":\"Cloud Monitoring alerting policies detect and notify admins when CPU thresholds are exceeded, enabling proactive responses. Billing or rate-limiting do not address resource contention.\"},{\"id\":\"168\",\"question\":\"To reduce storage costs, a company wants to retain only the last 30 days of logs. hat is the best method to achieve this?\",\"options\":{\"A\":\"Set up a retention policy on the log bucket\",\"B\":\"Export logs to BigQuery with expiration set\",\"C\":\"Use Stackdriver logging without filters BAS\",\"D\":\"Archive logs to Coldline storage without retention ‘ 7\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Configure the log bucket retention period (30 days); Cloud Logging automatically deletes older logs.\\n\\nHow it works:\\n• Logs are stored in log buckets: _Required, _Default, and custom buckets.\\n• _Default retains 30 days by default; retention on _Default and custom buckets is configurable from 1 to 3650 days (beyond 30 days has a cost).\\n• _Required (Admin Activity audit logs, etc.) is fixed: 400 days, at no charge.\\n• To reduce ingest, also use exclusion filters.\\n\\nExam tip: «retain only last N days» → log bucket retention.\\nDo not confuse with: export to BigQuery with expiration (you duplicate storage), «Stackdriver with no filters» (limits nothing and raises cost), Coldline without retention (does not delete).\",\"explanationSource\":\"card-en\"},{\"id\":\"169\",\"question\":\"Which strategy ensures cloud costs are predictable while avoiding service disruption?\",\"options\":{\"A\":\"Enable sustained use discounts and avoid autoscaling\",\"B\":\"Use committed use contracts and monitor utilization\",\"C\":\"Use ephemeral disks and restrict instance access AM se\",\"D\":\"Apply resource quotas and deny usage to developers\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Use committed use discounts (CUDs) for the baseline load and monitor their utilization.\\n\\nHow it works:\\n• You commit for 1 or 3 years (resource-based: vCPU/memory; or spend-based/flexible: hourly spend) in exchange for significant discounts.\\n• You pay the commitment even if you do not use it → monitor utilization in Billing CUD reports.\\n• Usage above the commitment is billed on-demand, so the service is not interrupted.\\n\\nExam tip: «predictable costs» + «avoid disruption» → CUDs + monitoring.\\nDo not confuse with: SUDs without autoscaling (do not make cost predictable), quotas that deny use to developers (cause interruptions), ephemeral disks (irrelevant).\",\"explanationSource\":\"card-en\"},{\"id\":\"171\",\"question\":\"A service requires fast recovery from outages. What architecture improves recovery time objective (RTO) effectively?\",\"options\":{\"A\":\"Deploy active-active services across multiple zones\",\"B\":\"Schedule snapshot backups weekly at midnight\",\"C\":\"Store VM images in different cloud regions\",\"D\":\"Use a larger instance type in the same zone Slay, \\\"\\\", = 2 % TTY = “nw\"},\"correct\":\"A\",\"explanation\":\"Active-active architecture ensures zero downtime during failures, minimizing RTO. Snapshots and larger instances don’t offer immediate recovery capabilities.\"},{\"id\":\"172\",\"question\":\"You want to track the cost of each GKE namespace separately. What is the recommended GCP solution?\",\"options\":{\"A\":\"Create a separate project for every namespace\",\"B\":\"Use labels for resources and analyze billing data\",\"C\":\"Run separate Kubernetes clusters per namespace\",\"D\":\"Configure network tags and export to Pub/Sub Pues oe THA\"},\"correct\":\"B\",\"explanation\":\"Applying labels allows resource-level cost tracking using BigQuery export or Billing Reports. Separate clusters or projects create complexity and are not scalable.\"},{\"id\":\"173\",\"question\":\"An application runs intensive machine learning workloads. How can you reduce cost without changing its structure?\",\"options\":{\"A\":\"Convert the app to App Engine standard environment\",\"B\":\"Schedule jobs only on weekends for lower pricing\",\"C\":\"Migrate to larger general-purpose instances\",\"D\":\"Use preemptible VMs for non-critical training jobs 77 od\"},\"correct\":\"D\",\"explanation\":\"Preemptible VMs cost much less and are ideal for fault-tolerant, batch ML workloads. They don’t require code changes and reduce compute expenses significantly.\"},{\"id\":\"174\",\"question\":\"You want to ensure consistent performance for a database under variable load. What should you implement?\",\"options\":{\"A\":\"Reserve IOPS using object storage metrics\",\"B\":\"Choose zonal persistent disks with automatic resizing\",\"C\":\"Use Cloud Storage with signed URL authentication \u0026 7 avila, —7 _ (ot) CTT \\\"y aes aS “1Ww*\",\"D\":\"Archive old data using Dataflow and scheduler\"},\"correct\":\"B\",\"explanation\":\"Zonal persistent disks with autosizing ensure consistent performance by adapting capacity based on workload. Other solutions are storage-tier dependent or archival focused.\"},{\"id\":\"175\",\"question\":\"Acloud team wants to manage long- term costs for unused resources. Which approach is best?\",\"options\":{\"A\":\"Use Recommender API to find idle or underused assets\",\"B\":\"Auto-increase quotas for projects with low usage\",\"C\":\"Store all VM snapshots indefinitely for safety\",\"D\":\"Replace all instances with higher-cost premium tiers Raf 75 selly Bee ‘ S Te s \u003e\"},\"correct\":\"A\",\"explanation\":\"Recommender API provides actionable insights on cost optimization, such as idle VMs or oversized resources. It enables proactive cleanup and budget management.\"},{\"id\":\"176\",\"question\":\"Your SLA requires 99.95% uptime. What must be part of the design to meet this requirement?\",\"options\":{\"A\":\"Use one large VM with attached SSD disks\",\"B\":\"Select preemptible instances to improve cost\",\"C\":\"Deploy across multiple zones with load balancing\",\"D\":\"Place database and app inthe same region only\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. A 99.95% target means no single zone can be a point of failure. Run instances in several zones (a regional MIG, regional GKE or regional Cloud SQL HA) behind a load balancer. Single-zone instances carry lower SLAs.\\n\\nWhy not the others: A) one VM cannot meet 99.95%. B) preemptible (Spot) VMs can be reclaimed at any time. D) co-locating in one region is fine, but staying in one region does not by itself give multi-zone redundancy.\",\"explanationSource\":\"written\"},{\"id\":\"177\",\"question\":\"Asystem's average memory usage is below 30% across multiple zones. What should you do?\",\"options\":{\"A\":\"Downsize VM instances and monitor impact\",\"B\":\"Add more memory to all instances for reliability\",\"C\":\"Increase instance count for redundancy 4, a\",\"D\":\"Replace memory with GPUs for faster execution villa, RA) “11Ww*\"},\"correct\":\"A\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: A. Consistently low memory use means the VMs are over-provisioned. Rightsize them to smaller or custom machine types (the Recommender suggests sizes) and monitor latency and errors after the change.\\n\\nWhy not the others: B) adding memory increases waste. C) more instances increase cost without need. D) GPUs do not replace memory and are expensive.\",\"explanationSource\":\"written\"},{\"id\":\"178\",\"question\":\"You need to track time spent in each microservice for a user request. What is the most appropriate GCP tool?\",\"options\":{\"A\":\"Cloud Functions with logs export\",\"B\":\"Cloud Trace with custom annotations\",\"C\":\"BigQuery scheduled query metrics\",\"D\":\"Data Catalog with lineage tracking\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Cloud Trace collects distributed traces (via OpenTelemetry), showing spans and latency for each service a request passes through. Custom spans and annotations add business context.\\n\\nWhy not the others: A) function logs do not give per-request timing across services. C) scheduled BigQuery queries are batch analytics. D) Data Catalog (now Dataplex Universal Catalog) lineage tracks data, not requests.\",\"explanationSource\":\"written\"},{\"id\":\"179\",\"question\":\"You want to compare actual versus forecasted GCP spending by department. What is the best way to do this?\",\"options\":{\"A\":\"Enable audit logs and summarize data quarterly\",\"B\":\"Use labels and export billing data to BigQuery\",\"C\":\"Allocate static budgets and avoid dynamic changes\",\"D\":\"Use IAM policies to assign billing administrators\"},\"correct\":\"B\",\"explanation\":\"Partitioning and clustering reduce scanned data per query. This significantly lowers BigQuery cost without affecting output.\"},{\"id\":\"180\",\"question\":\"Your SLA specifies a 1-hour response time for incidents. How can you ensure accountability across the team?\",\"options\":{\"A\":\"Define escalation policies in Cloud Monitoring alerts\",\"B\":\"Manually check logs when a service fails\",\"C\":\"Schedule weekly team check-ins to discuss metrics % = = silly, _ * ew “aw DP icarst oa Ti Oe Sy\",\"D\":\"Use Pub/Sub to queue incidents for later review\"},\"correct\":\"A\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: A. Alert policies with notification channels and severity, routed to on-call rotations and escalation (for example through PagerDuty integration), ensure someone owns every incident within the 1-hour SLA.\\n\\nWhy not the others: B) manual log checks are reactive and unowned. C) weekly check-ins are too slow. D) queuing incidents for later review breaks the response-time commitment.\",\"explanationSource\":\"written\"},{\"id\":\"181\",\"question\":\"A developer notices fluctuating API performance. What's the first step to identifying root cause?\",\"options\":{\"A\":\"Increase API replica count across the board\",\"B\":\"Use Cloud Trace to identify latency hotspots\",\"C\":\"Enable budget alerts to detect surges\",\"D\":\"Switch API backend to Cloud Functions\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Diagnose before acting. Cloud Trace shows which span (database call, downstream API, cold start) adds latency, so you fix the real hotspot.\\n\\nWhy not the others: A) adding replicas blindly may not help and costs money. C) budget alerts track spend. D) migrating the backend is a large change with no diagnosis behind it.\",\"explanationSource\":\"written\"},{\"id\":\"182\",\"question\":\"An analytics team wants historical insights on query cost. Which service should they use?\",\"options\":{\"A\":\"Cloud SQL with read replicas\",\"B\":\"BigQuery export with billing data in tables\",\"C\":\"GCS versioning and archiving\",\"D\":\"VPC Flow Logs for traffic analytics\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Export Cloud Billing data to BigQuery (standard or detailed usage cost tables). Combined with INFORMATION_SCHEMA.JOBS (bytes billed per query and user), it gives historical, queryable insight into query cost.\\n\\nWhy not the others: A) Cloud SQL replicas are for OLTP reads. C) GCS versioning is object history. D) VPC Flow Logs analyze network traffic, not query cost.\",\"explanationSource\":\"written\"},{\"id\":\"183\",\"question\":\"What is a key benefit of using custom metrics for KPIs in Cloud Monitoring?\",\"options\":{\"A\":\"You can define specific business logic and thresholds\",\"B\":\"You can avoid alerting and focus on storage only\",\"C\":\"It avoids the need for IAM roles or service accounts\",\"D\":\"Custom metrics cost less than standard system logs\"},\"correct\":\"A\",\"explanation\":\"Multi-zone deployment with load balancing provides fault tolerance and availability required to meet 99.95% SLA. Single-zone setups are vulnerable to regional outages.\"},{\"id\":\"184\",\"question\":\"A batch process is idle for 6 hours a day. What is a cost-efficient way to run this on Compute Engine?\",\"options\":{\"A\":\"Increase vCPUs to complete faster\",\"B\":\"Use Cloud Scheduler to shut down VMs off-hours\",\"C\":\"Migrate to larger persistent disks\",\"D\":\"Create multiple VPCs for traffic isolation ann lly avila, ll, TT pause\"},\"correct\":\"B\",\"explanation\":\"Shutting down VMs when not in use prevents unnecessary billing. Scheduling via Cloud Scheduler ensures automation and consistency.\"},{\"id\":\"185\",\"question\":\"A team wants to avoid vendor lock-in while ensuring scalability. What is the best design principle?\",\"options\":{\"A\":\"Use open-source frameworks and managed services\",\"B\":\"Use proprietary APIs for cloud-native scaling\",\"C\":\"Optimize for single-region deployment only\",\"D\":\"Use monolithic apps hosted in Compute Engine\"},\"correct\":\"A\",\"explanation\":\"Open-source and managed services reduce lock-in while retaining portability and scalability. Avoiding proprietary APIs and tightly coupled systems supports this goal.\"},{\"id\":\"186\",\"question\":\"An e-commerce app must scale during sales events. What GCP strategy supports this without constant overprovisioning?\",\"options\":{\"A\":\"Use Cloud Storage and migrate app to Python\",\"B\":\"Add more load balancers to improve performance\",\"C\":\"Schedule batch jobs in off-peak hours\",\"D\":\"Implement autoscaling based on CPU or request load %, slay, ', = 2 % TIN “iw\"},\"correct\":\"D\",\"explanation\":\"Correct answer: D. Autoscaling based on CPU or request load (MIG, GKE, or serverless).\\n\\nHow it works:\\n• It scales out when traffic rises and reduces instances when it falls → you pay only for what you need.\\n• For known peaks (e.g. Black Friday), combine with scaling schedules or a higher minimum instance count, because creating VMs takes time.\\n• Review regional quotas before the event.\\n\\nExam tip: «sales events» + «without overprovisioning» → autoscaling.\\nDo not confuse with: migrating to Python/Cloud Storage (nonsensical), more load balancers (one global LB already scales), batch off-peak (does not apply to user traffic).\",\"explanationSource\":\"card-en\"},{\"id\":\"188\",\"question\":\"You need to monitor how long an order processing system takes per transaction. hich approach helps most?\",\"options\":{\"A\":\"Enable API gateway request validation\",\"B\":\"Store data in cold storage for faster reads\",\"C\":\"Use Cloud Trace to measure end-to-end latency\",\"D\":\"Migrate from BigQuery to Cloud SQL for speed\"},\"correct\":\"C\",\"explanation\":\"Cloud Trace helps measure and visualize transaction latency from initiation to completion. It's ideal for monitoring business-critical time-based KPIs.\"},{\"id\":\"189\",\"question\":\"What is the best way to reduce long- term Cloud Storage costs for archived audit logs?\",\"options\":{\"A\":\"Use standard class and apply lifecycle retention\",\"B\":\"Transition older logs to Archive class with rules\",\"C\":\"Enable versioning and replicate across regions\",\"D\":\"Store logs in persistent disks for compliance “iw\"},\"correct\":\"B\",\"explanation\":\"The Archive storage class is optimized for long- term, rarely accessed data like audit logs. Lifecycle rules automate transitions to minimize cost.\"},{\"id\":\"190\",\"question\":\"You want to measure how effectively our team resolves incidents. Which metric should you track?\",\"options\":{\"A\":\"CPU utilization percentage\",\"B\":\"Mean time to resolution (MTTR) for alerts\",\"C\":\"Number of load-balanced backends 7s\",\"D\":\"Number of users accessing logs per week\"},\"correct\":\"B\",\"explanation\":\"MTTR is a key performance indicator for incident response efficiency. It helps evaluate the effectiveness of monitoring and team response strategies.\"},{\"id\":\"191\",\"question\":\"A finance team wants alerts when spending exceeds a threshold. What is the GCP-native solution?\",\"options\":{\"A\":\"IAM budget viewer roles\",\"B\":\"Budget alerts with email and Pub/Sub triggers\",\"C\":\"Cloud DNS billing rules and log sinks\",\"D\":\"Cloud Run triggers and billing history download\"},\"correct\":\"B\",\"explanation\":\"GCP Budget alerts can be configured to trigger notifications or Pub/Sub messages when spending approaches or exceeds set thresholds.\"},{\"id\":\"192\",\"question\":\"What Cloud Monitoring metric indicates whether autoscaling is working as expected?\",\"options\":{\"A\":\"Number of active instances during peak traffic\",\"B\":\"Uptime checks passing without delay\",\"C\":\"Load balancer IP reuse rate\",\"D\":\"Static quota allocations for projects\"},\"correct\":\"A\",\"explanation\":\"Monitoring active instances allows you to verify scaling activity during load changes. It ensures the autoscaler behaves as configured.\"},{\"id\":\"193\",\"question\":\"What GCP solution allows you to trace memory leaks in a Python web app?\",\"options\":{\"A\":\"Stackdriver Logging with BigQuery export\",\"B\":\"App Engine flexible environment autoscaler\",\"C\":\"Cloud Profiler with memory heap snapshots\",\"D\":\"Cloud Run concurrency monitoring\"},\"correct\":\"C\",\"explanation\":\"Downsizing reduces cost without sacrificing performance. Monitoring ensures the app remains within acceptable memory thresholds post-change.\"},{\"id\":\"194\",\"question\":\"A GKE workload is overprovisioned. What change optimizes cost?\",\"options\":{\"A\":\"Lower pod resource requests and set autoscaling thresholds\",\"B\":\"Increase nodes to spread traffic\",\"C\":\"Add more pods for higher latency\",\"D\":\"Switch to on-demand GPUs for compute speed\"},\"correct\":\"A\",\"explanation\":\"Lowering unnecessary resource requests helps fit more pods per node and reduces cluster cost. Autoscaling ensures scaling when needed.\"},{\"id\":\"195\",\"question\":\"A service is failing intermittently, and logs are too noisy. What should you do first?\",\"options\":{\"A\":\"Restart all services in the environment\",\"B\":\"Disable non-critical alerting rules\",\"C\":\"Filter logs and create severity-based alerts\",\"D\":\"Schedule regular service restarts overnight\"},\"correct\":\"C\",\"explanation\":\"Filtering logs and applying severity-based alerts helps focus on meaningful incidents and avoid alert fatigue while still maintaining visibility.\"},{\"id\":\"196\",\"question\":\"What KPI helps assess how often your system fails?\",\"options\":{\"A\":\"User login rate\",\"B\":\"Mean time between failures (MTBF)\",\"C\":\"Log export volume sy,\",\"D\":\"Percentage of preemptible VMs used 2.19.5\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. MTBF (mean time between failures): average operating time between one failure and the next. Higher MTBF = less frequent failures.\\n\\nHow it works:\\n• MTBF = total operating time / number of failures.\\n• Together with MTTR it determines availability: ≈ MTBF / (MTBF + MTTR).\\n\\nExam tip: «how often system fails» → MTBF.\\nDo not confuse with: login rate (usage/business metric), log-export volume, % of preemptible VMs (cost).\",\"explanationSource\":\"card-en\"},{\"id\":\"198\",\"question\":\"What helps measure the impact of a Cloud Function on overall latency?\",\"options\":{\"A\":\"Export logs to BigQuery\",\"B\":\"Enable Cloud Trace to view request duration\",\"C\":\"Attach debugger for live execution trace\",\"D\":\"Upgrade to GKE for more observability\"},\"correct\":\"B\",\"explanation\":\"Cloud Trace can capture performance metrics like latency, helping pinpoint how a Cloud Function contributes to overall system delay.\"},{\"id\":\"199\",\"question\":\"You're evaluating cloud cost savings after applying autoscaling. What metric should you review?\",\"options\":{\"A\":\"Total disk IOPS across projects\",\"B\":\"Total user logins per instance\",\"C\":\"Average VM utilization across autoscaled groups\",\"D\":\"Number of deleted snapshots by policy\"},\"correct\":\"C\",\"explanation\":\"Average VM utilization shows how efficiently resources are used. Higher utilization after autoscaling means improved cost efficiency.\"},{\"id\":\"200\",\"question\":\"A dashboard shows a spike in memory usage for a backend service. What action helps most?\",\"options\":{\"A\":\"Move the service to another availability zone\",\"B\":\"Restart all services nightly\",\"C\":\"Review code with Cloud Profiler and adjust memory usage\",\"D\":\"Increase CPU quota and expand disk size % o\"},\"correct\":\"C\",\"explanation\":\"Cloud Profiler reveals code-level memory usage and leaks. Optimizing memory at the code level reduces overprovisioning and prevents instability.\"},{\"id\":\"201\",\"question\":\"A team needs to monitor SLA violations for an external dependency. What is the right method?\",\"options\":{\"A\":\"Create uptime checks and alert on response failures\",\"B\":\"Enable Cloud DNS logs and summarize usage\",\"C\":\"Export IAM policy logs to Pub/Sub\",\"D\":\"Schedule weekly log archive analysis\"},\"correct\":\"A\",\"explanation\":\"Uptime checks actively monitor endpoints and generate alerts on failures, helping track SLA adherence of external services.\"},{\"id\":\"202\",\"question\":\"A data pipeline fails every 4 hours due to timeouts. What helps improve its stability?\",\"options\":{\"A\":\"Switch to preemptible instances\",\"B\":\"Add retries and increase timeout thresholds\",\"C\":\"Reduce pipeline steps to improve cost\",\"D\":\"Move the pipeline to a new VPC aa Mes “ain\"},\"correct\":\"B\",\"explanation\":\"Retry logic and optimized timeout settings increase fault tolerance for intermittent failures, improving pipeline reliability.\"},{\"id\":\"203\",\"question\":\"A service sends too many alerts at low severity. What strategy improves alert quality?\",\"options\":{\"A\":\"Group alerts and apply severity thresholds\",\"B\":\"Migrate services to Cloud Functions\",\"C\":\"Turn off all monitoring during business hours\",\"D\":\"Disable logging to reduce alert load 214° Fy rane? ~ “nw\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Group related alerts and apply severity thresholds so only what matters notifies urgently.\\n\\nHow it works:\\n• Assign severity (critical, error, warning) to each alerting policy and route to different channels (PagerDuty vs email/chat).\\n• Use duration windows and realistic thresholds so brief spikes do not alert.\\n• Prefer alerting on user-visible symptoms (SLOs, burn rate) instead of every cause.\\n\\nExam tip: «too many low-severity alerts» / alert fatigue → group + severity.\\nDo not confuse with: migrating to Cloud Functions (does not change alerts), turning off monitoring or logging (you lose visibility).\",\"explanationSource\":\"card-en\"},{\"id\":\"204\",\"question\":\"A cost analysis shows high network egress from Cloud Storage. What can reduce charges?\",\"options\":{\"A\":\"Increase Cloud NAT throughput\",\"B\":\"Add signed URLs to public buckets\",\"C\":\"Use Cloud CDN for frequently accessed content\",\"D\":\"Move storage to persistent disks instead % Pea aS Ti s 'e\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Put Cloud CDN (on an external Application Load Balancer with a backend bucket) in front of frequently accessed content.\\n\\nHow it works:\\n• Content is cached at Google's edge, near users; cache hits do not leave the bucket.\\n• Cloud CDN cache egress is usually cheaper than Cloud Storage egress straight to the internet, and it also lowers latency.\\n• Configure Cache-Control/TTL to maximize the cache hit ratio.\\n\\nExam tip: «high egress» + «frequently accessed content» → Cloud CDN.\\nDo not confuse with: Cloud NAT (outbound internet from private VMs), signed URLs (access control, do not reduce egress), persistent disks (do not serve public content and are more expensive).\",\"explanationSource\":\"card-en\"},{\"id\":\"205\",\"question\":\"What metric is most useful for understanding how quickly your team addresses incidents?\",\"options\":{\"A\":\"Cloud Logging ingestion rate\",\"B\":\"Mean time to acknowledge (MTTA)\",\"C\":\"Stackdriver uptime check frequency\",\"D\":\"Number of alerts disabled\"},\"correct\":\"B\",\"explanation\":\"MTTA measures how fast alerts are acknowledged, which is a leading indicator of incident responsiveness and team efficiency.\"},{\"id\":\"206\",\"question\":\"Your app performance degrades under load. What should you do first?\",\"options\":{\"A\":\"Add static IPs to all services\",\"B\":\"Use Cloud Trace to identify slow dependencies SMI,\",\"C\":\"Archive logs to save memory\",\"D\":\"Deploy app in a single-zone VPC TTT Gy ee “1nWw*\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Use Cloud Trace to identify which dependencies (services, databases, external APIs) are slow.\\n\\nHow it works:\\n• Diagnose first: the trace shows which span grows when load increases.\\n• Then act on the real bottleneck (indexes, cache, scale that component).\\n\\nExam tip: «what should you do first» + degradation → diagnose with Trace before changing infrastructure.\\nDo not confuse with: static IPs (do not affect performance), archiving logs (does not free app memory), single-zone (reduces availability).\",\"explanationSource\":\"card-en\"},{\"id\":\"207\",\"question\":\"A company needs to track spend by business unit. What’s the scalable GCP-native way?\",\"options\":{\"A\":\"Use service accounts for each team\",\"B\":\"Label resources and analyze billing via BigQuery\",\"C\":\"Restrict IAM permissions for cost visibility 42)\",\"D\":\"Export billing to Google Sheets daily sly\"},\"correct\":\"B\",\"explanation\":\"Labels allow logical grouping of resources. Combined with billing export to BigQuery, this enables cost attribution by team or function.\"},{\"id\":\"209\",\"question\":\"What is the best metric to track user- facing downtime of your public application?\",\"options\":{\"A\":\"Number of log entries with warnings\",\"B\":\"Uptime check failure rate over time\",\"C\":\"Disk utilization percentage\",\"D\":\"Average bytes sent per second “iw\"},\"correct\":\"B\",\"explanation\":\"Uptime checks simulate user interactions and detect public downtime. This makes them the best indicator of real availability issues.\"},{\"id\":\"210\",\"question\":\"Your compute environment is underutilized 70% of the time. What is the best action?\",\"options\":{\"A\":\"Use autoscaling and downsize instance types\",\"B\":\"Disable monitoring agents for performance\",\"C\":\"Increase network bandwidth for balance s 1\",\"D\":\"Add disk snapshots to reduce latency 13: eS aii\"},\"correct\":\"A\",\"explanation\":\"Autoscaling and right-sizing instance types align resources with demand, improving utilization and reducing unnecessary cost.\"},{\"id\":\"211\",\"question\":\"A business KPI measures checkout success rate. What GCP solution can track this?\",\"options\":{\"A\":\"VPC flow logs and export to BigQuery\",\"B\":\"Cloud Armor for HTTP rule enforcement\",\"C\":\"Custom metrics in Cloud Monitoring with alerting\",\"D\":\"App Engine debug logs and daily review\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Emit the checkout success rate as a custom or log-based metric in Cloud Monitoring, chart it, define an SLO and alert on drops. That turns a business KPI into a monitored signal.\\n\\nWhy not the others: A) VPC flow logs record network flows, not business outcomes. B) Cloud Armor is a WAF. D) reviewing debug logs daily is too slow and manual.\",\"explanationSource\":\"written\"},{\"id\":\"212\",\"question\":\"Which strategy reduces inter-zone latency in a multi-zone deployment?\",\"options\":{\"A\":\"Move all services to one single zone\",\"B\":\"Use zonal affinity and optimized load balancing\",\"C\":\"Export traffic logs to BigQuery\",\"D\":\"Schedule resource creation outside peak hours LL) RQ s hentes “Ss Ts\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Keeping traffic in the same zone when possible (zonal affinity, locality-aware load balancing such as the Service Mesh or GKE topology-aware routing) avoids unnecessary cross-zone hops, which lowers both latency and inter-zone egress cost.\\n\\nWhy not the others: A) a single zone removes high availability. C) exporting logs does not change routing. D) scheduling resource creation is unrelated to latency.\",\"explanationSource\":\"written\"},{\"id\":\"213\",\"question\":\"Your SLAs include latency and availability metrics. What tools help validate these?\",\"options\":{\"A\":\"Use Pub/Sub to track dropped messages\",\"B\":\"Enable audit logs across all APIs\",\"C\":\"Combine uptime checks with Cloud Trace\",\"D\":\"Store logs in Archive and review quarterly\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Uptime checks probe availability from multiple global locations, and Cloud Trace measures request latency and its distribution. Together, plus SLO monitoring, they validate both SLA dimensions.\\n\\nWhy not the others: A) dropped messages are a narrow metric. B) audit logs record who did what, not SLA performance. D) quarterly reviews of archived logs are far too late.\",\"explanationSource\":\"written\"},{\"id\":\"214\",\"question\":\"An engineer requests access to view cloud costs. What is the appropriate action?\",\"options\":{\"A\":\"Make them a project owner temporarily\",\"B\":\"Assign Billing Viewer IAM role on the billing account\",\"C\":\"Share monthly reports manually as PDFs\",\"D\":\"Create a duplicate billing account for read-only view\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Grant Billing Account Viewer (roles/billing.viewer) on the billing account. The engineer can see costs and reports and can change nothing, which is least privilege.\\n\\nWhy not the others: A) Project Owner is excessive. C) PDFs are manual and stale. D) a duplicate billing account does not show the real costs.\",\"explanationSource\":\"written\"},{\"id\":\"215\",\"question\":\"You want to forecast cloud spend growth based on trends. Which solution supports this?\",\"options\":{\"A\":\"Use BigQuery billing export and Data Studio dashboards\",\"B\":\"Enable firewall rules to isolate usage\",\"C\":\"Configure multi-region deployments with no quotas\",\"D\":\"Run manual queries monthly on Stackdriver logs\"},\"correct\":\"A\",\"explanation\":\"BigQuery billing data supports time-series analysis, and Data Studio enables visual trend forecasting based on usage patterns.\"},{\"id\":\"217\",\"question\":\"What KPI best measures operational efficiency of your cloud environment?\",\"options\":{\"A\":\"Number of support tickets created\",\"B\":\"Total billing exports downloaded\",\"C\":\"Cost per transaction or cost per user session\",\"D\":\"Number of IAM policy bindings created qull “1nWw* Sy, “ay\"},\"correct\":\"C\",\"explanation\":\"Cost per transaction directly relates to efficiency by showing how much is spent to deliver value. It is a meaningful KPI in cloud ops.\"},{\"id\":\"218\",\"question\":\"What is a valid method to reduce GKE cost during low usage?\",\"options\":{\"A\":\"Enable node auto-provisioning with autoscaler\",\"B\":\"Add fixed memory reservations for all pods\",\"C\":\"Move nodes to always-on standard class\",\"D\":\"Allocate separate clusters for dev and prod\"},\"correct\":\"A\",\"explanation\":\"Custom metrics let you define and track business-level outcomes, like conversion or checkout success, with dashboards and alerts.\"},{\"id\":\"219\",\"question\":\"What best describes a good practice for tracking service-level indicators (SLIs)?\",\"options\":{\"A\":\"Use Cloud NAT for traffic shaping\",\"B\":\"Create custom dashboards with availability metrics\",\"C\":\"Increase disk quota to avoid alerts\",\"D\":\"Disable alerts for minor latency variations end\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. SLIs (for example availability = good requests / total, or latency percentiles) should be computed from metrics and shown on Cloud Monitoring dashboards and SLOs, so trends and error budgets are visible.\\n\\nWhy not the others: A) Cloud NAT is networking. C) raising disk quota to avoid alerts hides problems. D) suppressing latency alerts reduces visibility.\",\"explanationSource\":\"written\"},{\"id\":\"220\",\"question\":\"A team deploys services without cleanup. What policy helps control cost?\",\"options\":{\"A\":\"Apply labels and use Recommender for cleanup\",\"B\":\"Schedule snapshot duplication to all regions\",\"C\":\"Enable persistent disks on all instances\",\"D\":\"Restrict team access to billing console only\"},\"correct\":\"A\",\"explanation\":\"Labels make cost tracking easy, and Recommender surfaces underused resources. This combination reduces waste and controls spending.\"},{\"id\":\"221\",\"question\":\"What metric best reflects app usability from a user's perspective?\",\"options\":{\"A\":\"Percentage of disk usage by logging agents\",\"B\":\"Average response time for successful requests\",\"C\":\"Number of container restarts in Kubernetes\",\"D\":\"Count of firewall rules across all projects 12):\"},\"correct\":\"B\",\"explanation\":\"Average response time directly affects user experience. It reflects the system’s ability to serve requests quickly and efficiently.\"},{\"id\":\"222\",\"question\":\"A critical service must not drop below 99.95% uptime. What should be included in the design?\",\"options\":{\"A\":\"Deploy on one large instance with persistent disk\",\"B\":\"Use regional GKE clusters with autoscaling enabled\",\"C\":\"Convert the app to preemptible Compute Engine VMs\",\"D\":\"Limit service to a single private subnet for security\"},\"correct\":\"B\",\"explanation\":\"Regional GKE with autoscaling supports multi- zone redundancy and demand-based resource management, crucial for SLA adherence.\"},{\"id\":\"223\",\"question\":\"What is the most appropriate strategy to ensure reliability when deploying a new microservice to production?\",\"options\":{\"A\":\"Deploy the service to all instances simultaneously for consistency\",\"B\":\"Use a rolling update strategy across instances to minimize downtime\",\"C\":\"Force a blue/green switch to test service failover mechanisms\",\"D\":\"Use random canary deployments without rollback mechanisms .\"},\"correct\":\"B\",\"explanation\":\"A rolling update allows you to update instances gradually, reducing risk of downtime or system-wide failure. Canary deployments are often used, but a rolling update is broader and safer for most production releases.\"},{\"id\":\"224\",\"question\":\"Which of the following is a Google Cloud native service that enables monitoring, logging, and alerting?\",\"options\":{\"A\":\"App Engine Task Queues\",\"B\":\"GKE Autoscaler\",\"C\":\"Cloud Operations suite\",\"D\":\"Cloud Endpoints Gateway\"},\"correct\":\"C\",\"explanation\":\"The Cloud Operations suite (formerly Stackdriver) provides tools for observability, including logging, monitoring, tracing, error reporting, and alerting, and is essential for solution reliability.\"},{\"id\":\"225\",\"question\":\"A company uses multiple Compute Engine instances and wants to be notified when CPU usage exceeds 80% for more than 5 minutes. What should you configure?\",\"options\":{\"A\":\"Use Identity-Aware Proxy with runtime alerting\",\"B\":\"Write a custom Python script and run it via cron jobs\",\"C\":\"Create a metric-based alerting policy in Cloud Monitoring yy TIT\",\"D\":\"Enable autoscaling with predictive metrics in BigQueryé 3: Cus _ ¢,** ra ( Pte “aw\"},\"correct\":\"C\",\"explanation\":\"Cloud Monitoring allows you to define alert policies on metrics like CPU utilization with thresholds and notification channels.\"},{\"id\":\"226\",\"question\":\"Which strategy best ensures zero downtime deployment in a highly available GKE application?\",\"options\":{\"A\":\"Use blue/green deployments with managed load balancing\",\"B\":\"Manually copy container images to all regions\",\"C\":\"Terminate old pods before scheduling new ones\",\"D\":\"Create multiple clusters without synchronization \u0026 1 snes \u003e co “ef Ti a SY\"},\"correct\":\"A\",\"explanation\":\"Blue/green deployments allow traffic to switch seamlessly between old and new versions with minimal disruption, especially when backed by a load balancer.\"},{\"id\":\"227\",\"question\":\"Which of the following methods provides proactive reliability for data- intensive applications in GCP?\",\"options\":{\"A\":\"Schedule frequent manual backups to local disks\",\"B\":\"Use snapshot schedules and replication with regional storage\",\"C\":\"Increase cache size without redundancy\",\"D\":\"Reduce disk size to limit latency\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Snapshot schedules (automatic backups) and replication with regional storage (e.g. Regional Persistent Disk).\\n\\nHow it works:\\n• Snapshot schedule: a resource policy with frequency and retention; incremental snapshots stored in a regional or multi-regional location.\\n• Regional PD replicates synchronously across 2 zones → failover on zonal failure with no data loss.\\n• For regional DR: Persistent Disk Asynchronous Replication to another region.\\n\\nExam tip: «proactive» + «data-intensive» → scheduled snapshots + replication.\\nDo not confuse with: manual backups to local disks (lost with the VM), cache without redundancy, smaller disks (less performance).\",\"explanationSource\":\"card-en\"},{\"id\":\"228\",\"question\":\"What is the purpose of Cloud Logging in operational reliability?\",\"options\":{\"A\":\"Executes SQL queries across regions\",\"B\":\"Scans GCP resources for vulnerabilities\",\"C\":\"Encrypts data during transfer\",\"D\":\"Aggregates logs for monitoring, alerting, and auditing la, ened. RL —s TT K\\\\ = on oan “1Ww*\"},\"correct\":\"D\",\"explanation\":\"Zonal affinity and intelligent load balancing reduce inter-zone communication. This minimizes latency and improves service response times.\"},{\"id\":\"229\",\"question\":\"What feature in GCP ensures that Kubernetes workloads are automatically restarted if a node fails?\",\"options\":{\"A\":\"IAM role-based scheduling\",\"B\":\"GKE node auto-repair and pod rescheduling\",\"C\":\"Resource reservations in Dataflow pipelines\",\"D\":\"Persistent disk caching in Cloud Spanner ey\"},\"correct\":\"B\",\"explanation\":\"GKE has node auto-repair and Kubernetes automatically reschedules pods to healthy nodes, enhancing workload reliability.\"},{\"id\":\"230\",\"question\":\"Which Google Cloud service allows tracking of API request latency for microservices?\",\"options\":{\"A\":\"Cloud Source Repositories\",\"B\":\"Memorystore for Redis\",\"C\":\"Cloud Identity\",\"D\":\"Cloud Trace\"},\"correct\":\"D\",\"explanation\":\"Cloud Trace is used for performance tracing and latency analysis across distributed applications, helping to optimize performance.\"},{\"id\":\"231\",\"question\":\"What should you use to notify operations teams about incidents in real- time?\",\"options\":{\"A\":\"Cloud DNS zones\",\"B\":\"Cloud Monitoring alerting policies with notification channels\",\"C\":\"Billing export to BigQuery\",\"D\":\"IAM condition expressions aM, \\\", = 2 4 TFN “ai\"},\"correct\":\"B\",\"explanation\":\"Cloud Monitoring supports alerting policies that send notifications to email, SMS, PagerDuty, or other integrated services for real-time incident response.\"},{\"id\":\"232\",\"question\":\"How can you reduce Mean Time to Recovery (MTTR) in a distributed system?\",\"options\":{\"A\":\"Restrict change deployment to once monthly\",\"B\":\"Avoid synthetic testing of application uptime\",\"C\":\"Implement structured logging and runbook automation\",\"D\":\"Use encrypted snapshots only for audit logs 47) WL Os\"},\"correct\":\"C\",\"explanation\":\"Structured logging enables faster issue diagnosis, while runbooks provide automated, repeatable recovery procedures to reduce MT TR.\"},{\"id\":\"233\",\"question\":\"How does implementing service-level objectives (SLOs) support reliability?\",\"options\":{\"A\":\"Enables budgeting of network costs across zones\",\"B\":\"Sets measurable goals to track availability and latency targets\",\"C\":\"Replaces the need for alerts and dashboards entirely\",\"D\":\"Prevents need for infrastructure autoscaling\"},\"correct\":\"B\",\"explanation\":\"SLOs define reliability targets (e.g., uptime, response time), which help monitor performance against agreed standards and drive reliability practices.\"},{\"id\":\"234\",\"question\":\"What role does Cloud Scheduler play in ensuring operational reliability?\",\"options\":{\"A\":\"Offers serverless RESTful APIs\",\"B\":\"Automates periodic tasks like backups and health checks\",\"C\":\"Monitors DNS propagation time\",\"D\":\"Encrypts logs at rest\"},\"correct\":\"B\",\"explanation\":\"Cloud Scheduler automates job execution on a recurring schedule, ensuring critical tasks such as backup and cleanup are consistently performed.\"},{\"id\":\"235\",\"question\":\"What can you use to perform health checks on backend services behind a load balancer?\",\"options\":{\"A\":\"Use TCP or HTTP health checks in load balancing configuration\",\"B\":\"Poll IAM audit logs for traffic errors\",\"C\":\"Check for failed login attempts in BigQuery\",\"D\":\"Use Pub/Sub retry messages with no expiration \\\"4 Se\"},\"correct\":\"A\",\"explanation\":\"Load balancers in GCP support health checks (HTTP, HTTPS, TCP, SSL) to ensure only healthy instances serve traffic, which improves reliability.\"},{\"id\":\"236\",\"question\":\"Why is regional redundancy important in reliability design?\",\"options\":{\"A\":\"It increases billing complexity\",\"B\":\"It ensures availability if one region becomes unavailable\",\"C\":\"It eliminates the need for backups\",\"D\":\"It allows auto-scaling based on CPU only\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Because it keeps the service available if an entire region goes down.\\n\\nHow it works:\\n• Deploy in 2+ regions behind a global external Application Load Balancer (anycast IP) that routes to the nearest healthy region.\\n• Data replicated across regions: multi-region Spanner, dual/multi-region buckets, Cloud SQL cross-region replicas, Bigtable replication.\\n• It costs more: use it according to the required RTO/RPO.\\n\\nExam tip: «region becomes unavailable» → multi-region.\\nDo not confuse with: «it increases billing complexity» (not a benefit), «it eliminates backups» (false), CPU-only autoscaling.\",\"explanationSource\":\"card-en\"},{\"id\":\"237\",\"question\":\"Which service provides long-term reliability by retaining historical logs?\",\"options\":{\"A\":\"Identity-Aware Proxy\",\"B\":\"Cloud Composer\",\"C\":\"Cloud Shell\",\"D\":\"Cloud Logging with log retention policies AL Cie\"},\"correct\":\"D\",\"explanation\":\"Cloud Logging allows configuration of log retention policies to meet compliance and operational needs, supporting forensics and diagnostics.\"},{\"id\":\"238\",\"question\":\"Which GCP feature best reduces the impact of configuration drift in infrastructure?\",\"options\":{\"A\":\"Use Infrastructure as Code with Cloud Deployment Manager or Terraform\",\"B\":\"Rely on manually updated documentation\",\"C\":\"Set up remote SSH for all changes\",\"D\":\"Clone VMs and apply custom scripts manually Ryan\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Infrastructure as Code (IaC) with Terraform (or Infrastructure Manager, which runs Terraform as a managed service).\\n\\nHow it works:\\n• Desired state lives in versioned files; terraform plan detects differences (drift) against what exists.\\n• Changes go through review and a pipeline, not the console or SSH.\\n• Re-applying restores the expected configuration.\\n\\nExam tip: «configuration drift» → IaC.\\nDo not confuse with: manual documentation (goes stale), remote SSH for every change, or cloning VMs with hand scripts (they create drift).\",\"explanationSource\":\"card-en\"},{\"id\":\"240\",\"question\":\"What is the best GCP solution for isualizing service health and metrics across projects?\",\"options\":{\"A\":\"Use GKE logs only\",\"B\":\"Monitor logs in Cloud Shell\",\"C\":\"Use Cloud Monitoring Dashboards with custom metrics Ou\",\"D\":\"Export data to Sheets using App Script Posen “iw\"},\"correct\":\"C\",\"explanation\":\"Dashboards in Cloud Monitoring help visualize key performance indicators and track reliability metrics across services and projects.\"},{\"id\":\"241\",\"question\":\"How do GCP Uptime Checks support solution reliability?\",\"options\":{\"A\":\"Offer multi-region backups\",\"B\":\"Regularly verify service availability from global locations\",\"C\":\"Increase network throughput si,\",\"D\":\"Provide IAM policy management Set TIT\"},\"correct\":\"B\",\"explanation\":\"Uptime checks simulate external traffic to your services from multiple locations to detect outages and initiate alerting quickly.\"},{\"id\":\"242\",\"question\":\"How can you maintain configuration integrity in production?\",\"options\":{\"A\":\"Run manual CLI updates as needed\",\"B\":\"Use version-controlled IaC pipelines with review and testing\",\"C\":\"Disable audit logging to prevent overhead really\",\"D\":\"Schedule frequent SSH changes to configs riers BRS Ts a Y\"},\"correct\":\"B\",\"explanation\":\"Configuration stored in version-controlled IaC allows peer review, testing, rollback, and consistency across environments.\"},{\"id\":\"243\",\"question\":\"What strategy helps ensure consistent rollback in CI/CD pipelines?\",\"options\":{\"A\":\"Maintain versioned artifacts and define rollback steps in pipelines\",\"B\":\"Use load balancer logs to determine rollback\",\"C\":\"Write firewall rules to block changes\",\"D\":\"Use a different pipeline per developer % WUT 77 =a io i) CTT \\\\a opr TTT Node\"},\"correct\":\"A\",\"explanation\":\"A robust CI/CD pipeline includes tested rollback procedures with versioned releases, minimizing recovery time and ensuring reliability.\"},{\"id\":\"244\",\"question\":\"Which GCP product integrates deeply with Cloud Monitoring for alert visualization?\",\"options\":{\"A\":\"Cloud Armor\",\"B\":\"Incident Response Management\",\"C\":\"BigQuery ML\",\"D\":\"App Engine Tasks\"},\"correct\":\"B\",\"explanation\":\"IRM provides a view of alerts, timelines, and resolution tracking, helping teams understand and act on system issues quickly.\"},{\"id\":\"245\",\"question\":\"How does autoscaling contribute to operational reliability?\",\"options\":{\"A\":\"It reduces billing by limiting usage\",\"B\":\"Automatically adjusts resources to match demand and maintain performance\",\"C\":\"It blocks traffic during high usage\",\"D\":\"It logs firewall policy changes ?, ~ “11Ww*\"},\"correct\":\"B\",\"explanation\":\"Autoscaling prevents overloading services by dynamically adjusting capacity based on actual usage, keeping performance stable.\"},{\"id\":\"247\",\"question\":\"Which approach best supports reliability for batch jobs that must complete within defined time windows?\",\"options\":{\"A\":\"Launch jobs manually from Cloud Console each time\",\"B\":\"Use Cloud Scheduler to trigger Cloud Functions with retries\",\"C\":\"Use Cloud Build to trigger jobs based on Git pushes\",\"D\":\"Embed the logic into App Engine standard environment ‘\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Cloud Scheduler starts the job on time, and its retry configuration (plus idempotent jobs) recovers from transient failures. The batch then completes within its window without anyone launching it. For multi-step jobs, Workflows or Cloud Run jobs add orchestration.\\n\\nWhy not the others: A) manual launches are unreliable. C) Git pushes are not a time-based trigger. D) App Engine standard request deadlines are poorly suited to long batch jobs.\",\"explanationSource\":\"written\"},{\"id\":\"248\",\"question\":\"You want to monitor availability and performance of your APIs running in App Engine. What should you use?\",\"options\":{\"A\":\"Create custom shell scripts and run via Compute Engine\",\"B\":\"Enable billing logs and filter for error traffic\",\"C\":\"Use Cloud Monitoring uptime checks and alert policies\",\"D\":\"Enable SSH access and check log files manually\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Cloud Monitoring uptime checks probe the API endpoints from global locations (availability and latency), and alert policies notify you on failures or SLO burn. App Engine also exports request latency and error metrics natively.\\n\\nWhy not the others: A) custom scripts on VMs are reinventing uptime checks. B) billing logs do not show errors. D) SSH into App Engine to read log files is manual and not how the platform works.\",\"explanationSource\":\"written\"},{\"id\":\"249\",\"question\":\"What is the most appropriate strategy for managing stateful workloads to improve resilience?\",\"options\":{\"A\":\"Use persistent disks and regional snapshots for failover\",\"B\":\"Store all application state in in-memory Redis cache\",\"C\":\"Store local backups only on instance boot disks\",\"D\":\"Write state data to standard output logs for parsing\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Use persistent disks (ideally Regional PD) with snapshots that allow failover or restore in another zone or region.\\n\\nHow it works:\\n• State lives on durable disks separate from the VM lifecycle.\\n• Regional PD replicates across 2 zones; snapshots let you recreate the disk in another location.\\n• On GKE: StatefulSets with PersistentVolumes (e.g. regional PD).\\n\\nExam tip: «stateful» + «resilience» → replicated persistent disk + snapshots.\\nDo not confuse with: all state only in in-memory Redis (can be lost), local backups on the same instance's boot disk (lost with it), writing state to stdout (not storage).\",\"explanationSource\":\"card-en\"},{\"id\":\"250\",\"question\":\"Which strategy helps prevent a monitoring system from becoming a single point of failure?\",\"options\":{\"A\":\"Use a centralized dashboard with custom queries only\",\"B\":\"Rely solely on Cloud Logging without alert configuration\",\"C\":\"Send all logs to the same cloud storage bucket only\",\"D\":\"Use distributed monitoring agents and multi-region r logging ans “iw\"},\"correct\":\"D\",\"explanation\":\"Distributed agents and replicated logs reduce the risk of observability loss and improve fault tolerance in the monitoring infrastructure itself.\"},{\"id\":\"251\",\"question\":\"A service has intermittent spikes in traffic. What reliability technique should be used?\",\"options\":{\"A\":\"Implement autoscaling with load-based policies in GKE\",\"B\":\"Fix resource allocation manually to avoid excess billing\",\"C\":\"Use standard instances with fixed-size load balancers\",\"D\":\"Disable vertical scaling to keep latency predictable\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Autoscaling with load-based policies: Horizontal Pod Autoscaler (CPU, memory, or custom/external metrics such as RPS) + cluster autoscaler for nodes.\\n\\nHow it works:\\n• HPA adjusts replicas to the target metric; the cluster autoscaler adds nodes if pods are pending.\\n• For very fast spikes leave headroom (lower target, minReplicas), because creating nodes takes minutes.\\n\\nExam tip: «intermittent spikes» → load-based autoscaling.\\nDo not confuse with: fixed manual allocation (does not react), standard instances with a fixed-size LB, disabling vertical scaling.\",\"explanationSource\":\"card-en\"},{\"id\":\"254\",\"question\":\"Which strategy enhances observability and root cause analysis in production systems?\",\"options\":{\"A\":\"Centralize logs and correlate them with trace and metrics\",\"B\":\"Rely only on status page updates and incident tickets\",\"C\":\"Use logs from staging environments only to reduce noise % =\",\"D\":\"Suppress low-severity logs to maintain cleaner dashboards 11 3: Sanaet “oe Ts eL/ \\\\ \u003e\"},\"correct\":\"A\",\"explanation\":\"Centralizing logs and correlating them with tracing and monitoring metrics enables faster and more accurate root cause analysis.\"},{\"id\":\"255\",\"question\":\"Which of the following supports high availability during zonal failure in GKE?\",\"options\":{\"A\":\"Deploy workloads in a single zone to reduce network hops\",\"B\":\"Use preemptible nodes in the same availability zone\",\"C\":\"Use regional clusters spanning multiple zones\",\"D\":\"Configure node pools manually in a single availability zone \\\"1 Ge\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Regional clusters that span several zones.\\n\\nHow it works:\\n• Replicated control plane and nodes spread across zones; pods are redistributed if a zone fails.\\n• Use topologySpreadConstraints per zone so replicas are not all in the same zone.\\n\\nExam tip: «zonal failure» + GKE → regional cluster.\\nDo not confuse with: workloads in a single zone, preemptible nodes in the same zone, node pools hand-configured in one zone.\",\"explanationSource\":\"card-en\"},{\"id\":\"256\",\"question\":\"What method ensures minimum disruption when patching running virtual machines?\",\"options\":{\"A\":\"Use live migration features of Compute Engine\",\"B\":\"Reboot all instances during low-traffic periods\",\"C\":\"Use cron jobs to pull security updates daily\",\"D\":\"Schedule manual reboots across all instances Sy, % silly Creer “we Ts \\\\ s weekly\"},\"correct\":\"A\",\"explanation\":\"Live migration allows Compute Engine to patch underlying infrastructure without stopping the VM, maintaining availability.\"},{\"id\":\"258\",\"question\":\"What’s a recommended action to reduce downtime from configuration drift?\",\"options\":{\"A\":\"Allow teams to manually adjust resources as needed\",\"B\":\"Revert to snapshots when changes go unnoticed\",\"C\":\"Use CI/CD pipelines integrated with infrastructure as code\",\"D\":\"Disable rollback to ensure full manual control over changes \u0026 = = RL ae\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. CI/CD integrated with infrastructure as code: every infrastructure change goes through the pipeline, is tested, and can be reverted.\\n\\nHow it works:\\n• Drift detection with a periodic terraform plan.\\n• Fast rollback by redeploying the previous version of the infrastructure code.\\n\\nExam tip: «configuration drift» + downtime → CI/CD + IaC.\\nDo not confuse with: each team hand-tuning, reverting snapshots after problems already happened (reactive and can lose data), disabling rollback.\",\"explanationSource\":\"card-en\"},{\"id\":\"259\",\"question\":\"Ateam notices latency in a global application. What tool can analyze network paths?\",\"options\":{\"A\":\"Network Intelligence Center’s Performance Dashboard\",\"B\":\"VPC Flow Logs with log router custom metrics\",\"C\":\"GKE resource manager and node-level profiler\",\"D\":\"Pub/Sub metrics dashboard in billing export reports % tilly ll * (st) TIT Senne® ~ “1Ww* etre\"},\"correct\":\"A\",\"explanation\":\"The Network Intelligence Center provides detailed diagnostics and visualizations for network performance, aiding latency investigation.\"},{\"id\":\"260\",\"question\":\"What strategy reduces risk when deploying new code in a production service?\",\"options\":{\"A\":\"Push changes directly and revert only if users complain\",\"B\":\"Disable monitoring during deployments to avoid noise\",\"C\":\"Use canary deployments with rollback on failure triggers\",\"D\":\"Replace entire node groups with new versions at once\"},\"correct\":\"C\",\"explanation\":\"Canary deployments gradually introduce new versions to a small subset of users, minimizing risk and supporting safe rollback.\"},{\"id\":\"261\",\"question\":\"What is the benefit of using managed instance groups (MIGs) with autoscaling?\",\"options\":{\"A\":\"They can be manually resized based on static CPU metrics\",\"B\":\"They require external load balancers to scale horizontally\",\"C\":\"They automatically adjust based on real-time workload metrics % we, ca\",\"D\":\"They distribute traffic only within a single GCP zone aL\"},\"correct\":\"C\",\"explanation\":\"MIGs with autoscaling respond to metrics like CPU or request load, maintaining performance and reliability under variable traffic.\"},{\"id\":\"262\",\"question\":\"What should you do to ensure deleted resources don’t affect existing monitoring?\",\"options\":{\"A\":\"Archive old logs into a cold storage GCS bucket\",\"B\":\"Decrease logging retention time to 7 days\",\"C\":\"Create custom dashboards with filters for active resources\",\"D\":\"Turn off metrics exports when resources are removed 2\"},\"correct\":\"C\",\"explanation\":\"Filtering dashboards for active resources helps avoid confusion and ensures monitoring remains accurate after deletions.\"},{\"id\":\"263\",\"question\":\"What action can help reduce Mean Time to Detect (MTTD) in incident response?\",\"options\":{\"A\":\"Use batch alerts aggregated every 6 hours\",\"B\":\"Implement threshold-based alerting with real-time notifications\",\"C\":\"Rely on periodic service reviews and feedback surveys\",\"D\":\"Manually inspect logs after user complaints arise % la, ye wR “11Ww* sly TTI A)\"},\"correct\":\"B\",\"explanation\":\"Cloud Scheduler combined with Cloud Functions enables timed execution with retry logic, ensuring reliability for time-sensitive batch operations.\"},{\"id\":\"264\",\"question\":\"How can you help reduce Mean Time to Recovery (MTTR) after a service crash?\",\"options\":{\"A\":\"Wait for full root cause analysis before restoring service\",\"B\":\"Implement runbooks and automated rollback procedures\",\"C\":\"Increase alert severity thresholds to reduce noise\",\"D\":\"Replace affected services with new builds manually\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. With documented runbooks and automated rollback procedures: restore the service first, investigate later.\\n\\nHow it works:\\n• Rollback to the last stable version (Cloud Run revisions, Cloud Deploy, kubectl rollout undo).\\n• Root-cause analysis (blameless postmortem) happens after you mitigate.\\n\\nExam tip: «after a crash» → mitigate fast (rollback) before RCA.\\nDo not confuse with: waiting for a full RCA before restoring, raising alert thresholds (you detect later), replacing services with hand-built builds (slow and error-prone).\",\"explanationSource\":\"card-en\"},{\"id\":\"265\",\"question\":\"What is a best practice for managing system health during application updates?\",\"options\":{\"A\":\"Use readiness and liveness probes in Kubernetes deployments\",\"B\":\"Push code updates during peak usage to test real load\",\"C\":\"Set compute quotas very high to prevent throttling\",\"D\":\"Allow unauthenticated access during updates for testing lla, * or % ie oe : Ve tas att a mw al \\\"Ny, AY S\"},\"correct\":\"A\",\"explanation\":\"Readiness and liveness probes help determine when pods are ready to serve traffic or need to be restarted, enabling smoother deployments.\"},{\"id\":\"266\",\"question\":\"Which logging strategy supports long- term audit and compliance?\",\"options\":{\"A\":\"Store all logs in local VM disks and rotate every week\",\"B\":\"Export audit logs to a versioned Cloud Storage bucket\",\"C\":\"Filter out I
