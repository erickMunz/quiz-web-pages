]]}]}]]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}]}]]}]]}],{\"children\":[\"quiz\",[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"gcp-profesional-cloud-architect-march-2025\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L5\",null,[\"$\",\"$L6\",null,{\"children\":\"$L7\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"SYmgGKmWPKYO-SgdU1U9C\",{\"children\":[[\"$\",\"$L8\",null,{\"children\":\"$L9\"}],[\"$\",\"$La\",null,{\"children\":\"$Lb\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$c\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"d:I[4953,[\"47\",\"static/chunks/47-aeb0cb411d578155.js\",\"200\",\"static/chunks/app/quiz/%5Bid%5D/page-ff9201f91ac303a6.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Ld\",null,{\"quiz\":{\"id\":\"gcp-profesional-cloud-architect-march-2025\",\"title\":\"GCP Profesional Cloud Architect — March 2025\",\"questions\":[{\"id\":\"1\",\"question\":\"You are designing a solution to collect IoT sensor data from thousands of devices. What is the most scalable and cost-effective approach for ingesting this data into Google Cloud?\",\"options\":{\"A\":\"Use Cloud Pub/Sub to receive sensor data and write directly to Cloud SQL\",\"B\":\"Send the data via HTTP and store it temporarily in Cloud Filestore\",\"C\":\"Use Cloud Pub/Sub to ingest streaming data and route it to Cloud Dataflow : Ws Wy\",\"D\":\"Use Compute Engine instances to listen to device traffic and write to eC BigQuery a 15. aii\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Pub/Sub scales automatically to millions of messages from thousands of devices, and Dataflow processes them serverlessly before writing to BigQuery, Bigtable or Cloud Storage. It scales and you pay per use.\\n\\nWhy not the others: A) Cloud SQL cannot absorb high-velocity telemetry writes. B) Filestore is NFS file storage, not an ingestion layer. D) self-managed VMs listening to devices do not scale or self-heal and cost more to run.\",\"explanationSource\":\"written\"},{\"id\":\"2\",\"question\":\"A retail company wants to migrate their analytics workload to the cloud and process both batch and real-time data. Which design approach should you recommend?\",\"options\":{\"A\":\"Use Cloud Storage for batch files and Cloud Pub/Sub for streaming, then process both with Cloud Dataflow\",\"B\":\"Use Cloud SQL for batch analytics and Firebase for real-time data\",\"C\":\"Stream data into Cloud Spanner and analyze using Cloud Functions\",\"D\":\"Store data in local memory cache and batch sync to Cloud Bigtable 9 nightly\"},\"correct\":\"A\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: A. Cloud Storage holds batch files and Pub/Sub handles real-time events. Dataflow (Apache Beam) runs the same programming model for both batch and streaming, usually loading into BigQuery for analytics.\\n\\nWhy not the others: B) Cloud SQL and Firebase are app databases, not analytics. C) Cloud Functions are not an analytics engine. D) in-memory caches with nightly syncs lose data and are not real time.\",\"explanationSource\":\"written\"},{\"id\":\"3\",\"question\":\"Which of the following design choices best follows Google Cloud's principles for high availability?\",\"options\":{\"A\":\"Use a single Compute Engine instance with persistent disk for simplicity\",\"B\":\"Deploy services across multiple zones using a regional managed instance group\",\"C\":\"Use Cloud Functions with a regional trigger only qull 10 “1 willy A)\",\"D\":\"Use static IPs across all services to avoid failover complexities\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. A regional managed instance group spreads identical instances across zones with autohealing. Behind a load balancer, it survives a zone failure.\\n\\nWhy not the others: A) one instance is a single point of failure. C) a regional trigger alone does not address resilience of the whole service. D) static IPs do not provide failover.\",\"explanationSource\":\"written\"},{\"id\":\"4\",\"question\":\"When architecting a solution that integrates third-party APIs and internal microservices, what is the best way to manage data flow between systems?\",\"options\":{\"A\":\"Use Memorystore to cache API results for reuse\",\"B\":\"Deploy Apigee in front of the microservices for latency control\",\"C\":\"Use Cloud Pub/Sub for decoupling services and enabling asynchronous communication\",\"D\":\"Establish direct TCP sockets between each microservice for fast integration\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Pub/Sub decouples producers from consumers. Third-party callbacks and internal services publish and subscribe asynchronously, absorb bursts, retry, and can evolve independently.\\n\\nWhy not the others: A) caching does not manage data flow. B) Apigee manages APIs (security, quotas, analytics); it does not handle asynchronous decoupling between services. D) direct sockets tightly couple every pair of services.\",\"explanationSource\":\"written\"},{\"id\":\"5\",\"question\":\"A customer wants to automate the creation of infrastructure for each new environment (dev, test, prod). What should ou recommend?\",\"options\":{\"A\":\"Create scripts that call gcloud commands manually\",\"B\":\"Use Cloud Console templates for provisioning new projects\",\"C\":\"Define infrastructure as code using Terraform and store in Cloud Source Repositories\",\"D\":\"Use Deployment Manager scripts triggered from Cloud Scheduler oc es\"},\"correct\":\"C\",\"explanation\":\"Terraform provides infrastructure as code and supports version control, collaboration, and automation, which is ideal for managing environments consistently.\"},{\"id\":\"6\",\"question\":\"Your team is tasked with designing a multi- region disaster recovery plan. What's the best practice for data storage replication?\",\"options\":{\"A\":\"Use zonal Cloud SQL and export data daily\",\"B\":\"Rely on Cloud Filestore with a manual backup schedule\",\"C\":\"Use multi-region buckets in Cloud Storage for critical data\",\"D\":\"Configure Persistent Disks with snapshot replication hetween zones\"},\"correct\":\"C\",\"explanation\":\"Multi-region Cloud Storage provides automatic data replication across multiple regions, ensuring availability in case of regional outages.\"},{\"id\":\"7\",\"question\":\"A solution must ensure secure and auditable communication between microservices. What should you recommend?\",\"options\":{\"A\":\"Deploy services in a private VPC subnet with Cloud NAT\",\"B\":\"Use firewall rules with service tags to limit access\",\"C\":\"Use service-to-service authentication with Identity-Aware Proxy or mTLS % aL Se\",\"D\":\"Enable public access with API keys to simplify W777 *s “@ anaet “a “1 RA) communication\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Strong service identity, such as mTLS with Cloud Service Mesh (formerly Anthos Service Mesh) or IAP/IAM-authenticated calls, gives encrypted, mutually authenticated service-to-service traffic that can be audited.\\n\\nWhy not the others: A) a private subnet with NAT is network placement, not authentication. B) firewall tags cannot identify the calling workload. D) public API keys are weak, shareable secrets.\",\"explanationSource\":\"written\"},{\"id\":\"8\",\"question\":\"When designing a system that must scale based on user demand, which architectural component is most appropriate?\",\"options\":{\"A\":\"Use autoscaling Managed Instance Groups with load balancing\",\"B\":\"Use a fixed number of Compute Engine VMs with persistent storage\",\"C\":\"Use zonal Kubernetes nodes with horizontal scaling turned off\",\"D\":\"Create cron jobs to monitor and resize infrastructure manually\"},\"correct\":\"A\",\"explanation\":\"Cloud Pub/Sub provides global messaging ingestion at scale, ideal for loT scenarios. Cloud Dataflow can process and route the data efficiently to downstream services like BigQuery.\"},{\"id\":\"9\",\"question\":\"A client is storing sensitive health data and must comply with HIPAA. What is a compliant design for storing and processing this data?\",\"options\":{\"A\":\"Use Datastore with public access disabled\",\"B\":\"Store data in Cloud Spanner with default encryption\",\"C\":\"Use Bigtable and enable Stackdriver logging\",\"D\":\"Use Cloud Storage with CMEK and enforce VPC Service Controls “aw MINTy, TT % 4,\"},\"correct\":\"D\",\"explanation\":\"CMEK ensures the customer controls encryption keys. VPC Service Controls prevent data exfiltration and help meet compliance like HIPAA.\"},{\"id\":\"10\",\"question\":\"An application receives financial transactions at high speed. What is a reliable way to design ingestion and processing for minimal loss?\",\"options\":{\"A\":\"Use Cloud SQL to directly ingest and process data\",\"B\":\"Use Pub/Sub with a Dataflow pipeline for reliable, scalable ingestion\",\"C\":\"Use BigQuery with streaming insert mode and monitor queues manually\",\"D\":\"Store all data on persistent disk and batch import it every 5 minutes\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Pub/Sub durably stores messages until they are acknowledged, and Dataflow processes them with checkpointing and exactly-once semantics. Together they give reliable, scalable ingestion with minimal loss even at high speed.\\n\\nWhy not the others: A) Cloud SQL as a direct ingestion buffer becomes a bottleneck. C) streaming straight into BigQuery with manually monitored queues lacks buffering and replay. D) local disks with 5-minute batches risk loss and add latency.\",\"explanationSource\":\"written\"},{\"id\":\"11\",\"question\":\"What is a recommended approach for migrating a large on-premise relational database to Google Cloud with minimal downtime?\",\"options\":{\"A\":\"Take a snapshot, import into BigQuery, and reconfigure app access\",\"B\":\"Use Storage Transfer Service to copy the database into Cloud Storage\",\"C\":\"Use Database Migration Service to migrate data while syncing changes\",\"D\":\"Export CSV files and import using gcloud commands into Cloud\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Database Migration Service (DMS) with a continuous job: initial load + change replication (CDC) until cutover.\\n\\nHow it works:\\n• Initial snapshot/dump, then only inserts/updates/deletes.\\n• Downtime ≈ stop writes, lag ≈ 0, promote the destination (Cloud SQL/AlloyDB) and point the app.\\n• Serverless: you do not stand up a replica server.\\n\\nExam tip: «minimal downtime» + relational DB → DMS, not CSV.\\nDo not confuse with: importing to BigQuery (analytics, not OLTP), Storage Transfer Service (objects, not a DB), CSV export + gcloud into Cloud SQL (long downtime and no sync).\",\"explanationSource\":\"card-en\"},{\"id\":\"13\",\"question\":\"Which strategy ensures the best security when designing APIs that handle sensitive data across services?\",\"options\":{\"A\":\"Authenticate via username and password sent with every request\",\"B\":\"Use Google authentication with OAuth2 and API keys together\",\"C\":\"Create a shared secret hardcoded in both client and server\",\"D\":\"Allow any traffic inside the VPC as it is trusted by default\"},\"correct\":\"B\",\"explanation\":\"OAuth2 with API keys and IAM integration ensures secure and controlled access, avoiding hardcoded secrets and insecure transmission.\"},{\"id\":\"14\",\"question\":\"What is the most appropriate way to decouple services in a scalable cloud-native architecture?\",\"options\":{\"A\":\"Use HTTPS calls between services directly for fast communication\",\"B\":\"Integrate services using Cloud Pub/Sub as a messaging backbone\",\"C\":\"Allow services to connect through shared files using Filestore qull “1Ww* MY, \\\\ “aw\",\"D\":\"Send database triggers to all microservices on data update\"},\"correct\":\"B\",\"explanation\":\"Cloud Pub/Sub offers reliable, scalable message delivery and is ideal for decoupling producers and consumers in distributed systems.\"},{\"id\":\"15\",\"question\":\"Aclient’s solution must meet data sovereignty requirements by staying within specific regions. What should you recommend?\",\"options\":{\"A\":\"Use Cloud SQL with no location specified to allow global flexibility\",\"B\":\"Use Firebase and Cloud Functions for a scalable regional solution\",\"C\":\"Use Cloud Spanner with global configuration and regional failover\",\"D\":\"Configure regional storage and compute in the designated locations qull “1nWw* NN tyy, \\\\\\\\ “iw\"},\"correct\":\"D\",\"explanation\":\"Specifying regional resources ensures data stays within the chosen locations, helping meet sovereignty and compliance needs.\"},{\"id\":\"16\",\"question\":\"An application writes large logs to disk. hat’s the best practice to make logs queryable and useful for future analytics?\",\"options\":{\"A\":\"Stream logs to Cloud Logging and export to BigQuery via sink\",\"B\":\"Store logs in Cloud Storage and read via gsutil when needed\",\"C\":\"Write logs to Cloud SQL and perform queries with indexes\",\"D\":\"Save logs to Persistent Disk and use cron jobs to parse logs ‘2 “Se\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Send them to Cloud Logging and export them to BigQuery with a sink.\\n\\nHow it works:\\n• The Ops Agent or logging system writes to Cloud Logging.\\n• A sink with a filter copies (or routes) to a BigQuery dataset.\\n• You analyze with SQL, dashboards, and the dataset’s own retention.\\n\\nExam tip: «queryable» + «analytics» → Logging + sink to BigQuery.\\nDo not confuse with: GCS + gsutil (not analytical), Cloud SQL as a log store (expensive and poorly scalable), a cron over Persistent Disk (fragile).\",\"explanationSource\":\"card-en\"},{\"id\":\"17\",\"question\":\"Asystem must process data from multiple sensors every second and support schema evolution. What is a scalable design?\",\"options\":{\"A\":\"Use Cloud SQL with JSON fields to store flexible schema\",\"B\":\"Write sensor data to Pub/Sub and Cloud Storage directly\",\"C\":\"Stream sensor output to Bigtable using batch sync nightly\",\"D\":\"Use Pub/Sub to Dataflow and then into BigQuery for flexibility\"},\"correct\":\"D\",\"explanation\":\"BigQuery supports schema evolution and combined with Pub/Sub and Dataflow, it allows scalable, real-time ingest and transformation.\"},{\"id\":\"19\",\"question\":\"You need to store financial records with strict write- once-read-many (WORM) compliance. What is the best GCP solution?\",\"options\":{\"A\":\"Use Firestore in strong consistency mode for record integrity\",\"B\":\"Save records in Cloud SQL with triggers to avoid overwrite\",\"C\":\"Use Cloud Storage with bucket retention policy and object lock S14\",\"D\":\"Store all data in Pub/Sub and archive with BigQuery ai Ti\"},\"correct\":\"C\",\"explanation\":\"Object versioning and retention policies in Cloud Storage support regulatory WORM requirements and prevent deletion or modification.\"},{\"id\":\"20\",\"question\":\"Which service allows the integration of legacy data pipelines into modern cloud- native analytics platforms?\",\"options\":{\"A\":\"Use Memorystore to bridge new and old systems\",\"B\":\"Use Apigee to wrap legacy systems as modern APIs\",\"C\":\"Use Dataflow to ingest and transform data from legacy sources S73 \\\",\",\"D\":\"Use Cloud Run to wrap legacy software in containers for reusability Cees TIN “iw\"},\"correct\":\"C\",\"explanation\":\"Dataflow supports both batch and stream ingestion, allowing transformation of legacy data formats into structures ready for modern analytics.\"},{\"id\":\"21\",\"question\":\"Which solution provides automated scaling of stateless web applications based on load?\",\"options\":{\"A\":\"Use persistent disks on Compute Engine with manual VM scaling\",\"B\":\"Use App Engine Standard to scale applications automatically\",\"C\":\"Use unmanaged instance groups to scale VM instances\",\"D\":\"Create a Cloud Function that launches new VMs on high load Big] -_* = oxy\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. App Engine Standard: a PaaS that creates or deletes instances based on requests and can scale to zero.\\n\\nHow it works:\\n• You upload code (or a container in 2nd gen); Google manages the runtime.\\n• Automatic scaling by QPS, latency, or utilization.\\n• Stateless: session elsewhere (Memorystore, Firestore, cookies).\\n\\nExam tip: «automated scaling» + «stateless web» → App Engine Standard (or Cloud Run, not listed here as «best»).\\nDo not confuse with: PD + manual scaling, unmanaged instance groups (no native autoscaler), a Cloud Function that launches VMs (anti-pattern).\",\"explanationSource\":\"card-en\"},{\"id\":\"22\",\"question\":\"You want to connect two VPCs in different projects. What is the best way to allow internal communication between them?\",\"options\":{\"A\":\"Enable public IP access and set up external firewall rules\",\"B\":\"Create SSH tunnels between VMs in both projects\",\"C\":\"Configure VPC peering and update internal DNS and routes\",\"D\":\"Use Cloud CDN to route traffic between private VPCs 77 a\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. VPC Network Peering (plus any routes/DNS you need).\\n\\nHow it works:\\n• Private peering over Google’s network: RFC1918 between both VPCs, low latency, no internet.\\n• Not transitive: A–B and B–C do not give A–C.\\n• Ranges cannot overlap; you must import/export custom routes if you use them.\\n• DNS: peering does not share Cloud DNS by itself; use DNS peering or private records.\\n\\nExam tip: «two VPCs» + «different projects» + internal → VPC peering.\\nDo not confuse with: public IPs + firewall, SSH tunnels, Cloud CDN (cache, not a private network).\",\"explanationSource\":\"card-en\"},{\"id\":\"23\",\"question\":\"A customer needs a managed Kubernetes service that integrates with GCP services. Which solution is best?\",\"options\":{\"A\":\"Deploy Kubernetes manually on Compute Engine instances\",\"B\":\"Use Google Kubernetes Engine (GKE) for native integration\",\"C\":\"Use Cloud Functions with Firebase to mimic Kubernetes workloads\",\"D\":\"Use Cloud Run on top of unmanaged Kubernetes clusters Cae “eS Ts a SY LL) S\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Google Kubernetes Engine (GKE): a managed control plane, nodes on GCP, and native IAM, VPC, Artifact Registry, Observability, and Load Balancing.\\n\\nHow it works:\\n• Google operates etcd/API server (regional on Autopilot/regional clusters).\\n• Add-ons: Workload Identity, GKE Sandbox, Binary Authorization, Gateway.\\n• Autopilot removes node management; Standard leaves it with you.\\n\\nExam tip: «managed Kubernetes» + «integrates with GCP» → GKE.\\nDo not confuse with: kubeadm on GCE (you operate everything), Cloud Functions+Firebase (not K8s), Cloud Run on unmanaged clusters (Run does not replace a Kubernetes API).\",\"explanationSource\":\"card-en\"},{\"id\":\"24\",\"question\":\"How can you ensure zero-downtime deployment during software rollout in GKE?\",\"options\":{\"A\":\"Create multiple clusters and switch DNS routing between them\",\"B\":\"Use rolling updates with readiness and liveness probes\",\"C\":\"Restart all pods with the updated image at the same time\",\"D\":\"Pause workloads and update all deployments manually\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. A Deployment rolling update with readiness and liveness probes.\\n\\nHow it works:\\n• Kubernetes creates new pods; the Service only sends traffic to Ready pods.\\n• maxUnavailable / maxSurge control how many change at once.\\n• Liveness restarts zombie pods; readiness takes them out of the LB if they are not serving yet.\\n• If it fails: rollback to the previous ReplicaSet.\\n\\nExam tip: «zero-downtime» + GKE → rolling + probes, not a mass restart.\\nDo not confuse with: changing DNS between clusters (heavy blue/green), killing every pod at once, pausing and updating by hand.\",\"explanationSource\":\"card-en\"},{\"id\":\"25\",\"question\":\"Which of the following is the best method for automating infrastructure deployment in a CI/CD pipeline?\",\"options\":{\"A\":\"Use Cloud Shell to deploy changes from developer laptops\",\"B\":\"Use gcloud commands stored in a spreadsheet and run manually\",\"C\":\"Use Cloud Monitoring alerts to trigger resource updates\",\"D\":\"Integrate Terraform scripts with Cloud Build triggers pias BIS Ti a SY\"},\"correct\":\"D\",\"explanation\":\"Correct answer: D. Terraform triggered by Cloud Build (triggers on the repo).\\n\\nHow it works:\\n• A push or PR runs a trigger: terraform plan and, with approval, apply.\\n• State lives in a remote backend (GCS) with locking.\\n• The same recipe in every environment; no laptops or spreadsheets.\\n\\nExam tip: «CI/CD» + infrastructure → Terraform + Cloud Build.\\nDo not confuse with: Cloud Shell from a laptop, gcloud in a spreadsheet, Monitoring alerts that «update» resources.\",\"explanationSource\":\"card-en\"},{\"id\":\"26\",\"question\":\"A team needs a cost-effective solution to run containerized workloads without managing infrastructure. What is the best option?\",\"options\":{\"A\":\"Use Compute Engine and configure container runtimes manually\",\"B\":\"Use Cloud Run for fully managed container deployment\",\"C\":\"Use GKE with node pools and custom autoscaling rules\",\"D\":\"Use App Engine with flexible environment and Dockerfiles\"},\"correct\":\"B\",\"explanation\":\"Cloud Run abstracts infrastructure entirely and charges based on request usage, ideal for event-driven container workloads.\"},{\"id\":\"27\",\"question\":\"Asecurity team needs to ensure all VMs use only approved OS images. What should you implement?\",\"options\":{\"A\":\"Lock VM configurations using startup scripts\",\"B\":\"Use Organization Policy with allowed image projects\",\"C\":\"Use custom SSH configurations for secure image enforcement\",\"D\":\"Enforce rules via VPC Service Controls and subnet masking a 12 (Ptr\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. An Organization Policy with the trusted image projects constraint (compute.trustedImageProjects).\\n\\nHow it works:\\n• You define which projects images can be launched from (e.g. your golden-image project + some Google ones).\\n• It inherits to folders/projects; a user with VM-create permission cannot bypass it.\\n• Combine with hardened images (CIS) and Binary Authorization on GKE.\\n\\nExam tip: «approved OS images» → Org Policy, not scripts.\\nDo not confuse with: startup scripts (they do not block the image), custom SSH, VPC-SC (API exfiltration, not an image catalog).\",\"explanationSource\":\"card-en\"},{\"id\":\"28\",\"question\":\"What's the most efficient way to deploy resources across multiple GCP regions with consistent configuration?\",\"options\":{\"A\":\"Copy and paste YAML files into each region manually\",\"B\":\"Create Cloud Scheduler jobs to replicate resources hourly\",\"C\":\"Use Deployment Manager templates with region variables\",\"D\":\"Use console UI and clone resources into different A)\"},\"correct\":\"C\",\"explanation\":\"Regional managed instance groups (MIGs) allow deployment across zones, improving fault tolerance and meeting high availability requirements.\"},{\"id\":\"29\",\"question\":\"What is the primary advantage of using Cloud Load Balancer in a global application?\",\"options\":{\"A\":\"It supports only Layer 4 traffic routing within a region\",\"B\":\"It provides simple local failover with no DNS changes\",\"C\":\"It encrypts all internal traffic between services automatically\",\"D\":\"It distributes traffic across regions and supports autoscaling Pe\"},\"correct\":\"D\",\"explanation\":\"Cloud Load Balancing provides global routing, autoscaling, and health checks, which are ideal for highly available applications.\"},{\"id\":\"30\",\"question\":\"A customer is worried about excessive costs from misconfigured services. How can you prevent this?\",\"options\":{\"A\":\"Set up automatic daily deletion of unused resources\",\"B\":\"Configure all services to stop after business hours\",\"C\":\"Use Budgets and Alerts with quotas and IAM limits % % i\",\"D\":\"Manually track costs in a shared Google Sheets file avy TTA\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Cloud Billing budgets and alerts, plus quotas and least-privilege IAM.\\n\\nHow it works:\\n• A budget with thresholds (50/90/100%) emails and can publish to Pub/Sub.\\n• Quotas (including custom) cap API/resource use.\\n• IAM keeps anyone from creating expensive GPUs or IPs.\\n\\nExam tip: «excessive costs» / «misconfigured» → budgets + quotas + IAM.\\nDo not confuse with: deleting resources every night (dangerous), shutting everything off after hours (breaks prod), manual Sheets.\",\"explanationSource\":\"card-en\"},{\"id\":\"31\",\"question\":\"Which method allows the most granular control of GCP resource permissions?\",\"options\":{\"A\":\"Assign Editor role at the project level for all users\",\"B\":\"Apply custom IAM roles at the resource level\",\"C\":\"Enable default permissions and remove billing access\",\"D\":\"Use Shared VPC with DNS access only between users sly, 47) WL Sanaet Oa Ts \\\\ \u003e\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Custom IAM roles applied at the resource (or the lowest possible ancestor).\\n\\nHow it works:\\n• A custom role is an exact list of permissions (e.g. storage.objects.get).\\n• The binding can sit on org, folder, project, or resource (bucket, instance, dataset).\\n• Least privilege: not project Editor.\\n\\nExam tip: «most granular» → custom roles + resource level.\\nDo not confuse with: Editor for everyone, «remove billing and leave defaults», Shared VPC (network, not object ACLs).\",\"explanationSource\":\"card-en\"},{\"id\":\"32\",\"question\":\"A business requires a hybrid cloud setup for burst compute workloads. What is a recommended pattern?\",\"options\":{\"A\":\"Use only on-premise servers and sync data nightly to GCP\",\"B\":\"Send full traffic to GCP during high business hours only\",\"C\":\"Build a VM image and email it to the cloud team % =\",\"D\":\"Use VPN or Interconnect and configure workload bursting ely A) ‘Ss Ti\"},\"correct\":\"D\",\"explanation\":\"Correct answer: D. Connect on-prem with HA VPN or Cloud Interconnect and launch the extra load on GCP.\\n\\nHow it works:\\n• The hybrid network (BGP via Cloud Router) makes GCP VMs/GKE look like an extension of the datacenter.\\n• Burst: queues or the orchestrator send extra jobs to a MIG/GKE/Dataproc in the cloud.\\n• Hot data is replicated or read over the interconnect.\\n\\nExam tip: «hybrid» + «burst compute» → VPN/Interconnect + elastic capacity.\\nDo not confuse with: nightly sync (not burst), «everything to GCP at peak hours» with no network, emailing an image.\",\"explanationSource\":\"card-en\"},{\"id\":\"33\",\"question\":\"What is the primary purpose of using Shared VPC in a large enterprise?\",\"options\":{\"A\":\"To expose services to public IPs in development environments\",\"B\":\"To centralize network administration across multiple projects\",\"C\":\"To allow external partners access to internal billing reports\",\"D\":\"To support multi-cloud routing between private VPCs GO ed J\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Centralize network administration: a host project owns the VPC and lends subnets to service projects.\\n\\nHow it works:\\n• Network admins live in the host; app teams only use the assigned subnets.\\n• Firewall, routes, NAT, and Interconnect are defined once.\\n• IAM: Shared VPC Admin vs Network User.\\n\\nExam tip: «centralize network administration across projects» → Shared VPC.\\nDo not confuse with: exposing public IPs, giving billing to partners, «multi-cloud routing» (that is Interconnect/VPN, not Shared VPC).\",\"explanationSource\":\"card-en\"},{\"id\":\"35\",\"question\":\"Which method is best for implementing infrastructure updates with minimal risk?\",\"options\":{\"A\":\"Manually SSH into each machine and apply updates\",\"B\":\"Deploy entire environments at once in production\",\"C\":\"Use canary deployments with monitoring and rollback\",\"D\":\"Build custom scripts for every project deployment a\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Canary: you release the change to a subset, watch metrics, and if it goes well you continue; if not, rollback.\\n\\nHow it works:\\n• Infra or app: 5–10% of MIGs/pods/traffic on the new version.\\n• SLIs (errors, latency) in Cloud Monitoring; threshold → halt.\\n• Automatic or one-click rollback to the previous artifact.\\n\\nExam tip: «minimal risk» + updates → canary + monitor + rollback.\\nDo not confuse with: mass SSH, big-bang to prod, ad-hoc scripts per project.\",\"explanationSource\":\"card-en\"},{\"id\":\"36\",\"question\":\"What is the best solution for autoscaling VMs based on CPU and memory usage?\",\"options\":{\"A\":\"Create a Cloud Function that runs when usage spikes\",\"B\":\"Use a startup script to clone VMs manually\",\"C\":\"Monitor usage in Cloud Monitoring and generate reports\",\"D\":\"Use Managed Instance Groups with autoscaling policies {\"},\"correct\":\"D\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: D. A managed instance group autoscaler scales on CPU utilization, load balancing serving capacity, or Cloud Monitoring metrics such as memory reported by the Ops Agent. It adds and removes VMs automatically.\\n\\nWhy not the others: A) a function on spikes is a home-made autoscaler. B) cloning VMs manually is not automatic. C) reports do not take action.\",\"explanationSource\":\"written\"},{\"id\":\"37\",\"question\":\"Ateam needs to deploy a service that scales to zero when idle. Which service should they use?\",\"options\":{\"A\":\"Cloud Run with containerized app and HTTP trigger\",\"B\":\"Cloud Functions with persistent disk attached\",\"C\":\"App Engine Flexible with custom autoscaler % 2 Le\",\"D\":\"GKE Standard with minimum node count set to zero % aL “1Ww* Ss\"},\"correct\":\"A\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: A. Cloud Run scales to zero instances when there are no requests (you pay nothing while idle) and scales out automatically on HTTP traffic.\\n\\nWhy not the others: B) Cloud Functions do not attach persistent disks. C) App Engine flexible keeps at least one instance running. D) GKE Standard node pools can scale to zero, but the cluster still runs and costs money; it is not the simplest scale-to-zero service.\",\"explanationSource\":\"written\"},{\"id\":\"38\",\"question\":\"You want to enable automatic failover between zones for a web application. Which approach is most suitable?\",\"options\":{\"A\":\"Deploy all instances in a single zone for simplicity\",\"B\":\"Use startup scripts to detect failures and recreate instances\",\"C\":\"Use preemptible VMs with manual failover configurations\",\"D\":\"Use regional Managed Instance Groups with health checks\"},\"correct\":\"D\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: D. Regional managed instance groups place VMs across zones, and health-check-based autohealing recreates failed VMs. Behind a load balancer, traffic fails over to healthy zones automatically.\\n\\nWhy not the others: A) one zone means no failover. B) startup scripts that detect failures reinvent autohealing. C) preemptible (Spot) VMs can be reclaimed at any time, and manual failover is not automatic.\",\"explanationSource\":\"written\"},{\"id\":\"39\",\"question\":\"What is a cost-effective strategy to reduce egress charges for content delivered globally?\",\"options\":{\"A\":\"Use Cloud NAT with public IPs for better routing\",\"B\":\"Use Cloud CDN to cache and deliver content closer to users\",\"C\":\"Route traffic through a VPN and compress data streams\",\"D\":\"Use multiple zones and serve content from Compute Engine % oe villa, RY\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Cloud CDN serves cached content from the edge, so fewer requests reach the origin. Cache egress is priced lower than origin internet egress, which reduces both latency and egress cost.\\n\\nWhy not the others: A) Cloud NAT is outbound access for private VMs. C) VPN adds overhead, and compression alone does not remove egress. D) serving from VMs in more zones does not reduce internet egress.\",\"explanationSource\":\"written\"},{\"id\":\"40\",\"question\":\"Ateam must deploy infrastructure as code using GCP-native tooling. What should they use?\",\"options\":{\"A\":\"Use Deployment Manager with YAML configuration files\",\"B\":\"Write shell scripts and store them in Git repositories\",\"C\":\"Use gcloud interactive sessions from Cloud Shell only\",\"D\":\"Create HT TP functions that provision services on demand\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Deployment Manager with YAML configurations (and Jinja/Python templates).\\n\\nHow it works:\\n• A config declares GCP resources; DM creates them and keeps them as a deployment.\\n• It is the classic «GCP-native» answer on older exams.\\n• Today: Infrastructure Manager (managed Terraform) is the recommended native; DM is deprecated.\\n\\nExam tip: «GCP-native tooling» → Deployment Manager (in this set).\\nDo not confuse with: a shell in Git (not a native provisioner), Cloud Shell only, Cloud Functions that create resources on demand (not IaC).\",\"explanationSource\":\"card-en\"},{\"id\":\"41\",\"question\":\"Your organization wants to manage all billing and resource access in one place. What architecture pattern supports this?\",\"options\":{\"A\":\"Use a separate billing account for each project independently\",\"B\":\"Assign Project Owner IAM roles to all team leads per project\",\"C\":\"Set up an Organization Node with folders and centralized billing\",\"D\":\"Configure budgets per region without a billing administrator\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. An Organization node (Resource Manager) with folders and a centralized billing account.\\n\\nHow it works:\\n• Org → folders (by department or environment) → projects.\\n• IAM and Org Policies inherit; the Billing Account is linked to projects (or inherited).\\n• A Billing Admin sees aggregated spend; Project Owners do not have to be billing admins.\\n\\nExam tip: «manage all billing and resource access in one place» → Organization + folders + centralized billing.\\nDo not confuse with: one billing account per project, Owner for every lead, budgets per region with no billing admin.\",\"explanationSource\":\"card-en\"},{\"id\":\"43\",\"question\":\"Which GCP service supports private container registry with version control?\",\"options\":{\"A\":\"Cloud Build with internal registry support for containers\",\"B\":\"Artifact Hub integrated into Kubernetes environments\",\"C\":\"Artifact Registry with Docker-compatible repositories\",\"D\":\"Memorystore configured with image layer caching logic\"},\"correct\":\"C\",\"explanation\":\"Artifact Registry securely stores container images and supports Docker-compatible registries, ideal for versioned deployments.\"},{\"id\":\"44\",\"question\":\"A developer needs to automate VM creation with custom startup actions. What's the best method?\",\"options\":{\"A\":\"Use instance metadata and startup scripts for customization\",\"B\":\"Use Google Forms to input configuration during boot\",\"C\":\"Build the image manually and deploy via the Cloud Console\",\"D\":\"Schedule a cron job that runs remote commands nightly % S re 11 3 anaet oan Ts\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Startup scripts in instance metadata (or in the MIG instance template).\\n\\nHow it works:\\n• metadata startup-script or startup-script-url (GCS).\\n• cloud-init / the Compute Engine agent runs it on first boot (or every boot, depending on config).\\n• Automatable with gcloud, Terraform, or the API; no human UI.\\n\\nExam tip: “automate VM creation” + “custom startup” → metadata + startup script.\\nDo not confuse with: Google Forms (no boot integration), building an image by hand in the console, a remote nightly cron.\",\"explanationSource\":\"card-en\"},{\"id\":\"46\",\"question\":\"Ateam must enforce encryption at rest with their own key rotation. What is the right choice?\",\"options\":{\"A\":\"Use Google-managed encryption for simplicity and ease\",\"B\":\"Use public Cloud KMS keys that rotate automatically\",\"C\":\"Use Customer-Managed Encryption Keys with rotation policies\",\"D\":\"Store secrets in Cloud Logging and encrypt with IAM roles Sy % aL aeaet Oa Te \\\\ \u003e\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. CMEK (Customer-Managed Encryption Keys) in Cloud KMS, with a rotation schedule.\\n\\nHow it works:\\n• You create a key ring + crypto key; the service (GCS, BQ, PD, SQL…) wraps DEKs with your KEK.\\n• Automatic rotation (e.g. 90 days) creates a new version; old data is rewrapped when used.\\n• You can disable/destroy the key and cut access.\\n\\nExam tip: “own key rotation” → CMEK, not GMEK.\\nDo not confuse with: “public” KMS keys, secrets in Cloud Logging, IAM that “encrypts”.\",\"explanationSource\":\"card-en\"},{\"id\":\"47\",\"question\":\"A customer wants to allow external partners to access APIs securely. What is a scalable solution?\",\"options\":{\"A\":\"Use Apigee to manage API keys and enforce quotas\",\"B\":\"Share gcloud credentials with time-limited sessions\",\"C\":\"Deploy APIs on GKE and whitelist partner IPs manually\",\"D\":\"Store partner credentials in Cloud Functions environment seul dy. ces “ey Ts Oe Y avila, a * B93 TTA\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Apigee (API Management): keys/OAuth, quotas, plans, analytics, and a proxy in front of your backends.\\n\\nHow it works:\\n• The partner calls the proxy; Apigee authenticates, applies quota/spike arrest, and routes to Cloud Run/GKE/on-prem.\\n• Developer portal and API products for onboarding.\\n• You do not share gcloud or project credentials.\\n\\nExam tip: “external partners” + APIs → Apigee.\\nDo not confuse with: sharing gcloud credentials, hand-maintained IP allowlists on GKE, secrets in Cloud Functions env vars.\",\"explanationSource\":\"card-en\"},{\"id\":\"48\",\"question\":\"What is a secure and scalable way to manage secrets like database credentials?\",\"options\":{\"A\":\"Use environment variables hardcoded into deployment files\",\"B\":\"Store secrets in Google Sheets and restrict access via IAM\",\"C\":\"Use Secret Manager with IAM-based access control\",\"D\":\"Send secrets over Pub/Sub topics with encryption enabled % Se cS Rad\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Secret Manager with IAM-based access (and rotation/versioning).\\n\\nHow it works:\\n• You store the secret; each change is a version.\\n• The app or SA calls the API at runtime (or it is mounted on Cloud Run/GKE).\\n• IAM: secretmanager.secretAccessor only to those who need it; access audit logs.\\n\\nExam tip: “manage secrets” → Secret Manager, not Sheets or env vars.\\nDo not confuse with: variables in the YAML, Google Sheets + IAM, sending secrets over Pub/Sub.\",\"explanationSource\":\"card-en\"},{\"id\":\"50\",\"question\":\"A project requires asynchronous task execution for user uploads. What is the best architecture?\",\"options\":{\"A\":\"Use Compute Engine with polling scripts for new uploads\",\"B\":\"Use Cloud Pub/Sub with Cloud Functions to trigger workflows\",\"C\":\"Schedule Cloud Tasks to run every hour and check for updates % Se\",\"D\":\"Store metadata in Cloud SQL and check periodically via cron \\\\ s\"},\"correct\":\"B\",\"explanation\":\"Pub/Sub and Cloud Functions support event- driven, serverless execution ideal for asynchronous tasks like file processing.\"},{\"id\":\"51\",\"question\":\"How can you prevent data exfiltration from sensitive storage buckets?\",\"options\":{\"A\":\"Block all VPC traffic to the internet globally\",\"B\":\"Apply VPC Service Controls to isolate and protect resources\",\"C\":\"Encrypt bucket names using custom IAM permissions\",\"D\":\"Use Cloud CDN to limit exposure of object URLs % a\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. VPC Service Controls: a service perimeter around the APIs (Cloud Storage, BigQuery, etc.).\\n\\nHow it works:\\n• Even if IAM allows storage.objects.get, copying to a project/bucket outside the perimeter is denied.\\n• Access Context Manager (IP, device, user) defines who enters.\\n• Combine with uniform bucket-level access, Public Access Prevention, and CMEK.\\n\\nExam tip: “prevent data exfiltration” → VPC Service Controls.\\nDo not confuse with: cutting the whole VPC off the internet (breaks legitimate egress), “encrypting the bucket name”, Cloud CDN (distributes, does not isolate).\",\"explanationSource\":\"card-en\"},{\"id\":\"52\",\"question\":\"Which design ensures compliance with disaster recovery objectives for stateful services?\",\"options\":{\"A\":\"Use local SSDs for fast access and high capacity\",\"B\":\"Replicate VM snapshots between two zones manually\",\"C\":\"Use regional persistent disks with automatic failover\",\"D\":\"Schedule cron jobs to backup Cloud SQL twice a day “4, vill, ee “eS “1iWw* Ss\"},\"correct\":\"C\",\"explanation\":\"Regional persistent disks replicate across zones automatically and ensure continuity of stateful services during outages.\"},{\"id\":\"54\",\"question\":\"What is the benefit of using Cloud Interconnect over VPN for enterprise workloads?\",\"options\":{\"A\":\"VPN provides higher availability with lower latency\",\"B\":\"Interconnect offers consistent performance and lower latency\",\"C\":\"VPN is better suited for large bulk data transfers\",\"D\":\"Interconnect requires no setup and is enabled by default Bat} e Ny\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. More predictable performance and lower latency: a private high-bandwidth link, not IPsec over the internet.\\n\\nHow it works:\\n• Dedicated: 10 or 100 Gbps in a colo; Partner: from 50 Mbps via a provider.\\n• VLAN attachment + Cloud Router (BGP) advertises RFC1918.\\n• Less jitter than VPN; egress to on-prem is usually cheaper.\\n\\nExam tip: “consistent performance” / “lower latency” → Interconnect.\\nDo not confuse with: “VPN is more available and faster” (false), “VPN for bulk transfer” (backwards), “Interconnect comes enabled by default”.\",\"explanationSource\":\"card-en\"},{\"id\":\"55\",\"question\":\"Which solution provides automated, versioned backups of structured data?\",\"options\":{\"A\":\"Manually export databases from Cloud Shell each day\",\"B\":\"Use Cloud SQL automated backups with point-in-time recovery\",\"C\":\"Use BigQuery exports to Cloud Storage and delete daily\",\"D\":\"Write scripts to save CSVs into Filestore hourly Sy, aie % oe % % aS * a ae Peas nf! “a naw SAL AY S\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Cloud SQL: automated backups + point-in-time recovery (PITR) with transaction logs.\\n\\nHow it works:\\n• Daily backup window; configurable retention.\\n• PITR: you restore to a specific second (on-demand or to a new instance).\\n• Backups are managed; you do not depend on a manual export from Cloud Shell.\\n\\nExam tip: “automated, versioned backups” + structured → Cloud SQL backups/PITR.\\nDo not confuse with: a daily BQ export you then delete, CSV to Filestore, a hand dump.\",\"explanationSource\":\"card-en\"},{\"id\":\"57\",\"question\":\"Aweb app must support TLS termination with low latency. What is the best tool?\",\"options\":{\"A\":\"Use Compute Engine with self-signed certificates\",\"B\":\"Use HT TPS Load Balancer with SSL certificates\",\"C\":\"Use Pub/Sub and attach TLS headers manually\",\"D\":\"Configure TLS on Cloud SQL and route via proxy\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. The External Application Load Balancer (HTTPS) with certificates (ideally Google-managed).\\n\\nHow it works:\\n• TLS terminates at the Google Front End, near the user.\\n• Managed certificates renew themselves (Google’s Let’s Encrypt-like flow).\\n• Optional: HTTP/3, Cloud CDN, Cloud Armor.\\n\\nExam tip: “TLS termination” + “low latency” → HTTPS Load Balancer.\\nDo not confuse with: self-signed certs on every VM, Pub/Sub (does not terminate web TLS), Cloud SQL TLS (that is the DB, not the web).\",\"explanationSource\":\"card-en\"},{\"id\":\"58\",\"question\":\"Which is the most scalable way to process 100,000 image files uploaded every hour?\",\"options\":{\"A\":\"Use Compute Engine and poll for new uploads via cron\",\"B\":\"Store files in Filestore and run batch jobs every night\",\"C\":\"Use Cloud Functions triggered by Cloud Storage events\",\"D\":\"Use Datastore and check for new entries via queries\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Cloud Storage + a trigger (Cloud Run functions / Cloud Functions) for each created object.\\n\\nHow it works:\\n• Each OBJECT_FINALIZE launches an invocation; the service scales in parallel.\\n• 100k/h ≈ 28/s: comfortable for functions/Run; use a Pub/Sub queue if you want smoothing.\\n• Idempotency: the same object must not be processed badly twice.\\n\\nExam tip: many files + “uploaded” → GCS event, not cron.\\nDo not confuse with: GCE + poll, Filestore + nightly batch, Datastore queries.\",\"explanationSource\":\"card-en\"},{\"id\":\"59\",\"question\":\"How can you enforce a naming convention for GCP resources across a large organization?\",\"options\":{\"A\":\"Manually review names and reject non-compliant ones\",\"B\":\"Use policy enforcement via Cloud Asset Inventory and Config Validator\",\"C\":\"Rename all resources using scripts during off-peak hours\",\"D\":\"Use deployment manager with placeholder variables\"},\"correct\":\"B\",\"explanation\":\"Config Validator can enforce policies using templates and integrate with the Asset Inventory to audit naming conventions.\"},{\"id\":\"60\",\"question\":\"A project requires strict control over internet access. What's the recommended approach?\",\"options\":{\"A\":\"Assign public IPs to all VMs and disable firewall\",\"B\":\"Use App Engine and configure DNS zones manually\",\"C\":\"Use Private Google Access and configure Cloud NAT\",\"D\":\"Allow all traffic by default and restrict only outbound ports\"},\"correct\":\"C\",\"explanation\":\"Cloud NAT allows instances without public IPs to access the internet securely, and Private Google Access enables access to GCP APIs.\"},{\"id\":\"62\",\"question\":\"What strategy ensures consistent tagging of resources for cost tracking?\",\"options\":{\"A\":\"Use project labels manually in the Cloud Console\",\"B\":\"Require developers to include cost labels in commit messages\",\"C\":\"Use Organization Policy to enforce required labels\",\"D\":\"Monitor tags in billing reports and notify team monthly 4% 2 selly *s, “@ Saeaet “a “1nWw* A)\"},\"correct\":\"C\",\"explanation\":\"Organization Policy can enforce label requirements, ensuring every resource is consistently tagged for cost attribution.\"},{\"id\":\"63\",\"question\":\"How should you isolate environments (dev/test/prod) in GCP for governance?\",\"options\":{\"A\":\"Use one project and prefix resources with environment name\",\"B\":\"Separate environments by folders and merge roles\",\"C\":\"Create a separate GCP project for each environment\",\"D\":\"Use resource names only to distinguish environments ee) Gb prneeert eaeet Op TTI A)\"},\"correct\":\"C\",\"explanation\":\"Regional MIGs automatically distribute instances across zones and perform health checks, ensuring availability during zone failures.\"},{\"id\":\"64\",\"question\":\"What is the recommended GCP service for real-time metrics and alerting?\",\"options\":{\"A\":\"Cloud Tasks with built-in alert webhook support\",\"B\":\"Memorystore with manual scripts to scan logs\",\"C\":\"Cloud Functions for custom metric collection\",\"D\":\"Cloud Monitoring with Alerting Policies and \\\"y Se oo 11 3 “11Ww* silly A) Dashboards\"},\"correct\":\"D\",\"explanation\":\"Cloud Monitoring offers native integration with GCP services, real-time metrics collection, dashboards, and customizable alerting.\"},{\"id\":\"65\",\"question\":\"Which architecture ensures reliability when processing 24/7 global event streams?\",\"options\":{\"A\":\"Stream events into Cloud SQL via API Gateway\",\"B\":\"Write directly to Cloud Datastore from remote devices\",\"C\":\"Use Pub/Sub, Dataflow, and BigQuery for global streams %% a ve\",\"D\":\"Upload files every hour from IoT devices into Filestore aL TT\"},\"correct\":\"C\",\"explanation\":\"Pub/Sub, Dataflow, and BigQuery together form a scalable, reliable architecture for ingesting and processing streaming data globally.\"},{\"id\":\"66\",\"question\":\"You must provide least-privilege access to an intern analyzing logs. What do you assign?\",\"options\":{\"A\":\"Project Owner role for unrestricted visibility\",\"B\":\"IAM Viewer with additional Compute Admin\",\"C\":\"Logs Viewer role only for needed project\",\"D\":\"Cloud SQL Admin to grant restricted log reading\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. A minimal logs role on the needed project (e.g. roles/logging.viewer), never Owner or Compute Admin.\\n\\nHow it works:\\n• Logging Viewer: list and read logs; they do not change sinks or VMs.\\n• If it is only one log bucket: roles/logging.viewAccessor on the view.\\n• Never pile Viewer + Compute Admin “just in case”.\\n\\nExam tip: “least-privilege” + “analyzing logs” → Logs Viewer only.\\nDo not confuse with: Project Owner, Viewer+Compute Admin, Cloud SQL Admin.\",\"explanationSource\":\"card-en\"},{\"id\":\"68\",\"question\":\"A customer needs to control data flow between two GCP regions. What should they use?\",\"options\":{\"A\":\"Shared VPC to route traffic directly via private subnet\",\"B\":\"VPC firewall rules and custom route configurations\",\"C\":\"IAM roles assigned to inter-region service accounts\",\"D\":\"Assign public IPs and use NAT between regions % eS ae senly\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. VPC firewall rules and custom routes (the VPC is global; subnets are regional).\\n\\nHow it works:\\n• By default, subnets in different regions in the same VPC reach each other over Google’s network.\\n• Firewall (priority, tags, service accounts) can deny or limit that east-west traffic.\\n• Custom routes / network tags steer or drop (e.g. force an appliance).\\n\\nExam tip: “control data flow between two GCP regions” → firewall + routes.\\nDo not confuse with: Shared VPC (shares subnets, not an inter-region filter), IAM on SAs (does not route packets), public IPs + NAT between regions.\",\"explanationSource\":\"card-en\"},{\"id\":\"70\",\"question\":\"Which service enables central management of users and devices in GCP?\",\"options\":{\"A\":\"Identity Platform with custom SAML federation\",\"B\":\"Cloud Identity with device and account management\",\"C\":\"IAM groups created for each service in each region % = TT 13 aL S Ts\",\"D\":\"Firebase Auth for managing enterprise access s\"},\"correct\":\"B\",\"explanation\":\"Cloud Identity is a centralized identity-as-a- service that supports single sign-on, device policies, and directory sync...\"},{\"id\":\"71\",\"question\":\"What strategy prevents developers from deploying unapproved services?\",\"options\":{\"A\":\"Use Deployment Manager with templates only\",\"B\":\"Require all users to submit manual approvals via email\",\"C\":\"Apply Organization Policy constraints on allowed services\",\"D\":\"Limit VPC network access to internal DNS zones only Sy, % silly Ss Sannet Oa “11Ww*\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. The Organization Policy gcp.restrictServiceUsage (or restricting which APIs can be enabled) blocks unapproved services across the whole org or folder, whatever the developer's role.\\n\\nWhy not the others: A) Deployment Manager templates are deprecated and easy to bypass. B) email approvals are not enforcement. D) DNS zones do not stop service deployment.\",\"explanationSource\":\"written\"},{\"id\":\"72\",\"question\":\"You must ensure secure storage for encryption keys and secrets. What service should you use?\",\"options\":{\"A\":\"Cloud SQL with strong password protection\",\"B\":\"Cloud Storage with KMS-managed object labels\",\"C\":\"Cloud Key Management Service with IAM permissions % — willy\",\"D\":\"BigQuery tables encrypted using Dataflow masking RA)\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Cloud KMS stores and manages encryption keys (software, HSM or external through EKM), with IAM-controlled use and audit logs. Application secrets themselves belong in Secret Manager, which is encrypted with KMS.\\n\\nWhy not the others: A) a database password is not a key management system. B) object labels are metadata, not protection. D) Dataflow masking is a data transformation, not key storage.\",\"explanationSource\":\"written\"},{\"id\":\"73\",\"question\":\"What is the main benefit of Resource Hierarchy (Organization \u003e Folder \u003e Project) in GCP?\",\"options\":{\"A\":\"It provides a billing dashboard across all zones\",\"B\":\"It allows centralized IAM and policy enforcement\",\"C\":\"It enables each developer to access all projects\",\"D\":\"It supports assigning different quotas to every region\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. IAM policies and Organization Policies set on the organization or folder are inherited by every project below. The hierarchy therefore gives central governance with exceptions where needed.\\n\\nWhy not the others: A) billing dashboards are not the purpose. C) inheritance does not grant everyone access. D) quotas are per project and region, not driven by the hierarchy.\",\"explanationSource\":\"written\"},{\"id\":\"74\",\"question\":\"A solution must process and transform petabytes of structured data. Which tool should you use?\",\"options\":{\"A\":\"Cloud SQL with sharded data pipelines\",\"B\":\"Datastore with batch ingestion jobs every week\",\"C\":\"BigQuery for serverless petabyte-scale analytics\",\"D\":\"Cloud Functions with Memcached storage for compute\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. BigQuery: a serverless analytic warehouse that scales to petabytes without provisioning clusters.\\n\\nHow it works:\\n• SQL over columns; the engine splits the scan across thousands of slots.\\n• You transform with SQL, scheduled queries, BigQuery Data Transfer, or Dataform.\\n• You pay storage + bytes scanned (on-demand) or slots (editions/reservations).\\n\\nExam tip: “petabytes” + “structured” + analytics/transform → BigQuery.\\nDo not confuse with: Datastore/Firestore (document NoSQL, not analytic PB), Cloud SQL (relational at TB scale, not PB), Cloud Functions + Memcached (request/cache, not massive ETL).\",\"explanationSource\":\"card-en\"},{\"id\":\"75\",\"question\":\"You need to ensure that only a specific group of users can manage Compute Engine instances in a project. Which approach aligns best with the principle of least privilege?\",\"options\":{\"A\":\"Assign all users the Owner role at the project level\",\"B\":\"Assign the Compute Admin role only to the group at the project level\",\"C\":\"Assign the Editor role to each user individually in the group\",\"D\":\"Assign the Compute Admin role to everyone in the organization s 1S\"},\"correct\":\"B\",\"explanation\":\"The Compute Admin role grants the exact permissions needed to manage instances without providing broader access like Editor or Owner roles. Assigning it to the group ensures manageability and enforces least privilege.\"},{\"id\":\"77\",\"question\":\"A client must meet GDPR requirements for data deletion. What Google Cloud feature Supports secure and permanent deletion of data?\",\"options\":{\"A\":\"Using Data Deletion Requests via Cloud DLP\",\"B\":\"Disabling access logging for reduced exposure\",\"C\":\"Retaining logs in Stackdriver indefinitely %, BS\",\"D\":\"Backing up data to a regional bucket 11. - Mila\"},\"correct\":\"A\",\"explanation\":\"Cloud DLP (Data Loss Prevention) supports mechanisms to identify and redact sensitive data. It also enables organizations to programmatically request data deletions to comply with privacy regulations like GDPR.\"},{\"id\":\"79\",\"question\":\"Your organization wants to prevent confidential data from leaving its boundary ia emails or logs. What GCP service can be used?\",\"options\":{\"A\":\"Cloud Scheduler to delete logs regularly\",\"B\":\"Stackdriver to generate warnings\",\"C\":\"Dataflow to cleanse logs of data Qs\",\"D\":\"Cloud DLP to inspect and redact sensitive content S “ani\"},\"correct\":\"D\",\"explanation\":\"Cloud DLP allows scanning, identifying, and redacting sensitive data (like PII, credit card numbers) before it’s logged or sent externally, helping meet compliance goals.\"},{\"id\":\"80\",\"question\":\"You must meet HIPAA compliance and log access to healthcare data in GCP. What feature should be enabled?\",\"options\":{\"A\":\"Disable all logging for privacy\",\"B\":\"Enable Cloud Audit Logs for data access events\",\"C\":\"Share data with external reviewers for transparency\",\"D\":\"Use standard Cloud Logging with minimal metadata \\\"y\"},\"correct\":\"B\",\"explanation\":\"Cloud Audit Logs track who accessed what data and when, which is essential for HIPAA compliance and forensic investigations.\"},{\"id\":\"81\",\"question\":\"A security audit revealed that multiple users had broad permissions on GCP projects. How can this be corrected?\",\"options\":{\"A\":\"Remove all users and assign only Owner roles\",\"B\":\"Use IAM Recommender to reduce roles to least privilege\",\"C\":\"Grant all users the Security Reviewer role\",\"D\":\"Add a VPC firewall rule to restrict user traffic Senay, \\\"4\"},\"correct\":\"B\",\"explanation\":\"IAM Recommender analyzes actual usage and suggests reduced permissions, helping enforce least privilege while maintaining functionality.\"},{\"id\":\"82\",\"question\":\"Which GCP tool helps detect misconfigured resources that might violate security policies?\",\"options\":{\"A\":\"Cloud Trace to visualize network performance\",\"B\":\"Cloud DNS to filter invalid domains\",\"C\":\"Security Command Center to detect misconfigurations seal ites “ef Ts a s\",\"D\":\"Cloud Tasks to audit user access\"},\"correct\":\"C\",\"explanation\":\"Security Command Center scans for vulnerabilities, policy violations, and misconfigurations across GCP resources, offering actionable security insights.\"},{\"id\":\"83\",\"question\":\"What is the most secure way to store and manage API keys and credentials in GCP?\",\"options\":{\"A\":\"Store keys in a Cloud Storage bucket\",\"B\":\"Use metadata server to inject secrets into VMs\",\"C\":\"Use Secret Manager with IAM policies\",\"D\":\"Hardcode secrets in the application codebase qull 4 WL] | “ai\"},\"correct\":\"C\",\"explanation\":\"Secret Manager is designed for securely storing secrets like API keys. It integrates with IAM to enforce access control and supports audit logging.\"},{\"id\":\"84\",\"question\":\"Which mechanism ensures secure communication between services in GCP?\",\"options\":{\"A\":\"Enabling mutual TLS and Identity-Aware Proxy\",\"B\":\"Disabling firewall rules for internal IP ranges\",\"C\":\"Relying on public IPs for service-to-service communication\",\"D\":\"Using legacy network configurations for flexibility heaaet an naw” a SY\"},\"correct\":\"A\",\"explanation\":\"Mutual TLS (mTLS) ensures that both parties are authenticated, while Identity-Aware Proxy (IAP) enables access control at the application layer, together enforcing secure service communication.\"},{\"id\":\"85\",\"question\":\"You need to implement fine-grained access control on BigQuery datasets. What is the best option?\",\"options\":{\"A\":\"Assign BigQuery Admin at project level\",\"B\":\"Use authorized views or column-level access policies\",\"C\":\"Enable dataset sharing with everyone in the domain\",\"D\":\"Remove all access controls for performance spe\"},\"correct\":\"B\",\"explanation\":\"Authorized views and column-level security allow precise control over what data is exposed, aligning with the principle of least privilege.\"},{\"id\":\"86\",\"question\":\"Which method helps ensure compliance with local data residency regulations?\",\"options\":{\"A\":\"Store all backups in multi-regional storage\",\"B\":\"Use region-specific storage for sensitive data\",\"C\":\"Configure cross-region replication\",\"D\":\"Export data to external cold storage les avila, _— * ew TT NK Gate y* poe oS Ts Oe SY\"},\"correct\":\"B\",\"explanation\":\"Storing data in specific GCP regions ensures that it remains within jurisdictional boundaries, aiding compliance with residency laws like GDPR or CCPA.\"},{\"id\":\"87\",\"question\":\"What is the recommended way to prevent privilege escalation via IAM?\",\"options\":{\"A\":\"Grant Service Account Token Creator to all users\",\"B\":\"Allow users to create custom roles freely\",\"C\":\"Restrict role binding using organization policy constraints\",\"D\":\"Assign inherited roles from parent folders\"},\"correct\":\"C\",\"explanation\":\"Organization policy constraints can restrict which roles are assignable, preventing users from escalating privileges through role misconfiguration.\"},{\"id\":\"89\",\"question\":\"To verify that only the required ports are exposed to the internet on VM instances, what should be implemented?\",\"options\":{\"A\":\"Assign Editor role for better control\",\"B\":\"Use Cloud Run for all workloads\",\"C\":\"Configure Firewall Rules with least privilege\",\"D\":\"Enable public IPs for external access\"},\"correct\":\"C\",\"explanation\":\"Firewall Rules can be configured to only allow access to specific ports and IP ranges, reducing the attack surface for VMs.\"},{\"id\":\"90\",\"question\":\"How can you prevent service accounts from being used outside their designated VPC service perimeter?\",\"options\":{\"A\":\"Add logging to all service accounts manually\",\"B\":\"Enable Cloud Logging and alert on usage spikes\",\"C\":\"Use VPC Service Controls with access levels\",\"D\":\"Grant project-wide Owner permissions to users\"},\"correct\":\"C\",\"explanation\":\"VPC Service Controls support defining access levels and perimeters, which can prevent unauthorized data movement across boundaries.\"},{\"id\":\"91\",\"question\":\"Which IAM practice reduces the risk of unauthorized privilege escalation?\",\"options\":{\"A\":\"Assign Owner to all service accounts by default\",\"B\":\"Use inherited roles across entire organization\",\"C\":\"Allow developers to modify their own IAM roles\",\"D\":\"Use predefined roles instead of custom roles 7 TTA\"},\"correct\":\"D\",\"explanation\":\"Predefined roles are managed by Google, regularly updated for least privilege. Custom roles can be misconfigured to grant excess permissions.\"},{\"id\":\"92\",\"question\":\"A customer wants to encrypt data before storing it in Cloud Storage. What is the best approach?\",\"options\":{\"A\":\"Use client-side encryption before data upload\",\"B\":\"Use Dataflow to delete data after upload\",\"C\":\"Rely only on Google-managed encryption keys\",\"D\":\"Use Data Studio to store encrypted versions\"},\"correct\":\"A\",\"explanation\":\"Client-side encryption ensures data is encrypted before it enters the cloud, giving customers full control over key management and access.\"},{\"id\":\"93\",\"question\":\"Which service would you use to manage and rotate encryption keys manually?\",\"options\":{\"A\":\"Secret Manager with static expiration dates\",\"B\":\"Cloud KMS with scheduled key rotation\",\"C\":\"Cloud SQL with user-managed SSL certs\",\"D\":\"BigQuery with auto key deletion enabled\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Cloud KMS supports automatic rotation on a schedule (a rotation period) and manual rotation on demand. New key versions encrypt new data, and old versions stay available to decrypt.\\n\\nWhy not the others: A) Secret Manager stores secrets; it does not rotate encryption keys. C) SSL certificates are not encryption keys for data at rest. D) BigQuery has no 'auto key deletion' feature.\",\"explanationSource\":\"written\"},{\"id\":\"94\",\"question\":\"What feature should be enabled to track who is accessing specific Google Cloud resources?\",\"options\":{\"A\":\"Disable logs for security reasons only\",\"B\":\"Enable log deletion to reduce storage costs\",\"C\":\"Enable Cloud Audit Logs for resource access\",\"D\":\"Store logs in a public-access Cloud Storage bucket Bi)\"},\"correct\":\"C\",\"explanation\":\"Cloud Audit Logs capture all access and changes to resources, helping maintain an audit trail for compliance and investigations.\"},{\"id\":\"95\",\"question\":\"What Google Cloud feature helps detect policy violations in real time?\",\"options\":{\"A\":\"Use Data Fusion to automate workflows\",\"B\":\"Use Security Command Center for violations\",\"C\":\"Use Memorystore to log all activities\",\"D\":\"Use App Engine with default permissions\"},\"correct\":\"B\",\"explanation\":\"Security Command Center provides actionable insights, detects threats, and flags policy misconfigurations as they occur.\"},{\"id\":\"96\",\"question\":\"Which method can prevent unauthorized users from binding powerful roles?\",\"options\":{\"A\":\"Assign Admin rights to all developers\",\"B\":\"Allow users to edit IAM policies freely\",\"C\":\"Set firewall rules to deny IAM binding\",\"D\":\"Apply IAM policy constraints at org level\"},\"correct\":\"D\",\"explanation\":\"Correct answer: D. Organization policies / custom constraints on IAM at the organization level (and deny policies).\\n\\nHow it works:\\n• Custom org policy on `AllowPolicy`: DENY if the binding is `roles/owner` or `roles/editor`.\\n• Managed constraints: do not give basic roles to default SAs; limit member domains.\\n• Separate `resourcemanager.projects.setIamPolicy` (Security Admin only).\\n\\nExam tip: \\\"prevent binding powerful roles\\\" → IAM policy constraints at org.\\nDo not confuse with: firewall (does not understand IAM), \\\"let everyone edit IAM\\\", Admin to all devs.\",\"explanationSource\":\"card-en\"},{\"id\":\"97\",\"question\":\"What strategy helps protect data-in- transit in GCP services?\",\"options\":{\"A\":\"Only use static IPs for all communication\",\"B\":\"Send data unencrypted for faster delivery\",\"C\":\"Enable TLS encryption for all traffic\",\"D\":\"Compress all data to reduce packet size qull “1Ww* % villa, TT] A) %\"},\"correct\":\"C\",\"explanation\":\"TLS ensures data is encrypted while being transmitted across services, reducing the risk of data leakage or interception.\"},{\"id\":\"98\",\"question\":\"Which solution prevents accidental public sharing of storage buckets?\",\"options\":{\"A\":\"Use organization policy to block public access\",\"B\":\"Add all users as bucket editors for control\",\"C\":\"Set lifecycle policies to auto-delete objects\",\"D\":\"Disable object versioning to simplify usage\"},\"correct\":\"A\",\"explanation\":\"Resource hierarchy enables policy and access inheritance, letting organizations centralize control over security and billing.\"},{\"id\":\"101\",\"question\":\"A client wants a detailed report on network access. Which GCP service is best?\",\"options\":{\"A\":\"Use Data Catalog to manage permissions\",\"B\":\"Use App Engine logging for this purpose\",\"C\":\"Use VPC Flow Logs with Log Analytics\",\"D\":\"Use Pub/Sub to send data summaries 1533 TrKK\\\\ Gy ee “1Ww*\"},\"correct\":\"C\",\"explanation\":\"VPC Flow Logs collect information about traffic to and from VM instances, which can be analyzed using Log Analytics for deeper insights.\"},{\"id\":\"104\",\"question\":\"What is the benefit of using Identity- Aware Proxy (IAP)?\",\"options\":{\"A\":\"Allows unauthenticated access to apps\",\"B\":\"Enables secure access to web applications\",\"C\":\"Makes services publicly available by default\",\"D\":\"Requires public IP for all applications\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Identity-Aware Proxy authenticates and authorizes each request with Google identity and context-aware rules before it reaches the app. Web apps (and TCP/SSH via IAP TCP forwarding) are accessible securely without a VPN or public exposure.\\n\\nWhy not the others: A) and C) it does the opposite of unauthenticated or public access. D) IAP removes the need for public IPs on backends.\",\"explanationSource\":\"written\"},{\"id\":\"105\",\"question\":\"Which setting enforces HTTPS traffic for all users accessing App Engine?\",\"options\":{\"A\":\"Add custom domains without SSL enabled\",\"B\":\"Use firewall rules to filter HTTP requests\",\"C\":\"Force HTTPS redirect in App Engine settings\",\"D\":\"Allow both HTTP and FTP protocols by default 1 : ii\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Force an HTTP→HTTPS redirect on the app: handlers with `secure: always` in `app.yaml` (standard) or the \\\"Strict-Transport-Security\\\" / HTTPS-only option in settings.\\n\\nHow it works:\\n• App Engine terminates TLS with managed certificates (custom domain too).\\n• A request to `http://` gets a 301/302 redirect to `https://`.\\n• The App Engine firewall does not replace TLS: it filters IPs, not the scheme.\\n\\nExam tip: \\\"enforce HTTPS\\\" + App Engine → force HTTPS redirect.\\nDo not confuse with: custom domain without SSL, allowing HTTP+FTP.\",\"explanationSource\":\"card-en\"},{\"id\":\"106\",\"question\":\"A company wants to minimize impact if credentials are compromised. What is recommended?\",\"options\":{\"A\":\"Create one key for multiple services always\",\"B\":\"Disable key expiration to avoid outages\",\"C\":\"Use short-lived service account tokens\",\"D\":\"Store static keys in GitHub repositories\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Short-lived credentials (OAuth access tokens valid about an hour from impersonation, metadata server tokens or Workload Identity Federation) expire quickly, so a leaked token gives an attacker only a brief window.\\n\\nWhy not the others: A) one key for many services widens the blast radius. B) non-expiring keys stay valuable forever. D) keys in GitHub are publicly leaked.\",\"explanationSource\":\"written\"},{\"id\":\"107\",\"question\":\"Which is the best way to prevent lateral movement across GCP services?\",\"options\":{\"A\":\"Grant all permissions at the organization level\",\"B\":\"Use Cloud Functions to auto-create roles\",\"C\":\"Share service accounts across environments MEDy, co\",\"D\":\"Define VPC Service Control perimeters Sy Saeae® “Ss Ts\"},\"correct\":\"D\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: D. VPC Service Controls perimeters restrict which projects and networks can reach protected Google APIs and data. Compromised credentials or workloads cannot pivot to resources in other perimeters.\\n\\nWhy not the others: A) organization-wide permissions maximize lateral movement. B) auto-created roles add risk. C) shared service accounts across environments link them together.\",\"explanationSource\":\"written\"},{\"id\":\"114\",\"question\":\"To prevent data exfiltration, what should be implemented?\",\"options\":{\"A\":\"Grant cross-project access using wildcard roles\",\"B\":\"Remove all access logging for storage buckets\",\"C\":\"Set VPC Service Controls for sensitive APIs -\",\"D\":\"Disable firewall rules to restrict all traffic Mes %, WL] A) “11Ww*\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. VPC Service Controls around sensitive APIs (Cloud Storage, BigQuery and others) block copying data to projects outside the perimeter. They are the primary control against data exfiltration on Google Cloud.\\n\\nWhy not the others: A) wildcard roles widen access. B) removing logs hides exfiltration. D) disabling firewall rules does not restrict API-level data movement.\",\"explanationSource\":\"written\"},{\"id\":\"116\",\"question\":\"Which GCP feature helps ensure compliance by managing resource configurations?\",\"options\":{\"A\":\"Use Config Validator to enforce policies\",\"B\":\"Use Cloud Functions to delete changes daily\",\"C\":\"Rely on GCS for manual compliance reporting\",\"D\":\"Disable Admin API to block unauthorized users Baby\"},\"correct\":\"A\",\"explanation\":\"Config Validator enables enforcement of constraints on GCP resources, elping ensure they comply with organizational policies.\"},{\"id\":\"117\",\"question\":\"A developer needs access to deploy but not delete GKE clusters. What role helps?\",\"options\":{\"A\":\"GKE Admin with full permissions included\",\"B\":\"Project Owner for deployment capabilities\",\"C\":\"Compute Admin role with override policy\",\"D\":\"Custom role with deploy-only permissions §\"},\"correct\":\"D\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: D. A custom IAM role with only the needed permissions (for example container.clusters.get, update and create, but not container.clusters.delete) follows least privilege when no predefined role matches.\\n\\nWhy not the others: A) and C) admin roles include delete. B) Project Owner can do everything.\",\"explanationSource\":\"written\"},{\"id\":\"118\",\"question\":\"What helps enforce encryption requirements across GCP storage?\",\"options\":{\"A\":\"Publish IAM policies to user-facing portals\",\"B\":\"Disable KMS to reduce storage cost impact\",\"C\":\"Apply org policy requiring CMEK usage\",\"D\":\"Configure firewall to allow encrypted traffic\"},\"correct\":\"C\",\"explanation\":\"Organization policies can require the use of CMEK for storage services, ensuring encryption is enforced across the environment.\"},{\"id\":\"119\",\"question\":\"You want to ensure only designated users can create service accounts. What helps?\",\"options\":{\"A\":\"Set allowAllUsers on service account objects\",\"B\":\"Assign Editor role across all active projects\",\"C\":\"Restrict iam.serviceAccounts.create via IAM\",\"D\":\"Enable auto-create service accounts for users ?, ~ “1nWw*\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. You restrict the `iam.serviceAccounts.create` permission (Service Account Admin / Creator role) to that group. Nobody else has it — in particular, do not give Project Editor to everyone.\\n\\nHow it works:\\n• Editor includes creating SAs and often grants them wide roles: that is the opposite.\\n• Org policy `iam.disableServiceAccountCreation` (or managed equivalent) as a guardrail, with an exception on the platform project.\\n• Whoever creates the SA does not have to be Token Creator / Key Admin.\\n\\nExam tip: least privilege on `iam.serviceAccounts.create`.\",\"explanationSource\":\"card-en\"},{\"id\":\"121\",\"question\":\"Which method helps prevent excessive permission granting in IAM?\",\"options\":{\"A\":\"Use project-wide inherited roles for everyone\",\"B\":\"Implement least privilege via IAM Recommender\",\"C\":\"Give users both Owner and Editor roles always\",\"D\":\"Disable logs that show permission violations il anak es S Ti a SY\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Continuous least privilege with IAM Recommender: it reviews usage and lowers roles (or generates a narrower custom role).\\n\\nHow it works:\\n• Insights on unused permissions (~90 days).\\n• Apply the recommendation or a smaller equivalent role.\\n• Combine with groups, predefined roles, and not inheriting Editor on the org.\\n\\nExam tip: \\\"excessive permission granting\\\" → IAM Recommender / least privilege.\\nDo not confuse with: Owner+Editor to everyone, disabling violation logs, inherited roles for everybody.\",\"explanationSource\":\"card-en\"},{\"id\":\"122\",\"question\":\"To comply with data retention regulations, what should you enable?\",\"options\":{\"A\":\"Delete all data after 24 hours regardless\",\"B\":\"Enable Object Versioning and Retention Policy\",\"C\":\"Use Public ACLs with monthly cleanup script\",\"D\":\"Set IAM to allow deletion by all authenticated\"},\"correct\":\"B\",\"explanation\":\"Retention policies enforce data preservation for a specified period, and versioning prevents permanent deletion before expiry.\"},{\"id\":\"125\",\"question\":\"To prevent hardcoded secrets in code, what is the best GCP feature?\",\"options\":{\"A\":\"Use environment variables with GitHub repos\",\"B\":\"Store secrets in public buckets using naming\",\"C\":\"Use Secret Manager with IAM-controlled access\",\"D\":\"Define secrets in shared shell script templates\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Secret Manager with IAM: the app fetches the secret at runtime; the repo does not contain it.\\n\\nHow it works:\\n• The Cloud Run/GKE/VM SA has `secretmanager.secretAccessor`.\\n• Injection: Secret Manager volume on GKE, referenced env var on Cloud Run, or API client.\\n• Rotation = new version; the code asks for `latest` or an alias.\\n\\nExam tip: \\\"prevent hardcoded secrets\\\" → Secret Manager + IAM.\\nDo not confuse with: env vars in a GitHub repo, public buckets, shared scripts.\",\"explanationSource\":\"card-en\"},{\"id\":\"126\",\"question\":\"How do you enforce secure image usage in GKE workloads?\",\"options\":{\"A\":\"Enable unrestricted image pulls always\",\"B\":\"Use Binary Authorization with signed images\",\"C\":\"Allow Docker Hub for all cluster workloads\",\"D\":\"Disable container scanning for flexibility sly, OTK\"},\"correct\":\"B\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: B. Binary Authorization requires images to be signed or attested (for example after Artifact Analysis vulnerability scanning in your CI) before GKE admits them. Unsigned or untrusted images are blocked at deploy time.\\n\\nWhy not the others: A) and C) unrestricted pulls, including from Docker Hub, allow arbitrary images. D) disabling scanning removes a security signal.\",\"explanationSource\":\"written\"},{\"id\":\"127\",\"question\":\"You want to restrict GCS access based on network identity. What do you use?\",\"options\":{\"A\":\"Use signed URLs shared over public sites\",\"B\":\"Use lifecycle policies to delete objects\",\"C\":\"Use IAM Conditions with request at
