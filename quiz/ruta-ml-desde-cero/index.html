"$Le\",null,{\"quiz\":{\"id\":\"ruta-ml-desde-cero\",\"title\":\"Exam: Machine Learning from scratch\",\"questions\":[{\"id\":\"1\",\"question\":\"Your company wants to predict whether a client will pay their next invoice. A history of 500,000 past invoices labeled paid/unpaid exists, but no expert can state the exact rule. What is missing to use ML here?\",\"options\":{\"A\":\"Nothing: plenty of labeled examples exist and the rule is unknowable — the ideal supervised-model case\",\"B\":\"An auditor must state the exact payment rule first; without a rule there is nothing to train\",\"C\":\"With 500,000 examples ML won't work: too small; at least a million is needed\",\"D\":\"You must switch to unsupervised: cluster invoices by similarity and ignore the labels\"},\"correct\":\"A\",\"explanation\":\"It wins because it joins BOTH conditions of the mental model: unknowable rule (hence no hand-coding) and plenty of solved examples (hence signal to learn from).\\n\\nWhy the others fail:\\n(B) The wrong assumption: that stating the rule is always possible and required. That is precisely what ML avoids: examples replace the rule.\\n(C) The wrong assumption: inventing a magic threshold. The signal in 500,000 invoices suffices for a tabular classifier; the exact size depends on pattern complexity, not a round number.\\n(D) The wrong assumption: that labels are a burden. Discarding them would waste the most valuable signal — to predict payment, the learning is supervised by definition.\\n\\nExam cue: ML needs two things at once: examples with their right answer, and a rule nobody can write down.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-ck1\"},{\"id\":\"2\",\"question\":\"You are hired to «apply AI» and find three projects: (1) compute payroll under current law, (2) predict a factory's power consumption tomorrow from 3 years of hourly readings, (3) decide whether an application is complete per the regulator's checklist. Which ones deserve an ML model?\",\"options\":{\"A\":\"All three: with enough ML any problem can be solved\",\"B\":\"None: if the company already has processes, training is never worth it\",\"C\":\"Only (2): payroll and the checklist are exact, stable rules (plain logic); consumption has no formula but three years of real readings exist\",\"D\":\"(2) and (3): consumption for its data and the checklist for its bureaucratic complexity\"},\"correct\":\"C\",\"explanation\":\"It wins because it sorts all three cases by the SAME two pieces of the mental model: does the formula exist? do examples exist? Payroll and checklist have a formula; consumption does not but has data.\\n\\nWhy the others fail:\\n(A) The wrong assumption: ML as a universal key. For payroll and the checklist the rule is EXACT and STABLE; a model would inject error into a deterministic, legally auditable computation.\\n(B) The wrong assumption: the opposite extreme. Power consumption depends on weather, shifts and calendar with no closed formula, and 3 YEARS of readings exist: abundant examples, unknowable rule.\\n(D) The wrong assumption: complexity ≠ unknowability. «Complex but written» is still a rule: the checklist is applied as-is, and a model would be LESS reliable than its own definition.\\n\\nExam cue: The question is never «can ML do this?» but «does the formula exist? If not, do examples abound?».\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck2\"},{\"id\":\"3\",\"question\":\"You trained a spam filter on historical data and want an honest metric of its performance on fresh mail. Which of these is NOT a valid way to obtain the data part «the model never saw»?\",\"options\":{\"A\":\"Set aside 20% of the emails BEFORE training and leave them untouched until final evaluation\",\"B\":\"k-fold cross-validation: each email serves as test in one of the k rounds\",\"C\":\"Hold out the last month of real mail (never touched) and evaluate only at project end\",\"D\":\"Train a few more epochs and measure accuracy on the SAME emails used for training\"},\"correct\":\"D\",\"explanation\":\"It wins because it is precisely the s1 lab's vice: those emails already shaped the parameters; no number over them counts as «never seen».\\n\\nWhy the others fail:\\n(A) It IS valid: the standard method (train/test split). Held-out mail never touches the fit, so it is genuinely «never seen».\\n(B) It IS valid: in each round the test part did not train that round's model. Valid and especially useful on scarce data.\\n(C) It IS valid: a temporal split — in fact the most realistic evaluation when data trends over time.\\n\\nExam cue: «Never seen» means those data took no part in the fit at any moment — not that the model processed them afterwards.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-ck3\"},{\"id\":\"4\",\"question\":\"Team A trains a fraud model and holds out 20% for test: 89% train, 68% test; the first production week lands at 67%. Team B, in the same notebook and with the same data, reports 99.8% train and 99.6% test, when no earlier model had gone past 70%. What do you read from each case?\",\"options\":{\"A\":\"Model B is better — higher, steadier metric: deploy it first, investigate the 68% one later\",\"B\":\"A suffers overfitting (memory \u003e generalization), but its 67% in production CONFIRMS its test is honest; B's 99.6%, far above anything before, smells of leakage and its features must be audited before trusting it\",\"C\":\"A's exam is badly done: train and test differing that much proves the split was shuffled wrong\",\"D\":\"Both are fine; the differences are split luck and are fixed by training more epochs\"},\"correct\":\"B\",\"explanation\":\"It wins because the numbers tell one coherent story: real overfitting with honest evaluation (train≠test, test≈production), versus an unexplained near-perfect jump, the typical symptom of a feature that contains the answer.\\n\\nWhy the others fail:\\n(A) The wrong assumption: comparing numbers without reading the context. 99.6% on a problem where nothing had passed 70% is a leakage alarm until proven otherwise, not a virtue.\\n(C) The wrong assumption: blaming the exam. Test dropping from train is the NORMAL behaviour of overfitting; and production (67%) matches test (68%): the metric predicts reality.\\n(D) The wrong assumption: chance explaining such distinct patterns. More epochs do not fix leakage (the leaked feature is still there), and A's overfitting is attacked with regularization, more data or early stopping, not more steps.\\n\\nExam cue: A near-perfect, unexplained result gets audited before you trust it; a test that predicts production validates the metric, however painful the number.\",\"difficulty\":\"advanced\",\"flowItem\":\"s1-ck4\"},{\"id\":\"5\",\"question\":\"An NGO digitizes 40,000 well-being surveys. Before training a school-dropout risk model, the analyst says: «income and district shape each household's context; the rest are details». What role do income and district play?\",\"options\":{\"A\":\"They are the labels: what the model must predict\",\"B\":\"They are features (input variables): columns feeding the model's prediction\",\"C\":\"They are hyperparameters: they tune training intensity\",\"D\":\"They are metadata that should be removed: they would pollute training\"},\"correct\":\"B\",\"explanation\":\"It wins because that is precisely their role: within the learned function every feature influences the output; the label (dropout) is the target.\\n\\nWhy the others fail:\\n(A) The wrong assumption: mixing input and output. The label is dropout; income and district ride along with the example, they are not its answer.\\n(C) The wrong assumption: a hyperparameter is a training decision (learning rate, depth), never a data column.\\n(D) The wrong assumption: metadata ≠ useless feature. With real context and predictive signal, removing them would only impoverish the model.\\n\\nExam cue: Feature = input column; label = the column to predict; hyperparameter = a training decision, never a column.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-ck5\"},{\"id\":\"6\",\"question\":\"A fraud model over 50,000 transactions with 0.4% fraud reports 99.7% accuracy. The team celebrates and asks you to sign off the deployment. What do you say before signing?\",\"options\":{\"A\":\"99.7% proves the model is ready: no previous model achieved as much\",\"B\":\"Accuracy says little with 0.4% fraud: demand precision, recall at the decision threshold and the cost of each error type before signing\",\"C\":\"Accuracy is fine; report it with more decimals so it looks credible\",\"D\":\"With an extreme imbalance, accuracy IS the best metric\"},\"correct\":\"B\",\"explanation\":\"It wins because it swaps the metric for the ones that actually tell model from trick and anchor the decision to the business cost (blocking legit purchases vs. letting fraud through).\\n\\nWhy the others fail:\\n(A) The wrong assumption: a high number as proof of quality without its floor. The naive «nothing is fraud» model scores 99.6%: the model's real margin is 0.1%.\\n(C) The wrong assumption: a cosmetics problem. More decimals do not change what the number measures.\\n(D) The wrong assumption: the logic inverted. The rarer the class, the LESS accuracy informs: the naive model's floor climbs toward 100%.\\n\\nExam cue: With rare classes accuracy measures the imbalance, not the model: demand precision, recall and costs.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck1\"},{\"id\":\"7\",\"question\":\"Spam filter: 5,000 emails, 2% spam. Every false positive (legit mail to spam) can lose a customer; every false negative (spam to inbox) merely annoys. Which threshold/metric profile do you prioritize?\",\"options\":{\"A\":\"Maximize recall: catch all spam; collateral errors against legit mail are tolerable\",\"B\":\"Accuracy suffices: with 98% non-spam, any filter beats that floor\",\"C\":\"Balance precision and recall at 50/50 because it is the default configuration\",\"D\":\"Prioritize high precision even with modest recall: raise the threshold to flag spam only near-certain\"},\"correct\":\"D\",\"explanation\":\"It wins because it aligns the metric with the dominant cost (FP very expensive = lost customers; FN cheap = annoyance): high threshold, precision monitored, recall tracked as a constraint.\\n\\nWhy the others fail:\\n(A) The wrong assumption: maximizing the metric that does NOT cost money. High recall implies low precision: legit mail trashed, exactly what loses customers.\\n(B) The wrong assumption: accuracy as final arbiter. The naive model already scores 98% doing NOTHING; the metric must separate model from trick.\\n(C) The wrong assumption: balance by ritual. The right balance depends on the business's costs, and here they are clearly asymmetric.\\n\\nExam cue: Pick the threshold from the cost matrix: high precision when a false positive hurts more than a miss.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-ck2\"},{\"id\":\"8\",\"question\":\"Contract-renewal model: 91% validation. In production it predicts renewal almost always. The team discovers the feature «cancellation_requested_date» slipped in (the date the client requested cancellation; empty if they renew). What happened and what do you do?\",\"options\":{\"A\":\"The model works fine: the pattern is genuine and performance will rise with more data\",\"B\":\"It is target leakage: that date (empty = renews, filled = does not) practically IS the label, hence the 91%; drop the column, retrain and re-validate\",\"C\":\"It is a too-many-features problem; dimensionality reduction fixes it without dropping the column\",\"D\":\"It is data drift: clients change and weekly retraining is needed\"},\"correct\":\"B\",\"explanation\":\"It wins because it identifies the label leak (a column that only exists after the event you predict) and gives the full remedy: drop, retrain, and re-validate honestly.\\n\\nWhy the others fail:\\n(A) The wrong assumption: ignoring the feature's content. The column fills AFTER the event: the answer written into the input.\\n(C) The wrong assumption: quantity as cause. PCA can even AMPLIFY the leak by mixing the polluted column into its components.\\n(D) The wrong assumption: drift as the default explanation. Drift does not explain 91% validation with disastrous production; a leaking column does.\\n\\nExam cue: Ask WHEN each column's data exists: if it fills after the event, it is the answer, not the signal.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-ck3\"},{\"id\":\"9\",\"question\":\"Your spam filter's confusion matrix reads: TP=90, FN=10 (missed spam), FP=25 (held legit mail), TN=9875. A teammate reports precision 78% and recall 90%. Is it consistent?\",\"options\":{\"A\":\"Yes: precision = 90/(90+25) = 78.3% and recall = 90/(90+10) = 90% — consistent with the boxes\",\"B\":\"No: they are swapped; the true values are precision 90% and recall 78%\",\"C\":\"It cannot be known from these boxes: retraining is required\",\"D\":\"Almost: real precision is 98.7% because TN takes part in its formula\"},\"correct\":\"A\",\"explanation\":\"It wins because it applies the formulas with the right denominators: precision over PREDICTED positives (TP+FP); recall over REAL positives (TP+FN).\\n\\nWhy the others fail:\\n(B) The wrong assumption: remembering the pair, not its denominator. Precision's denominator includes FP (predicted positives); recall's includes all real positives.\\n(C) The wrong assumption: the matrix as insufficient data. The confusion matrix is EXACTLY what both metrics need.\\n(D) The wrong assumption: dragging TN into precision. TN appears in neither precision nor recall; 98.7% is the ACCURACY ((TP+TN)/total).\\n\\nExam cue: Precision = over what you PREDICTED positive; recall = over what is REALLY positive; TN belongs to neither.\",\"difficulty\":\"basic\",\"flowItem\":\"s2-ck4\"},{\"id\":\"10\",\"question\":\"A teammate runs model.fit() and, asked «how many epochs?», answers: «as many as it takes for train loss to hit zero». What do you fire back?\",\"options\":{\"A\":\"Right: zero loss guarantees the best model\",\"B\":\"Better: always set 100 epochs — the industry standard\",\"C\":\"Watch the VALIDATION loss with early stopping when it stops dropping: train loss may keep falling while the model worsens\",\"D\":\"Train loss is all that matters; validation only at the end\"},\"correct\":\"C\",\"explanation\":\"It wins because it defines the real target (generalize) and the control lever (stop on the honest metric, not the memorized one).\\n\\nWhy the others fail:\\n(A) The wrong assumption: confusing memorizing with learning. Loss≈0 on train is the classic portrait of overfitting.\\n(B) The wrong assumption: ritual over criterion. The number depends on data and model; fixed and unsupervised breeds over- or under-fit.\\n(D) The wrong assumption: the compass at the journey's end. Without monitoring during training there is no stopping point; at the end it is too late.\\n\\nExam cue: The loss that governs is the never-seen one; train loss at zero is the definition of memorizing.\",\"difficulty\":\"basic\",\"flowItem\":\"s2-ck5\"},{\"id\":\"11\",\"question\":\"A small lender must approve loans with 8,000 historical applications (repaid/defaulted) and 15 columns. The regulator requires explaining to each customer which factors weighed in the decision, and you need a first model this week. Which do you choose?\",\"options\":{\"A\":\"A deep neural network, because it usually gives the best accuracy\",\"B\":\"k-means with 2 clusters, one for “repays” and one for “defaults”\",\"C\":\"A linear regression that predicts 0 or 1, then rounding\",\"D\":\"A logistic regression as the baseline: it gives a probability and coefficients that say which factor raises or lowers the risk\"},\"correct\":\"D\",\"explanation\":\"It wins because it is a fast-to-train classifier with interpretable per-feature weights and a probabilistic output; it also serves as the reference before trying boosting.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that more complex always wins. On 8,000 tabular rows it rarely beats simple models, and it is hard to explain to the regulator.\\n(B) The wrong assumption: ignoring that there is a label. k-means groups by similarity, and its clusters need not match repaying or defaulting.\\n(C) The wrong assumption: treating a class as a number. It can output values outside 0–1 and is not built to classify; logistic regression solves exactly that.\\n\\nExam cue: Table, binary label and a duty to explain: logistic regression is the natural first step.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-q1\"},{\"id\":\"12\",\"question\":\"Your churn Random Forest scores 0.86 AUC on validation, with 200,000 customers and 60 columns. You have two weeks and someone experienced at tuning hyperparameters. What do you try next to improve?\",\"options\":{\"A\":\"Gradient boosting (LightGBM or XGBoost) with early stopping on validation\",\"B\":\"A single deep decision tree, easier to explain\",\"C\":\"Raise the Random Forest from 500 to 5,000 trees\",\"D\":\"k-NN with k = 5 on the 60 columns\"},\"correct\":\"A\",\"explanation\":\"It wins because boosting chains trees that fix the ensemble's errors and, well tuned, usually beats the forest on tables; early stopping keeps it from overfitting.\\n\\nWhy the others fail:\\n(B) The wrong assumption: that easier to explain means better at predicting. A single tree has more variance than the forest and will almost surely lower AUC.\\n(C) The wrong assumption: that more trees always add up. Past a certain number the forest stabilizes and barely improves; it costs more compute without changing what it can learn.\\n(D) The wrong assumption: that a distance model is interchangeable. With 200,000 rows prediction is slow, it needs scaling and a good distance, and on mixed tables it rarely beats trees.\\n\\nExam cue: Forest = robust without tuning; boosting = the next step when you have time to tune it.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-q2\"},{\"id\":\"13\",\"question\":\"You train a Random Forest with and without StandardScaler, with the same features and the same seed, and get the same predictions. Your colleague thinks the pipeline has a bug. What do you tell them?\",\"options\":{\"A\":\"It is a bug: scaling always changes any model's predictions\",\"B\":\"The scaler was not applied: you must call fit_transform on test too\",\"C\":\"It is expected: trees split each feature on thresholds, and scaling does not change the order of values, so the splits are equivalent\",\"D\":\"It is luck with this seed; with another seed they would differ\"},\"correct\":\"C\",\"explanation\":\"It wins because StandardScaler applies an order-preserving transform to each column, and trees only depend on that order: they get the same partitions.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that every model uses distances or gradients. Trees do not.\\n(B) The wrong assumption: fixing it with another leak. Fitting on test contaminates evaluation, and the forest would give the same result anyway.\\n(D) The wrong assumption: putting it down to chance. It is a property of trees: they are unaffected by a per-column order-preserving transform.\\n\\nExam cue: Trees depend on the order of values, not their scale.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-ck1\"},{\"id\":\"14\",\"question\":\"You predict a building's daily power use from outdoor temperature: it rises with cold (heating) and with heat (air conditioning). A linear regression on raw temperature has high error on both train and validation. What do you do?\",\"options\":{\"A\":\"Capture the U shape: add temperature² (or “cold degrees” and “heat degrees”) to the linear model, or try a tree or boosting\",\"B\":\"Add strong L2 regularization\",\"C\":\"Train more epochs with a higher learning rate\",\"D\":\"Scale temperature to between 0 and 1\"},\"correct\":\"A\",\"explanation\":\"It wins because a U is not a straight line: with features that represent it, or with a non-linear model, the pattern can be learned.\\n\\nWhy the others fail:\\n(B) The wrong assumption: treating underfitting as overfitting. The model already fails on train; regularizing simplifies it further.\\n(C) The wrong assumption: that it lacks training. Linear regression already finds its best line; more steps do not turn it into a curve.\\n(D) The wrong assumption: that scale changes shape. Scaling changes units; it is still a straight line over a U.\\n\\nExam cue: High error already on train: missing capacity or features; a line cannot draw a U.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-ck2\"},{\"id\":\"15\",\"question\":\"Your house-price Random Forest was trained on homes from 40 to 200 m². Now 350–400 m² homes arrive and their predicted price is almost the same as for 200 m² homes. Users complain. What explains the behavior?\",\"options\":{\"A\":\"The forest has too few trees; with 2,000 trees it would predict higher prices\",\"B\":\"There is data leakage in training\",\"C\":\"The size feature was not scaled\",\"D\":\"A Random Forest predicts by averaging prices seen in its leaves, so it cannot extrapolate beyond the training maximum\"},\"correct\":\"D\",\"explanation\":\"It wins because each leaf holds training values: however big the house, it lands in the extreme leaves and gets their average.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that more trees create new values. More trees average the same prices seen in train.\\n(B) The wrong assumption: mixing up symptoms. Leakage inflates evaluation; it does not explain a ceiling on predictions.\\n(C) The wrong assumption: that scale matters to trees. Their splits do not depend on it.\\n\\nExam cue: Trees interpolate; to extrapolate, change the model or get data from that range.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-ck3\"},{\"id\":\"16\",\"question\":\"Your LightGBM with 5,000 trees, learning rate 0.3 and very deep trees scores AUC 0.99 on train and 0.78 on validation, with 20,000 rows. You have a week and cannot get more data. What do you tune first?\",\"options\":{\"A\":\"Double the number of trees so the model “finishes learning”\",\"B\":\"Switch to a deep neural network\",\"C\":\"Lower the learning rate, limit each tree's complexity (depth, minimum examples per leaf) and let early stopping on validation choose how many trees to use\",\"D\":\"Drop the validation set and train on everything to have more data\"},\"correct\":\"C\",\"explanation\":\"It wins because smaller steps and simpler trees reduce variance, and early stopping halts when validation stops improving.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that it needs more training. Boosting keeps fixing errors in series; more trees fit more noise and widen the gap.\\n(B) The wrong assumption: that changing family fixes overfitting. It does not address the cause, and on tables this size a network rarely beats well-tuned boosting.\\n(D) The wrong assumption: that measuring is optional. You lose the way to detect overfitting; the gap would still be there, just invisible.\\n\\nExam cue: In boosting, learning rate and number of trees are tuned together, with early stopping as referee.\",\"difficulty\":\"advanced\",\"flowItem\":\"s3-ck4\"},{\"id\":\"17\",\"question\":\"You have 1,000 patients and only 30 have the disease. With a random 80/20 split the test set ended up with 2 positives, and recall jumps between 0%, 50% and 100% depending on the seed. You must report a stable number to the committee. What do you change first?\",\"options\":{\"A\":\"Duplicate the positives in the whole dataset before splitting\",\"B\":\"Use accuracy, which is more stable\",\"C\":\"A stratified split (better, stratified cross-validation), so every part keeps the 3% of positives\",\"D\":\"Raise the test set to 50% of the data\"},\"correct\":\"C\",\"explanation\":\"It wins because stratify keeps the proportion in every part, and stratified CV uses all 30 positives for evaluation, giving an average recall with its spread.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that more positives anywhere help. Resampling before the split puts copies of the same patient in train and test (leakage) and distorts the test's real proportion.\\n(B) The wrong assumption: stable = useful. With 3% positives, always saying “healthy” already gives 97%: stable, but silent about what matters.\\n(D) The wrong assumption: that size is enough. It leaves fewer examples to train on and, without stratifying, how many positives land in test still depends on chance.\\n\\nExam cue: With few positives, stratify and average folds before trusting a recall.\",\"difficulty\":\"basic\",\"flowItem\":\"s4-q1\"},{\"id\":\"18\",\"question\":\"A 3-person fraud team can review 100 alerts a day out of 200,000 daily transactions. You are asked to compare two models and pick one for that team. Which metric best reflects the real value for them?\",\"options\":{\"A\":\"Precision on each day's 100 highest-scoring transactions (precision@100)\",\"B\":\"Overall accuracy on the 200,000 transactions\",\"C\":\"Recall at the default 0.5 threshold\",\"D\":\"ROC-AUC, because it does not depend on the threshold\"},\"correct\":\"A\",\"explanation\":\"It wins because it measures exactly what the team will use: how many real frauds are among the 100 cases it can review.\\n\\nWhy the others fail:\\n(B) The wrong assumption: that one global number fits all. Legitimate transactions dominate it; two very different models can tie.\\n(C) The wrong assumption: that 0.5 relates to the team's capacity. That threshold may produce 5 or 5,000 alerts a day.\\n(D) The wrong assumption: that summarizing every threshold is better. It includes thresholds you will never use; two models with the same ROC-AUC can differ a lot in the top 100.\\n\\nExam cue: Pick the metric that mimics the real decision: if k cases get reviewed, measure precision on those k.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-q2\"},{\"id\":\"19\",\"question\":\"You compare two churn models on the same test set: model X has ROC-AUC 0.50 and model Y 0.85. Your manager asks what that 0.50 means. What do you answer?\",\"options\":{\"A\":\"That X is right half the time, just as Y is right 85% of the time\",\"B\":\"That X is perfectly calibrated\",\"C\":\"That X is only useless at the 0.5 threshold; at another threshold it may be excellent\",\"D\":\"That X ranks like chance: the probability that it scores a churner higher than a staying customer is 0.5\"},\"correct\":\"D\",\"explanation\":\"It wins because that is what ROC-AUC means; Y, at 0.85, ranks much better than chance.\\n\\nWhy the others fail:\\n(A) The wrong assumption: reading it as percent correct. ROC-AUC measures ranking, not hits.\\n(B) The wrong assumption: that it measures calibration. ROC-AUC only depends on the order of the scores.\\n(C) The wrong assumption: that it depends on one threshold. ROC-AUC already summarizes them all; 0.5 means none helps.\\n\\nExam cue: ROC-AUC = probability of ranking a positive–negative pair correctly; 0.5 is chance.\",\"difficulty\":\"basic\",\"flowItem\":\"s4-ck1\"},{\"id\":\"20\",\"question\":\"A fraud model (0.1% fraud) has ROC-AUC 0.97, but the review team says almost all its alerts are false. You are asked for a metric to track it month by month that reflects that problem. Which one?\",\"options\":{\"A\":\"Specificity, because it looks at correctly classified legitimate cases\",\"B\":\"PR-AUC (average precision) and precision at the operating threshold\",\"C\":\"Monthly accuracy\",\"D\":\"Keep ROC-AUC, but with more decimals\"},\"correct\":\"B\",\"explanation\":\"It wins because precision compares false alarms with detected frauds, not with the huge number of legitimate cases, so it reflects that alerts are mostly false.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that looking at negatives helps here. With millions of legitimate cases specificity stays very high despite many false alarms.\\n(C) The wrong assumption: that a high number is a good number. Legitimate cases dominate it, and it could rise while alerts get worse.\\n(D) The wrong assumption: that it lacks resolution. The problem is what it measures: the false-positive rate stays low because it divides by millions of negatives.\\n\\nExam cue: With very rare classes, track PR-AUC and alert precision, not just ROC-AUC.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-ck2\"},{\"id\":\"21\",\"question\":\"Each fraud alert is reviewed by a person for €5 (fraud or not), and each fraud that slips through costs €500. The model outputs well-calibrated probabilities. From what probability should you alert?\",\"options\":{\"A\":\"From 0.5, the default\",\"B\":\"From 0.99, so almost every alert is fraud\",\"C\":\"From 0.01: alerting pays when the expected loss you avoid (p × €500) exceeds the €5 review\",\"D\":\"From the threshold that maximizes F1 on test\"},\"correct\":\"C\",\"explanation\":\"It wins because p × 500 \u003e 5 is equivalent to p \u003e 0.01; with calibrated probabilities that is the minimum-expected-cost rule, later confirmed on validation.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that 0.5 is neutral. It is optimal only if both errors cost the same; here missing a fraud costs 100 times more than reviewing.\\n(B) The wrong assumption: maximizing precision at any price. It lets almost all fraud through, which is the big cost.\\n(D) The wrong assumption: that F1 reflects the business. F1 ignores the €5 and €500 costs, and picking the threshold on test contaminates it.\\n\\nExam cue: With calibrated probabilities, alert when p exceeds review cost / cost of missing the case.\",\"difficulty\":\"advanced\",\"flowItem\":\"s4-ck3\"},{\"id\":\"22\",\"question\":\"You trained a default-prediction logistic regression with class_weight=\\\"balanced\\\" (5% defaults) to improve recall. Finance now uses its probabilities directly to price risk, and notices the average predicted probability is far above the real 5%, even on the training data. What is going on?\",\"options\":{\"A\":\"Class weights made the model learn as if the classes were balanced: its probabilities are no longer calibrated; recalibrate them (for example with CalibratedClassifierCV) or train without weights and move the threshold\",\"B\":\"There is data leakage in the default features\",\"C\":\"It is data drift: new customers are riskier\",\"D\":\"The model overfits; add regularization\"},\"correct\":\"A\",\"explanation\":\"It wins because weights help detect the rare class but bias probabilities toward it; to use them as risk you must calibrate them.\\n\\nWhy the others fail:\\n(B) The wrong assumption: mixing up symptoms. Leakage would inflate evaluation; here probabilities rise systematically because of the weight you imposed.\\n(C) The wrong assumption: blaming the world. The mismatch appears on the training data too, not only on new customers.\\n(D) The wrong assumption: that every error is overfitting. Overfitting does not explain a systematic upward bias in all probabilities.\\n\\nExam cue: Weighting classes improves detection but breaks calibration: recalibrate before using probabilities as risk.\",\"difficulty\":\"advanced\",\"flowItem\":\"s4-ck4\"},{\"id\":\"23\",\"question\":\"To curb possible overfitting, a colleague set alpha=1000 on a Ridge price regression. The model now gives R² 0.21 on train and 0.20 on validation; before it gave 0.78 and 0.74. What happened?\",\"options\":{\"A\":\"It now generalizes perfectly: train and validation almost match\",\"B\":\"It over-regularized: the model is now underfitting; lower alpha and choose it with cross-validation\",\"C\":\"There is data leakage in validation\",\"D\":\"The target needs scaling\"},\"correct\":\"B\",\"explanation\":\"It wins because a huge penalty crushes the coefficients toward zero; train and validation drop together, the signature of underfitting.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that a small gap is enough. Both numbers are bad: the model stopped learning the pattern.\\n(C) The wrong assumption: mixing up symptoms. Leakage would inflate validation; here it went down.\\n(D) The wrong assumption: that target scale changes the fit. Multiplying the target by a constant does not change Ridge's R²; the problem is the penalty.\\n\\nExam cue: A small gap with bad numbers is underfitting, not success.\",\"difficulty\":\"basic\",\"flowItem\":\"s5-q1\"},{\"id\":\"24\",\"question\":\"With 5,000 rows your model scores 0.95 on train and 0.80 on validation; with 10,000 rows, 0.94 and 0.84. Labeling 10,000 more rows takes a month. Your manager proposes a much bigger model instead. What do you recommend?\",\"options\":{\"A\":\"The bigger model: with more capacity validation will rise\",\"B\":\"Nothing: 0.84 will not improve\",\"C\":\"Drop validation and train on the 10,000 rows\",\"D\":\"Get more labeled data: validation keeps rising with more rows and the gap with train is closing\"},\"correct\":\"D\",\"explanation\":\"It wins because that is how to read a learning curve: a variance-limited model improves with more data.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that capacity is missing. The gap points to excess variance, and more capacity tends to widen it.\\n(B) The wrong assumption: seeing a ceiling where there is none. Validation keeps rising as data is added.\\n(C) The wrong assumption: that measuring is optional. You would lose the way to know whether the decision worked.\\n\\nExam cue: Measure the learning curve before choosing between more data and more model.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s5-q2\"},{\"id\":\"25\",\"question\":\"You forecast daily demand for 40 stores with 3 years of history. A colleague validates with KFold(shuffle=True) and gets a tiny error; in production the error triples. Which validation should they have used?\",\"options\":{\"A\":\"Time-based validation: train on earlier dates and validate on later ones (for example, TimeSeriesSplit)\",\"B\":\"StratifiedKFold to keep the proportion of holidays\",\"C\":\"More folds (k=20) to reduce variance\",\"D\":\"Keep shuffle=True but drop the date features\"},\"correct\":\"A\",\"explanation\":\"It wins because it mimics production, where the future is always predicted from the past.\\n\\nWhy the others fail:\\n(B) The wrong assumption: that stratifying fixes ordering. The model would still see future days next to the one it must predict.\\n(C) The wrong assumption: that it is a variance problem. More shuffled folds repeat the same temporal leak.\\n(D) The wrong assumption: that the leak lives in the date column. Neighboring days look alike in sales and weather; the leak remains even without the date.\\n\\nExam cue: If production predicts the future, validate on the future.\",\"difficulty\":\"basic\",\"flowItem\":\"s5-ck1\"},{\"id\":\"26\",\"question\":\"You have 12,000 X-rays from 900 patients (several per patient). With a random split by image the model scores 0.97 AUC; on new patients from the same hospital, 0.81. What do you change in validation?\",\"options\":{\"A\":\"Stratify by diagnosis\",\"B\":\"Augment the data with rotations and crops\",\"C\":\"Split by patient (GroupKFold or GroupShuffleSplit): all of a patient's images on the same side\",\"D\":\"Train more epochs with early stopping\"},\"correct\":\"C\",\"explanation\":\"It wins because the test set then contains only new patients, as in production, and the model cannot rely on recognizing the person.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that the issue is the share of sick patients. Stratifying keeps it, but still mixes images of the same patient across train and test.\\n(B) The wrong assumption: that variety is missing. Augmentation helps generalization, but it does not fix a contaminated test set.\\n(D) The wrong assumption: that it is a training problem. It does not change that test shares patients with train.\\n\\nExam cue: Split by the entity that will be new in production.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s5-ck2\"},{\"id\":\"27\",\"question\":\"You tried 300 hyperparameter combinations against the same 500-row validation set. The best scores 0.91 on validation and 0.85 on the test set you had not touched. Your manager wants to report 0.91. What do you do?\",\"options\":{\"A\":\"Report 0.91: it is the best result obtained\",\"B\":\"Report the test's 0.85 and, next time, use cross-validation (or nested CV) and fewer combinations\",\"C\":\"Keep tuning until the test also reaches 0.91\",\"D\":\"Average 0.91 and 0.85 and report 0.88\"},\"correct\":\"B\",\"explanation\":\"It wins because the untouched test set is the honest estimate; choosing among many tries on few rows overfits the validation set.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that the maximum is representative. It is the best of 300 noisy measurements and includes luck.\\n(C) The wrong assumption: that the test set is another target. It then becomes another validation set and you lose your honest measurement.\\n(D) The wrong assumption: that averaging removes bias. Mixing a biased measurement with an honest one is still biased.\\n\\nExam cue: Validation can be overfit too; the untouched test gives the number to report.\",\"difficulty\":\"advanced\",\"flowItem\":\"s5-ck3\"},{\"id\":\"28\",\"question\":\"Going from 20,000 to 80,000 rows, your linear demand model still scores 0.71 on train and 0.70 on validation. You are offered 200,000 more rows of the same kind. Do you recommend buying them?\",\"options\":{\"A\":\"Yes: more data always improves the model\",\"B\":\"Yes, and also add strong regularization\",\"C\":\"No; better remove features to simplify\",\"D\":\"Not for now: train and validation converged at a low value (high bias); more capacity or better features are needed\"},\"correct\":\"D\",\"explanation\":\"It wins because when both curves meet low, the limit lies in the model or the information in the features, not in the number of rows.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that data cures everything. The curves have converged; more rows of the same kind do not lift a ceiling set by the model.\\n(B) The wrong assumption: treating it as overfitting. The model is already underfitting; regularizing makes it worse.\\n(C) The wrong assumption: that simplifying always helps. It increases bias, which is exactly the problem.\\n\\nExam cue: Curves together and low: change the model or the features, do not buy more rows.\",\"difficulty\":\"advanced\",\"flowItem\":\"s5-ck4\"},{\"id\":\"29\",\"question\":\"A network must classify product photos into exactly one of 12 categories (each photo belongs to only one). You are defining the last layer and the loss. What do you choose?\",\"options\":{\"A\":\"12 neurons with softmax and categorical cross-entropy\",\"B\":\"1 neuron with sigmoid and binary cross-entropy\",\"C\":\"12 neurons with a sigmoid each\",\"D\":\"1 linear neuron with MSE predicting the category number (1–12)\"},\"correct\":\"A\",\"explanation\":\"It wins because softmax gives 12 probabilities that sum to 1 and compete, and cross-entropy penalizes low probability on the correct class.\\n\\nWhy the others fail:\\n(B) The wrong assumption: that one output is enough. A sigmoid handles yes/no, not a choice among 12.\\n(C) The wrong assumption: confusing it with multi-label. That output does not force a single category.\\n(D) The wrong assumption: treating categories as numbers. It imposes an order and a distance that do not exist.\\n\\nExam cue: One class of N → softmax + cross-entropy; several at once → one sigmoid per label.\",\"difficulty\":\"basic\",\"flowItem\":\"s6-q1\"},{\"id\":\"30\",\"question\":\"A bank wants an assistant that answers questions about 3,000 internal policies that change every week, citing the exact policy. The budget is limited and it cannot retrain models every week. Which architecture do you choose?\",\"options\":{\"A\":\"Weekly fine-tuning of an LLM on the policies\",\"B\":\"Paste all 3,000 policies into every prompt\",\"C\":\"RAG: index the policies, retrieve the relevant chunks for each question and ask the LLM to answer from them and cite them\",\"D\":\"An LLM with no context at temperature 0 so it does not make things up\"},\"correct\":\"C\",\"explanation\":\"It wins because updating means re-indexing, with no retraining, and the citation comes from the retrieved chunk, which can be checked.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that fine-tuning is how you “teach” data. It is expensive to repeat weekly and does not guarantee recalling the exact text or giving the source.\\n(B) The wrong assumption: that context is free and infinite. It is very expensive per call and may not fit in the context window.\\n(D) The wrong assumption: that temperature adds knowledge. Low temperature reduces variety; it does not give the model policies it never saw.\\n\\nExam cue: Your own, changing knowledge → retrieve it with RAG; fine-tuning is for style or a repeated task.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s6-q2\"},{\"id\":\"31\",\"question\":\"You have 5,000 customers with 25 numeric and categorical columns to predict churn. A colleague wants to start with a deep network “because it is the most modern”. You have one week. Where do you start?\",\"options\":{\"A\":\"With the deep network, and if it goes badly, more layers\",\"B\":\"With an LLM that receives each row as text\",\"C\":\"With k-means with 2 clusters\",\"D\":\"With a baseline and a logistic regression, then gradient boosting; the network only if it beats it on validation\"},\"correct\":\"D\",\"explanation\":\"It wins because on medium tables boosted trees are usually the strongest with less tuning; the network must earn its place on validation.\\n\\nWhy the others fail:\\n(A) The wrong assumption: modern = better. On tables this size a network rarely beats boosting and needs more tuning.\\n(B) The wrong assumption: that an LLM fits everything. It is expensive and slow, and there is no reason to expect it to beat a model trained on the label.\\n(C) The wrong assumption: ignoring the label. There is churn history: it is a supervised problem.\\n\\nExam cue: Medium table: boosting first; the network has to prove it wins.\",\"difficulty\":\"basic\",\"flowItem\":\"s6-ck1\"},{\"id\":\"32\",\"question\":\"You use an LLM to extract the fields of 10,000 invoices into JSON. Sometimes it renames keys or adds text before the JSON, and your code breaks. Which change is most effective?\",\"options\":{\"A\":\"Raise the temperature so the model “thinks” more\",\"B\":\"Low temperature, an explicit JSON schema (structured output if the API offers it) and validating every response with code\",\"C\":\"Ask it “please be very exact” in capital letters\",\"D\":\"Switch to a bigger LLM and skip validation\"},\"correct\":\"B\",\"explanation\":\"It wins because it pins the format and catches failures to retry or review them.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that temperature means effort. Higher temperature increases output variation and worsens the format.\\n(C) The wrong assumption: that insisting is controlling. It helps little and guarantees nothing; without validation errors still get through.\\n(D) The wrong assumption: that a better model never fails. It reduces errors, but without validation the remaining ones will break the system.\\n\\nExam cue: Reliable format = schema + validation, not the model's good will.\",\"difficulty\":\"basic\",\"flowItem\":\"s6-ck2\"},{\"id\":\"33\",\"question\":\"A network tags travel photos with “beach”, “mountain”, “dog” and “sunset”, and one photo can have several at once. With softmax, photos with a beach and a dog get only one high label. What do you change?\",\"options\":{\"A\":\"One sigmoid per label with binary cross-entropy, and one threshold per label\",\"B\":\"Raise the softmax temperature\",\"C\":\"Train more epochs\",\"D\":\"Always keep the softmax's 2 most likely classes\"},\"correct\":\"A\",\"explanation\":\"It wins because each sigmoid gives an independent probability; they need not sum to 1, so several labels can be true at once.\\n\\nWhy the others fail:\\n(B) The wrong assumption: that smoothing is enough. The probabilities still sum to 1 and compete.\\n(C) The wrong assumption: that it lacks training. The problem is the output layer, not how long it trains.\\n(D) The wrong assumption: that every photo has two labels. It forces 2 even when a photo has 1 or 3.\\n\\nExam cue: Several labels at once → independent sigmoids.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s6-ck3\"},{\"id\":\"34\",\"question\":\"Your RAG answers 3 out of 10 questions wrong. Reviewing those cases, the retrieved chunks do not contain the answer, although the right document is indexed. Only one change fits this sprint. Which one?\",\"options\":{\"A\":\"Switch to a bigger LLM\",\"B\":\"Lower the temperature to 0\",\"C\":\"Work on retrieval: measure whether the right chunk is in the top k and improve chunking, search (hybrid or with re-ranking) or k\",\"D\":\"Fine-tune the LLM on the failing questions\"},\"correct\":\"C\",\"explanation\":\"It wins because the failure happens before the generator, and measuring retrieval separately tells you what to fix.\\n\\nWhy the others fail:\\n(A) The wrong assumption: that the generator is the bottleneck. If the right chunk never reaches the prompt, no model can answer well from it.\\n(B) The wrong assumption: that it is a sampling problem. It does not change which chunks are retrieved.\\n(D) The wrong assumption: that memorizing answers fixes search. It does not change what is retrieved and goes stale when the documents change.\\n\\nExam cue: In RAG, evaluate retrieval and generation separately.\",\"difficulty\":\"advanced\",\"flowItem\":\"s6-ck4\"}]}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
