e\":{\"display\":\"inline-block\"},\"children\":[\"$\",\"h2\",null,{\"style\":{\"fontSize\":14,\"fontWeight\":400,\"lineHeight\":\"49px\",\"margin\":0},\"children\":\"This page could not be found.\"}]}]]}]}]]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"$L5\",null,{}]]}]}]]}]]}],{\"children\":[\"quiz\",[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"ruta-ml-engineer-gcp\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",null,[\"$\",\"$L7\",null,{\"children\":\"$L8\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"QQ270EB9z3ChCCjDo_PLB\",{\"children\":[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],null]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$d\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"e:I[9030,[\"206\",\"static/chunks/206-c4310c4aac9e1a25.js\",\"200\",\"static/chunks/app/quiz/%5Bid%5D/page-8500fbbb03871769.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"quiz\":{\"id\":\"ruta-ml-engineer-gcp\",\"title\":\"ML Engineer on Google Cloud path exam\",\"questions\":[{\"id\":\"1\",\"question\":\"A spam filter moves emails to the spam folder. Users complain they lose important emails from their bank and their boss, and the team can only adjust the threshold this week. Which metric should guide the change?\",\"options\":{\"A\":\"Recall of the spam class\",\"B\":\"Overall accuracy\",\"C\":\"Precision of the spam class: raise the threshold until almost everything flagged is truly spam\",\"D\":\"ROC AUC\"},\"correct\":\"C\",\"explanation\":\"Wins because the cost is in false positives (good emails in spam), and precision measures exactly that fraction.\\n\\nWhy the others fail:\\n(A) Assumes the problem is spam getting through; the complaint is about good emails flagged as spam.\\n(B) Assumes one global number reflects the costly error; with lots of legitimate mail, accuracy barely moves.\\n(D) Assumes global ranking decides; AUC does not change when you move the threshold and says nothing about lost good emails.\\n\\nExam cue: Pick the metric by the costliest error: expensive false positives → precision.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-q1\"},{\"id\":\"2\",\"question\":\"Your churn dataset has one row per customer per month (24 rows per customer). With a random row-level split the AUC is 0.93; on customers it never saw it drops to 0.77. The model must be used on new customers. What do you change?\",\"options\":{\"A\":\"Split by customer (each whole customer in training or validation) with a stable hash of their id\",\"B\":\"Train more epochs until the new-customer AUC rises\",\"C\":\"Remove regularization so the model captures more detail\",\"D\":\"Use accuracy instead of AUC\"},\"correct\":\"A\",\"explanation\":\"Wins because it stops the model from recognizing seen customers; validation now looks like production.\\n\\nWhy the others fail:\\n(B) Assumes undertraining; more epochs increase memorization of customers.\\n(C) Assumes high bias; the symptom is variance from leakage across splits.\\n(D) Changes the metric but not the split that is leaking information.\\n\\nExam cue: Correlated rows (same customer, patient or device) → group split.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-q2\"},{\"id\":\"3\",\"question\":\"An airline wants to estimate how many minutes each flight will be delayed, with 2 years of labeled history and a team that must ship a first model in a week. What type of problem is it?\",\"options\":{\"A\":\"Binary classification\",\"B\":\"Supervised regression\",\"C\":\"Clustering\",\"D\":\"Reinforcement learning\"},\"correct\":\"B\",\"explanation\":\"Wins: the output is a continuous number and there are historical labels.\\n\\nWhy the others fail:\\n(A) Assumes a yes/no output; here a number of minutes is requested.\\n(C) Assumes no label; the history does contain the real delay.\\n(D) Assumes an agent acting for rewards; here we only predict.\\n\\nExam cue: Look at the output shape: continuous number → regression.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-c1\"},{\"id\":\"4\",\"question\":\"Your network reaches 2% training error and 15% validation error; adding epochs lowers the first and raises the second. You can afford one change before the demo. Which one?\",\"options\":{\"A\":\"A bigger model\",\"B\":\"More epochs\",\"C\":\"Drop the validation set and train on everything\",\"D\":\"Early stopping on validation loss (with regularization if needed)\"},\"correct\":\"D\",\"explanation\":\"Wins: it stops when validation worsens and tackles variance.\\n\\nWhy the others fail:\\n(A) Assumes high bias; more capacity worsens variance.\\n(B) Assumes undertraining; the symptom is the opposite.\\n(C) Removes the signal that lets you detect the problem.\\n\\nExam cue: Big train–validation gap = variance: regularize or stop earlier.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-c2\"},{\"id\":\"5\",\"question\":\"You forecast daily sales with 3 years of history; the model retrains monthly and always predicts the next month. You want an honest error estimate before deploying. How do you validate?\",\"options\":{\"A\":\"Train on the past and validate on the period right after, repeating it forward in time\",\"B\":\"k-fold cross-validation with random folds\",\"C\":\"Random 80/20 split with a fixed seed\",\"D\":\"Validate on the training period itself\"},\"correct\":\"A\",\"explanation\":\"Wins: it mirrors how the model will be used and does not leak the future.\\n\\nWhy the others fail:\\n(B) Mixes future days into training and gives an optimistic error.\\n(C) A fixed seed makes the leak reproducible; it does not remove it.\\n(D) Measures memory, not generalization.\\n\\nExam cue: Time series: always validate forward in time.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-c3\"},{\"id\":\"6\",\"question\":\"A fraud model has been stable for a year. After a new regulation changes which operations count as fraud, input distributions stay the same, but precision measured on real labels drops from 0.82 to 0.55. What is happening and what do you do?\",\"options\":{\"A\":\"Data drift: tune the feature alert thresholds\",\"B\":\"Training-serving skew: unify the preprocessing\",\"C\":\"Concept drift: relabel with the new definition and retrain on recent data\",\"D\":\"Increase the endpoint's replica count\"},\"correct\":\"C\",\"explanation\":\"Wins: the relationship between inputs and label changed, and only new data reflects it.\\n\\nWhy the others fail:\\n(A) Assumes the inputs changed; the distributions are unchanged.\\n(B) Skew exists from deployment; this model worked for a year.\\n(D) It is an accuracy problem, not a serving capacity issue.\\n\\nExam cue: Same inputs + performance dropping on real labels → concept drift.\",\"difficulty\":\"advanced\",\"flowItem\":\"s1-c4\"},{\"id\":\"7\",\"question\":\"An e-commerce site has 300 million user–product interactions (views and purchases) in BigQuery and wants to suggest 10 products per user every night. The team only uses SQL. Which MODEL_TYPE do you choose?\",\"options\":{\"A\":\"KMEANS\",\"B\":\"LOGISTIC_REG with the product id as the label\",\"C\":\"ARIMA_PLUS\",\"D\":\"MATRIX_FACTORIZATION and ML.RECOMMEND\"},\"correct\":\"D\",\"explanation\":\"Wins: it learns user and product factors from the interactions and recommends in SQL.\\n\\nWhy the others fail:\\n(A) Groups similar users, but does not score user–product pairs.\\n(B) Turns millions of products into classes: unmanageable and without collaborative signal.\\n(C) It is for time series, not preferences.\\n\\nExam cue: User–item interactions → matrix factorization.\",\"difficulty\":\"basic\",\"flowItem\":\"s2-q1\"},{\"id\":\"8\",\"question\":\"You must forecast 12 weeks of demand for 4,000 products, and the committee demands to see which part of the forecast is trend, seasonality and holiday effect. The data is in BigQuery. What do you do?\",\"options\":{\"A\":\"AI.FORECAST with TimesFM, with no model\",\"B\":\"ARIMA_PLUS with TIME_SERIES_ID_COL and HOLIDAY_REGION, plus ML.EXPLAIN_FORECAST\",\"C\":\"One LINEAR_REG per product with the date as a feature\",\"D\":\"Export to CSV and use a spreadsheet\"},\"correct\":\"B\",\"explanation\":\"Wins: it trains all 4,000 series in one statement and ML.EXPLAIN_FORECAST shows trend, seasonality and holidays.\\n\\nWhy the others fail:\\n(A) It is fast, but its explainability is low: it does not provide the decomposition the committee asks for.\\n(C) 4,000 manual models with no time series components.\\n(D) Does not scale to 4,000 series or give intervals.\\n\\nExam cue: Explain the decomposition → ARIMA_PLUS + ML.EXPLAIN_FORECAST; no model → AI.FORECAST.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-q2\"},{\"id\":\"9\",\"question\":\"Your BigQuery ML binary classifier uses a 0.5 threshold, and the business wants to see, without retraining, how recall and false positive rate change for each possible threshold. What do you query?\",\"options\":{\"A\":\"ML.ROC_CURVE\",\"B\":\"ML.THRESHOLD_EVALUATE\",\"C\":\"ML.TRAINING_INFO\",\"D\":\"ML.FEATURE_INFO\"},\"correct\":\"A\",\"explanation\":\"Wins: it returns recall, false_positive_rate and counts per threshold for binary classifiers.\\n\\nWhy the others fail:\\n(B) It does not exist: a classic distractor.\\n(C) Gives loss per training iteration, not metrics per threshold.\\n(D) Gives statistics of the input features.\\n\\nExam cue: Threshold without retraining → ML.ROC_CURVE and then STRUCT(… AS threshold).\",\"difficulty\":\"basic\",\"flowItem\":\"s2-c1\"},{\"id\":\"10\",\"question\":\"You want BigQuery ML to try 20 LEARN_RATE and MAX_TREE_DEPTH combinations, keep the one with the best ROC AUC and let you review each attempt, without leaving SQL. What do you write?\",\"options\":{\"A\":\"SELECT * FROM ML.TUNE(MODEL …, STRUCT(20 AS max_trials))\",\"B\":\"Twenty separate CREATE MODEL statements compared with ML.COMPARE\",\"C\":\"NUM_TRIALS = 20 with HPARAM_RANGE/HPARAM_CANDIDATES and HPARAM_TUNING_OBJECTIVES = ['ROC_AUC'], then ML.TRIAL_INFO\",\"D\":\"Export to Agent Platform and launch a tuning job\"},\"correct\":\"C\",\"explanation\":\"Wins: tuning lives inside CREATE MODEL and ML.TRIAL_INFO shows each trial and which one is optimal.\\n\\nWhy the others fail:\\n(A) ML.TUNE does not exist in BigQuery ML.\\n(B) ML.COMPARE does not exist, and repeating models by hand misses native tuning.\\n(D) It works, but adds data movement and code when SQL already solves it.\\n\\nExam cue: In BigQuery ML tuning is NUM_TRIALS + ML.TRIAL_INFO.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-c2\"},{\"id\":\"11\",\"question\":\"You no longer keep your BigQuery ML model's training dataset. Every Monday you want to check whether serving data resembles the training data, with per-column thresholds. Which function do you use?\",\"options\":{\"A\":\"ML.VALIDATE_DATA_DRIFT between this week and last week\",\"B\":\"ML.VALIDATE_DATA_SKEW on the serving data\",\"C\":\"ML.DETECT_DRIFT\",\"D\":\"ML.EVALUATE with no input table\"},\"correct\":\"B\",\"explanation\":\"Wins: it compares with the training statistics the model stored, without needing the original dataset.\\n\\nWhy the others fail:\\n(A) Compares two serving datasets: it measures drift, not distance to training.\\n(C) It does not exist in BigQuery ML.\\n(D) Returns training metrics; it does not compare distributions.\\n\\nExam cue: Skew = serving vs training; drift = serving vs serving.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-c3\"},{\"id\":\"12\",\"question\":\"You trained a credit BOOSTED_TREE_CLASSIFIER with no extra options. Today the regulator asks for the reason customer 8812 was rejected and, for the quarterly report, each variable's global influence measured with attributions. What do you do?\",\"options\":{\"A\":\"ML.GLOBAL_EXPLAIN for both\",\"B\":\"ML.WEIGHTS to see the coefficients\",\"C\":\"ML.LOCAL_EXPLAIN for the customer and ML.FEATURE_INFO for the report\",\"D\":\"ML.EXPLAIN_PREDICT today for the customer; retrain with ENABLE_GLOBAL_EXPLAIN = TRUE to use ML.GLOBAL_EXPLAIN in the report\"},\"correct\":\"D\",\"explanation\":\"Wins: the local explanation works now; global attribution needs the option at training time.\\n\\nWhy the others fail:\\n(A) It doesn't explain a specific row and also fails without ENABLE_GLOBAL_EXPLAIN.\\n(B) Trees have no weights function.\\n(C) ML.LOCAL_EXPLAIN does not exist and ML.FEATURE_INFO gives statistics, not influence.\\n\\nExam cue: Local → ML.EXPLAIN_PREDICT; global → ML.GLOBAL_EXPLAIN with ENABLE_GLOBAL_EXPLAIN.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-c4\"},{\"id\":\"13\",\"question\":\"A BigQuery ML model must answer the checkout app in under 100 ms per request, and the team also wants to compare versions and monitor drift from one place without writing a container. Which path do you choose?\",\"options\":{\"A\":\"Register it in Model Registry (MODEL_REGISTRY = 'VERTEX_AI') and deploy it to an online endpoint\",\"B\":\"Call ML.PREDICT from the app on every request\",\"C\":\"Precompute ML.PREDICT hourly and read it from a table\",\"D\":\"Rewrite the model in TensorFlow and build a custom container\"},\"correct\":\"A\",\"explanation\":\"Wins: the registry lets you deploy without your own container, version, compare and monitor.\\n\\nWhy the others fail:\\n(B) It is a batch query: not designed for millisecond latencies.\\n(C) Serves stale values when the basket changes on every request.\\n(D) It works, but contradicts the no-container requirement and adds needless work.\\n\\nExam cue: BigQuery ML + online → Model Registry + endpoint.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-c5\"},{\"id\":\"14\",\"question\":\"You need to compute continuously, from Pub/Sub, the number of transactions per card in the last 10 minutes to feed a fraud model, at about 50,000 events per second and without managing servers. What do you use?\",\"options\":{\"A\":\"A scheduled BigQuery query every hour\",\"B\":\"Dataflow (Apache Beam) with sliding windows over the Pub/Sub stream\",\"C\":\"An always-on Dataproc cluster\",\"D\":\"pandas in a Workbench notebook\"},\"correct\":\"B\",\"explanation\":\"Wins: it processes streams with windows, autoscales and is serverless.\\n\\nWhy the others fail:\\n(A) An hour of delay is useless for real-time 10-minute windows.\\n(C) It works, but you manage the cluster and it isn't the managed streaming option.\\n(D) A notebook is not a production streaming process at that scale.\\n\\nExam cue: Streaming + windows + serverless → Dataflow.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-q1\"},{\"id\":\"15\",\"question\":\"A plant has 8,000 labeled part photos («ok», «scratched», «broken»), no neural-network expert, and three weeks for a pilot with good accuracy. Which training path do you choose?\",\"options\":{\"A\":\"Custom training of a CNN from scratch on GPUs\",\"B\":\"BigQuery ML with LOGISTIC_REG over the pixels\",\"C\":\"AutoML image classification on Agent Platform\",\"D\":\"K-means over the photos to discover the classes\"},\"correct\":\"C\",\"explanation\":\"Wins: it trains a quality vision model without training code from labeled data.\\n\\nWhy the others fail:\\n(A) Requires expertise the team lacks and more time.\\n(B) A linear model over pixels is not suited to vision.\\n(D) The classes are already labeled: the problem is supervised.\\n\\nExam cue: Labeled images + no experts → AutoML.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-q2\"},{\"id\":\"16\",\"question\":\"Your team prototypes with customer data that cannot leave the project; security requires IAM, CMEK and a private network, and the team wants JupyterLab with a GPU. Where do they work?\",\"options\":{\"A\":\"In free Colab with the data downloaded\",\"B\":\"On laptops with service account JSON keys\",\"C\":\"On a shared VM with the default account and the Editor role\",\"D\":\"In Agent Platform Workbench instances inside the project, with GPU, CMEK and VPC networking\"},\"correct\":\"D\",\"explanation\":\"Wins: managed JupyterLab with the project's security controls.\\n\\nWhy the others fail:\\n(A) It lives outside the project: your controls don't apply.\\n(B) Downloaded keys are a risk and the data leaves the perimeter.\\n(C) Violates least privilege and mixes identities.\\n\\nExam cue: Sensitive data + notebooks → Workbench or Colab Enterprise in your project.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-c1\"},{\"id\":\"17\",\"question\":\"A vision model takes 3 days on 1 GPU; it easily fits in one GPU's memory, the dataset is huge, and the business wants it in hours without changing the architecture. Which strategy do you apply?\",\"options\":{\"A\":\"Data parallelism across several GPUs (and nodes), with gradient all-reduce\",\"B\":\"Model parallelism splitting layers across GPUs\",\"C\":\"A CPU with many cores\",\"D\":\"Cut the dataset in half\"},\"correct\":\"A\",\"explanation\":\"Wins: each replica processes part of the batch; it is the fit when the model fits.\\n\\nWhy the others fail:\\n(B) It is for models that DON'T fit on one GPU; here it adds communication without benefit.\\n(C) Vision networks train much faster on accelerators.\\n(D) Cuts time at the expense of quality; it doesn't meet the requirement.\\n\\nExam cue: Model fits + huge data → data parallelism.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-c2\"},{\"id\":\"18\",\"question\":\"Your customer features are computed in BigQuery for training; the prediction API needs each customer's latest value in milliseconds, with the same definition as in training. What do you use?\",\"options\":{\"A\":\"One BigQuery query per request\",\"B\":\"Agent Platform Feature Store serving online from the BigQuery tables\",\"C\":\"Recompute the features in the API with custom code\",\"D\":\"Export the features to CSV every night\"},\"correct\":\"B\",\"explanation\":\"Wins: BigQuery is the offline store and Feature Store serves the latest value at low latency with the same definition.\\n\\nWhy the others fail:\\n(A) Queries take seconds and make every prediction expensive.\\n(C) Duplicates logic and opens the door to training-serving skew.\\n(D) Gives neither low latency nor fresh values.\\n\\nExam cue: Same feature in training and online → Feature Store.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-c3\"},{\"id\":\"19\",\"question\":\"Moving a PyTorch job from 1 to 8 GPUs, you multiplied the batch and the learning rate by 8. From epoch 3 the loss is NaN; the data and model code are unchanged. What do you do first?\",\"options\":{\"A\":\"Add more GPUs to stabilize it\",\"B\":\"Remove dropout\",\"C\":\"Add learning-rate warmup and gradient clipping, and lower the learning rate if it persists\",\"D\":\"Switch to model parallelism\"},\"correct\":\"C\",\"explanation\":\"Wins: the step is too large and gradients explode; warmup and clipping stabilize it.\\n\\nWhy the others fail:\\n(A) More hardware doesn't fix exploding gradients.\\n(B) Dropout does not cause NaN; the issue is the step size.\\n(D) The model fits; changing strategy doesn't fix the learning rate.\\n\\nExam cue: NaN after raising the learning rate → exploding gradients: warmup + clipping.\",\"difficulty\":\"advanced\",\"flowItem\":\"s3-c4\"},{\"id\":\"20\",\"question\":\"Each training run takes 2 hours, you can afford 40 trials and the result is due in 2 days (48 h). Sequentially it would take 80 h. How do you configure hyperparameter tuning on Agent Platform?\",\"options\":{\"A\":\"40 trials all in parallel to finish in 2 hours\",\"B\":\"1 trial at a time with the default algorithm\",\"C\":\"GRID_SEARCH over continuous ranges\",\"D\":\"Default (Bayesian) algorithm with about 4 parallel trials\"},\"correct\":\"D\",\"explanation\":\"Wins: 10 rounds of 2 h fit the deadline and each round learns from the previous ones.\\n\\nWhy the others fail:\\n(A) Meets the deadline, but the Bayesian algorithm learns nothing between attempts: it becomes a random search.\\n(B) It would take 80 hours: it misses the deadline.\\n(C) Grid search requires discrete parameters.\\n\\nExam cue: Just enough parallelism for the deadline; the rest sequential so the Bayesian search learns.\",\"difficulty\":\"advanced\",\"flowItem\":\"s3-c5\"},{\"id\":\"21\",\"question\":\"Marketing needs the purchase probability of 50 million customers every Sunday for Monday's campaign. Nobody queries the model during the week and the budget is tight. How do you serve it?\",\"options\":{\"A\":\"Batch inference scheduled on Sunday, writing to BigQuery\",\"B\":\"An online endpoint with 10 minimum replicas\",\"C\":\"Call the endpoint 50 million times on Sunday\",\"D\":\"A notebook someone runs by hand\"},\"correct\":\"A\",\"explanation\":\"Wins: it only pays while running and needs no endpoint.\\n\\nWhy the others fail:\\n(B) You pay for replicas running all week with no traffic.\\n(C) Uses a low-latency tool for a massive, expensive job.\\n(D) Not repeatable or reliable for production.\\n\\nExam cue: Results for later + large volume → batch.\",\"difficulty\":\"basic\",\"flowItem\":\"s4-q1\"},{\"id\":\"22\",\"question\":\"Your endpoint handles 10 requests per second, but every Black Friday it hits 800 within minutes and the 150 ms SLA breaks while it scales. The spike is predictable. What do you adjust?\",\"options\":{\"A\":\"Lower the CPU target to 10% all year\",\"B\":\"Retrain the model with Black Friday data\",\"C\":\"Switch to batch inference\",\"D\":\"Raise the minimum replicas before the event (and the maximum to cover the peak), then lower it afterwards\"},\"correct\":\"D\",\"explanation\":\"Wins: capacity is ready when the spike arrives; autoscaling doesn't have to catch up.\\n\\nWhy the others fail:\\n(A) Keeps many replicas all the time: expensive for a few-day spike.\\n(B) It's a capacity problem, not an accuracy one.\\n(C) Checkout needs a per-request answer.\\n\\nExam cue: Predictable spike → minimum replicas ready beforehand; autoscaling takes time.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-q2\"},{\"id\":\"23\",\"question\":\"A new model beats the current one in validation, but you don't want to risk every customer or change the URL apps use. You need to roll back within minutes. How do you deploy it?\",\"options\":{\"A\":\"Create a new endpoint and change the URL in every app\",\"B\":\"Replace the model all at once after hours\",\"C\":\"Deploy it on the same endpoint with 10% of traffic and raise it while metrics hold\",\"D\":\"Test it only on validation data again\"},\"correct\":\"C\",\"explanation\":\"Wins: canary with a traffic split; rolling back means sending 100% back to the old one.\\n\\nWhy the others fail:\\n(A) Changes the URL and doesn't limit the initial risk.\\n(B) Risks 100% of customers from the first minute.\\n(D) Doesn't expose the model to real traffic.\\n\\nExam cue: Low-risk update → canary on the same endpoint.\",\"difficulty\":\"basic\",\"flowItem\":\"s4-c1\"},{\"id\":\"24\",\"question\":\"Model Monitoring raises a drift alert on «amount» after a campaign, but precision measured on 4 weeks of real labels has not changed and that feature's attribution is the same. What do you do?\",\"options\":{\"A\":\"Retrain immediately on the campaign data\",\"B\":\"Investigate the cause, review the alert threshold and keep watching label-based performance\",\"C\":\"Turn off monitoring for that feature\",\"D\":\"Roll back to the previous model\"},\"correct\":\"B\",\"explanation\":\"Wins: drift flags a change in the inputs; it doesn't prove the model is failing.\\n\\nWhy the others fail:\\n(A) Assumes drift means a performance drop; the labels say otherwise.\\n(C) You lose visibility if the change starts hurting the model.\\n(D) The previous model would see the same inputs; there is no failure to revert.\\n\\nExam cue: Input drift ≠ performance drop: confirm with labels.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-c2\"},{\"id\":\"25\",\"question\":\"You must configure explanations on Agent Platform for a tabular XGBoost risk model. The regulator requires per-feature attributions on every online prediction. Which method do you configure?\",\"options\":{\"A\":\"Sampled Shapley\",\"B\":\"Integrated gradients\",\"C\":\"XRAI\",\"D\":\"None: global training importance is enough\"},\"correct\":\"A\",\"explanation\":\"Wins: it approximates Shapley values without gradients; it is the method for non-differentiable models such as trees.\\n\\nWhy the others fail:\\n(B) Needs a differentiable model; a tree ensemble isn't.\\n(C) It is designed for images, grouping attributions by region.\\n(D) The requirement is per prediction, not global.\\n\\nExam cue: Trees → sampled Shapley; image networks → integrated gradients or XRAI.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-c3\"},{\"id\":\"26\",\"question\":\"A demand model is retrained «whenever someone remembers». Real labels arrive 2 weeks late, the business changes by season, and a bad deployment is expensive. What policy do you propose?\",\"options\":{\"A\":\"Retrain every hour and always deploy the latest\",\"B\":\"Retrain only when a customer complains\",\"C\":\"Retrain once a year\",\"D\":\"A pipeline scheduled by season plus triggers from alerts or a label-based metric drop, with a gate against the current model before a canary\"},\"correct\":\"D\",\"explanation\":\"Wins: it combines schedule and evidence, and only promotes what proves better.\\n\\nWhy the others fail:\\n(A) Deploying without a gate risks worse models; hourly adds no new labels.\\n(B) Reacts late and without a measurable criterion.\\n(C) Ignores the business's seasonality.\\n\\nExam cue: Policy = schedule + triggers + evaluation gate.\",\"difficulty\":\"advanced\",\"flowItem\":\"s4-c4\"},{\"id\":\"27\",\"question\":\"Your endpoint answers in 450 ms and the SLA is 100 ms. Profiling shows the model takes 15 ms and the rest is one BigQuery query per request to fetch the customer's history. What do you change?\",\"options\":{\"A\":\"Move to a GPU machine\",\"B\":\"Serve those precomputed features from Feature Store instead of querying BigQuery on every request\",\"C\":\"Raise the maximum replicas\",\"D\":\"Retrain a smaller model\"},\"correct\":\"B\",\"explanation\":\"Wins: low-latency online reads with the same definition as in training.\\n\\nWhy the others fail:\\n(A) The model already takes 15 ms; the bottleneck is the query.\\n(C) More replicas don't speed up a slow per-request query.\\n(D) The model is not the problem.\\n\\nExam cue: Measure where the time goes before touching the model or hardware.\",\"difficulty\":\"advanced\",\"flowItem\":\"s4-c5\"}]}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
