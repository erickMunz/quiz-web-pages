unsuitable for the described shared notebook workflow.B. Like other SQL warehouse tiers, Classic warehouses serve SQL queries rather than hosting attached notebooks or arbitrary library installs, so they do not match the described interactive multi-user notebook workflow. Notebook attachment is a cluster capability, not a SQL warehouse one.C. An all-purpose cluster is designed to remain running so multiple users can attach notebooks, share installed libraries, and run interactive exploratory queries without waiting for a fresh cluster to start. This directly matches the described collaborative workflow.D. A job cluster is created for a single scheduled job run and terminates when that run finishes, so it does not stay available for multiple data scientists to attach notebooks throughout the day. It is not intended for shared, ongoing interactive use.f:T424,A. This confuses two distinct, separately documented result states. Databricks documents that upstream tasks in the `Excluded` result state are treated as successful for run-if evaluation, but a task that has been explicitly disabled is documented separately, and a disabled parent does not satisfy the succeeded requirement — so the downstream task does not run.B. Lakeflow Jobs does evaluate run-if conditions against disabled upstream tasks automatically during the same run; it does not leave a downstream task pending indefinitely, so this option misstates how the disablement rule is applied.C. There is no manual approval workflow for disabled tasks in Lakeflow Jobs. Run-if evaluation, and any resulting disablement of the downstream task, happens automatically without any operator action.D. This matches Databricks' documenta"])</script><script>self.__next_f.push([1,"tion: a disabled parent task does not satisfy the `All succeeded` requirement, so the downstream task does not run, and Lakeflow Jobs also marks that downstream task disabled for the run rather than executing or failing it.10:T45d,A. Compute cost reflects how much a node ran and what instance type it used, not how much memory it consumed or whether it failed, so a billing dashboard cannot distinguish a driver failure from an executor failure. Cost data is unrelated to memory diagnostics.B. The audit log is built for tracking user actions and commands for governance purposes and does not record memory allocation or process-level errors, so it cannot help localize an out-of-memory failure to the driver or an executor.C. An autoscaling history graph shows how many executors were attached at a given time, which is useful for capacity planning but does not report memory usage on any individual node, so it cannot show which process exhausted its memory.D. Driver logs surface the actual stack trace and error message that identify which process ran out of memory, while the Spark UI's Executors tab shows per-node memory usage and garbage-collection time that reveal whether individual executors were under memory pressure. Together these two sources give the most direct, process-level evidence needed to localize an out-of-memory failure."])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Ld\",null,{\"quiz\":{\"id\":\"databricks-data-engineer-associate\",\"title\":\"Databricks Certified Data Engineer Associate\",\"questions\":[{\"id\":\"1\",\"question\":\"Several data scientists want to share one running cluster throughout the day so they can attach notebooks, run ad hoc exploratory queries, and install shared libraries without waiting for a new cluster to start each time. Which compute type fits this pattern?\",\"options\":{\"A\":\"A serverless SQL warehouse, since it is designed for teams to attach notebooks directly and install custom Python libraries for exploration.\",\"B\":\"A Classic SQL warehouse, since Classic warehouses allow notebook attachment and multi-user library installation during interactive sessions.\",\"C\":\"An all-purpose cluster, since it stays available for multiple users to attach notebooks and share libraries across an interactive session.\",\"D\":\"A job cluster, since Databricks provisions it fresh for each notebook attachment and automatically shares libraries across every user session.\"},\"correct\":\"C\",\"explanation\":\"$e\"},{\"id\":\"2\",\"question\":\"A company runs three Databricks workspaces in the same AWS region for different business units and wants every workspace to enforce the same table permissions, lineage tracking, and audit logs without maintaining separate governance configuration in each workspace. What should they do?\",\"options\":{\"A\":\"Create an identical set of catalogs and manually replicate every grant statement in each workspace's own separate metastore\",\"B\":\"Configure a job cluster per workspace with matching cluster policies so that compute-level settings mirror the intended governance settings\",\"C\":\"Enable a classic SQL warehouse in each workspace, since SQL warehouses independently enforce table-level access control\",\"D\":\"Attach a single Unity Catalog metastore to all three workspaces so grants, lineage, and audit logs apply consistently across them\"},\"correct\":\"D\",\"explanation\":\"A. Manually duplicating catalogs and grants across separate metastores per workspace creates ongoing maintenance overhead and drift risk, which is exactly what a shared metastore is meant to avoid.B. Cluster policies control compute configuration such as instance types and autoscaling limits; they do not enforce data governance features like table grants, lineage, or audit logging.C. SQL warehouses execute queries under whatever governance layer is attached to the workspace; they do not independently define or enforce catalog-level access control across workspaces.D. A single Unity Catalog metastore can be attached to multiple workspaces in the same region, so permissions, lineage, and audit logs defined once apply consistently across all attached workspaces.\"},{\"id\":\"3\",\"question\":\"A data engineer wants Auto Loader to process all currently available files in a source directory and then stop on its own, rather than running continuously, so the workload can be scheduled as a Lakeflow Job that runs once per hour. Which configuration achieves this batch-style behavior?\",\"options\":{\"A\":\"Configure the `writeStream` with `Trigger.AvailableNow`, which processes all files available at the start of the run and then stops the stream automatically.\",\"B\":\"Configure the `writeStream` with no trigger specified at all, which causes Auto Loader to process one file per run and then exit without a checkpoint.\",\"C\":\"Configure the `readStream` to omit `cloudFiles.schemaLocation`, which forces Auto Loader to treat the workload as a one-time batch load by default.\",\"D\":\"Configure the `writeStream` with `Trigger.Continuous`, which processes files as they arrive and stops automatically once the source directory is empty.\"},\"correct\":\"A\",\"explanation\":\"A. `Trigger.AvailableNow` processes all files that are available when the job starts and then stops the stream once they are handled, which matches the hourly scheduled batch-style pattern the engineer wants.B. Leaving the trigger unspecified does not produce a one-file-and-exit batch behavior; the default streaming trigger processes micro-batches continuously rather than stopping after one file.C. Omitting the schema location does not turn a streaming job into a batch job; it only removes the location Auto Loader uses to persist and evolve the inferred schema, and is required for most formats to avoid errors.D. `Trigger.Continuous` is designed for low-latency continuous processing and does not stop automatically when a directory becomes empty, which is the opposite of the stop-on-its-own behavior needed here.\"},{\"id\":\"4\",\"question\":\"A source S3 bucket receives files from multiple upstream systems, and a data engineer wants a single `COPY INTO` run to ingest only the files under a `landing/2026/09/` prefix whose names end in `.csv`, ignoring `.json` and `.txt` files that land in the same prefix. Which clause should the engineer add to the statement?\",\"options\":{\"A\":\"`FILEFORMAT = CSV` alone, since specifying the file format automatically restricts the command to loading only files with a matching extension.\",\"B\":\"`PATTERN = 'landing/2026/09/*.csv'` so the command matches only files under that prefix whose names end with the `.csv` extension using glob-style matching.\",\"C\":\"`FILES = ('landing/2026/09/*.csv')` so the command treats the entire glob expression as a single explicit filename and attempts to load only that one literal path.\",\"D\":\"`FORMAT_OPTIONS ('extension' = 'csv')` so the command filters the format reader to only parse files that Spark identifies as CSV-formatted content.\"},\"correct\":\"B\",\"explanation\":\"A. This is incorrect. `FILEFORMAT` tells `COPY INTO` which parser to use for the selected files; it does not filter the source listing by file extension, so non-CSV files would still be attempted.B. This is correct. `PATTERN` accepts glob-style expressions, so restricting it to `*.csv` under the target prefix filters the source listing down to only the matching CSV files.C. This is incorrect. `FILES` expects a list of explicit file names rather than a glob expression, and it cannot be combined with wildcard matching to select a subset of files by extension.D. This is incorrect. There is no `extension` key recognized under `FORMAT_OPTIONS`; format options configure how a given file format is parsed, not which files are selected for the load.\"},{\"id\":\"5\",\"question\":\"A team needs to ingest data from a niche internal REST API that is not among the enterprise applications supported by Lakeflow Connect's managed connectors, and they need control over pagination, authentication headers, and retry logic in the extraction code. Which approach is most appropriate?\",\"options\":{\"A\":\"`COPY INTO`, which is designed to bulk-load files that are already staged in cloud object storage rather than call a live REST API endpoint directly.\",\"B\":\"The Zerobus direct-write API, which is intended for individual applications writing records straight into Delta tables rather than polling an external REST API.\",\"C\":\"A standard connector built as a custom Lakeflow Spark Declarative Pipeline, trading some automation for the flexibility to code custom extraction logic.\",\"D\":\"A managed connector, which offers a simple UI and prebuilt API integration for any REST source regardless of whether it is officially supported by Lakeflow Connect.\"},\"correct\":\"C\",\"explanation\":\"A. This SQL command loads files that are already staged in cloud object storage and has no ability to call a live REST API directly to retrieve data from it.B. This direct-write API is designed for applications to push individual records into Delta tables themselves, not for Databricks to poll and paginate through an external REST API on a schedule.C. Building a standard connector as a custom pipeline gives the team direct control over pagination, authentication headers, and retry logic in the extraction code, which is the flexibility a niche unsupported source requires, at the cost of some of the automation a managed connector would otherwise provide.D. A managed connector only supports a specific, prebuilt catalog of enterprise sources, so an unsupported niche REST API would not have a managed connector available for it regardless of the UI's simplicity.\"},{\"id\":\"6\",\"question\":\"While planning a managed connector rollout for a Google Analytics source, an engineer discovers that the connector is listed as not yet available in their workspace's cloud region. What should the engineer do based on how Databricks documents managed connector availability?\",\"options\":{\"A\":\"Assume this is a temporary outage affecting all regions equally and simply retry the connector setup again in a few minutes without further checks.\",\"B\":\"Conclude that Google Analytics can never be ingested into Databricks and switch the entire ingestion strategy to a different analytics platform.\",\"C\":\"Deploy the workspace's Unity Catalog metastore to a different region automatically, since metastore location is what determines connector availability.\",\"D\":\"Check Databricks' regional feature support documentation, since managed connectors are not universally available across every region and workspace.\"},\"correct\":\"D\",\"explanation\":\"A. Regional unavailability is a documented, standing limitation for some connectors, not a transient outage, so retrying without checking regional support docs is unlikely to resolve it.B. A regional limitation does not mean the source can never be ingested; the connector may be available in a supported region, or a standard connector approach may still work.C. Metastore location is a Unity Catalog governance concern and is not what Databricks documents as controlling managed connector regional availability.D. Databricks documents that managed connectors are not available in every region, so the correct next step is checking regional feature support documentation rather than assuming the feature is universally present.\"},{\"id\":\"7\",\"question\":\"A pipeline owner wants Auto Loader to never fail the stream when unexpected columns appear in incoming files, but also wants those unexpected values preserved rather than silently discarded. Which `cloudFiles.schemaEvolutionMode` setting satisfies both requirements?\",\"options\":{\"A\":\"`rescue`, which prevents schema evolution and captures unexpected columns in the rescued data column instead of failing the stream.\",\"B\":\"`none`, which ignores unexpected columns entirely and continues the stream without capturing their values anywhere.\",\"C\":\"`addNewColumns`, which evolves the schema automatically but stops the stream once with an exception before resuming.\",\"D\":\"`failOnNewColumns`, which halts the stream permanently until an updated schema is explicitly provided by the user.\"},\"correct\":\"A\",\"explanation\":\"A. The `rescue` mode is built exactly for this case: it blocks automatic schema evolution and instead captures unexpected column values in the rescued data column without ever failing the stream.B. The `none` mode avoids failure but simply ignores unexpected columns, meaning their values are not preserved anywhere, which fails the second requirement.C. The `addNewColumns` mode does preserve new columns by evolving the schema, but it still interrupts the stream with an exception, which fails the no-failure requirement.D. The `failOnNewColumns` mode does the opposite of what is needed, halting the stream indefinitely until a person manually supplies an updated schema.\"},{\"id\":\"8\",\"question\":\"A data engineering team is designing an ingestion strategy for a new source system and is unsure whether to build a custom connector immediately. Following Databricks' recommended approach to selecting an ingestion method, what should they do first?\",\"options\":{\"A\":\"Start with Auto Loader for every source type, since it is described as the single default entry point for all ingestion needs.\",\"B\":\"Start with the most managed layer available, such as a managed connector, and drop to less-managed layers only if requirements aren't met.\",\"C\":\"Start by building a fully custom connector first, then evaluate whether a managed connector could have replaced it later.\",\"D\":\"Start with a community connector regardless of source support, since community connectors are the most cost-effective default choice.\"},\"correct\":\"B\",\"explanation\":\"A. Auto Loader is a strong fit for cloud object storage ingestion specifically, not a universal default for every source type such as SaaS applications or databases.B. The recommended strategy is a layered approach: begin with the most managed option, such as a managed connector, and only move to standard, community, or custom options if that layer cannot meet the requirements.C. Building a custom connector before checking whether a managed or standard connector already covers the source inverts the recommended order and adds unnecessary engineering effort.D. Defaulting to a community connector regardless of whether a managed connector already supports the source skips the more automated, better-supported layer that should be tried first.\"},{\"id\":\"9\",\"question\":\"A JDBC read of a narrow, 10-column table with 5 million rows from a notebook is unexpectedly slow even though the source database responds quickly to test queries. Reviewing the Spark job, the JDBC data source is issuing tens of thousands of small round trips, each returning only a handful of rows. Which option should the engineer adjust first?\",\"options\":{\"A\":\"Set `partitionColumn` to a column that is not indexed on the source database, which forces the database to return larger row batches per query instead of many small ones.\",\"B\":\"Lower the cluster's `spark.sql.shuffle.partitions` value, since shuffle partition count directly controls how many rows a JDBC connector requests from the source in each round trip.\",\"C\":\"Increase the `fetchSize` option so each round trip to the source database returns a larger batch of rows, reducing the number of network round trips needed to pull the full result set.\",\"D\":\"Increase `numPartitions` so more parallel JDBC connections open against the source, since adding connections reduces the number of rows returned per individual round trip automatically.\"},\"correct\":\"C\",\"explanation\":\"A. Choosing an unindexed `partitionColumn` affects how partition boundaries are computed and can hurt performance, but it has no direct effect on how many rows are returned per network round trip.B. `spark.sql.shuffle.partitions` governs shuffle behavior for wide Spark operations like joins and aggregations after data is loaded; it has no effect on JDBC round-trip batching during the read itself.C. `fetchSize` directly controls how many rows the JDBC driver buffers per round trip, so raising it from a small default reduces the number of round trips needed and directly addresses the symptom described.D. Adding partitions increases the number of parallel connections used to split a scan by row range; it does not change the row batch size returned per round trip within any one connection.\"},{\"id\":\"10\",\"question\":\"A data engineer is building an Auto Loader stream that reads deeply nested JSON files. Downstream consumers require that a nested `user_info.dob` field always be materialized as a `DATE` column rather than whatever type Auto Loader would otherwise infer for it. Which mechanism lets the engineer force that specific nested field to a chosen type while still letting Auto Loader infer the rest of the schema automatically?\",\"options\":{\"A\":\"A Lakeflow Spark Declarative Pipelines expectation that rejects rows where the field is not a valid date\",\"B\":\"A `COPY INTO` `FORCE` option applied directly to the destination Delta table definition\",\"C\":\"A schema hint such as `\\\"user_info.dob DATE\\\"` passed as a reader option to the stream\",\"D\":\"Casting the entire DataFrame after the stream is read, using a single `withColumn` call\"},\"correct\":\"C\",\"explanation\":\"A. A Lakeflow Spark Declarative Pipelines expectation validates or drops rows based on a condition at write time; it enforces a rule about the data rather than overriding the inferred column type during Auto Loader's schema inference step.B. `COPY INTO` is a separate batch-loading SQL command with its own `FORCE` option for reloading files, and it does not apply to an Auto Loader streaming read or provide per-field type overrides.C. Schema hints let you override the inferred type of a specific column path, including nested fields addressed with dot notation, while Auto Loader continues to infer the remaining schema automatically.D. Post-read casting on the full DataFrame changes the value's type only after inference has already happened for every field, so it does not target a single nested field during schema inference itself.\"},{\"id\":\"11\",\"question\":\"A data engineer has an `active_customers` DataFrame with 6 columns and an `archived_customers` DataFrame with 5 columns, and attempts `active_customers.union(archived_customers)`. What is the result?\",\"options\":{\"A\":\"Spark combines the rows successfully but leaves the sixth column entirely absent from the resulting DataFrame's schema\",\"B\":\"Spark raises an `AnalysisException` because `union` requires both DataFrames to have the same number of columns\",\"C\":\"Spark combines the rows successfully and fills the missing sixth column in `archived_customers` with null values\",\"D\":\"Spark drops the extra column from `active_customers` automatically and unions the remaining five matching columns\"},\"correct\":\"B\",\"explanation\":\"A. The operation does not complete successfully with a mismatched column count, so there is no resulting DataFrame with a column silently removed from its schema.B. `union` requires both DataFrames to have the same number of columns with compatible types by position, so a 6-column DataFrame combined with a 5-column DataFrame raises an analysis error before any rows are combined.C. `union` does not perform schema reconciliation or fill in missing columns with null; a column count mismatch causes an error rather than an automatic null-filled merge.D. `union` does not silently drop columns to make schemas match; it strictly requires the same column count up front and fails when that is not the case.\"},{\"id\":\"12\",\"question\":\"After cleaning a bronze `events` table with PySpark, an engineer needs to persist the cleaned DataFrame as a new managed Unity Catalog silver table named `main.sales.events_silver`, replacing any existing data on each run. Which call accomplishes this?\",\"options\":{\"A\":\"Write with `mode(\\\"overwrite\\\")` and `saveAsTable` to fully replace the managed silver table on every single run\",\"B\":\"Write with `mode(\\\"append\\\")` and `saveAsTable` to add new rows onto whatever data already exists in that same table\",\"C\":\"Call `createOrReplaceTempView` to register the cleaned data, which only lasts for the current Spark session\",\"D\":\"Write the DataFrame out as CSV files to a path instead of registering it as a queryable table in the catalog\"},\"correct\":\"A\",\"explanation\":\"A. `saveAsTable` with `mode(\\\"overwrite\\\")` writes the DataFrame as a managed table under the given three-level name and replaces all existing rows on each run, matching the requirement to fully refresh the silver table.B. `append` mode adds the cleaned rows on top of whatever already exists in the table, which would duplicate previously written data instead of replacing it as the scenario requires.C. A temporary view only exists for the current Spark session and is never persisted as a table in Unity Catalog, so the cleaned data would disappear once the session ends.D. Writing CSV files to a local or object-store path creates plain files rather than a queryable Unity Catalog table, so it does not register `events_silver` as a table at all.\"},{\"id\":\"13\",\"question\":\"A data engineer builds `df.groupBy(\\\"region\\\", \\\"product_category\\\").agg(sum(\\\"units_sold\\\").alias(\\\"total_units\\\"))` on a sales DataFrame. What does the resulting DataFrame contain?\",\"options\":{\"A\":\"One row per original input row, each annotated with the running total of `units_sold` accumulated up to that row\",\"B\":\"One row per distinct `region` value only, with `product_category` and `units_sold` dropped from the output entirely\",\"C\":\"A single row containing the grand total of `units_sold` across the whole DataFrame, ignoring both grouping columns\",\"D\":\"One row per distinct combination of `region` and `product_category`, each with the summed `units_sold` for that combination\"},\"correct\":\"D\",\"explanation\":\"A. `groupBy().agg()` collapses rows within each group into a single summary row per group; it does not preserve one row per original input row or compute a running total across rows.B. Both `region` and `product_category` were passed to `groupBy`, so the result is grouped by their combination, not by `region` alone, and the aggregated `units_sold` column is retained in the output.C. Because two grouping columns were specified, the aggregation is computed separately for each combination of `region` and `product_category` rather than collapsing to one overall grand total.D. Correct — grouping by both `region` and `product_category` produces one output row per unique combination of those two columns, each carrying the sum of `units_sold` for that specific group.\"},{\"id\":\"14\",\"question\":\"A job aggregates a 2 TB dataset while `spark.sql.shuffle.partitions` is left at its default of 200. The Spark UI shows each shuffle task processing several gigabytes of data, heavy spill to disk, and stage durations far longer than comparable jobs on smaller data. Which change should be applied and re-measured first?\",\"options\":{\"A\":\"Increase `spark.default.parallelism`, since this setting overrides `spark.sql.shuffle.partitions` for DataFrame and SQL aggregations.\",\"B\":\"Increase `spark.driver.memory` so the driver process can hold the intermediate shuffle output in memory instead of letting it spill.\",\"C\":\"Increase `spark.sql.shuffle.partitions` so each shuffle partition holds a smaller amount of data and disk spill is reduced.\",\"D\":\"Increase `spark.sql.autoBroadcastJoinThreshold` so the 2 TB dataset is broadcast to every executor instead of being shuffled.\"},\"correct\":\"C\",\"explanation\":\"A. `spark.default.parallelism` applies to RDD-based operations and does not override the SQL-specific shuffle partition setting for DataFrame or SQL aggregations. Raising it would not change the aggregation's shuffle partition count.B. Shuffle spill happens on the executors that hold the shuffle data, not on the driver, so increasing driver memory has no effect on executor-side spill during this aggregation.C. Raising the shuffle partition count spreads a fixed volume of data across more, smaller partitions, so each task handles less data and spills less to local disk. This directly targets the observed multi-gigabyte-per-task spill pattern.D. A 2 TB dataset is far larger than any practical broadcast threshold, and forcing a broadcast of that size would exhaust executor memory rather than fix the spill. The broadcast threshold governs join planning, not aggregation shuffle sizing.\"},{\"id\":\"15\",\"question\":\"A junior data engineer proposes defining the gold-layer `customer_lifetime_value` object as a streaming table, reasoning that customers table updates frequently and a streaming table processes new records efficiently. The transformation logic recalculates lifetime value by aggregating a customer's full historical order history and applying corrections whenever late-arriving refund records are back-dated into earlier months. Why is a streaming table a poor fit for this specific gold-layer object?\",\"options\":{\"A\":\"A streaming table can only be defined using Python decorators and does not support SQL syntax at all, so the team would be forced to rewrite the entire lifetime-value aggregation logic in PySpark instead of SQL.\",\"B\":\"A streaming table applies exactly-once, append-only processing to each record, so it cannot handle logic that must reprocess aggregated historical values or update earlier results because of back-dated refund corrections.\",\"C\":\"A streaming table cannot be created inside a Lakeflow Spark Declarative Pipeline at all, so any attempt to define `customer_lifetime_value` as a streaming table would immediately fail to compile or deploy within that pipeline.\",\"D\":\"A streaming table always stores its data in the internal `__databricks_internal` catalog rather than a user-facing schema, making it impossible for BI tools to connect to or query the resulting lifetime value numbers directly.\"},\"correct\":\"B\",\"explanation\":\"A. This is incorrect. Streaming tables can be defined with either SQL (`CREATE OR REFRESH STREAMING TABLE`) or Python; SQL support is available and does not require rewriting the logic in PySpark.B. This is correct. Streaming tables assume an append-only source and process each record exactly once, which does not accommodate aggregation logic that must revisit and correct historical results when back-dated refunds arrive.C. This is incorrect. Streaming tables are a core dataset type supported natively within Lakeflow Spark Declarative Pipelines; the mismatch here is about processing semantics, not about whether the object type is permitted.D. This is incorrect. Streaming tables are Unity Catalog managed tables registered in a normal catalog and schema, and BI tools can query them directly like any other table; internal backing storage details do not block that access.\"},{\"id\":\"16\",\"question\":\"An engineer writes `SELECT order_id, explode(items) AS item_id, explode(tags) AS tag FROM orders` to expand two different array columns from the same table in a single query. What is the most likely result of running this statement?\",\"options\":{\"A\":\"The query fails, because Spark SQL only allows one `explode` (or other generator function) to appear in a single `SELECT` clause; the two arrays need to be exploded in separate steps.\",\"B\":\"The query succeeds and produces the full cross product of `items` and `tags` for every single order row, similar to running a `CROSS JOIN LATERAL` between the two exploded array columns.\",\"C\":\"The query succeeds and silently ignores the second `explode` call, returning only the rows produced by expanding the `items` array and leaving `tags` untouched.\",\"D\":\"The query succeeds and interleaves the two arrays element by element, pairing the first item with the first tag, the second item with the second tag, and so on.\"},\"correct\":\"A\",\"explanation\":\"A. Spark SQL restricts a `SELECT` clause to a single generator function such as `explode`; including two `explode` calls in the same clause raises an analysis error, and the two array expansions must instead be done through separate, chained `SELECT` statements or lateral views.B. A single `explode` call does not perform a cross product between two different array columns; more importantly, the statement does not even run successfully because two generator functions cannot coexist in one `SELECT` clause.C. Spark SQL does not silently drop one of two `explode` calls in the same clause; the presence of two generator functions in a single `SELECT` causes the query to fail validation rather than quietly ignoring one of them.D. There is no positional zip behavior built into having two `explode` calls in one `SELECT` clause; the query does not reach execution at all because Spark SQL rejects multiple generator functions in the same clause.\"},{\"id\":\"17\",\"question\":\"A team writes Lakeflow pipeline code in Python using `import pyspark.pipelines as dp`. They need to silently discard any order record whose `order_total` is negative before it reaches the silver table, without failing the update. Which decorator call on the table function meets this requirement?\",\"options\":{\"A\":\"`@dp.expect(\\\"valid_total\\\", \\\"order_total \u003e= 0\\\")` records violations as a quality metric but still writes the negative-total rows into the target table.\",\"B\":\"`@dp.expect_or_fail(\\\"valid_total\\\", \\\"order_total \u003e= 0\\\")` stops the pipeline update entirely the first time a negative `order_total` is encountered.\",\"C\":\"`@dp.expect_or_drop(\\\"valid_total\\\", \\\"order_total \u003c 0\\\")` removes rows that fail the condition before the write, so only the negative-total rows would be kept in the target table.\",\"D\":\"`@dp.expect_or_drop(\\\"valid_total\\\", \\\"order_total \u003e= 0\\\")` removes rows that fail the condition before the write and lets the update finish normally.\"},\"correct\":\"D\",\"explanation\":\"A. The plain `expect` decorator only tracks violations for reporting; rows that fail the check are still written to the target table, so negative totals would remain in the silver table, which does not meet the requirement.B. The `expect_or_fail` decorator makes invalid records prevent the update from succeeding, which is the opposite of the 'without failing the update' requirement in this scenario. It suits critical checks where any bad row should stop the run.C. The right decorator, but the constraint is inverted: an expectation constraint states what a valid record looks like, so `order_total \u003c 0` treats negative totals as valid and drops every non-negative order. The silver table would keep exactly the rows the team wants to discard.D. The `expect_or_drop` decorator drops records that fail its constraint before the data is written to the target, and the constraint `order_total \u003e= 0` describes a valid record. Negative totals are therefore discarded while the update still completes.\"},{\"id\":\"18\",\"question\":\"Which set of comparison operators can an If/else condition task in a Lakeflow Job evaluate when comparing a task value or job parameter against a literal?\",\"options\":{\"A\":\"==, CONTAINS, STARTSWITH, ENDSWITH\",\"B\":\"==, !=, AND, OR\",\"C\":\"==, !=, \u003e, \u003e=, \u003c, \u003c=\",\"D\":\"==, !=, LIKE, IN\"},\"correct\":\"C\",\"explanation\":\"A. String-matching helpers such as `CONTAINS`, `STARTSWITH`, and `ENDSWITH` are not operators the If/else task evaluates. The task is limited to simple equality and relational comparisons, not substring matching.B. `AND` and `OR` are logical operators for combining multiple conditions, not comparison operators for a single value check, and the If/else task does not expose them as selectable operators. Each If/else task evaluates one comparison at a time.C. The If/else task type supports equality, inequality, and the four relational operators for comparing a dynamic value or job parameter against a literal. This is the complete operator set documented for condition tasks.D. Pattern-matching operators like `LIKE` and set-membership operators like `IN` are not part of the If/else task's supported comparison operators. These are SQL-style operators rather than condition-task operators.\"},{\"id\":\"19\",\"question\":\"A table update trigger is starting job runs more frequently than the team's downstream systems can absorb, because the monitored table receives many small writes throughout the day. The team wants to cap the trigger so a new run cannot start until a fixed cooldown has elapsed after the previous run finished. Which setting should they configure?\",\"options\":{\"A\":\"Change the `condition` to `ALL_UPDATED` so a run only fires once every monitored table has changed at least once.\",\"B\":\"Set `min_time_between_triggers_seconds` to enforce a minimum cooldown before the next run can start after a run completes.\",\"C\":\"Remove the table update trigger and replace it with a file arrival trigger monitoring the table's underlying storage path.\",\"D\":\"Set `wait_after_last_change_seconds` to delay each run until table writes stop for that duration, resetting on each write.\"},\"correct\":\"B\",\"explanation\":\"A. The `ALL_UPDATED` condition changes which tables must change to fire a trigger with multiple monitored tables, but it does not throttle how often runs occur for a single table.B. The `min_time_between_triggers_seconds` setting caps run frequency by enforcing a minimum wait after the previous run completes before the next one can start, matching the cooldown requirement.C. Monitoring the underlying storage path with a file arrival trigger would react to file-level writes instead of table state, and it does not offer the run-cooldown behavior being requested.D. The `wait_after_last_change_seconds` setting debounces individual writes rather than enforcing a hard cooldown between completed runs, so it solves a different problem than limiting run frequency.\"},{\"id\":\"20\",\"question\":\"An upstream process periodically overwrites the same file name in a Unity Catalog volume with refreshed content instead of writing a new file. A data engineer configured a file arrival trigger on that volume and is confused that the downstream job never starts after these overwrites. What is the most likely explanation?\",\"options\":{\"A\":\"File arrival triggers require the storage location to be an external location rather than a Unity Catalog volume, so the trigger never fires.\",\"B\":\"File arrival triggers only fire when genuinely new files appear in the location, so overwriting an existing file name does not start a run.\",\"C\":\"File arrival triggers only support paths containing wildcard patterns, so a fixed file name is silently ignored by the trigger.\",\"D\":\"File arrival triggers check for changes only once every twenty-four hours, so the overwrite has simply not yet been noticed.\"},\"correct\":\"B\",\"explanation\":\"A. File arrival triggers support both Unity Catalog volumes and external locations, so using a volume is not the reason the trigger fails to fire here.B. File arrival triggers detect new files landing in the monitored location, and overwriting an existing file does not count as a new arrival, so no run is started.C. File arrival triggers explicitly do not allow wildcard patterns in the monitored path, so this claim describes the opposite of how the feature actually works.D. File arrival triggers make a best-effort check for new files roughly every minute rather than once a day, so check frequency is not the cause of the missing run.\"},{\"id\":\"21\",\"question\":\"A finance team runs a nightly reconciliation job that must always execute at 2 AM in the America/New_York time zone regardless of whether any new data has arrived, because downstream analysts expect the report to be ready every morning at a fixed time. Which trigger type is the appropriate choice here, and why?\",\"options\":{\"A\":\"A continuous trigger, because it keeps a run active at all times and can therefore be expected to produce fresh output well before analysts arrive each morning.\",\"B\":\"A file arrival trigger, because the reconciliation job still depends on transaction data files that were written earlier in the day and must react to their arrival.\",\"C\":\"A scheduled trigger using a Quartz cron expression with the time zone set to America/New_York, since the requirement is a fixed wall-clock time rather than a data event.\",\"D\":\"A table update trigger on the transaction table, because that underlying table is technically updated at some point before 2 AM on most business nights.\"},\"correct\":\"C\",\"explanation\":\"A. A continuous trigger reruns the job back-to-back with no fixed schedule at all, so it cannot guarantee output is ready at any specific wall-clock time like 2 AM.B. Even though the job reads transaction files, the actual requirement is a guaranteed fixed start time regardless of data timing, and a file arrival trigger would instead run whenever files land, which could be well before or after 2 AM.C. A cron-based scheduled trigger with the correct time zone directly guarantees the job starts at 2 AM local time every night, matching a requirement that is explicitly about a fixed wall-clock time rather than about reacting to any particular data event.D. Relying on the transaction table's update timing is an approximation at best, since the table could update earlier or later than expected on a given night, which does not guarantee the fixed 2 AM start the analysts require.\"},{\"id\":\"22\",\"question\":\"A `disable_switch` task is marked disabled so it is skipped at runtime, but a downstream task depends on it with the `All succeeded` run-if condition. Based on how Lakeflow Jobs evaluates disabled upstream tasks, what happens to the downstream task?\",\"options\":{\"A\":\"The downstream task runs anyway, because Lakeflow Jobs treats a disabled upstream task as successful when it evaluates the `All succeeded` run-if condition.\",\"B\":\"The downstream task stays pending indefinitely, because Lakeflow Jobs cannot evaluate any run-if condition against a disabled upstream task at all, ever.\",\"C\":\"The downstream task runs only after an administrator manually approves the disabled task from inside the job run's UI page, using the approvals panel.\",\"D\":\"The downstream task does not run; it is marked disabled for that run, because a disabled parent does not satisfy `All succeeded`.\"},\"correct\":\"D\",\"explanation\":\"$f\"},{\"id\":\"23\",\"question\":\"A developer in a Databricks Git folder has staged several changed files and clicks Commit \u0026 Push, but leaves the commit message field empty. What happens?\",\"options\":{\"A\":\"Databricks blocks the commit because a commit message is required before changes can be pushed to the remote branch.\",\"B\":\"Databricks pushes the changes using an auto-generated message that lists every modified file path in the folder.\",\"C\":\"Databricks queues the commit locally and prompts for a message only the next time the folder is opened.\",\"D\":\"Databricks pushes the changes with no commit message, leaving the message field blank in the Git provider's history.\"},\"correct\":\"A\",\"explanation\":\"A. The Git dialog requires a non-empty commit message before Commit \u0026 Push will proceed, so an empty message stops the operation.B. There is no feature that auto-generates a commit message from the list of changed file paths; the developer must supply one.C. Databricks does not defer message entry to a later session; the requirement is enforced at the moment Commit \u0026 Push is attempted.D. A push with a blank message is not permitted, so the change is not sent to the remote repository until a message is entered.\"},{\"id\":\"24\",\"question\":\"A data engineering team keeps a Lakeflow Job and a Lakeflow Spark Declarative Pipeline defined as source in a repository, and wants to promote the exact same resource definitions from a dev workspace to a prod workspace without hand-editing settings in the UI at each stage. Which capability of Declarative Automation Bundles addresses this directly?\",\"options\":{\"A\":\"A cluster policy attached to the job restricts which workspace the job can run in, which indirectly forces the same compute configuration to apply consistently across dev and prod.\",\"B\":\"A `databricks.yml` file declares the job and pipeline as code, and named targets override settings like the workspace host so the same definitions deploy consistently across environments.\",\"C\":\"The Databricks workspace UI automatically detects every resource change made in dev and replicates it into prod once an administrator approves the diff through the audit log console.\",\"D\":\"Lakeflow Jobs and Spark Declarative Pipelines synchronize their configuration across workspaces natively whenever the resources share the same catalog and schema names in both environments.\"},\"correct\":\"B\",\"explanation\":\"A. A cluster policy constrains compute settings for a single job run and has no mechanism for propagating or synchronizing configuration between separate workspaces.B. This describes the core mechanism of a bundle: resources are declared once in `databricks.yml`, and targets override host, variables, and other settings per environment so the same source deploys consistently across dev, test, and prod.C. There is no UI feature that auto-detects and replicates resource changes between workspaces through an audit-log approval flow; promotion across environments is driven by deploying bundle configuration, not by UI diffing.D. Jobs and pipelines do not natively synchronize configuration across workspaces based on shared catalog or schema names; each workspace's resources are independent unless a bundle deploys the same definitions to both.\"},{\"id\":\"25\",\"question\":\"A bundle variable has a target-level override defined inside `databricks.yml`, and a `--var` flag for the same variable is also passed on the `bundle deploy` command line. Which value does the Databricks CLI use?\",\"options\":{\"A\":\"The CLI raises a validation error and refuses to deploy, because a variable cannot be set from two different sources at once.\",\"B\":\"Both values are merged into a single ordered list, and the job receives the target override first followed by the command-line value as a fallback.\",\"C\":\"The command-line `--var` value wins, because CLI flags take precedence over target overrides, environment variables, and top-level defaults.\",\"D\":\"The target-level override wins, because values already defined inside `databricks.yml` always take precedence over any command-line input.\"},\"correct\":\"C\",\"explanation\":\"A. Having multiple potential sources for the same variable is expected and handled through a defined precedence order rather than treated as a conflict, so the CLI does not raise a validation error in this situation.B. Bundle variables resolve to a single scalar or complex value per deployment; the CLI does not merge values from multiple sources into a list or apply one as a runtime fallback for the other.C. The Databricks CLI resolves variable values in a fixed priority order, and a command-line `--var` flag sits at the top of that order, overriding target-level overrides, `BUNDLE_VAR_` environment variables, and top-level defaults.D. Target-level overrides are lower priority than a command-line `--var` flag; they only take effect when no higher-priority source, such as a CLI flag or environment variable, supplies a value for that variable.\"},{\"id\":\"26\",\"question\":\"A platform team wants pull-request pipelines in GitHub Actions to fail fast if a contributor's databricks.yml has a typo or an invalid resource reference, before any workspace credentials are even needed. Which CLI step best fits early in that pipeline?\",\"options\":{\"A\":\"Add a step that runs `databricks bundle deploy -t dev --auto-approve`, since deploying to a scratch dev target is the only way the CLI can confirm the configuration parses correctly\",\"B\":\"Add a step that runs `databricks bundle run --validate-only`, since this flag exists specifically to check every resource type in the bundle for configuration errors before any deploy happens at all\",\"C\":\"Add a step that runs `databricks bundle destroy -t dev --auto-approve`, since tearing down and recreating the dev target on every pull request is described as the standard way to catch config drift\",\"D\":\"Add a step that runs `databricks bundle validate`, since it only parses and checks the local configuration and does not require deploying or authenticating against a live workspace target\"},\"correct\":\"D\",\"explanation\":\"A. Deploying to a dev target requires valid workspace credentials and actually creates or updates resources, which is unnecessary overhead and risk just to catch a configuration typo early in the pipeline.B. `--validate-only` is a flag scoped to `databricks bundle run` for pipeline resources specifically, not a general bundle-wide configuration check, and `bundle run` still requires the bundle to already be deployed.C. `databricks bundle destroy` deletes deployed resources and is unrelated to catching configuration typos; using it as a pull-request check would also be destructive and require existing deployed state.D. This is correct: `databricks bundle validate` checks configuration files for errors and prints a resource summary using only local parsing, so it can catch typos and bad references in CI before any deployment or workspace call is needed.\"},{\"id\":\"27\",\"question\":\"A pipeline job that normally completes in about 12 minutes has been taking over 40 minutes for the last three runs, though it still finishes with a Succeeded status each time. Using only the Lakeflow Jobs UI, how can the engineer confirm this is an unusual trend rather than normal variance?\",\"options\":{\"A\":\"Open the job's run history and compare the total duration bars across recent runs against the historical baseline shown in the Matrix or Runs list view.\",\"B\":\"Check the Spark UI stage detail page for the most recent run, since only stage-level shuffle metrics reveal whether a run duration is abnormal.\",\"C\":\"Query the job's cluster event log directly, because the Jobs UI only reports whether a run succeeded or failed and never reports duration.\",\"D\":\"Rerun the job manually from the Repair run option, since a successful repair run duration is the only reliable duration baseline available.\"},\"correct\":\"A\",\"explanation\":\"A. The run history views display each run's total duration alongside prior runs, so lining up recent bars against the historical pattern is the direct way to confirm a 12-minute job is now consistently taking 40 minutes. This does not require leaving the Jobs UI at all.B. Stage-level shuffle metrics can help explain why a run is slow, but they are not needed just to confirm that a duration trend exists, and reading only the most recent run would miss the comparison against the historical baseline entirely.C. The Jobs UI does report run duration for every run, so this understates what the UI provides and sends the engineer to a source that does not track run-over-run trends the way the run history view does.D. Repair run reruns only the tasks that failed in a specific past run, and since every recent run already succeeded there is nothing to repair; it also would not establish a historical duration baseline.\"},{\"id\":\"28\",\"question\":\"A `groupBy` aggregation is heavily skewed because a single customer ID accounts for a large share of all rows, causing one task to process far more data than the others in the Spark UI's stage metrics. AQE's skew join optimization does not apply here because the bottleneck occurs in an aggregation rather than a join. Which technique would most directly reduce the skew for this aggregation?\",\"options\":{\"A\":\"Repartitioning the DataFrame by a monotonically increasing surrogate column, ignoring the original grouping key altogether.\",\"B\":\"Salting the skewed key with a random suffix before grouping, then re-aggregating to spread its rows across partitions.\",\"C\":\"Reducing `spark.sql.shuffle.partitions` to a smaller value, consolidating the aggregation into fewer, larger partitions per task.\",\"D\":\"Converting the aggregation to a broadcast join against a lookup table, eliminating the shuffle step regardless of key distribution.\"},\"correct\":\"B\",\"explanation\":\"A. Repartitioning by an unrelated surrogate column changes how rows are physically distributed for storage but does not affect how Spark shuffles data by the grouping key during the aggregation itself, so the skew on that key remains.B. This is correct. Salting appends a random suffix to the overrepresented key, splitting its rows across several synthetic sub-keys during the first aggregation pass, then a second pass aggregates the partial results back together, distributing the heavy key's workload across many tasks.C. Reducing the shuffle partition count consolidates data into fewer partitions, which would make the imbalance worse, not better, since the already-heavy key's partition would absorb even more of the remaining data.D. An aggregation is not a join between two tables, so there is no join side to broadcast; this option does not apply to reducing skew within a single `groupBy` on one DataFrame.\"},{\"id\":\"29\",\"question\":\"Which three maintenance operations does predictive optimization automatically manage for eligible Unity Catalog managed tables?\",\"options\":{\"A\":\"`OPTIMIZE`, `VACUUM`, and `REORG TABLE`, combining compaction, cleanup, and type-widening rewrites automatically\",\"B\":\"`OPTIMIZE`, `ZORDER`, and `VACUUM`, since ZORDER is required alongside file compaction for predictive optimization to run\",\"C\":\"`OPTIMIZE`, `VACUUM`, and `ANALYZE`, covering file compaction, stale file cleanup, and statistics collection respectively\",\"D\":\"`ANALYZE`, `REORG TABLE`, and `REPAIR TABLE`, since these rebuild metadata and table structure for query planning\"},\"correct\":\"C\",\"explanation\":\"A. `REORG TABLE` is a manually run command used for tasks like type widening, not one of the operations predictive optimization schedules automatically.B. `ZORDER` is a manual clustering technique that is actually incompatible with liquid clustering; it is not one of the three operations predictive optimization automates.C. Predictive optimization automatically runs `OPTIMIZE` for file compaction and incremental clustering, `VACUUM` for removing unreferenced files, and `ANALYZE` for refreshing table statistics.D. `REORG TABLE` and `REPAIR TABLE` are manually invoked commands for specific maintenance tasks; neither is part of the automated set predictive optimization manages.\"},{\"id\":\"30\",\"question\":\"A serverless Lakeflow task issues 150 SQL queries during a single run, and an engineer notices that several later queries show no performance insight badge even though they appear slow in the query history. What explains this?\",\"options\":{\"A\":\"Databricks aggregates query-level performance metrics for only the first 100 queries in a run, so later queries are excluded.\",\"B\":\"Performance insight badges only ever appear for queries that read from Unity Catalog managed tables rather than external tables.\",\"C\":\"The job's expected completion time threshold was already exceeded, which suppresses insight badges for remaining queries.\",\"D\":\"The task was executed on a job cluster instead of serverless compute, which disables performance insight badges entirely.\"},\"correct\":\"A\",\"explanation\":\"A. This is correct because Databricks aggregates query-level performance metrics across only the first 100 queries within a run, so a task issuing 150 queries will have its later queries fall outside that aggregation window and therefore lack insight badges.B. This is incorrect because performance insight badges are not gated on whether a table is Unity Catalog managed versus external; the limiting factor described for this feature is the count of queries per run, not the storage type queried.C. This is incorrect because the expected completion time is a separate duration-threshold warning on the overall run and has no effect on whether individual queries receive performance insight badges.D. This is incorrect because performance insight badges, the Timeline view, and per-query aggregation are serverless-specific capabilities in the first place; the scenario already states the task ran on serverless compute, so cluster type is not the explanation.\"},{\"id\":\"31\",\"question\":\"When a Spark job on a Databricks cluster fails with an out-of-memory error, which combination of resources gives the most direct evidence of whether the failure originated on the driver or on an executor?\",\"options\":{\"A\":\"The Databricks billing usage dashboard, which reports which specific node incurred the highest compute cost during the run and is therefore the likely failure point.\",\"B\":\"The workspace audit log, which records every notebook command but does not capture memory allocation on either the driver or the executors.\",\"C\":\"The cluster's autoscaling history graph, which shows only how many executors were attached over time and not their individual memory usage.\",\"D\":\"The driver logs for stack traces mentioning the failing process, combined with the Spark UI Executors tab for per-node memory and garbage-collection metrics.\"},\"correct\":\"D\",\"explanation\":\"$10\"},{\"id\":\"32\",\"question\":\"A data engineer runs `CREATE TABLE analytics.sales.orders (...)` and omits any `LOCATION` clause. Where does Unity Catalog store the resulting data files?\",\"options\":{\"A\":\"In the workspace's default external location, which every Unity Catalog metastore provisions automatically for tables that omit an explicit `LOCATION` clause at creation time.\",\"B\":\"In the same storage path as the most recently created external table in that schema, since Unity Catalog reuses the last referenced path by default.\",\"C\":\"Under the managed storage location resolved from the containing schema, catalog, or metastore, whichever level has a managed location configured, since no path was given.\",\"D\":\"In a temporary DBFS root path that must be manually migrated to permanent storage before the table can be queried by any other user or job in the workspace.\"},\"correct\":\"C\",\"explanation\":\"A. Incorrect. Omitting `LOCATION` creates a managed table, not one placed in a default external location, and there is no such automatic external-location provisioning behavior.B. Incorrect. Unity Catalog does not reuse the storage path of another table; each managed table resolves its own path from the schema, catalog, or metastore managed location.C. Correct. Omitting `LOCATION` creates a managed table, and Unity Catalog resolves its storage path from the nearest configured managed location on the schema, catalog, or metastore.D. Incorrect. Managed tables are not placed in a temporary DBFS root requiring manual migration; Unity Catalog resolves a permanent managed location automatically.\"},{\"id\":\"33\",\"question\":\"A column mask policy redacts customer email addresses for most groups. The compliance team must still see the full, unmasked email address for investigations. How should this exception be expressed in the `CREATE POLICY` statement?\",\"options\":{\"A\":\"Add a `WHEN has_tag_value('sensitivity','high')` clause naming the compliance team, since `WHEN` clauses in `CREATE POLICY` select principals rather than tables.\",\"B\":\"Add an `EXCEPT compliance_team` clause to the policy's principal list, so the masking function is skipped whenever a member of that group runs the query.\",\"C\":\"Create a second column mask policy that masks the column for every group, then rely on the newer policy to silently override the first one.\",\"D\":\"Grant the compliance team the `MODIFY` privilege on the table, since only write privileges determine whether column mask policies apply to a group's queries.\"},\"correct\":\"B\",\"explanation\":\"A. This is incorrect. A `WHEN` clause in `CREATE POLICY` scopes which tagged tables the policy applies to, not which principals are exempt; principal exceptions belong in the `TO`/`EXCEPT` clause instead.B. This is correct: the `EXCEPT` clause in a policy's principal list exempts named principals from the masking or filtering behavior, so the compliance team sees the unmodified column value while everyone else still sees the masked one.C. This is incorrect. Stacking a second masking policy for every group does not create a targeted exception for one team, and relying on implicit override behavior between overlapping policies is not how exceptions are expressed.D. This is incorrect. Write privileges like `MODIFY` govern the ability to change data, not whether a read-time column mask policy is applied; masking exceptions are controlled through the policy's principal clause, not table privileges.\"},{\"id\":\"34\",\"question\":\"A compliance team asks whether a data engineer can run `SELECT * FROM finance.transactions VERSION AS OF 5` on a table that has an active row filter and column mask to inspect a prior data state before the policies existed. What is the expected outcome?\",\"options\":{\"A\":\"Time travel is unsupported on tables with row filters or column masks attached, so this `VERSION AS OF` query is expected to fail outright\",\"B\":\"The query succeeds and returns the version-5 data exactly as it looked before any row filter or column mask was ever attached to it\",\"C\":\"The query succeeds, but Unity Catalog silently ignores the `VERSION AS OF` clause and returns the table's current state instead of it\",\"D\":\"The query succeeds only for members of the account's top-level admin group, regardless of what the row filter or mask logic actually specifies\"},\"correct\":\"A\",\"explanation\":\"A. Unity Catalog documents time travel as one of the operations unsupported on tables with row filters or column masks attached, so a `VERSION AS OF` query against such a table is expected to be rejected rather than succeed.B. Because time travel itself is unsupported once these policies are present, the engineer cannot retrieve the historical version at all, regardless of whether the older data predates the policy's creation.C. The restriction causes the query to fail rather than quietly substitute the current table state for the requested historical version, so no result set is silently returned.D. The unsupported-operation restriction is not bypassed by admin group membership; row filter and column mask logic controls row and column visibility, but the time-travel limitation applies at the table level regardless of who is querying.\"},{\"id\":\"35\",\"question\":\"An engineer runs `GRANT USE CATALOG, USE SCHEMA, SELECT ON CATALOG analytics TO bi_team` before any schemas exist in the catalog. Months later, several new schemas and tables are created inside `analytics`. Does `bi_team` need any additional grants to query the new tables?\",\"options\":{\"A\":\"Yes, the group needs a fresh grant on each new schema, because catalog-level grants only apply to objects that already existed when the statement ran.\",\"B\":\"Yes, but only `USE SCHEMA` needs to be re-granted on each new schema, since `SELECT` inherited from the catalog covers tables while `USE` privileges never inherit downward.\",\"C\":\"No, but only because Unity Catalog automatically re-runs every catalog-level grant statement nightly against newly created schemas and tables.\",\"D\":\"No, because privileges granted on a catalog also apply to schemas and tables created in it later, not only to objects that existed at grant time.\"},\"correct\":\"D\",\"explanation\":\"A. Incorrect. Catalog-level grants are not limited to objects that existed at grant time; they apply to all current and future schemas and tables in the catalog, so a per-schema grant is redundant.B. Incorrect. USE SCHEMA was granted at the catalog level in the same statement, and a USE SCHEMA grant on a catalog automatically applies to all current and future schemas in it. Container privileges do inherit downward, so nothing needs to be re-granted.C. Incorrect. There is no nightly re-application job; inheritance is a property of how the original grant is evaluated against child objects, not a scheduled re-grant process.D. Correct. Unity Catalog documents that when you grant a privilege on a parent object, it applies to all current and future child objects. The statement already covers the three privileges needed to read a table (USE CATALOG, USE SCHEMA and SELECT), so the new schemas and tables are readable without any further grant.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
