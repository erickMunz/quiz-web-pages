ecords never leave their own cloud account, but they still want Databricks to manage the notebooks, job scheduling and cluster configuration. Which statement describes how the Databricks architecture supports this?\",\"options\":{\"A\":\"All data is copied into the Databricks control plane so that clusters can be created faster\",\"B\":\"The control plane manages workspace metadata and orchestration, while data stays in the customer's cloud account in the data plane\",\"C\":\"The data plane stores notebooks and cluster definitions, and the control plane stores the Delta tables\",\"D\":\"Data locality cannot be guaranteed, so a private link is the only way to keep data in the account\"},\"correct\":\"B\",\"explanation\":\"Databricks splits responsibilities: the control plane (managed by Databricks) holds workspace metadata — notebooks, job definitions, cluster configuration, Unity Catalog metadata — and the data plane runs in the customer's cloud account, where clusters read and write the actual data in cloud storage. That is why raw data never has to leave the account.\\n\\nWhy the others fail: (A) is the classic misconception — copying data into the control plane would break the whole security model and is not how it works. (C) inverts the two planes. (D) private link improves network isolation but is not what guarantees data residency; the split architecture does.\\n\\nExam cue: \\\"data must stay in our account\\\" + \\\"Databricks still manages orchestration\\\" → control plane / data plane split.\"},{\"id\":\"2\",\"question\":\"A pipeline ingests thousands of JSON files per day from cloud storage into a Delta table. New files sometimes add new fields, and the pipeline must not fail when that happens. Which ingestion approach handles schema evolution with the least operational effort?\",\"options\":{\"A\":\"COPY INTO with a fixed schema and a manual ALTER TABLE for every new field\",\"B\":\"A scheduled notebook that reads each file with pandas and appends rows\",\"C\":\"Auto Loader (cloudFiles) with schema evolution enabled, checkpointing each run\",\"D\":\"A streaming query with a hard-coded schema and DROP of unknown columns\"},\"correct\":\"C\",\"explanation\":\"Auto Loader (format cloudFiles) is the managed incremental ingestion path: it discovers new files without reprocessing old ones, and with schema evolution enabled it adds new columns to the target automatically instead of failing the batch. The checkpoint records which files were processed, so restarts are incremental by design.\\n\\nWhy the others fail: (A) COPY INTO can ingest incrementally, but a fixed schema plus manual ALTER TABLE per field is exactly the operational burden the question rules out. (B) pandas in a notebook is neither incremental nor scalable and loses the Delta guarantees. (D) hard-coding the schema and dropping columns silently discards data.\\n\\nExam cue: \\\"new fields\\\" + \\\"must not fail\\\" + \\\"least operational effort\\\" → Auto Loader with schema evolution.\"},{\"id\":\"3\",\"question\":\"A team ingests around 50 new files per hour into a Delta table and wants the lowest-latency, most scalable file discovery available in Auto Loader. Their cloud storage can publish event notifications. What should they configure?\",\"options\":{\"A\":\"Directory listing with a 5-minute trigger interval\",\"B\":\"A full table refresh on every run\",\"C\":\"COPY INTO inside a for-each loop over the bucket prefix\",\"D\":\"File notification mode, with the required queue and IAM permissions created for them\"},\"correct\":\"D\",\"explanation\":\"Auto Loader has two discovery modes. File notification mode subscribes to the storage events (S3 → SQS/SNS, ADLS → Event Grid, GCS → Pub/Sub) and reacts to new files as they arrive; it scales better and costs less per file because it does not repeatedly list the directory. Databricks can create the queue and the IAM role for you when you enable it.\\n\\nWhy the others fail: (A) directory listing works and needs no extra permissions, but it lists the prefix every interval — slower to detect files and more expensive as the file count grows. (B) a full refresh reprocesses everything and defeats incremental ingestion. (C) driving COPY INTO per prefix is manual orchestration and still depends on listing.\\n\\nExam cue: \\\"lowest latency\\\" + \\\"storage can publish events\\\" → notification mode; \\\"no extra permissions / simplest setup\\\" → directory listing.\"},{\"id\":\"4\",\"question\":\"A team must load 200 CSV files once into a Delta table, then keep appending a few files a day. They want the simplest option that is still incremental after the initial load. What should they use?\",\"options\":{\"A\":\"COPY INTO for the initial load, which can also be re-run incrementally to pick up new files\",\"B\":\"Auto Loader with schema evolution and a notification queue\",\"C\":\"A one-off CREATE TABLE AS SELECT over the whole folder\",\"D\":\"An external table that reads the CSVs in place forever\"},\"correct\":\"A\",\"explanation\":\"COPY INTO is the SQL way to load files idempotently into a Delta table: it tracks which files were already loaded, so re-running it only ingests new ones. For a one-off bulk load plus a few daily files it is the least machinery — no checkpoint management, no streaming query to keep alive.\\n\\nWhy the others fail: (B) Auto Loader is the right answer when files arrive continuously, in large numbers, or need schema evolution and low latency; here it adds a queue and streaming state for little benefit. (C) CTAS is a single snapshot: the new files would never be picked up. (D) an external table does not ingest — it reads the files on every query and loses Delta performance and features.\\n\\nExam cue: \\\"load once, then a few files a day\\\" + \\\"simplest\\\" → COPY INTO. \\\"Thousands of files / continuous / schema evolution\\\" → Auto Loader.\"},{\"id\":\"5\",\"question\":\"While ingesting JSON files with Auto Loader, some records contain a field whose type does not match the inferred schema. The team does not want the load to fail but cannot lose those records. What does Auto Loader provide for this case?\",\"options\":{\"A\":\"It silently drops the offending records and reports the count in the checkpoint\",\"B\":\"It aborts the stream and requires a manual ALTER TABLE before restarting\",\"C\":\"It keeps the record and puts the unparsed or mismatched fields in the `_rescued_data` column\",\"D\":\"It casts every mismatched value to STRING and overwrites the original column\"},\"correct\":\"C\",\"explanation\":\"Auto Loader never throws away a record because of a type mismatch. When a field cannot be parsed into the expected type (or is not in the schema), it stores the original payload of the rescued fields in the `_rescued_data` column so you can inspect, quarantine or reprocess it later. That is the built-in rescue mechanism.\\n\\nWhy the others fail: (A) Auto Loader does not drop records — losing data silently is precisely what `_rescued_data` prevents. (B) a type mismatch does not abort the stream; only an unrecoverable error would. (D) it does not overwrite the column with a cast: the parsed column keeps its value and the raw value is preserved alongside.\\n\\nExam cue: \\\"must not fail\\\" + \\\"cannot lose records\\\" + Auto Loader → `_rescued_data`.\"},{\"id\":\"6\",\"question\":\"A streaming ingestion job must be run every 10 minutes by a scheduled job, process only files that arrived since the previous run, and then stop — instead of running continuously. Which trigger setting should the job use?\",\"options\":{\"A\":\"Trigger.AvailableNow, in a job that runs continuously\",\"B\":\"Trigger.AvailableNow (or Once) with the scheduled job stopping when the batch completes\",\"C\":\"A continuous cluster with auto-scaling and no trigger\",\"D\":\"Trigger.ProcessingTime(\\\"10 minutes\\\") on a continuous cluster\"},\"correct\":\"B\",\"explanation\":\"`Trigger.AvailableNow` processes all data available at the moment the query starts — like a bounded batch — and then stops. Combined with a scheduled job (every 10 minutes), it gives you incremental processing without paying for a cluster that runs 24/7. `Trigger.Once` is the older equivalent for this pattern.\\n\\nWhy the others fail: (A) AvailableNow plus a continuous job defeats the purpose — the whole point is that the run ends. (C) a continuous cluster with no trigger is the opposite: always on and always paying. (D) ProcessingTime is for continuous streaming with micro-batches; it keeps the query alive.\\n\\nExam cue: \\\"process only new files, then stop\\\" + \\\"scheduled job\\\" → AvailableNow/Once, not a continuous stream.\"},{\"id\":\"7\",\"question\":\"Each night a batch provides the full current state of products, including updates and brand-new products, but no deletions. The target Delta table already has yesterday's rows. Which statement loads today's file correctly without duplicating existing products?\",\"options\":{\"A\":\"INSERT INTO target SELECT * FROM staging\",\"B\":\"INSERT OVERWRITE target SELECT * FROM staging\",\"C\":\"MERGE INTO target USING staging ON target.id = staging.id WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *\",\"D\":\"DELETE FROM target, then INSERT INTO target SELECT * FROM staging\"},\"correct\":\"C\",\"explanation\":\"MERGE INTO is the upsert primitive in Delta Lake: the ON clause decides which staging rows match existing target rows, WHEN MATCHED updates them and WHEN NOT MATCHED inserts the new ones. One pass, ACID, and no duplicates for products that already exist.\\n\\nWhy the others fail: (A) plain INSERT appends everything, so every product appears twice. (B) INSERT OVERWRITE replaces the whole table with today's file — correct only if the file truly is the complete state and you accept losing history/partitions; it is not an upsert and it is not safe for partial extracts. (D) delete-then-insert leaves the table empty for readers during the operation and breaks concurrency.\\n\\nExam cue: \\\"full state with updates and new rows\\\" + \\\"no duplicates\\\" → MERGE INTO. \\\"Only new rows, never seen before\\\" → append/INSERT.\"},{\"id\":\"8\",\"question\":\"A 500 TB Delta table is filtered most often by customer_id and by event_date. The team is tired of choosing between partitioning and Z-ORDER and wants Databricks to pick and maintain the layout automatically, without rewriting the table. What should they enable?\",\"options\":{\"A\":\"Partition by event_date and Z-ORDER BY customer_id on every write\",\"B\":\"Liquid clustering on customer_id and event_date\",\"C\":\"Optimize with Z-ORDER BY customer_id once a week and drop the partitions\",\"D\":\"Bucketing by customer_id with 200 buckets\"},\"correct\":\"B\",\"explanation\":\"Liquid clustering replaces the partitioning/Z-ORDER decision: you declare clustering keys on the table and Databricks lays out the data incrementally, without rewriting existing files when the keys change. On a huge table with two independent filter columns it avoids the over-partitioning problem (millions of tiny files) that date partitioning creates.\\n\\nWhy the others fail: (A) Z-ORDER on every write is expensive and partitions by date can explode the file count. (C) weekly Z-ORDER is a manual maintenance job and dropping partitions loses the pruning benefit for date filters. (D) bucketing is a Hive-era technique that Delta does not need and that users must manage.\\n\\nExam cue: \\\"wants Databricks to choose and maintain the layout\\\" + \\\"without rewriting\\\" → liquid clustering. \\\"Legacy table, manual tuning\\\" → Z-ORDER.\"},{\"id\":\"9\",\"question\":\"An auditor needs to query the Delta table as it looked 30 days ago. The team runs VACUUM on the table daily with default settings. What happens to that requirement?\",\"options\":{\"A\":\"It fails: the default retention is 7 days, so versions older than that are physically removed even though time travel still works within the window\",\"B\":\"It works, because VACUUM only removes files that no query is reading at that moment\",\"C\":\"It works, because Delta keeps a full copy of every version for a year by default\",\"D\":\"It fails only if the table was written with INSERT OVERWRITE\"},\"correct\":\"A\",\"explanation\":\"Time travel is limited by retention. VACUUM physically deletes data files that are no longer referenced, and the default retention threshold is 7 days. After a daily VACUUM with defaults, any version older than seven days is gone: `VERSION AS OF` / `TIMESTAMP AS OF` will error because the underlying files no longer exist. To keep 30 days you must set `delta.deletedFileRetentionDuration` (or the `RETAIN N HOURS` clause) well beyond the audit window — and accept the storage cost.\\n\\nWhy the others fail: (B) VACUUM removes unreferenced files regardless of who is reading now; its safety is about the retention window, not live queries. (C) there is no year-long copy by default — that is exactly the misconception the question tests. (D) the mechanism is the same for any write that leaves old versions behind.\\n\\nExam cue: \\\"time travel older than X days\\\" + \\\"VACUUM\\\" → check retention (7 days by default).\"},{\"id\":\"10\",\"question\":\"In a Lakeflow Spark Declarative Pipeline, one dataset must incrementally process only new rows arriving from a streaming source, and another must recompute a full aggregation over all history each time it runs. Which combination is correct?\",\"options\":{\"A\":\"Both as materialized views, because they always recompute from the source\",\"B\":\"Both as streaming tables, because streaming is always more efficient\",\"C\":\"The first as a materialized view and the second as a streaming table\",\"D\":\"The first as a streaming table and the second as a materialized view\"},\"correct\":\"D\",\"explanation\":\"A streaming table is append/incremental: it consumes each row once and only processes new data, which is what an ingestion layer needs. A materialized view re-evaluates its query over the full underlying data on each refresh, which is what a full aggregation over history needs (and what keeps it correct when old rows change).\\n\\nWhy the others fail: (A) materialized views for both would reprocess all history every time — expensive and unnecessary for the incremental feed. (B) streaming tables cannot recompute a full aggregate correctly when source rows are updated or deleted; they are append-oriented. (C) is exactly inverted.\\n\\nExam cue: \\\"only new rows, incrementally\\\" → streaming table; \\\"full aggregation over all data each run\\\" → materialized view.\"},{\"id\":\"11\",\"question\":\"A declarative pipeline must guarantee that no order with a negative total reaches the gold table. Invalid rows should be dropped and counted, but the pipeline must keep running and the metrics must be visible. What should the team define?\",\"options\":{\"A\":\"A WHERE filter in the gold query, with no metric\",\"B\":\"An expectation on the dataset that drops violating rows and records the violation metrics\",\"C\":\"A try/except in a notebook that writes errors to a log table\",\"D\":\"A job-level retry with a notification on failure\"},\"correct\":\"B\",\"explanation\":\"Expectations are the declarative data-quality mechanism: you attach a rule to a dataset (`EXPECT ... `) and choose the violation behaviour. Expecting with a DROP action keeps the pipeline running, discards the offending rows and publishes per-rule metrics (passed/failed/dropped) that you can monitor. Failing the update instead stops the pipeline, which is the wrong choice here because the requirement is to keep running.\\n\\nWhy the others fail: (A) a WHERE filter drops rows but gives you no visibility into how many or why. (C) manual try/except is imperative code the pipeline cannot govern as a quality rule and it does not produce the standard metrics. (D) a retry re-runs the same bad data; it never fixes the rule violation.\\n\\nExam cue: \\\"must keep running\\\" + \\\"metrics visible\\\" → expectation with a DROP (or warn) action, not a fail action.\"},{\"id\":\"12\",\"question\":\"A downstream team needs to read only the rows that changed in a Delta table (inserts, updates and deletes) instead of rescanning the full table every night. What must be enabled on the source table?\",\"options\":{\"A\":\"Liquid clustering on the primary key\",\"B\":\"A materialized view that refreshes nightly\",\"C\":\"Change Data Feed, then read with table_changes() / readChangeFeed\",\"D\":\"Time travel with VERSION AS OF between the two nights\"},\"correct\":\"C\",\"explanation\":\"Change Data Feed (CDF) records row-level changes with a `_change_type` (insert, update_preimage, update_postimage, delete) and the commit version, so consumers can read only the delta between two versions instead of the whole table. It is enabled with `delta.enableChangeDataFeed = true` on the table.\\n\\nWhy the others fail: (A) clustering is a query-performance layout, it does not expose changes. (B) a materialized view recomputes and rewrites the result; it does not give you a change stream. (D) time travel can diff two snapshots but forces you to scan both full versions and compute the difference yourself — CDF is the purpose-built mechanism.\\n\\nExam cue: \\\"only changed rows\\\" + \\\"inserts, updates and deletes\\\" → Change Data Feed.\"},{\"id\":\"13\",\"question\":\"A streaming query reads from a source that can deliver the same event twice, and the target must contain exactly one row per event_id. Which approach handles this correctly over time?\",\"options\":{\"A\":\"Deduplicate with a watermark on the event timestamp and dropDuplicates on event_id\",\"B\":\"A SELECT DISTINCT over the whole table at the end of the pipeline\",\"C\":\"MERGE INTO on every micro-batch without a key condition\",\"D\":\"OPTIMIZE with Z-ORDER on event_id after each batch\"},\"correct\":\"A\",\"explanation\":\"Duplicate events arrive within a bounded window of their event time, so the correct streaming pattern is a watermark on the event timestamp plus `dropDuplicates(\\\"event_id\\\")`: Spark keeps state only for the watermark window (bounded memory) and drops repeats inside it. That is the standard exactly-once-ish pattern for streams with at-least-once delivery.\\n\\nWhy the others fail: (B) DISTINCT hides duplicates in that query but does nothing for the table and cannot be maintained incrementally. (C) a MERGE without an ON key condition is invalid; with a key it would work but is far more expensive per micro-batch than stateful dedup. (D) Z-ORDER changes file layout, never row uniqueness.\\n\\nExam cue: \\\"duplicates\\\" + \\\"streaming\\\" + \\\"one row per key\\\" → watermark + dropDuplicates on the key.\"},{\"id\":\"14\",\"question\":\"A Lakeflow job has 12 tasks: ingest, then three parallel cleaning tasks, then a join, then publish. Halfway through a run, only the publish task fails on a transient permission error that has now been fixed. What is the cheapest correct way to finish the run?\",\"options\":{\"A\":\"Re-run the whole job so every task starts from scratch\",\"B\":\"Repair the run, which re-executes only the failed task and its downstream dependencies\",\"C\":\"Create a new one-off job containing just the publish task\",\"D\":\"Delete the run and schedule it again for the next day\"},\"correct\":\"B\",\"explanation\":\"Lakeflow Jobs tracks task state per run. \\\"Repair run\\\" re-executes the failed task and only what depends on it, reusing the successful outputs of the other tasks — you pick the tasks to repair. That is the designed recovery path for a partially failed DAG and the cheapest in compute.\\n\\nWhy the others fail: (A) a full re-run recomputes every task, including the expensive ingestion, for no benefit. (C) a one-off job loses the lineage and parameters of the original run and duplicates orchestration logic. (D) deleting the run destroys the history and delays the business result by a day.\\n\\nExam cue: \\\"only one task failed\\\" + \\\"cheapest\\\" → repair run, not re-run.\"},{\"id\":\"15\",\"question\":\"A nightly job and an analyst working interactively both need Spark compute. The team wants to minimise cost and avoid one workload starving the other. What is the recommended compute choice?\",\"options\":{\"A\":\"One large all-purpose cluster shared by the job and the analyst\",\"B\":\"A single all-purpose cluster with autoscaling and no isolation\",\"C\":\"A job cluster for the nightly job and a separate all-purpose cluster for the analyst\",\"D\":\"A SQL warehouse for both, because it is always cheaper\"},\"correct\":\"C\",\"explanation\":\"Job clusters are created for the job run and terminated when it finishes, so you pay only for the job's duration and the workload is fully isolated. All-purpose clusters are for interactive work and stay alive (until idle timeout), which is the right home for an analyst but wasteful for a batch job. Separating them gives cost control and isolation.\\n\\nWhy the others fail: (A) and (B) share one cluster, so the analyst competes for resources with the batch and the cluster has to stay up all day for a job that runs 40 minutes. (D) a SQL warehouse executes SQL, not arbitrary Spark/Python notebooks, and it is not universally cheaper.\\n\\nExam cue: \\\"minimise cost\\\" + \\\"avoid starving\\\" + scheduled job → job cluster; interactive work → all-purpose cluster.\"},{\"id\":\"16\",\"question\":\"A team keeps notebook paths, cluster IDs and catalog names hard-coded per environment, and every promotion to production is a manual edit. They want the same artifacts deployed identically to dev, staging and prod. What should they adopt?\",\"options\":{\"A\":\"Export notebooks as .ipynb and copy them into each workspace by hand\",\"B\":\"A separate Git branch per environment and manual job re-creation\",\"C\":\"A shell script that calls the REST API with hard-coded IDs\",\"D\":\"Declarative Automation Bundles (formerly Databricks Asset Bundles), with per-target variables and databricks bundle deploy -t \u003ctarget\u003e\"},\"correct\":\"D\",\"explanation\":\"Declarative Automation Bundles (DAB, formerly Databricks Asset Bundles) describe jobs, pipelines, notebooks and their configuration in versioned YAML, with targets (dev/staging/prod) that supply environment-specific variables such as workspace host, catalog or cluster size. `databricks bundle deploy -t prod` validates and deploys the same bundle definition, so nothing is edited by hand between environments.\\n\\nWhy the others fail: (A) manual copying is exactly the drift problem being solved. (B) branches alone do not parameterise IDs or catalogs and still require manual job creation. (C) a REST script with hard-coded IDs is the same fragility in code form — no validation, no diff, no idempotency guarantees.\\n\\nExam cue: \\\"same artifacts to every environment\\\" + \\\"no manual edits\\\" → Declarative Automation Bundles with targets.\"},{\"id\":\"17\",\"question\":\"A new analyst must be able to read one schema in Unity Catalog but nothing else in the metastore. What is the correct grant?\",\"options\":{\"A\":\"GRANT USE CATALOG ON CATALOG main TO `analysts`; GRANT USE SCHEMA ON SCHEMA main.sales TO `analysts`; GRANT SELECT ON SCHEMA main.sales TO `analysts`\",\"B\":\"GRANT ALL PRIVILEGES ON METASTORE TO `analysts`\",\"C\":\"GRANT SELECT ON TABLE main.sales.orders TO `analysts` only\",\"D\":\"Add the analyst to the workspace admins group so they can see everything\"},\"correct\":\"A\",\"explanation\":\"Unity Catalog privileges are hierarchical and every level must be granted: USE CATALOG to see the catalog, USE SCHEMA to see the schema, and then the data privilege (SELECT) on the schema or table. Granting USE + SELECT on the schema gives read access to all current and future tables in it without exposing the rest of the metastore.\\n\\nWhy the others fail: (B) metastore-wide privileges violate least privilege and expose every catalog. (C) granting on a single table works for that table only — new tables in the schema would stay unreadable, which is not what \\\"read the schema\\\" means. (D) workspace admin is an operational role that bypasses data governance entirely; it is the opposite of least privilege.\\n\\nExam cue: \\\"read one schema, nothing else\\\" → USE CATALOG + USE SCHEMA + SELECT on that schema.\"},{\"id\":\"18\",\"question\":\"The security team requires that support agents can query a customers table but only ever see rows for their own region, and never see the email column in clear text. What should be implemented in Unity Catalog?\",\"options\":{\"A\":\"Two separate tables, one per region, and a view without the email column\",\"B\":\"A row filter function using the current user's region, plus a column mask on the email column\",\"C\":\"A dynamic view that all agents query instead of the table, with no table grants\",\"D\":\"SELECT privileges only on a subset of columns and a WHERE clause the agents must remember\"},\"correct\":\"B\",\"explanation\":\"Unity Catalog supports row filters and column masks natively, applied at the table level so every query path is covered: the row filter restricts visible rows per principal, and the column mask returns a masked value (for example a hash or `***`) for principals without the unmask privilege. Because the rules live on the table, they also apply to dashboards, notebooks and BI tools — not just to hand-written SQL.\\n\\nWhy the others fail: (A) duplicating tables per region creates drift and does not mask the column. (C) a view helps but depends on everyone using it, and without grants on the table it is an all-or-nothing design rather than row-level security. (D) column-level SELECT does not filter rows, and a WHERE clause each user must remember is not enforcement.\\n\\nExam cue: \\\"only their own region\\\" + \\\"never see the email\\\" → row filter + column mask.\"},{\"id\":\"19\",\"question\":\"A Spark job that joins a 2 TB fact table with a 40 GB dimension runs for hours, most tasks finish fast and a handful take forever, and the Spark UI shows a huge shuffle read on those tasks. What is the most likely cause and first fix?\",\"options\":{\"A\":\"Too few executors: raise the cluster size and add more cores\",\"B\":\"The Delta table needs VACUUM before the join\",\"C\":\"Data skew on the join key: inspect the key distribution and salt or broadcast as appropriate\",\"D\":\"Photon is disabled: enable it and re-run\"},\"correct\":\"C\",\"explanation\":\"The signature is textbook skew: a small number of tasks doing enormous shuffle reads while the rest finish immediately. A few values of the join key hold most of the rows, so those partitions cannot be split across executors. The first step is to measure the key distribution (`GROUP BY key ORDER BY COUNT(*) DESC`); then broadcast the small side if it fits, or salt the hot keys so the work spreads across partitions.\\n\\nWhy the others fail: (A) adding executors does not split a single hot partition — the long tasks stay long. (B) VACUUM is housekeeping for old files and has no effect on shuffle behaviour. (D) Photon speeds up execution generally but does not redistribute skewed partitions.\\n\\nExam cue: \\\"most tasks fast, a few take forever\\\" + \\\"huge shuffle read\\\" → skew.\"},{\"id\":\"20\",\"question\":\"An operations team needs a daily report of which jobs failed, how long queries took and who accessed which table, all queryable with SQL and retained beyond the workspace UI. What is the right source?\",\"options\":{\"A\":\"The Spark UI, opened per cluster and screenshotted into a ticket\",\"B\":\"Cluster logs delivered to cloud storage and parsed with a custom script\",\"C\":\"The job run history page in the workspace\",\"D\":\"System tables (query history, job runs, audit logs) queried with SQL\"},\"correct\":\"D\",\"explanation\":\"System tables expose operational metadata as Delta tables you can join and query with SQL, with retention beyond what the UI keeps: query history, job run history and audit logs (who accessed which object) among others. That makes dashboards, alerts and cross-workspace reporting possible without exporting anything.\\n\\nWhy the others fail: (A) the Spark UI is per-cluster, ephemeral and not queryable — useless for a daily report. (B) log delivery is for diagnostics (driver/executor logs), not for access auditing, and requires you to build the parser. (C) the run history page is a UI view with limited retention and no SQL access.\\n\\nExam cue: \\\"queryable with SQL\\\" + \\\"retained beyond the UI\\\" + \\\"who accessed what\\\" → system tables.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
