\"style\":{\"display\":\"inline-block\"},\"children\":[\"$\",\"h2\",null,{\"style\":{\"fontSize\":14,\"fontWeight\":400,\"lineHeight\":\"49px\",\"margin\":0},\"children\":\"This page could not be found.\"}]}]]}]}]]],\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}],[\"$\",\"$L5\",null,{}]]}]}]]}]]}],{\"children\":[\"quiz\",[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"ruta-ml-engineer-gcp-es\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"quiz\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L6\",null,[\"$\",\"$L7\",null,{\"children\":\"$L8\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"-ct5UL2xHYlQ1B1jnnM6a\",{\"children\":[[\"$\",\"$L9\",null,{\"children\":\"$La\"}],[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],null]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$d\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"e:I[9030,[\"206\",\"static/chunks/206-c4310c4aac9e1a25.js\",\"200\",\"static/chunks/app/quiz/%5Bid%5D/page-8500fbbb03871769.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"quiz\":{\"id\":\"ruta-ml-engineer-gcp-es\",\"title\":\"Examen de la ruta ML Engineer en Google Cloud\",\"questions\":[{\"id\":\"1\",\"question\":\"Un filtro antispam mueve correos a la carpeta de spam. Los usuarios se quejan de que pierden correos importantes del banco y de su jefe, y el equipo solo puede tocar el umbral esta semana. ¿Qué métrica debe guiar el cambio?\",\"options\":{\"A\":\"Recall de la clase spam\",\"B\":\"Accuracy global\",\"C\":\"Precision de la clase spam: subir el umbral hasta que casi todo lo marcado sea spam de verdad\",\"D\":\"ROC AUC\"},\"correct\":\"C\",\"explanation\":\"Gana porque el coste está en los falsos positivos (correos buenos en spam), y la precision mide justo esa fracción.\\n\\nPor qué fallan las demás:\\n(A) Asume que el problema es el spam que se escapa; la queja es por correos buenos marcados como spam.\\n(B) Asume que una cifra global refleja el error caro; con mucho correo legítimo, la accuracy apenas se mueve.\\n(D) Asume que el ranking global decide; el AUC no cambia al mover el umbral y no dice cuántos correos buenos se pierden.\\n\\nPista de examen: Elige la métrica por el error que más cuesta: falsos positivos caros → precision.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-q1\"},{\"id\":\"2\",\"question\":\"Tu dataset de bajas tiene una fila por cliente y mes (24 filas por cliente). Con split aleatorio por fila el AUC es 0,93; con clientes que nunca vio cae a 0,77. El modelo debe usarse con clientes nuevos. ¿Qué cambias?\",\"options\":{\"A\":\"Dividir por cliente (cada cliente entero en entrenamiento o en validación) con un hash estable de su id\",\"B\":\"Aumentar las épocas hasta que el AUC de clientes nuevos suba\",\"C\":\"Quitar la regularización para que el modelo capte más detalle\",\"D\":\"Usar accuracy en lugar de AUC\"},\"correct\":\"A\",\"explanation\":\"Gana porque elimina que el modelo reconozca a clientes vistos; la validación se parece a producción.\\n\\nPor qué fallan las demás:\\n(B) Asume que es falta de entrenamiento; más épocas aumentan la memorización del cliente.\\n(C) Asume sesgo alto; el síntoma es de varianza por fuga entre particiones.\\n(D) Cambia la métrica pero no la división que está filtrando información.\\n\\nPista de examen: Filas correlacionadas (mismo cliente, paciente o dispositivo) → split por grupo.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-q2\"},{\"id\":\"3\",\"question\":\"Una aerolínea quiere estimar cuántos minutos de retraso tendrá cada vuelo, con 2 años de histórico etiquetado y un equipo que debe entregar un primer modelo en una semana. ¿Qué tipo de problema plantea?\",\"options\":{\"A\":\"Clasificación binaria\",\"B\":\"Regresión supervisada\",\"C\":\"Clustering\",\"D\":\"Aprendizaje por refuerzo\"},\"correct\":\"B\",\"explanation\":\"Gana: la salida es un número continuo y hay etiquetas históricas.\\n\\nPor qué fallan las demás:\\n(A) Supone que la salida es sí/no; aquí se pide una cantidad de minutos.\\n(C) Supone que no hay etiqueta; el histórico sí trae el retraso real.\\n(D) Supone un agente que actúa y recibe recompensas; aquí solo se predice.\\n\\nPista de examen: Mira la forma de la salida: número continuo → regresión.\",\"difficulty\":\"basic\",\"flowItem\":\"s1-c1\"},{\"id\":\"4\",\"question\":\"Tu red llega a 2 % de error en entrenamiento y 15 % en validación; añadir épocas baja el primero y sube el segundo. Tienes presupuesto para un solo cambio antes de la demo. ¿Cuál eliges?\",\"options\":{\"A\":\"Un modelo más grande\",\"B\":\"Más épocas\",\"C\":\"Quitar el conjunto de validación y entrenar con todo\",\"D\":\"Early stopping sobre la pérdida de validación (con regularización si hace falta)\"},\"correct\":\"D\",\"explanation\":\"Gana: corta cuando la validación empeora y ataca la varianza.\\n\\nPor qué fallan las demás:\\n(A) Supone sesgo alto; más capacidad agrava la varianza.\\n(B) Supone falta de entrenamiento; el síntoma es justo lo contrario.\\n(C) Elimina la señal que permite detectar el problema.\\n\\nPista de examen: Hueco grande entre entrenamiento y validación = varianza: regulariza o para antes.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-c2\"},{\"id\":\"5\",\"question\":\"Prevés ventas diarias con 3 años de histórico; el modelo se reentrena cada mes y siempre predice el mes siguiente. Quieres una estimación honesta del error antes de desplegar. ¿Cómo validas?\",\"options\":{\"A\":\"Entrenar con el pasado y validar con el periodo inmediatamente posterior, repitiéndolo hacia delante en el tiempo\",\"B\":\"Validación cruzada k-fold con pliegues aleatorios\",\"C\":\"Split aleatorio 80/20 con semilla fija\",\"D\":\"Validar con el mismo periodo de entrenamiento\"},\"correct\":\"A\",\"explanation\":\"Gana: reproduce cómo se usará el modelo y no filtra el futuro.\\n\\nPor qué fallan las demás:\\n(B) Mezcla días futuros en el entrenamiento y da un error optimista.\\n(C) La semilla fija hace reproducible la fuga, no la elimina.\\n(D) Mide memoria, no generalización.\\n\\nPista de examen: Series temporales: valida siempre hacia delante en el tiempo.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s1-c3\"},{\"id\":\"6\",\"question\":\"Un modelo de fraude lleva un año estable. Tras una nueva regulación que cambia qué operaciones se consideran fraude, las distribuciones de entrada siguen iguales, pero la precision medida con etiquetas reales cae del 0,82 al 0,55. ¿Qué ocurre y qué haces?\",\"options\":{\"A\":\"Data drift: ajustar los umbrales de alerta de las features\",\"B\":\"Training-serving skew: unificar el preprocesado\",\"C\":\"Concept drift: reetiquetar con la nueva definición y reentrenar con datos recientes\",\"D\":\"Subir el número de réplicas del endpoint\"},\"correct\":\"C\",\"explanation\":\"Gana: cambió la relación entre entradas y etiqueta, y solo datos nuevos la reflejan.\\n\\nPor qué fallan las demás:\\n(A) Supone que cambiaron las entradas; las distribuciones siguen iguales.\\n(B) El skew existe desde el despliegue; aquí el modelo funcionó un año.\\n(D) Es un problema de exactitud, no de capacidad de serving.\\n\\nPista de examen: Entradas iguales + rendimiento que cae con etiquetas reales → concept drift.\",\"difficulty\":\"advanced\",\"flowItem\":\"s1-c4\"},{\"id\":\"7\",\"question\":\"Un e-commerce tiene en BigQuery 300 millones de interacciones usuario–producto (vistas y compras) y quiere sugerir 10 productos por usuario cada noche. El equipo solo usa SQL. ¿Qué MODEL_TYPE eliges?\",\"options\":{\"A\":\"KMEANS\",\"B\":\"LOGISTIC_REG con el id de producto como etiqueta\",\"C\":\"ARIMA_PLUS\",\"D\":\"MATRIX_FACTORIZATION y ML.RECOMMEND\"},\"correct\":\"D\",\"explanation\":\"Gana: aprende factores de usuarios y productos a partir de las interacciones y recomienda en SQL.\\n\\nPor qué fallan las demás:\\n(A) Agrupa usuarios parecidos, pero no puntúa pares usuario–producto.\\n(B) Convierte millones de productos en clases: inmanejable y sin señal colaborativa.\\n(C) Es para series temporales, no para preferencias.\\n\\nPista de examen: Interacciones usuario–ítem → matrix factorization.\",\"difficulty\":\"basic\",\"flowItem\":\"s2-q1\"},{\"id\":\"8\",\"question\":\"Debes prever 12 semanas de demanda para 4.000 productos y el comité exige ver qué parte del pronóstico es tendencia, estacionalidad y efecto de festivos. Los datos están en BigQuery. ¿Qué haces?\",\"options\":{\"A\":\"AI.FORECAST con TimesFM, sin crear modelo\",\"B\":\"ARIMA_PLUS con TIME_SERIES_ID_COL y HOLIDAY_REGION, y ML.EXPLAIN_FORECAST\",\"C\":\"Un LINEAR_REG por producto con la fecha como feature\",\"D\":\"Exportar a CSV y usar una hoja de cálculo\"},\"correct\":\"B\",\"explanation\":\"Gana: entrena las 4.000 series en una sentencia y ML.EXPLAIN_FORECAST muestra tendencia, estacionalidad y festivos.\\n\\nPor qué fallan las demás:\\n(A) Es rápido, pero su explicabilidad es baja: no da la descomposición que pide el comité.\\n(C) 4.000 modelos manuales sin componentes de serie temporal.\\n(D) No escala a 4.000 series ni da intervalos.\\n\\nPista de examen: Explicar la descomposición → ARIMA_PLUS + ML.EXPLAIN_FORECAST; sin modelo → AI.FORECAST.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-q2\"},{\"id\":\"9\",\"question\":\"Tu clasificador binario de BigQuery ML usa el umbral 0,5 y negocio quiere ver, sin reentrenar, cómo cambian recall y tasa de falsos positivos con cada umbral posible. ¿Qué consultas?\",\"options\":{\"A\":\"ML.ROC_CURVE\",\"B\":\"ML.THRESHOLD_EVALUATE\",\"C\":\"ML.TRAINING_INFO\",\"D\":\"ML.FEATURE_INFO\"},\"correct\":\"A\",\"explanation\":\"Gana: devuelve recall, false_positive_rate y conteos por umbral para clasificadores binarios.\\n\\nPor qué fallan las demás:\\n(B) No existe: es un distractor clásico.\\n(C) Da la pérdida por iteración de entrenamiento, no métricas por umbral.\\n(D) Da estadísticas de las features de entrada.\\n\\nPista de examen: Umbral sin reentrenar → ML.ROC_CURVE y luego STRUCT(… AS threshold).\",\"difficulty\":\"basic\",\"flowItem\":\"s2-c1\"},{\"id\":\"10\",\"question\":\"Quieres que BigQuery ML pruebe 20 combinaciones de LEARN_RATE y MAX_TREE_DEPTH, se quede con la de mejor ROC AUC y te deje revisar cada intento, sin salir de SQL. ¿Qué escribes?\",\"options\":{\"A\":\"SELECT * FROM ML.TUNE(MODEL …, STRUCT(20 AS max_trials))\",\"B\":\"Veinte CREATE MODEL distintos y comparar con ML.COMPARE\",\"C\":\"NUM_TRIALS = 20 con HPARAM_RANGE/HPARAM_CANDIDATES y HPARAM_TUNING_OBJECTIVES = ['ROC_AUC'], y después ML.TRIAL_INFO\",\"D\":\"Exportar a Agent Platform y lanzar un trabajo de tuning\"},\"correct\":\"C\",\"explanation\":\"Gana: el tuning vive dentro de CREATE MODEL y ML.TRIAL_INFO muestra cada trial y cuál es el óptimo.\\n\\nPor qué fallan las demás:\\n(A) ML.TUNE no existe en BigQuery ML.\\n(B) ML.COMPARE no existe y repetir modelos a mano no aprovecha el tuning nativo.\\n(D) Funciona, pero añade movimiento y código cuando SQL ya lo resuelve.\\n\\nPista de examen: En BigQuery ML el tuning es NUM_TRIALS + ML.TRIAL_INFO.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-c2\"},{\"id\":\"11\",\"question\":\"Ya no conservas el dataset de entrenamiento de tu modelo de BigQuery ML. Quieres comprobar cada lunes si los datos de serving se parecen a los del entrenamiento, con umbrales por columna. ¿Qué función usas?\",\"options\":{\"A\":\"ML.VALIDATE_DATA_DRIFT entre esta semana y la anterior\",\"B\":\"ML.VALIDATE_DATA_SKEW sobre los datos de serving\",\"C\":\"ML.DETECT_DRIFT\",\"D\":\"ML.EVALUATE sin tabla de entrada\"},\"correct\":\"B\",\"explanation\":\"Gana: compara con las estadísticas de entrenamiento que el modelo guardó, sin necesitar el dataset original.\\n\\nPor qué fallan las demás:\\n(A) Compara dos conjuntos de serving: mide drift, no la distancia al entrenamiento.\\n(C) No existe en BigQuery ML.\\n(D) Devuelve métricas del entrenamiento, no compara distribuciones.\\n\\nPista de examen: Skew = serving frente a entrenamiento; drift = serving frente a serving.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s2-c3\"},{\"id\":\"12\",\"question\":\"Entrenaste un BOOSTED_TREE_CLASSIFIER de crédito sin opciones extra. El regulador pide hoy el motivo del rechazo del cliente 8812 y, para el informe trimestral, la influencia global de cada variable medida con atribuciones. ¿Qué haces?\",\"options\":{\"A\":\"ML.GLOBAL_EXPLAIN para ambas cosas\",\"B\":\"ML.WEIGHTS para ver los coeficientes\",\"C\":\"ML.LOCAL_EXPLAIN para el cliente y ML.FEATURE_INFO para el informe\",\"D\":\"ML.EXPLAIN_PREDICT hoy para el cliente; reentrenar con ENABLE_GLOBAL_EXPLAIN = TRUE para usar ML.GLOBAL_EXPLAIN en el informe\"},\"correct\":\"D\",\"explanation\":\"Gana: la explicación local funciona ya; la global por atribuciones exige la opción en el entrenamiento.\\n\\nPor qué fallan las demás:\\n(A) No explica una fila concreta y, además, falla sin ENABLE_GLOBAL_EXPLAIN.\\n(B) Los árboles no tienen función de pesos.\\n(C) ML.LOCAL_EXPLAIN no existe y ML.FEATURE_INFO da estadísticas, no influencia.\\n\\nPista de examen: Local → ML.EXPLAIN_PREDICT; global → ML.GLOBAL_EXPLAIN con ENABLE_GLOBAL_EXPLAIN.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-c4\"},{\"id\":\"13\",\"question\":\"Un modelo de BigQuery ML debe responder a la app de checkout en menos de 100 ms por petición, y el equipo quiere además comparar versiones y vigilar drift desde un solo sitio sin escribir un contenedor. ¿Qué camino eliges?\",\"options\":{\"A\":\"Registrarlo en Model Registry (MODEL_REGISTRY = 'VERTEX_AI') y desplegarlo en un endpoint online\",\"B\":\"Llamar a ML.PREDICT desde la app en cada petición\",\"C\":\"Precalcular ML.PREDICT cada hora y leerlo de una tabla\",\"D\":\"Reescribir el modelo en TensorFlow y crear un contenedor propio\"},\"correct\":\"A\",\"explanation\":\"Gana: el registro permite desplegar sin contenedor propio, versionar, comparar y monitorizar.\\n\\nPor qué fallan las demás:\\n(B) Es una consulta por lotes: no está pensada para latencias de milisegundos.\\n(C) Sirve valores viejos cuando la cesta cambia en cada petición.\\n(D) Funciona, pero contradice el requisito de no escribir contenedor y añade trabajo innecesario.\\n\\nPista de examen: BigQuery ML + online → Model Registry + endpoint.\",\"difficulty\":\"advanced\",\"flowItem\":\"s2-c5\"},{\"id\":\"14\",\"question\":\"Necesitas calcular en continuo, desde Pub/Sub, el número de transacciones por tarjeta en los últimos 10 minutos para alimentar un modelo de fraude, con unos 50.000 eventos por segundo y sin administrar servidores. ¿Qué usas?\",\"options\":{\"A\":\"Una consulta programada de BigQuery cada hora\",\"B\":\"Dataflow (Apache Beam) con ventanas deslizantes sobre el stream de Pub/Sub\",\"C\":\"Un clúster de Dataproc siempre encendido\",\"D\":\"pandas en un notebook de Workbench\"},\"correct\":\"B\",\"explanation\":\"Gana: procesa streaming con ventanas, escala solo y es serverless.\\n\\nPor qué fallan las demás:\\n(A) Una hora de retraso no sirve para ventanas de 10 minutos en tiempo real.\\n(C) Funciona, pero tú administras el clúster y no es la opción gestionada para streaming.\\n(D) Un notebook no es un proceso de streaming de producción a esa escala.\\n\\nPista de examen: Streaming + ventanas + serverless → Dataflow.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-q1\"},{\"id\":\"15\",\"question\":\"Una planta tiene 8.000 fotos etiquetadas de piezas («ok», «rayada», «rota»), ningún experto en redes neuronales y tres semanas para un piloto con buena precisión. ¿Qué vía de entrenamiento eliges?\",\"options\":{\"A\":\"Entrenamiento personalizado de una CNN desde cero en GPUs\",\"B\":\"BigQuery ML con LOGISTIC_REG sobre los píxeles\",\"C\":\"AutoML de clasificación de imágenes en Agent Platform\",\"D\":\"K-means sobre las fotos para descubrir las clases\"},\"correct\":\"C\",\"explanation\":\"Gana: entrena un modelo de visión de calidad sin código de entrenamiento con datos etiquetados.\\n\\nPor qué fallan las demás:\\n(A) Exige experiencia que el equipo no tiene y más tiempo.\\n(B) Un modelo lineal sobre píxeles no es adecuado para visión.\\n(D) Las clases ya están etiquetadas: el problema es supervisado.\\n\\nPista de examen: Imágenes etiquetadas + sin expertos → AutoML.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-q2\"},{\"id\":\"16\",\"question\":\"Tu equipo prototipa con datos de clientes que no pueden salir del proyecto; seguridad exige IAM, CMEK y red privada, y el equipo quiere JupyterLab con GPU. ¿Dónde trabajan?\",\"options\":{\"A\":\"En el Colab gratuito con los datos descargados\",\"B\":\"En portátiles con claves JSON de una cuenta de servicio\",\"C\":\"En una VM compartida con la cuenta predeterminada y rol Editor\",\"D\":\"En instancias de Agent Platform Workbench dentro del proyecto, con GPU, CMEK y red de la VPC\"},\"correct\":\"D\",\"explanation\":\"Gana: JupyterLab gestionado con los controles de seguridad del proyecto.\\n\\nPor qué fallan las demás:\\n(A) Vive fuera del proyecto: no aplica tus controles.\\n(B) Las claves descargadas son un riesgo y los datos salen del perímetro.\\n(C) Viola el mínimo privilegio y mezcla identidades.\\n\\nPista de examen: Datos sensibles + notebooks → Workbench o Colab Enterprise en tu proyecto.\",\"difficulty\":\"basic\",\"flowItem\":\"s3-c1\"},{\"id\":\"17\",\"question\":\"Un modelo de visión tarda 3 días en 1 GPU; cabe de sobra en la memoria de una GPU, el dataset es enorme y negocio lo quiere en horas sin cambiar la arquitectura. ¿Qué estrategia aplicas?\",\"options\":{\"A\":\"Paralelismo de datos en varias GPUs (y nodos), con all-reduce de gradientes\",\"B\":\"Paralelismo de modelo repartiendo capas entre GPUs\",\"C\":\"Una CPU con muchos núcleos\",\"D\":\"Bajar el tamaño del dataset a la mitad\"},\"correct\":\"A\",\"explanation\":\"Gana: cada réplica procesa una parte del lote; es lo indicado cuando el modelo cabe.\\n\\nPor qué fallan las demás:\\n(B) Es para modelos que NO caben en una GPU; aquí añade comunicación sin beneficio.\\n(C) Las redes de visión entrenan mucho más rápido en aceleradores.\\n(D) Reduce el tiempo a costa de la calidad, no resuelve el requisito.\\n\\nPista de examen: Modelo cabe + datos enormes → paralelismo de datos.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-c2\"},{\"id\":\"18\",\"question\":\"Tus features de cliente se calculan en BigQuery para entrenar; la API de predicción necesita el último valor de cada cliente en milisegundos, con la misma definición que en entrenamiento. ¿Qué usas?\",\"options\":{\"A\":\"Una consulta a BigQuery por petición\",\"B\":\"Agent Platform Feature Store sirviendo online desde las tablas de BigQuery\",\"C\":\"Recalcular las features en la API con código propio\",\"D\":\"Exportar las features a CSV cada noche\"},\"correct\":\"B\",\"explanation\":\"Gana: BigQuery es el almacén offline y Feature Store sirve el último valor con baja latencia y la misma definición.\\n\\nPor qué fallan las demás:\\n(A) Las consultas tardan segundos y encarecen cada predicción.\\n(C) Duplica la lógica y abre la puerta al training-serving skew.\\n(D) No da baja latencia ni valores actualizados.\\n\\nPista de examen: Misma feature en entrenamiento y online → Feature Store.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s3-c3\"},{\"id\":\"19\",\"question\":\"Al pasar un job de PyTorch de 1 a 8 GPUs multiplicaste el lote y el learning rate por 8. Desde la época 3 la pérdida es NaN; los datos y el código del modelo no cambiaron. ¿Qué haces primero?\",\"options\":{\"A\":\"Añadir más GPUs para estabilizar\",\"B\":\"Quitar el dropout\",\"C\":\"Añadir warmup del learning rate y recorte de gradientes, y bajar el learning rate si persiste\",\"D\":\"Cambiar a paralelismo de modelo\"},\"correct\":\"C\",\"explanation\":\"Gana: el paso es demasiado grande y los gradientes explotan; warmup y recorte lo estabilizan.\\n\\nPor qué fallan las demás:\\n(A) Más hardware no corrige gradientes que explotan.\\n(B) El dropout no causa NaN; el problema está en el tamaño del paso.\\n(D) El modelo cabe; cambiar de estrategia no corrige el learning rate.\\n\\nPista de examen: NaN tras subir el learning rate → gradientes que explotan: warmup + recorte.\",\"difficulty\":\"advanced\",\"flowItem\":\"s3-c4\"},{\"id\":\"20\",\"question\":\"Cada entrenamiento tarda 2 horas, tienes presupuesto para 40 trials y el resultado debe estar en 2 días (48 h). En secuencia serían 80 h. ¿Cómo configuras el tuning de hiperparámetros en Agent Platform?\",\"options\":{\"A\":\"40 trials en paralelo a la vez para terminar en 2 horas\",\"B\":\"1 trial cada vez con el algoritmo por defecto\",\"C\":\"GRID_SEARCH sobre rangos continuos\",\"D\":\"Algoritmo por defecto (bayesiano) con unos 4 trials en paralelo\"},\"correct\":\"D\",\"explanation\":\"Gana: 10 tandas de 2 h caben en el plazo y cada tanda aprende de las anteriores.\\n\\nPor qué fallan las demás:\\n(A) Cumple el plazo, pero el algoritmo bayesiano no aprende nada entre intentos: equivale a una búsqueda aleatoria.\\n(B) Tardaría 80 horas: incumple el plazo.\\n(C) La búsqueda en rejilla exige parámetros discretos.\\n\\nPista de examen: Paralelismo justo para el plazo; el resto, secuencial para que el bayesiano aprenda.\",\"difficulty\":\"advanced\",\"flowItem\":\"s3-c5\"},{\"id\":\"21\",\"question\":\"Marketing necesita cada domingo la probabilidad de compra de 50 millones de clientes para la campaña del lunes. Nadie consulta el modelo entre semana y el presupuesto es ajustado. ¿Cómo lo sirves?\",\"options\":{\"A\":\"Inferencia por lotes programada el domingo, escribiendo en BigQuery\",\"B\":\"Un endpoint online con 10 réplicas mínimas\",\"C\":\"Llamar al endpoint 50 millones de veces el domingo\",\"D\":\"Un notebook que alguien ejecuta a mano\"},\"correct\":\"A\",\"explanation\":\"Gana: paga solo mientras corre y no necesita endpoint.\\n\\nPor qué fallan las demás:\\n(B) Pagas réplicas encendidas toda la semana sin tráfico.\\n(C) Usa una herramienta de baja latencia para un trabajo masivo y caro.\\n(D) No es repetible ni fiable para producción.\\n\\nPista de examen: Resultados para después + gran volumen → batch.\",\"difficulty\":\"basic\",\"flowItem\":\"s4-q1\"},{\"id\":\"22\",\"question\":\"Tu endpoint atiende 10 peticiones por segundo, pero cada Black Friday llega a 800 en minutos y el SLA de 150 ms se rompe mientras escala. El pico es previsible. ¿Qué ajustas?\",\"options\":{\"A\":\"Bajar el objetivo de CPU al 10 % todo el año\",\"B\":\"Reentrenar el modelo con datos de Black Friday\",\"C\":\"Cambiar a inferencia por lotes\",\"D\":\"Subir el mínimo de réplicas antes del evento (y el máximo para cubrir el pico) y bajarlo después\"},\"correct\":\"D\",\"explanation\":\"Gana: la capacidad ya está lista cuando llega el pico; el autoescalado no tiene que alcanzarlo.\\n\\nPor qué fallan las demás:\\n(A) Mantiene muchas réplicas siempre: caro para un pico de unos días.\\n(B) Es un problema de capacidad, no de exactitud.\\n(C) El checkout necesita respuesta por petición.\\n\\nPista de examen: Pico previsible → réplicas mínimas preparadas antes; el autoescalado tarda.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-q2\"},{\"id\":\"23\",\"question\":\"Un modelo nuevo gana al actual en validación, pero no quieres arriesgar a todos los clientes ni cambiar la URL que usan las aplicaciones. Necesitas poder volver atrás en minutos. ¿Cómo lo despliegas?\",\"options\":{\"A\":\"Crear un endpoint nuevo y cambiar la URL en todas las apps\",\"B\":\"Sustituir el modelo de golpe fuera de horario\",\"C\":\"Desplegarlo en el mismo endpoint con un 10 % del tráfico y subirlo mientras las métricas aguanten\",\"D\":\"Probarlo solo con datos de validación otra vez\"},\"correct\":\"C\",\"explanation\":\"Gana: canary con reparto de tráfico; volver atrás es devolver el 100 % al anterior.\\n\\nPor qué fallan las demás:\\n(A) Cambia la URL y no limita el riesgo inicial.\\n(B) Arriesga al 100 % de los clientes desde el primer minuto.\\n(D) No expone el modelo al tráfico real.\\n\\nPista de examen: Actualizar con poco riesgo → canary en el mismo endpoint.\",\"difficulty\":\"basic\",\"flowItem\":\"s4-c1\"},{\"id\":\"24\",\"question\":\"Model Monitoring alerta de drift en «importe» tras una campaña, pero la precision medida con las etiquetas reales de 4 semanas no cambió y la atribución de esa feature sigue igual. ¿Qué haces?\",\"options\":{\"A\":\"Reentrenar inmediatamente con los datos de la campaña\",\"B\":\"Investigar la causa del cambio, revisar el umbral de alerta y seguir vigilando el rendimiento con etiquetas\",\"C\":\"Desactivar la monitorización de esa feature\",\"D\":\"Hacer rollback al modelo anterior\"},\"correct\":\"B\",\"explanation\":\"Gana: el drift avisa de un cambio en las entradas, no prueba que el modelo falle.\\n\\nPor qué fallan las demás:\\n(A) Asume que drift implica caída de rendimiento; las etiquetas dicen lo contrario.\\n(C) Pierdes visibilidad si el cambio llega a dañar el modelo.\\n(D) El anterior vería las mismas entradas; no hay fallo que revertir.\\n\\nPista de examen: Drift de entradas ≠ caída de rendimiento: confírmalo con etiquetas.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-c2\"},{\"id\":\"25\",\"question\":\"Debes configurar explicaciones en Agent Platform para un modelo XGBoost tabular de riesgo. El regulador exige atribuciones por feature en cada predicción online. ¿Qué método configuras?\",\"options\":{\"A\":\"Sampled Shapley\",\"B\":\"Integrated gradients\",\"C\":\"XRAI\",\"D\":\"Ninguno: basta con la importancia global del entrenamiento\"},\"correct\":\"A\",\"explanation\":\"Gana: aproxima valores de Shapley sin necesitar gradientes; es el método para modelos no diferenciables como los árboles.\\n\\nPor qué fallan las demás:\\n(B) Necesita un modelo diferenciable; un ensemble de árboles no lo es.\\n(C) Está pensado para imágenes, agrupando atribuciones por regiones.\\n(D) El requisito es por predicción, no global.\\n\\nPista de examen: Árboles → sampled Shapley; redes con imágenes → integrated gradients o XRAI.\",\"difficulty\":\"intermediate\",\"flowItem\":\"s4-c3\"},{\"id\":\"26\",\"question\":\"Un modelo de demanda se reentrena «cuando alguien se acuerda». Las etiquetas reales llegan con 2 semanas de retraso, el negocio cambia por temporadas y un despliegue malo cuesta caro. ¿Qué política propones?\",\"options\":{\"A\":\"Reentrenar cada hora y desplegar siempre el último\",\"B\":\"Reentrenar solo cuando un cliente se queje\",\"C\":\"Reentrenar una vez al año\",\"D\":\"Pipeline programado según la temporada más disparadores por alertas o caída de la métrica con etiquetas, con puerta frente al modelo actual antes de un canary\"},\"correct\":\"D\",\"explanation\":\"Gana: combina calendario y evidencia, y solo promueve lo que demuestra ser mejor.\\n\\nPor qué fallan las demás:\\n(A) Desplegar sin puerta arriesga modelos peores; cada hora no aporta etiquetas nuevas.\\n(B) Reacciona tarde y sin criterio medible.\\n(C) Ignora la estacionalidad del negocio.\\n\\nPista de examen: Política = calendario + disparadores + puerta de evaluación.\",\"difficulty\":\"advanced\",\"flowItem\":\"s4-c4\"},{\"id\":\"27\",\"question\":\"Tu endpoint responde en 450 ms y el SLA es 100 ms. El perfil muestra que el modelo tarda 15 ms y el resto es una consulta a BigQuery por petición para obtener el historial del cliente. ¿Qué cambias?\",\"options\":{\"A\":\"Pasar a una máquina con GPU\",\"B\":\"Servir esas features precalculadas desde Feature Store en lugar de consultar BigQuery en cada petición\",\"C\":\"Subir el máximo de réplicas\",\"D\":\"Reentrenar un modelo más pequeño\"},\"correct\":\"B\",\"explanation\":\"Gana: lectura online de baja latencia con la misma definición que en entrenamiento.\\n\\nPor qué fallan las demás:\\n(A) El modelo ya tarda 15 ms; el cuello de botella es la consulta.\\n(C) Más réplicas no aceleran una consulta lenta por petición.\\n(D) El modelo no es el problema.\\n\\nPista de examen: Mide dónde se va el tiempo antes de tocar el modelo o el hardware.\",\"difficulty\":\"advanced\",\"flowItem\":\"s4-c5\"}]}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"
