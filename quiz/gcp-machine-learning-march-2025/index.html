he purpose of Vertex AI Model Registry?\",\"options\":{\"A\":\"Train models using different frameworks\",\"B\":\"Create custom containers for model serving\",\"C\":\"Store and version registered models for deployment\",\"D\":\"Visualize training metrics\"},\"correct\":\"C\",\"explanation\":\"The Vertex AI Model Registry helps manage model versions and supports downstream deployment workflows to prediction endpoints.\"},{\"id\":\"3\",\"question\":\"Which service allows you to create an end-to-end pipeline for model deployment and continuous training in Vertex AI?\",\"options\":{\"A\":\"Cloud Scheduler\",\"B\":\"Cloud Composer\",\"C\":\"Vertex AI Pipelines\",\"D\":\"Dataflow\"},\"correct\":\"C\",\"explanation\":\"Vertex AI Pipelines enable automated, repeatable, and serverless orchestration of ML workflows using MLOps best practices.\"},{\"id\":\"4\",\"question\":\"When deploying a model using a custom container in Vertex AI, what is a required file to expose the model's prediction logic?\",\"options\":{\"A\":\"requirements.txt\",\"B\":\"Dockerfile\",\"C\":\"model_config.yaml\",\"D\":\"predictor.py\"},\"correct\":\"B\",\"explanation\":\"A Dockerfile is required to build a custom container image, which packages the HTTP serving application and dependencies needed to expose the model logic.\"},{\"id\":\"5\",\"question\":\"How does Vertex AI support zero-downtime model updates in production?\",\"options\":{\"A\":\"By automatically deleting the old model\",\"B\":\"Using multi-region model caching\",\"C\":\"Supporting versioned deployments and traffic splitting\",\"D\":\"Automatically retraining the model before deployment\"},\"correct\":\"C\",\"explanation\":\"Vertex AI allows you to deploy multiple model versions to a single endpoint and split traffic between them to ensure safe, zero-downtime rollouts.\"},{\"id\":\"6\",\"question\":\"Which monitoring feature in Vertex AI allows tracking of model drift?\",\"options\":{\"A\":\"BigQuery ML\",\"B\":\"Explainable AI\",\"C\":\"Model Monitoring\",\"D\":\"Cloud Logging\"},\"correct\":\"C\",\"explanation\":\"Vertex AI Model Monitoring helps detect data drift, prediction skew, and training-serving skew by evaluating incoming production features against a baseline.\"},{\"id\":\"7\",\"question\":\"What kind of metrics can Vertex AI Model Monitoring detect for deployed models?\",\"options\":{\"A\":\"CPU and memory usage only\",\"B\":\"Data drift, prediction drift, and skew\",\"C\":\"Cost of training jobs\",\"D\":\"Training job duration\"},\"correct\":\"B\",\"explanation\":\"Vertex AI Model Monitoring tracks statistical distance deviations in incoming request features to flag data drift, prediction drift, and training-serving skew.\"},{\"id\":\"8\",\"question\":\"Which MLOps practice involves automatically testing model training code when pushed to a repository?\",\"options\":{\"A\":\"Continuous Deployment\",\"B\":\"Continuous Monitoring\",\"C\":\"Continuous Integration\",\"D\":\"Model Validation\"},\"correct\":\"C\",\"explanation\":\"CI in MLOps ensures that code changes, data validation tests, and training scripts are automatically tested and verified when committed to a repository.\"},{\"id\":\"9\",\"question\":\"What is the benefit of using Vertex AI with CI/CD tools like Cloud Build and Cloud Source Repositories?\",\"options\":{\"A\":\"Free model hosting\",\"B\":\"Manual model versioning\",\"C\":\"Automating retraining and redeployment workflows\",\"D\":\"Removing the need for pipelines\"},\"correct\":\"C\",\"explanation\":\"Integrating CI/CD tools like Cloud Build with Vertex AI supports automated, hands-free training, verification, and deployment of models based on triggers.\"},{\"id\":\"10\",\"question\":\"You are working on a binary classification problem with an imbalanced dataset. Which evaluation metric is most appropriate for selecting a model?\",\"options\":{\"A\":\"Accuracy\",\"B\":\"Mean Absolute Error (MAE)\",\"C\":\"F1 Score\",\"D\":\"R-squared\"},\"correct\":\"C\",\"explanation\":\"F1 Score balances precision and recall, making it highly effective for evaluation on imbalanced classification datasets where vanilla accuracy can be highly misleading.\"},{\"id\":\"11\",\"question\":\"How do you specify the time column in a time-series model?\",\"options\":{\"A\":\"OPTIONS(TIMESTAMP_COL='timestamp’)\",\"B\":\"OPTIONS(TIME_COLUMN='timestamp')\",\"C\":\"OPTIONS(DATE_FIELD='timestamp’)\",\"D\":\"OPTIONS(DATETIME_COL='timestamp’)\"},\"correct\":\"A\",\"explanation\":\"The TIMESTAMP_COL option is required for time-series models (such as ARIMA_PLUS) in BigQuery ML to define the chronological/temporal column.\"},{\"id\":\"12\",\"question\":\"Which TensorFlow method is best used for early stopping during model training?\",\"options\":{\"A\":\"tf.keras.callbacks.ReduceLROnPlateau\",\"B\":\"tf.keras.callbacks.ModelCheckpoint\",\"C\":\"tf.keras.callbacks.EarlyStopping\",\"D\":\"tf.keras.metrics.AUC\"},\"correct\":\"C\",\"explanation\":\"EarlyStopping halts training when a monitored metric (like validation loss) stops improving for a consecutive number of epochs, preventing overfitting.\"},{\"id\":\"13\",\"question\":\"Which of the following best explains why you would choose XGBoost over a neural network for tabular data?\",\"options\":{\"A\":\"Neural networks train faster than XGBoost\",\"B\":\"XGBoost provides interpretability and often outperforms NN on structured data\",\"C\":\"Neural networks cannot handle categorical variables\",\"D\":\"XGBoost requires GPU acceleration\"},\"correct\":\"B\",\"explanation\":\"XGBoost is highly effective on tabular/structured datasets, trains efficiently without massive architectures, and provides clean feature importance metrics.\"},{\"id\":\"14\",\"question\":\"In TensorFlow, which API should you use for building custom training loops?\",\"options\":{\"A\":\"tf.estimator\",\"B\":\"tf.keras.Sequential\",\"C\":\"tf.function\",\"D\":\"tf.GradientTape\"},\"correct\":\"D\",\"explanation\":\"tf.GradientTape is used for recording forward-pass operations for automatic differentiation, making it the foundational component for building custom Keras training loops.\"},{\"id\":\"15\",\"question\":\"You are using XGBoost with the learning rate set too high. What is the likely outcome?\",\"options\":{\"A\":\"Model will converge too slowly\",\"B\":\"Model might not converge and could overshoot the optimal solution\",\"C\":\"Model will underfit\",\"D\":\"Feature importance will be skewed\"},\"correct\":\"B\",\"explanation\":\"A learning rate that is set too high can cause gradient descent steps to overshoot the global minima or diverge entirely, resulting in non-convergence.\"},{\"id\":\"16\",\"question\":\"Which hyperparameter in XGBoost controls model complexity by limiting tree depth?\",\"options\":{\"A\":\"learning_rate\",\"B\":\"gamma\",\"C\":\"max_depth\",\"D\":\"n_estimators\"},\"correct\":\"C\",\"explanation\":\"max_depth limits how deep individual decision trees can grow. Lowering it directly restricts model complexity and mitigates overfitting.\"},{\"id\":\"17\",\"question\":\"What is the purpose of the batch_size hyperparameter in TensorFlow?\",\"options\":{\"A\":\"Number of training steps per epoch\",\"B\":\"Number of layers in the model\",\"C\":\"Number of samples processed before model weights are updated\",\"D\":\"Total number of data points\"},\"correct\":\"C\",\"explanation\":\"batch_size defines the specific window size of data samples propagated through the network before backpropagation calculates the gradients and updates weights.\"},{\"id\":\"18\",\"question\":\"Which optimizer generally performs better for deep learning models in TensorFlow?\",\"options\":{\"A\":\"SGD\",\"B\":\"RMSProp\",\"C\":\"Adam\",\"D\":\"Momentum\"},\"correct\":\"C\",\"explanation\":\"Adam combines the core concepts of both RMSProp and Momentum, using adaptive learning rates that make it the gold standard baseline for modern deep learning architectures.\"},{\"id\":\"19\",\"question\":\"A TensorFlow model is overfitting the training data. Which strategy would help mitigate this?\",\"options\":{\"A\":\"Increase learning rate\",\"B\":\"Add more dense layers\",\"C\":\"Reduce dropout\",\"D\":\"Use L2 regularization\"},\"correct\":\"D\",\"explanation\":\"L2 regularization penalizes large weights by adding their squared value to the loss function, forcing the model to learn smoother transformations and reducing overfitting.\"},{\"id\":\"20\",\"question\":\"You need to process a large stream of real-time logs and write the results to BigQuery. Which GCP service is most appropriate?\",\"options\":{\"A\":\"Cloud Pub/Sub\",\"B\":\"Cloud Dataflow\",\"C\":\"Cloud Composer\",\"D\":\"BigQuery ML\"},\"correct\":\"B\",\"explanation\":\"Cloud Dataflow is built on Apache Beam for managed batch and stream processing. It scales horizontally to ingest from Pub/Sub streams and output directly into BigQuery.\"},{\"id\":\"21\",\"question\":\"Which of the following ensures schema consistency in data stored in BigQuery?\",\"options\":{\"A\":\"Schema auto-detection\",\"B\":\"Schema enforcement via defined schema\",\"C\":\"Appending JSON directly\",\"D\":\"Using federated queries\"},\"correct\":\"B\",\"explanation\":\"Explicitly defining a schema on a destination BigQuery table ensures incoming records adhere to strict structural constraints, maintaining clean data integrity.\"},{\"id\":\"22\",\"question\":\"You're building a pipeline to detect anomalies in streaming sensor data. What Dataflow feature helps maintain data order in a stream?\",\"options\":{\"A\":\"Watermarks\",\"B\":\"Job templates\",\"C\":\"Shuffle\",\"D\":\"Windowing\"},\"correct\":\"D\",\"explanation\":\"Windowing cuts unbounded streaming elements into finite chronological sets based on event time, which lets you analyze records in proper sequence for tasks like anomaly detection.\"},{\"id\":\"23\",\"question\":\"To efficiently query structured historical data and integrate with ML pipelines, which storage solution should you use?\",\"options\":{\"A\":\"Cloud Storage\",\"B\":\"Cloud Spanner\",\"C\":\"BigQuery\",\"D\":\"Firestore\"},\"correct\":\"C\",\"explanation\":\"BigQuery is optimized for analytical workloads, scales across large datasets efficiently, and bridges natively into downstream ML training infrastructure.\"},{\"id\":\"24\",\"question\":\"You need to validate and clean inconsistent input data before training a model. What tool should you use?\",\"options\":{\"A\":\"TensorFlow Data Validation\",\"B\":\"AI Platform Notebooks\",\"C\":\"BigQuery ML\",\"D\":\"Vertex AI Pipelines\"},\"correct\":\"A\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: A. TensorFlow Data Validation (TFDV) computes statistics, infers a schema and detects anomalies, missing values, skew and drift. That makes it the tool for checking input data quality before training, and it runs inside TFX or Vertex AI Pipelines.\\n\\nWhy not the others: B) Notebooks (formerly AI Platform Notebooks, now Vertex AI Workbench) is a development environment, not a validation tool. C) BigQuery ML trains models with SQL. D) Pipelines orchestrates steps; TFDV is the step that validates.\",\"explanationSource\":\"written\"},{\"id\":\"25\",\"question\":\"Which BigQuery feature allows you to reduce query costs for repeated queries?\",\"options\":{\"A\":\"On-demand pricing\",\"B\":\"Slot reservations\",\"C\":\"Materialized views\",\"D\":\"Streaming insert\"},\"correct\":\"C\",\"explanation\":\"Materialized views systematically cache and precompute common query expressions, saving execution time and reducing computational processing costs.\"},{\"id\":\"26\",\"question\":\"What method should you use in Cloud Dataflow to handle late-arriving data?\",\"options\":{\"A\":\"Windowing with triggers\",\"B\":\"Custom DoFn\",\"C\":\"Aggregation\",\"D\":\"Streaming insert\"},\"correct\":\"A\",\"explanation\":\"Dataflow leverages window triggers alongside allowed lateness windows to correctly recalculate and handle streaming data arriving late relative to the watermark.\"},{\"id\":\"27\",\"question\":\"Which BigQuery feature supports federated queries on external data sources like Cloud Storage?\",\"options\":{\"A\":\"Scheduled Queries\",\"B\":\"External Tables\",\"C\":\"Datasets\",\"D\":\"Partitions\"},\"correct\":\"B\",\"explanation\":\"External tables expose structured source data living outside BigQuery (like flat files in Cloud Storage) as a reference table without needing to pay ingestion costs.\"},{\"id\":\"28\",\"question\":\"You need to build a scalable ETL pipeline that ingests data, processes it, and stores it in BigQuery daily. What service combination should you use?\",\"options\":{\"A\":\"Dataflow + BigQuery\",\"B\":\"Data Studio + BigQuery\",\"C\":\"Cloud Functions + Firestore\",\"D\":\"Pub/Sub + Cloud Storage\"},\"correct\":\"A\",\"explanation\":\"Cloud Dataflow provides the required scalable computational core to process logic transformations, and BigQuery serves as the analytics data warehouse target.\"},{\"id\":\"29\",\"question\":\"You want to build a binary classification model in BigQuery ML to predict whether a customer will churn. Which model type should you use?\",\"options\":{\"A\":\"linear_reg\",\"B\":\"logistic_reg\",\"C\":\"kmeans\",\"D\":\"arima_plus\"},\"correct\":\"B\",\"explanation\":\"The logistic_reg configuration inside BigQuery ML is optimized for discrete binary classification problems like modeling customer churn predictions.\"},{\"id\":\"30\",\"question\":\"Which BigQuery ML function allows you to create a model using a SQL statement?\",\"options\":{\"A\":\"CREATE PREDICTION MODEL\",\"B\":\"CREATE MODEL\",\"C\":\"TRAIN MODEL\",\"D\":\"DEFINE MODEL\"},\"correct\":\"B\",\"explanation\":\"The CREATE MODEL SQL statement is the unified native declaration syntax used to define parameters and kick off training routines inside BigQuery ML.\"},{\"id\":\"31\",\"question\":\"What SQL clause is used in CREATE MODEL to specify the type of model?\",\"options\":{\"A\":\"OPTIONS(MODEL_TYPE=...)\",\"B\":\"WITH MODEL TYPE\",\"C\":\"MODEL AS\",\"D\":\"SET MODEL TYPE\"},\"correct\":\"A\",\"explanation\":\"BigQuery ML captures critical model hyperparameters—such as model types, regularizations, and columns—directly inside the model parameter OPTIONS wrapper.\"},{\"id\":\"32\",\"question\":\"You want to evaluate the accuracy of your classification model. Which BigQuery ML function should you use?\",\"options\":{\"A\":\"ML.EVALUATE\",\"B\":\"ML.TRAIN\",\"C\":\"ML.TEST\",\"D\":\"ML.VALIDATE\"},\"correct\":\"A\",\"explanation\":\"Calling ML.EVALUATE prints a clean table containing key standard scoring indicators including precision, precision-recall curve details, accuracy, and absolute recall values.\"},{\"id\":\"33\",\"question\":\"Which statement is TRUE about BigQuery ML model training?\",\"options\":{\"A\":\"Models are trained outside of BigQuery using AutoML.\",\"B\":\"BigQuery ML models must use external CSV data.\",\"C\":\"Training is done using SQL inside BigQuery.\",\"D\":\"You must install TensorFlow to use BigQuery ML.\"},\"correct\":\"C\",\"explanation\":\"BigQuery ML completely executes statistical models directly within the processing infrastructure utilizing standard SQL syntax, removing the need for external tools.\"},{\"id\":\"34\",\"question\":\"Which model type should you use to predict future sales using BigQuery ML?\",\"options\":{\"A\":\"kmeans\",\"B\":\"logistic_reg\",\"C\":\"arima_plus\",\"D\":\"matrix factorization\"},\"correct\":\"C\",\"explanation\":\"arima_plus handles the seasonal trends, forecasting periods, anomalies, and adjustments native to time-series sequences like forward-looking retail projections.\"},{\"id\":\"35\",\"question\":\"You want to cluster customer data based on purchasing behavior. Which model type is most appropriate?\",\"options\":{\"A\":\"logistic_reg\",\"B\":\"kmeans\",\"C\":\"linear_reg\",\"D\":\"arima_plus\"},\"correct\":\"B\",\"explanation\":\"The kmeans configuration leverages unsupervised algorithms to isolate statistical cohorts and categorize vectors dynamically by feature similarities.\"},{\"id\":\"36\",\"question\":\"You want to recommend products based on user-item interactions. Which BigQuery ML model type should you use?\",\"options\":{\"A\":\"logistic_reg\",\"B\":\"kmeans\",\"C\":\"matrix factorization\",\"D\":\"arima_plus\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. MATRIX_FACTORIZATION, which implements collaborative filtering.\\n\\nHow it works:\\n• It decomposes the user × item matrix into latent vectors for users and for items.\\n• It predicts a user's affinity for items they have not interacted with.\\n• Options: USER_COL, ITEM_COL, RATING_COL, NUM_FACTORS, FEEDBACK_TYPE.\\n• Recommendations with ML.RECOMMEND.\\n\\nExam tip: \\\"recommendations\\\", \\\"users who bought X\\\", \\\"collaborative filtering\\\".\\nDo not confuse with: logistic_reg (classification), kmeans (segmentation), or arima_plus (forecasting).\",\"explanationSource\":\"card-en\"},{\"id\":\"37\",\"question\":\"In BigQuery ML, how can you use a trained model to generate predictions?\",\"options\":{\"A\":\"ML.PREDICT(MODEL ...)\",\"B\":\"ML.APPLY(MODEL ...)\",\"C\":\"PREDICT FROM MODEL\",\"D\":\"EXECUTE MODEL\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. With the ML.PREDICT function on the model and a query that supplies the input data.\\n\\nHow it works:\\n• SELECT * FROM ML.PREDICT(MODEL `ds.model`, (SELECT * FROM `ds.new_customers`));\\n• It returns the input columns plus predicted_\u003clabel\u003e (and probabilities in classification).\\n• To save results: CREATE TABLE ... AS SELECT ... FROM ML.PREDICT(...).\\n\\nExam tip: \\\"generate predictions in BigQuery ML\\\".\\nDo not confuse with: ML.APPLY, PREDICT FROM MODEL, or EXECUTE MODEL, which do not exist.\",\"explanationSource\":\"card-en\"},{\"id\":\"38\",\"question\":\"You notice model performance degradation over time. What should you do first in Vertex AI?\",\"options\":{\"A\":\"Increase instance size\",\"B\":\"Enable automatic hyperparameter tuning\",\"C\":\"Review Vertex AI Model Monitoring alerts\",\"D\":\"Rebuild the training container\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Review Vertex AI Model Monitoring alerts and statistics to understand the cause (drift or skew on specific features).\\n\\nHow it works:\\n• Model Monitoring shows which features changed in distribution and by how much.\\n• With that diagnosis you decide: retrain on recent data, fix preprocessing, or review the data source.\\n\\nExam tip: \\\"diagnose first\\\", \\\"degradation over time\\\".\\nDo not confuse with: increasing instance size (latency, not quality), hyperparameter tuning (does not address data change), or rebuilding the container (does not change the model).\",\"explanationSource\":\"card-en\"},{\"id\":\"39\",\"question\":\"Which of the following is required to enable Model Monitoring in Vertex AI?\",\"options\":{\"A\":\"Enable billing export\",\"B\":\"Define objective functions\",\"C\":\"Set up a sampling strategy and alerting thresholds\",\"D\":\"Provide a Dockerfile for serving\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. A sampling strategy (sampling rate) and per-feature alerting thresholds, plus the monitoring interval and who to notify.\\n\\nHow it works:\\n• Sampling rate: what % of requests are logged and analyzed (controls cost).\\n• Monitoring interval: how often it is computed (e.g. every hour).\\n• Thresholds: the distance at which an alert fires.\\n• For skew, also the training dataset as a baseline.\\n\\nExam tip: \\\"sampling\\\", \\\"thresholds\\\", \\\"alerts\\\".\\nDo not confuse with: billing export (cost), objective functions (training/tuning), or Dockerfile (serving).\",\"explanationSource\":\"card-en\"},{\"id\":\"40\",\"question\":\"Which CI/CD tool in Google Cloud helps create automated workflows for building, testing, and deploying ML models?\",\"options\":{\"A\":\"Cloud Functions\",\"B\":\"Cloud Build\",\"C\":\"BigQuery\",\"D\":\"Cloud Logging\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Cloud Build: a serverless CI/CD service that runs steps defined in a cloudbuild.yaml file.\\n\\nHow it works:\\n• Each step runs in a container (tests, docker build, gcloud, Python scripts).\\n• Triggers: push or pull request on GitHub/GitLab/Bitbucket, Pub/Sub, or manual.\\n• It stores images in Artifact Registry and can launch Vertex AI Pipelines or deploy to endpoints.\\n\\nExam tip: \\\"CI/CD\\\", \\\"automated build, test, deploy\\\".\\nDo not confuse with: Cloud Functions/Cloud Run functions (code on events), BigQuery (warehouse), or Cloud Logging (logs).\",\"explanationSource\":\"card-en\"},{\"id\":\"41\",\"question\":\"What happens if a deployed Vertex AI model fails due to a change in input schema?\",\"options\":{\"A\":\"The model self-heals\",\"B\":\"Prediction calls return errors\",\"C\":\"Vertex AI updates the model automatically\",\"D\":\"The model continues predicting without issue\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Prediction calls return errors (or incorrect results), because the model expects features with the names, types, and order it was trained on.\\n\\nHow it works:\\n• The endpoint does not adapt the model; it only runs it on what it receives.\\n• Fix: update the client or preprocessing, or retrain and redeploy with the new schema.\\n• Prevention: data and schema validation in the pipeline and in the client.\\n\\nExam tip: \\\"schema change\\\" → prediction errors.\\nDo not confuse with: \\\"the model self-heals\\\", \\\"Vertex AI updates it automatically\\\", or \\\"it keeps working\\\": Vertex AI does none of that.\",\"explanationSource\":\"card-en\"},{\"id\":\"42\",\"question\":\"In Vertex AI, what is the primary way to trigger a model retraining pipeline on a regular basis?\",\"options\":{\"A\":\"Cloud SQL\",\"B\":\"Cloud Scheduler\",\"C\":\"BigQuery Scheduled Queries\",\"D\":\"Cloud Spanner\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Cloud Scheduler, the managed cron that can fire the pipeline with a cron expression.\\n\\nHow it works:\\n• Cloud Scheduler calls the Vertex AI API (or a Cloud Run function or a Pub/Sub topic) that creates the PipelineJob.\\n• Today Vertex AI Pipelines also has native scheduling: PipelineJob.create_schedule(cron=...) (Vertex AI Scheduler API).\\n\\nExam tip: \\\"periodically\\\", \\\"every night/week\\\", \\\"cron\\\".\\nDo not confuse with: BigQuery Scheduled Queries (schedules SQL; useful for retraining BigQuery ML models, not Vertex AI pipelines), Cloud SQL and Spanner (databases).\",\"explanationSource\":\"card-en\"},{\"id\":\"43\",\"question\":\"Which of the following is a benefit of using managed endpoints in Vertex AI?\",\"options\":{\"A\":\"Manual scaling is required\",\"B\":\"Enables local model testing\",\"C\":\"Simplifies deployment with automatic scaling and monitoring\",\"D\":\"Requires setting up VMs manually\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. They simplify deployment: Vertex AI manages the infrastructure, autoscaling, and monitoring integration.\\n\\nHow it works:\\n• You define machine type, accelerators, and min/max replicas.\\n• Autoscaling adds or removes nodes based on load (CPU/GPU, default target 60%).\\n• Latency, error, and traffic metrics in Cloud Monitoring; optional Model Monitoring.\\n• Traffic split across versions.\\n\\nExam tip: \\\"managed\\\", \\\"automatic scaling\\\", \\\"without administering VMs\\\".\\nDo not confuse with: manual scaling or manual VMs (exactly what this avoids), or local tests (done outside the endpoint).\",\"explanationSource\":\"card-en\"},{\"id\":\"44\",\"question\":\"You want to deploy a model and monitor input feature distribution. What should you use?\",\"options\":{\"A\":\"Cloud Pub/Sub\",\"B\":\"Vertex AI Workbench\",\"C\":\"Vertex AI Model Monitoring\",\"D\":\"Cloud SQL\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Vertex AI Model Monitoring on the endpoint, configured to detect drift (and skew if you provide training data).\\n\\nHow it works:\\n• It logs a sample of requests and computes per-feature distributions.\\n• Each interval is compared to the baseline and alerts if the threshold is crossed.\\n• It shows per-feature distribution charts in the console.\\n\\nExam tip: \\\"monitor feature distribution\\\", \\\"detect drift after deploying\\\".\\nDo not confuse with: Pub/Sub (messaging), Vertex AI Workbench (notebooks for development), or Cloud SQL (database).\",\"explanationSource\":\"card-en\"},{\"id\":\"45\",\"question\":\"Which metric is useful for measuring real-time model performance degradation in production?\",\"options\":{\"A\":\"Training loss\",\"B\":\"CPU utilization\",\"C\":\"Prediction accuracy on recent labeled data\",\"D\":\"Number of input records\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Accuracy (or another quality metric) computed on recent labeled data, comparing predictions with ground truth.\\n\\nHow it works:\\n• You store predictions (e.g. endpoint request-response logging to BigQuery).\\n• When the real label arrives (confirmed fraud, actual churn), you join them and compute the metric.\\n• If it drops versus the baseline, you trigger retraining.\\n\\nExam tip: \\\"real model performance\\\", \\\"ground truth\\\".\\nDo not confuse with: training loss (that is the past), CPU (infrastructure), or number of records (volume, not quality).\",\"explanationSource\":\"card-en\"},{\"id\":\"46\",\"question\":\"Which file is typically used to define a custom pipeline in Vertex AI using Kubeflow Pipelines?\",\"options\":{\"A\":\"config.yaml\",\"B\":\"pipeline.py\",\"C\":\"requirements.txt\",\"D\":\"dataset.csv\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. In a Python script (e.g. pipeline.py) that uses the Kubeflow Pipelines (KFP) SDK.\\n\\nHow it works:\\n• You define components with @dsl.component and the pipeline with @dsl.pipeline.\\n• You compile with compiler.Compiler().compile(..., 'pipeline.yaml').\\n• You submit the YAML as a PipelineJob to Vertex AI (or upload it to a template repo in Artifact Registry).\\n\\nExam tip: \\\"define a pipeline\\\" → Python code with the KFP SDK.\\nDo not confuse with: config.yaml (not the definition format; YAML is the compiled output), requirements.txt (dependencies), or dataset.csv (data).\",\"explanationSource\":\"card-en\"},{\"id\":\"47\",\"question\":\"Which loss function is most appropriate for a multi-class classification task in TensorFlow?\",\"options\":{\"A\":\"Binary Crossentropy\",\"B\":\"Mean Squared Error\",\"C\":\"Sparse Categorical Crossentropy\",\"D\":\"Hinge Loss\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Sparse Categorical Crossentropy, the categorical cross-entropy that accepts labels as integers.\\n\\nHow it works:\\n• Output layer with N neurons and softmax (or logits with from_logits=True).\\n• model.compile(loss='sparse_categorical_crossentropy', ...).\\n• If labels are one-hot, you use categorical_crossentropy.\\n\\nExam tip: \\\"multiclass\\\" + \\\"integer labels\\\".\\nDo not confuse with: Binary Crossentropy (2 classes or multilabel), Mean Squared Error (regression), or Hinge Loss (SVM-style classifiers).\",\"explanationSource\":\"card-en\"},{\"id\":\"48\",\"question\":\"When using XGBoost, what effect does increasing the subsample parameter have?\",\"options\":{\"A\":\"Increases the number of trees\",\"B\":\"Decreases overfitting by using a subset of data\",\"C\":\"Reduces tree depth\",\"D\":\"Improves accuracy\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. It controls the fraction of training rows randomly sampled to build each tree (default 1.0 = all). Using less than 1 adds randomness and reduces overfitting.\\n\\nHow it works:\\n• Typical values 0.5–0.9.\\n• Lower subsample: more randomness and less overfitting, with possible underfitting if it is too low.\\n• Raising it toward 1.0 uses more data per tree and removes that regularization.\\n\\nExam tip: \\\"subset of data per tree\\\" → subsample.\\nDo not confuse with: n_estimators (number of trees), max_depth (depth), or colsample_bytree (fraction of columns).\",\"explanationSource\":\"card-en\"},{\"id\":\"49\",\"question\":\"Which technique is used in TensorFlow to adjust the learning rate during training?\",\"options\":{\"A\":\"EarlyStopping\",\"B\":\"ReduceLROnPlateau\",\"C\":\"Dropout\",\"D\":\"GradientTape\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. The callback tf.keras.callbacks.ReduceLROnPlateau.\\n\\nHow it works:\\n• monitor='val_loss', factor=0.1 (multiplies the lr), patience=N epochs without improvement, min_lr as a floor.\\n• Smaller steps help fine-tune near the minimum when training stalls.\\n\\nExam tip: \\\"reduce learning rate when the metric stops improving\\\".\\nDo not confuse with: EarlyStopping (stops training), Dropout (regularization), or GradientTape (computes gradients in custom loops).\",\"explanationSource\":\"card-en\"},{\"id\":\"50\",\"question\":\"What is one advantage of using XGBoost’s gpu_hist tree method?\",\"options\":{\"A\":\"Better interpretability\",\"B\":\"Lower model accuracy\",\"C\":\"Faster training with GPU\",\"D\":\"Avoids overfitting\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Much faster training on large datasets, because histogram construction and split search run on the GPU.\\n\\nHow it works:\\n• In XGBoost 2.0 and later: tree_method='hist' + device='cuda' (gpu_hist is deprecated).\\n• Same histogram algorithm as on CPU, with equivalent results.\\n• On Vertex AI: a custom training job on a machine with a GPU (e.g. NVIDIA T4, L4).\\n\\nExam tip: \\\"GPU\\\" + \\\"XGBoost\\\" → faster training.\\nDo not confuse with: more interpretability, worse accuracy, or avoiding overfitting: the GPU only changes speed.\",\"explanationSource\":\"card-en\"},{\"id\":\"51\",\"question\":\"In TensorFlow, what does the model.fit() method do?\",\"options\":{\"A\":\"Compiles the model\",\"B\":\"Evaluates the model\",\"C\":\"Trains the model\",\"D\":\"Saves the model\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. It trains the model: it iterates over the data in batches and epochs, computes the loss, and updates the weights with the optimizer.\\n\\nHow it works:\\n• model.fit(x, y, epochs=10, batch_size=32, validation_data=(xv, yv), callbacks=[...]).\\n• It returns a History object with loss and metrics per epoch.\\n• You must have called model.compile() first.\\n\\nExam tip: \\\"train\\\" → fit.\\nDo not confuse with: compile (configures optimizer, loss, and metrics), evaluate (measures on test data), or save (writes to disk).\",\"explanationSource\":\"card-en\"},{\"id\":\"52\",\"question\":\"Which TensorFlow function is used to compile a model before training?\",\"options\":{\"A\":\"model.summary()\",\"B\":\"model.evaluate()\",\"C\":\"model.compile()\",\"D\":\"model.predict()\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. model.compile().\\n\\nHow it works:\\n• model.compile(optimizer='adam', loss='sparse_categorical_crossentropy', metrics=['accuracy']).\\n• It does not train or touch the data; it only prepares the model for fit.\\n• You can call it again to change optimizer or loss (e.g. in fine-tuning).\\n\\nExam tip: \\\"configure optimizer, loss, and metrics\\\".\\nDo not confuse with: summary (shows the architecture), evaluate (measures performance), or predict (generates predictions).\",\"explanationSource\":\"card-en\"},{\"id\":\"53\",\"question\":\"Why is hyperparameter tuning critical in ML model development?\",\"options\":{\"A\":\"It eliminates the need for validation data\",\"B\":\"It improves code readability\",\"C\":\"It optimizes model performance\",\"D\":\"It helps collect more data\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Because choosing hyperparameters well (learning rate, depth, regularization, batch size…) can improve model performance a lot.\\n\\nHow it works:\\n• You try combinations and compare a metric on the validation set.\\n• Methods: grid search, random search, Bayesian optimization.\\n• Always with validation data separate from test so you do not overfit the selection.\\n\\nExam tip: \\\"optimize model performance\\\".\\nDo not confuse with: eliminating the need for validation (the opposite; it needs it), improving code readability, or collecting more data.\",\"explanationSource\":\"card-en\"},{\"id\":\"54\",\"question\":\"What is the primary role of cross-validation in ML?\",\"options\":{\"A\":\"Increases training speed\",\"B\":\"Prevents data leakage\",\"C\":\"Provides better evaluation by using multiple data splits\",\"D\":\"Enhances feature extraction\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. To give a more reliable evaluation of the model by training and testing it on several different partitions of the data.\\n\\nHow it works:\\n• k-fold: you split the data into k parts; you train k times leaving a different part for validation.\\n• You average the metric; its deviation indicates model stability.\\n• Very useful on small datasets, where a single split is not representative.\\n\\nExam tip: \\\"robust evaluation\\\", \\\"multiple splits\\\", \\\"model stability\\\".\\nDo not confuse with: speeding up training (it makes it k times slower), preventing data leakage (it does not by itself), or extracting features.\",\"explanationSource\":\"card-en\"},{\"id\":\"55\",\"question\":\"Which of the following is NOT a hyperparameter in XGBoost?\",\"options\":{\"A\":\"max_depth\",\"B\":\"learning_rate\",\"C\":\"subsample\",\"D\":\"weight_decay\"},\"correct\":\"D\",\"explanation\":\"Correct answer: D. weight_decay, which is a neural-network optimizer concept (e.g. AdamW), not an XGBoost parameter.\\n\\nHow it works:\\n• The equivalent regularization in XGBoost is lambda (L2) and alpha (L1) on the leaf weights.\\n• max_depth, learning_rate (eta), and subsample are native hyperparameters.\\n\\nExam tip: \\\"NOT from XGBoost\\\" → the neural-network term.\\nDo not confuse with: lambda/reg_lambda, which does exist in XGBoost and plays a similar role.\",\"explanationSource\":\"card-en\"},{\"id\":\"56\",\"question\":\"Which practice ensures the integrity of data during transmission to BigQuery?\",\"options\":{\"A\":\"Disabling encryption\",\"B\":\"Base64 encoding\",\"C\":\"TLS encryption\",\"D\":\"Delayed replication\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. TLS encryption in transit, which prevents data from being intercepted or altered during transmission.\\n\\nHow it works:\\n• Google Cloud APIs (including BigQuery) only accept HTTPS/TLS connections.\\n• TLS encrypts and also verifies integrity (detects tampering).\\n• Inside Google's network there is also encryption in transit by default.\\n\\nExam tip: \\\"in transit\\\", \\\"interception\\\", \\\"tampering\\\".\\nDo not confuse with: disabling encryption (the opposite), Base64 (encoding, not encryption; anyone can reverse it), or delayed replication (protects nothing).\",\"explanationSource\":\"card-en\"},{\"id\":\"57\",\"question\":\"To automate a data pipeline that runs every 24 hours, which tool is most suitable?\",\"options\":{\"A\":\"Cloud Scheduler\",\"B\":\"Cloud Functions\",\"C\":\"BigQuery ML\",\"D\":\"Cloud Spanner\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Cloud Scheduler: managed cron that fires a job at a fixed time.\\n\\nHow it works:\\n• You define a cron expression (e.g. '0 2 * * *' = every day at 2:00) and a time zone.\\n• Destination: HTTP endpoint (e.g. launch a Dataflow Flex Template or a PipelineJob), Pub/Sub topic, or App Engine.\\n• Configurable retries.\\n\\nExam tip: \\\"every day\\\", \\\"at a fixed time\\\", \\\"time-based\\\".\\nDo not confuse with: Cloud Functions (now Cloud Run functions; they run code but do not schedule by themselves), BigQuery ML (models), or Spanner (database).\",\"explanationSource\":\"card-en\"},{\"id\":\"58\",\"question\":\"You are validating a dataset for training. Which metric is least useful for checking class imbalance?\",\"options\":{\"A\":\"Mean\",\"B\":\"Distribution plot\",\"C\":\"Frequency counts\",\"D\":\"Standard deviation\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. The mean of the features: it does not say how many examples there are of each class. To see imbalance you use per-class frequency counts or a distribution plot.\\n\\nHow it works:\\n• Frequencies: SELECT label, COUNT(*) ... GROUP BY label.\\n• Bar chart or histogram of the label.\\n• If one class is less than 10% of the total, consider imbalance techniques.\\n\\nExam tip: \\\"least useful for imbalance\\\" → a central-tendency statistic.\\nDo not confuse with: distribution plot and frequency counts, which show imbalance directly.\",\"explanationSource\":\"card-en\"},{\"id\":\"59\",\"question\":\"In Dataflow, what is a side input?\",\"options\":{\"A\":\"An error message\",\"B\":\"An auxiliary input to a DoFn\",\"C\":\"The pipeline output\",\"D\":\"A BigQuery result\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. An extra auxiliary input passed to a DoFn (inside a ParDo), besides the main PCollection, typically for lookups or configuration.\\n\\nHow it works:\\n• It is created from another PCollection (View.asMap, asList, asSingleton) and broadcast to all workers.\\n• Each element of the main stream can query it (e.g. code table → names).\\n• It should be relatively small; for data that changes it is refreshed periodically.\\n\\nExam tip: \\\"auxiliary data\\\", \\\"lookup\\\", \\\"enrich with a small table\\\".\\nDo not confuse with: an error message, the pipeline output, or a BigQuery result.\",\"explanationSource\":\"card-en\"},{\"id\":\"60\",\"question\":\"Which service allows you to create reusable templates of your Dataflow jobs?\",\"options\":{\"A\":\"Cloud Functions\",\"B\":\"Cloud Composer\",\"C\":\"Dataflow Flex Templates\",\"D\":\"Vertex AI Pipelines\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Dataflow Flex Templates: they package the pipeline as a container image plus a spec file, and are launched with parameters.\\n\\nHow it works:\\n• The image goes to Artifact Registry and the template spec (JSON) to Cloud Storage.\\n• They are launched from the console, gcloud, the API, Cloud Scheduler, or Composer without a development environment.\\n• The pipeline graph is built at launch time, so parameters can change its structure.\\n\\nExam tip: \\\"reusable\\\", \\\"parameterizable\\\", \\\"launch without code\\\".\\nDo not confuse with: Cloud Functions (code on events), Cloud Composer (orchestrates, does not package Dataflow jobs), or Vertex AI Pipelines (ML workflows).\",\"explanationSource\":\"card-en\"},{\"id\":\"61\",\"question\":\"Which method is best for partitioning time-series data in BigQuery?\",\"options\":{\"A\":\"Sharding\",\"B\":\"Clustering on NULL\",\"C\":\"Time-based partitioning\",\"D\":\"Using random suffixes\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Partition the table by time (a DATE/TIMESTAMP column or ingestion time), so each query reads only the partitions in the filtered range.\\n\\nHow it works:\\n• PARTITION BY DATE(event_ts) in the DDL.\\n• A WHERE filter on the partition column does partition pruning: fewer bytes, lower cost.\\n• You can add partition expiration to delete old data automatically.\\n\\nExam tip: \\\"filter by date\\\", \\\"time series\\\", \\\"reduce bytes scanned\\\".\\nDo not confuse with: sharding (per-date tables like events_20250101, discouraged), clustering on NULL (makes no sense), or random suffixes (no pruning).\",\"explanationSource\":\"card-en\"},{\"id\":\"62\",\"question\":\"How can you ensure that sensitive information is not exposed in BigQuery datasets?\",\"options\":{\"A\":\"Assign IAM roles to “allUsers”\",\"B\":\"Disable logging\",\"C\":\"Use column-level security and data masking\",\"D\":\"Store data in external tables only\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. With column-level security (policy tags) and dynamic data masking.\\n\\nHow it works:\\n• You create a policy-tag taxonomy (e.g. \\\"PII\\\") and assign it to the sensitive columns.\\n• Only someone with Fine-Grained Reader on the tag sees the real value.\\n• With masking rules, other users see the masked value (hash, NULL, default) instead of an error.\\n\\nExam tip: \\\"protect sensitive columns\\\", \\\"PII\\\", \\\"mask\\\".\\nDo not confuse with: granting roles to allUsers (makes the data public), disabling logging (removes audit), or using only external tables (protects nothing).\",\"explanationSource\":\"card-en\"},{\"id\":\"63\",\"question\":\"What format is recommended for storing data in Cloud Storage to optimize performance in BigQuery?\",\"options\":{\"A\":\"CSV\",\"B\":\"JSON\",\"C\":\"Avro\",\"D\":\"Plain text\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Avro: a compressed binary format with the schema embedded, which BigQuery can read in parallel even when it is compressed.\\n\\nHow it works:\\n• The schema travels in the file, so there is no type inference.\\n• Compressed blocks are read in parallel; a gzip-compressed CSV or JSON is not.\\n• Parquet and ORC (columnar) are also good options.\\n\\nExam tip: \\\"fastest format to load\\\", \\\"self-describing schema\\\".\\nDo not confuse with: CSV and JSON (text, no types, slower and more fragile) or plain text.\",\"explanationSource\":\"card-en\"},{\"id\":\"64\",\"question\":\"Which of the following is NOT a responsibility of Cloud Dataflow?\",\"options\":{\"A\":\"Job orchestration\",\"B\":\"Stream and batch processing\",\"C\":\"Automatic scaling\",\"D\":\"Windowed aggregation\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. Job orchestration. Dataflow runs the processing; coordinating several jobs and their dependencies is done by an orchestrator such as Cloud Composer.\\n\\nHow it works:\\n• Dataflow: batch and streaming processing, worker autoscaling, and windows.\\n• Cloud Composer (Airflow): DAGs that launch Dataflow, BigQuery, Dataproc, etc. in order, with retries.\\n\\nExam tip: \\\"NOT a Dataflow responsibility\\\" → orchestration.\\nDo not confuse with: stream/batch processing, autoscaling, and windowed aggregation, which are core Dataflow functions.\",\"explanationSource\":\"card-en\"},{\"id\":\"65\",\"question\":\"Which of the following is a required component in a CREATE MODEL statement?\",\"options\":{\"A\":\"MODEL_TARGET\",\"B\":\"MODEL_INPUT\",\"C\":\"MODEL_TYPE\",\"D\":\"TARGET_FEATURE\"},\"correct\":\"C\",\"explanation\":\"The MODEL_TYPE must be specified in the OPTIONS clause of a CREATE MODEL statement to determine the kind of model being trained.\"},{\"id\":\"66\",\"question\":\"Which clause is used to specify the column that the model should learn to predict?\",\"options\":{\"A\":\"TARGET_COLUMN\",\"B\":\"LABEL_COLUMN\",\"C\":\"PREDICT_COLUMN\",\"D\":\"OUTPUT_COLUMN\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. With the option INPUT_LABEL_COLS=['column'] in OPTIONS, or by naming the column 'label' in the SELECT (the quiz calls this LABEL_COLUMN).\\n\\nHow it works:\\n• OPTIONS(MODEL_TYPE='LINEAR_REG', INPUT_LABEL_COLS=['price']).\\n• If omitted, BigQuery ML looks for a column named label.\\n• The other SELECT columns are used as features.\\n\\nExam tip: the option that names the label column.\\nDo not confuse with: TARGET_COLUMN, PREDICT_COLUMN, or OUTPUT_COLUMN, which do not exist.\",\"explanationSource\":\"card-en\"},{\"id\":\"67\",\"question\":\"What is the default data split used by BigQuery ML if no split is defined?\",\"options\":{\"A\":\"50% training / 50% evaluation\",\"B\":\"80% training / 20% evaluation\",\"C\":\"90% training / 10% evaluation\",\"D\":\"70% training / 30% evaluation\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. It uses DATA_SPLIT_METHOD='AUTO_SPLIT', which depends on the number of rows. For medium sizes that is about 80% training / 20% evaluation.\\n\\nHow it works:\\n• Fewer than 500 rows: no split; everything is used to train.\\n• Between 500 and 50,000 rows: 20% random for evaluation.\\n• More than 50,000 rows: it holds out about 10,000 rows for evaluation.\\n\\nExam tip: \\\"default split\\\" → 80/20 among the options.\\nDo not confuse with: 50/50, 90/10, or 70/30, which are not the default behavior.\",\"explanationSource\":\"card-en\"},{\"id\":\"68\",\"question\":\"You trained a model and want to understand which features contributed most to the predictions. Which function do you use?\",\"options\":{\"A\":\"ML.PREDICT_EXPLAIN\",\"B\":\"ML.FEATURE_IMPORTANCE\",\"C\":\"ML.EXPLAIN_PREDICT\",\"D\":\"ML.WEIGHTS\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. ML.EXPLAIN_PREDICT, which returns the prediction together with each feature's attributions (Shapley-style values) for each row.\\n\\nHow it works:\\n• SELECT * FROM ML.EXPLAIN_PREDICT(MODEL m, (SELECT ...), STRUCT(3 AS top_k_features)).\\n• It returns top_feature_attributions, baseline_prediction_value, and prediction_value.\\n• Available for linear, tree, DNN, tabular AutoML, ARIMA_PLUS (with its forecast variant) models, etc.\\n\\nExam tip: \\\"why this prediction\\\", \\\"per-row feature contribution\\\".\\nDo not confuse with: ML.PREDICT_EXPLAIN (does not exist), ML.WEIGHTS (linear-model coefficients), or ML.FEATURE_IMPORTANCE (global importance on tree models).\",\"explanationSource\":\"card-en\"},{\"id\":\"69\",\"question\":\"Which model supports time-series forecasting with external regressors in BigQuery ML?\",\"options\":{\"A\":\"linear_reg\",\"B\":\"arima_plus\",\"C\":\"logistic_reg\",\"D\":\"boosted_tree_regressor\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. ARIMA_PLUS_XREG, the ARIMA_PLUS variant with external regressors (the quiz simply calls it arima_plus).\\n\\nHow it works:\\n• MODEL_TYPE='ARIMA_PLUS_XREG' with TIME_SERIES_TIMESTAMP_COL and TIME_SERIES_DATA_COL; the other columns are regressors.\\n• To forecast, ML.FORECAST needs the future values of those regressors.\\n• It keeps the trend, seasonality, and holiday decomposition.\\n\\nExam tip: \\\"time series\\\" + \\\"external features / covariates\\\".\\nDo not confuse with: linear_reg and boosted_tree_regressor (they do not model temporal seasonality by themselves), logistic_reg (classification).\",\"explanationSource\":\"card-en\"},{\"id\":\"70\",\"question\":\"What evaluation metric is typically used for regression models in BigQuery ML?\",\"options\":{\"A\":\"Precision\",\"B\":\"RMSE (Root Mean Squared Error)\",\"C\":\"AUC\",\"D\":\"F1 Score\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. RMSE (Root Mean Squared Error), along with MAE and R²; ML.EVALUATE returns these metrics for regression.\\n\\nHow it works:\\n• RMSE = square root of the mean of squared errors; same unit as the label.\\n• ML.EVALUATE for regression returns mean_absolute_error, mean_squared_error, mean_squared_log_error, median_absolute_error, r2_score, and explained_variance (RMSE = sqrt of mean_squared_error).\\n\\nExam tip: 'regression', 'continuous numeric value'.\\nDo not confuse with: precision, AUC, and F1 Score, which are classification metrics.\",\"explanationSource\":\"card-en\"},{\"id\":\"71\",\"question\":\"How can you schedule model retraining in BigQuery ML?\",\"options\":{\"A\":\"By using RETRAIN MODEL\",\"B\":\"With a BigQuery scheduled query\",\"C\":\"Using AutoML pipelines\",\"D\":\"By enabling real-time mode\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. With a BigQuery scheduled query that runs CREATE OR REPLACE MODEL on the updated data at the frequency you choose.\\n\\nHow it works:\\n• The scheduled query (BigQuery Data Transfer Service) is set daily, weekly, etc.\\n• CREATE OR REPLACE MODEL retrains and replaces the model with the new data.\\n• Alternatives for more complex flows: Vertex AI Pipelines (BigQuery ML components), Dataform, or Cloud Composer.\\n\\nExam tip: 'retrain in BigQuery ML periodically with SQL'.\\nDo not confuse with: RETRAIN MODEL (does not exist), AutoML pipelines (not the BigQuery ML mechanism), or a 'real-time mode' (does not exist).\",\"explanationSource\":\"card-en\"},{\"id\":\"72\",\"question\":\"What is a limitation of BigQuery ML’s kmeans clustering?\",\"options\":{\"A\":\"Cannot process more than 10 rows\",\"B\":\"Only works with categorical features\",\"C\":\"Requires numeric input features\",\"D\":\"Only works for time-series data\"},\"correct\":\"C\",\"explanation\":\"No option is strictly correct. BigQuery ML k-means acepta features categóricas (one-hot automático), así que C es falsa y las otras opciones también; la explicación original no corresponde a la pregunta. The marked option (C) is a documented misconception, so this question is excluded from graded practice.\",\"disputed\":true},{\"id\":\"73\",\"question\":\"You want to ensure that your model generalizes well. What should you apply?\",\"options\":{\"A\":\"Oversampling\",\"B\":\"Normalization\",\"C\":\"Cross-validation\",\"D\":\"Batch prediction\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Cross-validation: you evaluate the model on several validation partitions, which shows whether performance holds on data it did not see while training.\\n\\nHow it works:\\n• k-fold: k trainings, each validated on a different slice.\\n• Stable performance across folds indicates good generalization; large swing indicates overfitting or too little data.\\n• It also lets you pick hyperparameters without touching the test set.\\n\\nExam tip: 'generalize', 'unseen data'.\\nDo not confuse with: oversampling (treats imbalance; done badly it can worsen generalization), normalization (scales features so training works better), or batch prediction (serving).\",\"explanationSource\":\"card-en\"},{\"id\":\"74\",\"question\":\"In the CI/CD context, what is \\\"model validation\\\"?\",\"options\":{\"A\":\"Checking if a model fits in memory\",\"B\":\"Ensuring the model training code has no syntax errors\",\"C\":\"Testing model performance before deployment\",\"D\":\"Verifying data schema\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. In ML CI/CD, model validation is the gate that evaluates a newly trained model on held-out data and checks it against thresholds or the current production model (accuracy, fairness, latency) before deployment. Only models that pass are promoted.\\n\\nWhy not the others: A) memory fit is an infrastructure concern. B) syntax checks are code CI and unit tests. D) schema checks are data validation, a different step earlier in the pipeline.\",\"explanationSource\":\"written\"},{\"id\":\"75\",\"question\":\"You deployed a model to an endpoint and want to split traffic 80/20 between a new ersion and the old version. What should you configure?\",\"options\":{\"A\":\"AutoML settings\",\"B\":\"Endpoint traffic split\",\"C\":\"Batch prediction pipeline\",\"D\":\"Hyperparameter tuning job\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. The endpoint traffic split, with both models deployed on the same endpoint.\\n\\nHow it works:\\n• endpoint.deploy(model=new, traffic_percentage=20) or traffic_split={'old_id': 80, 'new_id': 20}.\\n• You can change the percentages later with no downtime.\\n• Compare metrics of both versions before moving to 100%.\\n\\nExam tip: 'split traffic 80/20', 'A/B', 'canary'.\\nDo not confuse with: AutoML settings (training), a batch prediction pipeline (does not use endpoints), or a hyperparameter tuning job (training).\",\"explanationSource\":\"card-en\"},{\"id\":\"76\",\"question\":\"Which tool helps store metadata and lineage of your ML artifacts in Vertex AI?\",\"options\":{\"A\":\"Cloud Storage\",\"B\":\"TensorBoard\",\"C\":\"ML Metadata Store\",\"D\":\"Model Monitoring\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Vertex ML Metadata (the metadata store), based on ML Metadata (MLMD).\\n\\nHow it works:\\n• It records artifacts (datasets, models, metrics), executions (steps that ran), and contexts (groupings such as an experiment or pipeline run).\\n• Vertex AI Pipelines feeds it automatically.\\n• It lets you answer: which data and code trained this model? (audit and reproducibility).\\n\\nExam tip: 'lineage', 'metadata', 'traceability', 'audit'.\\nDo not confuse with: Cloud Storage (stores files without lineage), TensorBoard (plots training metrics), or Model Monitoring (production).\",\"explanationSource\":\"card-en\"},{\"id\":\"77\",\"question\":\"What is the advantage of using Vertex AI Pipelines with caching enabled?\",\"options\":{\"A\":\"Reduces disk space\",\"B\":\"Avoids data validation\",\"C\":\"Skips unchanged pipeline steps for efficiency\",\"D\":\"Enables parallel processing\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. It skips steps that did not change by reusing their outputs from previous runs, which saves time and cost.\\n\\nHow it works:\\n• The cache key combines the component definition and its inputs.\\n• If they match a previous successful execution, its outputs are reused without running it.\\n• Turn it off with enable_caching=False on the PipelineJob or task.set_caching_options(False) on a step.\\n\\nExam tip: 'do not recompute unchanged steps', 'iterate faster'.\\nDo not confuse with: reducing disk space, skipping data validation, or parallelizing (independent steps already run in parallel without cache).\",\"explanationSource\":\"card-en\"},{\"id\":\"78\",\"question\":\"What is the purpose of containerizing our model before deployment?\",\"options\":{\"A\":\"It makes the model faster\",\"B\":\"Allows you to use AutoML\",\"C\":\"Ensures consistent environments across development and production\",\"D\":\"Enables online learning as\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. A container packages the model with its exact runtime, libraries and serving code. The artifact you tested is identical to the one that runs in production (Vertex AI custom containers, Cloud Run, GKE), so you avoid 'works on my machine' problems.\\n\\nWhy not the others: A) a container does not make inference faster by itself. B) AutoML does not require you to containerize your model. D) online learning is a training design choice, unrelated to packaging.\",\"explanationSource\":\"written\"},{\"id\":\"79\",\"question\":\"Which GCP service allows centralized monitoring of logs, alerts, and metrics for ML workloads?\",\"options\":{\"A\":\"Cloud Build\",\"B\":\"Cloud Logging\",\"C\":\"BigQuery\",\"D\":\"Cloud Run\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Cloud Logging, part of Google Cloud Observability together with Cloud Monitoring.\\n\\nHow it works:\\n• It collects logs from Vertex AI (training jobs, endpoints), GKE, Cloud Run, Dataflow, etc.\\n• Log-based metrics turn log patterns into metrics you can alert on.\\n• Sinks export logs to BigQuery, Cloud Storage, or Pub/Sub; Log Analytics lets you query them with SQL.\\n\\nExam tip: 'centralize logs', 'monitor ML workloads'.\\nDo not confuse with: Cloud Build (CI/CD), BigQuery (warehouse), or Cloud Run (run containers).\",\"explanationSource\":\"card-en\"},{\"id\":\"80\",\"question\":\"You want to enable rollback in case a newly deployed model version fails. What feature can help with this?\",\"options\":{\"A\":\"AutoML\",\"B\":\"Traffic splitting with versioning\",\"C\":\"Real-time explainability\",\"D\":\"Data Labeling Service\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Traffic splitting with versioning: you keep the previous version deployed on the endpoint and, if the new one fails, you send 100% of traffic back to the old one.\\n\\nHow it works:\\n• Versions live in Model Registry; both are deployed on the same endpoint.\\n• Rollback is a traffic-split change, with no redeploy and no downtime.\\n• When the new version is validated, you retire the old one (undeploy).\\n\\nExam tip: 'rollback', 'return to the previous version quickly'.\\nDo not confuse with: AutoML (training), real-time explainability (explains predictions), or Data Labeling Service (labeling; also discontinued).\",\"explanationSource\":\"card-en\"},{\"id\":\"81\",\"question\":\"What does continuous delivery in MLOps mean?\",\"options\":{\"A\":\"Building a container once a week\",\"B\":\"Monitoring model predictions\",\"C\":\"Automatically deploying validated models into production\",\"D\":\"Creating notebooks for training\"},\"correct\":\"C\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: C. Continuous delivery in MLOps means models that pass automated validation are automatically packaged and deployed (or made ready to deploy) to production, often through a model registry and gradual traffic split, with no manual hand-offs.\\n\\nWhy not the others: A) a weekly container build is just scheduling. B) monitoring is a separate practice (continuous monitoring). D) notebooks are for experimentation, not delivery.\",\"explanationSource\":\"written\"},{\"id\":\"82\",\"question\":\"Which of the following ensures reproducibility in ML pipelines?\",\"options\":{\"A\":\"Logging loss values\",\"B\":\"Using the same hardware\",\"C\":\"Versioning datasets, code, and models\",\"D\":\"Saving training logs\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Version datasets, code, and models (and the environment), so any result can be reconstructed.\\n\\nHow it works:\\n• Code in Git with commits referenced on each run.\\n• Data: snapshots or versions (dated tables, Vertex AI datasets, immutable Cloud Storage paths).\\n• Environment: container images with a fixed tag in Artifact Registry.\\n• Models: versions in Model Registry; lineage in ML Metadata.\\n\\nExam tip: 'reproducibility', 'audit', 'repeat an experiment'.\\nDo not confuse with: logging the loss or saving logs (useful but not enough) or using the same hardware (guarantees nothing without versioned data and code).\",\"explanationSource\":\"card-en\"},{\"id\":\"83\",\"question\":\"A model trained using tf.keras.Sequential() is showing high training accuracy but poor validation accuracy. What is the issue?\",\"options\":{\"A\":\"Underfitting\",\"B\":\"Overfitting\",\"C\":\"Data Leakage\",\"D\":\"Class Imbalance\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Overfitting: the model memorized the training set and does not generalize to new data.\\n\\nHow it works:\\n• At training the error falls; on validation it stalls or rises.\\n• The net is too flexible (too many parameters) relative to the size or noise of the data.\\n• Mitigation: more data, dropout, L1/L2, early stopping, data augmentation, or a simpler architecture.\\n\\nExam tip: 'high train accuracy, low val accuracy' → overfitting.\\nDo not confuse with: underfitting (bad on train and val), data leakage (val too good), or class imbalance (misleading accuracy on both).\",\"explanationSource\":\"card-en\"},{\"id\":\"84\",\"question\":\"What is the impact of using a very small batch size during training?\",\"options\":{\"A\":\"Training will converge faster\",\"B\":\"May lead to noisy gradients and slow convergence\",\"C\":\"Uses more GPU memory\",\"D\":\"Prevents overfitting\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. Gradients are estimated from few samples: they are noisy and convergence is usually slower and less stable.\\n\\nHow it works:\\n• Each update uses an average of few examples; the descent direction varies a lot between steps.\\n• You need more steps to cover the dataset, and the learning rate often has to be lowered.\\n• It uses less GPU memory, not more.\\n\\nExam tip: 'very small batch' → noisy gradients, slow convergence.\\nDo not confuse with: converges faster, uses more GPU, or 'prevents overfitting' as the main effect.\",\"explanationSource\":\"card-en\"},{\"id\":\"85\",\"question\":\"Which of the following algorithms is best suited for time series forecasting?\",\"options\":{\"A\":\"Logistic Regression\",\"B\":\"XGBoost\",\"C\":\"LSTM\",\"D\":\"Naive Bayes\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. LSTM (Long Short-Term Memory): a recurrent net that keeps memory across the sequence and captures temporal dependencies.\\n\\nHow it works:\\n• It processes the input step by step (t, t+1, …) and updates a cell state.\\n• The forget/input/output gates decide what to remember and what to forget.\\n• It works for series, text, and any sequential data.\\n\\nExam tip: 'time series forecasting' + classic options → LSTM.\\nDo not confuse with: logistic regression and Naive Bayes (i.i.d. classification) or XGBoost (tabular; you can force it with lags, it is not natively sequential).\",\"explanationSource\":\"card-en\"},{\"id\":\"86\",\"question\":\"In TensorFlow, which method is used to save the model's architecture, weights, and optimizer state?\",\"options\":{\"A\":\"model.predict()\",\"B\":\"model.save()\",\"C\":\"model.fit()\",\"D\":\"model.compile()\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. model.save(): it serializes the full model so you can resume training or serve predictions.\\n\\nHow it works:\\n• Modern format: a path with the .keras extension (Keras v3).\\n• SavedModel (directory, often with saved_model.pb): the serving format on Vertex AI / TF Serving.\\n• Legacy .h5: architecture + weights + optimizer config.\\n\\nExam tip: 'save the whole model, weights and optimizer' → model.save().\\nDo not confuse with: predict() (infers), fit() (trains), or compile() (loss/optimizer/metrics).\",\"explanationSource\":\"card-en\"},{\"id\":\"87\",\"question\":\"What effect does increasing the number of trees (n_estimators) in XGBoost typically have?\",\"options\":{\"A\":\"Reduces model complexity\",\"B\":\"Improves performance but increases risk of overfitting\",\"C\":\"Decreases runtime\",\"D\":\"Reduces variance\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. It usually improves the fit and the training metric, but it raises the overfitting risk if you do not regularize or use early stopping.\\n\\nHow it works:\\n• Each new tree corrects residuals of the previous ones (boosting).\\n• More trees = more capacity; past a point it memorizes noise.\\n• Combine it with a low learning_rate and early_stopping_rounds.\\n\\nExam tip: 'more trees / n_estimators' → better performance + overfitting risk.\\nDo not confuse with: reduces complexity, lowers runtime, or reduces variance (more trees take longer).\",\"explanationSource\":\"card-en\"},{\"id\":\"88\",\"question\":\"Which of the following techniques helps in automatically adjusting the learning rate in TensorFlow based on epoch count?\",\"options\":{\"A\":\"EarlyStopping\",\"B\":\"LearningRateScheduler\",\"C\":\"ModelCheckpoint\",\"D\":\"OptimizerDecay\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. LearningRateScheduler: it receives a schedule(epoch, lr) function and changes the learning rate at the start of each epoch.\\n\\nHow it works:\\n• E.g. schedule = lambda epoch, lr: lr * 0.1 if epoch == 10 else lr.\\n• Useful for step decay, exponential decay, or a warmup defined up front.\\n• Passed in model.fit(..., callbacks=[tf.keras.callbacks.LearningRateScheduler(schedule)]).\\n\\nExam tip: 'adjust lr based on epoch count', 'predefined schedule'.\\nDo not confuse with: EarlyStopping (stops), ModelCheckpoint (saves), or OptimizerDecay (does not exist in Keras).\",\"explanationSource\":\"card-en\"},{\"id\":\"89\",\"question\":\"You are training a TensorFlow model and want to ensure it is compatible with mobile deployment. Which model format should you use?\",\"options\":{\"A\":\".h5\",\"B\":\".pb\",\"C\":\".tflite\",\"D\":\".cSV\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. .tflite (TensorFlow Lite): a compact FlatBuffer, optimized for inference on mobile, IoT, and edge.\\n\\nHow it works:\\n• TFLiteConverter converts a SavedModel or Keras model to .tflite.\\n• Optional: float16 or int8 quantization for less latency and size.\\n• The TFLite interpreter runs on Android, iOS, microcontrollers, and also on a server.\\n\\nExam tip: 'mobile deployment', 'embedded' → .tflite.\\nDo not confuse with: .h5 (Keras), .pb (SavedModel/frozen graph for servers), or .csv (data).\",\"explanationSource\":\"card-en\"},{\"id\":\"90\",\"question\":\"Which optimizer in TensorFlow adapts the learning rate for each parameter individually?\",\"options\":{\"A\":\"SGD\",\"B\":\"Momentum\",\"C\":\"Adam\",\"D\":\"AdaGrad\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Adam: it combines momentum (1st moment of the gradient) with a per-weight adaptive learning rate (2nd moment, like RMSProp).\\n\\nHow it works:\\n• Each parameter has its own effective step based on how 'noisy' or large its gradient is.\\n• Default lr 0.001; it usually converges well with little tuning.\\n• AdaGrad is also per-parameter, but its lr only shrinks and falls short on long trainings.\\n\\nExam tip: 'adapts each parameter's lr' + options SGD/Momentum/Adam/AdaGrad → Adam (the marked answer).\\nDo not confuse with: SGD and Momentum (a single global lr).\",\"explanationSource\":\"card-en\"},{\"id\":\"91\",\"question\":\"What is the purpose of dropout in training a neural network?\",\"options\":{\"A\":\"Increase model complexity\",\"B\":\"Prevent underfitting\",\"C\":\"Reduce the size of input features\",\"D\":\"Reduce overfitting by randomly disabling neurons\"},\"correct\":\"D\",\"explanation\":\"Correct answer: D. It reduces overfitting by randomly turning off a fraction of neurons at each training step, so they do not become codependent.\\n\\nHow it works:\\n• In Keras: Dropout(0.3) between layers; the rate is the probability of turning off.\\n• At inference dropout is disabled and activations are scaled (or inverted dropout is used).\\n• It is equivalent to averaging many subnetworks (an implicit ensemble).\\n\\nExam tip: 'randomly disabling neurons', 'reduce overfitting'.\\nDo not confuse with: increasing complexity, avoiding underfitting, or reducing the number of input features.\",\"explanationSource\":\"card-en\"},{\"id\":\"92\",\"question\":\"To detect data drift in production ML systems, what tool should be used?\",\"options\":{\"A\":\"Vertex AI Model Monitoring\",\"B\":\"BigQuery\",\"C\":\"Dataflow\",\"D\":\"Cloud Scheduler\"},\"correct\":\"A\",\"answerSource\":\"derived-by-audit\",\"explanation\":\"Correct answer: A. Vertex AI Model Monitoring compares production prediction inputs (and feature attributions) with the training baseline or a previous window. It raises alerts on training-serving skew and on drift.\\n\\nWhy not the others: B) BigQuery can store prediction logs, but it does not detect drift by itself. C) Dataflow is a processing engine. D) Cloud Scheduler only triggers jobs.\\n\\n2026 note: in current docs Vertex AI appears as Gemini Enterprise Agent Platform; the monitoring concept is the same.\",\"explanationSource\":\"written\"},{\"id\":\"93\",\"question\":\"How can you efficiently load large, historical datasets into BigQuery?\",\"options\":{\"A\":\"Streaming insert\",\"B\":\"Web UI upload\",\"C\":\"Batch load using GCS files\",\"D\":\"Appending row-by-row via API\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. With a batch load job from files in Cloud Storage (bq load or LOAD DATA), not with streaming or single-row inserts.\\n\\nHow it works:\\n• You upload Avro/Parquet/ORC/CSV/JSON to a bucket and launch the job; BigQuery reads in parallel.\\n• Batch load is not billed (you pay only the resulting storage).\\n• For terabyte-scale history this is the recommended path.\\n\\nExam tip: 'large historical datasets' → batch load from GCS.\\nDo not confuse with: streaming insert (expensive, real time), UI upload (size limits), or row-by-row API (slow).\",\"explanationSource\":\"card-en\"},{\"id\":\"94\",\"question\":\"You're processing streaming user interaction data and need to group it into 5- minute intervals. What Dataflow feature helps?\",\"options\":{\"A\":\"Global Window\",\"B\":\"Fixed Window\",\"C\":\"Side Input\",\"D\":\"Sliding Window\"},\"correct\":\"B\",\"explanation\":\"Fixed Windows divide the stream into non- overlapping, equal-sized intervals (e.g., every 5 minutes), which is ideal for grouped analysis.\"},{\"id\":\"95\",\"question\":\"You want to optimize query performance on a non-partitioned BigQuery table with repetitive filtering on region and product. hat should you do?\",\"options\":{\"A\":\"Convert to JSON format\",\"B\":\"Add sharding\",\"C\":\"Enable clustering on region and product\",\"D\":\"Increase table size\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Add clustering on those columns: CLUSTER BY region, product. BigQuery groups similar rows into the same blocks and can skip blocks (block pruning).\\n\\nHow it works:\\n• Up to 4 clustering columns, from most to least frequent filter.\\n• Works on partitioned and unpartitioned tables (especially if \u003e64 MB).\\n• Reduces bytes scanned and cost on repeated queries with those filters.\\n\\nExam tip: 'non-partitioned' + 'repeated filter on columns' → clustering.\\nDo not confuse with: convert to JSON, sharding, or 'increase the size' (that worsens the scan).\",\"explanationSource\":\"card-en\"},{\"id\":\"96\",\"question\":\"Your Dataflow job reads from Pub/Sub, processes the data, and writes to Cloud Storage. What is the correct output mode for streaming?\",\"options\":{\"A\":\"Append mode\",\"B\":\"Batch mode\",\"C\":\"Streaming mode with windowed writes\",\"D\":\"Replace mode\"},\"correct\":\"C\",\"explanation\":\"When writing streaming data to Cloud Storage, using windowed writes allows output files to be generated for each time window.\"},{\"id\":\"97\",\"question\":\"To enforce consistent feature distribution between training and serving, what should ou use?\",\"options\":{\"A\":\"Batch predictions\",\"B\":\"Feature Store\",\"C\":\"Hyperparameter tuning\",\"D\":\"Data Labeling Service\"},\"correct\":\"B\",\"explanation\":\"A Feature Store ensures consistency by serving the same preprocessed features to both training and prediction pipelines.\"},{\"id\":\"98\",\"question\":\"Which Cloud Dataflow concept controls when the results of a windowed computation are emitted?\",\"options\":{\"A\":\"Aggregators\",\"B\":\"Checkpoints\",\"C\":\"Triggers\",\"D\":\"Pipelines\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. Triggers: they define at which moment (watermark, processing time, count, or a composition) a pane fires and the window aggregate is emitted.\\n\\nHow it works:\\n• Default: AfterWatermark (when the watermark passes the end of the window).\\n• Early firings: speculative results before completion.\\n• Late firings: recompute if late data arrives (allowed lateness).\\n\\nExam tip: 'when windowed results are emitted' → Triggers.\\nDo not confuse with: Aggregators (accumulators), Checkpoints (state/recovery), or Pipelines (the whole job).\",\"explanationSource\":\"card-en\"},{\"id\":\"99\",\"question\":\"Your data pipeline must join a large streaming dataset with a small static reference dataset. What should you use?\",\"options\":{\"A\":\"Side input\",\"B\":\"GroupByKey\",\"C\":\"Global window\",\"D\":\"Streaming SQL\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. A side input: the small table is materialized as a View (asMap/asList/asSingleton) and broadcast to every worker to enrich each stream element.\\n\\nHow it works:\\n• The main PCollection is the stream; the side input is looked up in the DoFn (e.g. code → country).\\n• It must fit in memory reasonably; if it grows, you shard it or refresh it by windows.\\n• Avoids an expensive shuffle join against the stream.\\n\\nExam tip: 'large streaming + small static reference' → side input.\\nDo not confuse with: GroupByKey (groups by key, not broadcast), Global window, or Streaming SQL.\",\"explanationSource\":\"card-en\"},{\"id\":\"100\",\"question\":\"To ensure that BigQuery table rows are unique during data load, what strategy should you use?\",\"options\":{\"A\":\"Use CSV format\",\"B\":\"Partition by hash\",\"C\":\"Deduplicate upstream\",\"D\":\"Set max_results in queries\"},\"correct\":\"C\",\"explanation\":\"BigQuery doesn’t enforce uniqueness on its own, so you must deduplicate data during ingestion or use MERGE to remove duplicates.\"},{\"id\":\"101\",\"question\":\"Which SQL function in BigQuery ML helps you assess precision, recall, and F1 score?\",\"options\":{\"A\":\"ML.EVALUATE\",\"B\":\"MLVALIDATE\",\"C\":\"ML.SCORE\",\"D\":\"ML.CLASSIFY\"},\"correct\":\"A\",\"explanation\":\"Correct answer: A. ML.EVALUATE: it returns the model's evaluation metrics (accuracy, precision, recall, f1_score, log_loss, roc_auc in classification).\\n\\nHow it works:\\n• SELECT * FROM ML.EVALUATE(MODEL `ds.model`); uses the training holdout.\\n• Or ML.EVALUATE(MODEL m, (SELECT ...), STRUCT(0.4 AS threshold)) for another set or threshold.\\n• MLVALIDATE, ML.SCORE, and ML.CLASSIFY do not exist.\\n\\nExam tip: 'precision, recall, F1' + BigQuery ML → ML.EVALUATE.\\nDo not confuse with: ML.PREDICT (predictions) or ML.CONFUSION_MATRIX (counts per class).\",\"explanationSource\":\"card-en\"},{\"id\":\"102\",\"question\":\"You want to predict numeric housing prices. Which model is appropriate?\",\"options\":{\"A\":\"logistic_reg\",\"B\":\"kmeans\",\"C\":\"linear_reg\",\"D\":\"arima_plus\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. LINEAR_REG: supervised regression for a continuous target (price, demand, temperature).\\n\\nHow it works:\\n• OPTIONS(MODEL_TYPE='LINEAR_REG', INPUT_LABEL_COLS=['price']).\\n• The label must be numeric (no infinities or NaN).\\n• Stronger alternatives: BOOSTED_TREE_REGRESSOR, DNN_REGRESSOR, AUTOML_REGRESSOR.\\n\\nExam tip: 'numeric housing prices', 'continuous target' → linear_reg.\\nDo not confuse with: logistic_reg (classes), kmeans (no label), or arima_plus (time series).\",\"explanationSource\":\"card-en\"},{\"id\":\"103\",\"question\":\"You are using matrix_factorization in BigQuery ML. What is the required format?\",\"options\":{\"A\":\"Wide table with separate columns per item\",\"B\":\"Time-series data\",\"C\":\"Three-column table (user, item, rating)\",\"D\":\"A cluster with all features\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. A tall table of three columns: user, item, and rating (or interaction intensity), not a wide user×item matrix.\\n\\nHow it works:\\n• OPTIONS(MODEL_TYPE='MATRIX_FACTORIZATION', USER_COL='user_id', ITEM_COL='item_id', RATING_COL='rating').\\n• Each row is an observed interaction.\\n• FEEDBACK_TYPE='EXPLICIT' (stars) or 'IMPLICIT' (clicks/purchases).\\n\\nExam tip: 'three-column table (user, item, rating)', 'tall format'.\\nDo not confuse with: a wide table (one column per item), time-series, or a feature cluster.\",\"explanationSource\":\"card-en\"},{\"id\":\"104\",\"question\":\"Which clause defines the maximum number of clusters in kmeans?\",\"options\":{\"A\":\"OPTIONS(MAX_ITERATIONS-...)\",\"B\":\"OPTIONS(MAX CLUSTERS.-...\",\"C\":\"OPTIONS(NUM _CLUSTERS.-...\",\"D\":\"OPTIONS(CENTER COUNT-...\"},\"correct\":\"C\",\"explanation\":\"Correct answer: C. NUM_CLUSTERS: OPTIONS(MODEL_TYPE='KMEANS', NUM_CLUSTERS=8). It is an INT64 between 2 and 100 (or a range if you do hyperparameter tuning).\\n\\nHow it works:\\n• If you omit it, the default is about log10(n) based on the number of rows.\\n• MAX_ITERATIONS limits algorithm passes, not k.\\n• With NUM_TRIALS you can tune NUM_CLUSTERS = HPARAM_RANGE(2, 25).\\n\\nExam tip: 'number of clusters' → NUM_CLUSTERS, not MAX_ITERATIONS or invented names.\\nDo not confuse with: MAX_CLUSTERS or CENTER_COUNT, which do not exist.\",\"explanationSource\":\"card-en\"},{\"id\":\"105\",\"question\":\"What is the maximum dataset size BigQuery ML can handle?\",\"options\":{\"A\":\"10 GB\",\"B\":\"No practical limit — it uses BigQuery’s scaling\",\"C\":\"50 million rows\",\"D\":\"500,000 rows only\"},\"correct\":\"B\",\"explanation\":\"Correct answer: B. There is no 50-million-row cap. BigQuery ML scales with BigQuery's infrastructure; the real limit is usually model size (~90 MB) and quotas, not a row cap.\\n\\nHow it works:\\n• CREATE MODEL reads the table in the warehouse; you do not export to a VM.\\n• The automatic split changes at 500 and 50,000 rows (holdout), not at 50 million.\\n• Cardinality of categorical features: on the order of 5–10 million distinct values.\\n\\nExam tip: 'maximum dataset size' → no practical limit / BigQuery scaling.\\nDo not confuse with: 10 GB, 50 million rows, or 500,000 rows, which are not documented limits.\",\"explanationSource\":\"card-en\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
