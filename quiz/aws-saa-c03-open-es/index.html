oudcertprep (https://github.com/nastaso/cloudcertprep), licencia MIT. Adaptadas al formato de este sitio. Traduccion automatica; revisar antes de publicar.\",\"license\":\"MIT\",\"questions\":[{\"id\":\"saa-d1-001\",\"question\":\"Una empresa quiere garantizar que los datos almacenados en Amazon S3 estén cifrados en reposo utilizando claves administradas completamente por AWS, sin configuración de claves administradas por el cliente, sin políticas de acceso por clave y sin registro de auditoría de AWS KMS. ¿Qué opción de cifrado deberían usar?\",\"options\":{\"A\":\"SSE-S3\",\"B\":\"SSE-KMS\",\"C\":\"SSE-C\",\"D\":\"Cifrado del lado del cliente\"},\"correct\":\"A\",\"explanation\":\"SSE-S3 utiliza claves administradas por Amazon S3 (AES-256) sin participación del cliente, sin políticas por clave y sin registro de auditoría de KMS.\\nSSE-KMS utiliza claves de AWS KMS (administradas por AWS o administradas por el cliente) y agrega políticas de acceso de KMS e integración con CloudTrail, lo cual es más de lo que solicita el requisito. SSE-C requiere que el cliente proporcione y administre sus propias claves en cada solicitud. El cifrado del lado del cliente ocurre antes de la carga y es completamente administrado por el cliente.\"},{\"id\":\"saa-d1-002\",\"question\":\"¿Qué servicio de AWS proporciona un módulo de seguridad de hardware (HSM) administrado para el almacenamiento de claves criptográficas?\",\"options\":{\"A\":\"AWS KMS\",\"B\":\"AWS CloudHSM\",\"C\":\"AWS Secrets Manager\",\"D\":\"AWS Certificate Manager\"},\"correct\":\"B\",\"explanation\":\"AWS CloudHSM proporciona instancias de HSM dedicadas. KMS es un servicio de claves administrado pero utiliza infraestructura compartida. Secrets Manager almacena secretos, no claves de HSM. ACM administra certificados SSL/TLS.\"},{\"id\":\"saa-d1-003\",\"question\":\"Un arquitecto de soluciones necesita restringir el acceso a un bucket de S3 para que solo un rol de IAM específico pueda acceder a él. ¿Qué debería configurar?\",\"options\":{\"A\":\"S3 ACL\",\"B\":\"Política de bucket de S3 con un elemento Condition\",\"C\":\"S3 Object Lock\",\"D\":\"S3 Versioning\"},\"correct\":\"B\",\"explanation\":\"Una política de bucket con un elemento Condition puede restringir el acceso a un ARN de rol de IAM específico. Las ACL son heredadas y menos precisas. Object Lock evita la eliminación. Versioning conserva las versiones de los objetos.\"},{\"id\":\"saa-d1-004\",\"question\":\"¿Qué característica de Amazon VPC le permite monitorear el tráfico de red que fluye hacia y desde las interfaces de red?\",\"options\":{\"A\":\"VPC Peering\",\"B\":\"VPC Flow Logs\",\"C\":\"NAT Gateway\",\"D\":\"Internet Gateway\"},\"correct\":\"B\",\"explanation\":\"VPC Flow Logs captura información sobre el tráfico IP que va hacia y desde las interfaces de red en una VPC. VPC Peering conecta VPC. NAT Gateway permite la salida a internet para subredes privadas. Internet Gateway conecta una VPC a internet.\"},{\"id\":\"saa-d1-005\",\"question\":\"Una empresa requiere que todas las llamadas a la API de los servicios de AWS se registren para cumplimiento. ¿Qué servicio deberían habilitar?\",\"options\":{\"A\":\"Amazon CloudWatch\",\"B\":\"AWS CloudTrail\",\"C\":\"AWS Config\",\"D\":\"Amazon GuardDuty\"},\"correct\":\"B\",\"explanation\":\"AWS CloudTrail registra las llamadas a la API realizadas a los servicios de AWS. CloudWatch monitorea métricas y registros. AWS Config realiza un seguimiento de las configuraciones de recursos. GuardDuty es un servicio de detección de amenazas.\"},{\"id\":\"saa-d2-001\",\"question\":\"Una aplicación web debe permanecer disponible incluso si una Zona de disponibilidad completa falla. ¿Qué patrón de arquitectura logra esto?\",\"options\":{\"A\":\"Implementar en una sola AZ con Auto Scaling\",\"B\":\"Implementar en varias AZ con un Application Load Balancer\",\"C\":\"Implementar en una sola AZ con un tipo de instancia más grande\",\"D\":\"Implementar en una sola Región con CloudFront\"},\"correct\":\"B\",\"explanation\":\"La implementación en varias AZ con un ALB distribuye el tráfico entre las AZ, lo que proporciona resiliencia frente a la falla de una sola AZ. Una implementación en una sola AZ, independientemente del escalado o del tamaño de la instancia, no puede sobrevivir a una interrupción de AZ.\"},{\"id\":\"saa-d2-002\",\"question\":\"¿Qué característica de Amazon RDS proporciona conmutación por error automática a una réplica en espera en una Zona de Disponibilidad diferente?\",\"options\":{\"A\":\"Réplicas de lectura\",\"B\":\"Implementación Multi-AZ\",\"C\":\"Aurora Serverless\",\"D\":\"RDS Proxy\"},\"correct\":\"B\",\"explanation\":\"La implementación Multi-AZ mantiene una réplica en espera sincrónica en una AZ diferente con conmutación por error automática. Las réplicas de lectura son para escalado de lectura, no para conmutación por error automática. Aurora Serverless escala la capacidad automáticamente. RDS Proxy gestiona las conexiones a la base de datos.\"},{\"id\":\"saa-d2-003\",\"question\":\"Una empresa necesita desacoplar los componentes de su aplicación para manejar cargas de procesamiento variables. ¿Qué servicio deberían usar?\",\"options\":{\"A\":\"Amazon SQS\",\"B\":\"Amazon RDS\",\"C\":\"Amazon EC2\",\"D\":\"Amazon S3\"},\"correct\":\"A\",\"explanation\":\"Amazon SQS es un servicio de colas de mensajes totalmente administrado que desacopla los componentes de la aplicación. RDS es un servicio de base de datos. EC2 es un servicio de cómputo. S3 es almacenamiento de objetos.\"},{\"id\":\"saa-d2-004\",\"question\":\"¿Qué clase de almacenamiento de S3 se debe usar para datos a los que se accede menos de una vez por trimestre y que pueden tolerar tiempos de recuperación de 12 horas?\",\"options\":{\"A\":\"S3 Standard\",\"B\":\"S3 Glacier Instant Retrieval\",\"C\":\"S3 Glacier Deep Archive\",\"D\":\"S3 One Zone-IA\"},\"correct\":\"C\",\"explanation\":\"Glacier Deep Archive es la clase de almacenamiento de menor costo, adecuada para datos a los que se accede con poca frecuencia y con tiempos de recuperación de 12 a 48 horas. Glacier Instant Retrieval proporciona acceso en milisegundos. One Zone-IA almacena datos en una sola AZ.\"},{\"id\":\"saa-d2-005\",\"question\":\"Una aplicación usa Amazon DynamoDB y debe poder recuperarse de la eliminación accidental de una tabla. ¿Qué característica se debe habilitar?\",\"options\":{\"A\":\"DynamoDB Streams\",\"B\":\"Recuperación en un punto en el tiempo (PITR)\",\"C\":\"DynamoDB Accelerator (DAX)\",\"D\":\"Tablas globales\"},\"correct\":\"B\",\"explanation\":\"La recuperación en un punto en el tiempo permite copias de seguridad continuas de las tablas de DynamoDB y la restauración a cualquier punto de los últimos 35 días. Streams captura los cambios de las tablas. DAX es una caché en memoria. Las tablas globales proporcionan replicación en varias regiones.\"},{\"id\":\"saa-d3-001\",\"question\":\"Una empresa necesita servir contenido estático a usuarios de todo el mundo con baja latencia. ¿Qué servicio de AWS deberían usar?\",\"options\":{\"A\":\"Amazon EC2\",\"B\":\"Amazon CloudFront\",\"C\":\"AWS Global Accelerator\",\"D\":\"Amazon Route 53\"},\"correct\":\"B\",\"explanation\":\"CloudFront es una CDN que almacena en caché el contenido en ubicaciones de borde en todo el mundo para una entrega de baja latencia. Global Accelerator mejora la disponibilidad y el rendimiento para contenido dinámico. Route 53 es un servicio de DNS. EC2 es un servicio de cómputo.\"},{\"id\":\"saa-d3-002\",\"question\":\"¿Qué servicio se debe usar para ejecutar contenedores sin administrar servidores ni clústeres?\",\"options\":{\"A\":\"Amazon EC2\",\"B\":\"Amazon ECS en EC2\",\"C\":\"AWS Fargate\",\"D\":\"AWS Elastic Beanstalk\"},\"correct\":\"C\",\"explanation\":\"AWS Fargate es un motor de cómputo sin servidor para contenedores que elimina la necesidad de administrar servidores. ECS en EC2 requiere administrar instancias EC2. Elastic Beanstalk es un PaaS para aplicaciones web.\"},{\"id\":\"saa-d3-003\",\"question\":\"Una aplicación requiere una latencia de lectura inferior a un milisegundo para una tabla de DynamoDB. ¿Qué característica debería recomendar un arquitecto de soluciones?\",\"options\":{\"A\":\"DynamoDB Streams\",\"B\":\"Tablas globales de DynamoDB\",\"C\":\"DynamoDB Accelerator (DAX)\",\"D\":\"Capacidad bajo demanda de DynamoDB\"},\"correct\":\"C\",\"explanation\":\"DAX es una caché en memoria para DynamoDB que proporciona latencia de lectura de microsegundos. Streams captura cambios. Las tablas globales proporcionan replicación en varias regiones. La capacidad bajo demanda escala el rendimiento automáticamente.\"},{\"id\":\"saa-d3-004\",\"question\":\"Una empresa necesita procesar datos de transmisión en tiempo real de sensores IoT. ¿Qué servicio deberían usar?\",\"options\":{\"A\":\"Amazon SQS\",\"B\":\"Amazon Kinesis Data Streams\",\"C\":\"Amazon SNS\",\"D\":\"Amazon MQ\"},\"correct\":\"B\",\"explanation\":\"Kinesis Data Streams está diseñado para la ingesta y el procesamiento de datos de transmisión en tiempo real. SQS es para colas de mensajes. SNS es para notificaciones de publicación/suscripción. Amazon MQ es un agente de mensajes administrado.\"},{\"id\":\"saa-d3-005\",\"question\":\"¿Qué servicio de AWS proporciona almacenamiento de archivos completamente administrado, altamente disponible y escalable para usar con instancias EC2 en múltiples Zonas de Disponibilidad?\",\"options\":{\"A\":\"Amazon EBS\",\"B\":\"Amazon EFS\",\"C\":\"Amazon S3\",\"D\":\"AWS Storage Gateway\"},\"correct\":\"B\",\"explanation\":\"Amazon EFS proporciona almacenamiento de archivos escalable y elástico accesible desde múltiples instancias EC2 en distintas AZs. EBS es almacenamiento de bloques asociado a una única instancia. S3 es almacenamiento de objetos. Storage Gateway conecta entornos on-premises con el almacenamiento de AWS.\"},{\"id\":\"saa-d4-001\",\"question\":\"Una empresa quiere reducir los costos de EC2 para cargas de trabajo que pueden tolerar interrupciones. ¿Qué opción de compra deberían usar?\",\"options\":{\"A\":\"On-Demand Instances\",\"B\":\"Reserved Instances\",\"C\":\"Spot Instances\",\"D\":\"Dedicated Hosts\"},\"correct\":\"C\",\"explanation\":\"Spot Instances ofrecen hasta un 90% de descuento, pero pueden interrumpirse. On-Demand no tiene descuento. Reserved Instances requieren compromiso. Dedicated Hosts proporcionan aislamiento de servidor físico.\"},{\"id\":\"saa-d4-002\",\"question\":\"¿Qué servicio de AWS ayuda a identificar recursos subutilizados y proporciona recomendaciones de optimización de costos?\",\"options\":{\"A\":\"AWS Budgets\",\"B\":\"AWS Trusted Advisor\",\"C\":\"AWS Cost Explorer\",\"D\":\"AWS Pricing Calculator\"},\"correct\":\"B\",\"explanation\":\"Trusted Advisor inspecciona tu entorno de AWS y proporciona recomendaciones para optimización de costos, seguridad, rendimiento y tolerancia a fallos. Cost Explorer visualiza costos. Budgets establece alertas. Pricing Calculator estima costos.\"},{\"id\":\"saa-d4-003\",\"question\":\"Una empresa ejecuta un entorno de desarrollo que solo se usa durante el horario laboral. ¿Qué enfoque minimiza los costos?\",\"options\":{\"A\":\"Use Reserved Instances\",\"B\":\"Use On-Demand Instances and stop them after hours\",\"C\":\"Use Spot Instances\",\"D\":\"Use Dedicated Hosts\"},\"correct\":\"B\",\"explanation\":\"Detener las instancias On-Demand cuando no se usan elimina los cargos de cómputo (solo quedan los costos de almacenamiento). Reserved Instances son para cargas de trabajo en estado estable. Spot Instances pueden interrumpirse. Dedicated Hosts son costosos.\"},{\"id\":\"saa-d4-004\",\"question\":\"¿Qué característica de S3 puede mover automáticamente objetos a clases de almacenamiento más económicas según los patrones de acceso?\",\"options\":{\"A\":\"S3 Versioning\",\"B\":\"S3 Lifecycle policies\",\"C\":\"S3 Replication\",\"D\":\"S3 Object Lock\"},\"correct\":\"B\",\"explanation\":\"Las políticas de S3 Lifecycle transfieren automáticamente objetos entre clases de almacenamiento o los hacen expirar según reglas. Versioning conserva versiones de objetos. Replication copia objetos entre buckets. Object Lock impide la eliminación.\"},{\"id\":\"saa-d4-005\",\"question\":\"Un arquitecto de soluciones necesita elegir entre Amazon RDS y Amazon DynamoDB. ¿Qué factor favorece más a DynamoDB?\",\"options\":{\"A\":\"Consultas SQL complejas con joins\",\"B\":\"Latencia constante de milisegundos de un solo dígito a cualquier escala\",\"C\":\"Transacciones ACID entre múltiples tablas\",\"D\":\"Aplicación de esquema e integridad referencial\"},\"correct\":\"B\",\"explanation\":\"DynamoDB proporciona rendimiento constante de milisegundos de un solo dígito a cualquier escala. RDS es mejor para consultas SQL complejas, transacciones ACID de múltiples tablas y aplicación de esquema.\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
