/app/cards/%5Bid%5D/page-a39129091dc993ae.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"deckEs\":{\"quizId\":\"fundamentals-ml-entrenamiento\",\"quizTitle\":\"Fundamentos de ML — Datos, entrenamiento y métricas\",\"cardCount\":23,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🎯\",\"description\":\"Cómo se ve un dataset, cómo se entrena de verdad y cómo saber si el modelo sirve. Desde 0, con las trampas de las métricas.\",\"modules\":[{\"id\":\"m1-datos\",\"title\":\"El dataset y su limpieza\",\"titleEn\":\"The dataset and cleaning it\",\"description\":\"Qué es una fila, cómo limpiar, qué hacer con los vacíos, crear buenas features y no duplicar casos entre train y test.\",\"objective\":\"Dejar un dataset listo para entrenar sin introducir fugas ni duplicados.\",\"emoji\":\"🗂️\",\"cards\":[\"ml-data-tabla\",\"ml-data-limpieza\",\"ml-data-missing\",\"ml-data-feature-eng\",\"ml-data-duplicados\"]},{\"id\":\"m2-entrenar\",\"title\":\"Entrenar bien\",\"titleEn\":\"Training well\",\"description\":\"Learning rate, early stopping, validación cruzada y pipelines.\",\"objective\":\"Configurar un entrenamiento cuya validación sea honesta y que pare en el mejor momento.\",\"emoji\":\"⚙️\",\"cards\":[\"ml-train-lr\",\"ml-train-early-stop\",\"ml-train-cv\",\"ml-train-pipeline\"]},{\"id\":\"m3-regresion\",\"title\":\"Métricas de regresión\",\"titleEn\":\"Regression metrics\",\"description\":\"MAE, RMSE y cómo darles contexto con una baseline.\",\"objective\":\"Elegir entre MAE y RMSE y decir si un error es bueno comparándolo con una baseline.\",\"emoji\":\"📏\",\"cards\":[\"ml-metrica-mae-rmse\",\"ml-metrica-contexto\"]},{\"id\":\"m4-clasificacion\",\"title\":\"Métricas de clasificación\",\"titleEn\":\"Classification metrics\",\"description\":\"De la accuracy a la matriz de confusión, precision, recall, F1, umbrales, desbalance, ROC-AUC y umbrales por costo.\",\"objective\":\"Elegir la métrica y el umbral según el costo de cada error, incluso con clases muy desbalanceadas.\",\"emoji\":\"🎯\",\"cards\":[\"ml-metrica-accuracy\",\"ml-metrica-confusion\",\"ml-metrica-precision\",\"ml-metrica-recall\",\"ml-metrica-f1\",\"ml-metrica-umbral\",\"ml-metrica-imbalance\",\"ml-metrica-auc\",\"ml-metrica-umbral-costos\"]},{\"id\":\"m5-produccion\",\"title\":\"En producción\",\"titleEn\":\"In production\",\"description\":\"Batch vs online, data drift y concept drift.\",\"objective\":\"Elegir cómo servir un modelo y qué monitorear para saber cuándo reentrenarlo.\",\"emoji\":\"🚀\",\"cards\":[\"ml-ops-batch-online\",\"ml-ops-drift\",\"ml-ops-concept-drift\"]}],\"cards\":[{\"id\":\"ml-data-tabla\",\"part\":\"m\",\"front\":\"¿Cómo se ve un dataset tabular?\",\"back\":\"Un dataset tabular es una tabla: cada FILA es un ejemplo (un cliente, una transacción) y cada COLUMNA es una feature o el label.\\n\\n• 10 000 filas × 20 columnas es un caso típico de negocio.\\n• Imágenes y texto no \\\"nacen\\\" como tabla: primero se convierten en números (píxeles, tokens, embeddings).\\n\\nSi no puedes explicar qué es una fila en una frase, el problema todavía no está definido.\",\"topic\":\"Dataset\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"ml-data-limpieza\",\"part\":\"m\",\"front\":\"¿Qué significa limpiar datos y por qué importa tanto?\",\"back\":\"Limpiar datos es arreglar lo que el modelo no puede interpretar bien: duplicados, tipos mezclados, fechas rotas, outliers imposibles, categorías mal escritas.\\n\\n\\\"Garbage in, garbage out\\\": un boosting brillante con datos sucios aprende el sucio. En la práctica, limpiar y entender el dato se come más tiempo que elegir el algoritmo.\",\"topic\":\"Limpieza de datos\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"ml-data-missing\",\"part\":\"m\",\"front\":\"¿Qué haces con valores faltantes (missing)?\",\"back\":\"No los ignores ni los rellenes a ciegas: primero entiende por qué faltan, porque \\\"vacío\\\" a veces ES información.\\n\\nOpciones:\\n• Borrar la fila, si son pocas y faltan al azar.\\n• Imputar (mediana, \\\"desconocido\\\") y añadir una columna \\\"faltaba\\\" para que el modelo sepa que se imputó.\\n• Usar un modelo que los acepte de forma nativa (p. ej., HistGradientBoosting, XGBoost o LightGBM).\\n\\nCalcula la imputación SOLO con train. Faltar al azar no es lo mismo que \\\"los casos graves no tienen análisis\\\".\",\"topic\":\"Valores faltantes\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"ml-data-feature-eng\",\"part\":\"m\",\"front\":\"¿Qué es feature engineering?\",\"back\":\"Feature engineering es crear o transformar columnas para que el patrón sea más fácil de aprender: ratio ingresos/deuda, día de la semana, distancia a la tienda, texto → conteo de palabras.\\n\\nA menudo gana más que cambiar de modelo. El riesgo es leakage: no uses información que no existiría en el momento de predecir.\",\"topic\":\"Feature engineering\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"ml-data-duplicados\",\"part\":\"m\",\"front\":\"Un dataset de 80 000 reseñas tiene muchas copiadas por bots. Con un split aleatorio, el clasificador de sentimiento da 95% en test; con reseñas nuevas de este mes, 78%. ¿Qué pasó?\",\"back\":\"Copias casi idénticas cayeron en train y en test, así que el test midió memoria y no generalización; deduplica antes de dividir.\\n\\n• Elimina duplicados exactos y casi exactos (mismo texto con cambios mínimos).\\n• Si los duplicados vienen de la misma cuenta o producto, divide por grupo.\\n• Más regularización no arregla un test contaminado: la métrica seguirá inflada.\\n\\nIdea clave: un test sirve si contiene casos que el modelo de verdad no vio.\",\"topic\":\"Duplicados entre train y test\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-train-lr\",\"part\":\"m\",\"front\":\"¿Qué pasa si el learning rate es demasiado grande o demasiado chico?\",\"back\":\"La learning rate es el tamaño de cada paso al bajar la loss: muy grande diverge, muy chica avanza demasiado lento.\\n\\n• Muy grande: la loss salta, no converge o explota (NaN).\\n• Muy chica: avanza a paso de hormiga y, con un número fijo de epochs, termina lejos de una buena solución.\\n\\nEn la práctica se prueba un rango (por ejemplo 1e-4 a 1e-1) y a menudo se reduce con el tiempo. En redes suele ser el hiperparámetro más influyente.\",\"topic\":\"Learning rate\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-train-early-stop\",\"part\":\"m\",\"front\":\"¿Qué es early stopping y qué problema evita?\",\"back\":\"Early stopping deja de entrenar cuando la métrica de VALIDATION deja de mejorar, aunque la de train siga bajando, y se queda con el mejor momento.\\n\\nEso es la señal de overfitting: el modelo ya memoriza y deja de servir en datos nuevos. Necesitas un validation honesto, separado del train.\\n\\nGuardas el checkpoint del mejor momento en validation, no el del último epoch. \\\"Entrenar más\\\" no siempre es mejor.\",\"topic\":\"Early stopping\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-train-cv\",\"part\":\"m\",\"front\":\"¿Qué es la validación cruzada (cross-validation)?\",\"back\":\"La validación cruzada rota qué parte del train sirve para validar y promedia las métricas, para no depender de un solo split.\\n\\nPartes el train en k pliegues (por ejemplo 5). Entrenas en 4 y mides en el que quedó afuera. Rotas hasta que cada pliegue fue el de validación una vez. Promedias las métricas.\\n\\nAnalogía: cinco simulacros distintos, y te quedas con el promedio, no con el día que te fue mejor.\\n\\nSirve cuando hay poco dato y un solo split miente por azar. El test FINAL sigue apartado: no entra a esos pliegues. En series de tiempo no mezcles el futuro hacia el pasado.\",\"topic\":\"Cross-validation\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-train-pipeline\",\"part\":\"m\",\"front\":\"Tu notebook imputa, escala y selecciona features sobre todo X, y después hace cross-validation de 5 folds con los datos ya transformados. La CV da 0.92. ¿Qué cambias para que sea honesta?\",\"back\":\"Mete el preprocesado y el modelo en un Pipeline y pásalo entero a la validación cruzada, para que cada fold ajuste sus pasos solo con su parte de train.\\n\\n• scikit-learn: Pipeline + ColumnTransformer, y cross_val_score(pipeline, X, y).\\n• Los pasos que usan el label (selección de features, target encoding, SMOTE) son los que más inflan la métrica si se ajustan fuera.\\n• El mismo objeto entrenado se usa en producción: menos riesgo de que train y serving transformen distinto.\\n\\nRegla: todo lo que se \\\"ajusta\\\" (fit) va dentro del fold.\",\"topic\":\"Pipeline y validación cruzada\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-metrica-mae-rmse\",\"part\":\"m\",\"front\":\"En regresión, ¿qué miden MAE y RMSE?\",\"back\":\"MAE y RMSE miden, en las unidades del objetivo, qué tan lejos quedan las predicciones de los valores reales.\\n\\n• MAE: promedio del error absoluto. \\\"En promedio nos desviamos 8 000 $\\\". Fácil de explicar.\\n• RMSE: raíz del promedio de los errores al cuadrado. Castiga más los errores grandes.\\n• Siempre RMSE ≥ MAE; si RMSE es mucho mayor, hay unos pocos errores enormes.\\n\\nSi un error enorme es inaceptable, RMSE (o una métrica de negocio) te avisa antes que MAE.\",\"topic\":\"MAE y RMSE\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-contexto\",\"part\":\"m\",\"front\":\"Tu modelo de tiempo de entrega tiene un MAE de 12 minutos. El jefe pregunta: \\\"¿eso es bueno?\\\". ¿Qué necesitas para responder?\",\"back\":\"Una referencia: compáralo con una baseline simple (predecir siempre la mediana) y con el error que el negocio puede tolerar.\\n\\n• Si la baseline da 13 minutos, el modelo aporta poco; si da 30, aporta mucho.\\n• Si el cliente acepta ±15 minutos, 12 puede bastar; si promete ±5, no.\\n• R² da una referencia relativa a predecir la media, pero no dice minutos.\\n\\nIdea clave: una métrica sin baseline ni tolerancia de negocio no significa nada.\",\"topic\":\"Métrica con contexto\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-accuracy\",\"part\":\"m\",\"front\":\"¿Qué es accuracy y cuándo miente?\",\"back\":\"Accuracy es el porcentaje de predicciones correctas: fácil de entender, pero engañosa cuando las clases están desbalanceadas.\\n\\nSi el 98% de los mails no son spam, un modelo que dice SIEMPRE \\\"no spam\\\" tiene 98% de accuracy y no detecta ningún spam.\\n\\nEs útil cuando las clases están razonablemente equilibradas y los errores cuestan parecido. Si no, mira precision, recall y la matriz de confusión.\",\"topic\":\"Accuracy\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-confusion\",\"part\":\"m\",\"front\":\"¿Qué es una matriz de confusión?\",\"back\":\"Una matriz de confusión es una tabla 2×2 (o N×N) que cruza la clase real con la predicha y cuenta aciertos y tipos de error.\\n\\n\\n• VP (true positive): dijo sí y era sí.\\n• VN (true negative): dijo no y era no.\\n• FP (false positive): dijo sí y era no — falsa alarma.\\n• FN (false negative): dijo no y era sí — se le escapó.\\n\\nDe aquí salen precision y recall. Siempre que puedas, mira la matriz: un solo número esconde el tipo de error.\",\"topic\":\"Matriz de confusión\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-precision\",\"part\":\"m\",\"front\":\"¿Qué es precision (precisión)?\",\"back\":\"Precision es la fracción de lo que el modelo marcó como positivo que SÍ lo era: VP / (VP + FP).\\n\\nAlta precision = pocas falsas alarmas. Importa cuando un \\\"sí\\\" es caro: bloquear a un cliente bueno, alertar a un médico, mandar un email de \\\"tu tarjeta fue robada\\\".\\n\\nNo la confundas con accuracy. En español \\\"precisión\\\" se usa para las dos; en el examen, precision = esta fracción.\",\"topic\":\"Precision\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-recall\",\"part\":\"m\",\"front\":\"¿Qué es recall (exhaustividad / sensibilidad)?\",\"back\":\"Recall es la fracción de los positivos REALES que el modelo encontró: VP / (VP + FN).\\n\\nAlto recall = se escapan pocos. Importa cuando un miss es caro: fraude, cáncer, una pieza defectuosa.\\n\\nPrecision y recall tiran en direcciones opuestas: si marcas casi todo como positivo, recall sube y precision cae. El umbral de decisión mueve ese equilibrio.\",\"topic\":\"Recall\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-f1\",\"part\":\"m\",\"front\":\"¿Qué es el F1 y cuándo usarlo?\",\"back\":\"F1 es la media armónica de precision y recall: un solo número que castiga si una de las dos está muy baja.\\n\\nÚsalo cuando las clases están desbalanceadas y te importan los dos tipos de error, o para comparar modelos con un ranking simple. Si un error es mucho más caro que el otro, no uses F1 a ciegas: diseña la métrica con el negocio.\",\"topic\":\"F1\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-umbral\",\"part\":\"m\",\"front\":\"¿Por qué el umbral 0.5 no es sagrado?\",\"back\":\"0.5 solo es el mejor corte si un falso positivo y un falso negativo cuestan lo mismo y las probabilidades están bien calibradas.\\n\\nEl modelo suele devolver una probabilidad; el umbral decide a partir de cuánto dices \\\"sí\\\".\\n\\n• Si un FN es mucho más caro, bajas el umbral (más recall).\\n• Si un FP es caro, lo subes (más precision).\\n\\nEl umbral se elige con el negocio y con el conjunto de validación, no con el default de la librería. Cambiarlo no exige reentrenar.\",\"topic\":\"Umbral de decisión\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-imbalance\",\"part\":\"m\",\"front\":\"¿Qué problema crean las clases desbalanceadas y qué puedes hacer?\",\"back\":\"Con una clase rara (fraude 0.3%), un modelo perezoso que predice siempre la mayoría saca una accuracy altísima sin servir para nada.\\n\\nQué hacer:\\n• Métricas centradas en la clase rara: precision, recall, F1, PR-AUC (la ROC-AUC puede verse optimista).\\n• Elegir el umbral con el negocio, no dejar 0.5.\\n• Pesos de clase o remuestreo, SOLO en train.\\n• Split estratificado para que validación y test tengan positivos.\\n\\nEl objetivo no es \\\"50/50 en el dataset\\\": es acertar los casos que importan.\",\"topic\":\"Clases desbalanceadas\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-auc\",\"part\":\"m\",\"front\":\"¿Qué dice el ROC-AUC, en intuición?\",\"back\":\"La ROC-AUC mide qué tan bien el modelo ORDENA: la probabilidad de que un positivo al azar reciba más puntuación que un negativo al azar.\\n\\n• 0.5 = como lanzar una moneda; 1.0 = orden perfecto.\\n• No depende de un umbral concreto: resume todos.\\n• No dice si las probabilidades están calibradas, solo si el orden es bueno.\\n\\nCuidado: con clases muy raras, la ROC-AUC puede verse excelente aunque la mayoría de las alertas sean falsas. Ahí mira también la curva precision-recall (PR-AUC).\",\"topic\":\"ROC-AUC\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-metrica-umbral-costos\",\"part\":\"m\",\"front\":\"Cada alerta de fraude la revisa una persona, a 5 € por revisión (sea fraude o no). Un fraude que se escapa cuesta 500 €. El modelo da probabilidades bien calibradas. ¿Desde qué probabilidad conviene alertar?\",\"back\":\"Desde p ≈ 0.01: alertar compensa cuando la pérdida esperada que evitas (p × 500 €) supera el costo de revisar (5 €), es decir, p \u003e 5 / 500.\\n\\n• Con ese umbral marcarás muchas transacciones: es lo correcto si los costos son esos.\\n• Valídalo en el conjunto de validación sumando el costo total con varios umbrales.\\n• Si las probabilidades no están calibradas, la fórmula no vale: elige el umbral que minimiza el costo en validación (o calibra primero).\\n\\nError típico: dejar 0.5 porque es el default.\",\"topic\":\"Umbral por costos\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"advanced\"},{\"id\":\"ml-ops-batch-online\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre predicción batch y online?\",\"back\":\"Batch calcula predicciones por lotes y las guarda; online responde cada caso al momento: elige según la latencia que necesita el negocio.\\n\\n• Batch: procesas un lote (todas las noches, todas las filas nuevas) y guardas el resultado. Barato y simple.\\n• Online / tiempo real: un endpoint responde a UN caso en milisegundos (¿apruebo este pago AHORA?).\\n\\nElige según la latencia que el negocio necesita, no por moda. Muchos problemas de ML son batch y eso está bien.\",\"topic\":\"Batch vs online\",\"origin\":\"ai\",\"group\":\"En producción\",\"difficulty\":\"basic\"},{\"id\":\"ml-ops-drift\",\"part\":\"m\",\"front\":\"¿Qué es el data drift y por qué un modelo \\\"se pudre\\\"?\",\"back\":\"El data drift es cuando los datos de producción dejan de parecerse a los de entrenamiento, y el modelo, sin avisar, se equivoca más.\\n\\nEl mundo cambia: los clientes, los precios, un competidor nuevo.\\n\\nPor eso se monitorea (distribución de inputs y de predicciones) y se reentrena. Un modelo no es un archivo que publicas y olvidas.\",\"topic\":\"Data drift\",\"origin\":\"ai\",\"group\":\"En producción\",\"difficulty\":\"basic\"},{\"id\":\"ml-ops-concept-drift\",\"part\":\"m\",\"front\":\"Un modelo de fraude mantiene la misma distribución de importes, países y horas que en entrenamiento, pero su precision cae del 60% al 35% en dos meses tras un cambio de táctica de los estafadores. ¿Qué cambió y cómo lo detectas?\",\"back\":\"Cambió la relación entre las features y el label (concept drift), no las features; solo lo detectas midiendo el rendimiento con etiquetas recientes.\\n\\n• Monitorear solo la distribución de los inputs no lo ve: los inputs se parecen.\\n• Necesitas que lleguen labels (fraudes confirmados) y métricas por periodo.\\n• Respuesta: reentrenar con datos recientes y revisar features o el planteamiento.\\n• Data drift sería al revés: cambian los inputs aunque la relación se mantenga.\\n\\nIdea clave: vigila inputs Y rendimiento con etiquetas.\",\"topic\":\"Concept drift\",\"origin\":\"ai\",\"group\":\"En producción\",\"difficulty\":\"advanced\"}]},\"deckEn\":{\"quizId\":\"fundamentals-ml-entrenamiento\",\"quizTitle\":\"ML Fundamentals — Data, training, and metrics\",\"cardCount\":23,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🎯\",\"description\":\"What a dataset looks like, how training actually works, and how to tell if the model is any good. From zero, including metric traps.\",\"modules\":[{\"id\":\"m1-datos\",\"title\":\"The dataset and cleaning it\",\"titleEn\":\"The dataset and cleaning it\",\"description\":\"What a row is, how to clean, what to do with missing values, building good features, and not duplicating cases across train and test.\",\"objective\":\"Get a dataset ready for training without introducing leaks or duplicates.\",\"emoji\":\"🗂️\",\"cards\":[\"ml-data-tabla\",\"ml-data-limpieza\",\"ml-data-missing\",\"ml-data-feature-eng\",\"ml-data-duplicados\"]},{\"id\":\"m2-entrenar\",\"title\":\"Training well\",\"titleEn\":\"Training well\",\"description\":\"Learning rate, early stopping, cross-validation and pipelines.\",\"objective\":\"Set up training whose validation is honest and that stops at the best point.\",\"emoji\":\"⚙️\",\"cards\":[\"ml-train-lr\",\"ml-train-early-stop\",\"ml-train-cv\",\"ml-train-pipeline\"]},{\"id\":\"m3-regresion\",\"title\":\"Regression metrics\",\"titleEn\":\"Regression metrics\",\"description\":\"MAE, RMSE, and how to give them context with a baseline.\",\"objective\":\"Choose between MAE and RMSE and say whether an error is good by comparing it with a baseline.\",\"emoji\":\"📏\",\"cards\":[\"ml-metrica-mae-rmse\",\"ml-metrica-contexto\"]},{\"id\":\"m4-clasificacion\",\"title\":\"Classification metrics\",\"titleEn\":\"Classification metrics\",\"description\":\"From accuracy to the confusion matrix, precision, recall, F1, thresholds, imbalance, ROC-AUC, and cost-based thresholds.\",\"objective\":\"Choose the metric and threshold by the cost of each error, even with highly imbalanced classes.\",\"emoji\":\"🎯\",\"cards\":[\"ml-metrica-accuracy\",\"ml-metrica-confusion\",\"ml-metrica-precision\",\"ml-metrica-recall\",\"ml-metrica-f1\",\"ml-metrica-umbral\",\"ml-metrica-imbalance\",\"ml-metrica-auc\",\"ml-metrica-umbral-costos\"]},{\"id\":\"m5-produccion\",\"title\":\"In production\",\"titleEn\":\"In production\",\"description\":\"Batch vs online, data drift and concept drift.\",\"objective\":\"Choose how to serve a model and what to monitor to know when to retrain it.\",\"emoji\":\"🚀\",\"cards\":[\"ml-ops-batch-online\",\"ml-ops-drift\",\"ml-ops-concept-drift\"]}],\"cards\":[{\"id\":\"ml-data-tabla\",\"part\":\"m\",\"front\":\"What does a tabular dataset look like?\",\"back\":\"A tabular dataset is a table: each ROW is an example (a customer, a transaction) and each COLUMN is a feature or the label.\\n\\n• 10,000 rows × 20 columns is a typical business case.\\n• Images and text are not born as tables: they are first turned into numbers (pixels, tokens, embeddings).\\n\\nIf you cannot say what one row is in a sentence, the problem is not defined yet.\",\"topic\":\"Dataset\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-data-limpieza\",\"part\":\"m\",\"front\":\"What does cleaning data mean, and why does it matter so much?\",\"back\":\"Cleaning data means fixing what the model cannot interpret well: duplicates, mixed types, broken dates, impossible outliers, misspelled categories.\\n\\n\\\"Garbage in, garbage out\\\": a brilliant boosting model on dirty data learns the dirt. In practice, cleaning and understanding the data eats more time than picking the algorithm.\",\"topic\":\"Limpieza de datos\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-data-missing\",\"part\":\"m\",\"front\":\"What do you do with missing values?\",\"back\":\"Do not ignore them or fill them blindly: first understand why they are missing, because \\\"empty\\\" is sometimes information.\\n\\nOptions:\\n• Drop the row, if there are few and they are missing at random.\\n• Impute (median, \\\"unknown\\\") and add a \\\"was missing\\\" column so the model knows it was imputed.\\n• Use a model that accepts them natively (e.g. HistGradientBoosting, XGBoost or LightGBM).\\n\\nCompute the imputation on train ONLY. Missing at random is not the same as \\\"severe cases have no lab test\\\".\",\"topic\":\"Valores faltantes\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-data-feature-eng\",\"part\":\"m\",\"front\":\"What is feature engineering?\",\"back\":\"Feature engineering is creating or transforming columns so the pattern is easier to learn: income/debt ratio, day of week, distance to the store, text → word counts.\\n\\nIt often wins more than switching models. The risk is leakage: do not use information that would not exist at prediction time.\",\"topic\":\"Feature engineering\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-data-duplicados\",\"part\":\"m\",\"front\":\"A dataset of 80,000 reviews has many copied by bots. With a random split the sentiment classifier scores 95% on test; on new reviews from this month, 78%. What happened?\",\"back\":\"Near-identical copies landed in both train and test, so the test measured memory, not generalization; deduplicate before splitting.\\n\\n• Remove exact and near-exact duplicates (same text with minimal changes).\\n• If duplicates come from the same account or product, split by group.\\n• More regularization does not fix a contaminated test set: the metric stays inflated.\\n\\nKey idea: a test set is useful only if it holds cases the model truly did not see.\",\"topic\":\"Duplicados entre train y test\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-train-lr\",\"part\":\"m\",\"front\":\"What happens if the learning rate is too large or too small?\",\"back\":\"The learning rate is the size of each step down the loss: too large diverges, too small moves too slowly.\\n\\n• Too large: the loss jumps around, does not converge, or blows up (NaN).\\n• Too small: it crawls and, with a fixed number of epochs, ends far from a good solution.\\n\\nIn practice you try a range (for example 1e-4 to 1e-1) and often decay it over time. In networks it is often the most influential hyperparameter.\",\"topic\":\"Learning rate\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-train-early-stop\",\"part\":\"m\",\"front\":\"What is early stopping and what problem does it prevent?\",\"back\":\"Early stopping halts training when the VALIDATION metric stops improving, even if train keeps falling, and keeps the best point.\\n\\nThat is the overfitting signal: the model is memorizing and stops helping on new data. You need an honest validation set, separate from train.\\n\\nYou keep the checkpoint from the best validation moment, not from the last epoch. \\\"Train longer\\\" is not always better.\",\"topic\":\"Early stopping\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-train-cv\",\"part\":\"m\",\"front\":\"What is cross-validation?\",\"back\":\"Cross-validation rotates which part of train is used for validation and averages the metrics, so you do not depend on one split.\\n\\nYou split train into k folds (for example 5). You train on 4 and measure on the one left out. You rotate until every fold was the validation fold once. You average the metrics.\\n\\nAnalogy: five different practice exams, and you keep the average, not the day you did best.\\n\\nIt helps when there is little data and a single split lies by chance. The FINAL test set stays held out: it does not enter those folds. On time series, do not leak the future into the past.\",\"topic\":\"Cross-validation\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-train-pipeline\",\"part\":\"m\",\"front\":\"Your notebook imputes, scales, and selects features on the whole X, then runs 5-fold cross-validation on the already transformed data. CV says 0.92. What do you change to make it honest?\",\"back\":\"Put preprocessing and the model in a Pipeline and pass the whole thing to cross-validation, so each fold fits its steps on its own training part only.\\n\\n• scikit-learn: Pipeline + ColumnTransformer, and cross_val_score(pipeline, X, y).\\n• Steps that use the label (feature selection, target encoding, SMOTE) are the ones that inflate the metric most when fitted outside.\\n• The same fitted object is used in production: less risk of training and serving transforming differently.\\n\\nRule: everything that is fitted goes inside the fold.\",\"topic\":\"Pipeline y validación cruzada\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-metrica-mae-rmse\",\"part\":\"m\",\"front\":\"In regression, what do MAE and RMSE measure?\",\"back\":\"MAE and RMSE measure, in the target's units, how far predictions land from the real values.\\n\\n• MAE: the mean absolute error. \\\"On average we are off by $8,000\\\". Easy to explain.\\n• RMSE: the square root of the mean squared error. It punishes large errors more.\\n• Always RMSE ≥ MAE; if RMSE is much larger, there are a few huge errors.\\n\\nIf one huge miss is unacceptable, RMSE (or a business metric) warns you sooner than MAE.\",\"topic\":\"MAE y RMSE\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-contexto\",\"part\":\"m\",\"front\":\"Your delivery-time model has an MAE of 12 minutes. Your manager asks: \\\"is that good?\\\". What do you need to answer?\",\"back\":\"A reference: compare it with a simple baseline (always predicting the median) and with the error the business can tolerate.\\n\\n• If the baseline scores 13 minutes, the model adds little; if it scores 30, it adds a lot.\\n• If customers accept ±15 minutes, 12 may be enough; if you promise ±5, it is not.\\n• R² gives a reference relative to predicting the mean, but it does not speak in minutes.\\n\\nKey idea: a metric without a baseline or a business tolerance means nothing.\",\"topic\":\"Métrica con contexto\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-accuracy\",\"part\":\"m\",\"front\":\"What is accuracy and when does it lie?\",\"back\":\"Accuracy is the percentage of correct predictions: easy to understand, but misleading when classes are imbalanced.\\n\\nIf 98% of email is not spam, a model that ALWAYS says \\\"not spam\\\" has 98% accuracy and catches no spam at all.\\n\\nIt is useful when classes are reasonably balanced and errors cost about the same. Otherwise look at precision, recall, and the confusion matrix.\",\"topic\":\"Accuracy\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-confusion\",\"part\":\"m\",\"front\":\"What is a confusion matrix?\",\"back\":\"A confusion matrix is a 2×2 (or N×N) table that crosses the true class with the predicted one and counts hits and error types.\\n\\n\\n• TP (true positive): said yes and it was yes.\\n• TN (true negative): said no and it was no.\\n• FP (false positive): said yes and it was no — false alarm.\\n• FN (false negative): said no and it was yes — a miss.\\n\\nPrecision and recall come from here. Whenever you can, look at the matrix: a single number hides the error type.\",\"topic\":\"Matriz de confusión\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-precision\",\"part\":\"m\",\"front\":\"What is precision?\",\"back\":\"Precision is the fraction of what the model marked positive that truly was positive: TP / (TP + FP).\\n\\nHigh precision = few false alarms. It matters when a \\\"yes\\\" is expensive: blocking a good customer, paging a doctor, emailing \\\"your card was stolen\\\".\\n\\nDo not confuse it with accuracy.\",\"topic\":\"Precision\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-recall\",\"part\":\"m\",\"front\":\"What is recall (sensitivity)?\",\"back\":\"Recall is the fraction of REAL positives the model found: TP / (TP + FN).\\n\\nHigh recall = few misses. It matters when a miss is expensive: fraud, cancer, a defective part.\\n\\nPrecision and recall pull opposite ways: if you mark almost everything positive, recall rises and precision falls. The decision threshold moves that tradeoff.\",\"topic\":\"Recall\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-f1\",\"part\":\"m\",\"front\":\"What is F1 and when should you use it?\",\"back\":\"F1 is the harmonic mean of precision and recall: one number that punishes you if either is very low.\\n\\nUse it when classes are imbalanced and both error types matter, or to rank models simply. If one error is much more expensive than the other, do not use F1 blindly: design the metric with the business.\",\"topic\":\"F1\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-umbral\",\"part\":\"m\",\"front\":\"Why is the 0.5 threshold not sacred?\",\"back\":\"0.5 is the best cut only if a false positive and a false negative cost the same and the probabilities are well calibrated.\\n\\nThe model usually returns a probability; the threshold decides from what value you say \\\"yes\\\".\\n\\n• If an FN is much more expensive, lower the threshold (more recall).\\n• If an FP is expensive, raise it (more precision).\\n\\nThe threshold is chosen with the business and the validation set, not the library default. Changing it does not require retraining.\",\"topic\":\"Umbral de decisión\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-imbalance\",\"part\":\"m\",\"front\":\"What problem do imbalanced classes create, and what can you do?\",\"back\":\"With a rare class (fraud 0.3%), a lazy model that always predicts the majority gets very high accuracy while being useless.\\n\\nWhat to do:\\n• Metrics focused on the rare class: precision, recall, F1, PR-AUC (ROC-AUC can look optimistic).\\n• Choose the threshold with the business, do not leave 0.5.\\n• Class weights or resampling, on train ONLY.\\n• A stratified split so validation and test contain positives.\\n\\nThe goal is not \\\"50/50 in the dataset\\\": it is catching the cases that matter.\",\"topic\":\"Clases desbalanceadas\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-auc\",\"part\":\"m\",\"front\":\"What does ROC-AUC say, intuitively?\",\"back\":\"ROC-AUC measures how well the model RANKS: the probability that a random positive gets a higher score than a random negative.\\n\\n• 0.5 = a coin flip; 1.0 = perfect ranking.\\n• It does not depend on one threshold: it summarizes all of them.\\n• It does not say whether probabilities are calibrated, only whether the order is good.\\n\\nCareful: with very rare classes, ROC-AUC can look excellent even when most alerts are false. Look at the precision-recall curve (PR-AUC) as well.\",\"topic\":\"ROC-AUC\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-metrica-umbral-costos\",\"part\":\"m\",\"front\":\"Every fraud alert is reviewed by a person at €5 per review (fraud or not). A fraud that slips through costs €500. The model outputs well-calibrated probabilities. From what probability should you alert?\",\"back\":\"From p ≈ 0.01: alerting pays off when the expected loss you avoid (p × €500) exceeds the review cost (€5), that is, p \u003e 5 / 500.\\n\\n• With that threshold you will flag many transactions: that is correct if those are the costs.\\n• Check it on the validation set by summing the total cost for several thresholds.\\n• If probabilities are not calibrated, the formula does not hold: pick the threshold that minimizes cost on validation (or calibrate first).\\n\\nTypical mistake: leaving 0.5 because it is the default.\",\"topic\":\"Umbral por costos\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"advanced\"},{\"id\":\"ml-ops-batch-online\",\"part\":\"m\",\"front\":\"What is the difference between batch and online prediction?\",\"back\":\"Batch computes predictions in bulk and stores them; online answers each case on the spot: choose by the latency the business needs.\\n\\n• Batch: you process a pile (every night, all new rows) and store the result. Cheap and simple.\\n• Online / real time: an endpoint answers ONE case in milliseconds (do I approve this payment NOW?).\\n\\nChoose based on the latency the business needs, not fashion. Many ML problems are batch, and that is fine.\",\"topic\":\"Batch vs online\",\"origin\":\"ai\",\"group\":\"En producción\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-ops-drift\",\"part\":\"m\",\"front\":\"What is data drift, and why does a model \\\"go stale\\\"?\",\"back\":\"Data drift is when production data stops looking like the training data, and the model silently gets worse.\\n\\nThe world changes: customers, prices, a new competitor.\\n\\nThat is why you monitor (input and prediction distributions) and retrain. A model is not a file you publish and forget.\",\"topic\":\"Data drift\",\"origin\":\"ai\",\"group\":\"En producción\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-ops-concept-drift\",\"part\":\"m\",\"front\":\"A fraud model keeps the same distribution of amounts, countries, and hours as in training, but its precision falls from 60% to 35% in two months after fraudsters change tactics. What changed, and how do you detect it?\",\"back\":\"The relationship between features and label changed (concept drift), not the features; you only detect it by measuring performance with recent labels.\\n\\n• Monitoring only the input distribution misses it: the inputs look the same.\\n• You need labels to arrive (confirmed fraud) and metrics per period.\\n• Response: retrain on recent data and revisit the features or the framing.\\n• Data drift is the reverse: the inputs change even if the relationship holds.\\n\\nKey idea: watch inputs AND labeled performance.\",\"topic\":\"Concept drift\",\"origin\":\"ai\",\"group\":\"En producción\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"advanced\"}]},\"flows\":[{\"id\":\"ruta-ml-desde-cero\",\"emoji\":\"🌱\",\"title\":{\"es\":\"Machine Learning desde 0\",\"en\":\"Machine Learning from scratch\"}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
