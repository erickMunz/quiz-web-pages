h\":[\"children\",\"cards\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"fundamentals-inteligencia-artificial\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cards\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L5\",null,[\"$\",\"$L6\",null,{\"children\":\"$L7\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"ULeX7bZPVezHN2pIf1RIH\",{\"children\":[[\"$\",\"$L8\",null,{\"children\":\"$L9\"}],[\"$\",\"$La\",null,{\"children\":\"$Lb\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$c\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"d:I[7982,[\"872\",\"static/chunks/app/cards/%5Bid%5D/page-d619ac70be848024.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Ld\",null,{\"deckEs\":{\"quizId\":\"fundamentals-inteligencia-artificial\",\"quizTitle\":\"Fundamentos de IA — Desde 0\",\"cardCount\":20,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🧠\",\"description\":\"Qué es la inteligencia artificial, en qué se diferencia del ML, y cómo funcionan (de verdad) los modelos generativos y los LLM.\",\"cards\":[{\"id\":\"ai-que-es\",\"part\":\"m\",\"front\":\"¿Qué es la inteligencia artificial?\",\"back\":\"El campo de hacer que las máquinas hagan tareas que, si las hiciera una persona, diríamos que requieren inteligencia: percibir, clasificar, traducir, planear, conversar.\\n\\nNo es una sola técnica. Incluye reglas escritas a mano, machine learning, robótica, búsqueda, y hoy mucho deep learning y modelos generativos.\\n\\nAnalogía: \\\"transporte\\\" no es solo el auto; IA no es solo ChatGPT.\",\"topic\":\"Inteligencia artificial\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"difficulty\":\"basic\"},{\"id\":\"ai-vs-ml-dl-gen\",\"part\":\"m\",\"front\":\"¿Cómo se relacionan IA, ML, deep learning y IA generativa?\",\"back\":\"Son cajas una dentro de otra, no rivales:\\n\\n• IA: el objetivo amplio (máquinas que parecen inteligentes).\\n• ML: una forma de lograrlo APRENDIENDO de datos, no solo con reglas.\\n• Deep learning: ML con redes neuronales profundas.\\n• IA generativa: modelos que CREAN texto, imagen, audio o código (muchos son deep learning).\\n\\nTodo GenAI es IA; no toda IA es GenAI. Un árbol que predice fraude es ML e IA, no generativo.\",\"topic\":\"IA vs ML vs DL vs GenAI\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"difficulty\":\"basic\"},{\"id\":\"ai-estrecha-general\",\"part\":\"m\",\"front\":\"¿Qué es IA estrecha (ANI) e IA general (AGI)?\",\"back\":\"• IA estrecha: muy buena en UNA familia de tareas (traducir, detectar gatos, recomendar videos). Es TODO lo que usamos hoy.\\n• AGI: un sistema con la flexibilidad de una persona en muchas tareas nuevas. No existe en productos reales.\\n\\nUn LLM parece general porque habla de todo; por debajo sigue siendo un predictor de tokens, no una mente. No confundas fluidez con comprensión.\",\"topic\":\"IA estrecha vs general\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"difficulty\":\"basic\"},{\"id\":\"ai-reglas-vs-aprender\",\"part\":\"m\",\"front\":\"¿En qué se diferencia un sistema de reglas de uno que aprende?\",\"back\":\"• Reglas (sistemas expertos): una persona escribe \\\"si X y no Y, entonces Z\\\". Transparente, rígido, se rompe cuando el mundo no cabe en las reglas.\\n• Aprendizaje: el sistema ajusta parámetros con ejemplos. Flexible, opaco, depende de la calidad del dato.\\n\\nHoy se mezclan: un modelo predice y una regla de negocio pone el veto (\\\"nunca aprobar si está en lista negra\\\").\",\"topic\":\"Reglas vs aprendizaje\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"difficulty\":\"basic\"},{\"id\":\"ai-discriminativo-generativo\",\"part\":\"m\",\"front\":\"¿Qué es un modelo discriminativo y uno generativo?\",\"back\":\"• Discriminativo: aprende la frontera. \\\"¿Esto es spam o no?\\\". No inventa un mail nuevo.\\n• Generativo: aprende cómo se VE o se ESCRIBE algo y puede producir ejemplos nuevos (un párrafo, una imagen).\\n\\nUn clasificador de fotos de gatos es discriminativo. Un modelo que dibuja un gato que no existe es generativo. Los LLM son generativos: producen el siguiente token.\",\"topic\":\"Discriminativo vs generativo\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"difficulty\":\"basic\"},{\"id\":\"ai-llm\",\"part\":\"m\",\"front\":\"¿Qué es un LLM (large language model)?\",\"back\":\"Una red enorme (casi siempre un Transformer) entrenada para predecir la siguiente pieza de texto en una cantidad gigantesca de documentos.\\n\\nDe ese entrenamiento simple emergen habilidades: resumir, traducir, escribir código, seguir instrucciones. No tiene una base de datos de \\\"hechos\\\" aparte: tiene pesos que hacen más o menos probable cada continuación.\\n\\nGemini, GPT y Claude son LLM. No son buscadores, aunque a veces se conectan a uno.\",\"topic\":\"LLM\",\"origin\":\"ai\",\"group\":\"Modelos de lenguaje\",\"difficulty\":\"basic\"},{\"id\":\"ai-token\",\"part\":\"m\",\"front\":\"¿Qué es un token?\",\"back\":\"La unidad de texto que el modelo realmente ve: a veces una palabra, a veces un pedazo (\\\"program\\\" + \\\"ación\\\"), a veces un signo.\\n\\nEl modelo no lee letras sueltas ni \\\"entiende párrafos\\\": procesa una secuencia de tokens. El precio y el límite de contexto se miden en tokens, no en palabras (una palabra en español suele ser 1–3 tokens).\",\"topic\":\"Tokens\",\"origin\":\"ai\",\"group\":\"Modelos de lenguaje\",\"difficulty\":\"basic\"},{\"id\":\"ai-next-token\",\"part\":\"m\",\"front\":\"¿Qué está haciendo un LLM cuando \\\"escribe\\\"?\",\"back\":\"Predice el siguiente token, lo pega al texto, y repite. Una y otra vez.\\n\\nNo planea el ensayo completo y luego lo tipea. Por eso a veces se contradice a mitad de camino, y por eso el prompt (lo que ya está escrito) condiciona tanto lo que sigue.\\n\\nAnalogía: el autocompletado del celular, pero entrenado a escala de internet y con más contexto.\",\"topic\":\"Siguiente token\",\"origin\":\"ai\",\"group\":\"Modelos de lenguaje\",\"difficulty\":\"basic\"},{\"id\":\"ai-contexto\",\"part\":\"m\",\"front\":\"¿Qué es la ventana de contexto?\",\"back\":\"Cuántos tokens puede \\\"ver\\\" el modelo a la vez: el prompt + lo que va generando.\\n\\nSi te pasas, el principio se corta (o el sistema lo resume). Un chat largo no \\\"recuerda de verdad\\\": solo ve lo que cabe en esa ventana, más lo que el producto le vuelva a inyectar.\\n\\nMás contexto = más caro y a veces más lento. No es memoria infinita.\",\"topic\":\"Ventana de contexto\",\"origin\":\"ai\",\"group\":\"Modelos de lenguaje\",\"difficulty\":\"basic\"},{\"id\":\"ai-prompt\",\"part\":\"m\",\"front\":\"¿Qué es un prompt y por qué importa tanto?\",\"back\":\"El texto (e instrucciones) que le das al modelo ANTES de que genere. Es el contexto que condiciona el siguiente token.\\n\\nUn buen prompt: tarea clara, formato de salida, ejemplos (few-shot), y restricciones (\\\"si no sabes, di que no sabes\\\").\\n\\nNo es magia verbal: es diseñar la entrada de un predictor. Cambiar tres palabras puede cambiar el resultado más que cambiar de modelo.\",\"topic\":\"Prompt\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"difficulty\":\"basic\"},{\"id\":\"ai-temperatura\",\"part\":\"m\",\"front\":\"¿Qué hace la temperatura al generar texto?\",\"back\":\"Controla cuánto se permite el modelo salirse del token más probable.\\n\\n• Baja (0–0.3): más determinista. Buena para extracción, JSON, código, hechos.\\n• Alta (0.8+): más variedad. Buena para brainstorming; peor para exactitud.\\n\\nNo \\\"hace al modelo más inteligente\\\". Solo mueve el muestreo. Para una respuesta factual, baja la temperatura y ancla el prompt a fuentes.\",\"topic\":\"Temperatura\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"difficulty\":\"basic\"},{\"id\":\"ai-alucinacion\",\"part\":\"m\",\"front\":\"¿Qué es una alucinación en un LLM?\",\"back\":\"Texto fluido y convincente que no es verdad: una cita inventada, una API que no existe, un número seguro de más.\\n\\nPasa porque el objetivo del entrenamiento es continuidad plausible, no \\\"verificar contra el mundo\\\". El modelo no tiene un interruptor de honestidad.\\n\\nMitigas: pedir fuentes, RAG, herramientas, temperatura baja, y NUNCA confiar en números/leyes/código crítico sin revisar.\",\"topic\":\"Alucinación\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"difficulty\":\"basic\"},{\"id\":\"ai-embedding\",\"part\":\"m\",\"front\":\"¿Qué es un embedding, con una analogía?\",\"back\":\"Un vector (lista de números) que representa el significado de un texto, una imagen o un usuario. Textos parecidos quedan CERCA en ese espacio.\\n\\nAnalogía: un mapa donde \\\"rey\\\" queda cerca de \\\"reina\\\" y lejos de \\\"bicicleta\\\". No lees los números; mides distancias.\\n\\nSirve para buscar, recomendar y agrupar. Es la base de RAG y de muchas features de ML.\",\"topic\":\"Embeddings\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"difficulty\":\"basic\"},{\"id\":\"ai-rag\",\"part\":\"m\",\"front\":\"¿Qué es RAG (retrieval-augmented generation)?\",\"back\":\"Antes de que el LLM responda, BUSCAS trozos relevantes en TUS documentos (manuales, tickets, wiki) y se los pegas al prompt.\\n\\n• El modelo no \\\"aprendió\\\" tu empresa de memoria: lee el extracto en el momento.\\n• Reduce alucinaciones sobre datos privados y se actualiza al cambiar los docs, sin reentrenar.\\n\\nNo es magia: si la búsqueda trae el trozo equivocado, la respuesta sale mal. Basura en, basura elocuente fuera.\",\"topic\":\"RAG\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-prompt-vs-finetune\",\"part\":\"m\",\"front\":\"¿Cuándo basta un prompt y cuándo haría falta fine-tuning?\",\"back\":\"• Prompt / few-shot / RAG: primero siempre. Barato, reversible, suficiente para tono, formato y hechos de tus docs.\\n• Fine-tuning: sigue entrenando el modelo con TUS ejemplos. Úsalo cuando el estilo o la tarea se repite miles de veces y el prompt no alcanza.\\n\\nFine-tuning no es la forma de \\\"enseñarle datos frescos\\\" (para eso es RAG). Es caro y puede hacer olvidar otras habilidades.\",\"topic\":\"Prompting vs fine-tuning\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-agentes\",\"part\":\"m\",\"front\":\"¿Qué es un agente de IA, más allá del chatbot?\",\"back\":\"Un bucle: el modelo decide un paso, usa una HERRAMIENTA (buscar, ejecutar código, llamar una API), mira el resultado, y decide el siguiente paso hasta un objetivo.\\n\\nUn chatbot solo responde texto. Un agente actúa. El riesgo: cada paso puede alucinar una herramienta o un argumento. Se diseñan con límites (qué APIs, cuántos pasos, aprobación humana).\",\"topic\":\"Agentes\",\"origin\":\"ai\",\"group\":\"Sistemas\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-multimodal\",\"part\":\"m\",\"front\":\"¿Qué significa que un modelo sea multimodal?\",\"back\":\"Que acepta o produce más de un tipo de señal: texto, imagen, audio, video.\\n\\n\\\"¿Qué hay en esta foto?\\\" o \\\"describe este gráfico\\\" son tareas multimodales. Por dentro, cada modalidad se convierte en tokens o embeddings y el Transformer los trata juntos.\\n\\nSigue sin \\\"ver\\\" como una persona: tiene un encoder de imagen, no ojos.\",\"topic\":\"Multimodal\",\"origin\":\"ai\",\"group\":\"Sistemas\",\"difficulty\":\"basic\"},{\"id\":\"ai-sesgo-etica\",\"part\":\"m\",\"front\":\"¿Por qué un sistema de IA puede ser injusto o inseguro?\",\"back\":\"Aprende los sesgos de sus datos y de sus objetivos. Si el historial discrimina, el modelo lo escala con cara de neutralidad.\\n\\nRiesgos: privacidad (el prompt se va a un proveedor), contenido dañino, dependencia ciega, y decisiones de alto impacto sin humano.\\n\\nDiseño responsable: datos representativos, evaluación por grupo, logs, veto humano en lo crítico, y no poner un LLM donde hace falta un dato verificable.\",\"topic\":\"Sesgo y ética\",\"origin\":\"ai\",\"group\":\"Límites\",\"difficulty\":\"basic\"},{\"id\":\"ai-cuando-no\",\"part\":\"m\",\"front\":\"¿Cuándo NO deberías usar un modelo de IA?\",\"back\":\"Cuando una regla, una query o un dashboard resuelven el problema: más barato, más auditable.\\n\\nTampoco: si necesitas una respuesta 100% correcta (dosis, saldo, sentencia), si no hay datos, o si no puedes revisar la salida.\\n\\nLa pregunta útil no es \\\"¿puedo ponerle IA?\\\". Es \\\"¿qué falla si el modelo se equivoca el 5% de las veces, y quién se da cuenta?\\\".\",\"topic\":\"Cuándo no usar IA\",\"origin\":\"ai\",\"group\":\"Límites\",\"difficulty\":\"basic\"},{\"id\":\"ai-no-entiende\",\"part\":\"m\",\"front\":\"¿Un LLM \\\"entiende\\\" lo que dice?\",\"back\":\"No en el sentido humano. Manipula patrones estadísticos de tokens que, a escala, IMITAN comprensión.\\n\\nConsecuencias prácticas:\\n• Puede explicar un concepto bien y fallar una cuenta de tercer grado.\\n• Cambia de opinión si reordenas la pregunta.\\n• No tiene creencias ni intenciones; tiene una distribución de siguiente token.\\n\\nÚsalo como un colaborador brillante y poco fiable, no como una autoridad.\",\"topic\":\"Límites del modelo\",\"origin\":\"ai\",\"group\":\"Límites\",\"difficulty\":\"basic\"}]},\"deckEn\":{\"quizId\":\"fundamentals-inteligencia-artificial\",\"quizTitle\":\"AI fundamentals — From zero\",\"cardCount\":20,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🧠\",\"description\":\"What artificial intelligence is, how it differs from ML, and how generative models and LLMs actually work.\",\"cards\":[{\"id\":\"ai-que-es\",\"part\":\"m\",\"front\":\"What is artificial intelligence?\",\"back\":\"The field of making machines do tasks that, if a person did them, we would call intelligent: perceive, classify, translate, plan, converse.\\n\\nIt is not one technique. It includes hand-written rules, machine learning, robotics, search, and today a lot of deep learning and generative models.\\n\\nAnalogy: \\\"transport\\\" is not just the car; AI is not just ChatGPT.\",\"topic\":\"Inteligencia artificial\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-vs-ml-dl-gen\",\"part\":\"m\",\"front\":\"How do AI, ML, deep learning, and generative AI relate?\",\"back\":\"They are nested boxes, not rivals:\\n\\n• AI: the broad goal (machines that look intelligent).\\n• ML: one way to get there by LEARNING from data, not only rules.\\n• Deep learning: ML with deep neural networks.\\n• Generative AI: models that CREATE text, images, audio, or code (many are deep learning).\\n\\nAll GenAI is AI; not all AI is GenAI. A tree that predicts fraud is ML and AI, not generative.\",\"topic\":\"IA vs ML vs DL vs GenAI\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-estrecha-general\",\"part\":\"m\",\"front\":\"What is narrow AI (ANI) vs general AI (AGI)?\",\"back\":\"• Narrow AI: very good at ONE family of tasks (translate, detect cats, recommend videos). This is ALL we use today.\\n• AGI: a system with a person's flexibility on many new tasks. It does not exist in real products.\\n\\nAn LLM looks general because it talks about everything; underneath it is still a token predictor, not a mind. Do not confuse fluency with understanding.\",\"topic\":\"IA estrecha vs general\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-reglas-vs-aprender\",\"part\":\"m\",\"front\":\"How is a rule system different from one that learns?\",\"back\":\"• Rules (expert systems): a person writes \\\"if X and not Y, then Z\\\". Transparent, rigid, it breaks when the world does not fit the rules.\\n• Learning: the system fits parameters from examples. Flexible, opaque, it depends on data quality.\\n\\nToday they mix: a model predicts and a business rule has veto power (\\\"never approve if they are on the blacklist\\\").\",\"topic\":\"Reglas vs aprendizaje\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-discriminativo-generativo\",\"part\":\"m\",\"front\":\"What is a discriminative model vs a generative one?\",\"back\":\"• Discriminative: learns the boundary. \\\"Is this spam or not?\\\". It does not invent a new email.\\n• Generative: learns how something LOOKS or READS and can produce new examples (a paragraph, an image).\\n\\nA cat-photo classifier is discriminative. A model that draws a cat that never existed is generative. LLMs are generative: they produce the next token.\",\"topic\":\"Discriminativo vs generativo\",\"origin\":\"ai\",\"group\":\"Mapa del terreno\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-llm\",\"part\":\"m\",\"front\":\"What is an LLM (large language model)?\",\"back\":\"A huge network (almost always a Transformer) trained to predict the next piece of text on a gigantic pile of documents.\\n\\nFrom that simple training, skills emerge: summarize, translate, write code, follow instructions. It has no separate \\\"facts\\\" database: it has weights that make each continuation more or less likely.\\n\\nGemini, GPT, and Claude are LLMs. They are not search engines, though they are sometimes connected to one.\",\"topic\":\"LLM\",\"origin\":\"ai\",\"group\":\"Modelos de lenguaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-token\",\"part\":\"m\",\"front\":\"What is a token?\",\"back\":\"The unit of text the model actually sees: sometimes a word, sometimes a piece (\\\"program\\\" + \\\"ming\\\"), sometimes a symbol.\\n\\nThe model does not read single letters or \\\"understand paragraphs\\\": it processes a sequence of tokens. Price and context limits are measured in tokens, not words (an English word is often 1–2 tokens).\",\"topic\":\"Tokens\",\"origin\":\"ai\",\"group\":\"Modelos de lenguaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-next-token\",\"part\":\"m\",\"front\":\"What is an LLM doing when it \\\"writes\\\"?\",\"back\":\"It predicts the next token, appends it, and repeats. Over and over.\\n\\nIt does not plan the whole essay and then type it. That is why it sometimes contradicts itself halfway, and why the prompt (what is already written) so strongly conditions what comes next.\\n\\nAnalogy: phone autocomplete, trained at internet scale with more context.\",\"topic\":\"Siguiente token\",\"origin\":\"ai\",\"group\":\"Modelos de lenguaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-contexto\",\"part\":\"m\",\"front\":\"What is the context window?\",\"back\":\"How many tokens the model can \\\"see\\\" at once: the prompt + what it is generating.\\n\\nIf you overflow, the beginning is cut (or the system summarizes it). A long chat does not \\\"really remember\\\": it only sees what fits in that window, plus whatever the product injects again.\\n\\nMore context = more expensive and sometimes slower. It is not infinite memory.\",\"topic\":\"Ventana de contexto\",\"origin\":\"ai\",\"group\":\"Modelos de lenguaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-prompt\",\"part\":\"m\",\"front\":\"What is a prompt and why does it matter so much?\",\"back\":\"The text (and instructions) you give the model BEFORE it generates. It is the context that conditions the next token.\\n\\nA good prompt: a clear task, an output format, examples (few-shot), and constraints (\\\"if you do not know, say so\\\").\\n\\nIt is not verbal magic: it is designing the input of a predictor. Changing three words can change the result more than switching models.\",\"topic\":\"Prompt\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-temperatura\",\"part\":\"m\",\"front\":\"What does temperature do when generating text?\",\"back\":\"It controls how far the model may stray from the most likely token.\\n\\n• Low (0–0.3): more deterministic. Good for extraction, JSON, code, facts.\\n• High (0.8+): more variety. Good for brainstorming; worse for exactness.\\n\\nIt does not \\\"make the model smarter\\\". It only moves the sampling. For a factual answer, lower temperature and ground the prompt in sources.\",\"topic\":\"Temperatura\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-alucinacion\",\"part\":\"m\",\"front\":\"What is a hallucination in an LLM?\",\"back\":\"Fluent, convincing text that is not true: a made-up citation, an API that does not exist, an overconfident number.\\n\\nIt happens because the training goal is plausible continuation, not \\\"check against the world\\\". The model has no honesty switch.\\n\\nYou mitigate with: asking for sources, RAG, tools, low temperature, and NEVER trusting critical numbers/laws/code without review.\",\"topic\":\"Alucinación\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-embedding\",\"part\":\"m\",\"front\":\"What is an embedding, with an analogy?\",\"back\":\"A vector (list of numbers) that represents the meaning of a text, image, or user. Similar items sit CLOSE in that space.\\n\\nAnalogy: a map where \\\"king\\\" sits near \\\"queen\\\" and far from \\\"bicycle\\\". You do not read the numbers; you measure distances.\\n\\nUsed for search, recommendations, and clustering. It is the backbone of RAG and of many ML features.\",\"topic\":\"Embeddings\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-rag\",\"part\":\"m\",\"front\":\"What is RAG (retrieval-augmented generation)?\",\"back\":\"Before the LLM answers, you SEARCH for relevant chunks in YOUR documents (manuals, tickets, wiki) and paste them into the prompt.\\n\\n• The model did not \\\"memorize\\\" your company: it reads the excerpt at request time.\\n• It cuts hallucinations about private data and updates when docs change, with no retraining.\\n\\nNot magic: if search fetches the wrong chunk, the answer is wrong. Garbage in, eloquent garbage out.\",\"topic\":\"RAG\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-prompt-vs-finetune\",\"part\":\"m\",\"front\":\"When is a prompt enough, and when would you fine-tune?\",\"back\":\"• Prompt / few-shot / RAG: always first. Cheap, reversible, enough for tone, format, and facts from your docs.\\n• Fine-tuning: keep training the model on YOUR examples. Use it when the style or task repeats thousands of times and prompting is not enough.\\n\\nFine-tuning is not how you \\\"teach fresh facts\\\" (that is RAG). It is expensive and can make the model forget other skills.\",\"topic\":\"Prompting vs fine-tuning\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-agentes\",\"part\":\"m\",\"front\":\"What is an AI agent, beyond a chatbot?\",\"back\":\"A loop: the model picks a step, uses a TOOL (search, run code, call an API), sees the result, and picks the next step toward a goal.\\n\\nA chatbot only replies with text. An agent acts. The risk: each step can hallucinate a tool or an argument. You design them with limits (which APIs, how many steps, human approval).\",\"topic\":\"Agentes\",\"origin\":\"ai\",\"group\":\"Sistemas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-multimodal\",\"part\":\"m\",\"front\":\"What does it mean for a model to be multimodal?\",\"back\":\"It accepts or produces more than one kind of signal: text, image, audio, video.\\n\\n\\\"What is in this photo?\\\" or \\\"describe this chart\\\" are multimodal tasks. Internally, each modality becomes tokens or embeddings and the Transformer treats them together.\\n\\nIt still does not \\\"see\\\" like a person: it has an image encoder, not eyes.\",\"topic\":\"Multimodal\",\"origin\":\"ai\",\"group\":\"Sistemas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-sesgo-etica\",\"part\":\"m\",\"front\":\"Why can an AI system be unfair or unsafe?\",\"back\":\"It learns the biases of its data and objectives. If history discriminates, the model scales it with a neutral face.\\n\\nRisks: privacy (the prompt goes to a vendor), harmful content, blind reliance, and high-stakes decisions with no human.\\n\\nResponsible design: representative data, per-group evaluation, logs, a human veto on critical calls, and not putting an LLM where a verifiable fact is required.\",\"topic\":\"Sesgo y ética\",\"origin\":\"ai\",\"group\":\"Límites\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-cuando-no\",\"part\":\"m\",\"front\":\"When should you NOT use an AI model?\",\"back\":\"When a rule, a query, or a dashboard solves it: cheaper, more auditable.\\n\\nAlso not: if you need a 100% correct answer (dosage, balance, a verdict), if you have no data, or if nobody can review the output.\\n\\nThe useful question is not \\\"can I add AI?\\\". It is \\\"what breaks if the model is wrong 5% of the time, and who notices?\\\".\",\"topic\":\"Cuándo no usar IA\",\"origin\":\"ai\",\"group\":\"Límites\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-no-entiende\",\"part\":\"m\",\"front\":\"Does an LLM \\\"understand\\\" what it says?\",\"back\":\"Not in the human sense. It manipulates statistical token patterns that, at scale, IMITATE understanding.\\n\\nPractical consequences:\\n• It can explain a concept well and fail a third-grade sum.\\n• It changes its mind if you reorder the question.\\n• It has no beliefs or intentions; it has a next-token distribution.\\n\\nUse it as a brilliant, unreliable collaborator, not as an authority.\",\"topic\":\"Límites del modelo\",\"origin\":\"ai\",\"group\":\"Límites\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.
