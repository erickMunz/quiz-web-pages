s/%5Bid%5D/page-a39129091dc993ae.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"deckEs\":{\"quizId\":\"ruta-databricks-plataforma\",\"quizTitle\":\"Exam: Databricks — platform, ingestion and governance\",\"cardCount\":10,\"description\":\"From control plane to Unity Catalog: how Databricks keeps data in YOUR cloud, continuous vs. batch ingestion (Auto Loader, streaming, COPY INTO), quality with expectations and access with row filters/column masks. Checkpoints per stage and a practice exam at the end.\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"front\":\"El banco exige que los registros crudos de clientes NEVER salgan de su cuenta de nube, y aún así quiere que Databricks maneje notebooks, programación y clústeres. ¿Qué describe la arquitectura?\\n\\n(A) Todo se copia al control plane de Databricks para agilizar la creación de clústeres\\n(B) La localidad de datos no está garantizada: un private link es la única forma de contenerlos\\n(C) El data plane guarda los notebooks y definiciones de clúster, y el control plane sincroniza el storage\\n(D) El control plane maneja workspace, orquestación y metadatos; los datos crudos viven en el bucket del cliente y los clústeres del data plane (en la cuenta del cliente) son los únicos que los tocan\",\"back\":\"Decisión correcta: El control plane maneja workspace, orquestación y metadatos; los datos crudos viven en el bucket del cliente y los clústeres del data plane (en la cuenta del cliente) son los únicos que los tocan\\n\\nGana porque separa qué se comparte (metadatos, orchestration) y qué jamás sale (datos crudos), la separación EXACTA que exige el banco y la promesa real de la arquitectura.\\n\\nPista de examen: Control plane = cerebro (metadatos, orquestación); data plane = manos (clústeres en tu cuenta); los datos nunca salen de tu bucket.\\n\\nRespuesta del quiz: The control plane handles workspace, orchestration and metadata; raw data lives in the customer's bucket and the data-plane clusters (in the customer's account) are the only ones touching it\",\"topic\":\"arquitectura\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"1\"},\"tags\":[\"arquitectura\",\"seguridad\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"2\",\"part\":\"m\",\"front\":\"Miles de JSON por día desde el bucket hacia una tabla Delta, con llegadas continuas y archivos duplicados ocasionales. Cada JSON no debe procesarse más de una vez. ¿Cuál es la herramienta y por qué?\\n\\n(A) COPY INTO con programación por cron: su idempotencia evita las repeticiones\\n(B) Una tabla streaming con trigger AvailableNow y un dedup de postproceso\\n(C) Auto Loader (cloudFiles): rastrea el bucket incrementalmente, registra cada archivo procesado en el checkpoint y no lo vuelve a tomar — construido para llegadas continuas y crecientes\\n(D) Un CREATE TABLE AS SELECT sobre el bucket completo, corrido cada hora\",\"back\":\"Decisión correcta: Auto Loader (cloudFiles): rastrea el bucket incrementalmente, registra cada archivo procesado en el checkpoint y no lo vuelve a tomar — construido para llegadas continuas y crecientes\\n\\nGana porque el Auto Loader fue diseñado EXACTAMENTE para este patrón: exactly-once file semantics con checkpoint, escala al crecimiento y no necesita un cron.\\n\\nPista de examen: Llegadas continuas con duplicados = Auto Loader: es el default de ingesta incremental de Databricks.\\n\\nRespuesta del quiz: Auto Loader (cloudFiles): tracks the bucket incrementally, records every processed file in the checkpoint and never processes it twice — built for continuous, growing arrivals\",\"topic\":\"ingesta\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"2\"},\"tags\":[\"ingesta\",\"arquitectura\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"3\",\"part\":\"m\",\"front\":\"Una ingesta JSON con Auto Loader falla al toparla con un campo cuyo tipo cambia entre archivos (string en algunos, float en otros). El pipeline se detiene y el equipo pregunta: ¿qué configuración evita el topazÓN sin tirar los datos malos?\\n\\n(A) Fijar el esquema final a mano (schemaHints) y ejecutarlo\\n(B) schemaEvolutionMode con merge de nuevos campos + rescuedDataColumn (corruptedColumnName) para capturar TODOS los registros con tipos corruptos en una columna JSON bruta, sin detener el pipeline\\n(C) Cambiar el formato de lectura de JSON a CSV de un fixed schema en los archivos\\n(D) Reescribir el pipeline con Python para capturar la excepción de esquema por archivo y continuar\",\"back\":\"Decisión correcta: schemaEvolutionMode con merge de nuevos campos + rescuedDataColumn (corruptedColumnName) para capturar TODOS los registros con tipos corruptos en una columna JSON bruta, sin detener el pipeline\\n\\nGana porque combina las DOS palancas del Auto Loader: evolución de esquema absorbe los campos nuevos, y la columna rescate guarda los rows con tipos imposibles para revisarse sin parar la ingesta.\\n\\nPista de examen: El Auto Loader trae escape valves nativas: esquema evolutivo + columna de rescato — sin paradas y sin perder trazabilidad de lo raro.\\n\\nRespuesta del quiz: schemaEvolutionMode with merge of new fields + a rescuedDataColumn to capture ALL records with mismatched types into a raw JSON column, without stopping the pipeline\",\"topic\":\"ingesta\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"3\"},\"tags\":[\"ingesta\",\"evaluacion\"],\"difficulty\":\"advanced\"},{\"questionId\":\"4\",\"part\":\"m\",\"front\":\"Un analista necesita consultar la tabla de inventario TAL COMO estaba hace 30 días. La tabla Delta corre VACUUM con una retención default de 30 días. ¿Lo logra y por qué?\\n\\n(A) Sí: time travel (VERSION AS OF o TIMESTAMP AS OF) funciona con archivos ≥ retención; con la retención default (30 días), el análisis de hace 29 días funciona y el de 31 podría ya no\\n(B) No: una vez corrido VACUUM todas las versiones antiguas desaparecen y el time travel muere\\n(C) Sí como sea: el time travel de Delta guarda las versiones por SIEMPRE independientemente del VACUUM\\n(D) Solo con una reconstrucción manual del dataset y un pipeline nuevo: Delta no lo soporta\",\"back\":\"Decisión correcta: Sí: time travel (VERSION AS OF o TIMESTAMP AS OF) funciona con archivos ≥ retención; con la retención default (30 días), el análisis de hace 29 días funciona y el de 31 podría ya no\\n\\nGana porque une las dos piezas reales: time travel existe y es de una línea, PERO depende del retenció del VACUUM: pasado el retencíon los archivos viejos se eliminan y el snapshot ya no es reconstructible.\\n\\nPista de examen: El time travel existe hasta donde retiene el VACUUM: la ventana de auditoría se fija con la retención, no con esperanza.\\n\\nRespuesta del quiz: Yes: time travel (VERSION/TIMESTAMP AS OF) works within the retention; with the default (30 days), a 29-day-old query works and a 31-day-old query may not\",\"topic\":\"delta\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"4\"},\"tags\":[\"delta\",\"datos\"],\"difficulty\":\"basic\"},{\"questionId\":\"5\",\"part\":\"m\",\"front\":\"A cada rato, una empresa vende productos en línea por API: cada noche el sistema ERP exporta el ESTADO COMPLETO de productos (productos nuevos, precios cambiados, y productos descontinuados marcados) que debe reemplazar el estado de la tabla del catalogo online. ¿Qué patrón y por qué?\\n\\n(A) Auto Loader para los archivos del export nocturno\\n(B) Un job nocturno con MERGE completo (o streaming con replaceWhere de la ventana del día): la tabla del catalogo queda idéntica al estado del ERP al cierre del batch\\n(C) COPY INTO nocturno idempotente: procesará los archivos duplicados del día sin duplicarlos\\n(D) VACUUM diario sobre la tabla y recomenzar el pipeline: se limpia el estado viejo\",\"back\":\"Decisión correcta: Un job nocturno con MERGE completo (o streaming con replaceWhere de la ventana del día): la tabla del catalogo queda idéntica al estado del ERP al cierre del batch\\n\\nGana porque el patrón es REEMPLAZO idempotente del estado completo: MERGE (upsert) o replaceWhere de la ventana del export hacen la tabla idéntica al snapshot y dejan historial auditable en Delta.\\n\\nPista de examen: Estado completo que reemplaza cada noche = MERGE o replaceWhere (idempotente); ingesta incremental = Auto Loader. No son intercambiables.\\n\\nRespuesta del quiz: A nightly job with a full MERGE (or streaming with replaceWhere over the day's window): the catalog table ends matching the ERP state at batch close\",\"topic\":\"ingesta\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"5\"},\"tags\":[\"ingesta\",\"arquitectura\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"6\",\"part\":\"m\",\"front\":\"Un pipeline declarativo debe garantizar que NINGUNA orden con total negativo entre a la tabla gold; las filas inválidas deben descartarse y contarse, sin detener el pipeline y con métricas visibles. ¿Qué se define?\\n\\n(A) Un filtro WHERE en la consulta gold, sin métrica: las filas malas desaparecen silenciosamente\\n(B) Un try/except en el notebook que escribe los errores a una tabla de log\\n(C) Una expectativa (CONSTRAINT … EXPECT DROP INVALID ROWS) sobre el dataset: descarta las filas inválidas, las cuenta en las métricas y deja el pipeline corriendo\\n(D) Un retry del job con notificación al fallar\",\"back\":\"Decisión correcta: Una expectativa (CONSTRAINT … EXPECT DROP INVALID ROWS) sobre el dataset: descarta las filas inválidas, las cuenta en las métricas y deja el pipeline corriendo\\n\\nGana porque la expectativa es la herramienta declarativa EXACTA para esto: descarte + conteo + sin detenimiento, todo en una línea y auditable en las métricas del pipeline.\\n\\nPista de examen: Calidad por fila en pipelines declarativos = EXPECT … DROP INVALID ROWS: descarte, conteo y pipeline sano en una línea.\\n\\nRespuesta del quiz: An expectation (CONSTRAINT … EXPECT DROP INVALID ROWS) on the dataset: drops invalid rows, counts them in metrics, and keeps the pipeline running\",\"topic\":\"calidad\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"6\"},\"tags\":[\"calidad\",\"pipeline\"],\"difficulty\":\"intermediate\",\"related\":18},{\"questionId\":\"7\",\"part\":\"m\",\"front\":\"El equipo de seguridad exige: los soportes pueden leer la tabla clientes pero SOLO las filas de SU región y la columna email SIEMPRE oculta (solo Compliance la ve en claro). ¿Qué se implementa en Unity Catalog?\\n\\n(A) Dos tablas separadas (una por región) y una vista sin la columna email\\n(B) Grants SELECT solo sobre las columnas permitidas y un WHERE que los agentes escriben a mano\\n(C) Una vista dinámica que todos los agentes consultan, sin grants a la tabla\\n(D) Una row filter function que compara la región del usuario actual con la de la fila, más una column mask sobre el email que solo devuelve el valor al grupo Compliance\",\"back\":\"Decisión correcta: Una row filter function que compara la región del usuario actual con la de la fila, más una column mask sobre el email que solo devuelve el valor al grupo Compliance\\n\\nGana porque son las dos PRIMITIVAS EXACTAS de Unity Catalog para este caso: la row filter filtra filas por identidad, la mask se reescribe por rol; se declaran una vez y aplican a TODAS las consultas.\\n\\nPista de examen: En Unity Catalog, la política es del CATALOG: row filter por identidad y column mask por rol, sin duplicar tablas ni confiar en el WHERE manual.\\n\\nRespuesta del quiz: A row filter function comparing the current user's region with the row's, plus a column mask on email that returns the value only to the Compliance group\",\"topic\":\"seguridad\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"7\"},\"tags\":[\"seguridad\",\"arquitectura\"],\"difficulty\":\"advanced\",\"related\":22},{\"questionId\":\"8\",\"part\":\"m\",\"front\":\"Un job que junta una tabla de hechos de 2 TB con una dimensión de 40 GB corre por HORAS: la mayoría de tasks es rápido, pero unas cuantas tasks viven mucho más. ¿Causa probable y qué arregla de raíz?\\n\\n(A) El join no está distribuido: algunas keys del join concentran millones de filas (skew). El plan clásico lo separa con broadcast join de la dimensión (40 GB cab en memoria de cada ejecutor) o salting de las keys hot\\n(B) El clúster está subdimensionado: añadir más workers para que el job acabe más rápido\\n(C) El formato de lectura no es Delta: convertir a Delta lo acelera automáticamente\\n(D) La dimensión está muy indexada: hay que remover los índices para acelerar el join\",\"back\":\"Decisión correcta: El join no está distribuido: algunas keys del join concentran millones de filas (skew). El plan clásico lo separa con broadcast join de la dimensión (40 GB cab en memoria de cada ejecutor) o salting de las keys hot\\n\\nGana porque reconoce el patrón: pocas tasks lentas entre miles = skew de keys; broadcast join (dimensión cabe en memoria) elimina el shuffle del lado pesado, y el salting reparte las keys calientes.\\n\\nPista de examen: Pocas tasks lentas entre miles = skew de keys: broadcast la dimensión pequeña o salta las keys calientes; más workers no los reparte.\\n\\nRespuesta del quiz: The join is not balanced: a few keys concentrate millions of rows (skew). The classic fix broadcasts the dimension (40 GB fits each executor) or salts the hot keys\",\"topic\":\"rendimiento\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"8\"},\"tags\":[\"rendimiento\",\"datos\"],\"difficulty\":\"advanced\"},{\"questionId\":\"9\",\"part\":\"m\",\"front\":\"Un job nocturno batch y un analista trabajando INTERACTIVAMENTE ambos necesitan Spark. El equipo quiere minimizar el costo y simplificar. ¿Cuál es la elección correcta de cómputo?\\n\\n(A) Un clúster standard dedicado para el job y otro cláustro interactivo para el analista, con auto-escalado\\n(B) Serverless compute para ambos: el job nocturno corre sin clúster standby (paga por uso) y el analista obtiene arranque en segundos sin gestionar infraestructura\\n(C) Un cláustering standard clásico compartido y un SQL warehouse grande para el analista\\n(D) Un cláuster GPU para ambos: la capacidad extra evita los tiempos muertos\",\"back\":\"Decisión correcta: Serverless compute para ambos: el job nocturno corre sin clúster standby (paga por uso) y el analista obtiene arranque en segundos sin gestionar infraestructura\\n\\nGana porque separa las DOS necesidades: el batch por cuota nocturna (sin pagar clúster ocioso) y el analista por arranque inmediato, con cero administración de clústeres — el costo y la simplicidad que piden.\\n\\nPista de examen: Batch + interactivo = serverless: paga por uso, arranque inmediato y cero infraestructura para gestionar.\\n\\nRespuesta del quiz: Serverless compute for both: the nightly job runs without a standby cluster (pay-per-use) and the analyst gets seconds-fast startup with zero infrastructure management\",\"topic\":\"costo\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"9\"},\"tags\":[\"costo\",\"pipeline\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"10\",\"part\":\"m\",\"front\":\"El equipo de operaciones necesita un reporte diario: qué jobs fallaron, cuánto duraron las queries y quién leyó qué tabla. ¿Qué uso product de Unity Catalog (o Lakeflow) da esas tres cosas de una vez?\\n\\n(A) Lineage + audit logs + query history: tres pestañas, tres fuentes, montados con un pipeline propio\\n(B) Lakeflow/system tables del Unity Catalog (system.lakeflow, system.query.history, etc.): tablas listas para consultar con SQL que un job diario puede exportar al reporte\\n(C) Model serving: el monitoreo de endpoints cubre lo que piden\\n(D) Un pipeline con try/except que guarda logs a un bucket\",\"back\":\"Decisión correcta: Lakeflow/system tables del Unity Catalog (system.lakeflow, system.query.history, etc.): tablas listas para consultar con SQL que un job diario puede exportar al reporte\\n\\nGana porque las tablas de sistema son EXACTAMENTE eso: el registro estructurado de jobs, rendimiento de queries y accesos; el reporte es un SELECT diario, no un pipeline nuevo.\\n\\nPista de examen: Para observabilidad de plataforma, las system tables son el SELECT que ya está hecho: job runs, query history y audit de accesos.\\n\\nRespuesta del quiz: Lakeflow/system tables of Unity Catalog (system.lakeflow, system.query.history, etc.): query-ready tables a daily job can export into the report\",\"topic\":\"governance\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"10\"},\"tags\":[\"governance\",\"datos\"],\"difficulty\":\"intermediate\",\"related\":29}]},\"deckEn\":{\"quizId\":\"ruta-databricks-plataforma\",\"quizTitle\":\"Exam: Databricks — platform, ingestion and governance\",\"cardCount\":10,\"description\":\"From control plane to Unity Catalog: how Databricks keeps data in YOUR cloud, continuous vs. batch ingestion (Auto Loader, streaming, COPY INTO), quality with expectations and access with row filters/column masks. Checkpoints per stage and a practice exam at the end.\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The bank demands raw customer records NEVER leave its cloud account, yet wants Databricks to run notebooks, scheduling and clusters. What does the architecture do?\\n\\n(A) Everything is copied into Databricks' control plane to speed up cluster creation\\n(B) Data locality is not guaranteed; a private link is the only way to contain data\\n(C) The data plane stores notebooks and cluster definitions, and the control plane syncs storage\\n(D) The control plane handles workspace, orchestration and metadata; raw data lives in the customer's bucket and the data-plane clusters (in the customer's account) are the only ones touching it\",\"back\":\"Right call: The control plane handles workspace, orchestration and metadata; raw data lives in the customer's bucket and the data-plane clusters (in the customer's account) are the only ones touching it\\n\\nIt wins because it separates what is shared (metadata, orchestration) from what never leaves (raw data) — the EXACT separation the bank demands and the architecture's real promise.\\n\\nExam cue: Control plane = the brain (metadata, orchestration); data plane = the hands (clusters in your account); raw data never leaves your bucket.\\n\\nQuiz answer: The control plane handles workspace, orchestration and metadata; raw data lives in the customer's bucket and the data-plane clusters (in the customer's account) are the only ones touching it\",\"topic\":\"arquitectura\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"1\"},\"tags\":[\"arquitectura\",\"seguridad\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Thousands of JSON per day from the bucket into a Delta table, with continuous arrivals and occasional duplicate files. Each JSON must be processed at most once. Which tool, and why?\\n\\n(A) COPY INTO on a cron schedule: its idempotency avoids repeats\\n(B) A streaming table with an AvailableNow trigger and post-hoc dedup\\n(C) Auto Loader (cloudFiles): tracks the bucket incrementally, records every processed file in the checkpoint and never processes it twice — built for continuous, growing arrivals\\n(D) A CREATE TABLE AS SELECT over the whole bucket, run hourly\",\"back\":\"Right call: Auto Loader (cloudFiles): tracks the bucket incrementally, records every processed file in the checkpoint and never processes it twice — built for continuous, growing arrivals\\n\\nIt wins because Auto Loader was built EXACTLY for this pattern: exactly-once file semantics via checkpoint, scaling with growth, with no cron needed.\\n\\nExam cue: Continuous arrivals with duplicates = Auto Loader: Databricks' incremental default.\\n\\nQuiz answer: Auto Loader (cloudFiles): tracks the bucket incrementally, records every processed file in the checkpoint and never processes it twice — built for continuous, growing arrivals\",\"topic\":\"ingesta\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"2\"},\"tags\":[\"ingesta\",\"arquitectura\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A JSON Auto Loader ingestion fails when a field's type differs between files (string in some, float in others). The pipeline stops. What configuration avoids the hard stop without losing the bad rows?\\n\\n(A) Pin the schema by hand (schemaHints) and just run it\\n(B) schemaEvolutionMode with merge of new fields + a rescuedDataColumn to capture ALL records with mismatched types into a raw JSON column, without stopping the pipeline\\n(C) Switch the read format from JSON to CSV with a fixed schema in the files\\n(D) Rewrite the pipeline in Python to catch the schema exception per file and continue\",\"back\":\"Right call: schemaEvolutionMode with merge of new fields + a rescuedDataColumn to capture ALL records with mismatched types into a raw JSON column, without stopping the pipeline\\n\\nIt wins because it pairs Auto Loader's TWO levers: schema evolution absorbs new fields, and the rescued column holds rows with impossible types for review, non-stop.\\n\\nExam cue: Auto Loader ships native escape valves: schema evolution + a rescued column — no stops and no losing trace of the weird ones.\\n\\nQuiz answer: schemaEvolutionMode with merge of new fields + a rescuedDataColumn to capture ALL records with mismatched types into a raw JSON column, without stopping the pipeline\",\"topic\":\"ingesta\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"3\"},\"tags\":[\"ingesta\",\"evaluacion\"],\"difficulty\":\"advanced\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"An analyst needs to query the inventory table AS IT WAS 30 days ago. The Delta table runs VACUUM with the default 30-day retention. Can they, and why?\\n\\n(A) Yes: time travel (VERSION/TIMESTAMP AS OF) works within the retention; with the default (30 days), a 29-day-old query works and a 31-day-old query may not\\n(B) No: once VACUUM runs, all old versions vanish and time travel dies\\n(C) Yes, unconditionally: Delta's time travel keeps versions forever regardless of VACUUM\\n(D) Only with a manual dataset rebuild and a new pipeline: Delta does not support it\",\"back\":\"Right call: Yes: time travel (VERSION/TIMESTAMP AS OF) works within the retention; with the default (30 days), a 29-day-old query works and a 31-day-old query may not\\n\\nIt wins because it joins the two real pieces: time travel exists and is one line, BUT it depends on VACUUM retention; past retention the old files are gone and the snapshot is unreconstructible.\\n\\nExam cue: Time travel reaches as far as VACUUM retention: audit windows are set by retention, not hope.\\n\\nQuiz answer: Yes: time travel (VERSION/TIMESTAMP AS OF) works within the retention; with the default (30 days), a 29-day-old query works and a 31-day-old query may not\",\"topic\":\"delta\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"4\"},\"tags\":[\"delta\",\"datos\"],\"difficulty\":\"basic\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"An online retailer's ERP exports the FULL product state nightly (new products, price changes, discontinued flagged) and the online catalog table must end up matching it. Which pattern and why?\\n\\n(A) Auto Loader for the nightly export files\\n(B) A nightly job with a full MERGE (or streaming with replaceWhere over the day's window): the catalog table ends matching the ERP state at batch close\\n(C) Idempotent nightly COPY INTO: it processes the day's repeated files without duplicating them\\n(D) Daily VACUUM on the table and a pipeline restart: the old state is cleaned\",\"back\":\"Right call: A nightly job with a full MERGE (or streaming with replaceWhere over the day's window): the catalog table ends matching the ERP state at batch close\\n\\nIt wins because the pattern is IDEMPOTENT full-state replace: MERGE (upsert) or replaceWhere over the export window makes the table match the snapshot and leaves Delta's auditable history.\\n\\nExam cue: Full state nightly = MERGE or replaceWhere (idempotent); incremental arrivals = Auto Loader. They are not interchangeable.\\n\\nQuiz answer: A nightly job with a full MERGE (or streaming with replaceWhere over the day's window): the catalog table ends matching the ERP state at batch close\",\"topic\":\"ingesta\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"5\"},\"tags\":[\"ingesta\",\"arquitectura\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A declarative pipeline must guarantee NO order with a negative total reaches the gold table; invalid rows must be dropped and counted, without stopping the pipeline, with visible metrics. What gets defined?\\n\\n(A) A WHERE filter on the gold query, no metric: bad rows vanish silently\\n(B) A notebook try/except writing errors to a log table\\n(C) An expectation (CONSTRAINT … EXPECT DROP INVALID ROWS) on the dataset: drops invalid rows, counts them in metrics, and keeps the pipeline running\\n(D) A job-level retry with failure notification\",\"back\":\"Right call: An expectation (CONSTRAINT … EXPECT DROP INVALID ROWS) on the dataset: drops invalid rows, counts them in metrics, and keeps the pipeline running\\n\\nIt wins because an expectation is the EXACT declarative tool for this: drop + count + no stop, one line, auditable in the pipeline's metrics.\\n\\nExam cue: Per-row quality in declarative pipelines = EXPECT … DROP INVALID ROWS: drop, count, healthy pipeline — one line.\\n\\nQuiz answer: An expectation (CONSTRAINT … EXPECT DROP INVALID ROWS) on the dataset: drops invalid rows, counts them in metrics, and keeps the pipeline running\",\"topic\":\"calidad\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"6\"},\"tags\":[\"calidad\",\"pipeline\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The security team demands: support may read customers but ONLY their own region's rows, and the email column ALWAYS hidden (only Compliance sees it in clear). What goes into Unity Catalog?\\n\\n(A) Two separate tables (one per region) and a view without the email column\\n(B) SELECT grants on the allowed columns and a WHERE clause the agents hand-write\\n(C) A dynamic view all agents query, with no grants to the table\\n(D) A row filter function comparing the current user's region with the row's, plus a column mask on email that returns the value only to the Compliance group\",\"back\":\"Right call: A row filter function comparing the current user's region with the row's, plus a column mask on email that returns the value only to the Compliance group\\n\\nIt wins because those are Unity Catalog's two EXACT primitives for this: the row filter selects rows by identity, the mask rewrites the column by role; declared once, they apply to ALL queries.\\n\\nExam cue: In Unity Catalog the policy lives in the CATALOG: row filter by identity, column mask by role — no duplicated tables and no trust in hand-written WHEREs.\\n\\nQuiz answer: A row filter function comparing the current user's region with the row's, plus a column mask on email that returns the value only to the Compliance group\",\"topic\":\"seguridad\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"7\"},\"tags\":[\"seguridad\",\"arquitectura\"],\"difficulty\":\"advanced\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"8\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A job joining a 2 TB fact table with a 40 GB dimension runs for HOURS: most tasks finish fast, but a few drag on. Likely cause and the real fix?\\n\\n(A) The join is not balanced: a few keys concentrate millions of rows (skew). The classic fix broadcasts the dimension (40 GB fits each executor) or salts the hot keys\\n(B) The cluster is undersized: add more workers so the job finishes faster\\n(C) The read format is not Delta: converting to Delta speeds it up automatically\\n(D) The dimension is heavily indexed: removing indexes speeds up the join\",\"back\":\"Right call: The join is not balanced: a few keys concentrate millions of rows (skew). The classic fix broadcasts the dimension (40 GB fits each executor) or salts the hot keys\\n\\nIt wins because it names the pattern: a few slow tasks among thousands = key skew; broadcast join (the dimension fits memory) kills the shuffle on the heavy side, and salting spreads hot keys.\\n\\nExam cue: A few slow tasks among thousands = key skew: broadcast the small dimension or salt the hot keys; more workers does not spread them.\\n\\nQuiz answer: The join is not balanced: a few keys concentrate millions of rows (skew). The classic fix broadcasts the dimension (40 GB fits each executor) or salts the hot keys\",\"topic\":\"rendimiento\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"8\"},\"tags\":[\"rendimiento\",\"datos\"],\"difficulty\":\"advanced\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"9\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A nightly batch job and an analyst working INTERACTIVELY both need Spark. The team wants the lowest cost with the simplest operation. Which compute choice?\\n\\n(A) Two dedicated standard clusters, one for the job and one interactive, both auto-scaling\\n(B) Serverless compute for both: the nightly job runs without a standby cluster (pay-per-use) and the analyst gets seconds-fast startup with zero infrastructure management\\n(C) One shared classic cluster and a large SQL warehouse for the analyst\\n(D) One GPU cluster for both: extra capacity avoids idle time\",\"back\":\"Right call: Serverless compute for both: the nightly job runs without a standby cluster (pay-per-use) and the analyst gets seconds-fast startup with zero infrastructure management\\n\\nIt wins because it serves BOTH needs: batch billed per use (no idle cluster) and instant analyst startup, with zero cluster admin — the cost and simplicity they asked for.\\n\\nExam cue: Batch + interactive = serverless: pay-per-use, instant startup, zero infrastructure to manage.\\n\\nQuiz answer: Serverless compute for both: the nightly job runs without a standby cluster (pay-per-use) and the analyst gets seconds-fast startup with zero infrastructure management\",\"topic\":\"costo\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"9\"},\"tags\":[\"costo\",\"pipeline\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-databricks-plataforma\"},{\"questionId\":\"10\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The operations team needs a daily report: which jobs failed, how long queries took, and who read which table. Which Unity Catalog (or Lakeflow) product surfaces all three at once?\\n\\n(A) Lineage + audit logs + query history: three tabs, three sources, assembled by a custom pipeline\\n(B) Lakeflow/system tables of Unity Catalog (system.lakeflow, system.query.history, etc.): query-ready tables a daily job can export into the report\\n(C) Model serving: endpoint monitoring covers the ask\\n(D) A custom pipeline with try/except writing logs to a bucket\",\"back\":\"Right call: Lakeflow/system tables of Unity Catalog (system.lakeflow, system.query.history, etc.): query-ready tables a daily job can export into the report\\n\\nIt wins because system tables are EXACTLY that: the structured record of jobs, query performance and access; the report is a daily SELECT, not a new pipeline.\\n\\nExam cue: For platform observability, system tables are the SELECT already written: job runs, query history, and access audit.\\n\\nQuiz answer: Lakeflow/system tables of Unity Catalog (system.lakeflow, system.query.history, etc.): query-ready tables a daily job can export into the report\",\"topic\":\"governance\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-databricks-plataforma\",\"questionId\":\"10\"},\"tags\":[\"governance\",\"datos\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-databricks-plataforma\"}]},\"flows\":[]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
