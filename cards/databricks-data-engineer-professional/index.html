ng: traducir el cuerpo de esta tarjeta en cards-en.json]"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Ld\",null,{\"deckEs\":{\"quizId\":\"databricks-data-engineer-professional\",\"quizTitle\":\"Databricks Certified Data Engineer Professional\",\"cards\":[{\"id\":\"2::m\",\"questionId\":\"2\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa DBFS?\",\"back\":\"$e\",\"topic\":\"DBFS\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"2\"}},{\"id\":\"2::c2\",\"questionId\":\"2\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Unity Catalog?\",\"back\":\"Moving the wheel to a workspace file or Unity Catalog volume path is the supported replacement location.B. (Respuesta correcta: Point the bundle's `whl` library entry at a workspace file or Unity Catalog volume path, since storing library files in the DBFS root is deprecated and disabled by default on Databricks Runtime 15.1 and above.)\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"2\"}},{\"id\":\"3::m\",\"questionId\":\"3\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Declaring the variable once and overriding it per target is the intended pattern for values that should dif…\\\"?\",\"back\":\"$f\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"3\"}},{\"id\":\"4::m\",\"questionId\":\"4\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa API?\",\"back\":\"A. This correctly describes the rebrand: `pyspark.pipelines`, imported as `dp`, is the current recommended API, replacing the `@table`/`@view` decorators formerly imported from `dlt`, while existing `dlt`-based pipeline code continues to run without any required migration.B. The `dlt` module was not removed and existing pipelines built with `import dlt` continue to run without modification; Databricks recommends adopting the new names going forward, but no rewrite is required for old code to keep working.C. The decorator rename did not introduce a new physical dataset type; `@dlt.table` and `@dp.table` are the old and new names for the same underlying streaming-table concept, so mixing them does not produce two independent copies of a table. (Respuesta correcta: The `dlt` module is replaced by `pyspark.pipelines`, commonly imported as `dp`; existing `import dlt` pipeline code keeps running unchanged, but Databricks recommends migrating to `dp` decorators such as `@dp.table`.)\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"4\"}},{\"id\":\"4::c2\",\"questionId\":\"4\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa SQL?\",\"back\":\"The distinction between `dlt` and `pyspark.pipelines` is not a SQL-versus-Python split; both relate to the Python API naming, and SQL pipeline definitions are a separate, unaffected syntax, so this description misstates the change entirely.D. (Respuesta correcta: The `dlt` module is replaced by `pyspark.pipelines`, commonly imported as `dp`; existing `import dlt` pipeline code keeps running unchanged, but Databricks recommends migrating to `dp` decorators such as `@dp.table`.)\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"4\"}},{\"id\":\"5::m\",\"questionId\":\"5\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Materialized views recompute results as needed against the current state of the source, which is useful for…\\\"?\",\"back\":\"$10\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"5\"}},{\"id\":\"6::m\",\"questionId\":\"6\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa Lakeflow Jobs?\",\"back\":\"A. Standard performance mode exists for Lakeflow Jobs and Lakeflow Spark Declarative Pipelines, but it is not offered as a selectable option for serverless notebooks, so this evaluation misstates what's configurable.B. Serverless compute does support notebooks as one of its core workload types, so claiming notebooks require classic compute misrepresents the platform's current capabilities.D. The memory tier and the performance mode are independent settings in the notebook's Environment panel, so enabling High memory has no bearing on which performance mode is selectable. (Respuesta correcta: The suggestion cannot be applied, because serverless notebooks only support Performance Optimized mode, built for low-latency, always-warm interactive sessions.)\",\"topic\":\"Lakeflow Jobs\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"6\"}},{\"id\":\"6::c2\",\"questionId\":\"6\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Performance Optimized?\",\"back\":\"Serverless notebooks are restricted to Performance Optimized mode precisely because interactive sessions need warm, low-latency compute, which correctly explains why the teammate's suggestion isn't something the analyst can turn on.C. (Respuesta correcta: The suggestion cannot be applied, because serverless notebooks only support Performance Optimized mode, built for low-latency, always-warm interactive sessions.)\",\"topic\":\"Performance Optimized\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"6\"}},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Append mode only writes new rows that will never change again, such as finalized windows once the watermark…\\\"?\",\"back\":\"A. Update mode writes only the rows whose aggregate value changed since the last trigger, which is more efficient than a full rewrite but is not what this description asks for.B. Complete mode rewrites the entire result table to the sink after every trigger, which requires retaining full aggregation state indefinitely and matches the behavior described.C. Continuous is a low-latency processing mode, not an output mode, so it does not fit alongside append, update, and complete as an answer to this question.D. Append mode only writes new rows that will never change again, such as finalized windows once the watermark has passed, and it does not rewrite the full result table on each trigger.\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"7\"}},{\"id\":\"9::m\",\"questionId\":\"9\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa USE?\",\"back\":\"A. `USE CONNECTION` lets a principal query through catalogs that reference the connection without exposing the stored host, port, or secret values, and scoping `USE CATALOG`/`SELECT` to just one foreign catalog per group keeps each group limited to its assigned data without letting any group create new catalogs.B. (Respuesta correcta: Grant `USE CONNECTION` on the connection to each group, then grant `USE CATALOG` plus `SELECT` on just the one foreign catalog assigned to that group.)\",\"topic\":\"USE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"9\"}},{\"id\":\"9::c2\",\"questionId\":\"9\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa CREATE?\",\"back\":\"Granting `CREATE FOREIGN CATALOG` would let every group independently create catalogs from the shared connection, which violates the requirement that only the admin controls how many foreign catalogs exist.C. `ALL PRIVILEGES` on the connection includes catalog-creation and ownership-transfer rights well beyond read access, and connection-level options such as the stored credential remain outside what any grant exposes to a non-owner querying through it, but the privilege scope here is far broader than required and risky to hand to three separate groups.D. (Respuesta correcta: Grant `USE CONNECTION` on the connection to each group, then grant `USE CATALOG` plus `SELECT` on just the one foreign catalog assigned to that group.)\",\"topic\":\"CREATE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"9\"}},{\"id\":\"9::c3\",\"questionId\":\"9\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa OWNER?\",\"back\":\"Transferring `OWNER` hands full control of the connection, including the ability to alter its credentials and drop it, to a group member — a much larger blast radius than the read-only, catalog-scoped access the scenario calls for. (Respuesta correcta: Grant `USE CONNECTION` on the connection to each group, then grant `USE CATALOG` plus `SELECT` on just the one foreign catalog assigned to that group.)\",\"topic\":\"OWNER\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"9\"}},{\"id\":\"10::m\",\"questionId\":\"10\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa SQL?\",\"back\":\"A. SQL Server's change tracking and CDC features are only available against the primary instance; secondary replicas cannot serve as a CDC source, so the connector must be pointed at the primary regardless of its available capacity.B. Lakeflow Connect supports SQL Server across on-premises deployments, EC2, Azure VMs, Azure SQL, and Amazon RDS, so the connector is not restricted to Azure-hosted deployments.C. Network reachability is a separate concern from CDC support; even with working connectivity, change tracking and CDC simply are not exposed on secondary replicas. (Respuesta correcta: Change tracking and CDC are not supported on SQL Server read replicas, so the connector must point at the primary instance instead.)\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"10\"},\"related\":12},{\"id\":\"10::c2\",\"questionId\":\"10\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa CDC?\",\"back\":\"Authentication is handled through the Unity Catalog connection's stored credentials and is independent of whether the target instance is primary or secondary; the failure here is about CDC support, not authentication.D. (Respuesta correcta: Change tracking and CDC are not supported on SQL Server read replicas, so the connector must point at the primary instance instead.)\",\"topic\":\"CDC\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"10\"}},{\"id\":\"11::m\",\"questionId\":\"11\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa JSON?\",\"back\":\"A. This path string omits the required `.` immediately after the leading `$` root marker, which makes it a malformed JSON path rather than an equivalent way of expressing the same navigation.B. This path wraps the `bicycle` key in unquoted brackets as if it were a variable or index rather than a field name, which does not correctly express navigating into the `bicycle` object key.C. This path string mirrors the shorthand exactly: it navigates into the `store` object, then `bicycle`, indexes the first array element, and finally reads `price`, matching the intended nested lookup field for field.D. This path swaps the array index and the field name, indexing into `price` rather than into `bicycle`, so it does not describe the same nested location as the original shorthand expression. (Respuesta correcta: `variant_get(raw, '$.store.bicycle[0].price')`)\",\"topic\":\"JSON\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"11\"}},{\"id\":\"13::m\",\"questionId\":\"13\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa STRING?\",\"back\":\"A. Foundation model endpoints take a single STRING request; concatenating an explicit instruction with the column value produces a prompt the model can act on to return a sentiment label.B. A named_struct request is the pattern for custom model-serving endpoints that expose named input features; pay-per-token foundation model endpoints expect a plain STRING prompt, so this call would not classify correctly.C. Passing the raw column value with no instruction text gives the model nothing to classify against, so even though the returnType and failOnError syntax is valid, the model has no directive to produce a sentiment label.D. `model_input` is not a recognized ai_query parameter name; ai_query's parameters are `endpoint` and `request`, so this call raises an error rather than running. (Respuesta correcta: `ai_query('system.ai/llama-4-70b', 'Classify sentiment as positive, negative, or neutral: ' || ticket_text) AS sentiment`)\",\"topic\":\"STRING\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"13\"}},{\"id\":\"14::m\",\"questionId\":\"14\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa ROLLUP?\",\"back\":\"A. Correct. `ROLLUP (region, product_category)` produces the full detail grouping, then a subtotal per `region` (dropping `product_category`), then a single grand total, matching the hierarchical requirement described without needing a `product_category`-only subtotal.B. Workable but not the right construct here. Manually unioning three separately grouped queries can reproduce the same rows, but it requires three separate scans and aggregations and more code than the purpose-built rollup syntax designed for exactly this hierarchical subtotal pattern.D. Incorrect. (Respuesta correcta: `GROUP BY ROLLUP (region, product_category)`, which produces the detail-level groups plus subtotals for `region` and a grand total, following the hierarchical order of the listed columns.)\",\"topic\":\"ROLLUP\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"14\"}},{\"id\":\"14::c2\",\"questionId\":\"14\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa CUBE?\",\"back\":\"Incorrect for this requirement. `CUBE` also produces a `product_category`-only subtotal (with region dropped) that was not requested, so it returns a superset of the needed groupings rather than the specific hierarchical set the report calls for.C. (Respuesta correcta: `GROUP BY ROLLUP (region, product_category)`, which produces the detail-level groups plus subtotals for `region` and a grand total, following the hierarchical order of the listed columns.)\",\"topic\":\"CUBE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"14\"}},{\"id\":\"15::m\",\"questionId\":\"15\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa SKU?\",\"back\":\"$11\",\"topic\":\"SKU\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"15\"}},{\"id\":\"16::m\",\"questionId\":\"16\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa API?\",\"back\":\"A. Publishing the event log to a visible catalog table is an optional convenience for governed access, not a prerequisite for querying it, so this adds an unnecessary configuration step.B. `system.lakeflow.pipelines` holds pipeline-level metadata for billing and auditing rather than per-flow progress or expectation metrics, so it cannot answer this event-level question.C. The Jobs API reports task and run status for jobs, not the flow-level `data_quality` metrics that only appear inside the pipeline event log's `flow_progress` events.D. The `event_log()` table-valued function reads the pipeline's default hidden event log table by pipeline ID with no advance setup, which matches the no-configuration-change requirement. (Respuesta correcta: Run `SELECT * FROM event_log('\u003cpipeline_id\u003e')` in a notebook attached to a cluster or SQL warehouse, reading the pipeline's hidden Delta event log table directly by ID.)\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"16\"},\"related\":18},{\"id\":\"18::m\",\"questionId\":\"18\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. This table records per-task duration metrics for every job, and is the recommended source for multi-task jo…\\\"?\",\"back\":\"A. This table holds job-level metadata like trigger type and schedule, not per-task or per-run duration figures, so it does not answer the reporting question.B. This table records per-task duration metrics for every job, and is the recommended source for multi-task jobs since it captures each task's own setup, queue, and execution duration.C. Its duration columns are documented as populated only for single-task jobs; for a multi-task job it does not give reliable per-task figures, so it does not satisfy the requirement.D. This table tracks task configuration such as dependencies and timeouts, not run-time duration metrics, so it cannot produce the requested average execution and queue times. (Respuesta correcta: `system.lakeflow.job_task_run_timeline`, since it records per-task duration columns for both single-task and multi-task jobs.)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"18\"}},{\"id\":\"19::m\",\"questionId\":\"19\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa SQL?\",\"back\":\"A. Healthy and Unhealthy are the status labels used by Lakehouse Monitoring anomaly detection for table health badges, not the status vocabulary used by SQL alerts themselves.B. SQL alerts do not have a manual-acknowledgement Pending/Resolved workflow; their status is derived automatically from evaluating the query condition on each scheduled run.C. The current alert editor evaluates each alert to OK, Triggered, or Error, and it explicitly no longer supports the Unknown status that legacy alerts used. This is the correct, up-to-date status model for monitoring governed metrics.D. Unknown was part of the legacy alert status model, not the current one. Carrying that assumption forward after a migration to the new editor leads teams to misinterpret alert history. (Respuesta correcta: Alerts now report status as one of OK, Triggered, or Error, and the previously used Unknown status has been removed from the evaluation model.)\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"19\"},\"related\":19},{\"id\":\"20::m\",\"questionId\":\"20\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa OPTIMIZE?\",\"back\":\"$12\",\"topic\":\"OPTIMIZE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"20\"}},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"front\":\"¿Para qué se usa ORDER.D?\",\"back\":\"A. Partitioning by a high-cardinality, skewed column like `customer_id` creates an excessive number of small partitions, which drives up file-listing overhead and small-file problems instead of fixing the rewrite cost.C. Liquid clustering with `customer_id` declared as a key incrementally maintains the layout as new data arrives, avoiding the full-table rewrite cost that a growing skewed table incurs under Z-ORDER.D. Given how heavily queries filter on `customer_id`, automatic clustering would likely select that same column as a key rather than avoid it, so this does not describe expected behavior. (Respuesta correcta: Recreate the table with `CLUSTER BY (customer_id)` so the file layout is maintained incrementally as the skewed data grows.)\",\"topic\":\"ORDER.D\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"21\"}},{\"id\":\"21::c2\",\"questionId\":\"21\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa ORDER?\",\"back\":\"Adding a second Z-ORDER column does not solve the underlying cost problem, since a Z-ORDER `OPTIMIZE` still rewrites the full set of touched files on every run regardless of how many columns are listed.B. (Respuesta correcta: Recreate the table with `CLUSTER BY (customer_id)` so the file layout is maintained incrementally as the skewed data grows.)\",\"topic\":\"ORDER\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"21\"}},{\"id\":\"24::m\",\"questionId\":\"24\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa ALL?\",\"back\":\"A. `CREATE TABLE` is included when `ALL PRIVILEGES` is granted on a schema, since it is one of the ordinary creation privileges the grant is meant to bundle together.B. `USE SCHEMA` is included when `ALL PRIVILEGES` is granted, since usage on the schema itself is one of the baseline privileges the bundled grant covers.C. `ALL PRIVILEGES` grants every applicable privilege on the schema except a small set of administrative privileges, and `MANAGE` (along with `READ METADATA`, `EXTERNAL USE SCHEMA`, and `EXTERNAL USE LOCATION`) is deliberately excluded so that broad data grants do not automatically hand out administrative control.D. `SELECT` is a standard data-access privilege and is included when `ALL PRIVILEGES` is granted on a schema, so it does not need to be granted separately. (Respuesta correcta: `MANAGE`, which controls the ability to change permissions, transfer ownership, or delete the schema, and is intentionally excluded from `ALL PRIVILEGES` grants.)\",\"topic\":\"ALL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"24\"}},{\"id\":\"26::m\",\"questionId\":\"26\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa Unity Catalog?\",\"back\":\"A. This matches how the two mechanisms are defined: a row filter is a function returning a boolean that hides whole rows failing the condition, while a column mask is a function that substitutes or transforms the value shown for one column, leaving the row present.B. This swaps the two mechanisms' actual behavior — row filters act on whole rows and column masks act on individual column values, not the other way around as this option describes.C. Row filters and column masks are not restricted to only streaming tables versus only batch tables; both mechanisms can be applied across the table types Unity Catalog supports for this feature, so this distinction does not hold.D. (Respuesta correcta: A row filter is a function evaluated per row that excludes the row from the result set when it returns `false`, while a column mask is a function that transforms the value of one column, leaving the row itself present.)\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"26\"},\"related\":23},{\"id\":\"26::c2\",\"questionId\":\"26\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Delta Sharing?\",\"back\":\"Both row filters and column masks are query-time controls evaluated when a table is read, not one-time write-time transformations or controls limited to Delta Sharing access paths. (Respuesta correcta: A row filter is a function evaluated per row that excludes the row from the result set when it returns `false`, while a column mask is a function that transforms the value of one column, leaving the row itself present.)\",\"topic\":\"Delta Sharing\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"26\"}},{\"id\":\"27::m\",\"questionId\":\"27\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa NULL?\",\"back\":\"$13\",\"topic\":\"NULL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"27\"}},{\"id\":\"31::m\",\"questionId\":\"31\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa JVM?\",\"back\":\"A. The Executors tab exposes a Thread Dump link per executor that captures a live snapshot of every thread's stack trace and state on that JVM, which is exactly the mechanism designed for identifying where a specific executor is stuck.B. A task-level Logs link streams stdout/stderr application log lines for that task, but log output only shows what the code explicitly printed; it does not capture the live thread stack state needed to see exactly where execution is currently blocked.C. (Respuesta correcta: Open the Executors tab, locate the row for that executor's ID, and click the link in its Thread Dump column to capture a snapshot of every thread's current state.)\",\"topic\":\"JVM\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"31\"}},{\"id\":\"31::c3\",\"questionId\":\"31\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa DAG?\",\"back\":\"The DAG visualization on the Jobs tab shows stage dependencies and progress, and hovering over a node does not surface per-executor CPU/memory gauges or thread stack traces for diagnosing a hang. (Respuesta correcta: Open the Executors tab, locate the row for that executor's ID, and click the link in its Thread Dump column to capture a snapshot of every thread's current state.)\",\"topic\":\"DAG\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"31\"}},{\"id\":\"32::m\",\"questionId\":\"32\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa API?\",\"back\":\"A. The Jobs API manages job definitions and runs; it is not the interface used to authenticate or synchronize a Git folder with a remote repository, so switching to it would not resolve an authentication failure. (Respuesta correcta: Generate an Azure DevOps personal access token, since Databricks Git folders do not accept Microsoft Entra ID tokens for this integration.)\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"32\"},\"related\":27},{\"id\":\"32::c2\",\"questionId\":\"32\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Azure DevOps?\",\"back\":\"Azure DevOps is a documented exception: Databricks Git folders require an Azure DevOps personal access token for this integration and do not accept Microsoft Entra ID tokens, unlike the OAuth flow available for providers such as GitHub.B. (Respuesta correcta: Generate an Azure DevOps personal access token, since Databricks Git folders do not accept Microsoft Entra ID tokens for this integration.)\",\"topic\":\"Azure DevOps\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"32\"}},{\"id\":\"32::c3\",\"questionId\":\"32\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa GitHub?\",\"back\":\"The cloud the workspace runs on does not determine which Git providers it can integrate with; Azure-hosted workspaces can link to GitHub, GitLab, Bitbucket, and other supported providers just as workspaces on other clouds can.C. (Respuesta correcta: Generate an Azure DevOps personal access token, since Databricks Git folders do not accept Microsoft Entra ID tokens for this integration.)\",\"topic\":\"GitHub\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"32\"}},{\"id\":\"33::m\",\"questionId\":\"33\",\"part\":\"m\",\"front\":\"¿Para qué se usa ID.C?\",\"back\":\"A. A `lookup` block resolves an object's ID by looking it up by name in the workspace; it solves a different problem than supplying a caller-chosen literal value per run and would not let CI inject an arbitrary ID.C. A committed overrides file is lower precedence than an environment variable in the CLI's resolution order, and it would also require a file edit and commit on every run, which the requirement explicitly rules out. (Respuesta correcta: Export an environment variable named `BUNDLE_VAR_warehouse_id` set to the desired ID before invoking `databricks bundle deploy`, since CLI variable resolution checks that environment prefix ahead of the declared default.)\",\"topic\":\"ID.C\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"33\"}},{\"id\":\"33::c2\",\"questionId\":\"33\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa BUNDLE_VAR_?\",\"back\":\"The `BUNDLE_VAR_\u003cname\u003e` environment variable convention is read by the CLI ahead of a variable's declared default, so exporting it per CI run supplies a fresh warehouse ID each time without touching any committed file.B. (Respuesta correcta: Export an environment variable named `BUNDLE_VAR_warehouse_id` set to the desired ID before invoking `databricks bundle deploy`, since CLI variable resolution checks that environment prefix ahead of the declared default.)\",\"topic\":\"BUNDLE_VAR_\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"33\"}},{\"id\":\"33::c3\",\"questionId\":\"33\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa CLI?\",\"back\":\"The `--profile` flag selects a named Databricks CLI authentication profile; it does not accept key-value pairs for overriding bundle variables, so this would not affect `warehouse_id` at all.D. (Respuesta correcta: Export an environment variable named `BUNDLE_VAR_warehouse_id` set to the desired ID before invoking `databricks bundle deploy`, since CLI variable resolution checks that environment prefix ahead of the declared default.)\",\"topic\":\"CLI\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"33\"}},{\"id\":\"34::m\",\"questionId\":\"34\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa TRIGGER?\",\"back\":\"$14\",\"topic\":\"TRIGGER\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"34\"}},{\"id\":\"35::m\",\"questionId\":\"35\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa OPTIMIZE?\",\"back\":\"$15\",\"topic\":\"OPTIMIZE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"35\"},\"related\":33}],\"cardCount\":39},\"deckEn\":{\"quizId\":\"databricks-data-engineer-professional\",\"quizTitle\":\"Databricks Certified Data Engineer Professional\",\"cardCount\":39,\"cards\":[{\"id\":\"2::m\",\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DBFS, and what is it used for?\",\"back\":\"$16\",\"topic\":\"DBFS\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"2\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"2::c2\",\"questionId\":\"2\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Unity Catalog, and what is it used for?\",\"back\":\"Moving the wheel to a workspace file or Unity Catalog volume path is the supported replacement location.B. (Respuesta correcta: Point the bundle's `whl` library entry at a workspace file or Unity Catalog volume path, since storing library files in the DBFS root is deprecated and disabled by default on Databricks Runtime 15.1 and above.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"2\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"3::m\",\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Declaring the variable once and overriding it per target is the intended pattern for values that should dif…\\\"?\",\"back\":\"$17\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"3\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"4::m\",\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is API, and what is it used for?\",\"back\":\"$18\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"4\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"4::c2\",\"questionId\":\"4\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is SQL, and what is it used for?\",\"back\":\"The distinction between `dlt` and `pyspark.pipelines` is not a SQL-versus-Python split; both relate to the Python API naming, and SQL pipeline definitions are a separate, unaffected syntax, so this description misstates the change entirely.D. (Respuesta correcta: The `dlt` module is replaced by `pyspark.pipelines`, commonly imported as `dp`; existing `import dlt` pipeline code keeps running unchanged, but Databricks recommends migrating to `dp` decorators such as `@dp.table`.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"4\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"5::m\",\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Materialized views recompute results as needed against the current state of the source, which is useful for…\\\"?\",\"back\":\"$19\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"5\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"6::m\",\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Lakeflow Jobs, and what is it used for?\",\"back\":\"A. Standard performance mode exists for Lakeflow Jobs and Lakeflow Spark Declarative Pipelines, but it is not offered as a selectable option for serverless notebooks, so this evaluation misstates what's configurable.B. Serverless compute does support notebooks as one of its core workload types, so claiming notebooks require classic compute misrepresents the platform's current capabilities.D. The memory tier and the performance mode are independent settings in the notebook's Environment panel, so enabling High memory has no bearing on which performance mode is selectable. (Respuesta correcta: The suggestion cannot be applied, because serverless notebooks only support Performance Optimized mode, built for low-latency, always-warm interactive sessions.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Lakeflow Jobs\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"6\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"6::c2\",\"questionId\":\"6\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Performance Optimized, and what is it used for?\",\"back\":\"Serverless notebooks are restricted to Performance Optimized mode precisely because interactive sessions need warm, low-latency compute, which correctly explains why the teammate's suggestion isn't something the analyst can turn on.C. (Respuesta correcta: The suggestion cannot be applied, because serverless notebooks only support Performance Optimized mode, built for low-latency, always-warm interactive sessions.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Performance Optimized\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"6\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Append mode only writes new rows that will never change again, such as finalized windows once the watermark…\\\"?\",\"back\":\"A. Update mode writes only the rows whose aggregate value changed since the last trigger, which is more efficient than a full rewrite but is not what this description asks for.B. Complete mode rewrites the entire result table to the sink after every trigger, which requires retaining full aggregation state indefinitely and matches the behavior described.C. Continuous is a low-latency processing mode, not an output mode, so it does not fit alongside append, update, and complete as an answer to this question.D. Append mode only writes new rows that will never change again, such as finalized windows once the watermark has passed, and it does not rewrite the full result table on each trigger.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"7\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"9::m\",\"questionId\":\"9\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is USE, and what is it used for?\",\"back\":\"A. `USE CONNECTION` lets a principal query through catalogs that reference the connection without exposing the stored host, port, or secret values, and scoping `USE CATALOG`/`SELECT` to just one foreign catalog per group keeps each group limited to its assigned data without letting any group create new catalogs.B. (Respuesta correcta: Grant `USE CONNECTION` on the connection to each group, then grant `USE CATALOG` plus `SELECT` on just the one foreign catalog assigned to that group.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"USE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"9\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"9::c2\",\"questionId\":\"9\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is CREATE, and what is it used for?\",\"back\":\"Granting `CREATE FOREIGN CATALOG` would let every group independently create catalogs from the shared connection, which violates the requirement that only the admin controls how many foreign catalogs exist.C. `ALL PRIVILEGES` on the connection includes catalog-creation and ownership-transfer rights well beyond read access, and connection-level options such as the stored credential remain outside what any grant exposes to a non-owner querying through it, but the privilege scope here is far broader than required and risky to hand to three separate groups.D. (Respuesta correcta: Grant `USE CONNECTION` on the connection to each group, then grant `USE CATALOG` plus `SELECT` on just the one foreign catalog assigned to that group.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CREATE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"9\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"9::c3\",\"questionId\":\"9\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is OWNER, and what is it used for?\",\"back\":\"Transferring `OWNER` hands full control of the connection, including the ability to alter its credentials and drop it, to a group member — a much larger blast radius than the read-only, catalog-scoped access the scenario calls for. (Respuesta correcta: Grant `USE CONNECTION` on the connection to each group, then grant `USE CATALOG` plus `SELECT` on just the one foreign catalog assigned to that group.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"OWNER\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"9\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"10::m\",\"questionId\":\"10\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SQL, and what is it used for?\",\"back\":\"A. SQL Server's change tracking and CDC features are only available against the primary instance; secondary replicas cannot serve as a CDC source, so the connector must be pointed at the primary regardless of its available capacity.B. Lakeflow Connect supports SQL Server across on-premises deployments, EC2, Azure VMs, Azure SQL, and Amazon RDS, so the connector is not restricted to Azure-hosted deployments.C. Network reachability is a separate concern from CDC support; even with working connectivity, change tracking and CDC simply are not exposed on secondary replicas. (Respuesta correcta: Change tracking and CDC are not supported on SQL Server read replicas, so the connector must point at the primary instance instead.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"10\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"10::c2\",\"questionId\":\"10\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is CDC, and what is it used for?\",\"back\":\"Authentication is handled through the Unity Catalog connection's stored credentials and is independent of whether the target instance is primary or secondary; the failure here is about CDC support, not authentication.D. (Respuesta correcta: Change tracking and CDC are not supported on SQL Server read replicas, so the connector must point at the primary instance instead.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CDC\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"10\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"11::m\",\"questionId\":\"11\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is JSON, and what is it used for?\",\"back\":\"A. This path string omits the required `.` immediately after the leading `$` root marker, which makes it a malformed JSON path rather than an equivalent way of expressing the same navigation.B. This path wraps the `bicycle` key in unquoted brackets as if it were a variable or index rather than a field name, which does not correctly express navigating into the `bicycle` object key.C. This path string mirrors the shorthand exactly: it navigates into the `store` object, then `bicycle`, indexes the first array element, and finally reads `price`, matching the intended nested lookup field for field.D. This path swaps the array index and the field name, indexing into `price` rather than into `bicycle`, so it does not describe the same nested location as the original shorthand expression. (Respuesta correcta: `variant_get(raw, '$.store.bicycle[0].price')`)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"JSON\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"11\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"13::m\",\"questionId\":\"13\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is STRING, and what is it used for?\",\"back\":\"$1a\",\"topic\":\"STRING\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"13\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"14::m\",\"questionId\":\"14\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is ROLLUP, and what is it used for?\",\"back\":\"A. Correct. `ROLLUP (region, product_category)` produces the full detail grouping, then a subtotal per `region` (dropping `product_category`), then a single grand total, matching the hierarchical requirement described without needing a `product_category`-only subtotal.B. Workable but not the right construct here. Manually unioning three separately grouped queries can reproduce the same rows, but it requires three separate scans and aggregations and more code than the purpose-built rollup syntax designed for exactly this hierarchical subtotal pattern.D. Incorrect. (Respuesta correcta: `GROUP BY ROLLUP (region, product_category)`, which produces the detail-level groups plus subtotals for `region` and a grand total, following the hierarchical order of the listed columns.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ROLLUP\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"14\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"14::c2\",\"questionId\":\"14\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is CUBE, and what is it used for?\",\"back\":\"Incorrect for this requirement. `CUBE` also produces a `product_category`-only subtotal (with region dropped) that was not requested, so it returns a superset of the needed groupings rather than the specific hierarchical set the report calls for.C. (Respuesta correcta: `GROUP BY ROLLUP (region, product_category)`, which produces the detail-level groups plus subtotals for `region` and a grand total, following the hierarchical order of the listed columns.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CUBE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"14\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"15::m\",\"questionId\":\"15\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SKU, and what is it used for?\",\"back\":\"$1b\",\"topic\":\"SKU\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"15\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"16::m\",\"questionId\":\"16\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is API, and what is it used for?\",\"back\":\"A. Publishing the event log to a visible catalog table is an optional convenience for governed access, not a prerequisite for querying it, so this adds an unnecessary configuration step.B. `system.lakeflow.pipelines` holds pipeline-level metadata for billing and auditing rather than per-flow progress or expectation metrics, so it cannot answer this event-level question.C. The Jobs API reports task and run status for jobs, not the flow-level `data_quality` metrics that only appear inside the pipeline event log's `flow_progress` events.D. The `event_log()` table-valued function reads the pipeline's default hidden event log table by pipeline ID with no advance setup, which matches the no-configuration-change requirement. (Respuesta correcta: Run `SELECT * FROM event_log('\u003cpipeline_id\u003e')` in a notebook attached to a cluster or SQL warehouse, reading the pipeline's hidden Delta event log table directly by ID.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"16\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"18::m\",\"questionId\":\"18\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. This table records per-task duration metrics for every job, and is the recommended source for multi-task jo…\\\"?\",\"back\":\"A. This table holds job-level metadata like trigger type and schedule, not per-task or per-run duration figures, so it does not answer the reporting question.B. This table records per-task duration metrics for every job, and is the recommended source for multi-task jobs since it captures each task's own setup, queue, and execution duration.C. Its duration columns are documented as populated only for single-task jobs; for a multi-task job it does not give reliable per-task figures, so it does not satisfy the requirement.D. This table tracks task configuration such as dependencies and timeouts, not run-time duration metrics, so it cannot produce the requested average execution and queue times. (Respuesta correcta: `system.lakeflow.job_task_run_timeline`, since it records per-task duration columns for both single-task and multi-task jobs.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"18\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"19::m\",\"questionId\":\"19\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SQL, and what is it used for?\",\"back\":\"$1c\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"19\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"20::m\",\"questionId\":\"20\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is OPTIMIZE, and what is it used for?\",\"back\":\"$1d\",\"topic\":\"OPTIMIZE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"20\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is ORDER.D used for?\",\"back\":\"A. Partitioning by a high-cardinality, skewed column like `customer_id` creates an excessive number of small partitions, which drives up file-listing overhead and small-file problems instead of fixing the rewrite cost.C. Liquid clustering with `customer_id` declared as a key incrementally maintains the layout as new data arrives, avoiding the full-table rewrite cost that a growing skewed table incurs under Z-ORDER.D. Given how heavily queries filter on `customer_id`, automatic clustering would likely select that same column as a key rather than avoid it, so this does not describe expected behavior. (Respuesta correcta: Recreate the table with `CLUSTER BY (customer_id)` so the file layout is maintained incrementally as the skewed data grows.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ORDER.D\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"21\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"21::c2\",\"questionId\":\"21\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is ORDER, and what is it used for?\",\"back\":\"Adding a second Z-ORDER column does not solve the underlying cost problem, since a Z-ORDER `OPTIMIZE` still rewrites the full set of touched files on every run regardless of how many columns are listed.B. (Respuesta correcta: Recreate the table with `CLUSTER BY (customer_id)` so the file layout is maintained incrementally as the skewed data grows.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ORDER\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"21\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"24::m\",\"questionId\":\"24\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is ALL, and what is it used for?\",\"back\":\"$1e\",\"topic\":\"ALL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"24\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"26::m\",\"questionId\":\"26\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Unity Catalog, and what is it used for?\",\"back\":\"A. This matches how the two mechanisms are defined: a row filter is a function returning a boolean that hides whole rows failing the condition, while a column mask is a function that substitutes or transforms the value shown for one column, leaving the row present.B. This swaps the two mechanisms' actual behavior — row filters act on whole rows and column masks act on individual column values, not the other way around as this option describes.C. Row filters and column masks are not restricted to only streaming tables versus only batch tables; both mechanisms can be applied across the table types Unity Catalog supports for this feature, so this distinction does not hold.D. (Respuesta correcta: A row filter is a function evaluated per row that excludes the row from the result set when it returns `false`, while a column mask is a function that transforms the value of one column, leaving the row itself present.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"26\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"26::c2\",\"questionId\":\"26\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Delta Sharing, and what is it used for?\",\"back\":\"Both row filters and column masks are query-time controls evaluated when a table is read, not one-time write-time transformations or controls limited to Delta Sharing access paths. (Respuesta correcta: A row filter is a function evaluated per row that excludes the row from the result set when it returns `false`, while a column mask is a function that transforms the value of one column, leaving the row itself present.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Delta Sharing\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"26\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"27::m\",\"questionId\":\"27\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is NULL, and what is it used for?\",\"back\":\"$1f\",\"topic\":\"NULL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"27\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"31::m\",\"questionId\":\"31\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is JVM, and what is it used for?\",\"back\":\"A. The Executors tab exposes a Thread Dump link per executor that captures a live snapshot of every thread's stack trace and state on that JVM, which is exactly the mechanism designed for identifying where a specific executor is stuck.B. A task-level Logs link streams stdout/stderr application log lines for that task, but log output only shows what the code explicitly printed; it does not capture the live thread stack state needed to see exactly where execution is currently blocked.C. (Respuesta correcta: Open the Executors tab, locate the row for that executor's ID, and click the link in its Thread Dump column to capture a snapshot of every thread's current state.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"JVM\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"31\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"31::c3\",\"questionId\":\"31\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is DAG, and what is it used for?\",\"back\":\"The DAG visualization on the Jobs tab shows stage dependencies and progress, and hovering over a node does not surface per-executor CPU/memory gauges or thread stack traces for diagnosing a hang. (Respuesta correcta: Open the Executors tab, locate the row for that executor's ID, and click the link in its Thread Dump column to capture a snapshot of every thread's current state.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"DAG\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"31\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"32::m\",\"questionId\":\"32\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is API, and what is it used for?\",\"back\":\"A. The Jobs API manages job definitions and runs; it is not the interface used to authenticate or synchronize a Git folder with a remote repository, so switching to it would not resolve an authentication failure. (Respuesta correcta: Generate an Azure DevOps personal access token, since Databricks Git folders do not accept Microsoft Entra ID tokens for this integration.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"32\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"32::c2\",\"questionId\":\"32\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Azure DevOps, and what is it used for?\",\"back\":\"Azure DevOps is a documented exception: Databricks Git folders require an Azure DevOps personal access token for this integration and do not accept Microsoft Entra ID tokens, unlike the OAuth flow available for providers such as GitHub.B. (Respuesta correcta: Generate an Azure DevOps personal access token, since Databricks Git folders do not accept Microsoft Entra ID tokens for this integration.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Azure DevOps\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"32\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"32::c3\",\"questionId\":\"32\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is GitHub, and what is it used for?\",\"back\":\"The cloud the workspace runs on does not determine which Git providers it can integrate with; Azure-hosted workspaces can link to GitHub, GitLab, Bitbucket, and other supported providers just as workspaces on other clouds can.C. (Respuesta correcta: Generate an Azure DevOps personal access token, since Databricks Git folders do not accept Microsoft Entra ID tokens for this integration.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"GitHub\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"32\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"33::m\",\"questionId\":\"33\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is ID.C used for?\",\"back\":\"A. A `lookup` block resolves an object's ID by looking it up by name in the workspace; it solves a different problem than supplying a caller-chosen literal value per run and would not let CI inject an arbitrary ID.C. A committed overrides file is lower precedence than an environment variable in the CLI's resolution order, and it would also require a file edit and commit on every run, which the requirement explicitly rules out. (Respuesta correcta: Export an environment variable named `BUNDLE_VAR_warehouse_id` set to the desired ID before invoking `databricks bundle deploy`, since CLI variable resolution checks that environment prefix ahead of the declared default.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ID.C\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"33\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"33::c2\",\"questionId\":\"33\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is BUNDLE_VAR_, and what is it used for?\",\"back\":\"The `BUNDLE_VAR_\u003cname\u003e` environment variable convention is read by the CLI ahead of a variable's declared default, so exporting it per CI run supplies a fresh warehouse ID each time without touching any committed file.B. (Respuesta correcta: Export an environment variable named `BUNDLE_VAR_warehouse_id` set to the desired ID before invoking `databricks bundle deploy`, since CLI variable resolution checks that environment prefix ahead of the declared default.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"BUNDLE_VAR_\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"33\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"33::c3\",\"questionId\":\"33\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is CLI, and what is it used for?\",\"back\":\"The `--profile` flag selects a named Databricks CLI authentication profile; it does not accept key-value pairs for overriding bundle variables, so this would not affect `warehouse_id` at all.D. (Respuesta correcta: Export an environment variable named `BUNDLE_VAR_warehouse_id` set to the desired ID before invoking `databricks bundle deploy`, since CLI variable resolution checks that environment prefix ahead of the declared default.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CLI\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"33\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"34::m\",\"questionId\":\"34\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is TRIGGER, and what is it used for?\",\"back\":\"$20\",\"topic\":\"TRIGGER\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"34\"},\"esDeck\":\"databricks-data-engineer-professional\"},{\"id\":\"35::m\",\"questionId\":\"35\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is OPTIMIZE, and what is it used for?\",\"back\":\"$21\",\"topic\":\"OPTIMIZE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-data-engineer-professional\",\"questionId\":\"35\"},\"esDeck\":\"databricks-data-engineer-professional\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[
