js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"deckEs\":{\"quizId\":\"tf-keras-course\",\"quizTitle\":\"TensorFlow y Keras — Entrenamiento, datos y despliegue\",\"cardCount\":16,\"kind\":\"standalone\",\"category\":\"machine-learning\",\"emoji\":\"🧠\",\"description\":\"Lo que el examen pregunta de TensorFlow/Keras: callbacks de entrenamiento, GradientTape, Dropout, formatos de guardado (.tflite, SavedModel), TFDV y las trampas típicas (AutoML, TPU, BigQuery ML).\",\"modules\":[{\"id\":\"m1-entrenamiento\",\"title\":\"Entrenamiento con Keras\",\"titleEn\":\"Training with Keras\",\"objective\":\"Dominar los callbacks del examen (EarlyStopping, ReduceLROnPlateau, LearningRateScheduler, ModelCheckpoint), Dropout, GradientTape y los métodos compile/fit/save.\",\"emoji\":\"🏋️\",\"cards\":[\"tf-callbacks\",\"tf-earlystopping\",\"tf-lr-callbacks\",\"tf-dropout\",\"tf-gradienttape\",\"tf-model-metodos\"]},{\"id\":\"m2-datos-serving\",\"title\":\"Datos, guardado y despliegue\",\"titleEn\":\"Data, saving, and deployment\",\"objective\":\"Validar datos con TFDV, evitar el training-serving skew, conocer los formatos del modelo (.keras, SavedModel, .h5, .tflite) y cómo se sirve con baja latencia.\",\"emoji\":\"📦\",\"cards\":[\"tf-tfdv\",\"tf-tftransform-skew\",\"tf-save-formatos\",\"tf-serving-online\",\"tf-tfx\"]},{\"id\":\"m3-trampas\",\"title\":\"Trampas de examen\",\"titleEn\":\"Exam traps\",\"objective\":\"Los distractores que más engañan: bucles Python dentro del modelo, TPU vs GPU, «BigQuery ML requiere TensorFlow» y qué librerías usa cada AutoML.\",\"emoji\":\"🎯\",\"cards\":[\"tf-python-bottleneck\",\"tf-tpu-vs-gpu\",\"tf-bqml-no-tf\",\"tf-automl-libs\",\"tf-drift-tools\"]}],\"cards\":[{\"id\":\"tf-callbacks\",\"part\":\"m\",\"front\":\"¿Qué es un callback de Keras y cuáles son los cuatro que aparecen en el examen?\",\"back\":\"Un callback es un objeto que Keras llama en momentos fijos del entrenamiento (al terminar cada epoch, cada batch…). Se pasan así: model.fit(..., callbacks=[...]).\\n\\nLos cuatro del examen:\\n• EarlyStopping — DETIENE el entrenamiento cuando una métrica deja de mejorar.\\n• ModelCheckpoint — GUARDA el modelo (el mejor hasta ahora o el último).\\n• ReduceLROnPlateau — BAJA el learning rate cuando la métrica se estanca.\\n• LearningRateScheduler — CAMBIA el learning rate según una función que tú defines por epoch.\\n\\nPista: la palabra del enunciado elige la herramienta. «Detener el entrenamiento» → EarlyStopping. «Guardar el mejor modelo» → ModelCheckpoint. «Reducir el lr al estancarse» → ReduceLROnPlateau. «Plan de lr por epoch (warmup, step decay)» → LearningRateScheduler.\",\"topic\":\"Callbacks de Keras\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"keras\"]},{\"id\":\"tf-earlystopping\",\"part\":\"m\",\"front\":\"¿Cómo funciona tf.keras.callbacks.EarlyStopping y para qué sirve?\",\"back\":\"Vigila una métrica (monitor, por defecto val_loss) y DETIENE el entrenamiento cuando lleva patience epochs consecutivos sin mejorar.\\n\\n• monitor='val_loss': vigila la validación, no el train (el train casi sigue bajando aunque el modelo ya sobreajuste).\\n• patience=N: tolera N epochs sin mejora antes de parar.\\n• restore_best_weights=True: se queda con los pesos del mejor epoch, no con los del último.\\n\\nPara qué sirve: prevenir el overfitting — corta cuando la validación empeora aunque el train siga mejorando.\\n\\nNo lo confundas: ReduceLROnPlateau solo baja el lr; el entrenamiento continúa.\",\"topic\":\"EarlyStopping\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"keras\"]},{\"id\":\"tf-lr-callbacks\",\"part\":\"m\",\"front\":\"ReduceLROnPlateau o LearningRateScheduler: ¿cuál es la diferencia y cuándo va cada uno?\",\"back\":\"Los dos cambian el learning rate durante fit(). Cambia QUIÉN decide el momento.\\n\\n• ReduceLROnPlateau REACCIONA: si la métrica vigilada lleva patience epochs sin mejorar, multiplica el lr por factor (0.1 típico) y no baja de min_lr. No necesita plan: responde a lo que ocurre en el entrenamiento.\\n• LearningRateScheduler ES UN PLAN: le pasas schedule(epoch, lr) y aplica ese valor al inicio de cada epoch — warmup o step decay definidos de antemano.\\n\\nPistas:\\n• «reducir el lr cuando la métrica deja de mejorar» → ReduceLROnPlateau.\\n• «función fija por epoch / warmup» → LearningRateScheduler.\\n\\nDistractores clásicos: EarlyStopping (corta TODo el entrenamiento, no el lr) y Dropout (regularización, nada que ver con el lr).\",\"topic\":\"ReduceLROnPlateau vs LearningRateScheduler\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"keras\"]},{\"id\":\"tf-dropout\",\"part\":\"m\",\"front\":\"¿Qué hace Dropout y por qué reduce el overfitting?\",\"back\":\"Apaga al azar una fracción de las neuronas en cada paso de entrenamiento: Dropout(0.3) entre capas apaga el 30 % por paso.\\n\\nPor qué funciona: las neuronas no pueden codepender de otras concretas — el modelo aprende representaciones más robustas. Equivale a promediar muchas subredes (un ensemble implícito).\\n\\nDetalles de examen:\\n• En inferencia (predict) el dropout se desactiva y las activaciones se escalan.\\n• En Keras es una capa más, colocada entre capas Dense.\\n• NO es un callback, NO toca el learning rate y NO reduce el tamaño de la entrada.\\n\\nPregunta tipo: «¿para qué sirve Dropout?» → «reducir el overfitting desactivando neuronas al azar».\",\"topic\":\"Dropout\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"keras\"]},{\"id\":\"tf-gradienttape\",\"part\":\"m\",\"front\":\"¿Para qué sirve tf.GradientTape y qué relación tiene con los training loops personalizados?\",\"back\":\"Es la grabadora de la diferenciación automática: dentro de with tf.GradientTape() as tape: quedan anotadas las operaciones del forward pass, y tape.gradient(loss, variables) devuelve los gradientes exactos.\\n\\nEs la BASE de los custom training loops — un paso de entrenamiento a mano:\\n1. forward dentro del tape\\n2. calcular la loss\\n3. grads = tape.gradient(loss, model.trainable_variables)\\n4. optimizer.apply_gradients(zip(grads, variables))\\n\\nPista: «training loop personalizado / manual / control fino del paso de entrenamiento» → GradientTape.\\n\\nDistractores: tf.keras.Sequential (apilar capas), tf.function (compilar Python a grafo; no calcula gradientes) y tf.estimator (API legacy, retirada).\",\"topic\":\"tf.GradientTape\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"keras\"]},{\"id\":\"tf-model-metodos\",\"part\":\"m\",\"front\":\"¿Qué hace cada método del ciclo de vida de un modelo Keras: compile, fit, save, predict?\",\"back\":\"• model.compile(): define CÓMO aprende — optimizador, loss y métricas. No entrena nada.\\n• model.fit(): ENTRENA por epochs, aplica los callbacks y devuelve el history.\\n• model.save(): SERIALIZA el modelo completo — arquitectura + pesos + estado del optimizador — para reanudar el entrenamiento o servirlo.\\n• model.predict(): inferencia; no actualiza pesos.\\n\\nPista: «guardar el modelo completo con pesos y optimizador para reanudar o servir» → model.save(). Formatos: .keras (checkpoint moderno) o SavedModel (directorio, el formato de serving en Vertex AI/TF Serving); .h5 es legacy.\",\"topic\":\"compile / fit / save / predict\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"keras\"]},{\"id\":\"tf-tfdv\",\"part\":\"m\",\"front\":\"¿Qué es TensorFlow Data Validation (TFDV) y qué problemas detecta?\",\"back\":\"Es la herramienta de TFX para revisar la CALIDAD DE LOS DATOS DE ENTRADA antes de entrenar:\\n\\n1. generate_statistics_from_csv/dataframe → estadísticas por feature.\\n2. infer_schema → el esquema esperado (tipos, dominios, obligatoriedad).\\n3. validate_statistics → compara el conjunto nuevo contra el esquema y contra el conjunto de entrenamiento.\\n\\nDetecta: anomalías y valores que faltan, SKEW (el servicio sirve un dato distinto al que se entrenó) y DRIFT (el dato de hoy cambió respecto al de entrenamiento). Comparadores: L-infinity para categóricas, Jensen-Shannon para numéricas.\\n\\nPista: «comprobar/sanear los datos de entrada antes de entrenar» → TFDV. Corre dentro de TFX y de Vertex AI Pipelines.\\n\\nNo es de monitoreo del modelo servido: eso es Model Monitoring.\",\"topic\":\"TFDV\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"datos\"]},{\"id\":\"tf-tftransform-skew\",\"part\":\"m\",\"front\":\"El equipo preprocesa con Python para entrenar y reimplementó la normalización en Java para servir, y el modelo falla en producción. ¿Cómo se arregla con herramientas TF?\",\"back\":\"Es training-serving skew: dos implementaciones del MISMO preprocesado que no aplican igual las transformaciones.\\n\\nLa solución TF es una única fuente de verdad para la transformación:\\n• TensorFlow Transform (tf.transform): la transformación se define una vez y se INCRUSTA en el grafo del modelo exportado — el SavedModel ya preprocesa igual en training y en serving.\\n• Keras preprocessing layers: las capas de preprocesado viajan dentro del modelo.\\n• O servir las features ya calculadas desde Vertex AI Feature Store (se computan una vez, se leen online y offline).\\n\\nNo: no se arregla reentrenando más a menudo, ni añadiendo capas, ni desactivando la normalización.\",\"topic\":\"Training-serving skew\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"tensorflow\",\"mlops\"]},{\"id\":\"tf-save-formatos\",\"part\":\"m\",\"front\":\"¿Qué formato de guardado de TensorFlow corresponde a cada tarea: .keras, SavedModel, .h5 y .tflite?\",\"back\":\"• .keras — el formato checkpoint de Keras v3: un archivo zip con arquitectura + pesos + estado del optimizador. Para reanudar entrenamiento.\\n• SavedModel — un DIRECTORIO (con saved_model.pb): grafo + pesos en formato lenguaje-neutral. Es el formato de SERVING: TF Serving y Vertex AI lo despliegan tal cual.\\n• .h5 — legacy de Keras 2: también guarda modelo completo, pero no incluye el grafo servible.\\n• .tflite — TensorFlow Lite: FlatBuffer compacto optimizado para INFERENCIA en móvil, IoT y edge. Se genera con TFLiteConverter desde un SavedModel o modelo Keras, a veces con cuantización float16/int8 para menos latencia y peso (el intérprete corre en Android, iOS y microcontroladores).\\n\\nPistas: «móvil / embebido / edge» → .tflite. «servir en un endpoint» → SavedModel. «seguir entrenando» → .keras (o .h5 legacy).\",\"topic\":\"Formatos de guardado\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"keras\"]},{\"id\":\"tf-serving-online\",\"part\":\"m\",\"front\":\"¿Cómo se sirve un modelo entrenado (con TF o BigQuery ML) para inferencia en línea de baja latencia?\",\"back\":\"NO consultes el warehouse (BigQuery) en cada petición: una query tarda segundos y un endpoint responde en milisegundos.\\n\\nCamino correcto:\\n• TensorFlow: despliega el SavedModel en un endpoint (Vertex AI Endpoint o TF Serving). Mantén min_replica_count ≥ 1 para evitar cold starts y dimensiona el machine type.\\n• BigQuery ML: importa el modelo al Vertex AI Model Registry (o expórtalo como SavedModel) y sírvelo desde ahí; también existen endpoints en línea de BigQuery ML, pero el patrón de examen es Registry + endpoint de Vertex AI.\\n\\nPista: «sub-100 ms / tiempo real / baja latencia» → endpoint online (Vertex AI), no batch ni queries.\",\"topic\":\"Serving en línea\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"mlops\"]},{\"id\":\"tf-tfx\",\"part\":\"m\",\"front\":\"¿Qué es TFX y en qué ayuda al ciclo de vida del modelo en Vertex AI?\",\"back\":\"TFX es la plataforma de pipelines de Google para ML en producción. Sus componentes cubren el ciclo:\\n• TFDV — valida los datos (estadísticas, esquema, anomalías).\\n• TFT (Transform) — preprocesado que viaja con el modelo.\\n• Trainer — entrena (Keras/TF).\\n• Evaluator — valida contra baseline y detecta sesgos.\\n• Pusher — despliega el modelo validado (TF Serving / Vertex AI).\\n\\nCada componente se ejecuta como paso de un pipeline; en GCP el corredor es Vertex AI Pipelines. Pista: «pipeline de ML de extremo a extremo con validación de datos y del modelo» → TFX sobre Vertex AI Pipelines.\",\"topic\":\"TFX y pipelines\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"tensorflow\",\"mlops\"]},{\"id\":\"tf-python-bottleneck\",\"part\":\"m\",\"front\":\"Un modelo TensorFlow va lento porque su código usa bucles de Python entre tensores. ¿Cómo se arregla?\",\"back\":\"Convierte la lógica de Python en OPERACIONES NATIVAS DE TENSORFLOW.\\n\\nPor qué: los bucles de Python dentro del grafo no pueden ser optimizados por el runtime de TF — cada paso sale del contexto del grafo hacia el intérprete de Python. Al reescribir la lógica con ops vectorizadas (tf.where, tf.map_fn con cuidado, operaciones por lotes), el runtime optimiza el grafo completo (fusion de ops, paralelismo, compilación XLA).\\n\\nNo lo arreglan: subir el learning rate (no toca velocidad), añadir GPUs (no resuelven el bottleneck de EJECUCIÓN de Python) o subir dropout (no afecta la ejecución del grafo).\\n\\nPista: «bucles Python / lógica de Python en el path de datos» → vectorizar con ops de TF.\",\"topic\":\"Cuellos de botella Python\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"rendimiento\"]},{\"id\":\"tf-tpu-vs-gpu\",\"part\":\"m\",\"front\":\"¿Cuándo conviene una Cloud TPU y cuándo una GPU para entrenar (JAX/TensorFlow/PyTorch)?\",\"back\":\"Las TPUs están hechas para multiplicaciones de matrices densas a gran escala, compiladas con XLA — JAX, TensorFlow y PyTorch/XLA las apuntan de forma nativa.\\n\\n• Elige TPU para entrenamientos largos de modelos grandes SIN kernels CUDA propios: un TPU slice suele dar mejor relación precio-rendimiento y escala entre chips (paralelismo de datos, modelo y pipeline).\\n• Elige GPU cuando el código depende de ops CUDA personalizadas, ecosistema específico o modelos chicos/medianos.\\n\\nDistractores: «CPU con muchos núcleos» (JAX/TF no están optimizados para CPU masiva) y «Edge TPU en un portátil» (es para inferencia edge, no para entrenar).\",\"topic\":\"TPU vs GPU\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"infraestructura\"]},{\"id\":\"tf-bqml-no-tf\",\"part\":\"m\",\"front\":\"¿Un modelo de BigQuery ML requiere instalar TensorFlow? ¿Dónde se entrena?\",\"back\":\"NO. BigQuery ML ejecuta los modelos estadísticos DENTRO de BigQuery con sintaxis SQL (CREATE MODEL ...), sin herramientas externas y sin tocar TensorFlow.\\n\\nDatos reales de examen:\\n• Se entrena con SQL dentro de la propia infraestructura de BigQuery (no fuera con AutoML, no desde CSV externos obligatorios).\\n• Sí se integra con el resto del ecosistema: puedes exportar/importar un modelo hacia el Vertex AI Model Registry (e incluso sirve SavedModels de TF), pero NINGÚN paso exige instalar TensorFlow al usuario.\\n\\nPista: «equipo que solo sabe SQL / mantener los datos en BigQuery» → BigQuery ML.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"bigquery\"]},{\"id\":\"tf-automl-libs\",\"part\":\"m\",\"front\":\"¿Qué librerías usa el AutoML de Databricks para clasificación, y cuáles NO?\",\"back\":\"Clasificación y regresión: scikit-learn, XGBoost y LightGBM — el AutoML de Databricks entrena y compara múltiples tipos de modelo de esas librerías antes de rankear.\\n\\nNO son del lado de clasificación:\\n• Prophet y ARIMA — librerías/paquetes de FORECASTING (series de tiempo), para experimentos de forecasting, no de clasificación.\\n• TensorFlow/PyTorch — NO son parte de los trials de clasificación del AutoML de Databricks (las redes profundas no se ajustan automáticamente ahí).\\n• Spark MLlib — no es lo que usan los trials estándar de AutoML.\\n\\nPista: si el enunciado dice «AutoML» + «clasificación/regresión», piensa en scikit-learn/XGBoost/LightGBM; si dice «forecasting», en Prophet/ARIMA.\",\"topic\":\"Librerías de AutoML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"automl\"]},{\"id\":\"tf-drift-tools\",\"part\":\"m\",\"front\":\"Quieres detectar drift y anomalías de entrada comparando distribuciones semana a semana. ¿Qué herramienta lo hace de fábrica y cuáles son los distractores?\",\"back\":\"TFDV — TensorFlow Data Validation: computa estadísticas por feature, infiere el esquema y compara conjuntos para devolver puntuaciones de anomalía, skew y drift. Es la respuesta cuando el enunciado pide detectar drift de ENTRADA.\\n\\nDistractores:\\n• Queries SQL manuales cada semana — funciona, pero no es una herramienta: sin esquema ni comparadores ni umbral por feature.\\n• Métricas de Cloud Logging sobre cambios de distribución — Cloud Logging alerta sobre logs, no calcula drift de features.\\n• Filtros de Pub/Sub que descartan outliers — eso modifica el flujo de datos; no detecta ni alerta drift.\\n\\nRelacionado pero distinto: el monitoreo del SERVING (predicciones y latencia) es Model Monitoring de Vertex AI; el de entradas antes de entrenar es TFDV.\",\"topic\":\"Detector de drift\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"mlops\"]}]},\"deckEn\":{\"quizId\":\"tf-keras-course\",\"quizTitle\":\"TensorFlow and Keras — Training, data, and deployment\",\"cardCount\":16,\"kind\":\"standalone\",\"category\":\"machine-learning\",\"emoji\":\"🧠\",\"description\":\"What the exam asks about TensorFlow/Keras: training callbacks, GradientTape, Dropout, save formats (.tflite, SavedModel), TFDV, and the classic traps (AutoML, TPUs, BigQuery ML).\",\"modules\":[{\"id\":\"m1-entrenamiento\",\"title\":\"Training with Keras\",\"titleEn\":\"Training with Keras\",\"objective\":\"Dominar los callbacks del examen (EarlyStopping, ReduceLROnPlateau, LearningRateScheduler, ModelCheckpoint), Dropout, GradientTape y los métodos compile/fit/save.\",\"emoji\":\"🏋️\",\"cards\":[\"tf-callbacks\",\"tf-earlystopping\",\"tf-lr-callbacks\",\"tf-dropout\",\"tf-gradienttape\",\"tf-model-metodos\"]},{\"id\":\"m2-datos-serving\",\"title\":\"Data, saving, and deployment\",\"titleEn\":\"Data, saving, and deployment\",\"objective\":\"Validar datos con TFDV, evitar el training-serving skew, conocer los formatos del modelo (.keras, SavedModel, .h5, .tflite) y cómo se sirve con baja latencia.\",\"emoji\":\"📦\",\"cards\":[\"tf-tfdv\",\"tf-tftransform-skew\",\"tf-save-formatos\",\"tf-serving-online\",\"tf-tfx\"]},{\"id\":\"m3-trampas\",\"title\":\"Exam traps\",\"titleEn\":\"Exam traps\",\"objective\":\"Los distractores que más engañan: bucles Python dentro del modelo, TPU vs GPU, «BigQuery ML requiere TensorFlow» y qué librerías usa cada AutoML.\",\"emoji\":\"🎯\",\"cards\":[\"tf-python-bottleneck\",\"tf-tpu-vs-gpu\",\"tf-bqml-no-tf\",\"tf-automl-libs\",\"tf-drift-tools\"]}],\"cards\":[{\"id\":\"tf-callbacks\",\"part\":\"m\",\"front\":\"What is a Keras callback, and which four show up on the exam?\",\"back\":\"A callback is an object Keras calls at fixed points of training (end of each epoch, each batch…). You pass them via model.fit(..., callbacks=[...]).\\n\\nThe four on the exam:\\n• EarlyStopping — STOPS training when a metric stops improving.\\n• ModelCheckpoint — SAVES the model (best so far, or the latest).\\n• ReduceLROnPlateau — LOWERS the learning rate when the metric plateaus.\\n• LearningRateScheduler — CHANGES the learning rate with a per-epoch function you define.\\n\\nHint: the wording picks the tool. «Stop training» → EarlyStopping. «Save the best model» → ModelCheckpoint. «Reduce lr on plateau» → ReduceLROnPlateau. «A per-epoch lr plan (warmup, step decay)» → LearningRateScheduler.\",\"topic\":\"Callbacks de Keras\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"keras\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-earlystopping\",\"part\":\"m\",\"front\":\"How does tf.keras.callbacks.EarlyStopping work, and what is it for?\",\"back\":\"It watches one metric (monitor, default val_loss) and STOPS training after patience consecutive epochs without improvement.\\n\\n• monitor='val_loss': watches validation, not train (train loss usually keeps dropping even when the model is already overfitting).\\n• patience=N: tolerates N epochs with no improvement before stopping.\\n• restore_best_weights=True: keeps the best epoch's weights, not the last ones.\\n\\nWhat it is for: preventing overfitting — it cuts when validation gets worse even though train keeps improving.\\n\\nDo not confuse it: ReduceLROnPlateau only lowers the lr; training continues.\",\"topic\":\"EarlyStopping\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"keras\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-lr-callbacks\",\"part\":\"m\",\"front\":\"ReduceLROnPlateau or LearningRateScheduler: what is the difference, and when does each fit?\",\"back\":\"Both change the learning rate during fit(). What changes is WHO decides when.\\n\\n• ReduceLROnPlateau REACTS: when the monitored metric goes patience epochs without improving, it multiplies the lr by factor (typ 0.1) and never below min_lr. It needs no plan: it responds to what happens during training.\\n• LearningRateScheduler IS A PLAN: you pass schedule(epoch, lr) and it applies that value at the start of each epoch — a warmup or step decay defined up front.\\n\\nHints:\\n• «reduce the lr when the metric stops improving» → ReduceLROnPlateau.\\n• «a fixed per-epoch function / warmup» → LearningRateScheduler.\\n\\nClassic distractors: EarlyStopping (it stops ALL training, not the lr) and Dropout (regularization, nothing to do with lr).\",\"topic\":\"ReduceLROnPlateau vs LearningRateScheduler\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"keras\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-dropout\",\"part\":\"m\",\"front\":\"What does Dropout do, and why does it reduce overfitting?\",\"back\":\"It randomly turns off a fraction of the neurons at each training step: Dropout(0.3) between layers kills 30% of them per step.\\n\\nWhy it works: neurons cannot co-depend on specific others — the model learns more robust representations. It is equivalent to averaging many subnetworks (an implicit ensemble).\\n\\nExam details:\\n• At inference (predict) dropout is disabled and activations are rescaled.\\n• In Keras it is just another layer, placed between Dense layers.\\n• It is NOT a callback, does NOT touch the learning rate, and does NOT shrink the input.\\n\\nClassic question: «what is Dropout for?» → «reduce overfitting by randomly disabling neurons».\",\"topic\":\"Dropout\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"keras\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-gradienttape\",\"part\":\"m\",\"front\":\"What is tf.GradientTape for, and how does it relate to custom training loops?\",\"back\":\"It is the recorder of automatic differentiation: inside with tf.GradientTape() as tape: the forward-pass operations are recorded, and tape.gradient(loss, variables) returns the exact gradients.\\n\\nIt is the FOUNDATION of custom training loops — a hand-written training step:\\n1. forward pass inside the tape\\n2. compute the loss\\n3. grads = tape.gradient(loss, model.trainable_variables)\\n4. optimizer.apply_gradients(zip(grads, variables))\\n\\nHint: «custom / manual training loop / fine control of the training step» → GradientTape.\\n\\nDistractors: tf.keras.Sequential (stack layers), tf.function (compiles Python to a graph; it does not compute gradients), and tf.estimator (legacy API, retired).\",\"topic\":\"tf.GradientTape\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"keras\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-model-metodos\",\"part\":\"m\",\"front\":\"What does each lifecycle method of a Keras model do: compile, fit, save, predict?\",\"back\":\"• model.compile(): defines HOW it learns — optimizer, loss, metrics. It trains nothing.\\n• model.fit(): TRAINS for epochs, applies callbacks, returns the history.\\n• model.save(): SERIALIZES the full model — architecture + weights + optimizer state — to resume training or serve it.\\n• model.predict(): inference; no weights are updated.\\n\\nHint: «save the whole model with weights and optimizer to resume or serve» → model.save(). Formats: .keras (modern checkpoint) or SavedModel (directory, the serving format on Vertex AI/TF Serving); .h5 is legacy.\",\"topic\":\"compile / fit / save / predict\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"keras\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-tfdv\",\"part\":\"m\",\"front\":\"What is TensorFlow Data Validation (TFDV), and which problems does it catch?\",\"back\":\"The TFX tool for checking INPUT DATA QUALITY before training:\\n\\n1. generate_statistics_from_csv/dataframe → per-feature statistics.\\n2. infer_schema → the expected schema (types, domains, requiredness).\\n3. validate_statistics → compares the new dataset against the schema and against the training set.\\n\\nIt catches: anomalies and missing values, SKEW (serving feeds different data than training saw) and DRIFT (today's data moved away from training data). Comparators: L-infinity for categoricals, Jensen-Shannon for numerics.\\n\\nHint: «check/sanitize the input data before training» → TFDV. It runs inside TFX and Vertex AI Pipelines.\\n\\nIt is not for monitoring the served model: that is Model Monitoring.\",\"topic\":\"TFDV\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"datos\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-tftransform-skew\",\"part\":\"m\",\"front\":\"A team preprocesses with Python for training and reimplemented normalization in Java for serving, and the model misbehaves in production. How do TF tools fix it?\",\"back\":\"That is training-serving skew: two implementations of the SAME preprocessing that do not apply transformations identically.\\n\\nThe TF fix is a single source of truth for the transformation:\\n• TensorFlow Transform (tf.transform): define the transformation once and EMBED it into the exported model's graph — the SavedModel preprocesses the same way in training and serving.\\n• Keras preprocessing layers: preprocessing travels inside the model.\\n• Or serve precomputed features from Vertex AI Feature Store (computed once, read online and offline).\\n\\nNot the fix: retraining more often, adding layers, or disabling normalization.\",\"topic\":\"Training-serving skew\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"tensorflow\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-save-formatos\",\"part\":\"m\",\"front\":\"Which TensorFlow save format matches each task: .keras, SavedModel, .h5, .tflite?\",\"back\":\"• .keras — the Keras v3 checkpoint format: a zip archive with architecture + weights + optimizer state. For resuming training.\\n• SavedModel — a DIRECTORY (with saved_model.pb): graph + weights in a language-neutral format. The SERVING format: TF Serving and Vertex AI deploy it as is.\\n• .h5 — Keras 2 legacy: also saves the full model, but without a servable graph.\\n• .tflite — TensorFlow Lite: a compact FlatBuffer optimized for INFERENCE on mobile, IoT, and edge. Produced by TFLiteConverter from a SavedModel or Keras model, often with float16/int8 quantization for less latency and size (the interpreter runs on Android, iOS, and microcontrollers).\\n\\nHints: «mobile / embedded / edge» → .tflite. «serve on an endpoint» → SavedModel. «keep training» → .keras (or legacy .h5).\",\"topic\":\"Formatos de guardado\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"keras\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-serving-online\",\"part\":\"m\",\"front\":\"How do you serve a trained model (TF or BigQuery ML) for low-latency online inference?\",\"back\":\"Do NOT query the warehouse (BigQuery) per request: a query takes seconds; an endpoint answers in milliseconds.\\n\\nThe right path:\\n• TensorFlow: deploy the SavedModel to an endpoint (Vertex AI Endpoint or TF Serving). Keep min_replica_count ≥ 1 to avoid cold starts, and size the machine type.\\n• BigQuery ML: import the model into the Vertex AI Model Registry (or export as SavedModel) and serve from there; BigQuery ML also has online endpoints, but the exam pattern is Registry + Vertex AI endpoint.\\n\\nHint: «sub-100 ms / real time / low latency» → an online endpoint (Vertex AI), not batch or queries.\",\"topic\":\"Serving en línea\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-tfx\",\"part\":\"m\",\"front\":\"What is TFX, and how does it help the model lifecycle on Vertex AI?\",\"back\":\"TFX is Google's pipeline platform for production ML. Its components cover the lifecycle:\\n• TFDV — validates the data (statistics, schema, anomalies).\\n• TFT (Transform) — preprocessing that travels with the model.\\n• Trainer — trains (Keras/TF).\\n• Evaluator — validates against a baseline and detects bias.\\n• Pusher — deploys the validated model (TF Serving / Vertex AI).\\n\\nEach component runs as a pipeline step; on GCP the runner is Vertex AI Pipelines. Hint: «end-to-end ML pipeline with data and model validation» → TFX on Vertex AI Pipelines.\",\"topic\":\"TFX y pipelines\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"tensorflow\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-python-bottleneck\",\"part\":\"m\",\"front\":\"A TensorFlow model is slow because its code uses Python loops between tensors. How do you fix it?\",\"back\":\"Convert the Python logic into NATIVE TENSORFLOW OPS.\\n\\nWhy: Python loops inside the graph cannot be optimized by the TF runtime — every step leaves the graph context for the Python interpreter. Rewriting the logic with vectorized ops (tf.where, careful tf.map_fn, batched operations) lets the runtime optimize the whole graph (op fusion, parallelism, XLA compilation).\\n\\nThese do NOT fix it: raising the learning rate (does not touch speed), adding GPUs (does not solve Python EXECUTION bottlenecks), or raising dropout (does not affect graph execution).\\n\\nHint: «Python loops / Python logic in the data path» → vectorize with TF ops.\",\"topic\":\"Cuellos de botella Python\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"rendimiento\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-tpu-vs-gpu\",\"part\":\"m\",\"front\":\"When is a Cloud TPU the better choice vs a GPU for training (JAX/TensorFlow/PyTorch)?\",\"back\":\"TPUs are built for large-scale dense matrix multiplications compiled with XLA — JAX, TensorFlow, and PyTorch/XLA target them natively.\\n\\n• Pick a TPU for long trainings of large models WITHOUT custom CUDA kernels: a TPU slice typically gives strong price-performance and scales across chips (data, model, and pipeline parallelism).\\n• Pick a GPU when code depends on custom CUDA ops, a specific ecosystem, or small/medium models.\\n\\nDistractors: «CPU with many cores» (JAX/TF are not optimized for massive CPU) and «Edge TPU on a laptop» (edge inference, not training).\",\"topic\":\"TPU vs GPU\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"infraestructura\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-bqml-no-tf\",\"part\":\"m\",\"front\":\"Does a BigQuery ML model require installing TensorFlow? Where does training run?\",\"back\":\"NO. BigQuery ML runs the statistical models INSIDE BigQuery with SQL syntax (CREATE MODEL ...), no external tools and no TensorFlow involved.\\n\\nExam facts:\\n• Training runs with SQL inside BigQuery's own infrastructure (not outside with AutoML, not from mandatory external CSVs).\\n• It does integrate with the rest of the ecosystem: you can export/import a model to the Vertex AI Model Registry (and even serve TF SavedModels), but NO step requires the user to install TensorFlow.\\n\\nHint: «SQL-only team / keep the data in BigQuery» → BigQuery ML.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"tensorflow\",\"bigquery\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-automl-libs\",\"part\":\"m\",\"front\":\"Which libraries does Databricks AutoML use for classification, and which NOT?\",\"back\":\"Classification and regression: scikit-learn, XGBoost, and LightGBM — Databricks AutoML trains and compares multiple model types from those libraries before ranking the trials.\\n\\nNOT on the classification side:\\n• Prophet and ARIMA — FORECASTING (time series) tools, for forecasting experiments, not classification.\\n• TensorFlow/PyTorch — NOT part of Databricks AutoML classification trials (deep networks are not auto-tuned there).\\n• Spark MLlib — not what standard AutoML trials use.\\n\\nHint: «AutoML» + «classification/regression» → scikit-learn/XGBoost/LightGBM; «forecasting» → Prophet/ARIMA.\",\"topic\":\"Librerías de AutoML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"automl\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"},{\"id\":\"tf-drift-tools\",\"part\":\"m\",\"front\":\"You want to detect input drift and anomalies by comparing distributions week over week. Which tool does this out of the box, and what are the traps?\",\"back\":\"TFDV — TensorFlow Data Validation: computes per-feature statistics, infers the schema, and compares datasets to produce anomaly, skew, and drift scores. It is the answer when the stem asks to detect INPUT drift.\\n\\nTraps:\\n• Manual weekly SQL queries — it works, but it is not a tool: no schema, no comparators, no per-feature thresholds.\\n• Cloud Logging metrics on distribution changes — Cloud Logging alerts on logs; it does not compute feature drift.\\n• Pub/Sub filters dropping outliers — that mutates the data flow; it detects nothing.\\n\\nRelated but different: monitoring the SERVING side (predictions, latency) is Vertex AI Model Monitoring; input-side before training is TFDV.\",\"topic\":\"Detector de drift\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"tensorflow\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"tf-keras-course\"}]},\"flows\":[{\"id\":\"ml-engineer-gcp\",\"emoji\":\"🛤️\",\"title\":{\"es\":\"Ruta ML Engineer en Google Cloud\",\"en\":\"ML Engineer path on Google Cloud\"}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
