ds\",[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cards\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"fundamentals-javascript\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cards\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L5\",null,[\"$\",\"$L6\",null,{\"children\":\"$L7\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"A8gm8x7x_c4PhFk4WYkE7\",{\"children\":[[\"$\",\"$L8\",null,{\"children\":\"$L9\"}],[\"$\",\"$La\",null,{\"children\":\"$Lb\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$c\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"d:I[7844,[\"47\",\"static/chunks/47-aeb0cb411d578155.js\",\"872\",\"static/chunks/app/cards/%5Bid%5D/page-5f6564a25a07b7da.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Ld\",null,{\"deckEs\":{\"quizId\":\"fundamentals-javascript\",\"quizTitle\":\"JavaScript — De 0 a usable\",\"cardCount\":24,\"kind\":\"standalone\",\"category\":\"languages\",\"emoji\":\"🟨\",\"description\":\"Curso de JavaScript en tarjetas: navegador y Node, tipos, funciones, arrays, promesas y el modelo de la web. Incluye cuándo pasar a TypeScript.\",\"cards\":[{\"id\":\"js-mapa\",\"part\":\"m\",\"front\":\"¿Qué hay que saber de JavaScript para leer código de verdad?\",\"back\":\"1. Dónde corre: navegador o Node.\\n2. let y const, tipos, y ===.\\n3. Objetos, arrays y funciones.\\n4. map, filter y el desestructurado.\\n5. Módulos y npm.\\n6. Promesas y async/await: casi toda la web moderna es asíncrona.\\n7. El DOM, si es navegador. El event loop, para no perderte.\\n8. TypeScript, cuando el proyecto ya no cabe en tu cabeza.\\n\\nJavaScript perdona demasiado. El curso está para que dejes de apoyarte en esa indulgencia.\",\"topic\":\"Mapa del curso\",\"origin\":\"ai\",\"group\":\"Empezar\",\"difficulty\":\"basic\"},{\"id\":\"js-donde\",\"part\":\"m\",\"front\":\"¿JavaScript es el lenguaje del navegador o también del servidor?\",\"back\":\"El lenguaje es el mismo. Cambia lo que tienes alrededor.\\n\\n• Navegador: window, document, botones, fetch hacia una API. No lees archivos del disco del usuario por seguridad.\\n• Node: un programa en tu máquina o en un servidor. Tienes archivos, procesos y npm. No existe document.\\n\\nUn archivo .js se corre con node app.js. En el navegador va en una etiqueta script o lo carga la página.\\n\\nNo es Java. El nombre es un accidente de marketing de los noventa. La sintaxis se parece un poco; la librería y el modelo no.\",\"topic\":\"Navegador y Node\",\"origin\":\"ai\",\"group\":\"Empezar\",\"difficulty\":\"basic\"},{\"id\":\"js-let-const\",\"part\":\"m\",\"front\":\"¿Por qué no uso var?\",\"back\":\"• const nombre = 'Ana' no se puede reasignar. Úsalo por defecto.\\n• let edad = 28 sí se puede reasignar. Úsalo cuando el valor cambia (un contador).\\n• var es el antiguo: se ve en toda la función, no solo en el bloque, y se iza. En código nuevo no lo escribas.\\n\\nconst no congela un objeto. const persona = {edad: 28} y luego persona.edad = 29 es legal: no reasignaste la variable, cambiaste el objeto.\\n\\nSi quieres que el objeto no cambie, eso es otra herramienta (Object.freeze) y casi nunca hace falta.\",\"topic\":\"let, const, var\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"js-tipos\",\"part\":\"m\",\"front\":\"¿Qué tipos hay y por qué typeof null es 'object'?\",\"back\":\"number (no hay int separado; 7 y 3.14 son number), string, boolean, undefined, object, function, bigint, symbol.\\n\\nnull significa \\\"vacío a propósito\\\". undefined significa \\\"aún no hay\\\". No los uses como si fueran iguales.\\n\\ntypeof null === 'object' es un bug histórico del lenguaje. Para saber si es null escribes valor === null.\\n\\nLos objetos y los arrays son de tipo object. Array.isArray(x) distingue el array.\\n\\nJavaScript convierte tipos solo si lo dejas: '5' + 1 es '51' (concatenó). '5' - 1 es 4 (restó). Esa inconsistencia es la razón de escribir === y de no mezclar tipos.\",\"topic\":\"Tipos\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"js-igualdad\",\"part\":\"m\",\"front\":\"¿Por qué comparo con === y no con ==?\",\"back\":\"=== compara valor y tipo, sin convertir. '5' === 5 es false.\\n\\n== convierte primero. '5' == 5 es true. [] == false es true. Es una tabla de coerciones que no vale la pena memorizar porque vas a equivocarte.\\n\\nUsa === y !== siempre. Si quieres número, convierte tú: Number(texto).\\n\\nOjo: NaN === NaN es false. Number.isNaN(x) es la prueba correcta. NaN aparece al hacer Number('hola') o 0/0.\",\"topic\":\"=== y ==\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"js-truthy\",\"part\":\"m\",\"front\":\"¿Qué cuenta como falso dentro de un if?\",\"back\":\"Son falsy: false, 0, -0, '', null, undefined y NaN. Todo lo demás es truthy, incluido [], {} y '0'.\\n\\nif (nombre) no distingue \\\"no vino\\\" de \\\"vino vacío\\\". A veces querías if (nombre != null).\\n\\nEl operador ?? solo sustituye null o undefined:\\nconst n = entrada ?? 'invitado'\\n\\n|| sustituye cualquier falsy, así que 0 || 10 devuelve 10. Si 0 es un dato válido (una edad, un precio), usa ??, no ||.\",\"topic\":\"Truthy y falsy\",\"origin\":\"ai\",\"group\":\"Control\",\"difficulty\":\"basic\"},{\"id\":\"js-funciones\",\"part\":\"m\",\"front\":\"¿De cuántas formas se escribe una función?\",\"back\":\"function doble(n) {\\n  return n * 2\\n}\\n\\nconst doble2 = (n) =\u003e n * 2\\n\\nLa flecha es corta y NO tiene su propio this. Úsala en callbacks: nums.map(n =\u003e n * 2).\\n\\nfunction se puede llamar desde más arriba en el archivo (se iza). Una const flecha no: tiene que existir antes de usarla.\\n\\nSi omites return, la función devuelve undefined. Una flecha con llaves { return x } necesita el return; sin llaves, el valor se devuelve solo.\",\"topic\":\"Funciones\",\"origin\":\"ai\",\"group\":\"Funciones\",\"difficulty\":\"basic\"},{\"id\":\"js-objetos\",\"part\":\"m\",\"front\":\"¿Cómo es un objeto y cómo leo una propiedad que puede no estar?\",\"back\":\"const persona = { nombre: 'Ana', edad: 28 }\\npersona.nombre\\npersona['nombre']\\n\\nSi la propiedad no existe, el resultado es undefined, no un error. Por eso los bugs se arrastran: seguiste con undefined y tronó tres líneas después.\\n\\npersona.ciudad?.pais con ?. se detiene si ciudad es null o undefined, en vez de lanzar.\\n\\nLas claves son strings (o symbols). Un objeto no es un mapa ordenado de cualquier cosa: para claves que no son texto, o para evitar que 'toString' choque, usa Map.\",\"topic\":\"Objetos\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"js-arrays\",\"part\":\"m\",\"front\":\"¿Qué métodos de un array uso todo el tiempo?\",\"back\":\"const nums = [10, 20, 30]\\n\\n• nums.push(40) agrega al final. nums.pop() quita el último.\\n• nums[0] es el primero. La longitud es nums.length.\\n• nums.includes(20), nums.slice(0, 2) copia un tramo sin modificar.\\n• nums.splice sí modifica: úsalo con cuidado.\\n\\nmap, filter y find no modifican el original: devuelven otro array o un elemento.\\n\\nUn array es un objeto con índices. Puedes meterle un hueco (nums[10] = 1 en un array de 3) y length crece con casillas vacías. No lo hagas.\",\"topic\":\"Arrays\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"js-map-filter\",\"part\":\"m\",\"front\":\"¿Cuándo uso map, filter o reduce?\",\"back\":\"• map transforma cada elemento: nums.map(n =\u003e n * 2). El resultado tiene el mismo largo.\\n• filter se queda con los que pasan la prueba: nums.filter(n =\u003e n \u003e 10).\\n• find devuelve el primero que cumple, o undefined.\\n• reduce dobla el array a un solo valor: una suma, un objeto agrupado.\\n\\nreduce es potente y fácil de volver ilegible. Si es una suma, nums.reduce((a, n) =\u003e a + n, 0). Si son cinco líneas con if, un for suele leerse mejor.\\n\\nEl segundo argumento de reduce es el valor inicial. Sin él, el primer elemento se vuelve el inicial y un array vacío truena.\",\"topic\":\"map, filter, reduce\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"js-destructuring\",\"part\":\"m\",\"front\":\"¿Qué significan const { nombre } = persona y ...nums?\",\"back\":\"Sacar campos:\\nconst { nombre, edad } = persona\\nconst [primero, segundo] = nums\\n\\nCopiar y agregar sin mutar:\\nconst copia = { ...persona, ciudad: 'CDMX' }\\nconst mas = [...nums, 40]\\n\\nEl spread de un objeto es superficial: si hay un objeto adentro, se comparte.\\n\\nEn parámetros: function saludar({ nombre }) recibe un objeto y se queda el campo. Lo verás en componentes y en opciones de una función.\\n\\nEl orden importa al mezclar: { ...base, activo: true } pisa activo. { activo: true, ...base } deja que base lo pise.\",\"topic\":\"Desestructurar y spread\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"intermediate\"},{\"id\":\"js-closures\",\"part\":\"m\",\"front\":\"¿Qué es un closure y por qué una función recuerda una variable?\",\"back\":\"Una función interna sigue viendo las variables de donde nació, aunque esa función de afuera ya terminó.\\n\\nfunction contador() {\\n  let n = 0\\n  return () =\u003e ++n\\n}\\nconst siguiente = contador()\\nsiguiente() // 1\\nsiguiente() // 2\\n\\nn no es global. Vive \\\"dentro\\\" de siguiente.\\n\\nSirve para esconder estado sin una clase. También es la causa de un bug clásico: crear funciones en un for con var y que todas vean el último valor. Con let, cada vuelta tiene su propia variable.\",\"topic\":\"Closures\",\"origin\":\"ai\",\"group\":\"Funciones\",\"difficulty\":\"intermediate\"},{\"id\":\"js-this\",\"part\":\"m\",\"front\":\"¿A quién apunta this, y por qué se pierde?\",\"back\":\"En un método, this es el objeto de antes del punto: cuenta.depositar() ve esa cuenta.\\n\\nSi sacas el método y lo pasas solo (const f = cuenta.depositar; f()), this ya no es la cuenta. En modo estricto es undefined y truena.\\n\\nUna función flecha no tiene this propio: usa el de fuera. Por eso en un callback dentro de un método se prefiere la flecha.\\n\\nNo memorices las cuatro reglas el primer día. Regla práctica: si desarmas un método, no esperes que this siga siendo el objeto. Átalo con flecha o con .bind.\",\"topic\":\"this\",\"origin\":\"ai\",\"group\":\"Funciones\",\"difficulty\":\"advanced\"},{\"id\":\"js-clases\",\"part\":\"m\",\"front\":\"¿JavaScript tiene clases como Java?\",\"back\":\"Tiene la palabra class, y por debajo siguen siendo prototipos.\\n\\nclass Cuenta {\\n  constructor(saldo) { this.saldo = saldo }\\n  depositar(m) { this.saldo += m }\\n}\\n\\nclass Ahorro extends Cuenta { ... }\\n\\nSirve para un modelo claro. No crea un tipo rígido: puedes seguir colgando propiedades raras en el objeto.\\n\\nEl prototipo es el mecanismo viejo: si un objeto no tiene el método, lo busca en su prototipo. class es una forma más legible de escribir eso. Si lees código antiguo verás Funcion.prototype.metodo = ....\",\"topic\":\"Clases\",\"origin\":\"ai\",\"group\":\"Objetos\",\"difficulty\":\"intermediate\"},{\"id\":\"js-modulos\",\"part\":\"m\",\"front\":\"¿Cómo parto el código en archivos?\",\"back\":\"export function doble(n) { return n * 2 }\\nimport { doble } from './math.js'\\n\\nEn el navegador el script lleva type=\\\"module\\\". En Node, o usas .mjs, o \\\"type\\\": \\\"module\\\" en package.json.\\n\\nexport default es el valor principal del archivo. Solo hay uno. Los export con nombre pueden ser varios.\\n\\nLas rutas de import en el navegador y en Node nativo llevan la extensión .js. Los empaquetadores (Vite, webpack) a veces te la perdonan. No mezcles require() de CommonJS con import en el mismo archivo si puedes evitarlo: son dos sistemas.\",\"topic\":\"Módulos\",\"origin\":\"ai\",\"group\":\"Proyecto\",\"difficulty\":\"basic\"},{\"id\":\"js-npm\",\"part\":\"m\",\"front\":\"¿Qué son package.json y node_modules?\",\"back\":\"npm init crea package.json: el nombre del proyecto, los scripts y la lista de dependencias.\\n\\nnpm install express las baja a node_modules y anota la versión.\\npackage-lock.json fija el árbol exacto. Se commitea. node_modules no: se reconstruye con npm install.\\n\\n\\\"scripts\\\": { \\\"test\\\": \\\"node --test\\\" } se corre con npm test.\\n\\nNo instales un paquete para una función de tres líneas. Cada dependencia es código de otra persona que vas a ejecutar.\",\"topic\":\"npm\",\"origin\":\"ai\",\"group\":\"Proyecto\",\"difficulty\":\"basic\"},{\"id\":\"js-json\",\"part\":\"m\",\"front\":\"¿Cómo convierto un objeto a texto y de vuelta?\",\"back\":\"const texto = JSON.stringify(persona)\\nconst otra = JSON.parse(texto)\\n\\nJSON no es un objeto de JavaScript: es texto. Las claves van entre comillas dobles. No admite undefined, funciones ni comentarios.\\n\\nJSON.parse de un texto mal formado lanza. Si viene de la red, va dentro de try o de la promesa de fetch, que ya rechaza si la respuesta no es usable.\\n\\nresponse.json() en fetch ya hace el parse. No hagas JSON.parse de algo que ya es objeto.\",\"topic\":\"JSON\",\"origin\":\"ai\",\"group\":\"Datos\",\"difficulty\":\"basic\"},{\"id\":\"js-promesas\",\"part\":\"m\",\"front\":\"¿Qué es una promesa y por qué el resultado no está en la siguiente línea?\",\"back\":\"Una promesa es un valor que llegará después: una respuesta HTTP, un archivo, un timer.\\n\\nfetch(url).then(r =\u003e r.json()).then(datos =\u003e console.log(datos))\\n\\nEl código de después del fetch NO espera. Sigue. El then corre cuando la respuesta existe.\\n\\nEstados: pending, fulfilled, rejected. Si nadie pone catch, el rechazo se vuelve un error no atrapado.\\n\\nAnalogía: un ticket de la tintorería. No te llevas la ropa; te llevas el ticket, y vuelves cuando está lista. Quedarte parado en la puerta es bloquear, y en el navegador congelarías la página.\",\"topic\":\"Promesas\",\"origin\":\"ai\",\"group\":\"Asincronía\",\"difficulty\":\"intermediate\"},{\"id\":\"js-async\",\"part\":\"m\",\"front\":\"¿Cómo escribo una promesa para que se lea en orden?\",\"back\":\"async function cargar(url) {\\n  try {\\n    const r = await fetch(url)\\n    if (!r.ok) throw new Error('http ' + r.status)\\n    return await r.json()\\n  } catch (e) {\\n    console.error(e)\\n  }\\n}\\n\\nawait pausa ESA función hasta que la promesa se resuelve. No pausa el resto del programa.\\n\\nawait solo vale dentro de async. Si olvidas await, tienes una promesa donde esperabas los datos, y datos.nombre es undefined.\\n\\nPara esperar varias a la vez: const [a, b] = await Promise.all([p1, p2]). Una detrás de otra es más lenta si no dependen.\",\"topic\":\"async / await\",\"origin\":\"ai\",\"group\":\"Asincronía\",\"difficulty\":\"intermediate\"},{\"id\":\"js-event-loop\",\"part\":\"m\",\"front\":\"¿Cómo puede JavaScript hacer varias cosas si tiene un solo hilo?\",\"back\":\"Hay una pila (lo que se ejecuta ahora) y una cola (lo que está listo para después: clicks, respuestas HTTP, timers).\\n\\nCuando la pila se vacía, el event loop toma el siguiente de la cola.\\n\\nPor eso un for enorme congela la página: no suelta la pila, y el click espera. Y por eso console.log(1); setTimeout(() =\u003e console.log(2), 0); console.log(3) imprime 1, 3, 2. El timer entra a la cola, no se cuela en la pila.\\n\\nNo es paralelismo de verdad. Si necesitas núcleos, en Node existen worker threads; en el navegador, workers. La mayoría del código no los necesita: necesita no bloquear.\",\"topic\":\"Event loop\",\"origin\":\"ai\",\"group\":\"Asincronía\",\"difficulty\":\"advanced\"},{\"id\":\"js-dom\",\"part\":\"m\",\"front\":\"¿Qué es el DOM y cómo reacciono a un click?\",\"back\":\"El DOM es el árbol de la página ya convertido en objetos. document.querySelector('#btn') busca un elemento. elemento.textContent cambia el texto. No armes HTML concatenando strings de un usuario: es la puerta del XSS.\\n\\nboton.addEventListener('click', () =\u003e { ... }) registra una función. Cuando el click ocurre, el navegador la pone en la cola.\\n\\nEl script que busca un botón antes de que el HTML exista no lo encuentra. Pon el script al final del body, o espera DOMContentLoaded.\\n\\nNode no tiene DOM. Si un tutorial usa document y tú estás en node app.js, estás en el sitio equivocado.\",\"topic\":\"DOM\",\"origin\":\"ai\",\"group\":\"Navegador\",\"difficulty\":\"basic\"},{\"id\":\"js-fetch\",\"part\":\"m\",\"front\":\"¿Cómo llamo una API y qué NO hace fetch por mí?\",\"back\":\"const r = await fetch(url)\\nfetch solo rechaza la promesa si no hubo red. Un 404 o un 500 siguen siendo \\\"éxito\\\" de la promesa: tienes que mirar r.ok o r.status.\\n\\nconst datos = await r.json()\\n\\nPara enviar JSON:\\nfetch(url, {\\n  method: 'POST',\\n  headers: { 'Content-Type': 'application/json' },\\n  body: JSON.stringify({ nombre: 'Ana' })\\n})\\n\\nEn el navegador, otro dominio puede bloquearte por CORS. Eso lo decide el servidor, no tu fetch. Un error de CORS no se arregla leyendo r.status: la respuesta ni te llega.\",\"topic\":\"fetch\",\"origin\":\"ai\",\"group\":\"Navegador\",\"difficulty\":\"intermediate\"},{\"id\":\"js-errores\",\"part\":\"m\",\"front\":\"¿Qué mensajes voy a ver en la consola?\",\"back\":\"• SyntaxError: faltó una llave, una coma o un paréntesis. El archivo ni arranca.\\n• ReferenceError: usaste un nombre que no existe.\\n• TypeError: Cannot read properties of undefined. Llamaste .nombre sobre undefined. Casi siempre un ? que faltó o un await que faltó.\\n• UnhandledPromiseRejection: una promesa falló y no hubo catch ni try.\\n\\nAbre la consola del navegador o mira la terminal de Node. El número de línea es la verdad. Un console.log justo antes del tronido vale más que volver a leer el tutorial.\",\"topic\":\"Errores comunes\",\"origin\":\"ai\",\"group\":\"Proyecto\",\"difficulty\":\"basic\"},{\"id\":\"js-typescript\",\"part\":\"m\",\"front\":\"¿Cuándo dejo JavaScript pelado y escribo TypeScript?\",\"back\":\"TypeScript es JavaScript más anotaciones que un compilador borra. El navegador no ejecuta TypeScript: se compila a JavaScript.\\n\\nfunction doble(n: number): number { return n * 2 }\\n\\nTe avisa si pasas un string, antes de correr. En un archivo de 30 líneas no paga. En un proyecto con varias personas y varios módulos, paga el primer mes.\\n\\nNo es otro lenguaje para la web: es el mismo, con un revisor. any apaga el revisor. Si todo es any, no estás usando TypeScript.\\n\\nEmpieza cuando ya entiendes objetos, undefined y promesas. Si no, el error del compilador y el error de la lógica se mezclan.\",\"topic\":\"TypeScript\",\"origin\":\"ai\",\"group\":\"Proyecto\",\"difficulty\":\"intermediate\"}]},\"deckEn\":{\"quizId\":\"fundamentals-javascript\",\"quizTitle\":\"JavaScript — From zero to usable\",\"cardCount\":24,\"kind\":\"standalone\",\"category\":\"languages\",\"emoji\":\"🟨\",\"description\":\"A JavaScript course in cards: the browser and Node, types, functions, arrays, promises, and how the web is put together. Includes when to move to TypeScript.\",\"cards\":[{\"id\":\"js-mapa\",\"part\":\"m\",\"front\":\"What do you need to know in JavaScript to read real code?\",\"back\":\"1. Where it runs: the browser or Node.\\n2. let and const, types, and ===.\\n3. Objects, arrays, and functions.\\n4. map, filter, and destructuring.\\n5. Modules and npm.\\n6. Promises and async/await: almost all modern web code is asynchronous.\\n7. The DOM, if it is the browser. The event loop, so you do not get lost.\\n8. TypeScript, when the project no longer fits in your head.\\n\\nJavaScript forgives too much. The course is so you stop leaning on that forgiveness.\",\"topic\":\"Mapa del curso\",\"origin\":\"ai\",\"group\":\"Empezar\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-donde\",\"part\":\"m\",\"front\":\"Is JavaScript the browser language, or does it also run on a server?\",\"back\":\"The language is the same. What sits around it changes.\\n\\n• Browser: window, document, buttons, fetch to an API. You do not read files from the user's disk, for security.\\n• Node: a program on your machine or a server. You have files, processes, and npm. There is no document.\\n\\nA .js file runs with node app.js. In the browser it goes in a script tag or the page loads it.\\n\\nIt is not Java. The name is a marketing accident from the nineties. The syntax looks a little alike; the library and the model do not.\",\"topic\":\"Navegador y Node\",\"origin\":\"ai\",\"group\":\"Empezar\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-let-const\",\"part\":\"m\",\"front\":\"Why don't I use var?\",\"back\":\"• const name = 'Ana' cannot be reassigned. Use it by default.\\n• let age = 28 can be reassigned. Use it when the value changes (a counter).\\n• var is the old one: it is visible in the whole function, not just the block, and it is hoisted. Do not write it in new code.\\n\\nconst does not freeze an object. const person = {age: 28} and then person.age = 29 is legal: you did not reassign the variable, you changed the object.\\n\\nIf you want the object not to change, that is another tool (Object.freeze) and you almost never need it.\",\"topic\":\"let, const, var\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-tipos\",\"part\":\"m\",\"front\":\"What types are there, and why is typeof null 'object'?\",\"back\":\"number (there is no separate int; 7 and 3.14 are number), string, boolean, undefined, object, function, bigint, symbol.\\n\\nnull means \\\"empty on purpose\\\". undefined means \\\"there is nothing yet\\\". Do not treat them as the same.\\n\\ntypeof null === 'object' is a historical bug in the language. To test for null you write value === null.\\n\\nObjects and arrays have type object. Array.isArray(x) tells an array apart.\\n\\nJavaScript converts types if you let it: '5' + 1 is '51' (it concatenated). '5' - 1 is 4 (it subtracted). That inconsistency is why you write === and do not mix types.\",\"topic\":\"Tipos\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-igualdad\",\"part\":\"m\",\"front\":\"Why do I compare with === and not ==?\",\"back\":\"=== compares value and type, without converting. '5' === 5 is false.\\n\\n== converts first. '5' == 5 is true. [] == false is true. It is a coercion table that is not worth memorizing because you will get it wrong.\\n\\nUse === and !== always. If you want a number, convert yourself: Number(text).\\n\\nCareful: NaN === NaN is false. Number.isNaN(x) is the right test. NaN shows up from Number('hello') or 0/0.\",\"topic\":\"=== y ==\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-truthy\",\"part\":\"m\",\"front\":\"What counts as false inside an if?\",\"back\":\"These are falsy: false, 0, -0, '', null, undefined, and NaN. Everything else is truthy, including [], {}, and '0'.\\n\\nif (name) does not tell \\\"it did not come\\\" from \\\"it came empty\\\". Sometimes you wanted if (name != null).\\n\\nThe ?? operator only substitutes null or undefined:\\nconst n = input ?? 'guest'\\n\\n|| substitutes any falsy value, so 0 || 10 returns 10. If 0 is valid data (an age, a price), use ??, not ||.\",\"topic\":\"Truthy y falsy\",\"origin\":\"ai\",\"group\":\"Control\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-funciones\",\"part\":\"m\",\"front\":\"How many ways are there to write a function?\",\"back\":\"function twice(n) {\\n  return n * 2\\n}\\n\\nconst twice2 = (n) =\u003e n * 2\\n\\nThe arrow is short and does NOT have its own this. Use it in callbacks: nums.map(n =\u003e n * 2).\\n\\nfunction can be called from higher up in the file (it is hoisted). A const arrow cannot: it has to exist before you use it.\\n\\nIf you omit return, the function returns undefined. An arrow with braces { return x } needs the return; without braces, the value is returned on its own.\",\"topic\":\"Funciones\",\"origin\":\"ai\",\"group\":\"Funciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-objetos\",\"part\":\"m\",\"front\":\"What does an object look like, and how do I read a property that might be missing?\",\"back\":\"const person = { name: 'Ana', age: 28 }\\nperson.name\\nperson['name']\\n\\nIf the property does not exist, the result is undefined, not an error. That is why bugs drag on: you continued with undefined and it crashed three lines later.\\n\\nperson.city?.country with ?. stops if city is null or undefined, instead of throwing.\\n\\nKeys are strings (or symbols). An object is not an ordered map of anything: for keys that are not text, or to avoid 'toString' colliding, use Map.\",\"topic\":\"Objetos\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-arrays\",\"part\":\"m\",\"front\":\"Which array methods do I use all the time?\",\"back\":\"const nums = [10, 20, 30]\\n\\n• nums.push(40) adds at the end. nums.pop() removes the last.\\n• nums[0] is the first. The length is nums.length.\\n• nums.includes(20), nums.slice(0, 2) copies a span without modifying.\\n• nums.splice does modify: use it carefully.\\n\\nmap, filter, and find do not modify the original: they return another array or one element.\\n\\nAn array is an object with indexes. You can punch a hole (nums[10] = 1 on an array of 3) and length grows with empty slots. Do not do that.\",\"topic\":\"Arrays\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-map-filter\",\"part\":\"m\",\"front\":\"When do I use map, filter, or reduce?\",\"back\":\"• map transforms each element: nums.map(n =\u003e n * 2). The result has the same length.\\n• filter keeps the ones that pass: nums.filter(n =\u003e n \u003e 10).\\n• find returns the first that matches, or undefined.\\n• reduce folds the array into one value: a sum, a grouped object.\\n\\nreduce is powerful and easy to make unreadable. If it is a sum, nums.reduce((a, n) =\u003e a + n, 0). If it is five lines with ifs, a for usually reads better.\\n\\nThe second argument of reduce is the starting value. Without it, the first element becomes the start and an empty array crashes.\",\"topic\":\"map, filter, reduce\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-destructuring\",\"part\":\"m\",\"front\":\"What do const { name } = person and ...nums mean?\",\"back\":\"Pull fields out:\\nconst { name, age } = person\\nconst [first, second] = nums\\n\\nCopy and add without mutating:\\nconst copy = { ...person, city: 'CDMX' }\\nconst more = [...nums, 40]\\n\\nObject spread is shallow: if there is an object inside, it is shared.\\n\\nIn parameters: function greet({ name }) takes an object and keeps the field. You will see it in components and in a function's options.\\n\\nOrder matters when you mix: { ...base, active: true } overwrites active. { active: true, ...base } lets base overwrite it.\",\"topic\":\"Desestructurar y spread\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"intermediate\"},{\"id\":\"js-closures\",\"part\":\"m\",\"front\":\"What is a closure, and why does a function remember a variable?\",\"back\":\"An inner function keeps seeing the variables from where it was born, even after that outer function has finished.\\n\\nfunction counter() {\\n  let n = 0\\n  return () =\u003e ++n\\n}\\nconst next = counter()\\nnext() // 1\\nnext() // 2\\n\\nn is not global. It lives \\\"inside\\\" next.\\n\\nIt is how you hide state without a class. It is also the cause of a classic bug: creating functions in a for with var so they all see the last value. With let, each turn has its own variable.\",\"topic\":\"Closures\",\"origin\":\"ai\",\"group\":\"Funciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"intermediate\"},{\"id\":\"js-this\",\"part\":\"m\",\"front\":\"Who does this point at, and why does it get lost?\",\"back\":\"In a method, this is the object before the dot: account.deposit() sees that account.\\n\\nIf you pull the method out and pass it alone (const f = account.deposit; f()), this is no longer the account. In strict mode it is undefined and it crashes.\\n\\nAn arrow function has no this of its own: it uses the outer one. That is why a callback inside a method prefers an arrow.\\n\\nDo not memorize the four rules on day one. Practical rule: if you detach a method, do not expect this to stay the object. Tie it with an arrow or with .bind.\",\"topic\":\"this\",\"origin\":\"ai\",\"group\":\"Funciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"advanced\"},{\"id\":\"js-clases\",\"part\":\"m\",\"front\":\"Does JavaScript have classes like Java?\",\"back\":\"It has the word class, and underneath they are still prototypes.\\n\\nclass Account {\\n  constructor(balance) { this.balance = balance }\\n  deposit(m) { this.balance += m }\\n}\\n\\nclass Savings extends Account { ... }\\n\\nIt is good for a clear model. It does not create a rigid type: you can still hang odd properties on the object.\\n\\nThe prototype is the old mechanism: if an object does not have the method, it looks on its prototype. class is a more readable way to write that. If you read old code you will see Function.prototype.method = ....\",\"topic\":\"Clases\",\"origin\":\"ai\",\"group\":\"Objetos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"intermediate\"},{\"id\":\"js-modulos\",\"part\":\"m\",\"front\":\"How do I split code into files?\",\"back\":\"export function twice(n) { return n * 2 }\\nimport { twice } from './math.js'\\n\\nIn the browser the script carries type=\\\"module\\\". In Node, you either use .mjs or \\\"type\\\": \\\"module\\\" in package.json.\\n\\nexport default is the file's main value. There is only one. Named exports can be several.\\n\\nimport paths in the browser and in native Node include the .js extension. Bundlers (Vite, webpack) sometimes forgive you for leaving it off. Do not mix CommonJS require() with import in the same file if you can avoid it: they are two systems.\",\"topic\":\"Módulos\",\"origin\":\"ai\",\"group\":\"Proyecto\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-npm\",\"part\":\"m\",\"front\":\"What are package.json and node_modules?\",\"back\":\"npm init creates package.json: the project name, the scripts, and the dependency list.\\n\\nnpm install express downloads them into node_modules and notes the version.\\npackage-lock.json pins the exact tree. You commit it. You do not commit node_modules: it is rebuilt with npm install.\\n\\n\\\"scripts\\\": { \\\"test\\\": \\\"node --test\\\" } runs with npm test.\\n\\nDo not install a package for a three-line function. Every dependency is someone else's code that you are going to run.\",\"topic\":\"npm\",\"origin\":\"ai\",\"group\":\"Proyecto\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-json\",\"part\":\"m\",\"front\":\"How do I turn an object into text and back?\",\"back\":\"const text = JSON.stringify(person)\\nconst again = JSON.parse(text)\\n\\nJSON is not a JavaScript object: it is text. Keys go in double quotes. It does not allow undefined, functions, or comments.\\n\\nJSON.parse of malformed text throws. If it comes from the network, it belongs inside try or in fetch's promise, which already rejects if the response is not usable.\\n\\nresponse.json() in fetch already parses. Do not JSON.parse something that is already an object.\",\"topic\":\"JSON\",\"origin\":\"ai\",\"group\":\"Datos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-promesas\",\"part\":\"m\",\"front\":\"What is a promise, and why isn't the result on the next line?\",\"back\":\"A promise is a value that will arrive later: an HTTP response, a file, a timer.\\n\\nfetch(url).then(r =\u003e r.json()).then(data =\u003e console.log(data))\\n\\nThe code after fetch does NOT wait. It continues. then runs when the response exists.\\n\\nStates: pending, fulfilled, rejected. If nobody attaches catch, the rejection becomes an unhandled error.\\n\\nAnalogy: a dry-cleaner ticket. You do not take the clothes; you take the ticket, and you come back when they are ready. Standing in the doorway is blocking, and in the browser you would freeze the page.\",\"topic\":\"Promesas\",\"origin\":\"ai\",\"group\":\"Asincronía\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"intermediate\"},{\"id\":\"js-async\",\"part\":\"m\",\"front\":\"How do I write a promise so it reads in order?\",\"back\":\"async function load(url) {\\n  try {\\n    const r = await fetch(url)\\n    if (!r.ok) throw new Error('http ' + r.status)\\n    return await r.json()\\n  } catch (e) {\\n    console.error(e)\\n  }\\n}\\n\\nawait pauses THAT function until the promise settles. It does not pause the rest of the program.\\n\\nawait is only valid inside async. If you forget await, you have a promise where you expected the data, and data.name is undefined.\\n\\nTo wait for several at once: const [a, b] = await Promise.all([p1, p2]). One after another is slower if they do not depend on each other.\",\"topic\":\"async / await\",\"origin\":\"ai\",\"group\":\"Asincronía\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"intermediate\"},{\"id\":\"js-event-loop\",\"part\":\"m\",\"front\":\"How can JavaScript do several things if it has one thread?\",\"back\":\"There is a stack (what runs now) and a queue (what is ready for later: clicks, HTTP responses, timers).\\n\\nWhen the stack empties, the event loop takes the next item from the queue.\\n\\nThat is why a huge for freezes the page: it does not release the stack, and the click waits. And that is why console.log(1); setTimeout(() =\u003e console.log(2), 0); console.log(3) prints 1, 3, 2. The timer enters the queue; it does not cut in line on the stack.\\n\\nIt is not real parallelism. If you need cores, Node has worker threads; the browser has workers. Most code does not need them: it needs to not block.\",\"topic\":\"Event loop\",\"origin\":\"ai\",\"group\":\"Asincronía\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"advanced\"},{\"id\":\"js-dom\",\"part\":\"m\",\"front\":\"What is the DOM, and how do I react to a click?\",\"back\":\"The DOM is the page tree already turned into objects. document.querySelector('#btn') finds an element. element.textContent changes the text. Do not build HTML by concatenating a user's strings: that is the door to XSS.\\n\\nbutton.addEventListener('click', () =\u003e { ... }) registers a function. When the click happens, the browser puts it on the queue.\\n\\nA script that looks for a button before the HTML exists will not find it. Put the script at the end of body, or wait for DOMContentLoaded.\\n\\nNode has no DOM. If a tutorial uses document and you are in node app.js, you are in the wrong place.\",\"topic\":\"DOM\",\"origin\":\"ai\",\"group\":\"Navegador\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-fetch\",\"part\":\"m\",\"front\":\"How do I call an API, and what does fetch NOT do for me?\",\"back\":\"const r = await fetch(url)\\nfetch only rejects the promise if there was no network. A 404 or a 500 are still a \\\"success\\\" of the promise: you have to look at r.ok or r.status.\\n\\nconst data = await r.json()\\n\\nTo send JSON:\\nfetch(url, {\\n  method: 'POST',\\n  headers: { 'Content-Type': 'application/json' },\\n  body: JSON.stringify({ name: 'Ana' })\\n})\\n\\nIn the browser, another domain can block you with CORS. The server decides that, not your fetch. A CORS error is not fixed by reading r.status: the response never reaches you.\",\"topic\":\"fetch\",\"origin\":\"ai\",\"group\":\"Navegador\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"intermediate\"},{\"id\":\"js-errores\",\"part\":\"m\",\"front\":\"Which messages will I see in the console?\",\"back\":\"• SyntaxError: a missing brace, comma, or parenthesis. The file does not even start.\\n• ReferenceError: you used a name that does not exist.\\n• TypeError: Cannot read properties of undefined. You called .name on undefined. It is almost always a missing ? or a missing await.\\n• UnhandledPromiseRejection: a promise failed and there was no catch or try.\\n\\nOpen the browser console or look at the Node terminal. The line number is the truth. A console.log right before the crash is worth more than rereading the tutorial.\",\"topic\":\"Errores comunes\",\"origin\":\"ai\",\"group\":\"Proyecto\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"basic\"},{\"id\":\"js-typescript\",\"part\":\"m\",\"front\":\"When do I leave plain JavaScript and write TypeScript?\",\"back\":\"TypeScript is JavaScript plus annotations that a compiler erases. The browser does not run TypeScript: it is compiled to JavaScript.\\n\\nfunction twice(n: number): number { return n * 2 }\\n\\nIt warns you if you pass a string, before you run. On a 30-line file it does not pay off. On a project with several people and several modules, it pays off in the first month.\\n\\nIt is not another language for the web: it is the same one, with a reviewer. any turns the reviewer off. If everything is any, you are not using TypeScript.\\n\\nStart when you already understand objects, undefined, and promises. Otherwise the compiler error and the logic error get mixed together.\",\"topic\":\"TypeScript\",\"origin\":\"ai\",\"group\":\"Proyecto\",\"lang\":\"en\",\"esDeck\":\"fundamentals-javascript\",\"difficulty\":\"intermediate\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
