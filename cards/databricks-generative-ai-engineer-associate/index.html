oth neighboring chunks are retrieved together, but neither chunk individually contains the complete instruction, so the response context is still fragmented across two partial chunks.B. A domain-tuned embedding model can improve semantic matching for retrieval, but it does not change where chunk boundaries fall, so the instruction would still be split across two chunks.C. Physical storage order in the vector index does not affect which chunks are returned for a similarity search, so this does not help the retriever surface the complete instruction.D. Adding overlap between adjacent chunks means content near a boundary is duplicated into both chunks, so an instruction that straddles the boundary will appear in full inside at least one chunk and can be retrieved intact. (Respuesta correcta: Configure adjacent chunks to overlap by a set number of tokens so boundary content appears in more than one chunk.)\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"3\"}},{\"id\":\"4::m\",\"questionId\":\"4\",\"part\":\"m\",\"front\":\"¿Qué pipeline_type de un índice Delta Sync sincroniza solo cuando se dispara tras cada carga?\",\"back\":\"A. A triggered pipeline type syncs the index on demand or on a schedule the team controls, which matches a workflow where new data lands once nightly and the index only needs to refresh after that batch is written.B. A continuous pipeline type keeps compute running at all times to sync near-instantly as changes occur, which is unnecessary and more costly for a workload that only produces new data once per night.C. A direct access index requires the application to manage embeddings and upserts itself via API calls rather than syncing from a Delta table, which abandons the Delta table-driven sync workflow the team already has in place.D. (Respuesta correcta: Create the Delta Sync Index with `pipeline_type=\\\"TRIGGERED\\\"` so the index only syncs when explicitly triggered o rieved results, which is a diagnostic overview rather than a targeted measure of whether the very top result is correct. (Respuesta correcta: Precision@k evaluated at a small k, such as precision@3, to confirm that nearly every top result is relevant)\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"6\"}},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"front\":\"¿Qué cambio en el troceado conserva los hechos que caen en el límite entre chunks?\",\"back\":\"A. Switching to a fixed-character splitter changes where boundaries fall but does not add continuity across them, so facts can still be split between chunks just as before, only at different points in the text.B. Shrinking the chunk size increases the number of boundaries in the document, which makes it more likely, not less, that a given fact will end up split across two separate chunks.C. Retrieving more chunks increases the chance that a second chunk with the missing fact is also returned, but it does not guarantee it, and it adds noise and cost to the prompt without directly fixing the boundary-splitting issue.D. Carrying a window of trailing sentences from one chunk into the next, known as chunk overlap, ensures continuity across the boundary so a fact split between two chunks is likely to appear intact in at least one of them. (Respuesta correcta: Configure the chunker to carry a window of trailing sentences into the start of the next chunk.)\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"7\"}},{\"id\":\"8::m\",\"questionId\":\"8\",\"part\":\"m\",\"front\":\"¿Cómo usar una comparación de DCG@10 con y sin reranker por tipo de consulta?\",\"back\":\"$11\",\"topic\":\"DCG\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"8\"}},{\"id\":\"9::c2\",\"questionId\":\"9\",\"part\":\"c2\",\"front\":\"¿Por qué limpiar el HTML (menús, anuncios) antes de trocear para RAG?\",\"back\":\"This prevents noisy text from ever entering the vector index and degrading RAG retrieval.B. (Respuesta correcta: Parse the HTML with a library that isolates the main article content and strips navigation, ad, and boilerplate elements before extracting text.)\",\"topic\":\"RAG\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"9\"}},{\"id\":\"9::c3\",\"questionId\":\"9\",\"part\":\"c3\",\"front\":\"¿Basta con pedir al LLM que ignore el ruido del HTML?\",\"back\":\"Relying on the LLM to ignore irrelevant navigation-menu, cookie-consent, and sidebar-ad sections at answer time does not fix the underlying data quality problem and still consumes context window and retrieval capacity with noisy content. (Respuesta correcta: Parse the HTML with a library that isolates the main article content and strips navigation, ad, and boilerplate elements before extracting text.)\",\"topic\":\"LLM\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"9\"}},{\"id\":\"10::m\",\"questionId\":\"10\",\"part\":\"m\",\"front\":\"¿Qué juez integrado de MLflow GenAI necesita una respuesta esperada etiquetada?\",\"back\":\"A. Correctness explicitly needs a labeled expected answer supplied as ground truth, against which it compares the generated response to score factual accuracy; without that label, the judge cannot run.B. Safety is a reference-free judge that assesses whether content is harmful, offensive, or toxic based on the response alone, so it does not require any labeled expected answer.C. RelevanceToQuery is reference-free and only needs the question and the response to judge whether the response addresses the query's intent.D. (Respuesta correcta: Correctness, which compares the generated response against a labeled expected answer to score factual accuracy)\",\"topic\":\"RelevanceToQuery\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"10\"}},{\"id\":\"10::c2\",\"questionId\":\"10\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa RetrievalGroundedness?\",\"back\":\"RetrievalGroundedness is reference-free and checks whether the response is supported by the retrieved context, not by a labeled ground-truth answer. (Respuesta correcta: Correctness, which compares the generated response against a labeled expected answer to score factual accuracy)\",\"topic\":\"RetrievalGroundedness\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"10\"}},{\"id\":\"11::c2\",\"questionId\":\"11\",\"part\":\"c2\",\"front\":\"¿Qué paquete envuelve funciones de Unity Catalog como herramientas de LangChain?\",\"back\":\"This package provides the LangChain integrations, including a toolkit that wraps Unity Catalog functions so they can be passed directly into a LangChain agent's tool list.B. (Respuesta correcta: databricks-langchain)\",\"topic\":\"Unity Catalog\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"11\"}},{\"id\":\"11::c3\",\"questionId\":\"11\",\"part\":\"c3\",\"front\":\"¿Para qué sirve databricks-connect?\",\"back\":\"This package is a client for running Spark workloads against a remote Databricks cluster from a local environment; it has nothing to do with wrapping UC functions as LangChain tools.C. (Respuesta correcta: databricks-langchain)\",\"topic\":\"LangChain\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"11\"}},{\"id\":\"11::c4\",\"questionId\":\"11\",\"part\":\"c4\",\"front\":\"¿Qué es / para qué se usa Feature Store?\",\"back\":\"This package is used for managing feature tables and feature lookups in the Feature Store, which is unrelated to exposing UC functions as LangChain tools. (Respuesta correcta: databricks-langchain)\",\"topic\":\"Feature Store\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"11\"}},{\"id\":\"12::m\",\"questionId\":\"12\",\"part\":\"m\",\"front\":\"¿Qué atributo priorizar en un LLM para resumir contratos largos en un solo prompt?\",\"back\":\"$12\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"12\"}},{\"id\":\"13::m\",\"questionId\":\"13\",\"part\":\"m\",\"front\":\"¿Qué modelo elegir si uno cumple la latencia requerida con calidad casi igual?\",\"back\":\"$13\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"13\"}},{\"id\":\"14::m\",\"questionId\":\"14\",\"part\":\"m\",\"front\":\"¿Qué pesa más al elegir modelo: los rankings generales o tu propia evaluación de la tarea?\",\"back\":\"$14\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"14\"}},{\"id\":\"15::m\",\"questionId\":\"15\",\"part\":\"m\",\"front\":\"¿Qué herramienta de LangChain envuelve un índice de vector search gestionado por Databricks?\",\"back\":\"A. This is incorrect because an embeddings class produces vector representations of text; it is not itself a retriever tool and cannot be passed to an agent as a callable tool.C. This is incorrect because standing up a managed MCP server is the recommended path for production-grade, governed access, but it adds infrastructure overhead unnecessary for quick local prototyping against an already Databricks-managed index.D. (Respuesta correcta: Install `databricks-langchain` and instantiate `VectorSearchRetrieverTool` with the `index_name` and `tool_description` parameters.)\",\"topic\":\"MCP\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"15\"}},{\"id\":\"15::c2\",\"questionId\":\"15\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Databricks AI Bridge?\",\"back\":\"This is correct because this class from the Databricks AI Bridge package is purpose-built to wrap a Databricks-managed vector index as a ready-to-use LangChain tool with minimal setup for local prototyping.B. (Respuesta correcta: Install `databricks-langchain` and instantiate `VectorSearchRetrieverTool` with the `index_name` and `tool_description` parameters.)\",\"topic\":\"Databricks AI Bridge\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"15\"}},{\"id\":\"16::m\",\"questionId\":\"16\",\"part\":\"m\",\"front\":\"¿Cómo obtiene un agente el resultado tabular de un mensaje de Genie?\",\"back\":\"A. This is correct because message processing is asynchronous: the agent must poll the message endpoint until a conclusive status is reached before the generated SQL's results become retrievable via the query-result endpoint keyed by attachment ID.B. This is incorrect because deleting a conversation removes it rather than finalizing it, and starting a brand-new conversation discards the in-progress question instead of retrieving its results.D. This is incorrect because repeatedly calling start-conversation creates a new conversation thread each time rather than checking the status of the message that was already submitted. (Respuesta correcta: Poll `GET .../messages/{message_id}` until the status is conclusive (such as completed), then call `GET .../messages/{message_id}/query-result/{attachment_id}` to fetch the rows.)\",\"topic\":\"ID.B\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"16\"}},{\"id\":\"17::m\",\"questionId\":\"17\",\"part\":\"m\",\"front\":\"¿Cómo elegir modelo con métricas de calidad, latencia y coste registradas en MLflow?\",\"back\":\"A. Choosing purely on cost and deferring quality verification to after deployment abandons the experiment metrics that were already collected and risks shipping a model that fails the minimum quality bar.B. Optimizing only for latency ignores the logged quality and cost metrics, so the selected model could fail the minimum quality bar or exceed the target cost despite meeting the latency goal.C. Filtering out runs that fail the quality threshold before comparing latency and cost across the remaining candidates directly uses all three logged metrics to satisfy the quality bar, latency target, and cost goal together.D. Ignoring the logged latency and cost metrics risks selecting a model that violates the sub-second response requirement or exceeds the cost target, even though it scored well on quality. (Respuesta correcta: Filter the runs to those meeting the minimum quality score, then among the remaining runs choose the one with the lowest combined latency and cost.)\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"17\"}},{\"id\":\"18::m\",\"questionId\":\"18\",\"part\":\"m\",\"front\":\"¿Qué cambio de prompt asegura una salida JSON que se pueda parsear?\",\"back\":\"$15\",\"topic\":\"JSON\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"18\"}},{\"id\":\"19::c2\",\"questionId\":\"19\",\"part\":\"c2\",\"front\":\"¿Qué contexto añadir al prompt para responder sobre el stock en la tienda habitual?\",\"back\":\"Adding the resolved store ID and the relevant current SKU inventory data lets the LLM answer accurately instead of reasoning from vague or inferred facts.B. (Respuesta correcta: Detect the entities \\\"blue XL hoodie\\\" and \\\"usual store\\\" in the message, resolve \\\"usual store\\\" against the user's stored default store ID, and add the resolved store ID and current inventory data for the SKU into the prompt context.)\",\"topic\":\"SKU\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"19\"}},{\"id\":\"20::c2\",\"questionId\":\"20\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa LangChain Expression Language?\",\"back\":\"Correct: the pipe operator is LangChain Expression Language's standard syntax for composing Runnables, so linking the prompt template, chat model, and output parser this way builds a single sequential chain.B. (Respuesta correcta: Chain the components with the pipe operator: `prompt | llm | output_parser`, composing them into one Runnable in sequence.)\",\"topic\":\"LangChain Expression Language\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"20\"}},{\"id\":\"20::c3\",\"questionId\":\"20\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa RunnableSequence?\",\"back\":\"Incorrect: `RunnableSequence` is not instantiated with a `steps` keyword this way; the pipe operator is the documented syntax that builds a `RunnableSequence` under the hood. (Respuesta correcta: Chain the components with the pipe operator: `prompt | llm | output_parser`, composing them into one Runnable in sequence.)\",\"topic\":\"RunnableSequence\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"20\"}},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"front\":\"¿Cómo hacer que un agente en Model Serving respete los permisos de cada usuario final?\",\"back\":\"$16\",\"topic\":\"API\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"21\"},\"related\":31},{\"id\":\"22::m\",\"questionId\":\"22\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa HYBRID?\",\"back\":\"A. HYBRID query type combines vector similarity with keyword matching, and the `filters` argument restricts results to matching metadata, together satisfying both requirements.B. The `columns` parameter only controls which fields are returned in the results; it does not restrict which documents are searched, so category filtering would not actually apply.D. A full-text query type performs keyword-based search and does not automatically blend in semantic vector scoring, so it would not provide the combined similarity behavior needed. (Respuesta correcta: Set `query_type=\\\"HYBRID\\\"` and pass `filters={\\\"category\\\": \\\"electronics\\\"}` in the `similarity_search` call.)\",\"topic\":\"HYBRID\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"22\"}},{\"id\":\"22::c2\",\"questionId\":\"22\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa ANN?\",\"back\":\"ANN performs pure approximate nearest-neighbor vector search only; it does not blend in keyword scoring, so it would not improve recall for exact product-name matches.C. (Respuesta correcta: Set `query_type=\\\"HYBRID\\\"` and pass `filters={\\\"category\\\": \\\"electronics\\\"}` in the `similarity_search` call.)\",\"topic\":\"ANN\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"22\"}},{\"id\":\"23::m\",\"questionId\":\"23\",\"part\":\"m\",\"front\":\"¿Cómo acortar y estabilizar la salida de ai_query sin cambiar el prompt?\",\"back\":\"A. `files` is used to attach image content for multimodal requests; it is unrelated to text summarization and does not influence response length or determinism for a text-only prompt.B. Correct: `modelParameters` carries chat/completion controls like `max_tokens` and `temperature` straight through to the foundation model endpoint, so capping `max_tokens` bounds summary length and lowering `temperature` reduces run-to-run variability.C. `returnType` describes the expected schema of a custom endpoint's response for parsing purposes; it is not a truncation mechanism and has no effect on how much text a foundation chat model generates.D. The endpoint argument is a plain string identifying which serving endpoint to call; wrapping it in a struct does not change generation length and would break the call rather than configure output size. (Respuesta correcta: Pass `modelParameters =\u003e named_struct('max_tokens', 100, 'temperature', 0.2)` to cap the generation length and reduce output variability.)\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"23\"}},{\"id\":\"24::m\",\"questionId\":\"24\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa Discounted Cumulative Gain?\",\"back\":\"$17\",\"topic\":\"Discounted Cumulative Gain\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"24\"}},{\"id\":\"24::c2\",\"questionId\":\"24\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Mean Reciprocal Rank?\",\"back\":\"Mean Reciprocal Rank only considers the position of the first relevant result and ignores the graded relevance or ranking of any other results in the list. (Respuesta correcta: DCG@10)\",\"topic\":\"Mean Reciprocal Rank\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"24\"}},{\"id\":\"25::m\",\"questionId\":\"25\",\"part\":\"m\",\"front\":\"¿Qué es Lakebase en la memoria autogestionada de agentes?\",\"back\":\"A. Storing and retrieving embeddings for similarity search describes a vector search index, not Lakebase, which is a relational Postgres database rather than an embedding index.C. Lakebase is Databricks' fully managed, serverless Postgres OLTP database, and self-managed agent memory uses it as a durable store for short-term and long-term agent state such as checkpoints and conversation history. (Respuesta correcta: A fully managed, serverless Postgres OLTP database that agents use as a durable memory store.)\",\"topic\":\"OLTP\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"25\"}},{\"id\":\"25::c3\",\"questionId\":\"25\",\"part\":\"c3\",\"front\":\"¿Es Lakebase un servicio de planificación de tareas?\",\"back\":\"Lakebase is an operational Postgres database for transactional workloads, not a scheduling service, and it has no role in triggering Delta Lake table maintenance jobs.D. (Respuesta correcta: A fully managed, serverless Postgres OLTP database that agents use as a durable memory store.)\",\"topic\":\"Delta Lake\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"25\"}},{\"id\":\"26::m\",\"questionId\":\"26\",\"part\":\"m\",\"front\":\"¿Cómo exponer funciones de Unity Catalog como herramientas de un agente sin nueva infraestructura?\",\"back\":\"A. This is correct: Databricks hosts a managed Unity Catalog Functions MCP server that exposes registered SQL/Python functions as predefined tools at a workspace endpoint, with Unity Catalog enforcing which principals can call which function, so no additional hosting is required.B. Building a custom MCP server on Databricks Apps is unnecessary extra work here since the functions are already governed Unity Catalog objects that the managed Unity Catalog Functions server can expose directly without any app code or deployment.C. External MCP registration through Unity Catalog connections is meant for servers hosted outside Databricks; functions that already live in a Unity Catalog schema inside the workspace are served by the managed server, not treated as an external third-party connection.D. (Respuesta correcta: Connect the agent to the managed Unity Catalog Functions MCP server at `/api/2.0/mcp/functions/{catalog}/{schema}`, letting Unity Catalog permissions govern access.)\",\"topic\":\"MCP\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"26\"},\"related\":38},{\"id\":\"28::m\",\"questionId\":\"28\",\"part\":\"m\",\"front\":\"¿Qué acciones puede tomar un guardrail integrado del AI Gateway ante una infracción?\",\"back\":\"A. Built-in guardrails support two enforcement actions: blocking, which rejects the request or response outright with an error, and sanitizing, which dynamically rewrites the flagged text in place without terminating the request.B. Forwarding violations to an external SIEM tool and automatically downgrading the model are not guardrail enforcement actions; guardrails act on the content itself through blocking or sanitizing, not infrastructure changes.D. Caching flagged content and throttling rate limits are unrelated to how a guardrail responds to a detected violation; enforcement is limited to blocking the content or sanitizing it, not session-level rate control. (Respuesta correcta: Block the request or response outright, or sanitize it by rewriting the flagged content in place.)\",\"topic\":\"SIEM\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"28\"}},{\"id\":\"28::c2\",\"questionId\":\"28\",\"part\":\"c2\",\"front\":\"¿Pueden los guardrails reintentar la llamada o escalarla a revisión humana?\",\"back\":\"Retrying with a truncated context and escalating to a human queue are not actions that a Unity AI Gateway guardrail applies to flagged content; guardrails enforce policy directly rather than routing to manual review.C. (Respuesta correcta: Block the request or response outright, or sanitize it by rewriting the flagged content in place.)\",\"topic\":\"Unity AI Gateway\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"28\"}},{\"id\":\"29::m\",\"questionId\":\"29\",\"part\":\"m\",\"front\":\"¿Qué control limita las filas por región sin ocultar el importe?\",\"back\":\"A. Masking the region column would hide which region a visible row belongs to rather than restrict which rows are returned, so analysts would still see every row's claim amount regardless of region, failing the row-level requirement.B. Masking the claim_amount column directly contradicts the requirement that claim amounts remain fully visible to every analyst, and it does nothing to restrict rows by region.C. Filtering rows by claim amount threshold restricts access based on the wrong attribute, since the requirement is to restrict rows by region, not by the size of the claim amount.D. A row filter is designed to exclude entire rows based on a condition like matching region to team, which restricts which claims an analyst can see while leaving the claim amount column itself fully visible in the rows that remain. (Respuesta correcta: Attach a row filter function that excludes rows where the region does not match the querying user's team, leaving every column value unmasked.)\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"29\"}},{\"id\":\"30::m\",\"questionId\":\"30\",\"part\":\"m\",\"front\":\"¿Cómo mitigar el riesgo de copyright de un corpus RAG extraído de blogs?\",\"back\":\"A. A fair-use disclaimer in the prompt is not a legal determination and does not change the actual licensing status of the scraped content, so the underlying risk to the company persists.B. Swapping in first-party content or a dataset with a license that clearly permits the intended use removes the legal risk at its source, since the corpus no longer relies on ambiguous reuse terms.C. Citing the source URL may be good practice for attribution, but it does not resolve the underlying licensing uncertainty about whether the company is permitted to reuse and redistribute the scraped content.D. Shortening the chunk size changes how much text is retrieved per query, but the content still originates from a corpus with unresolved reuse rights, so the licensing risk remains unchanged. (Respuesta correcta: Replace the scraped blog corpus with first-party content or a dataset under a license that explicitly permits this use)\",\"topic\":\"URL\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"30\"}},{\"id\":\"31::m\",\"questionId\":\"31\",\"part\":\"m\",\"front\":\"¿Qué hacer antes de lanzar si el modelo de embeddings se entrenó con datos de licencia dudosa?\",\"back\":\"$18\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"31\"}},{\"id\":\"32::m\",\"questionId\":\"32\",\"part\":\"m\",\"front\":\"¿Qué modelo elegir si el más preciso incumple el requisito de latencia?\",\"back\":\"$19\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"32\"}},{\"id\":\"34::m\",\"questionId\":\"34\",\"part\":\"m\",\"front\":\"¿Qué debe devolver una función @scorer para mostrar puntuación y justificación?\",\"back\":\"A. A `str` can hold text, but jamming a score and reasoning into one unstructured sentence loses the distinct, queryable `value` and `rationale` fields that a `Feedback` object provides.B. A `Feedback` object is built for exactly this case: it pairs a `value` (the score) with a `rationale` (the explanation), giving stakeholders both the number and the reasoning behind it in a structured way attached to the trace.C. A plain `float` is a valid scorer return type, but it carries only the number with no place to attach an explanation, so it cannot satisfy the requirement for a visible written rationale.D. A list return is meant for reporting several distinct named metrics from one scorer, not for pairing a single score with an explanation; it does not provide a structured rationale field either. (Respuesta correcta: Return a `Feedback` object carrying a numeric `value` plus a `rationale` string explaining why that score was assigned)\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"34\"}},{\"id\":\"35::m\",\"questionId\":\"35\",\"part\":\"m\",\"front\":\"¿Cómo atribuir el gasto de un endpoint compartido del AI Gateway por unidad de negocio?\",\"back\":\"$1a\",\"topic\":\"HTTP\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"35\"}},{\"id\":\"35::c2\",\"questionId\":\"35\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa QPM?\",\"back\":\"A rate limit's configured QPM value is a throughput ceiling, not a measurement of what a group actually consumed. (Respuesta correcta: Attach custom key-value pairs to each request through the Databricks-Ai-Gateway-Request-Tags header, then group results by the request_tags column in the usage tracking system table.)\",\"topic\":\"QPM\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"35\"}}],\"cardCount\":45},\"deckEn\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"quizTitle\":\"Databricks Certified Generative AI Engineer Associate\",\"cardCount\":45,\"cards\":[{\"id\":\"1::m\",\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which model task extracts specific contract fields into a fixed-schema table?\",\"back\":\"A. Classification assigns each document to one of a set of predefined labels, which does not recover the specific field values the team needs to populate table columns.B. Pulling named fields such as dates, terms, and party names into a fixed schema is exactly what structured information extraction (e.g. `ai_extract`) is designed for, and it maps directly onto a Delta table with fixed columns.C. Generation would produce free-form prose summaries, which do not give the fixed, queryable columns (start date, term, counterparty) the team needs for the Delta table.D. A chat interface answers ad hoc questions interactively but does not batch-produce structured field values across thousands of documents for a table load. (Respuesta correcta: Structured information extraction against a defined schema)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"1\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"2::m\",\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How should an agent's tools be ordered so it never pays without checking coverage?\",\"back\":\"$1b\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"2\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"3::m\",\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which chunking setting keeps an instruction from being split across two chunks?\",\"back\":\"$1c\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"3\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"4::m\",\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which Delta Sync index pipeline_type syncs only when triggered after each load?\",\"back\":\"A. A triggered pipeline type syncs the index on demand or on a schedule the team controls, which matches a workflow where new data lands once nightly and the index only needs to refresh after that batch is written.B. A continuous pipeline type keeps compute running at all times to sync near-instantly as changes occur, which is unnecessary and more costly for a workload that only produces new data once per night.C. A direct access index requires the application to manage embeddings and upserts itself via API calls rather than syncing from a Delta table, which abandons the Delta table-driven sync workflow the team already has in place.D. (Respuesta correcta: Create the Delta Sync Index with `pipeline_type=\\\"TRIGGERED\\\"` so the index only syncs when explicitly triggered or scheduled after each nightly write completes.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"API\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"4\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"4::c2\",\"questionId\":\"4\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Delta Sync Index, and what is it used for?\",\"back\":\"A Delta Sync Index does not fall back to a fixed hourly schedule when `pipeline_type` is unspecified; the pipeline type must be explicitly chosen to control whether syncing is triggered or continuous. (Respuesta correcta: Create the Delta Sync Index with `pipeline_type=\\\"TRIGGERED\\\"` so the index only syncs when explicitly triggered or scheduled after each nightly write completes.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Delta Sync Index\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"4\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"5::m\",\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What should you do with forum posts containing personal data or offensive language before ingesting them for RAG?\",\"back\":\"$1d\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"5\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"6::m\",\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which metric evaluates whether the top search results are relevant?\",\"back\":\"$1e\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"6\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which chunking change preserves facts that fall on a chunk boundary?\",\"back\":\"$1 "ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"15\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"15::c2\",\"questionId\":\"15\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Databricks AI Bridge, and what is it used for?\",\"back\":\"This is correct because this class from the Databricks AI Bridge package is purpose-built to wrap a Databricks-managed vector index as a ready-to-use LangChain tool with minimal setup for local prototyping.B. (Respuesta correcta: Install `databricks-langchain` and instantiate `VectorSearchRetrieverTool` with the `index_name` and `tool_description` parameters.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Databricks AI Bridge\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"15\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"16::m\",\"questionId\":\"16\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How does an agent get the tabular result of a Genie message?\",\"back\":\"A. This is correct because message processing is asynchronous: the agent must poll the message endpoint until a conclusive status is reached before the generated SQL's results become retrievable via the query-result endpoint keyed by attachment ID.B. This is incorrect because deleting a conversation removes it rather than finalizing it, and starting a brand-new conversation discards the in-progress question instead of retrieving its results.D. This is incorrect because repeatedly calling start-conversation creates a new conversation thread each time rather than checking the status of the message that was already submitted. (Respuesta correcta: Poll `GET .../messages/{message_id}` until the status is conclusive (such as completed), then call `GET .../messages/{message_id}/query-result/{attachment_id}` to fetch the rows.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ID.B\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"16\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"17::m\",\"questionId\":\"17\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you pick a model using quality, latency and cost metrics logged in MLflow?\",\"back\":\"$24\",\"topic\":\"\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"17\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"18::m\",\"questionId\":\"18\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which prompt change ensures parseable JSON output?\",\"back\":\"$25\",\"topic\":\"JSON\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"18\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"19::c2\",\"questionId\":\"19\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What context should be added to the prompt to answer about stock at the usual store?\",\"back\":\"Adding the resolved store ID and the relevant current SKU inventory data lets the LLM answer accurately instead of reasoning from vague or inferred facts.B. (Respuesta correcta: Detect the entities \\\"blue XL hoodie\\\" and \\\"usual store\\\" in the message, resolve \\\"usual store\\\" against the user's stored default store ID, and add the resolved store ID and current inventory data for the SKU into the prompt context.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SKU\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"19\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"20::c2\",\"questionId\":\"20\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is LangChain Expression Language, and what is it used for?\",\"back\":\"Correct: the pipe operator is LangChain Expression Language's standard syntax for composing Runnables, so linking the prompt template, chat model, and output parser this way builds a single sequential chain.B. (Respuesta correcta: Chain the components with the pipe operator: `prompt | llm | output_parser`, composing them into one Runnable in sequence.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"LangChain Expression Language\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"20\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"20::c3\",\"questionId\":\"20\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is RunnableSequence, and what is it used for?\",\"back\":\"Incorrect: `RunnableSequence` is not instantiated with a `steps` keyword this way; the pipe operator is the documented syntax that builds a `RunnableSequence` under the hood. (Respuesta correcta: Chain the components with the pipe operator: `prompt | llm | output_parser`, composing them into one Runnable in sequence.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"RunnableSequence\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"20\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you make an agent on Model Serving respect each end user's permissions?\",\"back\":\"$26\",\"topic\":\"API\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"21\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"22::m\",\"questionId\":\"22\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is HYBRID, and what is it used for?\",\"back\":\"A. HYBRID query type combines vector similarity with keyword matching, and the `filters` argument restricts results to matching metadata, together satisfying both requirements.B. The `columns` parameter only controls which fields are returned in the results; it does not restrict which documents are searched, so category filtering would not actually apply.D. A full-text query type performs keyword-based search and does not automatically blend in semantic vector scoring, so it would not provide the combined similarity behavior needed. (Respuesta correcta: Set `query_type=\\\"HYBRID\\\"` and pass `filters={\\\"category\\\": \\\"electronics\\\"}` in the `similarity_search` call.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"HYBRID\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"22\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"22::c2\",\"questionId\":\"22\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is ANN, and what is it used for?\",\"back\":\"ANN performs pure approximate nearest-neighbor vector search only; it does not blend in keyword scoring, so it would not improve recall for exact product-name matches.C. (Respuesta correcta: Set `query_type=\\\"HYBRID\\\"` and pass `filters={\\\"category\\\": \\\"electronics\\\"}` in the `similarity_search` call.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ANN\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"22\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"23::m\",\"questionId\":\"23\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you shorten and stabilize ai_query output without changing the prompt?\",\"back\":\"$27\",\"topic\":\"\",\"origin\":\"ai\",\" e\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"25\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"25::c3\",\"questionId\":\"25\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"Is Lakebase a job scheduling service?\",\"back\":\"Lakebase is an operational Postgres database for transactional workloads, not a scheduling service, and it has no role in triggering Delta Lake table maintenance jobs.D. (Respuesta correcta: A fully managed, serverless Postgres OLTP database that agents use as a durable memory store.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Delta Lake\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"25\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"26::m\",\"questionId\":\"26\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you expose Unity Catalog functions as agent tools without new infrastructure?\",\"back\":\"$29\",\"topic\":\"MCP\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-generative-ai-engineer-associate\",\"questionId\":\"26\"},\"esDeck\":\"databricks-generative-ai-engineer-associate\"},{\"id\":\"28::m\",\"questionId\":\"28\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which actions can a built-in AI Gateway guardrail take on a violation?\",\"back\":\"A. Built-in guardrails support two enforcement actions: blocking, which rejects the request or response outright with an error, and sanitizing, which dynamically rewrites the flagged text in place without terminating the request.B. Forwarding violations to an external SIEM tool and automatically downgrading the model are not guardrail enforcement actions; guardrails act on the content itself through blocking or sanitizing, not infrastructure changes.D. Caching flagged content and throttling rate limits are unrelated to how a guardrail responds to a detected violation; enforcement
