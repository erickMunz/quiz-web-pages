matches rows where the value is Python None/SQL NULL, which is exactly the missing-data case this scenario wants to exclude, not the invalid calculation.C. (Respuesta correcta: sensor_df.filter(F.isnan(\\\"reading\\\")))\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"13\"},\"related\":12},{\"id\":\"13::c2\",\"questionId\":\"13\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa NaN?\",\"back\":\"Filtering with isNotNull() returns both valid numeric readings and NaN rows together, since NaN is a defined floating-point value rather than a null, so it fails to isolate the invalid rows.D. na.drop(subset=[\\\"reading\\\"]) removes rows with null values and returns everything else, which keeps the NaN rows mixed in with valid readings rather than isolating them.E. isnull() is functionally the same null check as isNull(), so it identifies missing-data rows rather than the NaN rows produced by the invalid calculation. (Respuesta correcta: sensor_df.filter(F.isnan(\\\"reading\\\")))\",\"topic\":\"NaN\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"13\"}},{\"id\":\"14::m\",\"questionId\":\"14\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa DataFrame?\",\"back\":\"$11\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"14\"},\"related\":13},{\"id\":\"15::m\",\"questionId\":\"15\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa SAVE10?\",\"back\":\"A. Spark does not substitute empty strings for missing values produced by a join; unmatched right-side columns are populated with `null`, not `\\\"\\\"`.B. This is correct. A left join preserves all rows from `orders`, and since `promotions` has no row for `order_id` 102, the `code` column for that row is populated with `null`.D. Spark does not borrow a value from an unrelated matched row; there is no fallback to reuse `\\\"SAVE10\\\"` for an order that has no corresponding promotion row.E. Spark never copies a value from a different column, such as `item`, into an unrelated output column; a missing match produces a null, not a reused string from elsewhere in the row. (Respuesta correcta: `null`, because `promotions` has no row with `order_id` = 102, so the left join keeps the order row with a null for the unmatched column.)\",\"topic\":\"SAVE10\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"15\"}},{\"id\":\"16::m\",\"questionId\":\"16\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa DateType?\",\"back\":\"$12\",\"topic\":\"DateType\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"16\"}},{\"id\":\"17::m\",\"questionId\":\"17\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa CSV?\",\"back\":\"A. Turning on `inferSchema` makes Spark scan the file to guess column types, which is exactly the slow, unreliable path the engineer needs to avoid, and it would not guarantee `order_id` comes back as a long.B. Declaring a header only tells Spark to treat the first line as column names; it says nothing about column types and does nothing to prevent inference from running.D. Chaining `format` and `load` is just an alternate way to specify the CSV source path and does not attach a schema, so the file would still fall back to default typing behavior. (Respuesta correcta: schema(order_schema))\",\"topic\":\"CSV\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"17\"}},{\"id\":\"17::c2\",\"questionId\":\"17\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa StructType?\",\"back\":\"Passing the `StructType` directly forces every row to be parsed according to the declared field names and types, so `order_id` is read as a `LongType` with no inference scan required.C. (Respuesta correcta: schema(order_schema))\",\"topic\":\"StructType\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"17\"}},{\"id\":\"18::m\",\"questionId\":\"18\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa DataFrame?\",\"back\":\"A. This would be the result of an ascending sort, but `ascending=False` explicitly requests descending order, so the lowest-to-highest sequence 1, 2, 3 is not what this call produces.B. `orderBy()` always reshuffles rows into the requested sort order; a `DataFrame` has no guaranteed row ordering to preserve in the first place, so the output reflects the sort, not the construction order.C. `ascending` accepts a single boolean when sorting by one column; a list is only required when sorting by multiple columns and specifying a direction per column, so a bare `False` here is valid and does not raise an error.D. This sequence matches neither a full ascending nor a full descending sort on `id`, so it does not correspond to any ordering that `orderBy(\\\"id\\\", ascending=False)` would produce.E. `ascending=False` reverses the sort direction for the single `id` column, so rows are ordered from the highest value to the lowest, producing 3, then 2, then 1. (Respuesta correcta: 3, 2, 1)\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"18\"},\"related\":17},{\"id\":\"19::m\",\"questionId\":\"19\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa AQE?\",\"back\":\"$13\",\"topic\":\"AQE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"19\"}},{\"id\":\"20::m\",\"questionId\":\"20\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa UDF?\",\"back\":\"$14\",\"topic\":\"UDF\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"20\"}},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa GroupStateTimeout?\",\"back\":\"A. `GroupStateTimeout` has no member with this name; the only valid timeout configurations are `NoTimeout()`, `ProcessingTimeTimeout()`, and `EventTimeTimeout()`.B. This disables automatic expiration entirely, so state for a group is retained indefinitely until the per-group function itself calls `state.remove()`, which does not satisfy a fixed wall-clock expiration requirement.C. This ties expiration to the watermark computed from an event-time column in the data, so how quickly state expires depends on data arrival patterns rather than a fixed span of processing time.D. This measures elapsed wall-clock time against the duration set with `state.setTimeoutDuration()`, independent of any event-time column or watermark, which is exactly the behavior described. (Respuesta correcta: GroupStateTimeout.ProcessingTimeTimeout())\",\"topic\":\"GroupStateTimeout\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"21\"}},{\"id\":\"23::m\",\"questionId\":\"23\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa DataFrame?\",\"back\":\"$15\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"23\"},\"related\":20},{\"id\":\"24::m\",\"questionId\":\"24\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa AQE?\",\"back\":\"$16\",\"topic\":\"AQE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"24\"},\"related\":20},{\"id\":\"26::m\",\"questionId\":\"26\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. This is correct: when no trigger is specified, Spark uses the default micro-batch trigger, which starts a n…\\\"?\",\"back\":\"A. This is incorrect because the absence of a trigger clause does not pause the query; Spark falls back to its default trigger behavior rather than waiting for configuration.B. This is incorrect because processing a single batch and stopping is the behavior of a one-time trigger such as `Trigger.Once()`, not the default trigger that is used when no trigger is specified.C. This is correct: when no trigger is specified, Spark uses the default micro-batch trigger, which starts a new batch as soon as the prior one finishes, giving the lowest latency the micro-batch engine can offer without explicit tuning.D. This is incorrect because continuous processing is an experimental, opt-in execution mode requiring `.trigger(continuous=...)`; omitting a trigger does not switch the engine into that mode.\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"26\"}},{\"id\":\"27::m\",\"questionId\":\"27\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa JDBC?\",\"back\":\"A. This is correct: micro-batch execution repeatedly polls the source and processes whatever has accumulated in discrete batches, while continuous processing keeps long-running tasks reading and processing records individually to achieve much lower latency.B. This is incorrect because cluster autoscaling behavior is independent of which streaming execution mode is chosen; neither mode inherently fixes or dynamically resizes the cluster per record.C. This is incorrect because micro-batch mode supports a wide range of sinks including Delta tables and JDBC, not only files; sink support is not the distinguishing factor between the two modes.D. (Respuesta correcta: Micro-batch mode polls the source and batches accumulated data, while continuous processing runs long tasks that handle records as they arrive for lower latency)\",\"topic\":\"JDBC\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"27\"}},{\"id\":\"27::c2\",\"questionId\":\"27\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Structured Streaming?\",\"back\":\"This is incorrect because micro-batch mode is the execution model that provides Structured Streaming's well-supported exactly-once guarantees, while continuous processing offers weaker, at-least-once guarantees for its supported operations. (Respuesta correcta: Micro-batch mode polls the source and batches accumulated data, while continuous processing runs long tasks that handle records as they arrive for lower latency)\",\"topic\":\"Structured Streaming\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"27\"}},{\"id\":\"28::m\",\"questionId\":\"28\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. This is correct because `session_window` is purpose-built for dynamic-length windows keyed on a gap duratio…\\\"?\",\"back\":\"$17\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"28\"}},{\"id\":\"30::m\",\"questionId\":\"30\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa Structured Streaming?\",\"back\":\"$18\",\"topic\":\"Structured Streaming\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"30\"},\"related\":24},{\"id\":\"31::m\",\"questionId\":\"31\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. This is correct: the watermark delay directly determines how long state is retained for a given key, so it …\\\"?\",\"back\":\"$19\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"31\"}},{\"id\":\"33::m\",\"questionId\":\"33\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa IDE?\",\"back\":\"A. This matches the intended workflow.B. Databricks Connect does not install or copy the Databricks Runtime onto the local machine; the whole point of the thin client design is that execution happens remotely, not that the runtime is duplicated locally.C. One of the main benefits of Databricks Connect is that it lets a local IDE submit Spark Connect requests directly to a remote cluster without ever converting the script into a notebook first.D. Running both the driver and executors locally would make Databricks Connect indistinguishable from local mode, but its purpose is remote execution against a real Databricks cluster and its Unity Catalog access, not local computation.E. (Respuesta correcta: Databricks Connect acts as a Spark Connect client: DataFrame operations build a logical plan locally and send it over gRPC to the remote cluster for execution.)\",\"topic\":\"IDE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"33\"}},{\"id\":\"33::c2\",\"questionId\":\"33\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Databricks Connect?\",\"back\":\"Databricks Connect is built as a Spark Connect client, so DataFrame code written locally builds a logical plan that is sent over gRPC to the remote Databricks cluster, which executes it with access to Unity Catalog. (Respuesta correcta: Databricks Connect acts as a Spark Connect client: DataFrame operations build a logical plan locally and send it over gRPC to the remote cluster for execution.)\",\"topic\":\"Databricks Connect\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"33\"}},{\"id\":\"34::m\",\"questionId\":\"34\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa API?\",\"back\":\"A. This is incorrect because the native `pyspark.sql.DataFrame` API remains fully supported and is not deprecated; `pyspark.pandas` is an additional, complementary interface rather than a replacement.D. This is incorrect because the pandas API on Spark is designed to run on distributed multi-node clusters just like native PySpark, and there is no local-mode-only restriction or automatic fallback behavior.E. (Respuesta correcta: `pyspark.pandas` is a pandas-compatible layer built on top of Spark DataFrames, so operations written with its API are translated into the same distributed Spark execution plan that native PySpark DataFrames use.)\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"34\"}},{\"id\":\"34::c2\",\"questionId\":\"34\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Spark DataFrame?\",\"back\":\"This is correct: `pyspark.pandas` provides pandas-compatible syntax that is executed through the same underlying Spark DataFrame execution engine, so it is a layer on top of, not a replacement for, native PySpark DataFrames.B. (Respuesta correcta: `pyspark.pandas` is a pandas-compatible layer built on top of Spark DataFrames, so operations written with its API are translated into the same distributed Spark execution plan that native PySpark DataFrames use.)\",\"topic\":\"Spark DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"34\"}},{\"id\":\"34::c3\",\"questionId\":\"34\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa DataFrames?\",\"back\":\"This is incorrect because `pyspark.pandas` runs within the Spark cluster and relies on the same distributed engine as native DataFrames; it is not a separate single-node execution engine outside the cluster.C. (Respuesta correcta: `pyspark.pandas` is a pandas-compatible layer built on top of Spark DataFrames, so operations written with its API are translated into the same distributed Spark execution plan that native PySpark DataFrames use.)\",\"topic\":\"DataFrames\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"34\"}},{\"id\":\"35::m\",\"questionId\":\"35\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa DataFrames?\",\"back\":\"$1a\",\"topic\":\"DataFrames\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"35\"},\"related\":30}],\"cardCount\":40},\"deckEn\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"quizTitle\":\"Databricks Certified Developer for Apache Spark Associate\",\"cardCount\":40,\"cards\":[{\"id\":\"1::m\",\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Spark UI, and what is it used for?\",\"back\":\"A. Correct. Each action triggers Spark's lazy-evaluated transformations to actually execute, and the driver submits a distinct job per action, which is then split into stages and tasks.B. Incorrect. Spark does not defer job submission to the end of the script; each action independently triggers its own job as soon as it is called.C. Incorrect. `count()` still requires reading and aggregating the underlying partitions across executors; it is not resolved purely inside the driver without executor work.D. Incorrect. Each action produces its own job in the Spark UI; `collect()` and `count()` are not merged into a job triggered by an unrelated `write.parquet` call on a different DataFrame.E. Incorrect. (Respuesta correcta: Three separate jobs, because Spark launches one job per action, and each job is then broken into stages and tasks that run on the executors.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Spark UI\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"1\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"1::c2\",\"questionId\":\"1\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is SparkSession, and what is it used for?\",\"back\":\"Job counting is tied to actions, not to shared lineage or a shared SparkSession; three actions on three DataFrames still produce three jobs even under one session. (Respuesta correcta: Three separate jobs, because Spark launches one job per action, and each job is then broken into stages and tasks that run on the executors.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SparkSession\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"1\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"2::m\",\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is JVM, and what is it used for?\",\"back\":\"A. This is incorrect because this term refers to Spark's built-in cluster manager, not to a deploy mode that controls where the driver process runs.B. This is incorrect because this is not a recognized Spark deploy mode; the deploy mode options control driver placement, not an interactive session type.C. This is incorrect because in this mode the driver runs on the machine that issued the submit command, so the application would stop if that machine disconnected.D. This is correct because this deploy mode launches the driver process on a node inside the cluster itself, so the application continues running independently of the machine that originally issued the submit command.E. This is incorrect because this mode runs the driver and executors within a single JVM on one machine and is not used for submitting a job to a YARN cluster. (Respuesta correcta: Cluster mode)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"JVM\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"2\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"5::m\",\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is ETL, and what is it used for?\",\"back\":\"A. This is correct: Spark's unified engine lets the same cluster and APIs handle batch ETL, SQL reporting, and MLlib model training, which is exactly the consolidation the company wants. This eliminates the need to operate three separate specialized systems.B. Spark does not enforce schema-on-write, and reading raw files does not remove the need for a query engine to serve reporting workloads. Spark itself has no built-in charting dashboard; visualization is handled by separate tools such as notebooks or BI products that connect to Spark. This option describes a capability Spark does not provide.E. This overstates what happens automatically. (Respuesta correcta: Spark exposes a unified engine where Spark SQL, DataFrames, Structured Streaming, and MLlib share the same execution model, so ETL, reporting, and forecasting run on one cluster.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ETL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"5\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"5::c2\",\"questionId\":\"5\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is DAG, and what is it used for?\",\"back\":\"Spark does not translate jobs into MapReduce plans; it compiles work into its own DAG of stages and tasks executed by its own scheduler. (Respuesta correcta: Spark exposes a unified engine where Spark SQL, DataFrames, Structured Streaming, and MLlib share the same execution model, so ETL, reporting, and forecasting run on one cluster.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"DAG\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"5\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"5::c3\",\"questionId\":\"5\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is Framing Spark, and what is it used for?\",\"back\":\"Framing Spark as a MapReduce-compatibility layer misstates how its execution engine works.C. (Respuesta correcta: Spark exposes a unified engine where Spark SQL, DataFrames, Structured Streaming, and MLlib share the same execution model, so ETL, reporting, and forecasting run on one cluster.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Framing Spark\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"5\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"5::c4\",\"questionId\":\"5\",\"part\":\"c4\",\"lang\":\"en\",\"front\":\"What is SQL, and what is it used for?\",\"back\":\"Schema inference and enforcement are configurable, not automatic replacements for a SQL layer.D. (Respuesta correcta: Spark exposes a unified engine where Spark SQL, DataFrames, Structured Streaming, and MLlib share the same execution model, so ETL, reporting, and forecasting run on one cluster.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"5\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"5::c5\",\"questionId\":\"5\",\"part\":\"c5\",\"lang\":\"en\",\"front\":\"What is GPU, and what is it used for?\",\"back\":\"Spark does not auto-provision GPU pools when ML code runs; hardware allocation depends on the cluster manager and the cluster configuration chosen by an administrator. (Respuesta correcta: Spark exposes a unified engine where Spark SQL, DataFrames, Structured Streaming, and MLlib share the same execution model, so ETL, reporting, and forecasting run on one cluster.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"GPU\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"5\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"6::m\",\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DataFrame, and what is it used for?\",\"back\":\"$1b\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"6\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is StringIndexerModel, and what is it used for?\",\"back\":\"A. `Pipeline` accepts an ordered list of stages, and a single `fit()` call runs each stage's transformation or training in sequence, which is exactly the reusable, chained workflow the developer wants.B. `indexer.fit(train_df)` produces a fitted `StringIndexerModel`, not a transformed DataFrame; `lr.fit()` needs an actual DataFrame of features and labels, so feeding it a model object is a type mismatch.C. (Respuesta correcta: `pipeline = Pipeline(stages=[indexer, lr])`\\n`model = pipeline.fit(train_df)`, which chains both stages in order and trains them together with one `fit()` call.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"StringIndexerModel\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"7\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"7::c2\",\"questionId\":\"7\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Spark ML, and what is it used for?\",\"back\":\"A Python list is not a Spark ML construct and has no `.fit()` method, so this line fails immediately rather than chaining the indexer and the classifier.D. `LogisticRegression.fit()` only accepts a DataFrame (and optional params), not a `transformers` argument, so this call does not exist as written and raises a `TypeError`.E. `Pipeline` expects its stages to be passed as a `stages` keyword argument holding a list, not as separate positional arguments, so constructing it this way raises a `TypeError` before fitting begins. (Respuesta correcta: `pipeline = Pipeline(stages=[indexer, lr])`\\n`model = pipeline.fit(train_df)`, which chains both stages in order and trains them together with one `fit()` call.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Spark ML\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"7\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"8::m\",\"questionId\":\"8\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DataFrameWriter, and what is it used for?\",\"back\":\"$1c\",\"topic\":\"DataFrameWriter\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"8\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"9::m\",\"questionId\":\"9\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SQL, and what is it used for?\",\"back\":\"A. This is the documented behavioral distinction: the non-replacing method fails with an already-exists error on a duplicate name, while the replacing method overwrites the prior registration without error.B. Both methods register a session-scoped temporary view in the session's default namespace; neither one uses the `global_temp` database, which is reserved for the separate global temp view methods.C. Neither method writes anything to the metastore; both create purely in-memory, session-scoped catalog entries that are lost when the session ends.D. Both methods take only the view name string as their argument; neither accepts a SQL query string or a column list. (Respuesta correcta: `createTempView` raises an exception if a temporary view with that name already exists, while `createOrReplaceTempView` silently overwrites it.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"9\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"11::m\",\"questionId\":\"11\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DataFrameWriter, and what is it used for?\",\"back\":\"$1d\",\"topic\":\"DataFrameWriter\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"11\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"12::m\",\"questionId\":\"12\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DataFrame, and what is it used for?\",\"back\":\"A. filter restricts which rows are kept based on a boolean condition; it does not add or compute a new column, so it does not fit this signature.B. withColumnsRenamed takes a dictionary mapping existing names to new names for bulk renaming, not a name plus a computed expression, so it does not match this call.C. select projects a set of column expressions but does not take a target column name and a value expression as two positional arguments the way this call is written, so this signature does not fit.D. withColumnRenamed only accepts an existing column name and a new name string; it cannot evaluate a when/otherwise expression, so it cannot produce a computed column.E. withColumn takes a target column name and a Column expression, adding the result as a new column while returning a new DataFrame, which matches this call exactly.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"12\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"13::m\",\"questionId\":\"13\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SQL, and what is it used for?\",\"back\":\"A. isnan() specifically flags Spark's floating-point NaN marker used for invalid numeric results, distinguishing it from a genuinely missing None value.B. isNull() matches rows where the value is Python None/SQL NULL, which is exactly the missing-data case this scenario wants to exclude, not the invalid calculation.C. (Respuesta correcta: sensor_df.filter(F.isnan(\\\"reading\\\")))\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"13\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"13::c2\",\"questionId\":\"13\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is NaN, and what is it used for?\",\"back\":\"Filtering with isNotNull() returns both valid numeric readings and NaN rows together, since NaN is a defined floating-point value rather than a null, so it fails to isolate the invalid rows.D. na.drop(subset=[\\\"reading\\\"]) removes rows with null values and returns everything else, which keeps the NaN rows mixed in with valid readings rather than isolating them.E. isnull() is functionally the same null check as isNull(), so it identifies missing-data rows rather than the NaN rows produced by the invalid calculation. (Respuesta correcta: sensor_df.filter(F.isnan(\\\"reading\\\")))\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"NaN\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"13\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"14::m\",\"questionId\":\"14\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DataFrame, and what is it used for?\",\"back\":\"$1e\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"14\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"15::m\",\"questionId\":\"15\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SAVE10, and what is it used for?\",\"back\":\"A. Spark does not substitute empty strings for missing values produced by a join; unmatched right-side columns are populated with `null`, not `\\\"\\\"`.B. This is correct. A left join preserves all rows from `orders`, and since `promotions` has no row for `order_id` 102, the `code` column for that row is populated with `null`.D. Spark does not borrow a value from an unrelated matched row; there is no fallback to reuse `\\\"SAVE10\\\"` for an order that has no corresponding promotion row.E. Spark never copies a value from a different column, such as `item`, into an unrelated output column; a missing match produces a null, not a reused string from elsewhere in the row. (Respuesta correcta: `null`, because `promotions` has no row with `order_id` = 102, so the left join keeps the order row with a null for the unmatched column.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SAVE10\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"15\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"16::m\",\"questionId\":\"16\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DateType, and what is it used for?\",\"back\":\"$1f\",\"topic\":\"DateType\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"16\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"17::m\",\"questionId\":\"17\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is CSV, and what is it used for?\",\"back\":\"A. Turning on `inferSchema` makes Spark scan the file to guess column types, which is exactly the slow, unreliable path the engineer needs to avoid, and it would not guarantee `order_id` comes back as a long.B. Declaring a header only tells Spark to treat the first line as column names; it says nothing about column types and does nothing to prevent inference from running.D. Chaining `format` and `load` is just an alternate way to specify the CSV source path and does not attach a schema, so the file would still fall back to default typing behavior. (Respuesta correcta: schema(order_schema))\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CSV\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"17\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"17::c2\",\"questionId\":\"17\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is StructType, and what is it used for?\",\"back\":\"Passing the `StructType` directly forces every row to be parsed according to the declared field names and types, so `order_id` is read as a `LongType` with no inference scan required.C. (Respuesta correcta: schema(order_schema))\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"StructType\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"17\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"18::m\",\"questionId\":\"18\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DataFrame, and what is it used for?\",\"back\":\"$20\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"18\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"19::m\",\"questionId\":\"19\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is AQE, and what is it used for?\",\"back\":\"$21\",\"topic\":\"AQE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"19\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"20::m\",\"questionId\":\"20\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is UDF, and what is it used for?\",\"back\":\"$22\",\"topic\":\"UDF\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"20\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is GroupStateTimeout, and what is it used for?\",\"back\":\"A. `GroupStateTimeout` has no member with this name; the only valid timeout configurations are `NoTimeout()`, `ProcessingTimeTimeout()`, and `EventTimeTimeout()`.B. This disables automatic expiration entirely, so state for a group is retained indefinitely until the per-group function itself calls `state.remove()`, which does not satisfy a fixed wall-clock expiration requirement.C. This ties expiration to the watermark computed from an event-time column in the data, so how quickly state expires depends on data arrival patterns rather than a fixed span of processing time.D. This measures elapsed wall-clock time against the duration set with `state.setTimeoutDuration()`, independent of any event-time column or watermark, which is exactly the behavior described. (Respuesta correcta: GroupStateTimeout.ProcessingTimeTimeout())\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"GroupStateTimeout\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"21\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"23::m\",\"questionId\":\"23\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DataFrame, and what is it used for?\",\"back\":\"$23\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"23\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"24::m\",\"questionId\":\"24\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is AQE, and what is it used for?\",\"back\":\"$24\",\"topic\":\"AQE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"24\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"26::m\",\"questionId\":\"26\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. This is correct: when no trigger is specified, Spark uses the default micro-batch trigger, which starts a n…\\\"?\",\"back\":\"A. This is incorrect because the absence of a trigger clause does not pause the query; Spark falls back to its default trigger behavior rather than waiting for configuration.B. This is incorrect because processing a single batch and stopping is the behavior of a one-time trigger such as `Trigger.Once()`, not the default trigger that is used when no trigger is specified.C. This is correct: when no trigger is specified, Spark uses the default micro-batch trigger, which starts a new batch as soon as the prior one finishes, giving the lowest latency the micro-batch engine can offer without explicit tuning.D. This is incorrect because continuous processing is an experimental, opt-in execution mode requiring `.trigger(continuous=...)`; omitting a trigger does not switch the engine into that mode.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"26\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"27::m\",\"questionId\":\"27\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is JDBC, and what is it used for?\",\"back\":\"A. This is correct: micro-batch execution repeatedly polls the source and processes whatever has accumulated in discrete batches, while continuous processing keeps long-running tasks reading and processing records individually to achieve much lower latency.B. This is incorrect because cluster autoscaling behavior is independent of which streaming execution mode is chosen; neither mode inherently fixes or dynamically resizes the cluster per record.C. This is incorrect because micro-batch mode supports a wide range of sinks including Delta tables and JDBC, not only files; sink support is not the distinguishing factor between the two modes.D. (Respuesta correcta: Micro-batch mode polls the source and batches accumulated data, while continuous processing runs long tasks that handle records as they arrive for lower latency)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"JDBC\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"27\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"27::c2\",\"questionId\":\"27\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Structured Streaming, and what is it used for?\",\"back\":\"This is incorrect because micro-batch mode is the execution model that provides Structured Streaming's well-supported exactly-once guarantees, while continuous processing offers weaker, at-least-once guarantees for its supported operations. (Respuesta correcta: Micro-batch mode polls the source and batches accumulated data, while continuous processing runs long tasks that handle records as they arrive for lower latency)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Structured Streaming\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"27\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"28::m\",\"questionId\":\"28\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. This is correct because `session_window` is purpose-built for dynamic-length windows keyed on a gap duratio…\\\"?\",\"back\":\"$25\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"28\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"30::m\",\"questionId\":\"30\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Structured Streaming, and what is it used for?\",\"back\":\"$26\",\"topic\":\"Structured Streaming\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"30\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"31::m\",\"questionId\":\"31\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. This is correct: the watermark delay directly determines how long state is retained for a given key, so it …\\\"?\",\"back\":\"$27\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"31\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"33::m\",\"questionId\":\"33\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is IDE, and what is it used for?\",\"back\":\"A. This matches the intended workflow.B. Databricks Connect does not install or copy the Databricks Runtime onto the local machine; the whole point of the thin client design is that execution happens remotely, not that the runtime is duplicated locally.C. One of the main benefits of Databricks Connect is that it lets a local IDE submit Spark Connect requests directly to a remote cluster without ever converting the script into a notebook first.D. Running both the driver and executors locally would make Databricks Connect indistinguishable from local mode, but its purpose is remote execution against a real Databricks cluster and its Unity Catalog access, not local computation.E. (Respuesta correcta: Databricks Connect acts as a Spark Connect client: DataFrame operations build a logical plan locally and send it over gRPC to the remote cluster for execution.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"IDE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"33\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"33::c2\",\"questionId\":\"33\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Databricks Connect, and what is it used for?\",\"back\":\"Databricks Connect is built as a Spark Connect client, so DataFrame code written locally builds a logical plan that is sent over gRPC to the remote Databricks cluster, which executes it with access to Unity Catalog. (Respuesta correcta: Databricks Connect acts as a Spark Connect client: DataFrame operations build a logical plan locally and send it over gRPC to the remote cluster for execution.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Databricks Connect\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"33\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"34::m\",\"questionId\":\"34\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is API, and what is it used for?\",\"back\":\"A. This is incorrect because the native `pyspark.sql.DataFrame` API remains fully supported and is not deprecated; `pyspark.pandas` is an additional, complementary interface rather than a replacement.D. This is incorrect because the pandas API on Spark is designed to run on distributed multi-node clusters just like native PySpark, and there is no local-mode-only restriction or automatic fallback behavior.E. (Respuesta correcta: `pyspark.pandas` is a pandas-compatible layer built on top of Spark DataFrames, so operations written with its API are translated into the same distributed Spark execution plan that native PySpark DataFrames use.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"34\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"34::c2\",\"questionId\":\"34\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Spark DataFrame, and what is it used for?\",\"back\":\"This is correct: `pyspark.pandas` provides pandas-compatible syntax that is executed through the same underlying Spark DataFrame execution engine, so it is a layer on top of, not a replacement for, native PySpark DataFrames.B. (Respuesta correcta: `pyspark.pandas` is a pandas-compatible layer built on top of Spark DataFrames, so operations written with its API are translated into the same distributed Spark execution plan that native PySpark DataFrames use.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Spark DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"34\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"34::c3\",\"questionId\":\"34\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is DataFrames, and what is it used for?\",\"back\":\"This is incorrect because `pyspark.pandas` runs within the Spark cluster and relies on the same distributed engine as native DataFrames; it is not a separate single-node execution engine outside the cluster.C. (Respuesta correcta: `pyspark.pandas` is a pandas-compatible layer built on top of Spark DataFrames, so operations written with its API are translated into the same distributed Spark execution plan that native PySpark DataFrames use.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"DataFrames\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"34\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"},{\"id\":\"35::m\",\"questionId\":\"35\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DataFrames, and what is it used for?\",\"back\":\"$28\",\"topic\":\"DataFrames\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-associate-developer-for-apache-spark\",\"questionId\":\"35\"},\"esDeck\":\"databricks-associate-developer-for-apache-spark\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
