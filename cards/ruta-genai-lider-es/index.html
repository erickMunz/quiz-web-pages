9091dc993ae.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"deckEs\":{\"quizId\":\"ruta-genai-lider-es\",\"quizTitle\":\"Examen: IA Generativa con Google Cloud\",\"cardCount\":10,\"description\":\"Del mapa del terreno a los agentes con herramientas: cómo funciona un LLM de verdad (tokens, temperatura, alucinaciones), las capas de Google Cloud (Vertex AI → hoy Gemini Enterprise Agent Platform, Gemini, Gemma), RAG para aterizar alucinaciones y seguridad del ciclo de vida. Cada etapa cierra con checkpoint; el examen oficial de práctica queda publicado para el final.\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"front\":\"La demo del viernes: el asistente respondía precios correctos de catálogo en el stand, y el lunes los precios son de hace dos semanas. Nadie tocó nada. ¿Causa más probable y qué le pides al equipo?\\n\\n(A) Es el cacheo del navegador: vaciar la caché del dispositivo del vendedor lo arregla\\n(B) El modelo se degrade solo con el uso: hay que reentrenar Gemini con los precios nuevos\\n(C) Fue alucinación del viernes también: los precios eran inventados y por eso cambian\\n(D) Las respuestas venían de un RAG indexado antes de la demo: sin reindexar, el precio vivo no llega al contexto; pedir re-indexación del catálogo (o tools) antes de cada despliegue\",\"back\":\"Decisión correcta: Las respuestas venían de un RAG indexado antes de la demo: sin reindexar, el precio vivo no llega al contexto; pedir re-indexación del catálogo (o tools) antes de cada despliegue\\n\\nGana porque conecta el síntoma (información desfasada, no alucinada) con el mecanismo: lo que entra al contexto gobierna la respuesta; el ícono de una demo es un snapshot.\\n\\nPista de examen: El contexto es un snapshot: sin reindexar o sin tools, la respuesta queda congelada en la fecha del índice.\\n\\nRespuesta del quiz: Las respuestas venían de un RAG indexado antes de la demo: sin reindexar, el precio vivo no llega al contexto; pedir re-indexación del catálogo (o tools) antes de cada despliegue\",\"topic\":\"llm\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"1\"},\"tags\":[\"llm\",\"evaluacion\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"2\",\"part\":\"m\",\"front\":\"El pipeline clasifica correos en 5 categorías y debe devolver JSON estricto. A veces lo logra, a veces agrega una explicación no solicitada. El equipo propone subir la temperatura a 1.2 «para que explore formatos nuevos». ¿Qué haces?\\n\\n(A) Aprobar: con más temperatura el modelo inventará el formato que falta\\n(B) Temperature a 0.2 con few-shot de 3–5 ejemplos y el esquema JSON exacto en el prompt (o response_mime_type si el SDK lo ofrece): el formato pasa a ser determinista\\n(C) Dejar la temperatura y pedir con mayúsculas: «DEVUELVE SOLO JSON, SIN EXPLICACIONES»\\n(D) Post-proceso: regex para extraer el JSON de la respuesta, pase lo pase\",\"back\":\"Decisión correcta: Temperature a 0.2 con few-shot de 3–5 ejemplos y el esquema JSON exacto en el prompt (o response_mime_type si el SDK lo ofrece): el formato pasa a ser determinista\\n\\nGana porque ataca las DOS piezas del mecanismo: temperatura baja reduce la variedad de muestreo, y los few-shot fijan el patrón EXACTO de respuesta en el contexto.\\n\\nPista de examen: Formato = contexto + muestreo: few-shot con el esquema y temperatura baja hacen el JSON determinista.\\n\\nRespuesta del quiz: Temperature a 0.2 con few-shot de 3–5 ejemplos y el esquema JSON exacto en el prompt (o response_mime_type si el SDK lo ofrece): el formato pasa a ser determinista\",\"topic\":\"prompting\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"2\"},\"tags\":[\"prompting\",\"arquitectura\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"3\",\"part\":\"m\",\"front\":\"Una aseguradora quiere un asistente interno para revisar y clasificar 50.000 pólizas al año ya digitalizadas. Datos sensibles de clientes: el compliance exige que NO salgan de la infraestructura de la empresa. El equipo propone dos caminos: (A) Gemini con data residency + CMEK; (B) Gemma afinado en servidores propios. Ambos cumplen el requerimiento de residencia. ¿Cómo eliges?\\n\\n(A) B siempre: los servidores propios dan control total y los modelos pequeños son más baratos\\n(B) La decisión es de costo-tarea-calidad: si la tarea (clasificar texto de póliza) la resuelve con calidad un Gemma afinado y el volumen justifica la operación propia (50.000/año → sí), elige B; si la tarea exigiera razonamiento largo o multimodal, A\\n(C) A siempre: los modelos cerrados del proveedor siempre superan a los abiertos en calidad\\n(D) Ninguno: con datos sensibles, la IA generativa no debe usarse nunca\",\"back\":\"Decisión correcta: La decisión es de costo-tarea-calidad: si la tarea (clasificar texto de póliza) la resuelve con calidad un Gemma afinado y el volumen justifica la operación propia (50.000/año → sí), elige B; si la tarea exigiera razonamiento largo o multimodal, A\\n\\nGana porque fija los tres ejes reales de la decisión: calidad de la TAREA, volumen de datos (justifica operación propia) y el costo operativo, más allá del rótulo del modelo.\\n\\nPista de examen: Modelo cerrado vs. abierto no es fe: es tarea, volumen y costo operativo — con la restricción de residencia cubierta por ambos.\\n\\nRespuesta del quiz: La decisión es de costo-tarea-calidad: si la tarea (clasificar texto de póliza) la resuelve con calidad un Gemma afinado y el volumen justifica la operación propia (50.000/año → sí), elige B; si la tarea exigiera razonamiento largo o multimodal, A\",\"topic\":\"arquitectura\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"3\"},\"tags\":[\"arquitectura\",\"costo\"],\"difficulty\":\"advanced\"},{\"questionId\":\"4\",\"part\":\"m\",\"front\":\"Tu chat responde bien en inglés y decae en portugués. La hipótesis: los datos de entrenamiento tienen mucho más inglés. ¿Qué término describe mejor la causa del desfase?\\n\\n(A) Sobrespecialización del modelo base que exige una nueva arquitectura\\n(B) El desfase refleja la distribución del corpus: el modelo aprende a predicir cada idioma en proporción a cuánto lo vio; la mejora llega con más ejemplos del idioma débil (ajuste fino o ejemplos en el prompt)\\n(C) Alucinación: el modelo está inventando portugués y por eso falla\\n(D) Sesgo del prompt: si el sistema está en inglés, el modelo responde mejor en inglés\",\"back\":\"Decisión correcta: El desfase refleja la distribución del corpus: el modelo aprende a predicir cada idioma en proporción a cuánto lo vio; la mejora llega con más ejemplos del idioma débil (ajuste fino o ejemplos en el prompt)\\n\\nGana porque conecta la calidad por idioma con su causa real (distribución de entrenamiento) y el remedio proporcional (más ejemplos del idioma débil).\\n\\nPista de examen: La calidad por región o idioma refleja cuánto de eso vio el modelo: la mejora es proporcional a los ejemplos que agregues.\\n\\nRespuesta del quiz: El desfase refleja la distribución del corpus: el modelo aprende a predicir cada idioma en proporción a cuánto lo vio; la mejora llega con más ejemplos del idioma débil (ajuste fino o ejemplos en el prompt)\",\"topic\":\"llm\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"4\"},\"tags\":[\"llm\",\"datos\"],\"difficulty\":\"basic\"},{\"questionId\":\"5\",\"part\":\"m\",\"front\":\"Tu asistente responde bien con documentos adjuntos. Al eliminar los adjuntos y hacer la misma pregunta, responde con hechos inventados pero verosímiles. ¿Qué demuestra el experimento y qué implica para el despliegue?\\n\\n(A) Que el modelo está sobreentrenado y debe reentrenarse desde cero con más portugués\\n(B) Que los documentos del experimento contenían errores que contaminaron al modelo\\n(C) Que conviene apagar el RAG en producción: el modelo es mejor sin documentos\\n(D) Que el modelo depende del contexto: sin él, predice texto plausible, no verdadero — en producción el RAG no es opcional sino un requisito\",\"back\":\"Decisión correcta: Que el modelo depende del contexto: sin él, predice texto plausible, no verdadero — en producción el RAG no es opcional sino un requisito\\n\\nGana porque el experimento CONTROLA la variable del contexto (con adjuntos vs. sin ellos) y demuestra el mecanismo; la consecuencia de despliegue es directa: aterrizar o no lanzar.\\n\\nPista de examen: Sin el dato en el contexto, el LLM escribe lo más plausible; el despliegue serio lleva aterrizaje por defecto.\\n\\nRespuesta del quiz: Que el modelo depende del contexto: sin él, predice texto plausible, no verdadero — en producción el RAG no es opcional sino un requisito\",\"topic\":\"llm\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"5\"},\"tags\":[\"llm\",\"datos\"],\"difficulty\":\"basic\"},{\"questionId\":\"6\",\"part\":\"m\",\"front\":\"El CTO pregunta en qué capa del paisaje de IA se sitúa Gemini Enterprise Agent Platform (antes Vertex AI). ¿Qué respondes?\\n\\n(A) Infraestructura: es el hardware sobre el que corre todo\\n(B) Modelos: porque incluye a Gemini\\n(C) Plataformas: es la capa que permite construir, desplegar y gobernar modelos y agentes (acceso, afino, evaluación, despliegue, gobernanza)\\n(D) Aplicaciones: los usuarios finales conversan con ella\",\"back\":\"Decisión correcta: Plataformas: es la capa que permite construir, desplegar y gobernar modelos y agentes (acceso, afino, evaluación, despliegue, gobernanza)\\n\\nGana porque ubica el producto por SU FUNCION (gestión) y no por quién lo empaqueta; la definición de plataforma del paisaje — y por eso antes Vertex AI.\\n\\nPista de examen: Capa = función del producto: hardware sirve, modelos piensan, la plataforma gestiona, agentes actuan, aplicaciones se tocan.\\n\\nRespuesta del quiz: Plataformas: es la capa que permite construir, desplegar y gobernar modelos y agentes (acceso, afino, evaluación, despliegue, gobernanza)\",\"topic\":\"gcp\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"6\"},\"tags\":[\"gcp\",\"arquitectura\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"7\",\"part\":\"m\",\"front\":\"La fábrica quiere un modelo ligeramente ajustable que corra SIN conexión en la línea de producción (detección de defectos en imágenes), y el equipo de TI exige mantener el hardware bajo su control. ¿Qué eliges y por qué?\\n\\n(A) Gemini multimodal via API: la mejor calidad siempre gana\\n(B) Un pipeline determinista de OpenCV: ninguna IA generativa es necesaria\\n(C) Fine-tuning de un modelo asociado en Model Garden sin ajustar nada mas\\n(D) Gemma: modelo abierto, ligero, afinable, descargable para correr en servidores propios o en dispositivos edge de la fábrica\",\"back\":\"Decisión correcta: Gemma: modelo abierto, ligero, afinable, descargable para correr en servidores propios o en dispositivos edge de la fábrica\\n\\nGana porque cumple los tres requisitos que de verdad gobiernan el caso: descargable (offline), ejecutable en hardware propio y afinable para la tarea (detección de defectos).\\n\\nPista de examen: Cuando exigen offline + hardware propio + afinable, la respuesta del catálogo abierto es Gemma.\\n\\nRespuesta del quiz: Gemma: modelo abierto, ligero, afinable, descargable para correr en servidores propios o en dispositivos edge de la fábrica\",\"topic\":\"arquitectura\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"7\"},\"tags\":[\"arquitectura\",\"costo\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"8\",\"part\":\"m\",\"front\":\"El agente de soporte responde «el estado de su pedido es 3» cuando el cliente pregunta por su pedido. El equipo re-afinó el modelo con 100k tickets históricos y el error persiste. ¿Diagnóstico y solución de verdad?\\n\\n(A) Falta contexto: el estado del pedido es un dato VIVO que no puede aprenderse de weights; se da al agente una HERRAMIENTA que consulta el sistema de pedidos y redacta con esa respuesta\\n(B) El fine-tuning se hizo mal: con 500k tickets mejor curados, el modelo aprendería LOS ESTADOS por memoria\\n(C) Inyectar el catalogo de estados en el prompt del sistema basta: «3 significa en transito»\\n(D) Es un problema de temperatura: con temperatura 0, «3» sería la respuesta más probable y correcta\",\"back\":\"Decisión correcta: Falta contexto: el estado del pedido es un dato VIVO que no puede aprenderse de weights; se da al agente una HERRAMIENTA que consulta el sistema de pedidos y redacta con esa respuesta\\n\\nGana porque separa los dos motores: los pesos guardan PATRONES, no el estado de un pedido de hoy; el remedio es function calling sobre el sistema vivo, no más datos de entrenamiento.\\n\\nPista de examen: Pesos = patrones; contexto = hechos. Lo vivo no se entrena: se consulta con herramientas.\\n\\nRespuesta del quiz: Falta contexto: el estado del pedido es un dato VIVO que no puede aprenderse de weights; se da al agente una HERRAMIENTA que consulta el sistema de pedidos y redacta con esa respuesta\",\"topic\":\"agentes\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"8\"},\"tags\":[\"agentes\",\"arquitectura\"],\"difficulty\":\"advanced\"},{\"questionId\":\"9\",\"part\":\"m\",\"front\":\"El CISO pide un framework estructurado de seguridad para todo el ciclo de vida de IA (injection, envenenamiento, robo de modelo). ¿Qué marco de Google responde a eso?\\n\\n(A) El Secure AI Framework (SAIF) de Google: cobertura del ciclo de vida de los sistemas de IA, con los riesgos de inyección de prompt, envenenamiento de datos y robo de modelo\\n(B) El pilar de optimización de costos del Architecture Framework\\n(C) La etapa de ingesta de datos del ciclo de vida de ML\\n(D) Las model cards de Model Garden: documentan el modelo y sus limitaciones\",\"back\":\"Decisión correcta: El Secure AI Framework (SAIF) de Google: cobertura del ciclo de vida de los sistemas de IA, con los riesgos de inyección de prompt, envenenamiento de datos y robo de modelo\\n\\nGana porque es exactamente el alcance de SAIF: un framework estructurado de seguridad para sistemas de IA a través del ciclo de vida, con esos riesgos como ciudadanos de primera clase.\\n\\nPista de examen: Para la seguridad de sistemas de IA, el marco de Google es SAIF; los otros tres son utilidades, pilares o documentación.\\n\\nRespuesta del quiz: El Secure AI Framework (SAIF) de Google: cobertura del ciclo de vida de los sistemas de IA, con los riesgos de inyección de prompt, envenenamiento de datos y robo de modelo\",\"topic\":\"seguridad\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"9\"},\"tags\":[\"seguridad\",\"gcp\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"10\",\"part\":\"m\",\"front\":\"El extractor de contratos debe devolver clausulas EXACTAS de pólizas legales, y cada palabra cuenta: legal exige respuestas idénticas entre consultas del mismo documento. ¿Configuración correcta?\\n\\n(A) Temperature aleatoria: la creatividad ayuda a parafrasear las cláusulas más claras\\n(B) Temperature 0.8 para que explore variantes del texto y elija la mejor\\n(C) Fine-tuning del modelo con los contratos de la empresa en lugar de ingeniería de prompts\\n(D) Temperature 0 + prompt con few-shot del formato + pedir citas del documento en la respuesta\",\"back\":\"Decisión correcta: Temperature 0 + prompt con few-shot del formato + pedir citas del documento en la respuesta\\n\\nGana porque apila las tres palancas correctas: temperatura 0 (determinista: mismas entradas, mismas salidas), few-shot (formato estable) y citas (verificable sobre el documento entregado).\\n\\nPista de examen: Cuando piden exactitud palabra por palabra: temperatura 0, formato con few-shot y citas que se puedan auditar.\\n\\nRespuesta del quiz: Temperature 0 + prompt con few-shot del formato + pedir citas del documento en la respuesta\",\"topic\":\"prompting\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"10\"},\"tags\":[\"prompting\",\"evaluacion\"],\"difficulty\":\"intermediate\"}]},\"deckEn\":{\"quizId\":\"ruta-genai-lider-es\",\"quizTitle\":\"Examen: IA Generativa con Google Cloud\",\"cardCount\":10,\"description\":\"Del mapa del terreno a los agentes con herramientas: cómo funciona un LLM de verdad (tokens, temperatura, alucinaciones), las capas de Google Cloud (Vertex AI → hoy Gemini Enterprise Agent Platform, Gemini, Gemma), RAG para aterizar alucinaciones y seguridad del ciclo de vida. Cada etapa cierra con checkpoint; el examen oficial de práctica queda publicado para el final.\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Friday's demo: the assistant answered catalog prices correctly at the booth; on Monday they are two weeks stale. Nobody touched anything. Most likely cause, and what do you ask the team for?\\n\\n(A) It is the browser's cache: clearing the seller's device cache fixes it\\n(B) The model degrades on its own with use: retrain Gemini with the new prices\\n(C) Friday was hallucination too: the prices were invented, hence they change\\n(D) The answers came from a RAG indexed before the demo: without re-indexing, the live price never reaches the context; demand catalog re-indexing (or tools) before every deployment\",\"back\":\"Right call: The answers came from a RAG indexed before the demo: without re-indexing, the live price never reaches the context; demand catalog re-indexing (or tools) before every deployment\\n\\nIt wins because it ties the symptom (stale, not hallucinated, information) to the mechanism: what enters the context governs the answer; a demo index is a snapshot.\\n\\nExam cue: Context is a snapshot: without re-indexing or tools, the answer stays frozen at the index date.\\n\\nQuiz answer: Las respuestas venían de un RAG indexado antes de la demo: sin reindexar, el precio vivo no llega al contexto; pedir re-indexación del catálogo (o tools) antes de cada despliegue\",\"topic\":\"llm\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"1\"},\"tags\":[\"llm\",\"evaluacion\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The pipeline classifies emails into 5 categories and must return strict JSON. Sometimes it works, sometimes it adds an unsolicited explanation. A teammate suggests raising temperature to 1.2 «so it explores new formats». What do you do?\\n\\n(A) Approve: with more temperature the model will invent the missing format\\n(B) Set temperature 0.2 with 3–5 few-shot examples and the exact JSON schema in the prompt (or response_mime_type where the SDK offers it): format becomes deterministic\\n(C) Keep the temperature and yell: «RETURN ONLY JSON, NO EXPLANATIONS»\\n(D) Post-process: regex out the JSON from the answer, whatever it takes\",\"back\":\"Right call: Set temperature 0.2 with 3–5 few-shot examples and the exact JSON schema in the prompt (or response_mime_type where the SDK offers it): format becomes deterministic\\n\\nIt wins because it attacks BOTH mechanism pieces: low temperature reduces sampling variety, and few-shots pin the EXACT response pattern into the context.\\n\\nExam cue: Format = context + sampling: few-shots with the schema and low temperature make JSON deterministic.\\n\\nQuiz answer: Temperature a 0.2 con few-shot de 3–5 ejemplos y el esquema JSON exacto en el prompt (o response_mime_type si el SDK lo ofrece): el formato pasa a ser determinista\",\"topic\":\"prompting\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"2\"},\"tags\":[\"prompting\",\"arquitectura\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"An insurer wants an internal assistant to review and classify 50,000 already-digitized policies a year. The data is sensitive: compliance requires it stay inside company infrastructure. Two paths: (A) Gemini with data residency + CMEK; (B) fine-tuned Gemma on their own servers. Both satisfy residency. How do you choose?\\n\\n(A) B always: own servers give full control and small models are cheaper\\n(B) It is a cost-task-quality decision: if the task (classify policy text) is solved well by a fine-tuned Gemma and the volume justifies running it (50k/year → yes), pick B; if the task needed long reasoning or multimodality, A\\n(C) A always: provider closed models always beat open ones on quality\\n(D) Neither: with sensitive data, generative AI must never be used\",\"back\":\"Right call: It is a cost-task-quality decision: if the task (classify policy text) is solved well by a fine-tuned Gemma and the volume justifies running it (50k/year → yes), pick B; if the task needed long reasoning or multimodality, A\\n\\nIt wins because it sets the decision's real axes: TASK quality, data volume (justifying self-hosting) and operating cost — beyond the model's label.\\n\\nExam cue: Closed vs. open model is not faith: it is task, volume and operating cost — with residency covered in both cases.\\n\\nQuiz answer: La decisión es de costo-tarea-calidad: si la tarea (clasificar texto de póliza) la resuelve con calidad un Gemma afinado y el volumen justifica la operación propia (50.000/año → sí), elige B; si la tarea exigiera razonamiento largo o multimodal, A\",\"topic\":\"arquitectura\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"3\"},\"tags\":[\"arquitectura\",\"costo\"],\"difficulty\":\"advanced\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Your chat does well in English and degrades in Portuguese. Hypothesis: training data carries far more English. Which term best names the cause of the gap?\\n\\n(A) Base model over-specialization that demands a new architecture\\n(B) The gap mirrors corpus distribution: the model learns to predict each language in proportion to how much it saw it; the fix is more weak-language examples (fine-tuning or in-prompt examples)\\n(C) Hallucination: the model is inventing Portuguese, hence it fails\\n(D) Prompt bias: if the system prompt is in English, the model answers better in English\",\"back\":\"Right call: The gap mirrors corpus distribution: the model learns to predict each language in proportion to how much it saw it; the fix is more weak-language examples (fine-tuning or in-prompt examples)\\n\\nIt wins because it ties per-language quality to its real cause (training distribution) and the proportional fix (more weak-language examples).\\n\\nExam cue: Quality per region or language reflects how much of it the model saw: improvement scales with the examples you add.\\n\\nQuiz answer: El desfase refleja la distribución del corpus: el modelo aprende a predicir cada idioma en proporción a cuánto lo vio; la mejora llega con más ejemplos del idioma débil (ajuste fino o ejemplos en el prompt)\",\"topic\":\"llm\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"4\"},\"tags\":[\"llm\",\"datos\"],\"difficulty\":\"basic\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Your assistant answers well with documents attached. Remove the attachments, ask the same thing, and it answers with invented but plausible facts. What does the experiment prove, and what does it imply for deployment?\\n\\n(A) That the model is over-trained and must be re-trained from scratch with more Portuguese\\n(B) That the experiment's documents carried errors that polluted the model\\n(C) That RAG should be turned off in production: the model is better without documents\\n(D) The model depends on context: without it, it predicts plausible text, not truth — in production RAG is not optional, it is a requirement\",\"back\":\"Right call: The model depends on context: without it, it predicts plausible text, not truth — in production RAG is not optional, it is a requirement\\n\\nIt wins because the experiment CONTROLS the context variable (with vs. without attachments) and demonstrates the mechanism; the deployment implication is direct: ground it or don't ship it.\\n\\nExam cue: Without the fact in context, the LLM writes the most plausible thing; serious deployments ground by default.\\n\\nQuiz answer: Que el modelo depende del contexto: sin él, predice texto plausible, no verdadero — en producción el RAG no es opcional sino un requisito\",\"topic\":\"llm\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"5\"},\"tags\":[\"llm\",\"datos\"],\"difficulty\":\"basic\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The CTO asks which landscape layer Gemini Enterprise Agent Platform (formerly Vertex AI) belongs to. What do you answer?\\n\\n(A) Infrastructure: the hardware everything runs on\\n(B) Models: because it includes Gemini\\n(C) Platforms: the layer to build, deploy and govern models and agents (access, tuning, evaluation, deployment, governance)\\n(D) Applications: end users chat with it directly\",\"back\":\"Right call: Platforms: the layer to build, deploy and govern models and agents (access, tuning, evaluation, deployment, governance)\\n\\nIt wins because it places the product by its FUNCTION (management), not its wrapper; the landscape's platform definition — and its former Vertex AI name.\\n\\nExam cue: Layer = product's function: hardware serves, models think, the platform manages, agents act, applications get touched.\\n\\nQuiz answer: Plataformas: es la capa que permite construir, desplegar y gobernar modelos y agentes (acceso, afino, evaluación, despliegue, gobernanza)\",\"topic\":\"gcp\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"6\"},\"tags\":[\"gcp\",\"arquitectura\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The factory wants a lightweight tunable model running OFFLINE on the production line (visual defect detection), and IT insists on keeping hardware under its control. What do you pick and why?\\n\\n(A) Gemini via API: the best quality always wins\\n(B) A deterministic OpenCV pipeline: no generative AI needed at all\\n(C) Fine-tune a Model Garden partner model with no further changes\\n(D) Gemma: the open, lightweight, tunable model, downloadable to run on owned servers or edge devices in the factory\",\"back\":\"Right call: Gemma: the open, lightweight, tunable model, downloadable to run on owned servers or edge devices in the factory\\n\\nIt wins because it meets the three requirements that actually govern the case: downloadable (offline), runnable on owned hardware, and tunable to the task (defect detection).\\n\\nExam cue: When they demand offline + owned hardware + tunable, the open-catalog answer is Gemma.\\n\\nQuiz answer: Gemma: modelo abierto, ligero, afinable, descargable para correr en servidores propios o en dispositivos edge de la fábrica\",\"topic\":\"arquitectura\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"7\"},\"tags\":[\"arquitectura\",\"costo\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"8\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The support agent answers «your order status is 3» when the client asks about their order. The team fine-tuned the model on 100k historical tickets and the error persists. Real diagnosis and fix?\\n\\n(A) Missing context: order status is LIVE data that cannot be learned into weights; the agent gets a TOOL querying the order system and drafts from its response\\n(B) The fine-tuning was done poorly: with 500k better-curated tickets, the model would memorize the statuses\\n(C) Injecting the status catalog into the system prompt suffices: «3 means in transit»\\n(D) It is a temperature problem: at temperature 0, «3» would be the most probable, correct answer\",\"back\":\"Right call: Missing context: order status is LIVE data that cannot be learned into weights; the agent gets a TOOL querying the order system and drafts from its response\\n\\nIt wins because it separates the two engines: weights store PATTERNS, not today's order state; the remedy is function calling on the live system, not more training data.\\n\\nExam cue: Weights = patterns; context = facts. The live is not trained: it is fetched with tools.\\n\\nQuiz answer: Falta contexto: el estado del pedido es un dato VIVO que no puede aprenderse de weights; se da al agente una HERRAMIENTA que consulta el sistema de pedidos y redacta con esa respuesta\",\"topic\":\"agentes\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"8\"},\"tags\":[\"agentes\",\"arquitectura\"],\"difficulty\":\"advanced\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"9\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The CISO asks for a structured security framework across the AI lifecycle (injection, poisoning, model theft). Which Google framework answers that?\\n\\n(A) Google's Secure AI Framework (SAIF): AI lifecycle coverage across prompt injection, data poisoning and model theft\\n(B) The Architecture Framework's cost optimization pillar\\n(C) The ML lifecycle's data ingestion stage\\n(D) Model Garden's model cards: they document the model and its limits\",\"back\":\"Right call: Google's Secure AI Framework (SAIF): AI lifecycle coverage across prompt injection, data poisoning and model theft\\n\\nIt wins because that is precisely SAIF's scope: a structured security framework for AI systems across their lifecycle, with those risks as first-class citizens.\\n\\nExam cue: For AI systems security, Google's framework is SAIF; the other three are utilities, pillars, or documentation.\\n\\nQuiz answer: El Secure AI Framework (SAIF) de Google: cobertura del ciclo de vida de los sistemas de IA, con los riesgos de inyección de prompt, envenenamiento de datos y robo de modelo\",\"topic\":\"seguridad\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"9\"},\"tags\":[\"seguridad\",\"gcp\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-genai-lider-es\"},{\"questionId\":\"10\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The contract extractor must return EXACT clauses from legal policies, word-perfect: legal demands identical answers across queries of the same document. What configuration?\\n\\n(A) Random temperature: creativity helps paraphrase clauses more clearly\\n(B) Temperature 0.8 so it explores text variants and picks the best\\n(C) Fine-tuning the model on the company's contracts instead of prompt engineering\\n(D) Temperature 0 + few-shot format prompt + require document citations in the reply\",\"back\":\"Right call: Temperature 0 + few-shot format prompt + require document citations in the reply\\n\\nIt wins because it stacks the three right levers: temperature 0 (deterministic: same input, same output), few-shots (stable format), and citations (verifiable against the handed document).\\n\\nExam cue: Word-perfect accuracy demands: temperature 0, few-shot format, and auditable citations.\\n\\nQuiz answer: Temperature 0 + prompt con few-shot del formato + pedir citas del documento en la respuesta\",\"topic\":\"prompting\",\"origin\":\"ai\",\"source\":{\"quizId\":\"ruta-genai-lider-es\",\"questionId\":\"10\"},\"tags\":[\"prompting\",\"evaluacion\"],\"difficulty\":\"intermediate\",\"esDeck\":\"ruta-genai-lider-es\"}]},\"flows\":[]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
