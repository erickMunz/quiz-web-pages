_trial_count: total budget.\\n• parallel_trial_count: more = faster, but less learning between trials.\\n• Early stopping: cuts losing trials.\\n• Objective metric and direction (maximize AUC, minimize RMSE).\\n\\nExam cue: all trials in parallel ≈ random search.\\n\\nQuiz answer: Default Bayesian optimization, 60 max trials, about 5 in parallel, and early stopping of unpromising trials\",\"topic\":\"Hyperparameter tuning with Vizier\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"31\"},\"tags\":[\"pmle\",\"hyperparameter-tuning\",\"cost\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"32\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"In what order do you try prompting, RAG and tuning, and what does each solve?\",\"back\":\"1. Prompt engineering (instructions, few-shot): cheap, immediate.\\n2. Grounding / RAG: your own or changing knowledge, with citations.\\n3. Tuning (supervised, PEFT/LoRA): a consistent format, tone or task that prompting cannot pin down; needs hundreds to thousands of examples.\\n\\nExam cue: tuning is not a database; changing facts belong in retrieval.\\n\\nQuiz answer: Prompt engineering plus RAG grounded on the contract store (for example RAG Engine or Vertex AI Search), returning the cited passages\",\"topic\":\"Prompt, RAG or tuning\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"32\"},\"tags\":[\"pmle\",\"genai\",\"fine-tuning\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"33\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Why is PEFT/LoRA usually the default way to tune a large open model?\",\"back\":\"• Freezes the base model and trains small low-rank adapters.\\n• Far less GPU memory and time than full fine-tuning.\\n• Small artifacts; several adapters over one base model at serving time.\\n• Model Garden ships tuning recipes and notebooks.\\n• Full fine-tuning: only with lots of data and compute.\\n\\nExam cue: \\\"small GPU budget\\\" + \\\"several variants\\\" → LoRA.\\n\\nQuiz answer: Parameter-efficient fine-tuning (PEFT) such as LoRA, which trains small adapter weights on top of the frozen base model, one adapter per variant\",\"topic\":\"PEFT and LoRA\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"33\"},\"tags\":[\"pmle\",\"fine-tuning\",\"model-garden\"],\"difficulty\":\"advanced\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"34\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which cues in the question lead you to CPU, GPU or TPU?\",\"back\":\"• CPU: classical ML, small to medium tables, light inference.\\n• GPU: flexible deep learning, PyTorch, custom CUDA operations, most large-model serving.\\n• TPU: large dense-matrix models with XLA (JAX, TensorFlow, PyTorch/XLA), long training runs, pod scale; no custom CUDA ops.\\n\\nExam cue: \\\"custom CUDA\\\" rules out TPU.\\n\\nQuiz answer: 1 → CPU (or a modest GPU if the library supports it), 2 → GPU, 3 → TPU\",\"topic\":\"CPU, GPU or TPU\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"34\"},\"tags\":[\"pmle\",\"accelerators\",\"cost\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"35\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When do you use data parallelism and when model parallelism or sharding?\",\"back\":\"• Data parallelism: the model fits on one device; each worker holds a copy and processes another batch; gradients are synchronized (all-reduce).\\n• Sharding (FSDP/ZeRO): splits weights, gradients and optimizer state across workers.\\n• Tensor / pipeline parallelism: splits operations or layers across devices.\\n\\nExam cue: \\\"the weights do not fit on the largest GPU\\\" → sharding or model parallelism.\\n\\nQuiz answer: Model parallelism or sharded data parallelism (FSDP, tensor or pipeline parallelism) that splits weights and optimizer state\",\"topic\":\"Data vs model parallelism\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"35\"},\"tags\":[\"pmle\",\"distributed-training\",\"accelerators\"],\"difficulty\":\"advanced\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"36\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"You scale GPU training to several nodes and it barely improves: what do you check and what do you use?\",\"back\":\"Check where GPUs wait (profiling).\\n\\n• Waiting for data → more loader workers, prefetching, efficient formats (TFRecord, Parquet).\\n• Waiting for the gradient all-reduce between nodes → Reduction Server (dedicated reducer replicas) and fast-interconnect machines.\\n\\nExam cue: \\\"all-reduce\\\" + \\\"multi-node GPU\\\" → Reduction Server.\\n\\nQuiz answer: Add Reduction Server to the custom job: reducer replicas aggregate gradients and raise all-reduce throughput between GPU nodes\",\"topic\":\"Reduction Server\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"36\"},\"tags\":[\"pmle\",\"distributed-training\",\"performance\"],\"difficulty\":\"advanced\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"37\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When do you serve with a prebuilt container and when with a custom one?\",\"back\":\"• Prebuilt: TensorFlow, scikit-learn, XGBoost, PyTorch; artifact in Cloud Storage → Model Registry → endpoint. No Docker.\\n• Custom prediction routine: your Python pre/postprocessing, without writing the HTTP server.\\n• Custom container: unsupported framework or full control of the server.\\n\\nExam cue: \\\"no container expertise\\\" + supported framework → prebuilt.\\n\\nQuiz answer: Upload the model to Model Registry with the prebuilt XGBoost prediction container and deploy it to an endpoint\",\"topic\":\"Prebuilt prediction containers\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"37\"},\"tags\":[\"pmle\",\"serving\",\"containers\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"38\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you organize retrained models to audit and roll back fast?\",\"back\":\"• Each retrain = a new version of the same model in Model Registry.\\n• Aliases (default, champion…) mark the version in use.\\n• Metadata, evaluation and lineage next to each version.\\n• Rollback: redeploy the previous one or move traffic to it on the same endpoint.\\n\\nExam cue: never overwrite the model; never change the client URL to deploy.\\n\\nQuiz answer: A new version of the same model in Model Registry per retrain, an alias for production, and rollback by moving traffic\",\"topic\":\"Model Registry versions and aliases\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"38\"},\"tags\":[\"pmle\",\"model-registry\",\"mlops\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"39\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is the difference between a canary and an A/B test when deploying a model?\",\"back\":\"• Canary: a little traffic to the new version, raise it while healthy. Goal: limit risk.\\n• A/B: a stable split between versions for as long as needed. Goal: measure a business metric with significance.\\n• Both: the same endpoint with a traffic split; log which version served each prediction.\\n\\nExam cue: \\\"before vs after\\\" is not an experiment.\\n\\nQuiz answer: An A/B test: a fixed traffic split on one endpoint, each prediction logged with its model version, CTR compared per version\",\"topic\":\"Canary vs A/B test\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"39\"},\"tags\":[\"pmle\",\"rollout\",\"experimentation\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"40\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Where do you serve a model online given traffic, features and operations?\",\"back\":\"• Agent Platform endpoint: model monitoring, traffic split, explanations, GPU/TPU, autoscaling; at least one replica running.\\n• Cloud Run: stateless container, scales to zero, ideal for sporadic traffic and light models (GPUs supported too).\\n• GKE: you already run Kubernetes, many models, fine control of hardware and serving (vLLM, Triton…).\\n\\nExam cue: \\\"scale to zero\\\" → Cloud Run.\\n\\nQuiz answer: A container on Cloud Run that loads the model at startup and scales to zero when idle\",\"topic\":\"Agent Platform endpoint, Cloud Run or GKE\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"40\"},\"tags\":[\"pmle\",\"serving\",\"cost\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"41\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which requirements in the question lead to deploying the model at the edge?\",\"back\":\"• Intermittent or no connectivity.\\n• Millisecond latency next to the sensor.\\n• Data that must not leave the site.\\n\\nHow: train in the cloud → export and optimize (quantization, LiteRT/TensorFlow Lite) → infer on the device → sync results and metrics when the network is back.\\n\\nExam cue: if the network drops, no cloud endpoint meets the requirement.\\n\\nQuiz answer: Edge devices at the line running a model exported and optimized for on-device inference (for example quantized to LiteRT), syncing results later\",\"topic\":\"Edge deployment\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"41\"},\"tags\":[\"pmle\",\"edge\",\"hardware\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"42\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which scaling knobs does an online endpoint have and when do you turn each one?\",\"back\":\"• min replicas: warm capacity; raise it for sudden known peaks (or on a schedule).\\n• max replicas: cost and capacity ceiling.\\n• Target utilization (CPU / GPU duty cycle): lower = scales earlier.\\n• Machine type / accelerator: throughput per replica (size it with a load test).\\n\\nExam cue: adding replicas takes minutes; sudden peaks are covered with the minimum, not the maximum.\\n\\nQuiz answer: Raise min replicas to cover the known 9:00 peak (or on a schedule) and lower the target utilization so scale-out starts earlier\",\"topic\":\"Autoscaling online endpoints\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"42\"},\"tags\":[\"pmle\",\"serving\",\"scaling\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"43\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which lever do you use for each problem in a Gemini app?\",\"back\":\"• 429s on critical traffic → Provisioned Throughput (reserved capacity).\\n• Tolerant traffic → retries with exponential backoff + jitter.\\n• Non-interactive → batch inference (cheaper).\\n• Same large context in every request → context caching.\\n• High cost/latency → a smaller model (Flash) if evaluation approves it.\\n• Availability → global endpoint where allowed.\\n\\nExam cue: spreading across projects to dodge quota is never the answer.\\n\\nQuiz answer: Provisioned Throughput for the customer-facing assistant; exponential-backoff retries (or batch inference) for the internal job\",\"topic\":\"Gemini cost, latency and availability levers\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"43\"},\"tags\":[\"pmle\",\"gemini\",\"cost\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"44\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A model is accurate but slow or expensive to serve: which techniques do you try?\",\"back\":\"• Quantization (int8, fp8…): less memory, more throughput.\\n• Distillation: a small student mimicking the teacher.\\n• Pruning: remove low-value weights.\\n• Optimized runtime: TensorRT, vLLM, XLA compilation.\\n• Re-evaluate accuracy and latency after each change.\\n\\nExam cue: more replicas do not lower a single request's latency.\\n\\nQuiz answer: Shrink the model for serving: quantize it (for example int8) and/or distill it into a smaller student, then re-evaluate accuracy and latency\",\"topic\":\"Optimizing models for serving\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"44\"},\"tags\":[\"pmle\",\"serving\",\"performance\"],\"difficulty\":\"advanced\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"45\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which two gates should a training pipeline have, and what does each check?\",\"back\":\"1. Data validation (before training): statistics vs schema (types, columns, ranges) and vs the previous run (drift/skew). Typical tool: TensorFlow Data Validation.\\n2. Model validation (after): metrics vs threshold and vs the production model, also by slices; only then register and deploy.\\n\\nExam cue: \\\"training did not fail but the model came out bad\\\" → the data gate was missing.\\n\\nQuiz answer: Add a pre-training data validation step (for example TensorFlow Data Validation) that fails the run on schema or distribution anomalies\",\"topic\":\"Data and model validation gates\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"45\"},\"tags\":[\"pmle\",\"pipelines\",\"data-validation\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"46\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which orchestrator or engine do you choose for each kind of workflow?\",\"back\":\"• Agent Platform Pipelines (KFP/TFX): ML workflow with containers, caching, artifacts, lineage (ML Metadata), Model Registry.\\n• Managed Service for Apache Airflow (formerly Cloud Composer): many heterogeneous jobs and cross-system dependencies.\\n• Ray on Agent Platform: distributed Python (hyperparameter sweeps, RL, parallel preprocessing).\\n• Combine: Airflow triggers the ML pipeline.\\n\\nExam cue: don't rewrite what Airflow already orchestrates.\\n\\nQuiz answer: Build the ML workflow in Agent Platform Pipelines and let Managed Service for Apache Airflow (formerly Cloud Composer) trigger it\",\"topic\":\"Pipelines, Managed Airflow or Ray\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"46\"},\"tags\":[\"pmle\",\"pipelines\",\"orchestration\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"47\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When does Agent Platform Pipelines reuse a step's output, and what invalidates it?\",\"back\":\"It reuses when the component (code and image) and its inputs match an earlier successful execution. On by default.\\n\\nInvalidated by:\\n• An input that changes every run (time, random ID).\\n• Changing the component code or image.\\n• Disabling caching on the step, pipeline or job.\\n\\nExam cue: \\\"reruns six hours for a threshold change\\\" → check caching.\\n\\nQuiz answer: Caching should skip unchanged steps; it is probably disabled, or an upstream input such as a timestamp changes every run\",\"topic\":\"Pipeline execution caching\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"47\"},\"tags\":[\"pmle\",\"pipelines\",\"cost\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"48\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you choose between scheduled and triggered retraining?\",\"back\":\"• Scheduled: stable, predictable decay; simple.\\n• Triggered: irregular decay; real metric from labels (if they arrive fast) + input drift as early warning → launch the CT pipeline.\\n• Combine: triggers + a periodic safety retrain.\\n• Always with validation gates before deploying.\\n\\nExam cue: cost per retrain and label delay decide the policy.\\n\\nQuiz answer: Retrain when label-based accuracy or feature drift crosses a threshold, with a periodic retrain as a safety net\",\"topic\":\"Retraining policy\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"48\"},\"tags\":[\"pmle\",\"retraining\",\"monitoring\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"49\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What does each letter of CI/CD/CT automate, and with which tool?\",\"back\":\"• CI (Cloud Build): component unit tests, compile the pipeline, build images.\\n• CD (Cloud Build): publish the pipeline template and images (Artifact Registry) to each environment.\\n• CT (Agent Platform Pipelines): retrain on schedule or trigger → evaluate champion vs challenger → deploy only if it wins (dsl.If).\\n\\nExam cue: Cloud Build tests code; the pipeline gate tests the model.\\n\\nQuiz answer: Compare the candidate with the production (champion) model on the same test set, and deploy only through a conditional branch (dsl.If) if it wins\",\"topic\":\"CI/CD/CT on Google Cloud\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"49\"},\"tags\":[\"pmle\",\"mlops\",\"cicd\"],\"difficulty\":\"advanced\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"50\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which controls protect an LLM app, and what does each cover?\",\"back\":\"• Model Armor (templates, screens prompt and response): prompt injection, jailbreak, sensitive data (SDP), malicious URLs, responsible AI.\\n• The model's safety settings: harmful content categories.\\n• Regex / deterministic rules: specific fixed formats.\\n• Least privilege: which data and tools the model can reach.\\n• VPC Service Controls: prevent exfiltration through the APIs.\\n\\nExam cue: \\\"more instructions in the system prompt\\\" is never a security control.\\n\\nQuiz answer: Model Armor templates screening prompts and responses (injection, jailbreak, sensitive data, malicious URLs) across all apps, plus safety settings\",\"topic\":\"Securing gen AI apps with Model Armor\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"50\"},\"tags\":[\"pmle\",\"security\",\"genai\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"51\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which control do you use for each security risk on an ML platform?\",\"back\":\"• Copying data out with valid credentials → VPC Service Controls (perimeter).\\n• Who can do what → least-privilege IAM, a dedicated service account per workload.\\n• Control of encryption at rest → CMEK.\\n• Traffic without the public internet → private endpoints / Private Service Connect, notebooks without public IP.\\n• PII in training data → Sensitive Data Protection (de-identify).\\n\\nExam cue: CMEK and logs do not prevent copying; the perimeter does.\\n\\nQuiz answer: A VPC Service Controls perimeter around BigQuery, Cloud Storage and Agent Platform that blocks data from leaving it\",\"topic\":\"Preventing exfiltration of data and models\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"51\"},\"tags\":[\"pmle\",\"security\",\"vpc-sc\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"52\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What must you measure continuously in a gen AI app?\",\"back\":\"• Quality: a sample of real traffic scored with the Gen AI evaluation service / LLM-as-a-judge (groundedness, relevance, safety).\\n• User signal: thumbs, corrections, escalations.\\n• Operations: latency, errors, tokens and cost (model observability, Cloud Monitoring).\\n• Causes: changes in the corpus, the prompt or the model version.\\n\\nExam cue: good latency does not mean answers faithful to the context.\\n\\nQuiz answer: Log requests and responses, regularly score a sample for groundedness with the Gen AI evaluation service, and track feedback\",\"topic\":\"Monitoring gen AI in production\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"52\"},\"tags\":[\"pmle\",\"genai\",\"monitoring\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"53\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you tell training-serving skew, data drift, concept drift and attribution drift apart?\",\"back\":\"• Skew: serving inputs ≠ training data (often different preprocessing).\\n• Data drift: P(x) changes over time in production.\\n• Concept drift: P(y|x) changes; inputs look the same and only labels reveal it.\\n• Attribution drift: how much each feature weighs in predictions changes.\\n\\nModel Monitoring watches skew, drift and attributions; concept drift requires measuring performance with labels.\\n\\nExam cue: \\\"no drift alerts but recall falls\\\" → concept drift.\\n\\nQuiz answer: Concept drift: the feature–churn relationship changed; monitor performance on labels and retrain on recent data\",\"topic\":\"Skew, data drift and concept drift\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"53\"},\"tags\":[\"pmle\",\"monitoring\",\"drift\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"}]},\"flows\":[]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"href\":\"/quiz-web-pages/icons/favicon-32.png\",\"sizes\":\"32x32\",\"type\":\"image/png\"}],[\"$\",\"link\",\"9\",{\"rel\":\"apple-touch-icon\",\"href\":\"/quiz-web-pages/icons/apple-touch-icon.png\"}]]\n"])</script><script>self.__next_f.push([1,"8:null\n"])</script></body></html>
