\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"deckEs\":{\"quizId\":\"gcp-pmle-2026\",\"quizTitle\":\"GCP Professional ML Engineer — 2026 exam guide\",\"cardCount\":53,\"description\":\"Simulacro completo: 53 preguntas originales sobre la guía oficial del examen de junio de 2026, repartidas con el peso de cada dominio (13/16/21/20/18/13 %). Cubren lo que los exámenes OCR de 2025 no tienen: Model Garden, tuning de Gemini, PEFT, LLM-as-a-judge, Ray, Managed Airflow, coste/latencia de Gemini, entrenamiento distribuido, endpoints privados, edge, Model Armor, monitorización de IA generativa, concept y attribution drift, CI/CD/CT e IA responsable. Usa la nomenclatura 2026 (Agent Platform).\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"front\":\"¿Qué palancas optimizan coste, latencia y disponibilidad de una aplicación con Gemini?\",\"back\":\"Elegir el modelo justo y no pagar dos veces por el mismo contexto.\\n\\n• Modelo: Flash/Flash-Lite si la evaluación lo permite; Pro solo si hace falta.\\n• Context caching: prefijos grandes repetidos (manuales, instrucciones largas).\\n• Predicción por lotes: trabajo offline, más barata.\\n• Provisioned Throughput: capacidad reservada y latencia predecible.\\n• Endpoint global o varias regiones para disponibilidad.\\n\\nPista de examen: fine-tuning no sustituye al grounding para conocimiento.\\n\\nRespuesta del quiz: Use context caching for the manual (a reused prefix billed at a reduced rate), and evaluate whether a Flash model meets the quality bar\",\"topic\":\"Optimizar coste y latencia con Gemini\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"1\"},\"tags\":[\"pmle\",\"genai\",\"gemini\",\"cost\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"2\",\"part\":\"m\",\"front\":\"¿Cómo se hace fine-tuning de Gemini sin salir de BigQuery?\",\"back\":\"Con un modelo remoto y supervised tuning en CREATE MODEL.\\n\\n• CREATE MODEL … REMOTE WITH CONNECTION … OPTIONS(endpoint='gemini-…', max_iterations=…).\\n• AS SELECT con columnas de prompt y de etiqueta.\\n• Uso: AI.GENERATE / ML.GENERATE_TEXT; evaluación con ML.EVALUATE.\\n• Antes de ajustar: probar prompt engineering y few-shot; ajustar cuando el estilo/tarea no se consigue con prompts.\\n\\nPista de examen: «SQL only» + «tune Gemini» → BigQuery ML.\\n\\nRespuesta del quiz: Create a remote Gemini model with CREATE MODEL and supervised tuning on the prompt and label columns, then call it with AI.GENERATE / ML.GENERATE_TEXT\",\"topic\":\"Ajustar Gemini desde BigQuery\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"2\"},\"tags\":[\"pmle\",\"bigquery-ml\",\"gemini\",\"tuning\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"3\",\"part\":\"m\",\"front\":\"¿Cuándo es Document AI la respuesta y qué tipos de procesador ofrece?\",\"back\":\"Cuando hay que extraer datos estructurados de documentos.\\n\\n• OCR + maquetación + extracción de entidades con confianza.\\n• Preentrenados: Invoice, Expense, Form Parser, documentos de identidad…\\n• Custom Extractor (generativo) y Custom Classifier/Splitter para documentos propios.\\n• Procesamiento online o por lotes desde Cloud Storage; salida a BigQuery.\\n• Human-in-the-loop para campos de baja confianza.\\n\\nPista de examen: Vision API = imágenes; Document AI = documentos con campos.\\n\\nRespuesta del quiz: Document AI processors (pre-trained invoice/form parsers or a Custom Extractor) run in batch, writing extracted fields to BigQuery, with human review of low-confidence fields\",\"topic\":\"Document AI\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"3\"},\"tags\":[\"pmle\",\"apis\",\"document-ai\"],\"difficulty\":\"basic\"},{\"questionId\":\"4\",\"part\":\"m\",\"front\":\"¿Cómo se elige un modelo en Model Garden para una tarea?\",\"back\":\"Con evaluación sobre tus datos y restricciones explícitas.\\n\\n• Catálogo: modelos de Google (Gemini, Imagen, Veo), partners como servicio (MaaS) y modelos abiertos desplegables.\\n• Criterios: calidad en tu tarea, latencia, coste, ventana de contexto, licencia, residencia de datos.\\n• Regla: el modelo más pequeño que cumple el umbral.\\n• Si no llega: mejor prompt / grounding, y después tuning.\\n\\nPista de examen: «el más grande siempre» es una trampa.\\n\\nRespuesta del quiz: Shortlist a few candidates, evaluate quality, latency and cost on a representative labeled set, and pick the smallest that meets the bar\",\"topic\":\"Elegir modelo en Model Garden\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"4\"},\"tags\":[\"pmle\",\"genai\",\"model-garden\"],\"difficulty\":\"basic\"},{\"questionId\":\"5\",\"part\":\"m\",\"front\":\"¿Cómo se protege la PII en datos de entrenamiento sin perder su utilidad?\",\"back\":\"Desidentificando con Sensitive Data Protection y separando accesos.\\n\\n• Inspección por infoTypes (nombres, teléfonos, IDs, personalizados).\\n• Transformaciones: sustituir por infoType, enmascarar, tokenizar de forma determinista (seudónimos), generalizar fechas/edades.\\n• Resultado en un dataset aparte; IAM solo sobre ese dataset.\\n• Para tabulares: también policy tags / seguridad por columna en BigQuery.\\n\\nPista de examen: cifrado ≠ desidentificación.\\n\\nRespuesta del quiz: De-identify the notes with Sensitive Data Protection (infoType tokens or consistent pseudonyms) into a separate dataset, and grant data scientists access only to that dataset\",\"topic\":\"Desidentificar datos de entrenamiento\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"5\"},\"tags\":[\"pmle\",\"privacy\",\"data\"],\"difficulty\":\"basic\"},{\"questionId\":\"6\",\"part\":\"m\",\"front\":\"¿Cómo se evalúa una aplicación generativa cuando no hay una única respuesta correcta?\",\"back\":\"Con un dataset de evaluación y métricas basadas en modelo, calibradas por humanos.\\n\\n• LLM-as-a-judge: rúbricas (groundedness, relevancia, seguridad, instrucciones); pointwise o pairwise.\\n• Métricas calculadas si hay referencia: ROUGE, BLEU, exact match, tool-call.\\n• Gen AI evaluation service en Agent Platform; resultados en Experiments.\\n• Muestra humana para comprobar que el juez acierta.\\n\\nPista de examen: exact match en texto libre = mala métrica.\\n\\nRespuesta del quiz: Use the Gen AI evaluation service on a representative dataset with LLM-as-a-judge rubrics such as groundedness, spot-checked by humans\",\"topic\":\"Evaluar IA generativa con LLM-as-a-judge\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"6\"},\"tags\":[\"pmle\",\"genai\",\"evaluation\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"7\",\"part\":\"m\",\"front\":\"¿Qué buenas prácticas de seguridad aplicar a Colab Enterprise y Agent Platform Workbench?\",\"back\":\"Red privada, perímetro, identidad por usuario y nada de claves.\\n\\n• Sin IP pública; subred privada con Private Google Access.\\n• VPC Service Controls alrededor de BigQuery/Cloud Storage/Agent Platform.\\n• Acceso single-user / credenciales del usuario final; nunca claves JSON de SA.\\n• CMEK si la política lo exige.\\n• Código en Git; Colab Enterprise comparte por IAM.\\n\\nPista de examen: «exfiltration» → VPC Service Controls.\\n\\nRespuesta del quiz: Colab Enterprise or Workbench with runtime templates: no public IP, inside a VPC Service Controls perimeter, end-user credentials, CMEK if required, notebooks in Git\",\"topic\":\"Notebooks seguros\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"7\"},\"tags\":[\"pmle\",\"security\",\"notebooks\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"8\",\"part\":\"m\",\"front\":\"Experiments vs ML Metadata en Agent Platform: ¿qué resuelve cada uno?\",\"back\":\"Experiments compara ejecuciones; ML Metadata traza el linaje.\\n\\n• Experiments: parámetros, métricas y artefactos por run; comparativa; TensorBoard.\\n• ML Metadata: grafo artefacto ↔ ejecución (dataset → transform → train → modelo).\\n• Pipelines escribe metadata y linaje automáticamente.\\n• Model Registry: versiones y alias del modelo resultante.\\n\\nPista de examen: auditoría «qué datos produjeron este modelo» → linaje en ML Metadata.\\n\\nRespuesta del quiz: Experiments for each run's parameters and metrics, and ML Metadata from Agent Platform Pipelines for lineage up to the model\",\"topic\":\"Experiments y ML Metadata\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"8\"},\"tags\":[\"pmle\",\"mlops\",\"lineage\"],\"difficulty\":\"basic\"},{\"questionId\":\"9\",\"part\":\"m\",\"front\":\"¿Cómo se elige entre CPU, GPU y TPU para entrenar?\",\"back\":\"Por el tipo de carga y las dependencias del código.\\n\\n• TPU: matrices densas grandes vía XLA (JAX, TensorFlow, PyTorch/XLA); entrenamientos largos; escala en slices.\\n• GPU: kernels CUDA propios, librerías solo-GPU, ecosistema PyTorch amplio, ops no soportadas en TPU.\\n• CPU: modelos pequeños, árboles, preprocesado, prototipos.\\n• Edge TPU / GPU pequeñas: inferencia en el borde.\\n\\nPista de examen: «custom CUDA» descarta TPU.\\n\\nRespuesta del quiz: Cloud TPUs (a TPU slice through Agent Platform custom training or GKE): dense JAX/XLA matrix workloads map well to TPUs and scale across chips\",\"topic\":\"CPU vs GPU vs TPU\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"9\"},\"tags\":[\"pmle\",\"hardware\",\"training\"],\"difficulty\":\"basic\"},{\"questionId\":\"10\",\"part\":\"m\",\"front\":\"¿Cuándo usar un endpoint privado en Agent Platform y cómo se conecta?\",\"back\":\"Cuando la predicción solo debe ser accesible desde redes privadas.\\n\\n• Private Service Connect (recomendado) o VPC Network Peering.\\n• Tráfico por IPs privadas, sin exposición pública; suele bajar la latencia.\\n• Complementar con VPC Service Controls.\\n• Endpoint público: clientes externos, con IAM y, si hace falta, API Gateway/Apigee delante.\\n\\nPista de examen: «must not traverse the public internet» → privado.\\n\\nRespuesta del quiz: A private endpoint (Private Service Connect or VPC peering) so the VPC's applications reach the model over private IPs, combined with VPC Service Controls\",\"topic\":\"Endpoints privados de predicción\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"10\"},\"tags\":[\"pmle\",\"serving\",\"networking\"],\"difficulty\":\"basic\",\"related\":22},{\"questionId\":\"11\",\"part\":\"m\",\"front\":\"¿Cuándo hace falta un contenedor propio para servir en Agent Platform?\",\"back\":\"Cuando la inferencia necesita lógica o dependencias fuera del formato estándar.\\n\\n• Precompilado: TensorFlow, PyTorch, scikit-learn, XGBoost en formato estándar.\\n• Propio: pre/postprocesado, varias piezas, librerías no incluidas.\\n• Custom Prediction Routines: clase Python con preprocess/predict/postprocess → contenedor.\\n• Flujo: Artifact Registry → Model Registry → endpoint.\\n\\nPista de examen: preprocesado en el cliente = riesgo de training-serving skew.\\n\\nRespuesta del quiz: A custom container (for example a Custom Prediction Routine) implementing preprocess → predict → postprocess, pushed to Artifact Registry, registered and deployed\",\"topic\":\"Contenedores propios para servir\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"11\"},\"tags\":[\"pmle\",\"serving\",\"containers\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"12\",\"part\":\"m\",\"front\":\"Agent Platform Pipelines, Managed Airflow y Ray on Agent Platform: ¿cuándo cada uno?\",\"back\":\"Según qué orquestas: un flujo de ML, un flujo de datos general o cómputo distribuido Ray.\\n\\n• Agent Platform Pipelines (KFP/TFX): pipelines de ML sin servidor con linaje y metadata.\\n• Managed Service for Apache Airflow (antes Cloud Composer): DAGs de datos/ETL entre muchos servicios.\\n• Ray on Agent Platform: código Ray (Tune, Train, RLlib, Data) en clústeres gestionados.\\n• Kubeflow en GKE: control total, más operación.\\n\\nPista de examen: «ya usamos Airflow» → Managed Airflow; «lineage de ML» → Pipelines.\\n\\nRespuesta del quiz: Ray on Gemini Enterprise Agent Platform (formerly Ray on Vertex AI): managed Ray clusters usable from notebooks and jobs\",\"topic\":\"Opciones de orquestación\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"12\"},\"tags\":[\"pmle\",\"pipelines\",\"orchestration\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"13\",\"part\":\"m\",\"front\":\"¿Cómo se garantiza el mismo preprocesado en entrenamiento y en serving?\",\"back\":\"Una sola definición de la transformación, usada en ambos caminos.\\n\\n• Feature Store: variables calculadas una vez, lectura offline (entrenar) y online (servir).\\n• TensorFlow Transform: estadísticas en batch + grafo exportado con el modelo.\\n• Capas de preprocesado dentro del modelo (Keras) o el mismo código en el contenedor.\\n• Model Monitoring: alerta de training-serving skew.\\n\\nPista de examen: «reimplementado en otro lenguaje» → skew garantizado.\\n\\nRespuesta del quiz: Define the transformation once and reuse it in both paths (Feature Store, or TensorFlow Transform / a preprocessing layer in the model), and monitor skew\",\"topic\":\"Evitar training-serving skew\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"13\"},\"tags\":[\"pmle\",\"pipelines\",\"skew\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"14\",\"part\":\"m\",\"front\":\"¿Qué es CI, CD y CT en MLOps y con qué se implementa en Google Cloud?\",\"back\":\"CI prueba el código, CD despliega el pipeline/modelo y CT reentrena automáticamente.\\n\\n• CI: Cloud Build en cada commit; tests unitarios y de integración de componentes.\\n• CD: desplegar el pipeline compilado y, tras la evaluación, el modelo.\\n• CT: ejecución del pipeline por calendario, datos nuevos (Pub/Sub/Eventarc) o alerta de Model Monitoring.\\n• Puerta de evaluación: solo se registra/despliega si mejora.\\n\\nPista de examen: política de reentrenamiento = cuándo (calendario, datos, drift) + criterio de promoción.\\n\\nRespuesta del quiz: Cloud Build on merge tests and deploys the pipeline (CI/CD); the pipeline retrains on schedule or alerts and deploys only if it wins (CT)\",\"topic\":\"CI/CD/CT para ML\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"14\"},\"tags\":[\"pmle\",\"mlops\",\"cicd\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"15\",\"part\":\"m\",\"front\":\"Training-serving skew, data drift, concept drift y feature attribution drift: ¿qué mide cada uno?\",\"back\":\"Qué se compara y contra qué.\\n\\n• Skew: entradas de serving vs datos de entrenamiento.\\n• Data drift: entradas de serving vs entradas de serving anteriores.\\n• Concept drift: cambia la relación variables → objetivo; se confirma con etiquetas/métricas.\\n• Attribution drift: cambia cuánto aporta cada variable a la predicción (Explainable AI).\\n\\nPista de examen: entradas estables + importancias que cambian → attribution drift.\\n\\nRespuesta del quiz: Feature attribution drift: the features' contributions to predictions shifted, which can reveal changed relationships or data issues even with stable inputs\",\"topic\":\"Skew, drift y attribution drift\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"15\"},\"tags\":[\"pmle\",\"monitoring\"],\"difficulty\":\"intermediate\",\"related\":35},{\"questionId\":\"16\",\"part\":\"m\",\"front\":\"¿Cómo se comprueba la equidad de un modelo y se explican sus decisiones en Google Cloud?\",\"back\":\"Métricas por segmento + monitorización + atribuciones por predicción.\\n\\n• Evaluar por slices del atributo sensible: recall, FPR, tasa de aprobación.\\n• Comparar entre grupos (métricas de fairness); seguir midiéndolo en producción.\\n• Explainable AI: sampled Shapley (tabular, no diferenciable), integrated gradients (diferenciable), XRAI (imágenes).\\n• Quitar el atributo sensible no basta: hay variables proxy.\\n\\nPista de examen: «accuracy global» nunca demuestra equidad.\\n\\nRespuesta del quiz: Measure fairness metrics on slices by sensitive attribute, monitor them in production, and explain predictions with Explainable AI\",\"topic\":\"Equidad y explicabilidad\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"16\"},\"tags\":[\"pmle\",\"responsible-ai\",\"explainability\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"17\",\"part\":\"m\",\"front\":\"Tienes miles de series temporales en BigQuery y un equipo que solo sabe SQL. ¿Qué modelo y qué función usas?\",\"back\":\"ARIMA_PLUS + ML.FORECAST.\\n\\n• Un solo CREATE MODEL para todas las series con time_series_id_col.\\n• Tendencia, estacionalidad y festivos (holiday_region) automáticos.\\n• ML.FORECAST(horizon, confidence_level) → valor + límites del intervalo.\\n• ML.DETECT_ANOMALIES sobre el mismo modelo para picos raros.\\n\\nPista de examen: un regresor sobre la fecha no es un modelo de series temporales.\\n\\nRespuesta del quiz: One ARIMA_PLUS model with time_series_id_col and holiday_region, then ML.FORECAST with a 30-day horizon and a confidence level\",\"topic\":\"Pronóstico con ARIMA_PLUS\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"17\"},\"tags\":[\"pmle\",\"bigquery-ml\",\"forecasting\"],\"difficulty\":\"basic\"},{\"questionId\":\"18\",\"part\":\"m\",\"front\":\"¿Cómo evitas en BigQuery ML que el preprocesado del entrenamiento falte al predecir?\",\"back\":\"Con la cláusula TRANSFORM dentro de CREATE MODEL.\\n\\n• Funciones: ML.STANDARD_SCALER, ML.MIN_MAX_SCALER, ML.BUCKETIZE, ML.QUANTILE_BUCKETIZE, ML.ONE_HOT_ENCODER, ML.FEATURE_CROSS…\\n• Guarda las estadísticas ajustadas con el modelo.\\n• ML.PREDICT y ML.EVALUATE reciben filas crudas y aplican lo mismo.\\n\\nPista de examen: TRANSFORM = sin training-serving skew en BigQuery ML.\\n\\nRespuesta del quiz: Move the preprocessing into the model's TRANSFORM clause so BigQuery ML stores it with the model and applies it in ML.PREDICT and ML.EVALUATE\",\"topic\":\"Cláusula TRANSFORM de BigQuery ML\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"18\"},\"tags\":[\"pmle\",\"bigquery-ml\",\"feature-engineering\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"19\",\"part\":\"m\",\"front\":\"¿Cuándo y cómo ajustas Gemini sin salir de BigQuery?\",\"back\":\"Cuando el prompt no fija formato/tono y tienes miles de pares entrada→salida en una tabla.\\n\\n• CREATE MODEL remoto sobre Gemini (conexión a Agent Platform) con datos de entrenamiento: columna de prompt + columna de respuesta esperada.\\n• ML.EVALUATE para medir el modelo ajustado.\\n• ML.GENERATE_TEXT para inferir en SQL.\\n\\nPista de examen: tuning = estilo y comportamiento; conocimiento cambiante = RAG/grounding.\\n\\nRespuesta del quiz: Create a remote Gemini model in BigQuery ML, run supervised tuning on the prompt and approved-reply columns, evaluate it, and generate with ML.GENERATE_TEXT\",\"topic\":\"Tuning de Gemini desde BigQuery\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"19\"},\"tags\":[\"pmle\",\"bigquery-ml\",\"gemini-tuning\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"20\",\"part\":\"m\",\"front\":\"Antes de entrenar o ajustar nada, ¿qué API gestionada resuelve cada caso típico?\",\"back\":\"• Formularios, facturas, campos de documentos → Document AI (procesadores preentrenados o custom extractor).\\n• Etiquetas, OCR, objetos en imágenes → Vision API.\\n• Traducción → Translation API; terminología fija → glosario.\\n• Voz ↔ texto → Speech-to-Text / Text-to-Speech.\\n• Si la API no llega: AutoML o Gemini con prompt; después tuning.\\n\\nPista de examen: «sin equipo de ML» + caso estándar → API preentrenada.\\n\\nRespuesta del quiz: A glossary in Cloud Translation (Advanced) with the approved term pairs, passed with each translation request\",\"topic\":\"APIs especializadas primero\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"20\"},\"tags\":[\"pmle\",\"ai-apis\",\"low-code\"],\"difficulty\":\"basic\",\"related\":42},{\"questionId\":\"21\",\"part\":\"m\",\"front\":\"¿Qué herramienta de preprocesado eliges según escala y tipo de trabajo?\",\"back\":\"• Cabe en memoria → pandas / sklearn en el notebook.\\n• TB en BigQuery, joins y agregados → SQL de BigQuery.\\n• Streaming, por evento, ventanas, o batch+stream con el mismo código → Dataflow (Apache Beam).\\n• Código Spark existente → Dataproc / Serverless for Apache Spark.\\n\\nPista de examen: «se queda sin memoria» no se arregla con una VM más grande, sino llevando el cómputo a donde están los datos.\\n\\nRespuesta del quiz: Compute the nightly joins and aggregates in BigQuery SQL, and use Dataflow (Apache Beam) for the streaming per-event updates\",\"topic\":\"Elegir la herramienta de preprocesado\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"21\"},\"tags\":[\"pmle\",\"data-preprocessing\",\"dataflow\"],\"difficulty\":\"basic\",\"related\":42},{\"questionId\":\"22\",\"part\":\"m\",\"front\":\"¿Qué tres problemas resuelve Feature Store y cómo?\",\"back\":\"1. Definiciones duplicadas → una variable registrada sobre BigQuery (fuente offline).\\n2. Serving con baja latencia → feature view sincronizada a un online store.\\n3. Fuga temporal en entrenamiento → consultas point-in-time (valor en el instante de la etiqueta).\\n\\nPista de examen: consultar BigQuery en cada petición online nunca es la respuesta de baja latencia.\\n\\nRespuesta del quiz: Register the feature once in Feature Store over BigQuery, serve it from an online feature view, and build training sets point-in-time\",\"topic\":\"Feature Store en Agent Platform\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"22\"},\"tags\":[\"pmle\",\"feature-store\",\"serving\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"23\",\"part\":\"m\",\"front\":\"¿Cómo pruebas un modelo abierto o de terceros sin sacar pesos del proyecto?\",\"back\":\"Model Garden → desplegar en un endpoint de tu proyecto (o usarlo como API gestionada, models as a service) → llamarlo desde Colab Enterprise / Workbench.\\n\\n• Mismo conjunto de evaluación para todos los candidatos.\\n• Puntuar con el Gen AI evaluation service.\\n• Elegir el más pequeño que cumpla calidad, latencia y coste.\\n\\nPista de examen: «comparar modelos rápido y dentro del proyecto» → Model Garden.\\n\\nRespuesta del quiz: Deploy a candidate open model from Model Garden into the project and compare it with Gemini from a Colab Enterprise notebook\",\"topic\":\"Model Garden para prototipar\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"23\"},\"tags\":[\"pmle\",\"model-garden\",\"notebooks\"],\"difficulty\":\"basic\",\"related\":46},{\"questionId\":\"24\",\"part\":\"m\",\"front\":\"¿Qué herramienta de Agent Platform usas para cada necesidad de seguimiento?\",\"back\":\"• Comparar ejecuciones (parámetros, métricas) → Experiments (log_params, log_metrics, autologging).\\n• Curvas de entrenamiento en el tiempo → Agent Platform TensorBoard.\\n• ¿Qué datos, componente y versión produjeron este modelo? → ML Metadata / linaje de Pipelines.\\n• Versiones desplegables del modelo → Model Registry.\\n\\nPista de examen: no hace falta un pipeline para empezar a registrar experimentos.\\n\\nRespuesta del quiz: Experiments on Agent Platform: log parameters and metrics per run (or autolog), add TensorBoard for curves, compare in the console\",\"topic\":\"Experiments, TensorBoard y ML Metadata\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"24\"},\"tags\":[\"pmle\",\"experiments\",\"lineage\"],\"difficulty\":\"basic\",\"related\":47},{\"questionId\":\"25\",\"part\":\"m\",\"front\":\"¿Qué tipo de modelo pruebas primero según la forma de los datos?\",\"back\":\"• Serie temporal con estacionalidad → ARIMA_PLUS / forecasting de AutoML.\\n• Tabla de tamaño medio → árboles potenciados (XGBoost) o lineal/logística.\\n• Imagen, audio, texto → DNN (a menudo transfer learning).\\n• Tareas de lenguaje abiertas (resumir, extraer, conversar) → LLM.\\n• Segmentar sin etiquetas → k-means.\\n\\nPista de examen: «equipo con poca experiencia y plazo corto» → el modelo gestionado más simple que encaje.\\n\\nRespuesta del quiz: A time-series model such as ARIMA_PLUS (BigQuery ML) or AutoML forecasting, which models trend and seasonality directly\",\"topic\":\"Elegir el tipo de modelo\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"25\"},\"tags\":[\"pmle\",\"model-selection\",\"forecasting\"],\"difficulty\":\"basic\"},{\"questionId\":\"26\",\"part\":\"m\",\"front\":\"Si el regulador exige explicar cada decisión, ¿cómo cambia la elección del modelo?\",\"back\":\"Pesa la interpretabilidad contra una ganancia pequeña de precisión.\\n\\n• Interpretables: lineal/logística regularizada, árboles y ensembles con importancia de variables.\\n• Por decisión: atribuciones de Explainable AI (sampled Shapley, integrated gradients).\\n• Global: agregar atribuciones / importancia de variables.\\n\\nPista de examen: «AUC un poco mayor» no gana a «requisito de explicabilidad».\\n\\nRespuesta del quiz: Prefer the interpretable model (boosted trees or regularized linear) and add per-decision attributions and global importance with Explainable AI\",\"topic\":\"La interpretabilidad como requisito\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"26\"},\"tags\":[\"pmle\",\"interpretability\",\"model-selection\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"27\",\"part\":\"m\",\"front\":\"¿Cómo eliges entre inferencia por lotes, online y en el edge?\",\"back\":\"• Calendario + población conocida + nadie espera → batch prediction (o ML.PREDICT programado). Sin endpoint encendido.\\n• Petición individual con latencia baja → endpoint online con autoescalado.\\n• Sin conexión, en el dispositivo o latencia ultrabaja → modelo exportado al edge.\\n\\nPista de examen: un endpoint encendido sin tráfico es coste puro.\\n\\nRespuesta del quiz: Batch inference: a weekly batch prediction job (or scheduled ML.PREDICT) that writes the scores to BigQuery, with no endpoint\",\"topic\":\"Lotes, online o edge\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"27\"},\"tags\":[\"pmle\",\"deployment-strategy\",\"cost\"],\"difficulty\":\"basic\"},{\"questionId\":\"28\",\"part\":\"m\",\"front\":\"¿Cuándo entrenas con un contenedor precompilado y cuándo con uno personalizado?\",\"back\":\"• Precompilado (scikit-learn, XGBoost, TensorFlow, PyTorch): tu script o paquete Python + pip extra. Sin Dockerfile.\\n• Personalizado: bibliotecas del sistema, versión de framework no ofrecida, otro lenguaje o control total.\\n• Ambos: custom training job gestionado (máquina, aceleradores, logs, apagado automático).\\n\\nPista de examen: «no quieren mantener Docker» → precompilado.\\n\\nRespuesta del quiz: A custom training job on the prebuilt scikit-learn container, passing the script (or a Python package) and extra pip requirements\",\"topic\":\"Contenedor precompilado o personalizado\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"28\"},\"tags\":[\"pmle\",\"custom-training\",\"containers\"],\"difficulty\":\"basic\",\"related\":53},{\"questionId\":\"29\",\"part\":\"m\",\"front\":\"Síntoma → causa probable al entrenar: ¿qué miras primero?\",\"back\":\"• Loss NaN/inf → entradas con inf/NaN (división entre cero, log de 0) o gradientes que explotan → validar datos, bajar learning rate, gradient clipping.\\n• Out of memory en GPU → batch más pequeño, precisión mixta, acumulación de gradientes; si no cabe el modelo, sharding.\\n• Loss que no baja → learning rate, variables sin normalizar, etiquetas mal unidas.\\n• 403 al leer datos → la cuenta de servicio del job no tiene el rol.\\n\\nPista de examen: primero los datos, después la arquitectura.\\n\\nRespuesta del quiz: Check the new ratio feature for division by zero (inf/NaN) and validate inputs; if clean, lower the learning rate or add gradient clipping\",\"topic\":\"Diagnosticar fallos de entrenamiento\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"29\"},\"tags\":[\"pmle\",\"training\",\"troubleshooting\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"30\",\"part\":\"m\",\"front\":\"Error de out of memory en GPU: ¿qué haces si el modelo cabe y qué si no cabe?\",\"back\":\"El modelo cabe, el batch no:\\n• Precisión mixta (bf16/fp16).\\n• Micro-batch menor + acumulación de gradientes (mismo batch efectivo).\\n• Gradient checkpointing.\\n\\nEl modelo no cabe:\\n• GPU/TPU con más memoria, o sharding (FSDP) / paralelismo de modelo.\\n\\nPista de examen: no saltes a 16 nodos si basta con precisión mixta.\\n\\nRespuesta del quiz: Use mixed precision (bfloat16/float16) and gradient accumulation, for example 4 steps of 16 to reach an effective batch of 64\",\"topic\":\"GPU sin memoria\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"30\"},\"tags\":[\"pmle\",\"training\",\"accelerators\"],\"difficulty\":\"intermediate\",\"related\":54},{\"questionId\":\"31\",\"part\":\"m\",\"front\":\"¿Qué perillas tiene el hyperparameter tuning de Agent Platform y qué compromiso hay en cada una?\",\"back\":\"• Algoritmo: bayesiano por defecto (aprende de pruebas previas); grid/random para espacios pequeños.\\n• max_trial_count: presupuesto total.\\n• parallel_trial_count: más = más rápido, pero menos aprendizaje entre pruebas.\\n• Parada temprana: corta pruebas perdedoras.\\n• Métrica objetivo y dirección (maximizar AUC, minimizar RMSE).\\n\\nPista de examen: todas las pruebas en paralelo ≈ búsqueda aleatoria.\\n\\nRespuesta del quiz: Default Bayesian optimization, 60 max trials, about 5 in parallel, and early stopping of unpromising trials\",\"topic\":\"Hyperparameter tuning con Vizier\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"31\"},\"tags\":[\"pmle\",\"hyperparameter-tuning\",\"cost\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"32\",\"part\":\"m\",\"front\":\"¿En qué orden pruebas prompt, RAG y tuning, y qué resuelve cada uno?\",\"back\":\"1. Prompt engineering (instrucciones, few-shot): barato, inmediato.\\n2. Grounding / RAG: conocimiento propio o cambiante, con citas.\\n3. Tuning (supervised, PEFT/LoRA): formato, tono o tarea constante que el prompt no fija; necesita cientos o miles de ejemplos.\\n\\nPista de examen: el tuning no es una base de datos; los hechos que cambian van en la recuperación.\\n\\nRespuesta del quiz: Prompt engineering plus RAG grounded on the contract store (for example RAG Engine or Vertex AI Search), returning the cited passages\",\"topic\":\"Prompt, RAG o tuning\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"32\"},\"tags\":[\"pmle\",\"genai\",\"fine-tuning\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"33\",\"part\":\"m\",\"front\":\"¿Por qué PEFT/LoRA suele ser la forma por defecto de ajustar un modelo abierto grande?\",\"back\":\"• Congela el modelo base y entrena adaptadores pequeños de bajo rango.\\n• Mucha menos memoria de GPU y menos tiempo que el fine-tuning completo.\\n• Artefactos pequeños; varios adaptadores sobre un mismo modelo base al servir.\\n• Model Garden trae recetas y notebooks de tuning.\\n• Fine-tuning completo: solo con muchos datos y cómputo.\\n\\nPista de examen: «poco presupuesto de GPU» + «varias variantes» → LoRA.\\n\\nRespuesta del quiz: Parameter-efficient fine-tuning (PEFT) such as LoRA, which trains small adapter weights on top of the frozen base model, one adapter per variant\",\"topic\":\"PEFT y LoRA\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"33\"},\"tags\":[\"pmle\",\"fine-tuning\",\"model-garden\"],\"difficulty\":\"advanced\"},{\"questionId\":\"34\",\"part\":\"m\",\"front\":\"¿Qué señales del enunciado te llevan a CPU, GPU o TPU?\",\"back\":\"• CPU: ML clásico, tablas pequeñas o medianas, inferencia ligera.\\n• GPU: deep learning flexible, PyTorch, operaciones CUDA personalizadas, la mayoría de serving de modelos grandes.\\n• TPU: modelos grandes de álgebra matricial densa con XLA (JAX, TensorFlow, PyTorch/XLA), entrenamientos largos, escala de pod; sin ops CUDA personalizadas.\\n\\nPista de examen: «custom CUDA» descarta la TPU.\\n\\nRespuesta del quiz: 1 → CPU (or a modest GPU if the library supports it), 2 → GPU, 3 → TPU\",\"topic\":\"CPU, GPU o TPU\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"34\"},\"tags\":[\"pmle\",\"accelerators\",\"cost\"],\"difficulty\":\"basic\",\"related\":58},{\"questionId\":\"35\",\"part\":\"m\",\"front\":\"¿Cuándo usas data parallelism y cuándo paralelismo de modelo o sharding?\",\"back\":\"• Data parallelism: el modelo cabe en un dispositivo; cada worker tiene una copia y procesa otro batch; se sincronizan gradientes (all-reduce).\\n• Sharding (FSDP/ZeRO): reparte pesos, gradientes y optimizador entre workers.\\n• Paralelismo tensorial / de pipeline: divide operaciones o capas entre dispositivos.\\n\\nPista de examen: «los pesos no caben en la GPU más grande» → sharding o paralelismo de modelo.\\n\\nRespuesta del quiz: Model parallelism or sharded data parallelism (FSDP, tensor or pipeline parallelism) that splits weights and optimizer state\",\"topic\":\"Paralelismo de datos o de modelo\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"35\"},\"tags\":[\"pmle\",\"distributed-training\",\"accelerators\"],\"difficulty\":\"advanced\"},{\"questionId\":\"36\",\"part\":\"m\",\"front\":\"Escalas un entrenamiento de GPU a varios nodos y casi no mejora: ¿qué miras y qué usas?\",\"back\":\"Mira dónde esperan las GPU (profiling).\\n\\n• Esperan datos → más workers de carga, prefetch, formato eficiente (TFRecord, Parquet).\\n• Esperan el all-reduce de gradientes entre nodos → Reduction Server (réplicas reductoras dedicadas) y máquinas con interconexión rápida.\\n\\nPista de examen: «all-reduce» + «multinodo GPU» → Reduction Server.\\n\\nRespuesta del quiz: Add Reduction Server to the custom job: reducer replicas aggregate gradients and raise all-reduce throughput between GPU nodes\",\"topic\":\"Reduction Server\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"36\"},\"tags\":[\"pmle\",\"distributed-training\",\"performance\"],\"difficulty\":\"advanced\",\"related\":59},{\"questionId\":\"37\",\"part\":\"m\",\"front\":\"¿Cuándo sirves con un contenedor precompilado y cuándo con uno personalizado?\",\"back\":\"• Precompilado: TensorFlow, scikit-learn, XGBoost, PyTorch; artefacto en Cloud Storage → Model Registry → endpoint. Sin Docker.\\n• Custom prediction routine: tu preprocesado/postprocesado en Python, sin escribir el servidor HTTP.\\n• Contenedor personalizado: framework no soportado o control total del servidor.\\n\\nPista de examen: «sin experiencia en contenedores» + framework soportado → precompilado.\\n\\nRespuesta del quiz: Upload the model to Model Registry with the prebuilt XGBoost prediction container and deploy it to an endpoint\",\"topic\":\"Contenedores de predicción precompilados\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"37\"},\"tags\":[\"pmle\",\"serving\",\"containers\"],\"difficulty\":\"basic\",\"related\":59},{\"questionId\":\"38\",\"part\":\"m\",\"front\":\"¿Cómo organizas modelos reentrenados para auditar y volver atrás rápido?\",\"back\":\"• Cada reentreno = nueva versión del mismo modelo en Model Registry.\\n• Alias (default, champion…) marcan la versión que se usa.\\n• Metadatos, evaluación y linaje junto a cada versión.\\n• Rollback: redesplegar la anterior o moverle el tráfico en el mismo endpoint.\\n\\nPista de examen: nunca sobrescribas el modelo; nunca cambies la URL del cliente para desplegar.\\n\\nRespuesta del quiz: A new version of the same model in Model Registry per retrain, an alias for production, and rollback by moving traffic\",\"topic\":\"Versiones y alias en Model Registry\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"38\"},\"tags\":[\"pmle\",\"model-registry\",\"mlops\"],\"difficulty\":\"basic\",\"related\":60},{\"questionId\":\"39\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre un canary y un test A/B al desplegar un modelo?\",\"back\":\"• Canary: poco tráfico a la versión nueva, subir si está sana. Objetivo: limitar riesgo.\\n• A/B: reparto estable entre versiones durante el tiempo necesario. Objetivo: medir una métrica de negocio con significación.\\n• Ambos: mismo endpoint con reparto de tráfico; registrar qué versión sirvió cada predicción.\\n\\nPista de examen: «antes vs después» no es un experimento.\\n\\nRespuesta del quiz: An A/B test: a fixed traffic split on one endpoint, each prediction logged with its model version, CTR compared per version\",\"topic\":\"Canary o test A/B\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"39\"},\"tags\":[\"pmle\",\"rollout\",\"experimentation\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"40\",\"part\":\"m\",\"front\":\"¿Dónde sirves un modelo online según tráfico, funciones y operación?\",\"back\":\"• Endpoint de Agent Platform: model monitoring, reparto de tráfico, explicaciones, GPU/TPU, autoescalado; mínimo una réplica encendida.\\n• Cloud Run: contenedor sin estado, escala a cero, ideal para tráfico esporádico y modelos ligeros (también admite GPU).\\n• GKE: ya operas Kubernetes, muchos modelos, control fino de hardware y serving (vLLM, Triton…).\\n\\nPista de examen: «escala a cero» → Cloud Run.\\n\\nRespuesta del quiz: A container on Cloud Run that loads the model at startup and scales to zero when idle\",\"topic\":\"Endpoint de Agent Platform, Cloud Run o GKE\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"40\"},\"tags\":[\"pmle\",\"serving\",\"cost\"],\"difficulty\":\"intermediate\",\"related\":61},{\"questionId\":\"41\",\"part\":\"m\",\"front\":\"¿Qué requisitos del enunciado llevan a desplegar el modelo en el edge?\",\"back\":\"• Conexión intermitente o inexistente.\\n• Latencia de milisegundos junto al sensor.\\n• Datos que no deben salir del sitio.\\n\\nCómo: entrenar en la nube → exportar y optimizar (cuantización, LiteRT/TensorFlow Lite) → inferir en el dispositivo → sincronizar resultados y métricas cuando haya red.\\n\\nPista de examen: si la red se cae, ningún endpoint en la nube cumple.\\n\\nRespuesta del quiz: Edge devices at the line running a model exported and optimized for on-device inference (for example quantized to LiteRT), syncing results later\",\"topic\":\"Despliegue en el edge\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"41\"},\"tags\":[\"pmle\",\"edge\",\"hardware\"],\"difficulty\":\"basic\"},{\"questionId\":\"42\",\"part\":\"m\",\"front\":\"¿Qué perillas de escalado tiene un endpoint online y cuándo tocas cada una?\",\"back\":\"• min replicas: capacidad caliente; súbela para picos bruscos y conocidos (o con calendario).\\n• max replicas: techo de coste y de capacidad.\\n• Objetivo de utilización (CPU / duty cycle de GPU): más bajo = escala antes.\\n• Tipo de máquina / acelerador: rendimiento por réplica (dimensionar con prueba de carga).\\n\\nPista de examen: añadir réplicas tarda minutos; los picos bruscos se cubren con mínimo, no con máximo.\\n\\nRespuesta del quiz: Raise min replicas to cover the known 9:00 peak (or on a schedule) and lower the target utilization so scale-out starts earlier\",\"topic\":\"Autoescalado de endpoints online\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"42\"},\"tags\":[\"pmle\",\"serving\",\"scaling\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"43\",\"part\":\"m\",\"front\":\"¿Qué palanca usas para cada problema de una app con Gemini?\",\"back\":\"• 429 en tráfico crítico → Provisioned Throughput (capacidad reservada).\\n• Tráfico tolerante → reintentos con backoff exponencial + jitter.\\n• No interactivo → inferencia por lotes (más barata).\\n• Mismo contexto grande en cada petición → context caching.\\n• Coste/latencia altos → modelo más pequeño (Flash) si la evaluación lo aprueba.\\n• Disponibilidad → endpoint global donde se permita.\\n\\nPista de examen: repartir en varios proyectos para esquivar cuota nunca es la respuesta.\\n\\nRespuesta del quiz: Provisioned Throughput for the customer-facing assistant; exponential-backoff retries (or batch inference) for the internal job\",\"topic\":\"Palancas de coste, latencia y disponibilidad de Gemini\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"43\"},\"tags\":[\"pmle\",\"gemini\",\"cost\"],\"difficulty\":\"intermediate\",\"related\":64},{\"questionId\":\"44\",\"part\":\"m\",\"front\":\"Un modelo es preciso pero lento o caro al servir: ¿qué técnicas pruebas?\",\"back\":\"• Cuantización (int8, fp8…): menos memoria, más rendimiento.\\n• Destilación: estudiante pequeño que imita al profesor.\\n• Poda: quitar pesos poco útiles.\\n• Runtime optimizado: TensorRT, vLLM, compilación XLA.\\n• Reevaluar precisión y latencia después de cada cambio.\\n\\nPista de examen: más réplicas no bajan la latencia de una petición.\\n\\nRespuesta del quiz: Shrink the model for serving: quantize it (for example int8) and/or distill it into a smaller student, then re-evaluate accuracy and latency\",\"topic\":\"Optimizar modelos para servir\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"44\"},\"tags\":[\"pmle\",\"serving\",\"performance\"],\"difficulty\":\"advanced\"},{\"questionId\":\"45\",\"part\":\"m\",\"front\":\"¿Qué dos puertas debe tener un pipeline de entrenamiento y qué comprueba cada una?\",\"back\":\"1. Validación de datos (antes de entrenar): estadísticas vs esquema (tipos, columnas, rangos) y vs la ejecución anterior (drift/skew). Herramienta típica: TensorFlow Data Validation.\\n2. Validación del modelo (después): métricas vs umbral y vs el modelo en producción, también por segmentos; solo entonces registrar y desplegar.\\n\\nPista de examen: «el entrenamiento no falló pero el modelo salió malo» → faltaba la puerta de datos.\\n\\nRespuesta del quiz: Add a pre-training data validation step (for example TensorFlow Data Validation) that fails the run on schema or distribution anomalies\",\"topic\":\"Puertas de validación de datos y de modelo\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"45\"},\"tags\":[\"pmle\",\"pipelines\",\"data-validation\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"46\",\"part\":\"m\",\"front\":\"¿Qué orquestador o motor eliges para cada tipo de flujo?\",\"back\":\"• Agent Platform Pipelines (KFP/TFX): flujo de ML con contenedores, caché, artefactos, linaje (ML Metadata), Model Registry.\\n• Managed Service for Apache Airflow (antes Cloud Composer): muchos trabajos heterogéneos y dependencias entre sistemas.\\n• Ray en Agent Platform: Python distribuido (barridos de hiperparámetros, RL, preprocesado paralelo).\\n• Combinar: Airflow dispara el pipeline de ML.\\n\\nPista de examen: no reescribas lo que ya orquesta Airflow.\\n\\nRespuesta del quiz: Build the ML workflow in Agent Platform Pipelines and let Managed Service for Apache Airflow (formerly Cloud Composer) trigger it\",\"topic\":\"Pipelines, Managed Airflow o Ray\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"46\"},\"tags\":[\"pmle\",\"pipelines\",\"orchestration\"],\"difficulty\":\"intermediate\",\"related\":66},{\"questionId\":\"47\",\"part\":\"m\",\"front\":\"¿Cuándo reutiliza Agent Platform Pipelines la salida de un paso y qué lo invalida?\",\"back\":\"Reutiliza si el componente (código e imagen) y sus entradas coinciden con una ejecución correcta anterior. Activado por defecto.\\n\\nLo invalida:\\n• Una entrada que cambia en cada ejecución (hora, ID aleatorio).\\n• Cambiar el código o la imagen del componente.\\n• Desactivar el caché en el paso, el pipeline o el job.\\n\\nPista de examen: «repite seis horas por cambiar un umbral» → revisar el caché.\\n\\nRespuesta del quiz: Caching should skip unchanged steps; it is probably disabled, or an upstream input such as a timestamp changes every run\",\"topic\":\"Caché de ejecución en pipelines\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"47\"},\"tags\":[\"pmle\",\"pipelines\",\"cost\"],\"difficulty\":\"intermediate\",\"related\":68},{\"questionId\":\"48\",\"part\":\"m\",\"front\":\"¿Cómo eliges entre reentreno programado y reentreno por disparador?\",\"back\":\"• Programado: degradación estable y predecible; simple.\\n• Por disparador: degradación irregular; métrica real con etiquetas (si llegan pronto) + drift de entrada como aviso temprano → lanzar el pipeline de CT.\\n• Combinar: disparadores + reentreno periódico de seguridad.\\n• Siempre con puertas de validación antes de desplegar.\\n\\nPista de examen: el coste por reentreno y el retraso de las etiquetas deciden la política.\\n\\nRespuesta del quiz: Retrain when label-based accuracy or feature drift crosses a threshold, with a periodic retrain as a safety net\",\"topic\":\"Política de reentreno\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"48\"},\"tags\":[\"pmle\",\"retraining\",\"monitoring\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"49\",\"part\":\"m\",\"front\":\"¿Qué automatiza cada letra de CI/CD/CT y con qué herramienta?\",\"back\":\"• CI (Cloud Build): tests unitarios de componentes, compilar el pipeline, construir imágenes.\\n• CD (Cloud Build): publicar la plantilla del pipeline y las imágenes (Artifact Registry) en cada entorno.\\n• CT (Agent Platform Pipelines): reentrenar por calendario o disparador → evaluar champion vs challenger → desplegar solo si gana (dsl.If).\\n\\nPista de examen: Cloud Build prueba código; la puerta del pipeline prueba el modelo.\\n\\nRespuesta del quiz: Compare the candidate with the production (champion) model on the same test set, and deploy only through a conditional branch (dsl.If) if it wins\",\"topic\":\"CI/CD/CT en Google Cloud\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"49\"},\"tags\":[\"pmle\",\"mlops\",\"cicd\"],\"difficulty\":\"advanced\"},{\"questionId\":\"50\",\"part\":\"m\",\"front\":\"¿Qué controles protegen una app con LLM y qué cubre cada uno?\",\"back\":\"• Model Armor (plantillas, filtra prompt y respuesta): prompt injection, jailbreak, datos sensibles (SDP), URL maliciosas, IA responsable.\\n• Safety settings del modelo: categorías de contenido dañino.\\n• Regex / reglas deterministas: formatos fijos concretos.\\n• Mínimo privilegio: qué datos y herramientas alcanza el modelo.\\n• VPC Service Controls: evitar exfiltración desde las APIs.\\n\\nPista de examen: «más instrucciones en el system prompt» nunca es un control de seguridad.\\n\\nRespuesta del quiz: Model Armor templates screening prompts and responses (injection, jailbreak, sensitive data, malicious URLs) across all apps, plus safety settings\",\"topic\":\"Proteger apps de IA generativa con Model Armor\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"50\"},\"tags\":[\"pmle\",\"security\",\"genai\"],\"difficulty\":\"intermediate\",\"related\":70},{\"questionId\":\"51\",\"part\":\"m\",\"front\":\"¿Qué control usas para cada riesgo de seguridad en una plataforma de ML?\",\"back\":\"• Copiar datos fuera con credenciales válidas → VPC Service Controls (perímetro).\\n• Quién puede hacer qué → IAM de mínimo privilegio, cuenta de servicio dedicada por carga.\\n• Control del cifrado en reposo → CMEK.\\n• Tráfico sin internet público → endpoints privados / Private Service Connect, notebooks sin IP pública.\\n• PII en datos de entrenamiento → Sensitive Data Protection (des-identificar).\\n\\nPista de examen: CMEK y logs no impiden la copia; el perímetro sí.\\n\\nRespuesta del quiz: A VPC Service Controls perimeter around BigQuery, Cloud Storage and Agent Platform that blocks data from leaving it\",\"topic\":\"Evitar la exfiltración de datos y modelos\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"51\"},\"tags\":[\"pmle\",\"security\",\"vpc-sc\"],\"difficulty\":\"intermediate\",\"related\":72},{\"questionId\":\"52\",\"part\":\"m\",\"front\":\"¿Qué debes medir de forma continua en una app de IA generativa?\",\"back\":\"• Calidad: muestra de tráfico real puntuada con el Gen AI evaluation service / LLM-as-a-judge (groundedness, relevancia, seguridad).\\n• Señal del usuario: pulgares, correcciones, escaladas.\\n• Operación: latencia, errores, tokens y coste (model observability, Cloud Monitoring).\\n• Causas: cambios en el corpus, en el prompt o en la versión del modelo.\\n\\nPista de examen: buena latencia no significa respuestas fieles al contexto.\\n\\nRespuesta del quiz: Log requests and responses, regularly score a sample for groundedness with the Gen AI evaluation service, and track feedback\",\"topic\":\"Monitorizar IA generativa en producción\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"52\"},\"tags\":[\"pmle\",\"genai\",\"monitoring\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"53\",\"part\":\"m\",\"front\":\"¿Cómo distingues training-serving skew, data drift, concept drift y attribution drift?\",\"back\":\"• Skew: entradas de serving ≠ datos de entrenamiento (a menudo, preprocesado distinto).\\n• Data drift: P(x) cambia con el tiempo en producción.\\n• Concept drift: P(y|x) cambia; las entradas parecen iguales y solo lo revelan las etiquetas.\\n• Attribution drift: cambia cuánto pesa cada variable en las predicciones.\\n\\nModel Monitoring vigila skew, drift y atribuciones; el concept drift exige medir el rendimiento con etiquetas.\\n\\nPista de examen: «sin alertas de drift pero el recall cae» → concept drift.\\n\\nRespuesta del quiz: Concept drift: the feature–churn relationship changed; monitor performance on labels and retrain on recent data\",\"topic\":\"Skew, data drift y concept drift\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"53\"},\"tags\":[\"pmle\",\"monitoring\",\"drift\"],\"difficulty\":\"intermediate\",\"related\":75}]},\"deckEn\":{\"quizId\":\"gcp-pmle-2026\",\"quizTitle\":\"GCP Professional ML Engineer — 2026 exam guide\",\"cardCount\":53,\"description\":\"Simulacro completo: 53 preguntas originales sobre la guía oficial del examen de junio de 2026, repartidas con el peso de cada dominio (13/16/21/20/18/13 %). Cubren lo que los exámenes OCR de 2025 no tienen: Model Garden, tuning de Gemini, PEFT, LLM-as-a-judge, Ray, Managed Airflow, coste/latencia de Gemini, entrenamiento distribuido, endpoints privados, edge, Model Armor, monitorización de IA generativa, concept y attribution drift, CI/CD/CT e IA responsable. Usa la nomenclatura 2026 (Agent Platform).\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which levers optimize cost, latency and availability of a Gemini application?\",\"back\":\"Pick the right model and don't pay twice for the same context.\\n\\n• Model: Flash/Flash-Lite if evaluation allows; Pro only when needed.\\n• Context caching: large repeated prefixes (manuals, long instructions).\\n• Batch prediction: offline work, cheaper.\\n• Provisioned Throughput: reserved capacity and predictable latency.\\n• Global endpoint or several regions for availability.\\n\\nExam cue: fine-tuning does not replace grounding for knowledge.\\n\\nQuiz answer: Use context caching for the manual (a reused prefix billed at a reduced rate), and evaluate whether a Flash model meets the quality bar\",\"topic\":\"Optimizing Gemini cost and latency\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"1\"},\"tags\":[\"pmle\",\"genai\",\"gemini\",\"cost\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you fine-tune Gemini without leaving BigQuery?\",\"back\":\"With a remote model and supervised tuning in CREATE MODEL.\\n\\n• CREATE MODEL … REMOTE WITH CONNECTION … OPTIONS(endpoint='gemini-…', max_iterations=…).\\n• AS SELECT with a prompt column and a label column.\\n• Use: AI.GENERATE / ML.GENERATE_TEXT; evaluate with ML.EVALUATE.\\n• Before tuning: try prompt engineering and few-shot; tune when the style/task cannot be reached with prompts.\\n\\nExam cue: \\\"SQL only\\\" + \\\"tune Gemini\\\" → BigQuery ML.\\n\\nQuiz answer: Create a remote Gemini model with CREATE MODEL and supervised tuning on the prompt and label columns, then call it with AI.GENERATE / ML.GENERATE_TEXT\",\"topic\":\"Tuning Gemini from BigQuery\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"2\"},\"tags\":[\"pmle\",\"bigquery-ml\",\"gemini\",\"tuning\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When is Document AI the answer, and which processor types does it offer?\",\"back\":\"When structured data must be extracted from documents.\\n\\n• OCR + layout + entity extraction with confidence.\\n• Pre-trained: Invoice, Expense, Form Parser, identity documents…\\n• Custom Extractor (generative) and Custom Classifier/Splitter for your own documents.\\n• Online or batch processing from Cloud Storage; output to BigQuery.\\n• Human-in-the-loop for low-confidence fields.\\n\\nExam cue: Vision API = images; Document AI = documents with fields.\\n\\nQuiz answer: Document AI processors (pre-trained invoice/form parsers or a Custom Extractor) run in batch, writing extracted fields to BigQuery, with human review of low-confidence fields\",\"topic\":\"Document AI\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"3\"},\"tags\":[\"pmle\",\"apis\",\"document-ai\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you choose a model in Model Garden for a task?\",\"back\":\"With evaluation on your data and explicit constraints.\\n\\n• Catalog: Google models (Gemini, Imagen, Veo), partner models as a service (MaaS) and deployable open models.\\n• Criteria: quality on your task, latency, cost, context window, license, data residency.\\n• Rule: the smallest model that meets the threshold.\\n• If it falls short: better prompt / grounding, then tuning.\\n\\nExam cue: \\\"always the largest\\\" is a trap.\\n\\nQuiz answer: Shortlist a few candidates, evaluate quality, latency and cost on a representative labeled set, and pick the smallest that meets the bar\",\"topic\":\"Choosing a model in Model Garden\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"4\"},\"tags\":[\"pmle\",\"genai\",\"model-garden\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you protect PII in training data without losing its utility?\",\"back\":\"De-identify with Sensitive Data Protection and separate access.\\n\\n• Inspection by infoTypes (names, phones, IDs, custom).\\n• Transformations: replace with infoType, mask, deterministic tokenization (pseudonyms), generalize dates/ages.\\n• Output in a separate dataset; IAM only on that dataset.\\n• For tabular data: also policy tags / column-level security in BigQuery.\\n\\nExam cue: encryption ≠ de-identification.\\n\\nQuiz answer: De-identify the notes with Sensitive Data Protection (infoType tokens or consistent pseudonyms) into a separate dataset, and grant data scientists access only to that dataset\",\"topic\":\"De-identifying training data\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"5\"},\"tags\":[\"pmle\",\"privacy\",\"data\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you evaluate a generative application when there is no single correct answer?\",\"back\":\"With an evaluation dataset and model-based metrics, calibrated by humans.\\n\\n• LLM-as-a-judge: rubrics (groundedness, relevance, safety, instructions); pointwise or pairwise.\\n• Computation metrics when references exist: ROUGE, BLEU, exact match, tool-call.\\n• Gen AI evaluation service on Agent Platform; results in Experiments.\\n• A human sample checks the judge.\\n\\nExam cue: exact match on free text = poor metric.\\n\\nQuiz answer: Use the Gen AI evaluation service on a representative dataset with LLM-as-a-judge rubrics such as groundedness, spot-checked by humans\",\"topic\":\"Evaluating gen AI with LLM-as-a-judge\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"6\"},\"tags\":[\"pmle\",\"genai\",\"evaluation\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which security best practices apply to Colab Enterprise and Agent Platform Workbench?\",\"back\":\"Private network, perimeter, per-user identity and no keys.\\n\\n• No public IP; private subnet with Private Google Access.\\n• VPC Service Controls around BigQuery/Cloud Storage/Agent Platform.\\n• Single-user access / end-user credentials; never SA JSON keys.\\n• CMEK if policy requires.\\n• Code in Git; Colab Enterprise shares through IAM.\\n\\nExam cue: \\\"exfiltration\\\" → VPC Service Controls.\\n\\nQuiz answer: Colab Enterprise or Workbench with runtime templates: no public IP, inside a VPC Service Controls perimeter, end-user credentials, CMEK if required, notebooks in Git\",\"topic\":\"Securing notebooks\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"7\"},\"tags\":[\"pmle\",\"security\",\"notebooks\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"8\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Experiments vs ML Metadata on Agent Platform: what does each one solve?\",\"back\":\"Experiments compares runs; ML Metadata traces lineage.\\n\\n• Experiments: parameters, metrics and artifacts per run; comparison; TensorBoard.\\n• ML Metadata: artifact ↔ execution graph (dataset → transform → train → model).\\n• Pipelines writes metadata and lineage automatically.\\n• Model Registry: versions and aliases of the resulting model.\\n\\nExam cue: audit \\\"which data produced this model\\\" → lineage in ML Metadata.\\n\\nQuiz answer: Experiments for each run's parameters and metrics, and ML Metadata from Agent Platform Pipelines for lineage up to the model\",\"topic\":\"Experiments and ML Metadata\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"8\"},\"tags\":[\"pmle\",\"mlops\",\"lineage\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"9\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you choose between CPU, GPU and TPU for training?\",\"back\":\"By the workload type and the code's dependencies.\\n\\n• TPU: large dense matrices via XLA (JAX, TensorFlow, PyTorch/XLA); long training runs; scales in slices.\\n• GPU: custom CUDA kernels, GPU-only libraries, broad PyTorch ecosystem, ops unsupported on TPU.\\n• CPU: small models, trees, preprocessing, prototypes.\\n• Edge TPU / small GPUs: inference at the edge.\\n\\nExam cue: \\\"custom CUDA\\\" rules out TPU.\\n\\nQuiz answer: Cloud TPUs (a TPU slice through Agent Platform custom training or GKE): dense JAX/XLA matrix workloads map well to TPUs and scale across chips\",\"topic\":\"CPU vs GPU vs TPU\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"9\"},\"tags\":[\"pmle\",\"hardware\",\"training\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"10\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When do you use a private endpoint on Agent Platform, and how does it connect?\",\"back\":\"When predictions must only be reachable from private networks.\\n\\n• Private Service Connect (recommended) or VPC Network Peering.\\n• Traffic over private IPs, no public exposure; often lower latency.\\n• Complement with VPC Service Controls.\\n• Public endpoint: external clients, with IAM and, if needed, API Gateway/Apigee in front.\\n\\nExam cue: \\\"must not traverse the public internet\\\" → private.\\n\\nQuiz answer: A private endpoint (Private Service Connect or VPC peering) so the VPC's applications reach the model over private IPs, combined with VPC Service Controls\",\"topic\":\"Private prediction endpoints\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"10\"},\"tags\":[\"pmle\",\"serving\",\"networking\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"11\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When do you need a custom container to serve on Agent Platform?\",\"back\":\"When inference needs logic or dependencies outside the standard format.\\n\\n• Prebuilt: TensorFlow, PyTorch, scikit-learn, XGBoost in standard format.\\n• Custom: pre/postprocessing, several pieces, libraries not included.\\n• Custom Prediction Routines: Python class with preprocess/predict/postprocess → container.\\n• Flow: Artifact Registry → Model Registry → endpoint.\\n\\nExam cue: preprocessing in the client = training-serving skew risk.\\n\\nQuiz answer: A custom container (for example a Custom Prediction Routine) implementing preprocess → predict → postprocess, pushed to Artifact Registry, registered and deployed\",\"topic\":\"Custom containers for serving\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"11\"},\"tags\":[\"pmle\",\"serving\",\"containers\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"12\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Agent Platform Pipelines, Managed Airflow and Ray on Agent Platform: when is each one used?\",\"back\":\"By what you orchestrate: an ML workflow, a general data workflow or Ray distributed compute.\\n\\n• Agent Platform Pipelines (KFP/TFX): serverless ML pipelines with lineage and metadata.\\n• Managed Service for Apache Airflow (formerly Cloud Composer): data/ETL DAGs across many services.\\n• Ray on Agent Platform: Ray code (Tune, Train, RLlib, Data) on managed clusters.\\n• Kubeflow on GKE: full control, more operations.\\n\\nExam cue: \\\"we already use Airflow\\\" → Managed Airflow; \\\"ML lineage\\\" → Pipelines.\\n\\nQuiz answer: Ray on Gemini Enterprise Agent Platform (formerly Ray on Vertex AI): managed Ray clusters usable from notebooks and jobs\",\"topic\":\"Orchestration options\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"12\"},\"tags\":[\"pmle\",\"pipelines\",\"orchestration\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"13\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you guarantee the same preprocessing in training and serving?\",\"back\":\"One definition of the transformation, used on both paths.\\n\\n• Feature Store: features computed once, read offline (training) and online (serving).\\n• TensorFlow Transform: batch statistics + a graph exported with the model.\\n• Preprocessing layers inside the model (Keras) or the same code in the container.\\n• Model Monitoring: training-serving skew alerts.\\n\\nExam cue: \\\"reimplemented in another language\\\" → guaranteed skew.\\n\\nQuiz answer: Define the transformation once and reuse it in both paths (Feature Store, or TensorFlow Transform / a preprocessing layer in the model), and monitor skew\",\"topic\":\"Preventing training-serving skew\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"13\"},\"tags\":[\"pmle\",\"pipelines\",\"skew\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"14\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What are CI, CD and CT in MLOps, and what implements them on Google Cloud?\",\"back\":\"CI tests code, CD deploys the pipeline/model and CT retrains automatically.\\n\\n• CI: Cloud Build on each commit; unit and integration tests of components.\\n• CD: deploy the compiled pipeline and, after evaluation, the model.\\n• CT: pipeline runs on a schedule, on new data (Pub/Sub/Eventarc) or on a Model Monitoring alert.\\n• Evaluation gate: register/deploy only if it improves.\\n\\nExam cue: retraining policy = when (schedule, data, drift) + promotion criterion.\\n\\nQuiz answer: Cloud Build on merge tests and deploys the pipeline (CI/CD); the pipeline retrains on schedule or alerts and deploys only if it wins (CT)\",\"topic\":\"CI/CD/CT for ML\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"14\"},\"tags\":[\"pmle\",\"mlops\",\"cicd\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"15\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Training-serving skew, data drift, concept drift and feature attribution drift: what does each measure?\",\"back\":\"What is compared against what.\\n\\n• Skew: serving inputs vs training data.\\n• Data drift: serving inputs vs earlier serving inputs.\\n• Concept drift: the features → target relationship changes; confirmed with labels/metrics.\\n• Attribution drift: how much each feature contributes to predictions changes (Explainable AI).\\n\\nExam cue: stable inputs + changing importances → attribution drift.\\n\\nQuiz answer: Feature attribution drift: the features' contributions to predictions shifted, which can reveal changed relationships or data issues even with stable inputs\",\"topic\":\"Skew, drift and attribution drift\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"15\"},\"tags\":[\"pmle\",\"monitoring\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"16\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you check a model's fairness and explain its decisions on Google Cloud?\",\"back\":\"Sliced metrics + monitoring + per-prediction attributions.\\n\\n• Evaluate on slices of the sensitive attribute: recall, FPR, approval rate.\\n• Compare across groups (fairness metrics); keep measuring in production.\\n• Explainable AI: sampled Shapley (tabular, non-differentiable), integrated gradients (differentiable), XRAI (images).\\n• Dropping the sensitive attribute is not enough: proxy features exist.\\n\\nExam cue: \\\"overall accuracy\\\" never proves fairness.\\n\\nQuiz answer: Measure fairness metrics on slices by sensitive attribute, monitor them in production, and explain predictions with Explainable AI\",\"topic\":\"Fairness and explainability\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"16\"},\"tags\":[\"pmle\",\"responsible-ai\",\"explainability\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"17\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"You have thousands of time series in BigQuery and a SQL-only team. Which model and which function do you use?\",\"back\":\"ARIMA_PLUS + ML.FORECAST.\\n\\n• One CREATE MODEL for every series with time_series_id_col.\\n• Trend, seasonality and holidays (holiday_region) handled automatically.\\n• ML.FORECAST(horizon, confidence_level) → value + interval bounds.\\n• ML.DETECT_ANOMALIES on the same model for unusual spikes.\\n\\nExam cue: a regressor on the date is not a time-series model.\\n\\nQuiz answer: One ARIMA_PLUS model with time_series_id_col and holiday_region, then ML.FORECAST with a 30-day horizon and a confidence level\",\"topic\":\"Forecasting with ARIMA_PLUS\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"17\"},\"tags\":[\"pmle\",\"bigquery-ml\",\"forecasting\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"18\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you stop BigQuery ML training preprocessing from going missing at prediction time?\",\"back\":\"With the TRANSFORM clause inside CREATE MODEL.\\n\\n• Functions: ML.STANDARD_SCALER, ML.MIN_MAX_SCALER, ML.BUCKETIZE, ML.QUANTILE_BUCKETIZE, ML.ONE_HOT_ENCODER, ML.FEATURE_CROSS…\\n• Stores the fitted statistics with the model.\\n• ML.PREDICT and ML.EVALUATE take raw rows and apply the same steps.\\n\\nExam cue: TRANSFORM = no training-serving skew in BigQuery ML.\\n\\nQuiz answer: Move the preprocessing into the model's TRANSFORM clause so BigQuery ML stores it with the model and applies it in ML.PREDICT and ML.EVALUATE\",\"topic\":\"BigQuery ML TRANSFORM clause\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"18\"},\"tags\":[\"pmle\",\"bigquery-ml\",\"feature-engineering\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"19\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When and how do you tune Gemini without leaving BigQuery?\",\"back\":\"When prompting cannot pin down format/tone and you have thousands of input→output pairs in a table.\\n\\n• Remote CREATE MODEL on Gemini (connection to Agent Platform) with training data: prompt column + expected-reply column.\\n• ML.EVALUATE to measure the tuned model.\\n• ML.GENERATE_TEXT for inference in SQL.\\n\\nExam cue: tuning = style and behaviour; changing knowledge = RAG/grounding.\\n\\nQuiz answer: Create a remote Gemini model in BigQuery ML, run supervised tuning on the prompt and approved-reply columns, evaluate it, and generate with ML.GENERATE_TEXT\",\"topic\":\"Tuning Gemini from BigQuery\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"19\"},\"tags\":[\"pmle\",\"bigquery-ml\",\"gemini-tuning\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"20\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Before training or tuning anything, which managed API solves each typical case?\",\"back\":\"• Forms, invoices, document fields → Document AI (pre-trained processors or custom extractor).\\n• Labels, OCR, objects in images → Vision API.\\n• Translation → Translation API; fixed terminology → glossary.\\n• Speech ↔ text → Speech-to-Text / Text-to-Speech.\\n• If the API falls short: AutoML or prompted Gemini; tuning after that.\\n\\nExam cue: \\\"no ML team\\\" + standard case → pre-trained API.\\n\\nQuiz answer: A glossary in Cloud Translation (Advanced) with the approved term pairs, passed with each translation request\",\"topic\":\"Specialized AI APIs first\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"20\"},\"tags\":[\"pmle\",\"ai-apis\",\"low-code\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"21\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which preprocessing tool do you pick by scale and type of work?\",\"back\":\"• Fits in memory → pandas / sklearn in the notebook.\\n• TB in BigQuery, joins and aggregates → BigQuery SQL.\\n• Streaming, per event, windows, or batch+stream with the same code → Dataflow (Apache Beam).\\n• Existing Spark code → Dataproc / Serverless for Apache Spark.\\n\\nExam cue: \\\"runs out of memory\\\" is not fixed with a bigger VM but by moving compute to where the data is.\\n\\nQuiz answer: Compute the nightly joins and aggregates in BigQuery SQL, and use Dataflow (Apache Beam) for the streaming per-event updates\",\"topic\":\"Choosing the preprocessing tool\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"21\"},\"tags\":[\"pmle\",\"data-preprocessing\",\"dataflow\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"22\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which three problems does Feature Store solve, and how?\",\"back\":\"1. Duplicate definitions → one feature registered on top of BigQuery (offline source).\\n2. Low-latency serving → feature view synced to an online store.\\n3. Time leakage in training → point-in-time lookups (value as of the label's timestamp).\\n\\nExam cue: querying BigQuery on every online request is never the low-latency answer.\\n\\nQuiz answer: Register the feature once in Feature Store over BigQuery, serve it from an online feature view, and build training sets point-in-time\",\"topic\":\"Feature Store on Agent Platform\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"22\"},\"tags\":[\"pmle\",\"feature-store\",\"serving\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"23\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you try an open or third-party model without taking weights out of the project?\",\"back\":\"Model Garden → deploy to an endpoint in your project (or use it as a managed API, models as a service) → call it from Colab Enterprise / Workbench.\\n\\n• Same evaluation set for every candidate.\\n• Score with the Gen AI evaluation service.\\n• Pick the smallest one that meets quality, latency and cost.\\n\\nExam cue: \\\"compare models fast and inside the project\\\" → Model Garden.\\n\\nQuiz answer: Deploy a candidate open model from Model Garden into the project and compare it with Gemini from a Colab Enterprise notebook\",\"topic\":\"Model Garden for prototyping\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"23\"},\"tags\":[\"pmle\",\"model-garden\",\"notebooks\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"24\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which Agent Platform tool do you use for each tracking need?\",\"back\":\"• Compare runs (parameters, metrics) → Experiments (log_params, log_metrics, autologging).\\n• Training curves over time → Agent Platform TensorBoard.\\n• Which data, component and version produced this model? → ML Metadata / Pipelines lineage.\\n• Deployable model versions → Model Registry.\\n\\nExam cue: you do not need a pipeline to start tracking experiments.\\n\\nQuiz answer: Experiments on Agent Platform: log parameters and metrics per run (or autolog), add TensorBoard for curves, compare in the console\",\"topic\":\"Experiments, TensorBoard and ML Metadata\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"24\"},\"tags\":[\"pmle\",\"experiments\",\"lineage\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"25\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which model type do you try first given the shape of the data?\",\"back\":\"• Seasonal time series → ARIMA_PLUS / AutoML forecasting.\\n• Medium-size table → boosted trees (XGBoost) or linear/logistic.\\n• Images, audio, text → DNN (often transfer learning).\\n• Open-ended language tasks (summarize, extract, converse) → LLM.\\n• Segmenting without labels → k-means.\\n\\nExam cue: \\\"inexperienced team and short deadline\\\" → the simplest managed model that fits.\\n\\nQuiz answer: A time-series model such as ARIMA_PLUS (BigQuery ML) or AutoML forecasting, which models trend and seasonality directly\",\"topic\":\"Choosing the model type\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"25\"},\"tags\":[\"pmle\",\"model-selection\",\"forecasting\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"26\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"If the regulator requires explaining every decision, how does the model choice change?\",\"back\":\"Weigh interpretability against a small accuracy gain.\\n\\n• Interpretable: regularized linear/logistic, trees and ensembles with feature importance.\\n• Per decision: Explainable AI attributions (sampled Shapley, integrated gradients).\\n• Global: aggregate attributions / feature importance.\\n\\nExam cue: \\\"slightly higher AUC\\\" does not beat \\\"explainability requirement\\\".\\n\\nQuiz answer: Prefer the interpretable model (boosted trees or regularized linear) and add per-decision attributions and global importance with Explainable AI\",\"topic\":\"Interpretability as a requirement\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"26\"},\"tags\":[\"pmle\",\"interpretability\",\"model-selection\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"27\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you choose between batch, online and edge inference?\",\"back\":\"• Schedule + known population + nobody waiting → batch prediction (or scheduled ML.PREDICT). No endpoint running.\\n• Individual request with low latency → online endpoint with autoscaling.\\n• Offline, on-device or ultra-low latency → model exported to the edge.\\n\\nExam cue: an endpoint running without traffic is pure cost.\\n\\nQuiz answer: Batch inference: a weekly batch prediction job (or scheduled ML.PREDICT) that writes the scores to BigQuery, with no endpoint\",\"topic\":\"Batch, online or edge\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"27\"},\"tags\":[\"pmle\",\"deployment-strategy\",\"cost\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"28\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When do you train on a prebuilt container and when on a custom one?\",\"back\":\"• Prebuilt (scikit-learn, XGBoost, TensorFlow, PyTorch): your script or Python package + extra pip. No Dockerfile.\\n• Custom: system libraries, a framework version not offered, another language or full control.\\n• Both: a managed custom training job (machine, accelerators, logs, automatic teardown).\\n\\nExam cue: \\\"don't want to maintain Docker\\\" → prebuilt.\\n\\nQuiz answer: A custom training job on the prebuilt scikit-learn container, passing the script (or a Python package) and extra pip requirements\",\"topic\":\"Prebuilt vs custom containers\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"28\"},\"tags\":[\"pmle\",\"custom-training\",\"containers\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"29\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Training symptom → likely cause: what do you check first?\",\"back\":\"• Loss NaN/inf → inf/NaN inputs (divide by zero, log of 0) or exploding gradients → validate data, lower learning rate, gradient clipping.\\n• GPU out of memory → smaller batch, mixed precision, gradient accumulation; if the model does not fit, sharding.\\n• Loss not decreasing → learning rate, unnormalized features, mis-joined labels.\\n• 403 reading data → the job's service account lacks the role.\\n\\nExam cue: data first, architecture later.\\n\\nQuiz answer: Check the new ratio feature for division by zero (inf/NaN) and validate inputs; if clean, lower the learning rate or add gradient clipping\",\"topic\":\"Troubleshooting training failures\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"29\"},\"tags\":[\"pmle\",\"training\",\"troubleshooting\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"30\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"GPU out-of-memory error: what do you do if the model fits, and what if it does not?\",\"back\":\"Model fits, batch does not:\\n• Mixed precision (bf16/fp16).\\n• Smaller micro-batch + gradient accumulation (same effective batch).\\n• Gradient checkpointing.\\n\\nModel does not fit:\\n• A GPU/TPU with more memory, or sharding (FSDP) / model parallelism.\\n\\nExam cue: don't jump to 16 nodes when mixed precision is enough.\\n\\nQuiz answer: Use mixed precision (bfloat16/float16) and gradient accumulation, for example 4 steps of 16 to reach an effective batch of 64\",\"topic\":\"GPU out of memory\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pmle-2026\",\"questionId\":\"30\"},\"tags\":[\"pmle\",\"training\",\"accelerators\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pmle-2026\"},{\"questionId\":\"31\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which knobs does Agent Platform hyperparameter tuning have, and what is the trade-off of each?\",\"back\":\"• Algorithm: Bayesian by default (learns from earlier trials); grid/random for small spaces.\\n• max
