rroneous fact to be introduced and then repeatedly relied on; here the unrelated chunks are real content, just irrelevant to the question.D. Incorrect. Context distraction is about over-weighting a large volume of prior actions/history, not about a small number of irrelevant retrieved documents being misused. (Respuesta correcta: Context confusion)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"1\"}},{\"id\":\"2::m\",\"questionId\":\"2\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa MCP?\",\"back\":\"A. Correct. Incorrect. Lakebase is a transactional Postgres database for application and agent state, not an evaluation or tracing framework.C. Incorrect. Incorrect. MCP connects agents to tools and resources; it has no built-in evaluation or tracing capability of its own. (Respuesta correcta: MLflow 3 for GenAI)\",\"topic\":\"MCP\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"2\"}},{\"id\":\"2::c2\",\"questionId\":\"2\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Agent Evaluation?\",\"back\":\"MLflow 3 for GenAI is the current, unified framework for tracing, evaluation, and monitoring of GenAI applications, and Databricks documents migration paths from legacy Agent Evaluation to it.B.\",\"topic\":\"Agent Evaluation\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"2\"}},{\"id\":\"2::c3\",\"questionId\":\"2\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa Unity Catalog?\",\"back\":\"Unity Catalog is a governance and data catalog layer; it does not provide tracing, evaluation, or monitoring for agent behavior.D. (Respuesta correcta: MLflow 3 for GenAI)\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"2\"}},{\"id\":\"3::m\",\"questionId\":\"3\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Once a tool result deep in history is no longer needed verbatim, clearing that raw output is one o…\\\"?\",\"back\":\"A. Incorrect. A higher reasoning effort spends more compute per response but does not remove the stale tokens still occupying context, so the underlying dilution remains.B. Incorrect. Re-running the tool call adds another large, mostly redundant listing to history, increasing token consumption rather than reducing it.C. Incorrect. An added instruction competes for attention just like any other token and does not actually remove the large stale listing from context, so the disproportionate consumption remains.D. Correct. Once a tool result deep in history is no longer needed verbatim, clearing that raw output is one of the lightest-touch and safest forms of compaction, freeing attention budget while preserving the decision or outcome that mattered. (Respuesta correcta: Apply tool result clearing to discard the superseded raw output while keeping the turn's outcome in history)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"3\"}},{\"id\":\"4::m\",\"questionId\":\"4\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Repeated redundant tool calls and contradictory answers indicate that the model's reasoning is bei…\\\"?\",\"back\":\"$e\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"4\"}},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. This is exactly the value-matching failure mode that example values and value dictionaries are des…\\\"?\",\"back\":\"$f\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"7\"}},{\"id\":\"8::m\",\"questionId\":\"8\",\"part\":\"m\",\"front\":\"¿Para qué se usa B.B?\",\"back\":\"$10\",\"topic\":\"B.B\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"8\"}},{\"id\":\"8::c2\",\"questionId\":\"8\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa Selecting Config?\",\"back\":\"Selecting Config B simply because it is longer ignores the fact that prompt content, not length, determines effectiveness.D. (Respuesta correcta: Config B is justified: the few-shot examples drive a large accuracy gain in a safety-critical domain where the added latency is quite acceptable.)\",\"topic\":\"Selecting Config\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"8\"}},{\"id\":\"9::m\",\"questionId\":\"9\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. The ambiguity is purely semantic: two similarly named timestamp columns with no documentation of w…\\\"?\",\"back\":\"$11\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"9\"}},{\"id\":\"10::m\",\"questionId\":\"10\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. A common starting point for chunk overlap when tuning a chunking strategy is around 10%, which is …\\\"?\",\"back\":\"A. Incorrect. 50% overlap is far higher than the typical starting baseline and would substantially increase index size and redundancy for most corpora.B. Incorrect. 90% overlap is an extreme value that would make most adjacent chunks nearly identical, wasting index space without a corresponding baseline recommendation.C. Incorrect. Some overlap is generally recommended as a starting point to avoid losing context at chunk boundaries; a 0% baseline is not the typical recommendation.D. Correct. A common starting point for chunk overlap when tuning a chunking strategy is around 10%, which is then adjusted iteratively based on document structure and evaluation results. (Respuesta correcta: Approximately 10% ad it on restart)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"16\"}},{\"id\":\"17::m\",\"questionId\":\"17\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa Databricks AI Search?\",\"back\":\"A. Incorrect. Sorting by recency retrieves memories based on time, not on conceptual relevance to the new ticket's content.B. Incorrect. A join against a fixed lookup table resolves known relationships between records; it does not measure semantic similarity between free-text memory content and a new query.C. Correct. Finding conceptually related content that shares no exact keywords requires comparing embeddings for semantic closeness, which is exactly what Databricks AI Search's vector similarity search provides.D. Incorrect. An exact-match category filter only returns rows that share the same discrete label; it cannot surface conceptually related memories that fall outside that category or use different wording. (Respuesta correcta: Databricks AI Search vector similarity search over embedded memory entries)\",\"topic\":\"Databricks AI Search\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"17\"}},{\"id\":\"19::m\",\"questionId\":\"19\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct: context pollution describes the over-retrieval symptom where too much irrelevant or low-value memo…\\\"?\",\"back\":\"A. Correct: context pollution describes the over-retrieval symptom where too much irrelevant or low-value memory content is included, diluting the relevant signal and degrading response quality.B. Incorrect: this describes a security/tampering issue, not the quality-dilution effect that context pollution refers to.C. Incorrect: this describes an availability failure, not the retrieval-quality issue captured by 'context pollution'.D. Incorrect: this describes a data-integrity or write-path issue, unrelated to the concept of irrelevant content diluting retrieved context. (Respuesta correcta: Degraded output quality caused by irrelevant retrieved memories crowding out the relevant ones in context)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"19\"}},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Incorrect. The conversation buffer is reset at the start of every new session regardless of its length, so …\\\"?\",\"back\":\"$15\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"21\"}},{\"id\":\"22::m\",\"questionId\":\"22\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa ACID?\",\"back\":\"$16\",\"topic\":\"ACID\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"22\"}},{\"id\":\"23::m\",\"questionId\":\"23\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa FAQ?\",\"back\":\"A. Correct. Neither description states what is being searched (the product catalog vs. the FAQ knowledge base), so the two tools read as functionally identical to the model, which then has to guess.B. Incorrect. A shared parameter name affects how arguments are supplied, not whether the model can distinguish which tool's purpose matches the user's intent — the failure here is in the description text, not the schema.C. Incorrect. Incorrect. (Respuesta correcta: Both descriptions say the tool \\\"finds matching entries for a query\\\" without naming the data source, so intent can't map to catalog vs. FAQ content.)\",\"topic\":\"FAQ\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"23\"}},{\"id\":\"24::m\",\"questionId\":\"24\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Progressive disclosure is a staging strategy for token cost, not a restriction on capability: the n, so the agent re-added the table. Decisions and their rationale need to survive compaction as explicit, standing constraints, not paraphrased narrative.D. Incorrect. Nothing in the scenario suggests the warehouse type was lost or caused the observed behavior; the failure is specifically about a table being re-added, tied to a decision, not a configuration detail like warehouse type. (Respuesta correcta: The explicit exclusion decision the user gave was discarded, rather than being carried forward as a standing constraint)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"26\"}},{\"id\":\"28::m\",\"questionId\":\"28\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. The schema fact remains critical long after it ages out of recency-based trimming, showing the rel…\\\"?\",\"back\":\"A. Correct. The schema fact remains critical long after it ages out of recency-based trimming, showing the relevance pattern is not purely recency-driven and requires compaction to preserve durable facts.B. Incorrect. If the pattern were purely recency-based, dropping the schema turn would not have caused a downstream failure; the observed failure demonstrates the opposite.C. Incorrect. This assumes all older turns are equally safe to discard, which is exactly the assumption the failure disproves for this task.D. Incorrect. The scenario states context pressure did trigger trimming; the failure is about what was dropped, not whether pressure existed. (Respuesta correcta: The pattern is non-monotonic: a fact stated early stays critical throughout, so recency-only trimming misses it and compaction is needed here.)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"28\"}},{\"id\":\"29::m\",\"questionId\":\"29\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Chunks 1, 3, 4, and 5 were retrieved but never used in reasoning or in the final answer, so they a…\\\"?\",\"back\":\"A. Incorrect. This is the chunk the answer actually quotes; removing it would strip the source evidence the final answer relies on.B. Incorrect. The original question is needed to verify the answer addressed the right policy topic and to support any follow-up questions in the same session.C. Incorrect. This is the agent's live deliverable built from the cited chunk, not superseded retrieval noise, so it should be preserved.D. Correct. Chunks 1, 3, 4, and 5 were retrieved but never used in reasoning or in the final answer, so they are redundant retrieval results that can be discarded without any loss of used information. (Respuesta correcta: The four unused chunks not referenced again in the trace)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"29\"}},{\"id\":\"32::m\",\"questionId\":\"32\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Propagating the most recent checkpoint state into the re-planning sub-agent's context before it pl…\\\"?\",\"back\":\"A. Incorrect. Write access changes what the sub-agent is permitted to do, but does not ensure it is given the current migration progress before it plans.B. Correct. Propagating the most recent checkpoint state into the re-planning sub-agent's context before it plans ensures it knows which tables are already migrated, directly preventing the duplicate scheduling.C. Incorrect. Ignoring checkpoints and restarting from the original plan discards progress information entirely, which would cause even more redundant re-migration rather than preventing it.D. Incorrect. Running the sub-agents in parallel without coordination removes propagation altogether, making it more likely the re-planning sub-agent acts on stale information.E. Incorrect. Fewer checkpoints reduces tracking overhead but widens the window during which the re-planning sub-agent's view of progress is stale. (Respuesta correcta: Refresh the re-planning sub-agent's context with the latest checkpoint before it plans next)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"32\"}},{\"id\":\"33::m\",\"questionId\":\"33\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Keeping the detailed intermediate reasoning local to the sub-agent and passing only a compact summ…\\\"?\",\"back\":\"$18\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"33\"}},{\"id\":\"34::m\",\"questionId\":\"34\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa Consolidating Genie?\",\"back\":\"$19\",\"topic\":\"Consolidating Genie\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"34\"}},{\"id\":\"35::m\",\"questionId\":\"35\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa SQL?\",\"back\":\"A. Correct. Neither agent is aware that the other is using knowledge of a different age, so their outputs diverge; this mismatch in shared understanding of context freshness is a core shared-context failure.B. Incorrect. Incorrect. An incorrectly configured SQL warehouse would typically cause query errors or wrong results, but the described disagreement stems from differing knowledge currency between agents, not a configuration error in one agent's execution environment.D. Incorrect. Aggressive chunking affects retrieval quality within a single vector index, not the cross-agent unawareness of different knowledge ages. The problem here is that neither agent knows the other is using differently aged sources. (Respuesta correcta: A shared-context gap between agents about the currency of their knowledge sources produces inconsistent answers to the same question.)\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"35\"},\"related\":33}],\"cardCount\":35},\"deckEn\":{\"quizId\":\"databricks-context-engineer-associate\",\"quizTitle\":\"Databricks Certified Context Engineer Associate\",\"cardCount\":35,\"cards\":[{\"id\":\"1::m\",\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Irrelevant content (the unrelated product chunks) was present in the context and ended up being us…\\\"?\",\"back\":\"A. Incorrect. Context clash requires two contradictory statements both present in context; the unrelated chunks do not contradict the warranty passage, they are simply off-topic.B. Correct. Irrelevant content (the unrelated product chunks) was present in the context and ended up being used to generate the response instead of the relevant passage — this is context confusion, where superfluous content degrades output quality.C. Incorrect. Context poisoning requires a hallucinated or erroneous fact to be introduced and then repeatedly relied on; here the unrelated chunks are real content, just irrelevant to the question.D. Incorrect. Context distraction is about over-weighting a large volume of prior actions/history, not about a small number of irrelevant retrieved documents being misused. (Respuesta correcta: Context confusion)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"1\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"2::m\",\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is MCP, and what is it used for?\",\"back\":\"A. Correct. Incorrect. Lakebase is a transactional Postgres database for application and agent state, not an evaluation or tracing framework.C. Incorrect. Incorrect. MCP connects agents to tools and resources; it has no built-in evaluation or tracing capability of its own. (Respuesta correcta: MLflow 3 for GenAI)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"MCP\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"2\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"2::c2\",\"questionId\":\"2\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Agent Evaluation, and what is it used for?\",\"back\":\"MLflow 3 for GenAI is the current, unified framework for tracing, evaluation, and monitoring of GenAI applications, and Databricks documents migration paths from legacy Agent Evaluation to it.B.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Agent Evaluation\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"2\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"2::c3\",\"questionId\":\"2\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is Unity Catalog, and what is it used for?\",\"back\":\"Unity Catalog is a governance and data catalog layer; it does not provide tracing, evaluation, or monitoring for agent behavior.D. (Respuesta correcta: MLflow 3 for GenAI)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"2\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"3::m\",\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Once a tool result deep in history is no longer needed verbatim, clearing that raw output is one o…\\\"?\",\"back\":\"A. Incorrect. A higher reasoning effort spends more compute per response but does not remove the stale tokens still occupying context, so the underlying dilution remains.B. Incorrect. Re-running the tool call adds another large, mostly redundant listing to history, increasing token consumption rather than reducing it.C. Incorrect. An added instruction competes for attention just like any other token and does not actually remove the large stale listing from context, so the disproportionate consumption remains.D. Correct. Once a tool result deep in history is no longer needed verbatim, clearing that raw output is one of the lightest-touch and safest forms of compaction, freeing attention budget while preserving the decision or outcome that mattered. (Respuesta correcta: Apply tool result clearing to discard the superseded raw output while keeping the turn's outcome in history)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"3\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"4::m\",\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Repeated redundant tool calls and contradictory answers indicate that the model's reasoning is bei…\\\"?\",\"back\":\"$1a\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"4\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Correct. This is exactly the value-matching failure mode that example values and value dictionaries are des…\\\"?\",\"back\":\"$1b\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"7\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"8::m\",\"questionId\":\"8\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is B.B used for?\",\"back\":\"$1c\",\"topic\":\"B.B\",\"origin\":\"explana baseline is not the typical recommendation.D. Correct. A common starting point for chunk overlap when tuning a chunking strategy is around 10%, which is then adjusted iteratively based on document structure and evaluation results. (Respuesta correcta: Approximately 10%)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"10\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"11::m\",\"questionId\":\"11\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SQL, and what is it used for?\",\"back\":\"A. Correct. Incorrect. Issuing a fresh SQL query per request suits structured, frequently changing data, not semantic search over free-form text; it also cannot perform similarity matching the way an embedding index can.C. Incorrect. Recomputing embeddings for the entire corpus on every inference call wastes compute and adds latency that a static quarterly-updated index avoids entirely.D. Incorrect. Genie spaces are designed for structured tabular question answering via generated SQL, not semantic retrieval over long-form unstructured manual text. (Respuesta correcta: Pre-inference retrieval using an AI Search embedding index built from the Delta table holding the manual content)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"11\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"11::c2\",\"questionId\":\"11\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is AI Search, and what is it used for?\",\"back\":\"The corpus is large, unstructured, and changes infrequently, so pre-computing embeddings once and querying the resulting AI Search index at inference time gives fast semantic matches without repeating expensive indexing work per query.B. (Respuesta correcta: Pre-inference retrieval using an AI Search embedding index built from the Delta table holding the manual content)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"AI Search\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"11\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"12::m\",\"questionId\":\"12\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is API, and what is it used for?\",\"back\":\"A. Correct. Since AI Search lacks native row/column-level security, the documented application-level pattern is to tag rows with a security metadata column and enforce it via the query-time filter API on every call.B. Incorrect. Incorrect. Random selection provides no reliable access boundary and could just as easily return the wrong department's data.D. Incorrect. Embeddings capture semantic similarity, not access policy; they cannot reliably or deterministically exclude a department's records.E. Incorrect. (Respuesta correcta: Add a department metadata column to the source Delta table and apply it as a filter in the AI Search query API for every retrieval call)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"12\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"12::c2\",\"questionId\":\"12\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Unity Catalog ACLs, and what is it used for?\",\"back\":\"Unity Catalog ACLs on the index govern who can manage or query the index object as a whole; they do not filter individual rows by a department value.C. (Respuesta correcta: Add a department metadata column to the source Delta table and apply it as a filter in the AI Search query API for every retrieval call)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Unity Catalog ACLs\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"12\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"12::c3\",\"questionId\":\"12\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is CAN, and what is it used for?\",\"back\":\"Broad CAN MANAGE grants increase exposure rather than restrict it, and endpoint-level permissions do not implement row-level filtering. (Respuesta correcta: Add a department metadata column to the source Delta table and apply it as a filter in the AI Search query API for every retrieval call)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CAN\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"12\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"13::m\",\"questionId\":\"13\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SELECT, and what is it used for?\",\"back\":\"$1e\",\"topic\":\"SELECT\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"13\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"14::m\",\"questionId\":\"14\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is The Databricks, and what is it used for?\",\"back\":\"$1f\",\"topic\":\"The Databricks\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-context-engineer-associate\",\"questionId\":\"14\"},\"esDeck\":\"databricks-context-engineer-associate\"},{\"id\":\"14::c2\",\"questionId\":\"14\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Direct Vector Access, and what is it used for?\",\"back\":\"Switching to Direct Vector Access ensures the index reflects the latest data but does not alter
