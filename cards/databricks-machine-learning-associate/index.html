d\":\"6::c2\",\"questionId\":\"6\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa DataFrame?\",\"back\":\"Column order in the incoming DataFrame does not matter to `write_table`; it matches columns by name against the feature table's schema, so this is not the reason the call fails.C. (Respuesta correcta: The DataFrame is missing one of the feature table's primary key columns, and `write_table` requires every primary key column to be present so it can determine which rows to update or insert.)\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"6\"}},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Time series feature tables require the time column to be part of the primary key and declared thro…\\\"?\",\"back\":\"A. Correct. Time series feature tables require the time column to be part of the primary key and declared through `timeseries_columns`, which is what enables point-in-time lookups during training-set creation.B. Incorrect. Treating the timestamp as a plain schema column gives it no special meaning; `create_training_set` has no mechanism to infer time ordering from insertion order alone.C. Incorrect. Omitting the timestamp key removes any way to look up feature values as of a specific point in time, and `merge` mode write behavior does not substitute for that.D. Incorrect. `tags` store descriptive key-value metadata for humans and catalog search; they are not read by the training-set or lookup logic that enforces point-in-time correctness. (Respuesta correcta: Include the timestamp column in `primary_keys` with the entity key, and pass that column to `timeseries_columns` so lookups respect point-in-time correctness.)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"7\"}},{\"id\":\"8::m\",\"questionId\":\"8\",\"part\":\"m\",\"front\":\"¿Para qué se usa UI.B?\",\"back\":\"A. `search_runs` with `order_by` and `max_results` is built to filter and rank runs programmatically, which is exactly what automated pipelines need to select a best run without a human browsing the UI.B. `search_runs` only queries and returns run metadata; it never deletes runs that happen to fall outside the requested result window.C. (Respuesta correcta: It lets code retrieve a ranked, limited set of runs by metric value, enabling automated best-run selection without manual inspection in the UI.)\",\"topic\":\"UI.B\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"8\"}},{\"id\":\"8::c2\",\"questionId\":\"8\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa API?\",\"back\":\"The Tracking UI keeps displaying metrics, parameters, and artifacts for an experiment regardless of whether the client API has also been used to query the same runs.D. (Respuesta correcta: It lets code retrieve a ranked, limited set of runs by metric value, enabling automated best-run selection without manual inspection in the UI.)\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"8\"}},{\"id\":\"9::m\",\"questionId\":\"9\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa USE?\",\"back\":\"A. Unity Catalog privileges are separate from workspace admin rights, so registering a model requires `USE CATALOG` and `USE SCHEMA` to traverse the namespace plus `CREATE MODEL` on the schema to create the object itself. Missing any of these three produces a permission-denied error regardless of workspace-level roles.B. Metastore admin is a broad administrative role for managing the metastore itself; it is not the minimal privilege intended for day-to-day model registration and is not required just to create a registered model in a schema the user should already have scoped access to.C. (Respuesta correcta: Grant `CREATE MODEL` on the `ops.ml.models` schema in addition to `USE CATALOG` and `USE SCHEMA`, since workspace admin rights do not carry Unity Catalog object privileges.)\",\"topic\":\"USE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"9\"}},{\"id\":\"9::c3\",\"questionId\":\"9\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa MODIFY?\",\"back\":\"Catalog-level `MODIFY` alone does not substitute for the schema-level `CREATE MODEL` privilege needed to create a new registered model object inside a specific schema; the schema-level grant is still required. (Respuesta correcta: Grant `CREATE MODEL` on the `ops.ml.models` schema in addition to `USE CATALOG` and `USE SCHEMA`, since workspace admin rights do not carry Unity Catalog object privileges.)\",\"topic\":\"MODIFY\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"9\"}},{\"id\":\"10::m\",\"questionId\":\"10\",\"part\":\"m\",\"front\":\"¿Para qué se usa UI.D?\",\"back\":\"A. This is incorrect because parameters are meant for static configuration values, are not designed to accept repeated updates to the same key across a run, and are not charted as a time series in the UI.B. This is incorrect because uploaded files are stored as opaque artifacts; MLflow does not parse artifact contents and turn them into interactive metric charts.C. This is correct because passing an explicit `step` value on each call is exactly how MLflow builds a per-step metric history for a key, which the UI then renders as a trend line across epochs.D. This is incorrect because omitting `step` logs every call at the default step of 0, so repeated calls create multiple points stacked at the same step rather than a clean per-epoch trend. (Respuesta correcta: Call `mlflow.log_metric(\\\"val_accuracy\\\", value, step=epoch)` once per epoch, passing the epoch number as `step` so the metric history builds one point per epoch.)\",\"topic\":\"UI.D\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"10\"}},{\"id\":\"11::m\",\"questionId\":\"11\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa SQL?\",\"back\":\"A. The MLflow UI's search box accepts a SQL-like filter syntax referencing `params.\u003cname\u003e` and `metrics.\u003cname\u003e` combined with comparison operators and `and`, so this exact expression narrows the run table to runs matching both conditions at once.B. Column-header sorting only reorders visible rows by one field at a time; it provides no way to jointly satisfy a parameter equality condition and a metric threshold without manually scanning every row.C. (Respuesta correcta: Type a filter expression such as `params.model_type = \\\"random_forest\\\" and metrics.f1_score \u003e 0.85` into the run table's search box, which MLflow parses and applies directly against the logged parameters and metrics.)\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"11\"}},{\"id\":\"11::c3\",\"questionId\":\"11\",\"part\":\"c3\",\"front\":\"¿Qué es / para qué se usa The Parallel Coordinates Plot?\",\"back\":\"The Parallel Coordinates Plot can visually emphasize a metric range along one axis, but it does not apply a `model_type` equality condition, so it would not isolate runs matching both criteria. (Respuesta correcta: Type a filter expression such as `params.model_type = \\\"random_forest\\\" and metrics.f1_score \u003e 0.85` into the run table's search box, which MLflow parses and applies directly against the logged parameters and metrics.)\",\"topic\":\"The Parallel Coordinates Plot\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"11\"}},{\"id\":\"12::m\",\"questionId\":\"12\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa Unity Catalog?\",\"back\":\"A. `delete_registered_model_tag` removes the key entirely from the registered model's tag set, which matches the requirement to drop the `status` key rather than merely blank out its value.B. Setting the value to an empty string still leaves the `status` key present with an empty value, so it would still show up in tag listings and tag-based searches instead of disappearing.C. This targets a tag on a specific model version rather than the registered model, so it would not touch the model-level `status` tag the team wants removed.D. Unity Catalog's Model Registry does not use the legacy workspace-registry stage concept, and even if a stage transition existed here, changing a version's stage would not delete a tag on the registered model. (Respuesta correcta: `client.delete_registered_model_tag(name=\\\"pricing_model\\\", key=\\\"status\\\")` to remove the key from the registered model.)\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"12\"},\"related\":22},{\"id\":\"13::m\",\"questionId\":\"13\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa Spark DataFrames?\",\"back\":\"$10\",\"topic\":\"Spark DataFrames\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"13\"}},{\"id\":\"14::m\",\"questionId\":\"14\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa IQR?\",\"back\":\"A. The fence formula continues to use `Q1`, `Q3`, and the IQR regardless of the value of `k`; changing `k` never switches the calculation to use the dataset's minimum or maximum instead.B. The multiplier `k` is multiplied directly against the IQR inside the fence formula, so changing it from `1.5` to `3` directly changes where the upper and lower bounds fall.C. A larger multiplier pushes both fences further away from the quartiles, so fewer, more extreme points fall outside them; `k=1.5` is the common threshold for moderate outliers and `k=3` for extreme ones.D. Increasing the multiplier widens the fences rather than narrowing them, since `k*IQR` grows as `k` grows, so more values fall inside the boundary and fewer get flagged, not more. (Respuesta correcta: Raising `k` to `3` widens the fences away from the quartiles, so fewer, more extreme values beyond that boundary get flagged, matching 'extreme' outliers versus the broader set at `1.5`.)\",\"topic\":\"IQR\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"14\"}},{\"id\":\"15::m\",\"questionId\":\"15\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa ANOVA?\",\"back\":\"A. This test compares observed versus expected frequency counts between two categorical features and does not apply to continuous numeric features.C. ANOVA compares the mean of a continuous variable across groups defined by a categorical variable; it does not measure the relationship between two continuous features.D. This technique converts categorical labels into binary indicator columns and is unrelated to measuring the relationship between two continuous features. (Respuesta correcta: Pearson correlation coefficient)\",\"topic\":\"ANOVA\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"15\"}},{\"id\":\"15::c2\",\"questionId\":\"15\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa The Pearson?\",\"back\":\"The Pearson correlation coefficient is the standard statistic for measuring the strength and direction of a linear relationship between two continuous features.B.\",\"topic\":\"The Pearson\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"15\"}},{\"id\":\"16::m\",\"questionId\":\"16\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa IQR?\",\"back\":\"A. A box plot is built specifically from the median and the interquartile range, and it plots any value beyond 1.5 times the IQR from the box as an individual outlier point, matching every requirement in the scenario.B. A histogram summarizes the count of values per bin, which shows overall shape but does not compute or draw a median line or explicitly flag individual outlier points.C. A bar chart of a continuous column like delivery time treats each raw value as a separate category and provides no summary statistic such as a median or interquartile range.D. A pie chart shows proportional shares of a total and has no mechanism for representing quartiles, a median, or outlier points along a numeric range. (Respuesta correcta: A box plot of `delivery_time_hours`, drawing the median line, the interquartile box, and points beyond the whiskers as outliers.)\",\"topic\":\"IQR\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"16\"},\"related\":26},{\"id\":\"17::m\",\"questionId\":\"17\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Mean imputation trivially preserves the column average by construction, but the goal of imputation is a pla…\\\"?\",\"back\":\"A. Preserving the exact mean is a side effect of mean imputation, not the actual goal; the relevant question is whether the imputed value is representative, and skew undermines that for the mean.B. Annual income is a continuous numeric feature, so the mode is not the natural choice; this claim also does not engage with the colleague's argument about the mean at all.C. A median is well defined for any ordered numeric distribution including a right-skewed one, so this claim about the median being unavailable is factually incorrect.D. Mean imputation trivially preserves the column average by construction, but the goal of imputation is a plausible value per household, and the mean is skewed high by the top earners, misrepresenting most missing rows. (Respuesta correcta: The argument is flawed, because keeping the column average unchanged is not the same as filling in a typical, realistic income for most missing households.)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"17\"}},{\"id\":\"18::m\",\"questionId\":\"18\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. `pyspark.ml.feature.Imputer` defaults to the mean strategy when `strategy` is not passed, so this code sile…\\\"?\",\"back\":\"$11\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"18\"}},{\"id\":\"19::m\",\"questionId\":\"19\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa ValueError?\",\"back\":\"A. Correct — with `handle_unknown='ignore'` set at fit time, any category not seen during training is encoded as all zeros across that feature's one-hot columns at transform time, letting the pipeline continue scoring instead of raising an error, though the model then has no signal from that feature for this row.B. Incorrect — `handle_unknown='ignore'` specifically changes behavior at `.transform()` time; the default `handle_unknown='error'` is what raises a `ValueError` on unseen categories, so describing the parameter as fit-time-only reverses its actual purpose.C. Incorrect — `OneHotEncoder` has no built-in logic for substituting the most frequent category for unseen values; that behavior would require a separate imputation step, and `handle_unknown='ignore'` produces all zeros, not a substituted category. (Respuesta correcta: The encoder outputs a row of all zeros for `subscription_tier`, so the model scores the request using no information from that feature rather than raising an error.)\",\"topic\":\"ValueError\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"19\"}},{\"id\":\"19::c2\",\"questionId\":\"19\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa OneHotEncoder?\",\"back\":\"Incorrect — a fitted `OneHotEncoder` has a fixed set of output columns determined during `.fit()`; it cannot expand the number of columns at transform time, since that would change the input shape the downstream model was trained to expect.D. (Respuesta correcta: The encoder outputs a row of all zeros for `subscription_tier`, so the model scores the request using no information from that feature rather than raising an error.)\",\"topic\":\"OneHotEncoder\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"19\"}},{\"id\":\"20::m\",\"questionId\":\"20\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. Because tree ensembles choose split thresholds on individual columns rather than forming a linear combinati…\\\"?\",\"back\":\"$12\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"20\"}},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa PCA?\",\"back\":\"$13\",\"topic\":\"PCA\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"21\"}},{\"id\":\"21::c2\",\"questionId\":\"21\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa LogisticRegression?\",\"back\":\"When the last step is a classifier like `LogisticRegression`, the pipeline exposes `predict` instead, and calling `.transform()` on it raises an `AttributeError`.C. (Respuesta correcta: Every step before the last one must implement `fit` and `transform` so its output can feed the next step, while only the final step is allowed to be a plain estimator like a classifier.)\",\"topic\":\"LogisticRegression\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"21\"}},{\"id\":\"22::m\",\"questionId\":\"22\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. This is correct because linear regression is designed for continuous targets with linear predictor relation…\\\"?\",\"back\":\"$14\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"22\"}},{\"id\":\"23::m\",\"questionId\":\"23\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa SMOTE?\",\"back\":\"A. SMOTE generates a new point along the line segment between a minority-class sample and one of its k-nearest minority-class neighbors, producing genuinely new feature values rather than exact copies. This interpolation is the defining mechanism of the technique.B. Verbatim duplication describes random oversampling, not SMOTE; SMOTE is specifically designed to avoid exact duplicates by synthesizing new feature vectors instead of repeating rows.C. Removing majority-class rows near the boundary describes an undersampling strategy such as Tomek links or edited nearest neighbors, not SMOTE, which only adds minority-class rows.D. Adjusting the loss function without changing the dataset describes class weighting, a separate mitigation technique that leaves the row count untouched, unlike SMOTE. (Respuesta correcta: It creates new synthetic rows by interpolating between a minority-class sample and one of its nearest minority neighbors.)\",\"topic\":\"SMOTE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"23\"}},{\"id\":\"24::m\",\"questionId\":\"24\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. This is correct: `tpe.suggest` is Hyperopt's Bayesian-style algorithm, and it explicitly conditions each ne…\\\"?\",\"back\":\"A. `Trials()` is the object passed to `fmin` to record evaluation history for later inspection; it is not a valid value for `algo` and does not itself decide how the next candidate is chosen.B. This is correct: `tpe.suggest` is Hyperopt's Bayesian-style algorithm, and it explicitly conditions each new candidate on the distribution of hyperparameter values that scored well versus poorly in earlier trials.C. `rand.suggest` implements plain random search, drawing each trial's candidate independently of every prior trial, which is the opposite of the adaptive, history-informed behavior being asked for.D. `hp.choice` is used inside the search-space definition to declare a categorical parameter; it plays no role in the `algo` argument and does not determine how successive candidates are proposed. (Respuesta correcta: `algo=tpe.suggest`, which implements the Tree-structured Parzen Estimator and models prior trial outcomes to propose the next, more promising candidate.)\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"24\"}},{\"id\":\"25::m\",\"questionId\":\"25\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa GridSearchCV?\",\"back\":\"$15\",\"topic\":\"GridSearchCV\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"25\"}},{\"id\":\"26::m\",\"questionId\":\"26\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa StratifiedKFold?\",\"back\":\"$16\",\"topic\":\"StratifiedKFold\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"26\"}},{\"id\":\"27::m\",\"questionId\":\"27\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa StratifiedKFold?\",\"back\":\"A. `StratifiedKFold` builds each fold so the proportion of each class matches the proportion in the full dataset, which keeps the rare positive class represented in every fold's train and test split.B.\",\"topic\":\"StratifiedKFold\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"27\"},\"related\":38},{\"id\":\"27::c2\",\"questionId\":\"27\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa ShuffleSplit?\",\"back\":\"Plain `KFold` splits rows into folds without regard to class labels, so with a 95/5 imbalance it can easily produce folds where the minority class is underrepresented or missing entirely.C. `ShuffleSplit` generates random train/test partitions with possible overlap between iterations and does not account for class proportions, so it offers no built-in guarantee of preserving the 95/5 ratio.D. `LeaveOneOut` holds out a single row per iteration and trains on the rest, which is computationally expensive on larger data and does nothing to balance class proportions within folds. (Respuesta correcta: StratifiedKFold)\",\"topic\":\"ShuffleSplit\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"27\"}},{\"id\":\"28::m\",\"questionId\":\"28\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. R-squared compares the model's squared error against the squared error of always predicting the mean; a neg…\\\"?\",\"back\":\"$17\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"28\"}},{\"id\":\"29::m\",\"questionId\":\"29\",\"part\":\"m\",\"front\":\"¿Completa el concepto: \\\"A. A single-neighbor classifier draws a highly irregular decision boundary that hugs each individual training …\\\"?\",\"back\":\"$18\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"29\"}},{\"id\":\"30::m\",\"questionId\":\"30\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa MAE?\",\"back\":\"A. This is correct: 0.18 is an average absolute difference in log-space, which does not translate linearly into a dollar or unit difference; exponentiating predictions and actuals first is needed before the error can be described in the target's real-world units.B. MAE is a perfectly valid calculation on log-transformed arrays; the numeric computation itself succeeds, the problem is only that the resulting figure is in the wrong units for the business audience.C. MAE computed in log space and MAE computed in original units are generally different numbers, especially for right-skewed targets, because the log transform compresses large values disproportionately.D. A small MAE value like 0.18 is exactly what is expected when errors are measured on a compressed log scale, so its size alone does not indicate a wrong target column was used. (Respuesta correcta: An MAE of 0.18 is measured in log-transformed units, not the target's original units, so it does not describe how far off predictions are in real terms.)\",\"topic\":\"MAE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"30\"}},{\"id\":\"31::m\",\"questionId\":\"31\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa REST?\",\"back\":\"A. A nightly batch job scores transactions long after they occur, so it cannot meet a requirement that each transaction be scored the moment it arrives.B. A streaming pipeline flow scores records as micro-batches land in a table, which adds pipeline trigger and table-commit latency that is far larger than the required per-transaction response time.C. Manually rerunning a notebook cell depends on an analyst being available and cannot deliver a consistent, automated response within a fixed millisecond budget for every transaction.D. A Model Serving endpoint keeps the model loaded and ready to respond to individual REST calls with single-digit-to-double-digit millisecond overhead, which matches a per-transaction, sub-50ms latency requirement. (Respuesta correcta: Deploy the registered model to a Model Serving endpoint as a served entity, then have the transaction service call the endpoint's REST API synchronously for each incoming transaction.)\",\"topic\":\"REST\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"31\"}},{\"id\":\"32::m\",\"questionId\":\"32\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa UDF?\",\"back\":\"A. It also removes any parallelism, since one `.predict()` call runs sequentially on the driver.B. Wrapping the registered model as a pandas UDF with `mlflow.pyfunc.spark_udf` and applying it through `withColumn` lets each executor load the model once and score its own partition in parallel, which is the standard pattern for distributed batch inference over a large Delta table.C. (Respuesta correcta: Load the model with `mlflow.pyfunc.spark_udf(spark, \\\"models:/fraud_detector/Production\\\")` and add predictions to the Spark DataFrame via `withColumn`, letting executors score partitions in parallel.)\",\"topic\":\"UDF\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"32\"}},{\"id\":\"33::m\",\"questionId\":\"33\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa GPU?\",\"back\":\"A. Setting `workload_type` to a GPU option moves inference onto accelerator hardware, which is the configuration change that addresses latency for a compute-heavy deep learning model that CPU serving cannot meet.B. `entity_version` identifies which trained model artifact is served; incrementing it does not change or upgrade the underlying compute hardware assigned to the served entity.C. Adding more CPU replicas increases throughput for concurrent requests but does not reduce the per-request inference time the way GPU acceleration does for a compute-heavy model. (Respuesta correcta: Change the served entity's `workload_type` to a GPU option such as `GPU_SMALL` or `GPU_MEDIUM` so inference runs on accelerator hardware sized for the model.)\",\"topic\":\"GPU\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"33\"}},{\"id\":\"33::c2\",\"questionId\":\"33\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa CPU?\",\"back\":\"Keeping CPU compute warm avoids cold-start delay but does not add the parallel compute throughput a GPU provides, so it does not resolve latency caused by an under-powered CPU workload type.D. (Respuesta correcta: Change the served entity's `workload_type` to a GPU option such as `GPU_SMALL` or `GPU_MEDIUM` so inference runs on accelerator hardware sized for the model.)\",\"topic\":\"CPU\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"33\"}},{\"id\":\"34::m\",\"questionId\":\"34\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa AUTO?\",\"back\":\"A. This is correct: a flow reads from a source, applies its own transformation, and writes to its own target, so an AUTO CDC merge flow and a model-scoring flow can coexist as independent flows within one pipeline.B. Flow execution order is derived from the dependency graph between datasets, not a fixed rule that change-data-capture flows always run last regardless of what they depend on.D. (Respuesta correcta: Each flow independently reads its own source, applies its own transformation, and writes to its own target dataset, so the CDC merge flow and the model-scoring flow can both run in the same pipeline.)\",\"topic\":\"AUTO\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"34\"}},{\"id\":\"34::c2\",\"questionId\":\"34\",\"part\":\"c2\",\"front\":\"¿Qué es / para qué se usa CDC?\",\"back\":\"A pipeline is not limited to a single streaming table target; each flow can write to its own distinct target dataset, so unioning the CDC output with scored predictions is not required.C. (Respuesta correcta: Each flow independently reads its own source, applies its own transformation, and writes to its own target dataset, so the CDC merge flow and the model-scoring flow can both run in the same pipeline.)\",\"topic\":\"CDC\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"34\"}},{\"id\":\"35::m\",\"questionId\":\"35\",\"part\":\"m\",\"front\":\"¿Qué es / para qué se usa URL?\",\"back\":\"A. Because the served entities and their traffic split live inside one endpoint's configuration, raising the canary's share from 5% to 25% to 50% only requires updating that endpoint's traffic_config, so calling applications never need to change the URL they invoke at any stage.B. Databricks does not automatically roll back traffic percentages based on observed latency changes; adjusting or reverting the split in response to performance is a manual decision the team makes using metrics from tools like inference tables.C. Splitting traffic routes each request to one model or the other; it does not make the two different model versions produce identical outputs, since they are distinct trained artifacts making independent predictions. (Respuesta correcta: Client applications keep calling the same endpoint URL throughout the rollout, so each traffic_config update changes routing behind the scenes without any client redeployment.)\",\"topic\":\"URL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"35\"}}],\"cardCount\":52},\"deckEn\":{\"quizId\":\"databricks-machine-learning-associate\",\"quizTitle\":\"Databricks Certified Machine Learning Associate\",\"cardCount\":52,\"cards\":[{\"id\":\"1::m\",\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Databricks Runtime, and what is it used for?\",\"back\":\"A. Databricks Runtime for Machine Learning does not silently auto-upgrade libraries on restart; a given runtime release keeps a fixed library set, which is what makes it reproducible rather than a moving target.B. Saving notebook output to Delta tables preserves data, not the software environment; it does not record or guarantee which library versions produced that output on a separate run.D. MLflow autologging can record library versions as part of a model's metadata, but it does not eliminate the need to track versions during training or reconstruct an environment on its own without a pinned runtime to install against. (Respuesta correcta: Each Databricks Runtime for Machine Learning release pins a tested, documented set of library versions, so re-running a job on the same runtime version reproduces the same dependency set.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Databricks Runtime\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"1\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"1::c2\",\"questionId\":\"1\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Each Databricks Runtime, and what is it used for?\",\"back\":\"Each Databricks Runtime for Machine Learning release ships a specific, tested, and documented set of library versions, so pinning a job to that runtime version reproduces the same scikit-learn, XGBoost, and dependency versions on a later run.C.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Each Databricks Runtime\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"1\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"2::m\",\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is CSV, and what is it used for?\",\"back\":\"A. Trial results are not stashed in an ephemeral local CSV on the driver — they are written to MLflow, which persists independently of the cluster's lifecycle.D. AutoML does not communicate results only through a one-time emailed summary; the run data for every trial stays queryable and reopenable in MLflow after the job finishes. (Respuesta correcta: AutoML logs every trial as an MLflow run, capturing parameters, metrics, and artifacts so the manager can compare all trials, not only the best one, in the MLflow UI.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CSV\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"2\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"2::c2\",\"questionId\":\"2\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Every AutoML, and what is it used for?\",\"back\":\"Every AutoML trial is tracked as its own MLflow run with parameters, metrics, and artifacts, so the manager can open the MLflow experiment and compare all trials side by side, not just the one AutoML selected as best.B. (Respuesta correcta: AutoML logs every trial as an MLflow run, capturing parameters, metrics, and artifacts so the manager can compare all trials, not only the best one, in the MLflow UI.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Every AutoML\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"2\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"2::c3\",\"questionId\":\"2\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is AutoML, and what is it used for?\",\"back\":\"AutoML does not discard the non-winning trials; each one remains logged as an MLflow run with its own parameters and metrics available for later comparison.C. (Respuesta correcta: AutoML logs every trial as an MLflow run, capturing parameters, metrics, and artifacts so the manager can compare all trials, not only the best one, in the MLflow UI.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"AutoML\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"2\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"3::m\",\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is ARIMA, and what is it used for?\",\"back\":\"A. Prophet and ARIMA are the libraries AutoML uses specifically for forecasting experiments, not classification; classification trials draw from a different set of algorithm libraries. (Respuesta correcta: scikit-learn, XGBoost, and LightGBM implementations of classification algorithms tried during trials.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ARIMA\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"3\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"3::c3\",\"questionId\":\"3\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is Spark MLlib, and what is it used for?\",\"back\":\"AutoML does not train its trials using Spark MLlib's distributed algorithm implementations; it distributes trials of single-node scikit-learn, XGBoost, and LightGBM models across the cluster instead.C.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Spark MLlib\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"3\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"3::c4\",\"questionId\":\"3\",\"part\":\"c4\",\"lang\":\"en\",\"front\":\"What is Databricks AutoML, and what is it used for?\",\"back\":\"Databricks AutoML evaluates classification and regression trials using open source algorithms from scikit-learn, XGBoost, and LightGBM, training and comparing multiple model types from these libraries before ranking the trials.D.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Databricks AutoML\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"3\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"4::m\",\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. This matches Databricks' code-first promotion guidance: promoting the pipeline through environments and ret…\\\"?\",\"back\":\"$19\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"4\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"5::m\",\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is DBFS, and what is it used for?\",\"back\":\"$1a\",\"topic\":\"DBFS\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"5\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"5::c2\",\"questionId\":\"5\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is Unity Catalog, and what is it used for?\",\"back\":\"Unity Catalog objects are scoped to the metastore, not to a single workspace, so any workspace attached to that metastore can query the table directly by its three-level name. (Respuesta correcta: Because the feature table lives in Unity Catalog, it is accessible to every workspace attached to the same metastore, so the marketing team can read and reuse it through a normal `catalog.schema.table` reference without copying data.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"5\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"5::c3\",\"questionId\":\"5\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is FeatureStoreClient, and what is it used for?\",\"back\":\"The legacy `FeatureStoreClient` is workspace-scoped and does not propagate schemas into other workspaces' model registries; registry entries are not how table read access is granted. (Respuesta correcta: Because the feature table lives in Unity Catalog, it is accessible to every workspace attached to the same metastore, so the marketing team can read and reuse it through a normal `catalog.schema.table` reference without copying data.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"FeatureStoreClient\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"5\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"6::m\",\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is API.B used for?\",\"back\":\"A. This claim about merge mode is invented: merge mode works the same way regardless of whether the primary key is a single column or a composite key, so restricting composite-key tables to overwrite mode is not an actual constraint of the API.B. Publishing to an online store does not place a lock on offline writes to the feature table, so a prior online sync would not block this `write_table` call.D. Because the feature table's primary key is `(loan_id, as_of_date)`, every write must supply both columns so the client can identify which existing rows to update and which new rows to insert; omitting `as_of_date` leaves the operation unable to resolve the primary key, which is why validation fails. (Respuesta correcta: The DataFrame is missing one of the feature table's primary key columns, and `write_table` requires every primary key column to be present so it can determine which rows to update or insert.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"API.B\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"6\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"6::c2\",\"questionId\":\"6\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is DataFrame, and what is it used for?\",\"back\":\"Column order in the incoming DataFrame does not matter to `write_table`; it matches columns by name against the feature table's schema, so this is not the reason the call fails.C. (Respuesta correcta: The DataFrame is missing one of the feature table's primary key columns, and `write_table` requires every primary key column to be present so it can determine which rows to update or insert.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"DataFrame\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"6\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"7::m\",\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Correct. Time series feature tables require the time column to be part of the primary key and declared thro…\\\"?\",\"back\":\"$1b\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"7\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"8::m\",\"questionId\":\"8\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is UI.B used for?\",\"back\":\"A. `search_runs` with `order_by` and `max_results` is built to filter and rank runs programmatically, which is exactly what automated pipelines need to select a best run without a human browsing the UI.B. `search_runs` only queries and returns run metadata; it never deletes runs that happen to fall outside the requested result window.C. (Respuesta correcta: It lets code retrieve a ranked, limited set of runs by metric value, enabling automated best-run selection without manual inspection in the UI.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"UI.B\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"8\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"8::c2\",\"questionId\":\"8\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is API, and what is it used for?\",\"back\":\"The Tracking UI keeps displaying metrics, parameters, and artifacts for an experiment regardless of whether the client API has also been used to query the same runs.D. (Respuesta correcta: It lets code retrieve a ranked, limited set of runs by metric value, enabling automated best-run selection without manual inspection in the UI.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"API\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"8\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"9::m\",\"questionId\":\"9\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is USE, and what is it used for?\",\"back\":\"A. Unity Catalog privileges are separate from workspace admin rights, so registering a model requires `USE CATALOG` and `USE SCHEMA` to traverse the namespace plus `CREATE MODEL` on the schema to create the object itself. Missing any of these three produces a permission-denied error regardless of workspace-level roles.B. Metastore admin is a broad administrative role for managing the metastore itself; it is not the minimal privilege intended for day-to-day model registration and is not required just to create a registered model in a schema the user should already have scoped access to.C. (Respuesta correcta: Grant `CREATE MODEL` on the `ops.ml.models` schema in addition to `USE CATALOG` and `USE SCHEMA`, since workspace admin rights do not carry Unity Catalog object privileges.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"USE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"9\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"9::c3\",\"questionId\":\"9\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is MODIFY, and what is it used for?\",\"back\":\"Catalog-level `MODIFY` alone does not substitute for the schema-level `CREATE MODEL` privilege needed to create a new registered model object inside a specific schema; the schema-level grant is still required. (Respuesta correcta: Grant `CREATE MODEL` on the `ops.ml.models` schema in addition to `USE CATALOG` and `USE SCHEMA`, since workspace admin rights do not carry Unity Catalog object privileges.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"MODIFY\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"9\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"10::m\",\"questionId\":\"10\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is UI.D used for?\",\"back\":\"$1c\",\"topic\":\"UI.D\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"10\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"11::m\",\"questionId\":\"11\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SQL, and what is it used for?\",\"back\":\"A. The MLflow UI's search box accepts a SQL-like filter syntax referencing `params.\u003cname\u003e` and `metrics.\u003cname\u003e` combined with comparison operators and `and`, so this exact expression narrows the run table to runs matching both conditions at once.B. Column-header sorting only reorders visible rows by one field at a time; it provides no way to jointly satisfy a parameter equality condition and a metric threshold without manually scanning every row.C. (Respuesta correcta: Type a filter expression such as `params.model_type = \\\"random_forest\\\" and metrics.f1_score \u003e 0.85` into the run table's search box, which MLflow parses and applies directly against the logged parameters and metrics.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"SQL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"11\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"11::c3\",\"questionId\":\"11\",\"part\":\"c3\",\"lang\":\"en\",\"front\":\"What is The Parallel Coordinates Plot, and what is it used for?\",\"back\":\"The Parallel Coordinates Plot can visually emphasize a metric range along one axis, but it does not apply a `model_type` equality condition, so it would not isolate runs matching both criteria. (Respuesta correcta: Type a filter expression such as `params.model_type = \\\"random_forest\\\" and metrics.f1_score \u003e 0.85` into the run table's search box, which MLflow parses and applies directly against the logged parameters and metrics.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"The Parallel Coordinates Plot\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"11\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"12::m\",\"questionId\":\"12\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Unity Catalog, and what is it used for?\",\"back\":\"A. `delete_registered_model_tag` removes the key entirely from the registered model's tag set, which matches the requirement to drop the `status` key rather than merely blank out its value.B. Setting the value to an empty string still leaves the `status` key present with an empty value, so it would still show up in tag listings and tag-based searches instead of disappearing.C. This targets a tag on a specific model version rather than the registered model, so it would not touch the model-level `status` tag the team wants removed.D. Unity Catalog's Model Registry does not use the legacy workspace-registry stage concept, and even if a stage transition existed here, changing a version's stage would not delete a tag on the registered model. (Respuesta correcta: `client.delete_registered_model_tag(name=\\\"pricing_model\\\", key=\\\"status\\\")` to remove the key from the registered model.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"Unity Catalog\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"12\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"13::m\",\"questionId\":\"13\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Spark DataFrames, and what is it used for?\",\"back\":\"$1d\",\"topic\":\"Spark DataFrames\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"13\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"14::m\",\"questionId\":\"14\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is IQR, and what is it used for?\",\"back\":\"$1e\",\"topic\":\"IQR\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"14\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"15::m\",\"questionId\":\"15\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is ANOVA, and what is it used for?\",\"back\":\"A. This test compares observed versus expected frequency counts between two categorical features and does not apply to continuous numeric features.C. ANOVA compares the mean of a continuous variable across groups defined by a categorical variable; it does not measure the relationship between two continuous features.D. This technique converts categorical labels into binary indicator columns and is unrelated to measuring the relationship between two continuous features. (Respuesta correcta: Pearson correlation coefficient)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ANOVA\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"15\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"15::c2\",\"questionId\":\"15\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is The Pearson, and what is it used for?\",\"back\":\"The Pearson correlation coefficient is the standard statistic for measuring the strength and direction of a linear relationship between two continuous features.B.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"The Pearson\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"15\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"16::m\",\"questionId\":\"16\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is IQR, and what is it used for?\",\"back\":\"A. A box plot is built specifically from the median and the interquartile range, and it plots any value beyond 1.5 times the IQR from the box as an individual outlier point, matching every requirement in the scenario.B. A histogram summarizes the count of values per bin, which shows overall shape but does not compute or draw a median line or explicitly flag individual outlier points.C. A bar chart of a continuous column like delivery time treats each raw value as a separate category and provides no summary statistic such as a median or interquartile range.D. A pie chart shows proportional shares of a total and has no mechanism for representing quartiles, a median, or outlier points along a numeric range. (Respuesta correcta: A box plot of `delivery_time_hours`, drawing the median line, the interquartile box, and points beyond the whiskers as outliers.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"IQR\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"16\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"17::m\",\"questionId\":\"17\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. Mean imputation trivially preserves the column average by construction, but the goal of ree ensembles choose split thresholds on individual columns rather than forming a linear combinati…\\\"?\",\"back\":\"$22\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"20\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"21::m\",\"questionId\":\"21\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is PCA, and what is it used for?\",\"back\":\"$23\",\"topic\":\"PCA\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"21\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"21::c2\",\"questionId\":\"21\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is LogisticRegression, and what is it used for?\",\"back\":\"When the last step is a classifier like `LogisticRegression`, the pipeline exposes `predict` instead, and calling `.transform()` on it raises an `AttributeError`.C. (Respuesta correcta: Every step before the last one must implement `fit` and `transform` so its output can feed the next step, while only the final step is allowed to be a plain estimator like a classifier.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"LogisticRegression\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"21\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"22::m\",\"questionId\":\"22\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. This is correct because linear regression is designed for continuous targets with linear predictor relation…\\\"?\",\"back\":\"$24\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"22\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"23::m\",\"questionId\":\"23\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is SMOTE, and what is it used for?\",\"back\":\"$25\",\"topic\":\"SMOTE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"23\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"24::m\",\"questionId\":\"24\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. This is correct: `tpe.suggest` is Hyperopt's Bayesian-style algorithm, and it explicitly conditions each ne…\\\"?\",\"back\":\"$26\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"24\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"25::m\",\"questionId\":\"25\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is GridSearchCV, and what is it used for?\",\"back\":\"$27\",\"topic\":\"GridSearchCV\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"25\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"26::m\",\"questionId\":\"26\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is StratifiedKFold, and what is it used for?\",\"back\":\"$28\",\"topic\":\"StratifiedKFold\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"26\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"27::m\",\"questionId\":\"27\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is StratifiedKFold, and what is it used for?\",\"back\":\"A. `StratifiedKFold` builds each fold so the proportion of each class matches the proportion in the full dataset, which keeps the rare positive class represented in every fold's train and test split.B.\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"StratifiedKFold\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"27\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"27::c2\",\"questionId\":\"27\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is ShuffleSplit, and what is it used for?\",\"back\":\"Plain `KFold` splits rows into folds without regard to class labels, so with a 95/5 imbalance it can easily produce folds where the minority class is underrepresented or missing entirely.C. `ShuffleSplit` generates random train/test partitions with possible overlap between iterations and does not account for class proportions, so it offers no built-in guarantee of preserving the 95/5 ratio.D. `LeaveOneOut` holds out a single row per iteration and trains on the rest, which is computationally expensive on larger data and does nothing to balance class proportions within folds. (Respuesta correcta: StratifiedKFold)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"ShuffleSplit\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"27\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"28::m\",\"questionId\":\"28\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. R-squared compares the model's squared error against the squared error of always predicting the mean; a neg…\\\"?\",\"back\":\"$29\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"28\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"29::m\",\"questionId\":\"29\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"¿Completa el concepto: \\\"A. A single-neighbor classifier draws a highly irregular decision boundary that hugs each individual training …\\\"?\",\"back\":\"$2a\",\"topic\":\"\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"29\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"30::m\",\"questionId\":\"30\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is MAE, and what is it used for?\",\"back\":\"$2b\",\"topic\":\"MAE\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"30\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"31::m\",\"questionId\":\"31\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is REST, and what is it used for?\",\"back\":\"$2c\",\"topic\":\"REST\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"31\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"32::m\",\"questionId\":\"32\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is UDF, and what is it used for?\",\"back\":\"A. It also removes any parallelism, since one `.predict()` call runs sequentially on the driver.B. Wrapping the registered model as a pandas UDF with `mlflow.pyfunc.spark_udf` and applying it through `withColumn` lets each executor load the model once and score its own partition in parallel, which is the standard pattern for distributed batch inference over a large Delta table.C. (Respuesta correcta: Load the model with `mlflow.pyfunc.spark_udf(spark, \\\"models:/fraud_detector/Production\\\")` and add predictions to the Spark DataFrame via `withColumn`, letting executors score partitions in parallel.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"UDF\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"32\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"33::m\",\"questionId\":\"33\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is GPU, and what is it used for?\",\"back\":\"A. Setting `workload_type` to a GPU option moves inference onto accelerator hardware, which is the configuration change that addresses latency for a compute-heavy deep learning model that CPU serving cannot meet.B. `entity_version` identifies which trained model artifact is served; incrementing it does not change or upgrade the underlying compute hardware assigned to the served entity.C. Adding more CPU replicas increases throughput for concurrent requests but does not reduce the per-request inference time the way GPU acceleration does for a compute-heavy model. (Respuesta correcta: Change the served entity's `workload_type` to a GPU option such as `GPU_SMALL` or `GPU_MEDIUM` so inference runs on accelerator hardware sized for the model.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"GPU\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"33\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"33::c2\",\"questionId\":\"33\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is CPU, and what is it used for?\",\"back\":\"Keeping CPU compute warm avoids cold-start delay but does not add the parallel compute throughput a GPU provides, so it does not resolve latency caused by an under-powered CPU workload type.D. (Respuesta correcta: Change the served entity's `workload_type` to a GPU option such as `GPU_SMALL` or `GPU_MEDIUM` so inference runs on accelerator hardware sized for the model.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CPU\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"33\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"34::m\",\"questionId\":\"34\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is AUTO, and what is it used for?\",\"back\":\"A. This is correct: a flow reads from a source, applies its own transformation, and writes to its own target, so an AUTO CDC merge flow and a model-scoring flow can coexist as independent flows within one pipeline.B. Flow execution order is derived from the dependency graph between datasets, not a fixed rule that change-data-capture flows always run last regardless of what they depend on.D. (Respuesta correcta: Each flow independently reads its own source, applies its own transformation, and writes to its own target dataset, so the CDC merge flow and the model-scoring flow can both run in the same pipeline.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"AUTO\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"34\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"34::c2\",\"questionId\":\"34\",\"part\":\"c2\",\"lang\":\"en\",\"front\":\"What is CDC, and what is it used for?\",\"back\":\"A pipeline is not limited to a single streaming table target; each flow can write to its own distinct target dataset, so unioning the CDC output with scored predictions is not required.C. (Respuesta correcta: Each flow independently reads its own source, applies its own transformation, and writes to its own target dataset, so the CDC merge flow and the model-scoring flow can both run in the same pipeline.)\\n\\n[ES source card — English curation pending: traducir el cuerpo de esta tarjeta en cards-en.json]\",\"topic\":\"CDC\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"34\"},\"esDeck\":\"databricks-machine-learning-associate\"},{\"id\":\"35::m\",\"questionId\":\"35\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is URL, and what is it used for?\",\"back\":\"$2d\",\"topic\":\"URL\",\"origin\":\"explanation\",\"source\":{\"quizId\":\"databricks-machine-learning-associate\",\"questionId\":\"35\"},\"esDeck\":\"databricks-machine-learning-associate\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}]
