,\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cards\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"databricks-dea\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cards\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L5\",null,[\"$\",\"$L6\",null,{\"children\":\"$L7\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"ckv_HE37kM1KP70DKuSb2\",{\"children\":[[\"$\",\"$L8\",null,{\"children\":\"$L9\"}],[\"$\",\"$La\",null,{\"children\":\"$Lb\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$c\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"d:I[7844,[\"47\",\"static/chunks/47-aeb0cb411d578155.js\",\"872\",\"static/chunks/app/cards/%5Bid%5D/page-5f6564a25a07b7da.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Ld\",null,{\"deckEs\":{\"quizId\":\"databricks-dea\",\"quizTitle\":\"Databricks Data Engineer Associate — Practice Exam 1\",\"cardCount\":20,\"description\":\"20 preguntas originales escritas sobre el blueprint oficial del examen (Plataforma, Ingesta, Transformación, Lakeflow Jobs, CI/CD, Monitorización y Gobierno). Cada respuesta explica por qué la correcta lo es y por qué falla cada distractor. No es una copia del banco de Quizlet: ese mazo se usó solo como referencia de temario.\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"front\":\"¿Qué guarda el control plane de Databricks y qué se queda en el data plane del cliente?\",\"back\":\"El control plane guarda metadatos y orquestación; el data plane ejecuta el cómputo y guarda los datos.\\n\\n• Control plane (Databricks): notebooks, definiciones de jobs, configuración de clústeres, metadatos de Unity Catalog, historial de queries.\\n• Data plane (tu cuenta cloud): las VMs de los clústeres y el almacenamiento donde viven las tablas Delta (S3/ADLS/GCS).\\n• Consecuencia práctica: los datos crudos nunca se copian a Databricks, y por eso el modelo pasa auditorías de residencia de datos.\\n\\nPista de examen: «data must stay in our account» → separación de planos, no private link.\\nNo confundir con: serverless, donde Databricks gestiona también el cómputo en su cuenta (útil, pero no es el modelo por defecto).\\n\\nRespuesta del quiz: The control plane manages workspace metadata and orchestration, while data stays in the customer's cloud account in the data plane\",\"topic\":\"Control plane vs data plane\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"1\"},\"tags\":[\"platform\",\"architecture\",\"security\"],\"difficulty\":\"basic\"},{\"questionId\":\"2\",\"part\":\"m\",\"front\":\"¿Cómo ingiere Auto Loader ficheros nuevos y qué hace cuando el esquema cambia?\",\"back\":\"Auto Loader (cloudFiles) descubre ficheros nuevos de forma incremental y, con evolución de esquema, añade las columnas nuevas al destino.\\n\\n• Checkpoint: recuerda qué ficheros ya procesó; no vuelve a leerlos.\\n• Descubrimiento: modo notificación (eventos del bucket, más barato con millones de ficheros) o listado de directorio (más simple, sin permisos extra).\\n• Esquema: puede inferirse (con sample) o declararse; `mergeSchema` / `schemaEvolutionMode` añade campos nuevos.\\n• Datos que no encajan van a la columna `_rescued_data` en vez de perderse.\\n\\nPista de examen: «thousands of files» + «new columns appear» → Auto Loader, no COPY INTO con ALTER manual.\\n\\nRespuesta del quiz: Auto Loader (cloudFiles) with schema evolution enabled, checkpointing each run\",\"topic\":\"Auto Loader y evolución de esquema\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"2\"},\"tags\":[\"ingestion\",\"auto-loader\",\"schema-evolution\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"3\",\"part\":\"m\",\"front\":\"Auto Loader: modo notificación vs listado de directorio, ¿cuál eliges y qué cuesta cada uno?\",\"back\":\"Notificación reacciona a eventos del storage; listado consulta el prefijo periódicamente.\\n\\n• Notificación: menor latencia y coste por fichero, escala a millones de ficheros; requiere cola + permisos IAM (Databricks los puede crear).\\n• Listado: cero configuración extra, suficiente para pocos ficheros o volúmenes bajos; cada ejecución recorre el prefijo, así que el coste crece con el número de ficheros.\\n• Ambos usan checkpoint: ninguno reprocesa lo ya leído.\\n\\nPista de examen: «millions of files / lowest latency» → notificación; «simplest, no extra permissions» → listado.\\n\\nRespuesta del quiz: File notification mode, with the required queue and IAM permissions created for them\",\"topic\":\"Notification vs directory listing\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"3\"},\"tags\":[\"ingestion\",\"auto-loader\"],\"difficulty\":\"intermediate\",\"related\":3},{\"questionId\":\"4\",\"part\":\"m\",\"front\":\"¿Cuándo eliges COPY INTO y cuándo Auto Loader?\",\"back\":\"COPY INTO para cargas puntuales o de bajo volumen; Auto Loader para ingesta continua y a gran escala.\\n\\n• COPY INTO: SQL, idempotente (recuerda los ficheros ya cargados), se puede programar; no mantiene estado de streaming.\\n• Auto Loader: checkpoints, evolución de esquema, modo notificación, miles de ficheros por hora, latencia baja.\\n• Ambos escriben en Delta y evitan duplicados al re-ejecutar; ninguno sustituye a una tabla externa.\\n\\nPista de examen: «simplest» + «a few files a day» → COPY INTO; «thousands of files» + «new schema» → Auto Loader.\\n\\nRespuesta del quiz: COPY INTO for the initial load, which can also be re-run incrementally to pick up new files\",\"topic\":\"COPY INTO vs Auto Loader\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"4\"},\"tags\":[\"ingestion\",\"copy-into\",\"auto-loader\"],\"difficulty\":\"basic\",\"related\":5},{\"questionId\":\"5\",\"part\":\"m\",\"front\":\"¿Qué es `_rescued_data` en Auto Loader y para qué sirve en producción?\",\"back\":\"Es la columna donde Auto Loader conserva los campos que no pudo parsear o que no encajan con el esquema, en lugar de descartar el registro.\\n\\n• Permite cargar sin fallar y sin perder datos: el registro entra, el campo problemático queda JSON en `_rescued_data`.\\n• En producción se usa para medir calidad (`WHERE _rescued_data IS NOT NULL`), poner esos registros en cuarentena y reprocesarlos cuando se corrige el esquema.\\n• Se puede desactivar con `rescuedDataColumn` si de verdad quieres el comportamiento estricto.\\n\\nPista de examen: «must not fail» + «cannot lose records» → `_rescued_data`.\\nNo confundir con: descartar filas o castear a STRING; ninguna de las dos conserva el original.\\n\\nRespuesta del quiz: It keeps the record and puts the unparsed or mismatched fields in the `_rescued_data` column\",\"topic\":\"Columna _rescued_data\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"5\"},\"tags\":[\"ingestion\",\"auto-loader\",\"data-quality\"],\"difficulty\":\"intermediate\",\"related\":6},{\"questionId\":\"6\",\"part\":\"m\",\"front\":\"¿Qué hace Trigger.AvailableNow y cuándo conviene frente a un stream continuo?\",\"back\":\"Procesa todo lo disponible en ese momento y termina: convierte un stream en un batch incremental.\\n\\n• Con un job programado, pagas solo la ejecución (minutos) en vez de un clúster 24/7.\\n• Sigue usando checkpoint: solo procesa lo nuevo desde la última vez.\\n• Ideal cuando no necesitas latencia de segundos: 5, 10, 30 minutos de retraso son aceptables.\\n\\nPista de examen: «run every N minutes / process new data / then stop» → AvailableNow (o Once).\\nTrampa: poner AvailableNow dentro de un job continuo no ahorra nada; el job sigue vivo.\\n\\nRespuesta del quiz: Trigger.AvailableNow (or Once) with the scheduled job stopping when the batch completes\",\"topic\":\"Trigger.AvailableNow\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"6\"},\"tags\":[\"streaming\",\"triggers\",\"cost\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"7\",\"part\":\"m\",\"front\":\"¿Qué hace MERGE INTO y cómo se escribe un upsert básico en Delta?\",\"back\":\"Compara origen y destino por una clave y aplica UPDATE/INSERT/DELETE en una sola pasada ACID.\\n\\n• MERGE INTO target USING staging ON target.id = staging.id\\n  WHEN MATCHED THEN UPDATE SET *\\n  WHEN NOT MATCHED THEN INSERT *\\n• Añade WHEN MATCHED AND ... THEN DELETE para borrados lógicos o físicos.\\n• Es idempotente si la clave es única en el staging: repetir la carga no duplica filas.\\n\\nPista de examen: «full state», «updates and new rows», «no duplicates» → MERGE INTO.\\nTrampa: sin deduplicar el staging antes del MERGE, un id repetido en origen lanza error (o duplica, si no hay clave).\\n\\nRespuesta del quiz: MERGE INTO target USING staging ON target.id = staging.id WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *\",\"topic\":\"MERGE INTO\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"7\"},\"tags\":[\"transformation\",\"delta-lake\",\"upsert\"],\"difficulty\":\"basic\"},{\"questionId\":\"8\",\"part\":\"m\",\"front\":\"¿Qué es liquid clustering y en qué se diferencia de particionar y de Z-ORDER?\",\"back\":\"Es el layout de tabla de Delta que declara claves y deja que Databricks las mantenga: sin elegir particiones y sin reescribir la tabla entera.\\n\\n• Se define con CLUSTER BY (col1, col2) al crear la tabla o ALTER TABLE ... CLUSTER BY.\\n• Cambiar las claves no requiere reescribir: el layout se ajusta de forma incremental.\\n• Evita el sobre-particionado (millones de ficheros pequeños) típico de particionar por fecha de alta cardinalidad.\\n• Sustituye a Z-ORDER en tablas nuevas; las tablas antiguas siguen con partición + Z-ORDER.\\n\\nPista de examen: «Databricks maintains the layout» / «without rewriting» → liquid clustering.\\nTrampa: sigue haciendo falta OPTIMIZE para compactar ficheros pequeños; clustering no es compactación.\\n\\nRespuesta del quiz: Liquid clustering on customer_id and event_date\",\"topic\":\"Liquid clustering\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"8\"},\"tags\":[\"delta-lake\",\"performance\",\"layout\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"9\",\"part\":\"m\",\"front\":\"¿Cuánto tiempo puedo viajar al pasado en una tabla Delta y qué papel juega VACUUM?\",\"back\":\"El time travel llega hasta donde la retención permita; VACUUM borra físicamente lo anterior.\\n\\n• Retención por defecto de VACUUM: 7 días. Pasado ese plazo, `VERSION AS OF` / `TIMESTAMP AS OF` fallan.\\n• Para conservar más: `delta.deletedFileRetentionDuration` o `VACUUM tabla RETAIN 720 HOURS` (30 días), asumiendo el coste.\\n• VACUUM no rompe queries en curso, pero sí elimina la posibilidad de recuperar versiones antiguas.\\n\\nPista de examen: «auditoría a 30 días» + «VACUUM diario» → hay que subir la retención.\\nTrampa: el log de transacciones (history) se conserva; lo que se borra son los ficheros de datos.\\n\\nRespuesta del quiz: It fails: the default retention is 7 days, so versions older than that are physically removed even though time travel still works within the window\",\"topic\":\"VACUUM y time travel\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"9\"},\"tags\":[\"delta-lake\",\"vacuum\",\"time-travel\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"10\",\"part\":\"m\",\"front\":\"En Lakeflow (antes Delta Live Tables): tabla en streaming vs vista materializada, ¿cuál es cada una?\",\"back\":\"Streaming table = incremental, cada fila se procesa una vez. Materialized view = recálculo completo del query en cada refresco.\\n\\n• Streaming table: ingesta continua, append, bajo coste por ejecución; no refleja updates/borrados del origen.\\n• Materialized view: agregaciones, joins y transformaciones que deben ver siempre el estado completo y actualizado.\\n• Ambas se declaran en el pipeline y se orquestan igual; el motor decide el plan.\\n\\nPista de examen: «only new rows» → streaming table; «recompute the full aggregate» → materialized view.\\nTrampa: usar streaming para un agregado que depende de borrados da resultados incorrectos, no solo lentos.\\n\\nRespuesta del quiz: The first as a streaming table and the second as a materialized view\",\"topic\":\"Streaming table vs materialized view\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"10\"},\"tags\":[\"lakeflow\",\"declarative-pipelines\",\"dlt\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"11\",\"part\":\"m\",\"front\":\"¿Qué son las expectations de un pipeline declarativo y qué acciones puede tomar ante una violación?\",\"back\":\"Son reglas de calidad declaradas sobre un dataset, con una acción asociada cuando se incumplen.\\n\\n• warn: deja pasar la fila y registra la métrica (solo observabilidad).\\n• drop: descarta la fila infractora y sigue corriendo, con métricas de cuántas se descartaron.\\n• fail: detiene la actualización del pipeline; úsalo solo si el dato inválido invalida todo el resultado.\\n• Las métricas por regla (passed/failed/dropped) se consultan en el evento del pipeline y sirven de alerta.\\n\\nPista de examen: «keep running + metrics» → drop (o warn); «must never reach the table y es bloqueante» → fail.\\nTrampa: un WHERE en el SELECT también filtra, pero no genera métricas ni queda gobernado por el pipeline.\\n\\nRespuesta del quiz: An expectation on the dataset that drops violating rows and records the violation metrics\",\"topic\":\"Expectations de calidad\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"11\"},\"tags\":[\"lakeflow\",\"data-quality\",\"expectations\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"12\",\"part\":\"m\",\"front\":\"¿Qué es Change Data Feed y cómo se consume?\",\"back\":\"Es el registro de cambios a nivel de fila de una tabla Delta, con el tipo de cambio y la versión.\\n\\n• Se activa con `delta.enableChangeDataFeed = true` (o TBLPROPERTIES al crear).\\n• Se lee con `table_changes('tabla', inicio, fin)` en SQL o `readChangeFeed` en Spark.\\n• `_change_type` distingue insert, update_preimage, update_postimage y delete.\\n• Casos típicos: replicar a otra tabla, alimentar un SCD, enviar cambios a un consumidor externo sin reescanear todo.\\n\\nPista de examen: «only changed rows» / «CDC» → Change Data Feed.\\nTrampa: CDF sigue la retención de la tabla; si haces VACUUM agresivo, pierdes cambios antiguos.\\n\\nRespuesta del quiz: Change Data Feed, then read with table_changes() / readChangeFeed\",\"topic\":\"Change Data Feed\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"12\"},\"tags\":[\"delta-lake\",\"cdc\",\"streaming\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"13\",\"part\":\"m\",\"front\":\"¿Cómo deduplicas un stream sin que el estado crezca sin límite?\",\"back\":\"Con un watermark que acota la ventana de estado y dropDuplicates sobre la clave.\\n\\n• `withWatermark(\\\"event_time\\\", \\\"10 minutes\\\")` indica hasta dónde puede llegar un evento tarde; Spark descarta estado anterior a ese límite.\\n• `.dropDuplicates([\\\"event_id\\\"])` mantiene una fila por clave dentro de la ventana.\\n• Sin watermark, el estado crece indefinidamente y la query acaba fallando por memoria.\\n\\nPista de examen: «duplicates» + «streaming» + «one row per key» → watermark + dropDuplicates.\\nTrampa: DISTINCT sobre la tabla no evita que los duplicados ya se hayan escrito; Z-ORDER no tiene nada que ver con unicidad.\\n\\nRespuesta del quiz: Deduplicate with a watermark on the event timestamp and dropDuplicates on event_id\",\"topic\":\"Deduplicación en streaming\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"13\"},\"tags\":[\"streaming\",\"watermark\",\"deduplication\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"14\",\"part\":\"m\",\"front\":\"¿Qué hace «Repair run» en un job multitarea y cuándo lo usas?\",\"back\":\"Re-ejecuta solo las tareas seleccionadas y sus dependientes, reutilizando el resto de la ejecución.\\n\\n• Caso típico: una tarea falla a mitad del DAG y el resto ya terminó bien.\\n• No recalcula la ingesta ni las tareas hermanas: ahorra tiempo y cómputo.\\n• Puedes reparar desde la tarea fallida o desde una tarea concreta si quieres recalcular aguas abajo.\\n\\nPista de examen: «only one task failed» + «cheapest way to finish» → repair run.\\nTrampa: reparar una tarea que depende de una salida ya corrupta propaga el problema; en ese caso repara desde antes.\\n\\nRespuesta del quiz: Repair the run, which re-executes only the failed task and its downstream dependencies\",\"topic\":\"Repair run\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"14\"},\"tags\":[\"jobs\",\"orchestration\",\"cost\"],\"difficulty\":\"basic\"},{\"questionId\":\"15\",\"part\":\"m\",\"front\":\"¿Cuándo usas un job cluster y cuándo un all-purpose cluster?\",\"back\":\"Job cluster para cargas automatizadas; all-purpose para trabajo interactivo.\\n\\n• Job cluster: se crea al arrancar el job y muere al terminar; pagas solo la ejecución y queda aislado.\\n• All-purpose: compartido, vivo hasta el idle timeout; para notebooks, exploración y desarrollo.\\n• Regla de coste: un batch de 40 minutos no justifica un clúster encendido 10 horas.\\n\\nPista de examen: «scheduled job + minimise cost» → job cluster; «analyst exploring data» → all-purpose.\\nTrampa: el SQL warehouse es para SQL (BI, dashboards), no para notebooks con Spark/Python.\\n\\nRespuesta del quiz: A job cluster for the nightly job and a separate all-purpose cluster for the analyst\",\"topic\":\"Job cluster vs all-purpose\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"15\"},\"tags\":[\"compute\",\"cost\",\"jobs\"],\"difficulty\":\"basic\"},{\"questionId\":\"16\",\"part\":\"m\",\"front\":\"¿Qué son los Declarative Automation Bundles (antes Databricks Asset Bundles) y qué problema resuelven?\",\"back\":\"Empaquetas jobs, pipelines, notebooks y configuración en YAML versionado, con targets por entorno.\\n\\n• `databricks.yml` define el bundle y los targets (dev, staging, prod) con sus variables: host, catálogo, tamaño de clúster.\\n• `databricks bundle validate` comprueba, `deploy -t prod` despliega, `bundle run` ejecuta.\\n• Resuelve la deriva entre entornos: el mismo artefacto, parametrizado, sin editar IDs a mano.\\n• Encaja en CI/CD: el pipeline de Git valida y despliega en cada merge.\\n\\nPista de examen: «same artifacts across environments» / «no manual edits» → Declarative Automation Bundles (antes Databricks Asset Bundles).\\nTrampa: los bundles despliegan definiciones; los datos y los permisos de Unity Catalog se gestionan aparte.\\n\\nRespuesta del quiz: Declarative Automation Bundles, with per-target variables and databricks bundle deploy -t \u003ctarget\u003e\",\"topic\":\"Databricks Asset Bundles\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"16\"},\"tags\":[\"cicd\",\"bundles\",\"deployment\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"17\",\"part\":\"m\",\"front\":\"¿Qué privilegios hay que conceder para que alguien lea un esquema concreto en Unity Catalog?\",\"back\":\"La jerarquía se recorre entera: catálogo → esquema → datos.\\n\\n• USE CATALOG en el catálogo (si no, ni lo ve).\\n• USE SCHEMA en el esquema (si no, no puede navegar dentro).\\n• SELECT sobre el esquema (todas sus tablas) o sobre tablas concretas.\\n• Se concede a usuarios, grupos o service principals; los grupos son la práctica recomendada.\\n\\nPista de examen: «read one schema only» → USE CATALOG + USE SCHEMA + SELECT.\\nTrampa: sin USE CATALOG/USE SCHEMA, un SELECT sobre la tabla falla aunque el grant exista.\\n\\nRespuesta del quiz: GRANT USE CATALOG ON CATALOG main TO `analysts`; GRANT USE SCHEMA ON SCHEMA main.sales TO `analysts`; GRANT SELECT ON SCHEMA main.sales TO `analysts`\",\"topic\":\"Privilegios en Unity Catalog\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"17\"},\"tags\":[\"governance\",\"unity-catalog\",\"grants\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"18\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre un row filter y un column mask en Unity Catalog?\",\"back\":\"El row filter decide qué FILAS ve cada principal; el column mask decide qué VALOR ve de una columna.\\n\\n• Row filter: función UDF que devuelve un booleano por fila (p. ej. región = región del usuario). Se aplica a la tabla.\\n• Column mask: función que transforma el valor (hash, `***`, últimos 4 dígitos) salvo para quien tenga el privilegio de desenmascarar.\\n• Al vivir en la tabla, aplican también a dashboards y BI, no solo al SQL manual.\\n\\nPista de examen: «solo sus filas» → row filter; «no ver el valor» → column mask.\\nTrampa: una vista con WHERE sirve, pero solo si todos la usan; el filtro en la tabla no se puede esquivar.\\n\\nRespuesta del quiz: A row filter function using the current user's region, plus a column mask on the email column\",\"topic\":\"Row filters y column masks\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"18\"},\"tags\":[\"governance\",\"unity-catalog\",\"security\"],\"difficulty\":\"intermediate\",\"related\":27},{\"questionId\":\"19\",\"part\":\"m\",\"front\":\"¿Cómo detectas data skew en Spark y qué tres arreglos tienes?\",\"back\":\"Señal: casi todas las tareas acaban rápido y unas pocas se eternizan, con shuffle read desproporcionado en el Spark UI.\\n\\n• Diagnóstico: `GROUP BY clave ORDER BY COUNT(*) DESC` para ver si unas pocas claves concentran las filas.\\n• Broadcast join: si el lado pequeño cabe en memoria, elimina el shuffle del join.\\n• Salting: añadir un sufijo aleatorio a las claves calientes para repartirlas y luego agregar de nuevo.\\n• AQE: la adaptive query execution reparte particiones y unifica las pequeñas, pero no rompe un cubo caliente por sí sola.\\n\\nPista de examen: «few tasks take forever» + «huge shuffle read» → skew.\\nTrampa: escalar el clúster no arregla el skew; la partición caliente sigue siendo una sola.\\n\\nRespuesta del quiz: Data skew on the join key: inspect the key distribution and salt or broadcast as appropriate\",\"topic\":\"Skew de datos\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"19\"},\"tags\":[\"troubleshooting\",\"performance\",\"shuffle\"],\"difficulty\":\"advanced\"},{\"questionId\":\"20\",\"part\":\"m\",\"front\":\"¿Para qué sirven las system tables y qué contienen?\",\"back\":\"Son metadatos operativos expuestos como tablas Delta consultables con SQL, con retención propia.\\n\\n• query history: quién ejecutó qué, duración, estado, bytes leídos.\\n• job runs: ejecuciones, tareas, duración y resultado.\\n• audit logs: accesos a objetos, cambios de permisos y operaciones administrativas.\\n• billing/usage: consumo por workspace y por SKU.\\n\\nPista de examen: «daily report», «queryable with SQL», «who accessed what» → system tables.\\nTrampa: el Spark UI y el historial de jobs son para depurar en caliente; no retienen ni se consultan con SQL.\\n\\nRespuesta del quiz: System tables (query history, job runs, audit logs) queried with SQL\",\"topic\":\"System tables\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"20\"},\"tags\":[\"monitoring\",\"governance\",\"observability\"],\"difficulty\":\"intermediate\",\"related\":29}]},\"deckEn\":{\"quizId\":\"databricks-dea\",\"quizTitle\":\"Databricks Data Engineer Associate — Practice Exam 1\",\"cardCount\":20,\"description\":\"20 preguntas originales escritas sobre el blueprint oficial del examen (Plataforma, Ingesta, Transformación, Lakeflow Jobs, CI/CD, Monitorización y Gobierno). Cada respuesta explica por qué la correcta lo es y por qué falla cada distractor. No es una copia del banco de Quizlet: ese mazo se usó solo como referencia de temario.\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What does the Databricks control plane store, and what stays in the customer's data plane?\",\"back\":\"The control plane stores metadata and orchestration; the data plane runs compute and stores data.\\n\\n• Control plane (Databricks): notebooks, job definitions, cluster configuration, Unity Catalog metadata, query history.\\n• Data plane (your cloud account): the cluster VMs and the storage holding Delta tables (S3/ADLS/GCS).\\n• Practical consequence: raw data is never copied into Databricks, which is why the model passes data-residency audits.\\n\\nExam cue: \\\"data must stay in our account\\\" → the plane split, not private link.\\nDo not confuse with: serverless, where Databricks also manages compute in its own account (useful, but not the default model).\\n\\nQuiz answer: The control plane manages workspace metadata and orchestration, while data stays in the customer's cloud account in the data plane\",\"topic\":\"Control plane vs data plane\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"1\"},\"tags\":[\"platform\",\"architecture\",\"security\"],\"difficulty\":\"basic\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How does Auto Loader ingest new files, and what does it do when the schema changes?\",\"back\":\"Auto Loader (cloudFiles) incrementally discovers new files and, with schema evolution, adds new columns to the target.\\n\\n• Checkpoint: remembers which files were processed, so they are never read twice.\\n• Discovery: notification mode (bucket events, cheaper with millions of files) or directory listing (simpler, no extra permissions).\\n• Schema: inferred (from a sample) or declared; `mergeSchema` / `schemaEvolutionMode` adds new fields.\\n• Records that don't fit land in the `_rescued_data` column instead of being lost.\\n\\nExam cue: \\\"thousands of files\\\" + \\\"new columns appear\\\" → Auto Loader, not COPY INTO with manual ALTER.\\n\\nQuiz answer: Auto Loader (cloudFiles) with schema evolution enabled, checkpointing each run\",\"topic\":\"Auto Loader and schema evolution\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"2\"},\"tags\":[\"ingestion\",\"auto-loader\",\"schema-evolution\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Auto Loader: notification mode vs directory listing — which do you choose and what does each cost?\",\"back\":\"Notification reacts to storage events; listing polls the prefix periodically.\\n\\n• Notification: lower latency and cost per file, scales to millions of files; needs a queue + IAM permissions (Databricks can create them).\\n• Listing: zero extra setup, fine for few files or low volume; every run walks the prefix, so cost grows with file count.\\n\\nBoth use a checkpoint, so neither reprocesses what it already read.\\n\\nExam cue: \\\"millions of files / lowest latency\\\" → notification; \\\"simplest, no extra permissions\\\" → listing.\\n\\nQuiz answer: File notification mode, with the required queue and IAM permissions created for them\",\"topic\":\"Notification vs directory listing\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"3\"},\"tags\":[\"ingestion\",\"auto-loader\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When do you choose COPY INTO and when Auto Loader?\",\"back\":\"COPY INTO for one-off or low-volume loads; Auto Loader for continuous, large-scale ingestion.\\n\\n• COPY INTO: SQL, idempotent (remembers already-loaded files), can be scheduled; keeps no streaming state.\\n• Auto Loader: checkpoints, schema evolution, notification mode, thousands of files per hour, low latency.\\n\\nBoth write to Delta and avoid duplicates on re-run; neither replaces an external table.\\n\\nExam cue: \\\"simplest\\\" + \\\"a few files a day\\\" → COPY INTO; \\\"thousands of files\\\" + \\\"new schema\\\" → Auto Loader.\\n\\nQuiz answer: COPY INTO for the initial load, which can also be re-run incrementally to pick up new files\",\"topic\":\"COPY INTO vs Auto Loader\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"4\"},\"tags\":[\"ingestion\",\"copy-into\",\"auto-loader\"],\"difficulty\":\"basic\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is `_rescued_data` in Auto Loader and what is it for in production?\",\"back\":\"It is the column where Auto Loader keeps fields it could not parse or that don't match the schema, instead of discarding the record.\\n\\n• It lets the load succeed without losing data: the record lands, the problematic field stays as JSON in `_rescued_data`.\\n• In production you use it to measure quality (`WHERE _rescued_data IS NOT NULL`), quarantine those records and reprocess them once the schema is fixed.\\n\\nExam cue: \\\"must not fail\\\" + \\\"cannot lose records\\\" → `_rescued_data`.\\nDo not confuse with: dropping rows or casting to STRING — neither keeps the original.\\n\\nQuiz answer: It keeps the record and puts the unparsed or mismatched fields in the `_rescued_data` column\",\"topic\":\"_rescued_data column\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"5\"},\"tags\":[\"ingestion\",\"auto-loader\",\"data-quality\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What does Trigger.AvailableNow do, and when is it better than a continuous stream?\",\"back\":\"It processes everything available at that moment and then stops: it turns a stream into an incremental batch.\\n\\n• With a scheduled job you pay only for the run (minutes) instead of a 24/7 cluster.\\n• It still uses the checkpoint: only new data since last time is processed.\\n• Ideal when you don't need second-level latency — 5, 10 or 30 minutes of delay is fine.\\n\\nExam cue: \\\"run every N minutes / process new data / then stop\\\" → AvailableNow (or Once).\\nTrap: putting AvailableNow inside a continuous job saves nothing; the job stays alive.\\n\\nQuiz answer: Trigger.AvailableNow (or Once) with the scheduled job stopping when the batch completes\",\"topic\":\"Trigger.AvailableNow\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"6\"},\"tags\":[\"streaming\",\"triggers\",\"cost\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What does MERGE INTO do, and how do you write a basic upsert in Delta?\",\"back\":\"It matches source and target on a key and applies UPDATE/INSERT/DELETE in a single ACID pass.\\n\\n• MERGE INTO target USING staging ON target.id = staging.id\\n  WHEN MATCHED THEN UPDATE SET *\\n  WHEN NOT MATCHED THEN INSERT *\\n• Add WHEN MATCHED AND ... THEN DELETE for soft or hard deletes.\\n• It is idempotent when the key is unique in staging: re-running does not duplicate rows.\\n\\nExam cue: \\\"full state\\\", \\\"updates and new rows\\\", \\\"no duplicates\\\" → MERGE INTO.\\nTrap: without deduplicating staging first, a repeated id errors out (or duplicates when there is no key).\\n\\nQuiz answer: MERGE INTO target USING staging ON target.id = staging.id WHEN MATCHED THEN UPDATE SET * WHEN NOT MATCHED THEN INSERT *\",\"topic\":\"MERGE INTO\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"7\"},\"tags\":[\"transformation\",\"delta-lake\",\"upsert\"],\"difficulty\":\"basic\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"8\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is liquid clustering, and how does it differ from partitioning and Z-ORDER?\",\"back\":\"It is Delta's table layout where you declare keys and Databricks maintains them: no partition choice and no full rewrite.\\n\\n• Declared with CLUSTER BY (col1, col2) at create time or ALTER TABLE ... CLUSTER BY.\\n• Changing keys does not require a rewrite: the layout adapts incrementally.\\n• It avoids the over-partitioning (millions of tiny files) typical of high-cardinality date partitions.\\n• It replaces Z-ORDER on new tables; older tables still use partitioning + Z-ORDER.\\n\\nExam cue: \\\"Databricks maintains the layout\\\" / \\\"without rewriting\\\" → liquid clustering.\\nTrap: you still need OPTIMIZE to compact small files; clustering is not compaction.\\n\\nQuiz answer: Liquid clustering on customer_id and event_date\",\"topic\":\"Liquid clustering\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"8\"},\"tags\":[\"delta-lake\",\"performance\",\"layout\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"9\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How far back can I time travel in a Delta table, and what does VACUUM have to do with it?\",\"back\":\"Time travel reaches as far back as retention allows; VACUUM physically deletes anything older.\\n\\n• Default VACUUM retention: 7 days. Past that, `VERSION AS OF` / `TIMESTAMP AS OF` fail.\\n• To keep more: `delta.deletedFileRetentionDuration` or `VACUUM table RETAIN 720 HOURS` (30 days), accepting the storage cost.\\n• VACUUM does not break running queries, but it removes the ability to recover old versions.\\n\\nExam cue: \\\"30-day audit\\\" + \\\"daily VACUUM\\\" → raise the retention.\\nTrap: the transaction log (history) is kept; what gets deleted is the data files.\\n\\nQuiz answer: It fails: the default retention is 7 days, so versions older than that are physically removed even though time travel still works within the window\",\"topic\":\"VACUUM and time travel\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"9\"},\"tags\":[\"delta-lake\",\"vacuum\",\"time-travel\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"10\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"In Lakeflow (formerly Delta Live Tables): streaming table vs materialized view — which is which?\",\"back\":\"Streaming table = incremental, each row processed once. Materialized view = full query recomputation on each refresh.\\n\\n• Streaming table: continuous ingestion, append-only, low cost per run; it does not reflect source updates/deletes.\\n• Materialized view: aggregations, joins and transformations that must always see the complete, current state.\\n• Both are declared in the pipeline and orchestrated the same way; the engine picks the plan.\\n\\nExam cue: \\\"only new rows\\\" → streaming table; \\\"recompute the full aggregate\\\" → materialized view.\\nTrap: using streaming for an aggregate that depends on deletes gives wrong results, not just slower ones.\\n\\nQuiz answer: The first as a streaming table and the second as a materialized view\",\"topic\":\"Streaming table vs materialized view\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"10\"},\"tags\":[\"lakeflow\",\"declarative-pipelines\",\"dlt\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"11\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What are pipeline expectations, and what actions can they take on a violation?\",\"back\":\"They are quality rules declared on a dataset, with an action applied when they are violated.\\n\\n• warn: let the row through and record the metric (observability only).\\n• drop: discard the offending row and keep running, with metrics on how many were dropped.\\n• fail: stop the pipeline update — use it only when invalid data invalidates the whole result.\\n\\nPer-rule metrics (passed/failed/dropped) are available in the pipeline event log and make good alerts.\\n\\nExam cue: \\\"keep running + metrics\\\" → drop (or warn); \\\"must never reach the table, blocking\\\" → fail.\\nTrap: a WHERE in the SELECT also filters, but it produces no metrics and is not governed by the pipeline.\\n\\nQuiz answer: An expectation on the dataset that drops violating rows and records the violation metrics\",\"topic\":\"Data-quality expectations\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"11\"},\"tags\":[\"lakeflow\",\"data-quality\",\"expectations\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"12\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Change Data Feed and how do you consume it?\",\"back\":\"It is the row-level change log of a Delta table, with change type and version.\\n\\n• Enabled with `delta.enableChangeDataFeed = true` (or TBLPROPERTIES at create time).\\n• Read with `table_changes('table', start, end)` in SQL or `readChangeFeed` in Spark.\\n• `_change_type` distinguishes insert, update_preimage, update_postimage and delete.\\n• Typical uses: replicate to another table, feed an SCD, push changes to an external consumer without rescanning everything.\\n\\nExam cue: \\\"only changed rows\\\" / \\\"CDC\\\" → Change Data Feed.\\nTrap: CDF follows table retention; aggressive VACUUM deletes old changes.\\n\\nQuiz answer: Change Data Feed, then read with table_changes() / readChangeFeed\",\"topic\":\"Change Data Feed\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"12\"},\"tags\":[\"delta-lake\",\"cdc\",\"streaming\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"13\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you deduplicate a stream without letting state grow unbounded?\",\"back\":\"With a watermark that bounds the state window and dropDuplicates on the key.\\n\\n• `withWatermark(\\\"event_time\\\", \\\"10 minutes\\\")` says how late an event may arrive; Spark discards state older than that bound.\\n• `.dropDuplicates([\\\"event_id\\\"])` keeps one row per key inside the window.\\n• Without a watermark, state grows forever and the query eventually fails on memory.\\n\\nExam cue: \\\"duplicates\\\" + \\\"streaming\\\" + \\\"one row per key\\\" → watermark + dropDuplicates.\\nTrap: DISTINCT over the table does not stop duplicates from being written; Z-ORDER has nothing to do with uniqueness.\\n\\nQuiz answer: Deduplicate with a watermark on the event timestamp and dropDuplicates on event_id\",\"topic\":\"Streaming deduplication\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"13\"},\"tags\":[\"streaming\",\"watermark\",\"deduplication\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"14\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What does \\\"Repair run\\\" do in a multi-task job, and when do you use it?\",\"back\":\"It re-executes only the selected tasks and their downstream dependencies, reusing the rest of the run.\\n\\n• Typical case: one task fails mid-DAG and everything else already succeeded.\\n• It does not recompute ingestion or sibling tasks: saves time and compute.\\n• You can repair from the failed task, or from an earlier one if you want to recompute downstream.\\n\\nExam cue: \\\"only one task failed\\\" + \\\"cheapest way to finish\\\" → repair run.\\nTrap: repairing a task that depends on already-corrupt output propagates the problem; repair from earlier instead.\\n\\nQuiz answer: Repair the run, which re-executes only the failed task and its downstream dependencies\",\"topic\":\"Repair run\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"14\"},\"tags\":[\"jobs\",\"orchestration\",\"cost\"],\"difficulty\":\"basic\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"15\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When do you use a job cluster and when an all-purpose cluster?\",\"back\":\"Job cluster for automated workloads; all-purpose for interactive work.\\n\\n• Job cluster: created when the job starts, dies when it ends; you pay only for the run and it is isolated.\\n• All-purpose: shared, alive until the idle timeout; for notebooks, exploration and development.\\n• Cost rule: a 40-minute batch does not justify a cluster running 10 hours.\\n\\nExam cue: \\\"scheduled job + minimise cost\\\" → job cluster; \\\"analyst exploring data\\\" → all-purpose.\\nTrap: a SQL warehouse is for SQL (BI, dashboards), not for Spark/Python notebooks.\\n\\nQuiz answer: A job cluster for the nightly job and a separate all-purpose cluster for the analyst\",\"topic\":\"Job cluster vs all-purpose\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"15\"},\"tags\":[\"compute\",\"cost\",\"jobs\"],\"difficulty\":\"basic\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"16\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What are Declarative Automation Bundles (formerly Databricks Asset Bundles) and what problem do they solve?\",\"back\":\"They package jobs, pipelines, notebooks and configuration as versioned YAML with per-environment targets.\\n\\n• `databricks.yml` defines the bundle and targets (dev, staging, prod) with variables: host, catalog, cluster size.\\n• `databricks bundle validate` checks, `deploy -t prod` deploys, `bundle run` executes.\\n• It removes environment drift: same artifact, parameterised, no hand-edited IDs.\\n• It fits CI/CD: the Git pipeline validates and deploys on every merge.\\n\\nExam cue: \\\"same artifacts across environments\\\" / \\\"no manual edits\\\" → Declarative Automation Bundles (formerly Databricks Asset Bundles).\\nTrap: bundles deploy definitions; data and Unity Catalog permissions are managed separately.\\n\\nQuiz answer: Declarative Automation Bundles, with per-target variables and databricks bundle deploy -t \u003ctarget\u003e\",\"topic\":\"Databricks Asset Bundles\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"16\"},\"tags\":[\"cicd\",\"bundles\",\"deployment\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"17\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Which privileges do you grant so someone can read one specific schema in Unity Catalog?\",\"back\":\"You walk the whole hierarchy: catalog → schema → data.\\n\\n• USE CATALOG on the catalog (otherwise it is invisible).\\n• USE SCHEMA on the schema (otherwise they cannot navigate into it).\\n• SELECT on the schema (all its tables) or on specific tables.\\n• Granted to users, groups or service principals; groups are the recommended practice.\\n\\nExam cue: \\\"read one schema only\\\" → USE CATALOG + USE SCHEMA + SELECT.\\nTrap: without USE CATALOG/USE SCHEMA, a SELECT on the table fails even when the grant exists.\\n\\nQuiz answer: GRANT USE CATALOG ON CATALOG main TO `analysts`; GRANT USE SCHEMA ON SCHEMA main.sales TO `analysts`; GRANT SELECT ON SCHEMA main.sales TO `analysts`\",\"topic\":\"Unity Catalog privileges\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"17\"},\"tags\":[\"governance\",\"unity-catalog\",\"grants\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"18\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is the difference between a row filter and a column mask in Unity Catalog?\",\"back\":\"A row filter decides which ROWS each principal sees; a column mask decides which VALUE of a column they see.\\n\\n• Row filter: a UDF returning a boolean per row (e.g. region = current user's region). Applied to the table.\\n• Column mask: a function transforming the value (hash, `***`, last 4 digits) except for principals with the unmask privilege.\\n• Because they live on the table, they also apply to dashboards and BI, not just manual SQL.\\n\\nExam cue: \\\"only their rows\\\" → row filter; \\\"must not see the value\\\" → column mask.\\nTrap: a WHERE view works only if everyone uses it; a table-level filter cannot be bypassed.\\n\\nQuiz answer: A row filter function using the current user's region, plus a column mask on the email column\",\"topic\":\"Row filters and column masks\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"18\"},\"tags\":[\"governance\",\"unity-catalog\",\"security\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"19\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you detect data skew in Spark, and what three fixes do you have?\",\"back\":\"Signal: almost all tasks finish fast, a few take forever, with disproportionate shuffle read in the Spark UI.\\n\\n• Diagnose: `GROUP BY key ORDER BY COUNT(*) DESC` to see whether a few keys hold most rows.\\n• Broadcast join: if the small side fits in memory, it removes the join shuffle entirely.\\n• Salting: add a random suffix to hot keys to spread them, then aggregate again.\\n\\nAQE rebalances and coalesces partitions but does not by itself break a single hot bucket.\\n\\nExam cue: \\\"few tasks take forever\\\" + \\\"huge shuffle read\\\" → skew.\\nTrap: scaling the cluster does not fix skew; the hot partition is still one partition.\\n\\nQuiz answer: Data skew on the join key: inspect the key distribution and salt or broadcast as appropriate\",\"topic\":\"Data skew\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"19\"},\"tags\":[\"troubleshooting\",\"performance\",\"shuffle\"],\"difficulty\":\"advanced\",\"esDeck\":\"databricks-dea\"},{\"questionId\":\"20\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What are system tables for, and what do they contain?\",\"back\":\"They expose operational metadata as Delta tables you can query with SQL, with their own retention.\\n\\n• query history: who ran what, duration, status, bytes read.\\n• job runs: executions, tasks, duration and outcome.\\n• audit logs: object access, permission changes and administrative operations.\\n• billing/usage: consumption per workspace and SKU.\\n\\nExam cue: \\\"daily report\\\", \\\"queryable with SQL\\\", \\\"who accessed what\\\" → system tables.\\nTrap: the Spark UI and job history are for live debugging; they neither retain nor answer SQL.\\n\\nQuiz answer: System tables (query history, job runs, audit logs) queried with SQL\",\"topic\":\"System tables\",\"origin\":\"ai\",\"source\":{\"quizId\":\"databricks-dea\",\"questionId\":\"20\"},\"tags\":[\"monitoring\",\"governance\",\"observability\"],\"difficulty\":\"intermediate\",\"esDeck\":\"databricks-dea\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
