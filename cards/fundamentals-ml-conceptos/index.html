chine learning?\",\"back\":\"En vez de programar reglas explícitas (\\\"si pasa X, haz Y\\\"), el machine learning aprende un patrón a partir de ejemplos (datos) y lo usa para predecir o decidir sobre casos nuevos.\\n\\n• El modelo es el resultado de ese aprendizaje.\\n• Los datos son la materia prima.\\n\\nAnalogía: no le escribes a un niño todas las razas de perro; le muestras muchas fotos y él generaliza.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-modelo-algoritmo-datos\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre datos, algoritmo y modelo?\",\"back\":\"• Datos: los ejemplos (tabla, imágenes, texto).\\n• Algoritmo: el método de aprendizaje (regresión lineal, un árbol, una red).\\n• Modelo: lo que queda DESPUÉS de entrenar: los números (pesos) que el algoritmo ajustó con esos datos.\\n\\nEl mismo algoritmo con otros datos produce otro modelo. Sin datos no hay modelo, solo una receta vacía.\",\"topic\":\"Modelo, algoritmo, datos\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-entrenar-inferir\",\"part\":\"m\",\"front\":\"¿Qué es entrenar y qué es inferir (predecir)?\",\"back\":\"• Entrenar: el modelo mira muchos ejemplos con respuesta y ajusta sus parámetros. Es lento y caro; se hace pocas veces.\\n• Inferir / predecir: el modelo ya entrenado recibe un caso NUEVO y da una respuesta. Es rápido; es lo que ves en producción.\\n\\nAnalogía: estudiar para el examen (entrenar) vs resolver un problema el día del examen (inferir).\",\"topic\":\"Entrenar vs inferir\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-supervisado\",\"part\":\"m\",\"front\":\"¿Qué es el aprendizaje supervisado?\",\"back\":\"Se entrena con datos ETIQUETADOS: cada ejemplo incluye la respuesta correcta. El modelo aprende a mapear entradas → salida.\\n\\nDos tareas típicas:\\n• Clasificación: predecir una categoría (spam / no spam).\\n• Regresión: predecir un número (precio de una casa).\\n\\nEs el tipo más común en producción. Pista: si tienes historial CON la respuesta que quieres predecir → supervisado.\",\"topic\":\"Aprendizaje supervisado\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-clasificacion-regresion\",\"part\":\"m\",\"front\":\"¿Cómo distingo clasificación de regresión?\",\"back\":\"Mira la salida que quieres predecir.\\n\\n• Categoría / etiqueta (sí/no, tipo de animal, riesgo alto/medio/bajo) → clasificación.\\n• Número continuo (precio, temperatura, minutos de retraso) → regresión.\\n\\nTrampa: \\\"porcentaje de impago\\\" es un número, pero si lo conviertes en \\\"impaga / no impaga\\\" pasa a ser clasificación. La pregunta de negocio decide.\",\"topic\":\"Clasificación vs regresión\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-no-supervisado\",\"part\":\"m\",\"front\":\"¿Qué es el aprendizaje no supervisado?\",\"back\":\"Se entrena con datos SIN etiquetas: el modelo busca estructura por sí solo.\\n\\nEjemplos: agrupar clientes parecidos (clustering), reducir dimensiones, detectar anomalías. No hay una \\\"respuesta correcta\\\" con la que comparar, así que evaluar es más subjetivo.\\n\\nAnalogía: supervisado = estudiar con solucionario; no supervisado = ordenar fotos sin que nadie nombre las categorías.\",\"topic\":\"Aprendizaje no supervisado\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-refuerzo\",\"part\":\"m\",\"front\":\"¿Qué es el aprendizaje por refuerzo?\",\"back\":\"Un agente toma acciones en un entorno y recibe recompensas o castigos; aprende una política que maximiza la recompensa acumulada.\\n\\nSe usa en juegos, robótica y control. No necesita ejemplos etiquetados: aprende por prueba y error.\\n\\nNo lo confundas con \\\"el modelo recibe un premio si acierta el label\\\": eso sigue siendo supervisado.\",\"topic\":\"Aprendizaje por refuerzo\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-features-labels\",\"part\":\"m\",\"front\":\"¿Qué son las features y los labels?\",\"back\":\"• Features (características): las variables de entrada que describen cada ejemplo (edad, consumo, texto).\\n• Label (etiqueta / target): la salida que queremos predecir en aprendizaje supervisado.\\n• Ejemplo (fila): una combinación de features + su label.\\n\\nLa calidad de las features suele importar más que el algoritmo elegido. Sin label no hay supervisado.\",\"topic\":\"Features y labels\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-numerico-categorico\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre una feature numérica y una categórica?\",\"back\":\"• Numérica: un número con orden o magnitud (edad, precio, temperatura). El modelo puede sumar y comparar.\\n• Categórica: una clase (ciudad, color, tipo de producto). \\\"Madrid\\\" no es el doble de \\\"Sevilla\\\".\\n\\nLas categóricas suelen convertirse a números (one-hot, embeddings) antes de entrar al modelo. Tratar un código postal como número suele ser un error.\",\"topic\":\"Features numéricas y categóricas\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-one-hot\",\"part\":\"m\",\"front\":\"¿Qué es el one-hot encoding y para qué sirve?\",\"back\":\"Convierte una categoría en varias columnas 0/1: color=rojo → (1, 0, 0), verde → (0, 1, 0), azul → (0, 0, 1).\\n\\nAsí el modelo no cree que azul \u003e verde. El coste: muchas categorías únicas crean muchas columnas. Con miles de valores distintos, suele ser mejor un embedding o agrupar rarezas.\",\"topic\":\"One-hot encoding\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-escalar\",\"part\":\"m\",\"front\":\"¿Por qué se escalan o normalizan las features numéricas?\",\"back\":\"Para que una feature en millones (ingresos) no aplaste a otra en unidades (número de hijos).\\n\\n• Modelos que usan distancias o gradientes (k-NN, SVM, redes, regresión regularizada) lo necesitan.\\n• Los árboles suelen ser indiferentes a la escala.\\n\\nSe ajusta el escalado SOLO con train y se aplica igual a validation/test. Si no, hay data leakage.\",\"topic\":\"Escalado\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-splits\",\"part\":\"m\",\"front\":\"¿Para qué se separan los datos en train, validation y test?\",\"back\":\"• Train: se ajusta el modelo.\\n• Validation: se eligen hiperparámetros y se comparan modelos.\\n• Test: se mide el rendimiento final UNA vez, sobre datos nunca vistos.\\n\\nMezclar estos conjuntos da métricas optimistas y engañosas. El test es el examen; si lo usas para practicar, ya no mide lo que crees.\",\"topic\":\"Train / validation / test\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-overfitting\",\"part\":\"m\",\"front\":\"¿Qué es el overfitting (sobreajuste)?\",\"back\":\"El modelo memoriza los datos de entrenamiento, incluido su ruido, y falla en datos nuevos.\\n\\nSeñal: muy bien en train, mucho peor en validation. Remedios: más datos, regularización, modelo más simple, early stopping, o menos features ruidosas.\\n\\nAnalogía: un estudiante que memoriza las preguntas del simulacro y se hunde en el examen real.\",\"topic\":\"Overfitting\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-underfitting\",\"part\":\"m\",\"front\":\"¿Qué es el underfitting (subajuste)?\",\"back\":\"El modelo es demasiado simple y no captura el patrón: falla tanto en entrenamiento como en datos nuevos.\\n\\nRemedios: un modelo más expresivo, mejores features, o entrenar más tiempo.\\n\\nEs el problema opuesto al overfitting. Si train YA es malo, no es sobreajuste: el modelo no está aprendiendo.\",\"topic\":\"Underfitting\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-generalizacion\",\"part\":\"m\",\"front\":\"¿Qué significa que un modelo generaliza?\",\"back\":\"Que funciona en casos que NO vio durante el entrenamiento, no solo en los ejemplos memorizados.\\n\\nEse es el objetivo real del ML. Las métricas de test (y, en producción, el monitoreo) existen para comprobarlo. Un 99% en train no vale nada si en el mundo real acierta el 60%.\\n\\nAnalogía: aprobar el simulacro no es saber el tema; saberlo es resolver un problema nuevo. Si el dato de producción cambia (otro país, otra temporada), hay que volver a medir.\",\"topic\":\"Generalización\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-parametros-hiper\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre un parámetro y un hiperparámetro?\",\"back\":\"• Parámetros: los aprende el modelo solo (pesos, coeficientes, umbrales de un árbol).\\n• Hiperparámetros: los eliges TÚ antes de entrenar (número de árboles, learning rate, k en k-NN).\\n\\nLos hiperparámetros se eligen con validation (o cross-validation), no con test. Ajustarlos mirando el test es hacer trampa.\",\"topic\":\"Parámetros vs hiperparámetros\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-loss\",\"part\":\"m\",\"front\":\"¿Qué es una función de pérdida (loss)?\",\"back\":\"Un número que dice \\\"qué tan mal lo está haciendo el modelo\\\" en los ejemplos de train. Entrenar = buscar los parámetros que hacen esa pérdida lo más pequeña posible.\\n\\n• Regresión: suele ser error al cuadrado (MSE).\\n• Clasificación: suele ser log-loss / cross-entropy.\\n\\nLa métrica de negocio (dinero, precisión) no siempre es la loss: la loss es el motor del ajuste; la métrica es cómo juzgas el resultado.\",\"topic\":\"Función de pérdida\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-gradiente\",\"part\":\"m\",\"front\":\"¿Qué es el descenso por gradiente, en intuición?\",\"back\":\"Un método para bajar la loss dando pasitos. El gradiente indica la dirección de mayor subida; das un paso en la dirección CONTRARIA.\\n\\n• Learning rate: el tamaño del paso. Muy grande = te pasas; muy chico = tardas una eternidad.\\n\\nAnalogía: bajás una colina con niebla, solo sientes la pendiente bajo tus pies. No necesitas ver todo el mapa.\",\"topic\":\"Descenso por gradiente\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-batch-epoch\",\"part\":\"m\",\"front\":\"¿Qué es un batch y qué es un epoch?\",\"back\":\"• Batch (lote): un pedazo de ejemplos con el que calculas un paso de gradiente. Más chico = más ruido y más pasos; más grande = más estable y más memoria.\\n• Epoch: una pasada completa por TODO el train.\\n\\nEntrenar 10 epochs con batches de 32 significa: recorre el dataset 10 veces, 32 filas a la vez.\",\"topic\":\"Batch y epoch\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-regularizacion\",\"part\":\"m\",\"front\":\"¿Qué es la regularización?\",\"back\":\"Un freno para que el modelo no se vuelva demasiado complejo y memorice ruido.\\n\\nFormas comunes: penalizar pesos grandes (L1/L2), dropout en redes, limitar la profundidad de un árbol, o early stopping.\\n\\nEs el antídoto principal del overfitting cuando no puedes conseguir más datos limpios.\",\"topic\":\"Regularización\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-bias-variance\",\"part\":\"m\",\"front\":\"¿Qué son el sesgo (bias) y la varianza en un modelo?\",\"back\":\"• Sesgo (bias) alto: el modelo es rígido y se equivoca siempre de la misma forma. Es underfitting. Una línea recta sobre datos en curva tiene sesgo alto.\\n• Varianza alta: el modelo cambia mucho si cambias el train. Es overfitting. Memoriza el ruido de ESA muestra.\\n\\nQuieres el medio. Más datos bajan la varianza. Un modelo MÁS simple baja la varianza y SUBE el sesgo. Un modelo más flexible hace lo contrario. La frase trampa es \\\"simplificar baja el sesgo\\\": es al revés.\",\"topic\":\"Bias y varianza\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-leakage\",\"part\":\"m\",\"front\":\"¿Qué es el data leakage y por qué es tan peligroso?\",\"back\":\"Cuando información del futuro o del test se cuela en el entrenamiento. El modelo \\\"hace trampa\\\" y las métricas se ven perfectas… hasta producción.\\n\\nEjemplos: usar el id del cliente que ya incluye el resultado; escalar con todo el dataset; un feature calculado DESPUÉS de saber el label.\\n\\nRegla: todo lo que el modelo vea en train debe existir en el momento de predecir en la vida real.\",\"topic\":\"Data leakage\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-baseline\",\"part\":\"m\",\"front\":\"¿Qué es una baseline y por qué hay que tener una?\",\"back\":\"La solución tonta o simple contra la que comparas: predecir siempre la clase mayoritaria, el promedio, o una regla de negocio.\\n\\nSi tu modelo sofisticado no gana a esa baseline, no aporta valor. Empieza siempre ahí: te evita celebrar un 90% de accuracy cuando el 90% de los casos ya eran \\\"no\\\".\",\"topic\":\"Baseline\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-ciclo\",\"part\":\"m\",\"front\":\"¿Cuáles son los pasos de un proyecto de ML, de punta a punta?\",\"back\":\"1. Definir el problema y la métrica de negocio.\\n2. Conseguir y limpiar datos (y un split honesto).\\n3. Entrenar una baseline, luego modelos mejores.\\n4. Evaluar en validation/test.\\n5. Desplegar (batch u online) y MONITOREAR: los datos del mundo cambian (drift).\\n\\nEl código del modelo es una parte; la mayoría del tiempo se va en datos y en operación.\",\"topic\":\"Ciclo de vida ML\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"difficulty\":\"basic\"}]},\"deckEn\":{\"quizId\":\"fundamentals-ml-conceptos\",\"quizTitle\":\"ML Fundamentals — Core concepts\",\"cardCount\":24,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🌱\",\"description\":\"From zero: what machine learning is, how a model is trained, and the concepts shared by every problem.\",\"cards\":[{\"id\":\"ml-concepto-que-es\",\"part\":\"m\",\"front\":\"What is machine learning?\",\"back\":\"Instead of programming explicit rules (\\\"if X, then Y\\\"), machine learning learns a pattern from examples (data) and uses it to predict or decide on new cases.\\n\\n• The model is the result of that learning.\\n• The data is the raw material.\\n\\nAnalogy: you do not write down every dog breed for a child; you show many photos and they generalize.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-modelo-algoritmo-datos\",\"part\":\"m\",\"front\":\"What is the difference between data, algorithm, and model?\",\"back\":\"• Data: the examples (table, images, text).\\n• Algorithm: the learning method (linear regression, a tree, a network).\\n• Model: what remains AFTER training: the numbers (weights) the algorithm fitted on that data.\\n\\nThe same algorithm with different data produces a different model. With no data there is no model, only an empty recipe.\",\"topic\":\"Modelo, algoritmo, datos\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-entrenar-inferir\",\"part\":\"m\",\"front\":\"What is training vs inference (prediction)?\",\"back\":\"• Train: the model looks at many examples with answers and adjusts its parameters. Slow and expensive; done rarely.\\n• Infer / predict: the already-trained model gets a NEW case and answers. Fast; this is what you see in production.\\n\\nAnalogy: studying for the exam (train) vs solving a problem on exam day (infer).\",\"topic\":\"Entrenar vs inferir\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-supervisado\",\"part\":\"m\",\"front\":\"What is supervised learning?\",\"back\":\"Trained on LABELED data: every example includes the correct answer. The model learns to map inputs → output.\\n\\nTwo typical tasks:\\n• Classification: predict a category (spam / not spam).\\n• Regression: predict a number (house price).\\n\\nIt is the most common type in production. Tip: if you have history WITH the answer you want to predict → supervised.\",\"topic\":\"Aprendizaje supervisado\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-clasificacion-regresion\",\"part\":\"m\",\"front\":\"How do I tell classification from regression?\",\"back\":\"Look at the output you want to predict.\\n\\n• Category / label (yes/no, animal type, high/medium/low risk) → classification.\\n• Continuous number (price, temperature, minutes of delay) → regression.\\n\\nTrap: \\\"default rate\\\" is a number, but if you turn it into \\\"defaults / does not\\\" it becomes classification. The business question decides.\",\"topic\":\"Clasificación vs regresión\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-no-supervisado\",\"part\":\"m\",\"front\":\"What is unsupervised learning?\",\"back\":\"Trained on UNLABELED data: the model finds structure on its own.\\n\\nExamples: grouping similar customers (clustering), reducing dimensions, detecting anomalies. There is no \\\"correct answer\\\" to compare against, so evaluation is more subjective.\\n\\nAnalogy: supervised = studying with the answer key; unsupervised = sorting photos with nobody naming the categories.\",\"topic\":\"Aprendizaje no supervisado\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-refuerzo\",\"part\":\"m\",\"front\":\"What is reinforcement learning?\",\"back\":\"An agent takes actions in an environment and receives rewards or penalties; it learns a policy that maximizes cumulative reward.\\n\\nUsed in games, robotics, and control. It needs no labeled examples: it learns by trial and error.\\n\\nDo not confuse it with \\\"the model gets a prize if it matches the label\\\": that is still supervised learning.\",\"topic\":\"Aprendizaje por refuerzo\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-features-labels\",\"part\":\"m\",\"front\":\"What are features and labels?\",\"back\":\"• Features: the input variables describing each example (age, spend, text).\\n• Label (target): the output we want to predict in supervised learning.\\n• Example (row): one combination of features + its label.\\n\\nFeature quality usually matters more than the algorithm chosen. Without a label there is no supervised learning.\",\"topic\":\"Features y labels\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-numerico-categorico\",\"part\":\"m\",\"front\":\"What is the difference between a numeric and a categorical feature?\",\"back\":\"• Numeric: a number with order or magnitude (age, price, temperature). The model can add and compare.\\n• Categorical: a class (city, color, product type). \\\"Madrid\\\" is not twice \\\"Seville\\\".\\n\\nCategorical features are usually turned into numbers (one-hot, embeddings) before they enter the model. Treating a zip code as a number is often a mistake.\",\"topic\":\"Features numéricas y categóricas\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-one-hot\",\"part\":\"m\",\"front\":\"What is one-hot encoding and what is it for?\",\"back\":\"It turns a category into several 0/1 columns: color=red → (1, 0, 0), green → (0, 1, 0), blue → (0, 0, 1).\\n\\nThe model then does not think blue \u003e green. The cost: many unique categories create many columns. With thousands of distinct values, an embedding or grouping rare ones is usually better.\",\"topic\":\"One-hot encoding\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-escalar\",\"part\":\"m\",\"front\":\"Why scale or normalize numeric features?\",\"back\":\"So a feature in the millions (income) does not drown one in single digits (number of children).\\n\\n• Models that use distances or gradients (k-NN, SVM, networks, regularized regression) need it.\\n• Trees are usually scale-invariant.\\n\\nFit the scaler on TRAIN only and apply the same transform to validation/test. Otherwise you leak data.\",\"topic\":\"Escalado\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-splits\",\"part\":\"m\",\"front\":\"Why split data into train, validation, and test?\",\"back\":\"• Train: fit the model.\\n• Validation: choose hyperparameters and compare models.\\n• Test: measure final performance ONCE, on data never seen before.\\n\\nMixing these sets yields optimistic, misleading metrics. Test is the exam; if you use it to practice, it no longer measures what you think.\",\"topic\":\"Train / validation / test\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-overfitting\",\"part\":\"m\",\"front\":\"What is overfitting?\",\"back\":\"The model memorizes the training data, including its noise, and fails on new data.\\n\\nSign: great on train, much worse on validation. Remedies: more data, regularization, a simpler model, early stopping, or fewer noisy features.\\n\\nAnalogy: a student who memorizes the practice questions and tanks the real exam.\",\"topic\":\"Overfitting\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-underfitting\",\"part\":\"m\",\"front\":\"What is underfitting?\",\"back\":\"The model is too simple to capture the pattern: it fails on both training and new data.\\n\\nRemedies: a more expressive model, better features, or longer training.\\n\\nIt is the opposite problem to overfitting. If train is ALREADY bad, it is not overfit: the model is not learning.\",\"topic\":\"Underfitting\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-generalizacion\",\"part\":\"m\",\"front\":\"What does it mean that a model generalizes?\",\"back\":\"It works on cases it did NOT see during training, not only on memorized examples.\\n\\nThat is the real goal of ML. Test metrics (and, in production, monitoring) exist to check it. 99% on train is worthless if it scores 60% in the real world.\\n\\nAnalogy: passing the practice exam is not knowing the topic; knowing it is solving a new problem. If production data shifts (another country, another season), you have to measure again.\",\"topic\":\"Generalización\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-parametros-hiper\",\"part\":\"m\",\"front\":\"What is the difference between a parameter and a hyperparameter?\",\"back\":\"• Parameters: the model learns them on its own (weights, coefficients, tree thresholds).\\n• Hyperparameters: YOU pick them before training (number of trees, learning rate, k in k-NN).\\n\\nHyperparameters are chosen with validation (or cross-validation), not test. Tuning them on test is cheating.\",\"topic\":\"Parámetros vs hiperparámetros\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-loss\",\"part\":\"m\",\"front\":\"What is a loss function?\",\"back\":\"A number that says \\\"how badly the model is doing\\\" on the training examples. Training = finding the parameters that make that loss as small as possible.\\n\\n• Regression: often squared error (MSE).\\n• Classification: often log-loss / cross-entropy.\\n\\nThe business metric (money, precision) is not always the loss: loss is the engine of fitting; the metric is how you judge the result.\",\"topic\":\"Función de pérdida\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-gradiente\",\"part\":\"m\",\"front\":\"What is gradient descent, intuitively?\",\"back\":\"A method to lower the loss by taking small steps. The gradient points to the steepest uphill; you step the OPPOSITE way.\\n\\n• Learning rate: step size. Too large = you overshoot; too small = you take forever.\\n\\nAnalogy: you walk down a foggy hill, feeling only the slope under your feet. You do not need the whole map.\",\"topic\":\"Descenso por gradiente\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-batch-epoch\",\"part\":\"m\",\"front\":\"What is a batch and what is an epoch?\",\"back\":\"• Batch: a chunk of examples used for one gradient step. Smaller = noisier and more steps; larger = stabler and more memory.\\n• Epoch: one full pass over ALL of train.\\n\\nTraining 10 epochs with batch size 32 means: walk the dataset 10 times, 32 rows at a time.\",\"topic\":\"Batch y epoch\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-regularizacion\",\"part\":\"m\",\"front\":\"What is regularization?\",\"back\":\"A brake so the model does not become too complex and memorize noise.\\n\\nCommon forms: penalizing large weights (L1/L2), dropout in networks, limiting a tree's depth, or early stopping.\\n\\nIt is the main antidote to overfitting when you cannot get more clean data.\",\"topic\":\"Regularización\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-bias-variance\",\"part\":\"m\",\"front\":\"What are bias and variance in a model?\",\"back\":\"• High bias: the model is rigid and is wrong in the same way every time. That is underfitting. A straight line on curved data has high bias.\\n• High variance: the model changes a lot if you change the training set. That is overfitting. It memorizes the noise of THAT sample.\\n\\nYou want the middle. More data lowers variance. A SIMPLER model lowers variance and RAISES bias. A more flexible model does the opposite. The trap phrase is \\\"simplifying lowers bias\\\": it is the other way around.\",\"topic\":\"Bias y varianza\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-leakage\",\"part\":\"m\",\"front\":\"What is data leakage and why is it so dangerous?\",\"back\":\"When future or test information leaks into training. The model \\\"cheats\\\" and metrics look perfect… until production.\\n\\nExamples: using a customer id that already encodes the outcome; scaling on the whole dataset; a feature computed AFTER you knew the label.\\n\\nRule: everything the model sees at train time must exist at prediction time in real life.\",\"topic\":\"Data leakage\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-baseline\",\"part\":\"m\",\"front\":\"What is a baseline and why do you need one?\",\"back\":\"The dumb or simple solution you compare against: always predict the majority class, the mean, or a business rule.\\n\\nIf your fancy model does not beat that baseline, it adds no value. Always start there: it stops you from celebrating 90% accuracy when 90% of cases were already \\\"no\\\".\",\"topic\":\"Baseline\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-ciclo\",\"part\":\"m\",\"front\":\"What are the steps of an ML project, end to end?\",\"back\":\"1. Define the problem and the business metric.\\n2. Get and clean data (and an honest split).\\n3. Train a baseline, then better models.\\n4. Evaluate on validation/test.\\n5. Deploy (batch or online) and MONITOR: real-world data changes (drift).\\n\\nModel code is one piece; most time goes to data and operations.\",\"topic\":\"Ciclo de vida ML\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
