arlo en producción. Cubre Vertex AI y BigQuery ML, con foco en lo que preguntan los exámenes de ML.\",\"level\":\"De 0 a 100\",\"duration\":\"3 h\",\"modules\":[{\"id\":\"m1\",\"title\":\"Fundamentos de ML\",\"titleEn\":\"ML Fundamentals\",\"description\":\"Qué es un modelo, cómo se entrena y evalúa, y los conceptos que el examen da por supuestos.\",\"objective\":\"Explicar el ciclo completo de un modelo: datos → entrenamiento → evaluación → generalización.\",\"emoji\":\"🌱\",\"cards\":[\"m1-01\",\"m1-02\",\"m1-03\",\"m1-04\",\"m1-05\",\"m1-06\",\"m1-07\",\"m1-08\",\"m1-09\",\"m1-10\"]},{\"id\":\"m2\",\"title\":\"Vertex AI: la plataforma\",\"titleEn\":\"Vertex AI: the platform\",\"description\":\"Model Registry, Pipelines, Feature Store, serving, monitoring y todo el entorno de trabajo.\",\"objective\":\"Diseñar y desplegar un modelo en Vertex AI entendiendo cada pieza de la plataforma.\",\"emoji\":\"🔷\",\"cards\":[\"m2-01\",\"m2-02\",\"m2-03\",\"m2-04\",\"m2-05\",\"m2-06\",\"m2-07\",\"m2-08\",\"m2-09\",\"m2-10\",\"m2-11\",\"m2-12\"]},{\"id\":\"m3\",\"title\":\"BigQuery ML\",\"titleEn\":\"BigQuery ML\",\"description\":\"Entrenar, evaluar, predecir, tunear y monitorizar modelos con SQL puro.\",\"objective\":\"Usar cada función ML.* de BigQuery con criterio y saber cuál pide el escenario.\",\"emoji\":\"🗄️\",\"cards\":[\"m3-01\",\"m3-02\",\"m3-03\",\"m3-04\",\"m3-05\",\"m3-06\",\"m3-07\",\"m3-08\",\"m3-09\",\"m3-10\",\"m3-11\",\"m3-12\",\"m3-13\",\"m3-14\"]},{\"id\":\"m4\",\"title\":\"Datos y entrenamiento en GCP\",\"titleEn\":\"Data and training on GCP\",\"description\":\"Features, pipelines, calidad, etiquetado y las dos vías de entrenamiento: AutoML y custom.\",\"objective\":\"Preparar datos y elegir entre AutoML y entrenamiento custom con criterio.\",\"emoji\":\"🧱\",\"cards\":[\"m4-01\",\"m4-02\",\"m4-03\",\"m4-04\",\"m4-05\",\"m4-06\"]},{\"id\":\"m5\",\"title\":\"Producción: serving, MLOps y monitorización\",\"titleEn\":\"Production: serving, MLOps and monitoring\",\"description\":\"Cómo llevar un modelo a producción y saber si sigue funcionando.\",\"objective\":\"Desplegar, escalar, monitorizar y volver a entrenar un modelo en producción.\",\"emoji\":\"🚀\",\"cards\":[\"m5-01\",\"m5-02\",\"m5-03\",\"m5-04\",\"m5-05\",\"m5-06\",\"m5-07\",\"m5-08\"]},{\"id\":\"m6\",\"title\":\"Preparación del examen\",\"titleEn\":\"Exam preparation\",\"description\":\"Cómo está estructurado, qué confusiones te esperan y qué repasar.\",\"objective\":\"Ir al examen sabiendo qué se pregunta y qué distractores te esperan.\",\"emoji\":\"🎯\",\"cards\":[\"m6-01\",\"m6-02\",\"m6-03\",\"m6-04\",\"m6-05\",\"m6-06\"]}],\"cards\":[{\"id\":\"m1-01\",\"part\":\"m\",\"front\":\"¿Qué es un modelo de aprendizaje automático?\",\"back\":\"Un modelo es una función con parámetros ajustados a partir de datos para generalizar a datos que nunca vio. En ML supervisado se eligen una variable objetivo (lo que quieres predecir) y un conjunto de variables de entrada (las señales disponibles). El entrenamiento ajusta los parámetros minimizando una función de pérdida sobre un conjunto de entrenamiento; la evaluación mide si el modelo generaliza, no si memoriza.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"fundamentos\"]},{\"id\":\"m1-02\",\"part\":\"m\",\"front\":\"¿Cuál es la diferencia entre entrenamiento, validación y test?\",\"back\":\"Son tres conjuntos con papeles distintos. Entrenamiento: ajusta los parámetros. Validación: decide hyperparameters (learning rate, profundidad, regularización) y sirve para el early stopping. Test: mide el rendimiento final y NO debe usarse para ninguna decisión, ni siquiera para elegir hiperparámetros. Si el test participa en el ajuste, la estimación es optimista y el modelo fallará en producción.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"fundamentos\"]},{\"id\":\"m1-03\",\"part\":\"m\",\"front\":\"¿Qué es el sobreajuste (overfitting) y cómo se combate?\",\"back\":\"El sobreajuste ocurre cuando el modelo aprende el ruido del entrenamiento y generaliza mal. Combates: más datos, regularización (L1/L2, dropout), poda de árboles, cross-validation, y early stopping (parar cuando la pérdida de validación deja de mejorar aunque la de entrenamiento siga bajando). La señal clara: la pérdida de entrenamiento baja y la de validación sube.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"fundamentos\",\"overfitting\"]},{\"id\":\"m1-04\",\"part\":\"m\",\"front\":\"¿Qué métricas usaría para un clasificador desbalanceado?\",\"back\":\"En datasets muy desbalanceados la accuracy engaña: con 99 negativos y 1 positivo, acertar siempre da 99%. Usa recall (detectar todos los positivos), precision (poco falso positivo) y F1. Si el coste de los falsos negativos es alto (fraude, diagnóstico), prioriza recall; si el coste de falsos positivos es alto, prioriza precision. También sirve el área bajo la curva ROC y la matriz de confusión para ver los tipos de error.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"metricas\",\"desbalanceo\"]},{\"id\":\"m1-05\",\"part\":\"m\",\"front\":\"¿Qué es la deriva de datos (data drift) y en qué se diferencia del concept drift?\",\"back\":\"Data drift: la distribución de las ENTRADAS cambia con el tiempo (los clientes compran distinto en diciembre). Concept drift: la RELACIÓN entre entradas y salida cambia (el modelo se entrenó con un patrón que ya no vale). Data drift se detecta comparando las features de producción contra el baseline de entrenamiento. Concept drift se detecta viendo cómo cae el performance con las respuestas reales. El drift de datos no siempre implica concept drift, y viceversa.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"drift\",\"produccion\"]},{\"id\":\"m1-06\",\"part\":\"m\",\"front\":\"¿Qué es la validación cruzada (cross-validation)?\",\"back\":\"Consiste en dividir el dataset en K pliegos, entrenar K veces usando cada pliego como validación, y promediar las métricas. Estima la capacidad de generalización con los datos que tienes (útil con datasets pequeños) y reduce el riesgo de elegir un hyperparameters por suerte. En GCP: k-fold cross validation está disponible en el entrenamiento de modelos de BigQuery ML.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"validacion\"]},{\"id\":\"m1-07\",\"part\":\"m\",\"front\":\"¿Qué es un modelo ensembles y por qué suelen ganar los Boosted Trees?\",\"back\":\"Un ensemble combina varios modelos para reducir la varianza y/o el sesgo. Boosted Trees (gradient boosting) construyen una secuencia de árboles donde cada árbol corrige los errores del anterior. Ganan sobre un árbol individual porque reducen el sobreajuste y manejan bien datos tabulares con variables mixtas, sin necesidad de escalar ni normalizar. BigQuery ML los ofrece nativamente con boosting_type ('linear' o 'dart').\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"ensembles\",\"arboles\"]},{\"id\":\"m1-08\",\"part\":\"m\",\"front\":\"¿Qué es un embedding y para qué se usa?\",\"back\":\"Un embedding es un vector numérico denso que representa un objeto (texto, imagen, audio) de modo que la distancia entre vectores refleja la similitud semántica. Sirven para búsqueda semántica, clustering, sistemas de recomendación y como entrada a otros modelos. En BigQuery ML, ML.GENERATE_EMBEDDINGS produce embeddings semánticos a partir de modelos fundacionales integrados, sin extraer tokens manualmente.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"embeddings\"]},{\"id\":\"m1-09\",\"part\":\"m\",\"front\":\"¿Qué significa que un modelo sea interpretable y qué es XAI?\",\"back\":\"Un modelo interpretable explica sus decisiones en términos humanos. XAI (Explainable AI) agrupa las técnicas para explicar predicciones: atribuciones de features (cuánto contribuye cada variable), SHAP values, LIME, y explanations a nivel de modelo vs. instancia. En BigQuery ML, ML.EXPLAIN_PREDICT y ML.GLOBAL_EXPLAIN dan respectively instance-level and model-level explanations. En Vertex AI, Explainable AI expone estas atribuciones vía API.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"xai\",\"interpretabilidad\"]},{\"id\":\"m1-10\",\"part\":\"m\",\"front\":\"¿Qué es el imbalance de clases y cómo lo aborda BigQuery ML?\",\"back\":\"Es la situación en que una clase (normalmente la negativa) domina claramente. En BigQuery ML, los modelos de árboles boosted lo abordan con CLASS_WEIGHTS: equilibra los gradientes de entrenamiento dando más peso a la clase minoritaria, sin necesidad de remuestrear (lo que reduciría el dataset y la información disponible). Alternativas: re-muestreo, functions de pérdida con peso, o sobremuestreo de la minoritaria.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"ml\",\"desbalanceo\",\"bigquery\"]},{\"id\":\"m2-01\",\"part\":\"m\",\"front\":\"¿Qué es Vertex AI y qué servicios de ML ofrece?\",\"back\":\"Vertex AI es la plataforma unificada de Google Cloud para ML de extremo a extremo. Cubre: AutoML (entrenamiento con poco código), modelos preentrenados (Vision, Video, NLP, Translation), entrenamiento personalizado (custom jobs), Feature Store, Model Registry, pipelines, endpoints de serving, tuning de hiperparámetros, Explainable AI y Model Monitoring. Todo con control de acceso IAM integrated, así que los datos nunca salen de tu proyecto.\",\"topic\":\"Vertex AI\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"vertex-ai\",\"fundamentos\"]},{\"id\":\"m2-02\",\"part\":\"m\",\"front\":\"¿Qué es Vertex AI Model Registry y para qué sirve?\",\"back\":\"Es el catálogo central de modelos: guarda cada modelo con su versión, sus metadatos (métricas de evaluación, parámetros de entrenamiento, etiquetas) y su linaje. Permite promover un modelo de EXPERIMENT a un endpoint de producción y hacer rollback a una versión anterior. El flujo habitual es: entrenas (run) → registras (model version) → despliegas (endpoint) → monitoreas.\",\"topic\":\"Model Registry\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"vertex-ai\",\"model-registry\",\"mlops\"]},{\"id\":\"m2-03\",\"part\":\"m\",\"front\":\"¿Qué es Vertex AI Pipelines y por qué se usa en MLOps?\",\"back\":\"Es un motor de orquestación serverless para workflows de ML. Defines el pipeline como un DAG de pasos (Python, BigQuery, entrenamiento, despliegue) y él se encarga de la ejecución, los reintentos, el cacheo y el linaje. Es la forma canónica de automatizar el ciclo «entrenar → evaluar → registrar → desplegar» con las prácticas de MLOps: repetible, versionado y auditable.\",\"topic\":\"Vertex AI Pipelines\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"pipelines\",\"mlops\"]},{\"id\":\"m2-04\",\"part\":\"m\",\"front\":\"¿Qué es Vertex AI Feature Store y qué problema resuelve?\",\"back\":\"Es un servicio de gestión de features: guarda, versiona y sirve las variables de entrada de los modelos. Resuelve el training-serving skew (el desfase entre las features usadas en entrenamiento y las de producción) porque ambos leen de la misma fuente con la misma definición y la misma lógica de materialización. Puede operar en modo online (baja latencia, para serving) y offline (batch, para entrenamiento).\",\"topic\":\"Feature Store\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"feature-store\",\"mlops\"]},{\"id\":\"m2-05\",\"part\":\"m\",\"front\":\"¿Cómo se despliega un modelo en Vertex AI y qué tipos hay?\",\"back\":\"Se despliega en un endpoint (un recurso de serving con una IP/hostname estable). Tipos: 1) pre-trained models sin entrenamiento previo; 2) modelos de AutoML, que despliegan automáticamente su backing model; 3) modelos de training custom, que se sirven con un contenedor con el servidor de predicción y el artefacto del modelo. En este último, el contenedor debe exponer la lógica de predicción (HTTP) y el modelo; el servidor de predicción de Vertex se encarga del escalado.\",\"topic\":\"Model Deployment\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"deployment\",\"serving\"]},{\"id\":\"m2-06\",\"part\":\"m\",\"front\":\"¿Qué es un custom container para serving y qué fichero exige?\",\"back\":\"Cuando entrenas fuera de Vertex (por ejemplo en Cloud Build o en tu propio entorno), empaquetas el modelo en una imagen de contenedor con un Dockerfile. Ese Dockerfile es obligatorio: define la imagen base, las dependencias (requirements.txt) y el comando de arranque del servidor de predicción. El contenedor debe escuchar en el puerto que Vertex le asigne y responder a las peticiones de predicción con el formato esperado.\",\"topic\":\"Custom Container\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"deployment\",\"contenedores\"]},{\"id\":\"m2-07\",\"part\":\"m\",\"front\":\"¿Cómo se logra un despliegue sin downtime en Vertex AI?\",\"back\":\"Desplegando múltiples versiones de modelo en un MISMO endpoint y repartiendo el tráfico entre ellas (traffic splitting). El endpoint tiene una URL estable, así que los clientes no cambian; tú cambias el reparto de tráfico (100% a la nueva versión, por ejemplo) y luego retiras la anterior. Es un rollout canario: pruebas con un porcentaje small de tráfico real antes de moverlo todo.\",\"topic\":\"Model Deployment\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"deployment\",\"produccion\"]},{\"id\":\"m2-08\",\"part\":\"m\",\"front\":\"¿Qué es Vertex AI Model Monitoring y qué detecta?\",\"back\":\"Es el servicio que vigila los modelos desplegados. Detecta tres cosas: data drift (las features de entrada de producción se desvían de la baseline de entrenamiento), prediction drift (la distribución de las predicciones cambia) y training-serving skew (las features en producción difieren de las de entrenamiento). Se configura por endpoint con umbrales y ventanas; cuando los supera, genera alertas. Es la respuesta directa a '¿mi modelo se está degradando?'.\",\"topic\":\"Model Monitoring\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"monitoring\",\"drift\"]},{\"id\":\"m2-09\",\"part\":\"m\",\"front\":\"¿Qué es Vertex AI Workbench y en qué se diferencia de Colab?\",\"back\":\"Ambos son entornos de desarrollo para ML. Workbench es una instancia de notebook Jupyter gestionada (basada en Compute Engine o en Vertex AI) con control de acceso, red y datos controlados por el proyecto: es la opción para trabajo sensible. Colab es más ligero y colaborativo, pensado para prototipos rápidos. En un entorno de empresa con datos regulados, la respuesta es Workbench.\",\"topic\":\"Workbench\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"vertex-ai\",\"workbench\",\"desarrollo\"]},{\"id\":\"m2-10\",\"part\":\"m\",\"front\":\"¿Qué es el tuning de hiperparámetros en Vertex AI?\",\"back\":\"Es la búsqueda automática de la mejor configuración del modelo (learning rate, número de árboles, regularización). Vertex AI lo implementa como un hyperparameter tuning job que lanza múltiples trials en paralelo, con dos estrategias: random search (muestreo aleatorio) y Bayesian optimization (aprovecha lo aprendido en trials anteriores para Sample mejor). El job elige la mejor configuración según la métrica que le indiques.\",\"topic\":\"Hyperparameter Tuning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"tuning\",\"hiperparametros\"]},{\"id\":\"m2-11\",\"part\":\"m\",\"front\":\"¿Qué hace Vertex AI Explainable AI?\",\"back\":\"Proporciona explicaciones de las predicciones de un modelo: para una instancia concreta, qué features contribuyeron y en qué dirección (attribution values). Se obtiene vía la API de explanation al predecir con el endpoint, y para modelos que lo soportan, con las explainability features activadas. Para Feature Store también hay SHAP values, que explican una predicción usando el modelo y las features almacenadas. Es la herramienta para auditar decisiones de modelos.\",\"topic\":\"Explainable AI\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"xai\",\"interpretabilidad\"]},{\"id\":\"m2-12\",\"part\":\"m\",\"front\":\"¿Qué es la etiqueta automática (AutoML labeling) y cuándo se usa?\",\"back\":\"Es un servicio de Vertex AI que genera etiquetas para datasets de imágenes, vídeo o texto usando modelos preentrenados, y con ese etiquetado puedes entrenar tu propio modelo. Ejemplo típico: etiquetar automáticamente imágenes de un producto para luego entrenar un clasificador propio. Reduce mucho el coste de anotación manual, aunque la calidad final hay que revisarla.\",\"topic\":\"AutoML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"autolabel\",\"datasets\"]},{\"id\":\"m3-01\",\"part\":\"m\",\"front\":\"¿Qué es BigQuery ML y cuándo conviene usarlo?\",\"back\":\"BigQuery ML permite crear, entrenar, evaluar y desplegar modelos con SQL puro, sin mover los datos fuera de BigQuery. Es ideal cuando los datos ya están en BigQuery: el modelo se entrena y se infiere in-situ, sin exportar a BigQuery Storage, sin pipelines deETL y sin coste de serving gestionado aparte. Modelos disponibles: LINEAR_REGRESSION, LOGISTIC_REGRESSION, KMEANS, MATRIX_FACTORIZATION, DNN_CLASSIFIER, boosted trees (DART/linear) y más.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery\",\"fundamentos\"]},{\"id\":\"m3-02\",\"part\":\"m\",\"front\":\"¿Cómo se entrena un modelo en BigQuery ML?\",\"back\":\"Con CREATE MODEL, indicando el modelo (model_type), la tabla o consulta de entrenamiento (SELECT...), y el objetivo (LABEL_COLUMNS o NULL para no supervisado). Opciones clave: INPUT_LABEL_COLUMNS, DATA_SPLIT_COL (para cross validation), OPTIMIZE_STRATEGY ('BATCH_GRADIENT_DESCENT', 'NORMAL_EQUATION', 'LINEAR_REGRESSION'), L1_REG / L0_REG, y opciones de hiperparámetros como MAX_TREE_DEPTH, LEARNING_RATE, NUM_TRIALS o DATA_SPLIT_METHOD ('CUSTOM', 'RANDOM', 'AUTO', 'K_FOLD').\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"entrenamiento\"]},{\"id\":\"m3-03\",\"part\":\"m\",\"front\":\"¿Qué hace la función ML.PREDICT?\",\"back\":\"Es la función para hacer predicciones con un modelo ya entrenado en BigQuery ML. SELECT ML.PREDICT(MODEL `proyecto.dataset.modelo`, (SELECT ...)) devuelve las predicciones junto con las features de entrada. BigQuery gestiona el serving: no hay endpoint que mantener, y el modelo se aplica directamente sobre los datos de la consulta. Para más control sobre el preprocesado, existe ML.PREDICT con la tabla MODEL::feature.column en el SELECT.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery\",\"prediccion\"]},{\"id\":\"m3-04\",\"part\":\"m\",\"front\":\"¿Qué hace ML.EVALUATE y qué devuelve?\",\"back\":\"Evalúa un modelo entrenado sobre un conjunto de datos y devuelve las métricas de desempeño: para regresión, error medio absoluto, error cuadrático medio y R²; para clasificación, exactitud, precision, recall y F1. Se usa con CREATE OR REPLACE TABLE ... AS SELECT ML.EVALUATE(MODEL ...) para persistir el resultado y poder compararlo entre versiones del modelo. ML.EVALUATE también acepta las mismas opciones de calibración y umbrales que ML.PREDICT.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"evaluacion\",\"metricas\"]},{\"id\":\"m3-05\",\"part\":\"m\",\"front\":\"¿Qué es ML.TUNE y cómo automatiza la selección de modelo?\",\"back\":\"ML.TUNE ejecuta múltiples configuraciones de hiperparámetros dentro de la sentencia CREATE MODEL y se queda automáticamente con la mejor según la métrica de evaluación. Se activa con el argumento HYPERPARAMETER_TUNING en CREATE MODEL (o CREATE MODEL ... OPTIONS(hyperparameter_tuning=...)) y se controla con MAX_TRIALS, y con la estrategia: 'RANDOM_SEARCH' o 'BAYESIAN_OPTIMIZATION'. Es la forma nativa de hacer tuning en BigQuery ML, sin Vertex AI.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"tuning\",\"hiperparametros\"]},{\"id\":\"m3-06\",\"part\":\"m\",\"front\":\"¿Qué es ML.DETECT_DRIFT y qué problema resuelve?\",\"back\":\"Compara la distribución de los datos de entrada actuales contra la baseline con la que se entrenó el modelo, y devuelve la diferencia estadística por feature. Sirve para vigilar en producción si el mundo ha cambiado (un producto nuevo, un cambio de comportamiento de los usuarios) antes de que el modelo se degrade. ML.DETECT_DRIFT devuelve las features con mayor desviación y permite fijar un umbral (THRESHOLD) para filtrar el ruido estadístico. También sirve para vigilar la deriva de las predicciones.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"drift\",\"monitoring\"]},{\"id\":\"m3-07\",\"part\":\"m\",\"front\":\"¿Qué es ML.VALIDATE_FEATURES y por qué importa?\",\"back\":\"Valida que las features de entrada de una tabla tengan el mismo tipo y el mismo rango que las usadas en el entrenamiento. Detecta el data drift y el training-serving skew antes de que lleguen al modelo: si una feature de producción llega con tipos distintos o valores fuera de rango, la predicción será basura y no sabrás por qué. Es una comprobación de contrato de datos entre entrenamiento y serving.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"drift\",\"calidad-datos\"]},{\"id\":\"m3-08\",\"part\":\"m\",\"front\":\"¿Qué es ML.GENERATE_EMBEDDINGS?\",\"back\":\"Genera embeddings semánticos usando modelos fundacionales integrados en BigQuery ML. Recibe texto (o contenido) y devuelve vectores densos que capturan el significado, no el simple recuento de tokens. A diferencia de ML.TEXT_TOKENIZE (que solo tokeniza y no da semántica) o de los hashes (que aproximan sin significado), los embeddings de esta función son de alta calidad semántica y sirven para clustering, búsqueda por similitud o como entrada de otros modelos. Está detrás de Vertex AI Text Embeddings.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"embeddings\",\"vertex-ai\"]},{\"id\":\"m3-09\",\"part\":\"m\",\"front\":\"¿Qué es ML.FEATURE_INFO?\",\"back\":\"Devuelve información sobre las features de un modelo: los tipos de datos de entrada, las transformaciones aplicadas y el esquema de entrenamiento. Es la herramienta para inspeccionar la configuración y la arquitectura de un modelo ya entrenado, sin adivinar. Sirve para auditar cómo se procesó cada variable, depurar problemas de tipos o rangos, y documentar el modelo. ML.GLOBAL_EXPLAIN y ML.LOCAL_EXPLAIN se centran en las explicaciones del modelo, no en su estructura.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"xai\",\"inspeccion\"]},{\"id\":\"m3-10\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre ML.GLOBAL_EXPLAIN y ML.LOCAL_EXPLAIN?\",\"back\":\"GLOBAL_EXPLAIN da la importancia de cada feature para el modelo en conjunto (agregada sobre el dataset): 'el precio pesa más que el tamaño'. LOCAL_EXPLAIN da la explicación de una predicción concreta: 'para ESTA casa de 3 dormitorios, el tamaño pesó más que la edad'. En el examen: si la pregunta habla de la importancia global de las variables, es GLOBAL_EXPLAIN; si habla de por qué se tomó una decisión concreta para una instancia, es LOCAL_EXPLAIN (o ML.EXPLAIN_PREDICT en su forma de fila).\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"xai\",\"interpretabilidad\"]},{\"id\":\"m3-11\",\"part\":\"m\",\"front\":\"¿Qué es ML.WEIGHTS y para qué se usa?\",\"back\":\"Devuelve los pesos (coeficientes) del modelo entrenado, cuando el modelo lo soporta. Sirve para interpretar el modelo (el signo y la magnitud de cada peso), para verificar que los coeficientes tienen sentido, y para auditar o depurar el entrenamiento. No todos los modelos exponen pesos: por ejemplo, los modelos de boosted trees no tienen coeficientes lineales equivalentes.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"interpretabilidad\"]},{\"id\":\"m3-12\",\"part\":\"m\",\"front\":\"¿Qué es ML.THRESHOLD_EVALUATE?\",\"back\":\"Evalúa un modelo de clasificación binaria variando el umbral de decisión y devuelve, para cada umbral, las métricas de clasificación (precision, recall, F1, exactitud). Sirve para elegir el punto de corte Operating Point que mejor encaje con el coste de los falsos positivos frente a los falsos negativos, en vez de usar el 0.5 por defecto. Es la herramienta para afinar la decisión de un clasificador ya entrenado, sin reentrenar.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"evaluacion\",\"metricas\"]},{\"id\":\"m3-13\",\"part\":\"m\",\"front\":\"¿Qué es ML.COMPARE y cuándo se usa?\",\"back\":\"Compara dos modelos entrenados sobre el mismo conjunto de datos y devuelve las métricas de evaluación de ambos, para decidir cuál desplegar. Se usa en la fase de comparación tras entrenar alternativas (por ejemplo, un modelo con regularización frente a otro sin ella, o antes y después de un ajuste de hiperparámetros). Devuelve las métricas lado a lado, lo que permite decidir con datos en vez de por intuición.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"evaluacion\"]},{\"id\":\"m3-14\",\"part\":\"m\",\"front\":\"¿Qué es ML.BOOM (o el prefijo ML.BOOM en las funciones de BigQuery ML)?\",\"back\":\"En las funciones de BigQuery ML el prefijo ML. agrupa las operaciones de machine learning sobre modelos: ML.PREDICT, ML.EVALUATE, ML.TUNE, ML.DETECT_DRIFT, ML.VALIDATE_FEATURES, ML.GENERATE_EMBEDDINGS, ML.FEATURE_INFO, ML.WEIGHTS, ML.GLOBAL_EXPLAIN, ML.LOCAL_EXPLAIN, ML.EXPLAIN_PREDICT, ML.THRESHOLD_EVALUATE, ML.COMPARE, ML.BOOM_BOOSTED_TREE, ML.RUN, ML.DETECT, ML.GENERATE. Reconocer este conjunto es clave: el examen pregunta mucho por «qué función uso para X», y la respuesta suele ser un nombre de función exacto de esta lista.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery\",\"funciones\"]},{\"id\":\"m4-01\",\"part\":\"m\",\"front\":\"¿Qué es el Feature Engineering y por qué decide el resultado del modelo?\",\"back\":\"Es transformar los datos crudos en variables que el modelo pueda usar. Un buen feature suele aportar más que un modelo sofisticado: un modelo simple con features débiles rinde peor que uno simple con features fuertes. En GCP el soporte viene de BigQuery (SQL para derivar features), Vertex AI Feature Store (versionado y reutilización) y AutoML Feature Engineering (derivación automática de features desde BigQuery).\",\"topic\":\"Feature Engineering\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"features\",\"datos\"]},{\"id\":\"m4-02\",\"part\":\"m\",\"front\":\"¿Qué es un pipeline de datos y qué herramientas de GCP lo componen?\",\"back\":\"Un pipeline de datos recoge, transforma y carga datos de forma reproducible y monitorizada. En GCP: Dataflow (Apache Beam, streaming y batch) para el procesamiento; Dataproc (Spark/Hadoop) para jobs de MapReduce a escala; BigQuery para el almacenamiento analítico; Data Fusion para orquestar visualmente; y Pub/Sub + Dataflow para el tiempo real. BigQuery Dataflow template y Dataflow SQL son atajos para cargasELT desde GCP hacia BigQuery.\",\"topic\":\"Data Pipeline\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"dataflow\",\"bigquery\"]},{\"id\":\"m4-03\",\"part\":\"m\",\"front\":\"¿Qué es la calidad de datos y cómo se controla en GCP?\",\"back\":\"Es el grado en el que los datos son aptos para su uso: correctos, completos, consistentes, timely y únicos. En GCP se controla con Data Catalog (metadatos y descubrimiento), Dataplex Universal Catalog (gobierno y linaje), BigQuery para las validaciones en SQL, y DLP para detectar y enmascarar datos sensibles. BigQuery ML añade ML.VALIDATE_FEATURES para verificar el contrato entre entrenamiento y serving.\",\"topic\":\"Data Quality\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"calidad-datos\",\"gobierno\"]},{\"id\":\"m4-04\",\"part\":\"m\",\"front\":\"¿Cómo se etiquetan los datos para entrenar un modelo?\",\"back\":\"El etiquetado asigna la variable objetivo. Puede ser manual (anotadores humanos, con herramientas como Video Intelligence o Labelbox), automático (AutoML labeling, que usa modelos preentrenados), o derivado de un sistema existente (etiqueta débil inferida: por ejemplo, una compra como etiqueta de 'producto que gusta'). La calidad del etiquetado suele ser el techo del modelo: etiquetas ruidosas limitan cualquier algoritmo.\",\"topic\":\"Data Labeling\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"etiquetado\"]},{\"id\":\"m4-05\",\"part\":\"m\",\"front\":\"¿Qué es el AutoML de Vertex AI y qué modelos ofrece?\",\"back\":\"Vertex AI AutoML entrena modelos de alto rendimiento sin escribir código de entrenamiento, optimizando el pipeline de features. Cubre: clasificación de imágenes, detección de objetos, segmentación, forecasting, regresión y clasificación de tablas, y además permite AutoML para modelos de lenguaje (fine-tuning). Para datos tabulares hace preprocesamiento y tuning automáticos; para imágenes, tabula los labels y entrena. Es la vía rápida cuando no controlas el modelo pero sí los datos.\",\"topic\":\"AutoML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"autolml\"]},{\"id\":\"m4-06\",\"part\":\"m\",\"front\":\"¿Qué es un custom job y cuándo lo necesitas en vez de AutoML?\",\"back\":\"Un custom job es una tarea de entrenamiento con código propio (Python, con preinstalled frameworks como TensorFlow, PyTorch, XGBoost o scikit-learn, o un contenedor). Se necesita cuando requieres control total: una arquitectura personalizada, una loss function a medida, el preprocesamiento de datos que AutoML no hace, o integración con tu propio framework. A cambio, tú gestionas la reproducibilidad y el escalado del entrenamiento.\",\"topic\":\"Custom Job\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"entrenamiento\",\"custom\"]},{\"id\":\"m5-01\",\"part\":\"m\",\"front\":\"¿Qué es MLOps y por qué no basta con entrenar un modelo?\",\"back\":\"MLOps es la práctica de integrar el desarrollo de ML con operaciones: código, datos, modelos y serving versionados, despliegue automatizado y monitorización continua. Sin MLOps, el «modelo ganador» se queda en un notebook y nunca llega a producción, o llega y nadie sabe si se está degradando. Vertex AI cubre el ciclo con Pipelines, Model Registry, endpoints y Model Monitoring.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"mlops\",\"produccion\"]},{\"id\":\"m5-02\",\"part\":\"m\",\"front\":\"¿Qué es el CI/CD de modelos y cómo se implementa en GCP?\",\"back\":\"Es aplicar al pipeline de ML los principios de integración y entrega continua: cada cambio en código o datos dispara un pipeline que reentrena, evalúa y, si las métricas superan el umbral, despliega automáticamente. En GCP se apoya en Vertex AI Pipelines para la orquestación, Cloud Build o GitHub Actions para la integración continua, Artifact Registry para las imágenes y Cloud Deploy para el rollout. La clave: el despliegue lo decide una métrica, no una intuición.\",\"topic\":\"CI/CD\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"mlops\",\"ci-cd\",\"vertex-ai\"]},{\"id\":\"m5-03\",\"part\":\"m\",\"front\":\"¿Qué es el batch prediction y cuándo se usa frente al online?\",\"back\":\"El batch prediction aplica el modelo a un conjunto grande de datos en un solo proceso programado, sin serving en tiempo real. Se usa para scoredatasets históricos, para generar embeddings en bloque o para procesos nocturnos. En Vertex AI es un batch prediction job con un modelo y un conjunto de entrada; en BigQuery ML es simplemente un SELECT ML.PREDICT sobre la tabla. La contraposición es el online serving, para peticiones punto a punto.\",\"topic\":\"Batch Prediction\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"prediccion\",\"vertex-ai\",\"bigquery\"]},{\"id\":\"m5-04\",\"part\":\"m\",\"front\":\"¿Qué es el escalado automático de un endpoint de Vertex AI?\",\"back\":\"El endpoint escala automáticamente las réplicas según la carga: ante un pico de peticiones, añade instancias; en calma, las reduce (hasta el mínimo configurado). Esto te permite fijar un mínimo para cubrir la latencia y un máximo para acotar el coste, sin gestionar infraestructura. El autoscaling por Vertex se basa en la concurrencia de peticiones, no solo en la CPU.\",\"topic\":\"Autoscaling\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"serving\",\"produccion\"]},{\"id\":\"m5-05\",\"part\":\"m\",\"front\":\"¿Qué es el skew de entrenamiento-serving y cómo se evita?\",\"back\":\"Es la divergencia entre las features con las que se entrenó el modelo y las que llegan en producción: el modelo se entrenó con 'edad' en años y en producción llega en meses. Produce predicciones silenciosamente incorrectas. Se evita con Feature Store (misma definición y materialización para ambos caminos), con ML.VALIDATE_FEATURES (comprobación de tipos y rangos) y con pipelines que compartan la lógica de transformación.\",\"topic\":\"Skew\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"skew\",\"feature-store\",\"produccion\"]},{\"id\":\"m5-06\",\"part\":\"m\",\"front\":\"¿Qué es la seguridad de un modelo en GCP?\",\"back\":\"El modelo es un activo que hay que proteger: Vertex AI Model Registry y los endpoints heredan el control de acceso IAM del proyecto (quién puede desplegar, ver o borrar modelos), Cloud Audit Logs registra quién hizo qué, Artifact Registry protege las imágenes de entrenamiento, y Vertex AI Workbench con VPC Service Controls o CMEK puede aislar los datos. En el examen: la respuesta es siempre «IAM y auditoría del proyecto», no un cifrado propio.\",\"topic\":\"Model Security\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"seguridad\",\"iam\",\"gobierno\"]},{\"id\":\"m5-07\",\"part\":\"m\",\"front\":\"¿Qué es la latencia de predicción y cómo se controla?\",\"back\":\"Es el tiempo entre la petición y la respuesta del modelo. En un endpoint de Vertex AI se controla con el número mínimo de réplicas (más réplicas, menos cola de espera), con el tipo de máquina (más CPU o GPU, menos latencia) y con el AutoML serving choice: la predicción online puede servirse con accelerators (GPU/TPU) para inferencia rápida. BigQuery ML no tiene este problema: la predicción se ejecuta como una query, sin serving gestionado.\",\"topic\":\"Prediction Latency\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"serving\",\"rendimiento\"]},{\"id\":\"m5-08\",\"part\":\"m\",\"front\":\"¿Qué diferencias hay entre Vertex AI y BigQuery ML en la práctica?\",\"back\":\"BigQuery ML: SQL puro, los datos no se mueven, sin serving que gestionar, ideal para prototipos, tabulares y scoring masivo. Limitaciones: menos control del entrenamiento, sin endpoints, sin online serving de baja latencia. Vertex AI: control total del entrenamiento, endpoints para serving online, pipelines, registry, monitoring, Workbench,AutoML; a cambio, más complejidad y (a menudo) mover los datos. Regla práctica: empieza en BigQuery ML si el problema es tabular y batch; sube a Vertex AI cuando necesites serving online, control del training o MLOps maduro.\",\"topic\":\"Vertex AI vs BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"bigquery\",\"arquitectura\"]},{\"id\":\"m6-01\",\"part\":\"m\",\"front\":\"¿Cómo se estructura el examen Google Professional Machine Learning Engineer?\",\"back\":\"Es un examen de 50 a 60 preguntas de opción múltiple, en 120 minutos, con un 50% de respuestas correctas para aprobar. Las preguntas cubren: diseño de sistemas de ML (30%), preparación y análisis de datos (20%), creación y despliegue de modelos (35%), y monitorización y понима de pipelines de ML (15%). En la versión de práctica aparecen preguntas de BigQuery ML y de Vertex AI, y los distractores son servicios parecidos (Dataflow vs Vertex AI Pipelines, BigQuery vs Dataproc).\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"examen\",\"estrategia\"]},{\"id\":\"m6-02\",\"part\":\"m\",\"front\":\"¿Qué confusiones estructuran más los distractores del examen?\",\"back\":\"Las tres más frecuentes: (1) Dataflow vs Vertex AI Pipelines — Dataflow procesa datos, Pipelines orquesta workflows de ML; (2) BigQuery vs Dataproc — BigQuery es analítica serverless, Dataproc es Spark/Hadoop gestionado; (3) Cloud Storage vs BigQuery Storage — el primero almacena objetos (modelos, datasets), el segundo es una tabla analítica. Resolver cada una de estas pares antes del examen elimina la mayoría de las trampas.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"examen\",\"estrategia\"]},{\"id\":\"m6-03\",\"part\":\"m\",\"front\":\"¿Cómo se responde una pregunta de '¿qué función uso para X' en BigQuery ML?\",\"back\":\"Con la lista cerrada de funciones ML.*. Mapea la intención a la función: predecir → ML.PREDICT; evaluar desempeño → ML.EVALUATE; comparar modelos → ML.COMPARE; elegir umbral → ML.THRESHOLD_EVALUATE; afinar hiperparámetros → ML.TUNE; detectar drift → ML.DETECT_DRIFT; validar features → ML.VALIDATE_FEATURES; embeddings → ML.GENERATE_EMBEDDINGS; inspeccionar el modelo → ML.FEATURE_INFO; pesos → ML.WEIGHTS; importancia global → ML.GLOBAL_EXPLAIN; explicación de una instancia → ML.LOCAL_EXPLAIN o ML.EXPLAIN_PREDICT.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"examen\",\"bigquery\",\"estrategia\"]},{\"id\":\"m6-04\",\"part\":\"m\",\"front\":\"¿Cuál es la diferencia clave entre Vertex AI y BigQuery ML en el examen?\",\"back\":\"La pregunta tipo es: '¿cuál servicio usarías para X?'. Si X es serving online de un modelo entrenado a medida, orchestration de pipelines, gestión de versiones de modelos o monitorización de drift: Vertex AI. Si X es entrenar y predecir sobre datos que ya están en BigQuery, sin moverlos y sin gestionar serving: BigQuery ML. La respuesta de Vertex AI lleva a los Model Registry, endpoints, pipelines y monitoring; la de BigQuery ML lleva a las funciones ML.* y CREATE MODEL.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"examen\",\"vertex-ai\",\"bigquery\"]},{\"id\":\"m6-05\",\"part\":\"m\",\"front\":\"¿Qué preguntas de 'monitorización' hay que esperar en el examen?\",\"back\":\"Tres familias. (1) Detección de drift: Vertex AI Model Monitoring (data drift, prediction drift, training-serving skew) y, en BigQuery, ML.DETECT_DRIFT. (2) Verificación de la coherencia de features: ML.VALIDATE_FEATURES. (3) Gestión del ciclo de vida: reentrenamiento programado con Vertex AI Pipelines, actualización de modelos vía traffic splitting y Model Registry. Si la pregunta menciona 'los datos de producción se parecen a los de entrenamiento', la respuesta es validación de features o monitoring, nunca 'reentrenar'.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"examen\",\"monitoring\",\"drift\"]},{\"id\":\"m6-06\",\"part\":\"m\",\"front\":\"¿Qué temas de fundamentals son prerrequisito de este examen?\",\"back\":\"El examen asume que sabes estadística y probabilidad básicas (media, varianza, distribución, correlación, significación), programación en Python, y los conceptos de ML que aquí se repasan: sesgo y varianza, función de pérdida, gradiente, regularización, aprendizaje supervisado, no supervisado y por refuerzo. También los fundamentos de SQL y el modelo de datos relacional, porque BigQuery ML se expresa en SQL. Si te sientes flojo en alguno de estos dos bloques (estadística y SQL), repítelos antes de entrar en los servicios de GCP.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"examen\",\"fundamentos\"]}]},\"deckEn\":{\"quizId\":\"gcp-ml-course\",\"quizTitle\":\"Machine Learning from 0 to 100\",\"cardCount\":56,\"kind\":\"standalone\",\"category\":\"machine-learning\",\"emoji\":\"🎓\",\"description\":\"A complete ML course on GCP: from what a model is to monitoring it in production. Covers Vertex AI and BigQuery ML, focused on what the ML exams actually ask.\",\"level\":\"De 0 a 100\",\"duration\":\"3 h\",\"modules\":[{\"id\":\"m1\",\"title\":\"ML Fundamentals\",\"titleEn\":\"ML Fundamentals\",\"description\":\"Qué es un modelo, cómo se entrena y evalúa, y los conceptos que el examen da por supuestos.\",\"objective\":\"Explicar el ciclo completo de un modelo: datos → entrenamiento → evaluación → generalización.\",\"emoji\":\"🌱\",\"cards\":[\"m1-01\",\"m1-02\",\"m1-03\",\"m1-04\",\"m1-05\",\"m1-06\",\"m1-07\",\"m1-08\",\"m1-09\",\"m1-10\"]},{\"id\":\"m2\",\"title\":\"Vertex AI: the platform\",\"titleEn\":\"Vertex AI: the platform\",\"description\":\"Model Registry, Pipelines, Feature Store, serving, monitoring y todo el entorno de trabajo.\",\"objective\":\"Diseñar y desplegar un modelo en Vertex AI entendiendo cada pieza de la plataforma.\",\"emoji\":\"🔷\",\"cards\":[\"m2-01\",\"m2-02\",\"m2-03\",\"m2-04\",\"m2-05\",\"m2-06\",\"m2-07\",\"m2-08\",\"m2-09\",\"m2-10\",\"m2-11\",\"m2-12\"]},{\"id\":\"m3\",\"title\":\"BigQuery ML\",\"titleEn\":\"BigQuery ML\",\"description\":\"Entrenar, evaluar, predecir, tunear y monitorizar modelos con SQL puro.\",\"objective\":\"Usar cada función ML.* de BigQuery con criterio y saber cuál pide el escenario.\",\"emoji\":\"🗄️\",\"cards\":[\"m3-01\",\"m3-02\",\"m3-03\",\"m3-04\",\"m3-05\",\"m3-06\",\"m3-07\",\"m3-08\",\"m3-09\",\"m3-10\",\"m3-11\",\"m3-12\",\"m3-13\",\"m3-14\"]},{\"id\":\"m4\",\"title\":\"Data and training on GCP\",\"titleEn\":\"Data and training on GCP\",\"description\":\"Features, pipelines, calidad, etiquetado y las dos vías de entrenamiento: AutoML y custom.\",\"objective\":\"Preparar datos y elegir entre AutoML y entrenamiento custom con criterio.\",\"emoji\":\"🧱\",\"cards\":[\"m4-01\",\"m4-02\",\"m4-03\",\"m4-04\",\"m4-05\",\"m4-06\"]},{\"id\":\"m5\",\"title\":\"Production: serving, MLOps and monitoring\",\"titleEn\":\"Production: serving, MLOps and monitoring\",\"description\":\"Cómo llevar un modelo a producción y saber si sigue funcionando.\",\"objective\":\"Desplegar, escalar, monitorizar y volver a entrenar un modelo en producción.\",\"emoji\":\"🚀\",\"cards\":[\"m5-01\",\"m5-02\",\"m5-03\",\"m5-04\",\"m5-05\",\"m5-06\",\"m5-07\",\"m5-08\"]},{\"id\":\"m6\",\"title\":\"Exam preparation\",\"titleEn\":\"Exam preparation\",\"description\":\"Cómo está estructurado, qué confusiones te esperan y qué repasar.\",\"objective\":\"Ir al examen sabiendo qué se pregunta y qué distractores te esperan.\",\"emoji\":\"🎯\",\"cards\":[\"m6-01\",\"m6-02\",\"m6-03\",\"m6-04\",\"m6-05\",\"m6-06\"]}],\"cards\":[{\"id\":\"m1-01\",\"part\":\"m\",\"front\":\"What is a machine learning model?\",\"back\":\"A model is a function whose parameters are fitted from data so that it generalizes to data it never saw. In supervised learning you pick a target variable (what you want to predict) and a set of input features (the signals available). Training adjusts the parameters by minimizing a loss function over a training set; evaluation measures whether the model generalizes rather than memorizes.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"fundamentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-02\",\"part\":\"m\",\"front\":\"What is the difference between training, validation and test sets?\",\"back\":\"Three sets with different roles. Training fits the parameters. Validation decides hyperparameters (learning rate, depth, regularization) and drives early stopping. Test measures final performance and must NOT be used for any decision, not even to pick hyperparameters. If the test set influences tuning, the estimate is optimistic and the model will fail in production.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"fundamentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-03\",\"part\":\"m\",\"front\":\"What is overfitting and how do you fight it?\",\"back\":\"Overfitting happens when the model learns the training noise and generalizes badly. Countermeasures: more data, regularization (L1/L2, dropout), tree pruning, cross-validation, and early stopping (halt when validation loss stops improving even if training loss keeps falling). The clear signal: training loss goes down while validation loss goes up.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"fundamentos\",\"overfitting\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-04\",\"part\":\"m\",\"front\":\"Which metrics would you use for an imbalanced classifier?\",\"back\":\"With very imbalanced data, accuracy misleads: with 99 negatives and 1 positive, always guessing gives 99%. Use recall (catch all positives), precision (few false positives) and F1. If false negatives are costly (fraud, diagnosis), favour recall; if false positives are costly, favour precision. The ROC AUC and the confusion matrix (to see which error types dominate) also help.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"metricas\",\"desbalanceo\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-05\",\"part\":\"m\",\"front\":\"What is data drift and how does it differ from concept drift?\",\"back\":\"Data drift: the distribution of the INPUTS changes over time (customers buy differently in December). Concept drift: the RELATIONSHIP between inputs and output changes (the model learned a pattern that no longer holds). Data drift is detected by comparing production features against the training baseline. Concept drift shows up as performance decay once ground truth arrives. Data drift does not always imply concept drift, nor the other way round.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"drift\",\"produccion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-06\",\"part\":\"m\",\"front\":\"What is cross-validation?\",\"back\":\"Split the dataset into K folds, train K times using each fold as the validation set, and average the metrics. It estimates generalization from the data you actually have (useful for small datasets) and reduces the risk of picking hyperparameters by luck. On GCP, k-fold cross validation is available in BigQuery ML model training.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"validacion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-07\",\"part\":\"m\",\"front\":\"What is an ensemble, and why do boosted trees usually win?\",\"back\":\"An ensemble combines several models to reduce variance and/or bias. Boosted trees (gradient boosting) build a sequence of trees where each one corrects the previous one's errors. They beat a single tree because they reduce overfitting and handle mixed tabular features well, with no need to scale or normalize. BigQuery ML provides them natively with boosting_type ('linear' or 'dart').\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"ensembles\",\"arboles\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-08\",\"part\":\"m\",\"front\":\"What is an embedding and what is it used for?\",\"back\":\"An embedding is a dense numeric vector representing an object (text, image, audio) such that distance between vectors reflects semantic similarity. They power semantic search, clustering, recommendation systems, and act as inputs to other models. In BigQuery ML, ML.GENERATE_EMBEDDINGS produces semantic embeddings from integrated foundation models, without manually extracting tokens.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"embeddings\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-09\",\"part\":\"m\",\"front\":\"What does it mean for a model to be interpretable, and what is XAI?\",\"back\":\"An interpretable model explains its decisions in human terms. XAI (Explainable AI) covers the techniques for explaining predictions: feature attributions (how much each variable contributed), SHAP values, LIME, and model-level vs. instance-level explanations. In BigQuery ML, ML.EXPLAIN_PREDICT and ML.GLOBAL_EXPLAIN give instance-level and model-level explanations respectively. In Vertex AI, Explainable AI exposes those attributions through the API.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"xai\",\"interpretabilidad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-10\",\"part\":\"m\",\"front\":\"What is class imbalance and how does BigQuery ML handle it?\",\"back\":\"It is the situation where one class (usually the negative) clearly dominates. In BigQuery ML, boosted tree models address it with CLASS_WEIGHTS, which rebalances the training gradients by giving the minority class more weight without resampling (which would shrink the dataset and lose information). Alternatives: re-sampling, weighted loss functions, or over-sampling the minority class.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"ml\",\"desbalanceo\",\"bigquery\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-01\",\"part\":\"m\",\"front\":\"What is Vertex AI and which ML services does it offer?\",\"back\":\"Vertex AI is Google Cloud's unified platform for end-to-end ML. It covers AutoML (low-code training), pre-trained models (Vision, Video, NLP, Translation), custom training (custom jobs), Feature Store, Model Registry, pipelines, serving endpoints, hyperparameter tuning, Explainable AI and Model Monitoring. Everything is under integrated IAM access control, so data never leaves your project.\",\"topic\":\"Vertex AI\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"vertex-ai\",\"fundamentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-02\",\"part\":\"m\",\"front\":\"What is Vertex AI Model Registry and what is it for?\",\"back\":\"It is the central model catalog: it stores each model with its version, metadata (evaluation metrics, training parameters, labels) and lineage. It lets you promote a model from EXPERIMENT to a production endpoint and roll back to an earlier version. The usual flow is: train (run) → register (model version) → deploy (endpoint) → monitor.\",\"topic\":\"Model Registry\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"vertex-ai\",\"model-registry\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-03\",\"part\":\"m\",\"front\":\"What is Vertex AI Pipelines and why is it used in MLOps?\",\"back\":\"It is a serverless orchestration engine for ML workflows. You define the pipeline as a DAG of steps (Python, BigQuery, training, deployment) and it handles execution, retries, caching and lineage. It is the canonical way to automate the 'train → evaluate → register → deploy' cycle with MLOps practices: repeatable, versioned and auditable.\",\"topic\":\"Vertex AI Pipelines\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"pipelines\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-04\",\"part\":\"m\",\"front\":\"What is Vertex AI Feature Store and what problem does it solve?\",\"back\":\"It is a feature management service: it stores, versions and serves the models' input features. It solves training-serving skew (the mismatch between training features and production features) because both read from the same source with the same definition and materialization logic. It runs in online mode (low latency, for serving) and offline mode (batch, for training).\",\"topic\":\"Feature Store\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"feature-store\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-05\",\"part\":\"m\",\"front\":\"How do you deploy a model in Vertex AI and what types are there?\",\"back\":\"You deploy to an endpoint (a serving resource with a stable IP/hostname). Types: 1) pre-trained models with no prior training; 2) AutoML models, which automatically deploy their backing model; 3) custom-trained models, served through a container holding the prediction server and the model artifact. In the last case the container must expose the prediction logic over HTTP plus the model; Vertex's prediction server handles scaling.\",\"topic\":\"Model Deployment\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"deployment\",\"serving\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-06\",\"part\":\"m\",\"front\":\"What is a custom container for serving and which file does it require?\",\"back\":\"When you train outside Vertex (for example in Cloud Build or your own environment), you package the model into a container image with a Dockerfile. That Dockerfile is mandatory: it defines the base image, the dependencies (requirements.txt) and the start command for the prediction server. The container must listen on the port Vertex assigns and answer prediction requests in the expected format.\",\"topic\":\"Custom Container\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"deployment\",\"contenedores\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-07\",\"part\":\"m\",\"front\":\"How do you achieve a zero-downtime model update in Vertex AI?\",\"back\":\"By deploying multiple model versions to the SAME endpoint and splitting traffic between them. The endpoint keeps a stable URL, so clients do not change; you shift the traffic split (for example 100% to the new version) and then retire the old one. It is a canary rollout: you test with a small share of real traffic before moving it all.\",\"topic\":\"Model Deployment\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"deployment\",\"produccion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-08\",\"part\":\"m\",\"front\":\"What is Vertex AI Model Monitoring and what does it detect?\",\"back\":\"It is the service that watches deployed models. It detects three things: data drift (production input features deviate from the training baseline), prediction drift (the distribution of predictions changes) and training-serving skew (production features differ from training ones). You configure it per endpoint with thresholds and windows; when they are breached it raises alerts. It is the direct answer to 'is my model degrading?'.\",\"topic\":\"Model Monitoring\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"monitoring\",\"drift\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-09\",\"part\":\"m\",\"front\":\"What is Vertex AI Workbench and how does it differ from Colab?\",\"back\":\"Both are ML development environments. Workbench is a managed Jupyter notebook instance (on Compute Engine or Vertex AI) with access control, networking and data governed by the project: it is the option for sensitive work. Colab is lighter and more collaborative, aimed at quick prototypes. In a company with regulated data, the answer is Workbench.\",\"topic\":\"Workbench\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"vertex-ai\",\"workbench\",\"desarrollo\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-10\",\"part\":\"m\",\"front\":\"What is hyperparameter tuning in Vertex AI?\",\"back\":\"It is the automatic search for the best model configuration (learning rate, number of trees, regularization). Vertex AI implements it as a hyperparameter tuning job that launches multiple trials in parallel, with two strategies: random search (sampling) and Bayesian optimization (using what earlier trials learned to sample better). The job picks the best configuration by the metric you specify.\",\"topic\":\"Hyperparameter Tuning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"tuning\",\"hiperparametros\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-11\",\"part\":\"m\",\"front\":\"What does Vertex AI Explainable AI do?\",\"back\":\"It provides explanations of a model's predictions: for a given instance, which features contributed and in which direction (attribution values). You get them through the explanation API when predicting from the endpoint, and for supported models, by enabling the explainability features. For Feature Store there are also SHAP values, which explain a prediction using the model and the stored features. It is the tool for auditing model decisions.\",\"topic\":\"Explainable AI\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"xai\",\"interpretabilidad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-12\",\"part\":\"m\",\"front\":\"What is AutoML labeling and when is it used?\",\"back\":\"It is a Vertex AI service that generates labels for image, video or text datasets using pre-trained models, and with that labeling you can train your own model. Typical example: auto-label product images so you can then train your own classifier. It cuts manual annotation cost considerably, though the final quality still needs review.\",\"topic\":\"AutoML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"autolabel\",\"datasets\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-01\",\"part\":\"m\",\"front\":\"What is BigQuery ML and when is it worth using?\",\"back\":\"BigQuery ML lets you create, train, evaluate and deploy models with pure SQL, without moving data out of BigQuery. It is ideal when the data already lives in BigQuery: the model trains and predicts in place, with no export to BigQuery Storage, no ETL pipelines and no separately managed serving cost. Available models include LINEAR_REGRESSION, LOGISTIC_REGRESSION, KMEANS, MATRIX_FACTORIZATION, DNN_CLASSIFIER, boosted trees (DART/linear) and more.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery\",\"fundamentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-02\",\"part\":\"m\",\"front\":\"How do you train a model in BigQuery ML?\",\"back\":\"With CREATE MODEL, specifying the model (model_type), the training table or query (SELECT...), and the target (LABEL_COLUMNS or NULL for unsupervised). Key options: INPUT_LABEL_COLUMNS, DATA_SPLIT_COL (for cross validation), OPTIMIZE_STRATEGY ('BATCH_GRADIENT_DESCENT', 'NORMAL_EQUATION', 'LINEAR_REGRESSION'), L1_REG / L0_REG, and hyperparameter options like MAX_TREE_DEPTH, LEARNING_RATE, NUM_TRIALS or DATA_SPLIT_METHOD ('CUSTOM', 'RANDOM', 'AUTO', 'K_FOLD').\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"entrenamiento\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-03\",\"part\":\"m\",\"front\":\"What does the ML.PREDICT function do?\",\"back\":\"It is the function for making predictions with an already-trained BigQuery ML model. SELECT ML.PREDICT(MODEL `project.dataset.model`, (SELECT ...)) returns the predictions along with the input features. BigQuery handles serving: there is no endpoint to maintain, and the model is applied directly to the query's data. For finer control over preprocessing, you can reference MODEL::feature.column inside the SELECT.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery\",\"prediccion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-04\",\"part\":\"m\",\"front\":\"What does ML.EVALUATE do and what does it return?\",\"back\":\"It evaluates a trained model on a dataset and returns performance metrics: for regression, mean absolute error, mean squared error and R²; for classification, accuracy, precision, recall and F1. You typically use it as CREATE OR REPLACE TABLE ... AS SELECT ML.EVALUATE(MODEL ...) to persist the result and compare it across model versions. ML.EVALUATE accepts the same calibration and threshold options as ML.PREDICT.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"evaluacion\",\"metricas\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-05\",\"part\":\"m\",\"front\":\"What is ML.TUNE and how does it automate model selection?\",\"back\":\"ML.TUNE runs multiple hyperparameter configurations within the CREATE MODEL statement and automatically keeps the best one according to the evaluation metric. You enable it with the HYPERPARAMETER_TUNING argument in CREATE MODEL (or OPTIONS(hyperparameter_tuning=...)) and control it with MAX_TRIALS and the strategy: 'RANDOM_SEARCH' or 'BAYESIAN_OPTIMIZATION'. It is the native way to tune in BigQuery ML, without Vertex AI.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"tuning\",\"hiperparametros\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-06\",\"part\":\"m\",\"front\":\"What is ML.DETECT_DRIFT and what problem does it solve?\",\"back\":\"It compares the distribution of current input data against the baseline the model was trained on, and returns the statistical difference per feature. It lets you watch production for a change in the world (a new product, a shift in user behaviour) before the model degrades. ML.DETECT_DRIFT returns the features with the largest deviation and lets you set a threshold (THRESHOLD) to filter out statistical noise. It can also be used to watch prediction drift.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"drift\",\"monitoring\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-07\",\"part\":\"m\",\"front\":\"What is ML.VALIDATE_FEATURES and why does it matter?\",\"back\":\"It validates that a table's input features have the same type and range as the ones used in training. It catches data drift and training-serving skew before they reach the model: if a production feature arrives with different types or out-of-range values, the prediction will be garbage and you will not know why. It is a data-contract check between training and serving.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"drift\",\"calidad-datos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-08\",\"part\":\"m\",\"front\":\"What is ML.GENERATE_EMBEDDINGS?\",\"back\":\"It generates semantic embeddings using foundation models integrated into BigQuery ML. It takes text (or content) and returns dense vectors that capture meaning rather than simple token counts. Unlike ML.TEXT_TOKENIZE (which only tokenizes and carries no semantics) or hashing (which approximates without meaning), these embeddings are semantically high quality and serve for clustering, similarity search or as inputs to other models. It sits on top of Vertex AI Text Embeddings.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"embeddings\",\"vertex-ai\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-09\",\"part\":\"m\",\"front\":\"What is ML.FEATURE_INFO?\",\"back\":\"It returns information about a model's features: the input data types, the transformations applied and the training schema. It is the tool for inspecting a trained model's configuration and architecture without guessing. It helps audit how each variable was processed, debug type or range problems, and document the model. ML.GLOBAL_EXPLAIN and ML.LOCAL_EXPLAIN focus on model explanations, not on its structure.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"xai\",\"inspeccion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-10\",\"part\":\"m\",\"front\":\"What is the difference between ML.GLOBAL_EXPLAIN and ML.LOCAL_EXPLAIN?\",\"back\":\"GLOBAL_EXPLAIN gives the importance of each feature for the model as a whole (aggregated over the dataset): 'price matters more than size'. LOCAL_EXPLAIN gives the explanation of one specific prediction: 'for THIS 3-bedroom house, size mattered more than age'. On the exam: a question about overall feature importance is GLOBAL_EXPLAIN; a question about why a particular decision was made is LOCAL_EXPLAIN (or ML.EXPLAIN_PREDICT in its row form).\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"xai\",\"interpretabilidad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-11\",\"part\":\"m\",\"front\":\"What is ML.WEIGHTS and what is it for?\",\"back\":\"It returns the weights (coefficients) of a trained model, for models that support it. It is used to interpret the model (the sign and magnitude of each weight), to verify the coefficients make sense, and to audit or debug the training. Not every model exposes weights: boosted tree models, for instance, have no equivalent linear coefficients.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"interpretabilidad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-12\",\"part\":\"m\",\"front\":\"What is ML.THRESHOLD_EVALUATE?\",\"back\":\"It evaluates a binary classification model across varying decision thresholds and returns, for each threshold, the classification metrics (precision, recall, F1, accuracy). It lets you pick the operating point that best matches the cost of false positives versus false negatives, instead of using the default 0.5. It is the tool for fine-tuning a trained classifier's decision, without retraining.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"evaluacion\",\"metricas\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-13\",\"part\":\"m\",\"front\":\"What is ML.COMPARE and when is it used?\",\"back\":\"It compares two trained models on the same dataset and returns the evaluation metrics of both, so you can decide which to deploy. It is used in the comparison phase after training alternatives (for example a regularized model against one without it, or before and after hyperparameter tuning). It returns the metrics side by side, so the decision is data-driven rather than intuitive.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery\",\"evaluacion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-14\",\"part\":\"m\",\"front\":\"What is the ML. prefix in BigQuery ML functions?\",\"back\":\"In BigQuery ML the ML. prefix groups the machine learning operations over models: ML.PREDICT, ML.EVALUATE, ML.TUNE, ML.DETECT_DRIFT, ML.VALIDATE_FEATURES, ML.GENERATE_EMBEDDINGS, ML.FEATURE_INFO, ML.WEIGHTS, ML.GLOBAL_EXPLAIN, ML.LOCAL_EXPLAIN, ML.EXPLAIN_PREDICT, ML.THRESHOLD_EVALUATE, ML.COMPARE, ML.BOOM_BOOSTED_TREE, ML.RUN, ML.DETECT, ML.GENERATE. Recognising this set is key: the exam often asks 'which function do I use for X', and the answer is usually an exact function name from this list.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery\",\"funciones\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-01\",\"part\":\"m\",\"front\":\"What is feature engineering and why does it decide the model's outcome?\",\"back\":\"It is transforming raw data into variables the model can use. A good feature often contributes more than a sophisticated model: a simple model with weak features performs worse than a simple model with strong features. On GCP the support comes from BigQuery (SQL to derive features), Vertex AI Feature Store (versioning and reuse) and AutoML Feature Engineering (automatic derivation from BigQuery).\",\"topic\":\"Feature Engineering\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"features\",\"datos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-02\",\"part\":\"m\",\"front\":\"What is a data pipeline and which GCP tools compose it?\",\"back\":\"It is the reproducible, monitored way to ingest, transform and load data. On GCP: Dataflow (Apache Beam, streaming and batch) for processing; Dataproc (Spark/Hadoop) for MapReduce-scale jobs; BigQuery for analytical storage; Data Fusion for visual orchestration; and Pub/Sub plus Dataflow for real time. BigQuery Dataflow templates and Dataflow SQL are shortcuts for ELT loads from GCP into BigQuery.\",\"topic\":\"Data Pipeline\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"dataflow\",\"bigquery\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-03\",\"part\":\"m\",\"front\":\"What is data quality and how is it controlled on GCP?\",\"back\":\"It is how fit the data is for its purpose: correct, complete, consistent, timely and unique. On GCP it is controlled with Data Catalog (metadata and discovery), Dataplex Universal Catalog (governance and lineage), BigQuery for SQL-level validations, and DLP to detect and mask sensitive data. BigQuery ML adds ML.VALIDATE_FEATURES to verify the contract between training and serving.\",\"topic\":\"Data Quality\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"calidad-datos\",\"gobierno\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-04\",\"part\":\"m\",\"front\":\"How is data labeled for model training?\",\"back\":\"Labeling assigns the target variable. It can be manual (human annotators, with tools like Video Intelligence or Labelbox), automatic (AutoML labeling, which uses pre-trained models), or derived from an existing system (weak labels: a purchase as a label for 'product someone likes'). Labeling quality is usually the model's ceiling: noisy labels limit any algorithm.\",\"topic\":\"Data Labeling\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"etiquetado\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-05\",\"part\":\"m\",\"front\":\"What is Vertex AI AutoML and which models does it offer?\",\"back\":\"Vertex AI AutoML trains high-performing models without writing training code, optimizing the feature pipeline. It covers image classification, object detection, segmentation, forecasting, tabular regression and classification, plus AutoML for large language models (fine-tuning). For tabular data it does automatic preprocessing and tuning; for images it tabulates labels and trains. It is the fast path when you control the data but not the model.\",\"topic\":\"AutoML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"autolml\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-06\",\"part\":\"m\",\"front\":\"What is a custom job and when do you need it instead of AutoML?\",\"back\":\"A custom job is a training task with your own code (Python, with pre-installed frameworks like TensorFlow, PyTorch, XGBoost or scikit-learn, or a container). You need it when you require full control: a custom architecture, a custom loss function, preprocessing AutoML does not do, or integration with your own framework. The trade-off is that you own reproducibility and training scaling.\",\"topic\":\"Custom Job\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"vertex-ai\",\"entrenamiento\",\"custom\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-01\",\"part\":\"m\",\"front\":\"What is MLOps and why is training a model not enough?\",\"back\":\"MLOps is the practice of integrating ML development with operations: code, data, models and serving versioned, deployment automated and monitoring continuous. Without MLOps the 'winning model' stays in a notebook and never reaches production, or it reaches it and nobody knows whether it is degrading. Vertex AI covers the cycle with Pipelines, Model Registry, endpoints and Model Monitoring.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"mlops\",\"produccion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-02\",\"part\":\"m\",\"front\":\"What is CI/CD for models and how is it implemented on GCP?\",\"back\":\"It is applying integration and delivery practices to the ML pipeline: every code or data change triggers a pipeline that retrains, evaluates and, if the metrics clear the threshold, deploys automatically. On GCP it relies on Vertex AI Pipelines for orchestration, Cloud Build or GitHub Actions for CI, Artifact Registry for images and Cloud Deploy for the rollout. The key point: a metric decides the deployment, not intuition.\",\"topic\":\"CI/CD\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"mlops\",\"ci-cd\",\"vertex-ai\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-03\",\"part\":\"m\",\"front\":\"What is batch prediction and when is it used instead of online serving?\",\"back\":\"Batch prediction applies the model to a large dataset in one scheduled process, with no real-time serving. It is used for scoring historical datasets, for generating embeddings in bulk, or for nightly processes. In Vertex AI it is a batch prediction job with a model and an input set; in BigQuery ML it is simply a SELECT ML.PREDICT over the table. The counterpart is online serving, for point-by-point requests.\",\"topic\":\"Batch Prediction\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"prediccion\",\"vertex-ai\",\"bigquery\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-04\",\"part\":\"m\",\"front\":\"What is autoscaling of a Vertex AI endpoint?\",\"back\":\"The endpoint scales replicas automatically with the load: on a request spike it adds instances, when quiet it removes them (down to the configured minimum). That lets you set a minimum to cover latency and a maximum to cap cost, without managing infrastructure. Vertex autoscaling is driven by request concurrency, not by CPU alone.\",\"topic\":\"Autoscaling\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"serving\",\"produccion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-05\",\"part\":\"m\",\"front\":\"What is training-serving skew and how do you avoid it?\",\"back\":\"It is the divergence between the features the model was trained on and the ones that arrive in production: the model trained on 'age' in years and production sends months. It produces silently wrong predictions. You avoid it with Feature Store (same definition and materialization for both paths), with ML.VALIDATE_FEATURES (type and range checks) and with pipelines that share the transformation logic.\",\"topic\":\"Skew\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"skew\",\"feature-store\",\"produccion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-06\",\"part\":\"m\",\"front\":\"What is model security on GCP?\",\"back\":\"The model is an asset that must be protected: Vertex AI Model Registry and the endpoints inherit the project's IAM access control (who can deploy, view or delete models), Cloud Audit Logs records who did what, Artifact Registry protects the training images, and Vertex AI Workbench with VPC Service Controls or CMEK can isolate the data. On the exam the answer is always 'project IAM and auditing', not bespoke encryption.\",\"topic\":\"Model Security\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"seguridad\",\"iam\",\"gobierno\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-07\",\"part\":\"m\",\"front\":\"What is prediction latency and how is it controlled?\",\"back\":\"It is the time between the request and the model's response. On a Vertex AI endpoint you control it with the minimum replica count (more replicas, less queueing), with the machine type (more CPU or GPU, lower latency) and with the AutoML serving choice: online prediction can be served with accelerators (GPU/TPU) for fast inference. BigQuery ML has no such problem: prediction runs as a query, with no managed serving.\",\"topic\":\"Prediction Latency\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"serving\",\"rendimiento\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-08\",\"part\":\"m\",\"front\":\"What are the practical differences between Vertex AI and BigQuery ML?\",\"back\":\"BigQuery ML: pure SQL, data does not move, no serving to manage, ideal for prototypes, tabular problems and massive scoring. Limitations: less control over training, no endpoints, no low-latency online serving. Vertex AI: full control of training, endpoints for online serving, pipelines, registry, monitoring, Workbench, AutoML; in exchange, more complexity and often moving the data. Practical rule: start in BigQuery ML for tabular and batch problems; move to Vertex AI when you need online serving, training control or mature MLOps.\",\"topic\":\"Vertex AI\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"vertex-ai\",\"bigquery\",\"arquitectura\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m6-01\",\"part\":\"m\",\"front\":\"How is the Google Professional Machine Learning Engineer exam structured?\",\"back\":\"It is a 50-60 question multiple-choice exam, 120 minutes long, with 50% correct answers to pass. The questions cover ML system design (30%), data preparation and analysis (20%), model creation and deployment (35%), and monitoring and understanding ML pipelines (15%). The practice version includes questions on BigQuery ML and Vertex AI, and the distractors are lookalike services (Dataflow vs Vertex AI Pipelines, BigQuery vs Dataproc).\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"examen\",\"estrategia\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m6-02\",\"part\":\"m\",\"front\":\"Which confusions structure the exam's distractors most?\",\"back\":\"The three most frequent: (1) Dataflow vs Vertex AI Pipelines — Dataflow processes data, Pipelines orchestrates ML workflows; (2) BigQuery vs Dataproc — BigQuery is serverless analytics, Dataproc is managed Spark/Hadoop; (3) Cloud Storage vs BigQuery Storage — the first stores objects (models, datasets), the second is an analytical table. Resolving each pair before the exam removes most traps.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"examen\",\"estrategia\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m6-03\",\"part\":\"m\",\"front\":\"How do you answer a 'which function do I use for X' question in BigQuery ML?\",\"back\":\"With the closed list of ML.* functions. Map the intent to the function: predict → ML.PREDICT; evaluate performance → ML.EVALUATE; compare models → ML.COMPARE; choose a threshold → ML.THRESHOLD_EVALUATE; tune hyperparameters → ML.TUNE; detect drift → ML.DETECT_DRIFT; validate features → ML.VALIDATE_FEATURES; embeddings → ML.GENERATE_EMBEDDINGS; inspect the model → ML.FEATURE_INFO; weights → ML.WEIGHTS; global importance → ML.GLOBAL_EXPLAIN; single-instance explanation → ML.LOCAL_EXPLAIN or ML.EXPLAIN_PREDICT.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"examen\",\"bigquery\",\"estrategia\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m6-04\",\"part\":\"m\",\"front\":\"What is the key difference between Vertex AI and BigQuery ML on the exam?\",\"back\":\"The typical question is: 'which service would you use for X?'. If X is online serving of a custom-trained model, pipeline orchestration, model version management or drift monitoring: Vertex AI. If X is training and predicting over data already in BigQuery, without moving it and without managing serving: BigQuery ML. The Vertex AI answer points to Model Registry, endpoints, pipelines and monitoring; the BigQuery ML answer points to the ML.* functions and CREATE MODEL.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"examen\",\"vertex-ai\",\"bigquery\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m6-05\",\"part\":\"m\",\"front\":\"Which monitoring questions should you expect on the exam?\",\"back\":\"Three families. (1) Drift detection: Vertex AI Model Monitoring (data drift, prediction drift, training-serving skew) and, in BigQuery, ML.DETECT_DRIFT. (2) Feature consistency checks: ML.VALIDATE_FEATURES. (3) Lifecycle management: scheduled retraining with Vertex AI Pipelines, model updates via traffic splitting and Model Registry. If the question mentions 'production data no longer looks like training data', the answer is feature validation or monitoring, never 'retrain'.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"examen\",\"monitoring\",\"drift\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m6-06\",\"part\":\"m\",\"front\":\"Which fundamentals are prerequisites for this exam?\",\"back\":\"The exam assumes you know basic statistics and probability (mean, variance, distribution, correlation, significance), Python programming, and the ML concepts reviewed here: bias and variance, loss function, gradient, regularization, supervised, unsupervised and reinforcement learning. Also SQL fundamentals and the relational data model, because BigQuery ML is expressed in SQL. If you feel weak in either block (statistics and SQL), review them before diving into the GCP services.\",\"topic\":\"Exam Strategy\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"examen\",\"fundamentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
