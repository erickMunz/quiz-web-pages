D/page-a39129091dc993ae.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"deckEs\":{\"quizId\":\"fundamentals-ml-modelos\",\"quizTitle\":\"Fundamentos de ML — Tipos de modelos y cuándo usar cada uno\",\"cardCount\":35,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🧩\",\"description\":\"Mapa de modelos desde cero: qué hace cada uno, una analogía, para qué sirve y cuándo NO usarlo.\",\"modules\":[{\"id\":\"m1-mapa\",\"title\":\"El mapa: cómo elegir familia\",\"titleEn\":\"The map: how to pick a family\",\"description\":\"Vista de conjunto antes de estudiar pieza por pieza.\",\"objective\":\"Ver el tablero completo: qué familia de modelos responde a qué tipo de dato y de pregunta.\",\"emoji\":\"🗺️\",\"cards\":[\"ml-familias-modelos\"]},{\"id\":\"m2-lineales\",\"title\":\"Modelos lineales\",\"titleEn\":\"Linear models\",\"description\":\"Las baselines que explican el peso de cada columna. Son la base de la logística, del softmax y de las redes.\",\"objective\":\"Elegir entre regresión lineal, logística o softmax según la salida, y saber cuándo frenar con Ridge/Lasso.\",\"emoji\":\"📏\",\"cards\":[\"ml-modelo-lineal\",\"ml-modelo-logistica\",\"ml-modelo-softmax\",\"ml-modelo-ridge-lasso\"]},{\"id\":\"m3-ensembles\",\"title\":\"Árboles y ensembles\",\"titleEn\":\"Trees and ensembles\",\"description\":\"El default de los datos tabulares de negocio: del árbol legible a Random Forest y boosting.\",\"objective\":\"Distinguir bagging de boosting, ajustar un boosting que sobreajusta y saber que los árboles no extrapolan.\",\"emoji\":\"🌳\",\"cards\":[\"ml-modelo-arbol\",\"ml-modelo-random-forest\",\"ml-modelo-boosting\",\"ml-modelo-bagging-vs-boosting\",\"ml-modelo-boosting-sobreajuste\",\"ml-modelo-rf-extrapolacion\"]},{\"id\":\"m4-distancia\",\"title\":\"Distancia y probabilidad\",\"titleEn\":\"Distance and probability\",\"description\":\"Modelos que razonan por parecido (k-NN, SVM) o por probabilidad (Naive Bayes).\",\"objective\":\"Saber cuándo un modelo de distancia o probabilístico es una buena baseline y qué exige (escala, tamaño).\",\"emoji\":\"📐\",\"cards\":[\"ml-modelo-knn\",\"ml-modelo-naive-bayes\",\"ml-modelo-svm\"]},{\"id\":\"m5-nosupervisado\",\"title\":\"No supervisado\",\"titleEn\":\"Unsupervised\",\"description\":\"Agrupar sin etiquetas, comprimir columnas y detectar lo raro.\",\"objective\":\"Elegir entre k-means, DBSCAN, PCA, Isolation Forest y GMM según la forma de los datos y la pregunta.\",\"emoji\":\"🧭\",\"cards\":[\"ml-modelo-kmeans\",\"ml-modelo-kmeans-escalado\",\"ml-modelo-dbscan\",\"ml-modelo-pca\",\"ml-modelo-isolation-forest\",\"ml-modelo-gmm\"]},{\"id\":\"m6-series\",\"title\":\"Series de tiempo\",\"titleEn\":\"Time series\",\"description\":\"Cuando el orden de las filas ES la información.\",\"objective\":\"Reconocer un problema de series de tiempo y validarlo siempre con el futuro.\",\"emoji\":\"📈\",\"cards\":[\"ml-modelo-arima\"]},{\"id\":\"m7-deep\",\"title\":\"Deep learning\",\"titleEn\":\"Deep learning\",\"description\":\"Redes neuronales: MLP, CNN, detección, RNN/LSTM, Transformers y encoder vs decoder.\",\"objective\":\"Saber cuándo sí y cuándo no usar redes, y qué arquitectura encaja con imagen, secuencia o texto.\",\"emoji\":\"🌐\",\"cards\":[\"ml-modelo-redes\",\"ml-modelo-mlp\",\"ml-modelo-cnn\",\"ml-modelo-deteccion\",\"ml-modelo-rnn-lstm\",\"ml-modelo-transformer\",\"ml-modelo-bert-vs-gpt\"]},{\"id\":\"m8-generativos\",\"title\":\"Generativos y representación\",\"titleEn\":\"Generative and representation models\",\"description\":\"Modelos que aprenden representaciones o crean contenido: autoencoders, recomendadores, embeddings, GAN y difusión.\",\"objective\":\"Elegir la herramienta para comprimir, recomendar, buscar por similitud o generar imágenes.\",\"emoji\":\"🎨\",\"cards\":[\"ml-modelo-autoencoder\",\"ml-modelo-recomendador\",\"ml-modelo-embeddings-busqueda\",\"ml-modelo-gan\",\"ml-modelo-diffusion\"]},{\"id\":\"m9-criterios\",\"title\":\"Criterio final\",\"titleEn\":\"Final criteria\",\"description\":\"Síntesis: el método para elegir modelo en la práctica.\",\"objective\":\"Aplicar un método paso a paso para elegir modelo sin sobreajustar la decisión.\",\"emoji\":\"✅\",\"cards\":[\"ml-como-elegir-modelo\",\"ml-modelo-elegir-tabular\"]}],\"cards\":[{\"id\":\"ml-familias-modelos\",\"part\":\"m\",\"front\":\"¿Cuáles son las familias grandes de modelos y para qué se usa cada una?\",\"back\":\"La familia de modelo se elige por el TIPO de dato y de pregunta, no por la moda.\\n\\n• Lineales: tabla, relación simple, quieres explicar el peso de cada columna.\\n• Árboles y ensembles: tabla con reglas y no linealidad. El default de negocio.\\n• Distancia (k-NN, SVM, k-means): \\\"quién se parece a quién\\\".\\n• Series de tiempo: el pasado ordenado predice el futuro (ventas, demanda).\\n• Redes: imagen, audio, texto o tablas enormes con patrones difíciles.\\n• Generativos: crear texto, imagen o audio nuevos.\\n\\nEmpieza por la familia más simple que pueda ganar a una baseline.\",\"topic\":\"Familias de modelos\",\"origin\":\"ai\",\"group\":\"Mapa\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-lineal\",\"part\":\"m\",\"front\":\"¿Qué es una regresión lineal y cuándo usarla?\",\"back\":\"Dibuja la mejor línea (o plano) que predice un NÚMERO a partir de las features: precio ≈ a·m² + b·habitaciones + c.\\n\\nAnalogía: una regla de tres con varias palancas. Cada coeficiente dice \\\"si esta columna sube 1, la predicción sube tanto\\\".\\n\\nÚsala cuando la relación es más o menos recta, quieres explicar el resultado, o necesitas una baseline rápida.\\n\\nNo la uses si la curva es claramente no lineal (un árbol o una red lo capturan mejor) o si la salida es una categoría.\",\"topic\":\"Regresión lineal\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-logistica\",\"part\":\"m\",\"front\":\"¿Qué es la regresión logística y cuándo usarla?\",\"back\":\"Pese al nombre, es CLASIFICACIÓN. Toma una combinación lineal y la pasa por una sigmoide para dar una probabilidad entre 0 y 1 (spam 0.82).\\n\\nAnalogía: la misma regla de la regresión lineal, pero la salida se aplasta a \\\"qué tan probable es el sí\\\".\\n\\nÚsala como baseline de clasificación binaria cuando quieres coeficientes legibles (\\\"esta feature sube el riesgo\\\").\\n\\nNo la uses si las clases se separan con curvas raras, o si ya sabes que un boosting gana claro en tu tabla. Para más de dos clases, mira softmax.\",\"topic\":\"Regresión logística\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-softmax\",\"part\":\"m\",\"front\":\"¿Cómo clasifica un modelo cuando hay más de dos clases?\",\"back\":\"Softmax convierte varios puntajes en probabilidades que SUMAN 1. La clase ganadora es la de mayor probabilidad.\\n\\nEjemplo: foto → perro 0.7, gato 0.2, otro 0.1.\\n\\nLa regresión logística es el caso de dos clases. Softmax es su hermana para N clases (tipo de producto, intención del usuario).\\n\\nNo confundir con \\\"entrenar N modelos sí/no por separado\\\": softmax obliga a que las probabilidades compitan entre sí.\",\"topic\":\"Softmax / multiclase\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-ridge-lasso\",\"part\":\"m\",\"front\":\"¿Qué son Ridge (L2) y Lasso (L1), y cuándo eliges uno?\",\"back\":\"Ridge y Lasso son regresiones lineales con un freno (penalización de los coeficientes) para no memorizar ruido.\\n\\n• Ridge (L2): encoge TODOS los coeficientes hacia cero, pero no los deja exactamente en cero. Útil si muchas columnas importan un poco y están correlacionadas.\\n• Lasso (L1): puede poner coeficientes en CERO. Hace selección de features: se queda con pocas columnas.\\n• Elastic Net: mezcla de las dos.\\n\\nÚsalos cuando hay muchas columnas respecto a las filas. Siguen siendo lineales: no inventan curvas.\",\"topic\":\"Ridge y Lasso\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-arbol\",\"part\":\"m\",\"front\":\"¿Qué es un árbol de decisión y cuándo usarlo?\",\"back\":\"Hace preguntas sí/no del estilo \\\"¿ingresos \u003e 40k?\\\" y \\\"¿edad \u003c 25?\\\" hasta llegar a una hoja con la predicción.\\n\\nAnalogía: el juego de \\\"adivina el animal\\\" con preguntas. Lo puedes dibujar y explicárselo a negocio.\\n\\nÚsalo para reglas legibles, datos tabulares, y cuando no quieres escalar columnas (los árboles no lo necesitan).\\n\\nUn único árbol memoriza con facilidad si lo dejas crecer sin límite. En producción casi siempre es la pieza de un bosque o de boosting, no el modelo final.\",\"topic\":\"Árbol de decisión\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-random-forest\",\"part\":\"m\",\"front\":\"¿Qué es Random Forest y cuándo usarlo?\",\"back\":\"Entrena MUCHOS árboles independientes, cada uno con una muestra al azar de filas (con reemplazo), y combina sus predicciones.\\n\\n• En cada corte, cada árbol solo mira un subconjunto al azar de columnas: así los árboles se parecen menos entre sí.\\n• Clasificación: voto o promedio de probabilidades (scikit-learn promedia). Regresión: promedio.\\n\\nAnalogía: preguntas a 100 personas que vieron partes distintas del mismo caso. El promedio se equivoca menos que una sola.\\n\\nÚsalo en tablas cuando quieres algo sólido con poco ajuste: baja el overfitting de un árbol solo.\\n\\nEn tablas difíciles el boosting suele ganarle, y 500 árboles son más lentos y opacos que uno.\",\"topic\":\"Random Forest\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting\",\"part\":\"m\",\"front\":\"¿Qué es el gradient boosting (XGBoost, LightGBM, CatBoost) y cuándo usarlo?\",\"back\":\"Gradient boosting suma árboles pequeños en SERIE: cada árbol nuevo se entrena para corregir los errores que todavía comete el conjunto.\\n\\nEl árbol 2 corrige al 1, el 3 corrige lo que quedó, y así.\\n\\n• XGBoost: el clásico de competiciones en tablas.\\n• LightGBM: más rápido en datasets grandes.\\n• CatBoost: mejor de fábrica con columnas categóricas.\\n\\nÚsalo como primera apuesta seria en datos tabulares (fraude, churn, precios).\\n\\nCuidado: con pocos datos o malos hiperparámetros sobreajusta. Es menos explicable que un árbol solo.\",\"topic\":\"Gradient Boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bagging-vs-boosting\",\"part\":\"m\",\"front\":\"¿En qué se diferencian bagging (Random Forest) y boosting?\",\"back\":\"Bagging entrena muchos modelos en paralelo y los promedia (baja la varianza); boosting los entrena en serie, cada uno corrigiendo al anterior (baja sobre todo el sesgo).\\n\\n• Bagging: modelos independientes, cada uno con una muestra distinta. Random Forest es bagging de árboles profundos. Añadir árboles casi nunca causa overfitting.\\n• Boosting: árboles pequeños en serie. XGBoost y LightGBM son boosting. Demasiados árboles sí pueden sobreajustar → early stopping.\\n\\nPista de examen: \\\"muchos árboles en paralelo / voto\\\" → bosque. \\\"cada árbol corrige al anterior\\\" → boosting.\",\"topic\":\"Bagging vs boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting-sobreajuste\",\"part\":\"m\",\"front\":\"Tu LightGBM con 5 000 árboles, learning rate 0.3 y árboles muy profundos da AUC 0.99 en train y 0.78 en validación. Tienes 20 000 filas y una semana. ¿Qué ajustas primero?\",\"back\":\"Baja la learning rate, limita la complejidad de cada árbol y deja que early stopping en validación decida cuántos árboles usar.\\n\\n• El boosting sigue corrigiendo errores en serie: con muchos árboles y pasos grandes acaba ajustando ruido.\\n• Otras palancas: mínimo de ejemplos por hoja, submuestreo de filas y columnas, regularización L1/L2 de las hojas.\\n• Cambiar a una red neuronal no ataca la causa: es el mismo sobreajuste con otro modelo.\\n• Añadir más árboles empeora la brecha.\\n\\nIdea clave: en boosting, learning rate y número de árboles se ajustan juntos.\",\"topic\":\"Ajustar boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-rf-extrapolacion\",\"part\":\"m\",\"front\":\"Un Random Forest predice el precio de casas entrenado con superficies de 40 a 200 m². Llega una casa de 400 m² y la predicción es casi la misma que para 200 m². ¿Bug o comportamiento esperado?\",\"back\":\"Comportamiento esperado: un Random Forest predice promediando valores vistos en sus hojas, así que fuera del rango de entrenamiento su predicción se queda plana.\\n\\n• Nunca puede predecir un precio mayor que el máximo visto en train.\\n• Una regresión lineal sí extrapola (aunque puede hacerlo mal si la relación no es lineal).\\n• En producción, vigila los inputs que salen del rango de entrenamiento y trátalos aparte.\\n• En series con tendencia, los árboles sobre valores crudos fallan por lo mismo.\\n\\nIdea clave: los árboles interpolan bien, no extrapolan.\",\"topic\":\"Los árboles no extrapolan\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-knn\",\"part\":\"m\",\"front\":\"¿Qué es k-NN y cuándo usarlo?\",\"back\":\"k-NN no resume los datos en pesos: guarda los ejemplos y, para predecir, mira los k más parecidos.\\n\\n• Clasificar: gana el voto de los vecinos.\\n• Regresión: promedias el número de los vecinos.\\n\\nAnalogía: \\\"dime con quién andas\\\". k=1 copia al vecino más cercano (ruidoso). k muy grande se parece a predecir el promedio de todos.\\n\\nÚsalo en problemas chicos y como intuición. Escala las columnas o la distancia miente. Con millones de filas, predecir es lento.\",\"topic\":\"k-NN\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-naive-bayes\",\"part\":\"m\",\"front\":\"¿Qué es Naive Bayes y cuándo usarlo?\",\"back\":\"Naive Bayes clasifica con probabilidades: \\\"si veo estas palabras, ¿qué tan probable es cada clase?\\\", usando el teorema de Bayes.\\n\\nAsume que las features son independientes entre sí dada la clase (por eso \\\"naive\\\": ingenuo). En el texto real las palabras no lo son y, aun así, suele funcionar bien como baseline.\\n\\nÚsalo como baseline rápida de texto (spam, tema de un ticket) y cuando hay poco dato.\\n\\nSus probabilidades suelen salir demasiado extremas: no las uses como riesgo calibrado. Si necesitas la mejor precisión, un boosting o una red suelen ganar.\",\"topic\":\"Naive Bayes\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-svm\",\"part\":\"m\",\"front\":\"¿Qué es una SVM y cuándo usarla?\",\"back\":\"Una SVM busca la frontera que separa las clases dejando el margen MÁS ancho posible hasta los puntos más cercanos.\\n\\n• Vectores de soporte: los puntos que quedan sobre el margen o lo invaden; solo ellos definen la frontera.\\n• Con un kernel (p. ej., RBF) logra fronteras curvas que una recta no consigue.\\n\\nÚsala en datasets pequeños o medianos, con muchas columnas (texto, genes) y features escaladas: es sensible a la escala.\\n\\nCon kernel, el entrenamiento crece al menos con el cuadrado de las filas: con cientos de miles de filas se vuelve poco práctica. La versión lineal escala mejor; en tablas grandes de negocio, el boosting suele ser más práctico.\",\"topic\":\"SVM\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-kmeans\",\"part\":\"m\",\"front\":\"¿Qué es k-means y cuándo usarlo?\",\"back\":\"k-means agrupa ejemplos SIN etiqueta en k grupos alrededor de k centros. Pone k centros, asigna cada punto al centro más cercano, mueve los centros, y repite.\\n\\nAnalogía: repartir una ciudad en k zonas alrededor de k plazas.\\n\\nÚsalo para segmentar clientes o explorar. TÚ eliges k. Funciona si los grupos son más o menos redondos y de tamaño parecido.\\n\\nNo lo uses si hay mucho ruido, grupos con forma de aro, o no quieres fijar k de antemano (mira DBSCAN).\",\"topic\":\"k-means\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-kmeans-escalado\",\"part\":\"m\",\"front\":\"Segmentas clientes con k-means usando \\\"gasto anual\\\" (0–50 000) y \\\"visitas al mes\\\" (0–30). Los 4 grupos salen cortados solo por gasto, como si las visitas no existieran. ¿Qué falló?\",\"back\":\"k-means agrupa por distancia, así que sin escalar la columna de mayor rango domina; estandariza las columnas antes de agrupar.\\n\\n• Una diferencia de 5 000 en gasto pesa mucho más que una de 20 visitas.\\n• Tras estandarizar (media 0, desviación 1), cada columna aporta según su variación relativa.\\n• Cambiar k no lo arregla: el problema es la escala, no el número de grupos.\\n• Lo mismo afecta a k-NN, PCA y SVM; a los árboles casi no.\\n\\nIdea clave: con distancias, escala primero.\",\"topic\":\"k-means y escala\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-dbscan\",\"part\":\"m\",\"front\":\"¿Qué es DBSCAN y en qué gana a k-means?\",\"back\":\"También agrupa, pero por densidad: un grupo es una zona donde los puntos están pegados. Lo que queda suelto se marca como ruido, no se fuerza a un grupo.\\n\\nNo le das k. Le das \\\"qué tan cerca\\\" (eps) y \\\"cuántos vecinos mínimos\\\" (min_samples).\\n\\nÚsalo cuando los grupos tienen formas raras o hay outliers que no quieres meter en un segmento.\\n\\nNo lo uses si los grupos tienen densidades muy distintas: o se come uno, o parte el otro.\",\"topic\":\"DBSCAN\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-pca\",\"part\":\"m\",\"front\":\"¿Qué es PCA y para qué se usa?\",\"back\":\"Comprime muchas columnas numéricas en pocas \\\"direcciones\\\" que conservan la mayor variación. No predice un label: reorganiza el dato.\\n\\nAnalogía: una foto de una ciudad desde el ángulo que más diferencia los edificios, no desde todos los ángulos a la vez.\\n\\nÚsalo para visualizar en 2D, quitar ruido o acelerar un modelo posterior. Estandariza antes: si no, la columna de mayor escala domina.\\n\\nTrampa: si la señal útil es chiquita (no es la de más varianza), PCA la tira. No interpretes el \\\"componente 1\\\" como si fuera una columna original.\",\"topic\":\"PCA\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-isolation-forest\",\"part\":\"m\",\"front\":\"¿Qué modelo uso para detectar anomalías en una tabla?\",\"back\":\"Isolation Forest: árboles al azar que intentan \\\"aislar\\\" cada punto. Lo raro se aísla en pocos cortes; lo normal necesita muchos. No necesitas ejemplos etiquetados de fraude.\\n\\nÚsalo para fraude, fallos de sensor o filas imposibles, cuando casi todo es \\\"normal\\\" y no tienes labels de los raros.\\n\\nNo sustituye un clasificador si SÍ tienes historial etiquetado de fraude: ahí un boosting supervisado suele ganar. La anomalía es \\\"distinto\\\", no automáticamente \\\"malo\\\".\",\"topic\":\"Isolation Forest\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-gmm\",\"part\":\"m\",\"front\":\"¿Qué es una mezcla de gaussianas (GMM) y cuándo usarla?\",\"back\":\"Agrupa asumiendo que los datos salen de varias \\\"campanas\\\" (distribuciones normales). A diferencia de k-means, un punto puede pertenecer EN PARTE a varios grupos (probabilidad blanda).\\n\\nÚsala cuando los segmentos se solapan y te importa \\\"qué tan de cada grupo es\\\" (clientes mixtos), no una etiqueta dura.\\n\\nSigue necesitando que elijas cuántas campanas. Si los grupos no son elípticos, la suposición falla.\",\"topic\":\"Mezcla de gaussianas\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-arima\",\"part\":\"m\",\"front\":\"¿Qué es ARIMA y cuándo sirve para pronosticar?\",\"back\":\"ARIMA es un modelo de SERIES DE TIEMPO: predice el siguiente valor a partir de los valores y errores pasados; la tendencia se trata diferenciando la serie.\\n\\nPara estacionalidad (ventas que suben cada diciembre) se usa su versión estacional, SARIMA. El orden de las filas ES la información.\\n\\nÚsalo en una serie con historia suficiente y un patrón que se repite (demanda, tráfico).\\n\\nCon muchas series, regresores externos o festivos, mira herramientas que los acepten (en BigQuery ML, ARIMA_PLUS admite varias series y HOLIDAY_REGION; ARIMA_PLUS_XREG, regresores externos). Valida siempre con el futuro, nunca barajando.\",\"topic\":\"ARIMA y series de tiempo\",\"origin\":\"ai\",\"group\":\"Series de tiempo\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-redes\",\"part\":\"m\",\"front\":\"¿Qué son las redes neuronales y cuándo usarlas?\",\"back\":\"Una red neuronal apila capas de \\\"neuronas\\\": cada una mezcla las entradas con pesos y aplica una función no lineal. Capa tras capa aprende representaciones, de lo simple (un borde) a lo abstracto (\\\"esto es un gato\\\").\\n\\nAnalogía: una línea de montaje. Cada estación transforma la pieza un poco.\\n\\nÚsalas con MUCHO dato en imagen, audio, texto o secuencias. También cuando las features a mano no alcanzan.\\n\\nEn una tabla de 5 000 filas, un boosting suele igualarlas con menos cómputo y menos misterio. \\\"Red\\\" no significa \\\"mejor\\\".\",\"topic\":\"Redes neuronales\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-mlp\",\"part\":\"m\",\"front\":\"¿Qué es una red densa (MLP) y en qué se diferencia de una CNN?\",\"back\":\"MLP = multilayer perceptron: cada neurona se conecta con TODAS las de la capa anterior. No sabe que dos píxeles vecinos son vecinos.\\n\\nÚsala en vectores ya armados (features tabulares, embeddings) cuando quieres no linealidad y tienes datos de sobra.\\n\\nPara imágenes usa una CNN (mira patrones locales). Para texto largo, un Transformer. Meter una foto aplastada en un MLP funciona, pero desperdicia la estructura.\",\"topic\":\"Red densa (MLP)\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-cnn\",\"part\":\"m\",\"front\":\"¿Qué es una CNN y para qué sirve?\",\"back\":\"Red convolucional: filtros chicos que recorren la imagen buscando patrones locales (borde, textura, ojo) y los combinan.\\n\\nLa idea que la hace funcionar: un gato sigue siendo un gato si se corre unos píxeles. El mismo filtro sirve en cualquier zona.\\n\\nÚsala para clasificar imágenes, y como base de detección de objetos. A veces también en audio o series, tratándolos como una \\\"imagen\\\" 1D.\\n\\nNo es el modelo de una tabla de Excel. Ahí un árbol suele ser más simple y igual de bueno.\",\"topic\":\"CNN\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-deteccion\",\"part\":\"m\",\"front\":\"¿En qué se diferencia clasificar una imagen de detectar objetos?\",\"back\":\"Clasificar da una etiqueta para toda la imagen; detectar localiza cada objeto con una caja y su clase; segmentar asigna una clase a cada píxel.\\n\\n• Clasificación: una etiqueta para TODA la foto (\\\"hay un perro\\\").\\n• Detección: varias cajas, cada una con clase y posición (\\\"perro aquí, persona allá\\\"). YOLO y familia son el ejemplo clásico.\\n• Segmentación: pinta píxel a píxel qué objeto es (máscara), no solo una caja.\\n\\nElige por la pregunta. \\\"¿Esta radiografía es normal?\\\" es clasificación. \\\"¿Dónde está el tumor?\\\" es detección o segmentación. Una CNN sola de clasificación no dibuja cajas.\",\"topic\":\"Detección vs clasificación\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-rnn-lstm\",\"part\":\"m\",\"front\":\"¿Qué son RNN y LSTM, y por qué los Transformers las reemplazaron en texto?\",\"back\":\"Una RNN lee la secuencia paso a paso y se pasa un \\\"estado\\\" al siguiente, como una persona que resume lo leído hasta ahora.\\n\\nLa LSTM es una RNN con memoria más larga: decide qué recordar y qué olvidar. Sirvió para traducción y series antes de 2017.\\n\\nProblema: lee en orden, así que no se paraleliza bien y le cuesta conservar información lejana. El Transformer relaciona todas las posiciones a la vez (atención) y se entrena en paralelo. Hoy, para texto, empieza por un Transformer; LSTM queda en series cortas o sistemas viejos.\",\"topic\":\"RNN y LSTM\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-transformer\",\"part\":\"m\",\"front\":\"¿Qué es un Transformer y para qué se usa?\",\"back\":\"Una red cuya pieza central es la atención: cada token (trozo de palabra) mira a los demás y decide cuáles le importan para entenderse.\\n\\nAnalogía: en una frase, \\\"banco\\\" mira alrededor para saber si es un asiento o un sitio de dinero.\\n\\nEs la base de los LLM (GPT, Gemini) y también de modelos de visión. Capta relaciones lejanas y se entrena en paralelo mejor que una RNN, aunque el costo de la atención crece con el cuadrado de la longitud.\\n\\nCuesta muchos datos y cómputo. Para una tabla de 10 columnas no lo necesitas. Tokens, prompts y alucinaciones están en el mazo de IA.\",\"topic\":\"Transformer\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bert-vs-gpt\",\"part\":\"m\",\"front\":\"¿En qué se diferencian un modelo tipo BERT y uno tipo GPT?\",\"back\":\"Un modelo tipo BERT es un encoder que lee el texto completo en las dos direcciones para entenderlo; uno tipo GPT es un decoder que predice el siguiente token para generar.\\n\\n• Encoder (BERT y familia): sirve para clasificar, buscar o extraer entidades. No está hecho para seguir escribiendo.\\n• Decoder (GPT y familia): solo mira hacia atrás (máscara causal). Sirve para generar texto.\\n• Los dos son Transformers; cambia qué miran y para qué se entrenaron.\\n\\nPista: \\\"completa la frase\\\" o \\\"chat\\\" → decoder. \\\"¿de qué trata este documento?\\\" → encoder, o un decoder al que le pides esa tarea.\",\"topic\":\"Encoder vs decoder\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-autoencoder\",\"part\":\"m\",\"front\":\"¿Qué es un autoencoder y para qué sirve?\",\"back\":\"Una red que comprime la entrada a un vector chico (el \\\"cuello\\\") y luego intenta reconstruirla. No usa labels: aprende una representación.\\n\\nSi reconstruye bien lo normal y MAL lo raro, el error de reconstrucción delata anomalías.\\n\\nÚsalo para comprimir, quitar ruido o detectar lo inusual en imágenes o sensores.\\n\\nNo es un clasificador. Si tienes etiquetas, un modelo supervisado suele ser más directo.\",\"topic\":\"Autoencoder\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-recomendador\",\"part\":\"m\",\"front\":\"¿Cómo recomienda productos un modelo, en las dos ideas clásicas?\",\"back\":\"Las dos ideas clásicas son el filtrado colaborativo (\\\"gente parecida a ti compró esto\\\") y el basado en contenido (\\\"se parece a lo que te gustó\\\").\\n\\n• Filtrado colaborativo: \\\"gente parecida a ti compró esto\\\". Usa la matriz usuario–ítem. Falla con usuarios nuevos (cold start).\\n• Basado en contenido: \\\"este ítem se parece a los que ya te gustaron\\\" (género, texto, embeddings). Funciona con un usuario nuevo si describes el ítem.\\n\\nEn la práctica se mezclan, y a veces una red (two-tower: un vector de usuario y uno de ítem, y se busca el más cercano).\\n\\nNo es lo mismo que un clasificador de \\\"¿comprará sí/no?\\\" sobre una sola fila, aunque a veces se plantea así.\",\"topic\":\"Sistemas de recomendación\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-embeddings-busqueda\",\"part\":\"m\",\"front\":\"Soporte quiere ver, para cada ticket nuevo, los 10 tickets pasados más parecidos entre 300 000, sin etiquetas y con respuesta en menos de 1 segundo. ¿Qué enfoque eliges?\",\"back\":\"Convierte cada ticket en un embedding con un modelo de texto preentrenado y busca los vecinos más cercanos con un índice aproximado (ANN).\\n\\n• Sin labels no hay clasificador que entrenar; tampoco hace falta.\\n• Textos con significado parecido quedan cerca aunque usen otras palabras.\\n• Baseline barata: TF-IDF + similitud coseno.\\n• Pedirle a un LLM que compare el ticket con 300 000 sería lento y caro.\\n• k-means agrupa, pero no responde \\\"los 10 más parecidos a ESTE\\\".\\n\\nIdea clave: embeddings + vecinos cercanos = búsqueda semántica.\",\"topic\":\"Búsqueda por similitud\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-gan\",\"part\":\"m\",\"front\":\"¿Qué es una GAN y para qué se usó?\",\"back\":\"Una GAN son dos redes que compiten: un generador que crea ejemplos y un discriminador que intenta distinguirlos de los reales. El generador inventa ejemplos (una cara). El discriminador intenta decir si es real o falso. El generador mejora hasta engañarlo.\\n\\nAnalogía: un falsificador y un perito. Cada uno obliga al otro a mejorar.\\n\\nSe usaron para generar imágenes realistas. Entrenarlas es inestable: si el discriminador gana demasiado, el generador deja de recibir señal útil, o el generador colapsa a pocas variantes (mode collapse).\\n\\nHoy, para generar imágenes, los modelos de difusión suelen ser más estables. La idea de \\\"dos redes en competencia\\\" sigue apareciendo en exámenes.\",\"topic\":\"GAN\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-diffusion\",\"part\":\"m\",\"front\":\"¿Qué es un modelo de difusión y para qué se usa?\",\"back\":\"Un modelo de difusión genera imágenes aprendiendo a quitar ruido paso a paso. Entrenar: le añades ruido a una imagen real hasta que es estática, y le enseñas a revertir un paso. Generar: partes de ruido puro y lo vas limpiando hasta que aparece una imagen.\\n\\nEs la base de generadores de imagen modernos (Stable Diffusion y familia). Puedes guiarlo con un texto (\\\"un faro de noche\\\").\\n\\nNo es un LLM: no predice el siguiente token de una frase. Si la tarea es escribir, usa un modelo de lenguaje; si es pintar, difusión.\",\"topic\":\"Modelos de difusión\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"advanced\"},{\"id\":\"ml-como-elegir-modelo\",\"part\":\"m\",\"front\":\"¿Cómo elijo un modelo en la práctica, paso a paso?\",\"back\":\"Define la pregunta, pon una baseline tonta, prueba primero el modelo simple adecuado al tipo de dato y sube de complejidad solo si validación y negocio lo justifican.\\n\\n1. Escribe la pregunta: número, categoría, grupo, serie, texto o imagen.\\n2. Pon una baseline tonta (mayoría, promedio, regla de negocio).\\n3. Tabla → regresión logística o árbol, luego boosting. Imagen → CNN o un modelo ya entrenado. Texto generativo → LLM. Pronóstico → serie de tiempo.\\n4. Compara en validation, nunca afinando con el test.\\n5. Sube de complejidad solo si la métrica de negocio lo paga.\\n\\nSi no ganas a la baseline, el problema suele ser el dato o la pregunta, no \\\"falta un modelo más grande\\\".\",\"topic\":\"Cómo elegir modelo\",\"origin\":\"ai\",\"group\":\"Criterios\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-elegir-tabular\",\"part\":\"m\",\"front\":\"Tienes 50 000 clientes con 40 columnas (numéricas y categóricas) para predecir abandono. Negocio exige explicar las decisiones y el equipo es pequeño. ¿Por qué modelo empiezas?\",\"back\":\"Empieza con una regresión logística como baseline explicable y prueba después gradient boosting de árboles, que suele rendir mejor en tablas.\\n\\n• Logística: rápida, coeficientes legibles, buen punto de comparación.\\n• Boosting (XGBoost, LightGBM, HistGradientBoosting): capta no linealidades e interacciones; se explica con importancia por permutación o SHAP.\\n• Una red profunda rara vez gana al boosting en tablas medianas y cuesta más ajustarla.\\n• k-NN: lento al predecir y torpe con categóricas.\\n\\nIdea clave: simple primero, boosting después, y solo si la validación lo paga.\",\"topic\":\"Elegir modelo en tablas\",\"origin\":\"ai\",\"group\":\"Criterios\",\"difficulty\":\"intermediate\"}]},\"deckEn\":{\"quizId\":\"fundamentals-ml-modelos\",\"quizTitle\":\"ML Fundamentals — Model types and when to use each\",\"cardCount\":35,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🧩\",\"description\":\"A from-zero map of models: what each one does, an analogy, what it is for, and when NOT to use it.\",\"modules\":[{\"id\":\"m1-mapa\",\"title\":\"The map: how to pick a family\",\"titleEn\":\"The map: how to pick a family\",\"description\":\"The big picture before studying piece by piece.\",\"objective\":\"See the whole board: which model family answers which kind of data and question.\",\"emoji\":\"🗺️\",\"cards\":[\"ml-familias-modelos\"]},{\"id\":\"m2-lineales\",\"title\":\"Linear models\",\"titleEn\":\"Linear models\",\"description\":\"The baselines that explain each column's weight. They are the base of logistic regression, softmax and networks.\",\"objective\":\"Pick linear, logistic or softmax regression by the output type, and know when to brake with Ridge/Lasso.\",\"emoji\":\"📏\",\"cards\":[\"ml-modelo-lineal\",\"ml-modelo-logistica\",\"ml-modelo-softmax\",\"ml-modelo-ridge-lasso\"]},{\"id\":\"m3-ensembles\",\"title\":\"Trees and ensembles\",\"titleEn\":\"Trees and ensembles\",\"description\":\"The default for business tabular data: from the readable tree to Random Forest and boosting.\",\"objective\":\"Tell bagging from boosting, tune an overfitting boosting model, and know that trees do not extrapolate.\",\"emoji\":\"🌳\",\"cards\":[\"ml-modelo-arbol\",\"ml-modelo-random-forest\",\"ml-modelo-boosting\",\"ml-modelo-bagging-vs-boosting\",\"ml-modelo-boosting-sobreajuste\",\"ml-modelo-rf-extrapolacion\"]},{\"id\":\"m4-distancia\",\"title\":\"Distance and probability\",\"titleEn\":\"Distance and probability\",\"description\":\"Models that reason by similarity (k-NN, SVM) or by probability (Naive Bayes).\",\"objective\":\"Know when a distance-based or probabilistic model is a good baseline and what it requires (scale, size).\",\"emoji\":\"📐\",\"cards\":[\"ml-modelo-knn\",\"ml-modelo-naive-bayes\",\"ml-modelo-svm\"]},{\"id\":\"m5-nosupervisado\",\"title\":\"Unsupervised\",\"titleEn\":\"Unsupervised\",\"description\":\"Grouping without labels, compressing columns, and detecting the unusual.\",\"objective\":\"Choose between k-means, DBSCAN, PCA, Isolation Forest and GMM by the shape of the data and the question.\",\"emoji\":\"🧭\",\"cards\":[\"ml-modelo-kmeans\",\"ml-modelo-kmeans-escalado\",\"ml-modelo-dbscan\",\"ml-modelo-pca\",\"ml-modelo-isolation-forest\",\"ml-modelo-gmm\"]},{\"id\":\"m6-series\",\"title\":\"Time series\",\"titleEn\":\"Time series\",\"description\":\"When the order of the rows IS the information.\",\"objective\":\"Recognize a time-series problem and always validate it on the future.\",\"emoji\":\"📈\",\"cards\":[\"ml-modelo-arima\"]},{\"id\":\"m7-deep\",\"title\":\"Deep learning\",\"titleEn\":\"Deep learning\",\"description\":\"Neural networks: MLP, CNN, detection, RNN/LSTM, Transformers, and encoder vs decoder.\",\"objective\":\"Know when to use networks and when not, and which architecture fits images, sequences, or text.\",\"emoji\":\"🌐\",\"cards\":[\"ml-modelo-redes\",\"ml-modelo-mlp\",\"ml-modelo-cnn\",\"ml-modelo-deteccion\",\"ml-modelo-rnn-lstm\",\"ml-modelo-transformer\",\"ml-modelo-bert-vs-gpt\"]},{\"id\":\"m8-generativos\",\"title\":\"Generative and representation models\",\"titleEn\":\"Generative and representation models\",\"description\":\"Models that learn representations or create content: autoencoders, recommenders, embeddings, GANs and diffusion.\",\"objective\":\"Choose the tool to compress, recommend, search by similarity, or generate images.\",\"emoji\":\"🎨\",\"cards\":[\"ml-modelo-autoencoder\",\"ml-modelo-recomendador\",\"ml-modelo-embeddings-busqueda\",\"ml-modelo-gan\",\"ml-modelo-diffusion\"]},{\"id\":\"m9-criterios\",\"title\":\"Final criteria\",\"titleEn\":\"Final criteria\",\"description\":\"Synthesis: the method for choosing a model in practice.\",\"objective\":\"Apply a step-by-step method to choose a model without overfitting the decision.\",\"emoji\":\"✅\",\"cards\":[\"ml-como-elegir-modelo\",\"ml-modelo-elegir-tabular\"]}],\"cards\":[{\"id\":\"ml-familias-modelos\",\"part\":\"m\",\"front\":\"What are the big model families, and what is each one for?\",\"back\":\"The model family is chosen by the TYPE of data and question, not by fashion.\\n\\n• Linear: a table, a simple relationship, you want to explain each column's weight.\\n• Trees and ensembles: a table with rules and non-linearity. The business default.\\n• Distance (k-NN, SVM, k-means): \\\"who looks like whom\\\".\\n• Time series: the ordered past predicts the future (sales, demand).\\n• Networks: image, audio, text, or huge tables with hard patterns.\\n• Generative: create new text, images, or audio.\\n\\nStart with the simplest family that can beat a baseline.\",\"topic\":\"Familias de modelos\",\"origin\":\"ai\",\"group\":\"Mapa\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-lineal\",\"part\":\"m\",\"front\":\"What is linear regression and when to use it?\",\"back\":\"It draws the best line (or plane) that predicts a NUMBER from the features: price ≈ a·sqm + b·rooms + c.\\n\\nAnalogy: a rule of three with several levers. Each coefficient says \\\"if this column goes up by 1, the prediction goes up by this much\\\".\\n\\nUse it when the relationship is roughly straight, you want to explain the result, or you need a fast baseline.\\n\\nDo not use it if the curve is clearly non-linear (a tree or a network captures that better) or if the output is a category.\",\"topic\":\"Regresión lineal\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-logistica\",\"part\":\"m\",\"front\":\"What is logistic regression and when to use it?\",\"back\":\"Despite the name, it is CLASSIFICATION. It takes a linear combination and passes it through a sigmoid to output a probability between 0 and 1 (spam 0.82).\\n\\nAnalogy: the same rule as linear regression, but the output is squashed into \\\"how likely is yes\\\".\\n\\nUse it as a binary-classification baseline when you want readable coefficients (\\\"this feature raises the risk\\\").\\n\\nDo not use it if classes separate along odd curves, or if you already know boosting clearly wins on your table. For more than two classes, see softmax.\",\"topic\":\"Regresión logística\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-softmax\",\"part\":\"m\",\"front\":\"How does a model classify when there are more than two classes?\",\"back\":\"Softmax turns several scores into probabilities that SUM to 1. The winning class is the highest probability.\\n\\nExample: photo → dog 0.7, cat 0.2, other 0.1.\\n\\nLogistic regression is the two-class case. Softmax is its sibling for N classes (product type, user intent).\\n\\nDo not confuse it with \\\"train N separate yes/no models\\\": softmax forces the probabilities to compete with each other.\",\"topic\":\"Softmax / multiclase\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-ridge-lasso\",\"part\":\"m\",\"front\":\"What are Ridge (L2) and Lasso (L1), and when do you pick one?\",\"back\":\"Ridge and Lasso are linear regressions with a brake (a penalty on the coefficients) so they do not memorize noise.\\n\\n• Ridge (L2): shrinks ALL coefficients toward zero, but does not set them exactly to zero. Useful when many columns matter a little and are correlated.\\n• Lasso (L1): can set coefficients to ZERO. It selects features: it keeps a few columns.\\n• Elastic Net: a mix of both.\\n\\nUse them when you have many columns relative to rows. They are still linear: they do not invent curves.\",\"topic\":\"Ridge y Lasso\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-arbol\",\"part\":\"m\",\"front\":\"What is a decision tree and when to use it?\",\"back\":\"It asks yes/no questions like \\\"income \u003e 40k?\\\" and \\\"age \u003c 25?\\\" until it reaches a leaf with the prediction.\\n\\nAnalogy: the \\\"guess the animal\\\" game. You can draw it and explain it to the business.\\n\\nUse it for readable rules, tabular data, and when you do not want to scale columns (trees do not need it).\\n\\nA single tree memorizes easily if you let it grow without a limit. In production it is almost always a piece of a forest or of boosting, not the final model.\",\"topic\":\"Árbol de decisión\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-random-forest\",\"part\":\"m\",\"front\":\"What is Random Forest and when to use it?\",\"back\":\"It trains MANY independent trees, each on a random sample of rows (with replacement), and combines their predictions.\\n\\n• At each split, each tree only looks at a random subset of columns: this makes the trees less alike.\\n• Classification: a vote or an average of probabilities (scikit-learn averages). Regression: an average.\\n\\nAnalogy: you ask 100 people who each saw a different slice of the same case. The average is wrong less often than one person.\\n\\nUse it on tables when you want something solid with little tuning: it lowers a single tree's overfitting.\\n\\nOn hard tables boosting usually beats it, and 500 trees are slower and more opaque than one.\",\"topic\":\"Random Forest\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting\",\"part\":\"m\",\"front\":\"What is gradient boosting (XGBoost, LightGBM, CatBoost) and when to use it?\",\"back\":\"Gradient boosting adds small trees in SERIES: each new tree is trained to fix the errors the ensemble still makes.\\n\\nTree 2 fixes tree 1, tree 3 fixes what is left, and so on.\\n\\n• XGBoost: the classic competition model on tables.\\n• LightGBM: faster on large datasets.\\n• CatBoost: better out of the box with categorical columns.\\n\\nUse it as the first serious bet on tabular data (fraud, churn, pricing).\\n\\nCareful: with little data or bad hyperparameters it overfits. It is less explainable than a single tree.\",\"topic\":\"Gradient Boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bagging-vs-boosting\",\"part\":\"m\",\"front\":\"How do bagging (Random Forest) and boosting differ?\",\"back\":\"Bagging trains many models in parallel and averages them (it lowers variance); boosting trains them in series, each fixing the previous one (it mainly lowers bias).\\n\\n• Bagging: independent models, each on a different sample. Random Forest is bagging of deep trees. Adding trees almost never causes overfitting.\\n• Boosting: small trees in series. XGBoost and LightGBM are boosting. Too many trees can overfit → early stopping.\\n\\nExam hint: \\\"many trees in parallel / vote\\\" → forest. \\\"each tree corrects the previous one\\\" → boosting.\",\"topic\":\"Bagging vs boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting-sobreajuste\",\"part\":\"m\",\"front\":\"Your LightGBM with 5,000 trees, learning rate 0.3, and very deep trees scores AUC 0.99 on train and 0.78 on validation. You have 20,000 rows and one week. What do you tune first?\",\"back\":\"Lower the learning rate, limit each tree's complexity, and let early stopping on validation decide how many trees to keep.\\n\\n• Boosting keeps fixing errors in series: with many trees and big steps it ends up fitting noise.\\n• Other levers: minimum examples per leaf, row and column subsampling, L1/L2 regularization of the leaves.\\n• Switching to a neural network does not address the cause: it is the same overfitting with another model.\\n• Adding more trees widens the gap.\\n\\nKey idea: in boosting, learning rate and number of trees are tuned together.\",\"topic\":\"Ajustar boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-rf-extrapolacion\",\"part\":\"m\",\"front\":\"A Random Forest predicts house prices, trained on sizes from 40 to 200 m². A 400 m² house arrives and the prediction is almost the same as for 200 m². Bug or expected behavior?\",\"back\":\"Expected behavior: a Random Forest predicts by averaging values seen in its leaves, so outside the training range its prediction stays flat.\\n\\n• It can never predict a price above the maximum seen in train.\\n• A linear regression does extrapolate (though it may do it badly if the relationship is not linear).\\n• In production, watch for inputs outside the training range and handle them separately.\\n• On trending time series, trees on raw values fail for the same reason.\\n\\nKey idea: trees interpolate well; they do not extrapolate.\",\"topic\":\"Los árboles no extrapolan\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-knn\",\"part\":\"m\",\"front\":\"What is k-NN and when to use it?\",\"back\":\"k-NN does not summarize the data into weights: it stores the examples and, to predict, looks at the k most similar ones.\\n\\n• Classify: the neighbors' vote wins.\\n• Regression: average the neighbors' number.\\n\\nAnalogy: \\\"you are who you hang out with\\\". k=1 copies the nearest neighbor (noisy). A very large k looks like predicting everyone's average.\\n\\nUse it on small problems and as intuition. Scale the columns or distance lies. With millions of rows, predicting is slow.\",\"topic\":\"k-NN\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-naive-bayes\",\"part\":\"m\",\"front\":\"What is Naive Bayes and when to use it?\",\"back\":\"Naive Bayes classifies with probabilities: \\\"if I see these words, how likely is each class?\\\", using Bayes' theorem.\\n\\nIt assumes the features are independent of each other given the class (hence \\\"naive\\\"). In real text words are not, and it still usually works well as a baseline.\\n\\nUse it as a fast text baseline (spam, ticket topic) and when you have little data.\\n\\nIts probabilities tend to be too extreme: do not use them as a calibrated risk. If you need the best accuracy, boosting or a network usually wins.\",\"topic\":\"Naive Bayes\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-svm\",\"part\":\"m\",\"front\":\"What is an SVM and when to use it?\",\"back\":\"An SVM looks for the boundary that separates the classes with the WIDEST possible margin to the closest points.\\n\\n• Support vectors: the points that sit on the margin or violate it; only they define the boundary.\\n• With a kernel (e.g. RBF) it gets curved boundaries a straight line cannot.\\n\\nUse it on small or medium datasets, with many columns (text, genes) and scaled features: it is sensitive to scale.\\n\\nWith a kernel, training grows at least with the square of the number of rows: with hundreds of thousands of rows it becomes impractical. The linear version scales better; on large business tables, boosting is usually more practical.\",\"topic\":\"SVM\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-kmeans\",\"part\":\"m\",\"front\":\"What is k-means and when to use it?\",\"back\":\"k-means groups UNLABELED examples into k clusters around k centers. It places k centers, assigns each point to the nearest center, moves the centers, and repeats.\\n\\nAnalogy: splitting a city into k zones around k plazas.\\n\\nUse it to segment customers or to explore. YOU choose k. It works if clusters are roughly round and similar in size.\\n\\nDo not use it if there is a lot of noise, ring-shaped groups, or you do not want to fix k up front (see DBSCAN).\",\"topic\":\"k-means\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-kmeans-escalado\",\"part\":\"m\",\"front\":\"You segment customers with k-means using \\\"annual spend\\\" (0–50,000) and \\\"visits per month\\\" (0–30). The 4 groups are split only by spend, as if visits did not exist. What went wrong?\",\"back\":\"k-means groups by distance, so without scaling the largest-range column dominates; standardize the columns before clustering.\\n\\n• A difference of 5,000 in spend weighs far more than one of 20 visits.\\n• After standardizing (mean 0, std 1), each column contributes according to its relative variation.\\n• Changing k does not fix it: the problem is scale, not the number of groups.\\n• The same affects k-NN, PCA and SVM; trees barely.\\n\\nKey idea: with distances, scale first.\",\"topic\":\"k-means y escala\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-dbscan\",\"part\":\"m\",\"front\":\"What is DBSCAN, and where does it beat k-means?\",\"back\":\"It also clusters, but by density: a cluster is a zone where points sit close together. What stays loose is marked as noise, not forced into a group.\\n\\nYou do not give it k. You give \\\"how close\\\" (eps) and \\\"minimum neighbors\\\" (min_samples).\\n\\nUse it when clusters have odd shapes or there are outliers you do not want inside a segment.\\n\\nDo not use it if clusters have very different densities: it either swallows one or splits the other.\",\"topic\":\"DBSCAN\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-pca\",\"part\":\"m\",\"front\":\"What is PCA and what is it for?\",\"back\":\"It compresses many numeric columns into a few \\\"directions\\\" that keep the most variation. It does not predict a label: it reorganizes the data.\\n\\nAnalogy: a photo of a city from the angle that most separates the buildings, not from every angle at once.\\n\\nUse it to visualize in 2D, denoise, or speed up a later model. Standardize first: otherwise the largest-scale column dominates.\\n\\nTrap: if the useful signal is small (not the highest-variance one), PCA throws it away. Do not read \\\"component 1\\\" as if it were an original column.\",\"topic\":\"PCA\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-isolation-forest\",\"part\":\"m\",\"front\":\"Which model do I use to detect anomalies in a table?\",\"back\":\"Isolation Forest: random trees that try to \\\"isolate\\\" each point. The odd one is isolated in a few cuts; the normal one needs many. You do not need labeled fraud examples.\\n\\nUse it for fraud, sensor faults, or impossible rows, when almost everything is \\\"normal\\\" and you have no labels for the rare cases.\\n\\nIt does not replace a classifier if you DO have a labeled fraud history: supervised boosting usually wins there. Anomaly means \\\"different\\\", not automatically \\\"bad\\\".\",\"topic\":\"Isolation Forest\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-gmm\",\"part\":\"m\",\"front\":\"What is a Gaussian Mixture Model (GMM) and when to use it?\",\"back\":\"It clusters by assuming the data come from several \\\"bells\\\" (normal distributions). Unlike k-means, a point can belong PARTLY to several groups (a soft probability).\\n\\nUse it when segments overlap and you care about \\\"how much of each group\\\" (mixed customers), not a hard label.\\n\\nYou still choose how many bells. If the groups are not elliptical, the assumption fails.\",\"topic\":\"Mezcla de gaussianas\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-arima\",\"part\":\"m\",\"front\":\"What is ARIMA, and when is it good for forecasting?\",\"back\":\"ARIMA is a TIME SERIES model: it predicts the next value from past values and past errors; trend is handled by differencing the series.\\n\\nFor seasonality (sales that rise every December) you use its seasonal version, SARIMA. The order of the rows IS the information.\\n\\nUse it on one series with enough history and a repeating pattern (demand, traffic).\\n\\nWith many series, external regressors, or holidays, look at tools that accept them (in BigQuery ML, ARIMA_PLUS handles many series and HOLIDAY_REGION; ARIMA_PLUS_XREG, external regressors). Always validate on the future, never by shuffling.\",\"topic\":\"ARIMA y series de tiempo\",\"origin\":\"ai\",\"group\":\"Series de tiempo\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-redes\",\"part\":\"m\",\"front\":\"What are neural networks, and when to use them?\",\"back\":\"A neural network stacks layers of \\\"neurons\\\": each one mixes inputs with weights and applies a non-linear function. Layer after layer learns representations, from simple (an edge) to abstract (\\\"this is a cat\\\").\\n\\nAnalogy: an assembly line. Each station transforms the piece a little.\\n\\nUse them with A LOT of data on images, audio, text, or sequences. Also when hand-made features are not enough.\\n\\nOn a 5,000-row table, boosting often matches them with less compute and less mystery. \\\"Network\\\" does not mean \\\"better\\\".\",\"topic\":\"Redes neuronales\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-mlp\",\"part\":\"m\",\"front\":\"What is a dense network (MLP), and how is it different from a CNN?\",\"back\":\"MLP = multilayer perceptron: every neuron connects to ALL of the previous layer. It does not know that two neighboring pixels are neighbors.\\n\\nUse it on vectors that are already built (tabular features, embeddings) when you want non-linearity and have plenty of data.\\n\\nFor images use a CNN (it looks at local patterns). For long text, a Transformer. Flattening a photo into an MLP works, but it wastes the structure.\",\"topic\":\"Red densa (MLP)\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-cnn\",\"part\":\"m\",\"front\":\"What is a CNN and what is it for?\",\"back\":\"A convolutional network: small filters slide over the image looking for local patterns (edge, texture, eye) and combine them.\\n\\nThe idea that makes it work: a cat is still a cat if it shifts a few pixels. The same filter works anywhere.\\n\\nUse it to classify images, and as the base of object detection. Sometimes also on audio or series, treated as a 1D \\\"image\\\".\\n\\nIt is not the model for an Excel table. A tree is usually simpler there and just as good.\",\"topic\":\"CNN\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-deteccion\",\"part\":\"m\",\"front\":\"How is classifying an image different from detecting objects?\",\"back\":\"Classification gives one label for the whole image; detection locates each object with a box and its class; segmentation assigns a class to every pixel.\\n\\n• Classification: one label for the WHOLE photo (\\\"there is a dog\\\").\\n• Detection: several boxes, each with a class and a position (\\\"dog here, person there\\\"). YOLO and family are the classic example.\\n• Segmentation: paints pixel by pixel which object it is (a mask), not just a box.\\n\\nChoose by the question. \\\"Is this X-ray normal?\\\" is classification. \\\"Where is the tumor?\\\" is detection or segmentation. A classification CNN alone does not draw boxes.\",\"topic\":\"Detección vs clasificación\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-rnn-lstm\",\"part\":\"m\",\"front\":\"What are RNNs and LSTMs, and why did Transformers replace them for text?\",\"back\":\"An RNN reads the sequence one step at a time and passes a \\\"state\\\" to the next step, like a person summarizing what they have read so far.\\n\\nAn LSTM is an RNN with a longer memory: it decides what to remember and what to forget. It was used for translation and series before 2017.\\n\\nProblem: it reads in order, so it does not parallelize well and struggles to keep distant information. A Transformer relates all positions at once (attention) and trains in parallel. Today, for text, start with a Transformer; LSTM remains for short series or older systems.\",\"topic\":\"RNN y LSTM\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-transformer\",\"part\":\"m\",\"front\":\"What is a Transformer and what is it used for?\",\"back\":\"A network whose core piece is attention: each token (a piece of a word) looks at the others and decides which ones matter for its meaning.\\n\\nAnalogy: in a sentence, \\\"bank\\\" looks around to know if it is a seat or a place for money.\\n\\nIt is the backbone of LLMs (GPT, Gemini) and also of vision models. It captures distant relationships and trains in parallel better than an RNN, although attention cost grows with the square of the length.\\n\\nIt costs a lot of data and compute. You do not need it for a 10-column table. Tokens, prompts, and hallucinations are in the AI deck.\",\"topic\":\"Transformer\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bert-vs-gpt\",\"part\":\"m\",\"front\":\"How do a BERT-style model and a GPT-style model differ?\",\"back\":\"A BERT-style model is an encoder that reads the whole text in both directions to understand it; a GPT-style model is a decoder that predicts the next token to generate.\\n\\n• Encoder (BERT and family): good for classifying, searching, or extracting entities. It is not built to keep writing.\\n• Decoder (GPT and family): only looks backward (causal mask). Good for generating text.\\n• Both are Transformers; what changes is what they look at and what they were trained for.\\n\\nHint: \\\"finish the sentence\\\" or \\\"chat\\\" → decoder. \\\"What is this document about?\\\" → encoder, or a decoder you ask to do that task.\",\"topic\":\"Encoder vs decoder\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-autoencoder\",\"part\":\"m\",\"front\":\"What is an autoencoder and what is it for?\",\"back\":\"A network that compresses the input into a small vector (the \\\"bottleneck\\\") and then tries to rebuild it. It uses no labels: it learns a representation.\\n\\nIf it rebuilds normal things well and odd things BADLY, the reconstruction error flags anomalies.\\n\\nUse it to compress, denoise, or spot the unusual in images or sensors.\\n\\nIt is not a classifier. If you have labels, a supervised model is usually more direct.\",\"topic\":\"Autoencoder\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-recomendador\",\"part\":\"m\",\"front\":\"How does a model recommend products, in the two classic ideas?\",\"back\":\"The two classic ideas are collaborative filtering (\\\"people like you bought this\\\") and content-based filtering (\\\"it looks like what you liked\\\").\\n\\n• Collaborative filtering: \\\"people like you bought this\\\". It uses the user–item matrix. It fails for new users (cold start).\\n• Content-based: \\\"this item looks like ones you already liked\\\" (genre, text, embeddings). It works for a new user if you can describe the item.\\n\\nIn practice they are mixed, and sometimes a network is used (two-tower: a user vector and an item vector, then you search for the nearest).\\n\\nIt is not the same as a \\\"will they buy yes/no?\\\" classifier on a single row, though it is sometimes framed that way.\",\"topic\":\"Sistemas de recomendación\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-embeddings-busqueda\",\"part\":\"m\",\"front\":\"Support wants to see, for each new ticket, the 10 most similar past tickets among 300,000, with no labels and a response under 1 second. Which approach do you choose?\",\"back\":\"Turn each ticket into an embedding with a pre-trained text model and find the nearest neighbors with an approximate index (ANN).\\n\\n• Without labels there is no classifier to train; none is needed.\\n• Texts with similar meaning end up close even when they use different words.\\n• Cheap baseline: TF-IDF + cosine similarity.\\n• Asking an LLM to compare the ticket with 300,000 would be slow and expensive.\\n• k-means groups, but does not answer \\\"the 10 most similar to THIS one\\\".\\n\\nKey idea: embeddings + nearest neighbors = semantic search.\",\"topic\":\"Búsqueda por similitud\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-gan\",\"part\":\"m\",\"front\":\"What is a GAN, and what was it used for?\",\"back\":\"A GAN is two competing networks: a generator that creates examples and a discriminator that tries to tell them from real ones. The generator invents examples (a face). The discriminator tries to say whether it is real or fake. The generator improves until it fools the discriminator.\\n\\nAnalogy: a forger and an expert. Each one forces the other to improve.\\n\\nThey were used to generate realistic images. Training them is unstable: if the discriminator wins too easily, the generator stops getting a useful signal, or the generator collapses to a few variants (mode collapse).\\n\\nToday, for generating images, diffusion models are usually more stable. The idea of \\\"two networks competing\\\" still shows up on exams.\",\"topic\":\"GAN\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-diffusion\",\"part\":\"m\",\"front\":\"What is a diffusion model and what is it used for?\",\"back\":\"A diffusion model generates images by learning to remove noise step by step. Training: you add noise to a real image until it is static, and you teach it to undo one step. Generating: you start from pure noise and clean it until an image appears.\\n\\nIt is the base of modern image generators (Stable Diffusion and family). You can steer it with text (\\\"a lighthouse at night\\\").\\n\\nIt is not an LLM: it does not predict the next token of a sentence. If the task is writing, use a language model; if it is painting, diffusion.\",\"topic\":\"Modelos de difusión\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-como-elegir-modelo\",\"part\":\"m\",\"front\":\"How do I choose a model in practice, step by step?\",\"back\":\"Define the question, set a dumb baseline, try the simple model that fits the data type first, and add complexity only if validation and the business justify it.\\n\\n1. Write the question: number, category, group, series, text, or image.\\n2. Put down a dumb baseline (majority, average, business rule).\\n3. Table → logistic regression or a tree, then boosting. Image → CNN or a pretrained model. Generative text → LLM. Forecast → time series.\\n4. Compare on validation, never tuning on test.\\n5. Raise complexity only if the business metric pays for it.\\n\\nIf you do not beat the baseline, the problem is usually the data or the question, not \\\"we need a bigger model\\\".\",\"topic\":\"Cómo elegir modelo\",\"origin\":\"ai\",\"group\":\"Criterios\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-elegir-tabular\",\"part\":\"m\",\"front\":\"You have 50,000 customers with 40 columns (numeric and categorical) to predict churn. The business requires explaining decisions and the team is small. Which model do you start with?\",\"back\":\"Start with logistic regression as an explainable baseline, then try gradient-boosted trees, which usually perform better on tables.\\n\\n• Logistic: fast, readable coefficients, a good point of comparison.\\n• Boosting (XGBoost, LightGBM, HistGradientBoosting): captures non-linearities and interactions; explained with permutation importance or SHAP.\\n• A deep network rarely beats boosting on medium-sized tables and is harder to tune.\\n• k-NN: slow at prediction time and clumsy with categorical columns.\\n\\nKey idea: simple first, boosting next, and only if validation pays for it.\",\"topic\":\"Elegir modelo en tablas\",\"origin\":\"ai\",\"group\":\"Criterios\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"}]},\"flows\":[{\"id\":\"ruta-ml-desde-cero\",\"emoji\":\"🌱\",\"title\":{\"es\":\"Machine Learning desde 0\",\"en\":\"Machine Learning from scratch\"}}]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: light)\",\"content\":\"#f8fafc\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-scheme: dark)\",\"content\":\"#0d0d0d\"}]]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}],[\"$\",\"meta\",\"3\",{\"name\":\"application-name\",\"content\":\"Quiz Practice\"}],[\"$\",\"link\",\"4\",{\"rel\":\"manifest\",\"href\":\"/quiz-web-pages/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"5\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"6\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Quiz Practice\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"black-translucent\"}],[\"$\",\"link\",\"8\",{\"rel\":\"icon\",\"
