ds\",[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cards\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"id\",\"fundamentals-ml-modelos\",\"d\"],[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L3\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"cards\",\"children\",\"$0:f:0:1:2:children:2:children:0\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L4\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[\"__PAGE__\",[\"$\",\"$1\",\"c\",{\"children\":[\"$L5\",null,[\"$\",\"$L6\",null,{\"children\":\"$L7\"}]]}],{},null,false]},null,false]},null,false]},null,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$1\",\"TIRRmnu4kjuDgnzy9U1QB\",{\"children\":[[\"$\",\"$L8\",null,{\"children\":\"$L9\"}],[\"$\",\"$La\",null,{\"children\":\"$Lb\"}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$c\",\"$undefined\"],\"s\":false,\"S\":true}\n"])</script><script>self.__next_f.push([1,"d:I[7844,[\"47\",\"static/chunks/47-aeb0cb411d578155.js\",\"872\",\"static/chunks/app/cards/%5Bid%5D/page-5f6564a25a07b7da.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Ld\",null,{\"deckEs\":{\"quizId\":\"fundamentals-ml-modelos\",\"quizTitle\":\"Fundamentos de ML — Tipos de modelos y cuándo usar cada uno\",\"cardCount\":30,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🧩\",\"description\":\"Mapa de modelos desde cero: qué hace cada uno, una analogía, para qué sirve y cuándo NO usarlo.\",\"cards\":[{\"id\":\"ml-familias-modelos\",\"part\":\"m\",\"front\":\"¿Cuáles son las familias grandes de modelos y para qué se usa cada una?\",\"back\":\"Elige por el TIPO de dato y de pregunta, no por la moda.\\n\\n• Lineales: tabla, relación simple, quieres explicar el peso de cada columna.\\n• Árboles y ensembles: tabla con reglas y no linealidad. El default de negocio.\\n• Distancia (k-NN, SVM, k-means): \\\"quién se parece a quién\\\".\\n• Series de tiempo: el pasado ordenado predice el futuro (ventas, demanda).\\n• Redes: imagen, audio, texto o tablas enormes con patrones difíciles.\\n• Generativos: crear texto, imagen o audio nuevos.\\n\\nEmpieza por la familia más simple que pueda ganar a una baseline.\",\"topic\":\"Familias de modelos\",\"origin\":\"ai\",\"group\":\"Mapa\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-lineal\",\"part\":\"m\",\"front\":\"¿Qué es una regresión lineal y cuándo usarla?\",\"back\":\"Dibuja la mejor línea (o plano) que predice un NÚMERO a partir de las features: precio ≈ a·m² + b·habitaciones + c.\\n\\nAnalogía: una regla de tres con varias palancas. Cada coeficiente dice \\\"si esta columna sube 1, la predicción sube tanto\\\".\\n\\nÚsala cuando la relación es más o menos recta, quieres explicar el resultado, o necesitas una baseline rápida.\\n\\nNo la uses si la curva es claramente no lineal (un árbol o una red lo capturan mejor) o si la salida es una categoría.\",\"topic\":\"Regresión lineal\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-ridge-lasso\",\"part\":\"m\",\"front\":\"¿Qué son Ridge (L2) y Lasso (L1), y cuándo eliges uno?\",\"back\":\"Son regresiones lineales con un freno para no memorizar ruido.\\n\\n• Ridge (L2): encoge TODOS los coeficientes hacia cero, pero casi ninguno llega a cero. Útil si muchas columnas importan un poco y están correlacionadas.\\n• Lasso (L1): puede poner coeficientes en CERO. Hace selección de features: se queda con pocas columnas.\\n• Elastic Net: mezcla de las dos.\\n\\nÚsalos cuando hay muchas columnas respecto a las filas. Siguen siendo lineales: no inventan curvas.\",\"topic\":\"Ridge y Lasso\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-logistica\",\"part\":\"m\",\"front\":\"¿Qué es la regresión logística y cuándo usarla?\",\"back\":\"Pese al nombre, es CLASIFICACIÓN. Toma una combinación lineal y la pasa por una sigmoide para dar una probabilidad entre 0 y 1 (spam 0.82).\\n\\nAnalogía: la misma regla de la regresión lineal, pero la salida se aplasta a \\\"qué tan probable es el sí\\\".\\n\\nÚsala como baseline de clasificación binaria cuando quieres coeficientes legibles (\\\"esta feature sube el riesgo\\\").\\n\\nNo la uses si las clases se separan con curvas raras, o si ya sabes que un boosting gana claro en tu tabla. Para más de dos clases, mira softmax.\",\"topic\":\"Regresión logística\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-softmax\",\"part\":\"m\",\"front\":\"¿Cómo clasifica un modelo cuando hay más de dos clases?\",\"back\":\"Softmax convierte varios puntajes en probabilidades que SUMAN 1. La clase ganadora es la de mayor probabilidad.\\n\\nEjemplo: foto → perro 0.7, gato 0.2, otro 0.1.\\n\\nLa regresión logística es el caso de dos clases. Softmax es su hermana para N clases (tipo de producto, intención del usuario).\\n\\nNo confundir con \\\"entrenar N modelos sí/no por separado\\\": softmax obliga a que las probabilidades compitan entre sí.\",\"topic\":\"Softmax / multiclase\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-arbol\",\"part\":\"m\",\"front\":\"¿Qué es un árbol de decisión y cuándo usarlo?\",\"back\":\"Hace preguntas sí/no del estilo \\\"¿ingresos \u003e 40k?\\\" y \\\"¿edad \u003c 25?\\\" hasta llegar a una hoja con la predicción.\\n\\nAnalogía: el juego de \\\"adivina el animal\\\" con preguntas. Lo puedes dibujar y explicárselo a negocio.\\n\\nÚsalo para reglas legibles, datos tabulares, y cuando no quieres escalar columnas (los árboles no lo necesitan).\\n\\nUn árbol solo memoriza fácil si lo dejas crecer sin límite. En producción casi siempre es la pieza de un bosque o de boosting, no el modelo final.\",\"topic\":\"Árbol de decisión\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-random-forest\",\"part\":\"m\",\"front\":\"¿Qué es Random Forest y cuándo usarlo?\",\"back\":\"Entrena MUCHOS árboles en paralelo. Cada uno ve una muestra distinta de filas y un subconjunto de columnas. Al final se vota (clasificación) o se promedia (regresión).\\n\\nAnalogía: preguntas a 100 personas que vieron partes distintas del mismo caso. El promedio se equivoca menos que una sola.\\n\\nÚsalo en tablas cuando quieres algo sólido con poco ajuste. Baja el overfitting de un árbol solo.\\n\\nNo es el más preciso en tablas difíciles (ahí suele ganar el boosting) y un bosque de 500 árboles es más lento y más opaco que un árbol.\",\"topic\":\"Random Forest\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting\",\"part\":\"m\",\"front\":\"¿Qué es el gradient boosting (XGBoost, LightGBM, CatBoost) y cuándo usarlo?\",\"back\":\"También son árboles, pero en SERIE: el árbol 2 se entrena para corregir los errores del 1, el 3 corrige lo que quedó, y así.\\n\\n• XGBoost: el clásico de competiciones en tablas.\\n• LightGBM: más rápido en datasets grandes.\\n• CatBoost: mejor de fábrica con columnas categóricas.\\n\\nÚsalo como primera apuesta seria en datos tabulares (fraude, churn, precios).\\n\\nCuidado: con pocos datos o malos hiperparámetros sobreajusta. Es menos explicable que un árbol solo.\",\"topic\":\"Gradient Boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bagging-vs-boosting\",\"part\":\"m\",\"front\":\"¿En qué se diferencian bagging (Random Forest) y boosting?\",\"back\":\"Los dos combinan modelos débiles. Cambia el CÓMO.\\n\\n• Bagging: modelos en paralelo, cada uno independiente, y promedias. Random Forest es bagging de árboles. Baja varianza.\\n• Boosting: modelos en serie, cada uno mira los errores del anterior. XGBoost es boosting. Baja sesgo, con más riesgo de overfitting.\\n\\nPista de examen: \\\"muchos árboles en paralelo / voto\\\" → bosque. \\\"cada árbol corrige al anterior\\\" → boosting.\",\"topic\":\"Bagging vs boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-svm\",\"part\":\"m\",\"front\":\"¿Qué es una SVM y cuándo usarla?\",\"back\":\"Busca la raya que separa las clases dejando el margen MÁS ancho posible. Los puntos que tocan ese margen son los \\\"vectores de soporte\\\".\\n\\nCon un kernel (truco matemático) puede doblar el espacio y separar nubes que una línea recta no separa.\\n\\nÚsala en datasets pequeños o medianos, con muchas columnas (texto, genes) y cuando el margen importa.\\n\\nNo la uses con millones de filas: entrena lento y es sensible a la escala. En tablas grandes de negocio, el boosting suele ser más práctico.\",\"topic\":\"SVM\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-knn\",\"part\":\"m\",\"front\":\"¿Qué es k-NN y cuándo usarlo?\",\"back\":\"No \\\"entrena\\\" un resumen. Guarda los ejemplos y, para predecir, mira los k más parecidos.\\n\\n• Clasificar: gana el voto de los vecinos.\\n• Regresión: promedias el número de los vecinos.\\n\\nAnalogía: \\\"dime con quién andas\\\". k=1 copia al vecino más cercano (ruidoso). k muy grande se parece a predecir el promedio de todos.\\n\\nÚsalo en problemas chicos y como intuición. Escala las columnas o la distancia miente. Con millones de filas, predecir es lento.\",\"topic\":\"k-NN\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-naive-bayes\",\"part\":\"m\",\"front\":\"¿Qué es Naive Bayes y cuándo usarlo?\",\"back\":\"Clasifica con probabilidad: \\\"si veo estas palabras, ¿qué tan probable es cada clase?\\\". Asume que las features son independientes (por eso \\\"naive\\\": ingenuo). En el texto real las palabras no son independientes, y aun así funciona.\\n\\nÚsalo como baseline rápida de texto (spam, tema de un ticket) y cuando hay poco dato.\\n\\nNo lo uses si las features numéricas están muy ligadas entre sí y necesitas la mejor precisión: un boosting o una red suelen ganar.\",\"topic\":\"Naive Bayes\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-kmeans\",\"part\":\"m\",\"front\":\"¿Qué es k-means y cuándo usarlo?\",\"back\":\"Agrupa ejemplos SIN etiqueta en k grupos. Pone k centros, asigna cada punto al centro más cercano, mueve los centros, y repite.\\n\\nAnalogía: repartir una ciudad en k zonas alrededor de k plazas.\\n\\nÚsalo para segmentar clientes o explorar. TÚ eliges k. Funciona si los grupos son más o menos redondos y de tamaño parecido.\\n\\nNo lo uses si hay mucho ruido, grupos con forma de aro, o no quieres fijar k de antemano (mira DBSCAN).\",\"topic\":\"k-means\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-dbscan\",\"part\":\"m\",\"front\":\"¿Qué es DBSCAN y en qué gana a k-means?\",\"back\":\"También agrupa, pero por densidad: un grupo es una zona donde los puntos están pegados. Lo que queda suelto se marca como ruido, no se fuerza a un grupo.\\n\\nNo le das k. Le das \\\"qué tan cerca\\\" y \\\"cuántos vecinos mínimos\\\".\\n\\nÚsalo cuando los grupos tienen formas raras o hay outliers que no quieres meter en un segmento.\\n\\nNo lo uses si los grupos tienen densidades muy distintas: o se come uno, o parte el otro.\",\"topic\":\"DBSCAN\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-gmm\",\"part\":\"m\",\"front\":\"¿Qué es una mezcla de gaussianas (GMM) y cuándo usarla?\",\"back\":\"Agrupa asumiendo que los datos salen de varias \\\"campanas\\\" (distribuciones normales). A diferencia de k-means, un punto puede pertenecer EN PARTE a varios grupos (probabilidad blanda).\\n\\nÚsala cuando los segmentos se solapan y te importa \\\"qué tan de cada grupo es\\\" (clientes mixtos), no una etiqueta dura.\\n\\nSigue necesitando que elijas cuántas campanas. Si los grupos no son elípticos, la suposición falla.\",\"topic\":\"Mezcla de gaussianas\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-isolation-forest\",\"part\":\"m\",\"front\":\"¿Qué modelo uso para detectar anomalías en una tabla?\",\"back\":\"Isolation Forest: árboles al azar que intentan \\\"aislar\\\" cada punto. Lo raro se aísla en pocos cortes; lo normal necesita muchos. No necesitas ejemplos etiquetados de fraude.\\n\\nÚsalo para fraude, fallos de sensor o filas imposibles, cuando casi todo es \\\"normal\\\" y no tienes labels de los raros.\\n\\nNo sustituye un clasificador si SÍ tienes historial etiquetado de fraude: ahí un boosting supervisado suele ganar. La anomalía es \\\"distinto\\\", no automáticamente \\\"malo\\\".\",\"topic\":\"Isolation Forest\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-pca\",\"part\":\"m\",\"front\":\"¿Qué es PCA y para qué se usa?\",\"back\":\"Comprime muchas columnas numéricas en pocas \\\"direcciones\\\" que conservan la mayor variación. No predice un label: reorganiza el dato.\\n\\nAnalogía: una foto de una ciudad desde el ángulo que más diferencia los edificios, no desde todos los ángulos a la vez.\\n\\nÚsalo para visualizar en 2D, quitar ruido o acelerar un modelo posterior.\\n\\nTrampa: si la señal útil es chiquita (no es la de más varianza), PCA la tira. No interpretes el \\\"componente 1\\\" como si fuera una columna original.\",\"topic\":\"PCA\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-arima\",\"part\":\"m\",\"front\":\"¿Qué es ARIMA y cuándo sirve para pronosticar?\",\"back\":\"Un modelo de SERIES DE TIEMPO: predice el siguiente valor usando los valores pasados, la tendencia y la estacionalidad (ventas que suben en diciembre).\\n\\nNo es una tabla de clientes sueltos. El orden de las filas ES la información.\\n\\nÚsalo en una serie, con historia suficiente y un patrón que se repite (demanda, tráfico).\\n\\nSi hay muchas series, eventos externos o días festivos locales, mira modelos que acepten esas señales (en BigQuery ML, ARIMA_PLUS con HOLIDAY_REGION). No mezcles el futuro en el train.\",\"topic\":\"ARIMA y series de tiempo\",\"origin\":\"ai\",\"group\":\"Series de tiempo\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-redes\",\"part\":\"m\",\"front\":\"¿Qué son las redes neuronales y cuándo usarlas?\",\"back\":\"Capas de \\\"neuronas\\\": cada una mezcla las entradas con pesos y una función no lineal. Capa tras capa aprende representaciones, de lo simple (un borde) a lo abstracto (\\\"esto es un gato\\\").\\n\\nAnalogía: una línea de montaje. Cada estación transforma la pieza un poco.\\n\\nÚsalas con MUCHO dato en imagen, audio, texto o secuencias. También cuando las features a mano no alcanzan.\\n\\nEn una tabla de 5 000 filas, un boosting suele igualarlas con menos cómputo y menos misterio. \\\"Red\\\" no significa \\\"mejor\\\".\",\"topic\":\"Redes neuronales\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-mlp\",\"part\":\"m\",\"front\":\"¿Qué es una red densa (MLP) y en qué se diferencia de una CNN?\",\"back\":\"MLP = multilayer perceptron: cada neurona se conecta con TODAS las de la capa anterior. No sabe que dos píxeles vecinos son vecinos.\\n\\nÚsala en vectores ya armados (features tabulares, embeddings) cuando quieres no linealidad y tienes datos de sobra.\\n\\nPara imágenes usa una CNN (mira patrones locales). Para texto largo, un Transformer. Meter una foto aplastada en un MLP funciona, pero desperdicia la estructura.\",\"topic\":\"Red densa (MLP)\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-cnn\",\"part\":\"m\",\"front\":\"¿Qué es una CNN y para qué sirve?\",\"back\":\"Red convolucional: filtros chicos que recorren la imagen buscando patrones locales (borde, textura, ojo) y los combinan.\\n\\nLa idea que la hace funcionar: un gato sigue siendo un gato si se corre unos píxeles. El mismo filtro sirve en cualquier zona.\\n\\nÚsala para clasificar imágenes, y como base de detección de objetos. A veces también en audio o series, tratándolos como una \\\"imagen\\\" 1D.\\n\\nNo es el modelo de una tabla de Excel. Ahí un árbol suele ser más simple y igual de bueno.\",\"topic\":\"CNN\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-deteccion\",\"part\":\"m\",\"front\":\"¿En qué se diferencia clasificar una imagen de detectar objetos?\",\"back\":\"• Clasificación: una etiqueta para TODA la foto (\\\"hay un perro\\\").\\n• Detección: varias cajas, cada una con clase y posición (\\\"perro aquí, persona allá\\\"). YOLO y familia son el ejemplo clásico.\\n• Segmentación: pinta píxel a píxel qué objeto es (máscara), no solo una caja.\\n\\nElige por la pregunta. \\\"¿Esta radiografía es normal?\\\" es clasificación. \\\"¿Dónde está el tumor?\\\" es detección o segmentación. Una CNN sola de clasificación no dibuja cajas.\",\"topic\":\"Detección vs clasificación\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-rnn-lstm\",\"part\":\"m\",\"front\":\"¿Qué son RNN y LSTM, y por qué los Transformers las reemplazaron en texto?\",\"back\":\"Una RNN lee la secuencia de a un paso y se pasa un \\\"estado\\\" al siguiente, como una persona que resume lo leído hasta ahora.\\n\\nLa LSTM es una RNN con memoria más larga: decide qué recordar y qué olvidar. Sirvió para traducción y series antes de 2017.\\n\\nProblema: lee en orden, así que es lenta en textos largos y olvida el principio. El Transformer mira todo el contexto de una vez (atención) y escala mejor. Hoy, para texto, empieza por un Transformer; LSTM queda en series cortas o sistemas viejos.\",\"topic\":\"RNN y LSTM\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-transformer\",\"part\":\"m\",\"front\":\"¿Qué es un Transformer y para qué se usa?\",\"back\":\"Una red cuya pieza central es la atención: cada token (trozo de palabra) mira a los demás y decide cuáles le importan para entenderse.\\n\\nAnalogía: en una frase, \\\"banco\\\" mira alrededor para saber si es un asiento o un sitio de dinero.\\n\\nEs la base de los LLM (GPT, Gemini) y también de modelos de visión. Escala a textos largos mejor que una RNN.\\n\\nCuesta muchos datos y cómputo. Para una tabla de 10 columnas no lo necesitas. Tokens, prompts y alucinaciones están en el mazo de IA.\",\"topic\":\"Transformer\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bert-vs-gpt\",\"part\":\"m\",\"front\":\"¿En qué se diferencian un modelo tipo BERT y uno tipo GPT?\",\"back\":\"Los dos son Transformers. Cambia qué miran y para qué se entrenaron.\\n\\n• Encoder (BERT y familia): lee la frase COMPLETA, en las dos direcciones. Sirve para entender: clasificar, buscar, extraer entidades. No está hecho para seguir escribiendo.\\n• Decoder (GPT y familia): predice el siguiente token y solo mira hacia atrás. Sirve para generar texto.\\n\\nPista: \\\"completa la frase\\\" o \\\"chat\\\" → decoder. \\\"¿de qué trata este documento?\\\" → encoder, o un decoder al que le pides esa tarea.\",\"topic\":\"Encoder vs decoder\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-autoencoder\",\"part\":\"m\",\"front\":\"¿Qué es un autoencoder y para qué sirve?\",\"back\":\"Una red que comprime la entrada a un vector chico (el \\\"cuello\\\") y luego intenta reconstruirla. No usa labels: aprende una representación.\\n\\nSi reconstruye bien lo normal y MAL lo raro, el error de reconstrucción delata anomalías.\\n\\nÚsalo para comprimir, quitar ruido o detectar lo inusual en imágenes o sensores.\\n\\nNo es un clasificador. Si tienes etiquetas, un modelo supervisado suele ser más directo.\",\"topic\":\"Autoencoder\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-gan\",\"part\":\"m\",\"front\":\"¿Qué es una GAN y para qué se usó?\",\"back\":\"Dos redes que compiten. El generador inventa ejemplos (una cara). El discriminador intenta decir si es real o falso. El generador mejora hasta engañarlo.\\n\\nAnalogía: un falsificador y un perito. Cada uno obliga al otro a mejorar.\\n\\nSe usaron para generar imágenes realistas. Entrenarlas es inestable (un lado gana siempre y el otro deja de aprender).\\n\\nHoy, para generar imágenes, los modelos de difusión suelen ser más estables. La idea de \\\"dos redes en competencia\\\" sigue apareciendo en exámenes.\",\"topic\":\"GAN\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-diffusion\",\"part\":\"m\",\"front\":\"¿Qué es un modelo de difusión y para qué se usa?\",\"back\":\"Aprende a quitar ruido. Entrenar: le añades ruido a una imagen real hasta que es estática, y le enseñas a revertir un paso. Generar: partes de ruido puro y lo vas limpiando hasta que aparece una imagen.\\n\\nEs la base de generadores de imagen modernos (Stable Diffusion y familia). Puedes guiarlo con un texto (\\\"un faro de noche\\\").\\n\\nNo es un LLM: no predice el siguiente token de una frase. Si la tarea es escribir, usa un modelo de lenguaje; si es pintar, difusión.\",\"topic\":\"Modelos de difusión\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-recomendador\",\"part\":\"m\",\"front\":\"¿Cómo recomienda productos un modelo, en las dos ideas clásicas?\",\"back\":\"• Filtrado colaborativo: \\\"gente parecida a ti compró esto\\\". Usa la matriz usuario–ítem. Falla con usuarios nuevos (cold start).\\n• Basado en contenido: \\\"este ítem se parece a los que ya te gustaron\\\" (género, texto, embeddings). Funciona con un usuario nuevo si describes el ítem.\\n\\nEn la práctica se mezclan, y a veces una red (two-tower: un vector de usuario y uno de ítem, y se busca el más cercano).\\n\\nNo es lo mismo que un clasificador de \\\"¿comprará sí/no?\\\" sobre una sola fila, aunque a veces se plantea así.\",\"topic\":\"Sistemas de recomendación\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-como-elegir-modelo\",\"part\":\"m\",\"front\":\"¿Cómo elijo un modelo en la práctica, paso a paso?\",\"back\":\"1. Escribe la pregunta: número, categoría, grupo, serie, texto o imagen.\\n2. Pon una baseline tonta (mayoría, promedio, regla de negocio).\\n3. Tabla → regresión logística o árbol, luego boosting. Imagen → CNN o un modelo ya entrenado. Texto generativo → LLM. Pronóstico → serie de tiempo.\\n4. Compara en validation, nunca afinando con el test.\\n5. Sube de complejidad solo si la métrica de negocio lo paga.\\n\\nSi no ganas a la baseline, el problema suele ser el dato o la pregunta, no \\\"falta un modelo más grande\\\".\",\"topic\":\"Cómo elegir modelo\",\"origin\":\"ai\",\"group\":\"Criterios\",\"difficulty\":\"intermediate\"}]},\"deckEn\":{\"quizId\":\"fundamentals-ml-modelos\",\"quizTitle\":\"ML Fundamentals — Model types and when to use each\",\"cardCount\":30,\"kind\":\"standalone\",\"category\":\"fundamentals-zero\",\"emoji\":\"🧩\",\"description\":\"A from-zero map of models: what each one does, an analogy, what it is for, and when NOT to use it.\",\"cards\":[{\"id\":\"ml-familias-modelos\",\"part\":\"m\",\"front\":\"What are the big model families, and what is each one for?\",\"back\":\"Choose by the TYPE of data and question, not by fashion.\\n\\n• Linear: a table, a simple relationship, you want to explain each column's weight.\\n• Trees and ensembles: a table with rules and non-linearity. The business default.\\n• Distance (k-NN, SVM, k-means): \\\"who looks like whom\\\".\\n• Time series: the ordered past predicts the future (sales, demand).\\n• Networks: image, audio, text, or huge tables with hard patterns.\\n• Generative: create new text, images, or audio.\\n\\nStart with the simplest family that can beat a baseline.\",\"topic\":\"Familias de modelos\",\"origin\":\"ai\",\"group\":\"Mapa\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-lineal\",\"part\":\"m\",\"front\":\"What is linear regression and when to use it?\",\"back\":\"It draws the best line (or plane) that predicts a NUMBER from the features: price ≈ a·sqm + b·rooms + c.\\n\\nAnalogy: a rule of three with several levers. Each coefficient says \\\"if this column goes up by 1, the prediction goes up by this much\\\".\\n\\nUse it when the relationship is roughly straight, you want to explain the result, or you need a fast baseline.\\n\\nDo not use it if the curve is clearly non-linear (a tree or a network captures that better) or if the output is a category.\",\"topic\":\"Regresión lineal\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-ridge-lasso\",\"part\":\"m\",\"front\":\"What are Ridge (L2) and Lasso (L1), and when do you pick one?\",\"back\":\"They are linear regressions with a brake so they do not memorize noise.\\n\\n• Ridge (L2): shrinks ALL coefficients toward zero, but almost none become zero. Useful when many columns matter a little and are correlated.\\n• Lasso (L1): can set coefficients to ZERO. It selects features: it keeps a few columns.\\n• Elastic Net: a mix of both.\\n\\nUse them when you have many columns relative to rows. They are still linear: they do not invent curves.\",\"topic\":\"Ridge y Lasso\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-logistica\",\"part\":\"m\",\"front\":\"What is logistic regression and when to use it?\",\"back\":\"Despite the name, it is CLASSIFICATION. It takes a linear combination and passes it through a sigmoid to output a probability between 0 and 1 (spam 0.82).\\n\\nAnalogy: the same rule as linear regression, but the output is squashed into \\\"how likely is yes\\\".\\n\\nUse it as a binary-classification baseline when you want readable coefficients (\\\"this feature raises the risk\\\").\\n\\nDo not use it if classes separate along odd curves, or if you already know boosting clearly wins on your table. For more than two classes, see softmax.\",\"topic\":\"Regresión logística\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-softmax\",\"part\":\"m\",\"front\":\"How does a model classify when there are more than two classes?\",\"back\":\"Softmax turns several scores into probabilities that SUM to 1. The winning class is the highest probability.\\n\\nExample: photo → dog 0.7, cat 0.2, other 0.1.\\n\\nLogistic regression is the two-class case. Softmax is its sibling for N classes (product type, user intent).\\n\\nDo not confuse it with \\\"train N separate yes/no models\\\": softmax forces the probabilities to compete with each other.\",\"topic\":\"Softmax / multiclase\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-arbol\",\"part\":\"m\",\"front\":\"What is a decision tree and when to use it?\",\"back\":\"It asks yes/no questions like \\\"income \u003e 40k?\\\" and \\\"age \u003c 25?\\\" until it reaches a leaf with the prediction.\\n\\nAnalogy: the \\\"guess the animal\\\" game. You can draw it and explain it to the business.\\n\\nUse it for readable rules, tabular data, and when you do not want to scale columns (trees do not need it).\\n\\nA single tree memorizes easily if you let it grow without a limit. In production it is almost always a piece of a forest or of boosting, not the final model.\",\"topic\":\"Árbol de decisión\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-random-forest\",\"part\":\"m\",\"front\":\"What is Random Forest and when to use it?\",\"back\":\"It trains MANY trees in parallel. Each one sees a different sample of rows and a subset of columns. At the end they vote (classification) or average (regression).\\n\\nAnalogy: you ask 100 people who each saw a different slice of the same case. The average is wrong less often than one person.\\n\\nUse it on tables when you want something solid with little tuning. It lowers the overfitting of a single tree.\\n\\nIt is not the most accurate on hard tables (boosting usually wins there), and a forest of 500 trees is slower and more opaque than one tree.\",\"topic\":\"Random Forest\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting\",\"part\":\"m\",\"front\":\"What is gradient boosting (XGBoost, LightGBM, CatBoost) and when to use it?\",\"back\":\"These are also trees, but in SERIES: tree 2 is trained to fix the errors of tree 1, tree 3 fixes what is left, and so on.\\n\\n• XGBoost: the classic competition model on tables.\\n• LightGBM: faster on large datasets.\\n• CatBoost: better out of the box with categorical columns.\\n\\nUse it as the first serious bet on tabular data (fraud, churn, pricing).\\n\\nCareful: with little data or bad hyperparameters it overfits. It is less explainable than a single tree.\",\"topic\":\"Gradient Boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bagging-vs-boosting\",\"part\":\"m\",\"front\":\"How do bagging (Random Forest) and boosting differ?\",\"back\":\"Both combine weak models. What changes is HOW.\\n\\n• Bagging: models in parallel, each independent, then you average. Random Forest is bagging of trees. It lowers variance.\\n• Boosting: models in series, each one looks at the previous errors. XGBoost is boosting. It lowers bias, with more overfitting risk.\\n\\nExam hint: \\\"many trees in parallel / vote\\\" → forest. \\\"each tree corrects the previous one\\\" → boosting.\",\"topic\":\"Bagging vs boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-svm\",\"part\":\"m\",\"front\":\"What is an SVM and when to use it?\",\"back\":\"It looks for the line that separates classes with the WIDEST possible margin. The points that touch that margin are the support vectors.\\n\\nWith a kernel (a math trick) it can bend the space and separate clouds a straight line cannot.\\n\\nUse it on small or medium datasets, with many columns (text, genes), and when the margin matters.\\n\\nDo not use it on millions of rows: it trains slowly and is sensitive to scale. On large business tables, boosting is usually more practical.\",\"topic\":\"SVM\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-knn\",\"part\":\"m\",\"front\":\"What is k-NN and when to use it?\",\"back\":\"It does not \\\"train\\\" a summary. It stores the examples and, to predict, looks at the k most similar ones.\\n\\n• Classify: the neighbors' vote wins.\\n• Regression: average the neighbors' number.\\n\\nAnalogy: \\\"you are who you hang out with\\\". k=1 copies the nearest neighbor (noisy). A very large k looks like predicting everyone's average.\\n\\nUse it on small problems and as intuition. Scale the columns or distance lies. With millions of rows, predicting is slow.\",\"topic\":\"k-NN\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-naive-bayes\",\"part\":\"m\",\"front\":\"What is Naive Bayes and when to use it?\",\"back\":\"It classifies with probability: \\\"if I see these words, how likely is each class?\\\". It assumes features are independent (that is why \\\"naive\\\"). In real text, words are not independent, and it still works.\\n\\nUse it as a fast text baseline (spam, ticket topic) and when you have little data.\\n\\nDo not use it if numeric features are tightly tied together and you need the best accuracy: boosting or a network usually wins.\",\"topic\":\"Naive Bayes\",\"origin\":\"ai\",\"group\":\"Distancia y probabilidad\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-kmeans\",\"part\":\"m\",\"front\":\"What is k-means and when to use it?\",\"back\":\"It groups UNLABELED examples into k clusters. It places k centers, assigns each point to the nearest center, moves the centers, and repeats.\\n\\nAnalogy: splitting a city into k zones around k plazas.\\n\\nUse it to segment customers or to explore. YOU choose k. It works if clusters are roughly round and similar in size.\\n\\nDo not use it if there is a lot of noise, ring-shaped groups, or you do not want to fix k up front (see DBSCAN).\",\"topic\":\"k-means\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-dbscan\",\"part\":\"m\",\"front\":\"What is DBSCAN, and where does it beat k-means?\",\"back\":\"It also clusters, but by density: a cluster is a zone where points sit close together. What stays loose is marked as noise, not forced into a group.\\n\\nYou do not give it k. You give \\\"how close\\\" and \\\"minimum neighbors\\\".\\n\\nUse it when clusters have odd shapes or there are outliers you do not want inside a segment.\\n\\nDo not use it if clusters have very different densities: it either swallows one or splits the other.\",\"topic\":\"DBSCAN\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-gmm\",\"part\":\"m\",\"front\":\"What is a Gaussian Mixture Model (GMM) and when to use it?\",\"back\":\"It clusters by assuming the data come from several \\\"bells\\\" (normal distributions). Unlike k-means, a point can belong PARTLY to several groups (a soft probability).\\n\\nUse it when segments overlap and you care about \\\"how much of each group\\\" (mixed customers), not a hard label.\\n\\nYou still choose how many bells. If the groups are not elliptical, the assumption fails.\",\"topic\":\"Mezcla de gaussianas\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-isolation-forest\",\"part\":\"m\",\"front\":\"Which model do I use to detect anomalies in a table?\",\"back\":\"Isolation Forest: random trees that try to \\\"isolate\\\" each point. The odd one is isolated in a few cuts; the normal one needs many. You do not need labeled fraud examples.\\n\\nUse it for fraud, sensor faults, or impossible rows, when almost everything is \\\"normal\\\" and you have no labels for the rare cases.\\n\\nIt does not replace a classifier if you DO have a labeled fraud history: supervised boosting usually wins there. Anomaly means \\\"different\\\", not automatically \\\"bad\\\".\",\"topic\":\"Isolation Forest\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-pca\",\"part\":\"m\",\"front\":\"What is PCA and what is it for?\",\"back\":\"It compresses many numeric columns into a few \\\"directions\\\" that keep the most variation. It does not predict a label: it reorganizes the data.\\n\\nAnalogy: a photo of a city from the angle that most separates the buildings, not from every angle at once.\\n\\nUse it to visualize in 2D, denoise, or speed up a later model.\\n\\nTrap: if the useful signal is small (not the highest-variance one), PCA throws it away. Do not read \\\"component 1\\\" as if it were an original column.\",\"topic\":\"PCA\",\"origin\":\"ai\",\"group\":\"No supervisado\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-arima\",\"part\":\"m\",\"front\":\"What is ARIMA, and when is it good for forecasting?\",\"back\":\"A TIME SERIES model: it predicts the next value from past values, trend, and seasonality (sales that rise in December).\\n\\nIt is not a table of unrelated customers. The order of the rows IS the information.\\n\\nUse it on one series, with enough history and a repeating pattern (demand, traffic).\\n\\nIf you have many series, external events, or local holidays, look at models that accept those signals (in BigQuery ML, ARIMA_PLUS with HOLIDAY_REGION). Do not leak the future into train.\",\"topic\":\"ARIMA y series de tiempo\",\"origin\":\"ai\",\"group\":\"Series de tiempo\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-redes\",\"part\":\"m\",\"front\":\"What are neural networks, and when to use them?\",\"back\":\"Layers of \\\"neurons\\\": each one mixes inputs with weights and a non-linear function. Layer after layer learns representations, from simple (an edge) to abstract (\\\"this is a cat\\\").\\n\\nAnalogy: an assembly line. Each station transforms the piece a little.\\n\\nUse them with A LOT of data on images, audio, text, or sequences. Also when hand-made features are not enough.\\n\\nOn a 5,000-row table, boosting often matches them with less compute and less mystery. \\\"Network\\\" does not mean \\\"better\\\".\",\"topic\":\"Redes neuronales\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-mlp\",\"part\":\"m\",\"front\":\"What is a dense network (MLP), and how is it different from a CNN?\",\"back\":\"MLP = multilayer perceptron: every neuron connects to ALL of the previous layer. It does not know that two neighboring pixels are neighbors.\\n\\nUse it on vectors that are already built (tabular features, embeddings) when you want non-linearity and have plenty of data.\\n\\nFor images use a CNN (it looks at local patterns). For long text, a Transformer. Flattening a photo into an MLP works, but it wastes the structure.\",\"topic\":\"Red densa (MLP)\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-cnn\",\"part\":\"m\",\"front\":\"What is a CNN and what is it for?\",\"back\":\"A convolutional network: small filters slide over the image looking for local patterns (edge, texture, eye) and combine them.\\n\\nThe idea that makes it work: a cat is still a cat if it shifts a few pixels. The same filter works anywhere.\\n\\nUse it to classify images, and as the base of object detection. Sometimes also on audio or series, treated as a 1D \\\"image\\\".\\n\\nIt is not the model for an Excel table. A tree is usually simpler there and just as good.\",\"topic\":\"CNN\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-deteccion\",\"part\":\"m\",\"front\":\"How is classifying an image different from detecting objects?\",\"back\":\"• Classification: one label for the WHOLE photo (\\\"there is a dog\\\").\\n• Detection: several boxes, each with a class and a position (\\\"dog here, person there\\\"). YOLO and family are the classic example.\\n• Segmentation: paints pixel by pixel which object it is (a mask), not just a box.\\n\\nChoose by the question. \\\"Is this X-ray normal?\\\" is classification. \\\"Where is the tumor?\\\" is detection or segmentation. A classification CNN alone does not draw boxes.\",\"topic\":\"Detección vs clasificación\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-rnn-lstm\",\"part\":\"m\",\"front\":\"What are RNNs and LSTMs, and why did Transformers replace them for text?\",\"back\":\"An RNN reads the sequence one step at a time and passes a \\\"state\\\" to the next step, like a person summarizing what they have read so far.\\n\\nAn LSTM is an RNN with a longer memory: it decides what to remember and what to forget. It was used for translation and series before 2017.\\n\\nProblem: it reads in order, so it is slow on long text and forgets the beginning. A Transformer looks at the whole context at once (attention) and scales better. Today, for text, start with a Transformer; LSTM remains for short series or older systems.\",\"topic\":\"RNN y LSTM\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-transformer\",\"part\":\"m\",\"front\":\"What is a Transformer and what is it used for?\",\"back\":\"A network whose core piece is attention: each token (a piece of a word) looks at the others and decides which ones matter for its meaning.\\n\\nAnalogy: in a sentence, \\\"bank\\\" looks around to know if it is a seat or a place for money.\\n\\nIt is the backbone of LLMs (GPT, Gemini) and also of vision models. It scales to long text better than an RNN.\\n\\nIt costs a lot of data and compute. You do not need it for a 10-column table. Tokens, prompts, and hallucinations are in the AI deck.\",\"topic\":\"Transformer\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bert-vs-gpt\",\"part\":\"m\",\"front\":\"How do a BERT-style model and a GPT-style model differ?\",\"back\":\"Both are Transformers. What changes is what they look at and what they were trained for.\\n\\n• Encoder (BERT and family): reads the WHOLE sentence, both directions. Good for understanding: classify, search, extract entities. It is not built to keep writing.\\n• Decoder (GPT and family): predicts the next token and only looks backward. Good for generating text.\\n\\nHint: \\\"finish the sentence\\\" or \\\"chat\\\" → decoder. \\\"What is this document about?\\\" → encoder, or a decoder you ask to do that task.\",\"topic\":\"Encoder vs decoder\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-autoencoder\",\"part\":\"m\",\"front\":\"What is an autoencoder and what is it for?\",\"back\":\"A network that compresses the input into a small vector (the \\\"bottleneck\\\") and then tries to rebuild it. It uses no labels: it learns a representation.\\n\\nIf it rebuilds normal things well and odd things BADLY, the reconstruction error flags anomalies.\\n\\nUse it to compress, denoise, or spot the unusual in images or sensors.\\n\\nIt is not a classifier. If you have labels, a supervised model is usually more direct.\",\"topic\":\"Autoencoder\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-gan\",\"part\":\"m\",\"front\":\"What is a GAN, and what was it used for?\",\"back\":\"Two networks that compete. The generator invents examples (a face). The discriminator tries to say whether it is real or fake. The generator improves until it fools the discriminator.\\n\\nAnalogy: a forger and an expert. Each one forces the other to improve.\\n\\nThey were used to generate realistic images. Training them is unstable (one side always wins and the other stops learning).\\n\\nToday, for generating images, diffusion models are usually more stable. The idea of \\\"two networks competing\\\" still shows up on exams.\",\"topic\":\"GAN\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-diffusion\",\"part\":\"m\",\"front\":\"What is a diffusion model and what is it used for?\",\"back\":\"It learns to remove noise. Training: you add noise to a real image until it is static, and you teach it to undo one step. Generating: you start from pure noise and clean it until an image appears.\\n\\nIt is the base of modern image generators (Stable Diffusion and family). You can steer it with text (\\\"a lighthouse at night\\\").\\n\\nIt is not an LLM: it does not predict the next token of a sentence. If the task is writing, use a language model; if it is painting, diffusion.\",\"topic\":\"Modelos de difusión\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-recomendador\",\"part\":\"m\",\"front\":\"How does a model recommend products, in the two classic ideas?\",\"back\":\"• Collaborative filtering: \\\"people like you bought this\\\". It uses the user–item matrix. It fails for new users (cold start).\\n• Content-based: \\\"this item looks like ones you already liked\\\" (genre, text, embeddings). It works for a new user if you can describe the item.\\n\\nIn practice they are mixed, and sometimes a network is used (two-tower: a user vector and an item vector, then you search for the nearest).\\n\\nIt is not the same as a \\\"will they buy yes/no?\\\" classifier on a single row, though it is sometimes framed that way.\",\"topic\":\"Sistemas de recomendación\",\"origin\":\"ai\",\"group\":\"Generativos y representación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-como-elegir-modelo\",\"part\":\"m\",\"front\":\"How do I choose a model in practice, step by step?\",\"back\":\"1. Write the question: number, category, group, series, text, or image.\\n2. Put down a dumb baseline (majority, average, business rule).\\n3. Table → logistic regression or a tree, then boosting. Image → CNN or a pretrained model. Generative text → LLM. Forecast → time series.\\n4. Compare on validation, never tuning on test.\\n5. Raise complexity only if the business metric pays for it.\\n\\nIf you do not beat the baseline, the problem is usually the data or the question, not \\\"we need a bigger model\\\".\",\"topic\":\"Cómo elegir modelo\",\"origin\":\"ai\",\"group\":\"Criterios\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
