sta de examen. Casos: Altostrat Media, Cymbal Retail, EHR Healthcare, KnightMotives Automotive.\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"front\":\"Caso híbrido con Kubernetes on-premises y en GKE que pide «gestión centralizada»: ¿qué piezas de Google Cloud lo resuelven?\",\"back\":\"Una flota (fleet) de GKE Enterprise.\\n\\n• Registra clústeres GKE, GKE on-prem (bare metal/VMware) y clústeres adjuntos bajo un único plano de gestión.\\n• Config Sync: GitOps, la misma configuración en todos los clústeres.\\n• Policy Controller: políticas (OPA Gatekeeper) aplicadas en toda la flota.\\n• Cloud Build + Cloud Deploy: pipeline de entrega con promoción entre entornos.\\n\\nPista de examen: «consistent», «centralized», «on-premises and cloud» + contenedores.\\nNo confundir con: Autopilot (modo de operación de un clúster, no gestión multi-clúster).\\n\\nRespuesta del quiz: Registrar los clústeres de GKE y los on-premises en una flota de GKE Enterprise, gestionar configuración y políticas de forma central con Config Sync y Policy Controller, y publicar con Cloud Build + Cloud Deploy\",\"topic\":\"Flotas de GKE Enterprise\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"1\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"hybrid\",\"gke\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"2\",\"part\":\"m\",\"front\":\"¿Cuándo elegir Autoclass y cuándo reglas de ciclo de vida en Cloud Storage?\",\"back\":\"Autoclass cuando el acceso es impredecible; ciclo de vida cuando depende de la antigüedad de forma predecible.\\n\\n• Autoclass: mueve cada objeto entre Standard, Nearline, Coldline y Archive según su acceso real, y lo devuelve a Standard al leerlo.\\n• Sin cargos de recuperación ni de borrado anticipado por las transiciones que hace Autoclass.\\n• Lifecycle: reglas fijas (edad, versión, prefijo) → mover de clase o borrar.\\n• Archive: 365 días mínimos y coste por lectura.\\n\\nPista de examen: «unpredictable access», «without managing transitions» → Autoclass.\\n\\nRespuesta del quiz: Activar Autoclass en los buckets para que los objetos cambien de clase según el acceso real, y usar un bucket dual-region o multi-region para la disponibilidad\",\"topic\":\"Cloud Storage Autoclass\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"2\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"storage\",\"cost\"],\"difficulty\":\"basic\"},{\"questionId\":\"3\",\"part\":\"m\",\"front\":\"Resumir y extraer metadatos de miles de vídeos/podcasts con el mínimo ML propio: ¿qué arquitectura?\",\"back\":\"Modelo Gemini multimodal invocado por eventos, con salida estructurada.\\n\\n• Entrada: el audio/vídeo directamente desde Cloud Storage.\\n• Prompt + esquema JSON → resumen, temas, personas, escenas en una llamada.\\n• Disparo: Cloud Run function por objeto nuevo, o predicción por lotes para el histórico.\\n• Destino: BigQuery para analítica de tendencias.\\n\\nPista de examen: «summaries», «metadata», «minimal ML expertise» → foundation model, no entrenamiento desde cero.\\nNo confundir con: Translation (traduce texto) ni Speech-to-Text solo (transcribe, no resume).\\n\\nRespuesta del quiz: Disparar una Cloud Run function (o un job por lotes) con cada objeto nuevo que envíe el medio a un modelo Gemini multimodal con un prompt que devuelva el resumen y los metadatos en JSON estructurado, y guardar el resultado en BigQuery\",\"topic\":\"Resumen multimodal con Gemini\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"3\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"genai\",\"gemini\"],\"difficulty\":\"basic\"},{\"questionId\":\"4\",\"part\":\"m\",\"front\":\"¿Qué protege Model Armor y en qué se diferencia de Cloud Armor?\",\"back\":\"Model Armor protege la conversación con el LLM; Cloud Armor protege el tráfico HTTP.\\n\\n• Model Armor analiza prompts y respuestas: prompt injection, jailbreak, datos sensibles (Sensitive Data Protection), URLs maliciosas y filtros de IA responsable.\\n• Se configura con plantillas y se puede aplicar a cualquier modelo, no solo Gemini.\\n• Cloud Armor: WAF, reglas OWASP, rate limiting y DDoS en el balanceador.\\n\\nPista de examen: «malicious prompting», «sharing sensitive data with LLMs» → Model Armor.\\nNo confundir con: VPC Service Controls (perímetro de exfiltración de APIs).\\n\\nRespuesta del quiz: Plantillas de Model Armor que analizan prompts y respuestas en busca de prompt injection/jailbreak, datos sensibles y contenido dañino, junto con los filtros de seguridad del modelo\",\"topic\":\"Model Armor\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"4\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"security\",\"genai\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"5\",\"part\":\"m\",\"front\":\"Un caso ya usa Prometheus y quiere monitorización gestionada e híbrida sin reescribir PromQL: ¿qué servicio?\",\"back\":\"Google Cloud Managed Service for Prometheus.\\n\\n• Recoge métricas Prometheus de GKE y de clústeres fuera de Google Cloud.\\n• Las guarda en Monarch (backend de Cloud Monitoring): sin operar almacenamiento propio.\\n• Compatible con PromQL: dashboards y reglas existentes siguen valiendo.\\n• Alertas a PagerDuty, Slack, webhooks o Pub/Sub, no solo correo.\\n\\nPista de examen: «existing Prometheus», «alerts are ignored» → MSP + canales de notificación adecuados.\\n\\nRespuesta del quiz: Adoptar Google Cloud Managed Service for Prometheus en los clústeres GKE y on-premises, mantener las consultas PromQL en Cloud Monitoring y enviar las políticas de alertas a canales de guardia como PagerDuty o Pub/Sub en lugar de correo\",\"topic\":\"Managed Service for Prometheus\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"5\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"operations\",\"monitoring\"],\"difficulty\":\"basic\",\"related\":10},{\"questionId\":\"6\",\"part\":\"m\",\"front\":\"Dedicated Interconnect, Partner Interconnect, HA VPN y Direct Peering: ¿cuándo cada uno?\",\"back\":\"Depende del ancho de banda, de si estás en una colocation de Google y de si necesitas acceso privado a la VPC.\\n\\n• Dedicated Interconnect: 10/100 Gbps, tu equipo en una colocation de Google; SLA con redundancia.\\n• Partner Interconnect: 50 Mbps–50 Gbps a través de un proveedor cuando no estás colocalizado.\\n• HA VPN: cifrado por internet, 99,99 % con dos túneles; rápido de montar, menos caudal.\\n• Direct/Carrier Peering: solo servicios públicos de Google, no la VPC.\\n\\nPista de examen: Interconnect no cifra por defecto → MACsec o HA VPN sobre Interconnect.\\n\\nRespuesta del quiz: Dedicated Interconnect con conexiones redundantes (en dos edge availability domains) para ancho de banda y SLA, añadiendo MACsec o HA VPN sobre Interconnect si se exige cifrado en tránsito\",\"topic\":\"Elegir conectividad híbrida\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"6\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"networking\",\"hybrid\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"7\",\"part\":\"m\",\"front\":\"¿Qué es Discovery AI / Vertex AI Search for commerce y qué datos necesita?\",\"back\":\"Búsqueda, navegación y recomendaciones de producto gestionadas por Google para e-commerce.\\n\\n• Entrada: catálogo de productos + eventos de usuario (vistas, carrito, compras).\\n• Salida: búsqueda semántica en lenguaje natural, ranking personalizado, browse y recomendaciones.\\n• Sin entrenar modelos propios de ranking.\\n• Nombres: Retail API → Vertex AI Search for retail → for commerce (2025) → Agent Platform Search for commerce (2026).\\n\\nPista de examen: retail + «product discovery» + lenguaje natural → este producto, no LIKE ni Elasticsearch propio.\\n\\nRespuesta del quiz: Usar Vertex AI Search for commerce (Discovery AI, ahora Agent Platform Search for commerce): ingerir el catálogo y los eventos de usuario y usar sus APIs de búsqueda semántica, navegación y recomendaciones\",\"topic\":\"Vertex AI Search for commerce\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"7\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"genai\",\"search\"],\"difficulty\":\"basic\"},{\"questionId\":\"8\",\"part\":\"m\",\"front\":\"¿Cómo se implementa un human-in-the-loop para contenido generado por IA antes de publicarlo?\",\"back\":\"Staging con estado de revisión + UI para revisores + publicación solo de lo aprobado.\\n\\n• Cada sugerencia queda como pendiente junto al dato original.\\n• El revisor aprueba, rechaza o edita.\\n• Solo lo aprobado/editado se promueve al sistema final.\\n• Las decisiones son trazabilidad y datos para mejorar prompts o tuning.\\n\\nPista de examen: temperatura 0 no garantiza corrección; un LLM juez no sustituye al humano.\\n\\nRespuesta del quiz: Escribir las sugerencias generadas en un almacén intermedio con un campo de estado (pendiente/aprobada/rechazada), mostrarlas en una UI de revisión para los empleados y publicar en el catálogo solo los registros aprobados o editados\",\"topic\":\"Human-in-the-loop en contenido generado\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"8\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"genai\",\"governance\"],\"difficulty\":\"basic\"},{\"questionId\":\"9\",\"part\":\"m\",\"front\":\"¿Cuándo es Imagen y cuándo Vision API en una pregunta de imágenes?\",\"back\":\"Imagen genera o edita imágenes; Vision API las analiza.\\n\\n• Imagen: texto → imagen, edición con máscara (inpainting/outpainting), cambio de fondo, variantes de producto.\\n• Vision API: etiquetas, objetos, caras, OCR, SafeSearch.\\n• AutoML / custom: clasificación o detección con tus propias clases.\\n• Veo: vídeo generativo.\\n\\nPista de examen: el verbo decide — «generate/edit» → Imagen; «detect/classify/extract» → Vision o AutoML.\\n\\nRespuesta del quiz: La edición de imágenes de Imagen en Gemini Enterprise Agent Platform (edición con máscara inpainting/outpainting, cambio de fondo y edición de imagen de producto), revisando el resultado con el flujo HITL\",\"topic\":\"Imagen vs Vision API\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"9\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"genai\",\"vision\"],\"difficulty\":\"basic\",\"related\":17},{\"questionId\":\"10\",\"part\":\"m\",\"front\":\"Un caso quiere un agente virtual en el IVR/web que resuelva peticiones y pase a un humano con contexto: ¿qué producto?\",\"back\":\"Conversational Agents (Dialogflow CX) dentro de Customer Engagement Suite / Contact Center AI.\\n\\n• Canales de voz (telefonía/IVR) y chat.\\n• Playbooks generativos anclados en data stores (catálogo, políticas).\\n• Tools/webhooks para operar sobre APIs (estado de pedido, devoluciones).\\n• Live agent handoff con el contexto de la conversación; Agent Assist ayuda al humano.\\n\\nPista de examen: «reduce call center costs» + IVR → este producto, no un endpoint de LLM a pelo.\\n\\nRespuesta del quiz: Construir el agente virtual con Conversational Agents (Dialogflow CX) / Customer Engagement Suite, con playbooks generativos anclados en data stores del catálogo y herramientas que llamen a las APIs de pedidos, y configurar el traspaso a agente humano con el contexto de la conversación\",\"topic\":\"Conversational Agents para contact center\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"10\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"genai\",\"contact-center\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"11\",\"part\":\"m\",\"front\":\"Migrar MySQL / SQL Server / PostgreSQL a Google Cloud con mínima inactividad y poco esfuerzo operativo: ¿qué servicios?\",\"back\":\"Database Migration Service hacia Cloud SQL (o AlloyDB para PostgreSQL).\\n\\n• Carga inicial + replicación continua (CDC) → corte con ventana corta.\\n• Destinos: Cloud SQL for MySQL, PostgreSQL y SQL Server; AlloyDB.\\n• Cloud SQL gestiona backups, parches, HA y réplicas.\\n• Mapeos típicos: Redis → Memorystore; MongoDB → Firestore (compatibilidad MongoDB) o MongoDB Atlas.\\n\\nPista de examen: «minimal downtime» + motor relacional conocido → DMS, no dumps nocturnos a VMs.\\n\\nRespuesta del quiz: Usar Database Migration Service para replicar de forma continua desde las bases de origen a Cloud SQL for MySQL y Cloud SQL for SQL Server, y hacer el corte con una ventana de inactividad corta\",\"topic\":\"Database Migration Service\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"11\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"migration\",\"databases\"],\"difficulty\":\"basic\",\"related\":20},{\"questionId\":\"12\",\"part\":\"m\",\"front\":\"¿Qué hace Sensitive Data Protection (Cloud DLP) y cuándo es la respuesta?\",\"back\":\"Descubre, clasifica y desidentifica datos sensibles.\\n\\n• Inspección: más de 150 infoTypes (tarjetas, DNI, emails, direcciones) en texto, BigQuery, Cloud Storage e imágenes.\\n• Desidentificación: enmascarar, redactar, tokenizar (FPE o cifrado determinista), generalizar.\\n• Discovery: perfila datasets enteros para saber dónde hay PII.\\n\\nPista de examen: «PII», «logs/transcripciones», «analítica sin exponer datos personales» → SDP antes de almacenar.\\nNo confundir con: cifrado en reposo o CMEK (protegen el almacenamiento, no el contenido frente a lectores autorizados).\\n\\nRespuesta del quiz: Pasar Sensitive Data Protection (antes Cloud DLP) para inspeccionar y desidentificar (enmascarar o tokenizar) la PII de las transcripciones antes de que lleguen a BigQuery, y restringir con IAM el acceso a los datos en bruto\",\"topic\":\"Sensitive Data Protection\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"12\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"security\",\"privacy\"],\"difficulty\":\"basic\"},{\"questionId\":\"13\",\"part\":\"m\",\"front\":\"La empresa gestiona usuarios en Active Directory: ¿cómo se integra con Google Cloud?\",\"back\":\"Google Cloud Directory Sync + SSO SAML (o Workforce Identity Federation).\\n\\n• GCDS: sincronización unidireccional AD → Cloud Identity de usuarios y grupos; AD sigue mandando.\\n• SSO SAML con AD FS / Entra ID: la contraseña se valida en el IdP corporativo.\\n• IAM se asigna a grupos sincronizados, no a personas.\\n• Workforce Identity Federation: acceso sin sincronizar cuentas a Cloud Identity.\\n\\nPista de examen: «single source of truth», «no second password» → este patrón.\\n\\nRespuesta del quiz: Usar Google Cloud Directory Sync para aprovisionar usuarios y grupos de AD en Cloud Identity, y configurar single sign-on SAML contra AD FS (o Entra ID) para que la autenticación siga en el IdP corporativo\",\"topic\":\"Federación con Active Directory\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"13\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"identity\",\"iam\"],\"difficulty\":\"basic\"},{\"questionId\":\"14\",\"part\":\"m\",\"front\":\"Requisito «99,9 % de disponibilidad + menor latencia para clientes de varios países» con contenedores: ¿qué arquitectura?\",\"back\":\"GKE regional en varias regiones + Application Load Balancer externo global + autoescalado.\\n\\n• Clúster regional: plano de control y nodos en 3 zonas.\\n• Varias regiones: failover y cercanía al usuario.\\n• ALB externo global (multi-cluster Gateway/Ingress): una IP anycast, envía al backend sano más cercano.\\n• Cluster autoscaler + HPA: absorben picos.\\n• Cloud CDN para contenido estático.\\n\\nPista de examen: zonal = punto único de fallo; balanceador interno = no sirve a clientes externos.\\n\\nRespuesta del quiz: Clústeres GKE regionales en varias regiones cercanas a los clientes, con cluster autoscaler y Horizontal Pod Autoscaler, expuestos con un Application Load Balancer externo global (multi-cluster Gateway) y Cloud CDN para el contenido estático\",\"topic\":\"Disponibilidad global con GKE\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"14\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"reliability\",\"networking\"],\"difficulty\":\"intermediate\",\"related\":27},{\"questionId\":\"15\",\"part\":\"m\",\"front\":\"¿Cómo se centralizan y retienen los logs de todos los proyectos de una organización?\",\"back\":\"Con un sink agregado a nivel de organización o carpeta.\\n\\n• includeChildren: recoge logs de todos los proyectos hijos, también los futuros.\\n• Destinos: log bucket (retención configurable, bucket lock), BigQuery (análisis), Cloud Storage (archivo barato), Pub/Sub (SIEM externo).\\n• _Default retiene 30 días; _Required (auditoría de admin) 400 días, no configurable.\\n• Data Access audit logs: desactivados por defecto salvo BigQuery; actívalos para datos regulados.\\n\\nPista de examen: «consistent logging», «retention», «compliance» → sink agregado + bucket con retención.\\n\\nRespuesta del quiz: Un sink agregado a nivel de organización (o carpeta) que envíe los logs de todos los proyectos a un log bucket central con política de retención (bloqueada si la normativa lo exige), más dashboards y políticas de alertas de Cloud Monitoring con canales de guardia\",\"topic\":\"Sinks de logs agregados\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"15\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"operations\",\"compliance\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"16\",\"part\":\"m\",\"front\":\"¿Cuándo es Apigee la respuesta en un caso de estudio?\",\"back\":\"Cuando hay que exponer APIs a terceros de forma gobernada y escalable.\\n\\n• Seguridad: API keys, OAuth 2.0, mTLS.\\n• Cuotas, rate limiting y monetización.\\n• Analítica de uso por socio.\\n• Portal de desarrolladores: alta autoservicio de partners.\\n• Apigee hybrid: runtime on-premises si hace falta.\\n\\nPista de examen: «onboard partners/providers quickly», «expose interfaces», «legacy backends» → Apigee delante.\\nNo confundir con: API Gateway (más simple, sin portal ni analítica avanzada) ni con dar VPN a terceros.\\n\\nRespuesta del quiz: Publicar APIs estandarizadas para aseguradoras con Apigee (API keys/OAuth, cuotas, analítica, portal de desarrolladores para el alta autoservicio), con servicios en Google Cloud detrás, y seguir llegando a las integraciones legacy on-premises por el enlace híbrido Interconnect/VPN\",\"topic\":\"Apigee para alta de socios\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"16\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"integration\",\"api\"],\"difficulty\":\"basic\",\"related\":32},{\"questionId\":\"17\",\"part\":\"m\",\"front\":\"Caso de sanidad con PHI y HIPAA: ¿qué responde el arquitecto?\",\"back\":\"BAA + servicios cubiertos + controles del cliente (responsabilidad compartida).\\n\\n• Firmar el BAA y usar solo productos cubiertos para PHI.\\n• VPC Service Controls alrededor de BigQuery, Cloud Storage, Healthcare API.\\n• CMEK (Cloud KMS) si la política exige controlar las claves.\\n• IAM de mínimo privilegio + Data Access audit logs.\\n• Cloud Healthcare API para FHIR, HL7v2 y DICOM.\\n\\nPista de examen: «maintain regulatory compliance» en sanidad nunca es «no hace falta nada».\\n\\nRespuesta del quiz: Firmar un Business Associate Agreement (BAA) con Google, guardar PHI solo en servicios cubiertos por el BAA y añadir controles como perímetros de VPC Service Controls, CMEK donde se exija, IAM de mínimo privilegio y Data Access audit logs\",\"topic\":\"HIPAA en Google Cloud\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"17\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"compliance\",\"security\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"18\",\"part\":\"m\",\"front\":\"Un equipo que sabe SQL pero no ML tiene que predecir tendencias y hacer informes: ¿qué stack?\",\"back\":\"BigQuery + BigQuery ML + Looker.\\n\\n• BigQuery: almacén analítico, separado de las bases OLTP.\\n• BigQuery ML: CREATE MODEL en SQL; ARIMA_PLUS para series temporales, regresión/clasificación, k-means.\\n• AI.FORECAST (TimesFM): previsión sin entrenar modelo.\\n• Looker / Looker Studio: informes y dashboards gobernados.\\n\\nPista de examen: «SQL skills», «minimal ML expertise», «reports» → BigQuery ML, no TensorFlow a medida.\\n\\nRespuesta del quiz: Centralizar en BigQuery los datos de proveedores desidentificados, crear modelos de previsión y clasificación con BigQuery ML (por ejemplo ARIMA_PLUS o AI.FORECAST para tendencias) y publicar los informes con Looker\",\"topic\":\"BigQuery ML para equipos SQL\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"18\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"analytics\",\"bigquery-ml\"],\"difficulty\":\"basic\"},{\"questionId\":\"19\",\"part\":\"m\",\"front\":\"¿Cómo se garantiza en Google Cloud que los datos solo se guarden en la UE y nadie se lo salte?\",\"back\":\"Política de organización de ubicaciones + Assured Workloads.\\n\\n• gcp.resourceLocations: limita dónde se pueden crear recursos en la org/carpeta/proyecto.\\n• Assured Workloads: carpeta con controles de un régimen (frontera de datos UE, soberanía) — ubicaciones, servicios permitidos, personal y claves.\\n• CMEK / External Key Manager: control de las claves.\\n\\nPista de examen: IAM decide quién accede, no dónde vive el dato; el cifrado no arregla una región equivocada.\\n\\nRespuesta del quiz: Colocar las cargas de la UE en una carpeta gobernada por Assured Workloads (controles de frontera de datos de la UE) y aplicar la política de organización de ubicaciones de recursos (gcp.resourceLocations) limitada a ubicaciones de la UE, junto con CMEK para controlar las claves\",\"topic\":\"Controles de residencia de datos\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"19\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"compliance\",\"governance\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"20\",\"part\":\"m\",\"front\":\"Telemetría de millones de dispositivos con conectividad intermitente: ¿qué arquitectura de ingesta?\",\"back\":\"Pub/Sub → Dataflow → BigQuery / Bigtable.\\n\\n• Pub/Sub: ingesta global y autoescalable; el dispositivo publica al reconectar.\\n• Dataflow: ventanas por tiempo de evento, watermarks y allowed lateness para datos tardíos y desordenados.\\n• BigQuery: analítica y data warehouse.\\n• Bigtable: lecturas de baja latencia por clave (vehículo + tiempo).\\n\\nPista de examen: «late data», «out of order» → tiempo de evento en Dataflow, no tiempo de proceso.\\n\\nRespuesta del quiz: Guardar los eventos en el vehículo y publicarlos en Pub/Sub cuando haya conexión; procesar el flujo con Dataflow usando ventanas por tiempo de evento y allowed lateness, y escribir en BigQuery (y en Bigtable para lecturas por vehículo de baja latencia)\",\"topic\":\"Ingesta de telemetría con datos tardíos\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"20\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"streaming\",\"data\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"21\",\"part\":\"m\",\"front\":\"¿Cómo se comparten o monetizan datos con otras organizaciones en BigQuery sin copiarlos?\",\"back\":\"BigQuery sharing (antes Analytics Hub), con data clean rooms si hace falta privacidad.\\n\\n• Publicador: crea exchanges y listings sobre datasets.\\n• Suscriptor: recibe un linked dataset; lee en origen, sin copia.\\n• El publicador revoca acceso y ve métricas de uso; puede listarse en Marketplace.\\n• Data clean rooms: análisis cruzado con umbrales de agregación, sin ver filas.\\n\\nPista de examen: «share with partners», «monetize data», «without copying» → BigQuery sharing.\\nNo confundir con: Authorized views (compartir dentro de tu organización/proyectos).\\n\\nRespuesta del quiz: Consolidar en BigQuery datasets curados, desidentificados y agregados, y publicarlos como listings con BigQuery sharing (antes Analytics Hub) —con data clean rooms cuando el socio deba cruzar datos sin ver filas en bruto—, gobernados con Dataplex\",\"topic\":\"BigQuery sharing (Analytics Hub)\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"21\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"data\",\"sharing\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"22\",\"part\":\"m\",\"front\":\"Fábrica o tienda que necesita IA de baja latencia y tiene mala conectividad: ¿qué producto?\",\"back\":\"Google Distributed Cloud (connected / edge).\\n\\n• Hardware gestionado por Google en tus instalaciones con clústeres Kubernetes.\\n• La inferencia corre en local: baja latencia y sigue funcionando sin WAN.\\n• Gestión, actualizaciones y políticas desde Google Cloud.\\n• Variante air-gapped para entornos sin conexión (defensa, soberanía).\\n\\nPista de examen: «edge», «plant», «intermittent connectivity», «low latency» → GDC, no un endpoint en una región lejana.\\n\\nRespuesta del quiz: Ejecutar la inferencia en hardware de Google Distributed Cloud (connected) en cada planta, gestionado desde Google Cloud, para que los modelos corran en local y los resultados se sincronicen con la nube cuando haya enlace\",\"topic\":\"Google Distributed Cloud en el edge\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"22\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"edge\",\"hybrid\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"23\",\"part\":\"m\",\"front\":\"Detectar vs prevenir: ¿qué papel tienen Security Command Center y las políticas de organización?\",\"back\":\"SCC detecta y prioriza; las políticas de organización previenen.\\n\\n• SCC (a nivel de organización): Security Health Analytics (configuración), vulnerabilidades, Event/Container Threat Detection, rutas de ataque (niveles superiores).\\n• Org policies: impiden crear lo prohibido — sin IP externa, sin claves de SA, ubicaciones permitidas, acceso uniforme a buckets.\\n• Hallazgos → Pub/Sub → SIEM/SOAR (Google SecOps) para la respuesta a incidentes.\\n\\nPista de examen: «single pane of glass» de seguridad → SCC; «prevent / enforce» → org policy.\\n\\nRespuesta del quiz: Security Command Center (Premium/Enterprise) a nivel de organización para hallazgos de postura, vulnerabilidades y detección de amenazas, restricciones de política de organización como barreras preventivas (por ejemplo sin IPs externas, sin creación de claves de cuentas de servicio, acceso uniforme a buckets) y envío de alertas al proceso de respuesta a incidentes\",\"topic\":\"Security Command Center y políticas de organización\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"23\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"security\"],\"difficulty\":\"intermediate\"},{\"questionId\":\"24\",\"part\":\"m\",\"front\":\"Paralelismo de datos vs paralelismo de modelo: ¿cuándo cada uno?\",\"back\":\"Datos para ir más rápido; modelo cuando el modelo no cabe en un dispositivo.\\n\\n• Datos: cada GPU/TPU tiene el modelo completo y procesa un trozo del batch; se sincronizan gradientes.\\n• Modelo (tensor/pipeline): el modelo se reparte entre dispositivos; necesario en modelos enormes.\\n• Dónde: custom training de Agent Platform (antes Vertex AI) o GKE con node pools de GPU/TPU.\\n• Spot VMs para trabajos tolerantes a interrupciones (simulación, entrenamiento con checkpoints).\\n\\nPista de examen: «train faster» → más aceleradores + data parallel; «out of memory» → model parallel.\\n\\nRespuesta del quiz: Mantener los datos de sensores en Cloud Storage y hacer entrenamiento distribuido en GPUs o TPUs (paralelismo de datos entre muchos aceleradores, de modelo si el modelo no cabe en un dispositivo) con custom training de Agent Platform o GKE, usando capacidad Spot para los trabajos de simulación tolerantes a interrupciones\",\"topic\":\"Entrenamiento distribuido en aceleradores\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"24\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"ml\",\"compute\"],\"difficulty\":\"intermediate\",\"related\":51}]},\"deckEn\":{\"quizId\":\"gcp-pca-case-studies-es\",\"quizTitle\":\"GCP Professional Cloud Architect — Casos de estudio (ES)\",\"cardCount\":24,\"description\":\"Las mismas 24 preguntas en español, con la explicación de cada opción y la pista de examen. Casos: Altostrat Media, Cymbal Retail, EHR Healthcare, KnightMotives Automotive.\",\"cards\":[{\"questionId\":\"1\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Hybrid case with Kubernetes on-premises and in GKE asking for \\\"centralized management\\\": which Google Cloud pieces solve it?\",\"back\":\"A GKE Enterprise fleet.\\n\\n• Registers GKE, GKE on-prem (bare metal/VMware) and attached clusters under one management plane.\\n• Config Sync: GitOps, the same configuration on every cluster.\\n• Policy Controller: policies (OPA Gatekeeper) enforced fleet-wide.\\n• Cloud Build + Cloud Deploy: delivery pipeline with promotion across environments.\\n\\nExam cue: \\\"consistent\\\", \\\"centralized\\\", \\\"on-premises and cloud\\\" + containers.\\nDon't confuse with: Autopilot (a cluster's mode of operation, not multi-cluster management).\\n\\nQuiz answer: Registrar los clústeres de GKE y los on-premises en una flota de GKE Enterprise, gestionar configuración y políticas de forma central con Config Sync y Policy Controller, y publicar con Cloud Build + Cloud Deploy\",\"topic\":\"GKE Enterprise fleets\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"1\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"hybrid\",\"gke\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"2\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When do you pick Autoclass and when lifecycle rules in Cloud Storage?\",\"back\":\"Autoclass when access is unpredictable; lifecycle rules when it depends predictably on age.\\n\\n• Autoclass: moves each object between Standard, Nearline, Coldline and Archive by actual access, and back to Standard when read.\\n• No retrieval or early-deletion charges for the transitions Autoclass makes.\\n• Lifecycle: fixed rules (age, version, prefix) → change class or delete.\\n• Archive: 365-day minimum and a cost per read.\\n\\nExam cue: \\\"unpredictable access\\\", \\\"without managing transitions\\\" → Autoclass.\\n\\nQuiz answer: Activar Autoclass en los buckets para que los objetos cambien de clase según el acceso real, y usar un bucket dual-region o multi-region para la disponibilidad\",\"topic\":\"Cloud Storage Autoclass\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"2\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"storage\",\"cost\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"3\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Summarize and extract metadata from thousands of videos/podcasts with minimal custom ML: which architecture?\",\"back\":\"A multimodal Gemini model invoked by events, with structured output.\\n\\n• Input: the audio/video straight from Cloud Storage.\\n• Prompt + JSON schema → summary, topics, people, scenes in one call.\\n• Trigger: a Cloud Run function per new object, or batch prediction for the back catalogue.\\n• Sink: BigQuery for trend analytics.\\n\\nExam cue: \\\"summaries\\\", \\\"metadata\\\", \\\"minimal ML expertise\\\" → foundation model, not training from scratch.\\nDon't confuse with: Translation (translates text) or Speech-to-Text alone (transcribes, does not summarize).\\n\\nQuiz answer: Disparar una Cloud Run function (o un job por lotes) con cada objeto nuevo que envíe el medio a un modelo Gemini multimodal con un prompt que devuelva el resumen y los metadatos en JSON estructurado, y guardar el resultado en BigQuery\",\"topic\":\"Multimodal summarization with Gemini\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"3\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"genai\",\"gemini\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"4\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What does Model Armor protect, and how is it different from Cloud Armor?\",\"back\":\"Model Armor protects the conversation with the LLM; Cloud Armor protects HTTP traffic.\\n\\n• Model Armor screens prompts and responses: prompt injection, jailbreak, sensitive data (Sensitive Data Protection), malicious URLs and responsible-AI filters.\\n• Configured with templates and usable with any model, not only Gemini.\\n• Cloud Armor: WAF, OWASP rules, rate limiting and DDoS at the load balancer.\\n\\nExam cue: \\\"malicious prompting\\\", \\\"sharing sensitive data with LLMs\\\" → Model Armor.\\nDon't confuse with: VPC Service Controls (API exfiltration perimeter).\\n\\nQuiz answer: Plantillas de Model Armor que analizan prompts y respuestas en busca de prompt injection/jailbreak, datos sensibles y contenido dañino, junto con los filtros de seguridad del modelo\",\"topic\":\"Model Armor\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"4\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"security\",\"genai\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"5\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A case already uses Prometheus and wants managed, hybrid monitoring without rewriting PromQL: which service?\",\"back\":\"Google Cloud Managed Service for Prometheus.\\n\\n• Collects Prometheus metrics from GKE and from clusters outside Google Cloud.\\n• Stores them in Monarch (Cloud Monitoring's backend): no storage to operate.\\n• PromQL-compatible: existing dashboards and rules keep working.\\n• Alerts to PagerDuty, Slack, webhooks or Pub/Sub, not just email.\\n\\nExam cue: \\\"existing Prometheus\\\", \\\"alerts are ignored\\\" → MSP + proper notification channels.\\n\\nQuiz answer: Adoptar Google Cloud Managed Service for Prometheus en los clústeres GKE y on-premises, mantener las consultas PromQL en Cloud Monitoring y enviar las políticas de alertas a canales de guardia como PagerDuty o Pub/Sub en lugar de correo\",\"topic\":\"Managed Service for Prometheus\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"5\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"operations\",\"monitoring\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"6\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Dedicated Interconnect, Partner Interconnect, HA VPN and Direct Peering: when is each one right?\",\"back\":\"It depends on bandwidth, on whether you are in a Google colocation facility, and on whether you need private VPC access.\\n\\n• Dedicated Interconnect: 10/100 Gbps, your equipment in a Google colocation facility; SLA with redundancy.\\n• Partner Interconnect: 50 Mbps–50 Gbps through a provider when you are not colocated.\\n• HA VPN: encrypted over the internet, 99.99% with two tunnels; quick to set up, less throughput.\\n• Direct/Carrier Peering: Google public services only, not the VPC.\\n\\nExam cue: Interconnect is not encrypted by default → MACsec or HA VPN over Interconnect.\\n\\nQuiz answer: Dedicated Interconnect con conexiones redundantes (en dos edge availability domains) para ancho de banda y SLA, añadiendo MACsec o HA VPN sobre Interconnect si se exige cifrado en tránsito\",\"topic\":\"Choosing hybrid connectivity\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"6\"},\"tags\":[\"pca\",\"case-study\",\"altostrat\",\"networking\",\"hybrid\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"7\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What is Discovery AI / Vertex AI Search for commerce, and what data does it need?\",\"back\":\"Google-managed product search, browse and recommendations for e-commerce.\\n\\n• Input: product catalog + user events (views, add-to-cart, purchases).\\n• Output: natural-language semantic search, personalized ranking, browse and recommendations.\\n• No ranking models of your own to train.\\n• Names: Retail API → Vertex AI Search for retail → for commerce (2025) → Agent Platform Search for commerce (2026).\\n\\nExam cue: retail + \\\"product discovery\\\" + natural language → this product, not LIKE or self-managed Elasticsearch.\\n\\nQuiz answer: Usar Vertex AI Search for commerce (Discovery AI, ahora Agent Platform Search for commerce): ingerir el catálogo y los eventos de usuario y usar sus APIs de búsqueda semántica, navegación y recomendaciones\",\"topic\":\"Vertex AI Search for commerce\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"7\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"genai\",\"search\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"8\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you implement human-in-the-loop for AI-generated content before publishing it?\",\"back\":\"Staging with a review status + a UI for reviewers + publish only what is approved.\\n\\n• Each suggestion is stored as pending next to the original data.\\n• The reviewer approves, rejects or edits.\\n• Only approved/edited records are promoted to the target system.\\n• Decisions become an audit trail and data to improve prompts or tuning.\\n\\nExam cue: temperature 0 does not guarantee correctness; an LLM judge does not replace the human.\\n\\nQuiz answer: Escribir las sugerencias generadas en un almacén intermedio con un campo de estado (pendiente/aprobada/rechazada), mostrarlas en una UI de revisión para los empleados y publicar en el catálogo solo los registros aprobados o editados\",\"topic\":\"Human-in-the-loop for gen AI content\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"8\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"genai\",\"governance\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"9\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When is it Imagen and when Vision API in an image question?\",\"back\":\"Imagen generates or edits images; Vision API analyzes them.\\n\\n• Imagen: text → image, mask-based editing (inpainting/outpainting), background replacement, product variants.\\n• Vision API: labels, objects, faces, OCR, SafeSearch.\\n• AutoML / custom: classification or detection with your own classes.\\n• Veo: generative video.\\n\\nExam cue: the verb decides — \\\"generate/edit\\\" → Imagen; \\\"detect/classify/extract\\\" → Vision or AutoML.\\n\\nQuiz answer: La edición de imágenes de Imagen en Gemini Enterprise Agent Platform (edición con máscara inpainting/outpainting, cambio de fondo y edición de imagen de producto), revisando el resultado con el flujo HITL\",\"topic\":\"Imagen vs Vision API\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"9\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"genai\",\"vision\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"10\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A case wants a virtual agent in the IVR/web that resolves requests and hands off to a human with context: which product?\",\"back\":\"Conversational Agents (Dialogflow CX) within Customer Engagement Suite / Contact Center AI.\\n\\n• Voice (telephony/IVR) and chat channels.\\n• Generative playbooks grounded on data stores (catalog, policies).\\n• Tools/webhooks to act on APIs (order status, returns).\\n• Live-agent handoff with conversation context; Agent Assist helps the human.\\n\\nExam cue: \\\"reduce call center costs\\\" + IVR → this product, not a raw LLM endpoint.\\n\\nQuiz answer: Construir el agente virtual con Conversational Agents (Dialogflow CX) / Customer Engagement Suite, con playbooks generativos anclados en data stores del catálogo y herramientas que llamen a las APIs de pedidos, y configurar el traspaso a agente humano con el contexto de la conversación\",\"topic\":\"Conversational Agents for contact centers\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"10\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"genai\",\"contact-center\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"11\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Migrating MySQL / SQL Server / PostgreSQL to Google Cloud with minimal downtime and low operational effort: which services?\",\"back\":\"Database Migration Service into Cloud SQL (or AlloyDB for PostgreSQL).\\n\\n• Initial load + continuous replication (CDC) → cutover with a short window.\\n• Targets: Cloud SQL for MySQL, PostgreSQL and SQL Server; AlloyDB.\\n• Cloud SQL manages backups, patches, HA and replicas.\\n• Typical mappings: Redis → Memorystore; MongoDB → Firestore (MongoDB compatibility) or MongoDB Atlas.\\n\\nExam cue: \\\"minimal downtime\\\" + a familiar relational engine → DMS, not nightly dumps onto VMs.\\n\\nQuiz answer: Usar Database Migration Service para replicar de forma continua desde las bases de origen a Cloud SQL for MySQL y Cloud SQL for SQL Server, y hacer el corte con una ventana de inactividad corta\",\"topic\":\"Database Migration Service\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"11\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"migration\",\"databases\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"12\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"What does Sensitive Data Protection (Cloud DLP) do, and when is it the answer?\",\"back\":\"It discovers, classifies and de-identifies sensitive data.\\n\\n• Inspection: 150+ infoTypes (cards, national IDs, emails, addresses) in text, BigQuery, Cloud Storage and images.\\n• De-identification: mask, redact, tokenize (FPE or deterministic encryption), generalize.\\n• Discovery: profiles whole datasets to find where PII lives.\\n\\nExam cue: \\\"PII\\\", \\\"logs/transcripts\\\", \\\"analytics without exposing personal data\\\" → SDP before storage.\\nDon't confuse with: encryption at rest or CMEK (protect storage, not content from authorized readers).\\n\\nQuiz answer: Pasar Sensitive Data Protection (antes Cloud DLP) para inspeccionar y desidentificar (enmascarar o tokenizar) la PII de las transcripciones antes de que lleguen a BigQuery, y restringir con IAM el acceso a los datos en bruto\",\"topic\":\"Sensitive Data Protection\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"12\"},\"tags\":[\"pca\",\"case-study\",\"cymbal\",\"security\",\"privacy\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"13\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"The company manages users in Active Directory: how does it integrate with Google Cloud?\",\"back\":\"Google Cloud Directory Sync + SAML SSO (or Workforce Identity Federation).\\n\\n• GCDS: one-way AD → Cloud Identity sync of users and groups; AD stays authoritative.\\n• SAML SSO with AD FS / Entra ID: the password is validated by the corporate IdP.\\n• IAM is granted to synchronized groups, not to individuals.\\n• Workforce Identity Federation: access without syncing accounts into Cloud Identity.\\n\\nExam cue: \\\"single source of truth\\\", \\\"no second password\\\" → this pattern.\\n\\nQuiz answer: Usar Google Cloud Directory Sync para aprovisionar usuarios y grupos de AD en Cloud Identity, y configurar single sign-on SAML contra AD FS (o Entra ID) para que la autenticación siga en el IdP corporativo\",\"topic\":\"Active Directory federation\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"13\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"identity\",\"iam\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"14\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Requirement \\\"99.9% availability + lower latency for customers in many countries\\\" with containers: which architecture?\",\"back\":\"Regional GKE in several regions + global external Application Load Balancer + autoscaling.\\n\\n• Regional cluster: control plane and nodes across 3 zones.\\n• Several regions: failover and proximity to users.\\n• Global external ALB (multi-cluster Gateway/Ingress): one anycast IP, routes to the nearest healthy backend.\\n• Cluster autoscaler + HPA: absorb spikes.\\n• Cloud CDN for static content.\\n\\nExam cue: zonal = single point of failure; internal load balancer = does not serve external customers.\\n\\nQuiz answer: Clústeres GKE regionales en varias regiones cercanas a los clientes, con cluster autoscaler y Horizontal Pod Autoscaler, expuestos con un Application Load Balancer externo global (multi-cluster Gateway) y Cloud CDN para el contenido estático\",\"topic\":\"Global availability on GKE\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"14\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"reliability\",\"networking\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"15\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you centralize and retain logs from every project in an organization?\",\"back\":\"With an aggregated sink at the organization or folder level.\\n\\n• includeChildren: collects logs from all child projects, including future ones.\\n• Destinations: log bucket (configurable retention, bucket lock), BigQuery (analysis), Cloud Storage (cheap archive), Pub/Sub (external SIEM).\\n• _Default keeps 30 days; _Required (admin audit) 400 days, not configurable.\\n• Data Access audit logs: off by default except for BigQuery; enable them for regulated data.\\n\\nExam cue: \\\"consistent logging\\\", \\\"retention\\\", \\\"compliance\\\" → aggregated sink + bucket with retention.\\n\\nQuiz answer: Un sink agregado a nivel de organización (o carpeta) que envíe los logs de todos los proyectos a un log bucket central con política de retención (bloqueada si la normativa lo exige), más dashboards y políticas de alertas de Cloud Monitoring con canales de guardia\",\"topic\":\"Aggregated log sinks\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"15\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"operations\",\"compliance\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"16\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"When is Apigee the answer in a case study?\",\"back\":\"When APIs must be exposed to third parties in a governed, scalable way.\\n\\n• Security: API keys, OAuth 2.0, mTLS.\\n• Quotas, rate limiting and monetization.\\n• Per-partner usage analytics.\\n• Developer portal: partner self-service onboarding.\\n• Apigee hybrid: on-premises runtime when needed.\\n\\nExam cue: \\\"onboard partners/providers quickly\\\", \\\"expose interfaces\\\", \\\"legacy backends\\\" → Apigee in front.\\nDon't confuse with: API Gateway (simpler, no portal or advanced analytics) or with giving third parties a VPN.\\n\\nQuiz answer: Publicar APIs estandarizadas para aseguradoras con Apigee (API keys/OAuth, cuotas, analítica, portal de desarrolladores para el alta autoservicio), con servicios en Google Cloud detrás, y seguir llegando a las integraciones legacy on-premises por el enlace híbrido Interconnect/VPN\",\"topic\":\"Apigee for partner onboarding\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"16\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"integration\",\"api\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"17\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Healthcare case with PHI and HIPAA: what does the architect answer?\",\"back\":\"BAA + covered services + customer controls (shared responsibility).\\n\\n• Sign the BAA and use only covered products for PHI.\\n• VPC Service Controls around BigQuery, Cloud Storage, the Healthcare API.\\n• CMEK (Cloud KMS) if policy requires key control.\\n• Least-privilege IAM + Data Access audit logs.\\n• Cloud Healthcare API for FHIR, HL7v2 and DICOM.\\n\\nExam cue: \\\"maintain regulatory compliance\\\" in healthcare is never \\\"nothing is needed\\\".\\n\\nQuiz answer: Firmar un Business Associate Agreement (BAA) con Google, guardar PHI solo en servicios cubiertos por el BAA y añadir controles como perímetros de VPC Service Controls, CMEK donde se exija, IAM de mínimo privilegio y Data Access audit logs\",\"topic\":\"HIPAA on Google Cloud\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"17\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"compliance\",\"security\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"18\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A team that knows SQL but not ML must predict trends and build reports: which stack?\",\"back\":\"BigQuery + BigQuery ML + Looker.\\n\\n• BigQuery: analytics warehouse, separate from the OLTP databases.\\n• BigQuery ML: CREATE MODEL in SQL; ARIMA_PLUS for time series, regression/classification, k-means.\\n• AI.FORECAST (TimesFM): forecasting without training a model.\\n• Looker / Looker Studio: governed reports and dashboards.\\n\\nExam cue: \\\"SQL skills\\\", \\\"minimal ML expertise\\\", \\\"reports\\\" → BigQuery ML, not custom TensorFlow.\\n\\nQuiz answer: Centralizar en BigQuery los datos de proveedores desidentificados, crear modelos de previsión y clasificación con BigQuery ML (por ejemplo ARIMA_PLUS o AI.FORECAST para tendencias) y publicar los informes con Looker\",\"topic\":\"BigQuery ML for SQL teams\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"18\"},\"tags\":[\"pca\",\"case-study\",\"ehr\",\"analytics\",\"bigquery-ml\"],\"difficulty\":\"basic\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"19\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you guarantee on Google Cloud that data is only stored in the EU and nobody can bypass it?\",\"back\":\"Resource locations organization policy + Assured Workloads.\\n\\n• gcp.resourceLocations: limits where resources can be created in the org/folder/project.\\n• Assured Workloads: a folder with a regime's controls (EU data boundary, sovereignty) — locations, allowed services, personnel and keys.\\n• CMEK / External Key Manager: control of the keys.\\n\\nExam cue: IAM decides who accesses, not where data lives; encryption does not fix a wrong region.\\n\\nQuiz answer: Colocar las cargas de la UE en una carpeta gobernada por Assured Workloads (controles de frontera de datos de la UE) y aplicar la política de organización de ubicaciones de recursos (gcp.resourceLocations) limitada a ubicaciones de la UE, junto con CMEK para controlar las claves\",\"topic\":\"Data residency controls\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"19\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"compliance\",\"governance\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"20\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Telemetry from millions of devices with intermittent connectivity: which ingestion architecture?\",\"back\":\"Pub/Sub → Dataflow → BigQuery / Bigtable.\\n\\n• Pub/Sub: global, autoscaling ingestion; the device publishes when it reconnects.\\n• Dataflow: event-time windows, watermarks and allowed lateness for late and out-of-order data.\\n• BigQuery: analytics and data warehouse.\\n• Bigtable: low-latency reads by key (vehicle + time).\\n\\nExam cue: \\\"late data\\\", \\\"out of order\\\" → event time in Dataflow, not processing time.\\n\\nQuiz answer: Guardar los eventos en el vehículo y publicarlos en Pub/Sub cuando haya conexión; procesar el flujo con Dataflow usando ventanas por tiempo de evento y allowed lateness, y escribir en BigQuery (y en Bigtable para lecturas por vehículo de baja latencia)\",\"topic\":\"Telemetry ingestion with late data\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"20\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"streaming\",\"data\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"21\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"How do you share or monetize data with other organizations in BigQuery without copying it?\",\"back\":\"BigQuery sharing (formerly Analytics Hub), with data clean rooms when privacy is required.\\n\\n• Publisher: creates exchanges and listings over datasets.\\n• Subscriber: gets a linked dataset; reads in place, no copy.\\n• The publisher revokes access and sees usage metrics; listings can go to Marketplace.\\n• Data clean rooms: joined analysis with aggregation thresholds, no row-level access.\\n\\nExam cue: \\\"share with partners\\\", \\\"monetize data\\\", \\\"without copying\\\" → BigQuery sharing.\\nDon't confuse with: authorized views (sharing within your own organization/projects).\\n\\nQuiz answer: Consolidar en BigQuery datasets curados, desidentificados y agregados, y publicarlos como listings con BigQuery sharing (antes Analytics Hub) —con data clean rooms cuando el socio deba cruzar datos sin ver filas en bruto—, gobernados con Dataplex\",\"topic\":\"BigQuery sharing (Analytics Hub)\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"21\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"data\",\"sharing\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"22\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"A factory or store needs low-latency AI and has poor connectivity: which product?\",\"back\":\"Google Distributed Cloud (connected / edge).\\n\\n• Google-managed hardware on your premises running Kubernetes clusters.\\n• Inference runs locally: low latency and keeps working without the WAN.\\n• Management, updates and policies from Google Cloud.\\n• Air-gapped variant for disconnected environments (defense, sovereignty).\\n\\nExam cue: \\\"edge\\\", \\\"plant\\\", \\\"intermittent connectivity\\\", \\\"low latency\\\" → GDC, not an endpoint in a distant region.\\n\\nQuiz answer: Ejecutar la inferencia en hardware de Google Distributed Cloud (connected) en cada planta, gestionado desde Google Cloud, para que los modelos corran en local y los resultados se sincronicen con la nube cuando haya enlace\",\"topic\":\"Google Distributed Cloud at the edge\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"22\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"edge\",\"hybrid\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"23\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Detect vs prevent: what roles do Security Command Center and organization policies play?\",\"back\":\"SCC detects and prioritizes; organization policies prevent.\\n\\n• SCC (organization level): Security Health Analytics (configuration), vulnerabilities, Event/Container Threat Detection, attack paths (higher tiers).\\n• Org policies: block forbidden resources — no external IP, no SA keys, allowed locations, uniform bucket access.\\n• Findings → Pub/Sub → SIEM/SOAR (Google SecOps) for incident response.\\n\\nExam cue: security \\\"single pane of glass\\\" → SCC; \\\"prevent / enforce\\\" → org policy.\\n\\nQuiz answer: Security Command Center (Premium/Enterprise) a nivel de organización para hallazgos de postura, vulnerabilidades y detección de amenazas, restricciones de política de organización como barreras preventivas (por ejemplo sin IPs externas, sin creación de claves de cuentas de servicio, acceso uniforme a buckets) y envío de alertas al proceso de respuesta a incidentes\",\"topic\":\"Security Command Center and org policies\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"23\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"security\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"},{\"questionId\":\"24\",\"part\":\"m\",\"lang\":\"en\",\"front\":\"Data parallelism vs model parallelism: when is each one used?\",\"back\":\"Data parallelism to go faster; model parallelism when the model does not fit on one device.\\n\\n• Data: each GPU/TPU holds the full model and processes a shard of the batch; gradients are synchronized.\\n• Model (tensor/pipeline): the model is split across devices; needed for huge models.\\n• Where: Agent Platform (formerly Vertex AI) custom training or GKE with GPU/TPU node pools.\\n• Spot VMs for interruption-tolerant jobs (simulation, checkpointed training).\\n\\nExam cue: \\\"train faster\\\" → more accelerators + data parallel; \\\"out of memory\\\" → model parallel.\\n\\nQuiz answer: Mantener los datos de sensores en Cloud Storage y hacer entrenamiento distribuido en GPUs o TPUs (paralelismo de datos entre muchos aceleradores, de modelo si el modelo no cabe en un dispositivo) con custom training de Agent Platform o GKE, usando capacidad Spot para los trabajos de simulación tolerantes a interrupciones\",\"topic\":\"Distributed training on accelerators\",\"origin\":\"ai\",\"source\":{\"quizId\":\"gcp-pca-case-studies-es\",\"questionId\":\"24\"},\"tags\":[\"pca\",\"case-study\",\"knightmotives\",\"ml\",\"compute\"],\"difficulty\":\"intermediate\",\"esDeck\":\"gcp-pca-case-studies-es\"}]}}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n9:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"title\",\"1\",{\"children\":\"Quiz Practice\"}],[\"$\",\"meta\",\"2\",{\"name\":\"description\",\"content\":\"Practice quizzes. Feed data/quizzes.json (see docs/QUIZZES_JSON.md).\"}]]\n"])</script><script>self.__next_f.push([1,"7:null\n"])</script></body></html>
