nks/442-77c67fe0557f335f.js\",\"838\",\"static/chunks/838-09a7e5ad345938c1.js\",\"771\",\"static/chunks/app/flow/%5Bid%5D/page-96147503ab10df7c.js\"],\"default\"]\nf:T503,from sklearn.datasets import load_breast_cancer\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.dummy import DummyClassifier\n\nX, y = load_breast_cancer(return_X_y=True, as_frame=True)\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\n\nmodels = {\n    \"baseline\": DummyClassifier(strategy=\"most_frequent\"),\n    \"logistic\": make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000)),\n    \"tree_d3\": DecisionTreeClassifier(max_depth=3, random_state=42),\n    \"tree_full\": DecisionTreeClassifier(random_state=42),\n    \"forest\": RandomForestClassifier(n_estimators=200, random_state=42),\n}\nfor name, m in models.items():\n    m.fit(X_tr, y_tr)\n    print(f\"{name:10s} train={m.score(X_tr, y_tr):.3f} test={m.score(X_te, y_te):.3f}\")\n# baseline 0.627/0.629 · logistic 0.988/0.986 · tree_d3 0.977/0.944 · tree_full 1.000/0.923 · forest 1.000/0.958\n\ncoefs = models[\"logistic\"][-1].coef_[0]\nprint(sorted(zip(X.columns, coefs.round(2)), key=lambda t: abs(t[1]), reverse=True)[:3])10:T4e0,from sklearn.datasets import make_classification\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.dummy import DummyClassifier\nfrom sklearn.metrics import accuracy_score, recall_score, confusion_matrix, average_precision_score\n\nX, y = make_classification(n_samples=20000, n_features=20, n_informative=5, weights=[0.99],\n                           flip_y=0, class_sep=0.8, random_state=0)\nprint(f\"positive rate: {y.mean():.3%}\")                       # 1.00"])</script><script>self.__next_f.push([1,"0%\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, stratify=y, random_state=0)\n\ndummy = DummyClassifier(strategy=\"most_frequent\").fit(X_tr, y_tr)\nd = dummy.predict(X_te)\nprint(f\"dummy  accuracy={accuracy_score(y_te, d):.3f} recall={recall_score(y_te, d):.2f}\")   # 0.990 / 0.00\n\nmodel = LogisticRegression(max_iter=1000).fit(X_tr, y_tr)\nproba = model.predict_proba(X_te)[:, 1]\npred = (proba \u003e= 0.5).astype(int)\nprint(f\"model  accuracy={accuracy_score(y_te, pred):.3f} recall={recall_score(y_te, pred):.2f}\")  # 0.993 / 0.40\nprint(confusion_matrix(y_te, pred))                          # [[5935 5] [36 24]]\nprint(f\"PR-AUC (average precision) = {average_precision_score(y_te, proba):.3f}\")              # 0.613"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"flow\":{\"id\":\"ruta-ml-desde-cero\",\"emoji\":\"🌱\",\"category\":\"fundamentals-zero\",\"level\":\"novato\",\"minutes\":388,\"passPct\":70,\"title\":{\"es\":\"Machine Learning desde 0\",\"en\":\"Machine Learning from scratch\"},\"summary\":{\"es\":\"Ruta guiada desde cero hasta tus primeros modelos: qué es el ML, cómo se entrena y se evalúa, modelos lineales y árboles, clases desbalanceadas, ajuste de hiperparámetros y dónde encajan las redes neuronales y la IA generativa. Cada etapa termina con un examen de checkpoint que desbloquea la siguiente; si lo repruebas, la ruta te regresa a las tarjetas.\",\"en\":\"A guided path from zero to your first models: what ML is, how it trains and is evaluated, linear models and trees, imbalanced classes, hyperparameter tuning, and where neural networks and generative AI fit. Every stage ends with a checkpoint exam that unlocks the next one; fail it and the route sends you back to the cards.\"},\"outcomes\":[{\"es\":\"Explicar qué problema resuelve el ML y por qué no es magia ni reglas codificadas a mano\",\"en\":\"Explain which problem ML solves and why it is neither magic nor hand-coded rules\"},{\"es\":\"Elegir el tipo de aprendizaje adecuado (supervisado, no supervisado, refuerzo) según los datos disponibles\",\"en\":\"Choose the right learning type (supervised, unsupervised, reinforcement) given the available data\"},{\"es\":\"Detectar sobreajuste y fuga de datos a partir de un síntoma en métricas antes de desplegar nada\",\"en\":\"Spot overfitting and data leakage from a metric symptom before anything ships\"},{\"es\":\"Preparar y dividir datos de forma que la métrica de validación prediga el desempeño real\",\"en\":\"Prepare and split data so the validation metric predicts real performance\"},{\"es\":\"Entrenar y comparar una regresión logística, un árbol y un boosting contra una baseline\",\"en\":\"Train and compare a logistic regression, a tree and boosting against a baseline\"},{\"es\":\"Elegir métrica y umbral según el costo de cada error cuando la clase importante es rara\",\"en\":\"Choose the metric and threshold by the cost of each error when the important class is rare\"},{\"es\":\"Ajustar hiperparámetros con validación cruzada sin contaminar el test\",\"en\":\"Tune hyperparameters with cross-validation without contaminating the test set\"},{\"es\":\"Decidir cuándo usar una red neuronal, un boosting o un LLM con RAG\",\"en\":\"Decide when to use a neural network, boosting, or an LLM with RAG\"}],\"related\":{\"decks\":[\"fundamentals-ml-conceptos\",\"fundamentals-ml-modelos\",\"fundamentals-ml-entrenamiento\",\"fundamentals-inteligencia-artificial\"],\"quizzes\":[\"ml-fundamentals-es\"]},\"exam\":{\"id\":\"ruta-ml-desde-cero\",\"title\":{\"es\":\"Examen: Machine Learning desde 0\",\"en\":\"Exam: Machine Learning from scratch\"}},\"stages\":[{\"id\":\"s1\",\"title\":{\"es\":\"Qué es el Machine Learning de verdad\",\"en\":\"What Machine Learning really is\"},\"objective\":{\"es\":\"Al terminar podrás responder «¿cuándo conviene un modelo y cuándo no?» y distinguir los tres tipos de aprendizaje por los datos, no por definiciones.\",\"en\":\"By the end you will answer «when does a model make sense and when not?» and tell the three learning types apart by the data, not by definitions.\"},\"steps\":[{\"id\":\"s1-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: por qué existe el ML\",\"en\":\"Capsule: why ML exists\"},\"problem\":{\"es\":\"Escribir a mano la lógica de cada caso concreto («spam es si contiene GANASTE un millón») fracasa: las reglas se quedan cortas para el spam de mañana, el fraude de mañana, la foto de mañana. El ML invierte el enfoque: en vez de escribir las reglas, damos EJEMPLOS RESUELTOS y el algoritmo deduce un criterio generalizable.\",\"en\":\"Hand-writing the logic of every single case («spam is if it contains YOU WON a million») fails: rules fall short for tomorrow's spam, tomorrow's fraud, tomorrow's photo. ML flips the approach: instead of writing rules, we provide SOLVED EXAMPLES and the algorithm infers a generalizable criterion.\"},\"mechanism\":{\"es\":\"Un modelo es una función con PARÁMETROS ajustables. Entrenar = buscar los valores de esos parámetros que minimizan el error sobre los ejemplos (la «loss»). En muchos modelos (regresiones, redes neuronales) el algoritmo mide el error, calcula hacia dónde corregir cada parámetro (el gradiente) y da un pequeño paso; otros, como los árboles, buscan sus cortes de otra forma, pero la idea es la misma. Repetido muchas veces, el criterio emerge de los datos, no de tu teclado. La predicción posterior es barata: solo aplicar la función aprendida.\",\"en\":\"A model is a function with adjustable PARAMETERS. Training = finding the parameter values that minimize the error on the examples (the “loss”). In many models (regressions, neural networks) the algorithm measures the error, computes which way to correct each parameter (the gradient) and takes a small step; others, such as trees, search for their splits differently, but the idea is the same. Repeated many times, the rule emerges from the data, not from your keyboard. Predicting afterwards is cheap: just apply the learned function.\"},\"flow\":[{\"es\":\"Ejemplos resueltos (datos + respuesta correcta)\",\"en\":\"Solved examples (data + right answer)\"},{\"es\":\"El modelo propone un criterio y mide el error cometido (loss)\",\"en\":\"The model proposes a criterion and measures its error (loss)\"},{\"es\":\"El gradiente indica cómo ajustar cada parámetro para errar menos\",\"en\":\"The gradient says how to adjust each parameter to err less\"},{\"es\":\"El ciclo se repite hasta que el error deja de bajar: el modelo entrenado responde a casos NUEVOS\",\"en\":\"The loop repeats until the error stops dropping: the trained model answers NEW cases\"}],\"whenNot\":[{\"es\":\"No necesitas ML cuando la regla es exacta y estable: los impuestos de un país, un ticket de supermercado o «mayor de edad» se resuelven con lógica directa; un modelo solo añadiría errores probables a un cálculo exacto.\",\"en\":\"You don't need ML when the rule is exact and stable: a country's taxes, a supermarket receipt, or «adult or not» are plain logic — a model would only add probable errors to an exact computation.\"},{\"es\":\"Tampoco cuando no hay (ni puede haber) ejemplos etiquetados: si nadie puede decirte la respuesta correcta de casos pasados, no hay nada de qué aprender; ahí toca reunir datos o reformular el problema, no entrenar.\",\"en\":\"Nor when no labeled examples exist or can exist: if nobody can tell you past cases' right answers, there is nothing to learn from — gather data or reshape the problem instead of training.\"}]},{\"id\":\"s1-tarjetas\",\"kind\":\"cards\",\"minutes\":12,\"title\":{\"es\":\"Tarjetas: el modelo mental y sus piezas\",\"en\":\"Cards: the mental model and its pieces\"},\"deck\":\"fundamentals-ml-conceptos\",\"ids\":[\"ml-concepto-que-es\",\"ml-concepto-modelo-algoritmo-datos\",\"ml-concepto-entrenar-inferir\",\"ml-concepto-ciclo\",\"ml-concepto-supervisado\",\"ml-concepto-clasificacion-regresion\",\"ml-concepto-no-supervisado\",\"ml-concepto-refuerzo\",\"ml-concepto-features-labels\"],\"cardsEs\":[{\"id\":\"ml-concepto-que-es\",\"part\":\"m\",\"front\":\"¿Qué es el machine learning?\",\"back\":\"En vez de programar reglas explícitas (\\\"si pasa X, haz Y\\\"), el machine learning aprende un patrón a partir de ejemplos (datos) y lo usa para predecir o decidir sobre casos nuevos.\\n\\n• El modelo es el resultado de ese aprendizaje.\\n• Los datos son la materia prima.\\n\\nAnalogía: no le escribes a un niño todas las razas de perro; le muestras muchas fotos y él generaliza.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-modelo-algoritmo-datos\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre datos, algoritmo y modelo?\",\"back\":\"El algoritmo es la receta de aprendizaje, los datos son los ejemplos y el modelo es lo que resulta de aplicar esa receta a esos datos.\\n\\n• Datos: los ejemplos (tabla, imágenes, texto).\\n• Algoritmo: el método de aprendizaje (regresión lineal, un árbol, una red).\\n• Modelo: lo que queda DESPUÉS de entrenar: lo que el algoritmo ajustó con esos datos (pesos, umbrales de un árbol o, en k-NN, los propios ejemplos guardados).\\n\\nEl mismo algoritmo con otros datos produce otro modelo. Sin datos no hay modelo, solo una receta vacía.\",\"topic\":\"Modelo, algoritmo, datos\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-entrenar-inferir\",\"part\":\"m\",\"front\":\"¿Qué es entrenar y qué es inferir (predecir)?\",\"back\":\"Entrenar es ajustar los parámetros con ejemplos que traen la respuesta; inferir es usar el modelo ya ajustado para responder un caso nuevo.\\n\\n• Entrenar: el modelo mira muchos ejemplos con respuesta y ajusta sus parámetros. Suele ser lento y caro; se repite de vez en cuando.\\n• Inferir / predecir: el modelo ya entrenado recibe un caso NUEVO y da una respuesta. Suele ser rápido por caso; es lo que ves en producción.\\n\\nAnalogía: estudiar para el examen (entrenar) vs resolver un problema el día del examen (inferir).\",\"topic\":\"Entrenar vs inferir\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-ciclo\",\"part\":\"m\",\"front\":\"¿Cuáles son los pasos de un proyecto de ML, de punta a punta?\",\"back\":\"Un proyecto de ML va de definir el problema y su métrica a desplegar y monitorear, pasando por datos, baseline y evaluación.\\n\\n1. Definir el problema y la métrica de negocio.\\n2. Conseguir y limpiar datos (y un split honesto).\\n3. Entrenar una baseline, luego modelos mejores.\\n4. Evaluar en validation/test.\\n5. Desplegar (batch u online) y MONITOREAR: los datos del mundo cambian (drift).\\n\\nEl código del modelo es una parte; la mayoría del tiempo se va en datos y en operación.\",\"topic\":\"Ciclo de vida ML\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-supervisado\",\"part\":\"m\",\"front\":\"¿Qué es el aprendizaje supervisado?\",\"back\":\"Se entrena con datos ETIQUETADOS: cada ejemplo incluye la respuesta correcta. El modelo aprende a mapear entradas → salida.\\n\\nDos tareas típicas:\\n• Clasificación: predecir una categoría (spam / no spam).\\n• Regresión: predecir un número (precio de una casa).\\n\\nEs uno de los tipos más comunes en aplicaciones de negocio. Pista: si tienes historial CON la respuesta que quieres predecir → supervisado.\",\"topic\":\"Aprendizaje supervisado\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-clasificacion-regresion\",\"part\":\"m\",\"front\":\"¿Cómo distingo clasificación de regresión?\",\"back\":\"Si la salida que quieres predecir es una categoría, es clasificación; si es un número continuo, es regresión.\\n\\n• Categoría / etiqueta (sí/no, tipo de animal, riesgo alto/medio/bajo) → clasificación.\\n• Número continuo (precio, temperatura, minutos de retraso) → regresión.\\n\\nTrampa: \\\"porcentaje de impago\\\" es un número, pero si lo conviertes en \\\"impaga / no impaga\\\" pasa a ser clasificación. La pregunta de negocio decide.\",\"topic\":\"Clasificación vs regresión\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-no-supervisado\",\"part\":\"m\",\"front\":\"¿Qué es el aprendizaje no supervisado?\",\"back\":\"Se entrena con datos SIN etiquetas: el modelo busca estructura por sí solo.\\n\\nEjemplos: agrupar clientes parecidos (clustering), reducir dimensiones, detectar anomalías. No hay una \\\"respuesta correcta\\\" con la que comparar, así que evaluar es más subjetivo.\\n\\nAnalogía: supervisado = estudiar con solucionario; no supervisado = ordenar fotos sin que nadie nombre las categorías.\",\"topic\":\"Aprendizaje no supervisado\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-refuerzo\",\"part\":\"m\",\"front\":\"¿Qué es el aprendizaje por refuerzo?\",\"back\":\"Un agente toma acciones en un entorno y recibe recompensas o castigos; aprende una política que maximiza la recompensa acumulada.\\n\\nSe usa en juegos, robótica y control. No necesita ejemplos etiquetados: aprende por prueba y error.\\n\\nNo lo confundas con \\\"el modelo recibe un premio si acierta el label\\\": eso sigue siendo supervisado.\",\"topic\":\"Aprendizaje por refuerzo\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-features-labels\",\"part\":\"m\",\"front\":\"¿Qué son las features y los labels?\",\"back\":\"Las features son las columnas de entrada que describen cada ejemplo; el label es la respuesta que el modelo debe aprender a predecir.\\n\\n• Features (características): las variables de entrada que describen cada ejemplo (edad, consumo, texto).\\n• Label (etiqueta / target): la salida que queremos predecir en aprendizaje supervisado.\\n• Ejemplo (fila): una combinación de features + su label.\\n\\nA menudo, la calidad de las features importa más que el algoritmo elegido. Sin label no hay supervisado.\",\"topic\":\"Features y labels\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"difficulty\":\"basic\"}],\"cardsEn\":[{\"id\":\"ml-concepto-que-es\",\"part\":\"m\",\"front\":\"What is machine learning?\",\"back\":\"Instead of programming explicit rules (\\\"if X, then Y\\\"), machine learning learns a pattern from examples (data) and uses it to predict or decide on new cases.\\n\\n• The model is the result of that learning.\\n• The data is the raw material.\\n\\nAnalogy: you do not write down every dog breed for a child; you show many photos and they generalize.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-modelo-algoritmo-datos\",\"part\":\"m\",\"front\":\"What is the difference between data, algorithm, and model?\",\"back\":\"The algorithm is the learning recipe, the data are the examples, and the model is what you get by applying that recipe to that data.\\n\\n• Data: the examples (table, images, text).\\n• Algorithm: the learning method (linear regression, a tree, a network).\\n• Model: what remains AFTER training: what the algorithm fitted on that data (weights, a tree's thresholds or, in k-NN, the stored examples themselves).\\n\\nThe same algorithm with different data produces a different model. With no data there is no model, only an empty recipe.\",\"topic\":\"Modelo, algoritmo, datos\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-entrenar-inferir\",\"part\":\"m\",\"front\":\"What is training vs inference (prediction)?\",\"back\":\"Training is fitting the parameters on examples that carry the answer; inference is using the fitted model to answer a new case.\\n\\n• Train: the model looks at many examples with answers and adjusts its parameters. Usually slow and expensive; repeated now and then.\\n• Infer / predict: the already-trained model gets a NEW case and answers. Usually fast per case; this is what you see in production.\\n\\nAnalogy: studying for the exam (train) vs solving a problem on exam day (infer).\",\"topic\":\"Entrenar vs inferir\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-ciclo\",\"part\":\"m\",\"front\":\"What are the steps of an ML project, end to end?\",\"back\":\"An ML project runs from defining the problem and its metric to deploying and monitoring, going through data, a baseline and evaluation.\\n\\n1. Define the problem and the business metric.\\n2. Get and clean data (and an honest split).\\n3. Train a baseline, then better models.\\n4. Evaluate on validation/test.\\n5. Deploy (batch or online) and MONITOR: real-world data changes (drift).\\n\\nModel code is one piece; most time goes to data and operations.\",\"topic\":\"Ciclo de vida ML\",\"origin\":\"ai\",\"group\":\"Fundamentos\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-supervisado\",\"part\":\"m\",\"front\":\"What is supervised learning?\",\"back\":\"Trained on LABELED data: every example includes the correct answer. The model learns to map inputs → output.\\n\\nTwo typical tasks:\\n• Classification: predict a category (spam / not spam).\\n• Regression: predict a number (house price).\\n\\nIt is one of the most common types in business applications. Tip: if you have history WITH the answer you want to predict → supervised.\",\"topic\":\"Aprendizaje supervisado\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-clasificacion-regresion\",\"part\":\"m\",\"front\":\"How do I tell classification from regression?\",\"back\":\"If the output you want to predict is a category, it is classification; if it is a continuous number, it is regression.\\n\\n• Category / label (yes/no, animal type, high/medium/low risk) → classification.\\n• Continuous number (price, temperature, minutes of delay) → regression.\\n\\nTrap: \\\"default rate\\\" is a number, but if you turn it into \\\"defaults / does not\\\" it becomes classification. The business question decides.\",\"topic\":\"Clasificación vs regresión\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-no-supervisado\",\"part\":\"m\",\"front\":\"What is unsupervised learning?\",\"back\":\"Trained on UNLABELED data: the model finds structure on its own.\\n\\nExamples: grouping similar customers (clustering), reducing dimensions, detecting anomalies. There is no \\\"correct answer\\\" to compare against, so evaluation is more subjective.\\n\\nAnalogy: supervised = studying with the answer key; unsupervised = sorting photos with nobody naming the categories.\",\"topic\":\"Aprendizaje no supervisado\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-refuerzo\",\"part\":\"m\",\"front\":\"What is reinforcement learning?\",\"back\":\"An agent takes actions in an environment and receives rewards or penalties; it learns a policy that maximizes cumulative reward.\\n\\nUsed in games, robotics, and control. It needs no labeled examples: it learns by trial and error.\\n\\nDo not confuse it with \\\"the model gets a prize if it matches the label\\\": that is still supervised learning.\",\"topic\":\"Aprendizaje por refuerzo\",\"origin\":\"ai\",\"group\":\"Tipos de aprendizaje\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-features-labels\",\"part\":\"m\",\"front\":\"What are features and labels?\",\"back\":\"Features are the input columns that describe each example; the label is the answer the model must learn to predict.\\n\\n• Features: the input variables describing each example (age, spend, text).\\n• Label (target): the output we want to predict in supervised learning.\\n• Example (row): one combination of features + its label.\\n\\nFeature quality often matters more than the algorithm chosen. Without a label there is no supervised learning.\",\"topic\":\"Features y labels\",\"origin\":\"ai\",\"group\":\"Datos y preparación\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"}]},{\"id\":\"s1-practica\",\"kind\":\"practice\",\"minutes\":10,\"title\":{\"es\":\"Práctica: ¿modelo de ML o regla fija?\",\"en\":\"Practice: ML model or fixed rule?\"},\"scaffolding\":\"high\",\"instructions\":{\"es\":\"Objetivo: distinguir cuándo un problema necesita Machine Learning y cuándo basta con programar una regla.\\n\\n• REGLA: ya conoces la fórmula o el procedimiento exacto y lo escribes tal cual en código (por ejemplo, `total = subtotal * 1.16`).\\n• MODELO: nadie sabe escribir esa fórmula, pero hay muchos ejemplos pasados con la respuesta correcta, y el programa aprende el patrón a partir de ellos.\\n\\nClasifica estos 4 problemas como REGLA o MODELO y justifica cada uno en una frase:\\n\\n1. Calcular el total con IVA de un ticket de compra.\\n2. Recomendar canciones parecidas a las que escuchas.\\n3. Saber si un número es múltiplo de 3.\\n4. Estimar el precio de una casa a partir de sus características (metros, zona, antigüedad).\\n\\nCómo justificar: responde para cada problema las dos preguntas que verás en el ejemplo resuelto (detectar fraude). Copia la plantilla al cuadro y rellena los huecos.\",\"en\":\"Goal: tell apart when a problem needs Machine Learning and when programming a rule is enough.\\n\\n• RULE: you already know the exact formula or procedure and write it straight into code (for example, `total = subtotal * 1.16`).\\n• MODEL: nobody can write that formula down, but there are many past examples with the correct answer, and the program learns the pattern from them.\\n\\nClassify these 4 problems as RULE or MODEL and justify each one in one sentence:\\n\\n1. Compute the total of a receipt including VAT.\\n2. Recommend songs similar to the ones you listen to.\\n3. Tell whether a number is a multiple of 3.\\n4. Estimate a house's price from its features (size, area, age).\\n\\nHow to justify: for each problem, answer the two questions shown in the worked example (fraud detection). Copy the template into the box and fill in the blanks.\"},\"workedExample\":{\"es\":\"Ejemplo: detectar fraude en compras con tarjeta → MODELO\\n\\n¿Existe una fórmula exacta que ya conozcas?\\n  No. Los estafadores cambian de táctica cada semana; nadie puede escribir la regla.\\n¿Hay ejemplos pasados con la respuesta correcta?\\n  Sí. Miles de compras ya marcadas como «fraude» o «legítima».\\n\\nConclusión: no hay fórmula, pero sí ejemplos → un MODELO aprende el patrón\\ncon esas compras y lo aplica a compras nuevas que nunca vio.\",\"en\":\"Example: detect credit-card purchase fraud → MODEL\\n\\nIs there an exact formula you already know?\\n  No. Fraudsters change tactics every week; nobody can write the rule down.\\nAre there past examples with the correct answer?\\n  Yes. Thousands of purchases already labeled «fraud» or «legit».\\n\\nConclusion: no formula, but plenty of examples → a MODEL learns the pattern\\nfrom those purchases and applies it to new purchases it never saw.\"},\"starter\":{\"es\":\"1. Total con IVA de un ticket → REGLA o MODELO: ______\\n   ¿Existe una fórmula exacta que ya conozcas? ______\\n   ¿Hay ejemplos pasados con la respuesta correcta? ______\\n\\n2. Recomendar canciones parecidas → REGLA o MODELO: ______\\n   ¿Existe una fórmula exacta que ya conozcas? ______\\n   ¿Hay ejemplos pasados con la respuesta correcta? ______\\n\\n3. ¿Es múltiplo de 3? → REGLA o MODELO: ______\\n   ¿Existe una fórmula exacta que ya conozcas? ______\\n   ¿Hay ejemplos pasados con la respuesta correcta? ______\\n\\n4. Precio de una casa → REGLA o MODELO: ______\\n   ¿Existe una fórmula exacta que ya conozcas? ______\\n   ¿Hay ejemplos pasados con la respuesta correcta? ______\",\"en\":\"1. Receipt total with VAT → RULE or MODEL: ______\\n   Is there an exact formula you already know? ______\\n   Are there past examples with the correct answer? ______\\n\\n2. Recommend similar songs → RULE or MODEL: ______\\n   Is there an exact formula you already know? ______\\n   Are there past examples with the correct answer? ______\\n\\n3. Is it a multiple of 3? → RULE or MODEL: ______\\n   Is there an exact formula you already know? ______\\n   Are there past examples with the correct answer? ______\\n\\n4. House price → RULE or MODEL: ______\\n   Is there an exact formula you already know? ______\\n   Are there past examples with the correct answer? ______\"},\"hints\":[{\"es\":\"Prueba rápida: ¿podrías escribir hoy la respuesta en una sola línea de código, sin haber visto ningún ejemplo? Si sí → REGLA.\",\"en\":\"Quick test: could you write the answer today in a single line of code, without having seen any example? If yes → RULE.\"},{\"es\":\"Una REGLA funciona sin datos; un MODELO no existe sin datos. Si la respuesta depende de muchas cosas a la vez y nadie sabe cómo combinarlas (el gusto musical, el valor de una casa), pero hay un historial con la respuesta → MODELO.\",\"en\":\"A RULE works with no data; a MODEL cannot exist without data. If the answer depends on many things at once and nobody knows how to combine them (musical taste, a house's value), but there is a history with the answer → MODEL.\"}],\"solution\":{\"es\":\"1. Total con IVA → REGLA. Fórmula exacta y estable: total = subtotal × (1 + IVA).\\n   No hace falta ningún dato histórico.\\n\\n2. Recomendar canciones → MODELO. Nadie sabe escribir la fórmula del gusto (ni el\\n   propio usuario), pero hay millones de reproducciones registradas de las que aprender.\\n\\n3. Múltiplo de 3 → REGLA. Aritmética pura: n % 3 == 0 (o: la suma de sus dígitos es\\n   divisible entre 3). Un modelo solo podría equivocarse donde la regla nunca falla.\\n\\n4. Precio de una casa → MODELO. Depende de muchas variables a la vez (metros, zona,\\n   antigüedad…) sin fórmula cerrada, y sí hay un histórico de ventas con su precio real\\n   (esto se llama regresión supervisada).\\n\\nPatrón: REGLA cuando la fórmula existe y no cambia; MODELO cuando la fórmula es\\ndesconocida pero sobran ejemplos con la respuesta.\",\"en\":\"1. Total with VAT → RULE. Exact, stable formula: total = subtotal × (1 + VAT).\\n   No historical data needed.\\n\\n2. Recommend songs → MODEL. Nobody can write the formula of taste (not even the\\n   user), but millions of recorded plays exist to learn from.\\n\\n3. Multiple of 3 → RULE. Pure arithmetic: n % 3 == 0 (or: its digit sum is divisible\\n   by 3). A model could only make mistakes where the rule never fails.\\n\\n4. House price → MODEL. It depends on many variables at once (size, area, age…) with\\n   no closed formula, and there is a sales history with the real price (this is\\n   called supervised regression).\\n\\nPattern: RULE when the formula exists and does not change; MODEL when the formula\\nis unknown but examples with the answer abound.\"},\"language\":\"text\",\"criteria\":[{\"es\":\"Los problemas 1 y 3 (IVA y múltiplo de 3) quedaron como REGLA, justificados con la fórmula exacta, no con «es fácil».\",\"en\":\"Problems 1 and 3 (VAT and multiple of 3) are RULE, justified with the exact formula, not with «it's easy».\"},{\"es\":\"Los problemas 2 y 4 (canciones y casa) quedaron como MODELO, diciendo que no hay fórmula conocida y sí ejemplos pasados con la respuesta.\",\"en\":\"Problems 2 and 4 (songs and house) are MODEL, saying there is no known formula but there are past examples with the answer.\"},{\"es\":\"Cada justificación responde a las dos preguntas: ¿existe la fórmula? ¿hay ejemplos con la respuesta?\",\"en\":\"Every justification answers both questions: does the formula exist? are there examples with the answer?\"}]},{\"id\":\"s1-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: el filtro de spam que adivina\",\"en\":\"Lab: the spam filter that guesses\"},\"symptom\":{\"es\":\"El filtro de spam «funciona»: el dashboard reporta 99% de aciertos. Pero en su primera semana real deja pasar mucho spam y manda correos legítimos a la carpeta de spam: los usuarios calculan que acierta bastante menos que ese 99%. Nada se rompió entre la prueba y la puesta en producción.\",\"en\":\"The spam filter “works”: the dashboard reports 99% accuracy. But in its first real week it lets plenty of spam through and sends legitimate email to the spam folder: users estimate it is right far less often than that 99%. Nothing broke between testing and going live.\"},\"artifact\":{\"es\":\"# Evaluación del modelo (lo que corrió el equipo)\\nemails = load_emails()              # TODOS los correos históricos\\nspam = label_is_spam(emails)        # su etiqueta (1 = spam, 0 = legítimo)\\n\\nmodel = SpamFilter().fit(emails, spam)\\npredicted = model.predict(emails)   # ¡los MISMOS correos!\\n\\naccuracy = (predicted == spam).mean()\\nprint(f\\\"accuracy: {accuracy:.2%}\\\")  # -\u003e 99.0%\",\"en\":\"# Model evaluation (what the team ran)\\nemails = load_emails()              # ALL historical emails\\nspam = label_is_spam(emails)        # its label (1 = spam, 0 = legit)\\n\\nmodel = SpamFilter().fit(emails, spam)\\npredicted = model.predict(emails)   # the SAME emails!\\n\\naccuracy = (predicted == spam).mean()\\nprint(f\\\"accuracy: {accuracy:.2%}\\\")  # -\u003e 99.0%\"},\"language\":\"python\",\"question\":{\"es\":\"¿Cuál es la causa raíz del 99% en el dashboard y de la catástrofe en producción?\",\"en\":\"What is the root cause of both the 99% on the dashboard and the disaster in production?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El accuracy es la métrica equivocada: debieron usar precisión y recall\",\"en\":\"Accuracy is the wrong metric: they should have used precision and recall\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el problema es la métrica. Aquí la métrica no mide mal: es el examen mismo el que está viciado, porque se evalúa sobre el mismo conjunto con el que se entrenó.\",\"en\":\"The wrong assumption: that the problem is the metric. The metric is not measuring badly — the exam itself is broken, because it is evaluated on the very same set the model trained on.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Se entrenó y se midió sobre los mismos correos: el modelo ya «vio» las respuestas del examen, y ante correo nuevo su criterio es inútil\",\"en\":\"They trained and measured on the same emails: the model already «saw» the exam's answers, and on fresh mail its criterion is useless\"},\"correct\":true,\"why\":{\"es\":\"Gana porque explica los DOS síntomas: memorizar los ejemplos produce 99% sobre lo ya visto, y un criterio que nunca aprendió a generalizar se desploma ante correo nuevo.\",\"en\":\"It wins because it explains BOTH symptoms: memorizing the examples yields 99% on seen data, and a criterion that never learned to generalize collapses on new mail.\"}},{\"id\":\"C\",\"text\":{\"es\":\"El modelo es un árbol demasiado profundo: debieron podarlo\",\"en\":\"The model is a too-deep tree: they should have pruned it\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: culpar la técnica. Podar ayuda contra el sobreajuste, pero no arregla el defecto real: el examen corre sobre datos de entrenamiento; podado o no, el número sigue inflado.\",\"en\":\"The wrong assumption: blaming the technique. Pruning helps against overfitting, yet cannot fix the real flaw: the exam runs on training data; pruned or not, the number stays inflated.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Faltó normalizar el texto de los correos antes de entrenar\",\"en\":\"They forgot to normalize the emails' text before training\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que es un detalle de preprocesamiento. Ninguna normalización arregla una evaluación hecha sobre el conjunto de entrenamiento: aun con texto limpio, el 99% sería mentira.\",\"en\":\"The wrong assumption: that it is a preprocessing detail. No normalization fixes an evaluation run on the training set: even with clean text, the 99% is a lie.\"}}],\"rootCause\":{\"es\":\"Se evaluó con los mismos datos de entrenamiento (no hay separación train/test). El modelo puede memorizar las respuestas: el 99% no mide capacidad con correo nuevo, mide memoria. La generalización nunca fue puesta a prueba.\",\"en\":\"It was evaluated on its own training data (no train/test separation). The model can memorize the answers: the 99% does not measure new-mail ability, it measures memory. Generalization was never put to the test.\"},\"fix\":\"# Parche: separar el examen de la memoria\\nfrom sklearn.model_selection import train_test_split\\n\\nX_tr, X_te, y_tr, y_te = train_test_split(\\n    emails, spam, test_size=0.2, random_state=42, stratify=spam\\n)\\nmodel = SpamFilter().fit(X_tr, y_tr)     # solo aprende de train\\npredicted = model.predict(X_te)          # correos que NUNCA vio\\naccuracy = (predicted == y_te).mean()\\nprint(f\\\"accuracy real: {accuracy:.2%}\\\")  # el numero honesto\",\"fixNote\":{\"es\":\"La regla que este lab deja grabada: fit siempre sobre train, evaluar SIEMPRE sobre datos que el modelo no ha visto antes.\",\"en\":\"The rule this lab etches in: fit always on train, evaluate ALWAYS on data the model has never seen.\"},\"questions\":[{\"key\":\"s1-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:0:steps:3:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:3:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:3:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:3:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:3:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:3:options:3:why\"}],\"correct\":\"B\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s1-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":12,\"title\":{\"es\":\"Checkpoint: demuestra lo aprendido\",\"en\":\"Checkpoint: prove it\"},\"passPct\":70,\"items\":[{\"id\":\"s1-ck1\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"ml-fundamentos\",\"datos\"],\"prompt\":{\"es\":\"Tu empresa quiere predecir si un cliente pagará su próxima factura. Existe el histórico de 500.000 facturas pasadas etiquetadas pagó o no pagó, pero ningún experto sabe enunciar la regla exacta. ¿Qué falta para usar ML aquí?\",\"en\":\"Your company wants to predict whether a client will pay their next invoice. A history of 500,000 past invoices labeled paid/unpaid exists, but no expert can state the exact rule. What is missing to use ML here?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Nada: hay ejemplos etiquetados en cantidad y la regla es incognoscible — es el caso ideal de un modelo supervisado\",\"en\":\"Nothing: plenty of labeled examples exist and the rule is unknowable — the ideal supervised-model case\"},\"correct\":true,\"why\":{\"es\":\"Gana porque junta las DOS condiciones del modelo mental: regla incognoscible (por eso no se codifica a mano) y ejemplos resueltos en cantidad (por eso hay señal de la cual aprender).\",\"en\":\"It wins because it joins BOTH conditions of the mental model: unknowable rule (hence no hand-coding) and plenty of solved examples (hence signal to learn from).\"}},{\"id\":\"B\",\"text\":{\"es\":\"Falta que un auditor enuncie primero la regla exacta de pago; sin regla no hay nada que entrenar\",\"en\":\"An auditor must state the exact payment rule first; without a rule there is nothing to train\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que escribir la regla es siempre posible y necesario. Es justo lo que el ML evita: los ejemplos sustituyen a la regla.\",\"en\":\"The wrong assumption: that stating the rule is always possible and required. That is precisely what ML avoids: examples replace the rule.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Con 500.000 ejemplos el ML no sirve: es demasiado poco; se necesita al menos un millón\",\"en\":\"With 500,000 examples ML won't work: too small; at least a million is needed\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: inventar un umbral mágico. La señal de 500.000 facturas basta para un clasificador tabular; el tamaño exacto depende de la complejidad del patrón, no de un número redondo.\",\"en\":\"The wrong assumption: inventing a magic threshold. The signal in 500,000 invoices suffices for a tabular classifier; the exact size depends on pattern complexity, not a round number.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Debes cambiar el problema a no supervisado: agrupar las facturas por similitud e ignorar las etiquetas\",\"en\":\"You must switch to unsupervised: cluster invoices by similarity and ignore the labels\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que las etiquetas sobran. Ignorarlas tiraría la señal más valiosa: para predecir pago, el aprendizaje es supervisado por definición.\",\"en\":\"The wrong assumption: that labels are a burden. Discarding them would waste the most valuable signal — to predict payment, the learning is supervised by definition.\"}}],\"takeaway\":{\"es\":\"El ML necesita dos cosas a la vez: ejemplos con su respuesta correcta y una regla que nadie sabe escribir.\",\"en\":\"ML needs two things at once: examples with their right answer, and a rule nobody can write down.\"}},{\"id\":\"s1-ck2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"ml-fundamentos\",\"arquitectura\"],\"prompt\":{\"es\":\"Te contratan para «aplicar IA» y te topas con tres proyectos: (1) calcular la nómina bajo la ley vigente, (2) predecir el consumo eléctrico de una fábrica mañana con 3 años de mediciones horarias, (3) decidir si una solicitud está completa según un checklist del regulador. ¿Cuáles merecen un modelo de ML?\",\"en\":\"You are hired to «apply AI» and find three projects: (1) compute payroll under current law, (2) predict a factory's power consumption tomorrow from 3 years of hourly readings, (3) decide whether an application is complete per the regulator's checklist. Which ones deserve an ML model?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Los tres: con suficiente ML cualquier problema se resuelve\",\"en\":\"All three: with enough ML any problem can be solved\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: el ML como llave universal. Para nómina y checklist la regla es EXACTA y ESTABLE; un modelo solo metería error en un cálculo determinista y auditable legalmente.\",\"en\":\"The wrong assumption: ML as a universal key. For payroll and the checklist the rule is EXACT and STABLE; a model would inject error into a deterministic, legally auditable computation.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Ninguno: si la empresa ya tiene procesos, nunca conviene entrenar\",\"en\":\"None: if the company already has processes, training is never worth it\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: el extremo opuesto. El consumo eléctrico depende de temperatura, turnos y calendario sin fórmula cerrada, y HAY 3 años de mediciones: ejemplos abundantes, regla incognoscible.\",\"en\":\"The wrong assumption: the opposite extreme. Power consumption depends on weather, shifts and calendar with no closed formula, and 3 YEARS of readings exist: abundant examples, unknowable rule.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Solo el (2): nómina y checklist son reglas exactas y estables (lógica directa); el consumo no tiene fórmula pero sí tres años de mediciones reales\",\"en\":\"Only (2): payroll and the checklist are exact, stable rules (plain logic); consumption has no formula but three years of real readings exist\"},\"correct\":true,\"why\":{\"es\":\"Gana porque separa los tres casos con las mismas DOS piezas del modelo mental: ¿existe la fórmula? ¿existen ejemplos? Nómina y checklist tienen fórmula; el consumo no la tiene pero sí datos.\",\"en\":\"It wins because it sorts all three cases by the SAME two pieces of the mental model: does the formula exist? do examples exist? Payroll and checklist have a formula; consumption does not but has data.\"}},{\"id\":\"D\",\"text\":{\"es\":\"(2) y (3): el consumo por sus datos y el checklist por su complejidad burocrática\",\"en\":\"(2) and (3): consumption for its data and the checklist for its bureaucratic complexity\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: complejidad ≠ incognoscibilidad. «Complejo pero escrito» sigue siendo una regla: al checklist se le aplica tal cual, y un modelo sería menos fiable que su propia definición.\",\"en\":\"The wrong assumption: complexity ≠ unknowability. «Complex but written» is still a rule: the checklist is applied as-is, and a model would be LESS reliable than its own definition.\"}}],\"takeaway\":{\"es\":\"La pregunta nunca es «¿puede ML con esto?» sino «¿existe la fórmula? Si no, ¿abundan los ejemplos?».\",\"en\":\"The question is never «can ML do this?» but «does the formula exist? If not, do examples abound?».\"}},{\"id\":\"s1-ck3\",\"type\":\"metric_selection\",\"difficulty\":\"intermediate\",\"tags\":[\"ml-fundamentos\",\"evaluacion\"],\"prompt\":{\"es\":\"Entrenaste un filtro de spam con datos históricos y quieres una métrica honesta de su desempeño con correo nuevo. ¿Cuál de estas NO es una forma válida de obtener la parte de datos «que el modelo nunca vio»?\",\"en\":\"You trained a spam filter on historical data and want an honest metric of its performance on fresh mail. Which of these is NOT a valid way to obtain the data part «the model never saw»?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Separar 20% de los correos ANTES de entrenar y reservarlos sin tocarlos hasta la evaluación final\",\"en\":\"Set aside 20% of the emails BEFORE training and leave them untouched until final evaluation\"},\"correct\":false,\"why\":{\"es\":\"Sí es válida: es el método estándar (train/test split). Los reservados jamás tocan el ajuste, así que sí son «nunca vistos».\",\"en\":\"It IS valid: the standard method (train/test split). Held-out mail never touches the fit, so it is genuinely «never seen».\"}},{\"id\":\"B\",\"text\":{\"es\":\"Validación cruzada de k partes: cada correo sirve de test en una de las k repeticiones\",\"en\":\"k-fold cross-validation: each email serves as test in one of the k rounds\"},\"correct\":false,\"why\":{\"es\":\"Sí es válida: en cada ronda la parte de test no entrenó ese modelo concreto. Es válida y muy útil cuando los datos escasean.\",\"en\":\"It IS valid: in each round the test part did not train that round's model. Valid and especially useful on scarce data.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Guardar el último mes de correos reales (jamás tocados) y evaluar solo al final del proyecto\",\"en\":\"Hold out the last month of real mail (never touched) and evaluate only at project end\"},\"correct\":false,\"why\":{\"es\":\"Sí es válida: es un split temporal, de hecho la evaluación más realista cuando los datos tienen tendencia temporal.\",\"en\":\"It IS valid: a temporal split — in fact the most realistic evaluation when data trends over time.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Entrenar varias épocas más y medir el accuracy sobre los MISMOS correos usados en el entrenamiento\",\"en\":\"Train a few more epochs and measure accuracy on the SAME emails used for training\"},\"correct\":true,\"why\":{\"es\":\"Gana porque es exactamente el vicio del lab s1: esos correos ya moldearon los parámetros; ningún número sobre ellos cuenta como «parte que nunca vio».\",\"en\":\"It wins because it is precisely the s1 lab's vice: those emails already shaped the parameters; no number over them counts as «never seen».\"}}],\"takeaway\":{\"es\":\"«Nunca visto» significa que esos datos no participaron del ajuste en ningún momento, no que el modelo los procesó después.\",\"en\":\"«Never seen» means those data took no part in the fit at any moment — not that the model processed them afterwards.\"}},{\"id\":\"s1-ck4\",\"type\":\"bug_diagnosis\",\"difficulty\":\"advanced\",\"tags\":[\"ml-fundamentos\",\"evaluacion\"],\"prompt\":{\"es\":\"Equipo A entrena un modelo de fraude y separa 20% para test: 89% en train, 68% en test; la primera semana en producción cae a 67%. Equipo B, en el mismo notebook y con los mismos datos, reporta 99,8% en train y 99,6% en test, cuando ningún modelo anterior había pasado del 70%. ¿Qué lectura das de cada caso?\",\"en\":\"Team A trains a fraud model and holds out 20% for test: 89% train, 68% test; the first production week lands at 67%. Team B, in the same notebook and with the same data, reports 99.8% train and 99.6% test, when no earlier model had gone past 70%. What do you read from each case?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El modelo B es mejor por su métrica más alta y estable: se despliega primero y el de 68% se investiga después\",\"en\":\"Model B is better — higher, steadier metric: deploy it first, investigate the 68% one later\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: comparar números sin leer el contexto. Un 99,6% en un problema donde nada había pasado del 70% es una alerta de fuga hasta demostrar lo contrario, no una virtud.\",\"en\":\"The wrong assumption: comparing numbers without reading the context. 99.6% on a problem where nothing had passed 70% is a leakage alarm until proven otherwise, not a virtue.\"}},{\"id\":\"B\",\"text\":{\"es\":\"El A sufre sobreajuste (memoria \u003e generalización), pero su 67% en producción CONFIRMA que su test es honesto; el 99,6% de B, muy por encima de todo lo anterior, huele a fuga y hay que auditar sus features antes de creerlo\",\"en\":\"A suffers overfitting (memory \u003e generalization), but its 67% in production CONFIRMS its test is honest; B's 99.6%, far above anything before, smells of leakage and its features must be audited before trusting it\"},\"correct\":true,\"why\":{\"es\":\"Gana porque los números cuentan una historia coherente: sobreajuste real con evaluación honesta (train≠test, test≈producción), frente a un salto casi perfecto e inexplicado, que es el síntoma típico de una feature que contiene la respuesta.\",\"en\":\"It wins because the numbers tell one coherent story: real overfitting with honest evaluation (train≠test, test≈production), versus an unexplained near-perfect jump, the typical symptom of a feature that contains the answer.\"}},{\"id\":\"C\",\"text\":{\"es\":\"El examen del A está mal hecho: que train y test difieran tanto prueba que la separación se barrió mal\",\"en\":\"A's exam is badly done: train and test differing that much proves the split was shuffled wrong\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: culpar al examen. Que test baje respecto a train es el comportamiento NORMAL del sobreajuste; y producción (67%) coincide con test (68%): la métrica predice la realidad.\",\"en\":\"The wrong assumption: blaming the exam. Test dropping from train is the NORMAL behaviour of overfitting; and production (67%) matches test (68%): the metric predicts reality.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Ambos están bien; las diferencias son azar del split y se corrigen entrenando más épocas\",\"en\":\"Both are fine; the differences are split luck and are fixed by training more epochs\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: el azar como explicación de patrones tan distintos. Más épocas no arreglan una fuga (la feature filtrada sigue ahí), y el sobreajuste del A se ataca con regularización, más datos o early stopping, no con más pasos.\",\"en\":\"The wrong assumption: chance explaining such distinct patterns. More epochs do not fix leakage (the leaked feature is still there), and A's overfitting is attacked with regularization, more data or early stopping, not more steps.\"}}],\"takeaway\":{\"es\":\"Un resultado casi perfecto e inexplicado se audita antes de creerlo; un test que predice a producción valida la métrica, aunque duela el número.\",\"en\":\"A near-perfect, unexplained result gets audited before you trust it; a test that predicts production validates the metric, however painful the number.\"}},{\"id\":\"s1-ck5\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"ml-fundamentos\",\"datos\"],\"prompt\":{\"es\":\"Una ONG digitaliza 40.000 encuestas de bienestar. Antes de entrenar un modelo de riesgo de deserción escolar, la analista dice: «las columnas ingreso y zona definen el contexto de cada hogar; el resto son detalles». ¿Qué papel desempeñan ingreso y zona?\",\"en\":\"An NGO digitizes 40,000 well-being surveys. Before training a school-dropout risk model, the analyst says: «income and district shape each household's context; the rest are details». What role do income and district play?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Son etiquetas: lo que el modelo debe predecir\",\"en\":\"They are the labels: what the model must predict\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir insumo con producto. La etiqueta es deserción; ingreso y zona acompañan al ejemplo, no son su respuesta.\",\"en\":\"The wrong assumption: mixing input and output. The label is dropout; income and district ride along with the example, they are not its answer.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Son features (variables de entrada): columnas que alimentan la predicción del modelo\",\"en\":\"They are features (input variables): columns feeding the model's prediction\"},\"correct\":true,\"why\":{\"es\":\"Gana porque es exactamente su papel: en la función aprendida, cada feature influye en la salida; la etiqueta (deserción) es a lo que se quiere acertar.\",\"en\":\"It wins because that is precisely their role: within the learned function every feature influences the output; the label (dropout) is the target.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Son hiperparámetros: ajustan la intensidad del entrenamiento\",\"en\":\"They are hyperparameters: they tune training intensity\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: un hiperparámetro es una decisión del entrenamiento (tasa de aprendizaje, profundidad), nunca una columna de datos.\",\"en\":\"The wrong assumption: a hyperparameter is a training decision (learning rate, depth), never a data column.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Son metadatos que conviene retirar: contaminarían el entrenamiento\",\"en\":\"They are metadata that should be removed: they would pollute training\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: metadato ≠ feature inútil. Con contexto real y señal predictiva, retirarlas solo empobrecería al modelo.\",\"en\":\"The wrong assumption: metadata ≠ useless feature. With real context and predictive signal, removing them would only impoverish the model.\"}}],\"takeaway\":{\"es\":\"Feature = columna de entrada; label = columna a predecir; hiperparámetro = decisión del entrenamiento, sin columna.\",\"en\":\"Feature = input column; label = the column to predict; hyperparameter = a training decision, never a column.\"}}],\"refs\":[{\"quiz\":{\"es\":\"ml-fundamentals-es\",\"en\":\"ml-fundamentals\"},\"ids\":[\"4\",\"9\"]}],\"questions\":[{\"key\":\"s1-ck1\",\"prompt\":\"$6:props:flow:stages:0:steps:4:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:4:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:4:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:4:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:4:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:0:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:0:steps:4:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"s1-ck2\",\"prompt\":\"$6:props:flow:stages:0:steps:4:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:4:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:4:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:4:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:4:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:1:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:0:steps:4:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s1-ck3\",\"prompt\":\"$6:props:flow:stages:0:steps:4:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:4:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:4:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:4:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:4:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:2:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:0:steps:4:items:2:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"metric_selection\"},{\"key\":\"s1-ck4\",\"prompt\":\"$6:props:flow:stages:0:steps:4:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:4:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:4:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:4:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:4:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:3:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:0:steps:4:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"bug_diagnosis\"},{\"key\":\"s1-ck5\",\"prompt\":\"$6:props:flow:stages:0:steps:4:items:4:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:4:items:4:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:4:items:4:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:4:items:4:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:4:items:4:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:4:items:4:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:0:steps:4:items:4:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"ml-fundamentals-es::4\",\"prompt\":{\"es\":\"Un científico de datos divide un dataset en conjuntos de entrenamiento, validación y prueba (test). ¿Cuál es el propósito principal del conjunto de validación?\",\"en\":\"A data scientist splits a dataset into training, validation and test sets. What is the main purpose of the validation set?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Comparar modelos y ajustar hiperparámetros sin tocar el conjunto de test\",\"en\":\"To compare models and tune hyperparameters without touching the test set\"}},{\"id\":\"B\",\"text\":{\"es\":\"Añadir más datos al entrenamiento para mejorar la precisión\",\"en\":\"To add more data to the training process and improve accuracy\"}},{\"id\":\"C\",\"text\":{\"es\":\"Reportar a los interesados el rendimiento final del modelo elegido\",\"en\":\"To report the final performance of the chosen model to stakeholders\"}},{\"id\":\"D\",\"text\":{\"es\":\"Guardar los ejemplos a los que les falta la etiqueta\",\"en\":\"To store examples that have missing labels\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"El conjunto de validación se usa durante el desarrollo para comparar modelos y elegir hiperparámetros. El conjunto de test se aparta y se usa una sola vez al final para estimar cómo rendirá el modelo elegido con datos nuevos. Si ajustas usando el test, su puntuación se vuelve optimista y deja de reflejar el rendimiento real.\",\"en\":\"The validation set is used during development to compare models and choose hyperparameters. The test set is kept aside and used only once at the end to estimate how the chosen model will perform on unseen data. If you tune on the test set, its score becomes optimistic and no longer reflects real-world performance.\"}},{\"key\":\"ml-fundamentals-es::9\",\"prompt\":{\"es\":\"Un modelo lineal se entrena con un dataset de 500 features, muchas de ellas probablemente irrelevantes. El equipo quiere que el modelo lleve automáticamente a exactamente cero los pesos de las features inútiles. ¿Qué regularización debe usar?\",\"en\":\"A linear model is trained on a dataset with 500 features, many of which are probably irrelevant. The team wants the model to automatically drive the weights of useless features to exactly zero. Which regularization should they use?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Regularización L2 (Ridge)\",\"en\":\"L2 regularization (Ridge)\"}},{\"id\":\"B\",\"text\":{\"es\":\"Regularización L1 (Lasso)\",\"en\":\"L1 regularization (Lasso)\"}},{\"id\":\"C\",\"text\":{\"es\":\"Aumentar la tasa de aprendizaje\",\"en\":\"Increasing the learning rate\"}},{\"id\":\"D\",\"text\":{\"es\":\"Eliminar el término de sesgo (bias)\",\"en\":\"Removing the bias term\"}}],\"correct\":\"B\",\"explanation\":{\"es\":\"La regularización L1 suma a la pérdida el valor absoluto de los pesos. Su geometría empuja muchos pesos a exactamente cero, lo que produce un modelo disperso (sparse) que en la práctica selecciona features. La regularización L2 suma los pesos al cuadrado y los encoge hacia cero, pero rara vez los deja exactamente en cero.\",\"en\":\"L1 regularization adds the sum of absolute weight values to the loss. Its geometry pushes many weights to exactly zero, producing a sparse model that effectively performs feature selection. L2 regularization adds the sum of squared weights and shrinks weights toward zero, but rarely makes them exactly zero.\"}}]}]},{\"id\":\"s2\",\"title\":{\"es\":\"Entrenar, ajustar y evaluar sin engañarse\",\"en\":\"Train, tune and evaluate without fooling yourself\"},\"objective\":{\"es\":\"Al terminar sabrás preparar los datos (features, faltantes, escalado), entrenar con batches y épocas y —sobre todo— leer métricas que predigan la realidad: precision/recall, la matriz de confusión y el umbral de decisión.\",\"en\":\"By the end you will prepare data (features, missing values, scaling), train with batches and epochs and — above all — read metrics that predict reality: precision/recall, the confusion matrix and the decision threshold.\"},\"steps\":[{\"id\":\"s2-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: del error al número que importa\",\"en\":\"Capsule: from error to the number that matters\"},\"problem\":{\"es\":\"El entrenamiento reduce UN número (la loss) sobre datos que el modelo ya vio; por perfecto que quede, no es el número del negocio. El negocio pregunta: «de las alarmas que levanta, ¿cuántas son de verdad?», «de los fraudes reales, ¿cuántos atrapa?». La pérdida optimiza el ajuste; las métricas de evaluación traducen ese ajuste en decisiones con costos reales.\",\"en\":\"Training lowers ONE number (the loss) over data the model already saw; however perfect, it is not the business number. The business asks: «of the alarms it raises, how many are real?», «of actual frauds, how many does it catch?». The loss optimizes fit; evaluation metrics translate that fit into decisions with real costs.\"},\"mechanism\":{\"es\":\"Cada predicción cae en una de las 4 casillas de la matriz de confusión: acertó el positivo (TP), acertó el negativo (TN), falsa alarma (FP) o caso perdido (FN). Precision = TP/(TP+FP): cuántas alarmas son reales. Recall = TP/(TP+FN): qué parte de los reales atrapaste. Se pisan: subir una suele bajar la otra, y la palanca del equilibrio es el UMBRAL (a qué probabilidad dices «sí»). Elegir el punto = fijar cuánto te cuesta una falsa alarma frente a un caso perdido.\",\"en\":\"Every prediction lands in one of 4 confusion-matrix boxes: true positive (TP), true negative (TN), false alarm (FP) or miss (FN). Precision = TP/(TP+FP): how many alarms are real. Recall = TP/(TP+FN): what share of real cases you caught. They trade off: raising one usually lowers the other, and the lever is the THRESHOLD (at what probability you say «yes»). Choosing it = pricing a false alarm against a miss.\"},\"flow\":[{\"es\":\"Datos etiquetados → entrenar (batches, épocas) → la loss de train baja\",\"en\":\"Labeled data → train (batches, epochs) → train loss drops\"},{\"es\":\"Predicciones sobre datos reservados → 4 casillas (TP, TN, FP, FN)\",\"en\":\"Predictions on held-out data → 4 boxes (TP, TN, FP, FN)\"},{\"es\":\"Precision y recall resumen las casillas que le importan al negocio\",\"en\":\"Precision and recall summarize the boxes the business cares about\"},{\"es\":\"El umbral fija el balance: bajarlo atrapa más reales (recall↑) y dispara falsas alarmas (precision↓)\",\"en\":\"The threshold sets the balance: lowering it catches more reals (recall↑) and fires more false alarms (precision↓)\"}],\"whenNot\":[{\"es\":\"No compares pérdidas entre proyectos distintos: la loss depende del tamaño y la escala de los datos; 0.3 aquí y 0.3 allá no significan lo mismo. Compara métricas, no pérdidas.\",\"en\":\"Don't compare losses across projects: the loss depends on data size and scale; 0.3 here and 0.3 there mean different things. Compare metrics, not losses.\"},{\"es\":\"Con clases raras (fraude ~0.5%), el accuracy ni se discute: un modelo que dice «no es fraude» a todo ya acierta 99.5%; pide precision/recall y el costo de cada casilla.\",\"en\":\"With rare classes (fraud ~0.5%), accuracy is a non-starter: a «nothing is fraud» model already scores 99.5%; demand precision/recall and the cost of each box.\"}]},{\"id\":\"s2-tarjetas\",\"kind\":\"cards\",\"minutes\":12,\"title\":{\"es\":\"Tarjetas: splits, sobreajuste y métricas\",\"en\":\"Cards: splits, overfitting and metrics\"},\"deck\":\"fundamentals-ml-conceptos\",\"ids\":[\"ml-concepto-splits\",\"ml-concepto-overfitting\",\"ml-concepto-underfitting\",\"ml-concepto-generalizacion\",\"ml-concepto-regularizacion\",\"ml-concepto-bias-variance\",\"ml-concepto-leakage\",\"ml-concepto-baseline\",\"ml-concepto-parametros-hiper\",\"ml-concepto-loss\",\"ml-concepto-gradiente\",\"ml-concepto-batch-epoch\"],\"cardsEs\":[{\"id\":\"ml-concepto-splits\",\"part\":\"m\",\"front\":\"¿Para qué se separan los datos en train, validation y test?\",\"back\":\"Train sirve para ajustar el modelo, validation para elegir entre opciones y test para medir una sola vez, al final, con datos nunca vistos.\\n\\n• Train: se ajusta el modelo.\\n• Validation: se eligen hiperparámetros y se comparan modelos.\\n• Test: se mide el rendimiento final UNA vez, sobre datos nunca vistos.\\n\\nMezclar estos conjuntos da métricas optimistas y engañosas. El test es el examen; si lo usas para practicar, ya no mide lo que crees.\",\"topic\":\"Train / validation / test\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-overfitting\",\"part\":\"m\",\"front\":\"¿Qué es el overfitting (sobreajuste)?\",\"back\":\"El modelo memoriza los datos de entrenamiento, incluido su ruido, y falla en datos nuevos.\\n\\nSeñal: muy bien en train, mucho peor en validation. Remedios: más datos, regularización, modelo más simple, early stopping, o menos features ruidosas.\\n\\nAnalogía: un estudiante que memoriza las preguntas del simulacro y se hunde en el examen real.\",\"topic\":\"Overfitting\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-underfitting\",\"part\":\"m\",\"front\":\"¿Qué es el underfitting (subajuste)?\",\"back\":\"El modelo es demasiado simple y no captura el patrón: falla tanto en entrenamiento como en datos nuevos.\\n\\nRemedios: un modelo más expresivo, mejores features, menos regularización, o entrenar más tiempo si el entrenamiento se cortó antes de converger.\\n\\nEs el problema opuesto al overfitting. Si train YA es malo, no es sobreajuste: el modelo no está aprendiendo.\",\"topic\":\"Underfitting\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-generalizacion\",\"part\":\"m\",\"front\":\"¿Qué significa que un modelo generaliza?\",\"back\":\"Que funciona en casos que NO vio durante el entrenamiento, no solo en los ejemplos memorizados.\\n\\nEse es el objetivo real del ML. Las métricas de test (y, en producción, el monitoreo) existen para comprobarlo. Un 99% en train no vale nada si en el mundo real acierta el 60%.\\n\\nAnalogía: aprobar el simulacro no es saber el tema; saberlo es resolver un problema nuevo. Si el dato de producción cambia (otro país, otra temporada), hay que volver a medir.\",\"topic\":\"Generalización\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-regularizacion\",\"part\":\"m\",\"front\":\"¿Qué es la regularización?\",\"back\":\"Un freno para que el modelo no se vuelva demasiado complejo y memorice ruido.\\n\\nFormas comunes: penalizar pesos grandes (L1/L2), dropout en redes, limitar la profundidad de un árbol, o early stopping.\\n\\nEs el antídoto principal del overfitting cuando no puedes conseguir más datos limpios.\",\"topic\":\"Regularización\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-bias-variance\",\"part\":\"m\",\"front\":\"¿Qué son el sesgo (bias) y la varianza en un modelo?\",\"back\":\"El sesgo es el error sistemático de un modelo demasiado rígido; la varianza es cuánto cambia el modelo si lo entrenas con otra muestra.\\n\\n• Sesgo (bias) alto: el modelo es rígido y se equivoca siempre de la misma forma. Es underfitting. Una línea recta sobre datos en curva tiene sesgo alto.\\n• Varianza alta: el modelo cambia mucho si cambias el train. Es overfitting. Memoriza el ruido de ESA muestra.\\n\\nQuieres el medio. Más datos bajan la varianza. Un modelo MÁS simple baja la varianza y SUBE el sesgo. Un modelo más flexible hace lo contrario. La frase trampa es \\\"simplificar baja el sesgo\\\": es al revés.\",\"topic\":\"Bias y varianza\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-leakage\",\"part\":\"m\",\"front\":\"¿Qué es el data leakage y por qué es tan peligroso?\",\"back\":\"Cuando información del futuro o del test se cuela en el entrenamiento. El modelo \\\"hace trampa\\\" y las métricas se ven perfectas… hasta producción.\\n\\nEjemplos: usar el id del cliente que ya incluye el resultado; ajustar el preprocesamiento (escalado, selección de features) con todo el dataset antes de dividir; un feature calculado DESPUÉS de saber el label.\\n\\nRegla: todo lo que el modelo vea en train debe existir en el momento de predecir en la vida real.\",\"topic\":\"Data leakage\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-baseline\",\"part\":\"m\",\"front\":\"¿Qué es una baseline y por qué hay que tener una?\",\"back\":\"La solución tonta o simple contra la que comparas: predecir siempre la clase mayoritaria, el promedio, o una regla de negocio.\\n\\nSi tu modelo sofisticado no gana a esa baseline, no aporta valor. Empieza siempre ahí: te evita celebrar un 90% de accuracy cuando el 90% de los casos ya eran \\\"no\\\".\",\"topic\":\"Baseline\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-parametros-hiper\",\"part\":\"m\",\"front\":\"¿Qué diferencia hay entre un parámetro y un hiperparámetro?\",\"back\":\"Los parámetros los aprende el modelo a partir de los datos; los hiperparámetros los fijas tú antes de entrenar.\\n\\n• Parámetros: los aprende el modelo solo (pesos, coeficientes, umbrales de un árbol).\\n• Hiperparámetros: los eliges TÚ antes de entrenar (número de árboles, learning rate, k en k-NN).\\n\\nLos hiperparámetros se eligen con validation (o cross-validation), no con test. Ajustarlos mirando el test es hacer trampa.\",\"topic\":\"Parámetros vs hiperparámetros\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-loss\",\"part\":\"m\",\"front\":\"¿Qué es una función de pérdida (loss)?\",\"back\":\"Un número que dice \\\"qué tan mal lo está haciendo el modelo\\\" en los ejemplos de train. Entrenar = buscar los parámetros que hacen esa pérdida lo más pequeña posible.\\n\\n• Regresión: suele ser error al cuadrado (MSE).\\n• Clasificación: suele ser log-loss / cross-entropy.\\n\\nLa métrica de negocio (dinero, precisión) no siempre es la loss: la loss es el motor del ajuste; la métrica es cómo juzgas el resultado.\",\"topic\":\"Función de pérdida\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-gradiente\",\"part\":\"m\",\"front\":\"¿Qué es el descenso por gradiente, en intuición?\",\"back\":\"Un método para bajar la loss dando pasitos. El gradiente indica la dirección de mayor subida; das un paso en la dirección CONTRARIA.\\n\\n• Learning rate: el tamaño del paso. Muy grande = te pasas; muy chico = tardas una eternidad.\\n\\nAnalogía: bajas una colina con niebla, solo sientes la pendiente bajo tus pies. No necesitas ver todo el mapa.\",\"topic\":\"Descenso por gradiente\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-batch-epoch\",\"part\":\"m\",\"front\":\"¿Qué es un batch y qué es un epoch?\",\"back\":\"Un batch es el grupo de ejemplos con el que se calcula un paso de ajuste; un epoch es una pasada completa por todo el train.\\n\\n• Batch (lote): un pedazo de ejemplos con el que calculas un paso de gradiente. Más chico = más ruido y más pasos; más grande = más estable y más memoria.\\n• Epoch: una pasada completa por TODO el train.\\n\\nEntrenar 10 epochs con batches de 32 significa: recorre el dataset 10 veces, 32 filas a la vez.\",\"topic\":\"Batch y epoch\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"}],\"cardsEn\":[{\"id\":\"ml-concepto-splits\",\"part\":\"m\",\"front\":\"Why split data into train, validation, and test?\",\"back\":\"Train is for fitting the model, validation for choosing between options, and test for measuring once, at the end, on never-seen data.\\n\\n• Train: fit the model.\\n• Validation: choose hyperparameters and compare models.\\n• Test: measure final performance ONCE, on data never seen before.\\n\\nMixing these sets yields optimistic, misleading metrics. Test is the exam; if you use it to practice, it no longer measures what you think.\",\"topic\":\"Train / validation / test\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-overfitting\",\"part\":\"m\",\"front\":\"What is overfitting?\",\"back\":\"The model memorizes the training data, including its noise, and fails on new data.\\n\\nSign: great on train, much worse on validation. Remedies: more data, regularization, a simpler model, early stopping, or fewer noisy features.\\n\\nAnalogy: a student who memorizes the practice questions and tanks the real exam.\",\"topic\":\"Overfitting\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-underfitting\",\"part\":\"m\",\"front\":\"What is underfitting?\",\"back\":\"The model is too simple to capture the pattern: it fails on both training and new data.\\n\\nRemedies: a more expressive model, better features, less regularization, or longer training if it stopped before converging.\\n\\nIt is the opposite problem to overfitting. If train is ALREADY bad, it is not overfit: the model is not learning.\",\"topic\":\"Underfitting\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-generalizacion\",\"part\":\"m\",\"front\":\"What does it mean that a model generalizes?\",\"back\":\"It works on cases it did NOT see during training, not only on memorized examples.\\n\\nThat is the real goal of ML. Test metrics (and, in production, monitoring) exist to check it. 99% on train is worthless if it scores 60% in the real world.\\n\\nAnalogy: passing the practice exam is not knowing the topic; knowing it is solving a new problem. If production data shifts (another country, another season), you have to measure again.\",\"topic\":\"Generalización\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-regularizacion\",\"part\":\"m\",\"front\":\"What is regularization?\",\"back\":\"A brake so the model does not become too complex and memorize noise.\\n\\nCommon forms: penalizing large weights (L1/L2), dropout in networks, limiting a tree's depth, or early stopping.\\n\\nIt is the main antidote to overfitting when you cannot get more clean data.\",\"topic\":\"Regularización\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-bias-variance\",\"part\":\"m\",\"front\":\"What are bias and variance in a model?\",\"back\":\"Bias is the systematic error of an overly rigid model; variance is how much the model changes if you train it on another sample.\\n\\n• High bias: the model is rigid and is wrong in the same way every time. That is underfitting. A straight line on curved data has high bias.\\n• High variance: the model changes a lot if you change the training set. That is overfitting. It memorizes the noise of THAT sample.\\n\\nYou want the middle. More data lowers variance. A SIMPLER model lowers variance and RAISES bias. A more flexible model does the opposite. The trap phrase is \\\"simplifying lowers bias\\\": it is the other way around.\",\"topic\":\"Bias y varianza\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-leakage\",\"part\":\"m\",\"front\":\"What is data leakage and why is it so dangerous?\",\"back\":\"When future or test information leaks into training. The model \\\"cheats\\\" and metrics look perfect… until production.\\n\\nExamples: using a customer id that already encodes the outcome; fitting preprocessing (scaling, feature selection) on the whole dataset before splitting; a feature computed AFTER you knew the label.\\n\\nRule: everything the model sees at train time must exist at prediction time in real life.\",\"topic\":\"Data leakage\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-baseline\",\"part\":\"m\",\"front\":\"What is a baseline and why do you need one?\",\"back\":\"The dumb or simple solution you compare against: always predict the majority class, the mean, or a business rule.\\n\\nIf your fancy model does not beat that baseline, it adds no value. Always start there: it stops you from celebrating 90% accuracy when 90% of cases were already \\\"no\\\".\",\"topic\":\"Baseline\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-parametros-hiper\",\"part\":\"m\",\"front\":\"What is the difference between a parameter and a hyperparameter?\",\"back\":\"Parameters are learned by the model from the data; hyperparameters are set by you before training.\\n\\n• Parameters: the model learns them on its own (weights, coefficients, tree thresholds).\\n• Hyperparameters: YOU pick them before training (number of trees, learning rate, k in k-NN).\\n\\nHyperparameters are chosen with validation (or cross-validation), not test. Tuning them on test is cheating.\",\"topic\":\"Parámetros vs hiperparámetros\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-loss\",\"part\":\"m\",\"front\":\"What is a loss function?\",\"back\":\"A number that says \\\"how badly the model is doing\\\" on the training examples. Training = finding the parameters that make that loss as small as possible.\\n\\n• Regression: often squared error (MSE).\\n• Classification
