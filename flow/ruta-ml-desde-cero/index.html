rt. The split must mimic production: time-based if you predict the future, by group if a customer or patient has several rows. The test set is used once, at the end.\"},\"flow\":[{\"es\":\"Pipeline (preprocesado + modelo) → GridSearchCV sobre train → mejor configuración\",\"en\":\"Pipeline (preprocessing + model) → GridSearchCV on train → best configuration\"},{\"es\":\"Curva de validación: brecha que crece → regularizar; ambos bajos → más capacidad o features\",\"en\":\"Validation curve: growing gap → regularize; both low → more capacity or features\"},{\"es\":\"Split temporal o por grupos si producción lo exige → test una sola vez\",\"en\":\"Time-based or group split if production requires it → test exactly once\"}],\"whenNot\":[{\"es\":\"No elijas hiperparámetros ni umbrales mirando el test.\",\"en\":\"Do not choose hyperparameters or thresholds by looking at the test set.\"},{\"es\":\"No uses KFold barajado con series temporales ni con varias filas por paciente o cliente.\",\"en\":\"Do not use shuffled KFold with time series or with several rows per patient or customer.\"},{\"es\":\"No regularices más un modelo que ya falla en train: está subajustado.\",\"en\":\"Do not regularize further a model that already fails on train: it is underfitting.\"}]},{\"id\":\"s5-tarjetas-entrenar\",\"kind\":\"cards\",\"minutes\":8,\"title\":{\"es\":\"Tarjetas: entrenar bien\",\"en\":\"Cards: training well\"},\"deck\":\"fundamentals-ml-entrenamiento\",\"module\":\"m2-entrenar\",\"cardsEs\":[{\"id\":\"ml-train-lr\",\"part\":\"m\",\"front\":\"¿Qué pasa si el learning rate es demasiado grande o demasiado chico?\",\"back\":\"La learning rate es el tamaño de cada paso al bajar la loss: muy grande diverge, muy chica avanza demasiado lento.\\n\\n• Muy grande: la loss salta, no converge o explota (NaN).\\n• Muy chica: avanza a paso de hormiga y, con un número fijo de epochs, termina lejos de una buena solución.\\n\\nEn la práctica se prueba un rango (por ejemplo 1e-4 a 1e-1) y a menudo se reduce con el tiempo. En redes suele ser el hiperparámetro más influyente.\",\"topic\":\"Learning rate\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-train-early-stop\",\"part\":\"m\",\"front\":\"¿Qué es early stopping y qué problema evita?\",\"back\":\"Early stopping deja de entrenar cuando la métrica de VALIDATION deja de mejorar, aunque la de train siga bajando, y se queda con el mejor momento.\\n\\nEso es la señal de overfitting: el modelo ya memoriza y deja de servir en datos nuevos. Necesitas un validation honesto, separado del train.\\n\\nGuardas el checkpoint del mejor momento en validation, no el del último epoch. \\\"Entrenar más\\\" no siempre es mejor.\",\"topic\":\"Early stopping\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-train-cv\",\"part\":\"m\",\"front\":\"¿Qué es la validación cruzada (cross-validation)?\",\"back\":\"La validación cruzada rota qué parte del train sirve para validar y promedia las métricas, para no depender de un solo split.\\n\\nPartes el train en k pliegues (por ejemplo 5). Entrenas en 4 y mides en el que quedó afuera. Rotas hasta que cada pliegue fue el de validación una vez. Promedias las métricas.\\n\\nAnalogía: cinco simulacros distintos, y te quedas con el promedio, no con el día que te fue mejor.\\n\\nSirve cuando hay poco dato y un solo split miente por azar. El test FINAL sigue apartado: no entra a esos pliegues. En series de tiempo no mezcles el futuro hacia el pasado.\",\"topic\":\"Cross-validation\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-train-pipeline\",\"part\":\"m\",\"front\":\"Tu notebook imputa, escala y selecciona features sobre todo X, y después hace cross-validation de 5 folds con los datos ya transformados. La CV da 0.92. ¿Qué cambias para que sea honesta?\",\"back\":\"Mete el preprocesado y el modelo en un Pipeline y pásalo entero a la validación cruzada, para que cada fold ajuste sus pasos solo con su parte de train.\\n\\n• scikit-learn: Pipeline + ColumnTransformer, y cross_val_score(pipeline, X, y).\\n• Los pasos que usan el label (selección de features, target encoding, SMOTE) son los que más inflan la métrica si se ajustan fuera.\\n• El mismo objeto entrenado se usa en producción: menos riesgo de que train y serving transformen distinto.\\n\\nRegla: todo lo que se \\\"ajusta\\\" (fit) va dentro del fold.\",\"topic\":\"Pipeline y validación cruzada\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"difficulty\":\"intermediate\"}],\"cardsEn\":[{\"id\":\"ml-train-lr\",\"part\":\"m\",\"front\":\"What happens if the learning rate is too large or too small?\",\"back\":\"The learning rate is the size of each step down the loss: too large diverges, too small moves too slowly.\\n\\n• Too large: the loss jumps around, does not converge, or blows up (NaN).\\n• Too small: it crawls and, with a fixed number of epochs, ends far from a good solution.\\n\\nIn practice you try a range (for example 1e-4 to 1e-1) and often decay it over time. In networks it is often the most influential hyperparameter.\",\"topic\":\"Learning rate\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-train-early-stop\",\"part\":\"m\",\"front\":\"What is early stopping and what problem does it prevent?\",\"back\":\"Early stopping halts training when the VALIDATION metric stops improving, even if train keeps falling, and keeps the best point.\\n\\nThat is the overfitting signal: the model is memorizing and stops helping on new data. You need an honest validation set, separate from train.\\n\\nYou keep the checkpoint from the best validation moment, not from the last epoch. \\\"Train longer\\\" is not always better.\",\"topic\":\"Early stopping\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-train-cv\",\"part\":\"m\",\"front\":\"What is cross-validation?\",\"back\":\"Cross-validation rotates which part of train is used for validation and averages the metrics, so you do not depend on one split.\\n\\nYou split train into k folds (for example 5). You train on 4 and measure on the one left out. You rotate until every fold was the validation fold once. You average the metrics.\\n\\nAnalogy: five different practice exams, and you keep the average, not the day you did best.\\n\\nIt helps when there is little data and a single split lies by chance. The FINAL test set stays held out: it does not enter those folds. On time series, do not leak the future into the past.\",\"topic\":\"Cross-validation\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-train-pipeline\",\"part\":\"m\",\"front\":\"Your notebook imputes, scales, and selects features on the whole X, then runs 5-fold cross-validation on the already transformed data. CV says 0.92. What do you change to make it honest?\",\"back\":\"Put preprocessing and the model in a Pipeline and pass the whole thing to cross-validation, so each fold fits its steps on its own training part only.\\n\\n• scikit-learn: Pipeline + ColumnTransformer, and cross_val_score(pipeline, X, y).\\n• Steps that use the label (feature selection, target encoding, SMOTE) are the ones that inflate the metric most when fitted outside.\\n• The same fitted object is used in production: less risk of training and serving transforming differently.\\n\\nRule: everything that is fitted goes inside the fold.\",\"topic\":\"Pipeline y validación cruzada\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"intermediate\"}]},{\"id\":\"s5-tarjetas-validar\",\"kind\":\"cards\",\"minutes\":6,\"title\":{\"es\":\"Tarjetas: validar sin trampas\",\"en\":\"Cards: validating without cheating\"},\"deck\":\"fundamentals-ml-conceptos\",\"ids\":[\"ml-concepto-split-temporal\",\"ml-concepto-sobreajuste-validacion\",\"ml-concepto-curva-aprendizaje\"],\"cardsEs\":[{\"id\":\"ml-concepto-split-temporal\",\"part\":\"m\",\"front\":\"Pronosticas la demanda diaria de una panadería con 3 años de historia. Un compañero baraja las filas al azar para el split y obtiene un error bajísimo, pero en producción el error se triplica. ¿Qué cambias?\",\"back\":\"Separa por tiempo: entrena con el pasado y valida con un periodo posterior, porque en producción siempre predecirás el futuro.\\n\\n• Barajar mete días \\\"del futuro\\\" en train: el modelo ve vecinos casi idénticos del día que debe predecir (leakage temporal).\\n• Para validación cruzada usa ventanas que avanzan en el tiempo (TimeSeriesSplit en scikit-learn).\\n• Las features con historia (ventas de ayer, media de 7 días) se calculan solo con datos anteriores a cada fecha.\\n\\nError típico: estratificar o barajar datos con orden temporal.\",\"topic\":\"Split temporal\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-sobreajuste-validacion\",\"part\":\"m\",\"front\":\"Probaste 300 combinaciones de hiperparámetros contra el mismo conjunto de validación de 500 filas. La mejor da 0.91 en validación, pero 0.85 en el test que no habías tocado. ¿Qué pasó?\",\"back\":\"Sobreajustaste el conjunto de validación: al quedarte con la mejor de muchas pruebas sobre pocas filas, parte de su ventaja era suerte, y el test intacto da la cifra honesta.\\n\\n• Cada elección hecha mirando validación \\\"gasta\\\" un poco de su independencia.\\n• Mitigaciones: validación cruzada en vez de un solo split, más filas de validación, menos combinaciones, o validación cruzada anidada para estimar el rendimiento.\\n• El 0.85 del test es el número a reportar.\\n\\nError típico: seguir ajustando hasta que el test también suba; entonces ya no tienes test.\",\"topic\":\"Sobreajustar la validación\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"advanced\"},{\"id\":\"ml-concepto-curva-aprendizaje\",\"part\":\"m\",\"front\":\"Con 5 000 filas tu modelo da 0.95 en train y 0.80 en validación. Al entrenar con 10 000 filas, la validación sube a 0.84 y la brecha se estrecha. Etiquetar 10 000 filas más cuesta un mes. ¿Datos o un modelo más grande?\",\"back\":\"Más datos: si la validación sigue subiendo al añadir filas y aún hay brecha con train, el modelo está limitado por varianza y los datos nuevos ayudan.\\n\\n• Esto es leer una curva de aprendizaje: rendimiento de train y validación según el tamaño del train.\\n• Si las dos curvas se juntan en un valor bajo, más datos ya no ayudan: falta capacidad o mejores features.\\n• Un modelo más grande ahora agrandaría la brecha (más varianza).\\n\\nRegla: mide la curva antes de gastar en datos o en modelo.\",\"topic\":\"Curva de aprendizaje\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"difficulty\":\"advanced\"}],\"cardsEn\":[{\"id\":\"ml-concepto-split-temporal\",\"part\":\"m\",\"front\":\"You forecast a bakery's daily demand with 3 years of history. A colleague shuffles the rows at random for the split and gets a tiny error, but in production the error triples. What do you change?\",\"back\":\"Split by time: train on the past and validate on a later period, because in production you always predict the future.\\n\\n• Shuffling puts \\\"future\\\" days in train: the model sees near-identical neighbors of the day it must predict (temporal leakage).\\n• For cross-validation, use windows that move forward in time (TimeSeriesSplit in scikit-learn).\\n• History features (yesterday's sales, 7-day mean) are computed only from data before each date.\\n\\nTypical mistake: stratifying or shuffling time-ordered data.\",\"topic\":\"Split temporal\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-concepto-sobreajuste-validacion\",\"part\":\"m\",\"front\":\"You tried 300 hyperparameter combinations against the same 500-row validation set. The best one scores 0.91 on validation, but 0.85 on the test set you had not touched. What happened?\",\"back\":\"You overfit the validation set: by keeping the best of many tries on few rows, part of its edge was luck, and the untouched test gives the honest number.\\n\\n• Every choice made by looking at validation \\\"spends\\\" a bit of its independence.\\n• Mitigations: cross-validation instead of one split, more validation rows, fewer combinations, or nested cross-validation to estimate performance.\\n• The test's 0.85 is the number to report.\\n\\nTypical mistake: tuning until test also goes up; then you no longer have a test set.\",\"topic\":\"Sobreajustar la validación\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-concepto-curva-aprendizaje\",\"part\":\"m\",\"front\":\"With 5,000 rows your model scores 0.95 on train and 0.80 on validation. Training on 10,000 rows lifts validation to 0.84 and the gap narrows. Labeling 10,000 more rows takes a month. Data or a bigger model?\",\"back\":\"More data: if validation keeps rising as you add rows and there is still a gap with train, the model is variance-limited and new data helps.\\n\\n• This is reading a learning curve: train and validation scores versus training-set size.\\n• If both curves meet at a low value, more data no longer helps: you need capacity or better features.\\n• A bigger model now would widen the gap (more variance).\\n\\nRule: measure the curve before spending on data or on a model.\",\"topic\":\"Curva de aprendizaje\",\"origin\":\"ai\",\"group\":\"Buenas prácticas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"advanced\"}]},{\"id\":\"s5-practica\",\"kind\":\"practice\",\"minutes\":15,\"title\":{\"es\":\"Práctica: curva de validación y GridSearchCV\",\"en\":\"Practice: validation curve and GridSearchCV\"},\"scaffolding\":\"high\",\"language\":\"python\",\"instructions\":{\"es\":\"Objetivo: elegir un hiperparámetro sin hacer trampa: con validación cruzada sobre train, dejando el test para el final.\\n\\nQué haces:\\n1. Copia y ejecuta el ejemplo resuelto. Calcula una curva de validación: para cada profundidad máxima del árbol imprime la exactitud en train, en validación (media de 5 folds) y la brecha entre ambas. Observa cómo train sube hasta 1.000 mientras validación se estanca: la brecha crece, y eso es sobreajuste.\\n2. Completa la plantilla (continúa el mismo script). Busca el mejor valor de C (la fuerza de regularización de la regresión logística) con GridSearchCV. Hay dos TODO: entrenar la búsqueda SOLO con train e imprimir la exactitud en test UNA sola vez, al final.\\n\\nQué escribes en el cuadro: tu código, el mejor C, su puntuación de validación cruzada y la de test.\",\"en\":\"Goal: choose a hyperparameter without cheating: with cross-validation on train, leaving the test set for the end.\\n\\nWhat you do:\\n1. Copy and run the worked example. It computes a validation curve: for each maximum tree depth it prints train accuracy, validation accuracy (mean of 5 folds) and the gap between them. Watch train climb to 1.000 while validation stalls: the gap grows, and that is overfitting.\\n2. Complete the template (it continues the same script). Find the best value of C (logistic regression's regularization strength) with GridSearchCV. There are two TODOs: fit the search on train ONLY and print the test accuracy ONCE, at the end.\\n\\nWhat you write in the box: your code, the best C, its cross-validation score and the test score.\"},\"workedExample\":\"from sklearn.datasets import load_breast_cancer\\nfrom sklearn.model_selection import train_test_split, validation_curve\\nfrom sklearn.tree import DecisionTreeClassifier\\n\\nX, y = load_breast_cancer(return_X_y=True)\\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\\n\\ndepths = [1, 2, 3, 4, 6, 8, 12, 20]\\ntrain_s, val_s = validation_curve(DecisionTreeClassifier(random_state=42), X_tr, y_tr,\\n                                  param_name=\\\"max_depth\\\", param_range=depths, cv=5)\\nfor d, tr, va in zip(depths, train_s.mean(axis=1), val_s.mean(axis=1)):\\n    print(f\\\"max_depth={d:2d} train={tr:.3f} val={va:.3f} gap={tr - va:.3f}\\\")\\n# depth 1: 0.925/0.894 (gap 0.030) ... depth 8+: ≈1.000/0.930 (gap 0.070)\",\"starter\":\"# Continues the worked example (X_tr, y_tr, X_te, y_te already exist)\\nfrom sklearn.model_selection import GridSearchCV\\nfrom sklearn.pipeline import make_pipeline\\nfrom sklearn.preprocessing import StandardScaler\\nfrom sklearn.linear_model import LogisticRegression\\n\\npipe = make_pipeline(StandardScaler(), LogisticRegression(max_iter=5000))\\ngrid = {\\\"logisticregression__C\\\": [0.001, 0.01, 0.1, 1, 10, 100]}\\nsearch = GridSearchCV(pipe, grid, cv=5)\\n# TODO: fit the search on the TRAIN split only\\n\\nprint(\\\"best:\\\", search.best_params_, \\\"CV score:\\\", round(search.best_score_, 3))\\n# TODO: print the test score ONCE with search.score(...)\",\"solution\":\"# Continues the worked example (X_tr, y_tr, X_te, y_te already exist)\\nfrom sklearn.model_selection import GridSearchCV\\nfrom sklearn.pipeline import make_pipeline\\nfrom sklearn.preprocessing import StandardScaler\\nfrom sklearn.linear_model import LogisticRegression\\n\\npipe = make_pipeline(StandardScaler(), LogisticRegression(max_iter=5000))\\ngrid = {\\\"logisticregression__C\\\": [0.001, 0.01, 0.1, 1, 10, 100]}\\nsearch = GridSearchCV(pipe, grid, cv=5)\\nsearch.fit(X_tr, y_tr)\\n\\nprint(\\\"best:\\\", search.best_params_, \\\"CV score:\\\", round(search.best_score_, 3))\\nprint(\\\"test score (once):\\\", round(search.score(X_te, y_te), 3))\\n# best C = 0.1 · CV 0.977 · test 0.979\",\"criteria\":[{\"es\":\"La curva imprime train y validación por profundidad: train llega a 1.000 y la brecha crece con la profundidad (de ≈0.03 a ≈0.07).\",\"en\":\"The curve prints train and validation per depth: train reaches 1.000 and the gap grows with depth (from ≈0.03 to ≈0.07).\"},{\"es\":\"search.fit recibe solo X_tr, y_tr, y el test se evalúa una única vez, después de la búsqueda.\",\"en\":\"search.fit receives only X_tr, y_tr, and the test set is evaluated exactly once, after the search.\"},{\"es\":\"Se imprimen el mejor C, su puntuación de CV y la de test (con estas semillas: C=0.1, ≈0.977 y ≈0.979).\",\"en\":\"The best C, its CV score and the test score are printed (with these seeds: C=0.1, ≈0.977 and ≈0.979).\"}]},{\"id\":\"s5-escenarios\",\"kind\":\"scenarios\",\"minutes\":8,\"title\":{\"es\":\"Escenarios: diagnosticar antes de ajustar\",\"en\":\"Scenarios: diagnose before tuning\"},\"items\":[{\"id\":\"s5-q1\",\"type\":\"bug_diagnosis\",\"difficulty\":\"basic\",\"tags\":[\"regularizacion\",\"diagnostico\"],\"prompt\":{\"es\":\"Para frenar un posible sobreajuste, un compañero puso alpha=1000 en una regresión Ridge de precios. Ahora el modelo da R² 0.21 en train y 0.20 en validación; antes daba 0.78 y 0.74. ¿Qué pasó?\",\"en\":\"To curb possible overfitting, a colleague set alpha=1000 on a Ridge price regression. The model now gives R² 0.21 on train and 0.20 on validation; before it gave 0.78 and 0.74. What happened?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Ahora generaliza perfecto: train y validación casi coinciden\",\"en\":\"It now generalizes perfectly: train and validation almost match\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que una brecha pequeña basta. Los dos números son malos: el modelo dejó de aprender el patrón.\",\"en\":\"The wrong assumption: that a small gap is enough. Both numbers are bad: the model stopped learning the pattern.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Regularizó de más: el modelo quedó subajustado; hay que bajar alpha y elegirlo con validación cruzada\",\"en\":\"It over-regularized: the model is now underfitting; lower alpha and choose it with cross-validation\"},\"correct\":true,\"why\":{\"es\":\"Gana porque una penalización enorme aplasta los coeficientes hacia cero; train y validación caen juntos, la firma del subajuste.\",\"en\":\"It wins because a huge penalty crushes the coefficients toward zero; train and validation drop together, the signature of underfitting.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Hay fuga de datos en validación\",\"en\":\"There is data leakage in validation\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir síntomas. La fuga inflaría la validación; aquí bajó.\",\"en\":\"The wrong assumption: mixing up symptoms. Leakage would inflate validation; here it went down.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Falta escalar el target\",\"en\":\"The target needs scaling\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que la escala del target cambia el ajuste. Multiplicar el target por una constante no cambia el R² de Ridge; el problema es la penalización.\",\"en\":\"The wrong assumption: that target scale changes the fit. Multiplying the target by a constant does not change Ridge's R²; the problem is the penalty.\"}}],\"takeaway\":{\"es\":\"Brecha pequeña con números malos es subajuste, no éxito.\",\"en\":\"A small gap with bad numbers is underfitting, not success.\"}},{\"id\":\"s5-q2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"curva-aprendizaje\",\"datos\"],\"prompt\":{\"es\":\"Con 5.000 filas tu modelo da 0.95 en train y 0.80 en validación; con 10.000 filas, 0.94 y 0.84. Etiquetar 10.000 filas más cuesta un mes. Tu jefe propone en cambio un modelo mucho más grande. ¿Qué recomiendas?\",\"en\":\"With 5,000 rows your model scores 0.95 on train and 0.80 on validation; with 10,000 rows, 0.94 and 0.84. Labeling 10,000 more rows takes a month. Your manager proposes a much bigger model instead. What do you recommend?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El modelo más grande: con más capacidad la validación subirá\",\"en\":\"The bigger model: with more capacity validation will rise\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que falta capacidad. La brecha indica exceso de varianza, y más capacidad tiende a agrandarla.\",\"en\":\"The wrong assumption: that capacity is missing. The gap points to excess variance, and more capacity tends to widen it.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Nada: 0.84 ya no va a mejorar\",\"en\":\"Nothing: 0.84 will not improve\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: ver un techo donde no lo hay. La validación sigue subiendo al añadir datos.\",\"en\":\"The wrong assumption: seeing a ceiling where there is none. Validation keeps rising as data is added.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Quitar la validación y entrenar con las 10.000 filas\",\"en\":\"Drop validation and train on the 10,000 rows\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que medir sobra. Perderías la forma de saber si la decisión funcionó.\",\"en\":\"The wrong assumption: that measuring is optional. You would lose the way to know whether the decision worked.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Conseguir más datos etiquetados: la validación sigue subiendo con más filas y la brecha con train se cierra\",\"en\":\"Get more labeled data: validation keeps rising with more rows and the gap with train is closing\"},\"correct\":true,\"why\":{\"es\":\"Gana porque esa es la lectura de una curva de aprendizaje: un modelo limitado por varianza mejora con más datos.\",\"en\":\"It wins because that is how to read a learning curve: a variance-limited model improves with more data.\"}}],\"takeaway\":{\"es\":\"Mide la curva de aprendizaje antes de decidir entre más datos o más modelo.\",\"en\":\"Measure the learning curve before choosing between more data and more model.\"}}],\"questions\":[{\"key\":\"s5-q1\",\"prompt\":\"$6:props:flow:stages:4:steps:4:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:4:steps:4:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:4:steps:4:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:4:steps:4:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:4:steps:4:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:4:steps:4:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:4:steps:4:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:4:steps:4:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:4:steps:4:items:0:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:4:steps:4:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"bug_diagnosis\"},{\"key\":\"s5-q2\",\"prompt\":\"$6:props:flow:stages:4:steps:4:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:4:steps:4:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:4:steps:4:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:4:steps:4:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:4:steps:4:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:4:steps:4:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:4:steps:4:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:4:steps:4:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:4:steps:4:items:1:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:4:steps:4:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"}]},{\"id\":\"s5-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: el C elegido con el examen\",\"en\":\"Lab: the C chosen with the exam\"},\"language\":\"python\",\"symptom\":{\"es\":\"El informe del modelo dice «mejor C encontrado, exactitud en test 0.962». Al evaluarlo con un segundo conjunto reservado de la misma época, que nadie había usado, la exactitud es 0.93. En el notebook se probaron 40 valores de C.\",\"en\":\"The model report says “best C found, test accuracy 0.962”. When evaluated on a second held-out set from the same period, which nobody had used, accuracy is 0.93. The notebook tried 40 values of C.\"},\"artifact\":\"best_c, best_acc = None, 0\\nfor c in np.logspace(-3, 3, 40):\\n    model = make_pipeline(StandardScaler(), LogisticRegression(C=c, max_iter=5000))\\n    model.fit(X_tr, y_tr)\\n    acc = model.score(X_te, y_te)          # cada C se juzga con el TEST / each C is judged on TEST\\n    if acc \u003e best_acc:\\n        best_c, best_acc = c, acc\\nprint(f\\\"best C = {best_c:.2g}, test accuracy {best_acc:.3f}\\\")   # -\u003e 0.962\",\"question\":{\"es\":\"¿Cuál es la causa raíz?\",\"en\":\"What is the root cause?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Faltó estandarizar las features\",\"en\":\"The features were not standardized\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: no leer el código. El pipeline ya incluye StandardScaler.\",\"en\":\"The wrong assumption: not reading the code. The pipeline already includes StandardScaler.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Probar 40 valores es poco; con 400 el test subiría\",\"en\":\"Trying 40 values is too few; with 400 the test score would go up\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que buscar más es mejor. Más pruebas contra el test agravan el problema: más probabilidad de elegir un C que encaje con ese test por azar.\",\"en\":\"The wrong assumption: that searching more is better. More tries against the test set make it worse: a higher chance of picking a C that fits that test by luck.\"}},{\"id\":\"C\",\"text\":{\"es\":\"El test se usó para elegir C: el 0.962 es el máximo de 40 intentos sobre el mismo test, así que es optimista\",\"en\":\"The test set was used to choose C: 0.962 is the maximum of 40 tries on the same test set, so it is optimistic\"},\"correct\":true,\"why\":{\"es\":\"Gana porque al quedarte con el mejor de muchos resultados sobre el mismo conjunto, parte de la ventaja es suerte; el test dejó de ser una medida independiente.\",\"en\":\"It wins because keeping the best of many results on the same set means part of the edge is luck; the test set stopped being an independent measurement.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Data drift entre el test y el segundo conjunto\",\"en\":\"Data drift between the test set and the second set\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: culpar a los datos. Los dos conjuntos son de la misma época; la diferencia se explica por cómo se eligió C.\",\"en\":\"The wrong assumption: blaming the data. Both sets come from the same period; the difference is explained by how C was chosen.\"}}],\"rootCause\":{\"es\":\"El test se usó como validación: se eligió el hiperparámetro que mejor le iba a ESE conjunto. El número reportado es el máximo de 40 mediciones ruidosas y sobreestima el rendimiento; el test ya no mide datos no vistos.\",\"en\":\"The test set was used as validation: the hyperparameter that suited THAT set best was chosen. The reported number is the maximum of 40 noisy measurements and overestimates performance; the test set no longer measures unseen data.\"},\"fix\":\"search = GridSearchCV(make_pipeline(StandardScaler(), LogisticRegression(max_iter=5000)),\\n                      {\\\"logisticregression__C\\\": np.logspace(-3, 3, 40)}, cv=5)\\nsearch.fit(X_tr, y_tr)                                  # C se elige con CV sobre train / chosen with CV on train\\nprint(search.best_params_, search.score(X_te, y_te))   # test: una sola vez / exactly once\",\"fixNote\":{\"es\":\"Para estimar sin sesgo el rendimiento del procedimiento completo de búsqueda, usa validación cruzada anidada.\",\"en\":\"To estimate the whole search procedure's performance without bias, use nested cross-validation.\"},\"questions\":[{\"key\":\"s5-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:4:steps:5:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:4:steps:5:options:0:text\",\"why\":\"$6:props:flow:stages:4:steps:5:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:4:steps:5:options:1:text\",\"why\":\"$6:props:flow:stages:4:steps:5:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:4:steps:5:options:2:text\",\"why\":\"$6:props:flow:stages:4:steps:5:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:4:steps:5:options:3:text\",\"why\":\"$6:props:flow:stages:4:steps:5:options:3:why\"}],\"correct\":\"C\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s5-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":12,\"title\":{\"es\":\"Checkpoint: ajuste y validación\",\"en\":\"Checkpoint: tuning and validation\"},\"items\":[{\"id\":\"s5-ck1\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"series-temporales\",\"validacion\"],\"prompt\":{\"es\":\"Pronosticas la demanda diaria de 40 tiendas con 3 años de historia. Un compañero valida con KFold(shuffle=True) y obtiene un error bajísimo; en producción el error se triplica. ¿Qué validación debió usar?\",\"en\":\"You forecast daily demand for 40 stores with 3 years of history. A colleague validates with KFold(shuffle=True) and gets a tiny error; in production the error triples. Which validation should they have used?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Una validación temporal: entrenar con fechas anteriores y validar con posteriores (por ejemplo, TimeSeriesSplit)\",\"en\":\"Time-based validation: train on earlier dates and validate on later ones (for example, TimeSeriesSplit)\"},\"correct\":true,\"why\":{\"es\":\"Gana porque imita producción, donde siempre se predice el futuro con el pasado.\",\"en\":\"It wins because it mimics production, where the future is always predicted from the past.\"}},{\"id\":\"B\",\"text\":{\"es\":\"StratifiedKFold para mantener la proporción de días festivos\",\"en\":\"StratifiedKFold to keep the proportion of holidays\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que estratificar arregla el orden. El modelo seguiría viendo días futuros vecinos del que debe predecir.\",\"en\":\"The wrong assumption: that stratifying fixes ordering. The model would still see future days next to the one it must predict.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Más folds (k=20) para reducir la varianza\",\"en\":\"More folds (k=20) to reduce variance\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que es un problema de varianza. Más folds barajados repiten la misma fuga temporal.\",\"en\":\"The wrong assumption: that it is a variance problem. More shuffled folds repeat the same temporal leak.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Mantener shuffle=True pero quitar las features de fecha\",\"en\":\"Keep shuffle=True but drop the date features\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que la fuga está en la columna de fecha. Los días vecinos se parecen en ventas y clima; la fuga sigue aunque borres la fecha.\",\"en\":\"The wrong assumption: that the leak lives in the date column. Neighboring days look alike in sales and weather; the leak remains even without the date.\"}}],\"takeaway\":{\"es\":\"Si en producción predices el futuro, valida con el futuro.\",\"en\":\"If production predicts the future, validate on the future.\"}},{\"id\":\"s5-ck2\",\"type\":\"bug_diagnosis\",\"difficulty\":\"intermediate\",\"tags\":[\"validacion\",\"grupos\"],\"prompt\":{\"es\":\"Tienes 12.000 radiografías de 900 pacientes (varias por paciente). Con un split aleatorio por imagen el modelo da 0.97 de AUC; con pacientes nuevos del mismo hospital, 0.81. ¿Qué cambias en la validación?\",\"en\":\"You have 12,000 X-rays from 900 patients (several per patient). With a random split by image the model scores 0.97 AUC; on new patients from the same hospital, 0.81. What do you change in validation?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Estratificar por diagnóstico\",\"en\":\"Stratify by diagnosis\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el problema es la proporción de enfermos. Estratificar la mantiene, pero sigue mezclando imágenes del mismo paciente en train y test.\",\"en\":\"The wrong assumption: that the issue is the share of sick patients. Stratifying keeps it, but still mixes images of the same patient across train and test.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Aumentar los datos con rotaciones y recortes\",\"en\":\"Augment the data with rotations and crops\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que es falta de variedad. La augmentation ayuda a generalizar, pero no arregla un test contaminado.\",\"en\":\"The wrong assumption: that variety is missing. Augmentation helps generalization, but it does not fix a contaminated test set.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Dividir por paciente (GroupKFold o GroupShuffleSplit): todas las imágenes de un paciente en el mismo lado\",\"en\":\"Split by patient (GroupKFold or GroupShuffleSplit): all of a patient's images on the same side\"},\"correct\":true,\"why\":{\"es\":\"Gana porque así el test contiene solo pacientes nuevos, como en producción, y el modelo no puede apoyarse en reconocer a la persona.\",\"en\":\"It wins because the test set then contains only new patients, as in production, and the model cannot rely on recognizing the person.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Entrenar más épocas con early stopping\",\"en\":\"Train more epochs with early stopping\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que es un problema de entrenamiento. No cambia que el test comparta pacientes con train.\",\"en\":\"The wrong assumption: that it is a training problem. It does not change that test shares patients with train.\"}}],\"takeaway\":{\"es\":\"Divide por la entidad que será nueva en producción.\",\"en\":\"Split by the entity that will be new in production.\"}},{\"id\":\"s5-ck3\",\"type\":\"bug_diagnosis\",\"difficulty\":\"advanced\",\"tags\":[\"hiperparametros\",\"validacion\"],\"prompt\":{\"es\":\"Probaste 300 combinaciones de hiperparámetros contra el mismo conjunto de validación de 500 filas. La mejor da 0.91 en validación y 0.85 en el test que no habías tocado. Tu jefe quiere reportar 0.91. ¿Qué haces?\",\"en\":\"You tried 300 hyperparameter combinations against the same 500-row validation set. The best scores 0.91 on validation and 0.85 on the test set you had not touched. Your manager wants to report 0.91. What do you do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Reportar 0.91: es el mejor resultado obtenido\",\"en\":\"Report 0.91: it is the best result obtained\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el máximo es representativo. Es el mejor de 300 mediciones ruidosas e incluye suerte.\",\"en\":\"The wrong assumption: that the maximum is representative. It is the best of 300 noisy measurements and includes luck.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Reportar el 0.85 del test y, la próxima vez, usar validación cruzada (o anidada) y menos combinaciones\",\"en\":\"Report the test's 0.85 and, next time, use cross-validation (or nested CV) and fewer combinations\"},\"correct\":true,\"why\":{\"es\":\"Gana porque el test intacto es la estimación honesta; elegir entre muchas pruebas sobre pocas filas sobreajusta la validación.\",\"en\":\"It wins because the untouched test set is the honest estimate; choosing among many tries on few rows overfits the validation set.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Seguir ajustando hasta que el test también llegue a 0.91\",\"en\":\"Keep tuning until the test also reaches 0.91\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el test es otro objetivo. Entonces se convierte en otra validación y ya no tienes medida honesta.\",\"en\":\"The wrong assumption: that the test set is another target. It then becomes another validation set and you lose your honest measurement.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Promediar 0.91 y 0.85 y reportar 0.88\",\"en\":\"Average 0.91 and 0.85 and report 0.88\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que promediar corrige el sesgo. Mezclar una medida sesgada con una honesta sigue estando sesgado.\",\"en\":\"The wrong assumption: that averaging removes bias. Mixing a biased measurement with an honest one is still biased.\"}}],\"takeaway\":{\"es\":\"La validación también se sobreajusta; el test intacto da el número a reportar.\",\"en\":\"Validation can be overfit too; the untouched test gives the number to report.\"}},{\"id\":\"s5-ck4\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"advanced\",\"tags\":[\"curva-aprendizaje\",\"features\"],\"prompt\":{\"es\":\"Al pasar de 20.000 a 80.000 filas, tu modelo lineal de demanda sigue dando 0.71 en train y 0.70 en validación. Te ofrecen comprar 200.000 filas más del mismo tipo. ¿Lo recomiendas?\",\"en\":\"Going from 20,000 to 80,000 rows, your linear demand model still scores 0.71 on train and 0.70 on validation. You are offered 200,000 more rows of the same kind. Do you recommend buying them?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Sí: más datos siempre mejoran el modelo\",\"en\":\"Yes: more data always improves the model\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que los datos lo curan todo. Las curvas ya convergieron; más filas del mismo tipo no suben un techo que pone el modelo.\",\"en\":\"The wrong assumption: that data cures everything. The curves have converged; more rows of the same kind do not lift a ceiling set by the model.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Sí, y además añadir regularización fuerte\",\"en\":\"Yes, and also add strong regularization\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: tratarlo como sobreajuste. El modelo ya está subajustado; regularizar lo empeora.\",\"en\":\"The wrong assumption: treating it as overfitting. The model is already underfitting; regularizing makes it worse.\"}},{\"id\":\"C\",\"text\":{\"es\":\"No; mejor quitar features para simplificar\",\"en\":\"No; better remove features to simplify\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que simplificar ayuda siempre. Aumenta el sesgo, que es justo el problema.\",\"en\":\"The wrong assumption: that simplifying always helps. It increases bias, which is exactly the problem.\"}},{\"id\":\"D\",\"text\":{\"es\":\"No por ahora: train y validación convergieron en un valor bajo (sesgo alto); conviene más capacidad o mejores features\",\"en\":\"Not for now: train and validation converged at a low value (high bias); more capacity or better features are needed\"},\"correct\":true,\"why\":{\"es\":\"Gana porque cuando ambas curvas se juntan abajo, el límite está en el modelo o en la información de las features, no en la cantidad de filas.\",\"en\":\"It wins because when both curves meet low, the limit lies in the model or the information in the features, not in the number of rows.\"}}],\"takeaway\":{\"es\":\"Curvas juntas y bajas: cambia el modelo o las features, no compres más filas.\",\"en\":\"Curves together and low: change the model or the features, do not buy more rows.\"}}],\"refs\":[{\"quiz\":{\"es\":\"ml-fundamentals-es\",\"en\":\"ml-fundamentals\"},\"ids\":[\"7\",\"9\",\"30\"]}],\"questions\":[{\"key\":\"s5-ck1\",\"prompt\":\"$6:props:flow:stages:4:steps:6:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:4:steps:6:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:4:steps:6:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:4:steps:6:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:4:steps:6:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:0:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:4:steps:6:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"s5-ck2\",\"prompt\":\"$6:props:flow:stages:4:steps:6:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:4:steps:6:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:4:steps:6:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:4:steps:6:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:4:steps:6:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:1:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:4:steps:6:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"bug_diagnosis\"},{\"key\":\"s5-ck3\",\"prompt\":\"$6:props:flow:stages:4:steps:6:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:4:steps:6:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:4:steps:6:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:4:steps:6:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:4:steps:6:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:2:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:4:steps:6:items:2:takeaway\",\"difficulty\":\"advanced\",\"type\":\"bug_diagnosis\"},{\"key\":\"s5-ck4\",\"prompt\":\"$6:props:flow:stages:4:steps:6:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:4:steps:6:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:4:steps:6:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:4:steps:6:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:4:steps:6:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:4:steps:6:items:3:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:4:steps:6:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"architecture_tradeoff\"},{\"key\":\"ml-fundamentals-es::7\",\"prompt\":{\"es\":\"Un modelo lineal entrenado para predecir el consumo de energía tiene un error alto tanto en entrenamiento como en validación, y ambos errores son muy parecidos. ¿Cuál es el problema más probable y su solución?\",\"en\":\"A linear model trained to predict energy consumption has high error on both the training set and the validation set, and the two errors are very similar. What is the most likely problem and fix?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Underfitting; usar un modelo más expresivo o añadir features más informativas\",\"en\":\"Underfitting; use a more expressive model or add more informative features\"}},{\"id\":\"B\",\"text\":{\"es\":\"Overfitting; añadir una regularización más fuerte\",\"en\":\"Overfitting; add stronger regularization\"}},{\"id\":\"C\",\"text\":{\"es\":\"Fuga de datos; quitar las features que usan información futura\",\"en\":\"Data leakage; remove features that use future information\"}},{\"id\":\"D\",\"text\":{\"es\":\"El conjunto de test es muy pequeño; recolectar más datos de test\",\"en\":\"The test set is too small; collect more test data\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"Cuando el error de entrenamiento y el de validación son ambos altos y parecidos, el modelo es demasiado simple para capturar el patrón subyacente. Es underfitting, o sesgo alto. Añadir regularización lo empeoraría; en su lugar, usa un modelo más flexible, crea mejores features o entrena más tiempo.\",\"en\":\"When training and validation errors are both high and close to each other, the model is too simple to capture the underlying pattern. This is underfitting, or high bias. Adding regularization would make it worse; instead, use a more flexible model, engineer better features, or train longer.\"}},{\"key\":\"ml-fundamentals-es::9\",\"prompt\":{\"es\":\"Un modelo lineal se entrena con un dataset de 500 features, muchas de ellas probablemente irrelevantes. El equipo quiere que el modelo lleve automáticamente a exactamente cero los pesos de las features inútiles. ¿Qué regularización debe usar?\",\"en\":\"A linear model is trained on a dataset with 500 features, many of which are probably irrelevant. The team wants the model to automatically drive the weights of useless features to exactly zero. Which regularization should they use?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Regularización L2 (Ridge)\",\"en\":\"L2 regularization (Ridge)\"}},{\"id\":\"B\",\"text\":{\"es\":\"Regularización L1 (Lasso)\",\"en\":\"L1 regularization (Lasso)\"}},{\"id\":\"C\",\"text\":{\"es\":\"Aumentar la tasa de aprendizaje\",\"en\":\"Increasing the learning rate\"}},{\"id\":\"D\",\"text\":{\"es\":\"Eliminar el término de sesgo (bias)\",\"en\":\"Removing the bias term\"}}],\"correct\":\"B\",\"explanation\":{\"es\":\"La regularización L1 suma a la pérdida el valor absoluto de los pesos. Su geometría empuja muchos pesos a exactamente cero, lo que produce un modelo disperso (sparse) que en la práctica selecciona features. La regularización L2 suma los pesos al cuadrado y los encoge hacia cero, pero rara vez los deja exactamente en cero.\",\"en\":\"L1 regularization adds the sum of absolute weight values to the loss. Its geometry pushes many weights to exactly zero, producing a sparse model that effectively performs feature selection. L2 regularization adds the sum of squared weights and shrinks weights toward zero, but rarely makes them exactly zero.\"}},{\"key\":\"ml-fundamentals-es::30\",\"prompt\":{\"es\":\"¿Cuál de los siguientes es un hiperparámetro y no un parámetro del modelo?\",\"en\":\"Which of the following is a hyperparameter rather than a model parameter?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"La profundidad máxima de un árbol de decisión\",\"en\":\"The maximum depth of a decision tree\"}},{\"id\":\"B\",\"text\":{\"es\":\"Los pesos de una regresión lineal\",\"en\":\"The weights of a linear regression\"}},{\"id\":\"C\",\"text\":{\"es\":\"Los umbrales de corte que un árbol de decisión aprende en cada nodo\",\"en\":\"The split thresholds a decision tree learns at each node\"}},{\"id\":\"D\",\"text\":{\"es\":\"Los sesgos (biases) de las neuronas de una red neuronal\",\"en\":\"The biases of a neural network's neurons\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"Los parámetros se aprenden de los datos durante el entrenamiento, como los pesos, los sesgos y los umbrales de corte de un árbol. Los hiperparámetros se fijan antes de entrenar y controlan cómo se aprende o cuán complejo puede ser el modelo, como la profundidad máxima del árbol, la tasa de aprendizaje, el número de capas o la fuerza de la regularización. Los hiperparámetros se eligen con un conjunto de validación o validación cruzada.\",\"en\":\"Parameters are learned from data during training, such as weights, biases and a tree's split thresholds. Hyperparameters are set before training and control how learning happens or how complex the model can be, such as maximum tree depth, learning rate, number of layers or regularization strength. Hyperparameters are chosen using a validation set or cross-validation.\"}}]},{\"id\":\"s5-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre: explícalo con tus palabras\",\"en\":\"Closing: explain it in your own words\"},\"prompt\":{\"es\":\"En 4–5 frases, explica cómo eliges un hiperparámetro sin hacer trampa y cómo decides entre conseguir más datos o un modelo más potente.\",\"en\":\"In 4–5 sentences, explain how you choose a hyperparameter without cheating and how you decide between getting more data and a more powerful model.\"},\"keyPoints\":[{\"es\":\"Se elige con validación cruzada sobre train, con el preprocesado dentro de un pipeline.\",\"en\":\"It is chosen with cross-validation on train, with preprocessing inside a pipeline.\"},{\"es\":\"El test se mira una sola vez, al final.\",\"en\":\"The test set is looked at once, at the end.\"},{\"es\":\"Brecha grande train–validación: varianza → regularizar o más datos.\",\"en\":\"Large train–validation gap: variance → regularize or get more data.\"},{\"es\":\"Ambas curvas bajas y juntas: sesgo → más capacidad o mejores features.\",\"en\":\"Both curves low and together: bias → more capacity or better features.\"},{\"es\":\"El split imita producción: temporal o por grupos cuando toca.\",\"en\":\"The split mimics production: time-based or by group when needed.\"}]}]},{\"id\":\"s6\",\"title\":{\"es\":\"Redes neuronales y dónde encaja la IA generativa\",\"en\":\"Neural networks and where generative AI fits\"},\"objective\":{\"es\":\"Al terminar sabrás cuándo una red neuronal compensa frente a un boosting, qué capa de salida y pérdida usar según la tarea, y cuándo un LLM necesita prompt, RAG o fine-tuning.\",\"en\":\"By the end you will know when a neural network pays off versus boosting, which output layer and loss to use for each task, and when an LLM needs prompting, RAG or fine-tuning.\"},\"steps\":[{\"id\":\"s6-capsula\",\"kind\":\"capsule\",\"minutes\":6,\"title\":{\"es\":\"Cápsula: capas, activaciones y LLM\",\"en\":\"Capsule: layers, activations and LLMs\"},\"problem\":{\"es\":\"Las redes neuronales y los LLM brillan con imagen, audio y texto, pero se usan por moda en tablas pequeñas o en tareas que una regla o un modelo clásico resuelven mejor y más barato.\",\"en\":\"Neural networks and LLMs shine on images, audio and text, but they get used out of fashion on small tables or on tasks that a rule or a classic model solves better and cheaper.\"},\"mechanism\":{\"es\":\"Una red apila capas: cada neurona hace una suma ponderada y aplica una activación no lineal; sin ella, muchas capas equivalen a una sola lineal. Se entrena con backpropagation y descenso por gradiente. Las CNN aprovechan la estructura local de las imágenes; los Transformers relacionan todos los tokens con atención y son la base de los LLM, que generan texto prediciendo el siguiente token. Con pocos datos se parte de un modelo preentrenado (transfer learning). Un LLM no consulta una base de hechos: para datos propios y cambiantes se le da contexto recuperado (RAG).\",\"en\":\"A network stacks layers: each neuron computes a weighted sum and applies a non-linear activation; without it, many layers equal a single linear one. It is trained with backpropagation and gradient descent. CNNs exploit the local structure of images; Transformers relate all tokens through attention and are the basis of LLMs, which generate text by predicting the next token. With little data you start from a pre-trained model (transfer learning). An LLM does not query a database of facts: for your own, changing data you give it retrieved context (RAG).\"},\"flow\":[{\"es\":\"Tipo de dato: tabla → boosting primero; imagen → CNN preentrenada; texto → Transformer o LLM\",\"en\":\"Data type: table → boosting first; image → pre-trained CNN; text → Transformer or LLM\"},{\"es\":\"Salida: número → 1 neurona lineal + MSE; una de N clases → softmax + entropía cruzada; varias etiquetas → sigmoides\",\"en\":\"Output: number → 1 linear neuron + MSE; one of N classes → softmax + cross-entropy; several labels → sigmoids\"},{\"es\":\"LLM: prompt → RAG para datos propios → fine-tuning solo para estilo o tarea muy repetida\",\"en\":\"LLM: prompt → RAG for your own data → fine-tuning only for style or a highly repeated task\"}],\"whenNot\":[{\"es\":\"No uses una red profunda en una tabla de pocos miles de filas sin compararla con un boosting.\",\"en\":\"Do not use a deep network on a table of a few thousand rows without comparing it with boosting.\"},{\"es\":\"No entrenes una CNN desde cero con unos cientos de imágenes: parte de un modelo preentrenado.\",\"en\":\"Do not train a CNN from scratch on a few hundred images: start from a pre-trained model.\"},{\"es\":\"No uses un LLM donde basta una regla o un clasificador barato, ni para cifras que deben ser exactas sin verificarlas.\",\"en\":\"Do not use an LLM where a rule or a cheap classifier is enough, or for figures that must be exact without verifying them.\"}]},{\"id\":\"s6-tarjetas-redes\",\"kind\":\"cards\",\"minutes\":10,\"title\":{\"es\":\"Tarjetas: deep learning\",\"en\":\"Cards: deep learning\"},\"deck\":\"fundamentals-ml-modelos\",\"module\":\"m7-deep\",\"cardsEs\":[{\"id\":\"ml-modelo-redes\",\"part\":\"m\",\"front\":\"¿Qué son las redes neuronales y cuándo usarlas?\",\"back\":\"Una red neuronal apila capas de \\\"neuronas\\\": cada una mezcla las entradas con pesos y aplica una función no lineal. Capa tras capa aprende representaciones, de lo simple (un borde) a lo abstracto (\\\"esto es un gato\\\").\\n\\nAnalogía: una línea de montaje. Cada estación transforma la pieza un poco.\\n\\nÚsalas con MUCHO dato en imagen, audio, texto o secuencias. También cuando las features a mano no alcanzan.\\n\\nEn una tabla de 5 000 filas, un boosting suele igualarlas con menos cómputo y menos misterio. \\\"Red\\\" no significa \\\"mejor\\\".\",\"topic\":\"Redes neuronales\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-mlp\",\"part\":\"m\",\"front\":\"¿Qué es una red densa (MLP) y en qué se diferencia de una CNN?\",\"back\":\"MLP = multilayer perceptron: cada neurona se conecta con TODAS las de la capa anterior. No sabe que dos píxeles vecinos son vecinos.\\n\\nÚsala en vectores ya armados (features tabulares, embeddings) cuando quieres no linealidad y tienes datos de sobra.\\n\\nPara imágenes usa una CNN (mira patrones locales). Para texto largo, un Transformer. Meter una foto aplastada en un MLP funciona, pero desperdicia la estructura.\",\"topic\":\"Red densa (MLP)\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-cnn\",\"part\":\"m\",\"front\":\"¿Qué es una CNN y para qué sirve?\",\"back\":\"Red convolucional: filtros chicos que recorren la imagen buscando patrones locales (borde, textura, ojo) y los combinan.\\n\\nLa idea que la hace funcionar: un gato sigue siendo un gato si se corre unos píxeles. El mismo filtro sirve en cualquier zona.\\n\\nÚsala para clasificar imágenes, y como base de detección de objetos. A veces también en audio o series, tratándolos como una \\\"imagen\\\" 1D.\\n\\nNo es el modelo de una tabla de Excel. Ahí un árbol suele ser más simple y igual de bueno.\",\"topic\":\"CNN\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-deteccion\",\"part\":\"m\",\"front\":\"¿En qué se diferencia clasificar una imagen de detectar objetos?\",\"back\":\"Clasificar da una etiqueta para toda la imagen; detectar localiza cada objeto con una caja y su clase; segmentar asigna una clase a cada píxel.\\n\\n• Clasificación: una etiqueta para TODA la foto (\\\"hay un perro\\\").\\n• Detección: varias cajas, cada una con clase y posición (\\\"perro aquí, persona allá\\\"). YOLO y familia son el ejemplo clásico.\\n• Segmentación: pinta píxel a píxel qué objeto es (máscara), no solo una caja.\\n\\nElige por la pregunta. \\\"¿Esta radiografía es normal?\\\" es clasificación. \\\"¿Dónde está el tumor?\\\" es detección o segmentación. Una CNN sola de clasificación no dibuja cajas.\",\"topic\":\"Detección vs clasificación\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-rnn-lstm\",\"part\":\"m\",\"front\":\"¿Qué son RNN y LSTM, y por qué los Transformers las reemplazaron en texto?\",\"back\":\"Una RNN lee la secuencia paso a paso y se pasa un \\\"estado\\\" al siguiente, como una persona que resume lo leído hasta ahora.\\n\\nLa LSTM es una RNN con memoria más larga: decide qué recordar y qué olvidar. Sirvió para traducción y series antes de 2017.\\n\\nProblema: lee en orden, así que no se paraleliza bien y le cuesta conservar información lejana. El Transformer relaciona todas las posiciones a la vez (atención) y se entrena en paralelo. Hoy, para texto, empieza por un Transformer; LSTM queda en series cortas o sistemas viejos.\",\"topic\":\"RNN y LSTM\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-transformer\",\"part\":\"m\",\"front\":\"¿Qué es un Transformer y para qué se usa?\",\"back\":\"Una red cuya pieza central es la atención: cada token (trozo de palabra) mira a los demás y decide cuáles le importan para entenderse.\\n\\nAnalogía: en una frase, \\\"banco\\\" mira alrededor para saber si es un asiento o un sitio de dinero.\\n\\nEs la base de los LLM (GPT, Gemini) y también de modelos de visión. Capta relaciones lejanas y se entrena en paralelo mejor que una RNN, aunque el costo de la atención crece con el cuadrado de la longitud.\\n\\nCuesta muchos datos y cómputo. Para una tabla de 10 columnas no lo necesitas. Tokens, prompts y alucinaciones están en el mazo de IA.\",\"topic\":\"Transformer\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bert-vs-gpt\",\"part\":\"m\",\"front\":\"¿En qué se diferencian un modelo tipo BERT y uno tipo GPT?\",\"back\":\"Un modelo tipo BERT es un encoder que lee el texto completo en las dos direcciones para entenderlo; uno tipo GPT es un decoder que predice el siguiente token para generar.\\n\\n• Encoder (BERT y familia): sirve para clasificar, buscar o extraer entidades. No está hecho para seguir escribiendo.\\n• Decoder (GPT y familia): solo mira hacia atrás (máscara causal). Sirve para generar texto.\\n• Los dos son Transformers; cambia qué miran y para qué se entrenaron.\\n\\nPista: \\\"completa la frase\\\" o \\\"chat\\\" → decoder. \\\"¿de qué trata este documento?\\\" → encoder, o un decoder al que le pides esa tarea.\",\"topic\":\"Encoder vs decoder\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"difficulty\":\"advanced\"}],\"cardsEn\":[{\"id\":\"ml-modelo-redes\",\"part\":\"m\",\"front\":\"What are neural networks, and when to use them?\",\"back\":\"A neural network stacks layers of \\\"neurons\\\": each one mixes inputs with weights and applies a non-linear function. Layer after layer learns representations, from simple (an edge) to abstract (\\\"this is a cat\\\").\\n\\nAnalogy: an assembly line. Each station transforms the piece a little.\\n\\nUse them with A LOT of data on images, audio, text, or sequences. Also when hand-made features are not enough.\\n\\nOn a 5,000-row table, boosting often matches them with less compute and less mystery. \\\"Network\\\" does not mean \\\"better\\\".\",\"topic\":\"Redes neuronales\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-mlp\",\"part\":\"m\",\"front\":\"What is a dense network (MLP), and how is it different from a CNN?\",\"back\":\"MLP = multilayer perceptron: every neuron connects to ALL of the previous layer. It does not know that two neighboring pixels are neighbors.\\n\\nUse it on vectors that are already built (tabular features, embeddings) when you want non-linearity and have plenty of data.\\n\\nFor images use a CNN (it looks at local patterns). For long text, a Transformer. Flattening a photo into an MLP works, but it wastes the structure.\",\"topic\":\"Red densa (MLP)\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-cnn\",\"part\":\"m\",\"front\":\"What is a CNN and what is it for?\",\"back\":\"A convolutional network: small filters slide over the image looking for local patterns (edge, texture, eye) and combine them.\\n\\nThe idea that makes it work: a cat is still a cat if it shifts a few pixels. The same filter works anywhere.\\n\\nUse it to classify images, and as the base of object detection. Sometimes also on audio or series, treated as a 1D \\\"image\\\".\\n\\nIt is not the model for an Excel table. A tree is usually simpler there and just as good.\",\"topic\":\"CNN\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-deteccion\",\"part\":\"m\",\"front\":\"How is classifying an image different from detecting objects?\",\"back\":\"Classification gives one label for the whole image; detection locates each object with a box and its class; segmentation assigns a class to every pixel.\\n\\n• Classification: one label for the WHOLE photo (\\\"there is a dog\\\").\\n• Detection: several boxes, each with a class and a position (\\\"dog here, person there\\\"). YOLO and family are the classic example.\\n• Segmentation: paints pixel by pixel which object it is (a mask), not just a box.\\n\\nChoose by the question. \\\"Is this X-ray normal?\\\" is classification. \\\"Where is the tumor?\\\" is detection or segmentation. A classification CNN alone does not draw boxes.\",\"topic\":\"Detección vs clasificación\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-rnn-lstm\",\"part\":\"m\",\"front\":\"What are RNNs and LSTMs, and why did Transformers replace them for text?\",\"back\":\"An RNN reads the sequence one step at a time and passes a \\\"state\\\" to the next step, like a person summarizing what they have read so far.\\n\\nAn LSTM is an RNN with a longer memory: it decides what to remember and what to forget. It was used for translation and series before 2017.\\n\\nProblem: it reads in order, so it does not parallelize well and struggles to keep distant information. A Transformer relates all positions at once (attention) and trains in parallel. Today, for text, start with a Transformer; LSTM remains for short series or older systems.\",\"topic\":\"RNN y LSTM\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-transformer\",\"part\":\"m\",\"front\":\"What is a Transformer and what is it used for?\",\"back\":\"A network whose core piece is attention: each token (a piece of a word) looks at the others and decides which ones matter for its meaning.\\n\\nAnalogy: in a sentence, \\\"bank\\\" looks around to know if it is a seat or a place for money.\\n\\nIt is the backbone of LLMs (GPT, Gemini) and also of vision models. It captures distant relationships and trains in parallel better than an RNN, although attention cost grows with the square of the length.\\n\\nIt costs a lot of data and compute. You do not need it for a 10-column table. Tokens, prompts, and hallucinations are in the AI deck.\",\"topic\":\"Transformer\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bert-vs-gpt\",\"part\":\"m\",\"front\":\"How do a BERT-style model and a GPT-style model differ?\",\"back\":\"A BERT-style model is an encoder that reads the whole text in both directions to understand it; a GPT-style model is a decoder that predicts the next token to generate.\\n\\n• Encoder (BERT and family): good for classifying, searching, or extracting entities. It is not built to keep writing.\\n• Decoder (GPT and family): only looks backward (causal mask). Good for generating text.\\n• Both are Transformers; what changes is what they look at and what they were trained for.\\n\\nHint: \\\"finish the sentence\\\" or \\\"chat\\\" → decoder. \\\"What is this document about?\\\" → encoder, or a decoder you ask to do that task.\",\"topic\":\"Encoder vs decoder\",\"origin\":\"ai\",\"group\":\"Deep learning\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"}]},{\"id\":\"s6-tarjetas-llm\",\"kind\":\"cards\",\"minutes\":8,\"title\":{\"es\":\"Tarjetas: embeddings y RAG\",\"en\":\"Cards: embeddings and RAG\"},\"deck\":\"fundamentals-inteligencia-artificial\",\"module\":\"m4-representaciones\",\"cardsEs\":[{\"id\":\"ai-embedding\",\"part\":\"m\",\"front\":\"¿Qué es un embedding, con una analogía?\",\"back\":\"Un embedding es un vector (lista de números) que representa el significado de un texto, una imagen o un usuario. Textos parecidos quedan CERCA en ese espacio.\\n\\nAnalogía: un mapa donde \\\"rey\\\" queda cerca de \\\"reina\\\" y lejos de \\\"bicicleta\\\". No lees los números; mides distancias.\\n\\nSirve para buscar, recomendar y agrupar. Es la base de la búsqueda semántica que usan muchos sistemas RAG, y de muchas features de ML.\",\"topic\":\"Embeddings\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"difficulty\":\"basic\"},{\"id\":\"ai-rag\",\"part\":\"m\",\"front\":\"¿Qué es RAG (retrieval-augmented generation)?\",\"back\":\"RAG consiste en que, antes de que el LLM responda, BUSCAS trozos relevantes en TUS documentos (manuales, tickets, wiki) y se los pegas al prompt.\\n\\n• El modelo no \\\"aprendió\\\" tu empresa de memoria: lee el extracto en el momento.\\n• Reduce alucinaciones sobre datos privados y se actualiza al cambiar los docs, sin reentrenar.\\n\\nNo es magia: si la búsqueda trae el trozo equivocado, la respuesta sale mal. Basura en, basura elocuente fuera.\",\"topic\":\"RAG\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-prompt-vs-finetune\",\"part\":\"m\",\"front\":\"¿Cuándo basta un prompt y cuándo haría falta fine-tuning?\",\"back\":\"Empieza por prompt, ejemplos y RAG; recurre al fine-tuning cuando una tarea o estilo muy repetido no se consigue así.\\n\\n• Prompt / few-shot / RAG: primero. Barato, reversible, suficiente para tono, formato y hechos de tus docs.\\n• Fine-tuning: sigue entrenando el modelo con TUS ejemplos. Úsalo cuando el estilo o la tarea se repite miles de veces y el prompt no alcanza.\\n\\nFine-tuning no es la forma de \\\"enseñarle datos frescos\\\" (para eso es RAG). Es caro y puede hacer olvidar otras habilidades.\",\"topic\":\"Prompting vs fine-tuning\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-rag-escenario\",\"part\":\"m\",\"front\":\"Un banco quiere un asistente que responda sobre 3 000 políticas internas que cambian cada semana, citando la política exacta. ¿RAG, fine-tuning o meter todo en el prompt?\",\"back\":\"RAG: en cada pregunta recupera los fragmentos vigentes de las políticas y pide al modelo responder solo con ellos y citarlos.\\n\\n• Actualizar = reindexar documentos, sin reentrenar.\\n• La cita sale del fragmento recuperado, así que se puede verificar.\\n• Fine-tuning semanal sería caro y no garantiza recordar el texto exacto ni dar la fuente.\\n• Meter las 3 000 políticas en cada prompt es caro y puede no caber en el contexto.\\n\\nIdea clave: conocimiento que cambia → recupéralo; estilo o tarea repetida → considera fine-tuning.\",\"topic\":\"RAG vs fine-tuning\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-rag-diagnostico\",\"part\":\"m\",\"front\":\"Tu RAG responde mal 3 de cada 10 preguntas. Al revisar, en esos casos los fragmentos recuperados no contienen la respuesta, aunque el documento correcto sí está indexado. ¿Dónde atacas?\",\"back\":\"En la recuperación, no en el generador: si el fragmento correcto no llega al prompt, ningún LLM puede responder bien.\\n\\n• Mide la recuperación por separado: ¿el fragmento correcto está entre los k primeros?\\n• Palancas: cómo partes los documentos (chunks), búsqueda híbrida (palabras clave + embeddings), reordenar resultados (re-ranking) o subir k.\\n• Cambiar a un LLM más grande no arregla un contexto equivocado.\\n• Bajar la temperatura tampoco.\\n\\nIdea clave: evalúa por separado recuperación y generación.\",\"topic\":\"Diagnosticar un RAG\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"difficulty\":\"advanced\"}],\"cardsEn\":[{\"id\":\"ai-embedding\",\"part\":\"m\",\"front\":\"What is an embedding, with an analogy?\",\"back\":\"An embedding is a vector (list of numbers) that represents the meaning of a text, image, or user. Similar items sit CLOSE in that space.\\n\\nAnalogy: a map where \\\"king\\\" sits near \\\"queen\\\" and far from \\\"bicycle\\\". You do not read the numbers; you measure distances.\\n\\nUsed for search, recommendations, and clustering. It is the backbone of the semantic search many RAG systems use, and of many ML features.\",\"topic\":\"Embeddings\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"basic\"},{\"id\":\"ai-rag\",\"part\":\"m\",\"front\":\"What is RAG (retrieval-augmented generation)?\",\"back\":\"RAG means that, before the LLM answers, you SEARCH for relevant chunks in YOUR documents (manuals, tickets, wiki) and paste them into the prompt.\\n\\n• The model did not \\\"memorize\\\" your company: it reads the excerpt at request time.\\n• It cuts hallucinations about private data and updates when docs change, with no retraining.\\n\\nNot magic: if search fetches the wrong chunk, the answer is wrong. Garbage in, eloquent garbage out.\",\"topic\":\"RAG\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-prompt-vs-finetune\",\"part\":\"m\",\"front\":\"When is a prompt enough, and when would you fine-tune?\",\"back\":\"Start with prompting, examples, and RAG; use fine-tuning when a highly repeated task or style cannot be reached that way.\\n\\n• Prompt / few-shot / RAG: first. Cheap, reversible, enough for tone, format, and facts from your docs.\\n• Fine-tuning: keep training the model on YOUR examples. Use it when the style or task repeats thousands of times and prompting is not enough.\\n\\nFine-tuning is not how you \\\"teach fresh facts\\\" (that is RAG). It is expensive and can make the model forget other skills.\",\"topic\":\"Prompting vs fine-tuning\",\"origin\":\"ai\",\"group\":\"Usar un LLM\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-rag-escenario\",\"part\":\"m\",\"front\":\"A bank wants an assistant that answers questions about 3,000 internal policies that change every week, citing the exact policy. RAG, fine-tuning, or putting everything in the prompt?\",\"back\":\"RAG: on every question, retrieve the current policy chunks and ask the model to answer only from them and cite them.\\n\\n• Updating = re-indexing documents, no retraining.\\n• The citation comes from the retrieved chunk, so it can be checked.\\n• Weekly fine-tuning would be expensive and does not guarantee recalling the exact text or giving the source.\\n• Putting all 3,000 policies in every prompt is expensive and may not fit in the context.\\n\\nKey idea: changing knowledge → retrieve it; repeated style or task → consider fine-tuning.\",\"topic\":\"RAG vs fine-tuning\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"intermediate\"},{\"id\":\"ai-rag-diagnostico\",\"part\":\"m\",\"front\":\"Your RAG answers 3 out of 10 questions wrong. On inspection, in those cases the retrieved chunks do not contain the answer, although the right document is indexed. Where do you act?\",\"back\":\"On retrieval, not on the generator: if the right chunk never reaches the prompt, no LLM can answer well.\\n\\n• Measure retrieval separately: is the right chunk among the top k?\\n• Levers: how you split documents (chunking), hybrid search (keywords + embeddings), re-ranking results, or raising k.\\n• Switching to a bigger LLM does not fix the wrong context.\\n• Neither does lowering the temperature.\\n\\nKey idea: evaluate retrieval and generation separately.\",\"topic\":\"Diagnosticar un RAG\",\"origin\":\"ai\",\"group\":\"Representaciones\",\"lang\":\"en\",\"esDeck\":\"fundamentals-inteligencia-artificial\",\"difficulty\":\"advanced\"}]},{\"id\":\"s6-practica\",\"kind\":\"practice\",\"minutes\":15,\"title\":{\"es\":\"Práctica: sin activación no hay curva\",\"en\":\"Practice: no activation, no curve\"},\"scaffolding\":\"high\",\"language\":\"python\",\"instructions\":{\"es\":\"Objetivo: ver por qué una red neuronal necesita funciones de activación, y que con datos de tabla no siempre gana a un boosting.\\n\\nQué haces:\\n1. Copia y ejecuta el ejemplo resuelto. Usa dos círculos, uno dentro del otro, que ninguna línea recta puede separar. Compara una regresión logística, una red SIN activación (`activation=\\\"identity\\\"`) y una red con ReLU. Solo la de ReLU supera el azar (≈0.5).\\n2. Completa la plantilla con una tabla real (cáncer de mama). Hay un TODO: crear y entrenar una red pequeña, con el escalado dentro de un pipeline, para compararla con HistGradientBoosting.\\n3. Compara las dos exactitudes de test.\\n\\nQué escribes en el cuadro: tu código, las dos exactitudes y qué modelo elegirías y por qué.\",\"en\":\"Goal: see why a neural network needs activation functions, and that on tabular data it does not always beat boosting.\\n\\nWhat you do:\\n1. Copy and run the worked example. It uses two circles, one inside the other, that no straight line can separate. It compares a logistic regression, a network WITHOUT activation (`activation=\\\"identity\\\"`) and a network with ReLU. Only the ReLU one beats chance (≈0.5).\\n2. Complete the template on a real table (breast cancer). There is one TODO: build and train a small network, with scaling inside a pipeline, to compare it with HistGradientBoosting.\\n3. Compare the two test accuracies.\\n\\nWhat you write in the box: your code, both accuracies and which model you would pick and why.\"},\"workedExample\":\"from sklearn.datasets import make_circles\\nfrom sklearn.model_selection import train_test_split\\nfrom sklearn.linear_model import LogisticRegression\\nfrom sklearn.neural_network import MLPClassifier\\n\\nX, y = make_circles(n_samples=1000, noise=0.1, factor=0.5, random_state=0)\\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.3, stratify=y, random_state=0)\\n\\nfor name, m in {\\n    \\\"logistic\\\": LogisticRegression(),\\n    \\\"mlp_identity\\\": MLPClassifier(hidden_layer_sizes=(32, 32), activation=\\\"identity\\\", max_iter=2000, random_state=0),\\n    \\\"mlp_relu\\\": MLPClassifier(hidden_layer_sizes=(32, 32), activation=\\\"relu\\\", max_iter=2000, random_state=0),\\n}.items():\\n    m.fit(X_tr, y_tr)\\n    print(f\\\"{name:13s} test accuracy = {m.score(X_te, y_te):.3f}\\\")\\n# logistic 0.493 · mlp_identity 0.483 · mlp_relu 0.993\",\"starter\":\"from sklearn.datasets import load_breast_cancer\\nfrom sklearn.ensemble import HistGradientBoostingClassifier\\nfrom sklearn.model_selection import train_test_split\\nfrom sklearn.neural_network import MLPClassifier\\nfrom sklearn.pipeline import make_pipeline\\nfrom sklearn.preprocessing import StandardScaler\\n\\nX, y = load_breast_cancer(return_X_y=True)\\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\\n\\nhgb = HistGradientBoostingClassifier(random_state=0).fit(X_tr, y_tr)\\nmlp = ...  # TODO: make_pipeline(StandardScaler(), MLPClassifier(hidden_layer_sizes=(32,), max_iter=2000, random_state=0)) fitted on train\\n\\nprint(f\\\"boosting test accuracy = {hgb.score(X_te, y_te):.3f}\\\")\\nprint(f\\\"mlp      test accuracy = {mlp.score(X_te, y_te):.3f}\\\")\",\"solution\":\"from sklearn.datasets import load_breast_cancer\\nfrom sklearn.ensemble import HistGradientBoostingClassifier\\nfrom sklearn.model_selection import train_test_split\\nfrom sklearn.neural_network import MLPClassifier\\nfrom sklearn.pipeline import make_pipeline\\nfrom sklearn.preprocessing import StandardScaler\\n\\nX, y = load_breast_cancer(return_X_y=True)\\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\\n\\nhgb = HistGradientBoostingClassifier(random_state=0).fit(X_tr, y_tr)\\nmlp = make_pipeline(StandardScaler(),\\n                    MLPClassifier(hidden_layer_sizes=(32,), max_iter=2000, random_state=0)).fit(X_tr, y_tr)\\n\\nprint(f\\\"boosting test accuracy = {hgb.score(X_te, y_te):.3f}\\\")\\nprint(f\\\"mlp      test accuracy = {mlp.score(X_te, y_te):.3f}\\\")\\n# boosting 0.965 · mlp 0.965\",\"criteria\":[{\"es\":\"En el ejemplo resuelto, la logística y la red con activation=\\\"identity\\\" rondan 0.5 (azar) y la red con ReLU supera 0.95.\",\"en\":\"In the worked example, logistic regression and the activation=\\\"identity\\\" network sit near 0.5 (chance) and the ReLU network exceeds 0.95.\"},{\"es\":\"En el ejercicio se imprimen dos exactitudes de test (boosting y red); con estas semillas empatan en ≈0.965.\",\"en\":\"The exercise prints two test accuracies (boosting and network); with these seeds they tie at ≈0.965.\"},{\"es\":\"Anotas por qué, ante un empate en una tabla, empezarías por el boosting (no necesita escalar y suele requerir menos ajuste).\",\"en\":\"You note why, given a tie on a table, you would start with boosting (no scaling needed and it usually needs less tuning).\"}]},{\"id\":\"s6-escenarios\",\"kind\":\"scenarios\",\"minutes\":8,\"title\":{\"es\":\"Escenarios: la herra
