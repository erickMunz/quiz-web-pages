mienta justa\",\"en\":\"Scenarios: the right tool\"},\"items\":[{\"id\":\"s6-q1\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"basic\",\"tags\":[\"redes-neuronales\",\"vision\"],\"prompt\":{\"es\":\"Una red debe clasificar fotos de productos en exactamente una de 12 categorías (cada foto pertenece a una sola). Estás definiendo la última capa y la pérdida. ¿Qué eliges?\",\"en\":\"A network must classify product photos into exactly one of 12 categories (each photo belongs to only one). You are defining the last layer and the loss. What do you choose?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"12 neuronas con softmax y entropía cruzada categórica\",\"en\":\"12 neurons with softmax and categorical cross-entropy\"},\"correct\":true,\"why\":{\"es\":\"Gana porque softmax da 12 probabilidades que suman 1 y compiten entre sí, y la entropía cruzada penaliza dar poca probabilidad a la clase correcta.\",\"en\":\"It wins because softmax gives 12 probabilities that sum to 1 and compete, and cross-entropy penalizes low probability on the correct class.\"}},{\"id\":\"B\",\"text\":{\"es\":\"1 neurona con sigmoide y entropía cruzada binaria\",\"en\":\"1 neuron with sigmoid and binary cross-entropy\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que una salida basta. Una sigmoide sirve para sí/no, no para elegir entre 12.\",\"en\":\"The wrong assumption: that one output is enough. A sigmoid handles yes/no, not a choice among 12.\"}},{\"id\":\"C\",\"text\":{\"es\":\"12 neuronas con una sigmoide cada una\",\"en\":\"12 neurons with a sigmoid each\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir con multi-etiqueta. Esa salida no obliga a elegir una sola categoría.\",\"en\":\"The wrong assumption: confusing it with multi-label. That output does not force a single category.\"}},{\"id\":\"D\",\"text\":{\"es\":\"1 neurona lineal con MSE que prediga el número de categoría (1–12)\",\"en\":\"1 linear neuron with MSE predicting the category number (1–12)\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: tratar categorías como números. Impone un orden y una distancia que no existen.\",\"en\":\"The wrong assumption: treating categories as numbers. It imposes an order and a distance that do not exist.\"}}],\"takeaway\":{\"es\":\"Una clase de N → softmax + entropía cruzada; varias a la vez → una sigmoide por etiqueta.\",\"en\":\"One class of N → softmax + cross-entropy; several at once → one sigmoid per label.\"}},{\"id\":\"s6-q2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"llm\",\"rag\"],\"prompt\":{\"es\":\"Un banco quiere un asistente que responda sobre 3.000 políticas internas que cambian cada semana, citando la política exacta. El presupuesto es limitado y no puede reentrenar modelos cada semana. ¿Qué arquitectura eliges?\",\"en\":\"A bank wants an assistant that answers questions about 3,000 internal policies that change every week, citing the exact policy. The budget is limited and it cannot retrain models every week. Which architecture do you choose?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Fine-tuning semanal de un LLM con las políticas\",\"en\":\"Weekly fine-tuning of an LLM on the policies\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el fine-tuning es la forma de «enseñar» datos. Es caro de repetir cada semana y no garantiza recordar el texto exacto ni dar la fuente.\",\"en\":\"The wrong assumption: that fine-tuning is how you “teach” data. It is expensive to repeat weekly and does not guarantee recalling the exact text or giving the source.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Pegar las 3.000 políticas en cada prompt\",\"en\":\"Paste all 3,000 policies into every prompt\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el contexto es gratis e infinito. Es muy caro por llamada y puede no caber en la ventana de contexto.\",\"en\":\"The wrong assumption: that context is free and infinite. It is very expensive per call and may not fit in the context window.\"}},{\"id\":\"C\",\"text\":{\"es\":\"RAG: indexar las políticas, recuperar los fragmentos relevantes en cada pregunta y pedir al LLM que responda con ellos y los cite\",\"en\":\"RAG: index the policies, retrieve the relevant chunks for each question and ask the LLM to answer from them and cite them\"},\"correct\":true,\"why\":{\"es\":\"Gana porque actualizar es reindexar, sin reentrenar, y la cita sale del fragmento recuperado, que se puede verificar.\",\"en\":\"It wins because updating means re-indexing, with no retraining, and the citation comes from the retrieved chunk, which can be checked.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Un LLM sin contexto con temperatura 0 para que no invente\",\"en\":\"An LLM with no context at temperature 0 so it does not make things up\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que la temperatura aporta conocimiento. Una temperatura baja reduce la variedad, no le da al modelo políticas que nunca vio.\",\"en\":\"The wrong assumption: that temperature adds knowledge. Low temperature reduces variety; it does not give the model policies it never saw.\"}}],\"takeaway\":{\"es\":\"Conocimiento propio y cambiante → recupéralo con RAG; fine-tuning es para estilo o tarea repetida.\",\"en\":\"Your own, changing knowledge → retrieve it with RAG; fine-tuning is for style or a repeated task.\"}}],\"questions\":[{\"key\":\"s6-q1\",\"prompt\":\"$6:props:flow:stages:5:steps:4:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:5:steps:4:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:5:steps:4:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:5:steps:4:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:5:steps:4:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:5:steps:4:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:5:steps:4:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:5:steps:4:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:5:steps:4:items:0:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:5:steps:4:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s6-q2\",\"prompt\":\"$6:props:flow:stages:5:steps:4:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:5:steps:4:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:5:steps:4:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:5:steps:4:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:5:steps:4:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:5:steps:4:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:5:steps:4:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:5:steps:4:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:5:steps:4:items:1:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:5:steps:4:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"}]},{\"id\":\"s6-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: la red que solo sabía trazar rectas\",\"en\":\"Lab: the network that could only draw straight lines\"},\"language\":\"python\",\"symptom\":{\"es\":\"Una red con 3 capas ocultas de 64 neuronas da 0.49 de exactitud en test sobre dos círculos concéntricos, igual que una regresión logística. Añadir capas o neuronas no cambia nada, y la loss se estanca en ≈0.69 desde las primeras épocas.\",\"en\":\"A network with 3 hidden layers of 64 neurons scores 0.49 test accuracy on two concentric circles, the same as a logistic regression. Adding layers or neurons changes nothing, and the loss is stuck at ≈0.69 from the first epochs.\"},\"artifact\":\"model = keras.Sequential([\\n    keras.Input(shape=(2,)),\\n    keras.layers.Dense(64),\\n    keras.layers.Dense(64),\\n    keras.layers.Dense(64),\\n    keras.layers.Dense(1, activation=\\\"sigmoid\\\"),\\n])\\nmodel.compile(optimizer=\\\"adam\\\", loss=\\\"binary_crossentropy\\\", metrics=[\\\"accuracy\\\"])\\nmodel.fit(X_tr, y_tr, validation_split=0.2, epochs=100)\",\"question\":{\"es\":\"¿Cuál es la causa raíz?\",\"en\":\"What is the root cause?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Faltan capas: con 6 capas ocultas aprendería la curva\",\"en\":\"Not enough layers: with 6 hidden layers it would learn the curve\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que la profundidad crea no linealidad. Sin activaciones, 6 capas siguen equivaliendo a una sola transformación lineal.\",\"en\":\"The wrong assumption: that depth creates non-linearity. Without activations, 6 layers are still one linear transformation.\"}},{\"id\":\"B\",\"text\":{\"es\":\"La learning rate de Adam es demasiado alta\",\"en\":\"Adam's learning rate is too high\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir síntomas. Una learning rate alta haría oscilar o explotar la loss; aquí se estanca en el valor de un modelo que no separa las clases.\",\"en\":\"The wrong assumption: mixing up symptoms. A high learning rate would make the loss oscillate or explode; here it stalls at the value of a model that cannot separate the classes.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Faltan épocas: con 1.000 épocas convergería\",\"en\":\"Not enough epochs: with 1,000 epochs it would converge\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que falta entrenamiento. Ya convergió a la mejor frontera lineal posible; más épocas no la curvan.\",\"en\":\"The wrong assumption: that it needs more training. It already converged to the best possible linear boundary; more epochs do not bend it.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Las capas ocultas no tienen activación: la composición de capas lineales es lineal, así que la red solo puede trazar una frontera recta\",\"en\":\"The hidden layers have no activation: a composition of linear layers is linear, so the network can only draw a straight boundary\"},\"correct\":true,\"why\":{\"es\":\"Gana porque Dense sin activation es lineal y W3(W2(W1·x)) es otra transformación lineal: sin no linealidad no hay forma de separar los círculos.\",\"en\":\"It wins because Dense without activation is linear and W3(W2(W1·x)) is another linear transformation: without non-linearity the circles cannot be separated.\"}}],\"rootCause\":{\"es\":\"Las capas Dense ocultas se crearon sin activation (por defecto, lineal). Apilar transformaciones lineales da otra transformación lineal: toda la red equivale a una regresión logística, que no puede separar dos círculos concéntricos (de ahí la loss ≈0.69, la de adivinar al 50%).\",\"en\":\"The hidden Dense layers were created without activation (linear by default). Stacking linear transformations gives another linear transformation: the whole network equals a logistic regression, which cannot separate two concentric circles (hence the loss ≈0.69, that of a 50% guess).\"},\"fix\":\"    keras.layers.Dense(64, activation=\\\"relu\\\"),\\n    keras.layers.Dense(64, activation=\\\"relu\\\"),\\n    keras.layers.Dense(64, activation=\\\"relu\\\"),\",\"fixNote\":{\"es\":\"En scikit-learn pasa lo mismo con MLPClassifier(activation=\\\"identity\\\"): es el experimento del ejemplo resuelto de esta etapa.\",\"en\":\"In scikit-learn the same happens with MLPClassifier(activation=\\\"identity\\\"): it is this stage's worked-example experiment.\"},\"questions\":[{\"key\":\"s6-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:5:steps:5:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:5:steps:5:options:0:text\",\"why\":\"$6:props:flow:stages:5:steps:5:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:5:steps:5:options:1:text\",\"why\":\"$6:props:flow:stages:5:steps:5:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:5:steps:5:options:2:text\",\"why\":\"$6:props:flow:stages:5:steps:5:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:5:steps:5:options:3:text\",\"why\":\"$6:props:flow:stages:5:steps:5:options:3:why\"}],\"correct\":\"D\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s6-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":12,\"title\":{\"es\":\"Checkpoint: redes y LLM\",\"en\":\"Checkpoint: networks and LLMs\"},\"items\":[{\"id\":\"s6-ck1\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"basic\",\"tags\":[\"redes-neuronales\",\"datos-tabulares\"],\"prompt\":{\"es\":\"Tienes 5.000 clientes con 25 columnas numéricas y categóricas para predecir abandono. Un compañero quiere empezar con una red profunda «porque es lo más moderno». Tienes una semana. ¿Por dónde empiezas?\",\"en\":\"You have 5,000 customers with 25 numeric and categorical columns to predict churn. A colleague wants to start with a deep network “because it is the most modern”. You have one week. Where do you start?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Por la red profunda, y si va mal, más capas\",\"en\":\"With the deep network, and if it goes badly, more layers\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: moderno = mejor. En tablas de este tamaño una red rara vez supera a un boosting y exige más ajuste.\",\"en\":\"The wrong assumption: modern = better. On tables this size a network rarely beats boosting and needs more tuning.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Por un LLM al que le pasas cada fila como texto\",\"en\":\"With an LLM that receives each row as text\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que un LLM sirve para todo. Es caro y lento, y no hay razón para esperar que prediga mejor que un modelo entrenado con la etiqueta.\",\"en\":\"The wrong assumption: that an LLM fits everything. It is expensive and slow, and there is no reason to expect it to beat a model trained on the label.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Por k-means con 2 clusters\",\"en\":\"With k-means with 2 clusters\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: ignorar la etiqueta. Hay historial de abandono: es un problema supervisado.\",\"en\":\"The wrong assumption: ignoring the label. There is churn history: it is a supervised problem.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Por una baseline y una regresión logística, luego un gradient boosting; la red, solo si lo supera en validación\",\"en\":\"With a baseline and a logistic regression, then gradient boosting; the network only if it beats it on validation\"},\"correct\":true,\"why\":{\"es\":\"Gana porque en tablas medianas los árboles con boosting suelen ser lo más fuerte con menos ajuste; la red debe ganarse su lugar en validación.\",\"en\":\"It wins because on medium tables boosted trees are usually the strongest with less tuning; the network must earn its place on validation.\"}}],\"takeaway\":{\"es\":\"Tabla mediana: boosting primero; la red tiene que demostrar que gana.\",\"en\":\"Medium table: boosting first; the network has to prove it wins.\"}},{\"id\":\"s6-ck2\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"llm\",\"extraccion\"],\"prompt\":{\"es\":\"Extraes con un LLM los campos de 10.000 facturas a JSON. A veces cambia el nombre de las claves o añade texto antes del JSON, y tu código falla. ¿Qué cambio es el más efectivo?\",\"en\":\"You use an LLM to extract the fields of 10,000 invoices into JSON. Sometimes it renames keys or adds text before the JSON, and your code breaks. Which change is most effective?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Subir la temperatura para que el modelo «piense» más\",\"en\":\"Raise the temperature so the model “thinks” more\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que la temperatura es esfuerzo. Más temperatura aumenta la variación de la salida y empeora el formato.\",\"en\":\"The wrong assumption: that temperature means effort. Higher temperature increases output variation and worsens the format.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Temperatura baja, un esquema JSON explícito (salida estructurada si la API la ofrece) y validar cada respuesta con código\",\"en\":\"Low temperature, an explicit JSON schema (structured output if the API offers it) and validating every response with code\"},\"correct\":true,\"why\":{\"es\":\"Gana porque fija el formato y detecta lo que falle para reintentarlo o revisarlo.\",\"en\":\"It wins because it pins the format and catches failures to retry or review them.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Pedirle «por favor, sé muy exacto» en mayúsculas\",\"en\":\"Ask it “please be very exact” in capital letters\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que insistir es controlar. Ayuda poco y no garantiza nada; sin validación los errores siguen pasando.\",\"en\":\"The wrong assumption: that insisting is controlling. It helps little and guarantees nothing; without validation errors still get through.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Cambiar a un LLM más grande y no validar\",\"en\":\"Switch to a bigger LLM and skip validation\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que un modelo mejor no falla. Reduce los errores, pero sin validación los que queden romperán el sistema.\",\"en\":\"The wrong assumption: that a better model never fails. It reduces errors, but without validation the remaining ones will break the system.\"}}],\"takeaway\":{\"es\":\"Formato fiable = esquema + validación, no buena voluntad del modelo.\",\"en\":\"Reliable format = schema + validation, not the model's good will.\"}},{\"id\":\"s6-ck3\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"redes-neuronales\",\"multietiqueta\"],\"prompt\":{\"es\":\"Una red etiqueta fotos de viajes con «playa», «montaña», «perro» y «atardecer», y una foto puede tener varias a la vez. Con softmax, las fotos con playa y perro solo reciben una etiqueta alta. ¿Qué cambias?\",\"en\":\"A network tags travel photos with “beach”, “mountain”, “dog” and “sunset”, and one photo can have several at once. With softmax, photos with a beach and a dog get only one high label. What do you change?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Una sigmoide por etiqueta con entropía cruzada binaria, y un umbral por etiqueta\",\"en\":\"One sigmoid per label with binary cross-entropy, and one threshold per label\"},\"correct\":true,\"why\":{\"es\":\"Gana porque cada sigmoide da una probabilidad independiente; no tienen que sumar 1, así que varias etiquetas pueden ser verdad a la vez.\",\"en\":\"It wins because each sigmoid gives an independent probability; they need not sum to 1, so several labels can be true at once.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Subir la temperatura del softmax\",\"en\":\"Raise the softmax temperature\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que suavizar basta. Las probabilidades siguen sumando 1 y compitiendo entre sí.\",\"en\":\"The wrong assumption: that smoothing is enough. The probabilities still sum to 1 and compete.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Entrenar más épocas\",\"en\":\"Train more epochs\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que es falta de entrenamiento. El problema es la capa de salida, no cuánto se entrena.\",\"en\":\"The wrong assumption: that it lacks training. The problem is the output layer, not how long it trains.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Quedarse siempre con las 2 clases más probables del softmax\",\"en\":\"Always keep the softmax's 2 most likely classes\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que todas las fotos tienen dos etiquetas. Fuerza 2 aunque la foto tenga 1 o 3.\",\"en\":\"The wrong assumption: that every photo has two labels. It forces 2 even when a photo has 1 or 3.\"}}],\"takeaway\":{\"es\":\"Varias etiquetas a la vez → sigmoides independientes.\",\"en\":\"Several labels at once → independent sigmoids.\"}},{\"id\":\"s6-ck4\",\"type\":\"bug_diagnosis\",\"difficulty\":\"advanced\",\"tags\":[\"rag\",\"evaluacion\"],\"prompt\":{\"es\":\"Tu RAG responde mal 3 de cada 10 preguntas. Al revisar esos casos, los fragmentos recuperados no contienen la respuesta, aunque el documento correcto sí está indexado. Solo cabe un cambio este sprint. ¿Cuál?\",\"en\":\"Your RAG answers 3 out of 10 questions wrong. Reviewing those cases, the retrieved chunks do not contain the answer, although the right document is indexed. Only one change fits this sprint. Which one?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Cambiar a un LLM más grande\",\"en\":\"Switch to a bigger LLM\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el generador es el cuello de botella. Si el fragmento correcto no llega al prompt, ningún modelo puede responder bien con él.\",\"en\":\"The wrong assumption: that the generator is the bottleneck. If the right chunk never reaches the prompt, no model can answer well from it.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Bajar la temperatura a 0\",\"en\":\"Lower the temperature to 0\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que es un problema de muestreo. No cambia qué fragmentos se recuperan.\",\"en\":\"The wrong assumption: that it is a sampling problem. It does not change which chunks are retrieved.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Atacar la recuperación: medir si el fragmento correcto está entre los k primeros y mejorar el troceado, la búsqueda (híbrida o con re-ranking) o k\",\"en\":\"Work on retrieval: measure whether the right chunk is in the top k and improve chunking, search (hybrid or with re-ranking) or k\"},\"correct\":true,\"why\":{\"es\":\"Gana porque el fallo está antes del generador, y medir la recuperación por separado dice qué arreglar.\",\"en\":\"It wins because the failure happens before the generator, and measuring retrieval separately tells you what to fix.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Hacer fine-tuning del LLM con las preguntas que fallan\",\"en\":\"Fine-tune the LLM on the failing questions\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que memorizar respuestas arregla la búsqueda. No cambia lo que se recupera y queda viejo cuando cambien los documentos.\",\"en\":\"The wrong assumption: that memorizing answers fixes search. It does not change what is retrieved and goes stale when the documents change.\"}}],\"takeaway\":{\"es\":\"En RAG, evalúa por separado recuperación y generación.\",\"en\":\"In RAG, evaluate retrieval and generation separately.\"}}],\"refs\":[{\"quiz\":{\"es\":\"ml-fundamentals-es\",\"en\":\"ml-fundamentals\"},\"ids\":[\"41\",\"46\",\"47\"]}],\"questions\":[{\"key\":\"s6-ck1\",\"prompt\":\"$6:props:flow:stages:5:steps:6:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:5:steps:6:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:5:steps:6:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:5:steps:6:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:5:steps:6:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:0:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:5:steps:6:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s6-ck2\",\"prompt\":\"$6:props:flow:stages:5:steps:6:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:5:steps:6:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:5:steps:6:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:5:steps:6:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:5:steps:6:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:1:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:5:steps:6:items:1:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"s6-ck3\",\"prompt\":\"$6:props:flow:stages:5:steps:6:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:5:steps:6:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:5:steps:6:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:5:steps:6:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:5:steps:6:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:2:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:5:steps:6:items:2:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s6-ck4\",\"prompt\":\"$6:props:flow:stages:5:steps:6:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:5:steps:6:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:5:steps:6:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:5:steps:6:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:5:steps:6:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:5:steps:6:items:3:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:5:steps:6:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"bug_diagnosis\"},{\"key\":\"ml-fundamentals-es::41\",\"prompt\":{\"es\":\"Se construye una red neuronal apilando varias capas densas, pero sin funciones de activación entre ellas. ¿Por qué no puede aprender patrones no lineales complejos, por muchas capas que tenga?\",\"en\":\"A neural network is built by stacking several dense layers but with no activation functions between them. Why can't it learn complex non-linear patterns, no matter how many layers it has?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Porque las capas densas no pueden tener más de 100 neuronas\",\"en\":\"Because dense layers cannot have more than 100 neurons\"}},{\"id\":\"B\",\"text\":{\"es\":\"Porque la red necesitaría un tamaño de batch mayor\",\"en\":\"Because the network would need a larger batch size\"}},{\"id\":\"C\",\"text\":{\"es\":\"Porque una composición de capas lineales sigue siendo una única función lineal\",\"en\":\"Because a composition of linear layers is still a single linear function\"}},{\"id\":\"D\",\"text\":{\"es\":\"Porque sin activaciones la red no se puede entrenar con descenso por gradiente\",\"en\":\"Because without activations the network cannot be trained with gradient descent\"}}],\"correct\":\"C\",\"explanation\":{\"es\":\"Cada capa densa calcula una transformación lineal, y apilar transformaciones lineales produce otra transformación lineal, así que toda la red se reduce al equivalente de una sola capa lineal. Las funciones de activación no lineales entre capas, como ReLU, sigmoide o tanh, son las que permiten a las redes profundas representar fronteras de decisión curvas y funciones complejas. ReLU, max(0, x), es la opción por defecto más común en las capas ocultas.\",\"en\":\"Each dense layer computes a linear transformation, and stacking linear transformations produces another linear transformation, so the whole network collapses into the equivalent of one linear layer. Non-linear activation functions such as ReLU, sigmoid or tanh between layers are what let deep networks represent curved decision boundaries and complex functions. ReLU, max(0, x), is the most common default in hidden layers.\"}},{\"key\":\"ml-fundamentals-es::46\",\"prompt\":{\"es\":\"Los modelos transformer sustituyeron a las redes neuronales recurrentes (RNN) como arquitectura estándar para el lenguaje. ¿Qué mecanismo permite a un transformer relacionar cada palabra directamente con todas las demás de la secuencia y procesar la secuencia en paralelo?\",\"en\":\"Transformer models replaced recurrent neural networks (RNNs) as the standard architecture for language. Which mechanism lets a transformer relate each word directly to every other word in the sequence, and process the sequence in parallel?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"La autoatención (self-attention)\",\"en\":\"Self-attention\"}},{\"id\":\"B\",\"text\":{\"es\":\"El max pooling\",\"en\":\"Max pooling\"}},{\"id\":\"C\",\"text\":{\"es\":\"El dropout\",\"en\":\"Dropout\"}},{\"id\":\"D\",\"text\":{\"es\":\"El bagging\",\"en\":\"Bagging\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"La autoatención calcula, para cada token, una combinación ponderada de todos los tokens de la secuencia, con pesos que reflejan cuán relevante es cada uno. Así, palabras lejanas pueden influirse directamente, sin pasar la información paso a paso como hace una RNN. Como no hay dependencia secuencial entre posiciones, toda la secuencia se puede procesar en paralelo. Se añaden codificaciones posicionales para que el modelo siga conociendo el orden de las palabras.\",\"en\":\"Self-attention computes, for each token, a weighted combination of all the tokens in the sequence, with weights that reflect how relevant each one is. Distant words can therefore influence each other directly, without passing information step by step as an RNN does. Because there is no sequential dependency between positions, the whole sequence can be processed in parallel. Positional encodings are added so the model still knows word order.\"}},{\"key\":\"ml-fundamentals-es::47\",\"prompt\":{\"es\":\"Una startup necesita un clasificador de imágenes para 5 tipos de defectos de fabricación, pero solo tiene 800 imágenes etiquetadas. Entrenar una CNN grande desde cero provoca un overfitting fuerte. ¿Cuál es el enfoque más eficaz?\",\"en\":\"A startup needs an image classifier for 5 types of manufacturing defects but has only 800 labeled images. Training a large CNN from scratch overfits badly. What is the most effective approach?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Entrenar desde cero una red todavía más grande durante más épocas\",\"en\":\"Train an even larger network from scratch for more epochs\"}},{\"id\":\"B\",\"text\":{\"es\":\"Transfer learning: partir de un modelo preentrenado con un gran dataset de imágenes y ajustarlo (fine-tuning) con las imágenes de defectos\",\"en\":\"Transfer learning: start from a model pre-trained on a large image dataset and fine-tune it on the defect images\"}},{\"id\":\"C\",\"text\":{\"es\":\"Convertir las imágenes en texto y usar Naive Bayes\",\"en\":\"Convert the images to text and use Naive Bayes\"}},{\"id\":\"D\",\"text\":{\"es\":\"Usar k-means para agrupar las 800 imágenes en 5 grupos y tratarlos como etiquetas\",\"en\":\"Use k-means to cluster the 800 images into 5 groups and treat them as labels\"}}],\"correct\":\"B\",\"explanation\":{\"es\":\"El transfer learning reutiliza un modelo preentrenado con un gran dataset como ImageNet, cuyas primeras capas ya detectan rasgos visuales generales como bordes, texturas y formas. Se sustituye la última capa por una con tus 5 clases y se entrena, a menudo primero con las capas preentrenadas congeladas y después ajustando algunas de ellas con una tasa de aprendizaje pequeña. Esto requiere muchos menos datos y cómputo que entrenar desde cero.\",\"en\":\"Transfer learning reuses a model pre-trained on a large dataset such as ImageNet, whose early layers already detect general visual features like edges, textures and shapes. You replace the final layer with one for your 5 classes and train it, often first with the pre-trained layers frozen and then fine-tuning some of them with a small learning rate. This needs far less data and compute than training from scratch.\"}}]},{\"id\":\"s6-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre: explícalo con tus palabras\",\"en\":\"Closing: explain it in your own words\"},\"prompt\":{\"es\":\"En 4–5 frases, explícale a alguien cuándo usarías una red neuronal, cuándo un boosting y cuándo un LLM con RAG.\",\"en\":\"In 4–5 sentences, explain to someone when you would use a neural network, when boosting, and when an LLM with RAG.\"},\"keyPoints\":[{\"es\":\"Sin activación no lineal, una red es solo un modelo lineal.\",\"en\":\"Without a non-linear activation, a network is just a linear model.\"},{\"es\":\"En tablas medianas, boosting primero; redes para imagen, audio y texto.\",\"en\":\"On medium tables, boosting first; networks for images, audio and text.\"},{\"es\":\"La salida define la capa final: softmax para una de N, sigmoides para varias etiquetas, lineal para números.\",\"en\":\"The output defines the last layer: softmax for one of N, sigmoids for several labels, linear for numbers.\"},{\"es\":\"Con pocos datos, transfer learning desde un modelo preentrenado.\",\"en\":\"With little data, transfer learning from a pre-trained model.\"},{\"es\":\"Para datos propios y cambiantes, RAG; fine-tuning para estilo o tarea repetida.\",\"en\":\"For your own, changing data, RAG; fine-tuning for style or a repeated task.\"}]}]}]}}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1, viewport-fit=cover\"}],[\"$\",\"meta\",\"1\",{\"name\":\"theme-color\",\"media\":\"(prefers-color-s
