: often log-loss / cross-entropy.\\n\\nThe business metric (money, precision) is not always the loss: loss is the engine of fitting; the metric is how you judge the result.\",\"topic\":\"Función de pérdida\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-gradiente\",\"part\":\"m\",\"front\":\"What is gradient descent, intuitively?\",\"back\":\"A method to lower the loss by taking small steps. The gradient points to the steepest uphill; you step the OPPOSITE way.\\n\\n• Learning rate: step size. Too large = you overshoot; too small = you take forever.\\n\\nAnalogy: you walk down a foggy hill, feeling only the slope under your feet. You do not need the whole map.\",\"topic\":\"Descenso por gradiente\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"},{\"id\":\"ml-concepto-batch-epoch\",\"part\":\"m\",\"front\":\"What is a batch and what is an epoch?\",\"back\":\"A batch is the group of examples used to compute one update step; an epoch is one full pass over the whole training set.\\n\\n• Batch: a chunk of examples used for one gradient step. Smaller = noisier and more steps; larger = stabler and more memory.\\n• Epoch: one full pass over ALL of train.\\n\\nTraining 10 epochs with batch size 32 means: walk the dataset 10 times, 32 rows at a time.\",\"topic\":\"Batch y epoch\",\"origin\":\"ai\",\"group\":\"Entrenamiento\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-conceptos\",\"difficulty\":\"basic\"}]},{\"id\":\"s2-practica\",\"kind\":\"practice\",\"minutes\":12,\"title\":{\"es\":\"Práctica: leer una matriz de confusión\",\"en\":\"Practice: reading a confusion matrix\"},\"scaffolding\":\"medium\",\"instructions\":{\"es\":\"Objetivo: leer una matriz de confusión y traducirla a dinero.\\n\\nSituación: un detector de fraude revisó 10.000 compras con tarjeta; 200 eran fraude de verdad. Las filas son la realidad y las columnas lo que dijo el detector:\\n\\n```\\n                 dijo «fraude» | dijo «normal»\\nera fraude:           120      |      80\\nera normal:            50      |   9.750\\n```\\n\\nQué haces:\\n1. Pon nombre a las cuatro casillas: TP (fraudes detectados), FN (fraudes que se escaparon), FP (falsas alarmas) y TN (compras normales bien clasificadas).\\n2. Calcula precision, recall y accuracy.\\n3. Decide si al negocio le conviene usar el detector. Cada alarma la revisa una persona y cuesta $40; cada fraude que se escapa cuesta $900 en promedio. Compara el costo CON detector contra el costo SIN detector.\\n4. Di cuál de las tres métricas engaña en este caso y por qué.\\n\\nCopia la plantilla al cuadro y complétala.\",\"en\":\"Goal: read a confusion matrix and translate it into money.\\n\\nSituation: a fraud detector checked 10,000 card purchases; 200 were real fraud. Rows are reality and columns are what the detector said:\\n\\n```\\n                said «fraud» | said «normal»\\nwas fraud:          120     |      80\\nwas normal:          50     |   9,750\\n```\\n\\nWhat you do:\\n1. Name the four boxes: TP (frauds caught), FN (frauds that slipped through), FP (false alarms) and TN (normal purchases classified correctly).\\n2. Compute precision, recall and accuracy.\\n3. Decide whether the detector pays off for the business. Each alarm is reviewed by a person and costs $40; each fraud that slips through costs $900 on average. Compare the cost WITH the detector against the cost WITHOUT it.\\n4. Say which of the three metrics is misleading here and why.\\n\\nCopy the template into the box and complete it.\"},\"hints\":[{\"es\":\"Lee cruzando fila y columna: «era fraude» + «dijo fraude» = TP = 120; «era fraude» + «dijo normal» = FN = 80; «era normal» + «dijo fraude» = FP = 50; el resto, TN = 9.750.\",\"en\":\"Read row × column: «was fraud» + «said fraud» = TP = 120; «was fraud» + «said normal» = FN = 80; «was normal» + «said fraud» = FP = 50; the rest, TN = 9,750.\"},{\"es\":\"Alarmas = todas las veces que dijo «fraude» = TP + FP = 170. Sin detector, los 200 fraudes se escapan.\",\"en\":\"Alarms = every time it said «fraud» = TP + FP = 170. Without a detector, all 200 frauds slip through.\"}],\"solution\":{\"es\":\"TP = 120   FN = 80   FP = 50   TN = 9.750\\n\\nprecision = 120 / (120 + 50)  = 0,706 → 71 %   (7 de cada 10 alarmas son fraude real)\\nrecall    = 120 / (120 + 80)  = 0,60  → 60 %   (atrapa 6 de cada 10 fraudes)\\naccuracy  = (120 + 9.750) / 10.000 = 98,7 %\\n\\nCosto SIN detector = 200 × $900 = $180.000\\nCosto CON detector = 170 × $40 + 80 × $900 = $6.800 + $72.000 = $78.800\\nAhorro: $101.200 por cada 10.000 compras → el detector conviene, pese a su modesto 60 % de recall.\\n\\nLa métrica que engaña es el accuracy (98,7 %): como solo el 2 % es fraude, un detector que\\ndijera «normal» a todo ya tendría 98 % sin atrapar un solo fraude.\",\"en\":\"TP = 120   FN = 80   FP = 50   TN = 9,750\\n\\nprecision = 120 / (120 + 50)  = 0.706 → 71%   (7 out of 10 alarms are real fraud)\\nrecall    = 120 / (120 + 80)  = 0.60  → 60%   (catches 6 out of 10 frauds)\\naccuracy  = (120 + 9,750) / 10,000 = 98.7%\\n\\nCost WITHOUT detector = 200 × $900 = $180,000\\nCost WITH detector = 170 × $40 + 80 × $900 = $6,800 + $72,000 = $78,800\\nSavings: $101,200 per 10,000 purchases → the detector pays off, despite its modest 60% recall.\\n\\nThe misleading metric is accuracy (98.7%): since only 2% is fraud, a detector that said\\n«normal» to everything would already score 98% without catching a single fraud.\"},\"language\":\"text\",\"criteria\":[{\"es\":\"Precision 71 % y recall 60 %, calculados con la fórmula y con TP, FP y FN bien identificados en la matriz.\",\"en\":\"Precision 71% and recall 60%, computed with the formula and with TP, FP and FN correctly identified in the matrix.\"},{\"es\":\"El análisis de negocio compara $78.800 (con detector) contra $180.000 (sin detector) y concluye que conviene.\",\"en\":\"The business analysis compares $78,800 (with the detector) against $180,000 (without it) and concludes it pays off.\"},{\"es\":\"Señalas el accuracy (98,7 %) como el número engañoso, porque decir «normal» a todo ya daría 98 %.\",\"en\":\"You flag accuracy (98.7%) as the misleading number, because saying «normal» to everything would already give 98%.\"}],\"starter\":{\"es\":\"TP = ___   FN = ___   FP = ___   TN = ___\\n\\nprecision = TP / (TP + FP) = ___\\nrecall    = TP / (TP + FN) = ___\\naccuracy  = (TP + TN) / total = ___\\n\\nCosto SIN detector = fraudes × $900 = ___\\nCosto CON detector = alarmas × $40 + fraudes escapados × $900 = ___\\n\\n¿Conviene? ______ porque ______\\nLa métrica que engaña es ______ porque ______\",\"en\":\"TP = ___   FN = ___   FP = ___   TN = ___\\n\\nprecision = TP / (TP + FP) = ___\\nrecall    = TP / (TP + FN) = ___\\naccuracy  = (TP + TN) / total = ___\\n\\nCost WITHOUT detector = frauds × $900 = ___\\nCost WITH detector = alarms × $40 + missed frauds × $900 = ___\\n\\nWorth it? ______ because ______\\nThe misleading metric is ______ because ______\"}},{\"id\":\"s2-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: la selección de columnas que miró el examen\",\"en\":\"Lab: the feature selection that peeked at the exam\"},\"symptom\":{\"es\":\"El notebook del modelo de riesgo reporta AUC 0.94 en test. El dataset tiene 1.500 clientes y 8.000 columnas (palabras de sus solicitudes). Con los clientes del mes siguiente, que se parecen a los de entrenamiento, el AUC cae a 0.71. Nadie tocó el modelo entre el notebook y el despliegue.\",\"en\":\"The risk model's notebook reports AUC 0.94 on test. The dataset has 1,500 customers and 8,000 columns (words from their applications). On next month's customers, who look like the training ones, AUC drops to 0.71. Nobody touched the model between the notebook and deployment.\"},\"artifact\":\"X = load_features()          # 1.500 filas, 8.000 columnas / 1,500 rows, 8,000 columns\\ny = load_labels()\\n\\nX_scaled = StandardScaler().fit_transform(X)                      # media y desviación de TODO X\\nX_sel = SelectKBest(f_classif, k=50).fit_transform(X_scaled, y)    # elige 50 columnas mirando y de TODAS las filas\\n\\nX_tr, X_te, y_tr, y_te = train_test_split(X_sel, y, test_size=0.2, stratify=y, random_state=0)\\nmodel = LogisticRegression(max_iter=1000).fit(X_tr, y_tr)\\nprint(f\\\"AUC test: {roc_auc_score(y_te, model.predict_proba(X_te)[:, 1]):.2f}\\\")   # -\u003e 0.94\",\"language\":\"python\",\"question\":{\"es\":\"¿Cuál es la causa raíz de la caída de 0.94 a 0.71 en producción?\",\"en\":\"What is the root cause of the drop from 0.94 to 0.71 in production?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El StandardScaler se ajustó con todo X antes del split, y esa fuga basta para explicar los 23 puntos de caída\",\"en\":\"The StandardScaler was fitted on all of X before the split, and that leak alone explains the 23-point drop\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que toda fuga pesa lo mismo. Es una fuga real, pero pequeña: la media y la desviación apenas cambian con o sin las filas de test, y no usan la etiqueta. No explica una caída tan grande.\",\"en\":\"The wrong assumption: that every leak weighs the same. It is a real leak, but a small one: mean and std barely change with or without the test rows, and they do not use the label. It does not explain such a big drop.\"}},{\"id\":\"B\",\"text\":{\"es\":\"La regresión logística es demasiado simple para 8.000 columnas: hace falta un modelo más potente\",\"en\":\"Logistic regression is too simple for 8,000 columns: a more powerful model is needed\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: culpar a la capacidad. Un modelo más complejo sobre las mismas columnas elegidas con trampa seguiría dando un test inflado.\",\"en\":\"The wrong assumption: blaming capacity. A more complex model on the same columns, chosen by cheating, would still give an inflated test score.\"}},{\"id\":\"C\",\"text\":{\"es\":\"SelectKBest eligió las 50 columnas mirando la etiqueta de TODAS las filas, incluidas las de test: se quedó con columnas que se correlacionan con el test por puro azar\",\"en\":\"SelectKBest picked the 50 columns by looking at the label of ALL rows, test rows included: it kept columns that correlate with the test set by pure chance\"},\"correct\":true,\"why\":{\"es\":\"Gana porque, con 8.000 columnas y 1.500 filas, muchas columnas se correlacionan con y por casualidad. Elegirlas con las filas de test hace que el examen ya haya influido en el modelo; con clientes nuevos esa correlación casual desaparece.\",\"en\":\"It wins because, with 8,000 columns and 1,500 rows, many columns correlate with y by chance. Choosing them with the test rows means the exam already shaped the model; on new customers that chance correlation vanishes.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Es drift natural del mes siguiente: no hay error de método, solo hay que reentrenar cada semana\",\"en\":\"It is natural drift in the following month: there is no method error, just retrain every week\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: culpar al mundo. Los clientes nuevos se parecen a los de entrenamiento; es el método el que infla la métrica, y reentrenar con el mismo procedimiento repetiría la ilusión.\",\"en\":\"The wrong assumption: blaming the world. New customers look like the training ones; it is the method that inflates the metric, and retraining with the same procedure would repeat the illusion.\"}}],\"rootCause\":{\"es\":\"Un paso SUPERVISADO del preprocesamiento (la selección de features, que usa y) se ajustó con todas las filas antes de separar. Con muchas más columnas que filas, elige columnas que solo por azar separan bien también las filas de test, así que el test deja de ser independiente y el AUC sale inflado. El escalado con todo X también es una fuga, pero de efecto pequeño.\",\"en\":\"A SUPERVISED preprocessing step (feature selection, which uses y) was fitted on all rows before splitting. With far more columns than rows, it picks columns that only by chance also separate the test rows well, so the test is no longer independent and AUC is inflated. Scaling on all of X is also a leak, but a small one.\"},\"fix\":\"X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.2, stratify=y, random_state=0)   # 1. separar PRIMERO / split FIRST\\n\\nmodel = make_pipeline(StandardScaler(), SelectKBest(f_classif, k=50), LogisticRegression(max_iter=1000))\\nmodel.fit(X_tr, y_tr)     # 2. todo el preprocesado se ajusta SOLO con train / all preprocessing fitted on train ONLY\\nprint(f\\\"AUC test: {roc_auc_score(y_te, model.predict_proba(X_te)[:, 1]):.2f}\\\")\\n# para elegir k / to choose k: cross_val_score(model, X_tr, y_tr, cv=5, scoring=\\\"roc_auc\\\")\",\"fixNote\":{\"es\":\"Regla general a cualquier escala: fit solo con train; transform para todo lo demás —incluye escalado, SMOTE, selección de features y codificación de categorías—. Los pasos que usan la etiqueta son los que más inflan la métrica; la guía «Common pitfalls» de scikit-learn lo muestra con este mismo SelectKBest.\",\"en\":\"The general rule at any scale: fit on train only; transform everything else — scaling, SMOTE, feature selection and category encoding included. Steps that use the label inflate the metric the most; scikit-learn's “Common pitfalls” guide shows it with this same SelectKBest.\"},\"questions\":[{\"key\":\"s2-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:1:steps:3:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:3:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:3:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:3:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:3:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:3:options:3:why\"}],\"correct\":\"C\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s2-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":12,\"title\":{\"es\":\"Checkpoint: métricas y trampas\",\"en\":\"Checkpoint: metrics and traps\"},\"passPct\":70,\"items\":[{\"id\":\"s2-ck1\",\"type\":\"metric_selection\",\"difficulty\":\"intermediate\",\"tags\":[\"evaluacion\",\"desbalance\"],\"prompt\":{\"es\":\"Un modelo de fraude sobre 50.000 transacciones con 0.4% de fraude reporta accuracy 99.7%. El equipo celebra y pide firmar el despliegue. ¿Qué le dices antes de firmar?\",\"en\":\"A fraud model over 50,000 transactions with 0.4% fraud reports 99.7% accuracy. The team celebrates and asks you to sign off the deployment. What do you say before signing?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"99.7% demuestra que el modelo está listo: ningún modelo anterior logró tanto\",\"en\":\"99.7% proves the model is ready: no previous model achieved as much\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: un número alto como prueba de calidad sin fijar su piso. El «modelo tonto» que dice «no es fraude» a todo hace 99.6%: el margen real del modelo es el 0.1%.\",\"en\":\"The wrong assumption: a high number as proof of quality without its floor. The naive «nothing is fraud» model scores 99.6%: the model's real margin is 0.1%.\"}},{\"id\":\"B\",\"text\":{\"es\":\"El accuracy casi no informa con 0.4% de fraude: exige precision, recall al umbral de decisión y el costo de cada tipo de error antes de firmar\",\"en\":\"Accuracy says little with 0.4% fraud: demand precision, recall at the decision threshold and the cost of each error type before signing\"},\"correct\":true,\"why\":{\"es\":\"Gana porque reemplaza la métrica por las que sí separan el modelo del truco y anclan la decisión al costo del negocio (bloquear compras legítimas vs. dejar pasar fraude).\",\"en\":\"It wins because it swaps the metric for the ones that actually tell model from trick and anchor the decision to the business cost (blocking legit purchases vs. letting fraud through).\"}},{\"id\":\"C\",\"text\":{\"es\":\"El accuracy está bien pero hay que reportarlo con más decimales para que se vea creíble\",\"en\":\"Accuracy is fine; report it with more decimals so it looks credible\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: un problema de cosmética. Más decimales no cambian lo que el número mide.\",\"en\":\"The wrong assumption: a cosmetics problem. More decimals do not change what the number measures.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Con desbalance extremo el accuracy ES la mejor métrica\",\"en\":\"With an extreme imbalance, accuracy IS the best metric\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: la lógica invertida. Cuanto más rara la clase, MENOS informa el accuracy: el piso del modelo tonto sube hacia 100%.\",\"en\":\"The wrong assumption: the logic inverted. The rarer the class, the LESS accuracy informs: the naive model's floor climbs toward 100%.\"}}],\"takeaway\":{\"es\":\"Con clases raras el accuracy mide el desbalance, no el modelo: exige precision, recall y costos.\",\"en\":\"With rare classes accuracy measures the imbalance, not the model: demand precision, recall and costs.\"}},{\"id\":\"s2-ck2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"evaluacion\",\"arquitectura\"],\"prompt\":{\"es\":\"Filtro de spam: 5.000 correos, 2% de spam. Cada falso positivo (legítimo a spam) puede perder un cliente; cada falso negativo (spam a bandeja) solo molesta. ¿Qué perfil de umbral y métrica priorizas?\",\"en\":\"Spam filter: 5,000 emails, 2% spam. Every false positive (legit mail to spam) can lose a customer; every false negative (spam to inbox) merely annoys. Which threshold/metric profile do you prioritize?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Maximizar recall: atrapar todo el spam; los errores contra legítimos son tolerables\",\"en\":\"Maximize recall: catch all spam; collateral errors against legit mail are tolerable\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: maximizar la métrica que NO cuesta dinero. Recall alto implica precision baja: correos legítimos a la basura, justo lo que pierde clientes.\",\"en\":\"The wrong assumption: maximizing the metric that does NOT cost money. High recall implies low precision: legit mail trashed, exactly what loses customers.\"}},{\"id\":\"B\",\"text\":{\"es\":\"El accuracy es suficiente: con 98% no-spam, cualquier filtro supera ese piso\",\"en\":\"Accuracy suffices: with 98% non-spam, any filter beats that floor\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: accuracy como árbitro final. El modelo tonto ya hace 98% sin hacer NADA; la métrica debe separar al modelo del truco.\",\"en\":\"The wrong assumption: accuracy as final arbiter. The naive model already scores 98% doing NOTHING; the metric must separate model from trick.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Equilibrar precision y recall a 50/50 porque es la configuración por defecto\",\"en\":\"Balance precision and recall at 50/50 because it is the default configuration\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: el equilibrio por ritual. El balance correcto depende de los costos del negocio, y aquí son claramente asimétricos.\",\"en\":\"The wrong assumption: balance by ritual. The right balance depends on the business's costs, and here they are clearly asymmetric.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Priorizar precision alta aunque el recall sea modesto: subir el umbral para marcar spam solo con casi-certeza\",\"en\":\"Prioritize high precision even with modest recall: raise the threshold to flag spam only near-certain\"},\"correct\":true,\"why\":{\"es\":\"Gana porque alinea la métrica con el costo dominante (FP carísimo = pierde clientes; FN barato = molestia): umbral alto, vigilar precision, medir el recall como restricción.\",\"en\":\"It wins because it aligns the metric with the dominant cost (FP very expensive = lost customers; FN cheap = annoyance): high threshold, precision monitored, recall tracked as a constraint.\"}}],\"takeaway\":{\"es\":\"El umbral se elige con la matriz de costos: precision alta cuando un falso positivo duele más que un caso perdido.\",\"en\":\"Pick the threshold from the cost matrix: high precision when a false positive hurts more than a miss.\"}},{\"id\":\"s2-ck3\",\"type\":\"bug_diagnosis\",\"difficulty\":\"advanced\",\"tags\":[\"evaluacion\",\"datos\"],\"prompt\":{\"es\":\"Modelo de renovación de contratos: validación 91%. En producción predice renovación casi siempre. El equipo descubre que entre las features entró «fecha_de_baja_solicitada» (la fecha en que el cliente pidió la baja; vacía si renueva). ¿Qué pasó y qué haces?\",\"en\":\"Contract-renewal model: 91% validation. In production it predicts renewal almost always. The team discovers the feature «cancellation_requested_date» slipped in (the date the client requested cancellation; empty if they renew). What happened and what do you do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El modelo funciona bien: el patrón es genuino y el desempeño subirá con más datos\",\"en\":\"The model works fine: the pattern is genuine and performance will rise with more data\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: ignorar el contenido de la feature. La columna se llena DESPUÉS del evento: es la respuesta escrita en el insumo.\",\"en\":\"The wrong assumption: ignoring the feature's content. The column fills AFTER the event: the answer written into the input.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Es fuga del objetivo: esa fecha (vacía = renueva, llena = no renueva) prácticamente ES la etiqueta, de ahí el 91%; se elimina la columna, se reentrena y se revalida\",\"en\":\"It is target leakage: that date (empty = renews, filled = does not) practically IS the label, hence the 91%; drop the column, retrain and re-validate\"},\"correct\":true,\"why\":{\"es\":\"Gana porque identifica la fuga de etiqueta (una columna que solo existe después del evento a predecir) y da el remedio completo: eliminar, reentrenar y volver a validación honesta.\",\"en\":\"It wins because it identifies the label leak (a column that only exists after the event you predict) and gives the full remedy: drop, retrain, and re-validate honestly.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Es un problema de demasiadas features; con reducción de dimensionalidad se arregla sin quitar la columna\",\"en\":\"It is a too-many-features problem; dimensionality reduction fixes it without dropping the column\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: la cantidad como causa. PCA puede hasta AMPLIFICAR la fuga al mezclar la columna contaminante con las sanas en sus componentes.\",\"en\":\"The wrong assumption: quantity as cause. PCA can even AMPLIFY the leak by mixing the polluted column into its components.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Es drift de datos: los clientes cambian y hay que reentrenar semanalmente\",\"en\":\"It is data drift: clients change and weekly retraining is needed\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: drift como explicación por defecto. Drift no explica validación 91% con producción desastrosa; una columna-fuga sí.\",\"en\":\"The wrong assumption: drift as the default explanation. Drift does not explain 91% validation with disastrous production; a leaking column does.\"}}],\"takeaway\":{\"es\":\"Pregunta en qué MOMENTO existen los datos de cada columna: si se llenan después del evento, son la respuesta, no la señal.\",\"en\":\"Ask WHEN each column's data exists: if it fills after the event, it is the answer, not the signal.\"}},{\"id\":\"s2-ck4\",\"type\":\"metric_selection\",\"difficulty\":\"basic\",\"tags\":[\"evaluacion\",\"datos\"],\"prompt\":{\"es\":\"La matriz de confusión de tu filtro de spam da: TP=90, FN=10 (spam real no detectado), FP=25 (legítimos parados), TN=9875. Un compañero reporta precisión 78% y recall 90%. ¿Es consistente?\",\"en\":\"Your spam filter's confusion matrix reads: TP=90, FN=10 (missed spam), FP=25 (held legit mail), TN=9875. A teammate reports precision 78% and recall 90%. Is it consistent?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Sí: precision = 90/(90+25) = 78.3% y recall = 90/(90+10) = 90% — coincide con las casillas\",\"en\":\"Yes: precision = 90/(90+25) = 78.3% and recall = 90/(90+10) = 90% — consistent with the boxes\"},\"correct\":true,\"why\":{\"es\":\"Gana porque aplica las fórmulas con los denominadores correctos: precision sobre lo PREDICHO como positivo (TP+FP); recall sobre lo REAL positivo (TP+FN).\",\"en\":\"It wins because it applies the formulas with the right denominators: precision over PREDICTED positives (TP+FP); recall over REAL positives (TP+FN).\"}},{\"id\":\"B\",\"text\":{\"es\":\"No: están intercambiadas; los verdaderos valores son precision 90% y recall 78%\",\"en\":\"No: they are swapped; the true values are precision 90% and recall 78%\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: recordar el par de métricas, no su denominador. El denominador de precision incluye los FP (predichos positivos); el de recall el total de reales positivos.\",\"en\":\"The wrong assumption: remembering the pair, not its denominator. Precision's denominator includes FP (predicted positives); recall's includes all real positives.\"}},{\"id\":\"C\",\"text\":{\"es\":\"No puede saberse con esas casillas: hay que reentrenar\",\"en\":\"It cannot be known from these boxes: retraining is required\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: la matriz como dato insuficiente. La matriz confusión es EXACTAMENTE lo que se necesita para computar ambas métricas.\",\"en\":\"The wrong assumption: the matrix as insufficient data. The confusion matrix is EXACTLY what both metrics need.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Casi: la precision real es 98.7% porque los TN participan de su fórmula\",\"en\":\"Almost: real precision is 98.7% because TN takes part in its formula\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: meter los TN en la precision. Los TN no aparecen en precision ni en recall; 98.7% es el ACCURACY ((TP+TN)/total).\",\"en\":\"The wrong assumption: dragging TN into precision. TN appears in neither precision nor recall; 98.7% is the ACCURACY ((TP+TN)/total).\"}}],\"takeaway\":{\"es\":\"Precision = sobre lo que PREDIJISTE positivo; recall = sobre lo que REALMENTE es positivo; los TN no participan de ninguna de las dos.\",\"en\":\"Precision = over what you PREDICTED positive; recall = over what is REALLY positive; TN belongs to neither.\"}},{\"id\":\"s2-ck5\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"entrenamiento\",\"datos\"],\"prompt\":{\"es\":\"Tu compañero corre model.fit() y, a la pregunta «¿cuántas épocas?», contesta: «las que hagan falta hasta que la loss de train sea cero». ¿Qué le devuelves?\",\"en\":\"A teammate runs model.fit() and, asked «how many epochs?», answers: «as many as it takes for train loss to hit zero». What do you fire back?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Exacto: la loss en cero garantiza el mejor modelo\",\"en\":\"Right: zero loss guarantees the best model\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir memorizar con aprender. Loss≈0 en train es el retrato clásico del sobreajuste.\",\"en\":\"The wrong assumption: confusing memorizing with learning. Loss≈0 on train is the classic portrait of overfitting.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Mejor fijar SIEMPRE 100 épocas: es el estándar de la industria\",\"en\":\"Better: always set 100 epochs — the industry standard\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: ritual en lugar de criterio. El número depende de datos y modelo; fijo y sin vigilancia es receta de sobre- o sub-ajuste.\",\"en\":\"The wrong assumption: ritual over criterion. The number depends on data and model; fixed and unsupervised breeds over- or under-fit.\"}},{\"id\":\"C\",\"text\":{\"es\":\"La loss a vigilar es la de VALIDACIÓN, con early stopping cuando deja de bajar: la de train puede seguir bajando mientras el modelo empeora\",\"en\":\"Watch the VALIDATION loss with early stopping when it stops dropping: train loss may keep falling while the model worsens\"},\"correct\":true,\"why\":{\"es\":\"Gana porque define el objetivo real (generalizar) y la palanca de control (parar sobre la métrica honesta, no sobre la memorizada).\",\"en\":\"It wins because it defines the real target (generalize) and the control lever (stop on the honest metric, not the memorized one).\"}},{\"id\":\"D\",\"text\":{\"es\":\"La loss de train es lo único relevante; validación solo al final\",\"en\":\"Train loss is all that matters; validation only at the end\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: la brújula al final del viaje. Sin vigilancia durante el entrenamiento no hay dónde parar; al final ya es tarde.\",\"en\":\"The wrong assumption: the compass at the journey's end. Without monitoring during training there is no stopping point; at the end it is too late.\"}}],\"takeaway\":{\"es\":\"La loss que manda es la de datos NUNCA vistos; loss de train en cero es la definición de memorizar.\",\"en\":\"The loss that governs is the never-seen one; train loss at zero is the definition of memorizing.\"}}],\"refs\":[{\"quiz\":{\"es\":\"ml-fundamentals-es\",\"en\":\"ml-fundamentals\"},\"ids\":[\"11\",\"14\",\"19\"]}],\"questions\":[{\"key\":\"s2-ck1\",\"prompt\":\"$6:props:flow:stages:1:steps:4:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:4:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:4:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:4:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:4:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:0:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:1:steps:4:items:0:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"metric_selection\"},{\"key\":\"s2-ck2\",\"prompt\":\"$6:props:flow:stages:1:steps:4:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:4:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:4:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:4:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:4:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:1:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:1:steps:4:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s2-ck3\",\"prompt\":\"$6:props:flow:stages:1:steps:4:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:4:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:4:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:4:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:4:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:2:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:1:steps:4:items:2:takeaway\",\"difficulty\":\"advanced\",\"type\":\"bug_diagnosis\"},{\"key\":\"s2-ck4\",\"prompt\":\"$6:props:flow:stages:1:steps:4:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:4:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:4:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:4:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:4:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:3:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:1:steps:4:items:3:takeaway\",\"difficulty\":\"basic\",\"type\":\"metric_selection\"},{\"key\":\"s2-ck5\",\"prompt\":\"$6:props:flow:stages:1:steps:4:items:4:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:4:items:4:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:4:items:4:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:4:items:4:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:4:items:4:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:4:items:4:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:1:steps:4:items:4:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"ml-fundamentals-es::11\",\"prompt\":{\"es\":\"Un equipo solo tiene 1.200 ejemplos etiquetados. Una única división 80/20 de entrenamiento/validación da puntuaciones muy distintas según la semilla aleatoria. ¿Qué técnica da una estimación más fiable del rendimiento del modelo?\",\"en\":\"A team has only 1,200 labeled examples. A single 80/20 train/validation split gives very different scores depending on the random seed. Which technique gives a more reliable estimate of model performance?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Validación cruzada k-fold\",\"en\":\"k-fold cross-validation\"}},{\"id\":\"B\",\"text\":{\"es\":\"Entrenar durante más épocas\",\"en\":\"Training for more epochs\"}},{\"id\":\"C\",\"text\":{\"es\":\"Usar también el conjunto de test como validación\",\"en\":\"Using the test set for validation as well\"}},{\"id\":\"D\",\"text\":{\"es\":\"Aumentar el tamaño del batch\",\"en\":\"Increasing the batch size\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"En la validación cruzada k-fold los datos se dividen en k partes (folds); el modelo se entrena k veces, cada vez validando con un fold distinto y entrenando con el resto. Se promedian las k puntuaciones, así que cada ejemplo se usa para validar exactamente una vez y la estimación depende mucho menos de una división con suerte o sin ella. Es especialmente valiosa con datasets pequeños.\",\"en\":\"In k-fold cross-validation the data is divided into k folds; the model is trained k times, each time validating on a different fold and training on the rest. The k scores are averaged, so every example is used for validation exactly once and the estimate is much less dependent on one lucky or unlucky split. It is especially valuable for small datasets.\"}},{\"key\":\"ml-fundamentals-es::14\",\"prompt\":{\"es\":\"Un filtro de spam mueve correos a la carpeta de spam. Los usuarios se quejan de que se pierden correos importantes en spam. ¿Qué métrica debe priorizar mejorar el equipo para la clase 'spam'?\",\"en\":\"A spam filter moves emails to the spam folder. Users complain that important emails are being lost in spam. Which metric should the team prioritize improving for the 'spam' class?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Recall (exhaustividad)\",\"en\":\"Recall\"}},{\"id\":\"B\",\"text\":{\"es\":\"La exactitud en el conjunto de entrenamiento\",\"en\":\"Accuracy on the training set\"}},{\"id\":\"C\",\"text\":{\"es\":\"Precision (precisión)\",\"en\":\"Precision\"}},{\"id\":\"D\",\"text\":{\"es\":\"El error absoluto medio\",\"en\":\"Mean absolute error\"}}],\"correct\":\"C\",\"explanation\":{\"es\":\"La precision mide, de todo lo que el modelo marcó como spam, cuánto era realmente spam: TP / (TP + FP). Los correos importantes enviados a spam son falsos positivos, así que mejorar la precision reduce directamente ese problema. El recall mide cuánto del spam real se detectó, que no es la queja en este caso.\",\"en\":\"Precision measures, of everything the model labeled as spam, how much really was spam: TP / (TP + FP). Important emails sent to spam are false positives, so improving precision directly reduces that problem. Recall measures how much of the actual spam was caught, which is not the complaint here.\"}},{\"key\":\"ml-fundamentals-es::19\",\"prompt\":{\"es\":\"La matriz de confusión de un clasificador binario muestra: 80 verdaderos positivos, 20 falsos negativos, 30 falsos positivos y 870 verdaderos negativos. ¿Cuáles son su precision y su recall?\",\"en\":\"A binary classifier's confusion matrix shows: 80 true positives, 20 false negatives, 30 false positives and 870 true negatives. What are its precision and recall?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Precision 0,80, recall 0,73\",\"en\":\"Precision 0.80, recall 0.73\"}},{\"id\":\"B\",\"text\":{\"es\":\"Precision 0,73, recall 0,80\",\"en\":\"Precision 0.73, recall 0.80\"}},{\"id\":\"C\",\"text\":{\"es\":\"Precision 0,95, recall 0,80\",\"en\":\"Precision 0.95, recall 0.80\"}},{\"id\":\"D\",\"text\":{\"es\":\"Precision 0,80, recall 0,97\",\"en\":\"Precision 0.80, recall 0.97\"}}],\"correct\":\"B\",\"explanation\":{\"es\":\"Precision = TP / (TP + FP) = 80 / (80 + 30) ≈ 0,73. Recall = TP / (TP + FN) = 80 / (80 + 20) = 0,80. Un error común es intercambiarlas: la precision se refiere a los positivos predichos, y el recall a los positivos reales.\",\"en\":\"Precision = TP / (TP + FP) = 80 / (80 + 30) ≈ 0.73. Recall = TP / (TP + FN) = 80 / (80 + 20) = 0.80. A common mistake is to swap them: precision is about the predicted positives, while recall is about the actual positives.\"}}]},{\"id\":\"s2-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre: explícalo a tu jefe no técnico\",\"en\":\"Closing: explain it to your non-technical boss\"},\"prompt\":{\"es\":\"En 4–5 frases, explica a un jefe sin trasfondo técnico por qué el número del entrenamiento no se le puede prometer al cliente, y qué número se promete en su lugar.\",\"en\":\"In 4–5 sentences, explain to a non-technical boss why the training number cannot be promised to a client, and which number is promised instead.\"},\"keyPoints\":[{\"es\":\"El modelo puede memorizar los ejemplos con que se entrenó: ese número crece gratis y no predice nada\",\"en\":\"The model can memorize its training examples: that number grows for free and predicts nothing\"},{\"es\":\"La métrica honesta se mide sobre datos reservados que el modelo jamás vio (test/validación)\",\"en\":\"The honest metric is measured on held-out data the model never saw (test/validation)\"},{\"es\":\"Una validación inflada (fuga o sobreajuste) se descubre cuando el desempeño real no la sigue\",\"en\":\"An inflated validation (leak or overfit) is caught when real performance does not follow it\"},{\"es\":\"Al cliente se le promete el número de la evaluación honesta, con su margen, no el del entrenamiento\",\"en\":\"The client is promised the honest evaluation's number, with its margin — not the training one\"}]}]},{\"id\":\"s3\",\"title\":{\"es\":\"Tus primeros modelos: lineales y árboles\",\"en\":\"Your first models: linear and trees\"},\"objective\":{\"es\":\"Al terminar sabrás entrenar y comparar una regresión lineal o logística, un árbol y un Random Forest contra una baseline, leer qué aprendió cada uno y elegir entre ellos según los datos y la necesidad de explicar.\",\"en\":\"By the end you will be able to train and compare a linear or logistic regression, a tree and a Random Forest against a baseline, read what each one learned, and choose between them by the data and the need to explain.\"},\"steps\":[{\"id\":\"s3-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: rectas y preguntas sí/no\",\"en\":\"Capsule: straight lines and yes/no questions\"},\"problem\":{\"es\":\"Ante una tabla hay que elegir un primer modelo que se entrene rápido, se compare con la baseline y se pueda explicar, en vez de saltar directo a algo opaco o elegido por moda.\",\"en\":\"Faced with a table, you need a first model that trains fast, compares against the baseline and can be explained, instead of jumping straight to something opaque or fashionable.\"},\"mechanism\":{\"es\":\"Un modelo lineal multiplica cada feature por un peso y suma: la regresión lineal predice un número y la logística pasa esa suma por una sigmoide para dar una probabilidad. Sus pesos se leen fácil, pero no capta curvas ni interacciones salvo que las crees como features. Un árbol hace preguntas sí/no («¿ingresos \u003e 40k?») hasta una hoja: capta no linealidades e interacciones y no necesita escalar, pero si crece sin límite memoriza. Combinar muchos árboles lo estabiliza: Random Forest los entrena en paralelo y promedia; el boosting los encadena para corregir errores.\",\"en\":\"A linear model multiplies each feature by a weight and adds them up: linear regression predicts a number, and logistic regression passes that sum through a sigmoid to output a probability. Its weights are easy to read, but it misses curves and interactions unless you build them as features. A tree asks yes/no questions (“income \u003e 40k?”) down to a leaf: it captures non-linearity and interactions and needs no scaling, but grown without limits it memorizes. Combining many trees stabilizes it: Random Forest trains them in parallel and averages; boosting chains them to fix errors.\"},\"flow\":[{\"es\":\"Tabla → baseline (clase mayoritaria o mediana) → regresión lineal o logística\",\"en\":\"Table → baseline (majority class or median) → linear or logistic regression\"},{\"es\":\"¿Curvas o interacciones? → árbol con profundidad limitada → Random Forest o boosting\",\"en\":\"Curves or interactions? → depth-limited tree → Random Forest or boosting\"},{\"es\":\"Comparar en validación → explicar con coeficientes o importancia por permutación\",\"en\":\"Compare on validation → explain with coefficients or permutation importance\"}],\"whenNot\":[{\"es\":\"No uses un modelo lineal si la relación es claramente curva y no puedes crear features que la capturen.\",\"en\":\"Do not use a linear model if the relationship is clearly curved and you cannot build features that capture it.\"},{\"es\":\"No esperes que un árbol o un bosque extrapole: nunca predice por encima del máximo visto en entrenamiento.\",\"en\":\"Do not expect a tree or a forest to extrapolate: it never predicts above the maximum seen in training.\"},{\"es\":\"No dejes un árbol único sin límite de profundidad como modelo final: memoriza el ruido.\",\"en\":\"Do not ship a single depth-unlimited tree as the final model: it memorizes noise.\"}],\"mermaid\":\"flowchart LR\\n  A[Tabla] --\u003e B[Baseline]\\n  B --\u003e C[Lineal o logistica]\\n  C --\u003e D{Curvas o interacciones}\\n  D --\u003e|si| E[Arbol limitado]\\n  E --\u003e F[Random Forest o boosting]\\n  D --\u003e|no| G[Comparar en validacion]\\n  F --\u003e G\"},{\"id\":\"s3-tarjetas-lineales\",\"kind\":\"cards\",\"minutes\":8,\"title\":{\"es\":\"Tarjetas: modelos lineales\",\"en\":\"Cards: linear models\"},\"deck\":\"fundamentals-ml-modelos\",\"module\":\"m2-lineales\",\"cardsEs\":[{\"id\":\"ml-modelo-lineal\",\"part\":\"m\",\"front\":\"¿Qué es una regresión lineal y cuándo usarla?\",\"back\":\"Dibuja la mejor línea (o plano) que predice un NÚMERO a partir de las features: precio ≈ a·m² + b·habitaciones + c.\\n\\nAnalogía: una regla de tres con varias palancas. Cada coeficiente dice \\\"si esta columna sube 1, la predicción sube tanto\\\".\\n\\nÚsala cuando la relación es más o menos recta, quieres explicar el resultado, o necesitas una baseline rápida.\\n\\nNo la uses si la curva es claramente no lineal (un árbol o una red lo capturan mejor) o si la salida es una categoría.\",\"topic\":\"Regresión lineal\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-logistica\",\"part\":\"m\",\"front\":\"¿Qué es la regresión logística y cuándo usarla?\",\"back\":\"Pese al nombre, es CLASIFICACIÓN. Toma una combinación lineal y la pasa por una sigmoide para dar una probabilidad entre 0 y 1 (spam 0.82).\\n\\nAnalogía: la misma regla de la regresión lineal, pero la salida se aplasta a \\\"qué tan probable es el sí\\\".\\n\\nÚsala como baseline de clasificación binaria cuando quieres coeficientes legibles (\\\"esta feature sube el riesgo\\\").\\n\\nNo la uses si las clases se separan con curvas raras, o si ya sabes que un boosting gana claro en tu tabla. Para más de dos clases, mira softmax.\",\"topic\":\"Regresión logística\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-softmax\",\"part\":\"m\",\"front\":\"¿Cómo clasifica un modelo cuando hay más de dos clases?\",\"back\":\"Softmax convierte varios puntajes en probabilidades que SUMAN 1. La clase ganadora es la de mayor probabilidad.\\n\\nEjemplo: foto → perro 0.7, gato 0.2, otro 0.1.\\n\\nLa regresión logística es el caso de dos clases. Softmax es su hermana para N clases (tipo de producto, intención del usuario).\\n\\nNo confundir con \\\"entrenar N modelos sí/no por separado\\\": softmax obliga a que las probabilidades compitan entre sí.\",\"topic\":\"Softmax / multiclase\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-ridge-lasso\",\"part\":\"m\",\"front\":\"¿Qué son Ridge (L2) y Lasso (L1), y cuándo eliges uno?\",\"back\":\"Ridge y Lasso son regresiones lineales con un freno (penalización de los coeficientes) para no memorizar ruido.\\n\\n• Ridge (L2): encoge TODOS los coeficientes hacia cero, pero no los deja exactamente en cero. Útil si muchas columnas importan un poco y están correlacionadas.\\n• Lasso (L1): puede poner coeficientes en CERO. Hace selección de features: se queda con pocas columnas.\\n• Elastic Net: mezcla de las dos.\\n\\nÚsalos cuando hay muchas columnas respecto a las filas. Siguen siendo lineales: no inventan curvas.\",\"topic\":\"Ridge y Lasso\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"difficulty\":\"intermediate\"}],\"cardsEn\":[{\"id\":\"ml-modelo-lineal\",\"part\":\"m\",\"front\":\"What is linear regression and when to use it?\",\"back\":\"It draws the best line (or plane) that predicts a NUMBER from the features: price ≈ a·sqm + b·rooms + c.\\n\\nAnalogy: a rule of three with several levers. Each coefficient says \\\"if this column goes up by 1, the prediction goes up by this much\\\".\\n\\nUse it when the relationship is roughly straight, you want to explain the result, or you need a fast baseline.\\n\\nDo not use it if the curve is clearly non-linear (a tree or a network captures that better) or if the output is a category.\",\"topic\":\"Regresión lineal\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-logistica\",\"part\":\"m\",\"front\":\"What is logistic regression and when to use it?\",\"back\":\"Despite the name, it is CLASSIFICATION. It takes a linear combination and passes it through a sigmoid to output a probability between 0 and 1 (spam 0.82).\\n\\nAnalogy: the same rule as linear regression, but the output is squashed into \\\"how likely is yes\\\".\\n\\nUse it as a binary-classification baseline when you want readable coefficients (\\\"this feature raises the risk\\\").\\n\\nDo not use it if classes separate along odd curves, or if you already know boosting clearly wins on your table. For more than two classes, see softmax.\",\"topic\":\"Regresión logística\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-softmax\",\"part\":\"m\",\"front\":\"How does a model classify when there are more than two classes?\",\"back\":\"Softmax turns several scores into probabilities that SUM to 1. The winning class is the highest probability.\\n\\nExample: photo → dog 0.7, cat 0.2, other 0.1.\\n\\nLogistic regression is the two-class case. Softmax is its sibling for N classes (product type, user intent).\\n\\nDo not confuse it with \\\"train N separate yes/no models\\\": softmax forces the probabilities to compete with each other.\",\"topic\":\"Softmax / multiclase\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-ridge-lasso\",\"part\":\"m\",\"front\":\"What are Ridge (L2) and Lasso (L1), and when do you pick one?\",\"back\":\"Ridge and Lasso are linear regressions with a brake (a penalty on the coefficients) so they do not memorize noise.\\n\\n• Ridge (L2): shrinks ALL coefficients toward zero, but does not set them exactly to zero. Useful when many columns matter a little and are correlated.\\n• Lasso (L1): can set coefficients to ZERO. It selects features: it keeps a few columns.\\n• Elastic Net: a mix of both.\\n\\nUse them when you have many columns relative to rows. They are still linear: they do not invent curves.\",\"topic\":\"Ridge y Lasso\",\"origin\":\"ai\",\"group\":\"Modelos lineales\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"}]},{\"id\":\"s3-tarjetas-arboles\",\"kind\":\"cards\",\"minutes\":10,\"title\":{\"es\":\"Tarjetas: árboles y ensembles\",\"en\":\"Cards: trees and ensembles\"},\"deck\":\"fundamentals-ml-modelos\",\"module\":\"m3-ensembles\",\"cardsEs\":[{\"id\":\"ml-modelo-arbol\",\"part\":\"m\",\"front\":\"¿Qué es un árbol de decisión y cuándo usarlo?\",\"back\":\"Hace preguntas sí/no del estilo \\\"¿ingresos \u003e 40k?\\\" y \\\"¿edad \u003c 25?\\\" hasta llegar a una hoja con la predicción.\\n\\nAnalogía: el juego de \\\"adivina el animal\\\" con preguntas. Lo puedes dibujar y explicárselo a negocio.\\n\\nÚsalo para reglas legibles, datos tabulares, y cuando no quieres escalar columnas (los árboles no lo necesitan).\\n\\nUn único árbol memoriza con facilidad si lo dejas crecer sin límite. En producción casi siempre es la pieza de un bosque o de boosting, no el modelo final.\",\"topic\":\"Árbol de decisión\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-random-forest\",\"part\":\"m\",\"front\":\"¿Qué es Random Forest y cuándo usarlo?\",\"back\":\"Entrena MUCHOS árboles independientes, cada uno con una muestra al azar de filas (con reemplazo), y combina sus predicciones.\\n\\n• En cada corte, cada árbol solo mira un subconjunto al azar de columnas: así los árboles se parecen menos entre sí.\\n• Clasificación: voto o promedio de probabilidades (scikit-learn promedia). Regresión: promedio.\\n\\nAnalogía: preguntas a 100 personas que vieron partes distintas del mismo caso. El promedio se equivoca menos que una sola.\\n\\nÚsalo en tablas cuando quieres algo sólido con poco ajuste: baja el overfitting de un árbol solo.\\n\\nEn tablas difíciles el boosting suele ganarle, y 500 árboles son más lentos y opacos que uno.\",\"topic\":\"Random Forest\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting\",\"part\":\"m\",\"front\":\"¿Qué es el gradient boosting (XGBoost, LightGBM, CatBoost) y cuándo usarlo?\",\"back\":\"Gradient boosting suma árboles pequeños en SERIE: cada árbol nuevo se entrena para corregir los errores que todavía comete el conjunto.\\n\\nEl árbol 2 corrige al 1, el 3 corrige lo que quedó, y así.\\n\\n• XGBoost: el clásico de competiciones en tablas.\\n• LightGBM: más rápido en datasets grandes.\\n• CatBoost: mejor de fábrica con columnas categóricas.\\n\\nÚsalo como primera apuesta seria en datos tabulares (fraude, churn, precios).\\n\\nCuidado: con pocos datos o malos hiperparámetros sobreajusta. Es menos explicable que un árbol solo.\",\"topic\":\"Gradient Boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bagging-vs-boosting\",\"part\":\"m\",\"front\":\"¿En qué se diferencian bagging (Random Forest) y boosting?\",\"back\":\"Bagging entrena muchos modelos en paralelo y los promedia (baja la varianza); boosting los entrena en serie, cada uno corrigiendo al anterior (baja sobre todo el sesgo).\\n\\n• Bagging: modelos independientes, cada uno con una muestra distinta. Random Forest es bagging de árboles profundos. Añadir árboles casi nunca causa overfitting.\\n• Boosting: árboles pequeños en serie. XGBoost y LightGBM son boosting. Demasiados árboles sí pueden sobreajustar → early stopping.\\n\\nPista de examen: \\\"muchos árboles en paralelo / voto\\\" → bosque. \\\"cada árbol corrige al anterior\\\" → boosting.\",\"topic\":\"Bagging vs boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting-sobreajuste\",\"part\":\"m\",\"front\":\"Tu LightGBM con 5 000 árboles, learning rate 0.3 y árboles muy profundos da AUC 0.99 en train y 0.78 en validación. Tienes 20 000 filas y una semana. ¿Qué ajustas primero?\",\"back\":\"Baja la learning rate, limita la complejidad de cada árbol y deja que early stopping en validación decida cuántos árboles usar.\\n\\n• El boosting sigue corrigiendo errores en serie: con muchos árboles y pasos grandes acaba ajustando ruido.\\n• Otras palancas: mínimo de ejemplos por hoja, submuestreo de filas y columnas, regularización L1/L2 de las hojas.\\n• Cambiar a una red neuronal no ataca la causa: es el mismo sobreajuste con otro modelo.\\n• Añadir más árboles empeora la brecha.\\n\\nIdea clave: en boosting, learning rate y número de árboles se ajustan juntos.\",\"topic\":\"Ajustar boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-rf-extrapolacion\",\"part\":\"m\",\"front\":\"Un Random Forest predice el precio de casas entrenado con superficies de 40 a 200 m². Llega una casa de 400 m² y la predicción es casi la misma que para 200 m². ¿Bug o comportamiento esperado?\",\"back\":\"Comportamiento esperado: un Random Forest predice promediando valores vistos en sus hojas, así que fuera del rango de entrenamiento su predicción se queda plana.\\n\\n• Nunca puede predecir un precio mayor que el máximo visto en train.\\n• Una regresión lineal sí extrapola (aunque puede hacerlo mal si la relación no es lineal).\\n• En producción, vigila los inputs que salen del rango de entrenamiento y trátalos aparte.\\n• En series con tendencia, los árboles sobre valores crudos fallan por lo mismo.\\n\\nIdea clave: los árboles interpolan bien, no extrapolan.\",\"topic\":\"Los árboles no extrapolan\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"difficulty\":\"advanced\"}],\"cardsEn\":[{\"id\":\"ml-modelo-arbol\",\"part\":\"m\",\"front\":\"What is a decision tree and when to use it?\",\"back\":\"It asks yes/no questions like \\\"income \u003e 40k?\\\" and \\\"age \u003c 25?\\\" until it reaches a leaf with the prediction.\\n\\nAnalogy: the \\\"guess the animal\\\" game. You can draw it and explain it to the business.\\n\\nUse it for readable rules, tabular data, and when you do not want to scale columns (trees do not need it).\\n\\nA single tree memorizes easily if you let it grow without a limit. In production it is almost always a piece of a forest or of boosting, not the final model.\",\"topic\":\"Árbol de decisión\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"basic\"},{\"id\":\"ml-modelo-random-forest\",\"part\":\"m\",\"front\":\"What is Random Forest and when to use it?\",\"back\":\"It trains MANY independent trees, each on a random sample of rows (with replacement), and combines their predictions.\\n\\n• At each split, each tree only looks at a random subset of columns: this makes the trees less alike.\\n• Classification: a vote or an average of probabilities (scikit-learn averages). Regression: an average.\\n\\nAnalogy: you ask 100 people who each saw a different slice of the same case. The average is wrong less often than one person.\\n\\nUse it on tables when you want something solid with little tuning: it lowers a single tree's overfitting.\\n\\nOn hard tables boosting usually beats it, and 500 trees are slower and more opaque than one.\",\"topic\":\"Random Forest\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting\",\"part\":\"m\",\"front\":\"What is gradient boosting (XGBoost, LightGBM, CatBoost) and when to use it?\",\"back\":\"Gradient boosting adds small trees in SERIES: each new tree is trained to fix the errors the ensemble still makes.\\n\\nTree 2 fixes tree 1, tree 3 fixes what is left, and so on.\\n\\n• XGBoost: the classic competition model on tables.\\n• LightGBM: faster on large datasets.\\n• CatBoost: better out of the box with categorical columns.\\n\\nUse it as the first serious bet on tabular data (fraud, churn, pricing).\\n\\nCareful: with little data or bad hyperparameters it overfits. It is less explainable than a single tree.\",\"topic\":\"Gradient Boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-bagging-vs-boosting\",\"part\":\"m\",\"front\":\"How do bagging (Random Forest) and boosting differ?\",\"back\":\"Bagging trains many models in parallel and averages them (it lowers variance); boosting trains them in series, each fixing the previous one (it mainly lowers bias).\\n\\n• Bagging: independent models, each on a different sample. Random Forest is bagging of deep trees. Adding trees almost never causes overfitting.\\n• Boosting: small trees in series. XGBoost and LightGBM are boosting. Too many trees can overfit → early stopping.\\n\\nExam hint: \\\"many trees in parallel / vote\\\" → forest. \\\"each tree corrects the previous one\\\" → boosting.\",\"topic\":\"Bagging vs boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-modelo-boosting-sobreajuste\",\"part\":\"m\",\"front\":\"Your LightGBM with 5,000 trees, learning rate 0.3, and very deep trees scores AUC 0.99 on train and 0.78 on validation. You have 20,000 rows and one week. What do you tune first?\",\"back\":\"Lower the learning rate, limit each tree's complexity, and let early stopping on validation decide how many trees to keep.\\n\\n• Boosting keeps fixing errors in series: with many trees and big steps it ends up fitting noise.\\n• Other levers: minimum examples per leaf, row and column subsampling, L1/L2 regularization of the leaves.\\n• Switching to a neural network does not address the cause: it is the same overfitting with another model.\\n• Adding more trees widens the gap.\\n\\nKey idea: in boosting, learning rate and number of trees are tuned together.\",\"topic\":\"Ajustar boosting\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"},{\"id\":\"ml-modelo-rf-extrapolacion\",\"part\":\"m\",\"front\":\"A Random Forest predicts house prices, trained on sizes from 40 to 200 m². A 400 m² house arrives and the prediction is almost the same as for 200 m². Bug or expected behavior?\",\"back\":\"Expected behavior: a Random Forest predicts by averaging values seen in its leaves, so outside the training range its prediction stays flat.\\n\\n• It can never predict a price above the maximum seen in train.\\n• A linear regression does extrapolate (though it may do it badly if the relationship is not linear).\\n• In production, watch for inputs outside the training range and handle them separately.\\n• On trending time series, trees on raw values fail for the same reason.\\n\\nKey idea: trees interpolate well; they do not extrapolate.\",\"topic\":\"Los árboles no extrapolan\",\"origin\":\"ai\",\"group\":\"Árboles y ensembles\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-modelos\",\"difficulty\":\"advanced\"}]},{\"id\":\"s3-practica\",\"kind\":\"practice\",\"minutes\":15,\"title\":{\"es\":\"Práctica: baseline, logística, árbol y bosque\",\"en\":\"Practice: baseline, logistic, tree and forest\"},\"scaffolding\":\"high\",\"language\":\"python\",\"instructions\":{\"es\":\"Objetivo: comprobar con números reales que siempre hay que compararse con una baseline (un modelo «tonto» de referencia) y que un modelo más complejo no siempre gana.\\n\\nQué haces:\\n1. Copia y ejecuta el ejemplo resuelto. Entrena 5 modelos de clasificación con el dataset de cáncer de mama que trae scikit-learn e imprime la exactitud en train y en test de cada uno. Fíjate en el árbol sin límite (`tree_full`): 100 % en train, pero peor en test que el árbol de profundidad 3 (`tree_d3`).\\n2. Completa la plantilla. Ahora es regresión (predecir un número) con el dataset diabetes. Faltan dos cosas, marcadas con TODO: añadir el Random Forest a la lista y calcular el MAE (error absoluto medio) en test.\\n3. Ejecútala y compara los tres MAE: cuanto más bajo, mejor.\\n\\nQué escribes en el cuadro: tu código completo, los números que imprimió y una frase con tu conclusión.\",\"en\":\"Goal: check with real numbers that you must always compare against a baseline (a «dumb» reference model) and that a more complex model does not always win.\\n\\nWhat you do:\\n1. Copy and run the worked example. It trains 5 classification models on scikit-learn's bundled breast-cancer dataset and prints train and test accuracy for each. Look at the unlimited tree (`tree_full`): 100% on train, yet worse on test than the depth-3 tree (`tree_d3`).\\n2. Complete the template. It is now regression (predicting a number) on the diabetes dataset. Two things are missing, marked TODO: add the Random Forest to the list and compute the test MAE (mean absolute error).\\n3. Run it and compare the three MAEs: lower is better.\\n\\nWhat you write in the box: your full code, the numbers it printed and one sentence with your conclusion.\"},\"workedExample\":\"$f\",\"starter\":\"from sklearn.datasets import load_diabetes\\nfrom sklearn.model_selection import train_test_split\\nfrom sklearn.linear_model import LinearRegression\\nfrom sklearn.ensemble import RandomForestRegressor\\nfrom sklearn.dummy import DummyRegressor\\nfrom sklearn.metrics import mean_absolute_error\\n\\nX, y = load_diabetes(return_X_y=True, as_frame=True)\\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, random_state=42)\\n\\nmodels = {\\n    \\\"baseline\\\": DummyRegressor(strategy=\\\"median\\\"),\\n    \\\"linear\\\": LinearRegression(),\\n    # TODO: \\\"forest\\\": RandomForestRegressor(n_estimators=300, min_samples_leaf=5, random_state=42)\\n}\\nfor name, m in models.items():\\n    m.fit(X_tr, y_tr)\\n    mae = ...  # TODO: mean_absolute_error on the TEST split\\n    print(f\\\"{name:10s} MAE test = {mae:.1f}\\\")\",\"solution\":\"from sklearn.datasets import load_diabetes\\nfrom sklearn.model_selection import train_test_split\\nfrom sklearn.linear_model import LinearRegression\\nfrom sklearn.ensemble import RandomForestRegressor\\nfrom sklearn.dummy import DummyRegressor\\nfrom sklearn.metrics import mean_absolute_error\\n\\nX, y = load_diabetes(return_X_y=True, as_frame=True)\\nX_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, random_state=42)\\n\\nmodels = {\\n    \\\"baseline\\\": DummyRegressor(strategy=\\\"median\\\"),\\n    \\\"linear\\\": LinearRegression(),\\n    \\\"forest\\\": RandomForestRegressor(n_estimators=300, min_samples_leaf=5, random_state=42),\\n}\\nfor name, m in models.items():\\n    m.fit(X_tr, y_tr)\\n    mae = mean_absolute_error(y_te, m.predict(X_te))\\n    print(f\\\"{name:10s} MAE test = {mae:.1f}\\\")\\n# baseline 64.0 · linear 41.5 · forest 41.8\",\"criteria\":[{\"es\":\"Se imprimen tres MAE de test (baseline, lineal, bosque); con random_state=42 la baseline da ≈64 y los dos modelos ≈41–42.\",\"en\":\"Three test MAEs are printed (baseline, linear, forest); with random_state=42 the baseline gives ≈64 and both models ≈41–42.\"},{\"es\":\"Anotas que el bosque NO gana a la lineal en este dataset: más complejo no siempre es mejor.\",\"en\":\"You note that the forest does NOT beat the linear model on this dataset: more complex is not always better.\"},{\"es\":\"En el ejemplo resuelto señalas el árbol sin límite: train 1.000 y test 0.923, peor que el árbol de profundidad 3 (0.944) y que el bosque (0.958).\",\"en\":\"In the worked example you point out the unlimited tree: train 1.000 and test 0.923, worse than the depth-3 tree (0.944) and the forest (0.958).\"}]},{\"id\":\"s3-escenarios\",\"kind\":\"scenarios\",\"minutes\":8,\"title\":{\"es\":\"Escenarios: ¿qué modelo primero?\",\"en\":\"Scenarios: which model first?\"},\"items\":[{\"id\":\"s3-q1\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"basic\",\"tags\":[\"modelos-lineales\",\"explicabilidad\"],\"prompt\":{\"es\":\"Una financiera pequeña debe aprobar créditos con 8.000 solicitudes históricas (pagó/no pagó) y 15 columnas. El regulador exige explicar a cada cliente qué factores pesaron en la decisión, y necesitas un primer modelo esta semana. ¿Cuál eliges?\",\"en\":\"A small lender must approve loans with 8,000 historical applications (repaid/defaulted) and 15 columns. The regulator requires explaining to each customer which factors weighed in the decision, and you need a first model this week. Which do you choose?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Una red neuronal profunda, porque suele dar la mejor precisión\",\"en\":\"A deep neural network, because it usually gives the best accuracy\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que más complejo siempre gana. Con 8.000 filas tabulares rara vez supera a modelos simples, y es difícil de explicar al regulador.\",\"en\":\"The wrong assumption: that more complex always wins. On 8,000 tabular rows it rarely beats simple models, and it is hard to explain to the regulator.\"}},{\"id\":\"B\",\"text\":{\"es\":\"k-means con 2 grupos, uno para «paga» y otro para «no paga»\",\"en\":\"k-means with 2 clusters, one for “repays” and one for “defaults”\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: ignorar que hay etiqueta. k-means agrupa por parecido, y sus grupos no tienen por qué coincidir con pagar o no pagar.\",\"en\":\"The wrong assumption: ignoring that there is a label. k-means groups by similarity, and its clusters need not match repaying or defaulting.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Una regresión lineal que prediga 0 o 1 y redondear\",\"en\":\"A linear regression that predicts 0 or 1, then rounding\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: tratar una clase como un número. Puede dar valores fuera de 0–1 y no está pensada para clasificar; la logística resuelve justo eso.\",\"en\":\"The wrong assumption: treating a class as a number. It can output values outside 0–1 and is not built to classify; logistic regression solves exactly that.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Una regresión logística como baseline: da una probabilidad y coeficientes que dicen qué factor sube o baja el riesgo\",\"en\":\"A logistic regression as the baseline: it gives a probability and coefficients that say which factor raises or lowers the risk\"},\"correct\":true,\"why\":{\"es\":\"Gana porque es un clasificador rápido de entrenar, con pesos interpretables por feature y salida probabilística; además sirve de referencia para probar después un boosting.\",\"en\":\"It wins because it is a fast-to-train classifier with interpretable per-feature weights and a probabilistic output; it also serves as the reference before trying boosting.\"}}],\"takeaway\":{\"es\":\"Tabla, etiqueta binaria y obligación de explicar: la logística es el primer paso natural.\",\"en\":\"Table, binary label and a duty to explain: logistic regression is the natural first step.\"}},{\"id\":\"s3-q2\",\"type\":\"concept\",\"difficulty\":\"intermediate\",\"tags\":[\"arboles\",\"rendimiento\"],\"prompt\":{\"es\":\"Tu Random Forest de abandono da 0.86 de AUC en validación, con 200.000 clientes y 60 columnas. Tienes dos semanas y alguien con experiencia ajustando hiperparámetros. ¿Qué pruebas a continuación para intentar mejorar?\",\"en\":\"Your churn Random Forest scores 0.86 AUC on validation, with 200,000 customers and 60 columns. You have two weeks and someone experienced at tuning hyperparameters. What do you try next to improve?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Gradient boosting (LightGBM o XGBoost) con early stopping en validación\",\"en\":\"Gradient boosting (LightGBM or XGBoost) with early stopping on validation\"},\"correct\":true,\"why\":{\"es\":\"Gana porque el boosting encadena árboles que corrigen los errores del conjunto y, bien ajustado, suele superar al bosque en tablas; early stopping evita que sobreajuste.\",\"en\":\"It wins because boosting chains trees that fix the ensemble's errors and, well tuned, usually beats the forest on tables; early stopping keeps it from overfitting.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Un único árbol de decisión profundo, más fácil de explicar\",\"en\":\"A single deep decision tree, easier to explain\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que explicar más equivale a predecir mejor. Un árbol solo tiene más varianza que el bosque y casi seguro empeora el AUC.\",\"en\":\"The wrong assumption: that easier to explain means better at predicting. A single tree has more variance than the forest and will almost surely lower AUC.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Subir el Random Forest de 500 a 5.000 árboles\",\"en\":\"Raise the Random Forest from 500 to 5,000 trees\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que más árboles siempre suman. Pasado cierto número, el bosque se estabiliza y apenas mejora; cuesta más cómputo sin cambiar lo que puede aprender.\",\"en\":\"The wrong assumption: that more trees always add up. Past a certain number the forest stabilizes and barely improves; it costs more compute without changing what it can learn.\"}},{\"id\":\"D\",\"text\":{\"es\":\"k-NN con k = 5 sobre las 60 columnas\",\"en\":\"k-NN with k = 5 on the 60 columns\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que un modelo de distancia es intercambiable. Con 200.000 filas predecir es lento, exige escalar y elegir bien la distancia, y en tablas mixtas no suele ganar a los árboles.\",\"en\":\"The wrong assumption: that a distance model is interchangeable. With 200,000 rows prediction is slow, it needs scaling and a good distance, and on mixed tables it rarely beats trees.\"}}],\"takeaway\":{\"es\":\"Bosque = robusto sin ajustar; boosting = el siguiente paso cuando tienes tiempo para ajustarlo.\",\"en\":\"Forest = robust without tuning; boosting = the next step when you have time to tune it.\"}}],\"questions\":[{\"key\":\"s3-q1\",\"prompt\":\"$6:props:flow:stages:2:steps:4:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:4:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:4:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:4:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:4:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:0:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:2:steps:4:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s3-q2\",\"prompt\":\"$6:props:flow:stages:2:steps:4:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:4:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:4:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:4:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:4:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:1:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:2:steps:4:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"concept\"}]},{\"id\":\"s3-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: el árbol que lo memorizó todo\",\"en\":\"Lab: the tree that memorized everything\"},\"language\":\"python\",\"symptom\":{\"es\":\"El árbol de diagnóstico marca 100% de acierto en train y 92% en test, peor que un árbol mucho más pequeño que probó otro compañero (94%) y que un Random Forest (96%). Con datos nuevos sigue rondando el 92%.\",\"en\":\"The diagnosis tree scores 100% on train and 92% on test, worse than a much smaller tree a colleague tried (94%) and than a Random Forest (96%). On new data it stays around 92%.\"},\"artifact\":\"X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, stratify=y, random_state=42)\\n\\ntree = DecisionTreeClassifier(random_state=42)   # sin max_depth ni min_samples_leaf\\ntree.fit(X_tr, y_tr)\\nprint(\\\"train\\\", tree.score(X_tr, y_tr))   # -\u003e 1.000\\nprint(\\\"test \\\", tree.score(X_te, y_te))   # -\u003e 0.923\",\"question\":{\"es\":\"¿Cuál es la causa raíz?\",\"en\":\"What is the root cause?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Faltó escalar las features con StandardScaler\",\"en\":\"The features were not scaled with StandardScaler\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que todos los modelos dependen de la escala. Un árbol corta por umbrales en cada feature; escalar no cambia los cortes.\",\"en\":\"The wrong assumption: that every model depends on scale. A tree splits on per-feature thresholds; scaling does not change the splits.\"}},{\"id\":\"B\",\"text\":{\"es\":\"El árbol creció sin límite hasta tener hojas casi de un ejemplo: memorizó el ruido de train\",\"en\":\"The tree grew without limits down to near one-example leaves: it memorized the training noise\"},\"correct\":true,\"why\":{\"es\":\"Gana porque train 1.000 con un test claramente menor es la firma del sobreajuste: sin max_depth ni min_samples_leaf, el árbol sigue partiendo hasta separar cada caso.\",\"en\":\"It wins because train 1.000 with a clearly lower test is the signature of overfitting: without max_depth or min_samples_leaf, the tree keeps splitting until it separates every case.\"}},{\"id\":\"C\",\"text\":{\"es\":\"El test es demasiado pequeño; con test_size=0.5 subiría\",\"en\":\"The test set is too small; with test_size=0.5 it would go up\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el tamaño del test cambia el modelo. Cambia la precisión de la medida, no lo que el árbol aprendió; la brecha seguiría ahí.\",\"en\":\"The wrong assumption: that test size changes the model. It changes how precise the measurement is, not what the tree learned; the gap would remain.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Hay fuga de datos entre train y test\",\"en\":\"There is data leakage between train and test\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir los síntomas. Una fuga inflaría el test; aquí el test es honesto y precisamente muestra que el árbol memorizó.\",\"en\":\"The wrong assumption: mixing up symptoms. Leakage would inflate the test score; here the test is honest and shows precisely that the tree memorized.\"}}],\"rootCause\":{\"es\":\"Un árbol sin límites sigue partiendo hasta que casi cada hoja tiene un solo ejemplo: aprende el ruido de train (100%) y generaliza peor. La complejidad del árbol es un hiperparámetro que hay que limitar y elegir con validación.\",\"en\":\"An unlimited tree keeps splitting until almost every leaf holds a single example: it learns the training noise (100%) and generalizes worse. Tree complexity is a hyperparameter to limit and choose with validation.\"},\"fix\":\"from sklearn.model_selection import GridSearchCV\\nsearch = GridSearchCV(DecisionTreeClassifier(random_state=42),\\n                      {\\\"max_depth\\\": [2, 3, 4, 6, 8], \\\"min_samples_leaf\\\": [1, 5, 10]}, cv=5)\\nsearch.fit(X_tr, y_tr)                      # la profundidad se elige con CV sobre train\\nprint(search.best_params_, search.score(X_te, y_te))\",\"fixNote\":{\"es\":\"Alternativa: un Random Forest, que promedia muchos árboles profundos y baja su varianza.\",\"en\":\"Alternative: a Random Forest, which averages many deep trees and lowers their variance.\"},\"questions\":[{\"key\":\"s3-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:2:steps:5:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:5:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:5:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:5:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:5:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:5:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:5:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:5:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:5:options:3:why\"}],\"correct\":\"B\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s3-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":12,\"title\":{\"es\":\"Checkpoint: primeros modelos\",\"en\":\"Checkpoint: first models\"},\"items\":[{\"id\":\"s3-ck1\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"arboles\",\"preprocesamiento\"],\"prompt\":{\"es\":\"Entrenas un Random Forest con y sin StandardScaler, con las mismas features y la misma semilla, y obtienes las mismas predicciones. Tu compañero cree que el pipeline tiene un bug. ¿Qué le dices?\",\"en\":\"You train a Random Forest with and without StandardScaler, with the same features and the same seed, and get the same predictions. Your colleague thinks the pipeline has a bug. What do you tell them?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Es un bug: escalar siempre cambia las predicciones de cualquier modelo\",\"en\":\"It is a bug: scaling always changes any model's predictions\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que todos los modelos usan distancias o gradientes. Los árboles no.\",\"en\":\"The wrong assumption: that every model uses distances or gradients. Trees do not.\"}},{\"id\":\"B\",\"text\":{\"es\":\"El scaler no se aplicó: hay que llamar a fit_transform también sobre test\",\"en\":\"The scaler was not applied: you must call fit_transform on test too\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: arreglarlo con otra fuga. Hacer fit sobre test
