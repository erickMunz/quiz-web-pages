 contamina la evaluación, y el bosque daría lo mismo igualmente.\",\"en\":\"The wrong assumption: fixing it with another leak. Fitting on test contaminates evaluation, and the forest would give the same result anyway.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Es lo esperado: los árboles cortan cada feature por umbrales, y escalar no cambia el orden de los valores, así que los cortes equivalen\",\"en\":\"It is expected: trees split each feature on thresholds, and scaling does not change the order of values, so the splits are equivalent\"},\"correct\":true,\"why\":{\"es\":\"Gana porque StandardScaler aplica a cada columna una transformación que conserva el orden, y los árboles solo dependen de ese orden: obtienen las mismas particiones.\",\"en\":\"It wins because StandardScaler applies an order-preserving transform to each column, and trees only depend on that order: they get the same partitions.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Es casualidad de esta semilla; con otra semilla saldrían distintas\",\"en\":\"It is luck with this seed; with another seed they would differ\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: atribuirlo al azar. Es una propiedad de los árboles: no les afecta una transformación por columna que conserva el orden.\",\"en\":\"The wrong assumption: putting it down to chance. It is a property of trees: they are unaffected by a per-column order-preserving transform.\"}}],\"takeaway\":{\"es\":\"Los árboles dependen del orden de los valores, no de su escala.\",\"en\":\"Trees depend on the order of values, not their scale.\"}},{\"id\":\"s3-ck2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"basic\",\"tags\":[\"modelos-lineales\",\"feature-engineering\"],\"prompt\":{\"es\":\"Predices el consumo eléctrico diario de un edificio con la temperatura exterior: sube con el frío (calefacción) y con el calor (aire acondicionado). Una regresión lineal con la temperatura tal cual da un error alto en train y en validación. ¿Qué haces?\",\"en\":\"You predict a building's daily power use from outdoor temperature: it rises with cold (heating) and with heat (air conditioning). A linear regression on raw temperature has high error on both train and validation. What do you do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Captar la forma de U: añadir temperatura² (o «grados de frío» y «grados de calor») a la lineal, o probar un árbol o boosting\",\"en\":\"Capture the U shape: add temperature² (or “cold degrees” and “heat degrees”) to the linear model, or try a tree or boosting\"},\"correct\":true,\"why\":{\"es\":\"Gana porque una U no es una recta: con features que la representen, o con un modelo no lineal, el patrón se puede aprender.\",\"en\":\"It wins because a U is not a straight line: with features that represent it, or with a non-linear model, the pattern can be learned.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Añadir regularización L2 fuerte\",\"en\":\"Add strong L2 regularization\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: tratar un subajuste como sobreajuste. El modelo ya falla en train; regularizar lo simplifica aún más.\",\"en\":\"The wrong assumption: treating underfitting as overfitting. The model already fails on train; regularizing simplifies it further.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Entrenar más épocas con una learning rate mayor\",\"en\":\"Train more epochs with a higher learning rate\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que es falta de entrenamiento. La regresión lineal ya encuentra su mejor recta; más pasos no la convierten en curva.\",\"en\":\"The wrong assumption: that it lacks training. Linear regression already finds its best line; more steps do not turn it into a curve.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Escalar la temperatura entre 0 y 1\",\"en\":\"Scale temperature to between 0 and 1\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que la escala cambia la forma. Escalar cambia las unidades; sigue siendo una recta sobre una U.\",\"en\":\"The wrong assumption: that scale changes shape. Scaling changes units; it is still a straight line over a U.\"}}],\"takeaway\":{\"es\":\"Error alto ya en train: falta capacidad o features; una recta no dibuja una U.\",\"en\":\"High error already on train: missing capacity or features; a line cannot draw a U.\"}},{\"id\":\"s3-ck3\",\"type\":\"bug_diagnosis\",\"difficulty\":\"intermediate\",\"tags\":[\"arboles\",\"extrapolacion\"],\"prompt\":{\"es\":\"Tu Random Forest de precios de vivienda se entrenó con casas de 40 a 200 m². Ahora llegan casas de 350–400 m² y su precio predicho es casi el mismo que el de las de 200 m². Los usuarios se quejan. ¿Qué explica el comportamiento?\",\"en\":\"Your house-price Random Forest was trained on homes from 40 to 200 m². Now 350–400 m² homes arrive and their predicted price is almost the same as for 200 m² homes. Users complain. What explains the behavior?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El bosque tiene pocos árboles; con 2.000 árboles predeciría precios más altos\",\"en\":\"The forest has too few trees; with 2,000 trees it would predict higher prices\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que más árboles crean valores nuevos. Más árboles promedian los mismos precios vistos en train.\",\"en\":\"The wrong assumption: that more trees create new values. More trees average the same prices seen in train.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Hay fuga de datos en el entrenamiento\",\"en\":\"There is data leakage in training\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir síntomas. La fuga infla la evaluación; no explica un techo en las predicciones.\",\"en\":\"The wrong assumption: mixing up symptoms. Leakage inflates evaluation; it does not explain a ceiling on predictions.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Falta escalar la superficie\",\"en\":\"The size feature was not scaled\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que la escala importa a los árboles. Sus cortes no dependen de ella.\",\"en\":\"The wrong assumption: that scale matters to trees. Their splits do not depend on it.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Un Random Forest predice promediando precios vistos en sus hojas, así que no puede extrapolar más allá del máximo del entrenamiento\",\"en\":\"A Random Forest predicts by averaging prices seen in its leaves, so it cannot extrapolate beyond the training maximum\"},\"correct\":true,\"why\":{\"es\":\"Gana porque cada hoja guarda valores del train: por grande que sea la casa, cae en las hojas del extremo y recibe su promedio.\",\"en\":\"It wins because each leaf holds training values: however big the house, it lands in the extreme leaves and gets their average.\"}}],\"takeaway\":{\"es\":\"Los árboles interpolan; para extrapolar, cambia de modelo o consigue datos de ese rango.\",\"en\":\"Trees interpolate; to extrapolate, change the model or get data from that range.\"}},{\"id\":\"s3-ck4\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"advanced\",\"tags\":[\"boosting\",\"hiperparametros\"],\"prompt\":{\"es\":\"Tu LightGBM con 5.000 árboles, learning rate 0.3 y árboles muy profundos da AUC 0.99 en train y 0.78 en validación, con 20.000 filas. Tienes una semana y no puedes conseguir más datos. ¿Qué ajustas primero?\",\"en\":\"Your LightGBM with 5,000 trees, learning rate 0.3 and very deep trees scores AUC 0.99 on train and 0.78 on validation, with 20,000 rows. You have a week and cannot get more data. What do you tune first?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Duplicar el número de árboles para que el modelo «termine de aprender»\",\"en\":\"Double the number of trees so the model “finishes learning”\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que falta entrenamiento. El boosting sigue corrigiendo errores en serie; más árboles ajustan más ruido y agrandan la brecha.\",\"en\":\"The wrong assumption: that it needs more training. Boosting keeps fixing errors in series; more trees fit more noise and widen the gap.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Cambiar a una red neuronal profunda\",\"en\":\"Switch to a deep neural network\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que cambiar de familia arregla el sobreajuste. No ataca la causa, y en tablas de este tamaño una red rara vez gana a un boosting bien ajustado.\",\"en\":\"The wrong assumption: that changing family fixes overfitting. It does not address the cause, and on tables this size a network rarely beats well-tuned boosting.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Bajar la learning rate, limitar la complejidad de cada árbol (profundidad, mínimo de ejemplos por hoja) y dejar que early stopping en validación elija cuántos árboles usar\",\"en\":\"Lower the learning rate, limit each tree's complexity (depth, minimum examples per leaf) and let early stopping on validation choose how many trees to use\"},\"correct\":true,\"why\":{\"es\":\"Gana porque pasos más pequeños y árboles más simples reducen la varianza, y early stopping corta cuando la validación deja de mejorar.\",\"en\":\"It wins because smaller steps and simpler trees reduce variance, and early stopping halts when validation stops improving.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Quitar el conjunto de validación y entrenar con todo para tener más datos\",\"en\":\"Drop the validation set and train on everything to have more data\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que medir sobra. Te quedas sin forma de detectar el sobreajuste; la brecha seguiría ahí, solo que invisible.\",\"en\":\"The wrong assumption: that measuring is optional. You lose the way to detect overfitting; the gap would still be there, just invisible.\"}}],\"takeaway\":{\"es\":\"En boosting, learning rate y número de árboles se ajustan juntos, con early stopping como árbitro.\",\"en\":\"In boosting, learning rate and number of trees are tuned together, with early stopping as referee.\"}}],\"refs\":[{\"quiz\":{\"es\":\"ml-fundamentals-es\",\"en\":\"ml-fundamentals\"},\"ids\":[\"37\",\"31\",\"33\"]}],\"questions\":[{\"key\":\"s3-ck1\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:0:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"s3-ck2\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:1:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:1:takeaway\",\"difficulty\":\"basic\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s3-ck3\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:2:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:2:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"bug_diagnosis\"},{\"key\":\"s3-ck4\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:3:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"architecture_tradeoff\"},{\"key\":\"ml-fundamentals-es::37\",\"prompt\":{\"es\":\"Pese a su nombre, la regresión logística se usa para clasificación. ¿Cómo convierte una combinación lineal de features en una predicción?\",\"en\":\"Despite its name, logistic regression is used for classification. How does it turn a linear combination of features into a prediction?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Pasa la puntuación lineal por una función sigmoide, que produce una probabilidad entre 0 y 1, y luego la compara con un umbral\",\"en\":\"It passes the linear score through a sigmoid function, producing a probability between 0 and 1, which is then compared with a threshold\"}},{\"id\":\"B\",\"text\":{\"es\":\"Redondea la puntuación lineal a la clase entera más cercana\",\"en\":\"It rounds the linear score to the nearest integer class\"}},{\"id\":\"C\",\"text\":{\"es\":\"Ajusta una recta distinta para cada clase y elige la más larga\",\"en\":\"It fits a separate straight line for each class and picks the longest one\"}},{\"id\":\"D\",\"text\":{\"es\":\"Agrupa los datos en clusters y asigna la etiqueta del cluster más grande\",\"en\":\"It clusters the data and assigns the label of the largest cluster\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"La regresión logística calcula z = w·x + b y aplica la función sigmoide σ(z) = 1 / (1 + e^(−z)), que transforma cualquier número real en un valor entre 0 y 1 que se interpreta como la probabilidad de la clase positiva. Se entrena con log loss, y un umbral convierte la probabilidad en una clase. Sus pesos son interpretables: cada uno cambia el logaritmo de las probabilidades relativas (log-odds) de la clase positiva.\",\"en\":\"Logistic regression computes z = w·x + b and applies the sigmoid function σ(z) = 1 / (1 + e^(−z)), which maps any real number to a value between 0 and 1 that is interpreted as the probability of the positive class. It is trained with log loss, and a threshold turns the probability into a class. Its weights are interpretable: each one changes the log-odds of the positive class.\"}},{\"key\":\"ml-fundamentals-es::31\",\"prompt\":{\"es\":\"Cuando un árbol de decisión de clasificación elige con qué feature y umbral dividir un nodo, ¿qué intenta hacer normalmente?\",\"en\":\"When a decision tree for classification chooses which feature and threshold to split a node on, what does it typically try to do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Elegir la feature con el mayor rango numérico\",\"en\":\"Pick the feature with the largest numeric range\"}},{\"id\":\"B\",\"text\":{\"es\":\"Elegir la división que deje los nodos hijos lo más puros posible, por ejemplo minimizando la impureza de Gini o la entropía\",\"en\":\"Pick the split that makes the resulting child nodes as pure as possible, for example by minimizing Gini impurity or entropy\"}},{\"id\":\"C\",\"text\":{\"es\":\"Elegir una feature al azar en cada nodo\",\"en\":\"Pick a random feature at every node\"}},{\"id\":\"D\",\"text\":{\"es\":\"Elegir la división que ponga el mismo número de ejemplos en cada hijo\",\"en\":\"Pick the split that puts the same number of examples in each child\"}}],\"correct\":\"B\",\"explanation\":{\"es\":\"Un árbol de clasificación evalúa las divisiones candidatas y elige la que más reduce la impureza, medida con la impureza de Gini o la entropía (ganancia de información). Un nodo puro contiene ejemplos de una sola clase. Los árboles de regresión usan la misma idea, pero minimizan la varianza o el error cuadrático del objetivo en cada hijo.\",\"en\":\"A classification tree evaluates candidate splits and chooses the one that most reduces impurity, measured with Gini impurity or entropy (information gain). A pure node contains examples of a single class. Regression trees use the same idea but minimize the variance or squared error of the target in each child.\"}},{\"key\":\"ml-fundamentals-es::33\",\"prompt\":{\"es\":\"¿Cómo construye el gradient boosting (como en XGBoost o LightGBM) su conjunto de árboles?\",\"en\":\"How does gradient boosting (as in XGBoost or LightGBM) build its ensemble of trees?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"En secuencia: cada nuevo árbol poco profundo se entrena para corregir los errores (residuos) de los árboles construidos hasta el momento\",\"en\":\"Sequentially: each new shallow tree is trained to correct the errors (residuals) of the trees built so far\"}},{\"id\":\"B\",\"text\":{\"es\":\"En paralelo: cada árbol se entrena de forma independiente con una muestra bootstrap y se promedian los resultados\",\"en\":\"In parallel: every tree is trained independently on a bootstrap sample and the results are averaged\"}},{\"id\":\"C\",\"text\":{\"es\":\"Entrenando un único árbol muy profundo y podándolo\",\"en\":\"By training one very deep tree and pruning it\"}},{\"id\":\"D\",\"text\":{\"es\":\"Agrupando los datos en clusters y entrenando un árbol por cluster\",\"en\":\"By clustering the data and training one tree per cluster\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"El gradient boosting añade árboles de uno en uno. Cada árbol nuevo, normalmente poco profundo, se ajusta a los errores que aún comete el conjunto actual (más exactamente, al gradiente negativo de la pérdida), y su aporte se escala con una tasa de aprendizaje. Esto reduce sobre todo el sesgo. Como sigue ajustando los errores, puede sobreajustar si se añaden demasiados árboles, por eso es habitual usar early stopping con un conjunto de validación.\",\"en\":\"Gradient boosting adds trees one at a time. Each new tree, usually shallow, is fitted to the remaining errors of the current ensemble (more precisely, to the negative gradient of the loss), and its contribution is scaled by a learning rate. This mainly reduces bias. Because it keeps fitting the errors, it can overfit if too many trees are added, so early stopping on a validation set is common.\"}}]},{\"id\":\"s3-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre: explícalo con tus palabras\",\"en\":\"Closing: explain it in your own words\"},\"prompt\":{\"es\":\"Explícale a un compañero en 4–5 frases cuándo empezarías con una regresión logística, cuándo pasarías a un bosque o a un boosting, y qué NO puede hacer un árbol.\",\"en\":\"Explain to a colleague in 4–5 sentences when you would start with logistic regression, when you would move to a forest or boosting, and what a tree CANNOT do.\"},\"keyPoints\":[{\"es\":\"Siempre se compara contra una baseline simple.\",\"en\":\"Always compare against a simple baseline.\"},{\"es\":\"Lineal/logística: rápidas y explicables, pero solo rectas salvo que crees features.\",\"en\":\"Linear/logistic: fast and explainable, but only straight lines unless you build features.\"},{\"es\":\"Árboles: captan curvas e interacciones sin escalar; un árbol solo sin límite memoriza.\",\"en\":\"Trees: capture curves and interactions without scaling; a single unlimited tree memorizes.\"},{\"es\":\"Bosque: árboles en paralelo promediados; boosting: árboles en serie, ajustado con early stopping.\",\"en\":\"Forest: parallel trees averaged; boosting: trees in series, tuned with early stopping.\"},{\"es\":\"Los árboles no extrapolan fuera del rango de entrenamiento.\",\"en\":\"Trees do not extrapolate outside the training range.\"}]}]},{\"id\":\"s4\",\"title\":{\"es\":\"Clases raras: métricas, umbrales y costo de cada error\",\"en\":\"Rare classes: metrics, thresholds and the cost of each error\"},\"objective\":{\"es\":\"Al terminar sabrás evaluar un clasificador cuando la clase importante es rara (PR-AUC, recall, precision en las alertas que se revisan), elegir el umbral por costo en validación y aplicar pesos o remuestreo sin contaminar el test.\",\"en\":\"By the end you will be able to evaluate a classifier when the important class is rare (PR-AUC, recall, precision on the alerts that get reviewed), choose the threshold by cost on validation, and apply weights or resampling without contaminating the test set.\"},\"steps\":[{\"id\":\"s4-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: cuando lo importante es raro\",\"en\":\"Capsule: when what matters is rare\"},\"problem\":{\"es\":\"Con 1% de casos positivos, un modelo puede tener 99% de accuracy y no detectar casi nada; y aunque detecte, la pregunta real es cuántas alertas puedes revisar y cuánto cuesta cada error.\",\"en\":\"With 1% positive cases, a model can reach 99% accuracy and detect almost nothing; and even when it detects, the real question is how many alerts you can review and what each error costs.\"},\"mechanism\":{\"es\":\"Con clases raras, los verdaderos negativos son enormes: dominan la accuracy y mantienen baja la tasa de falsos positivos, así que también la ROC-AUC puede verse excelente. La precision y el recall miran la clase rara, y la PR-AUC (average precision) los resume en todos los umbrales; su referencia es la tasa de positivos, no 0,5. El umbral convierte probabilidades en decisiones: si cada alerta cuesta C_rev y cada caso perdido C_perd, y las probabilidades están calibradas, conviene alertar cuando p \u003e C_rev / C_perd. Pesos de clase o remuestreo ayudan al entrenamiento, pero solo en train: validación y test conservan la proporción real.\",\"en\":\"With rare classes, true negatives are huge: they dominate accuracy and keep the false-positive rate low, so even ROC-AUC can look excellent. Precision and recall focus on the rare class, and PR-AUC (average precision) summarizes them across all thresholds; its reference is the positive rate, not 0.5. The threshold turns probabilities into decisions: if each alert costs C_rev and each missed case C_miss, and probabilities are calibrated, alert when p \u003e C_rev / C_miss. Class weights or resampling help training, but only on train: validation and test keep the real proportion.\"},\"flow\":[{\"es\":\"Split estratificado → modelo → probabilidades en validación\",\"en\":\"Stratified split → model → probabilities on validation\"},{\"es\":\"Costo de revisar y de perder un caso → barrido de umbrales → el de menor costo\",\"en\":\"Cost of reviewing and of missing a case → threshold sweep → the lowest-cost one\"},{\"es\":\"Test una vez: precision, recall y PR-AUC al umbral elegido, junto a la baseline\",\"en\":\"Test once: precision, recall and PR-AUC at the chosen threshold, next to the baseline\"}],\"whenNot\":[{\"es\":\"No uses accuracy, ni solo ROC-AUC, para decidir con 1% de positivos.\",\"en\":\"Do not use accuracy, or ROC-AUC alone, to decide with 1% positives.\"},{\"es\":\"No remuestrees (SMOTE, oversampling) antes del split ni sobre validación o test.\",\"en\":\"Do not resample (SMOTE, oversampling) before the split or on validation or test.\"},{\"es\":\"No elijas el umbral en el test ni lo dejes en 0.5 si los errores cuestan distinto.\",\"en\":\"Do not choose the threshold on test or leave it at 0.5 when errors cost differently.\"}]},{\"id\":\"s4-tarjetas\",\"kind\":\"cards\",\"minutes\":12,\"title\":{\"es\":\"Tarjetas: métricas de clasificación\",\"en\":\"Cards: classification metrics\"},\"deck\":\"fundamentals-ml-entrenamiento\",\"module\":\"m4-clasificacion\",\"cardsEs\":[{\"id\":\"ml-metrica-accuracy\",\"part\":\"m\",\"front\":\"¿Qué es accuracy y cuándo miente?\",\"back\":\"Accuracy es el porcentaje de predicciones correctas: fácil de entender, pero engañosa cuando las clases están desbalanceadas.\\n\\nSi el 98% de los mails no son spam, un modelo que dice SIEMPRE \\\"no spam\\\" tiene 98% de accuracy y no detecta ningún spam.\\n\\nEs útil cuando las clases están razonablemente equilibradas y los errores cuestan parecido. Si no, mira precision, recall y la matriz de confusión.\",\"topic\":\"Accuracy\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-confusion\",\"part\":\"m\",\"front\":\"¿Qué es una matriz de confusión?\",\"back\":\"Una matriz de confusión es una tabla 2×2 (o N×N) que cruza la clase real con la predicha y cuenta aciertos y tipos de error.\\n\\n\\n• VP (true positive): dijo sí y era sí.\\n• VN (true negative): dijo no y era no.\\n• FP (false positive): dijo sí y era no — falsa alarma.\\n• FN (false negative): dijo no y era sí — se le escapó.\\n\\nDe aquí salen precision y recall. Siempre que puedas, mira la matriz: un solo número esconde el tipo de error.\",\"topic\":\"Matriz de confusión\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-precision\",\"part\":\"m\",\"front\":\"¿Qué es precision (precisión)?\",\"back\":\"Precision es la fracción de lo que el modelo marcó como positivo que SÍ lo era: VP / (VP + FP).\\n\\nAlta precision = pocas falsas alarmas. Importa cuando un \\\"sí\\\" es caro: bloquear a un cliente bueno, alertar a un médico, mandar un email de \\\"tu tarjeta fue robada\\\".\\n\\nNo la confundas con accuracy. En español \\\"precisión\\\" se usa para las dos; en el examen, precision = esta fracción.\",\"topic\":\"Precision\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-recall\",\"part\":\"m\",\"front\":\"¿Qué es recall (exhaustividad / sensibilidad)?\",\"back\":\"Recall es la fracción de los positivos REALES que el modelo encontró: VP / (VP + FN).\\n\\nAlto recall = se escapan pocos. Importa cuando un miss es caro: fraude, cáncer, una pieza defectuosa.\\n\\nPrecision y recall tiran en direcciones opuestas: si marcas casi todo como positivo, recall sube y precision cae. El umbral de decisión mueve ese equilibrio.\",\"topic\":\"Recall\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-f1\",\"part\":\"m\",\"front\":\"¿Qué es el F1 y cuándo usarlo?\",\"back\":\"F1 es la media armónica de precision y recall: un solo número que castiga si una de las dos está muy baja.\\n\\nÚsalo cuando las clases están desbalanceadas y te importan los dos tipos de error, o para comparar modelos con un ranking simple. Si un error es mucho más caro que el otro, no uses F1 a ciegas: diseña la métrica con el negocio.\",\"topic\":\"F1\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-umbral\",\"part\":\"m\",\"front\":\"¿Por qué el umbral 0.5 no es sagrado?\",\"back\":\"0.5 solo es el mejor corte si un falso positivo y un falso negativo cuestan lo mismo y las probabilidades están bien calibradas.\\n\\nEl modelo suele devolver una probabilidad; el umbral decide a partir de cuánto dices \\\"sí\\\".\\n\\n• Si un FN es mucho más caro, bajas el umbral (más recall).\\n• Si un FP es caro, lo subes (más precision).\\n\\nEl umbral se elige con el negocio y con el conjunto de validación, no con el default de la librería. Cambiarlo no exige reentrenar.\",\"topic\":\"Umbral de decisión\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-imbalance\",\"part\":\"m\",\"front\":\"¿Qué problema crean las clases desbalanceadas y qué puedes hacer?\",\"back\":\"Con una clase rara (fraude 0.3%), un modelo perezoso que predice siempre la mayoría saca una accuracy altísima sin servir para nada.\\n\\nQué hacer:\\n• Métricas centradas en la clase rara: precision, recall, F1, PR-AUC (la ROC-AUC puede verse optimista).\\n• Elegir el umbral con el negocio, no dejar 0.5.\\n• Pesos de clase o remuestreo, SOLO en train.\\n• Split estratificado para que validación y test tengan positivos.\\n\\nEl objetivo no es \\\"50/50 en el dataset\\\": es acertar los casos que importan.\",\"topic\":\"Clases desbalanceadas\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-auc\",\"part\":\"m\",\"front\":\"¿Qué dice el ROC-AUC, en intuición?\",\"back\":\"La ROC-AUC mide qué tan bien el modelo ORDENA: la probabilidad de que un positivo al azar reciba más puntuación que un negativo al azar.\\n\\n• 0.5 = como lanzar una moneda; 1.0 = orden perfecto.\\n• No depende de un umbral concreto: resume todos.\\n• No dice si las probabilidades están calibradas, solo si el orden es bueno.\\n\\nCuidado: con clases muy raras, la ROC-AUC puede verse excelente aunque la mayoría de las alertas sean falsas. Ahí mira también la curva precision-recall (PR-AUC).\",\"topic\":\"ROC-AUC\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-metrica-umbral-costos\",\"part\":\"m\",\"front\":\"Cada alerta de fraude la revisa una persona, a 5 € por revisión (sea fraude o no). Un fraude que se escapa cuesta 500 €. El modelo da probabilidades bien calibradas. ¿Desde qué probabilidad conviene alertar?\",\"back\":\"Desde p ≈ 0.01: alertar compensa cuando la pérdida esperada que evitas (p × 500 €) supera el costo de revisar (5 €), es decir, p \u003e 5 / 500.\\n\\n• Con ese umbral marcarás muchas transacciones: es lo correcto si los costos son esos.\\n• Valídalo en el conjunto de validación sumando el costo total con varios umbrales.\\n• Si las probabilidades no están calibradas, la fórmula no vale: elige el umbral que minimiza el costo en validación (o calibra primero).\\n\\nError típico: dejar 0.5 porque es el default.\",\"topic\":\"Umbral por costos\",\"origin\":\"ai\",\"group\":\"Métricas\",\"difficulty\":\"advanced\"}],\"cardsEn\":[{\"id\":\"ml-metrica-accuracy\",\"part\":\"m\",\"front\":\"What is accuracy and when does it lie?\",\"back\":\"Accuracy is the percentage of correct predictions: easy to understand, but misleading when classes are imbalanced.\\n\\nIf 98% of email is not spam, a model that ALWAYS says \\\"not spam\\\" has 98% accuracy and catches no spam at all.\\n\\nIt is useful when classes are reasonably balanced and errors cost about the same. Otherwise look at precision, recall, and the confusion matrix.\",\"topic\":\"Accuracy\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-confusion\",\"part\":\"m\",\"front\":\"What is a confusion matrix?\",\"back\":\"A confusion matrix is a 2×2 (or N×N) table that crosses the true class with the predicted one and counts hits and error types.\\n\\n\\n• TP (true positive): said yes and it was yes.\\n• TN (true negative): said no and it was no.\\n• FP (false positive): said yes and it was no — false alarm.\\n• FN (false negative): said no and it was yes — a miss.\\n\\nPrecision and recall come from here. Whenever you can, look at the matrix: a single number hides the error type.\",\"topic\":\"Matriz de confusión\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-precision\",\"part\":\"m\",\"front\":\"What is precision?\",\"back\":\"Precision is the fraction of what the model marked positive that truly was positive: TP / (TP + FP).\\n\\nHigh precision = few false alarms. It matters when a \\\"yes\\\" is expensive: blocking a good customer, paging a doctor, emailing \\\"your card was stolen\\\".\\n\\nDo not confuse it with accuracy.\",\"topic\":\"Precision\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-recall\",\"part\":\"m\",\"front\":\"What is recall (sensitivity)?\",\"back\":\"Recall is the fraction of REAL positives the model found: TP / (TP + FN).\\n\\nHigh recall = few misses. It matters when a miss is expensive: fraud, cancer, a defective part.\\n\\nPrecision and recall pull opposite ways: if you mark almost everything positive, recall rises and precision falls. The decision threshold moves that tradeoff.\",\"topic\":\"Recall\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-f1\",\"part\":\"m\",\"front\":\"What is F1 and when should you use it?\",\"back\":\"F1 is the harmonic mean of precision and recall: one number that punishes you if either is very low.\\n\\nUse it when classes are imbalanced and both error types matter, or to rank models simply. If one error is much more expensive than the other, do not use F1 blindly: design the metric with the business.\",\"topic\":\"F1\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-umbral\",\"part\":\"m\",\"front\":\"Why is the 0.5 threshold not sacred?\",\"back\":\"0.5 is the best cut only if a false positive and a false negative cost the same and the probabilities are well calibrated.\\n\\nThe model usually returns a probability; the threshold decides from what value you say \\\"yes\\\".\\n\\n• If an FN is much more expensive, lower the threshold (more recall).\\n• If an FP is expensive, raise it (more precision).\\n\\nThe threshold is chosen with the business and the validation set, not the library default. Changing it does not require retraining.\",\"topic\":\"Umbral de decisión\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-imbalance\",\"part\":\"m\",\"front\":\"What problem do imbalanced classes create, and what can you do?\",\"back\":\"With a rare class (fraud 0.3%), a lazy model that always predicts the majority gets very high accuracy while being useless.\\n\\nWhat to do:\\n• Metrics focused on the rare class: precision, recall, F1, PR-AUC (ROC-AUC can look optimistic).\\n• Choose the threshold with the business, do not leave 0.5.\\n• Class weights or resampling, on train ONLY.\\n• A stratified split so validation and test contain positives.\\n\\nThe goal is not \\\"50/50 in the dataset\\\": it is catching the cases that matter.\",\"topic\":\"Clases desbalanceadas\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"basic\"},{\"id\":\"ml-metrica-auc\",\"part\":\"m\",\"front\":\"What does ROC-AUC say, intuitively?\",\"back\":\"ROC-AUC measures how well the model RANKS: the probability that a random positive gets a higher score than a random negative.\\n\\n• 0.5 = a coin flip; 1.0 = perfect ranking.\\n• It does not depend on one threshold: it summarizes all of them.\\n• It does not say whether probabilities are calibrated, only whether the order is good.\\n\\nCareful: with very rare classes, ROC-AUC can look excellent even when most alerts are false. Look at the precision-recall curve (PR-AUC) as well.\",\"topic\":\"ROC-AUC\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"intermediate\"},{\"id\":\"ml-metrica-umbral-costos\",\"part\":\"m\",\"front\":\"Every fraud alert is reviewed by a person at €5 per review (fraud or not). A fraud that slips through costs €500. The model outputs well-calibrated probabilities. From what probability should you alert?\",\"back\":\"From p ≈ 0.01: alerting pays off when the expected loss you avoid (p × €500) exceeds the review cost (€5), that is, p \u003e 5 / 500.\\n\\n• With that threshold you will flag many transactions: that is correct if those are the costs.\\n• Check it on the validation set by summing the total cost for several thresholds.\\n• If probabilities are not calibrated, the formula does not hold: pick the threshold that minimizes cost on validation (or calibrate first).\\n\\nTypical mistake: leaving 0.5 because it is the default.\",\"topic\":\"Umbral por costos\",\"origin\":\"ai\",\"group\":\"Métricas\",\"lang\":\"en\",\"esDeck\":\"fundamentals-ml-entrenamiento\",\"difficulty\":\"advanced\"}]},{\"id\":\"s4-practica\",\"kind\":\"practice\",\"minutes\":15,\"title\":{\"es\":\"Práctica: el umbral que minimiza el costo\",\"en\":\"Practice: the threshold that minimizes cost\"},\"scaffolding\":\"high\",\"language\":\"python\",\"instructions\":{\"es\":\"Objetivo: comprobar que con clases raras el accuracy engaña, y elegir el umbral de alerta por lo que cuesta cada error, no por costumbre (0.5).\\n\\nQué haces:\\n1. Copia y ejecuta el ejemplo resuelto. Crea datos sintéticos con solo 1 % de casos positivos y compara una baseline que siempre dice «no» con una regresión logística. Las dos rondan 99 % de accuracy, pero la baseline no detecta ningún positivo (recall 0).\\n2. Completa la plantilla (continúa el mismo script: ejecútala después del ejemplo). Separa un conjunto de VALIDACIÓN, prueba varios umbrales y quédate con el más barato: cada alerta revisada cuesta 5 y cada positivo que se escapa cuesta 500. Hay dos TODO: calcular el costo y guardar el mejor umbral.\\n3. Mira el resultado del umbral elegido en test, una sola vez, y compara su recall con el del umbral 0.5.\\n\\nQué escribes en el cuadro: tu código, la tabla de umbrales que imprimió y el umbral elegido.\",\"en\":\"Goal: check that accuracy is misleading with rare classes, and pick the alert threshold by what each error costs, not by habit (0.5).\\n\\nWhat you do:\\n1. Copy and run the worked example. It builds synthetic data with only 1% positive cases and compares a baseline that always says «no» with a logistic regression. Both score around 99% accuracy, but the baseline detects no positives at all (recall 0).\\n2. Complete the template (it continues the same script: run it after the example). Split off a VALIDATION set, try several thresholds and keep the cheapest: each reviewed alert costs 5 and each missed positive costs 500. There are two TODOs: compute the cost and store the best threshold.\\n3. Look at the chosen threshold's result on test, once, and compare its recall with the 0.5 threshold's.\\n\\nWhat you write in the box: your code, the threshold table it printed and the chosen threshold.\"},\"workedExample\":\"$10\",\"starter\":\"# Continues the worked example (X_tr, y_tr, X_te, y_te already exist)\\nX_fit, X_val, y_fit, y_val = train_test_split(X_tr, y_tr, test_size=0.3, stratify=y_tr, random_state=0)\\nmodel = LogisticRegression(max_iter=1000).fit(X_fit, y_fit)\\np_val = model.predict_proba(X_val)[:, 1]\\n\\nCOST_REVIEW, COST_MISSED = 5, 500   # every alert is reviewed; each missed positive costs 500\\nbest = None\\nfor t in [0.5, 0.2, 0.1, 0.05, 0.02, 0.01]:\\n    alert = p_val \u003e= t\\n    n_alerts = int(alert.sum())\\n    missed = int(((~alert) \u0026 (y_val == 1)).sum())\\n    cost = ...  # TODO: n_alerts * COST_REVIEW + missed * COST_MISSED\\n    print(f\\\"t={t:\u003c5} alerts={n_alerts:5d} missed={missed:3d} cost={cost}\\\")\\n    # TODO: if this is the lowest cost so far, store (cost, t) in best\\n\\nt_best = best[1]\\np_te = model.predict_proba(X_te)[:, 1]\\nprint(\\\"chosen threshold:\\\", t_best)\\nprint(f\\\"test recall at 0.5: {recall_score(y_te, p_te \u003e= 0.5):.2f} | at chosen: {recall_score(y_te, p_te \u003e= t_best):.2f}\\\")\",\"solution\":\"# Continues the worked example (X_tr, y_tr, X_te, y_te already exist)\\nX_fit, X_val, y_fit, y_val = train_test_split(X_tr, y_tr, test_size=0.3, stratify=y_tr, random_state=0)\\nmodel = LogisticRegression(max_iter=1000).fit(X_fit, y_fit)\\np_val = model.predict_proba(X_val)[:, 1]\\n\\nCOST_REVIEW, COST_MISSED = 5, 500   # every alert is reviewed; each missed positive costs 500\\nbest = None\\nfor t in [0.5, 0.2, 0.1, 0.05, 0.02, 0.01]:\\n    alert = p_val \u003e= t\\n    n_alerts = int(alert.sum())\\n    missed = int(((~alert) \u0026 (y_val == 1)).sum())\\n    cost = n_alerts * COST_REVIEW + missed * COST_MISSED\\n    print(f\\\"t={t:\u003c5} alerts={n_alerts:5d} missed={missed:3d} cost={cost}\\\")\\n    if best is None or cost \u003c best[0]:\\n        best = (cost, t)\\n\\nt_best = best[1]\\np_te = model.predict_proba(X_te)[:, 1]\\nprint(\\\"chosen threshold:\\\", t_best)\\nprint(f\\\"test recall at 0.5: {recall_score(y_te, p_te \u003e= 0.5):.2f} | at chosen: {recall_score(y_te, p_te \u003e= t_best):.2f}\\\")\\n# chosen threshold: 0.02 · test recall at 0.5: 0.43 | at chosen: 0.80\",\"criteria\":[{\"es\":\"La baseline imprime accuracy 0.990 y recall 0.00: alto acierto sin detectar nada.\",\"en\":\"The baseline prints accuracy 0.990 and recall 0.00: high accuracy while detecting nothing.\"},{\"es\":\"El barrido imprime alertas, casos perdidos y costo por umbral en VALIDACIÓN, y el elegido es el de menor costo (con estas semillas, 0.02).\",\"en\":\"The sweep prints alerts, missed cases and cost per threshold on VALIDATION, and the chosen one is the lowest-cost one (with these seeds, 0.02).\"},{\"es\":\"En test, el recall al umbral elegido supera al de 0.5 (≈0.80 frente a ≈0.43).\",\"en\":\"On test, recall at the chosen threshold beats the 0.5 one (≈0.80 vs ≈0.43).\"}]},{\"id\":\"s4-escenarios\",\"kind\":\"scenarios\",\"minutes\":8,\"title\":{\"es\":\"Escenarios: medir lo que importa\",\"en\":\"Scenarios: measuring what matters\"},\"items\":[{\"id\":\"s4-q1\",\"type\":\"metric_selection\",\"difficulty\":\"basic\",\"tags\":[\"validacion\",\"desbalance\"],\"prompt\":{\"es\":\"Tienes 1.000 pacientes y solo 30 tienen la enfermedad. Con un split 80/20 al azar, el test quedó con 2 positivos y el recall salta entre 0%, 50% y 100% según la semilla. Debes reportar un número estable al comité. ¿Qué cambias primero?\",\"en\":\"You have 1,000 patients and only 30 have the disease. With a random 80/20 split the test set ended up with 2 positives, and recall jumps between 0%, 50% and 100% depending on the seed. You must report a stable number to the committee. What do you change first?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Duplicar los positivos en todo el dataset antes de dividir\",\"en\":\"Duplicate the positives in the whole dataset before splitting\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que más positivos en cualquier sitio ayudan. Remuestrear antes del split mete copias del mismo paciente en train y test (fuga) y falsea la proporción real del test.\",\"en\":\"The wrong assumption: that more positives anywhere help. Resampling before the split puts copies of the same patient in train and test (leakage) and distorts the test's real proportion.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Usar accuracy, que es más estable\",\"en\":\"Use accuracy, which is more stable\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: estable = útil. Con 3% de positivos, decir siempre «sano» ya da 97%: estable, pero no dice nada de lo que importa.\",\"en\":\"The wrong assumption: stable = useful. With 3% positives, always saying “healthy” already gives 97%: stable, but silent about what matters.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Un split estratificado (y mejor, validación cruzada estratificada), para que cada parte conserve el 3% de positivos\",\"en\":\"A stratified split (better, stratified cross-validation), so every part keeps the 3% of positives\"},\"correct\":true,\"why\":{\"es\":\"Gana porque stratify mantiene la proporción en cada parte, y la CV estratificada usa los 30 positivos para evaluar, dando un recall promedio con su desviación.\",\"en\":\"It wins because stratify keeps the proportion in every part, and stratified CV uses all 30 positives for evaluation, giving an average recall with its spread.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Subir el test al 50% de los datos\",\"en\":\"Raise the test set to 50% of the data\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que el tamaño basta. Deja menos ejemplos para entrenar y, sin estratificar, cuántos positivos caen en test sigue dependiendo del azar.\",\"en\":\"The wrong assumption: that size is enough. It leaves fewer examples to train on and, without stratifying, how many positives land in test still depends on chance.\"}}],\"takeaway\":{\"es\":\"Con pocos positivos, estratifica y promedia folds antes de creerte un recall.\",\"en\":\"With few positives, stratify and average folds before trusting a recall.\"}},{\"id\":\"s4-q2\",\"type\":\"metric_selection\",\"difficulty\":\"intermediate\",\"tags\":[\"metricas\",\"operaciones\"],\"prompt\":{\"es\":\"Un equipo antifraude de 3 personas puede revisar 100 alertas al día entre 200.000 transacciones diarias. Te piden comparar dos modelos y elegir uno para ese equipo. ¿Qué métrica refleja mejor el valor real para ellos?\",\"en\":\"A 3-person fraud team can review 100 alerts a day out of 200,000 daily transactions. You are asked to compare two models and pick one for that team. Which metric best reflects the real value for them?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"La precision en las 100 transacciones con mayor puntuación de cada día (precision@100)\",\"en\":\"Precision on each day's 100 highest-scoring transactions (precision@100)\"},\"correct\":true,\"why\":{\"es\":\"Gana porque mide exactamente lo que el equipo usará: cuántos fraudes reales hay entre los 100 casos que podrá revisar.\",\"en\":\"It wins because it measures exactly what the team will use: how many real frauds are among the 100 cases it can review.\"}},{\"id\":\"B\",\"text\":{\"es\":\"La accuracy global sobre las 200.000 transacciones\",\"en\":\"Overall accuracy on the 200,000 transactions\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que un número global sirve para todo. La dominan las transacciones legítimas; dos modelos muy distintos pueden empatar.\",\"en\":\"The wrong assumption: that one global number fits all. Legitimate transactions dominate it; two very different models can tie.\"}},{\"id\":\"C\",\"text\":{\"es\":\"El recall con el umbral 0.5 por defecto\",\"en\":\"Recall at the default 0.5 threshold\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que 0.5 tiene algo que ver con la capacidad del equipo. Ese umbral puede generar 5 o 5.000 alertas al día.\",\"en\":\"The wrong assumption: that 0.5 relates to the team's capacity. That threshold may produce 5 or 5,000 alerts a day.\"}},{\"id\":\"D\",\"text\":{\"es\":\"La ROC-AUC, porque no depende del umbral\",\"en\":\"ROC-AUC, because it does not depend on the threshold\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que resumir todos los umbrales es mejor. Incluye umbrales que nunca usarás; dos modelos con la misma ROC-AUC pueden diferir mucho en el top 100.\",\"en\":\"The wrong assumption: that summarizing every threshold is better. It includes thresholds you will never use; two models with the same ROC-AUC can differ a lot in the top 100.\"}}],\"takeaway\":{\"es\":\"Elige la métrica que imita la decisión real: si se revisan k casos, mide la precisión en esos k.\",\"en\":\"Pick the metric that mimics the real decision: if k cases get reviewed, measure precision on those k.\"}}],\"questions\":[{\"key\":\"s4-q1\",\"prompt\":\"$6:props:flow:stages:3:steps:3:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:3:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:3:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:3:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:3:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:0:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:3:steps:3:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"metric_selection\"},{\"key\":\"s4-q2\",\"prompt\":\"$6:props:flow:stages:3:steps:3:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:3:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:3:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:3:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:3:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:1:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:3:steps:3:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"metric_selection\"}]},{\"id\":\"s4-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: el test que se volvió 50/50\",\"en\":\"Lab: the test set that became 50/50\"},\"language\":\"python\",\"symptom\":{\"es\":\"El modelo de fraude reporta en test precision 0.85 y recall 0.90. En producción, con 1% de fraude real, la precision cae a 0.20: cuatro de cada cinco alertas son falsas. El código del modelo no cambió y los datos se parecen a los de entrenamiento.\",\"en\":\"The fraud model reports test precision 0.85 and recall 0.90. In production, with 1% real fraud, precision falls to 0.20: four out of five alerts are false. The model code did not change and the data look like the training data.\"},\"artifact\":\"from imblearn.over_sampling import SMOTE\\n\\nX, y = load_transactions()                                   # 1 % fraude / 1% fraud\\nX_bal, y_bal = SMOTE(random_state=0).fit_resample(X, y)      # ahora 50 % fraude / now 50% fraud\\n\\nX_tr, X_te, y_tr, y_te = train_test_split(X_bal, y_bal, test_size=0.2, random_state=0)\\nmodel = GradientBoostingClassifier().fit(X_tr, y_tr)\\npred = model.predict(X_te)\\nprint(precision_score(y_te, pred), recall_score(y_te, pred))   # -\u003e 0.85 0.90\",\"question\":{\"es\":\"¿Cuál es la causa raíz?\",\"en\":\"What is the root cause?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El GradientBoosting sobreajusta; hay que bajar su profundidad\",\"en\":\"GradientBoosting overfits; its depth must be lowered\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir síntomas. El sobreajuste bajaría el test respecto a train; aquí el test está inflado frente a producción por cómo se construyó.\",\"en\":\"The wrong assumption: mixing up symptoms. Overfitting would lower test relative to train; here the test is inflated versus production because of how it was built.\"}},{\"id\":\"B\",\"text\":{\"es\":\"En producción hubo drift y hay que reentrenar cada semana\",\"en\":\"There was drift in production and you must retrain weekly\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: culpar al mundo. Los datos se parecen; la diferencia ya estaba en el diseño del experimento.\",\"en\":\"The wrong assumption: blaming the world. The data look alike; the difference was already in the experiment's design.\"}},{\"id\":\"C\",\"text\":{\"es\":\"La precision es la métrica equivocada; hay que reportar accuracy\",\"en\":\"Precision is the wrong metric; accuracy should be reported\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: cambiar de métrica en vez de de test. Con 1% de fraude la accuracy informaría aún menos; la precision es correcta, medida sobre el test equivocado.\",\"en\":\"The wrong assumption: changing the metric instead of the test set. With 1% fraud accuracy would say even less; precision is right, measured on the wrong test set.\"}},{\"id\":\"D\",\"text\":{\"es\":\"SMOTE se aplicó antes del split: el test quedó con 50% de fraude sintético (generado a partir de vecinos que también acabaron en test), en vez del 1% real\",\"en\":\"SMOTE was applied before the split: the test set ended up with 50% synthetic fraud (generated from neighbors that also landed in test), instead of the real 1%\"},\"correct\":true,\"why\":{\"es\":\"Gana porque la precision depende de cuántos positivos hay: con 50% de fraude sale mucho más alta que con 1%. Además, los sintéticos interpolan vecinos que caen a ambos lados del split, una fuga.\",\"en\":\"It wins because precision depends on how many positives there are: with 50% fraud it is far higher than with 1%. On top of that, the synthetic points interpolate neighbors on both sides of the split, a leak.\"}}],\"rootCause\":{\"es\":\"El remuestreo se hizo sobre todo el dataset antes de dividir. El test dejó de parecerse a producción (50% de fraude en vez de 1%) y la precision, que depende de la proporción de positivos, salió inflada. Además, los ejemplos sintéticos se crean interpolando vecinos que pueden quedar a ambos lados del split.\",\"en\":\"Resampling was done on the whole dataset before splitting. The test set stopped looking like production (50% fraud instead of 1%), and precision, which depends on the positive proportion, came out inflated. Also, synthetic examples are created by interpolating neighbors that may end up on both sides of the split.\"},\"fix\":\"X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.2, stratify=y, random_state=0)   # split PRIMERO / FIRST\\nX_tr_bal, y_tr_bal = SMOTE(random_state=0).fit_resample(X_tr, y_tr)                       # solo train / train only\\nmodel = GradientBoostingClassifier().fit(X_tr_bal, y_tr_bal)\\npred = model.predict(X_te)                                       # test con el 1 % real / test keeps the real 1%\\nprint(precision_score(y_te, pred), recall_score(y_te, pred))\",\"fixNote\":{\"es\":\"Con validación cruzada, mete SMOTE en un Pipeline de imbalanced-learn para que solo se aplique a la parte de train de cada fold. Alternativa sin remuestrear: class_weight y elegir el umbral por costo.\",\"en\":\"With cross-validation, put SMOTE inside an imbalanced-learn Pipeline so it only touches each fold's training part. A no-resampling alternative: class_weight and choosing the threshold by cost.\"},\"questions\":[{\"key\":\"s4-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:3:steps:4:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:4:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:4:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:4:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:4:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:4:options:3:why\"}],\"correct\":\"D\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s4-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":12,\"title\":{\"es\":\"Checkpoint: clases raras y umbrales\",\"en\":\"Checkpoint: rare classes and thresholds\"},\"items\":[{\"id\":\"s4-ck1\",\"type\":\"metric_selection\",\"difficulty\":\"basic\",\"tags\":[\"metricas\",\"ranking\"],\"prompt\":{\"es\":\"Comparas dos modelos de abandono en el mismo test: el modelo X tiene ROC-AUC 0.50 y el modelo Y 0.85. Tu jefe pregunta qué significa ese 0.50. ¿Qué respondes?\",\"en\":\"You compare two churn models on the same test set: model X has ROC-AUC 0.50 and model Y 0.85. Your manager asks what that 0.50 means. What do you answer?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Que X acierta la mitad de las veces, igual que Y acierta el 85%\",\"en\":\"That X is right half the time, just as Y is right 85% of the time\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: leerla como porcentaje de aciertos. La ROC-AUC mide orden, no aciertos.\",\"en\":\"The wrong assumption: reading it as percent correct. ROC-AUC measures ranking, not hits.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Que X está perfectamente calibrado\",\"en\":\"That X is perfectly calibrated\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que mide calibración. La ROC-AUC solo depende del orden de las puntuaciones.\",\"en\":\"The wrong assumption: that it measures calibration. ROC-AUC only depends on the order of the scores.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Que X solo es inútil con el umbral 0.5; con otro umbral puede ser excelente\",\"en\":\"That X is only useless at the 0.5 threshold; at another threshold it may be excellent\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que depende de un umbral. La ROC-AUC ya resume todos; 0.5 significa que ninguno ayuda.\",\"en\":\"The wrong assumption: that it depends on one threshold. ROC-AUC already summarizes them all; 0.5 means none helps.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Que X ordena igual que el azar: la probabilidad de que puntúe más alto a un cliente que abandona que a uno que se queda es 0.5\",\"en\":\"That X ranks like chance: the probability that it scores a churner higher than a staying customer is 0.5\"},\"correct\":true,\"why\":{\"es\":\"Gana porque esa es la interpretación de la ROC-AUC; Y, con 0.85, ordena bastante mejor que el azar.\",\"en\":\"It wins because that is what ROC-AUC means; Y, at 0.85, ranks much better than chance.\"}}],\"takeaway\":{\"es\":\"ROC-AUC = probabilidad de ordenar bien un par positivo-negativo; 0.5 es azar.\",\"en\":\"ROC-AUC = probability of ranking a positive–negative pair correctly; 0.5 is chance.\"}},{\"id\":\"s4-ck2\",\"type\":\"metric_selection\",\"difficulty\":\"intermediate\",\"tags\":[\"metricas\",\"desbalance\"],\"prompt\":{\"es\":\"Un modelo de fraude (0,1% de fraude) tiene ROC-AUC 0.97, pero el equipo de revisión dice que casi todas sus alertas son falsas. Te piden una métrica para seguirlo mes a mes que refleje ese problema. ¿Cuál?\",\"en\":\"A fraud model (0.1% fraud) has ROC-AUC 0.97, but the review team says almost all its alerts are false. You are asked for a metric to track it month by month that reflects that problem. Which one?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"La especificidad, porque mira los legítimos bien clasificados\",\"en\":\"Specificity, because it looks at correctly classified legitimate cases\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que mirar negativos ayuda aquí. Con millones de legítimos la especificidad sale altísima aunque haya muchas falsas alarmas.\",\"en\":\"The wrong assumption: that looking at negatives helps here. With millions of legitimate cases specificity stays very high despite many false alarms.\"}},{\"id\":\"B\",\"text\":{\"es\":\"La PR-AUC (average precision) y la precision en el umbral de operación\",\"en\":\"PR-AUC (average precision) and precision at the operating threshold\"},\"correct\":true,\"why\":{\"es\":\"Gana porque la precision compara falsas alarmas con fraudes detectados, no con el enorme número de legítimos, así que refleja que las alertas son mayormente falsas.\",\"en\":\"It wins because precision compares false alarms with detected frauds, not with the huge number of legitimate cases, so it reflects that alerts are mostly false.\"}},{\"id\":\"C\",\"text\":{\"es\":\"La accuracy mensual\",\"en\":\"Monthly accuracy\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que un número alto es un buen número. La dominan los legítimos y subiría aunque las alertas empeoren.\",\"en\":\"The wrong assumption: that a high number is a good number. Legitimate cases dominate it, and it could rise while alerts get worse.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Seguir con la ROC-AUC, pero con más decimales\",\"en\":\"Keep ROC-AUC, but with more decimals\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que falta resolución. El problema es lo que mide: la tasa de falsos positivos se mantiene baja porque divide por millones de negativos.\",\"en\":\"The wrong assumption: that it lacks resolution. The problem is what it measures: the false-positive rate stays low because it divides by millions of negatives.\"}}],\"takeaway\":{\"es\":\"Con clases rarísimas, sigue la PR-AUC y la precision de las alertas, no solo la ROC-AUC.\",\"en\":\"With very rare classes, track PR-AUC and alert precision, not just ROC-AUC.\"}},{\"id\":\"s4-ck3\",\"type\":\"metric_selection\",\"difficulty\":\"advanced\",\"tags\":[\"umbrales\",\"costos\"],\"prompt\":{\"es\":\"Cada alerta de fraude la revisa una persona por 5 € (sea fraude o no) y cada fraude que se escapa cuesta 500 €. El modelo da probabilidades bien calibradas. ¿Desde qué probabilidad conviene alertar?\",\"en\":\"Each fraud alert is reviewed by a person for €5 (fraud or not), and each fraud that slips through costs €500. The model outputs well-calibrated probabilities. From what probability should you alert?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Desde 0.5, el valor por defecto\",\"en\":\"From 0.5, the default\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que 0.5 es neutral. Solo es óptimo si los dos errores cuestan lo mismo; aquí perder un fraude cuesta 100 veces más que revisar.\",\"en\":\"The wrong assumption: that 0.5 is neutral. It is optimal only if both errors cost the same; here missing a fraud costs 100 times more than reviewing.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Desde 0.99, para que casi todas las alertas sean fraude\",\"en\":\"From 0.99, so almost every alert is fraud\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: maximizar precision a toda costa. Deja escapar casi todos los fraudes, que son el costo grande.\",\"en\":\"The wrong assumption: maximizing precision at any price. It lets almost all fraud through, which is the big cost.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Desde 0.01: alertar compensa cuando la pérdida esperada que evitas (p × 500 €) supera los 5 € de revisar\",\"en\":\"From 0.01: alerting pays when the expected loss you avoid (p × €500) exceeds the €5 review\"},\"correct\":true,\"why\":{\"es\":\"Gana porque p × 500 \u003e 5 equivale a p \u003e 0.01; con probabilidades calibradas esa es la regla de mínimo costo esperado, que luego se confirma en validación.\",\"en\":\"It wins because p × 500 \u003e 5 is equivalent to p \u003e 0.01; with calibrated probabilities that is the minimum-expected-cost rule, later confirmed on validation.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Desde el umbral que maximiza la F1 en el test\",\"en\":\"From the threshold that maximizes F1 on test\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que F1 refleja el negocio. F1 no usa los costos de 5 € y 500 €, y elegir el umbral en test lo contamina.\",\"en\":\"The wrong assumption: that F1 reflects the business. F1 ignores the €5 and €500 costs, and picking the threshold on test contaminates it.\"}}],\"takeaway\":{\"es\":\"Con probabilidades calibradas, alerta cuando p supere costo de revisar / costo de perder el caso.\",\"en\":\"With calibrated probabilities, alert when p exceeds review cost / cost of missing the case.\"}},{\"id\":\"s4-ck4\",\"type\":\"bug_diagnosis\",\"difficulty\":\"advanced\",\"tags\":[\"calibracion\",\"desbalance\"],\"prompt\":{\"es\":\"Entrenaste una regresión logística de impago con class_weight=\\\"balanced\\\" (5% de impagos) para mejorar el recall. Ahora finanzas usa sus probabilidades directamente para fijar precios por riesgo, y nota que la probabilidad media predicha está muy por encima del 5% real, también en los datos de entrenamiento. ¿Qué pasa?\",\"en\":\"You trained a default-prediction logistic regression with class_weight=\\\"balanced\\\" (5% defaults) to improve recall. Finance now uses its probabilities directly to price risk, and notices the average predicted probability is far above the real 5%, even on the training data. What is going on?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Los pesos de clase hicieron que el modelo aprendiera como si las clases estuvieran equilibradas: sus probabilidades ya no están calibradas; hay que recalibrarlas (por ejemplo con CalibratedClassifierCV) o entrenar sin pesos y mover el umbral\",\"en\":\"Class weights made the model learn as if the classes were balanced: its probabilities are no longer calibrated; recalibrate them (for example with CalibratedClassifierCV) or train without weights and move the threshold\"},\"correct\":true,\"why\":{\"es\":\"Gana porque los pesos sirven para detectar mejor la clase rara, pero sesgan las probabilidades hacia ella; para usarlas como riesgo hay que calibrarlas.\",\"en\":\"It wins because weights help detect the rare class but bias probabilities toward it; to use them as risk you must calibrate them.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Hay fuga de datos en las features de impago\",\"en\":\"There is data leakage in the default features\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: confundir síntomas. La fuga inflaría la evaluación; aquí las probabilidades suben de forma sistemática por el peso que tú impusiste.\",\"en\":\"The wrong assumption: mixing up symptoms. Leakage would inflate evaluation; here probabilities rise systematically because of the weight you imposed.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Es data drift: los clientes nuevos son más riesgosos\",\"en\":\"It is data drift: new customers are riskier\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: culpar al mundo. El desajuste aparece también en los datos de entrenamiento, no solo en clientes nuevos.\",\"en\":\"The wrong assumption: blaming the world. The mismatch appears on the training data too, not only on new customers.\"}},{\"id\":\"D\",\"text\":{\"es\":\"El modelo sobreajusta; hay que añadir regularización\",\"en\":\"The model overfits; add regularization\"},\"correct\":false,\"why\":{\"es\":\"La suposición errónea: que todo error es sobreajuste. El sobreajuste no explica un sesgo sistemático hacia arriba en todas las probabilidades.\",\"en\":\"The wrong assumption: that every error is overfitting. Overfitting does not explain a systematic upward bias in all probabilities.\"}}],\"takeaway\":{\"es\":\"Pesar clases mejora la detección, pero rompe la calibración: recalibra antes de usar probabilidades como riesgo.\",\"en\":\"Weighting classes improves detection but breaks calibration: recalibrate before using probabilities as risk.\"}}],\"refs\":[{\"quiz\":{\"es\":\"ml-fundamentals-es\",\"en\":\"ml-fundamentals\"},\"ids\":[\"13\",\"18\",\"29\"]}],\"questions\":[{\"key\":\"s4-ck1\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:0:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"metric_selection\"},{\"key\":\"s4-ck2\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:1:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"metric_selection\"},{\"key\":\"s4-ck3\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:2:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:2:takeaway\",\"difficulty\":\"advanced\",\"type\":\"metric_selection\"},{\"key\":\"s4-ck4\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:3:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"bug_diagnosis\"},{\"key\":\"ml-fundamentals-es::13\",\"prompt\":{\"es\":\"En un dataset de fraude, el 99,5% de las transacciones son legítimas. Un modelo que predice 'legítima' para todas las transacciones alcanza un 99,5% de exactitud. ¿Qué demuestra esto?\",\"en\":\"In a fraud dataset, 99.5% of transactions are legitimate. A model that predicts 'legitimate' for every transaction reaches 99.5% accuracy. What does this show?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Que el modelo es excelente y está listo para producción\",\"en\":\"The model is excellent and ready for production\"}},{\"id\":\"B\",\"text\":{\"es\":\"Que la exactitud engaña con datos desbalanceados; se necesitan métricas como precision, recall o PR AUC\",\"en\":\"Accuracy is misleading on imbalanced data; metrics such as precision, recall or PR AUC are needed\"}},{\"id\":\"C\",\"text\":{\"es\":\"Que el dataset necesita más transacciones legítimas\",\"en\":\"The dataset needs more legitimate transactions\"}},{\"id\":\"D\",\"text\":{\"es\":\"Que la exactitud debe sustituirse por el error cuadrático medio\",\"en\":\"Accuracy should be replaced by mean squared error\"}}],\"correct\":\"B\",\"explanation\":{\"es\":\"Con datos muy desbalanceados, un modelo trivial que siempre predice la clase mayoritaria obtiene una exactitud altísima sin detectar ningún fraude. Es la llamada paradoja de la exactitud. Las métricas centradas en la clase minoritaria, como precision, recall, F1 o el área bajo la curva precision–recall, muestran la utilidad real del modelo.\",\"en\":\"On highly imbalanced data, a trivial model that always predicts the majority class gets very high accuracy while detecting zero fraud. This is known as the accuracy paradox. Metrics that focus on the minority class, such as precision, recall, F1 or the area under the precision–recall curve, show the real usefulness of the model.\"}},{\"key\":\"ml-fundamentals-es::18\",\"prompt\":{\"es\":\"Un modelo de fraude se evalúa con datos en los que solo el 0,1% de las transacciones son fraude. Su ROC AUC es 0,97, pero en la práctica la mayoría de sus alertas son falsas alarmas. ¿Qué métrica reflejaría mejor el rendimiento en la clase rara?\",\"en\":\"A fraud model is evaluated on data where only 0.1% of transactions are fraud. Its ROC AUC is 0.97, but in practice most of its alerts are false alarms. Which metric would better reflect performance on the rare class?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Exactitud\",\"en\":\"Accuracy\"}},{\"id\":\"B\",\"text\":{\"es\":\"Especificidad\",\"en\":\"Specificity\"}},{\"id\":\"C\",\"text\":{\"es\":\"El área bajo la curva precision–recall (PR AUC)\",\"en\":\"The area under the precision–recall curve (PR AUC)\"}},{\"id\":\"D\",\"text\":{\"es\":\"El número de verdaderos negativos\",\"en\":\"The number of true negatives\"}}],\"correct\":\"C\",\"explanation\":{\"es\":\"Con un desbalance extremo, la tasa de falsos positivos se mantiene muy baja aunque los falsos positivos superen a los verdaderos positivos, porque el número de negativos es enorme. Por eso el ROC AUC puede verse excelente mientras la precision es mala. La curva precision–recall se centra en la clase positiva, así que el PR AUC (también llamado average precision) deja ver el problema.\",\"en\":\"With extreme imbalance, the false positive rate stays tiny even when false positives outnumber true positives, because the number of negatives is huge. ROC AUC can therefore look excellent while precision is poor. The precision–recall curve focuses on the positive class, so PR AUC (also called average precision) exposes the problem.\"}},{\"key\":\"ml-fundamentals-es::29\",\"prompt\":{\"es\":\"Un clasificador de impago devuelve probabilidades y, por defecto, un préstamo se marca como riesgoso si la probabilidad supera 0,5. El negocio dice que quiere detectar más préstamos riesgosos, aunque implique revisar más préstamos seguros. ¿Cuál es el cambio más simple, sin reentrenar?\",\"en\":\"A loan-default classifier outputs probabilities, and by default a loan is flagged as risky if the probability is above 0.5. The business says it wants to catch more risky loans, even if it means reviewing more safe ones. What is the simplest change, without retraining?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Subir el umbral de decisión a 0,8\",\"en\":\"Raise the decision threshold to 0.8\"}},{\"id\":\"B\",\"text\":{\"es\":\"Cambiar la función de pérdida a error cuadrático medio\",\"en\":\"Switch the loss function to mean squared error\"}},{\"id\":\"C\",\"text\":{\"es\":\"Bajar el umbral de decisión, por ejemplo a 0,3\",\"en\":\"Lower the decision threshold, for example to 0.3\"}},{\"id\":\"D\",\"text\":{\"es\":\"Quitar la salida de probabilidad y usar solo las etiquetas predichas\",\"en\":\"Remove the probability output and use only the predicted labels\"}}],\"correct\":\"C\",\"explanation\":{\"es\":\"El umbral de decisión convierte las probabilidades en etiquetas. Bajarlo marca más préstamos como riesgosos, lo que aumenta el recall a costa de la precision. El umbral es una decisión de negocio y debe elegirse con el conjunto de validación, por ejemplo con la curva precision–recall o el coste esperado de cada tipo de error. El valor por defecto de 0,5 no tiene nada de especial.\",\"en\":\"The decision threshold converts probabilities into labels. Lowering it flags more loans as risky, which increases recall at the cost of precision. The threshold is a business decision and should be chosen on the validation set, for example using the precision–recall curve or the expected cost of each type of error. The 0.5 default has no special meaning.\"}}]},{\"id\":\"s4-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre: explícalo con tus palabras\",\"en\":\"Closing: explain it in your own words\"},\"prompt\":{\"es\":\"En 4–5 frases, explícale a alguien de negocio por qué un 99% de accuracy puede no valer nada con fraude raro, y cómo eliges el umbral de alerta.\",\"en\":\"In 4–5 sentences, explain to a business person why 99% accuracy can be worthless with rare fraud, and how you pick the alert threshold.\"},\"keyPoints\":[{\"es\":\"Con clases raras, decir siempre «no» ya da una accuracy altísima.\",\"en\":\"With rare classes, always saying “no” already gives very high accuracy.\"},{\"es\":\"Precision = cuántas alertas son reales; recall = cuántos casos reales encuentras.\",\"en\":\"Precision = how many alerts are real; recall = how many real cases you find.\"},{\"es\":\"El umbral se elige con el costo de cada error, en validación, no en test.\",\"en\":\"The threshold is chosen with the cost of each error, on validation, not on test.\"},{\"es\":\"Remuestreo o pesos solo en train; el test conserva la proporción real.\",\"en\":\"Resampling or weights only on train; the test keeps the real proportion.\"}]}]},{\"id\":\"s5\",\"title\":{\"es\":\"Ajustar sin engañarse: regularización, hiperparámetros y validación\",\"en\":\"Tuning without fooling yourself: regularization, hyperparameters and validation\"},\"objective\":{\"es\":\"Al terminar sabrás leer una curva de validación, elegir hiperparámetros con validación cruzada dentro de un pipeline, usar splits temporales o por grupos cuando toca y no sobreajustar ni la validación ni el test.\",\"en\":\"By the end you will be able to read a validation curve, choose hyperparameters with cross-validation inside a pipeline, use time-based or group splits when needed, and overfit neither validation nor test.\"},\"steps\":[{\"id\":\"s5-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: las perillas del modelo\",\"en\":\"Capsule: the model's knobs\"},\"problem\":{\"es\":\"Cada modelo tiene perillas (profundidad, regularización, learning rate) que deciden si memoriza o generaliza. Elegirlas mirando el test, o probando cientos de combinaciones contra una validación pequeña, da números que producción no confirma.\",\"en\":\"Every model has knobs (depth, regularization, learning rate) that decide whether it memorizes or generalizes. Choosing them by looking at the test set, or by trying hundreds of combinations against a small validation set, gives numbers production does not confirm.\"},\"mechanism\":{\"es\":\"La brecha train–validación mide la varianza: si crece al subir la complejidad, sobra capacidad; si ambos números son bajos, falta. La regularización (L1/L2, profundidad máxima, mínimo de ejemplos por hoja, early stopping) recorta capacidad. Los hiperparámetros se eligen con validación cruzada sobre train, con todo el preprocesado dentro de un Pipeline para que cada fold se ajuste solo con su parte. El split debe imitar producción: temporal si predices el futuro, por grupos si un cliente o paciente tiene varias filas. El test se usa una sola vez, al final.\",\"en\":\"The train–validation gap measures variance: if it grows as complexity rises, there is spare capacity; if both numbers are low, capacity is missing. Regularization (L1/L2, maximum depth, minimum examples per leaf, early stopping) trims capacity. Hyperparameters are chosen with cross-validation on train, with all preprocessing inside a Pipeline so each fold is fitted only on its own pa
