 acelerador adecuado, réplicas mínimas suficientes y un modelo más ligero.\\n\\n• Hardware: más CPU o una GPU si el modelo es una red grande.\\n• Colas: suficientes réplicas mínimas para que los picos no esperen a que escale.\\n• Modelo: cuantización, destilación o una arquitectura más pequeña.\\n• Datos: evita consultas lentas por petición (por ejemplo a BigQuery); lee features precalculadas de un almacén online.\\n• Red: endpoint en la misma región que los clientes; Private Service Connect si el tráfico es privado.\\n\\nPista de examen: «latencia alta» casi nunca se arregla reentrenando; se arregla con serving, hardware o features online.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"latencia\"]},{\"id\":\"m2-07\",\"part\":\"m\",\"front\":\"Tienes un modelo nuevo que en validación gana al actual y no quieres arriesgar a todos los clientes. ¿Cómo lo pones en producción sin cortes y con marcha atrás rápida?\",\"back\":\"Despliega el modelo nuevo en el MISMO endpoint con un porcentaje pequeño del tráfico (canary) y súbelo poco a poco mientras comparas métricas; si empeora, devuelves el 100 % al anterior.\\n\\n• El endpoint mantiene su URL: los clientes no cambian nada.\\n• El reparto de tráfico entre modelos desplegados se ajusta sin cortes.\\n• Para un A/B formal, reparte tráfico y compara métricas de negocio entre ambos.\\n• Rolling deployment: reemplaza un modelo desplegado por una versión nueva reutilizando sus recursos.\\n\\nPista de examen: «minimizar riesgo al actualizar» → canary con reparto de tráfico en el mismo endpoint.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"despliegue\"]},{\"id\":\"m5-11\",\"part\":\"m\",\"front\":\"Un banco exige que las peticiones de predicción no salgan a internet público y que los datos no puedan copiarse fuera del perímetro. ¿Cómo expones el endpoint?\",\"back\":\"Usa un endpoint de Private Service Connect para que el tráfico de inferencia vaya por la red privada, y protege el proyecto con un perímetro de VPC Service Controls.\\n\\n• Private Service Connect: los clientes de tu VPC llegan al endpoint por IP privada.\\n• VPC Service Controls: impide exfiltrar datos de los servicios protegidos fuera del perímetro.\\n• Complementos: cuentas de servicio con mínimo privilegio, CMEK y Cloud Audit Logs.\\n• Un endpoint público con reglas de firewall en el cliente no cumple el requisito de «sin internet público».\\n\\nPista de examen: «tráfico privado» → Private Service Connect; «evitar exfiltración» → VPC Service Controls.\",\"topic\":\"Seguridad\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"seguridad\"]},{\"id\":\"m2-03\",\"part\":\"m\",\"front\":\"Hoy un científico ejecuta a mano 6 notebooks en orden para reentrenar. ¿Qué te da Agent Platform Pipelines y cómo se define un pipeline?\",\"back\":\"Agent Platform Pipelines (antes Vertex AI Pipelines) orquesta sin servidores un DAG de pasos de ML definido con el SDK de Kubeflow Pipelines o de TFX, y registra el linaje de cada ejecución.\\n\\n• Defines componentes (preparar datos, entrenar, evaluar, registrar, desplegar), compilas el pipeline a YAML y lo ejecutas.\\n• Google Cloud Pipeline Components ofrece pasos listos para servicios como AutoML o BigQuery.\\n• Los pasos ya ejecutados con las mismas entradas se pueden reutilizar desde caché.\\n• ML Metadata guarda qué datos, parámetros y modelos produjo cada ejecución.\\n\\nPista de examen: «automatizar y repetir el flujo de ML con trazabilidad» → Pipelines; Dataflow procesa datos, no orquesta el ciclo del modelo.\",\"topic\":\"Pipelines\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"pipelines\",\"mlops\"]},{\"id\":\"m5-01\",\"part\":\"m\",\"front\":\"El «modelo ganador» de hace 6 meses vive en un notebook y nadie sabe si sigue acertando. ¿Qué aporta MLOps frente a «entrenar un buen modelo»?\",\"back\":\"MLOps convierte el modelo en un sistema repetible: datos, código y modelos versionados, entrenamiento y despliegue automatizados y monitorización continua en producción.\\n\\n• Repetible: un pipeline reentrena con el mismo procedimiento.\\n• Trazable: registro de modelos, experimentos y linaje.\\n• Seguro de desplegar: evaluación automática frente al modelo actual antes de promover.\\n• Vigilado: monitorización de skew, drift y rendimiento, con alertas.\\n• En Agent Platform: Pipelines, Model Registry, Experiments, endpoints y Model Monitoring.\\n\\nPista de examen: «el modelo se degrada y nadie se entera» → falta monitorización y reentrenamiento automatizado.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"mlops\",\"produccion\"]},{\"id\":\"m2-08\",\"part\":\"m\",\"front\":\"Tu modelo tabular está desplegado en un endpoint y quieres que te avisen si las entradas de producción se alejan de las de entrenamiento o cambian con el tiempo. ¿Qué te da Model Monitoring en Agent Platform?\",\"back\":\"Model Monitoring compara distribuciones de features (y de predicciones o atribuciones) con una referencia y alerta cuando la distancia supera tu umbral.\\n\\n• v1 (GA, configurado sobre el endpoint): skew frente a los datos de entrenamiento (si los aportas) y drift entre periodos de producción.\\n• v2 (Preview, ligado a la versión del modelo en Model Registry): drift de entradas, drift de predicciones y cambio de atribuciones; también para modelos servidos fuera de la plataforma.\\n• Métricas: L-infinity o Jensen-Shannon en categóricas; Jensen-Shannon en numéricas; SHAP para atribuciones.\\n• Está pensado para modelos tabulares.\\n\\nPista de examen: «avisar cuando los datos de producción se desvían» → Model Monitoring con umbrales y alertas.\",\"topic\":\"Monitoring\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"monitorizacion\",\"drift\"]},{\"id\":\"m2-11\",\"part\":\"m\",\"front\":\"En Agent Platform debes configurar explicaciones para (a) una CNN de TensorFlow que clasifica radiografías y (b) un XGBoost tabular de riesgo. ¿Qué método de atribución eliges para cada uno?\",\"back\":\"(a) XRAI o integrated gradients, porque la CNN es diferenciable y trabaja con imágenes; (b) sampled Shapley, porque un ensemble de árboles no es diferenciable.\\n\\n• Sampled Shapley: aproximación por muestreo de los valores de Shapley; para modelos no diferenciables y tabulares.\\n• Integrated gradients: integra gradientes desde una línea base; para redes diferenciables.\\n• XRAI: parte de integrated gradients y agrupa la atribución por regiones de la imagen; suele dar mapas más legibles.\\n• Las explicaciones se configuran al subir o registrar el modelo en Model Registry.\\n• Alternativa: explicaciones basadas en ejemplos (vecinos más parecidos).\\n\\nPista de examen: «árboles» → sampled Shapley; «imágenes» → XRAI o integrated gradients.\",\"topic\":\"Explainable AI\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"explicabilidad\",\"agent-platform\"]},{\"id\":\"m5-02\",\"part\":\"m\",\"front\":\"Cada cambio de código debe probarse solo y el modelo debe reentrenarse cuando lleguen datos nuevos, desplegándose solo si mejora. ¿Cómo encajas CI, CD y CT en GCP?\",\"back\":\"CI prueba y empaqueta con Cloud Build, CT reentrena con Agent Platform Pipelines por calendario o eventos, y CD despliega solo si se supera al modelo actual.\\n\\n• CI: tests, construcción de la imagen en Artifact Registry y compilación del pipeline al cambiar el código.\\n• CT: el pipeline prepara datos, entrena, evalúa y registra una nueva versión en Model Registry.\\n• Puerta de calidad: comparar contra el modelo en producción con los mismos datos de validación.\\n• CD: despliegue canary en el endpoint y paso gradual del tráfico.\\n\\nPista de examen: el despliegue lo decide una métrica en una puerta automática, no una persona mirando un notebook.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"mlops\",\"ci-cd\"]},{\"id\":\"m5-06\",\"part\":\"m\",\"front\":\"Tu pipeline de entrenamiento y tu endpoint corren con la cuenta de servicio predeterminada de Compute Engine, que tiene el rol Editor en el proyecto. ¿Qué riesgo hay y cómo lo corriges?\",\"back\":\"Es sobrepermiso: cualquier fallo o código comprometido en el pipeline puede modificar casi todo el proyecto; usa cuentas de servicio dedicadas con solo los roles que cada paso necesita.\\n\\n• Una cuenta por carga (entrenamiento, pipeline, endpoint) con roles concretos, por ejemplo Agent Platform User y lectura solo de las tablas necesarias.\\n• Evita roles básicos (Owner, Editor) en producción.\\n• Añade VPC Service Controls contra la exfiltración, CMEK si el cumplimiento lo pide y Cloud Audit Logs para saber quién hizo qué.\\n• Revisa periódicamente los permisos no usados.\\n\\nPista de examen: «cuenta predeterminada con Editor» → mínimo privilegio con cuentas dedicadas.\",\"topic\":\"Seguridad\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"seguridad\",\"iam\"]},{\"id\":\"m5-08\",\"part\":\"m\",\"front\":\"Tu equipo entrena un BOOSTED_TREE_CLASSIFIER en BigQuery ML, pero ahora necesita servirlo online, compararlo con un modelo de custom training y vigilar el drift. ¿Cambias de herramienta o las combinas?\",\"back\":\"Las combinas: sigues entrenando en BigQuery ML y registras el modelo en Model Registry para servirlo, compararlo y monitorizarlo con Agent Platform.\\n\\n• BigQuery ML aporta entrenamiento con SQL, TRANSFORM y scoring por lotes con ML.PREDICT.\\n• Model Registry reúne versiones de BigQuery ML y de custom training bajo el mismo modelo.\\n• Endpoint para la inferencia online y Model Monitoring para skew y drift.\\n• Pasa a custom training solo si necesitas una arquitectura o un control que BigQuery ML no da.\\n\\nPista de examen: BigQuery ML y Agent Platform no compiten; el registro los une.\",\"topic\":\"Arquitectura\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"arquitectura\"]},{\"id\":\"m5-09\",\"part\":\"m\",\"front\":\"Tu modelo de demanda se reentrena «cuando alguien se acuerda». Las etiquetas reales llegan con 2 semanas de retraso y el negocio cambia por temporadas. ¿Qué política de reentrenamiento propones?\",\"back\":\"Combina reentrenamiento programado según la estacionalidad con disparadores por drift o caída de rendimiento, siempre con una puerta de evaluación.\\n\\n• Calendario: por ejemplo mensual, alineado con el ritmo del negocio.\\n• Disparadores: alerta de Model Monitoring o caída de la métrica medida con las etiquetas que llegan tarde.\\n• Puerta: el nuevo modelo debe superar al actual en el mismo conjunto reciente.\\n• Reentrenar más a menudo no arregla un skew de preprocesado: primero hay que eliminarlo.\\n\\nPista de examen: la política se elige por la velocidad del cambio y el coste de equivocarse, no por costumbre.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"mlops\",\"reentrenamiento\"]},{\"id\":\"m5-10\",\"part\":\"m\",\"front\":\"Model Monitoring alerta de drift en la feature «importe», pero la precision medida con las etiquetas reales de las últimas 4 semanas no ha cambiado. ¿Reentrenas ya?\",\"back\":\"No de inmediato: el drift indica que las entradas cambiaron, no que el modelo falle; investiga la causa y vigila el rendimiento antes de reentrenar.\\n\\n• Comprueba si el cambio es real (nueva campaña, inflación) o un error de datos (unidades, moneda, nulos).\\n• Mira si cambió la atribución de esa feature: si su peso en las predicciones se mantiene, el impacto puede ser bajo.\\n• Ajusta el umbral si la alerta salta por variaciones esperadas.\\n• Reentrena cuando la métrica con etiquetas caiga o el cambio sea estructural.\\n\\nPista de examen: drift de entradas ≠ caída de rendimiento; el concept drift se confirma con etiquetas.\",\"topic\":\"Monitoring\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"monitorizacion\",\"drift\"]}],\"cardsEn\":[{\"id\":\"m5-03\",\"part\":\"m\",\"front\":\"Two cases: score 50 million customers every Sunday, and answer a checkout in under 100 ms. Batch or online inference for each, and which service do you use?\",\"back\":\"Sunday is batch inference (a batch job over Cloud Storage or BigQuery, no endpoint), and checkout is online inference on a deployed endpoint.\\n\\n• Batch: a job reads the input, writes results and ends; you don't need to deploy the model to an endpoint.\\n• For a BigQuery ML model, the simplest batch path is ML.PREDICT in SQL.\\n• Online: an endpoint with always-on replicas answers request by request at low latency.\\n• Cost: batch pays only while it runs; an online endpoint pays for its minimum replicas even with no traffic.\\n\\nExam cue: «results for tomorrow / large volumes» → batch; «real time / per request» → online.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"serving\",\"costo\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-05\",\"part\":\"m\",\"front\":\"You already have a trained model. Which steps and resources are needed to serve online predictions on Agent Platform?\",\"back\":\"The model must be in Model Registry and is deployed to an endpoint; deployment attaches compute resources (a DeployedModel) to answer at low latency.\\n\\n• Model: the artifact and the inference container (prebuilt or custom).\\n• Endpoint: where requests arrive (dedicated or shared public, or Private Service Connect).\\n• DeployedModel: machine type, accelerators and minimum/maximum replicas.\\n• One endpoint can host several models, and one model can be deployed to several endpoints.\\n• Changing a deployment's compute resources requires redeploying.\\n\\nExam cue: «serve online» → Model Registry → endpoint → deploy with resources.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"serving\",\"agent-platform\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-06\",\"part\":\"m\",\"front\":\"Your model needs custom pre- and post-processing that prebuilt containers don't offer. What must your inference container satisfy for Agent Platform?\",\"back\":\"An HTTP server that listens on 0.0.0.0 on the configured port, answers health checks and serves the prediction route, packaged as an image in Artifact Registry.\\n\\n• Port: the one you declare on the model; the container receives it in AIP_HTTP_PORT.\\n• Health: the AIP_HEALTH_ROUTE path must return 200 when the model is ready.\\n• Prediction: the AIP_PREDICT_ROUTE path receives instances and returns predictions.\\n• The ENTRYPOINT process must keep running; if it starts the server in the background and exits, the container dies.\\n\\nExam cue: «custom inference logic or unsupported framework» → custom container; otherwise a prebuilt one.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"contenedores\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-04\",\"part\":\"m\",\"front\":\"Your endpoint gets 10 requests per second at night and 800 during sales. How does it autoscale on Agent Platform, and what do you control?\",\"back\":\"The endpoint adjusts the number of replicas between the minimum and maximum you configure to keep utilization at its target, by default 60% CPU (or GPU when there are accelerators).\\n\\n• Minimum replicas: capacity always ready and a fixed cost; it must be at least 1 unless you use Scale To Zero.\\n• Maximum replicas: the cost ceiling; quota is reserved for the maximum even when unused.\\n• Other metrics (request count, for example) can be used, and are off by default.\\n• Scaling takes time: if the spike is sudden, raise the minimum before the event.\\n\\nExam cue: «predictable spikes and strict latency» → a higher minimum; «bounded cost» → a maximum replica count.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"escalado\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-07\",\"part\":\"m\",\"front\":\"Your endpoint answers in 450 ms and the SLA is 100 ms. The model is already deployed. Which levers do you have to cut latency?\",\"back\":\"Reduce per-request compute time and queueing: the right machine type or accelerator, enough minimum replicas and a lighter model.\\n\\n• Hardware: more CPU, or a GPU if the model is a large network.\\n• Queueing: enough minimum replicas so spikes don't wait for scaling.\\n• Model: quantization, distillation or a smaller architecture.\\n• Data: avoid slow per-request queries (to BigQuery, for example); read precomputed features from an online store.\\n• Network: an endpoint in the same region as the clients; Private Service Connect if traffic is private.\\n\\nExam cue: «high latency» is almost never fixed by retraining; it is fixed with serving, hardware or online features.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"latencia\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-07\",\"part\":\"m\",\"front\":\"You have a new model that beats the current one in validation, and you don't want to risk every customer. How do you ship it with no downtime and a fast rollback?\",\"back\":\"Deploy the new model to the SAME endpoint with a small share of traffic (canary) and raise it gradually while comparing metrics; if it gets worse, send 100% back to the old one.\\n\\n• The endpoint keeps its URL: clients change nothing.\\n• The traffic split between deployed models is adjusted without downtime.\\n• For a formal A/B test, split traffic and compare business metrics between both.\\n• Rolling deployment: replaces a deployed model with a new version, reusing its resources.\\n\\nExam cue: «minimize risk when updating» → canary with a traffic split on the same endpoint.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"despliegue\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-11\",\"part\":\"m\",\"front\":\"A bank requires prediction requests to stay off the public internet and data to be impossible to copy outside the perimeter. How do you expose the endpoint?\",\"back\":\"Use a Private Service Connect endpoint so inference traffic stays on the private network, and protect the project with a VPC Service Controls perimeter.\\n\\n• Private Service Connect: clients in your VPC reach the endpoint through a private IP.\\n• VPC Service Controls: prevents exfiltrating data from protected services outside the perimeter.\\n• Complements: least-privilege service accounts, CMEK and Cloud Audit Logs.\\n• A public endpoint with client-side firewall rules does not meet the «no public internet» requirement.\\n\\nExam cue: «private traffic» → Private Service Connect; «prevent exfiltration» → VPC Service Controls.\",\"topic\":\"Security\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"seguridad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-03\",\"part\":\"m\",\"front\":\"Today a scientist manually runs 6 notebooks in order to retrain. What does Agent Platform Pipelines give you, and how is a pipeline defined?\",\"back\":\"Agent Platform Pipelines (formerly Vertex AI Pipelines) serverlessly orchestrates a DAG of ML steps defined with the Kubeflow Pipelines or TFX SDK, and records the lineage of every run.\\n\\n• You define components (prepare data, train, evaluate, register, deploy), compile the pipeline to YAML and run it.\\n• Google Cloud Pipeline Components provides ready-made steps for services such as AutoML or BigQuery.\\n• Steps already executed with the same inputs can be reused from the cache.\\n• ML Metadata stores which data, parameters and models each run produced.\\n\\nExam cue: «automate and repeat the ML flow with traceability» → Pipelines; Dataflow processes data, it does not orchestrate the model lifecycle.\",\"topic\":\"Pipelines\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"pipelines\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-01\",\"part\":\"m\",\"front\":\"The «winning model» from 6 months ago lives in a notebook, and nobody knows whether it is still accurate. What does MLOps add beyond «train a good model»?\",\"back\":\"MLOps turns the model into a repeatable system: versioned data, code and models, automated training and deployment, and continuous monitoring in production.\\n\\n• Repeatable: a pipeline retrains with the same procedure.\\n• Traceable: model registry, experiments and lineage.\\n• Safe to deploy: automatic evaluation against the current model before promoting.\\n• Watched: skew, drift and performance monitoring, with alerts.\\n• On Agent Platform: Pipelines, Model Registry, Experiments, endpoints and Model Monitoring.\\n\\nExam cue: «the model degrades and nobody notices» → missing monitoring and automated retraining.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"mlops\",\"produccion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-08\",\"part\":\"m\",\"front\":\"Your tabular model is deployed to an endpoint, and you want alerts if production inputs drift away from training or change over time. What does Model Monitoring on Agent Platform give you?\",\"back\":\"Model Monitoring compares feature distributions (and prediction or attribution distributions) with a baseline and alerts when the distance exceeds your threshold.\\n\\n• v1 (GA, configured on the endpoint): skew versus the training data (if you provide it) and drift across production periods.\\n• v2 (Preview, tied to the model version in Model Registry): input drift, prediction drift and attribution changes; also for models served outside the platform.\\n• Metrics: L-infinity or Jensen-Shannon for categorical features; Jensen-Shannon for numerical; SHAP for attributions.\\n• It is designed for tabular models.\\n\\nExam cue: «alert when production data deviates» → Model Monitoring with thresholds and alerts.\",\"topic\":\"Monitoring\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"monitorizacion\",\"drift\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-11\",\"part\":\"m\",\"front\":\"On Agent Platform you must configure explanations for (a) a TensorFlow CNN that classifies X-rays and (b) a tabular XGBoost risk model. Which attribution method do you pick for each?\",\"back\":\"(a) XRAI or integrated gradients, because the CNN is differentiable and works on images; (b) sampled Shapley, because a tree ensemble is not differentiable.\\n\\n• Sampled Shapley: a sampling approximation of Shapley values; for non-differentiable and tabular models.\\n• Integrated gradients: integrates gradients from a baseline; for differentiable networks.\\n• XRAI: builds on integrated gradients and groups attribution into image regions; usually gives more readable maps.\\n• Explanations are configured when uploading or registering the model in Model Registry.\\n• Alternative: example-based explanations (most similar neighbors).\\n\\nExam cue: «trees» → sampled Shapley; «images» → XRAI or integrated gradients.\",\"topic\":\"Explainable AI\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"explicabilidad\",\"agent-platform\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-02\",\"part\":\"m\",\"front\":\"Every code change must be tested automatically, and the model must retrain when new data arrives, deploying only if it improves. How do CI, CD and CT fit together on GCP?\",\"back\":\"CI tests and packages the code with Cloud Build; CT retrains with an Agent Platform Pipelines pipeline triggered by schedule or events; CD deploys only if evaluation beats the current model.\\n\\n• CI: tests, building the image into Artifact Registry and compiling the pipeline when code changes.\\n• CT: the pipeline prepares data, trains, evaluates and registers a new version in Model Registry.\\n• Quality gate: compare against the production model on the same validation data.\\n• CD: canary deployment on the endpoint and a gradual traffic shift.\\n\\nExam cue: a metric at an automated gate decides the deployment, not a person looking at a notebook.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"mlops\",\"ci-cd\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-06\",\"part\":\"m\",\"front\":\"Your training pipeline and endpoint run as the Compute Engine default service account, which holds the Editor role on the project. What is the risk, and how do you fix it?\",\"back\":\"It is over-permission: any bug or compromised code in the pipeline can modify almost the whole project; use dedicated service accounts with only the roles each step needs.\\n\\n• One account per workload (training, pipeline, endpoint) with specific roles, for example Agent Platform User and read access only to the tables required.\\n• Avoid basic roles (Owner, Editor) in production.\\n• Add VPC Service Controls against exfiltration, CMEK if compliance requires it, and Cloud Audit Logs to know who did what.\\n• Periodically review unused permissions.\\n\\nExam cue: «default account with Editor» → least privilege with dedicated accounts.\",\"topic\":\"Security\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"seguridad\",\"iam\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-08\",\"part\":\"m\",\"front\":\"Your team trains a BOOSTED_TREE_CLASSIFIER in BigQuery ML, but now needs to serve it online, compare it with a custom-trained model and watch for drift. Do you switch tools or combine them?\",\"back\":\"Combine them: keep training in BigQuery ML and register the model in Model Registry to serve, compare and monitor it with Agent Platform.\\n\\n• BigQuery ML provides SQL training, TRANSFORM and batch scoring with ML.PREDICT.\\n• Model Registry gathers BigQuery ML and custom-trained versions under one model.\\n• An endpoint for online inference and Model Monitoring for skew and drift.\\n• Move to custom training only if you need an architecture or control that BigQuery ML does not offer.\\n\\nExam cue: BigQuery ML and Agent Platform don't compete; the registry ties them together.\",\"topic\":\"Architecture\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"arquitectura\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-09\",\"part\":\"m\",\"front\":\"Your demand model is retrained «whenever someone remembers». Real labels arrive 2 weeks late and the business changes by season. What retraining policy do you propose?\",\"back\":\"Combine a schedule aligned with seasonality and triggers from drift alerts or from a performance drop once labels arrive, always with an evaluation gate before deploying.\\n\\n• Schedule: for example monthly, matching the business rhythm.\\n• Triggers: a Model Monitoring alert or a drop in the metric measured with the late labels.\\n• Gate: the new model must beat the current one on the same recent set.\\n• Retraining more often does not fix a preprocessing skew: remove the skew first.\\n\\nExam cue: pick the policy by how fast things change and the cost of being wrong, not by habit.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"mlops\",\"reentrenamiento\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-10\",\"part\":\"m\",\"front\":\"Model Monitoring raises a drift alert on the «amount» feature, but precision measured on real labels over the last 4 weeks hasn't changed. Do you retrain right away?\",\"back\":\"Not immediately: drift says the inputs changed, not that the model is failing; investigate the cause and watch performance before retraining.\\n\\n• Check whether the change is real (a new campaign, inflation) or a data bug (units, currency, nulls).\\n• See whether that feature's attribution changed: if its weight in predictions holds, the impact may be low.\\n• Tune the threshold if the alert fires on expected variation.\\n• Retrain when the label-based metric drops or the change is structural.\\n\\nExam cue: input drift ≠ performance drop; concept drift is confirmed with labels.\",\"topic\":\"Monitoring\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"monitorizacion\",\"drift\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"}]},{\"id\":\"s4-practica\",\"kind\":\"practice\",\"minutes\":15,\"title\":{\"es\":\"Práctica: la puerta de calidad antes de desplegar\",\"en\":\"Practice: the quality gate before deploying\"},\"scaffolding\":\"medium\",\"instructions\":{\"es\":\"Escribe la función que decide, al final del pipeline de reentrenamiento, qué hacer con el modelo nuevo (challenger) frente al de producción (champion), ambos evaluados en el mismo conjunto reciente. Debe promover solo si mejora el PR AUC al menos min_gain sin empeorar el recall más de 0,02, y en ese caso arrancar con un canary del 10 %.\",\"en\":\"Write the function that decides, at the end of the retraining pipeline, what to do with the new model (challenger) versus the production one (champion), both evaluated on the same recent set. It must promote only if PR AUC improves by at least min_gain without recall dropping more than 0.02, and in that case start with a 10% canary.\"},\"starter\":\"def decidir(champion: dict, challenger: dict, min_gain: float = 0.01) -\u003e dict:\\n    \\\"\\\"\\\"champion/challenger: {'pr_auc': float, 'recall': float}\\\"\\\"\\\"\\n    mejora = ...\\n    caida_recall = ...\\n    if ...:\\n        return {'accion': 'canary', 'trafico_nuevo': 10}\\n    return {'accion': ..., 'motivo': ...}\\n\",\"hints\":[{\"es\":\"Compara siempre sobre el mismo conjunto de evaluación; si no, la diferencia no significa nada.\",\"en\":\"Always compare on the same evaluation set; otherwise the difference means nothing.\"},{\"es\":\"Devuelve el motivo del rechazo: el pipeline lo registra para auditoría.\",\"en\":\"Return the rejection reason: the pipeline logs it for auditing.\"}],\"solution\":\"def decidir(champion: dict, challenger: dict, min_gain: float = 0.01) -\u003e dict:\\n    \\\"\\\"\\\"champion/challenger: {'pr_auc': float, 'recall': float}\\\"\\\"\\\"\\n    mejora = challenger['pr_auc'] - champion['pr_auc']\\n    caida_recall = champion['recall'] - challenger['recall']\\n    if mejora \u003e= min_gain and caida_recall \u003c= 0.02:\\n        return {'accion': 'canary', 'trafico_nuevo': 10}\\n    motivo = 'mejora insuficiente' if mejora \u003c min_gain else 'el recall cae demasiado'\\n    return {'accion': 'mantener', 'motivo': motivo}\\n\",\"language\":\"python\",\"criteria\":[{\"es\":\"decidir({'pr_auc': 0.60, 'recall': 0.80}, {'pr_auc': 0.63, 'recall': 0.79}) devuelve canary con 10 % de tráfico.\",\"en\":\"decidir({'pr_auc': 0.60, 'recall': 0.80}, {'pr_auc': 0.63, 'recall': 0.79}) returns canary with 10% traffic.\"},{\"es\":\"decidir({'pr_auc': 0.60, 'recall': 0.80}, {'pr_auc': 0.605, 'recall': 0.85}) devuelve mantener por mejora insuficiente.\",\"en\":\"decidir({'pr_auc': 0.60, 'recall': 0.80}, {'pr_auc': 0.605, 'recall': 0.85}) returns keep due to insufficient gain.\"},{\"es\":\"decidir({'pr_auc': 0.60, 'recall': 0.80}, {'pr_auc': 0.70, 'recall': 0.70}) devuelve mantener porque el recall cae demasiado.\",\"en\":\"decidir({'pr_auc': 0.60, 'recall': 0.80}, {'pr_auc': 0.70, 'recall': 0.70}) returns keep because recall drops too much.\"}]},{\"id\":\"s4-escenarios\",\"kind\":\"scenarios\",\"minutes\":8,\"title\":{\"es\":\"Escenarios: cómo servir y escalar\",\"en\":\"Scenarios: how to serve and scale\"},\"items\":[{\"id\":\"s4-q1\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"basic\",\"tags\":[\"serving\",\"costo\"],\"prompt\":{\"es\":\"Marketing necesita cada domingo la probabilidad de compra de 50 millones de clientes para la campaña del lunes. Nadie consulta el modelo entre semana y el presupuesto es ajustado. ¿Cómo lo sirves?\",\"en\":\"Marketing needs the purchase probability of 50 million customers every Sunday for Monday's campaign. Nobody queries the model during the week and the budget is tight. How do you serve it?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Inferencia por lotes programada el domingo, escribiendo en BigQuery\",\"en\":\"Batch inference scheduled on Sunday, writing to BigQuery\"},\"correct\":true,\"why\":{\"es\":\"Gana: paga solo mientras corre y no necesita endpoint.\",\"en\":\"Wins: it only pays while running and needs no endpoint.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Un endpoint online con 10 réplicas mínimas\",\"en\":\"An online endpoint with 10 minimum replicas\"},\"correct\":false,\"why\":{\"es\":\"Pagas réplicas encendidas toda la semana sin tráfico.\",\"en\":\"You pay for replicas running all week with no traffic.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Llamar al endpoint 50 millones de veces el domingo\",\"en\":\"Call the endpoint 50 million times on Sunday\"},\"correct\":false,\"why\":{\"es\":\"Usa una herramienta de baja latencia para un trabajo masivo y caro.\",\"en\":\"Uses a low-latency tool for a massive, expensive job.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Un notebook que alguien ejecuta a mano\",\"en\":\"A notebook someone runs by hand\"},\"correct\":false,\"why\":{\"es\":\"No es repetible ni fiable para producción.\",\"en\":\"Not repeatable or reliable for production.\"}}],\"takeaway\":{\"es\":\"Resultados para después + gran volumen → batch.\",\"en\":\"Results for later + large volume → batch.\"}},{\"id\":\"s4-q2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"escalado\"],\"prompt\":{\"es\":\"Tu endpoint atiende 10 peticiones por segundo, pero cada Black Friday llega a 800 en minutos y el SLA de 150 ms se rompe mientras escala. El pico es previsible. ¿Qué ajustas?\",\"en\":\"Your endpoint handles 10 requests per second, but every Black Friday it hits 800 within minutes and the 150 ms SLA breaks while it scales. The spike is predictable. What do you adjust?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Bajar el objetivo de CPU al 10 % todo el año\",\"en\":\"Lower the CPU target to 10% all year\"},\"correct\":false,\"why\":{\"es\":\"Mantiene muchas réplicas siempre: caro para un pico de unos días.\",\"en\":\"Keeps many replicas all the time: expensive for a few-day spike.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Reentrenar el modelo con datos de Black Friday\",\"en\":\"Retrain the model with Black Friday data\"},\"correct\":false,\"why\":{\"es\":\"Es un problema de capacidad, no de exactitud.\",\"en\":\"It's a capacity problem, not an accuracy one.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Cambiar a inferencia por lotes\",\"en\":\"Switch to batch inference\"},\"correct\":false,\"why\":{\"es\":\"El checkout necesita respuesta por petición.\",\"en\":\"Checkout needs a per-request answer.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Subir el mínimo de réplicas antes del evento (y el máximo para cubrir el pico) y bajarlo después\",\"en\":\"Raise the minimum replicas before the event (and the maximum to cover the peak), then lower it afterwards\"},\"correct\":true,\"why\":{\"es\":\"Gana: la capacidad ya está lista cuando llega el pico; el autoescalado no tiene que alcanzarlo.\",\"en\":\"Wins: capacity is ready when the spike arrives; autoscaling doesn't have to catch up.\"}}],\"takeaway\":{\"es\":\"Pico previsible → réplicas mínimas preparadas antes; el autoescalado tarda.\",\"en\":\"Predictable spike → minimum replicas ready beforehand; autoscaling takes time.\"}}],\"questions\":[{\"key\":\"s4-q1\",\"prompt\":\"$6:props:flow:stages:3:steps:3:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:3:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:3:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:3:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:3:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:0:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:3:steps:3:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s4-q2\",\"prompt\":\"$6:props:flow:stages:3:steps:3:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:3:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:3:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:3:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:3:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:3:items:1:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:3:steps:3:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"}]},{\"id\":\"s4-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: el pipeline que borró un dataset ajeno\",\"en\":\"Lab: the pipeline that deleted someone else's dataset\"},\"symptom\":{\"es\":\"Un paso de limpieza del pipeline de reentrenamiento borró un dataset de BigQuery de otro equipo. Cloud Audit Logs muestra que la llamada la hizo 1234567890-compute@developer.gserviceaccount.com, y nadie recuerda haberle dado permisos sobre ese dataset.\",\"en\":\"A cleanup step of the retraining pipeline deleted another team's BigQuery dataset. Cloud Audit Logs shows the call was made by 1234567890-compute@developer.gserviceaccount.com, and nobody remembers granting it permissions on that dataset.\"},\"artifact\":\"# Ejecución del pipeline (fragmento)\\npipeline_job:\\n  display_name: churn-retrain\\n  service_account: \\\"\\\"   # vacío: corre con la cuenta predeterminada de Compute Engine\\n\\n# Política IAM del proyecto (fragmento)\\n- role: roles/editor\\n  members:\\n    - serviceAccount:1234567890-compute@developer.gserviceaccount.com\",\"language\":\"yaml\",\"question\":{\"es\":\"¿Cuál es la causa raíz?\",\"en\":\"What is the root cause?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Un bug en el paso de limpieza que hay que corregir y nada más\",\"en\":\"A bug in the cleanup step that just needs fixing\"},\"correct\":false,\"why\":{\"es\":\"El bug existe, pero el daño fue posible porque la identidad tenía permisos de sobra.\",\"en\":\"The bug exists, but the damage was possible because the identity had excess permissions.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Falta VPC Service Controls\",\"en\":\"VPC Service Controls is missing\"},\"correct\":false,\"why\":{\"es\":\"Protege contra exfiltración fuera del perímetro, no contra permisos excesivos dentro del proyecto.\",\"en\":\"Protects against exfiltration outside the perimeter, not against excess permissions inside the project.\"}},{\"id\":\"C\",\"text\":{\"es\":\"El dataset del otro equipo no tenía CMEK\",\"en\":\"The other team's dataset had no CMEK\"},\"correct\":false,\"why\":{\"es\":\"El cifrado no impide que una identidad autorizada borre datos.\",\"en\":\"Encryption doesn't stop an authorized identity from deleting data.\"}},{\"id\":\"D\",\"text\":{\"es\":\"El pipeline corre con la cuenta predeterminada de Compute Engine, que tiene el rol Editor en todo el proyecto\",\"en\":\"The pipeline runs as the Compute Engine default account, which holds the Editor role on the whole project\"},\"correct\":true,\"why\":{\"es\":\"Gana: Editor permite modificar o borrar casi cualquier recurso; viola el mínimo privilegio.\",\"en\":\"Wins: Editor allows modifying or deleting almost any resource; it violates least privilege.\"}}],\"rootCause\":{\"es\":\"Sobrepermiso: el pipeline usa la cuenta predeterminada de Compute Engine con rol Editor, así que cualquier paso puede borrar recursos de todo el proyecto.\",\"en\":\"Over-permission: the pipeline uses the Compute Engine default account with the Editor role, so any step can delete resources across the whole project.\"},\"fix\":\"pipeline_job:\\n  display_name: churn-retrain\\n  service_account: pipeline-churn@mi-proyecto.iam.gserviceaccount.com\\n\\n# Roles mínimos para la cuenta dedicada\\n- role: roles/aiplatform.user                # en el proyecto\\n- role: roles/bigquery.jobUser               # en el proyecto\\n- role: roles/bigquery.dataEditor            # solo en el dataset ml_churn\\n# y retirar roles/editor de la cuenta predeterminada\",\"fixNote\":{\"es\":\"Una cuenta por carga de trabajo, roles concedidos sobre el recurso concreto (dataset) y revisión periódica de permisos no usados.\",\"en\":\"One account per workload, roles granted on the specific resource (dataset), and periodic review of unused permissions.\"},\"questions\":[{\"key\":\"s4-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:3:steps:4:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:4:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:4:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:4:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:4:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:4:options:3:why\"}],\"correct\":\"D\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s4-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":16,\"title\":{\"es\":\"Checkpoint: producción\",\"en\":\"Checkpoint: production\"},\"items\":[{\"id\":\"s4-c1\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"basic\",\"tags\":[\"despliegue\",\"riesgo\"],\"prompt\":{\"es\":\"Un modelo nuevo gana al actual en validación, pero no quieres arriesgar a todos los clientes ni cambiar la URL que usan las aplicaciones. Necesitas poder volver atrás en minutos. ¿Cómo lo despliegas?\",\"en\":\"A new model beats the current one in validation, but you don't want to risk every customer or change the URL apps use. You need to roll back within minutes. How do you deploy it?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Crear un endpoint nuevo y cambiar la URL en todas las apps\",\"en\":\"Create a new endpoint and change the URL in every app\"},\"correct\":false,\"why\":{\"es\":\"Cambia la URL y no limita el riesgo inicial.\",\"en\":\"Changes the URL and doesn't limit the initial risk.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Sustituir el modelo de golpe fuera de horario\",\"en\":\"Replace the model all at once after hours\"},\"correct\":false,\"why\":{\"es\":\"Arriesga al 100 % de los clientes desde el primer minuto.\",\"en\":\"Risks 100% of customers from the first minute.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Desplegarlo en el mismo endpoint con un 10 % del tráfico y subirlo mientras las métricas aguanten\",\"en\":\"Deploy it on the same endpoint with 10% of traffic and raise it while metrics hold\"},\"correct\":true,\"why\":{\"es\":\"Gana: canary con reparto de tráfico; volver atrás es devolver el 100 % al anterior.\",\"en\":\"Wins: canary with a traffic split; rolling back means sending 100% back to the old one.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Probarlo solo con datos de validación otra vez\",\"en\":\"Test it only on validation data again\"},\"correct\":false,\"why\":{\"es\":\"No expone el modelo al tráfico real.\",\"en\":\"Doesn't expose the model to real traffic.\"}}],\"takeaway\":{\"es\":\"Actualizar con poco riesgo → canary en el mismo endpoint.\",\"en\":\"Low-risk update → canary on the same endpoint.\"}},{\"id\":\"s4-c2\",\"type\":\"bug_diagnosis\",\"difficulty\":\"intermediate\",\"tags\":[\"monitorizacion\",\"drift\"],\"prompt\":{\"es\":\"Model Monitoring alerta de drift en «importe» tras una campaña, pero la precision medida con las etiquetas reales de 4 semanas no cambió y la atribución de esa feature sigue igual. ¿Qué haces?\",\"en\":\"Model Monitoring raises a drift alert on «amount» after a campaign, but precision measured on 4 weeks of real labels has not changed and that feature's attribution is the same. What do you do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Reentrenar inmediatamente con los datos de la campaña\",\"en\":\"Retrain immediately on the campaign data\"},\"correct\":false,\"why\":{\"es\":\"Asume que drift implica caída de rendimiento; las etiquetas dicen lo contrario.\",\"en\":\"Assumes drift means a performance drop; the labels say otherwise.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Investigar la causa del cambio, revisar el umbral de alerta y seguir vigilando el rendimiento con etiquetas\",\"en\":\"Investigate the cause, review the alert threshold and keep watching label-based performance\"},\"correct\":true,\"why\":{\"es\":\"Gana: el drift avisa de un cambio en las entradas, no prueba que el modelo falle.\",\"en\":\"Wins: drift flags a change in the inputs; it doesn't prove the model is failing.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Desactivar la monitorización de esa feature\",\"en\":\"Turn off monitoring for that feature\"},\"correct\":false,\"why\":{\"es\":\"Pierdes visibilidad si el cambio llega a dañar el modelo.\",\"en\":\"You lose visibility if the change starts hurting the model.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Hacer rollback al modelo anterior\",\"en\":\"Roll back to the previous model\"},\"correct\":false,\"why\":{\"es\":\"El anterior vería las mismas entradas; no hay fallo que revertir.\",\"en\":\"The previous model would see the same inputs; there is no failure to revert.\"}}],\"takeaway\":{\"es\":\"Drift de entradas ≠ caída de rendimiento: confírmalo con etiquetas.\",\"en\":\"Input drift ≠ performance drop: confirm with labels.\"}},{\"id\":\"s4-c3\",\"type\":\"concept\",\"difficulty\":\"intermediate\",\"tags\":[\"explicabilidad\",\"agent-platform\"],\"prompt\":{\"es\":\"Debes configurar explicaciones en Agent Platform para un modelo XGBoost tabular de riesgo. El regulador exige atribuciones por feature en cada predicción online. ¿Qué método configuras?\",\"en\":\"You must configure explanations on Agent Platform for a tabular XGBoost risk model. The regulator requires per-feature attributions on every online prediction. Which method do you configure?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Sampled Shapley\",\"en\":\"Sampled Shapley\"},\"correct\":true,\"why\":{\"es\":\"Gana: aproxima valores de Shapley sin necesitar gradientes; es el método para modelos no diferenciables como los árboles.\",\"en\":\"Wins: it approximates Shapley values without gradients; it is the method for non-differentiable models such as trees.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Integrated gradients\",\"en\":\"Integrated gradients\"},\"correct\":false,\"why\":{\"es\":\"Necesita un modelo diferenciable; un ensemble de árboles no lo es.\",\"en\":\"Needs a differentiable model; a tree ensemble isn't.\"}},{\"id\":\"C\",\"text\":{\"es\":\"XRAI\",\"en\":\"XRAI\"},\"correct\":false,\"why\":{\"es\":\"Está pensado para imágenes, agrupando atribuciones por regiones.\",\"en\":\"It is designed for images, grouping attributions by region.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Ninguno: basta con la importancia global del entrenamiento\",\"en\":\"None: global training importance is enough\"},\"correct\":false,\"why\":{\"es\":\"El requisito es por predicción, no global.\",\"en\":\"The requirement is per prediction, not global.\"}}],\"takeaway\":{\"es\":\"Árboles → sampled Shapley; redes con imágenes → integrated gradients o XRAI.\",\"en\":\"Trees → sampled Shapley; image networks → integrated gradients or XRAI.\"}},{\"id\":\"s4-c4\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"advanced\",\"tags\":[\"mlops\",\"reentrenamiento\"],\"prompt\":{\"es\":\"Un modelo de demanda se reentrena «cuando alguien se acuerda». Las etiquetas reales llegan con 2 semanas de retraso, el negocio cambia por temporadas y un despliegue malo cuesta caro. ¿Qué política propones?\",\"en\":\"A demand model is retrained «whenever someone remembers». Real labels arrive 2 weeks late, the business changes by season, and a bad deployment is expensive. What policy do you propose?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Reentrenar cada hora y desplegar siempre el último\",\"en\":\"Retrain every hour and always deploy the latest\"},\"correct\":false,\"why\":{\"es\":\"Desplegar sin puerta arriesga modelos peores; cada hora no aporta etiquetas nuevas.\",\"en\":\"Deploying without a gate risks worse models; hourly adds no new labels.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Reentrenar solo cuando un cliente se queje\",\"en\":\"Retrain only when a customer complains\"},\"correct\":false,\"why\":{\"es\":\"Reacciona tarde y sin criterio medible.\",\"en\":\"Reacts late and without a measurable criterion.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Reentrenar una vez al año\",\"en\":\"Retrain once a year\"},\"correct\":false,\"why\":{\"es\":\"Ignora la estacionalidad del negocio.\",\"en\":\"Ignores the business's seasonality.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Pipeline programado según la temporada más disparadores por alertas o caída de la métrica con etiquetas, con puerta frente al modelo actual antes de un canary\",\"en\":\"A pipeline scheduled by season plus triggers from alerts or a label-based metric drop, with a gate against the current model before a canary\"},\"correct\":true,\"why\":{\"es\":\"Gana: combina calendario y evidencia, y solo promueve lo que demuestra ser mejor.\",\"en\":\"Wins: it combines schedule and evidence, and only promotes what proves better.\"}}],\"takeaway\":{\"es\":\"Política = calendario + disparadores + puerta de evaluación.\",\"en\":\"Policy = schedule + triggers + evaluation gate.\"}},{\"id\":\"s4-c5\",\"type\":\"bug_diagnosis\",\"difficulty\":\"advanced\",\"tags\":[\"serving\",\"latencia\"],\"prompt\":{\"es\":\"Tu endpoint responde en 450 ms y el SLA es 100 ms. El perfil muestra que el modelo tarda 15 ms y el resto es una consulta a BigQuery por petición para obtener el historial del cliente. ¿Qué cambias?\",\"en\":\"Your endpoint answers in 450 ms and the SLA is 100 ms. Profiling shows the model takes 15 ms and the rest is one BigQuery query per request to fetch the customer's history. What do you change?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Pasar a una máquina con GPU\",\"en\":\"Move to a GPU machine\"},\"correct\":false,\"why\":{\"es\":\"El modelo ya tarda 15 ms; el cuello de botella es la consulta.\",\"en\":\"The model already takes 15 ms; the bottleneck is the query.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Servir esas features precalculadas desde Feature Store en lugar de consultar BigQuery en cada petición\",\"en\":\"Serve those precomputed features from Feature Store instead of querying BigQuery on every request\"},\"correct\":true,\"why\":{\"es\":\"Gana: lectura online de baja latencia con la misma definición que en entrenamiento.\",\"en\":\"Wins: low-latency online reads with the same definition as in training.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Subir el máximo de réplicas\",\"en\":\"Raise the maximum replicas\"},\"correct\":false,\"why\":{\"es\":\"Más réplicas no aceleran una consulta lenta por petición.\",\"en\":\"More replicas don't speed up a slow per-request query.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Reentrenar un modelo más pequeño\",\"en\":\"Retrain a smaller model\"},\"correct\":false,\"why\":{\"es\":\"El modelo no es el problema.\",\"en\":\"The model is not the problem.\"}}],\"takeaway\":{\"es\":\"Mide dónde se va el tiempo antes de tocar el modelo o el hardware.\",\"en\":\"Measure where the time goes before touching the model or hardware.\"}}],\"refs\":[{\"quiz\":{\"es\":\"gcp-pmle-2026-es\",\"en\":\"gcp-pmle-2026\"},\"ids\":[\"10\",\"13\",\"14\",\"15\"]}],\"questions\":[{\"key\":\"s4-c1\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:0:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s4-c2\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:1:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"bug_diagnosis\"},{\"key\":\"s4-c3\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:2:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:2:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"concept\"},{\"key\":\"s4-c4\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:3:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s4-c5\",\"prompt\":\"$6:props:flow:stages:3:steps:5:items:4:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:3:steps:5:items:4:options:0:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:3:steps:5:items:4:options:1:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:3:steps:5:items:4:options:2:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:3:steps:5:items:4:options:3:text\",\"why\":\"$6:props:flow:stages:3:steps:5:items:4:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:3:steps:5:items:4:takeaway\",\"difficulty\":\"advanced\",\"type\":\"bug_diagnosis\"},{\"key\":\"gcp-pmle-2026-es::10\",\"prompt\":{\"es\":\"Un banco sirve un modelo de fraude en Agent Platform. Las peticiones solo llegan desde aplicaciones dentro de su VPC, el regulador exige que el tráfico de predicción nunca pase por internet público y la latencia debe ser la mínima posible. ¿Cómo debe desplegarse el modelo?\",\"en\":\"A bank serves a fraud model on Agent Platform. Requests come only from applications inside its VPC, regulators require that prediction traffic never traverse the public internet, and latency must be as low as possible. How should the model be deployed?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Un endpoint público protegido con una API key incluida en las aplicaciones que llaman, rotando la clave cada mes y restringiendo las peticiones con IAM\",\"en\":\"A public endpoint protected by an API key embedded in the calling applications, with the key rotated every month and requests restricted by IAM\"}},{\"id\":\"B\",\"text\":{\"es\":\"Jobs de predicción por lotes cada hora\",\"en\":\"Batch prediction jobs every hour\"}},{\"id\":\"C\",\"text\":{\"es\":\"Un endpoint público detrás de Cloud CDN y Cloud Armor, para que las respuestas se cacheen cerca de las aplicaciones y solo los rangos de IP permitidos lleguen a él\",\"en\":\"A public endpoint behind Cloud CDN and Cloud Armor, so responses are cached close to the applications and only allow-listed IP ranges can reach it\"}},{\"id\":\"D\",\"text\":{\"es\":\"Un endpoint privado (Private Service Connect o VPC peering) para que las aplicaciones de la VPC lleguen al modelo por IPs privadas, junto con VPC Service Controls\",\"en\":\"A private endpoint (Private Service Connect or VPC peering) so the VPC's applications reach the model over private IPs, combined with VPC Service Controls\"}}],\"correct\":\"D\",\"explanation\":{\"es\":\"Agent Platform (antes Vertex AI) admite endpoints privados para predicción online: con Private Service Connect (recomendado) o VPC Network Peering, las aplicaciones de tu VPC envían peticiones a IPs privadas, el tráfico se queda en la red de Google y el endpoint no se expone públicamente, lo que además suele reducir la latencia. VPC Service Controls añade un perímetro alrededor de la API.\\n\\nPor qué fallan las demás: (A) un endpoint público incumple el requisito y las claves incrustadas en apps se filtran. (B) lotes cada hora no puntúan transacciones en tiempo real. (C) una CDN cachea contenido estático; no hace privadas las predicciones.\\n\\nPista de examen: «el tráfico no debe pasar por internet» / «solo desde nuestra VPC» → endpoint privado (PSC).\",\"en\":\"Agent Platform (formerly Vertex AI) supports private endpoints for online prediction: with Private Service Connect (recommended) or VPC Network Peering, applications in your VPC send requests to private IP addresses, traffic stays on Google's network and the endpoint is not exposed publicly, which also tends to reduce latency. VPC Service Controls adds a perimeter around the API.\\n\\nWhy the others fail: (A) a public endpoint violates the requirement, and keys embedded in apps leak. (B) hourly batch jobs cannot score transactions in real time. (C) CDN caches static content; it does not make predictions private.\\n\\nExam cue: \\\"traffic must not traverse the internet\\\" / \\\"only from our VPC\\\" → private endpoint (PSC).\"}},{\"key\":\"gcp-pmle-2026-es::13\",\"prompt\":{\"es\":\"Un modelo funciona bien offline pero mal en producción. La investigación muestra que el pipeline de entrenamiento normalizaba una variable con estadísticas calculadas en un job de Dataflow, mientras que el servicio online reimplementó la normalización en Java con reglas ligeramente distintas. ¿Cuál es la mejor solución a largo plazo?\",\"en\":\"A model performs well offline but poorly in production. Investigation shows the training pipeline normalized a feature with statistics computed in a Dataflow job, while the online service reimplemented the normalization in Java with slightly different rules. What is the best long-term fix?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Reentrenar más a menudo incluyendo peticiones recientes de producción en los datos de entrenamiento, para que el modelo se adapte poco a poco a la normalización del servicio Java\",\"en\":\"Retrain more often, including recent production requests in the training data, so the model gradually adapts to the Java service's normalization\"}},{\"id\":\"B\",\"text\":{\"es\":\"Añadir más capas y batch normalization al modelo para que sea robusto a las diferencias de escala entre las entradas de entrenamiento y de serving\",\"en\":\"Add more layers and batch normalization to the model so it becomes robust to scaling differences between the training and serving inputs\"}},{\"id\":\"C\",\"text\":{\"es\":\"Desactivar la normalización en el entrenamiento\",\"en\":\"Disable normalization in training\"}},{\"id\":\"D\",\"text\":{\"es\":\"Definir la transformación una vez y reutilizarla en ambos caminos (Feature Store, o TensorFlow Transform / una capa de preprocesado en el modelo), y monitorizar el skew\",\"en\":\"Define the transformation once and reuse it in both paths (Feature Store, or TensorFlow Transform / a preprocessing layer in the model), and monitor skew\"}}],\"correct\":\"D\",\"explanation\":{\"es\":\"Es training-serving skew causado por dos implementaciones del mismo preprocesado. La solución es una única fuente de verdad: servir las variables desde Feature Store de Agent Platform (calculadas una vez, leídas online y offline) o enviar la transformación con el modelo (el grafo de TensorFlow Transform, capas de preprocesado de Keras o el mismo código Python en un contenedor de serving propio). Después, Model Monitoring vigila el training-serving skew para detectar regresiones.\\n\\nPor qué fallan las demás: (A) reentrenar no elimina la discrepancia entre pipelines. (B) más capacidad del modelo no arregla entradas inconsistentes. (C) quitar la normalización puede empeorar el modelo y no ataca la causa.\\n\\nPista de examen: «funciona offline, falla online» + «preprocesado implementado dos veces» → reutilizar una transformación (Feature Store / TFT / preprocesado dentro del modelo).\",\"en\":\"This is training-serving skew caused by two implementations of the same preprocessing. The fix is a single source of truth: serve features from Agent Platform Feature Store (computed once, read online and offline), or ship the transformation with the model (TensorFlow Transform's transform graph, Keras preprocessing layers, or the same Python code in a custom serving container). Model Monitoring can then watch training-serving skew to catch regressions.\\n\\nWhy the others fail: (A) retraining does not remove the mismatch between pipelines. (B) model capacity does not fix inconsistent inputs. (C) removing normalization may hurt the model and does not address the root cause.\\n\\nExam cue: \\\"works offline, fails online\\\" + \\\"preprocessing implemented twice\\\" → reuse one transformation (Feature Store / TFT / preprocessing in the model).\"}},{\"key\":\"gcp-pmle-2026-es::14\",\"prompt\":{\"es\":\"Un equipo quiere que cada merge a main reconstruya y pruebe su pipeline de entrenamiento, y que los modelos de producción se reentrenen al llegar datos etiquetados nuevos o cuando la monitorización detecte degradación, pero que solo se promuevan si pasan la evaluación. ¿Qué diseño implementa CI/CD/CT en Google Cloud?\",\"en\":\"A team wants every merge to main to rebuild and test its training pipeline, and wants production models retrained when new labeled data arrives or monitoring detects degradation — but promoted only if they pass evaluation. Which design implements CI/CD/CT on Google Cloud?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Los ingenieros reentrenan desde sus notebooks cuando cambian los datos, hacen una comprobación rápida y copian el fichero del modelo al bucket de producción\",\"en\":\"Engineers retrain from their notebooks whenever data changes, run a quick sanity check, and copy the model file to the production bucket\"}},{\"id\":\"B\",\"text\":{\"es\":\"Cloud Build al hacer merge prueba y despliega el pipeline (CI/CD); el pipeline reentrena por calendario o alerta y despliega solo si gana (CT)\",\"en\":\"Cloud Build on merge tests and deploys the pipeline (CI/CD); the pipeline retrains on schedule or alerts and deploys only if it wins (CT)\"}},{\"id\":\"C\",\"text\":{\"es\":\"Reentrenar cada hora con Cloud Scheduler y desplegar siempre el modelo más reciente, porque los datos más nuevos siempre dan el modelo más preciso\",\"en\":\"Retrain every hour with Cloud Scheduler and always deploy the newest model, since the most recent data always produces the most accurate model\"}},{\"id\":\"D\",\"text\":{\"es\":\"Hacer CI solo de los notebooks y desplegar los modelos a mano\",\"en\":\"Only run CI on the notebook files and deploy models manually\"}}],\"correct\":\"B\",\"explanation\":{\"es\":\"El MLOps en Google Cloud separa CI (probar el código y los componentes del pipeline), CD (desplegar el pipeline y, a través de él, los modelos) y CT (entrenamiento continuo). Cloud Build se encarga de CI/CD en cada commit; el pipeline de entrenamiento en Agent Platform Pipelines se dispara por calendario, por eventos de datos nuevos o por alertas de Model Monitoring; y un paso condicional de evaluación (por ejemplo, comparar métricas con el modelo de producción o con un umbral) decide si se registra en Model Registry y se despliega en el endpoint.\\n\\nPor qué fallan las demás: (A) reentrenar a mano no es fiable ni auditable. (C) reentrenar a ciegas y desplegar siempre puede promover modelos peores. (D) sin CT ni despliegue automatizados los modelos se quedan obsoletos y las publicaciones fallan.\\n\\nPista de examen: «CI/CD/CT» → Cloud Build para el código, ejecuciones del pipeline por calendario/datos/monitorización, puerta de evaluación antes de desplegar.\",\"en\":\"MLOps on Google Cloud separates CI (testing code and pipeline components), CD (deploying the pipeline and, through it, models) and CT (continuous training). Cloud Build handles CI/CD on each commit; the training pipeline in Agent Platform Pipelines is triggered by a schedule, by new-data events or by Model Monitoring alerts; and a conditional evaluation step (for example comparing metrics to the production model or a threshold) gates registration in Model Registry and deployment to the endpoint.\\n\\nWhy the others fail: (A) manual retraining is unreliable and unauditable. (C) retraining blindly and always deploying risks promoting worse models. (D) without automated CT and deployment, models go stale and releases are error-prone.\\n\\nExam cue: \\\"CI/CD/CT\\\" → Cloud Build for code, pipeline runs triggered by schedule/data/monitoring, evaluation gate before deployment.\"}},{\"key\":\"gcp-pmle-2026-es::15\",\"prompt\":{\"es\":\"Las distribuciones de las variables de entrada de un modelo de crédito parecen estables en producción, pero Model Monitoring indica que el modelo ahora depende mucho más de «days_since_last_payment» y mucho menos de «income» que al entrenarlo. ¿Qué tipo de problema es y qué sugiere?\",\"en\":\"A credit model's input feature distributions look stable in production, but Model Monitoring reports that the model now relies much more on \\\"days_since_last_payment\\\" and much less on \\\"income\\\" than at training time. What kind of issue is this and what does it suggest?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Training-serving skew causado por un cambio de esquema en la petición de serving, que hace que el modelo reciba las variables en otro orden que en el entrenamiento\",\"en\":\"Training-serving skew caused by a schema change in the serving request, which makes the model receive features in a different order than in training\"}},{\"id\":\"B\",\"text\":{\"es\":\"Concept drift, demostrado por el cambio en las atribuciones, así que el equipo debe reentrenar de inmediato sin investigar más\",\"en\":\"Concept drift, proven by the change in attributions, so the team must retrain immediately without investigating further\"}},{\"id\":\"C\",\"text\":{\"es\":\"Attribution drift: cambió la contribución de las variables a las predicciones, lo que puede revelar relaciones nuevas o problemas de datos aunque las entradas sean estables\",\"en\":\"Feature attribution drift: the features' contributions to predictions shifted, which can reveal changed relationships or data issues even with stable inputs\"}},{\"id\":\"D\",\"text\":{\"es\":\"Un problema de latencia del endpoint\",\"en\":\"An endpoint latency issue\"}}],\"correct\":\"C\",\"explanation\":{\"es\":\"$f\",\"en\":\"Model Monitoring can track two families of signals: feature drift/skew (changes in input distributions versus training data or over time) and feature attribution drift/skew (changes in how much each feature contributes to predictions, using Explainable AI attributions). Attribution drift can surface problems that input statistics miss — for example interactions between features changing, or a feature's pipeline silently degrading — and is a cue to investigate and possibly retrain.\\n\\nWhy the others fail: (A) skew compares serving inputs to training data, and the case says inputs look stable. (B) concept drift is a change in the relationship between features and target, confirmed with labels and performance metrics; the case gives no accuracy data. (D) nothing in the case concerns latency.\\n\\nExam cue: \\\"feature importance/attributions changed\\\" → feature attribution drift; \\\"input distribution changed\\\" → data drift; \\\"serving inputs differ from training\\\" → skew.\"}}]},{\"id\":\"s4-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre Feynman: el ciclo de producción\",\"en\":\"Feynman close: the production cycle\"},\"prompt\":{\"es\":\"Explícale a un jefe de producto en 4–5 frases cómo pondrías un modelo en producción sin riesgo, cómo sabrías si se degrada y qué harías entonces.\",\"en\":\"Explain to a product manager in 4–5 sentences how you would put a model into production without risk, how you would know it is degrading, and what you would do then.\"},\"keyPoints\":[{\"es\":\"Batch u online según quién consume y cuándo; canary con reparto de tráfico para actualizar.\",\"en\":\"Batch or online depending on who consumes and when; canary with a traffic split to update.\"},{\"es\":\"Model Monitoring con umbrales para skew, drift y atribuciones, más métricas con etiquetas reales.\",\"en\":\"Model Monitoring with thresholds for skew, drift and attributions, plus metrics on real labels.\"},{\"es\":\"Pipeline de reentrenamiento con puerta frente al modelo actual.\",\"en\":\"Retraining pipeline with a gate against the current model.\"},{\"es\":\"Cuentas de servicio dedicadas con mínimo privilegio y red privada si se exige.\",\"en\":\"Dedicated least-privilege service accounts and private networking when required.\"}]}]},{\"id\":\"s5\",\"title\":{\"es\":\"IA generativa en el PMLE: elegir, adaptar, proteger y evaluar\",\"en\":\"Gen AI on the PMLE: choose, adapt, secure and evaluate\"},\"objective\":{\"es\":\"Al terminar sabrás decidir entre prompt, RAG y tuning, bajar el coste y la latencia de Gemini, proteger una app con Model Armor y permisos en la recuperación, y evaluarla y monitorizarla en producción.\",\"en\":\"By the end you will decide between prompting, RAG and tuning, lower Gemini's cost and latency, secure an app with Model Armor and permission-aware retrieval, and evaluate and monitor it in production.\"},\"steps\":[{\"id\":\"s5-capsula\",\"kind\":\"capsule\",\"minutes\":6,\"title\":{\"es\":\"Cápsula: la escalera de la IA generativa\",\"en\":\"Capsule: the gen AI ladder\"},\"problem\":{\"es\":\"En el examen, la IA generativa aparece en casi todos los dominios: elegir un modelo, adaptarlo, bajar su coste, protegerlo y medir si responde bien. El error típico es saltar al fine-tuning o a «más instrucciones en el prompt» para todo.\",\"en\":\"On the exam, gen AI shows up in almost every domain: choosing a model, adapting it, lowering its cost, securing it and measuring whether it answers well. The typical mistake is jumping to fine-tuning, or to \\\"more instructions in the prompt\\\", for everything.\"},\"mechanism\":{\"es\":\"Se sube por una escalera y solo se pasa al peldaño siguiente si la evaluación lo exige. Primero, prompt engineering con un modelo pequeño (Flash) elegido en Model Garden. Si falta conocimiento propio o cambiante, grounding o RAG: el sistema recupera los pasajes en el momento y el modelo responde citándolos. Si falta un comportamiento constante (formato, tono, tarea) y hay cientos o miles de ejemplos, tuning supervisado; en modelos abiertos, PEFT/LoRA. Cada peldaño se mide con el Gen AI evaluation service sobre el mismo conjunto. Alrededor van los controles: Model Armor filtra prompts y respuestas, la recuperación respeta los permisos del usuario, VPC Service Controls evita la exfiltración. Coste y latencia se bajan con context caching, batch y Provisioned Throughput para el tráfico crítico.\",\"en\":\"You climb a ladder and only take the next step if evaluation demands it. First, prompt engineering with a small model (Flash) chosen in Model Garden. If your own or changing knowledge is missing, grounding or RAG: the system retrieves passages at query time and the model answers citing them. If a consistent behaviour (format, tone, task) is missing and there are hundreds or thousands of examples, supervised tuning; on open models, PEFT/LoRA. Each step is measured with the Gen AI evaluation service on the same set. Controls go around it: Model Armor screens prompts and responses, retrieval respects the user's permissions, VPC Service Controls prevents exfiltration. Cost and latency come down with context caching, batch and Provisioned Throughput for critical traffic.\"},\"flow\":[{\"es\":\"Prompt (Flash) → evaluar → ¿falta conocimiento? → RAG/grounding → evaluar → ¿falta comportamiento? → tuning (PEFT/LoRA)\",\"en\":\"Prompt (Flash) → evaluate → knowledge missing? → RAG/grounding → evaluate → behaviour missing? → tuning (PEFT/LoRA)\"},{\"es\":\"Petición → Model Armor (prompt) → recuperación filtrada por permisos → Gemini → Model Armor (respuesta) → usuario\",\"en\":\"Request → Model Armor (prompt) → permission-filtered retrieval → Gemini → Model Armor (response) → user\"},{\"es\":\"Producción → registrar petición, contexto y respuesta → evaluar una muestra (groundedness, seguridad) → alertar\",\"en\":\"Production → log request, context and response → evaluate a sample (groundedness, safety) → alert\"}],\"whenNot\":[{\"es\":\"No hagas tuning para que el modelo «sepa» datos que cambian: queda desfasado y no puede citar. Eso es RAG.\",\"en\":\"Don't tune so the model \\\"knows\\\" changing data: it goes stale and cannot cite. That is RAG.\"},{\"es\":\"No uses un LLM para lo que resuelve una API especializada o una regla: OCR de facturas es Document AI, un total con IVA es una fórmula.\",\"en\":\"Don't use an LLM for what a specialized API or a rule solves: invoice OCR is Document AI, a total with VAT is a formula.\"},{\"es\":\"No confíes la seguridad al system prompt: la inyección de prompts existe justo para saltárselo.\",\"en\":\"Don't trust the system prompt for security: prompt injection exists precisely to bypass it.\"}]},{\"id\":\"s5-tarjetas\",\"kind\":\"cards\",\"minutes\":8,\"title\":{\"es\":\"Tarjetas: nombres 2026 y decisiones de IA generativa\",\"en\":\"Cards: 2026 names and gen AI decisions\"},\"deck\":\"gcp-pmle-2026-mapa\",\"ids\":[\"pmle-m2-01\",\"pmle-m2-03\",\"pmle-m3-02\",\"pmle-m3-06\",\"pmle-m3-07\",\"pmle-m1-01\"],\"cardsEs\":[{\"id\":\"pmle-m2-01\",\"part\":\"m\",\"front\":\"¿Cómo se llama ahora Vertex AI y por qué importa para el examen?\",\"back\":\"Gemini Enterprise Agent Platform (anunciado en abril de 2026 como la evolución de Vertex AI).\\n\\n• La guía de junio de 2026 usa los nombres nuevos: Agent Platform AutoML, Pipelines, Workbench, Feature Store, Model Registry, Experiments, ML Metadata, Model Monitoring.\\n• Los servicios son los mismos: cambia el nombre, no lo que hacen.\\n• El examen NO se volvió de agentes: «Agent Platform» es solo el nombre del producto.\\n\\nPista: si estudias con material antiguo, lee «Vertex AI X» como «Agent Platform X».\",\"topic\":\"Vertex AI → Agent Platform\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"pmle\",\"naming\"]},{\"id\":\"pmle-m2-03\",\"part\":\"m\",\"front\":\"¿Qué nombre usa la guía 2026 para el serving de modelos y qué incluye?\",\"back\":\"«Agent Platform Inference» (lo que antes era Vertex AI Prediction).\\n\\n• Endpoints online (públicos o privados con Private Service Connect).\\n• Batch inference.\\n• Contenedores precompilados y personalizados, autoescalado, GPU/TPU.\\n• Explicaciones (Explainable AI) sobre las predicciones.\\n\\nPista: «predicción», «inferencia» y «serving» se refieren a lo mismo en las preguntas.\",\"topic\":\"Serving: Agent Platform Inference\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"pmle\",\"naming\",\"serving\"]},{\"id\":\"pmle-m3-02\",\"part\":\"m\",\"front\":\"Señal del enunciado → técnica de IA generativa: ¿cuál?\",\"back\":\"• «Rápido, pocos ejemplos» → prompt engineering / few-shot.\\n• «Datos propios, cambian, citar fuentes» → grounding / RAG.\\n• «Formato, tono o tarea constante + miles de ejemplos» → supervised tuning (PEFT/LoRA en modelos abiertos).\\n• «Evaluar sin respuesta única» → Gen AI evaluation service, LLM-as-a-judge.\\n• «Mismo contexto grande siempre» → context caching.\\n• «Capacidad garantizada» → Provisioned Throughput.\",\"topic\":\"Prompt, RAG o tuning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"pmle\",\"decision\",\"genai\"]},{\"id\":\"pmle-m3-06\",\"part\":\"m\",\"front\":\"Riesgo de seguridad en ML → control: ¿cuál?\",\"back\":\"• Copiar datos fuera con credenciales válidas → VPC Service Controls.\\n• PII en datos de entrenamiento → Sensitive Data Protection.\\n• Prompt injection, jailbreak, datos sensibles en el chat → Model Armor.\\n• Tráfico sin internet público → Private Service Connect, notebooks sin IP pública.\\n• Permisos de sobra → cuenta de servicio dedicada con roles mínimos.\\n• Claves propias de cifrado → CMEK.\\n\\nNunca: «más instrucciones en el prompt» como control.\",\"topic\":\"Seguridad: riesgo → control\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"pmle\",\"decision\",\"security\"]},{\"id\":\"pmle-m3-07\",\"part\":\"m\",\"front\":\"¿Qué método sigues para responder una pregunta de escenario del PMLE?\",\"back\":\"1. Lee la última frase: ¿qué piden exactamente (más barato, menos esfuerzo, más rápido, más seguro)?\\n2. Subraya las restricciones duras: equipo, latencia, volumen, cumplimiento, presupuesto.\\n3. Descarta las opciones que violan una restricción.\\n4. Entre las que quedan, elige la más gestionada y con menos piezas.\\n5. Desconfía de: reescribir lo que funciona, reentrenar como solución universal, más capas, más réplicas para latencia.\\n\\nTiempo: ~2 minutos por pregunta; marca y vuelve.\",\"topic\":\"Cómo responder un escenario\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"pmle\",\"exam\",\"strategy\"]},{\"id\":\"pmle-m1-01\",\"part\":\"m\",\"front\":\"¿Cómo es el examen Professional Machine Learning Engineer y qué tipo de preguntas trae?\",\"back\":\"• 120 minutos, 50–60 preguntas de opción múltiple y selección múltiple.\\n• Casi todas son escenarios: un negocio, restricciones (coste, latencia, equ
