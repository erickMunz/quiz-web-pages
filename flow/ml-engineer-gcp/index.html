03c 500 filas → todo entrena; 500–50.000 → 20 % evaluación; \u003e 50.000 → 10.000 filas de evaluación.\\n• RANDOM: aleatorio y determinista, con DATA_SPLIT_EVAL_FRACTION (0.2 por defecto).\\n• CUSTOM: DATA_SPLIT_COL booleana (TRUE o NULL = evaluación); con tuning, columna STRING con TRAIN/EVAL/TEST.\\n• NO_SPLIT: todo es entrenamiento.\\n• Con NUM_TRIALS la división pasa a tres vías: 80 % / 10 % / 10 % (train/eval/test).\\n\\nPista de examen: datos temporales + split aleatorio = fuga del futuro al pasado. BigQuery ML no ofrece k-fold.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"validacion\"]},{\"id\":\"m3-04\",\"part\":\"m\",\"front\":\"Acabas de entrenar un clasificador en BigQuery ML. ¿Qué te devuelve ML.EVALUATE con y sin tabla de entrada, y cómo comparas dos modelos?\",\"back\":\"ML.EVALUATE devuelve las métricas del modelo: sin tabla, las calculadas durante el entrenamiento; con una tabla, las de esos datos.\\n\\n• Clasificación: precision, recall, accuracy, f1_score, log_loss, roc_auc (en multiclase, promedio macro salvo accuracy).\\n• Regresión: mean_absolute_error, mean_squared_error, mean_squared_log_error, median_absolute_error, r2_score, explained_variance.\\n• K-means: davies_bouldin_index y mean_squared_distance.\\n• STRUCT(0.6 AS threshold) solo en clasificación binaria (0.5 por defecto).\\n• Con tuning usa el trial óptimo y los datos de test; TRIAL_ID elige otro.\\n• Comparar modelos = ML.EVALUATE de cada uno sobre la MISMA tabla de validación.\\n\\nPista de examen: ML.COMPARE no existe. Para los parámetros de un ARIMA_PLUS (p, d, q, AIC) se usa ML.ARIMA_EVALUATE.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"metricas\"]},{\"id\":\"m3-19\",\"part\":\"m\",\"front\":\"Tu clasificador binario de fraude usa el umbral 0.5 y se le escapan demasiados fraudes. ¿Con qué funciones de BigQuery ML eliges otro umbral sin reentrenar?\",\"back\":\"Con ML.ROC_CURVE ves recall y tasa de falsos positivos para cada umbral, y aplicas el elegido con STRUCT(… AS threshold) en ML.PREDICT, ML.EVALUATE o ML.CONFUSION_MATRIX.\\n\\n• ML.ROC_CURVE (solo binaria): por umbral devuelve recall, false_positive_rate y los conteos de verdaderos/falsos positivos y negativos.\\n• ML.CONFUSION_MATRIX: la matriz para un umbral concreto.\\n• Bajar el umbral sube el recall (más fraudes detectados) y baja la precision (más falsas alarmas).\\n• Elige el punto por el coste de negocio de cada error, no por el 0.5 por defecto.\\n\\nPista de examen: ML.THRESHOLD_EVALUATE no existe; «elegir umbral» → ML.ROC_CURVE + threshold.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"metricas\"]},{\"id\":\"m3-17\",\"part\":\"m\",\"front\":\"Tu SQL de entrenamiento normaliza y agrupa en cubetas varias columnas, y el equipo de aplicación copió esa lógica a mano para predecir. ¿Qué cláusula de BigQuery ML evita esa duplicación y por qué?\",\"back\":\"La cláusula TRANSFORM de CREATE MODEL guarda el preprocesamiento dentro del modelo y BigQuery lo reaplica solo en ML.PREDICT y ML.EVALUATE.\\n\\n• Ejemplo: TRANSFORM(ML.QUANTILE_BUCKETIZE(edad, 10) OVER() AS edad_q, ML.STANDARD_SCALER(ingreso) OVER() AS ingreso_s, churn).\\n• Las estadísticas de la transformación (cuantiles, medias) se calculan con los datos de entrenamiento y se guardan: en serving se usan las mismas.\\n• Al predecir pasas las columnas crudas; las que TRANSFORM descartó no hacen falta.\\n• Solo las columnas de salida de TRANSFORM entran al entrenamiento.\\n\\nPista de examen: «misma transformación en entrenamiento y en predicción sin duplicar código» → TRANSFORM (en TensorFlow, el equivalente es tf.Transform o capas de preprocesado de Keras).\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"skew\"]},{\"id\":\"m3-09\",\"part\":\"m\",\"front\":\"Sospechas que una columna llegó casi toda nula al entrenamiento de tu modelo de BigQuery ML. ¿Qué función lo confirma sobre el modelo ya creado y qué NO te dice?\",\"back\":\"ML.FEATURE_INFO devuelve estadísticas de cada columna de entrada del modelo (mínimo, máximo, media, mediana, desviación, número de categorías y de nulos).\\n\\n• Confirma la sospecha mirando null_count de esa columna.\\n• No describe la arquitectura ni los pesos: para pesos, ML.WEIGHTS; para la curva de pérdida por iteración, ML.TRAINING_INFO.\\n• Para describir cualquier tabla (no un modelo), ML.DESCRIBE_DATA.\\n• Funciona con todos los tipos de modelo, incluidos los de solo TRANSFORM.\\n\\nPista de examen: «estadísticas de las features con las que se entrenó» → ML.FEATURE_INFO.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"calidad-datos\"]},{\"id\":\"m3-11\",\"part\":\"m\",\"front\":\"Negocio quiere saber si «antigüedad» sube o baja la probabilidad de baja en tu LOGISTIC_REG, y con qué significancia. ¿Qué función usas y para qué modelos no sirve?\",\"back\":\"ML.WEIGHTS devuelve los coeficientes aprendidos de modelos lineales y logísticos (y de matrix factorization): el signo dice la dirección y la magnitud el peso.\\n\\n• Significancia: ML.ADVANCED_WEIGHTS añade errores estándar y p-valores, pero exige CALCULATE_P_VALUES = TRUE al entrenar.\\n• Árboles (boosted, random forest), DNN y autoencoder no tienen función de pesos: para árboles usa ML.FEATURE_IMPORTANCE.\\n• K-means → ML.CENTROIDS; PCA → ML.PRINCIPAL_COMPONENTS.\\n• Con tuning, ML.WEIGHTS devuelve los pesos de todos los trials (primera columna trial_id).\\n\\nPista de examen: «coeficientes del modelo lineal» → ML.WEIGHTS; «p-valores» → ML.ADVANCED_WEIGHTS.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"interpretabilidad\"]},{\"id\":\"m3-18\",\"part\":\"m\",\"front\":\"Quieres que BigQuery ML pruebe 30 combinaciones de learning rate y profundidad y se quede con la de mejor ROC AUC. ¿Cómo se activa el tuning y dónde ves cada intento?\",\"back\":\"El tuning se activa con NUM_TRIALS en CREATE MODEL; los rangos van con HPARAM_RANGE o HPARAM_CANDIDATES y cada intento se ve con ML.TRIAL_INFO.\\n\\n• Ejemplo: NUM_TRIALS = 30, LEARN_RATE = HPARAM_RANGE(0.01, 0.5), MAX_TREE_DEPTH = HPARAM_CANDIDATES([4, 6, 8]).\\n• HPARAM_TUNING_OBJECTIVES = ['ROC_AUC'] (un solo objetivo; ROC_AUC es el de clasificación por defecto).\\n• HPARAM_TUNING_ALGORITHM: VIZIER_DEFAULT (por defecto), RANDOM_SEARCH o GRID_SEARCH (solo espacios discretos).\\n• MAX_PARALLEL_TRIALS (1–5) acelera, pero puede empeorar el resultado con VIZIER_DEFAULT.\\n• ML.TRIAL_INFO: hiperparámetros, métrica y is_optimal por trial; ML.PREDICT/ML.EVALUATE usan el óptimo.\\n\\nPista de examen: ML.TUNE no existe; el tuning vive dentro de CREATE MODEL.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"hiperparametros\"]},{\"id\":\"m3-21\",\"part\":\"m\",\"front\":\"Debes prever 90 días de ventas para 4.000 productos desde BigQuery. ¿Entrenas ARIMA_PLUS o usas AI.FORECAST, y qué funciones acompañan a cada uno?\",\"back\":\"ARIMA_PLUS entrena un modelo por serie y es muy configurable y explicable; AI.FORECAST usa TimesFM preentrenado y pronostica sin crear modelo.\\n\\n• ARIMA_PLUS: TIME_SERIES_TIMESTAMP_COL, TIME_SERIES_DATA_COL y TIME_SERIES_ID_COL (miles de series en una sentencia); HORIZON; vacaciones con HOLIDAY_REGION.\\n• Después: ML.FORECAST (valores e intervalos), ML.EXPLAIN_FORECAST (tendencia, estacionalidad, festivos…), ML.ARIMA_EVALUATE.\\n• ARIMA_PLUS_XREG: cuando la serie depende de covariables (precio, clima).\\n• AI.FORECAST(TABLE t, data_col =\u003e 'ventas', timestamp_col =\u003e 'fecha', horizon =\u003e 90): rapidísimo de usar, poca personalización; se evalúa con AI.EVALUATE.\\n\\nPista de examen: «necesito explicar la descomposición del pronóstico» → ARIMA_PLUS + ML.EXPLAIN_FORECAST; «sin entrenar ni gestionar modelos» → AI.FORECAST.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"series-temporales\"]},{\"id\":\"m3-24\",\"part\":\"m\",\"front\":\"En una pregunta aparecen como opciones ML.TUNE, ML.DETECT_DRIFT, ML.LOCAL_EXPLAIN y ML.COMPARE. ¿Qué tienen en común y qué usarías de verdad para cada tarea?\",\"back\":\"Ninguno existe en BigQuery ML: son distractores, y cada tarea tiene una función u opción real.\\n\\n• ML.TUNE → NUM_TRIALS en CREATE MODEL + ML.TRIAL_INFO.\\n• ML.DETECT_DRIFT → ML.VALIDATE_DATA_DRIFT (y ML.VALIDATE_DATA_SKEW para entrenamiento vs serving).\\n• ML.LOCAL_EXPLAIN → ML.EXPLAIN_PREDICT.\\n• ML.COMPARE → ML.EVALUATE de cada modelo sobre los mismos datos.\\n• Otros inventados frecuentes: ML.VALIDATE_FEATURES (→ ML.VALIDATE_DATA_SKEW), ML.THRESHOLD_EVALUATE (→ ML.ROC_CURVE + threshold), ML.GENERATE_EMBEDDINGS en plural (→ ML.GENERATE_EMBEDDING o AI.GENERATE_EMBEDDING).\\n• Opciones inventadas: LABEL_COLUMNS (→ INPUT_LABEL_COLS), L0_REG, DATA_SPLIT_METHOD = 'K_FOLD'.\\n\\nPista de examen: si un nombre «suena lógico» pero no lo has visto en la referencia, sospecha.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"examen\"]},{\"id\":\"m3-10\",\"part\":\"m\",\"front\":\"Un regulador pide (a) justificar el rechazo del crédito del cliente 8812 y (b) saber qué variables pesan más en tu BOOSTED_TREE_CLASSIFIER, entrenado sin opciones extra. ¿Qué ejecutas y qué te falta?\",\"back\":\"Para (a) ML.EXPLAIN_PREDICT sobre la fila del cliente; para (b) ML.FEATURE_IMPORTANCE ya funciona, pero ML.GLOBAL_EXPLAIN exige reentrenar con ENABLE_GLOBAL_EXPLAIN = TRUE.\\n\\n• ML.EXPLAIN_PREDICT: predicción + atribución por feature (Tree SHAP en árboles, Shapley en lineales) respecto a una línea base; top_k_features = 5 por defecto.\\n• ML.GLOBAL_EXPLAIN: atribución absoluta media por feature en todo el modelo (lineales, árboles, AutoML).\\n• ML.FEATURE_IMPORTANCE (solo árboles): importance_weight, importance_gain e importance_cover de XGBoost.\\n• Series temporales: ML.EXPLAIN_FORECAST.\\n\\nPista de examen: «por qué ESTA predicción» → ML.EXPLAIN_PREDICT; «qué pesa en el modelo» → ML.GLOBAL_EXPLAIN. ML.LOCAL_EXPLAIN no existe.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"explicabilidad\"]},{\"id\":\"m1-10\",\"part\":\"m\",\"front\":\"Tu tabla de fraude tiene 0,3 % de positivos y el LOGISTIC_REG de BigQuery ML predice casi siempre «no fraude» con 99,7 % de accuracy. ¿Qué cambias en CREATE MODEL y cómo lo evalúas?\",\"back\":\"Activa AUTO_CLASS_WEIGHTS = TRUE (o fija CLASS_WEIGHTS) para que la clase minoritaria pese más, y evalúa con recall, precision, F1 y la curva ROC, no con accuracy.\\n\\n• AUTO_CLASS_WEIGHTS pondera cada clase con total_filas / (filas_de_la_clase × número_de_clases).\\n• CLASS_WEIGHTS = [STRUCT('1', 50.0), STRUCT('0', 1.0)] fija pesos a mano; no se combina con AUTO_CLASS_WEIGHTS.\\n• Disponible en LOGISTIC_REG y en clasificadores de árboles como BOOSTED_TREE_CLASSIFIER.\\n• A diferencia del submuestreo, no descarta filas: conserva toda la información de la clase mayoritaria.\\n• Después elige el umbral con ML.ROC_CURVE según el coste de cada error.\\n\\nPista de examen: «clase rara + modelo que siempre dice no» → pesos de clase + métricas de la clase positiva.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"desbalanceo\"]},{\"id\":\"m3-22\",\"part\":\"m\",\"front\":\"Tu modelo de BigQuery ML lleva 3 meses en producción y ya no guardas el dataset de entrenamiento. Quieres saber (a) si los datos de hoy se parecen a los de entrenamiento y (b) si esta semana cambió frente a la anterior. ¿Qué funciones usas?\",\"back\":\"(a) ML.VALIDATE_DATA_SKEW compara los datos de serving con las estadísticas de entrenamiento que el modelo guardó; (b) ML.VALIDATE_DATA_DRIFT compara dos conjuntos de serving.\\n\\n• No necesitas el dataset original para el skew: las estadísticas se guardan al entrenar.\\n• Umbrales por defecto 0.3; categóricas con L_INFTY (por defecto) o JENSEN_SHANNON_DIVERGENCE; numéricas con JENSEN_SHANNON_DIVERGENCE.\\n• Salida por columna: metric, threshold, value e is_anomaly.\\n• ML.DESCRIBE_DATA da estadísticas descriptivas; ML.TFDV_DESCRIBE y ML.TFDV_VALIDATE dan el formato de TFDV.\\n• Si el modelo está registrado en Agent Platform, puedes ver la salida en Model Monitoring.\\n• ML.VALIDATE_DATA_SKEW no admite AutoML, matrix factorization, ARIMA_PLUS ni modelos importados.\\n\\nPista de examen: skew = entrenamiento vs serving; drift = serving vs serving en el tiempo.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"monitorizacion\"]},{\"id\":\"m3-23\",\"part\":\"m\",\"front\":\"Una app móvil necesita la predicción de tu modelo de BigQuery ML en menos de 100 ms por petición. ¿Por qué no basta ML.PREDICT y cuál es el camino?\",\"back\":\"ML.PREDICT es una consulta por lotes; para baja latencia registras el modelo en Agent Platform Model Registry (antes Vertex AI Model Registry) y lo despliegas en un endpoint online.\\n\\n• Al crear: OPTIONS(MODEL_REGISTRY = 'VERTEX_AI', VERTEX_AI_MODEL_ID = 'churn', VERTEX_AI_MODEL_VERSION_ALIASES = ['champion']).\\n• Si ya existe: ALTER MODEL … SET OPTIONS (vertex_ai_model_id = '…').\\n• Requisitos: API de Agent Platform habilitada y el rol Agent Platform Administrator (roles/aiplatform.admin) para registrar.\\n• Desde el registro: desplegar en endpoint sin contenedor propio, comparar versiones, monitorizar y obtener explicaciones.\\n• Todos los tipos se pueden registrar, pero algunos tienen límites de despliegue.\\n\\nPista de examen: «modelo de BigQuery ML + inferencia online» → Model Registry + endpoint, no consultas por petición.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"serving\"]},{\"id\":\"m3-25\",\"part\":\"m\",\"front\":\"Ciencia de datos entrenó un modelo en PyTorch fuera de GCP y negocio quiere puntuar cada noche 2.000 millones de filas que viven en BigQuery, sin moverlas. ¿Qué haces?\",\"back\":\"Exporta el modelo a ONNX, impórtalo en BigQuery ML con CREATE MODEL … OPTIONS(MODEL_TYPE = 'ONNX', MODEL_PATH = 'gs://…') y puntúa con ML.PREDICT en SQL.\\n\\n• Formatos importables: ONNX (PyTorch y scikit-learn se convierten a ONNX), TENSORFLOW (SavedModel), TENSORFLOW_LITE y XGBOOST.\\n• Los archivos se leen desde Cloud Storage; el modelo ONNX importado está limitado a 450 MB.\\n• La inferencia corre dentro de BigQuery: sin endpoint y sin exportar las filas.\\n• Si el modelo necesita GPU o es demasiado grande, alternativa: desplegarlo en un endpoint de Agent Platform y llamarlo desde BigQuery con un modelo remoto.\\n\\nPista de examen: «modelo entrenado fuera + datos en BigQuery + batch» → importar el modelo, no exportar los datos.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"arquitectura\"]},{\"id\":\"m3-26\",\"part\":\"m\",\"front\":\"Necesitas marcar (a) transacciones raras en una tabla sin etiquetas y (b) días anómalos en las ventas diarias de 500 tiendas. ¿Qué modelos y qué función usas en BigQuery ML?\",\"back\":\"En ambos casos ML.DETECT_ANOMALIES: con un modelo KMEANS, PCA o AUTOENCODER para datos sin etiqueta y con ARIMA_PLUS (o ARIMA_PLUS_XREG) para la serie temporal.\\n\\n• Datos sin etiqueta (i.i.d.): STRUCT(0.01 AS contamination) indica la fracción esperada de anomalías.\\n• Series: STRUCT(0.95 AS anomaly_prob_threshold); con TIME_SERIES_ID_COL cubres las 500 tiendas en un solo modelo.\\n• Sin gestionar modelos: AI.DETECT_ANOMALIES usa TimesFM integrado para series.\\n• Revisa los falsos positivos con negocio antes de automatizar alertas.\\n\\nPista de examen: «anomalías sin etiquetas» → no es clasificación supervisada; es KMEANS/PCA/AUTOENCODER + ML.DETECT_ANOMALIES.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"anomalias\"]}],\"cardsEn\":[{\"id\":\"m3-01\",\"part\":\"m\",\"front\":\"Your data already lives in BigQuery and the team only knows SQL. When is BigQuery ML the right tool, and where does it fall short?\",\"back\":\"BigQuery ML trains, evaluates and uses models with SQL where the data already lives, without exporting it or running your own infrastructure.\\n\\n• Good fit: tabular data in BigQuery, a SQL team, batch scoring (ML.PREDICT over millions of rows), fast prototypes.\\n• Types: LINEAR_REG, LOGISTIC_REG, BOOSTED_TREE_*, RANDOM_FOREST_*, DNN_*, AUTOML_*, KMEANS, MATRIX_FACTORIZATION, PCA, AUTOENCODER, ARIMA_PLUS(_XREG); it also imports ONNX, TENSORFLOW or XGBOOST and creates remote models over Gemini.\\n• Falls short: custom architectures, distributed GPU/TPU training or millisecond online inference (for that you register it in Model Registry and deploy it to an endpoint).\\n\\nExam cue: «SQL team + data in BigQuery + minimal data movement» → BigQuery ML.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery-ml\",\"arquitectura\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-15\",\"part\":\"m\",\"front\":\"Five requests: will the customer churn?, how much will they spend?, group customers with no labels, recommend products, and forecast daily sales. Which BigQuery ML MODEL_TYPE do you pick for each?\",\"back\":\"The problem type picks the MODEL_TYPE: classification, regression, clustering, recommendation or time series.\\n\\n• Will they churn? (yes/no) → LOGISTIC_REG or BOOSTED_TREE_CLASSIFIER (also RANDOM_FOREST, DNN or AUTOML_CLASSIFIER).\\n• How much will they spend? (a number) → LINEAR_REG or BOOSTED_TREE_REGRESSOR.\\n• Groups with no labels → KMEANS.\\n• User–product recommendations → MATRIX_FACTORIZATION (+ ML.RECOMMEND).\\n• Future sales → ARIMA_PLUS, or ARIMA_PLUS_XREG when there are covariates.\\n• Extra: reduce dimensions → PCA; explain why a metric changed between two periods → CONTRIBUTION_ANALYSIS.\\n\\nExam cue: LOGISTIC_REG is classification even though it is called «regression».\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery-ml\",\"tipos-de-modelo\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-03\",\"part\":\"m\",\"front\":\"You have a trained BigQuery ML model and 20 million customers to score tonight. How do you call ML.PREDICT and what does it return?\",\"back\":\"ML.PREDICT is a table function: SELECT * FROM ML.PREDICT(MODEL ds.model, (SELECT …)) returns your columns plus predicted_\u003clabel\u003e.\\n\\n• For classification it adds predicted_\u003clabel\u003e_probs (probability per class).\\n• Binary classification: STRUCT(0.7 AS threshold) changes the threshold (0.5 by default) without retraining.\\n• If the model used TRANSFORM, you pass the raw columns: the preprocessing is reapplied automatically.\\n• It is batch inference: no endpoint to maintain; persist the result with CREATE TABLE … AS SELECT and schedule it as a scheduled query.\\n• If hyperparameter tuning ran, it uses the optimal trial unless you pass TRIAL_ID.\\n\\nExam cue: «score a large table every night» → ML.PREDICT; «answer an app in milliseconds» → online endpoint.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery-ml\",\"inferencia\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-02\",\"part\":\"m\",\"front\":\"You are about to write your first CREATE MODEL to predict the churn column. What goes in OPTIONS, and which options matter for the exam?\",\"back\":\"CREATE MODEL trains on the result of a SELECT and is configured in OPTIONS: MODEL_TYPE is required and the label goes in INPUT_LABEL_COLS.\\n\\n• INPUT_LABEL_COLS = ['churn'] (if omitted it looks for a column named label; the label cannot contain NULL).\\n• Variants: CREATE MODEL (fails if it exists), CREATE MODEL IF NOT EXISTS, CREATE OR REPLACE MODEL.\\n• Split: DATA_SPLIT_METHOD, DATA_SPLIT_EVAL_FRACTION, DATA_SPLIT_COL.\\n• Regularization: L1_REG, L2_REG. LINEAR_REG only: OPTIMIZE_STRATEGY = AUTO_STRATEGY | BATCH_GRADIENT_DESCENT | NORMAL_EQUATION.\\n• Imbalance: AUTO_CLASS_WEIGHTS or CLASS_WEIGHTS. Global explanation: ENABLE_GLOBAL_EXPLAIN = TRUE.\\n• Tuning: NUM_TRIALS + HPARAM_TUNING_OBJECTIVES. Registry: MODEL_REGISTRY = 'VERTEX_AI'.\\n\\nExam cue: LABEL_COLUMNS, L0_REG or DATA_SPLIT_METHOD = 'K_FOLD' do not exist.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"entrenamiento\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-16\",\"part\":\"m\",\"front\":\"You train a demand model on 3 years of daily data and want to evaluate on the most recent months, not on random days. Which DATA_SPLIT_METHOD do you use, and what does each one do?\",\"back\":\"Use DATA_SPLIT_METHOD = 'SEQ' with DATA_SPLIT_COL = the date: it sorts by that column and keeps the last rows for evaluation.\\n\\n• AUTO_SPLIT (default): \u003c 500 rows → all training; 500–50,000 → 20% evaluation; \u003e 50,000 → 10,000 evaluation rows.\\n• RANDOM: random and deterministic, with DATA_SPLIT_EVAL_FRACTION (0.2 by default).\\n• CUSTOM: a boolean DATA_SPLIT_COL (TRUE or NULL = evaluation); with tuning, a STRING column with TRAIN/EVAL/TEST.\\n• NO_SPLIT: everything is training.\\n• With NUM_TRIALS the split becomes three-way: 80% / 10% / 10% (train/eval/test).\\n\\nExam cue: time-ordered data + random split = the future leaks into the past. BigQuery ML has no k-fold option.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"validacion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-04\",\"part\":\"m\",\"front\":\"You just trained a classifier in BigQuery ML. What does ML.EVALUATE return with and without an input table, and how do you compare two models?\",\"back\":\"ML.EVALUATE returns the model's metrics: without a table, those computed during training; with a table, those for that data.\\n\\n• Classification: precision, recall, accuracy, f1_score, log_loss, roc_auc (multiclass: macro-averaged except accuracy).\\n• Regression: mean_absolute_error, mean_squared_error, mean_squared_log_error, median_absolute_error, r2_score, explained_variance.\\n• K-means: davies_bouldin_index and mean_squared_distance.\\n• STRUCT(0.6 AS threshold) only for binary classification (0.5 by default).\\n• With tuning it uses the optimal trial and the test data; TRIAL_ID picks another.\\n• Comparing models = ML.EVALUATE on each one over the SAME validation table.\\n\\nExam cue: ML.COMPARE does not exist. For an ARIMA_PLUS model's parameters (p, d, q, AIC) use ML.ARIMA_EVALUATE.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"metricas\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-19\",\"part\":\"m\",\"front\":\"Your binary fraud classifier uses a 0.5 threshold and misses too many frauds. Which BigQuery ML functions let you pick another threshold without retraining?\",\"back\":\"ML.ROC_CURVE shows recall and false positive rate for each threshold, and you apply the chosen one with STRUCT(… AS threshold) in ML.PREDICT, ML.EVALUATE or ML.CONFUSION_MATRIX.\\n\\n• ML.ROC_CURVE (binary only): per threshold it returns recall, false_positive_rate and the true/false positive/negative counts.\\n• ML.CONFUSION_MATRIX: the matrix for one specific threshold.\\n• Lowering the threshold raises recall (more frauds caught) and lowers precision (more false alarms).\\n• Choose the point by the business cost of each error, not by the default 0.5.\\n\\nExam cue: ML.THRESHOLD_EVALUATE does not exist; «choose a threshold» → ML.ROC_CURVE + threshold.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"metricas\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-17\",\"part\":\"m\",\"front\":\"Your training SQL normalizes and buckets several columns, and the app team copied that logic by hand for prediction. Which BigQuery ML clause avoids that duplication, and why?\",\"back\":\"CREATE MODEL's TRANSFORM clause stores the preprocessing inside the model, and BigQuery reapplies it automatically in ML.PREDICT and ML.EVALUATE.\\n\\n• Example: TRANSFORM(ML.QUANTILE_BUCKETIZE(age, 10) OVER() AS age_q, ML.STANDARD_SCALER(income) OVER() AS income_s, churn).\\n• The transformation statistics (quantiles, means) are computed on the training data and stored: serving uses the same ones.\\n• At prediction time you pass the raw columns; columns that TRANSFORM dropped are not needed.\\n• Only TRANSFORM's output columns are used for training.\\n\\nExam cue: «same transformation in training and prediction without duplicating code» → TRANSFORM (in TensorFlow the equivalent is tf.Transform or Keras preprocessing layers).\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"skew\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-09\",\"part\":\"m\",\"front\":\"You suspect a column arrived almost entirely NULL when your BigQuery ML model was trained. Which function confirms it on the already-built model, and what does it NOT tell you?\",\"back\":\"ML.FEATURE_INFO returns statistics for each input column of the model (min, max, mean, median, standard deviation, category count and null count).\\n\\n• Confirm the suspicion by checking that column's null_count.\\n• It does not describe the architecture or the weights: for weights use ML.WEIGHTS; for the loss curve per iteration, ML.TRAINING_INFO.\\n• To describe any table (not a model), use ML.DESCRIBE_DATA.\\n• It works with every model type, including transform-only models.\\n\\nExam cue: «statistics of the features the model was trained on» → ML.FEATURE_INFO.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"calidad-datos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-11\",\"part\":\"m\",\"front\":\"The business wants to know whether «tenure» raises or lowers churn probability in your LOGISTIC_REG, and how significant it is. Which function do you use, and for which models does it not work?\",\"back\":\"ML.WEIGHTS returns the learned coefficients of linear and logistic models (and of matrix factorization): the sign gives the direction and the magnitude the weight.\\n\\n• Significance: ML.ADVANCED_WEIGHTS adds standard errors and p-values, but needs CALCULATE_P_VALUES = TRUE at training.\\n• Trees (boosted, random forest), DNN and autoencoder have no weights function: for trees use ML.FEATURE_IMPORTANCE.\\n• K-means → ML.CENTROIDS; PCA → ML.PRINCIPAL_COMPONENTS.\\n• With tuning, ML.WEIGHTS returns every trial's weights (first column trial_id).\\n\\nExam cue: «coefficients of the linear model» → ML.WEIGHTS; «p-values» → ML.ADVANCED_WEIGHTS.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"interpretabilidad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-18\",\"part\":\"m\",\"front\":\"You want BigQuery ML to try 30 learning-rate/depth combinations and keep the one with the best ROC AUC. How do you turn tuning on, and where do you see each attempt?\",\"back\":\"Tuning is turned on with NUM_TRIALS in CREATE MODEL; ranges use HPARAM_RANGE or HPARAM_CANDIDATES and each attempt is shown by ML.TRIAL_INFO.\\n\\n• Example: NUM_TRIALS = 30, LEARN_RATE = HPARAM_RANGE(0.01, 0.5), MAX_TREE_DEPTH = HPARAM_CANDIDATES([4, 6, 8]).\\n• HPARAM_TUNING_OBJECTIVES = ['ROC_AUC'] (one objective only; ROC_AUC is the classification default).\\n• HPARAM_TUNING_ALGORITHM: VIZIER_DEFAULT (default), RANDOM_SEARCH or GRID_SEARCH (discrete spaces only).\\n• MAX_PARALLEL_TRIALS (1–5) speeds it up but can hurt the result with VIZIER_DEFAULT.\\n• ML.TRIAL_INFO: hyperparameters, metric and is_optimal per trial; ML.PREDICT/ML.EVALUATE use the optimal one.\\n\\nExam cue: ML.TUNE does not exist; tuning lives inside CREATE MODEL.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"hiperparametros\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-21\",\"part\":\"m\",\"front\":\"You must forecast 90 days of sales for 4,000 products from BigQuery. Do you train ARIMA_PLUS or use AI.FORECAST, and which functions go with each?\",\"back\":\"ARIMA_PLUS trains one model per series and is highly configurable and explainable; AI.FORECAST uses pre-trained TimesFM and forecasts without creating a model.\\n\\n• ARIMA_PLUS: TIME_SERIES_TIMESTAMP_COL, TIME_SERIES_DATA_COL and TIME_SERIES_ID_COL (thousands of series in one statement); HORIZON; holidays via HOLIDAY_REGION.\\n• Then: ML.FORECAST (values and intervals), ML.EXPLAIN_FORECAST (trend, seasonality, holidays…), ML.ARIMA_EVALUATE.\\n• ARIMA_PLUS_XREG: when the series depends on covariates (price, weather).\\n• AI.FORECAST(TABLE t, data_col =\u003e 'sales', timestamp_col =\u003e 'date', horizon =\u003e 90): very easy to use, little customization; evaluate it with AI.EVALUATE.\\n\\nExam cue: «I must explain the forecast decomposition» → ARIMA_PLUS + ML.EXPLAIN_FORECAST; «no model to train or manage» → AI.FORECAST.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"series-temporales\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-24\",\"part\":\"m\",\"front\":\"An exam item offers ML.TUNE, ML.DETECT_DRIFT, ML.LOCAL_EXPLAIN and ML.COMPARE as options. What do they have in common, and what would you really use for each task?\",\"back\":\"None of them exists in BigQuery ML: they are distractors, and each task has a real function or option.\\n\\n• ML.TUNE → NUM_TRIALS in CREATE MODEL + ML.TRIAL_INFO.\\n• ML.DETECT_DRIFT → ML.VALIDATE_DATA_DRIFT (and ML.VALIDATE_DATA_SKEW for training vs serving).\\n• ML.LOCAL_EXPLAIN → ML.EXPLAIN_PREDICT.\\n• ML.COMPARE → ML.EVALUATE on each model over the same data.\\n• Other common fakes: ML.VALIDATE_FEATURES (→ ML.VALIDATE_DATA_SKEW), ML.THRESHOLD_EVALUATE (→ ML.ROC_CURVE + threshold), plural ML.GENERATE_EMBEDDINGS (→ ML.GENERATE_EMBEDDING or AI.GENERATE_EMBEDDING).\\n• Fake options: LABEL_COLUMNS (→ INPUT_LABEL_COLS), L0_REG, DATA_SPLIT_METHOD = 'K_FOLD'.\\n\\nExam cue: if a name «sounds logical» but you never saw it in the reference, be suspicious.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"examen\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-10\",\"part\":\"m\",\"front\":\"A regulator asks you (a) to justify rejecting customer 8812's loan and (b) which variables matter most in your BOOSTED_TREE_CLASSIFIER, trained with no extra options. What do you run, and what is missing?\",\"back\":\"For (a) run ML.EXPLAIN_PREDICT on the customer's row; for (b) ML.FEATURE_IMPORTANCE already works, but ML.GLOBAL_EXPLAIN requires retraining with ENABLE_GLOBAL_EXPLAIN = TRUE.\\n\\n• ML.EXPLAIN_PREDICT: prediction + per-feature attribution (Tree SHAP for trees, Shapley for linear models) against a baseline; top_k_features = 5 by default.\\n• ML.GLOBAL_EXPLAIN: mean absolute attribution per feature over the whole model (linear, trees, AutoML).\\n• ML.FEATURE_IMPORTANCE (trees only): XGBoost's importance_weight, importance_gain and importance_cover.\\n• Time series: ML.EXPLAIN_FORECAST.\\n\\nExam cue: «why THIS prediction» → ML.EXPLAIN_PREDICT; «what drives the model» → ML.GLOBAL_EXPLAIN. ML.LOCAL_EXPLAIN does not exist.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"explicabilidad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-10\",\"part\":\"m\",\"front\":\"Your fraud table has 0.3% positives and the BigQuery ML LOGISTIC_REG almost always predicts «not fraud» with 99.7% accuracy. What do you change in CREATE MODEL, and how do you evaluate it?\",\"back\":\"Turn on AUTO_CLASS_WEIGHTS = TRUE (or set CLASS_WEIGHTS) so the minority class weighs more, and evaluate with recall, precision, F1 and the ROC curve, not accuracy.\\n\\n• AUTO_CLASS_WEIGHTS weights each class by total_rows / (rows_in_class × number_of_classes).\\n• CLASS_WEIGHTS = [STRUCT('1', 50.0), STRUCT('0', 1.0)] sets weights by hand; it cannot be combined with AUTO_CLASS_WEIGHTS.\\n• Available in LOGISTIC_REG and in tree classifiers such as BOOSTED_TREE_CLASSIFIER.\\n• Unlike undersampling, it drops no rows: it keeps all the majority-class information.\\n• Then pick the threshold with ML.ROC_CURVE according to the cost of each error.\\n\\nExam cue: «rare class + a model that always says no» → class weights + positive-class metrics.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"desbalanceo\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-22\",\"part\":\"m\",\"front\":\"Your BigQuery ML model has been in production for 3 months and you no longer keep the training dataset. You want to know (a) whether today's data looks like the training data and (b) whether this week changed versus last week. Which functions do you use?\",\"back\":\"(a) ML.VALIDATE_DATA_SKEW compares serving data with the training statistics the model stored; (b) ML.VALIDATE_DATA_DRIFT compares two serving datasets.\\n\\n• You don't need the original dataset for skew: statistics are saved at training time.\\n• Default thresholds 0.3; categorical features with L_INFTY (default) or JENSEN_SHANNON_DIVERGENCE; numerical with JENSEN_SHANNON_DIVERGENCE.\\n• Output per column: metric, threshold, value and is_anomaly.\\n• ML.DESCRIBE_DATA gives descriptive statistics; ML.TFDV_DESCRIBE and ML.TFDV_VALIDATE give the TFDV format.\\n• If the model is registered in Agent Platform, you can view the output in Model Monitoring.\\n• ML.VALIDATE_DATA_SKEW does not support AutoML, matrix factorization, ARIMA_PLUS or imported models.\\n\\nExam cue: skew = training vs serving; drift = serving vs serving over time.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"monitorizacion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-23\",\"part\":\"m\",\"front\":\"A mobile app needs your BigQuery ML model's prediction in under 100 ms per request. Why is ML.PREDICT not enough, and what is the path?\",\"back\":\"ML.PREDICT is a batch query; for low latency you register the model in Agent Platform Model Registry (formerly Vertex AI Model Registry) and deploy it to an online endpoint.\\n\\n• At creation: OPTIONS(MODEL_REGISTRY = 'VERTEX_AI', VERTEX_AI_MODEL_ID = 'churn', VERTEX_AI_MODEL_VERSION_ALIASES = ['champion']).\\n• If it already exists: ALTER MODEL … SET OPTIONS (vertex_ai_model_id = '…').\\n• Requirements: the Agent Platform API enabled and the Agent Platform Administrator role (roles/aiplatform.admin) to register.\\n• From the registry: deploy to an endpoint without your own container, compare versions, monitor and get explanations.\\n• Every model type can be registered, but some have deployment limits.\\n\\nExam cue: «BigQuery ML model + online inference» → Model Registry + endpoint, not a query per request.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"serving\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-25\",\"part\":\"m\",\"front\":\"Data science trained a PyTorch model outside GCP, and the business wants to score 2 billion rows that live in BigQuery every night without moving them. What do you do?\",\"back\":\"Export the model to ONNX, import it into BigQuery ML with CREATE MODEL … OPTIONS(MODEL_TYPE = 'ONNX', MODEL_PATH = 'gs://…') and score with ML.PREDICT in SQL.\\n\\n• Importable formats: ONNX (PyTorch and scikit-learn convert to ONNX), TENSORFLOW (SavedModel), TENSORFLOW_LITE and XGBOOST.\\n• Files are read from Cloud Storage; an imported ONNX model is limited to 450 MB.\\n• Inference runs inside BigQuery: no endpoint and no exported rows.\\n• If the model needs GPUs or is too large, the alternative is deploying it to an Agent Platform endpoint and calling it from BigQuery through a remote model.\\n\\nExam cue: «model trained elsewhere + data in BigQuery + batch» → import the model, don't export the data.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"arquitectura\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m3-26\",\"part\":\"m\",\"front\":\"You need to flag (a) rare transactions in an unlabeled table and (b) anomalous days in the daily sales of 500 stores. Which models and which function do you use in BigQuery ML?\",\"back\":\"ML.DETECT_ANOMALIES in both cases: with a KMEANS, PCA or AUTOENCODER model for unlabeled data, and with ARIMA_PLUS (or ARIMA_PLUS_XREG) for the time series.\\n\\n• Unlabeled (i.i.d.) data: STRUCT(0.01 AS contamination) sets the expected fraction of anomalies.\\n• Series: STRUCT(0.95 AS anomaly_prob_threshold); TIME_SERIES_ID_COL covers all 500 stores in one model.\\n• No models to manage: AI.DETECT_ANOMALIES uses the built-in TimesFM for series.\\n• Review false positives with the business before automating alerts.\\n\\nExam cue: «anomalies without labels» → not supervised classification; it is KMEANS/PCA/AUTOENCODER + ML.DETECT_ANOMALIES.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"anomalias\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"}]},{\"id\":\"s2-practica\",\"kind\":\"practice\",\"minutes\":15,\"title\":{\"es\":\"Práctica: entrenar, evaluar y explicar un clasificador de bajas\",\"en\":\"Practice: train, evaluate and explain a churn classifier\"},\"scaffolding\":\"medium\",\"instructions\":{\"es\":\"La tabla crm.churn_snapshot tiene una fila por cliente y fecha_snapshot, la etiqueta churn (BOOL) y 4 features. Completa el CREATE MODEL de un BOOSTED_TREE_CLASSIFIER que: use churn como etiqueta, compense el desbalanceo automáticamente, permita explicación global y evalúe con el 20 % más reciente por fecha. Después escribe las consultas para las métricas, la curva ROC y la importancia global.\",\"en\":\"Table crm.churn_snapshot has one row per customer and fecha_snapshot, the churn label (BOOL) and 4 features. Complete the CREATE MODEL for a BOOSTED_TREE_CLASSIFIER that uses churn as the label, compensates the imbalance automatically, allows global explanation and evaluates on the most recent 20% by date. Then write the queries for the metrics, the ROC curve and global importance.\"},\"starter\":\"CREATE OR REPLACE MODEL ml.churn_bt\\nOPTIONS (\\n  MODEL_TYPE = 'BOOSTED_TREE_CLASSIFIER',\\n  INPUT_LABEL_COLS = ...,\\n  -- desbalanceo: ...\\n  -- explicación global: ...\\n  DATA_SPLIT_METHOD = ...,\\n  DATA_SPLIT_COL = ...,\\n  DATA_SPLIT_EVAL_FRACTION = ...\\n) AS\\nSELECT fecha_snapshot, antiguedad_meses, plan, cargos_mes, num_tickets_90d, churn\\nFROM crm.churn_snapshot;\\n\\n-- 1) métricas  2) curva ROC  3) importancia global\\n\",\"hints\":[{\"es\":\"Para evaluar con lo más reciente usa la división secuencial sobre la fecha.\",\"en\":\"To evaluate on the most recent data use the sequential split on the date.\"},{\"es\":\"ML.GLOBAL_EXPLAIN falla si el modelo no se entrenó con la opción que la habilita.\",\"en\":\"ML.GLOBAL_EXPLAIN fails if the model was not trained with the option that enables it.\"}],\"solution\":\"CREATE OR REPLACE MODEL ml.churn_bt\\nOPTIONS (\\n  MODEL_TYPE = 'BOOSTED_TREE_CLASSIFIER',\\n  INPUT_LABEL_COLS = ['churn'],\\n  AUTO_CLASS_WEIGHTS = TRUE,\\n  ENABLE_GLOBAL_EXPLAIN = TRUE,\\n  DATA_SPLIT_METHOD = 'SEQ',\\n  DATA_SPLIT_COL = 'fecha_snapshot',\\n  DATA_SPLIT_EVAL_FRACTION = 0.2\\n) AS\\nSELECT fecha_snapshot, antiguedad_meses, plan, cargos_mes, num_tickets_90d, churn\\nFROM crm.churn_snapshot;\\n\\nSELECT * FROM ML.EVALUATE(MODEL ml.churn_bt);\\nSELECT * FROM ML.ROC_CURVE(MODEL ml.churn_bt);\\nSELECT * FROM ML.GLOBAL_EXPLAIN(MODEL ml.churn_bt);\\n\",\"language\":\"sql\",\"criteria\":[{\"es\":\"CREATE MODEL termina sin error y ML.EVALUATE devuelve precision, recall, f1_score, log_loss y roc_auc.\",\"en\":\"CREATE MODEL finishes without error and ML.EVALUATE returns precision, recall, f1_score, log_loss and roc_auc.\"},{\"es\":\"ML.ROC_CURVE devuelve una fila por umbral con recall y false_positive_rate.\",\"en\":\"ML.ROC_CURVE returns one row per threshold with recall and false_positive_rate.\"},{\"es\":\"ML.GLOBAL_EXPLAIN devuelve una atribución por feature (si falla, falta ENABLE_GLOBAL_EXPLAIN = TRUE).\",\"en\":\"ML.GLOBAL_EXPLAIN returns one attribution per feature (if it fails, ENABLE_GLOBAL_EXPLAIN = TRUE is missing).\"},{\"es\":\"fecha_snapshot no aparece como feature: DATA_SPLIT_COL se excluye del entrenamiento.\",\"en\":\"fecha_snapshot does not show up as a feature: DATA_SPLIT_COL is excluded from training.\"}]},{\"id\":\"s2-escenarios\",\"kind\":\"scenarios\",\"minutes\":8,\"title\":{\"es\":\"Escenarios: qué modelo y qué función\",\"en\":\"Scenarios: which model and which function\"},\"items\":[{\"id\":\"s2-q1\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"bigquery-ml\",\"tipos-de-modelo\"],\"prompt\":{\"es\":\"Un e-commerce tiene en BigQuery 300 millones de interacciones usuario–producto (vistas y compras) y quiere sugerir 10 productos por usuario cada noche. El equipo solo usa SQL. ¿Qué MODEL_TYPE eliges?\",\"en\":\"An e-commerce site has 300 million user–product interactions (views and purchases) in BigQuery and wants to suggest 10 products per user every night. The team only uses SQL. Which MODEL_TYPE do you choose?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"KMEANS\",\"en\":\"KMEANS\"},\"correct\":false,\"why\":{\"es\":\"Agrupa usuarios parecidos, pero no puntúa pares usuario–producto.\",\"en\":\"Groups similar users, but does not score user–product pairs.\"}},{\"id\":\"B\",\"text\":{\"es\":\"LOGISTIC_REG con el id de producto como etiqueta\",\"en\":\"LOGISTIC_REG with the product id as the label\"},\"correct\":false,\"why\":{\"es\":\"Convierte millones de productos en clases: inmanejable y sin señal colaborativa.\",\"en\":\"Turns millions of products into classes: unmanageable and without collaborative signal.\"}},{\"id\":\"C\",\"text\":{\"es\":\"ARIMA_PLUS\",\"en\":\"ARIMA_PLUS\"},\"correct\":false,\"why\":{\"es\":\"Es para series temporales, no para preferencias.\",\"en\":\"It is for time series, not preferences.\"}},{\"id\":\"D\",\"text\":{\"es\":\"MATRIX_FACTORIZATION y ML.RECOMMEND\",\"en\":\"MATRIX_FACTORIZATION and ML.RECOMMEND\"},\"correct\":true,\"why\":{\"es\":\"Gana: aprende factores de usuarios y productos a partir de las interacciones y recomienda en SQL.\",\"en\":\"Wins: it learns user and product factors from the interactions and recommends in SQL.\"}}],\"takeaway\":{\"es\":\"Interacciones usuario–ítem → matrix factorization.\",\"en\":\"User–item interactions → matrix factorization.\"}},{\"id\":\"s2-q2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"series-temporales\"],\"prompt\":{\"es\":\"Debes prever 12 semanas de demanda para 4.000 productos y el comité exige ver qué parte del pronóstico es tendencia, estacionalidad y efecto de festivos. Los datos están en BigQuery. ¿Qué haces?\",\"en\":\"You must forecast 12 weeks of demand for 4,000 products, and the committee demands to see which part of the forecast is trend, seasonality and holiday effect. The data is in BigQuery. What do you do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"AI.FORECAST con TimesFM, sin crear modelo\",\"en\":\"AI.FORECAST with TimesFM, with no model\"},\"correct\":false,\"why\":{\"es\":\"Es rápido, pero su explicabilidad es baja: no da la descomposición que pide el comité.\",\"en\":\"It is fast, but its explainability is low: it does not provide the decomposition the committee asks for.\"}},{\"id\":\"B\",\"text\":{\"es\":\"ARIMA_PLUS con TIME_SERIES_ID_COL y HOLIDAY_REGION, y ML.EXPLAIN_FORECAST\",\"en\":\"ARIMA_PLUS with TIME_SERIES_ID_COL and HOLIDAY_REGION, plus ML.EXPLAIN_FORECAST\"},\"correct\":true,\"why\":{\"es\":\"Gana: entrena las 4.000 series en una sentencia y ML.EXPLAIN_FORECAST muestra tendencia, estacionalidad y festivos.\",\"en\":\"Wins: it trains all 4,000 series in one statement and ML.EXPLAIN_FORECAST shows trend, seasonality and holidays.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Un LINEAR_REG por producto con la fecha como feature\",\"en\":\"One LINEAR_REG per product with the date as a feature\"},\"correct\":false,\"why\":{\"es\":\"4.000 modelos manuales sin componentes de serie temporal.\",\"en\":\"4,000 manual models with no time series components.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Exportar a CSV y usar una hoja de cálculo\",\"en\":\"Export to CSV and use a spreadsheet\"},\"correct\":false,\"why\":{\"es\":\"No escala a 4.000 series ni da intervalos.\",\"en\":\"Does not scale to 4,000 series or give intervals.\"}}],\"takeaway\":{\"es\":\"Explicar la descomposición → ARIMA_PLUS + ML.EXPLAIN_FORECAST; sin modelo → AI.FORECAST.\",\"en\":\"Explain the decomposition → ARIMA_PLUS + ML.EXPLAIN_FORECAST; no model → AI.FORECAST.\"}}],\"questions\":[{\"key\":\"s2-q1\",\"prompt\":\"$6:props:flow:stages:1:steps:3:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:3:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:3:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:3:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:3:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:3:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:3:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:3:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:3:items:0:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:1:steps:3:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"s2-q2\",\"prompt\":\"$6:props:flow:stages:1:steps:3:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:3:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:3:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:3:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:3:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:3:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:3:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:3:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:3:items:1:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:1:steps:3:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"}]},{\"id\":\"s2-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: el escalado que solo existe en entrenamiento\",\"en\":\"Lab: the scaling that only exists in training\"},\"symptom\":{\"es\":\"Desde el despliegue, el 97 % de los clientes sale como «alto riesgo» en el job nocturno de ML.PREDICT. En validación el modelo era correcto. ML.VALIDATE_DATA_SKEW devuelve is_anomaly = TRUE para ingreso con value 0,94.\",\"en\":\"Since deployment, 97% of customers come out as «high risk» in the nightly ML.PREDICT job. In validation the model was fine. ML.VALIDATE_DATA_SKEW returns is_anomaly = TRUE for income with value 0.94.\"},\"artifact\":\"-- Entrenamiento\\nCREATE OR REPLACE MODEL ml.riesgo\\nOPTIONS (MODEL_TYPE = 'LOGISTIC_REG', INPUT_LABEL_COLS = ['impago']) AS\\nSELECT (ingreso - 52000) / 18000 AS ingreso, antiguedad, impago\\nFROM banca.historico;\\n\\n-- Job nocturno\\nSELECT * FROM ML.PREDICT(MODEL ml.riesgo,\\n  (SELECT cliente_id, ingreso, antiguedad FROM banca.clientes_hoy));\",\"language\":\"sql\",\"question\":{\"es\":\"¿Cuál es la causa raíz?\",\"en\":\"What is the root cause?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El modelo sobreajustó y hay que añadir L2_REG\",\"en\":\"The model overfit and needs L2_REG\"},\"correct\":false,\"why\":{\"es\":\"El modelo funcionaba en validación; el problema aparece al cambiar la entrada.\",\"en\":\"The model worked in validation; the problem appears when the input changes.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Concept drift: los clientes cambiaron de comportamiento\",\"en\":\"Concept drift: customers changed behavior\"},\"correct\":false,\"why\":{\"es\":\"Pasó desde el primer día y sin cambio de comportamiento: no es drift.\",\"en\":\"It happened from day one with no change in behavior: it is not drift.\"}},{\"id\":\"C\",\"text\":{\"es\":\"El escalado de ingreso se hizo fuera del modelo y el job pasa el ingreso crudo\",\"en\":\"Income scaling happened outside the model and the job passes raw income\"},\"correct\":true,\"why\":{\"es\":\"Gana: el modelo espera ingreso estandarizado y recibe valores en miles; por eso el skew sale en esa columna.\",\"en\":\"Wins: the model expects standardized income and receives values in the thousands; that is why skew shows on that column.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Falta AUTO_CLASS_WEIGHTS\",\"en\":\"AUTO_CLASS_WEIGHTS is missing\"},\"correct\":false,\"why\":{\"es\":\"Los pesos de clase no explican un salto que solo ocurre al predecir.\",\"en\":\"Class weights do not explain a jump that only happens at prediction time.\"}}],\"rootCause\":{\"es\":\"Training-serving skew: el preprocesado (estandarizar ingreso) vive en el SELECT de entrenamiento y no en el modelo, así que ML.PREDICT recibe la columna sin transformar.\",\"en\":\"Training-serving skew: the preprocessing (standardizing income) lives in the training SELECT and not in the model, so ML.PREDICT receives the untransformed column.\"},\"fix\":\"CREATE OR REPLACE MODEL ml.riesgo\\nTRANSFORM (ML.STANDARD_SCALER(ingreso) OVER () AS ingreso_s, antiguedad, impago)\\nOPTIONS (MODEL_TYPE = 'LOGISTIC_REG', INPUT_LABEL_COLS = ['impago']) AS\\nSELECT ingreso, antiguedad, impago FROM banca.historico;\",\"fixNote\":{\"es\":\"Con TRANSFORM, las estadísticas de escalado se guardan en el modelo y ML.PREDICT las reaplica a la columna cruda: el job nocturno no cambia.\",\"en\":\"With TRANSFORM, the scaling statistics are stored in the model and ML.PREDICT reapplies them to the raw column: the nightly job does not change.\"},\"questions\":[{\"key\":\"s2-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:1:steps:4:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:4:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:4:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:4:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:4:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:4:options:3:why\"}],\"correct\":\"C\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s2-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":12,\"title\":{\"es\":\"Checkpoint: BigQuery ML\",\"en\":\"Checkpoint: BigQuery ML\"},\"items\":[{\"id\":\"s2-c1\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"bigquery-ml\",\"metricas\"],\"prompt\":{\"es\":\"Tu clasificador binario de BigQuery ML usa el umbral 0,5 y negocio quiere ver, sin reentrenar, cómo cambian recall y tasa de falsos positivos con cada umbral posible. ¿Qué consultas?\",\"en\":\"Your BigQuery ML binary classifier uses a 0.5 threshold, and the business wants to see, without retraining, how recall and false positive rate change for each possible threshold. What do you query?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"ML.ROC_CURVE\",\"en\":\"ML.ROC_CURVE\"},\"correct\":true,\"why\":{\"es\":\"Gana: devuelve recall, false_positive_rate y conteos por umbral para clasificadores binarios.\",\"en\":\"Wins: it returns recall, false_positive_rate and counts per threshold for binary classifiers.\"}},{\"id\":\"B\",\"text\":{\"es\":\"ML.THRESHOLD_EVALUATE\",\"en\":\"ML.THRESHOLD_EVALUATE\"},\"correct\":false,\"why\":{\"es\":\"No existe: es un distractor clásico.\",\"en\":\"It does not exist: a classic distractor.\"}},{\"id\":\"C\",\"text\":{\"es\":\"ML.TRAINING_INFO\",\"en\":\"ML.TRAINING_INFO\"},\"correct\":false,\"why\":{\"es\":\"Da la pérdida por iteración de entrenamiento, no métricas por umbral.\",\"en\":\"Gives loss per training iteration, not metrics per threshold.\"}},{\"id\":\"D\",\"text\":{\"es\":\"ML.FEATURE_INFO\",\"en\":\"ML.FEATURE_INFO\"},\"correct\":false,\"why\":{\"es\":\"Da estadísticas de las features de entrada.\",\"en\":\"Gives statistics of the input features.\"}}],\"takeaway\":{\"es\":\"Umbral sin reentrenar → ML.ROC_CURVE y luego STRUCT(… AS threshold).\",\"en\":\"Threshold without retraining → ML.ROC_CURVE and then STRUCT(… AS threshold).\"}},{\"id\":\"s2-c2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"hiperparametros\"],\"prompt\":{\"es\":\"Quieres que BigQuery ML pruebe 20 combinaciones de LEARN_RATE y MAX_TREE_DEPTH, se quede con la de mejor ROC AUC y te deje revisar cada intento, sin salir de SQL. ¿Qué escribes?\",\"en\":\"You want BigQuery ML to try 20 LEARN_RATE and MAX_TREE_DEPTH combinations, keep the one with the best ROC AUC and let you review each attempt, without leaving SQL. What do you write?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"SELECT * FROM ML.TUNE(MODEL …, STRUCT(20 AS max_trials))\",\"en\":\"SELECT * FROM ML.TUNE(MODEL …, STRUCT(20 AS max_trials))\"},\"correct\":false,\"why\":{\"es\":\"ML.TUNE no existe en BigQuery ML.\",\"en\":\"ML.TUNE does not exist in BigQuery ML.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Veinte CREATE MODEL distintos y comparar con ML.COMPARE\",\"en\":\"Twenty separate CREATE MODEL statements compared with ML.COMPARE\"},\"correct\":false,\"why\":{\"es\":\"ML.COMPARE no existe y repetir modelos a mano no aprovecha el tuning nativo.\",\"en\":\"ML.COMPARE does not exist, and repeating models by hand misses native tuning.\"}},{\"id\":\"C\",\"text\":{\"es\":\"NUM_TRIALS = 20 con HPARAM_RANGE/HPARAM_CANDIDATES y HPARAM_TUNING_OBJECTIVES = ['ROC_AUC'], y después ML.TRIAL_INFO\",\"en\":\"NUM_TRIALS = 20 with HPARAM_RANGE/HPARAM_CANDIDATES and HPARAM_TUNING_OBJECTIVES = ['ROC_AUC'], then ML.TRIAL_INFO\"},\"correct\":true,\"why\":{\"es\":\"Gana: el tuning vive dentro de CREATE MODEL y ML.TRIAL_INFO muestra cada trial y cuál es el óptimo.\",\"en\":\"Wins: tuning lives inside CREATE MODEL and ML.TRIAL_INFO shows each trial and which one is optimal.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Exportar a Agent Platform y lanzar un trabajo de tuning\",\"en\":\"Export to Agent Platform and launch a tuning job\"},\"correct\":false,\"why\":{\"es\":\"Funciona, pero añade movimiento y código cuando SQL ya lo resuelve.\",\"en\":\"It works, but adds data movement and code when SQL already solves it.\"}}],\"takeaway\":{\"es\":\"En BigQuery ML el tuning es NUM_TRIALS + ML.TRIAL_INFO.\",\"en\":\"In BigQuery ML tuning is NUM_TRIALS + ML.TRIAL_INFO.\"}},{\"id\":\"s2-c3\",\"type\":\"metric_selection\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"monitorizacion\"],\"prompt\":{\"es\":\"Ya no conservas el dataset de entrenamiento de tu modelo de BigQuery ML. Quieres comprobar cada lunes si los datos de serving se parecen a los del entrenamiento, con umbrales por columna. ¿Qué función usas?\",\"en\":\"You no longer keep your BigQuery ML model's training dataset. Every Monday you want to check whether serving data resembles the training data, with per-column thresholds. Which function do you use?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"ML.VALIDATE_DATA_DRIFT entre esta semana y la anterior\",\"en\":\"ML.VALIDATE_DATA_DRIFT between this week and last week\"},\"correct\":false,\"why\":{\"es\":\"Compara dos conjuntos de serving: mide drift, no la distancia al entrenamiento.\",\"en\":\"Compares two serving datasets: it measures drift, not distance to training.\"}},{\"id\":\"B\",\"text\":{\"es\":\"ML.VALIDATE_DATA_SKEW sobre los datos de serving\",\"en\":\"ML.VALIDATE_DATA_SKEW on the serving data\"},\"correct\":true,\"why\":{\"es\":\"Gana: compara con las estadísticas de entrenamiento que el modelo guardó, sin necesitar el dataset original.\",\"en\":\"Wins: it compares with the training statistics the model stored, without needing the original dataset.\"}},{\"id\":\"C\",\"text\":{\"es\":\"ML.DETECT_DRIFT\",\"en\":\"ML.DETECT_DRIFT\"},\"correct\":false,\"why\":{\"es\":\"No existe en BigQuery ML.\",\"en\":\"It does not exist in BigQuery ML.\"}},{\"id\":\"D\",\"text\":{\"es\":\"ML.EVALUATE sin tabla de entrada\",\"en\":\"ML.EVALUATE with no input table\"},\"correct\":false,\"why\":{\"es\":\"Devuelve métricas del entrenamiento, no compara distribuciones.\",\"en\":\"Returns training metrics; it does not compare distributions.\"}}],\"takeaway\":{\"es\":\"Skew = serving frente a entrenamiento; drift = serving frente a serving.\",\"en\":\"Skew = serving vs training; drift = serving vs serving.\"}},{\"id\":\"s2-c4\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"explicabilidad\"],\"prompt\":{\"es\":\"Entrenaste un BOOSTED_TREE_CLASSIFIER de crédito sin opciones extra. El regulador pide hoy el motivo del rechazo del cliente 8812 y, para el informe trimestral, la influencia global de cada variable medida con atribuciones. ¿Qué haces?\",\"en\":\"You trained a credit BOOSTED_TREE_CLASSIFIER with no extra options. Today the regulator asks for the reason customer 8812 was rejected and, for the quarterly report, each variable's global influence measured with attributions. What do you do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"ML.GLOBAL_EXPLAIN para ambas cosas\",\"en\":\"ML.GLOBAL_EXPLAIN for both\"},\"correct\":false,\"why\":{\"es\":\"No explica una fila concreta y, además, falla sin ENABLE_GLOBAL_EXPLAIN.\",\"en\":\"It doesn't explain a specific row and also fails without ENABLE_GLOBAL_EXPLAIN.\"}},{\"id\":\"B\",\"text\":{\"es\":\"ML.WEIGHTS para ver los coeficientes\",\"en\":\"ML.WEIGHTS to see the coefficients\"},\"correct\":false,\"why\":{\"es\":\"Los árboles no tienen función de pesos.\",\"en\":\"Trees have no weights function.\"}},{\"id\":\"C\",\"text\":{\"es\":\"ML.LOCAL_EXPLAIN para el cliente y ML.FEATURE_INFO para el informe\",\"en\":\"ML.LOCAL_EXPLAIN for the customer and ML.FEATURE_INFO for the report\"},\"correct\":false,\"why\":{\"es\":\"ML.LOCAL_EXPLAIN no existe y ML.FEATURE_INFO da estadísticas, no influencia.\",\"en\":\"ML.LOCAL_EXPLAIN does not exist and ML.FEATURE_INFO gives statistics, not influence.\"}},{\"id\":\"D\",\"text\":{\"es\":\"ML.EXPLAIN_PREDICT hoy para el cliente; reentrenar con ENABLE_GLOBAL_EXPLAIN = TRUE para usar ML.GLOBAL_EXPLAIN en el informe\",\"en\":\"ML.EXPLAIN_PREDICT today for the customer; retrain with ENABLE_GLOBAL_EXPLAIN = TRUE to use ML.GLOBAL_EXPLAIN in the report\"},\"correct\":true,\"why\":{\"es\":\"Gana: la explicación local funciona ya; la global por atribuciones exige la opción en el entrenamiento.\",\"en\":\"Wins: the local explanation works now; global attribution needs the option at training time.\"}}],\"takeaway\":{\"es\":\"Local → ML.EXPLAIN_PREDICT; global → ML.GLOBAL_EXPLAIN con ENABLE_GLOBAL_EXPLAIN.\",\"en\":\"Local → ML.EXPLAIN_PREDICT; global → ML.GLOBAL_EXPLAIN with ENABLE_GLOBAL_EXPLAIN.\"}},{\"id\":\"s2-c5\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery-ml\",\"serving\"],\"prompt\":{\"es\":\"Un modelo de BigQuery ML debe responder a la app de checkout en menos de 100 ms por petición, y el equipo quiere además comparar versiones y vigilar drift desde un solo sitio sin escribir un contenedor. ¿Qué camino eliges?\",\"en\":\"A BigQuery ML model must answer the checkout app in under 100 ms per request, and the team also wants to compare versions and monitor drift from one place without writing a container. Which path do you choose?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Registrarlo en Model Registry (MODEL_REGISTRY = 'VERTEX_AI') y desplegarlo en un endpoint online\",\"en\":\"Register it in Model Registry (MODEL_REGISTRY = 'VERTEX_AI') and deploy it to an online endpoint\"},\"correct\":true,\"why\":{\"es\":\"Gana: el registro permite desplegar sin contenedor propio, versionar, comparar y monitorizar.\",\"en\":\"Wins: the registry lets you deploy without your own container, version, compare and monitor.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Llamar a ML.PREDICT desde la app en cada petición\",\"en\":\"Call ML.PREDICT from the app on every request\"},\"correct\":false,\"why\":{\"es\":\"Es una consulta por lotes: no está pensada para latencias de milisegundos.\",\"en\":\"It is a batch query: not designed for millisecond latencies.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Precalcular ML.PREDICT cada hora y leerlo de una tabla\",\"en\":\"Precompute ML.PREDICT hourly and read it from a table\"},\"correct\":false,\"why\":{\"es\":\"Sirve valores viejos cuando la cesta cambia en cada petición.\",\"en\":\"Serves stale values when the basket changes on every request.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Reescribir el modelo en TensorFlow y crear un contenedor propio\",\"en\":\"Rewrite the model in TensorFlow and build a custom container\"},\"correct\":false,\"why\":{\"es\":\"Funciona, pero contradice el requisito de no escribir contenedor y añade trabajo innecesario.\",\"en\":\"It works, but contradicts the no-container requirement and adds needless work.\"}}],\"takeaway\":{\"es\":\"BigQuery ML + online → Model Registry + endpoint.\",\"en\":\"BigQuery ML + online → Model Registry + endpoint.\"}}],\"refs\":[{\"quiz\":{\"es\":\"gcp-pmle-2026-es\",\"en\":\"gcp-pmle-2026\"},\"ids\":[\"2\"]}],\"questions\":[{\"key\":\"s2-c1\",\"prompt\":\"$6:props:flow:stages:1:steps:5:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:5:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:5:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:5:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:5:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:0:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:1:steps:5:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"s2-c2\",\"prompt\":\"$6:props:flow:stages:1:steps:5:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:5:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:5:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:5:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:5:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:1:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:1:steps:5:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s2-c3\",\"prompt\":\"$6:props:flow:stages:1:steps:5:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:5:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:5:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:5:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:5:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:2:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:1:steps:5:items:2:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"metric_selection\"},{\"key\":\"s2-c4\",\"prompt\":\"$6:props:flow:stages:1:steps:5:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:5:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:5:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:5:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:5:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:3:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:1:steps:5:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s2-c5\",\"prompt\":\"$6:props:flow:stages:1:steps:5:items:4:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:1:steps:5:items:4:options:0:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:1:steps:5:items:4:options:1:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:1:steps:5:items:4:options:2:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:1:steps:5:items:4:options:3:text\",\"why\":\"$6:props:flow:stages:1:steps:5:items:4:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:1:steps:5:items:4:takeaway\",\"difficulty\":\"advanced\",\"type\":\"architecture_tradeoff\"},{\"key\":\"gcp-pmle-2026-es::2\",\"prompt\":{\"es\":\"Un equipo de analítica de retail tiene en una tabla de BigQuery ejemplos etiquetados de reseñas con su categoría correcta. Al hacer prompting a Gemini desde BigQuery obtiene categorías inconsistentes. El equipo solo sabe SQL y quiere adaptar el modelo a su criterio de etiquetado sin salir de BigQuery. ¿Qué debe hacer?\",\"en\":\"A retail analytics team has labeled examples of product reviews and their correct category in a BigQuery table. Prompting Gemini from BigQuery gives inconsistent categories. The team only knows SQL and wants to adapt the model to its labeling style without leaving BigQuery. What should they do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Crear un modelo remoto de Gemini con CREATE MODEL y supervised tuning sobre las columnas de prompt y etiqueta, y llamarlo con AI.GENERATE / ML.GENERATE_TEXT\",\"en\":\"Create a remote Gemini model with CREATE MODEL and supervised tuning on the prompt and label columns, then call it with AI.GENERATE / ML.GENERATE_TEXT\"}},{\"id\":\"B\",\"text\":{\"es\":\"Exportar la tabla etiquetada a CSV en Cloud Storage y entrenar un clasificador de texto propio en TensorFlow con GPU mediante custom training de Agent Platform, y luego importar sus predicciones a BigQuery\",\"en\":\"Export the labeled table to CSV in Cloud Storage and train a custom TensorFlow text classifier on GPUs with Agent Platform custom training, then import its predictions back into BigQuery\"}},{\"id\":\"C\",\"text\":{\"es\":\"Usar ML.TRANSLATE para normalizar las reseñas a un idioma\",\"en\":\"Use ML.TRANSLATE to normalize the reviews into one language\"}},{\"id\":\"D\",\"text\":{\"es\":\"Entrenar un K-means en BigQuery ML sobre embeddings de las reseñas y usar los identificadores de clúster resultantes como categorías de producto\",\"en\":\"Train a K-means model in BigQuery ML on embeddings of the reviews and use the resulting cluster ids as the product categories\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"BigQuery ML puede ajustar un modelo remoto de Gemini con supervised tuning: CREATE MODEL … REMOTE WITH CONNECTION … OPTIONS (endpoint = '\u003cmodelo gemini\u003e', max_iterations = …, …) AS SELECT prompt, label FROM tabla_entrenamiento. El modelo ajustado se usa después desde SQL con las funciones de generación y se evalúa con ML.EVALUATE. Encaja con un equipo que solo sabe SQL y mantiene los datos en BigQuery.\\n\\nPor qué fallan las demás: (B) exportar y escribir TensorFlow ignora las habilidades del equipo y el requisito low-code. (C) traducir no enseña el criterio de etiquetado. (D) K-means es no supervisado; sus clusters no coinciden con las categorías del negocio.\\n\\nPista de examen: «ajustar Gemini» + «equipo SQL» / «datos en BigQuery» → supervised tuning de un modelo remoto en BigQuery ML.\",\"en\":\"BigQuery ML can tune a Gemini remote model with supervised tuning: CREATE MODEL … REMOTE WITH CONNECTION … OPTIONS (endpoint = '\u003cgemini model\u003e', max_iterations = …, …) AS SELECT prompt, label FROM training_table. The tuned model is then used from SQL with the generation functions and evaluated with ML.EVALUATE. This fits a SQL-only team and keeps the data in BigQuery.\\n\\nWhy the others fail: (B) exporting and writing TensorFlow ignores the team's skills and the low-code requirement. (C) translation does not teach the labeling scheme. (D) K-means is unsupervised; its clusters do not match the business's categories.\\n\\nExam cue: \\\"tune Gemini\\\" + \\\"SQL team\\\" / \\\"data in BigQuery\\\" → supervised tuning of a remote model in BigQuery ML.\"}}]},{\"id\":\"s2-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre Feynman: BigQuery ML en 5 frases\",\"en\":\"Feynman close: BigQuery ML in 5 sentences\"},\"prompt\":{\"es\":\"Explícale a un analista SQL qué problema resuelve BigQuery ML, qué hace TRANSFORM y cuándo NO usarías ML.PREDICT.\",\"en\":\"Explain to a SQL analyst what problem BigQuery ML solves, what TRANSFORM does and when you would NOT use ML.PREDICT.\"},\"keyPoints\":[{\"es\":\"Entrena y predice con SQL donde están los datos, sin exportarlos.\",\"en\":\"Trains and predicts with SQL where the data lives, without exporting it.\"},{\"es\":\"TRANSFORM guarda el preprocesado en el modelo y evita el skew.\",\"en\":\"TRANSFORM stores preprocessing in the model and prevents skew.\"},{\"es\":\"ML.PREDICT es por lotes; para online se registra y despliega en un endpoint.\",\"en\":\"ML.PREDICT is batch; for online you register and deploy to an endpoint.\"},{\"es\":\"Las funciones reales: ML.EVALUATE, ML.ROC_CURVE, ML.EXPLAIN_PREDICT, ML.VALIDATE_DATA_SKEW/DRIFT; ML.TUNE o ML.DETECT_DRIFT no existen.\",\"en\":\"The real functions: ML.EVALUATE, ML.ROC_CURVE, ML.EXPLAIN_PREDICT, ML.VALIDATE_DATA_SKEW/DRIFT; ML.TUNE or ML.DETECT_DRIFT don't exist.\"}]}]},{\"id\":\"s3\",\"title\":{\"es\":\"Datos y entrenamiento en Agent Platform\",\"en\":\"Data and training on Agent Platform\"},\"objective\":{\"es\":\"Al terminar sabrás preparar datos correctos, baratos y seguros, y elegir la vía de entrenamiento (BigQuery ML, AutoML o personalizado), su hardware y su registro.\",\"en\":\"By the end you will prepare correct, cheap and secure data, and choose the training path (BigQuery ML, AutoML or custom), its hardware and how it is tracked.\"},\"steps\":[{\"id\":\"s3-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: datos baratos y seguros, entrenamiento gestionado\",\"en\":\"Capsule: cheap, secure data and managed training\"},\"problem\":{\"es\":\"La calidad y el coste de un modelo se deciden antes de entrenar: la herramienta equivocada, consultas que leen tablas enteras, datos personales sin proteger o ejecuciones que nadie puede reproducir arruinan proyectos con buenos algoritmos.\",\"en\":\"A model's quality and cost are decided before training: the wrong tool, queries that read whole tables, unprotected personal data or runs nobody can reproduce ruin projects with good algorithms.\"},\"mechanism\":{\"es\":\"Procesa donde están los datos y según su escala (SQL en BigQuery, Dataflow para streaming, Dataproc para Spark). En BigQuery pagas por bytes leídos: columnas concretas y filtros de partición recortan el coste. La PII se desidentifica con Sensitive Data Protection antes de entrenar. Las features se definen una vez (TRANSFORM, Feature Store) para no crear skew. Para entrenar, elige la opción más gestionada que cumpla: BigQuery ML, AutoML o entrenamiento personalizado; registra ejecuciones en Experiments y linaje en ML Metadata; escala con paralelismo de datos cuando el modelo cabe en una GPU.\",\"en\":\"Process where the data lives and by its scale (SQL in BigQuery, Dataflow for streaming, Dataproc for Spark). In BigQuery you pay for bytes read: specific columns and partition filters cut cost. PII is de-identified with Sensitive Data Protection before training. Features are defined once (TRANSFORM, Feature Store) to avoid skew. For training, pick the most managed option that fits: BigQuery ML, AutoML or custom training; log runs in Experiments and lineage in ML Metadata; scale with data parallelism when the model fits on one GPU.\"},\"flow\":[{\"es\":\"Fuente → herramienta por escala → features definidas una vez → tabla limpia y sin PII\",\"en\":\"Source → tool by scale → features defined once → clean, PII-free table\"},{\"es\":\"Equipo y datos → BigQuery ML, AutoML o entrenamiento personalizado → Experiments + Model Registry\",\"en\":\"Team and data → BigQuery ML, AutoML or custom training → Experiments + Model Registry\"},{\"es\":\"Entrenamiento lento → paralelismo de datos (o TPU) → ajustar learning rate con warmup\",\"en\":\"Slow training → data parallelism (or TPU) → adjust learning rate with warmup\"}],\"whenNot\":[{\"es\":\"No montes un clúster de Spark para un CSV de 200 MB: pandas en un notebook basta.\",\"en\":\"Don't spin up a Spark cluster for a 200 MB CSV: pandas in a notebook is enough.\"},{\"es\":\"No elijas entrenamiento personalizado si AutoML o BigQuery ML cumplen los requisitos: añades código y operación.\",\"en\":\"Don't pick custom training if AutoML or BigQuery ML meet the requirements: you add code and operations.\"},{\"es\":\"No uses paralelismo de modelo si el modelo cabe en una GPU: complica sin ganar velocidad.\",\"en\":\"Don't use model parallelism if the model fits on one GPU: it adds complexity without speed.\"}]},{\"id\":\"s3-tarjetas-datos\",\"kind\":\"cards\",\"minutes\":15,\"title\":{\"es\":\"Tarjetas: datos y features\",\"en\":\"Cards: data and features\"},\"deck\":\"gcp-ml-course\",\"module\":\"m4\",\"cardsEs\":[{\"id\":\"m4-02\",\"part\":\"m\",\"front\":\"Debes preparar datos para entrenar: (a) 3 TB ya en BigQuery, (b) eventos en streaming desde Pub/Sub, (c) jobs de Spark que ya existen y (d) un CSV de 200 MB. ¿Qué herramienta usas para cada uno?\",\"back\":\"Elige por escala: SQL en BigQuery para lo que ya está allí, Dataflow para streaming, Dataproc para reutilizar Spark y pandas para lo pequeño.\\n\\n• (a) BigQuery SQL: serverless, sin mover los datos.\\n• (b) Pub/Sub + Dataflow (Apache Beam): el mismo código sirve para batch y streaming.\\n• (c) Dataproc: Spark/Hadoop gestionado, migración sin reescribir.\\n• (d) pandas en un notebook (Workbench o Colab Enterprise): no montes un clúster para 200 MB.\\n• Orquestar todo el flujo de ML es otra cosa: Agent Platform Pipelines (o Managed Service for Apache Airflow para datos).\\n\\nPista de examen: «streaming + transformaciones» → Dataflow; «ya tenemos Spark» → Dataproc.\",\"topic\":\"Datos\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"datos\",\"dataflow\"]},{\"id\":\"m4-01\",\"part\":\"m\",\"front\":\"Tienes columnas crudas: fecha de compra, ciudad, precio y texto libre. ¿Por qué el feature engineering suele pesar más que elegir un algoritmo sofisticado, y qué transformaciones típicas aplicas?\",\"back\":\"Porque el modelo solo aprende de las señales que le das: buenas features hacen visible el patrón y un modelo simple con ellas suele ganar a uno complejo con datos crudos.\\n\\n• Fechas → día de la semana, mes, festivo, días desde el último evento.\\n• Categóricas → one-hot, codificación por etiqueta o embeddings si hay muchísimos valores.\\n• Numéricas → escalado (en modelos lineales y redes), cubetas por cuantiles, logaritmo en colas largas.\\n• Cruces de features (ciudad × categoría) y agregados por ventanas solo hacia atrás.\\n• Dónde: SQL o TRANSFORM en BigQuery ML, Dataflow, capas de preprocesado de Keras; para reutilizarlas, Feature Store.\\n\\nPista de examen: misma lógica de features en entrenamiento y en serving, o aparecerá el skew.\",\"topic\":\"Datos\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"datos\",\"features\"]},{\"id\":\"m4-04\",\"part\":\"m\",\"front\":\"Necesitas etiquetas para 50.000 imágenes de defectos y para 2 millones de transacciones. ¿De dónde pueden salir las etiquetas y qué riesgo tiene cada vía?\",\"back\":\"Las etiquetas salen de anotación humana o de eventos del negocio, y su calidad es el techo del modelo: etiquetas ruidosas limitan a cualquier algoritmo.\\n\\n• Anotación humana (imágenes): en Agent Platform puedes etiquetar datasets de imagen desde la consola o usar tu propio equipo o un proveedor; mide el acuerdo entre anotadores y guarda un conjunto «oro» revisado.\\n• Eventos del negocio (transacciones): un contracargo o una compra como etiqueta; son baratos, pero llegan con retraso y con ruido.\\n• Cuidado con etiquetar usando información que el modelo no tendrá al predecir (fuga).\\n• Para AutoML de clasificación de imágenes se piden al menos 100 ejemplos por etiqueta.\\n\\nPista de examen: «el modelo no mejora con más ajustes» → revisa la calidad de las etiquetas antes que el algoritmo.\",\"topic\":\"Datos\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"etiquetado\"]},{\"id\":\"m4-03\",\"part\":\"m\",\"front\":\"Varios equipos entrenan con las mismas tablas y nadie sabe de dónde viene cada columna ni si hoy llegó completa. ¿Qué servicios de GCP te dan catálogo, linaje y controles de calidad?\",\"back\":\"Dataplex Universal Catalog (sucesor de Data Catalog) da catálogo, linaje y escaneos de calidad de datos; BigQuery y las funciones de estadísticas completan las comprobaciones.\\n\\n• Catálogo y linaje: descubrir tablas, dueños y de qué procesos sale cada columna.\\n• Calidad: reglas sobre completitud, unicidad o rangos que se ejecutan de forma programada.\\n• Estadísticas antes de entrenar: ML.DESCRIBE_DATA en BigQuery o TFDV en pipelines de TensorFlow.\\n• Datos sensibles: Sensitive Data Protection (antes Cloud DLP) para descubrirlos y desidentificarlos.\\n\\nPista de examen: «saber de dónde viene un dato y si cumple reglas» → gobierno con Dataplex, no scripts sueltos.\",\"topic\":\"Datos\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"gobierno\"]},{\"id\":\"m4-07\",\"part\":\"m\",\"front\":\"Vas a entrenar un clasificador con el texto de 3 millones de tickets que contienen emails, teléfonos y números de tarjeta. ¿Qué haces con esos datos antes de entrenar?\",\"back\":\"Descubre y desidentifica la PII con Sensitive Data Protection antes de entrenar (enmascarar, sustituir por tokens o eliminar), y limita quién puede leer los datos originales.\\n\\n• Inspección: detectores de tipos como EMAIL_ADDRESS, PHONE_NUMBER o CREDIT_CARD_NUMBER.\\n• Desidentificación: enmascarado, tokenización o reemplazo por el ti
