po de dato, según si necesitas reidentificar.\\n• Mínimo privilegio: el pipeline lee la tabla limpia; la original queda restringida.\\n• Si luego usas un LLM, Model Armor puede filtrar datos sensibles en prompts y respuestas.\\n\\nPista de examen: «PII en datos de entrenamiento» → Sensitive Data Protection antes de entrenar, no «confiar en que el modelo no la memorice».\",\"topic\":\"Datos\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"privacidad\"]},{\"id\":\"m2-04\",\"part\":\"m\",\"front\":\"Tus features de cliente se calculan en BigQuery para entrenar y tu API de predicción online necesita el último valor de cada cliente en milisegundos. ¿Qué te da Feature Store en Agent Platform y cómo encaja con BigQuery?\",\"back\":\"Agent Platform Feature Store (antes Vertex AI Feature Store) sirve online los últimos valores de features guardadas en BigQuery, que actúa como almacén offline.\\n\\n• Una sola definición de la feature para entrenar (offline, BigQuery) y servir (online): reduce el training-serving skew.\\n• Flujo: preparar la tabla en BigQuery → registrar grupos de features (opcional) → crear online store y feature views → servir.\\n• Online serving con Bigtable para grandes volúmenes; el «Optimized online serving» está obsoleto.\\n• Para embeddings a gran escala se recomienda Vector Search.\\n• Para entrenar con valores de un momento pasado, ML.FEATURES_AT_TIME en BigQuery evita usar valores del futuro.\\n\\nPista de examen: «mismas features en entrenamiento y en serving online» → Feature Store.\",\"topic\":\"Feature Store\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"feature-store\",\"serving\"]},{\"id\":\"m5-05\",\"part\":\"m\",\"front\":\"En entrenamiento «edad» se calculó en años con SQL, y el equipo de backend la reimplementó en Java… en meses. El modelo no da errores, pero sus predicciones empeoraron desde el primer día. ¿Qué es y cómo se evita de raíz?\",\"back\":\"Es training-serving skew: la feature que llega en producción no se calcula igual que en entrenamiento, y el modelo predice mal sin fallar.\\n\\n• Una sola implementación de la transformación: TRANSFORM en BigQuery ML, tf.Transform o capas de preprocesado de Keras dentro del modelo.\\n• O features precalculadas y servidas desde Feature Store para ambos caminos.\\n• Detección: ML.VALIDATE_DATA_SKEW en BigQuery ML, o Model Monitoring con detección de skew (requiere los datos de entrenamiento como referencia).\\n• Diferencia con drift: el skew existe desde el despliegue; el drift aparece con el tiempo.\\n\\nPista de examen: «dos implementaciones del preprocesado» → unificar la transformación, no reentrenar más a menudo.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"skew\",\"mlops\"]},{\"id\":\"m4-08\",\"part\":\"m\",\"front\":\"La consulta nocturna de features hace SELECT * FROM eventos WHERE pais = 'MX' LIMIT 100000 sobre una tabla de 40 TB particionada por la columna fecha, y la factura bajo demanda se disparó. ¿Por qué lee tanto y cómo lo corriges?\",\"back\":\"Lee la tabla entera: no filtra por la columna de partición, SELECT * trae todas las columnas y LIMIT no reduce los bytes leídos.\\n\\n• Selecciona solo las columnas necesarias.\\n• Bajo demanda se paga por bytes leídos en las columnas referenciadas.\\n• Filtra por la columna de partición (WHERE fecha \u003e= …) para que BigQuery descarte particiones.\\n• Agrupa en clúster por pais para que el filtro por país lea menos bloques.\\n• Protección: require_partition_filter en la tabla y máximo de bytes facturados en el job; revisa el coste con un dry run.\\n\\nPista de examen: «coste disparado en BigQuery» → SELECT *, falta de filtro de partición o LIMIT creyendo que ahorra.\",\"topic\":\"BigQuery\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"costo\"]},{\"id\":\"m4-09\",\"part\":\"m\",\"front\":\"Tu dataset tiene varias filas por cliente (una por mes). Con split aleatorio por fila el AUC es 0,93, pero con clientes nuevos cae a 0,78. ¿Qué falla en la división y cómo la haces bien en BigQuery?\",\"back\":\"El mismo cliente aparece en entrenamiento y en validación, así que el modelo reconoce clientes en vez de generalizar: divide por cliente, no por fila.\\n\\n• Asigna cada cliente entero a un lado con un hash estable: es_eval = MOD(ABS(FARM_FINGERPRINT(cliente_id)), 10) \u003e= 8.\\n• En BigQuery ML usa DATA_SPLIT_METHOD = 'CUSTOM' con DATA_SPLIT_COL = 'es_eval' (TRUE = evaluación, FALSE = entrenamiento).\\n• Si además hay tiempo, combina: clientes distintos y periodo posterior para validar.\\n• El AUC honesto bajará: es la cifra que verás con clientes nuevos.\\n\\nPista de examen: «filas correlacionadas (mismo usuario, paciente o dispositivo)» → split por grupo.\",\"topic\":\"Datos\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"datos\",\"leakage\"]}],\"cardsEn\":[{\"id\":\"m4-02\",\"part\":\"m\",\"front\":\"You must prepare training data: (a) 3 TB already in BigQuery, (b) streaming events from Pub/Sub, (c) existing Spark jobs, and (d) a 200 MB CSV. Which tool do you use for each?\",\"back\":\"Pick by scale and complexity: SQL in BigQuery for what is already in BigQuery, Dataflow for streaming and complex transforms, Dataproc to reuse Spark, and in-memory pandas for small data.\\n\\n• (a) BigQuery SQL: serverless, no data movement.\\n• (b) Pub/Sub + Dataflow (Apache Beam): the same code works for batch and streaming.\\n• (c) Dataproc: managed Spark/Hadoop, migrate without rewriting.\\n• (d) pandas in a notebook (Workbench or Colab Enterprise): don't spin up a cluster for 200 MB.\\n• Orchestrating the whole ML flow is a different job: Agent Platform Pipelines (or Managed Service for Apache Airflow for data).\\n\\nExam cue: «streaming + transformations» → Dataflow; «we already have Spark» → Dataproc.\",\"topic\":\"Data\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"datos\",\"dataflow\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-01\",\"part\":\"m\",\"front\":\"You have raw columns: purchase date, city, price and free text. Why does feature engineering often matter more than picking a sophisticated algorithm, and which typical transformations do you apply?\",\"back\":\"Because the model only learns from the signals you give it: good features make the pattern visible, and a simple model with them often beats a complex one on raw data.\\n\\n• Dates → day of week, month, holiday, days since the last event.\\n• Categorical → one-hot, label encoding, or embeddings when there are huge numbers of values.\\n• Numeric → scaling (for linear models and networks), quantile buckets, log for long tails.\\n• Feature crosses (city × category) and backward-only window aggregates.\\n• Where: SQL or TRANSFORM in BigQuery ML, Dataflow, Keras preprocessing layers; to reuse them, Feature Store.\\n\\nExam cue: same feature logic in training and serving, or skew will show up.\",\"topic\":\"Data\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"datos\",\"features\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-04\",\"part\":\"m\",\"front\":\"You need labels for 50,000 defect images and for 2 million transactions. Where can the labels come from, and what risk does each route carry?\",\"back\":\"Labels come from human annotation or from business events, and their quality is the model's ceiling: noisy labels limit any algorithm.\\n\\n• Human annotation (images): in Agent Platform you can label image datasets from the console or use your own team or a vendor; measure inter-annotator agreement and keep a reviewed «gold» set.\\n• Business events (transactions): a chargeback or a purchase as the label; cheap, but delayed and noisy.\\n• Beware of labeling with information the model will not have at prediction time (leakage).\\n• AutoML image classification asks for at least 100 examples per label.\\n\\nExam cue: «the model stops improving with tuning» → check label quality before the algorithm.\",\"topic\":\"Data\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"etiquetado\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-03\",\"part\":\"m\",\"front\":\"Several teams train on the same tables and nobody knows where each column comes from or whether today's load arrived complete. Which GCP services give you a catalog, lineage and quality checks?\",\"back\":\"Dataplex Universal Catalog (the successor to Data Catalog) provides a catalog, lineage and data quality scans; BigQuery and the statistics functions complete the checks.\\n\\n• Catalog and lineage: discover tables, owners and which processes produce each column.\\n• Quality: rules on completeness, uniqueness or ranges that run on a schedule.\\n• Statistics before training: ML.DESCRIBE_DATA in BigQuery or TFDV in TensorFlow pipelines.\\n• Sensitive data: Sensitive Data Protection (formerly Cloud DLP) to discover and de-identify it.\\n\\nExam cue: «know where data comes from and whether it meets rules» → governance with Dataplex, not ad-hoc scripts.\",\"topic\":\"Data\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"gobierno\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-07\",\"part\":\"m\",\"front\":\"You will train a classifier on the text of 3 million tickets that contain emails, phone numbers and card numbers. What do you do with that data before training?\",\"back\":\"Discover and de-identify the PII with Sensitive Data Protection before training (mask it, replace it with tokens or remove it), and limit who can read the original data.\\n\\n• Inspection: detectors for types such as EMAIL_ADDRESS, PHONE_NUMBER or CREDIT_CARD_NUMBER.\\n• De-identification: masking, tokenization or replacement with the info type, depending on whether you need to re-identify.\\n• Least privilege: the pipeline reads the clean table; the original stays restricted.\\n• If you later use an LLM, Model Armor can filter sensitive data in prompts and responses.\\n\\nExam cue: «PII in training data» → Sensitive Data Protection before training, not «trust the model not to memorize it».\",\"topic\":\"Data\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"datos\",\"privacidad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-04\",\"part\":\"m\",\"front\":\"Your customer features are computed in BigQuery for training, and your online prediction API needs each customer's latest value in milliseconds. What does Feature Store on Agent Platform give you, and how does it fit with BigQuery?\",\"back\":\"Agent Platform Feature Store (formerly Vertex AI Feature Store) serves online the latest values of features stored in BigQuery, which acts as the offline store.\\n\\n• One feature definition for training (offline, BigQuery) and serving (online): it reduces training-serving skew.\\n• Flow: prepare the table in BigQuery → register feature groups (optional) → create an online store and feature views → serve.\\n• Bigtable online serving for large volumes; «Optimized online serving» is deprecated.\\n• For embeddings at scale, Vector Search is recommended.\\n• To train with values from a past moment, ML.FEATURES_AT_TIME in BigQuery avoids using future values.\\n\\nExam cue: «same features in training and online serving» → Feature Store.\",\"topic\":\"Feature Store\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"feature-store\",\"serving\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m5-05\",\"part\":\"m\",\"front\":\"In training, «age» was computed in years with SQL, and the backend team reimplemented it in Java… in months. The model throws no errors, but its predictions have been worse since day one. What is it, and how do you prevent it at the root?\",\"back\":\"It is training-serving skew: the feature that arrives in production is not computed the same way as in training, and the model predicts badly without failing.\\n\\n• A single implementation of the transformation: TRANSFORM in BigQuery ML, tf.Transform, or Keras preprocessing layers inside the model.\\n• Or precomputed features served from Feature Store for both paths.\\n• Detection: ML.VALIDATE_DATA_SKEW in BigQuery ML, or Model Monitoring with skew detection (it needs the training data as the reference).\\n• Difference from drift: skew exists from deployment; drift appears over time.\\n\\nExam cue: «two implementations of the preprocessing» → unify the transformation, don't just retrain more often.\",\"topic\":\"MLOps\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"skew\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-08\",\"part\":\"m\",\"front\":\"The nightly feature query runs SELECT * FROM events WHERE country = 'MX' LIMIT 100000 over a 40 TB table partitioned on the date column, and the on-demand bill exploded. Why does it read so much, and how do you fix it?\",\"back\":\"It reads the whole table: no filter on the partition column, SELECT * pulls every column, and LIMIT does not reduce bytes read.\\n\\n• Select only the columns you need.\\n• On-demand pricing charges for bytes read in the referenced columns.\\n• Filter on the partition column (WHERE date \u003e= …) so BigQuery prunes partitions.\\n• Cluster by country so the country filter reads fewer blocks.\\n• Guardrails: require_partition_filter on the table and maximum bytes billed on the job; check the cost with a dry run.\\n\\nExam cue: «BigQuery cost exploded» → SELECT *, a missing partition filter, or LIMIT assumed to save money.\",\"topic\":\"BigQuery\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"bigquery\",\"costo\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-09\",\"part\":\"m\",\"front\":\"Your dataset has several rows per customer (one per month). With a random row-level split the AUC is 0.93, but on new customers it drops to 0.78. What is wrong with the split, and how do you do it right in BigQuery?\",\"back\":\"The same customer appears in training and validation, so the model recognizes customers instead of generalizing: split by customer, not by row.\\n\\n• Assign each whole customer to one side with a stable hash: is_eval = MOD(ABS(FARM_FINGERPRINT(customer_id)), 10) \u003e= 8.\\n• In BigQuery ML use DATA_SPLIT_METHOD = 'CUSTOM' with DATA_SPLIT_COL = 'is_eval' (TRUE = evaluation, FALSE = training).\\n• If time matters too, combine both: different customers and a later period for validation.\\n• The honest AUC will drop: it is the figure you will see on new customers.\\n\\nExam cue: «correlated rows (same user, patient or device)» → group split.\",\"topic\":\"Data\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"datos\",\"leakage\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"}]},{\"id\":\"s3-tarjetas-plataforma\",\"kind\":\"cards\",\"minutes\":15,\"title\":{\"es\":\"Tarjetas: desarrollar y entrenar en Agent Platform\",\"en\":\"Cards: develop and train on Agent Platform\"},\"deck\":\"gcp-ml-course\",\"module\":\"m2\",\"cardsEs\":[{\"id\":\"m2-01\",\"part\":\"m\",\"front\":\"Un material de 2024 habla de «Vertex AI» y la consola de hoy dice «Agent Platform». ¿Es otro producto? ¿Qué piezas cubren el ciclo de vida de un modelo?\",\"back\":\"Es el mismo producto renombrado: en abril de 2026 Vertex AI pasó a llamarse Gemini Enterprise Agent Platform y sus servicios conservan la función.\\n\\n• Desarrollar: Agent Platform Workbench y Colab Enterprise.\\n• Entrenar: AutoML, entrenamiento personalizado (Managed/Serverless Training), tuning de hiperparámetros.\\n• Organizar: Model Registry, Experiments y ML Metadata.\\n• Servir: endpoints de inferencia online e inferencia por lotes.\\n• Operar: Pipelines, Feature Store y Model Monitoring.\\n• IA generativa: Model Garden, Agent Studio y modelos Gemini.\\n• La API sigue en aiplatform.googleapis.com.\\n\\nPista de examen: el examen se actualizó a los nombres nuevos; si ves «Vertex AI» en material antiguo, traduce al servicio equivalente.\",\"topic\":\"Agent Platform\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"agent-platform\",\"fundamentos\"]},{\"id\":\"m2-09\",\"part\":\"m\",\"front\":\"Tu equipo prototipa con datos de clientes que no pueden salir del perímetro de la empresa. ¿Agent Platform Workbench o Colab Enterprise, y por qué no el Colab gratuito?\",\"back\":\"Ambos viven en tu proyecto con IAM: Workbench da una instancia JupyterLab configurable y Colab Enterprise notebooks colaborativos con entornos gestionados.\\n\\n• Workbench: VM de Compute Engine con JupyterLab, control del entorno, GPUs, CMEK, red de tu VPC; para trabajo largo y personalizado.\\n• Colab Enterprise: compartir y colaborar como en Colab, pero con los controles de seguridad y facturación de Google Cloud.\\n• El Colab gratuito vive fuera de tu proyecto: no aplica tus controles de IAM, red ni cifrado.\\n\\nPista de examen: «datos sensibles + notebooks» → Workbench o Colab Enterprise en el proyecto, con mínimo privilegio.\",\"topic\":\"Workbench\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"agent-platform\",\"seguridad\"]},{\"id\":\"m4-05\",\"part\":\"m\",\"front\":\"Tienes 8.000 fotos de piezas etiquetadas como «ok» o «defecto» y nadie en el equipo sabe entrenar redes. ¿Te sirve AutoML de Agent Platform y qué tipos de problema cubre hoy?\",\"back\":\"Sí: AutoML entrena modelos sin escribir código de entrenamiento y hoy cubre imagen (clasificación y detección de objetos) y datos tabulares (clasificación, regresión y forecasting).\\n\\n• Tú aportas datos etiquetados de calidad; AutoML elige arquitectura, preprocesado e hiperparámetros.\\n• Imagen: al menos 100 ejemplos por etiqueta para clasificación; más ejemplos y equilibrados mejoran el modelo.\\n• Tabular: elige la columna objetivo y AutoML prueba transformaciones y modelos.\\n• Límite: poco control sobre la arquitectura; para algo a medida, entrenamiento personalizado.\\n• Para tareas de texto hoy se recurre a Gemini (prompting o tuning).\\n\\nPista de examen: «sin expertos en ML + datos etiquetados + calidad alta» → AutoML.\",\"topic\":\"AutoML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"automl\",\"agent-platform\"]},{\"id\":\"m2-15\",\"part\":\"m\",\"front\":\"Tres equipos: (a) analistas SQL con el churn en BigQuery, (b) 8.000 fotos etiquetadas y sin experto en ML, (c) investigadores con una arquitectura propia en PyTorch. ¿Qué vía de entrenamiento toca a cada uno?\",\"back\":\"(a) BigQuery ML, (b) AutoML de Agent Platform y (c) entrenamiento personalizado en Agent Platform.\\n\\n• BigQuery ML: SQL donde están los datos, el menor esfuerzo para un equipo SQL.\\n• AutoML: sin código de entrenamiento, buena calidad con datos etiquetados (imagen o tabular).\\n• Entrenamiento personalizado: tu código y tu framework (PyTorch, TensorFlow, scikit-learn, XGBoost), contenedores prebuilt o propios, GPU/TPU y entrenamiento distribuido.\\n• Regla: la opción más gestionada que cumpla los requisitos.\\n\\nPista de examen: el examen prioriza la solución nativa y más gestionada que satisface las restricciones.\",\"topic\":\"Agent Platform\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"agent-platform\",\"arquitectura\"]},{\"id\":\"m4-06\",\"part\":\"m\",\"front\":\"Tu modelo necesita una función de pérdida propia y una librería que no viene en las imágenes de Google. ¿Cómo entrenas en Agent Platform y cuándo basta un contenedor prebuilt?\",\"back\":\"Usa entrenamiento personalizado con un contenedor propio publicado en Artifact Registry; si tu framework y dependencias encajan en un contenedor prebuilt, basta con aportar tu código Python.\\n\\n• Prebuilt: imágenes de Google para TensorFlow, PyTorch, scikit-learn y XGBoost; tú subes el paquete o script.\\n• Contenedor propio: cualquier framework o dependencia de sistema; tú construyes y versionas la imagen.\\n• Recursos: tipo de máquina, GPUs o TPUs y número de réplicas para entrenar en distribuido.\\n• El artefacto resultante se registra en Model Registry para desplegarlo.\\n\\nPista de examen: «dependencias que no están en las imágenes de Google» → contenedor propio; «framework estándar» → prebuilt.\",\"topic\":\"Entrenamiento\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"agent-platform\",\"entrenamiento\"]},{\"id\":\"m2-10\",\"part\":\"m\",\"front\":\"Tu entrenamiento personalizado tarda 2 horas y quieres explorar learning rate y tamaño de capa con un presupuesto de 40 intentos. ¿Cómo lo hace un trabajo de tuning de hiperparámetros en Agent Platform?\",\"back\":\"Un trabajo de tuning lanza trials con distintas combinaciones, lee la métrica que reporta tu código y, por defecto, usa optimización bayesiana para proponer los siguientes intentos.\\n\\n• Defines parámetros (rangos o valores discretos), la métrica a maximizar o minimizar, el número máximo de trials y cuántos en paralelo.\\n• Algoritmos: por defecto (bayesiano), GRID_SEARCH (solo parámetros discretos) o RANDOM_SEARCH.\\n• Más trials en paralelo terminan antes, pero el bayesiano aprende menos entre intentos.\\n• Tu código reporta la métrica al final de cada trial (por ejemplo con la librería cloudml-hypertune).\\n\\nPista de examen: «muchos hiperparámetros + entrenamientos caros» → búsqueda bayesiana con pocos trials en paralelo.\",\"topic\":\"Hiperparámetros\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"agent-platform\",\"hiperparametros\"]},{\"id\":\"m2-02\",\"part\":\"m\",\"front\":\"Tienes 5 versiones de un modelo de churn (dos de BigQuery ML, tres de custom training) y nadie sabe cuál está en producción. ¿Qué te da Agent Platform Model Registry?\",\"back\":\"Model Registry es el repositorio central de modelos: versiones, alias, evaluaciones y despliegue a endpoints desde un solo lugar, incluidos los modelos de BigQuery ML.\\n\\n• Versiones bajo un mismo modelo y alias (por ejemplo «champion») para saber cuál se sirve.\\n• Evaluaciones asociadas a cada versión para comparar antes de promover.\\n• Despliegue directo de una versión a un endpoint, o inferencia por lotes.\\n• Admite modelos custom, AutoML (tabular e imagen) y BigQuery ML registrados con MODEL_REGISTRY = 'VERTEX_AI'.\\n\\nPista de examen: «organizar y versionar modelos y saber cuál está desplegado» → Model Registry.\",\"topic\":\"Model Registry\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"model-registry\",\"mlops\"]},{\"id\":\"m2-16\",\"part\":\"m\",\"front\":\"Tres científicos prueban arquitecturas y parámetros en notebooks y nadie puede reproducir el «mejor modelo» de la semana pasada. ¿Qué servicios registran ejecuciones, métricas y linaje?\",\"back\":\"Experiments on Agent Platform registra parámetros y métricas de cada ejecución para compararlas, y ML Metadata guarda el linaje entre datos, ejecuciones y modelos.\\n\\n• Cada run anota hiperparámetros, métricas y artefactos; la consola los compara lado a lado.\\n• El linaje responde «¿con qué datos y código se entrenó este modelo?».\\n• Pipelines registra el linaje de cada paso automáticamente.\\n• Complemento: versionar código y datos de entrada; sin eso no hay reproducibilidad.\\n\\nPista de examen: «comparar ejecuciones y rastrear artefactos y linaje» → Experiments + ML Metadata.\",\"topic\":\"Experiments\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"agent-platform\",\"experimentos\"]},{\"id\":\"m2-14\",\"part\":\"m\",\"front\":\"Un entrenamiento de visión tarda 3 días en 1 GPU; el modelo cabe de sobra en la memoria de la GPU y negocio lo quiere en horas. ¿Qué estrategia de distribución usas en Agent Platform?\",\"back\":\"Paralelismo de datos: replicas el modelo en varias GPUs o nodos, cada réplica procesa una parte del lote y los gradientes se combinan con all-reduce.\\n\\n• Una máquina con varias GPUs primero (menos red); varios nodos después.\\n• En multinodo con GPUs NVIDIA, Reduction Server acelera el all-reduce.\\n• Paralelismo de modelo solo cuando el modelo NO cabe en una sola GPU.\\n• Al crecer el lote global, ajusta el learning rate (con warmup) para no desestabilizar.\\n• Si el modelo es de matrices densas y sin ops personalizadas, una TPU también es candidata.\\n\\nPista de examen: «modelo cabe, datos enormes, más velocidad» → paralelismo de datos; «modelo no cabe» → paralelismo de modelo.\",\"topic\":\"Entrenamiento\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"entrenamiento\",\"hardware\"]},{\"id\":\"m2-17\",\"part\":\"m\",\"front\":\"Al pasar tu job de PyTorch de 1 a 8 GPUs multiplicaste el learning rate por 8 y la pérdida se vuelve NaN en la época 3. Los datos son los mismos. ¿Cuál es la causa más probable y cómo lo estabilizas?\",\"back\":\"La causa más probable es que el learning rate es demasiado alto y los gradientes explotan; se estabiliza con warmup, recorte de gradientes y un learning rate más moderado.\\n\\n• Warmup: sube el learning rate de forma gradual las primeras iteraciones.\\n• Recorte de gradientes (clip por norma) evita pasos gigantes.\\n• Con precisión mixta, usa escalado de la pérdida para evitar desbordes.\\n• Descarta también NaN o infinitos en los datos de entrada.\\n• Vigila la pérdida por iteración y guarda checkpoints para reanudar.\\n\\nPista de examen: «NaN tras cambiar el learning rate o el tamaño de lote» → gradientes que explotan, no falta de GPUs.\",\"topic\":\"Entrenamiento\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"entrenamiento\",\"diagnostico\"]}],\"cardsEn\":[{\"id\":\"m2-01\",\"part\":\"m\",\"front\":\"A 2024 course says «Vertex AI» and today's console says «Agent Platform». Is it another product? Which pieces cover a model's lifecycle?\",\"back\":\"It is the same product renamed: in April 2026 Vertex AI became Gemini Enterprise Agent Platform, and its services keep their role.\\n\\n• Develop: Agent Platform Workbench and Colab Enterprise.\\n• Train: AutoML, custom training (Managed/Serverless Training), hyperparameter tuning.\\n• Organize: Model Registry, Experiments and ML Metadata.\\n• Serve: online inference endpoints and batch inference.\\n• Operate: Pipelines, Feature Store and Model Monitoring.\\n• Generative AI: Model Garden, Agent Studio and Gemini models.\\n• The API is still at aiplatform.googleapis.com.\\n\\nExam cue: the exam was updated to the new names; when older material says «Vertex AI», map it to the equivalent service.\",\"topic\":\"Agent Platform\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"agent-platform\",\"fundamentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-09\",\"part\":\"m\",\"front\":\"Your team prototypes with customer data that cannot leave the company perimeter. Agent Platform Workbench or Colab Enterprise, and why not free Colab?\",\"back\":\"Both are managed notebooks inside your project with IAM; Workbench gives you a configurable JupyterLab instance and Colab Enterprise collaborative notebooks with managed runtimes.\\n\\n• Workbench: a Compute Engine VM with JupyterLab, control of the environment, GPUs, CMEK, networking in your VPC; for long, customized work.\\n• Colab Enterprise: share and collaborate like Colab, but with Google Cloud's security and billing controls.\\n• Free Colab lives outside your project: your IAM, network and encryption controls do not apply.\\n\\nExam cue: «sensitive data + notebooks» → Workbench or Colab Enterprise in the project, with least privilege.\",\"topic\":\"Workbench\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"agent-platform\",\"seguridad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-05\",\"part\":\"m\",\"front\":\"You have 8,000 part photos labeled «ok» or «defect», and nobody on the team knows how to train networks. Does Agent Platform AutoML work, and which problem types does it cover today?\",\"back\":\"Yes: AutoML trains models without writing training code, and today it covers images (classification and object detection) and tabular data (classification, regression and forecasting).\\n\\n• You bring good labeled data; AutoML picks the architecture, preprocessing and hyperparameters.\\n• Images: at least 100 examples per label for classification; more and balanced examples improve the model.\\n• Tabular: choose the target column and AutoML tries transformations and models.\\n• Limit: little control over the architecture; for something custom, use custom training.\\n• For text tasks today you turn to Gemini (prompting or tuning).\\n\\nExam cue: «no ML experts + labeled data + high quality» → AutoML.\",\"topic\":\"AutoML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"automl\",\"agent-platform\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-15\",\"part\":\"m\",\"front\":\"Three teams: (a) SQL analysts with churn in BigQuery, (b) 8,000 labeled photos and no ML expert, (c) researchers with their own PyTorch architecture. Which training path fits each?\",\"back\":\"(a) BigQuery ML, (b) Agent Platform AutoML and (c) custom training on Agent Platform.\\n\\n• BigQuery ML: SQL where the data lives, the least effort for a SQL team.\\n• AutoML: no training code, good quality with labeled data (image or tabular).\\n• Custom training: your code and framework (PyTorch, TensorFlow, scikit-learn, XGBoost), prebuilt or custom containers, GPU/TPU and distributed training.\\n• Rule: the most managed option that meets the requirements.\\n\\nExam cue: the exam favors the native, most managed solution that satisfies the constraints.\",\"topic\":\"Agent Platform\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"agent-platform\",\"arquitectura\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m4-06\",\"part\":\"m\",\"front\":\"Your model needs a custom loss function and a library that is not in Google's images. How do you train on Agent Platform, and when is a prebuilt container enough?\",\"back\":\"Use custom training with your own container pushed to Artifact Registry; if your framework and dependencies fit a prebuilt container, providing your Python code is enough.\\n\\n• Prebuilt: Google images for TensorFlow, PyTorch, scikit-learn and XGBoost; you upload the package or script.\\n• Custom container: any framework or system dependency; you build and version the image.\\n• Resources: machine type, GPUs or TPUs, and number of replicas for distributed training.\\n• The resulting artifact is registered in Model Registry to deploy it.\\n\\nExam cue: «dependencies not in Google's images» → custom container; «standard framework» → prebuilt.\",\"topic\":\"Training\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"agent-platform\",\"entrenamiento\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-10\",\"part\":\"m\",\"front\":\"Your custom training takes 2 hours and you want to explore learning rate and layer size with a budget of 40 attempts. How does an Agent Platform hyperparameter tuning job do it?\",\"back\":\"A tuning job launches trials with different combinations, reads the metric your code reports, and by default uses Bayesian optimization to propose the next attempts.\\n\\n• You define parameters (ranges or discrete values), the metric to maximize or minimize, the max number of trials and how many run in parallel.\\n• Algorithms: default (Bayesian), GRID_SEARCH (discrete parameters only) or RANDOM_SEARCH.\\n• More parallel trials finish sooner, but the Bayesian search learns less between attempts.\\n• Your code reports the metric at the end of each trial (for example with the cloudml-hypertune library).\\n\\nExam cue: «many hyperparameters + expensive trainings» → Bayesian search with few parallel trials.\",\"topic\":\"Hyperparameters\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"agent-platform\",\"hiperparametros\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-02\",\"part\":\"m\",\"front\":\"You have 5 versions of a churn model (two from BigQuery ML, three from custom training), and nobody knows which one is in production. What does Agent Platform Model Registry give you?\",\"back\":\"Model Registry is the central model repository: versions, aliases, evaluations and deployment to endpoints from one place, including BigQuery ML models.\\n\\n• Versions under one model and aliases (for example «champion») to know which one is served.\\n• Evaluations attached to each version to compare before promoting.\\n• Direct deployment of a version to an endpoint, or batch inference.\\n• Supports custom, AutoML (tabular and image) and BigQuery ML models registered with MODEL_REGISTRY = 'VERTEX_AI'.\\n\\nExam cue: «organize and version models and know which one is deployed» → Model Registry.\",\"topic\":\"Model Registry\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"model-registry\",\"mlops\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-16\",\"part\":\"m\",\"front\":\"Three scientists try architectures and parameters in notebooks, and nobody can reproduce last week's «best model». Which services record runs, metrics and lineage?\",\"back\":\"Experiments on Agent Platform records each run's parameters and metrics so you can compare them, and ML Metadata stores the lineage between data, executions and models.\\n\\n• Each run logs hyperparameters, metrics and artifacts; the console compares them side by side.\\n• Lineage answers «which data and code trained this model?».\\n• Pipelines records each step's lineage automatically.\\n• Complement: version code and input data; without that there is no reproducibility.\\n\\nExam cue: «compare runs and track artifacts and lineage» → Experiments + ML Metadata.\",\"topic\":\"Experiments\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"agent-platform\",\"experimentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-14\",\"part\":\"m\",\"front\":\"A vision training run takes 3 days on 1 GPU; the model easily fits in GPU memory, and the business wants it in hours. Which distribution strategy do you use on Agent Platform?\",\"back\":\"Data parallelism: replicate the model across several GPUs or nodes, each replica processes part of the batch, and gradients are combined with all-reduce.\\n\\n• One machine with several GPUs first (less networking); several nodes next.\\n• For multi-node NVIDIA GPUs, Reduction Server speeds up the all-reduce.\\n• Model parallelism only when the model does NOT fit on one GPU.\\n• As the global batch grows, adjust the learning rate (with warmup) to avoid instability.\\n• If the model is dense-matrix heavy with no custom ops, a TPU is also a candidate.\\n\\nExam cue: «model fits, huge data, need speed» → data parallelism; «model doesn't fit» → model parallelism.\",\"topic\":\"Training\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"entrenamiento\",\"hardware\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m2-17\",\"part\":\"m\",\"front\":\"When moving your PyTorch job from 1 to 8 GPUs you multiplied the learning rate by 8, and the loss turns NaN at epoch 3. The data is unchanged. What is the most likely cause, and how do you stabilize it?\",\"back\":\"The most likely cause is that the learning rate is too high and the gradients explode; stabilize it with warmup, gradient clipping and a more moderate learning rate.\\n\\n• Warmup: raise the learning rate gradually over the first iterations.\\n• Gradient clipping (by norm) prevents huge steps.\\n• With mixed precision, use loss scaling to avoid overflow.\\n• Also rule out NaN or infinite values in the input data.\\n• Watch the loss per iteration and save checkpoints to resume.\\n\\nExam cue: «NaN after changing the learning rate or batch size» → exploding gradients, not a lack of GPUs.\",\"topic\":\"Training\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"entrenamiento\",\"diagnostico\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"}]},{\"id\":\"s3-practica\",\"kind\":\"practice\",\"minutes\":15,\"title\":{\"es\":\"Práctica: split por cliente y consulta que no lee de más\",\"en\":\"Practice: per-customer split and a query that doesn't over-read\"},\"scaffolding\":\"medium\",\"instructions\":{\"es\":\"La tabla eventos (particionada por fecha, agrupada en clúster por pais) tiene 40 TB y varias filas por cliente. Escribe la consulta de features de los últimos 90 días para México que lea solo 4 columnas, y añade una columna booleana es_eval que mande al 20 % de los clientes (enteros) a evaluación con un hash estable.\",\"en\":\"The eventos table (partitioned by fecha, clustered by pais) is 40 TB and has several rows per customer. Write the feature query for the last 90 days in Mexico that reads only 4 columns, and add a boolean is_eval column that sends 20% of customers (whole customers) to evaluation with a stable hash.\"},\"starter\":\"CREATE OR REPLACE TABLE ml.features_mx AS\\nSELECT\\n  cliente_id,\\n  COUNT(*) AS eventos_90d,\\n  SUM(importe) AS importe_90d,\\n  -- es_eval: ...\\nFROM eventos\\nWHERE ...\\nGROUP BY cliente_id;\\n\",\"hints\":[{\"es\":\"El filtro debe ir sobre la columna de partición para que BigQuery descarte particiones.\",\"en\":\"The filter must be on the partition column so BigQuery prunes partitions.\"},{\"es\":\"FARM_FINGERPRINT(CAST(cliente_id AS STRING)) da el mismo hash siempre para el mismo cliente.\",\"en\":\"FARM_FINGERPRINT(CAST(cliente_id AS STRING)) always gives the same hash for the same customer.\"}],\"solution\":\"CREATE OR REPLACE TABLE ml.features_mx AS\\nSELECT\\n  cliente_id,\\n  COUNT(*) AS eventos_90d,\\n  SUM(importe) AS importe_90d,\\n  MOD(ABS(FARM_FINGERPRINT(CAST(cliente_id AS STRING))), 10) \u003e= 8 AS es_eval\\nFROM eventos\\nWHERE fecha \u003e= DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)\\n  AND pais = 'MX'\\nGROUP BY cliente_id;\\n\",\"language\":\"sql\",\"criteria\":[{\"es\":\"El dry run muestra bytes procesados muy por debajo de 40 TB (solo 90 días de las columnas cliente_id, importe, fecha y pais).\",\"en\":\"The dry run shows bytes processed far below 40 TB (only 90 days of the cliente_id, importe, fecha and pais columns).\"},{\"es\":\"Cada cliente_id aparece una sola vez y con un único valor de es_eval.\",\"en\":\"Each cliente_id appears once with a single is_eval value.\"},{\"es\":\"SELECT COUNTIF(es_eval) / COUNT(*) FROM ml.features_mx da aproximadamente 0,2.\",\"en\":\"SELECT COUNTIF(es_eval) / COUNT(*) FROM ml.features_mx gives roughly 0.2.\"}]},{\"id\":\"s3-escenarios\",\"kind\":\"scenarios\",\"minutes\":8,\"title\":{\"es\":\"Escenarios: herramienta y vía de entrenamiento\",\"en\":\"Scenarios: tool and training path\"},\"items\":[{\"id\":\"s3-q1\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"basic\",\"tags\":[\"datos\",\"streaming\"],\"prompt\":{\"es\":\"Necesitas calcular en continuo, desde Pub/Sub, el número de transacciones por tarjeta en los últimos 10 minutos para alimentar un modelo de fraude, con unos 50.000 eventos por segundo y sin administrar servidores. ¿Qué usas?\",\"en\":\"You need to compute continuously, from Pub/Sub, the number of transactions per card in the last 10 minutes to feed a fraud model, at about 50,000 events per second and without managing servers. What do you use?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Una consulta programada de BigQuery cada hora\",\"en\":\"A scheduled BigQuery query every hour\"},\"correct\":false,\"why\":{\"es\":\"Una hora de retraso no sirve para ventanas de 10 minutos en tiempo real.\",\"en\":\"An hour of delay is useless for real-time 10-minute windows.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Dataflow (Apache Beam) con ventanas deslizantes sobre el stream de Pub/Sub\",\"en\":\"Dataflow (Apache Beam) with sliding windows over the Pub/Sub stream\"},\"correct\":true,\"why\":{\"es\":\"Gana: procesa streaming con ventanas, escala solo y es serverless.\",\"en\":\"Wins: it processes streams with windows, autoscales and is serverless.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Un clúster de Dataproc siempre encendido\",\"en\":\"An always-on Dataproc cluster\"},\"correct\":false,\"why\":{\"es\":\"Funciona, pero tú administras el clúster y no es la opción gestionada para streaming.\",\"en\":\"It works, but you manage the cluster and it isn't the managed streaming option.\"}},{\"id\":\"D\",\"text\":{\"es\":\"pandas en un notebook de Workbench\",\"en\":\"pandas in a Workbench notebook\"},\"correct\":false,\"why\":{\"es\":\"Un notebook no es un proceso de streaming de producción a esa escala.\",\"en\":\"A notebook is not a production streaming process at that scale.\"}}],\"takeaway\":{\"es\":\"Streaming + ventanas + serverless → Dataflow.\",\"en\":\"Streaming + windows + serverless → Dataflow.\"}},{\"id\":\"s3-q2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"automl\",\"arquitectura\"],\"prompt\":{\"es\":\"Una planta tiene 8.000 fotos etiquetadas de piezas («ok», «rayada», «rota»), ningún experto en redes neuronales y tres semanas para un piloto con buena precisión. ¿Qué vía de entrenamiento eliges?\",\"en\":\"A plant has 8,000 labeled part photos («ok», «scratched», «broken»), no neural-network expert, and three weeks for a pilot with good accuracy. Which training path do you choose?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Entrenamiento personalizado de una CNN desde cero en GPUs\",\"en\":\"Custom training of a CNN from scratch on GPUs\"},\"correct\":false,\"why\":{\"es\":\"Exige experiencia que el equipo no tiene y más tiempo.\",\"en\":\"Requires expertise the team lacks and more time.\"}},{\"id\":\"B\",\"text\":{\"es\":\"BigQuery ML con LOGISTIC_REG sobre los píxeles\",\"en\":\"BigQuery ML with LOGISTIC_REG over the pixels\"},\"correct\":false,\"why\":{\"es\":\"Un modelo lineal sobre píxeles no es adecuado para visión.\",\"en\":\"A linear model over pixels is not suited to vision.\"}},{\"id\":\"C\",\"text\":{\"es\":\"AutoML de clasificación de imágenes en Agent Platform\",\"en\":\"AutoML image classification on Agent Platform\"},\"correct\":true,\"why\":{\"es\":\"Gana: entrena un modelo de visión de calidad sin código de entrenamiento con datos etiquetados.\",\"en\":\"Wins: it trains a quality vision model without training code from labeled data.\"}},{\"id\":\"D\",\"text\":{\"es\":\"K-means sobre las fotos para descubrir las clases\",\"en\":\"K-means over the photos to discover the classes\"},\"correct\":false,\"why\":{\"es\":\"Las clases ya están etiquetadas: el problema es supervisado.\",\"en\":\"The classes are already labeled: the problem is supervised.\"}}],\"takeaway\":{\"es\":\"Imágenes etiquetadas + sin expertos → AutoML.\",\"en\":\"Labeled images + no experts → AutoML.\"}}],\"questions\":[{\"key\":\"s3-q1\",\"prompt\":\"$6:props:flow:stages:2:steps:4:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:4:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:4:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:4:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:4:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:0:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:2:steps:4:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s3-q2\",\"prompt\":\"$6:props:flow:stages:2:steps:4:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:4:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:4:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:4:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:4:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:4:items:1:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:2:steps:4:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"}]},{\"id\":\"s3-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: la consulta de 38 TB\",\"en\":\"Lab: the 38 TB query\"},\"symptom\":{\"es\":\"El job nocturno de features factura unos 38 TB leídos cada noche aunque solo usa 7 días de datos. INFORMATION_SCHEMA.JOBS muestra total_bytes_processed casi igual al tamaño de la tabla, y el resultado tiene 100.000 filas.\",\"en\":\"The nightly feature job bills about 38 TB read every night although it only uses 7 days of data. INFORMATION_SCHEMA.JOBS shows total_bytes_processed almost equal to the table size, and the result has 100,000 rows.\"},\"artifact\":\"-- Tabla eventos: particionada por fecha (DATE), en clúster por pais\\nSELECT *\\nFROM eventos\\nWHERE pais = 'MX'\\n  AND tipo IN ('compra', 'devolucion')\\nLIMIT 100000;\",\"language\":\"sql\",\"question\":{\"es\":\"¿Cuál es la causa raíz del coste?\",\"en\":\"What is the root cause of the cost?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"No filtra por la columna de partición y SELECT * lee todas las columnas; LIMIT no reduce los bytes leídos\",\"en\":\"It doesn't filter on the partition column and SELECT * reads every column; LIMIT does not reduce bytes read\"},\"correct\":true,\"why\":{\"es\":\"Gana: sin filtro sobre fecha se leen todas las particiones y todas las columnas.\",\"en\":\"Wins: without a filter on fecha every partition and every column is read.\"}},{\"id\":\"B\",\"text\":{\"es\":\"El clúster por pais está roto y hay que recrear la tabla\",\"en\":\"The pais clustering is broken and the table must be recreated\"},\"correct\":false,\"why\":{\"es\":\"El clúster ayuda con el filtro por país, pero no evita leer todas las particiones ni todas las columnas.\",\"en\":\"Clustering helps the country filter, but doesn't avoid reading every partition and column.\"}},{\"id\":\"C\",\"text\":{\"es\":\"LIMIT 100000 es demasiado alto\",\"en\":\"LIMIT 100000 is too high\"},\"correct\":false,\"why\":{\"es\":\"LIMIT no cambia los bytes leídos en esta consulta.\",\"en\":\"LIMIT does not change the bytes read in this query.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Falta un índice en tipo\",\"en\":\"An index on tipo is missing\"},\"correct\":false,\"why\":{\"es\":\"El coste no se debe a ese filtro; BigQuery no funciona con índices clásicos para esto.\",\"en\":\"The cost isn't due to that filter; BigQuery doesn't rely on classic indexes for this.\"}}],\"rootCause\":{\"es\":\"La consulta no filtra por la columna de partición (fecha) y pide todas las columnas, así que BigQuery lee la tabla completa; el LIMIT solo recorta el resultado, no la lectura.\",\"en\":\"The query does not filter on the partition column (fecha) and asks for every column, so BigQuery reads the whole table; LIMIT only trims the result, not the read.\"},\"fix\":\"SELECT cliente_id, fecha, tipo, importe\\nFROM eventos\\nWHERE fecha \u003e= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)\\n  AND pais = 'MX'\\n  AND tipo IN ('compra', 'devolucion');\",\"fixNote\":{\"es\":\"Para evitar que vuelva a pasar: require_partition_filter en la tabla, un máximo de bytes facturados en el job y un dry run en la revisión de código.\",\"en\":\"To keep it from happening again: require_partition_filter on the table, a maximum bytes billed on the job and a dry run in code review.\"},\"questions\":[{\"key\":\"s3-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:2:steps:5:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:5:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:5:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:5:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:5:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:5:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:5:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:5:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:5:options:3:why\"}],\"correct\":\"A\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s3-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":14,\"title\":{\"es\":\"Checkpoint: datos y entrenamiento\",\"en\":\"Checkpoint: data and training\"},\"items\":[{\"id\":\"s3-c1\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"basic\",\"tags\":[\"notebooks\",\"seguridad\"],\"prompt\":{\"es\":\"Tu equipo prototipa con datos de clientes que no pueden salir del proyecto; seguridad exige IAM, CMEK y red privada, y el equipo quiere JupyterLab con GPU. ¿Dónde trabajan?\",\"en\":\"Your team prototypes with customer data that cannot leave the project; security requires IAM, CMEK and a private network, and the team wants JupyterLab with a GPU. Where do they work?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"En el Colab gratuito con los datos descargados\",\"en\":\"In free Colab with the data downloaded\"},\"correct\":false,\"why\":{\"es\":\"Vive fuera del proyecto: no aplica tus controles.\",\"en\":\"It lives outside the project: your controls don't apply.\"}},{\"id\":\"B\",\"text\":{\"es\":\"En portátiles con claves JSON de una cuenta de servicio\",\"en\":\"On laptops with service account JSON keys\"},\"correct\":false,\"why\":{\"es\":\"Las claves descargadas son un riesgo y los datos salen del perímetro.\",\"en\":\"Downloaded keys are a risk and the data leaves the perimeter.\"}},{\"id\":\"C\",\"text\":{\"es\":\"En una VM compartida con la cuenta predeterminada y rol Editor\",\"en\":\"On a shared VM with the default account and the Editor role\"},\"correct\":false,\"why\":{\"es\":\"Viola el mínimo privilegio y mezcla identidades.\",\"en\":\"Violates least privilege and mixes identities.\"}},{\"id\":\"D\",\"text\":{\"es\":\"En instancias de Agent Platform Workbench dentro del proyecto, con GPU, CMEK y red de la VPC\",\"en\":\"In Agent Platform Workbench instances inside the project, with GPU, CMEK and VPC networking\"},\"correct\":true,\"why\":{\"es\":\"Gana: JupyterLab gestionado con los controles de seguridad del proyecto.\",\"en\":\"Wins: managed JupyterLab with the project's security controls.\"}}],\"takeaway\":{\"es\":\"Datos sensibles + notebooks → Workbench o Colab Enterprise en tu proyecto.\",\"en\":\"Sensitive data + notebooks → Workbench or Colab Enterprise in your project.\"}},{\"id\":\"s3-c2\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"entrenamiento\",\"hardware\"],\"prompt\":{\"es\":\"Un modelo de visión tarda 3 días en 1 GPU; cabe de sobra en la memoria de una GPU, el dataset es enorme y negocio lo quiere en horas sin cambiar la arquitectura. ¿Qué estrategia aplicas?\",\"en\":\"A vision model takes 3 days on 1 GPU; it easily fits in one GPU's memory, the dataset is huge, and the business wants it in hours without changing the architecture. Which strategy do you apply?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Paralelismo de datos en varias GPUs (y nodos), con all-reduce de gradientes\",\"en\":\"Data parallelism across several GPUs (and nodes), with gradient all-reduce\"},\"correct\":true,\"why\":{\"es\":\"Gana: cada réplica procesa una parte del lote; es lo indicado cuando el modelo cabe.\",\"en\":\"Wins: each replica processes part of the batch; it is the fit when the model fits.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Paralelismo de modelo repartiendo capas entre GPUs\",\"en\":\"Model parallelism splitting layers across GPUs\"},\"correct\":false,\"why\":{\"es\":\"Es para modelos que NO caben en una GPU; aquí añade comunicación sin beneficio.\",\"en\":\"It is for models that DON'T fit on one GPU; here it adds communication without benefit.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Una CPU con muchos núcleos\",\"en\":\"A CPU with many cores\"},\"correct\":false,\"why\":{\"es\":\"Las redes de visión entrenan mucho más rápido en aceleradores.\",\"en\":\"Vision networks train much faster on accelerators.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Bajar el tamaño del dataset a la mitad\",\"en\":\"Cut the dataset in half\"},\"correct\":false,\"why\":{\"es\":\"Reduce el tiempo a costa de la calidad, no resuelve el requisito.\",\"en\":\"Cuts time at the expense of quality; it doesn't meet the requirement.\"}}],\"takeaway\":{\"es\":\"Modelo cabe + datos enormes → paralelismo de datos.\",\"en\":\"Model fits + huge data → data parallelism.\"}},{\"id\":\"s3-c3\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"feature-store\",\"serving\"],\"prompt\":{\"es\":\"Tus features de cliente se calculan en BigQuery para entrenar; la API de predicción necesita el último valor de cada cliente en milisegundos, con la misma definición que en entrenamiento. ¿Qué usas?\",\"en\":\"Your customer features are computed in BigQuery for training; the prediction API needs each customer's latest value in milliseconds, with the same definition as in training. What do you use?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Una consulta a BigQuery por petición\",\"en\":\"One BigQuery query per request\"},\"correct\":false,\"why\":{\"es\":\"Las consultas tardan segundos y encarecen cada predicción.\",\"en\":\"Queries take seconds and make every prediction expensive.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Agent Platform Feature Store sirviendo online desde las tablas de BigQuery\",\"en\":\"Agent Platform Feature Store serving online from the BigQuery tables\"},\"correct\":true,\"why\":{\"es\":\"Gana: BigQuery es el almacén offline y Feature Store sirve el último valor con baja latencia y la misma definición.\",\"en\":\"Wins: BigQuery is the offline store and Feature Store serves the latest value at low latency with the same definition.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Recalcular las features en la API con código propio\",\"en\":\"Recompute the features in the API with custom code\"},\"correct\":false,\"why\":{\"es\":\"Duplica la lógica y abre la puerta al training-serving skew.\",\"en\":\"Duplicates logic and opens the door to training-serving skew.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Exportar las features a CSV cada noche\",\"en\":\"Export the features to CSV every night\"},\"correct\":false,\"why\":{\"es\":\"No da baja latencia ni valores actualizados.\",\"en\":\"Gives neither low latency nor fresh values.\"}}],\"takeaway\":{\"es\":\"Misma feature en entrenamiento y online → Feature Store.\",\"en\":\"Same feature in training and online → Feature Store.\"}},{\"id\":\"s3-c4\",\"type\":\"bug_diagnosis\",\"difficulty\":\"advanced\",\"tags\":[\"entrenamiento\",\"diagnostico\"],\"prompt\":{\"es\":\"Al pasar un job de PyTorch de 1 a 8 GPUs multiplicaste el lote y el learning rate por 8. Desde la época 3 la pérdida es NaN; los datos y el código del modelo no cambiaron. ¿Qué haces primero?\",\"en\":\"Moving a PyTorch job from 1 to 8 GPUs, you multiplied the batch and the learning rate by 8. From epoch 3 the loss is NaN; the data and model code are unchanged. What do you do first?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Añadir más GPUs para estabilizar\",\"en\":\"Add more GPUs to stabilize it\"},\"correct\":false,\"why\":{\"es\":\"Más hardware no corrige gradientes que explotan.\",\"en\":\"More hardware doesn't fix exploding gradients.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Quitar el dropout\",\"en\":\"Remove dropout\"},\"correct\":false,\"why\":{\"es\":\"El dropout no causa NaN; el problema está en el tamaño del paso.\",\"en\":\"Dropout does not cause NaN; the issue is the step size.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Añadir warmup del learning rate y recorte de gradientes, y bajar el learning rate si persiste\",\"en\":\"Add learning-rate warmup and gradient clipping, and lower the learning rate if it persists\"},\"correct\":true,\"why\":{\"es\":\"Gana: el paso es demasiado grande y los gradientes explotan; warmup y recorte lo estabilizan.\",\"en\":\"Wins: the step is too large and gradients explode; warmup and clipping stabilize it.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Cambiar a paralelismo de modelo\",\"en\":\"Switch to model parallelism\"},\"correct\":false,\"why\":{\"es\":\"El modelo cabe; cambiar de estrategia no corrige el learning rate.\",\"en\":\"The model fits; changing strategy doesn't fix the learning rate.\"}}],\"takeaway\":{\"es\":\"NaN tras subir el learning rate → gradientes que explotan: warmup + recorte.\",\"en\":\"NaN after raising the learning rate → exploding gradients: warmup + clipping.\"}},{\"id\":\"s3-c5\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"advanced\",\"tags\":[\"hiperparametros\",\"costo\"],\"prompt\":{\"es\":\"Cada entrenamiento tarda 2 horas, tienes presupuesto para 40 trials y el resultado debe estar en 2 días (48 h). En secuencia serían 80 h. ¿Cómo configuras el tuning de hiperparámetros en Agent Platform?\",\"en\":\"Each training run takes 2 hours, you can afford 40 trials and the result is due in 2 days (48 h). Sequentially it would take 80 h. How do you configure hyperparameter tuning on Agent Platform?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"40 trials en paralelo a la vez para terminar en 2 horas\",\"en\":\"40 trials all in parallel to finish in 2 hours\"},\"correct\":false,\"why\":{\"es\":\"Cumple el plazo, pero el algoritmo bayesiano no aprende nada entre intentos: equivale a una búsqueda aleatoria.\",\"en\":\"Meets the deadline, but the Bayesian algorithm learns nothing between attempts: it becomes a random search.\"}},{\"id\":\"B\",\"text\":{\"es\":\"1 trial cada vez con el algoritmo por defecto\",\"en\":\"1 trial at a time with the default algorithm\"},\"correct\":false,\"why\":{\"es\":\"Tardaría 80 horas: incumple el plazo.\",\"en\":\"It would take 80 hours: it misses the deadline.\"}},{\"id\":\"C\",\"text\":{\"es\":\"GRID_SEARCH sobre rangos continuos\",\"en\":\"GRID_SEARCH over continuous ranges\"},\"correct\":false,\"why\":{\"es\":\"La búsqueda en rejilla exige parámetros discretos.\",\"en\":\"Grid search requires discrete parameters.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Algoritmo por defecto (bayesiano) con unos 4 trials en paralelo\",\"en\":\"Default (Bayesian) algorithm with about 4 parallel trials\"},\"correct\":true,\"why\":{\"es\":\"Gana: 10 tandas de 2 h caben en el plazo y cada tanda aprende de las anteriores.\",\"en\":\"Wins: 10 rounds of 2 h fit the deadline and each round learns from the previous ones.\"}}],\"takeaway\":{\"es\":\"Paralelismo justo para el plazo; el resto, secuencial para que el bayesiano aprenda.\",\"en\":\"Just enough parallelism for the deadline; the rest sequential so the Bayesian search learns.\"}}],\"refs\":[{\"quiz\":{\"es\":\"gcp-pmle-2026-es\",\"en\":\"gcp-pmle-2026\"},\"ids\":[\"5\",\"8\"]}],\"questions\":[{\"key\":\"s3-c1\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:0:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s3-c2\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:1:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s3-c3\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:2:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:2:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s3-c4\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:3:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"bug_diagnosis\"},{\"key\":\"s3-c5\",\"prompt\":\"$6:props:flow:stages:2:steps:6:items:4:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:2:steps:6:items:4:options:0:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:2:steps:6:items:4:options:1:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:2:steps:6:items:4:options:2:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:2:steps:6:items:4:options:3:text\",\"why\":\"$6:props:flow:stages:2:steps:6:items:4:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:2:steps:6:items:4:takeaway\",\"difficulty\":\"advanced\",\"type\":\"architecture_tradeoff\"},{\"key\":\"gcp-pmle-2026-es::5\",\"prompt\":{\"es\":\"Un equipo sanitario quiere entrenar un modelo con notas clínicas guardadas en BigQuery. Los científicos de datos no deben ver nombres de pacientes, teléfonos ni números de historia clínica, pero el texto desidentificado debe conservar su sentido para entrenar. ¿Qué hay que hacer antes de que los datos lleguen al entorno de entrenamiento?\",\"en\":\"A healthcare team wants to train a model on clinical notes stored in BigQuery. Data scientists must not see patient names, phone numbers or medical record numbers, but the de-identified text must keep its meaning for training. What should be done before the data reaches the training environment?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Des-identificar las notas con Sensitive Data Protection (tokens de infoType o seudónimos consistentes) en un dataset aparte, y dar a los científicos de datos acceso solo a ese dataset\",\"en\":\"De-identify the notes with Sensitive Data Protection (infoType tokens or consistent pseudonyms) into a separate dataset, and grant data scientists access only to that dataset\"}},{\"id\":\"B\",\"text\":{\"es\":\"Eliminar por completo la columna de notas clínicas y entrenar solo con los campos estructurados, ya que los identificadores suelen aparecer en el texto libre\",\"en\":\"Drop the clinical notes column entirely and train only on the structured fields, since free text is where identifiers usually appear\"}},{\"id\":\"C\",\"text\":{\"es\":\"Confiar en el cifrado en reposo por defecto de BigQuery\",\"en\":\"Rely on BigQuery's default encryption at rest\"}},{\"id\":\"D\",\"text\":{\"es\":\"Dar a los científicos de datos lectura sobre la tabla original, pedirles que firmen un acuerdo de confidencialidad y que no miren los identificadores, y auditar sus consultas cada trimestre\",\"en\":\"Give data scientists read access to the raw table, ask them to sign a confidentiality agreement and not to look at identifiers, and audit their queries every quarter\"}}],\"correct\":\"A\",\"explanation\":{\"es\":\"Sensitive Data Protection (Cloud DLP) inspecciona el texto en busca de infoTypes (nombres de persona, teléfonos, números de historia clínica, identificadores propios) y los desidentifica: sustitución por el nombre del infoType, enmascarado o tokenización/seudonimización determinista para que el mismo paciente tenga siempre el mismo token. El sentido de la nota se conserva para el modelo y los identificadores desaparecen. Escribir en un dataset separado y dar IAM solo allí impone la separación; el dato en bruto sigue restringido.\\n\\nPor qué fallan las demás: (B) quitar las notas elimina la señal de entrenamiento. (C) el cifrado en reposo no oculta el contenido a lectores autorizados. (D) una petición no es un control y no pasaría ninguna auditoría.\\n\\nPista de examen: «PII en datos de entrenamiento» + «conservar utilidad» → desidentificación con Sensitive Data Protection antes de entrenar, con separación de accesos.\",\"en\":\"Sensitive Data Protection (Cloud DLP) inspects text for infoTypes (person names, phone numbers, medical record numbers, custom identifiers) and de-identifies them: replacement with the infoType name, masking, or deterministic tokenization/pseudonymization so the same patient maps to the same token. The meaning of the note is kept for modeling while the identifiers are gone. Writing to a separate dataset and granting IAM only there enforces the separation; the raw data stays restricted.\\n\\nWhy the others fail: (B) dropping the notes removes the training signal. (C) encryption at rest does not hide content from authorized readers. (D) a request is not a control and would fail any audit.\\n\\nExam cue: \\\"PII in training data\\\" + \\\"keep utility\\\" → Sensitive Data Protection de-identification before training, with access separation.\"}},{\"key\":\"gcp-pmle-2026-es::8\",\"prompt\":{\"es\":\"Un auditor pregunta qué versión del dataset, qué componente de preprocesado y qué hiperparámetros produjeron el modelo desplegado, y además el equipo debe comparar en paralelo decenas de entrenamientos pasados. ¿Qué capacidades de Google Cloud responden a ambas necesidades?\",\"en\":\"An auditor asks which dataset version, preprocessing component and hyperparameters produced the model currently deployed, and the team must also compare dozens of past training runs side by side. Which Google Cloud capabilities answer both needs?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Búsquedas de texto en Cloud Logging con la palabra «train»\",\"en\":\"Cloud Logging text searches for the word \\\"train\\\"\"}},{\"id\":\"B\",\"text\":{\"es\":\"Una hoja de cálculo compartida donde los ingenieros pegan la ruta del dataset, la versión del preprocesado, los hiperparámetros y las métricas tras cada entrenamiento\",\"en\":\"A shared spreadsheet where engineers paste the dataset path, preprocessing version, hyperparameters and metrics after each training run\"}},{\"id\":\"C\",\"text\":{\"es\":\"Versionado de objetos de Cloud Storage en el fichero del modelo, más etiquetas en el bucket con la fecha de entrenamiento, para poder restaurar cualquier binario anterior\",\"en\":\"Cloud Storage object versioning on the model file, plus labels on the bucket recording the training date, so every previous model binary can be restored\"}},{\"id\":\"D\",\"text\":{\"es\":\"Experiments para parámetros y métricas de cada ejecución, y ML Metadata de Agent Platform Pipelines para el linaje hasta el modelo\",\"en\":\"Experiments for each run's parameters and metrics, and ML Metadata from Agent Platform Pipelines for lineage up to the model\"}}],\"correct\":\"D\",\"explanation\":{\"es\":\"Experiments (Agent Platform Experiments, antes Vertex AI Experiments) registra parámetros, métricas y artefactos de cada ejecución y permite compararlas en tablas y gráficos, con TensorBoard para las curvas detalladas. ML Metadata guarda el linaje —qué artefactos (datasets, datos transformados, modelos) produjo y consumió cada ejecución— y Agent Platform Pipelines lo escribe automáticamente en cada ejecución, así que se puede ir desde el modelo en Model Registry hasta los datos y el código exactos que lo crearon.\\n\\nPor qué fallan las demás: (A) buscar texto en logs no es linaje estructurado. (B) las hojas manuales son propensas a errores y no auditables. (C) versionar el fichero del modelo no dice cómo se produjo.\\n\\nPista de examen: «comparar ejecuciones» → Experiments; «linaje / qué datos produjeron este modelo» → ML Metadata (vía Pipelines).\",\"en\":\"Experiments (Agent Platform Experiments, formerly Vertex AI Experiments) records parameters, metrics and artifacts for each run and lets you compare runs in tables and charts, with TensorBoard for detailed curves. ML Metadata stores lineage — which artifacts (datasets, transformed data, models) were produced and consumed by which executions — and Agent Platform Pipelines writes it automatically for every pipeline run, so you can walk back from the model in Model Registry to the exact data and code that created it.\\n\\nWhy the others fail: (A) free-text log searches are not structured lineage. (B) manual spreadsheets are error-prone and unauditable. (C) versioning the model file says nothing about how it was produced.\\n\\nExam cue: \\\"compare runs\\\" → Experiments; \\\"lineage / which data produced this model\\\" → ML Metadata (via Pipelines).\"}}]},{\"id\":\"s3-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre Feynman: de los datos al modelo registrado\",\"en\":\"Feynman close: from data to a registered model\"},\"prompt\":{\"es\":\"Explica en 4–5 frases cómo prepararías datos de clientes para entrenar sin disparar el coste ni exponer PII, y cómo decidirías entre BigQuery ML, AutoML y entrenamiento personalizado.\",\"en\":\"Explain in 4–5 sentences how you would prepare customer data for training without blowing up cost or exposing PII, and how you would decide between BigQuery ML, AutoML and custom training.\"},\"keyPoints\":[{\"es\":\"Herramienta por escala y consultas que leen solo columnas y particiones necesarias.\",\"en\":\"Tool by scale and queries that read only the needed columns and partitions.\"},{\"es\":\"PII desidentificada con Sensitive Data Protection antes de entrenar.\",\"en\":\"PII de-identified with Sensitive Data Protection before training.\"},{\"es\":\"La opción más gestionada que cumpla: BigQuery ML (SQL), AutoML (sin código), personalizado (control total).\",\"en\":\"The most managed option that fits: BigQuery ML (SQL), AutoML (no code), custom (full control).\"},{\"es\":\"Ejecuciones registradas (Experiments, ML Metadata) y modelos versionados en Model Registry.\",\"en\":\"Runs logged (Experiments, ML Metadata) and models versioned in Model Registry.\"}]}]},{\"id\":\"s4\",\"title\":{\"es\":\"Producción: serving, MLOps, monitorización y seguridad\",\"en\":\"Production: serving, MLOps, monitoring and security\"},\"objective\":{\"es\":\"Al terminar sabrás desplegar sin riesgo, automatizar el reentrenamiento con una puerta de calidad, interpretar alertas de skew y drift y aplicar mínimo privilegio.\",\"en\":\"By the end you will deploy safely, automate retraining behind a quality gate, interpret skew and drift alerts and apply least privilege.\"},\"steps\":[{\"id\":\"s4-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: un modelo es un sistema vivo\",\"en\":\"Capsule: a model is a living system\"},\"problem\":{\"es\":\"Un modelo desplegado se degrada sin avisar, cada actualización arriesga a todos los clientes y las cuentas con permisos de sobra convierten un fallo en un incidente. Entrenar bien no basta.\",\"en\":\"A deployed model degrades silently, every update puts all customers at risk, and over-privileged accounts turn a bug into an incident. Training well is not enough.\"},\"mechanism\":{\"es\":\"El modelo versionado en Model Registry se sirve por lotes (sin endpoint) o online (endpoint con réplicas mínimas y máximas que escalan por utilización). Una versión nueva entra como canary con poco tráfico y sube si las métricas aguantan. Pipelines automatiza preparar, entrenar, evaluar y registrar; una puerta compara con el modelo actual antes de desplegar. Model Monitoring compara distribuciones de entrada, predicción y atribuciones con una referencia y alerta por umbral. Cada carga corre con una cuenta de servicio dedicada y solo los roles que necesita.\",\"en\":\"The model versioned in Model Registry is served in batch (no endpoint) or online (an endpoint with minimum and maximum replicas that scale by utilization). A new version enters as a canary with little traffic and grows if metrics hold. Pipelines automates preparing, training, evaluating and registering; a gate compares with the current model before deploying. Model Monitoring compares input, prediction and attribution distributions against a baseline and alerts by threshold. Every workload runs as a dedicated service account with only the roles it needs.\"},\"flow\":[{\"es\":\"Model Registry → endpoint (canary 10 % → 50 % → 100 %) o batch inference\",\"en\":\"Model Registry → endpoint (canary 10% → 50% → 100%) or batch inference\"},{\"es\":\"Nuevos datos o alerta → Pipeline: entrenar → evaluar → puerta → registrar → desplegar\",\"en\":\"New data or alert → Pipeline: train → evaluate → gate → register → deploy\"},{\"es\":\"Producción → Model Monitoring (skew, drift, atribuciones) → investigar → reentrenar o corregir datos\",\"en\":\"Production → Model Monitoring (skew, drift, attributions) → investigate → retrain or fix data\"}],\"whenNot\":[{\"es\":\"No pongas un endpoint online para un scoring semanal: pagarás réplicas encendidas sin tráfico.\",\"en\":\"Don't put an online endpoint behind a weekly scoring job: you pay for idle replicas.\"},{\"es\":\"No reentrenes como respuesta a un skew de preprocesado: unifica la transformación.\",\"en\":\"Don't retrain as the answer to preprocessing skew: unify the transformation.\"},{\"es\":\"No uses la cuenta predeterminada con rol Editor para pipelines ni endpoints.\",\"en\":\"Don't use the default account with the Editor role for pipelines or endpoints.\"}]},{\"id\":\"s4-tarjetas\",\"kind\":\"cards\",\"minutes\":25,\"title\":{\"es\":\"Tarjetas: producción, MLOps y monitorización\",\"en\":\"Cards: production, MLOps and monitoring\"},\"deck\":\"gcp-ml-course\",\"module\":\"m5\",\"cardsEs\":[{\"id\":\"m5-03\",\"part\":\"m\",\"front\":\"Dos casos: puntuar 50 millones de clientes cada domingo y responder a un checkout en menos de 100 ms. ¿Inferencia por lotes u online en cada uno, y qué servicio usas?\",\"back\":\"El domingo es inferencia por lotes (batch inference sobre Cloud Storage o BigQuery, sin endpoint) y el checkout es inferencia online en un endpoint desplegado.\\n\\n• Batch: un trabajo lee la entrada, escribe resultados y termina; no necesitas desplegar el modelo en un endpoint.\\n• Para un modelo de BigQuery ML, el batch más simple es ML.PREDICT en SQL.\\n• Online: un endpoint con réplicas siempre encendidas responde petición a petición con baja latencia.\\n• Coste: el batch paga solo mientras corre; un endpoint online paga sus réplicas mínimas aunque no reciba tráfico.\\n\\nPista de examen: «resultados para mañana / grandes volúmenes» → batch; «en tiempo real / por petición» → online.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"serving\",\"costo\"]},{\"id\":\"m2-05\",\"part\":\"m\",\"front\":\"Ya tienes un modelo entrenado. ¿Qué pasos y recursos hacen falta para servir predicciones online en Agent Platform?\",\"back\":\"El modelo debe estar en Model Registry y se despliega en un endpoint; el despliegue asocia recursos de cómputo (DeployedModel) para responder con baja latencia.\\n\\n• Model: el artefacto y el contenedor de inferencia (prebuilt o propio).\\n• Endpoint: dónde se reciben las peticiones (público dedicado o compartido, o Private Service Connect).\\n• DeployedModel: tipo de máquina, aceleradores y réplicas mínimas y máximas.\\n• Un endpoint puede alojar varios modelos y un modelo puede desplegarse en varios endpoints.\\n• Cambiar los recursos de cómputo de un despliegue exige volver a desplegar.\\n\\nPista de examen: «servir online» → Model Registry → endpoint → desplegar con recursos.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"serving\",\"agent-platform\"]},{\"id\":\"m2-06\",\"part\":\"m\",\"front\":\"Tu modelo necesita preprocesado y postprocesado propios que no ofrecen los contenedores prebuilt. ¿Qué debe cumplir tu contenedor de inferencia para Agent Platform?\",\"back\":\"Un servidor HTTP que escuche en 0.0.0.0 en el puerto configurado, responda a las comprobaciones de salud y atienda la ruta de predicción, empaquetado como imagen en Artifact Registry.\\n\\n• Puerto: el que declares en el modelo; el contenedor lo recibe en AIP_HTTP_PORT.\\n• Salud: la ruta AIP_HEALTH_ROUTE debe devolver 200 cuando el modelo está listo.\\n• Predicción: la ruta AIP_PREDICT_ROUTE recibe las instancias y devuelve las predicciones.\\n• El proceso del ENTRYPOINT debe quedarse en marcha; si arranca el servidor en segundo plano y sale, el contenedor muere.\\n\\nPista de examen: «lógica de inferencia propia o framework no soportado» → contenedor propio; si no, contenedor prebuilt.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"contenedores\"]},{\"id\":\"m5-04\",\"part\":\"m\",\"front\":\"Tu endpoint recibe 10 peticiones por segundo de noche y 800 en las rebajas. ¿Cómo escala automáticamente en Agent Platform y qué controlas tú?\",\"back\":\"El endpoint ajusta el número de réplicas entre el mínimo y el máximo que configuras para mantener la utilización en su objetivo, por defecto un 60 % de CPU (o de GPU si hay aceleradores).\\n\\n• Mínimo de réplicas: capacidad siempre lista y coste fijo; debe ser al menos 1 salvo que uses Scale To Zero.\\n• Máximo de réplicas: tope de coste; la cuota se reserva para el máximo aunque no se use.\\n• Se pueden usar otras métricas (número de peticiones, por ejemplo), desactivadas por defecto.\\n• Escalar tarda: si el pico es brusco, sube el mínimo antes del evento.\\n\\nPista de examen: «picos previsibles y latencia estricta» → mínimo de réplicas más alto; «coste acotado» → máximo de réplicas.\",\"topic\":\"Serving\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"serving\",\"escalado\"]},{\"id\":\"m5-07\",\"part\":\"m\",\"front\":\"Tu endpoint responde en 450 ms y el SLA es 100 ms. El modelo ya está desplegado. ¿Qué palancas tienes para bajar la latencia?\",\"back\":\"Reduce el tiempo de cómputo por petición y las colas: tipo de máquina o
