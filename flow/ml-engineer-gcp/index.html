7c67fe0557f335f.js\",\"838\",\"static/chunks/838-09a7e5ad345938c1.js\",\"771\",\"static/chunks/app/flow/%5Bid%5D/page-96147503ab10df7c.js\"],\"default\"]\nf:T478,Model Monitoring puede vigilar dos familias de señales: drift/skew de variables (cambios en la distribución de las entradas frente al entrenamiento o a lo largo del tiempo) y drift/skew de atribuciones (cambios en cuánto contribuye cada variable a las predicciones, usando las atribuciones de Explainable AI). El drift de atribuciones puede destapar problemas que las estadísticas de entrada no ven —por ejemplo interacciones entre variables que cambian o el pipeline de una variable que se degrada en silencio— y es una señal para investigar y quizá reentrenar.\n\nPor qué fallan las demás: (A) el skew compara las entradas de serving con los datos de entrenamiento, y el caso dice que las entradas parecen estables. (B) el concept drift es un cambio en la relación entre variables y objetivo, que se confirma con etiquetas y métricas; el caso no da datos de accuracy. (D) nada del caso habla de latencia.\n\nPista de examen: «cambió la importancia/atribución de las variables» → feature attribution drift; «cambió la distribución de entrada» → data drift; «las entradas de serving difieren del entrenamiento» → skew.10:T558,1. RAG / grounding sobre el repositorio de políticas (RAG Engine o Vertex AI Search), reindexando cuando cambian.\n   Porque el conocimiento cambia cada semana y hay que citar la fuente; el tuning quedaría desfasado y no cita.\n   Lo mido con: groundedness y relevancia (Gen AI evaluation service) sobre un conjunto de preguntas reales, y % de respuestas con cita correcta.\n\n2. Supervised tuning (Gemini, o PEFT/LoRA en un modelo abierto) con los 20.000 ejemplos.\n   Porque es un comportamiento constante que el prompt no fija y hay muchos ejemplos de calidad.\n   Lo mido con: % de JSON válido y exactitud/F1 por categoría en un test reservado, comparado con el "])</script><script>self.__next_f.push([1,"prompt actual.\n\n3. Context caching del manual (y probar un modelo Flash si la evaluación lo aprueba).\n   Porque el mismo prefijo grande se repite: se guarda una vez y baja coste y tiempo hasta el primer token.\n   Lo mido con: latencia p95, coste por petición y la misma métrica de calidad antes y después.\n\n4. Provisioned Throughput para el tráfico crítico (o backoff exponencial si tolera esperas) + Model Armor sobre prompts y respuestas.\n   Porque los 429 son de capacidad compartida, y la inyección se filtra con un control gestionado, no con más instrucciones.\n   Lo mido con: tasa de 429 y latencia en el pico; % de ataques bloqueados en un conjunto de prompts de prueba y falsos positivos.11:T542,1. RAG / grounding over the policy repository (RAG Engine or Vertex AI Search), re-indexing when they change.\n   Because the knowledge changes every week and the source must be cited; tuning would go stale and cannot cite.\n   I measure it with: groundedness and relevance (Gen AI evaluation service) on a set of real questions, and % of answers with a correct citation.\n\n2. Supervised tuning (Gemini, or PEFT/LoRA on an open model) with the 20,000 examples.\n   Because it is a consistent behaviour prompting does not pin down and there are many quality examples.\n   I measure it with: % of valid JSON and accuracy/F1 per category on a held-out test, compared with the current prompt.\n\n3. Context caching for the manual (and try a Flash model if evaluation approves it).\n   Because the same large prefix repeats: it is stored once and cost and time to first token go down.\n   I measure it with: p95 latency, cost per request and the same quality metric before and after.\n\n4. Provisioned Throughput for the critical traffic (or exponential backoff if it can wait) + Model Armor on prompts and responses.\n   Because the 429s come from shared capacity, and injection is filtered by a managed control, not by more instructions.\n   I measure it with: 429 rate and latency at the peak; % of attacks blocked on a set of test prompts, and false "])</script><script>self.__next_f.push([1,"positives.12:T46c,Las soluciones de IA generativa necesitan monitorizar la calidad, no solo la salud del sistema. Registrar peticiones, contexto recuperado y respuestas permite evaluar el tráfico de producción: un trabajo periódico puntúa una muestra con métricas basadas en modelo (groundedness o fidelidad al contexto, relevancia, seguridad) con el Gen AI evaluation service o una rúbrica de LLM-as-a-judge, y el feedback de los usuarios añade una señal directa. Las métricas operativas (latencia, errores, tokens y coste) del dashboard de model observability y Cloud Monitoring completan el cuadro, y los cambios en el corpus de documentos son una causa habitual que investigar.\n\nPor qué fallan las demás: (A) un sistema que alucina puede tener una latencia perfecta. (B) un conjunto fijo anual no ve los nuevos tipos de pregunta ni los cambios del corpus. (D) ajustar cada semana con preguntas sin revisar no mide nada y puede empeorar el grounding.\n\nPista de examen: «monitorizar una app de IA generativa en producción» → registrar y evaluar muestras de forma continua (groundedness, seguridad) + feedback + métricas operativas."])</script><script>self.__next_f.push([1,"6:[\"$\",\"$Le\",null,{\"flow\":{\"id\":\"ml-engineer-gcp\",\"emoji\":\"🛤️\",\"category\":\"machine-learning\",\"level\":\"intermedio\",\"minutes\":393,\"passPct\":70,\"title\":{\"es\":\"Ruta ML Engineer en Google Cloud\",\"en\":\"ML Engineer path on Google Cloud\"},\"summary\":{\"es\":\"Para quien prepara el Professional Machine Learning Engineer: de los fundamentos a BigQuery ML, datos, entrenamiento, producción e IA generativa en Agent Platform, con un checkpoint por etapa.\",\"en\":\"For anyone preparing for the Professional Machine Learning Engineer exam: from fundamentals to BigQuery ML, data, training, production and generative AI on Agent Platform, with a checkpoint per stage.\"},\"outcomes\":[{\"es\":\"Diagnosticar sobreajuste, fugas de datos, skew y drift a partir de métricas y síntomas.\",\"en\":\"Diagnose overfitting, data leakage, skew and drift from metrics and symptoms.\"},{\"es\":\"Elegir entre BigQuery ML, AutoML y entrenamiento personalizado según equipo, datos y latencia.\",\"en\":\"Choose between BigQuery ML, AutoML and custom training by team, data and latency.\"},{\"es\":\"Escribir CREATE MODEL, ML.EVALUATE y ML.ROC_CURVE con opciones reales de BigQuery ML.\",\"en\":\"Write CREATE MODEL, ML.EVALUATE and ML.ROC_CURVE with real BigQuery ML options.\"},{\"es\":\"Diseñar despliegue, reentrenamiento y monitorización con mínimo privilegio.\",\"en\":\"Design deployment, retraining and monitoring with least privilege.\"},{\"es\":\"Decidir entre prompting, RAG y tuning, y proteger y evaluar una solución generativa.\",\"en\":\"Decide between prompting, RAG and tuning, and secure and evaluate a generative solution.\"}],\"related\":{\"decks\":[\"gcp-pmle-2026-mapa\",\"gcp-ml-course\",\"tf-keras-course\"],\"quizzes\":[\"gcp-pmle-2026-es\",\"ml-fundamentals-es\"]},\"exam\":{\"id\":\"ruta-ml-engineer-gcp\",\"title\":{\"es\":\"Examen de la ruta ML Engineer en Google Cloud\",\"en\":\"ML Engineer on Google Cloud path exam\"}},\"stages\":[{\"id\":\"s1\",\"title\":{\"es\":\"Fundamentos que el examen da por supuestos\",\"en\":\"Fundamentals the exam takes for granted\"},\"objective\":{\"es\":\"Al terminar sabrás diagnosticar sobreajuste, fugas de datos y drift, y elegir la validación y la métrica correctas para un problema dado.\",\"en\":\"By the end you will diagnose overfitting, data leakage and drift, and choose the right validation and metric for a given problem.\"},\"steps\":[{\"id\":\"s1-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: por qué un modelo brillante falla en producción\",\"en\":\"Capsule: why a brilliant model fails in production\"},\"problem\":{\"es\":\"Un modelo puede brillar en el notebook y fallar en producción: memoriza en vez de generalizar, usa información que no existirá al predecir o se evalúa con una métrica que esconde justo el error que importa.\",\"en\":\"A model can shine in the notebook and fail in production: it memorizes instead of generalizing, uses information that will not exist at prediction time, or is judged with a metric that hides exactly the error that matters.\"},\"mechanism\":{\"es\":\"El entrenamiento minimiza una pérdida sobre datos que el modelo ve; solo datos que no vio dicen si generaliza (validación para decidir, test para medir una vez). El hueco entre error de entrenamiento y de validación revela varianza; los dos altos, sesgo. Si una feature se calcula con información posterior al evento, el modelo aprende la respuesta y no el patrón. Con clases raras, la accuracy premia decir siempre «no»; recall, precision y la curva precision-recall miden la clase que importa. Tras desplegar, el mundo cambia: drift de datos (entradas) o de concepto (relación con la etiqueta).\",\"en\":\"Training minimizes a loss over data the model sees; only unseen data tells whether it generalizes (validation to decide, test to measure once). The gap between training and validation error reveals variance; both high, bias. If a feature is computed with information from after the event, the model learns the answer, not the pattern. With rare classes, accuracy rewards always saying «no»; recall, precision and the precision-recall curve measure the class that matters. After deployment the world changes: data drift (inputs) or concept drift (relationship with the label).\"},\"flow\":[{\"es\":\"Datos → split por tiempo o por grupo si hace falta → entrenar → validar → test una sola vez\",\"en\":\"Data → split by time or by group when needed → train → validate → test once\"},{\"es\":\"Pérdida de entrenamiento ↓ y de validación ↑ → sobreajuste → regularizar o early stopping\",\"en\":\"Training loss ↓ and validation loss ↑ → overfitting → regularize or early stopping\"},{\"es\":\"Clase rara → recall, precision, curva PR → umbral según el coste de cada error\",\"en\":\"Rare class → recall, precision, PR curve → threshold by the cost of each error\"}],\"whenNot\":[{\"es\":\"No uses split aleatorio con series temporales ni con varias filas por usuario: filtras el futuro o al mismo usuario a ambos lados.\",\"en\":\"Don't use a random split with time series or with several rows per user: you leak the future or the same user to both sides.\"},{\"es\":\"No uses accuracy como métrica principal cuando la clase positiva es el 1 % de los datos.\",\"en\":\"Don't use accuracy as the main metric when the positive class is 1% of the data.\"},{\"es\":\"No elijas hiperparámetros mirando el test: deja de ser una medida honesta.\",\"en\":\"Don't pick hyperparameters by looking at the test set: it stops being an honest measure.\"}],\"mermaid\":\"flowchart LR\\n  D[Datos] --\u003e S[Split por tiempo o grupo]\\n  S --\u003e T[Entrenar]\\n  T --\u003e V[Validar y elegir]\\n  V --\u003e X[Test una vez]\\n  X --\u003e P[Produccion y drift]\"},{\"id\":\"s1-tarjetas\",\"kind\":\"cards\",\"minutes\":20,\"title\":{\"es\":\"Tarjetas: Fundamentos de ML\",\"en\":\"Cards: ML fundamentals\"},\"deck\":\"gcp-ml-course\",\"module\":\"m1\",\"cardsEs\":[{\"id\":\"m1-01\",\"part\":\"m\",\"front\":\"Un modelo supervisado «aprende» de datos históricos. ¿Qué ajusta exactamente el entrenamiento y qué debe demostrar la evaluación?\",\"back\":\"El entrenamiento ajusta los parámetros de una función minimizando una pérdida sobre datos etiquetados; la evaluación debe demostrar que generaliza a datos que nunca vio.\\n\\n• Etiqueta (target): lo que quieres predecir. Features: las señales disponibles en el momento de predecir.\\n• Parámetros (pesos, umbrales de los árboles): los aprende el algoritmo.\\n• Hiperparámetros (learning rate, profundidad, regularización): los eliges tú antes de entrenar.\\n• Un buen resultado en los datos de entrenamiento solo prueba que el modelo los recuerda, no que generalice.\\n\\nPista de examen: si el enunciado dice «funciona en el notebook pero falla en producción», piensa en generalización, fuga de datos o skew.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"fundamentos\"]},{\"id\":\"m1-11\",\"part\":\"m\",\"front\":\"Tres encargos: decidir si un correo es spam, estimar el precio de una casa y agrupar clientes de los que no tienes ninguna etiqueta. ¿Qué tipo de problema es cada uno?\",\"back\":\"Spam es clasificación, el precio es regresión y agrupar sin etiquetas es clustering (aprendizaje no supervisado).\\n\\n• Clasificación: la salida es una categoría (binaria o multiclase).\\n• Regresión: la salida es un número continuo.\\n• Clustering: no hay etiqueta; el algoritmo agrupa por similitud (por ejemplo k-means).\\n• Otros tipos frecuentes: series temporales (prever valores futuros), recomendación (usuario–ítem) y detección de anomalías.\\n\\nPista de examen: identifica primero la forma de la salida; eso descarta la mitad de las opciones.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"fundamentos\"]},{\"id\":\"m1-02\",\"part\":\"m\",\"front\":\"Tienes un dataset y debes entrenar, elegir hiperparámetros y reportar el rendimiento final. ¿Qué papel cumple cada conjunto: entrenamiento, validación y test?\",\"back\":\"Entrenamiento ajusta los parámetros, validación sirve para elegir hiperparámetros y parar a tiempo, y test mide el rendimiento final sin influir en ninguna decisión.\\n\\n• Si usas el test para elegir hiperparámetros, la métrica final sale optimista.\\n• Con datos temporales, divide por fecha: el pasado entrena y el futuro evalúa.\\n• Con pocos datos, la validación cruzada (k-fold) reutiliza los datos para validar.\\n\\nPista de examen: «usaron el test set para ajustar el modelo» = estimación sesgada; la respuesta suele ser separar un test intocable.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"validacion\"]},{\"id\":\"m1-03\",\"part\":\"m\",\"front\":\"Desde la época 8, la pérdida de entrenamiento sigue bajando pero la de validación empieza a subir. ¿Qué está pasando y qué palancas aplicas?\",\"back\":\"Es sobreajuste: el modelo empieza a memorizar el ruido del entrenamiento y deja de generalizar.\\n\\n• Para a tiempo: early stopping sobre la pérdida de validación (y quédate con los mejores pesos).\\n• Regulariza: L1/L2, dropout en redes, menos profundidad o más poda en árboles.\\n• Simplifica el modelo o consigue más datos (o aumentación en imágenes).\\n• Valida mejor: validación cruzada si hay pocos datos.\\n\\nPista de examen: «train baja, validación sube» → sobreajuste; «las dos altas y planas» → subajuste (modelo demasiado simple).\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"overfitting\"]},{\"id\":\"m1-13\",\"part\":\"m\",\"front\":\"Modelo A: error de entrenamiento 2 % y de validación 15 %. Modelo B: 14 % y 15 %. ¿Qué le pasa a cada uno y qué harías?\",\"back\":\"A tiene alta varianza (sobreajusta) y B tiene alto sesgo (subajusta): a A lo regularizas o le das más datos, a B le das más capacidad o mejores features.\\n\\n• Gran hueco entre entrenamiento y validación → varianza: regularización, early stopping, más datos, modelo más simple.\\n• Los dos errores altos y parecidos → sesgo: modelo más expresivo, más features, menos regularización, entrenar más.\\n• Más datos ayudan sobre todo al problema de varianza, poco al de sesgo.\\n\\nPista de examen: compara siempre entrenamiento vs validación antes de elegir la acción.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"diagnostico\"]},{\"id\":\"m1-04\",\"part\":\"m\",\"front\":\"Tu clasificador de fraude da 99 % de accuracy con 1 % de fraudes en los datos. ¿Por qué esa métrica engaña y cuáles usas?\",\"back\":\"Con 1 % de positivos, predecir siempre «no fraude» ya da 99 % de accuracy: con clases desbalanceadas mira recall, precision, F1 y la matriz de confusión.\\n\\n• Recall: qué fracción de los fraudes reales detectas (importa si un falso negativo es caro).\\n• Precision: qué fracción de tus alertas es fraude de verdad (importa si una falsa alarma es cara).\\n• F1: equilibrio entre ambas.\\n• Curvas: ROC AUC resume el ranking; con desbalanceo fuerte, la curva precision-recall es más informativa.\\n\\nPista de examen: «clase rara + coste alto de no detectarla» → recall; «el equipo de revisión no da abasto» → precision.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"metricas\"]},{\"id\":\"m1-12\",\"part\":\"m\",\"front\":\"Tu modelo de bajas da AUC 0,99 en validación y 0,62 en producción. Entre las features está «fecha_de_cancelación». ¿Qué pasó?\",\"back\":\"Es fuga de datos (data leakage): una feature contiene información que solo existe después del hecho que quieres predecir.\\n\\n• «fecha_de_cancelación» solo existe si el cliente ya se dio de baja: en producción no está disponible.\\n• Señal típica: métricas de validación casi perfectas que se desploman en producción.\\n• Otras fugas: estadísticas calculadas con todo el dataset antes de dividir, duplicados entre train y test, o split aleatorio en datos temporales.\\n• Regla: cada feature debe poder calcularse con la información disponible en el instante de la predicción.\\n\\nPista de examen: «resultado demasiado bueno para ser verdad» → busca leakage antes de celebrar.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"leakage\"]},{\"id\":\"m1-05\",\"part\":\"m\",\"front\":\"En diciembre tus clientes compran distinto (cambian las entradas); en otro caso, una nueva ley cambia qué compras son fraude (cambia la relación). ¿Cómo se llama cada fenómeno y cómo se detecta?\",\"back\":\"El primero es data drift (cambia la distribución de las entradas) y el segundo concept drift (cambia la relación entre entradas y etiqueta).\\n\\n• Data drift: se detecta comparando las features de producción con una línea base (entrenamiento o semanas anteriores), sin necesidad de etiquetas.\\n• Concept drift: se detecta cuando llegan las etiquetas reales y el rendimiento cae, aunque las entradas parezcan iguales.\\n• Training-serving skew: las features de serving difieren de las de entrenamiento desde el primer día (a menudo por un preprocesamiento distinto).\\n\\nPista de examen: «las entradas se ven iguales pero la precisión cae» → concept drift; la respuesta suele ser reentrenar con datos recientes.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"drift\"]},{\"id\":\"m1-06\",\"part\":\"m\",\"front\":\"Solo tienes 2.000 ejemplos etiquetados y una única partición de validación te da resultados muy distintos según la semilla. ¿Qué técnica estabiliza la estimación y cuándo no sirve?\",\"back\":\"La validación cruzada k-fold: divides los datos en K partes, entrenas K veces validando cada vez en una distinta y promedias las métricas.\\n\\n• Usa todos los datos para validar y reduce la varianza de la estimación con datasets pequeños.\\n• Cuesta K entrenamientos: con datasets grandes, una partición fija suele bastar.\\n• En series temporales no mezcles el futuro en el entrenamiento: usa particiones que avancen en el tiempo.\\n• BigQuery ML no ofrece k-fold: divide con DATA_SPLIT_METHOD; el k-fold se hace en código propio (por ejemplo scikit-learn).\\n\\nPista de examen: «pocos datos + estimación inestable» → k-fold.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"validacion\"]},{\"id\":\"m1-07\",\"part\":\"m\",\"front\":\"Para datos tabulares con columnas mixtas, ¿por qué un ensemble de árboles (random forest o boosting) suele superar a un único árbol de decisión?\",\"back\":\"Porque combina muchos árboles: el bagging (random forest) reduce la varianza y el boosting reduce el sesgo encadenando árboles que corrigen al anterior.\\n\\n• Los árboles no necesitan escalar ni normalizar las features.\\n• El boosting puede sobreajustar: se controla con learning rate, profundidad máxima, submuestreo y early stopping.\\n• En BigQuery ML: BOOSTED_TREE_CLASSIFIER/REGRESSOR (XGBoost; BOOSTER_TYPE = 'GBTREE' por defecto o 'DART') y RANDOM_FOREST_CLASSIFIER/REGRESSOR.\\n\\nPista de examen: «datos tabulares, buena precisión sin mucho preprocesado» → árboles con boosting.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"arboles\"]},{\"id\":\"m1-08\",\"part\":\"m\",\"front\":\"Quieres encontrar tickets de soporte «parecidos en significado» aunque no compartan palabras. ¿Qué representación necesitas y cómo la generas en BigQuery?\",\"back\":\"Necesitas embeddings: vectores densos donde la cercanía entre vectores refleja similitud semántica.\\n\\n• Sirven para búsqueda semántica, recomendación, clustering, deduplicación y RAG.\\n• En BigQuery: AI.EMBED genera un embedding por valor; AI.GENERATE_EMBEDDING (o ML.GENERATE_EMBEDDING) genera una columna de embeddings para toda una tabla.\\n• Después, VECTOR_SEARCH busca los vecinos más cercanos (con CREATE VECTOR INDEX para acelerar a cambio de resultados aproximados).\\n• La búsqueda por palabras clave no encuentra sinónimos ni paráfrasis.\\n\\nPista de examen: «similar en significado, no en palabras» → embeddings + búsqueda vectorial.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"embeddings\"]},{\"id\":\"m1-09\",\"part\":\"m\",\"front\":\"Un banco debe explicar cada decisión de crédito y además entender qué variables mueven el modelo en general. ¿Qué distingue una explicación local de una global y qué herramientas de GCP las dan?\",\"back\":\"Una explicación local atribuye UNA predicción a sus features; una global resume la influencia de cada feature en todo el modelo.\\n\\n• Base común: atribuciones tipo Shapley (cuánto empuja cada feature respecto a una línea base).\\n• BigQuery ML: ML.EXPLAIN_PREDICT (local) y ML.GLOBAL_EXPLAIN (global, requiere ENABLE_GLOBAL_EXPLAIN = TRUE).\\n• Agent Platform (antes Vertex AI) Explainable AI: atribuciones con sampled Shapley (tabular, modelos no diferenciables), integrated gradients (redes diferenciables) y XRAI (imágenes); también explicaciones basadas en ejemplos.\\n• Explicar no es lo mismo que demostrar causalidad.\\n\\nPista de examen: «por qué se rechazó a ESTE cliente» → local; «qué variables importan en el modelo» → global.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"explicabilidad\"]},{\"id\":\"m1-14\",\"part\":\"m\",\"front\":\"Predices la demanda diaria de una tienda. Con un split aleatorio el error de validación es excelente, pero el modelo falla desde el primer mes en producción. Usaste como feature «ventas_media_7_días» centrada en el día. ¿Qué dos errores hay y cómo los corriges?\",\"back\":\"Hay dos fugas del futuro: el split aleatorio mezcla días futuros en el entrenamiento y la media centrada usa ventas posteriores al día que predices.\\n\\n• Divide por tiempo: entrena con el pasado y valida con el periodo siguiente (en BigQuery ML, DATA_SPLIT_METHOD = 'SEQ' con la fecha en DATA_SPLIT_COL).\\n• Calcula las ventanas solo hacia atrás: media de los 7 días ANTERIORES (por ejemplo AVG(...) OVER (ORDER BY fecha ROWS BETWEEN 7 PRECEDING AND 1 PRECEDING)).\\n• Comprueba que cada feature existe en el momento de predecir.\\n• Espera que el error honesto sea peor que el del split aleatorio: es la cifra real.\\n\\nPista de examen: datos temporales → validación temporal y features con ventanas solo hacia atrás.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"ml\",\"leakage\",\"series-temporales\"]},{\"id\":\"m1-15\",\"part\":\"m\",\"front\":\"Con 0,5 % de fraude, el equipo celebra un ROC AUC de 0,97, pero el área de revisión solo puede investigar 200 alertas al día. ¿Qué métrica decide si el modelo sirve y por qué el AUC no basta?\",\"back\":\"Decide la precision en las 200 alertas de mayor puntuación (precision@k) junto con el recall que logras con ellas, porque esa es la capacidad real de revisión.\\n\\n• Con negativos abrumadores, la tasa de falsos positivos de la curva ROC parece pequeña aunque las falsas alarmas sean miles.\\n• La curva precision-recall (y su área) refleja mejor el rendimiento sobre la clase rara.\\n• Fija el umbral en el punto que da unas 200 alertas diarias y mide cuántos fraudes reales contienen.\\n• Reporta también el coste: fraudes no detectados frente a horas de revisión.\\n\\nPista de examen: «capacidad de revisión limitada» → métrica en el top-k, no AUC global ni accuracy.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"ml\",\"metricas\",\"desbalanceo\"]}],\"cardsEn\":[{\"id\":\"m1-01\",\"part\":\"m\",\"front\":\"A supervised model «learns» from historical data. What exactly does training adjust, and what must evaluation prove?\",\"back\":\"Training fits a function's parameters by minimizing a loss over labeled data; evaluation must prove the model generalizes to data it never saw.\\n\\n• Label (target): what you want to predict. Features: the signals available at prediction time.\\n• Parameters (weights, tree split points): learned by the algorithm.\\n• Hyperparameters (learning rate, depth, regularization): chosen by you before training.\\n• A good score on the training data only proves the model remembers it, not that it generalizes.\\n\\nExam cue: if the stem says «works in the notebook but fails in production», think generalization, data leakage or skew.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"fundamentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-11\",\"part\":\"m\",\"front\":\"Three requests: decide whether an email is spam, estimate a house price, and group customers for whom you have no labels at all. What type of problem is each one?\",\"back\":\"Spam is classification, the price is regression, and grouping without labels is clustering (unsupervised learning).\\n\\n• Classification: the output is a category (binary or multiclass).\\n• Regression: the output is a continuous number.\\n• Clustering: there is no label; the algorithm groups by similarity (for example k-means).\\n• Other common types: time series (forecast future values), recommendation (user–item) and anomaly detection.\\n\\nExam cue: identify the shape of the output first; that rules out half of the options.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"fundamentos\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-02\",\"part\":\"m\",\"front\":\"You have a dataset and must train, choose hyperparameters and report final performance. What role does each set play: training, validation and test?\",\"back\":\"Training fits the parameters, validation is for choosing hyperparameters and stopping in time, and test measures final performance without influencing any decision.\\n\\n• If you use the test set to choose hyperparameters, the final metric is optimistic.\\n• With time-ordered data, split by date: the past trains and the future evaluates.\\n• With little data, cross-validation (k-fold) reuses the data for validation.\\n\\nExam cue: «they used the test set to tune the model» = biased estimate; the answer is usually to keep an untouched test set.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"ml\",\"validacion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-03\",\"part\":\"m\",\"front\":\"From epoch 8 on, training loss keeps falling but validation loss starts to rise. What is happening, and which levers do you pull?\",\"back\":\"It is overfitting: the model starts memorizing the training noise and stops generalizing.\\n\\n• Stop in time: early stopping on validation loss (and keep the best weights).\\n• Regularize: L1/L2, dropout in networks, shallower or more pruned trees.\\n• Simplify the model or get more data (or augmentation for images).\\n• Validate better: cross-validation when data is scarce.\\n\\nExam cue: «train falls, validation rises» → overfitting; «both high and flat» → underfitting (model too simple).\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"overfitting\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-13\",\"part\":\"m\",\"front\":\"Model A: training error 2% and validation error 15%. Model B: 14% and 15%. What is wrong with each, and what would you do?\",\"back\":\"A has high variance (it overfits) and B has high bias (it underfits): regularize A or give it more data; give B more capacity or better features.\\n\\n• A large gap between training and validation → variance: regularization, early stopping, more data, a simpler model.\\n• Both errors high and similar → bias: a more expressive model, more features, less regularization, train longer.\\n• More data mainly helps the variance problem, little the bias one.\\n\\nExam cue: always compare training vs validation before choosing the action.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"diagnostico\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-04\",\"part\":\"m\",\"front\":\"Your fraud classifier scores 99% accuracy with 1% fraud in the data. Why is that metric misleading, and which ones do you use?\",\"back\":\"With 1% positives, always predicting «not fraud» already gives 99% accuracy: with imbalanced classes look at recall, precision, F1 and the confusion matrix.\\n\\n• Recall: the fraction of real frauds you catch (matters when a false negative is expensive).\\n• Precision: the fraction of your alerts that are real fraud (matters when a false alarm is expensive).\\n• F1: the balance between both.\\n• Curves: ROC AUC summarizes ranking; under heavy imbalance the precision-recall curve is more informative.\\n\\nExam cue: «rare class + missing it is costly» → recall; «the review team is overwhelmed» → precision.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"metricas\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-12\",\"part\":\"m\",\"front\":\"Your churn model scores 0.99 AUC in validation and 0.62 in production. One of the features is «cancellation_date». What happened?\",\"back\":\"It is data leakage: a feature contains information that only exists after the event you want to predict.\\n\\n• «cancellation_date» only exists if the customer already churned: it is not available in production.\\n• Typical signal: near-perfect validation metrics that collapse in production.\\n• Other leaks: statistics computed on the full dataset before splitting, duplicates across train and test, or a random split on time-ordered data.\\n• Rule: every feature must be computable from the information available at prediction time.\\n\\nExam cue: «too good to be true» → look for leakage before celebrating.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"leakage\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-05\",\"part\":\"m\",\"front\":\"In December your customers buy differently (the inputs change); in another case, a new law changes which purchases count as fraud (the relationship changes). What is each phenomenon called and how is it detected?\",\"back\":\"The first is data drift (the input distribution changes) and the second is concept drift (the relationship between inputs and label changes).\\n\\n• Data drift: detected by comparing production features with a baseline (training or previous weeks), with no labels needed.\\n• Concept drift: detected when the real labels arrive and performance drops, even if the inputs look the same.\\n• Training-serving skew: serving features differ from training features from day one (often due to different preprocessing).\\n\\nExam cue: «inputs look the same but accuracy drops» → concept drift; the answer is usually retraining on recent data.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"drift\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-06\",\"part\":\"m\",\"front\":\"You only have 2,000 labeled examples, and a single validation split gives very different results depending on the seed. Which technique stabilizes the estimate, and when does it not apply?\",\"back\":\"K-fold cross-validation: split the data into K parts, train K times validating on a different part each time, and average the metrics.\\n\\n• It uses all the data for validation and reduces the variance of the estimate on small datasets.\\n• It costs K trainings: with large datasets a single fixed split is usually enough.\\n• For time series do not mix the future into training: use splits that move forward in time.\\n• BigQuery ML has no k-fold: it splits with DATA_SPLIT_METHOD; k-fold is done in your own code (for example scikit-learn).\\n\\nExam cue: «little data + unstable estimate» → k-fold.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"validacion\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-07\",\"part\":\"m\",\"front\":\"For tabular data with mixed columns, why does a tree ensemble (random forest or boosting) usually beat a single decision tree?\",\"back\":\"Because it combines many trees: bagging (random forest) reduces variance by averaging independent trees, and boosting reduces bias by chaining trees that fix the previous one's errors.\\n\\n• Trees need no feature scaling or normalization.\\n• Boosting can overfit: control it with learning rate, max depth, subsampling and early stopping.\\n• In BigQuery ML: BOOSTED_TREE_CLASSIFIER/REGRESSOR (XGBoost; BOOSTER_TYPE = 'GBTREE' by default or 'DART') and RANDOM_FOREST_CLASSIFIER/REGRESSOR.\\n\\nExam cue: «tabular data, good accuracy without much preprocessing» → boosted trees.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"arboles\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-08\",\"part\":\"m\",\"front\":\"You want to find support tickets that are «similar in meaning» even when they share no words. Which representation do you need, and how do you generate it in BigQuery?\",\"back\":\"You need embeddings: dense vectors where closeness between vectors reflects semantic similarity.\\n\\n• They power semantic search, recommendation, clustering, deduplication and RAG.\\n• In BigQuery: AI.EMBED creates one embedding per value; AI.GENERATE_EMBEDDING (or ML.GENERATE_EMBEDDING) creates an embedding column for a whole table.\\n• Then VECTOR_SEARCH finds the nearest neighbors (with CREATE VECTOR INDEX to speed it up at the cost of approximate results).\\n• Keyword search does not find synonyms or paraphrases.\\n\\nExam cue: «similar in meaning, not in words» → embeddings + vector search.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"embeddings\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-09\",\"part\":\"m\",\"front\":\"A bank must explain every credit decision and also understand which variables drive the model overall. What separates a local from a global explanation, and which GCP tools provide them?\",\"back\":\"A local explanation attributes ONE prediction to its features; a global one summarizes each feature's influence over the whole model.\\n\\n• Common basis: Shapley-style attributions (how much each feature pushes relative to a baseline).\\n• BigQuery ML: ML.EXPLAIN_PREDICT (local) and ML.GLOBAL_EXPLAIN (global, needs ENABLE_GLOBAL_EXPLAIN = TRUE).\\n• Agent Platform (formerly Vertex AI) Explainable AI: attributions with sampled Shapley (tabular, non-differentiable models), integrated gradients (differentiable networks) and XRAI (images); also example-based explanations.\\n• Explaining is not the same as proving causality.\\n\\nExam cue: «why was THIS customer rejected» → local; «which variables matter in the model» → global.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"ml\",\"explicabilidad\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-14\",\"part\":\"m\",\"front\":\"You forecast a store's daily demand. With a random split the validation error is excellent, but the model fails from its first month in production. You used «sales_avg_7_days» centered on the day as a feature. What two mistakes are there, and how do you fix them?\",\"back\":\"There are two leaks from the future: the random split mixes future days into training, and the centered average uses sales after the day you predict.\\n\\n• Split by time: train on the past and validate on the following period (in BigQuery ML, DATA_SPLIT_METHOD = 'SEQ' with the date in DATA_SPLIT_COL).\\n• Compute windows backwards only: the average of the PREVIOUS 7 days (for example AVG(...) OVER (ORDER BY date ROWS BETWEEN 7 PRECEDING AND 1 PRECEDING)).\\n• Check that every feature exists at prediction time.\\n• Expect the honest error to be worse than the random-split one: it is the real figure.\\n\\nExam cue: time-ordered data → temporal validation and backward-only window features.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"ml\",\"leakage\",\"series-temporales\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"},{\"id\":\"m1-15\",\"part\":\"m\",\"front\":\"With 0.5% fraud, the team celebrates a 0.97 ROC AUC, but the review team can only investigate 200 alerts per day. Which metric decides whether the model is useful, and why is AUC not enough?\",\"back\":\"Precision on the 200 highest-scored alerts (precision@k), together with the recall they achieve, decides it, because that is the real review capacity.\\n\\n• With overwhelming negatives, the ROC curve's false positive rate looks tiny even when false alarms number in the thousands.\\n• The precision-recall curve (and its area) better reflects performance on the rare class.\\n• Set the threshold at the point that yields about 200 daily alerts and measure how many real frauds they contain.\\n• Report the cost too: missed frauds versus review hours.\\n\\nExam cue: «limited review capacity» → a top-k metric, not global AUC or accuracy.\",\"topic\":\"Machine Learning\",\"origin\":\"ai\",\"difficulty\":\"advanced\",\"tags\":[\"ml\",\"metricas\",\"desbalanceo\"],\"lang\":\"en\",\"esDeck\":\"gcp-ml-course\"}]},{\"id\":\"s1-practica\",\"kind\":\"practice\",\"minutes\":15,\"title\":{\"es\":\"Práctica: elegir el umbral por precision y recall\",\"en\":\"Practice: choose the threshold by precision and recall\"},\"scaffolding\":\"medium\",\"instructions\":{\"es\":\"Tienes las etiquetas reales (y_true) y las puntuaciones de un modelo de fraude (score). Completa la función para calcular precision y recall en los umbrales 0.3, 0.5 y 0.7, y devuelve el umbral con mayor recall entre los que mantienen precision ≥ 0.5. No uses accuracy para decidir.\",\"en\":\"You have the true labels (y_true) and a fraud model's scores (score). Complete the function to compute precision and recall at thresholds 0.3, 0.5 and 0.7, and return the threshold with the highest recall among those that keep precision ≥ 0.5. Do not use accuracy to decide.\"},\"starter\":\"import numpy as np\\n\\ndef elegir_umbral(y_true, score, umbrales=(0.3, 0.5, 0.7), min_precision=0.5):\\n    y_true = np.asarray(y_true)\\n    score = np.asarray(score)\\n    candidatos = []\\n    for u in umbrales:\\n        pred = score \u003e= u\\n        tp = ...  # verdaderos positivos\\n        fp = ...  # falsos positivos\\n        fn = ...  # falsos negativos\\n        precision = ...\\n        recall = ...\\n        print(u, round(precision, 3), round(recall, 3))\\n        # TODO: guarda los umbrales que cumplen min_precision\\n    # TODO: devuelve el de mayor recall (o None)\\n\",\"hints\":[{\"es\":\"tp es la suma de pred \u0026 (y_true == 1); fp, la de pred \u0026 (y_true == 0); fn, la de ~pred \u0026 (y_true == 1).\",\"en\":\"tp is the sum of pred \u0026 (y_true == 1); fp, of pred \u0026 (y_true == 0); fn, of ~pred \u0026 (y_true == 1).\"},{\"es\":\"Protege las divisiones: si tp + fp es 0, la precision no está definida; trátala como 0.\",\"en\":\"Guard the divisions: if tp + fp is 0, precision is undefined; treat it as 0.\"}],\"solution\":\"import numpy as np\\n\\ndef elegir_umbral(y_true, score, umbrales=(0.3, 0.5, 0.7), min_precision=0.5):\\n    y_true = np.asarray(y_true)\\n    score = np.asarray(score)\\n    candidatos = []\\n    for u in umbrales:\\n        pred = score \u003e= u\\n        tp = int(np.sum(pred \u0026 (y_true == 1)))\\n        fp = int(np.sum(pred \u0026 (y_true == 0)))\\n        fn = int(np.sum(~pred \u0026 (y_true == 1)))\\n        precision = tp / (tp + fp) if tp + fp else 0.0\\n        recall = tp / (tp + fn) if tp + fn else 0.0\\n        print(u, round(precision, 3), round(recall, 3))\\n        if precision \u003e= min_precision:\\n            candidatos.append((recall, u))\\n    return max(candidatos)[1] if candidatos else None\\n\",\"language\":\"python\",\"criteria\":[{\"es\":\"Para cada umbral imprime precision = tp/(tp+fp) y recall = tp/(tp+fn), comprobables a mano con una matriz de confusión pequeña.\",\"en\":\"For each threshold it prints precision = tp/(tp+fp) and recall = tp/(tp+fn), checkable by hand with a small confusion matrix.\"},{\"es\":\"Con y_true = [1,1,0,0,1] y score = [0.9,0.4,0.6,0.2,0.35] devuelve 0.3 (recall 1.0 con precision 0.75).\",\"en\":\"With y_true = [1,1,0,0,1] and score = [0.9,0.4,0.6,0.2,0.35] it returns 0.3 (recall 1.0 with precision 0.75).\"},{\"es\":\"Si ningún umbral alcanza la precision mínima devuelve None, sin dividir por cero.\",\"en\":\"If no threshold reaches the minimum precision it returns None, with no division by zero.\"}]},{\"id\":\"s1-escenarios\",\"kind\":\"scenarios\",\"minutes\":8,\"title\":{\"es\":\"Escenarios: métrica y validación\",\"en\":\"Scenarios: metric and validation\"},\"items\":[{\"id\":\"s1-q1\",\"type\":\"metric_selection\",\"difficulty\":\"basic\",\"tags\":[\"metricas\",\"producto\"],\"prompt\":{\"es\":\"Un filtro antispam mueve correos a la carpeta de spam. Los usuarios se quejan de que pierden correos importantes del banco y de su jefe, y el equipo solo puede tocar el umbral esta semana. ¿Qué métrica debe guiar el cambio?\",\"en\":\"A spam filter moves emails to the spam folder. Users complain they lose important emails from their bank and their boss, and the team can only adjust the threshold this week. Which metric should guide the change?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Recall de la clase spam\",\"en\":\"Recall of the spam class\"},\"correct\":false,\"why\":{\"es\":\"Asume que el problema es el spam que se escapa; la queja es por correos buenos marcados como spam.\",\"en\":\"Assumes the problem is spam getting through; the complaint is about good emails flagged as spam.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Accuracy global\",\"en\":\"Overall accuracy\"},\"correct\":false,\"why\":{\"es\":\"Asume que una cifra global refleja el error caro; con mucho correo legítimo, la accuracy apenas se mueve.\",\"en\":\"Assumes one global number reflects the costly error; with lots of legitimate mail, accuracy barely moves.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Precision de la clase spam: subir el umbral hasta que casi todo lo marcado sea spam de verdad\",\"en\":\"Precision of the spam class: raise the threshold until almost everything flagged is truly spam\"},\"correct\":true,\"why\":{\"es\":\"Gana porque el coste está en los falsos positivos (correos buenos en spam), y la precision mide justo esa fracción.\",\"en\":\"Wins because the cost is in false positives (good emails in spam), and precision measures exactly that fraction.\"}},{\"id\":\"D\",\"text\":{\"es\":\"ROC AUC\",\"en\":\"ROC AUC\"},\"correct\":false,\"why\":{\"es\":\"Asume que el ranking global decide; el AUC no cambia al mover el umbral y no dice cuántos correos buenos se pierden.\",\"en\":\"Assumes global ranking decides; AUC does not change when you move the threshold and says nothing about lost good emails.\"}}],\"takeaway\":{\"es\":\"Elige la métrica por el error que más cuesta: falsos positivos caros → precision.\",\"en\":\"Pick the metric by the costliest error: expensive false positives → precision.\"}},{\"id\":\"s1-q2\",\"type\":\"bug_diagnosis\",\"difficulty\":\"intermediate\",\"tags\":[\"validacion\",\"leakage\"],\"prompt\":{\"es\":\"Tu dataset de bajas tiene una fila por cliente y mes (24 filas por cliente). Con split aleatorio por fila el AUC es 0,93; con clientes que nunca vio cae a 0,77. El modelo debe usarse con clientes nuevos. ¿Qué cambias?\",\"en\":\"Your churn dataset has one row per customer per month (24 rows per customer). With a random row-level split the AUC is 0.93; on customers it never saw it drops to 0.77. The model must be used on new customers. What do you change?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Dividir por cliente (cada cliente entero en entrenamiento o en validación) con un hash estable de su id\",\"en\":\"Split by customer (each whole customer in training or validation) with a stable hash of their id\"},\"correct\":true,\"why\":{\"es\":\"Gana porque elimina que el modelo reconozca a clientes vistos; la validación se parece a producción.\",\"en\":\"Wins because it stops the model from recognizing seen customers; validation now looks like production.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Aumentar las épocas hasta que el AUC de clientes nuevos suba\",\"en\":\"Train more epochs until the new-customer AUC rises\"},\"correct\":false,\"why\":{\"es\":\"Asume que es falta de entrenamiento; más épocas aumentan la memorización del cliente.\",\"en\":\"Assumes undertraining; more epochs increase memorization of customers.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Quitar la regularización para que el modelo capte más detalle\",\"en\":\"Remove regularization so the model captures more detail\"},\"correct\":false,\"why\":{\"es\":\"Asume sesgo alto; el síntoma es de varianza por fuga entre particiones.\",\"en\":\"Assumes high bias; the symptom is variance from leakage across splits.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Usar accuracy en lugar de AUC\",\"en\":\"Use accuracy instead of AUC\"},\"correct\":false,\"why\":{\"es\":\"Cambia la métrica pero no la división que está filtrando información.\",\"en\":\"Changes the metric but not the split that is leaking information.\"}}],\"takeaway\":{\"es\":\"Filas correlacionadas (mismo cliente, paciente o dispositivo) → split por grupo.\",\"en\":\"Correlated rows (same customer, patient or device) → group split.\"}}],\"questions\":[{\"key\":\"s1-q1\",\"prompt\":\"$6:props:flow:stages:0:steps:3:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:3:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:3:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:3:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:3:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:3:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:3:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:3:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:3:items:0:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:0:steps:3:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"metric_selection\"},{\"key\":\"s1-q2\",\"prompt\":\"$6:props:flow:stages:0:steps:3:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:3:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:3:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:3:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:3:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:3:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:3:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:3:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:3:items:1:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:0:steps:3:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s1-lab\",\"kind\":\"lab\",\"minutes\":10,\"title\":{\"es\":\"Laboratorio: el AUC perfecto que se desploma\",\"en\":\"Lab: the perfect AUC that collapses\"},\"symptom\":{\"es\":\"Validación: AUC 0,995 y precision 0,98. Primera semana en producción: AUC 0,61 y casi todos los clientes reciben la misma probabilidad baja. No hubo cambios de esquema ni errores en los logs.\",\"en\":\"Validation: AUC 0.995 and precision 0.98. First week in production: AUC 0.61 and almost every customer gets the same low probability. No schema changes and no errors in the logs.\"},\"artifact\":\"CREATE OR REPLACE TABLE ml.churn_train AS\\nSELECT\\n  c.cliente_id,\\n  c.antiguedad_meses,\\n  c.plan,\\n  c.cargos_mes,\\n  t.num_tickets_90d,\\n  c.motivo_baja,                      -- el CRM la rellena al tramitar la baja\\n  c.fecha_baja IS NOT NULL AS churn\\nFROM crm.clientes AS c\\nJOIN soporte.tickets_agg AS t USING (cliente_id);\",\"language\":\"sql\",\"question\":{\"es\":\"¿Cuál es la causa raíz?\",\"en\":\"What is the root cause?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"El modelo es demasiado simple y subajusta\",\"en\":\"The model is too simple and underfits\"},\"correct\":false,\"why\":{\"es\":\"Un modelo que subajusta no logra AUC 0,995 en validación.\",\"en\":\"An underfitting model does not reach 0.995 AUC in validation.\"}},{\"id\":\"B\",\"text\":{\"es\":\"motivo_baja solo existe cuando el cliente ya se dio de baja: es una fuga de la etiqueta\",\"en\":\"motivo_baja only exists once the customer has churned: it leaks the label\"},\"correct\":true,\"why\":{\"es\":\"Gana: en entrenamiento delata la respuesta y en producción siempre llega vacía, por eso todos reciben la misma probabilidad.\",\"en\":\"Wins: in training it gives the answer away and in production it always arrives empty, which is why everyone gets the same probability.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Data drift en num_tickets_90d desde el despliegue\",\"en\":\"Data drift in num_tickets_90d since deployment\"},\"correct\":false,\"why\":{\"es\":\"El drift no explica una validación casi perfecta ni el colapso en la primera semana.\",\"en\":\"Drift does not explain near-perfect validation or the collapse in week one.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Faltan épocas de entrenamiento\",\"en\":\"Not enough training epochs\"},\"correct\":false,\"why\":{\"es\":\"Más entrenamiento aprendería aún mejor la fuga.\",\"en\":\"More training would learn the leak even better.\"}}],\"rootCause\":{\"es\":\"Fuga de la etiqueta: motivo_baja solo se conoce después de la baja, así que el modelo aprendió a leer la respuesta. En producción esa columna llega vacía y el modelo pierde su única señal fuerte.\",\"en\":\"Label leakage: motivo_baja is only known after churn, so the model learned to read the answer. In production that column arrives empty and the model loses its only strong signal.\"},\"fix\":\"CREATE OR REPLACE TABLE ml.churn_train AS\\nSELECT\\n  c.cliente_id,\\n  c.antiguedad_meses,\\n  c.plan,\\n  c.cargos_mes,\\n  t.num_tickets_90d,\\n  c.fecha_baja IS NOT NULL AS churn   -- motivo_baja eliminado\\nFROM crm.clientes AS c\\nJOIN soporte.tickets_agg AS t USING (cliente_id);\",\"fixNote\":{\"es\":\"Regla: cada feature debe poder calcularse en el instante de la predicción. Revisa también agregados como num_tickets_90d: deben cortarse antes de la fecha de referencia.\",\"en\":\"Rule: every feature must be computable at prediction time. Also check aggregates such as num_tickets_90d: they must stop before the reference date.\"},\"questions\":[{\"key\":\"s1-lab::diagnosis\",\"prompt\":\"$6:props:flow:stages:0:steps:4:question\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:4:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:4:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:4:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:4:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:4:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:4:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:4:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:4:options:3:why\"}],\"correct\":\"B\",\"type\":\"bug_diagnosis\"}]},{\"id\":\"s1-checkpoint\",\"kind\":\"checkpoint\",\"minutes\":12,\"title\":{\"es\":\"Checkpoint: fundamentos\",\"en\":\"Checkpoint: fundamentals\"},\"items\":[{\"id\":\"s1-c1\",\"type\":\"concept\",\"difficulty\":\"basic\",\"tags\":[\"fundamentos\",\"tipos-de-problema\"],\"prompt\":{\"es\":\"Una aerolínea quiere estimar cuántos minutos de retraso tendrá cada vuelo, con 2 años de histórico etiquetado y un equipo que debe entregar un primer modelo en una semana. ¿Qué tipo de problema plantea?\",\"en\":\"An airline wants to estimate how many minutes each flight will be delayed, with 2 years of labeled history and a team that must ship a first model in a week. What type of problem is it?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Clasificación binaria\",\"en\":\"Binary classification\"},\"correct\":false,\"why\":{\"es\":\"Supone que la salida es sí/no; aquí se pide una cantidad de minutos.\",\"en\":\"Assumes a yes/no output; here a number of minutes is requested.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Regresión supervisada\",\"en\":\"Supervised regression\"},\"correct\":true,\"why\":{\"es\":\"Gana: la salida es un número continuo y hay etiquetas históricas.\",\"en\":\"Wins: the output is a continuous number and there are historical labels.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Clustering\",\"en\":\"Clustering\"},\"correct\":false,\"why\":{\"es\":\"Supone que no hay etiqueta; el histórico sí trae el retraso real.\",\"en\":\"Assumes no label; the history does contain the real delay.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Aprendizaje por refuerzo\",\"en\":\"Reinforcement learning\"},\"correct\":false,\"why\":{\"es\":\"Supone un agente que actúa y recibe recompensas; aquí solo se predice.\",\"en\":\"Assumes an agent acting for rewards; here we only predict.\"}}],\"takeaway\":{\"es\":\"Mira la forma de la salida: número continuo → regresión.\",\"en\":\"Look at the output shape: continuous number → regression.\"}},{\"id\":\"s1-c2\",\"type\":\"bug_diagnosis\",\"difficulty\":\"intermediate\",\"tags\":[\"fundamentos\",\"overfitting\"],\"prompt\":{\"es\":\"Tu red llega a 2 % de error en entrenamiento y 15 % en validación; añadir épocas baja el primero y sube el segundo. Tienes presupuesto para un solo cambio antes de la demo. ¿Cuál eliges?\",\"en\":\"Your network reaches 2% training error and 15% validation error; adding epochs lowers the first and raises the second. You can afford one change before the demo. Which one?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Un modelo más grande\",\"en\":\"A bigger model\"},\"correct\":false,\"why\":{\"es\":\"Supone sesgo alto; más capacidad agrava la varianza.\",\"en\":\"Assumes high bias; more capacity worsens variance.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Más épocas\",\"en\":\"More epochs\"},\"correct\":false,\"why\":{\"es\":\"Supone falta de entrenamiento; el síntoma es justo lo contrario.\",\"en\":\"Assumes undertraining; the symptom is the opposite.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Quitar el conjunto de validación y entrenar con todo\",\"en\":\"Drop the validation set and train on everything\"},\"correct\":false,\"why\":{\"es\":\"Elimina la señal que permite detectar el problema.\",\"en\":\"Removes the signal that lets you detect the problem.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Early stopping sobre la pérdida de validación (con regularización si hace falta)\",\"en\":\"Early stopping on validation loss (with regularization if needed)\"},\"correct\":true,\"why\":{\"es\":\"Gana: corta cuando la validación empeora y ataca la varianza.\",\"en\":\"Wins: it stops when validation worsens and tackles variance.\"}}],\"takeaway\":{\"es\":\"Hueco grande entre entrenamiento y validación = varianza: regulariza o para antes.\",\"en\":\"Big train–validation gap = variance: regularize or stop earlier.\"}},{\"id\":\"s1-c3\",\"type\":\"architecture_tradeoff\",\"difficulty\":\"intermediate\",\"tags\":[\"validacion\",\"series-temporales\"],\"prompt\":{\"es\":\"Prevés ventas diarias con 3 años de histórico; el modelo se reentrena cada mes y siempre predice el mes siguiente. Quieres una estimación honesta del error antes de desplegar. ¿Cómo validas?\",\"en\":\"You forecast daily sales with 3 years of history; the model retrains monthly and always predicts the next month. You want an honest error estimate before deploying. How do you validate?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Entrenar con el pasado y validar con el periodo inmediatamente posterior, repitiéndolo hacia delante en el tiempo\",\"en\":\"Train on the past and validate on the period right after, repeating it forward in time\"},\"correct\":true,\"why\":{\"es\":\"Gana: reproduce cómo se usará el modelo y no filtra el futuro.\",\"en\":\"Wins: it mirrors how the model will be used and does not leak the future.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Validación cruzada k-fold con pliegues aleatorios\",\"en\":\"k-fold cross-validation with random folds\"},\"correct\":false,\"why\":{\"es\":\"Mezcla días futuros en el entrenamiento y da un error optimista.\",\"en\":\"Mixes future days into training and gives an optimistic error.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Split aleatorio 80/20 con semilla fija\",\"en\":\"Random 80/20 split with a fixed seed\"},\"correct\":false,\"why\":{\"es\":\"La semilla fija hace reproducible la fuga, no la elimina.\",\"en\":\"A fixed seed makes the leak reproducible; it does not remove it.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Validar con el mismo periodo de entrenamiento\",\"en\":\"Validate on the training period itself\"},\"correct\":false,\"why\":{\"es\":\"Mide memoria, no generalización.\",\"en\":\"Measures memory, not generalization.\"}}],\"takeaway\":{\"es\":\"Series temporales: valida siempre hacia delante en el tiempo.\",\"en\":\"Time series: always validate forward in time.\"}},{\"id\":\"s1-c4\",\"type\":\"bug_diagnosis\",\"difficulty\":\"advanced\",\"tags\":[\"drift\",\"monitorizacion\"],\"prompt\":{\"es\":\"Un modelo de fraude lleva un año estable. Tras una nueva regulación que cambia qué operaciones se consideran fraude, las distribuciones de entrada siguen iguales, pero la precision medida con etiquetas reales cae del 0,82 al 0,55. ¿Qué ocurre y qué haces?\",\"en\":\"A fraud model has been stable for a year. After a new regulation changes which operations count as fraud, input distributions stay the same, but precision measured on real labels drops from 0.82 to 0.55. What is happening and what do you do?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Data drift: ajustar los umbrales de alerta de las features\",\"en\":\"Data drift: tune the feature alert thresholds\"},\"correct\":false,\"why\":{\"es\":\"Supone que cambiaron las entradas; las distribuciones siguen iguales.\",\"en\":\"Assumes the inputs changed; the distributions are unchanged.\"}},{\"id\":\"B\",\"text\":{\"es\":\"Training-serving skew: unificar el preprocesado\",\"en\":\"Training-serving skew: unify the preprocessing\"},\"correct\":false,\"why\":{\"es\":\"El skew existe desde el despliegue; aquí el modelo funcionó un año.\",\"en\":\"Skew exists from deployment; this model worked for a year.\"}},{\"id\":\"C\",\"text\":{\"es\":\"Concept drift: reetiquetar con la nueva definición y reentrenar con datos recientes\",\"en\":\"Concept drift: relabel with the new definition and retrain on recent data\"},\"correct\":true,\"why\":{\"es\":\"Gana: cambió la relación entre entradas y etiqueta, y solo datos nuevos la reflejan.\",\"en\":\"Wins: the relationship between inputs and label changed, and only new data reflects it.\"}},{\"id\":\"D\",\"text\":{\"es\":\"Subir el número de réplicas del endpoint\",\"en\":\"Increase the endpoint's replica count\"},\"correct\":false,\"why\":{\"es\":\"Es un problema de exactitud, no de capacidad de serving.\",\"en\":\"It is an accuracy problem, not a serving capacity issue.\"}}],\"takeaway\":{\"es\":\"Entradas iguales + rendimiento que cae con etiquetas reales → concept drift.\",\"en\":\"Same inputs + performance dropping on real labels → concept drift.\"}}],\"refs\":[{\"quiz\":{\"es\":\"ml-fundamentals-es\",\"en\":\"ml-fundamentals\"},\"ids\":[\"5\",\"18\",\"28\"]}],\"questions\":[{\"key\":\"s1-c1\",\"prompt\":\"$6:props:flow:stages:0:steps:5:items:0:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:5:items:0:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:0:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:5:items:0:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:0:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:5:items:0:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:0:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:5:items:0:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:0:options:3:why\"}],\"correct\":\"B\",\"takeaway\":\"$6:props:flow:stages:0:steps:5:items:0:takeaway\",\"difficulty\":\"basic\",\"type\":\"concept\"},{\"key\":\"s1-c2\",\"prompt\":\"$6:props:flow:stages:0:steps:5:items:1:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:5:items:1:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:1:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:5:items:1:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:1:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:5:items:1:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:1:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:5:items:1:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:1:options:3:why\"}],\"correct\":\"D\",\"takeaway\":\"$6:props:flow:stages:0:steps:5:items:1:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"bug_diagnosis\"},{\"key\":\"s1-c3\",\"prompt\":\"$6:props:flow:stages:0:steps:5:items:2:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:5:items:2:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:2:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:5:items:2:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:2:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:5:items:2:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:2:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:5:items:2:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:2:options:3:why\"}],\"correct\":\"A\",\"takeaway\":\"$6:props:flow:stages:0:steps:5:items:2:takeaway\",\"difficulty\":\"intermediate\",\"type\":\"architecture_tradeoff\"},{\"key\":\"s1-c4\",\"prompt\":\"$6:props:flow:stages:0:steps:5:items:3:prompt\",\"code\":\"$undefined\",\"language\":\"$undefined\",\"options\":[{\"id\":\"A\",\"text\":\"$6:props:flow:stages:0:steps:5:items:3:options:0:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:3:options:0:why\"},{\"id\":\"B\",\"text\":\"$6:props:flow:stages:0:steps:5:items:3:options:1:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:3:options:1:why\"},{\"id\":\"C\",\"text\":\"$6:props:flow:stages:0:steps:5:items:3:options:2:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:3:options:2:why\"},{\"id\":\"D\",\"text\":\"$6:props:flow:stages:0:steps:5:items:3:options:3:text\",\"why\":\"$6:props:flow:stages:0:steps:5:items:3:options:3:why\"}],\"correct\":\"C\",\"takeaway\":\"$6:props:flow:stages:0:steps:5:items:3:takeaway\",\"difficulty\":\"advanced\",\"type\":\"bug_diagnosis\"},{\"key\":\"ml-fundamentals-es::5\",\"prompt\":{\"es\":\"Un modelo que predice reingresos hospitalarios alcanza un 99% de exactitud en validación, pero rinde mal en producción. El equipo descubre que una feature, 'seguimiento_programado_al_alta', solo se rellena después de que el paciente ya reingresó. ¿Qué problema es este?\",\"en\":\"A model that predicts hospital readmission reaches 99% accuracy in validation but performs poorly in production. The team discovers that one feature, 'discharge_followup_scheduled', is only filled in after a patient has already been readmitted. What problem is this?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Underfitting (subajuste)\",\"en\":\"Underfitting\"}},{\"id\":\"B\",\"text\":{\"es\":\"Desbalance de clases\",\"en\":\"Class imbalance\"}},{\"id\":\"C\",\"text\":{\"es\":\"Fuga de datos (data leakage)\",\"en\":\"Data leakage\"}},{\"id\":\"D\",\"text\":{\"es\":\"Desvanecimiento del gradiente\",\"en\":\"Vanishing gradients\"}}],\"correct\":\"C\",\"explanation\":{\"es\":\"La fuga de datos ocurre cuando los datos de entrenamiento contienen información que no estará disponible en el momento de predecir, a menudo derivada del propio objetivo. El modelo aprende a apoyarse en ese atajo, obtiene puntuaciones irreales en validación y falla en producción, donde esa feature falta o es distinta.\",\"en\":\"Data leakage happens when training data contains information that would not be available at prediction time, often information derived from the target itself. The model learns to rely on that shortcut, scores unrealistically well in validation, and fails in production where the leaked feature is missing or different.\"}},{\"key\":\"ml-fundamentals-es::18\",\"prompt\":{\"es\":\"Un modelo de fraude se evalúa con datos en los que solo el 0,1% de las transacciones son fraude. Su ROC AUC es 0,97, pero en la práctica la mayoría de sus alertas son falsas alarmas. ¿Qué métrica reflejaría mejor el rendimiento en la clase rara?\",\"en\":\"A fraud model is evaluated on data where only 0.1% of transactions are fraud. Its ROC AUC is 0.97, but in practice most of its alerts are false alarms. Which metric would better reflect performance on the rare class?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Exactitud\",\"en\":\"Accuracy\"}},{\"id\":\"B\",\"text\":{\"es\":\"Especificidad\",\"en\":\"Specificity\"}},{\"id\":\"C\",\"text\":{\"es\":\"El área bajo la curva precision–recall (PR AUC)\",\"en\":\"The area under the precision–recall curve (PR AUC)\"}},{\"id\":\"D\",\"text\":{\"es\":\"El número de verdaderos negativos\",\"en\":\"The number of true negatives\"}}],\"correct\":\"C\",\"explanation\":{\"es\":\"Con un desbalance extremo, la tasa de falsos positivos se mantiene muy baja aunque los falsos positivos superen a los verdaderos positivos, porque el número de negativos es enorme. Por eso el ROC AUC puede verse excelente mientras la precision es mala. La curva precision–recall se centra en la clase positiva, así que el PR AUC (también llamado average precision) deja ver el problema.\",\"en\":\"With extreme imbalance, the false positive rate stays tiny even when false positives outnumber true positives, because the number of negatives is huge. ROC AUC can therefore look excellent while precision is poor. The precision–recall curve focuses on the positive class, so PR AUC (also called average precision) exposes the problem.\"}},{\"key\":\"ml-fundamentals-es::28\",\"prompt\":{\"es\":\"Un dataset de abandono (churn) tiene un 95% de clientes que se quedan y un 5% que se van. El modelo casi nunca predice abandono. ¿Qué cambio hace directamente que el modelo preste más atención a la clase minoritaria durante el entrenamiento?\",\"en\":\"A churn dataset has 95% customers who stay and 5% who leave. The model almost never predicts churn. Which change directly makes the model pay more attention to the minority class during training?\"},\"options\":[{\"id\":\"A\",\"text\":{\"es\":\"Quitar todos los clientes que abandonaron de los datos de entrenamiento\",\"en\":\"Removing all churned customers from the training data\"}},{\"id\":\"B\",\"text\":{\"es\":\"Usar pesos por clase para que los errores en la clase minoritaria cuesten más en la pérdida\",\"en\":\"Using class weights so errors on the minority class cost more in the loss\"}},{\"id\":\"C\",\"text\":{\"es\":\"Evaluar con exactitud en lugar de recall\",\"en\":\"Evaluating with accuracy instead of recall\"}},{\"id\":\"D\",\"text\":{\"es\":\"Aplicar sobremuestreo a los conjuntos de validación y test\",\"en\":\"Applying oversampling to the validation and test sets\"}}],\"correct\":\"B\",\"explanation\":{\"es\":\"Los pesos por clase multiplican la pérdida de cada ejemplo por un peso que depende de su clase, así que los errores en los pocos clientes que abandonan cuestan más y el modelo se ve empujado a detectarlos. Remuestrear el conjunto de entrenamiento (sobremuestrear la clase minoritaria o submuestrear la mayoritaria) tiene un efecto parecido. El remuestreo solo se aplica a los datos de entrenamiento, nunca a validación ni a test, que deben reflejar la distribución real.\",\"en\":\"Class weights multiply the loss of each example by a weight that depends on its class, so mistakes on rare churners cost more and the model is pushed to detect them. Resampling the training set (oversampling the minority class or undersampling the majority) has a similar effect. Resampling must be applied only to the training data, never to validation or test, which must reflect the real distribution.\"}}]},{\"id\":\"s1-feynman\",\"kind\":\"feynman\",\"minutes\":5,\"title\":{\"es\":\"Cierre Feynman: explica la fuga de datos\",\"en\":\"Feynman close: explain data leakage\"},\"prompt\":{\"es\":\"Explícale a un compañero en 4–5 frases por qué un modelo puede tener métricas excelentes en validación y fallar en producción, y cómo lo comprobarías antes de desplegar.\",\"en\":\"Explain to a teammate in 4–5 sentences why a model can have excellent validation metrics and fail in production, and how you would check it before deploying.\"},\"keyPoints\":[{\"es\":\"Features que solo existen después del evento (fuga) o splits que mezclan el futuro o al mismo usuario.\",\"en\":\"Features that only exist after the event (leakage) or splits that mix the future or the same user.\"},{\"es\":\"La validación debe parecerse a producción: por tiempo o por grupo, y el test solo se usa una vez.\",\"en\":\"Validation must look like production: by time or by group, and the test set is used only once.\"},{\"es\":\"La métrica debe medir el error caro (recall, precision, curva PR), no la accuracy con clases raras.\",\"en\":\"The metric must measure the costly error (recall, precision, PR curve), not accuracy with rare classes.\"},{\"es\":\"Tras desplegar, vigilar drift de datos y de concepto con etiquetas reales.\",\"en\":\"After deployment, watch data and concept drift with real labels.\"}]}]},{\"id\":\"s2\",\"title\":{\"es\":\"BigQuery ML: modelos con SQL donde están los datos\",\"en\":\"BigQuery ML: models with SQL where the data lives\"},\"objective\":{\"es\":\"Al terminar sabrás entrenar, evaluar, explicar y vigilar un modelo con SQL usando solo funciones reales de BigQuery ML, y sabrás cuándo hay que salir a Agent Platform.\",\"en\":\"By the end you will train, evaluate, explain and monitor a model with SQL using only real BigQuery ML functions, and know when to move to Agent Platform.\"},\"steps\":[{\"id\":\"s2-capsula\",\"kind\":\"capsule\",\"minutes\":5,\"title\":{\"es\":\"Cápsula: el ciclo de un modelo en SQL\",\"en\":\"Capsule: a model's lifecycle in SQL\"},\"problem\":{\"es\":\"Sacar los datos de BigQuery para entrenar añade copias, pipelines y permisos que mantener, y muchos equipos solo hablan SQL. Hace falta entrenar y usar modelos sin mover los datos.\",\"en\":\"Moving data out of BigQuery to train adds copies, pipelines and permissions to maintain, and many teams only speak SQL. You need to train and use models without moving the data.\"},\"mechanism\":{\"es\":\"CREATE MODEL entrena sobre el resultado de un SELECT; OPTIONS fija el tipo, la etiqueta (INPUT_LABEL_COLS), la división, los pesos de clase y el tuning (NUM_TRIALS). La cláusula TRANSFORM guarda el preprocesado dentro del modelo, así ML.PREDICT y ML.EVALUATE lo reaplican igual. ML.EVALUATE y ML.ROC_CURVE miden; ML.EXPLAIN_PREDICT y ML.GLOBAL_EXPLAIN explican; ML.VALIDATE_DATA_SKEW y ML.VALIDATE_DATA_DRIFT vigilan. ML.PREDICT es una consulta por lotes: para servir online se registra el modelo en Model Registry y se despliega en un endpoint.\",\"en\":\"CREATE MODEL trains on the result of a SELECT; OPTIONS sets the type, the label (INPUT_LABEL_COLS), the split, class weights and tuning (NUM_TRIALS). The TRANSFORM clause stores preprocessing inside the model, so ML.PREDICT and ML.EVALUATE reapply it identically. ML.EVALUATE and ML.ROC_CURVE measure; ML.EXPLAIN_PREDICT and ML.GLOBAL_EXPLAIN explain; ML.VALIDATE_DATA_SKEW and ML.VALIDATE_DATA_DRIFT watch. ML.PREDICT is a batch query: to serve online you register the model in Model Registry and deploy it to an endpoint.\"},\"flow\":[{\"es\":\"SELECT de entrenamiento → CREATE MODEL (OPTIONS + TRANSFORM) → ML.EVALUATE / ML.ROC_CURVE\",\"en\":\"Training SELECT → CREATE MODEL (OPTIONS + TRANSFORM) → ML.EVALUATE / ML.ROC_CURVE\"},{\"es\":\"Modelo → ML.PREDICT programado (lotes) o Model Registry → endpoint (online)\",\"en\":\"Model → scheduled ML.PREDICT (batch) or Model Registry → endpoint (online)\"},{\"es\":\"Producción → ML.VALIDATE_DATA_SKEW / ML.VALIDATE_DATA_DRIFT → reentrenar si hace falta\",\"en\":\"Production → ML.VALIDATE_DATA_SKEW / ML.VALIDATE_DATA_DRIFT → retrain if needed\"}],\"whenNot\":[{\"es\":\"No respondas peticiones online de milisegundos con ML.PREDICT: es una consulta por lotes.\",\"en\":\"Don't answer millisecond online requests with ML.PREDICT: it is a batch query.\"},{\"es\":\"No fuerces BigQuery ML para arquitecturas a medida o entrenamiento distribuido en GPU/TPU: usa entrenamiento personalizado.\",\"en\":\"Don't force BigQuery ML for custom architectures or distributed GPU/TPU training: use custom training.\"},{\"es\":\"No dupliques el preprocesado en la aplicación si puedes ponerlo en TRANSFORM.\",\"en\":\"Don't duplicate preprocessing in the application if you can put it in TRANSFORM.\"}]},{\"id\":\"s2-tarjetas\",\"kind\":\"cards\",\"minutes\":25,\"title\":{\"es\":\"Tarjetas: BigQuery ML\",\"en\":\"Cards: BigQuery ML\"},\"deck\":\"gcp-ml-course\",\"module\":\"m3\",\"cardsEs\":[{\"id\":\"m3-01\",\"part\":\"m\",\"front\":\"Tus datos ya viven en BigQuery y el equipo solo domina SQL. ¿Cuándo es BigQuery ML la herramienta correcta y cuándo se queda corta?\",\"back\":\"BigQuery ML entrena, evalúa y usa modelos con SQL donde ya están los datos, sin exportarlos ni montar infraestructura propia.\\n\\n• Encaja: datos tabulares en BigQuery, equipo SQL, scoring por lotes (ML.PREDICT sobre millones de filas), prototipos rápidos.\\n• Tipos: LINEAR_REG, LOGISTIC_REG, BOOSTED_TREE_*, RANDOM_FOREST_*, DNN_*, AUTOML_*, KMEANS, MATRIX_FACTORIZATION, PCA, AUTOENCODER, ARIMA_PLUS(_XREG); también importa ONNX, TENSORFLOW o XGBOOST y crea modelos remotos sobre Gemini.\\n• Se queda corta: arquitecturas a medida, entrenamiento distribuido en GPU/TPU o inferencia online de milisegundos (para eso se registra en Model Registry y se despliega en un endpoint).\\n\\nPista de examen: «equipo SQL + datos en BigQuery + mínimo movimiento de datos» → BigQuery ML.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery-ml\",\"arquitectura\"]},{\"id\":\"m3-15\",\"part\":\"m\",\"front\":\"Cinco encargos: ¿se dará de baja el cliente?, ¿cuánto gastará?, agrupar clientes sin etiqueta, recomendar productos y prever ventas diarias. ¿Qué MODEL_TYPE de BigQuery ML eliges para cada uno?\",\"back\":\"El tipo de problema elige el MODEL_TYPE: clasificación, regresión, clustering, recomendación o serie temporal.\\n\\n• ¿Se dará de baja? (sí/no) → LOGISTIC_REG o BOOSTED_TREE_CLASSIFIER (también RANDOM_FOREST, DNN o AUTOML_CLASSIFIER).\\n• ¿Cuánto gastará? (número) → LINEAR_REG o BOOSTED_TREE_REGRESSOR.\\n• Grupos sin etiqueta → KMEANS.\\n• Recomendaciones usuario–producto → MATRIX_FACTORIZATION (+ ML.RECOMMEND).\\n• Ventas futuras → ARIMA_PLUS, o ARIMA_PLUS_XREG si hay covariables.\\n• Extra: reducir dimensiones → PCA; explicar por qué cambió una métrica entre dos periodos → CONTRIBUTION_ANALYSIS.\\n\\nPista de examen: LOGISTIC_REG es clasificación aunque se llame «regresión».\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery-ml\",\"tipos-de-modelo\"]},{\"id\":\"m3-03\",\"part\":\"m\",\"front\":\"Tienes un modelo entrenado en BigQuery ML y 20 millones de clientes que puntuar esta noche. ¿Cómo llamas a ML.PREDICT y qué te devuelve?\",\"back\":\"ML.PREDICT es una función de tabla: SELECT * FROM ML.PREDICT(MODEL ds.modelo, (SELECT …)) devuelve tus columnas más predicted_\u003cetiqueta\u003e.\\n\\n• En clasificación añade predicted_\u003cetiqueta\u003e_probs (probabilidad por clase).\\n• Clasificación binaria: STRUCT(0.7 AS threshold) cambia el umbral (0.5 por defecto) sin reentrenar.\\n• Si el modelo usó TRANSFORM, le pasas las columnas crudas: el preprocesamiento se reaplica solo.\\n• Es inferencia por lotes: no hay endpoint que mantener; guarda el resultado con CREATE TABLE … AS SELECT y prográmalo como consulta programada.\\n• Si hubo tuning de hiperparámetros, usa el trial óptimo salvo que indiques TRIAL_ID.\\n\\nPista de examen: «puntuar una tabla grande cada noche» → ML.PREDICT; «responder a una app en milisegundos» → endpoint online.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"basic\",\"tags\":[\"bigquery-ml\",\"inferencia\"]},{\"id\":\"m3-02\",\"part\":\"m\",\"front\":\"Vas a escribir tu primer CREATE MODEL para predecir la columna churn. ¿Qué va en OPTIONS y qué opciones importan en el examen?\",\"back\":\"CREATE MODEL entrena con el resultado de un SELECT y se configura en OPTIONS: MODEL_TYPE obligatorio y la etiqueta en INPUT_LABEL_COLS.\\n\\n• INPUT_LABEL_COLS = ['churn'] (si no lo pones, busca una columna llamada label; la etiqueta no admite NULL).\\n• Variantes: CREATE MODEL (falla si existe), CREATE MODEL IF NOT EXISTS, CREATE OR REPLACE MODEL.\\n• División: DATA_SPLIT_METHOD, DATA_SPLIT_EVAL_FRACTION, DATA_SPLIT_COL.\\n• Regularización: L1_REG, L2_REG. Solo en LINEAR_REG: OPTIMIZE_STRATEGY = AUTO_STRATEGY | BATCH_GRADIENT_DESCENT | NORMAL_EQUATION.\\n• Desbalanceo: AUTO_CLASS_WEIGHTS o CLASS_WEIGHTS. Explicación global: ENABLE_GLOBAL_EXPLAIN = TRUE.\\n• Tuning: NUM_TRIALS + HPARAM_TUNING_OBJECTIVES. Registro: MODEL_REGISTRY = 'VERTEX_AI'.\\n\\nPista de examen: LABEL_COLUMNS, L0_REG o DATA_SPLIT_METHOD = 'K_FOLD' no existen.\",\"topic\":\"BigQuery ML\",\"origin\":\"ai\",\"difficulty\":\"intermediate\",\"tags\":[\"bigquery-ml\",\"entrenamiento\"]},{\"id\":\"m3-16\",\"part\":\"m\",\"front\":\"Entrenas un modelo de demanda con 3 años de datos diarios y quieres evaluar con los meses más recientes, no con días al azar. ¿Qué DATA_SPLIT_METHOD usas y qué hace cada uno?\",\"back\":\"Usa DATA_SPLIT_METHOD = 'SEQ' con DATA_SPLIT_COL = la fecha: ordena por esa columna y reserva las últimas filas para evaluar.\\n\\n• AUTO_SPLIT (por defecto): \u0
